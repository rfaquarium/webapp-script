<script type="text/babel">
// =========================================================================
// 📊 FILE: Tab_Dashboard.txt
// CHỨC NĂNG: Dashboard điều hành, phân tích tài chính & giám sát xưởng realtime
// =========================================================================


// -------------------------------------------------------------------------
// 🏆 BỘ PHẬN GIAO VIỆC & NHIỆM VỤ CHUNG TRÊN DASHBOARD
// -------------------------------------------------------------------------
function DashboardTasksSection({ prodItems = [], currentUser, pushDeltas, triggerToast, isAdmin, userConfigs }) {
  const [showAddReminder, setShowAddReminder] = React.useState(false);
  const [showAddShared, setShowAddShared] = React.useState(false);
  
  // States for creating Reminder
  const [remText, setRemText] = React.useState('');
  const [remTarget, setRemTarget] = React.useState('');
  const [remReward, setRemReward] = React.useState('');
  
  // States for creating Shared Task
  const [shName, setShName] = React.useState('');
  const [shNote, setShNote] = React.useState('');
  const [shReward, setShReward] = React.useState('');
  
  const [processing, setProcessing] = React.useState(false);

  // Extract staff names from userConfigs
  const staffNames = React.useMemo(() => {
      if (!userConfigs || !userConfigs.pins) return [];
      return Object.values(userConfigs.pins)
          .map(u => u.name)
          .filter(name => name && name !== 'admin' && name !== 'Boss' && name !== 'TỐI CAO');
  }, [userConfigs]);

  // Filter Reminders (orderId === 'REMINDER')
  const reminders = React.useMemo(() => {
    return (prodItems || []).filter(i => i.orderId === 'REMINDER');
  }, [prodItems]);

  // Filter Shared Tasks (orderId === 'SHARED_TASK')
  const sharedTasks = React.useMemo(() => {
    return (prodItems || []).filter(i => i.orderId === 'SHARED_TASK');
  }, [prodItems]);

  // Active reminders for current user
  const myActiveReminders = React.useMemo(() => {
    return reminders.filter(r => r.phases.phase1.user === currentUser && r.status !== 'Done');
  }, [reminders, currentUser]);

  // Reminders waiting for Boss approval
  const pendingRemindersApproval = React.useMemo(() => {
    return reminders.filter(r => r.status === 'Kiểm Định');
  }, [reminders]);

  // Reminders monitored by Boss (excluding Done and waiting approval)
  const bossMonitoredReminders = React.useMemo(() => {
    return reminders.filter(r => r.status === 'Pending' || r.status === 'In Progress');
  }, [reminders]);

  // Create Reminder
  const handleCreateReminder = async () => {
    if (!remText.trim() || !remTarget) {
      triggerToast('Vui lòng điền nội dung nhắc việc và chọn nhân sự!', 'fa-exclamation-triangle', 'warning');
      return;
    }
    setProcessing(true);
    try {
      const task = {
        id: 'REM_' + Date.now(),
        orderId: 'REMINDER',
        type: 'Nhắc Việc',
        name: remText.trim(),
        note: remTarget,
        status: 'Pending',
        deadline: new Date().toISOString(),
        fulfilledFromStock: false,
        phases: {
          phase1: {
            name: 'Thực hiện',
            status: 'Pending',
            user: remTarget,
            start: new Date().toISOString().slice(0, 16).replace('T', ' '),
            endTime: '',
            photo: '',
            reward_vnd: Number(remReward) || 0
          },
          phase2: { name: '', status: 'Done', user: '', start: '', endTime: '', photo: '', reward_vnd: 0 }
        }
      };
      await pushDeltas({ prodItems: [task] }, `Đã giao việc cho ${remTarget}: ${remText.trim()}`, 'fa-thumbtack');
      setRemText('');
      setRemTarget('');
      setRemReward('');
      setShowAddReminder(false);
      triggerToast('Đã giao nhắc việc thành công!', 'fa-check', 'success');
    } catch(e) {
      triggerToast('Lỗi khi giao việc!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  // Complete Reminder (Worker reports done)
  const handleCompleteReminder = async (rem) => {
    setProcessing(true);
    try {
      const upd = JSON.parse(JSON.stringify(rem));
      upd.status = 'Kiểm Định';
      upd.phases.phase1.status = 'Kiểm Định';
      upd.phases.phase1.endTime = new Date().toISOString().slice(0, 16).replace('T', ' ');
      
      await pushDeltas({ prodItems: [upd] }, `Đã hoàn thành nhắc việc: ${rem.name}`, 'fa-check-circle');
      triggerToast('Báo cáo hoàn thành thành công! Chờ Boss duyệt để nhận thưởng.', 'fa-clock', 'success');
    } catch(e) {
      triggerToast('Lỗi khi gửi báo cáo!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  // Approve Reminder (Boss awards cash)
  const handleApproveReminder = async (rem) => {
    setProcessing(true);
    try {
      const upd = JSON.parse(JSON.stringify(rem));
      upd.status = 'Done';
      upd.phases.phase1.status = 'Done';
      
      const rewardAmt = rem.phases.phase1.reward_vnd || 0;
      const bonusPayload = {
        BonusPenalty: [{
          id: 'BONUS_' + Date.now(),
          user: rem.phases.phase1.user,
          amount: rewardAmt,
          type: 'Thưởng',
          note: `Hoàn thành nhắc việc: ${rem.name}`,
          date: new Date().toISOString().substring(0, 10),
          orderCode: 'NHẮC VIỆC'
        }],
        prodItems: [upd]
      };
      await pushDeltas(bonusPayload, `Duyệt hoàn thành nhắc việc của ${rem.phases.phase1.user}`, 'fa-crown');
      triggerToast('Đã duyệt nhắc việc và cộng tiền thưởng!', 'fa-medal', 'success');
    } catch(e) {
      triggerToast('Lỗi duyệt nhắc việc!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  // Reject/Delete Reminder
  const handleDeleteReminder = async (rem) => {
    if (!window.confirm('Xác nhận xoá nhắc việc này?')) return;
    setProcessing(true);
    try {
      await pushDeltas({ deletes: { Production: [rem.id] } }, 'Đã xoá nhắc việc', 'fa-trash');
      triggerToast('Đã xoá thành công!', 'fa-trash', 'success');
    } catch(e) {
      triggerToast('Lỗi khi xoá!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  // Create Shared Task
  const handleCreateShared = async () => {
    if (!shName.trim() || !shReward) {
      triggerToast('Vui lòng điền tên nhiệm vụ chung và số tiền thưởng!', 'fa-exclamation-triangle', 'warning');
      return;
    }
    setProcessing(true);
    try {
      const task = {
        id: 'SH_' + Date.now(),
        orderId: 'SHARED_TASK',
        type: 'Nhiệm Vụ Chung',
        name: shName.trim(),
        note: shNote.trim(),
        status: 'Pending',
        deadline: new Date().toISOString(),
        fulfilledFromStock: false,
        phases: {
          phase1: {
            name: 'Thực hiện',
            status: 'Pending',
            user: '',
            start: '',
            endTime: '',
            photo: '',
            reward_vnd: Number(shReward) || 0
          },
          phase2: { name: '', status: 'Done', user: '', start: '', endTime: '', photo: '', reward_vnd: 0 }
        }
      };
      await pushDeltas({ prodItems: [task] }, `Đã thêm nhiệm vụ chung: ${shName.trim()}`, 'fa-plus-circle');
      setShName('');
      setShNote('');
      setShReward('');
      setShowAddShared(false);
      triggerToast('Thêm nhiệm vụ chung thành công!', 'fa-check', 'success');
    } catch(e) {
      triggerToast('Lỗi thêm nhiệm vụ!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  // Claim Shared Task
  const handleClaimShared = async (task) => {
    setProcessing(true);
    try {
      const upd = JSON.parse(JSON.stringify(task));
      const currentDateTime = new Date().toISOString().slice(0, 16).replace('T', ' ');
      upd.status = 'In Progress';
      upd.phases.phase1.status = 'In Progress';
      upd.phases.phase1.user = currentUser;
      upd.phases.phase1.start = currentDateTime;
      await pushDeltas({ prodItems: [upd] }, `Đã nhận nhiệm vụ chung: ${task.name}`, 'fa-hands-helping');
      triggerToast('Nhận việc thành công! Hãy chụp ảnh báo cáo hoàn thành.', 'fa-check', 'success');
    } catch(e) {
      triggerToast('Lỗi nhận việc!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  // Upload Photo for Shared Task
  const handleSharedPhotoUpload = async (task, e) => {
    const file = e.target.files[0];
    if (!file) return;
    setProcessing(true);
    try {
      const b64 = typeof resizeImage === 'function' ? await resizeImage(file) : await new Promise((res) => { const rd = new FileReader(); rd.onload=()=>res(rd.result.split(',')[1]); rd.readAsDataURL(file); });
      const url = await runGAS('uploadImage', b64, `SX_${task.id}_phase1.jpg`);
      if (!url) {
        throw new Error("Không thể tải ảnh lên Drive. Vui lòng kiểm tra lại quyền truy cập hoặc dung lượng Drive.");
      }
      const upd = JSON.parse(JSON.stringify(task));
      upd.phases.phase1.photo = url;
      await pushDeltas({ prodItems: [upd] }, `Đã tải ảnh nghiệm thu nhiệm vụ`, 'fa-camera');
      triggerToast('Tải ảnh nghiệm thu thành công!', 'fa-check', 'success');
    } catch(err) {
      console.error(err);
      triggerToast('Lỗi tải ảnh!', 'fa-times', 'danger');
    } finally {
      e.target.value = '';
      setProcessing(false);
    }
  };

  // Complete Shared Task
  const handleCompleteShared = async (task) => {
    setProcessing(true);
    try {
      const upd = JSON.parse(JSON.stringify(task));
      upd.status = 'Kiểm Định';
      upd.phases.phase1.status = 'Kiểm Định';
      upd.phases.phase1.endTime = new Date().toISOString().slice(0, 16).replace('T', ' ');
      await pushDeltas({ prodItems: [upd] }, `Đã hoàn thành nhiệm vụ chung: ${task.name}`, 'fa-check');
      triggerToast('Báo cáo thành công! Chờ Boss duyệt.', 'fa-clock', 'info');
    } catch(e) {
      triggerToast('Lỗi gửi báo cáo!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  // Approve Shared Task
  const handleApproveShared = async (task) => {
    setProcessing(true);
    try {
      const upd = JSON.parse(JSON.stringify(task));
      upd.status = 'Done';
      upd.phases.phase1.status = 'Done';
      const rewardAmt = task.phases.phase1.reward_vnd || 0;
      const bonusPayload = {
        BonusPenalty: [{
          id: 'BONUS_' + Date.now(),
          user: task.phases.phase1.user,
          amount: rewardAmt,
          type: 'Thưởng',
          note: `Hoàn thành nhiệm vụ chung: ${task.name}`,
          date: new Date().toISOString().substring(0, 10),
          orderCode: 'NHIỆM VỤ CHUNG'
        }],
        prodItems: [upd]
      };
      await pushDeltas(bonusPayload, `Duyệt đạt nhiệm vụ chung: ${task.name}`, 'fa-trophy');
      triggerToast(`Đã duyệt! Thưởng +${rewardAmt.toLocaleString()}đ đã ghi nhận vào lương thợ.`, 'fa-medal', 'success');
    } catch(e) {
      triggerToast('Lỗi duyệt nhiệm vụ!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  // Reject Shared Task
  const handleRejectShared = async (task) => {
    if (!window.confirm('Yêu cầu thợ làm lại nhiệm vụ này?')) return;
    setProcessing(true);
    try {
      const upd = JSON.parse(JSON.stringify(task));
      upd.status = 'In Progress';
      upd.phases.phase1.status = 'In Progress';
      await pushDeltas({ prodItems: [upd] }, `Từ chối duyệt nhiệm vụ chung`, 'fa-undo');
      triggerToast('Đã gửi yêu cầu làm lại!', 'fa-undo', 'warning');
    } catch(e) {
      triggerToast('Lỗi thao tác!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  // Delete Shared Task
  const handleDeleteShared = async (task) => {
    if (!window.confirm('Xác nhận xoá nhiệm vụ chung này?')) return;
    setProcessing(true);
    try {
      await pushDeltas({ deletes: { Production: [task.id] } }, 'Đã xoá nhiệm vụ chung', 'fa-trash');
      triggerToast('Đã xoá thành công!', 'fa-trash', 'success');
    } catch(e) {
      triggerToast('Lỗi xoá nhiệm vụ!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  return (
    <div className="space-y-4 animate-fade-in w-full">
      
      {/* ==================== 1. KHUNG NHẮC VIỆC / GIAO VIỆC TĨNH ==================== */}
      <div className="bg-[#0c0c0e] border border-zinc-800 rounded-2xl p-4 space-y-3.5 shadow-sm">
        <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
          <div className="flex items-center gap-2">
            <i className="fas fa-thumbtack text-rose-500 animate-pulse text-[13px]"></i>
            <span className="font-black text-[11px] text-zinc-200 uppercase tracking-wider">📌 Nhắc Việc & Giao Việc Riêng</span>
          </div>
          {isAdmin && (
            <button 
              onClick={() => setShowAddReminder(!showAddReminder)} 
              className="bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 border border-rose-900/50 font-black text-[9px] px-2.5 py-1.5 rounded-lg active:scale-95 transition-all flex items-center gap-1 uppercase"
            >
              <i className={`fas ${showAddReminder ? 'fa-times' : 'fa-plus'}`}></i> {showAddReminder ? 'Đóng' : 'Giao nhắc việc'}
            </button>
          )}
        </div>

        {/* Form giao việc của Boss */}
        {showAddReminder && isAdmin && (
          <div className="bg-[#141414] border border-[#222] p-3 rounded-xl space-y-2.5 animate-fade-in text-[11px]">
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-[9px] font-black text-gray-500 block mb-0.5 uppercase">Nhân sự thực hiện *</label>
                <select 
                  value={remTarget} 
                  onChange={e => setRemTarget(e.target.value)} 
                  className="w-full bg-[#0a0a0a] border border-[#333] text-white rounded-lg px-2.5 py-1.5 outline-none font-bold"
                >
                  <option value="">-- Chọn thợ --</option>
                  {staffNames.map((name, ni) => <option key={ni} value={name}>{name}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[9px] font-black text-gray-500 block mb-0.5 uppercase">Tiền thưởng (Tùy chọn - VNĐ)</label>
                <input 
                  type="number" 
                  value={remReward} 
                  onChange={e => setRemReward(e.target.value)} 
                  className="w-full bg-[#0a0a0a] border border-[#333] text-[#10b981] font-black rounded-lg px-2.5 py-1.5 outline-none" 
                  placeholder="Ví dụ: 20000"
                />
              </div>
            </div>
            <div>
              <label className="text-[9px] font-black text-gray-500 block mb-0.5 uppercase">Nội dung nhắc việc (VD: Chiều lấy 5 thùng keo 502) *</label>
              <input 
                type="text" 
                value={remText} 
                onChange={e => setRemText(e.target.value)} 
                className="w-full bg-[#0a0a0a] border border-[#333] text-white font-bold rounded-lg px-2.5 py-1.5 outline-none" 
                placeholder="Ví dụ: Bảo chiều lấy 5 thùng keo 502."
              />
            </div>
            <div className="flex justify-end pt-1">
              <button onClick={handleCreateReminder} disabled={processing} className="bg-rose-600 hover:bg-rose-500 text-white font-black px-4 py-2 rounded-lg active:scale-95 transition-colors uppercase text-[9px]">Giao nhắc việc</button>
            </div>
          </div>
        )}

        {/* Danh sách nhắc việc của tôi (Thợ nhìn thấy) */}
        {!isAdmin && (
          <div className="space-y-2">
            {myActiveReminders.length === 0 ? (
              <div className="text-center py-4 text-zinc-600 font-bold text-[11px] italic">
                ✓ Bạn không có nhắc việc nào chưa hoàn thành.
              </div>
            ) : (
              myActiveReminders.map(rem => (
                <div key={rem.id} className="p-3 bg-[#18181b]/50 border border-zinc-800 rounded-xl flex items-center justify-between gap-3 flex-wrap">
                  <div className="flex-1 min-w-0">
                    <span className="font-extrabold text-[12px] text-zinc-200 block">• {rem.name}</span>
                    {rem.phases.phase1.reward_vnd > 0 && (
                      <span className="text-[9px] font-black text-emerald-400 mt-1 block">💰 Tiền thưởng hoàn thành: +{(rem.phases.phase1.reward_vnd).toLocaleString()}đ</span>
                    )}
                  </div>
                  {rem.status === 'Kiểm Định' ? (
                    <span className="text-[9px] font-black bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1.5 rounded-lg uppercase tracking-wider">⏳ Chờ duyệt...</span>
                  ) : (
                    <button 
                      onClick={() => handleCompleteReminder(rem)}
                      disabled={processing}
                      className="py-1.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 text-white font-black text-[10px] rounded-lg active:scale-95 transition-all uppercase tracking-wider shadow-md"
                    >
                      ✓ HOÀN THÀNH NHẬN THƯỞNG
                    </button>
                  )}
                </div>
              ))
            )}
          </div>
        )}

        {/* Danh sách duyệt & giám sát nhắc việc của Boss */}
        {isAdmin && (
          <div className="space-y-3.5 pt-1">
            {/* 1. Phần duyệt nhắc việc */}
            {pendingRemindersApproval.length > 0 && (
              <div className="space-y-2 border-b border-zinc-800/50 pb-3">
                <div className="text-[9px] font-black text-blue-400 uppercase tracking-widest"><i className="fas fa-check-double mr-1"></i> Yêu cầu duyệt nhắc việc:</div>
                {pendingRemindersApproval.map(rem => (
                  <div key={rem.id} className="p-3 bg-blue-950/20 border border-blue-900/30 rounded-xl flex items-center justify-between gap-3 flex-wrap">
                    <div className="flex-1 min-w-0">
                      <span className="text-zinc-200 font-extrabold text-[12px] block">{rem.name}</span>
                      <span className="text-[9px] font-black text-zinc-400 block mt-1">Người làm: {rem.phases.phase1.user} {rem.phases.phase1.reward_vnd > 0 && `| Thưởng: +${rem.phases.phase1.reward_vnd.toLocaleString()}đ`}</span>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => handleDeleteReminder(rem)} disabled={processing} className="text-[9px] font-black px-2.5 py-1.5 bg-rose-950/50 text-rose-400 border border-rose-900/40 rounded-lg uppercase">Huỷ bỏ</button>
                      <button onClick={() => handleApproveReminder(rem)} disabled={processing} className="text-[9px] font-black px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg uppercase shadow-[0_0_10px_rgba(16,185,129,0.2)]">Duyệt (+Thưởng)</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 2. Phần danh sách giám sát nhắc việc đang chạy */}
            <div>
              <div className="text-[9px] font-black text-zinc-500 uppercase tracking-widest"><i className="fas fa-eye mr-1"></i> Nhắc việc đang giao trong hôm nay:</div>
              {bossMonitoredReminders.length === 0 ? (
                <div className="text-center py-2 text-zinc-700 italic text-[11px] font-bold">Chưa giao nhắc việc nào hôm nay.</div>
              ) : (
                <div className="space-y-1.5 mt-1.5 max-h-[150px] overflow-y-auto custom-scrollbar pr-1">
                  {bossMonitoredReminders.map(rem => (
                    <div key={rem.id} className="flex justify-between items-center bg-[#141414] border border-zinc-900 p-2 rounded text-[11px] text-zinc-300 font-bold">
                      <span>• <b className="text-rose-400">{rem.phases.phase1.user}</b>: {rem.name}</span>
                      <div className="flex items-center gap-2">
                        {rem.phases.phase1.reward_vnd > 0 && <span className="text-[9px] text-emerald-400 font-mono">+{rem.phases.phase1.reward_vnd.toLocaleString()}đ</span>}
                        <button onClick={() => handleDeleteReminder(rem)} disabled={processing} className="text-zinc-600 hover:text-rose-500 text-[10px] p-0.5"><i className="fas fa-times-circle"></i></button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}
      </div>

      {/* ==================== 2. KHUNG NHIỆM VỤ CHUNG (Quest Board) ==================== */}
      <div className="bg-[#0c0c0e] border border-zinc-800 rounded-2xl p-4 space-y-3.5 shadow-sm">
        <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
          <div className="flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
            <span className="font-black text-[11px] text-[#d4af37] uppercase tracking-wider">🏆 Bảng Nhiệm Vụ Chung Toàn Xưởng</span>
          </div>
          {isAdmin && (
            <button 
              onClick={() => setShowAddShared(!showAddShared)} 
              className="bg-[#d4af37] hover:bg-yellow-500 text-black font-black text-[9px] px-2.5 py-1.5 rounded-lg active:scale-95 transition-all flex items-center gap-1 uppercase"
            >
              <i className={`fas ${showAddShared ? 'fa-times' : 'fa-plus'}`}></i> {showAddShared ? 'Đóng' : 'Thêm việc'}
            </button>
          )}
        </div>

        {showAddShared && isAdmin && (
          <div className="bg-[#141414] border border-[#2a2a2a] p-3 rounded-xl space-y-2.5 animate-fade-in text-[11px]">
            <div>
              <label className="text-[9px] font-black text-gray-500 block mb-0.5 uppercase">Tên nhiệm vụ *</label>
              <input 
                type="text" 
                value={shName} 
                onChange={e => setShName(e.target.value)} 
                className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg px-2.5 py-1.5 text-white font-bold outline-none" 
                placeholder="VD: Quét dọn khu vực đóng gói"
              />
            </div>
            <div>
              <label className="text-[9px] font-black text-gray-500 block mb-0.5 uppercase">Mô tả chi tiết</label>
              <textarea 
                value={shNote} 
                onChange={e => setShNote(e.target.value)} 
                className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg px-2.5 py-1.5 text-white font-medium outline-none" 
                rows={2}
                placeholder="Ghi các yêu cầu cụ thể..."
              />
            </div>
            <div>
              <label className="text-[9px] font-black text-gray-500 block mb-0.5 uppercase">Mức tiền thưởng (VNĐ) *</label>
              <input 
                type="number" 
                value={shReward} 
                onChange={e => setShReward(e.target.value)} 
                className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg px-2.5 py-1.5 text-[#10b981] font-black outline-none" 
                placeholder="VD: 50000"
              />
            </div>
            <div className="flex gap-2 justify-end pt-1">
              <button onClick={handleCreateShared} disabled={processing} className="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-4 py-2 rounded-lg active:scale-95 transition-all uppercase text-[9px]">Giao Việc</button>
            </div>
          </div>
        )}

        <div className="space-y-2.5">
          {sharedTasks.length === 0 ? (
            <div className="text-center py-6 text-zinc-600 font-bold text-[11px] italic">
              Không có nhiệm vụ chung nào trong hôm nay.
            </div>
          ) : (
            sharedTasks.map(task => {
              const p = task.phases.phase1 || {};
              const isPending = task.status === 'Pending';
              const isInProgress = task.status === 'In Progress';
              const isInspection = task.status === 'Kiểm Định';
              const isDone = task.status === 'Done';
              
              const isOwner = p.user === currentUser;
              const hasPhoto = !!p.photo;

              return (
                <div key={task.id} className={`p-3 rounded-xl border flex flex-col gap-2 relative ${isDone ? 'bg-[#10b981]/5 border-[#10b981]/25' : 'bg-[#141414] border-[#222]'}`}>
                  <div className="flex justify-between items-start gap-2">
                    <div>
                      <h5 className={`font-extrabold text-[12px] ${isDone ? 'text-emerald-400 line-through' : 'text-amber-500'}`}>{task.name}</h5>
                      {task.note && <p className="text-[11px] text-zinc-400 mt-0.5 font-medium leading-relaxed">{task.note}</p>}
                      <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
                        <span className="text-[9px] font-black text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">💰 Thưởng: +{(p.reward_vnd || 0).toLocaleString()}đ</span>
                        {isDone && <span className="text-[9px] font-black text-emerald-400">✓ Hoàn thành bởi {p.user}</span>}
                        {isInProgress && <span className="text-[9px] font-black text-amber-500">⏳ Đang làm: {p.user}</span>}
                        {isInspection && <span className="text-[9px] font-black text-blue-400">🔍 Chờ KCS duyệt: {p.user}</span>}
                      </div>
                    </div>

                    {isAdmin && (
                      <button onClick={() => handleDeleteShared(task)} className="text-zinc-600 hover:text-rose-500 text-[11px] p-1 transition-colors self-start" title="Xoá nhiệm vụ">
                        <i className="fas fa-trash"></i>
                      </button>
                    )}
                  </div>

                  {/* NÚT THAO TÁC THEO TRẠNG THÁI */}
                  <div className="flex gap-2 mt-1">
                    {isPending && (
                      <button 
                        onClick={() => handleClaimShared(task)} 
                        disabled={processing}
                        className="flex-1 py-2 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-black font-black text-[10px] rounded-lg active:scale-95 transition-all uppercase tracking-wider"
                      >
                        👉 NHẬN LÀM NGAY
                      </button>
                    )}

                    {isInProgress && isOwner && !hasPhoto && (
                      <label className="flex-1 m-0 py-2 bg-[#2563eb] text-white hover:bg-blue-600 font-black text-[10px] rounded-lg active:scale-95 transition-all text-center uppercase tracking-wider cursor-pointer flex items-center justify-center gap-1">
                        <i className="fas fa-camera text-xs"></i> 📸 CHỤP ẢNH NGHIỆM THU
                        <input type="file" accept="image/png, image/jpeg, image/jpg" capture="environment" className="hidden" onChange={e => handleSharedPhotoUpload(task, e)} disabled={processing}/>
                      </label>
                    )}

                    {isInProgress && isOwner && hasPhoto && (
                      <div className="flex gap-2 w-full">
                        <button onClick={() => window.dispatchEvent(new CustomEvent('triggerInternalPreview', { detail: p.photo }))} className="px-3 bg-zinc-800 text-zinc-300 border border-zinc-700 hover:bg-zinc-700 rounded-lg text-[10px] font-bold"><i className="fas fa-image"></i> Xem ảnh</button>
                        <button 
                          onClick={() => handleCompleteShared(task)} 
                          disabled={processing}
                          className="flex-1 py-2 bg-[#10b981] hover:bg-[#059669] text-white font-black text-[10px] rounded-lg active:scale-95 transition-all uppercase tracking-wider"
                        >
                          ✓ BÁO CÁO HOÀN THÀNH
                        </button>
                      </div>
                    )}

                    {isInProgress && !isOwner && (
                      <button disabled className="flex-1 py-2 bg-zinc-900 border border-zinc-800 text-zinc-600 font-black text-[10px] rounded-lg cursor-not-allowed uppercase">
                        🔒 ĐÃ ĐƯỢC NHẬN BỞI {String(p.user).toUpperCase()}
                      </button>
                    )}

                    {isInspection && (
                      <div className="flex gap-2 w-full">
                        <button onClick={() => window.dispatchEvent(new CustomEvent('triggerInternalPreview', { detail: p.photo }))} className="px-3 bg-zinc-800 text-zinc-300 border border-zinc-700 hover:bg-zinc-700 rounded-lg text-[10px] font-bold"><i className="fas fa-image"></i> Xem ảnh</button>
                        {isAdmin ? (
                          <>
                            <button onClick={() => handleRejectShared(task)} disabled={processing} className="flex-1 py-2 bg-rose-950 text-rose-400 hover:bg-rose-900 font-black text-[10px] rounded-lg uppercase tracking-wider">Bắt làm lại</button>
                            <button onClick={() => handleApproveShared(task)} disabled={processing} className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-[10px] rounded-lg uppercase tracking-wider shadow-[0_0_10px_rgba(16,185,129,0.3)]">Duyệt KCS (+Thưởng)</button>
                          </>
                        ) : (
                          <button disabled className="flex-1 py-2 bg-zinc-900 text-zinc-500 border border-zinc-800 font-bold text-[10px] rounded-lg cursor-not-allowed uppercase">
                            ⏳ ĐANG CHỜ QUẢN LÝ DUYỆT KCS
                          </button>
                        )}
                      </div>
                    )}
                    
                    {isDone && p.photo && (
                      <button onClick={() => window.dispatchEvent(new CustomEvent('triggerInternalPreview', { detail: p.photo }))} className="py-1.5 bg-[#10b981]/10 text-[#10b981] border border-[#10b981]/30 hover:bg-[#10b981] hover:text-white rounded-lg font-black text-[10px] flex items-center justify-center shadow-sm gap-1.5 uppercase active:scale-95 transition-all px-3">
                        <i className="fas fa-image"></i> Xem ảnh nghiệm thu
                      </button>
                    )}
                  </div>
                </div>
              );
            })
          )}
        </div>
      </div>
      
    </div>
  );
}

function DashboardTab({ orders = [], prodItems = [], attendance = [], packings = [], kpis = [], importExport = [], users = [], userConfigs = [], erpProducts = [], pushDeltas, triggerToast, erpData = {} }) {
  const currentUser = localStorage.getItem('rf_user') || '';
  const currentRole = localStorage.getItem('rf_role') || '';
  const isBoss = localStorage.getItem('rf_boss') === 'true'; 

  // QUYỀN HẠN XEM BÁO CÁO TÀI CHÍNH
  const canSeeFinance = isBoss || ['KẾ TOÁN', 'KIỂM TOÁN', 'TỐI CAO'].includes(currentRole);
  const canSeeMoney = isBoss || ['KẾ TOÁN', 'TỐI CAO'].includes(currentRole);

  // ==================== ĐỒNG HỒ REALTIME CHÍNH XÁC ====================
  const [currentTime, setCurrentTime] = React.useState(new Date());
  React.useEffect(() => {
      const timer = setInterval(() => setCurrentTime(new Date()), 1000);
      return () => clearInterval(timer);
  }, []);
  
  const formatTime = (date) => {
      const days = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
      const day = days[date.getDay()];
      const time = date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const dateStr = date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
      return `${time} - ${day}, ${dateStr}`;
  };

  const todayStr = React.useMemo(() => {
      return new Date(currentTime.getTime() - currentTime.getTimezoneOffset() * 60000).toISOString().split('T')[0];
  }, [currentTime]);

  const channelChartRef = React.useRef(null);
  const trendChartRef = React.useRef(null);
  const channelChartInstance = React.useRef(null);
  const trendChartInstance = React.useRef(null);

  const channelRevenueData = React.useMemo(() => {
      const channelMap = {};
      orders.forEach(o => {
          if (!o.revenue) return;
          const ch = o.channel || 'Khác';
          channelMap[ch] = (channelMap[ch] || 0) + Number(o.revenue);
      });
      return channelMap;
  }, [orders]);

  const last7DaysData = React.useMemo(() => {
      const dates = [];
      const revenueMap = {};
      const countMap = {};
      for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dStr = d.toISOString().split('T')[0];
          dates.push(dStr);
          revenueMap[dStr] = 0;
          countMap[dStr] = 0;
      }
      orders.forEach(o => {
          const dateStr = o.createdAt?.slice(0, 10) || o.date;
          if (dateStr && revenueMap[dateStr] !== undefined) {
              revenueMap[dateStr] += Number(o.revenue || 0);
              countMap[dateStr] += 1;
          }
      });
      return {
          labels: dates.map(d => d.split('-').slice(1).reverse().join('/')),
          revenue: dates.map(d => revenueMap[d]),
          counts: dates.map(d => countMap[d])
      };
  }, [orders]);

  const userTodayRewards = React.useMemo(() => {
      if (currentRole === 'TỐI CAO') return null;
      let prodRew = 0;
      let packRew = 0;
      let prodCount = 0;
      let packCount = 0;
      (prodItems || []).forEach(item => {
          if (item.fulfilledFromStock) return;
          const ph1 = item.phases?.phase1 || {};
          const ph2 = item.phases?.phase2 || {};
          if (ph1.user === currentUser && ph1.status === 'Done' && ph1.endTime && ph1.endTime.startsWith(todayStr)) {
              prodRew += Number(ph1.reward_vnd || 0);
              prodCount++;
          }
          if (ph2.user === currentUser && ph2.status === 'Done' && ph2.endTime && ph2.endTime.startsWith(todayStr)) {
              prodRew += Number(ph2.reward_vnd || 0);
              prodCount++;
          }
      });
      (packings || []).forEach(p => {
          if (p.user === currentUser && p.status === 'Done' && p.endTime && p.endTime.startsWith(todayStr)) {
              packRew += Number(p.reward_vnd || 0);
              packCount++;
          }
      });
      return { prodRew, packRew, prodCount, packCount, total: prodRew + packRew };
  }, [prodItems, packings, currentUser, currentRole, todayStr]);

  React.useEffect(() => {
      if (!canSeeFinance) return;
      
      if (channelChartRef.current) {
          if (channelChartInstance.current) channelChartInstance.current.destroy();
          const labels = Object.keys(channelRevenueData);
          const data = Object.values(channelRevenueData);
          channelChartInstance.current = new Chart(channelChartRef.current, {
              type: 'doughnut',
              data: {
                  labels: labels,
                  datasets: [{
                      data: data,
                      backgroundColor: ['#ee4d2d', '#000000', '#10b981', '#059669', '#ec4899', '#ef4444', '#3b82f6', '#a855f7', '#facc15', '#64748b'],
                      borderWidth: 1,
                      borderColor: '#1f1f23'
                  }]
              },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { position: 'bottom', labels: { color: '#a1a1aa', font: { size: 9, weight: 'bold' } } } }
              }
          });
      }
      
      if (trendChartRef.current) {
          if (trendChartInstance.current) trendChartInstance.current.destroy();
          trendChartInstance.current = new Chart(trendChartRef.current, {
              type: 'line',
              data: {
                  labels: last7DaysData.labels,
                  datasets: [
                      {
                          label: 'Doanh thu (đ)',
                          data: last7DaysData.revenue,
                          borderColor: '#38bdf8',
                          backgroundColor: 'rgba(56, 189, 248, 0.05)',
                          borderWidth: 2,
                          tension: 0.3,
                          fill: true,
                          yAxisID: 'y'
                      },
                      {
                          label: 'Đơn hàng',
                          data: last7DaysData.counts,
                          borderColor: '#d4af37',
                          backgroundColor: 'rgba(212, 175, 55, 0.05)',
                          borderWidth: 2,
                          tension: 0.3,
                          fill: true,
                          yAxisID: 'y1'
                      }
                  ]
              },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { position: 'bottom', labels: { color: '#a1a1aa', font: { size: 9, weight: 'bold' } } } },
                  scales: {
                      x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#a1a1aa', font: { size: 8 } } },
                      y: {
                          position: 'left',
                          grid: { color: 'rgba(255,255,255,0.03)' },
                          ticks: { 
                              color: '#38bdf8', 
                              font: { size: 8 },
                              callback: function(v) { return v >= 1000000 ? (v / 1000000) + 'M' : v >= 1000 ? (v / 1000) + 'k' : v; }
                          }
                      },
                      y1: {
                          position: 'right',
                          grid: { drawOnChartArea: false },
                          ticks: { color: '#d4af37', font: { size: 8 } }
                      }
                  }
              }
          });
      }
      return () => {
          if (channelChartInstance.current) channelChartInstance.current.destroy();
          if (trendChartInstance.current) trendChartInstance.current.destroy();
      };
  }, [channelRevenueData, last7DaysData, canSeeFinance]);

  // ==================== THÔNG BÁO TỪ BAN QUẢN LÝ (BOSS) ====================
  const noticeLogs = (importExport || []).filter(log => log.type === 'THONG_BAO_HE_THONG');
  const latestServerNotice = noticeLogs.length > 0 
      ? noticeLogs[noticeLogs.length - 1].note 
      : 'Chưa có thông báo nội bộ nào.';

  const [optimisticNotice, setOptimisticNotice] = React.useState(null);
  const displayNotice = optimisticNotice !== null ? optimisticNotice : latestServerNotice;

  const [isEditingNotice, setIsEditingNotice] = React.useState(false);
  const [tempNotice, setTempNotice] = React.useState('');

  const handleEditClick = () => {
      setTempNotice(displayNotice);
      setIsEditingNotice(true);
  };

  const handleSaveNotice = () => {
    setOptimisticNotice(tempNotice);
    setIsEditingNotice(false);

    const payload = {
        ImportExport: [{
            id: 'SYS_ANNO_' + Date.now(),
            type: 'THONG_BAO_HE_THONG',
            target: 'ALL',
            totalAmount: 0,
            date: new Date().toISOString().replace('T', ' ').slice(0, 19),
            note: tempNotice,
            itemsData: '[]'
        }]
    };
    
    if (typeof pushDeltas === 'function') {
        pushDeltas(payload, `Boss đã cập nhật thông báo nội bộ`, 'fa-bullhorn')
            .then(() => { if (typeof triggerToast === 'function') triggerToast('Đã phát loa thông báo toàn xưởng!', 'fa-bullhorn', 'success'); })
            .catch(() => { if (typeof triggerToast === 'function') triggerToast('Lỗi mạng, chưa gửi được!', 'fa-wifi', 'danger'); });
    }
  };

  // ==================== LẤY DANH SÁCH NHÂN SỰ ĐI LÀM HÔM NAY ====================
  const attendingStaffList = React.useMemo(() => {
      const staffMap = new Map();
      (attendance || []).forEach(a => {
          if (String(a.date).includes(todayStr)) {
              let timeStr = '';
              if (a.timeIn) timeStr = `Vào: ${a.timeIn}`;
              else if (a.morningIn) timeStr = `Vào sáng: ${a.morningIn}`;
              else if (a.afternoonIn) timeStr = `Vào chiều: ${a.afternoonIn}`;
              
              if (timeStr) {
                  staffMap.set(a.user, {
                      name: a.user,
                      time: timeStr.replace(/'/g, '').trim()
                  });
              }
          }
      });
      return Array.from(staffMap.values());
  }, [attendance, todayStr]);

  const countAttendance = attendingStaffList.length;

  // ==================== DOANH THU & TÀI CHÍNH QUẢN TRỊ ====================
  const financeStats = React.useMemo(() => {
      if (!canSeeFinance) return null;

      // 1. Doanh thu đơn hàng hôm nay
      const todayOrders = (orders || []).filter(o => {
          const oDate = o.createdAt || o.date || '';
          return oDate.includes(todayStr);
      });
      const todayRevenue = todayOrders.reduce((sum, o) => sum + (Number(o.revenue || o.totalAmount) || 0), 0);

      // 2. Số đơn đã hoàn thành hôm nay
      const completedToday = (orders || []).filter(o => {
          const status = String(o.status || '').toUpperCase().trim();
          const isCompletedStatus = ['ĐÃ BÀN GIAO', 'HOÀN THÀNH', 'ĐÃ NHẬP KHO'].includes(status);
          const updateDate = o.updatedAt || o.createdAt || '';
          return isCompletedStatus && updateDate.includes(todayStr);
      }).length;

      // 3. Tổng quỹ khả dụng hiện tại
      const accounts = erpData.Accounts || [];
      const totalCash = accounts.reduce((sum, a) => sum + (Number(a.balance) || 0), 0);

      return { todayRevenue, completedToday, totalCash };
  }, [orders, erpData.Accounts, todayStr, canSeeFinance]);

  // ==================== THÔNG KÊ SẢN XUẤT PHÂN XƯỞNG ====================
  const thongKeXuong = React.useMemo(() => {
    let beKinh = 0;
    let layout = 0;

    (prodItems || []).forEach(i => {
        if (i.fulfilledFromStock) return; 
        if (i.status === 'Đã Huỷ' || i.status === 'Done' || i.status === 'Kiểm Định') return;

        const p1 = i.phases?.phase1?.status || 'Pending';
        const p2 = i.phases?.phase2?.status || 'Pending';
        const isWaiting = (p1 === 'In Progress' || p2 === 'In Progress' || p1 === 'Done' || p2 === 'Done' || p1 === 'Pending');

        if (isWaiting) {
            const searchStr = String(i.type || '') + ' ' + String(i.name || '');
            if (searchStr.toLowerCase().includes('bể') || searchStr.toLowerCase().includes('kính')) {
                beKinh++;
            } else {
                layout++;
            }
        }
    });
    return { beKinh, layout };
  }, [prodItems]);

  const countLayouts = thongKeXuong.layout;
  const countTanks = thongKeXuong.beKinh;

  // ==================== TIẾN ĐỘ THỰC HIỆN CÔNG VIỆC TRONG NGÀY ====================
  const prodProgress = React.useMemo(() => {
      let total = 0;
      let done = 0;
      (prodItems || []).forEach(i => {
          if (i.fulfilledFromStock) return;
          const p1End = i.phases?.phase1?.endTime;
          const p2End = i.phases?.phase2?.endTime;
          const p1Stat = i.phases?.phase1?.status;
          const p2Stat = i.phases?.phase2?.status;
          
          const completedToday = (p1End && p1End.startsWith(todayStr)) || (p2End && p2End.startsWith(todayStr));
          const isActiveToday = (p1Stat === 'In Progress' || p2Stat === 'In Progress');
          
          if (completedToday) {
              done++;
              total++;
          } else if (isActiveToday) {
              total++;
          }
      });
      return { total, done, pct: total > 0 ? Math.round((done / total) * 100) : 0 };
  }, [prodItems, todayStr]);

  const packProgress = React.useMemo(() => {
      let total = 0;
      let done = 0;
      (packings || []).forEach(p => {
          const isEndToday = p.endTime && p.endTime.startsWith(todayStr);
          const isActiveToday = p.status === 'In Progress' || p.status === 'Chờ đóng gói';
          
          if (isEndToday && p.status === 'Done') {
              done++;
              total++;
          } else if (isActiveToday || (p.status === 'Done' && isEndToday)) {
              total++;
          }
      });
      return { total, done, pct: total > 0 ? Math.round((done / total) * 100) : 0 };
  }, [packings, todayStr]);

  // Cảnh báo hết hàng
  const countAccMissing = (erpProducts || []).filter(p => 
      String(p.category || '').toUpperCase().trim() === 'PHỤ KIỆN' && 
      Number(p.minStock) > 0 && 
      Number(p.quantity || 0) <= Number(p.minStock)
  ).length;

  const countMatMissing = (erpProducts || []).filter(p => 
      String(p.category || '').toUpperCase().trim() === 'DANH MỤC SẢN XUẤT' && 
      Number(p.minStock) > 0 && 
      Number(p.quantity || 0) <= Number(p.minStock)
  ).length;

  const criticalStockList = React.useMemo(() => {
      return (erpProducts || [])
          .filter(p => Number(p.minStock) > 0 && Number(p.quantity || 0) <= Number(p.minStock))
          .sort((a, b) => (Number(a.quantity || 0) - Number(a.minStock)) - (Number(b.quantity || 0) - Number(b.minStock)))
          .slice(0, 3);
  }, [erpProducts]);

  // Vận chuyển chờ bàn giao
  const countOrders = (orders || []).filter(o => {
      const st = String(o.status || '').toUpperCase().trim();
      return ['CHỜ SẢN XUẤT', 'QUÉT TỰ ĐỘNG', 'SẴN SÀNG ĐÓNG GÓI', 'CHỜ BÀN GIAO', 'ĐANG SẢN XUẤT'].includes(st);
  }).length;

  // ==================== DỰNG NHẬT KÝ HOẠT ĐỘNG GẦN ĐÂY ====================
  const [categoryFilter, setCategoryFilter] = React.useState('Tất cả');
  const getActivityLogs = () => {
    let logs = [];
    (orders || []).forEach(order => {
      if (order.createdAt) logs.push({ time: order.createdAt, category: 'Đơn hàng', message: `Đơn hàng mới: ${order.orderCode} (Kênh: ${order.channel || 'Khác'})`, user: order.updatedBy || '', amount: 0 });
    });
    (prodItems || []).forEach(item => {
      if (item.phases?.phase1?.endTime) logs.push({ time: item.phases.phase1.endTime, category: 'Sản xuất', message: `${item.name} đã hoàn thành ${item.phases.phase1.name}`, user: item.phases.phase1.user || '', amount: Number(item.phases.phase1.reward_vnd) || 0 });
      if (item.phases?.phase2?.endTime) logs.push({ time: item.phases.phase2.endTime, category: 'Sản xuất', message: `${item.name} đã hoàn thành ${item.phases.phase2.name}`, user: item.phases.phase2.user || '', amount: Number(item.phases.phase2.reward_vnd) || 0 });
    });
    (packings || []).forEach(pk => {
      if (pk.endTime && pk.status === 'Done') logs.push({ time: pk.endTime, category: 'Đóng gói', message: `Đơn ${pk.orderId} hoàn thành đóng gói`, user: pk.user || '', amount: Number(pk.reward_vnd) || 0 });
    });
    (attendance || []).forEach(att => {
      const parseTime = (t) => t ? String(t).replace(/'/g, '').trim() : null;
      if (att.morningIn || att.timeIn) logs.push({ time: `${att.date} ${parseTime(att.morningIn || att.timeIn)}`, category: 'Chấm công', message: `${att.user} đã Check-in`, user: att.user, amount: 0 });
      if (att.afternoonOut || att.timeOut) logs.push({ time: `${att.date} ${parseTime(att.afternoonOut || att.timeOut)}`, category: 'Chấm công', message: `${att.user} đã Check-out`, user: att.user, amount: 0 });
    });
    (kpis || []).forEach(kpi => {
      if (kpi.date) logs.push({ time: kpi.date, category: 'KPI / Thưởng', message: kpi.note || 'Thưởng nóng KPI', user: kpi.user || '', amount: Number(kpi.amount) || 0 });

      }
    });
    logs.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
    return logs;
  };

  const filteredLogs = categoryFilter === 'Tất cả' ? allLogs : allLogs.filter(log => log.category === categoryFilter);

      <div className="bg-[#141414] border border-[#333] rounded-2xl p-4 shadow-sm">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3 border-b border-zinc-800 pb-2">
          <div className="font-black text-[13px] text-gray-300 uppercase tracking-widest flex items-center gap-1.5"><i className="fas fa-list-ol text-[#60a5fa]"></i> Hoạt động xưởng gần đây</div>
          <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="bg-[#0a0a0a] border border-[#333] text-white text-[10px] font-black uppercase tracking-wider px-3 py-2 rounded-xl outline-none cursor-pointer focus:border-[#d4af37]">
            {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
          </select>
        </div>

        <div className="space-y-2 max-h-[380px] overflow-y-auto pr-1 custom-scrollbar">
          {filteredLogs.length === 0 ? (
            <div className="text-center py-8 text-gray-600 italic text-[11px] font-bold bg-[#0a0a0a] rounded-xl border border-zinc-900">Không có hoạt động nào được ghi nhận</div>
          ) : (
            filteredLogs.slice(0, 50).map((log, index) => {
              const style = getCategoryStyle(log.category);
              return (
                <div key={index} className="flex items-start gap-3 bg-[#0a0a0a] border border-zinc-900 rounded-xl px-3 py-2.5 transition-colors hover:border-zinc-800">
                  <div className="mt-0.5 text-[15px] w-6 shrink-0 flex items-center justify-center" style={{ color: style.color }}>{style.icon}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-[12px] text-white font-bold leading-tight flex items-center gap-2">
                      {log.message}
                      {log.amount > 0 && <span className="text-emerald-500 font-black text-[11px] bg-emerald-500/10 px-1.5 py-0.2 rounded border border-emerald-500/20">+{canSeeMoney ? log.amount.toLocaleString('vi-VN') + 'đ' : '******đ'}</span>}
                    </div>
                    <div className="flex items-center gap-2 mt-0.5 text-[10px] font-bold text-gray-500">
                      <span className="font-mono">{log.time?.split(' ')[1]?.slice(0,5) || log.time?.slice(11,16)}</span>
                      {log.user && <span>• <span className="text-gray-400">{log.user}</span></span>}
                      <span>•</span>
                      <div className={`text-[8px] font-black uppercase px-2 py-0.5 rounded-full ${style.bg}`} style={{ color: style.color }}>{log.category}</div>
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </div>
      </div>
    </div>
  );
}
</script>
