<script type="text/babel">
// =========================================================================
// 📊 FILE: Tab_Dashboard.txt
// CHỨC NĂNG: Dashboard điều hành, phân tích tài chính & giám sát xưởng realtime
// =========================================================================


// -------------------------------------------------------------------------
// 🚨 WIDGET CẢNH BÁO VẬN HÀNH (SLA, BOTTLENECK, INVENTORY)
// -------------------------------------------------------------------------
const OperationsHealthWidget = React.memo(function OperationsHealthWidget() {
  const [alerts, setAlerts] = React.useState({ sla: [], bottleneck: [], inventory: [] });
  const [loading, setLoading] = React.useState(true);

  React.useEffect(() => {
    if (typeof window.runGAS === 'function') {
      window.runGAS('getOperationsHealth')
        .then(res => {
          if (res && res.success && res.data) {
            setAlerts(res.data);
          }
        })
        .catch(err => console.error('Lỗi khi fetch Health Alerts:', err))
        .finally(() => setLoading(false));
    }
  }, []);

  if (loading) return <div className="text-[10px] text-zinc-500 font-bold italic animate-pulse">Đang quét hệ thống vận hành...</div>;

  const hasAlerts = alerts.sla.length > 0 || alerts.bottleneck.length > 0 || alerts.inventory.length > 0;
  if (!hasAlerts) return (
    <div className="bg-emerald-950/20 border border-emerald-900/30 rounded-2xl p-3 flex items-center gap-2 mb-4">
      <i className="fas fa-check-circle text-emerald-500"></i>
      <span className="text-[11px] font-black text-emerald-400 uppercase">Hệ thống vận hành trơn tru</span>
    </div>
  );

  return (
    <div className="bg-[#1a0f14] border border-rose-900/50 rounded-2xl p-4 shadow-sm mb-4">
      <div className="flex items-center gap-2 border-b border-rose-900/30 pb-2 mb-3">
        <i className="fas fa-exclamation-triangle text-rose-500 animate-pulse text-[14px]"></i>
        <span className="font-black text-[12px] text-rose-400 uppercase tracking-wider">Cảnh Báo Vận Hành</span>
      </div>
      <div className="space-y-3">
        {alerts.sla.length > 0 && (
          <div>
            <div className="text-[10px] font-black text-orange-400 uppercase mb-1 border-b border-orange-900/50 inline-block pb-0.5">🚨 Trễ SLA Đơn Hàng ({alerts.sla.length})</div>
            <ul className="list-disc pl-4 space-y-1">
              {alerts.sla.map((msg, idx) => <li key={idx} className="text-[11px] font-bold text-orange-200">{msg}</li>)}
            </ul>
          </div>
        )}
        {alerts.bottleneck.length > 0 && (
          <div>
            <div className="text-[10px] font-black text-amber-400 uppercase mb-1 border-b border-amber-900/50 inline-block pb-0.5">⚠️ Nghẽn Xưởng ({alerts.bottleneck.length})</div>
            <ul className="list-disc pl-4 space-y-1">
              {alerts.bottleneck.map((msg, idx) => <li key={idx} className="text-[11px] font-bold text-amber-200">{msg}</li>)}
            </ul>
          </div>
        )}
        {alerts.inventory.length > 0 && (
          <div>
            <div className="text-[10px] font-black text-sky-400 uppercase mb-1 border-b border-sky-900/50 inline-block pb-0.5">📦 Lệch Kho / Hết Hàng ({alerts.inventory.length})</div>
            <ul className="list-disc pl-4 space-y-1">
              {alerts.inventory.map((msg, idx) => <li key={idx} className="text-[11px] font-bold text-sky-200">{msg}</li>)}
            </ul>
          </div>
        )}
      </div>
    </div>
  );
});

// -------------------------------------------------------------------------
// 🏆 BỘ PHẬN GIAO VIỆC & NHIỆM VỤ CHUNG TRÊN DASHBOARD
// -------------------------------------------------------------------------
const DashboardTasksSection = React.memo(function DashboardTasksSection({ prodItems = [], currentUser, pushDeltas, triggerToast, isAdmin, userConfigs, reimbursements = [], products = [] }) {
  const [showAddReminder, setShowAddReminder] = React.useState(false);
  // States for material order request
  const [selectedProdId, setSelectedProdId] = React.useState('');
  const [reqQty, setReqQty] = React.useState('1');
  const [reqNote, setReqNote] = React.useState('');
  const [remText, setRemText] = React.useState('');
  const [processing, setProcessing] = React.useState(false);

  // Filter products for category PHỤ KIỆN & SẢN XUẤT
  const selectableProducts = React.useMemo(() => {
      const filtered = (products || []).filter(p => {
          const cat = String(p.category || '').toUpperCase();
          return cat.includes('PHỤ KIỆN') || cat.includes('SẢN XUẤT') || !p.category;
      });
      return filtered.length > 0 ? filtered : (products || []);
  }, [products]);

  // Extract staff names from userConfigs
  const staffNames = React.useMemo(() => {
      if (!userConfigs || !userConfigs.pins) return [];
      return Object.values(userConfigs.pins)
          .map(u => u.name)
          .filter(name => name && name !== 'admin' && name !== 'Boss' && name !== 'TỐI CAO' && name !== 'Khách');
  }, [userConfigs]);

  // Lọc danh sách báo nhập hàng (orderId === 'MATERIAL_REQ')
  const materialRequests = React.useMemo(() => {
    return (prodItems || []).filter(i => i.orderId === 'MATERIAL_REQ');
  }, [prodItems]);

  const pendingOrderRequests = React.useMemo(() => {
    return materialRequests.filter(r => r.status === 'Chờ đặt hàng');
  }, [materialRequests]);

  const orderedRequests = React.useMemo(() => {
    return materialRequests.filter(r => r.status === 'Đã đặt hàng');
  }, [materialRequests]);

  const handleCreateMaterialRequest = async () => {
    const selectedProd = selectableProducts.find(p => String(p.id) === String(selectedProdId)) || (selectedProdId ? null : selectableProducts[0]);
    const qty = Math.max(1, Number(reqQty) || 1);
    
    if (!selectedProd && !remText.trim()) {
      triggerToast('Vui lòng chọn hàng hoá / vật tư cần nhập!', 'fa-exclamation-triangle', 'warning');
      return;
    }
    
    const prodName = selectedProd ? selectedProd.name : remText.trim();
    const prodSku = selectedProd ? (selectedProd.sku || '') : '';
    const prodUnit = selectedProd ? (selectedProd.unit || 'cái') : 'cái';
    const prodCostPrice = selectedProd ? Number(selectedProd.costPrice || selectedProd.price || 0) : 0;
    const totalCost = prodCostPrice * qty;
    const prodCat = selectedProd ? (selectedProd.category || 'Vật tư') : 'Vật tư';

    setProcessing(true);
    try {
      const nowIso = new Date().toISOString();
      const nowStr = nowIso.slice(0, 19).replace('T', ' ');

      // 1. Tạo phiếu ĐẶT HÀNG chính thức trong bảng ImportExport (Chứng từ Kho)
      const ieTicket = {
        id: 'IE_' + Date.now(),
        type: 'ĐẶT HÀNG',
        target: (selectedProd && selectedProd.supplier) ? selectedProd.supplier : 'Khác',
        totalAmount: totalCost,
        date: nowStr,
        note: `Báo nhập vật tư từ nhân sự: ${currentUser}${reqNote ? ' (' + reqNote.trim() + ')' : ''}`,
        itemsData: JSON.stringify([{
          id: selectedProd ? selectedProd.id : ('ITEM_' + Date.now()),
          sku: prodSku,
          name: prodName,
          quantity: qty,
          unit: prodUnit,
          costPrice: prodCostPrice
        }])
      };

      // 2. Tạo record hiển thị trên Bảng Báo Nhập Hàng ở Dashboard
      const task = {
        id: 'MAT_REQ_' + Date.now(),
        orderId: 'MATERIAL_REQ',
        type: 'Báo Nhập Hàng',
        name: `[${prodCat}] ${prodName} x${qty} ${prodUnit}${reqNote ? ' (' + reqNote.trim() + ')' : ''}`,
        note: reqNote ? reqNote.trim() : '',
        status: 'Chờ đặt hàng',
        deadline: nowIso,
        fulfilledFromStock: false,
        phases: {
          phase1: {
            name: 'Yêu cầu',
            status: 'Chờ đặt hàng',
            user: currentUser,
            start: nowStr.slice(0, 16),
            endTime: '',
            photo: '',
            reward_vnd: 0
          },
          phase2: { name: '', status: '', user: '', start: '', endTime: '', photo: '', reward_vnd: 0 }
        }
      };

      await pushDeltas({ ImportExport: [ieTicket], prodItems: [task] }, `Đã báo nhập vật tư & tạo phiếu ĐẶT HÀNG: ${prodName} x${qty}`, 'fa-boxes');
      triggerToast('Đã gửi yêu cầu & tạo phiếu ĐẶT HÀNG thành công!', 'fa-check', 'success');
      
      setSelectedProdId('');
      setReqQty('1');
      setReqNote('');
      setRemText('');
      setShowAddReminder(false);
    } catch(e) {
      triggerToast('Lỗi khi tạo phiếu đặt hàng!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  const handleMarkAsOrdered = async (req) => {
    if (!window.confirm(`Xác nhận ĐÃ ĐẶT HÀNG cho: ${req.name}?`)) return;
    setProcessing(true);
    try {
      const upd = JSON.parse(JSON.stringify(req));
      upd.status = 'Đã đặt hàng';
      upd.phases.phase1.status = 'Đã đặt hàng';
      await pushDeltas({ prodItems: [upd] }, `Xác nhận đã đặt hàng cho: ${req.name}`, 'fa-truck-loading');
      triggerToast('Đã cập nhật trạng thái Đã đặt hàng!', 'fa-truck-loading', 'success');
    } catch(e) {
      triggerToast('Lỗi cập nhật!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  const handleMarkAsImported = (req) => {
    // Kích hoạt việc mở form nhập kho bên Tab Nhập Xuất
    window.pendingAction = 'createImportTicket';
    window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { 
        detail: { 
            tab: 'import_export', 
            trigger: 'triggerCreateImportTicket', 
            data: { linkedRequestId: req.id, linkedMaterialName: req.name }, 
            mode: 'ERP' 
        } 
    }));
  };

  const handleDeleteRequest = async (req) => {
    if (!window.confirm('Xác nhận huỷ/xoá thông báo báo nhập hàng này?')) return;
    setProcessing(true);
    try {
      await pushDeltas({ deletes: { Production: [req.id] } }, 'Đã xoá thông báo báo nhập hàng', 'fa-trash');
      triggerToast('Đã xoá thành công!', 'fa-trash', 'success');
    } catch(e) {
      triggerToast('Lỗi khi xoá!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  return (
    <div className="space-y-4 animate-fade-in w-full">
      
      {/* ==================== 0. KHUNG YÊU CẦU HOÀN TIỀN VẬT TƯ ==================== */}
      {isAdmin && reimbursements && reimbursements.length > 0 && (
          <div className="bg-rose-950/20 border border-rose-900/40 rounded-2xl p-4 space-y-3.5 shadow-sm">
            <div className="flex items-center gap-2 border-b border-rose-900/30 pb-2">
              <i className="fas fa-exclamation-triangle text-rose-500 animate-pulse text-[13px]"></i>
              <span className="font-black text-[11px] text-rose-400 uppercase tracking-wider">CÓ {reimbursements.length} YÊU CẦU HOÀN TIỀN ĐANG CHỜ</span>
            </div>
            <div className="space-y-2">
              {reimbursements.map(req => (
                <div key={req.id} 
                     onClick={() => window.dispatchEvent(new CustomEvent('openAdminApprovalModal', { detail: req }))}
                     className="p-3 bg-[#141414] border border-rose-900/30 rounded-xl flex items-center justify-between cursor-pointer hover:bg-[#1a1a1c] transition-colors shadow-lg"
                >
                  <div>
                    <span className="text-zinc-200 font-extrabold text-[12px] block">{req.reason}</span>
                    <span className="text-[10px] font-black text-zinc-400 block mt-1"><i className="fas fa-user-circle mr-1"></i> Nhân viên: {req.staffName}</span>
                  </div>
                  <div className="text-right">
                    <span className="text-[13px] font-black text-emerald-400">{Number(req.amount).toLocaleString('vi-VN')} VNĐ</span>
                    <span className="block mt-1 text-[10px] text-yellow-500 font-bold uppercase"><i className="fas fa-search"></i> Bấm để duyệt</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
      )}

      {/* ==================== 1. KHUNG BẢNG THÔNG BÁO NHẬP HÀNG ==================== */}
      <div className="bg-[#0c0c0e] border border-zinc-800 rounded-2xl p-4 space-y-3.5 shadow-sm">
        <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
          <div className="flex items-center gap-2">
            <i className="fas fa-boxes text-emerald-500 animate-pulse text-[13px]"></i>
            <span className="font-black text-[11px] text-zinc-200 uppercase tracking-wider">📦 Bảng Báo Nhập Hàng</span>
          </div>
          <button 
            onClick={() => {
              setRemText('');
              setShowAddReminder(!showAddReminder);
            }} 
            className="bg-emerald-950/40 hover:bg-emerald-900/60 text-emerald-400 border border-emerald-900/50 font-black text-[9px] px-2.5 py-1.5 rounded-lg active:scale-95 transition-all flex items-center gap-1 uppercase"
          >
            <i className={`fas ${showAddReminder ? 'fa-times' : 'fa-plus'}`}></i> {showAddReminder ? 'Đóng' : 'Báo Nhập Vật Tư'}
          </button>
        </div>

        {/* Form Yêu cầu nhập hàng của Nhân sự */}
        {showAddReminder && (
          <div className="bg-[#141414] border border-[#222] p-3.5 rounded-xl space-y-3 animate-fade-in text-[11px]">
            <div>
              <label className="text-[9px] font-black text-emerald-400 block mb-1 uppercase flex items-center gap-1">
                <i className="fas fa-boxes"></i> Chọn Vật Tư / Hàng Hoá (Danh mục Phụ Kiện & Sản Xuất) *
              </label>
              <select 
                value={selectedProdId} 
                onChange={e => setSelectedProdId(e.target.value)} 
                className="w-full bg-[#0a0a0a] border border-[#333] text-white font-bold rounded-lg px-2.5 py-2 outline-none focus:border-emerald-500 transition-colors text-[11px]"
              >
                <option value="">-- Chọn vật tư / phụ kiện --</option>
                {selectableProducts.map(p => (
                  <option key={p.id} value={p.id}>
                    [{p.category || 'Vật tư'}] {p.name} {p.sku ? `(SKU: ${p.sku})` : ''} - Giá: {Number(p.costPrice || p.price || 0).toLocaleString('vi-VN')}đ/{p.unit || 'cái'}
                  </option>
                ))}
              </select>
            </div>

            <div className="grid grid-cols-3 gap-2">
              <div className="col-span-1">
                <label className="text-[9px] font-black text-gray-400 block mb-1 uppercase">Số Lượng *</label>
                <input 
                  type="number" 
                  min="1"
                  value={reqQty} 
                  onChange={e => setReqQty(e.target.value)} 
                  className="w-full bg-[#0a0a0a] border border-[#333] text-emerald-400 font-black rounded-lg px-2.5 py-1.5 outline-none focus:border-emerald-500 transition-colors text-[12px]" 
                  placeholder="Số lượng..."
                />
              </div>
              <div className="col-span-2">
                <label className="text-[9px] font-black text-gray-400 block mb-1 uppercase">Ghi chú (Tùy chọn)</label>
                <input 
                  type="text" 
                  value={reqNote} 
                  onChange={e => setReqNote(e.target.value)} 
                  className="w-full bg-[#0a0a0a] border border-[#333] text-white font-bold rounded-lg px-2.5 py-1.5 outline-none focus:border-emerald-500 transition-colors text-[11px]" 
                  placeholder="Ví dụ: Cần gấp trong ca sáng..."
                />
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-1">
              <button 
                onClick={() => { setSelectedProdId(''); setReqQty('1'); setReqNote(''); setRemText(''); setShowAddReminder(false); }} 
                className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-black px-4 py-2 rounded-lg active:scale-95 transition-colors uppercase text-[9px]"
              >
                Huỷ
              </button>
              <button onClick={handleCreateMaterialRequest} disabled={processing} className="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-5 py-2 rounded-lg active:scale-95 transition-colors uppercase text-[9px] flex items-center gap-1.5 shadow-md shadow-emerald-950">
                <i className="fas fa-file-signature"></i> Tạo Phiếu Đặt Hàng & Gửi Yêu Cầu
              </button>
            </div>
          </div>
        )}

        {/* Danh sách Chờ Đặt Hàng */}
        <div className="space-y-2">
          {pendingOrderRequests.length === 0 && orderedRequests.length === 0 && !showAddReminder ? (
            <div className="text-center py-4 text-zinc-600 font-bold text-[11px] italic">
              ✓ Hiện tại không có yêu cầu nhập vật tư nào.
            </div>
          ) : null}

          {pendingOrderRequests.length > 0 && (
            <div className="space-y-2 mb-4">
              <div className="text-[9px] font-black text-amber-500 uppercase tracking-widest border-b border-zinc-800/50 pb-1 mb-2"><i className="fas fa-hourglass-half mr-1"></i> Chờ đặt hàng ({pendingOrderRequests.length})</div>
              {pendingOrderRequests.map(req => (
                <div key={req.id} className="p-3 bg-amber-950/10 border border-amber-900/30 rounded-xl flex items-center justify-between gap-3 flex-wrap hover:bg-amber-950/20 transition-colors">
                  <div className="flex-1 min-w-0">
                    <span className="font-extrabold text-[12px] text-amber-100 block">• {req.name}</span>
                    <span className="text-[9px] font-black text-zinc-400 block mt-1"><i className="fas fa-user-circle mr-1"></i> Người báo: {req.phases.phase1.user}</span>
                  </div>
                  <div className="flex gap-2">
                    {(isAdmin || isBoss || currentUser === req.phases.phase1.user) && (
                        <button onClick={() => handleDeleteRequest(req)} disabled={processing} className="text-[9px] font-black px-2.5 py-1.5 bg-rose-950/50 text-rose-400 hover:text-rose-300 border border-rose-900/40 rounded-lg uppercase transition-colors"><i className="fas fa-trash"></i></button>
                    )}
                    {(isAdmin || isBoss) && (
                        <button onClick={() => handleMarkAsOrdered(req)} disabled={processing} className="text-[9px] font-black px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg uppercase shadow-[0_0_10px_rgba(245,158,11,0.2)]">Xác nhận Đã Đặt</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Danh sách Đã Đặt Hàng (Chờ hàng về) */}
          {orderedRequests.length > 0 && (
            <div className="space-y-2">
              <div className="text-[9px] font-black text-blue-400 uppercase tracking-widest border-b border-zinc-800/50 pb-1 mb-2"><i className="fas fa-truck-loading mr-1"></i> Đã đặt hàng - Chờ nhận ({orderedRequests.length})</div>
              {orderedRequests.map(req => (
                <div key={req.id} className="p-3 bg-blue-950/10 border border-blue-900/30 rounded-xl flex items-center justify-between gap-3 flex-wrap hover:bg-blue-950/20 transition-colors">
                  <div className="flex-1 min-w-0">
                    <span className="font-extrabold text-[12px] text-blue-100 block">• {req.name}</span>
                    <span className="text-[9px] font-black text-blue-400/80 block mt-1"><i className="fas fa-check-circle mr-1"></i> NCC Đang giao hàng</span>
                  </div>
                  <div className="flex gap-2">
                    {/* Chỉ Quản lý kho / Admin mới thấy nút Đã nhập hàng */}
                    {['QUẢN LÝ KHO', 'KẾ TOÁN', 'TỐI CAO', 'KHO VẬN', 'QUẢN LÝ KHO VẬN'].includes(String(localStorage.getItem('rf_role')).toUpperCase()) && (
                        <button onClick={() => handleMarkAsImported(req)} className="text-[9px] font-black px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg uppercase shadow-[0_0_10px_rgba(59,130,246,0.2)] flex items-center gap-1.5">
                            <i className="fas fa-sign-in-alt"></i> Đã Nhập Kho
                        </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Quest board UI moved to HR */}
      
    </div>
  );
});

// Component con xử lý render đồng hồ để tránh re-render toàn bộ Dashboard mỗi giây gây nóng máy và đơ giật
const RealtimeClock = React.memo(function RealtimeClock() {
    const [currentTime, setCurrentTime] = React.useState(new Date());
    React.useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
    }, []);
    
    const days = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    const day = days[currentTime.getDay()];
    const time = currentTime.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const dateStr = currentTime.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
    
    return <>{time} - {day}, {dateStr}</>;
});

const DashboardTab = React.memo(function DashboardTab({ reimbursements = [], orders = [], prodItems = [], attendance = [], packings = [], kpis = [], importExport = [], users = [], userConfigs = [], erpProducts = [], pushDeltas, triggerToast, erpData = {}, isAdmin = false, isBoss = false }) {
  const currentUser = localStorage.getItem('rf_user') || '';
  const currentRole = localStorage.getItem('rf_role') || '';
  const isSuperAdmin = isAdmin || isBoss || currentRole === 'TỐI CAO';
  // QUYỀN HẠN XEM BÁO CÁO TÀI CHÍNH
  const canSeeFinance = isBoss || ['KẾ TOÁN', 'KIỂM TOÁN', 'TỐI CAO'].includes(currentRole);
  const canSeeMoney = isBoss || ['KẾ TOÁN', 'TỐI CAO'].includes(currentRole);

  // ==================== ĐỒNG HỒ REALTIME CHÍNH XÁC ====================
  // Đã chuyển logic đồng hồ đếm giây ra component con <RealtimeClock /> để tránh re-render toàn bộ Dashboard mỗi giây.
  
  const [todayStr, setTodayStr] = React.useState(() => {
      const now = new Date();
      return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split('T')[0];
  });

  React.useEffect(() => {
      // Cập nhật ngày mới (todayStr) mỗi phút thay vì mỗi giây để tăng hiệu năng
      const timer = setInterval(() => {
          const now = new Date();
          const newDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split('T')[0];
          setTodayStr(prev => prev !== newDate ? newDate : prev);
      }, 60000);

      const match = s.match(/([0-1]?[0-9]|2[0-3]):([0-5][0-9])/);

      />



      {/* DANH SÁCH NHÂN SỰ ĐANG ĐI LÀM (LIVE ROSTER) */}
      <div className="bg-[#141414] border border-[#2a2a2a] p-4 rounded-2xl shadow-sm">
          <div className="flex justify-between items-center mb-3">
              <div className="flex items-center gap-2">
                  <i className="fas fa-users text-[#60a5fa] text-[13px]"></i>
                  <span className="font-black text-[12px] text-gray-300 uppercase tracking-widest">Đội ngũ làm việc hôm nay ({countAttendance})</span>
              </div>
              <span className="text-[9px] font-mono text-zinc-500">Hệ thống chấm công trực tuyến</span>
          </div>
          {attendingStaffList.length === 0 ? (
              <div className="text-center py-6 text-zinc-650 italic text-[11px] font-bold bg-[#0a0a0a] rounded-xl border border-zinc-900">
                  Chưa có nhân sự nào điểm danh hôm nay.
              </div>
          ) : (
              <div className="flex flex-wrap gap-2">
                  {attendingStaffList.map((st, i) => (
                      <div key={i} className="flex items-center gap-2 bg-[#0a0a0a] border border-zinc-800 rounded-xl px-3 py-2 shadow-sm animate-fade-in hover:border-zinc-700 transition-colors">
                          <div className="w-6 h-6 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-black text-[11px] flex items-center justify-center select-none uppercase">{st.name.charAt(0)}</div>
                          <div>
                              <div className="text-[11px] font-black text-gray-200 leading-tight">{st.name}</div>
                              <div className="text-[8px] font-bold text-[#10b981] mt-0.5">{st.time}</div>
                          </div>
                      </div>
                  ))}
              </div>
          )}
      </div>


      {/* NHẬT KÝ HOẠT ĐỘNG GẦN ĐÂY */}
      <div className="bg-[#141414] border border-[#333] rounded-2xl p-4 shadow-sm">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3 border-b border-zinc-800 pb-2">
          <div className="font-black text-[13px] text-gray-300 uppercase tracking-widest flex items-center gap-1.5"><i className="fas fa-list-ol text-[#60a5fa]"></i> Hoạt động xưởng gần đây</div>
          <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="bg-[#0a0a0a] border border-[#333] text-white text-[10px] font-black uppercase tracking-wider px-3 py-2 rounded-xl outline-none cursor-pointer focus:border-[#d4af37]">
            {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
          </select>
        </div>

        <div className="space-y-2 max-h-[380px] overflow-y-auto pr-1 custom-scrollbar">
          {filteredLogs.length === 0 ? (
            <div className="text-center py-8 text-gray-600 italic text-[11px] font-bold bg-[#0a0a0a] rounded-xl border border-zinc-900">Không có hoạt động nào được ghi nhận</div>
          ) : (
            filteredLogs.slice(0, 50).map((log, index) => {
              const style = getCategoryStyle(log.category);
              return (
                <div key={index} className="flex items-start gap-3 bg-[#0a0a0a] border border-zinc-900 rounded-xl px-3 py-2.5 transition-colors hover:border-zinc-800">
                  <div className="mt-0.5 text-[15px] w-6 shrink-0 flex items-center justify-center" style={{ color: style.color }}>{style.icon}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-[12px] text-white font-bold leading-tight flex items-center gap-2">
                      {log.message}
                      {log.amount > 0 && <span className="text-emerald-500 font-black text-[11px] bg-emerald-500/10 px-1.5 py-0.2 rounded border border-emerald-500/20">+{canSeeMoney ? log.amount.toLocaleString('vi-VN') + 'đ' : '******đ'}</span>}
                    </div>
                    <div className="flex items-center gap-2 mt-0.5 text-[10px] font-bold text-gray-500">
                      <span className="font-mono">{log.time?.split(' ')[1]?.slice(0,5) || log.time?.slice(11,16)}</span>
                      {log.user && <span>• <span className="text-gray-400">{log.user}</span></span>}
                      <span>•</span>
                      <div className={`text-[8px] font-black uppercase px-2 py-0.5 rounded-full ${style.bg}`} style={{ color: style.color }}>{log.category}</div>
                    </div>
                  </div>
                </div>
              );
            })
          )}
      </div>
    </div>
    </div>
  );
});
</script>
