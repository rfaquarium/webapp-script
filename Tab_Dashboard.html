<script type="text/babel">
// =========================================================================
// 📊 FILE: Tab_Dashboard.txt
// CHỨC NĂNG: Dashboard điều hành, phân tích tài chính & giám sát xưởng realtime
// =========================================================================


// -------------------------------------------------------------------------
// 🚨 WIDGET CẢNH BÁO VẬN HÀNH (SLA, BOTTLENECK, INVENTORY)
// -------------------------------------------------------------------------
const OperationsHealthWidget = React.memo(function OperationsHealthWidget() {
  const [alerts, setAlerts] = React.useState({ sla: [], bottleneck: [], inventory: [] });
  const [loading, setLoading] = React.useState(true);
  const [isExpanded, setIsExpanded] = React.useState(false);

  React.useEffect(() => {
    if (typeof window.runGAS === 'function') {
      window.runGAS('getOperationsHealth')
        .then(res => {
          if (res && res.success && res.data) {
            setAlerts(res.data);
          }
        })
        .catch(err => console.error('Lỗi khi fetch Health Alerts:', err))
        .finally(() => setLoading(false));
    }
  }, []);

  if (loading) return null;

  const totalAlerts = (alerts.sla?.length || 0) + (alerts.bottleneck?.length || 0) + (alerts.inventory?.length || 0);
  if (totalAlerts === 0) return null;

  return (
    <div className="bg-[#09090b] border border-rose-900/40 rounded-xl p-3.5 shadow-sm mb-4 relative overflow-hidden transition-all">
      <div className="absolute top-0 left-0 w-1 h-full bg-rose-500"></div>
      
      {/* Header bar */}
      <div 
        onClick={() => setIsExpanded(!isExpanded)}
        className="flex items-center justify-between cursor-pointer select-none"
      >
        <div className="flex items-center gap-2.5">
          <div className="w-6 h-6 rounded-md bg-rose-500/10 border border-rose-500/20 flex items-center justify-center">
              <i className="fas fa-exclamation-triangle text-rose-500 animate-pulse text-[11px]"></i>
          </div>
          <div>
            <span className="font-black text-[12px] text-zinc-100 uppercase tracking-wider">Cảnh Báo Vận Hành</span>
            <span className="ml-2 text-[10px] font-black text-rose-400 bg-rose-500/10 border border-rose-500/20 px-2 py-0.5 rounded-full">
              {totalAlerts} vấn đề
            </span>
          </div>
        </div>
        
        <button className="text-[10px] font-bold text-zinc-400 hover:text-zinc-200 flex items-center gap-1 bg-[#121214] px-2.5 py-1 rounded border border-[#27272a]">
          <span>{isExpanded ? 'Thu gọn' : 'Chi tiết'}</span>
          <i className={`fas fa-chevron-${isExpanded ? 'up' : 'down'} text-[9px]`}></i>
        </button>
      </div>

      {/* Expanded content with strict max-height scrolling */}
      {isExpanded && (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3 pt-3 border-t border-[#27272a] animate-fade-in">
          {alerts.sla.length > 0 && (
            <div className="bg-[#121214] border border-[#27272a] rounded-lg p-3">
              <div className="text-[10px] font-black text-orange-400 uppercase mb-2 flex items-center justify-between">
                <span className="flex items-center gap-1.5"><i className="fas fa-clock"></i> Trễ SLA Đơn</span>
                <span className="bg-orange-500/10 text-orange-400 px-1.5 py-0.2 rounded font-mono text-[9px]">{alerts.sla.length}</span>
              </div>
              <ul className="space-y-1.5 max-h-36 overflow-y-auto pr-1 custom-scrollbar">
                {alerts.sla.map((msg, idx) => (
                  <li key={idx} className="text-[10px] font-medium text-zinc-300 flex items-start gap-1.5 leading-snug">
                    <span className="text-orange-500/60 mt-0.5">•</span> 
                    <span>{msg}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
          {alerts.bottleneck.length > 0 && (
            <div className="bg-[#121214] border border-[#27272a] rounded-lg p-3">
              <div className="text-[10px] font-black text-amber-400 uppercase mb-2 flex items-center justify-between">
                <span className="flex items-center gap-1.5"><i className="fas fa-hammer"></i> Nghẽn Xưởng</span>
                <span className="bg-amber-500/10 text-amber-400 px-1.5 py-0.2 rounded font-mono text-[9px]">{alerts.bottleneck.length}</span>
              </div>
              <ul className="space-y-1.5 max-h-36 overflow-y-auto pr-1 custom-scrollbar">
                {alerts.bottleneck.map((msg, idx) => (
                  <li key={idx} className="text-[10px] font-medium text-zinc-300 flex items-start gap-1.5 leading-snug">
                    <span className="text-amber-500/60 mt-0.5">•</span> 
                    <span>{msg}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
          {alerts.inventory.length > 0 && (
            <div className="bg-[#121214] border border-[#27272a] rounded-lg p-3">
              <div className="text-[10px] font-black text-sky-400 uppercase mb-2 flex items-center justify-between">
                <span className="flex items-center gap-1.5"><i className="fas fa-box-open"></i> Kho/Hết Hàng</span>
                <span className="bg-sky-500/10 text-sky-400 px-1.5 py-0.2 rounded font-mono text-[9px]">{alerts.inventory.length}</span>
              </div>
              <ul className="space-y-1.5 max-h-36 overflow-y-auto pr-1 custom-scrollbar">
                {alerts.inventory.map((msg, idx) => (
                  <li key={idx} className="text-[10px] font-medium text-zinc-300 flex items-start gap-1.5 leading-snug">
                    <span className="text-sky-500/60 mt-0.5">•</span> 
                    <span>{msg}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      )}
    </div>
  );
});

// -------------------------------------------------------------------------
// 🏆 BỘ PHẬN GIAO VIỆC & NHIỆM VỤ CHUNG TRÊN DASHBOARD
// -------------------------------------------------------------------------
const DashboardTasksSection = React.memo(function DashboardTasksSection({ prodItems = [], currentUser, pushDeltas, triggerToast, isAdmin, userConfigs, reimbursements = [], products = [] }) {
  const [showAddReminder, setShowAddReminder] = React.useState(false);
  // States for material order request
  const [selectedProdId, setSelectedProdId] = React.useState('');
  const [reqQty, setReqQty] = React.useState('1');
  const [reqNote, setReqNote] = React.useState('');
  const [remText, setRemText] = React.useState('');
  const [processing, setProcessing] = React.useState(false);

  // Filter products for category PHỤ KIỆN & SẢN XUẤT
  const selectableProducts = React.useMemo(() => {
      const filtered = (products || []).filter(p => {
          const cat = String(p.category || '').toUpperCase();
          return cat.includes('PHỤ KIỆN') || cat.includes('SẢN XUẤT') || !p.category;
      });
      return filtered.length > 0 ? filtered : (products || []);
  }, [products]);

  // Extract staff names from userConfigs
  const staffNames = React.useMemo(() => {
      if (!userConfigs || !userConfigs.pins) return [];
      return Object.values(userConfigs.pins)
          .map(u => u.name)
          .filter(name => name && name !== 'admin' && name !== 'Boss' && name !== 'TỐI CAO' && name !== 'Khách');
  }, [userConfigs]);

  // Lọc danh sách báo nhập hàng (orderId === 'MATERIAL_REQ')
  const materialRequests = React.useMemo(() => {
    return (prodItems || []).filter(i => i.orderId === 'MATERIAL_REQ');
  }, [prodItems]);

  const pendingOrderRequests = React.useMemo(() => {
    return materialRequests.filter(r => r.status === 'Chờ đặt hàng');
  }, [materialRequests]);

  const orderedRequests = React.useMemo(() => {
    return materialRequests.filter(r => r.status === 'Đã đặt hàng');
  }, [materialRequests]);

  const handleCreateMaterialRequest = async () => {
    const selectedProd = selectableProducts.find(p => String(p.id) === String(selectedProdId)) || (selectedProdId ? null : selectableProducts[0]);
    const qty = Math.max(1, Number(reqQty) || 1);
    
    if (!selectedProd && !remText.trim()) {
      triggerToast('Vui lòng chọn hàng hoá / vật tư cần nhập!', 'fa-exclamation-triangle', 'warning');
      return;
    }
    
    const prodName = selectedProd ? selectedProd.name : remText.trim();
    const prodSku = selectedProd ? (selectedProd.sku || '') : '';
    const prodUnit = selectedProd ? (selectedProd.unit || 'cái') : 'cái';
    const prodCostPrice = selectedProd ? Number(selectedProd.costPrice || selectedProd.price || 0) : 0;
    const totalCost = prodCostPrice * qty;
    const prodCat = selectedProd ? (selectedProd.category || 'Vật tư') : 'Vật tư';

    setProcessing(true);
    try {
      const nowIso = new Date().toISOString();
      const nowStr = nowIso.slice(0, 19).replace('T', ' ');

      // 1. Tạo phiếu ĐẶT HÀNG chính thức trong bảng ImportExport (Chứng từ Kho)
      const ieTicket = {
        id: 'IE_' + Date.now(),
        type: 'ĐẶT HÀNG',
        target: (selectedProd && selectedProd.supplier) ? selectedProd.supplier : 'Khác',
        totalAmount: totalCost,
        date: nowStr,
        note: `Báo nhập vật tư từ nhân sự: ${currentUser}${reqNote ? ' (' + reqNote.trim() + ')' : ''}`,
        itemsData: JSON.stringify([{
          id: selectedProd ? selectedProd.id : ('ITEM_' + Date.now()),
          sku: prodSku,
          name: prodName,
          quantity: qty,
          unit: prodUnit,
          costPrice: prodCostPrice
        }])
      };

      // 2. Tạo record hiển thị trên Bảng Báo Nhập Hàng ở Dashboard
      const task = {
        id: 'MAT_REQ_' + Date.now(),
        orderId: 'MATERIAL_REQ',
        type: 'Báo Nhập Hàng',
        name: `[${prodCat}] ${prodName} x${qty} ${prodUnit}${reqNote ? ' (' + reqNote.trim() + ')' : ''}`,
        note: reqNote ? reqNote.trim() : '',
        status: 'Chờ đặt hàng',
        deadline: nowIso,
        fulfilledFromStock: false,
        phases: {
          phase1: {
            name: 'Yêu cầu',
            status: 'Chờ đặt hàng',
            user: currentUser,
            start: nowStr.slice(0, 16),
            endTime: '',
            photo: '',
            reward_vnd: 0
          },
          phase2: { name: '', status: '', user: '', start: '', endTime: '', photo: '', reward_vnd: 0 }
        }
      };

      await pushDeltas({ ImportExport: [ieTicket], prodItems: [task] }, `Đã báo nhập vật tư & tạo phiếu ĐẶT HÀNG: ${prodName} x${qty}`, 'fa-boxes');
      triggerToast('Đã gửi yêu cầu & tạo phiếu ĐẶT HÀNG thành công!', 'fa-check', 'success');
      
      setSelectedProdId('');
      setReqQty('1');
      setReqNote('');
      setRemText('');
      setShowAddReminder(false);
    } catch(e) {
      triggerToast('Lỗi khi tạo phiếu đặt hàng!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  const handleMarkAsOrdered = async (req) => {
    if (!window.confirm(`Xác nhận ĐÃ ĐẶT HÀNG cho: ${req.name}?`)) return;
    setProcessing(true);
    try {
      const upd = JSON.parse(JSON.stringify(req));
      upd.status = 'Đã đặt hàng';
      upd.phases.phase1.status = 'Đã đặt hàng';
      await pushDeltas({ prodItems: [upd] }, `Xác nhận đã đặt hàng cho: ${req.name}`, 'fa-truck-loading');
      triggerToast('Đã cập nhật trạng thái Đã đặt hàng!', 'fa-truck-loading', 'success');
    } catch(e) {
      triggerToast('Lỗi cập nhật!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  const handleMarkAsImported = (req) => {
    // Kích hoạt việc mở form nhập kho bên Tab Nhập Xuất
    window.pendingAction = 'createImportTicket';
    window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { 
        detail: { 
            tab: 'import_export', 
            trigger: 'triggerCreateImportTicket', 
            data: { linkedRequestId: req.id, linkedMaterialName: req.name }, 
            mode: 'ERP' 
        } 
    }));
  };

  const handleDeleteRequest = async (req) => {
    if (!window.confirm('Xác nhận huỷ/xoá thông báo báo nhập hàng này?')) return;
    setProcessing(true);
    try {
      await pushDeltas({ deletes: { Production: [req.id] } }, 'Đã xoá thông báo báo nhập hàng', 'fa-trash');
      triggerToast('Đã xoá thành công!', 'fa-trash', 'success');
    } catch(e) {
      triggerToast('Lỗi khi xoá!', 'fa-times', 'danger');
    }
    setProcessing(false);
  };

  return (
    <div className="space-y-4 animate-fade-in w-full">
      
      {/* ==================== 0. KHUNG YÊU CẦU HOÀN TIỀN VẬT TƯ ==================== */}
      {isAdmin && reimbursements && reimbursements.length > 0 && (
          <div className="bg-[#09090b] border border-[#27272a] rounded-xl p-4 shadow-sm relative overflow-hidden">
            <div className="absolute top-0 left-0 w-1 h-full bg-rose-500"></div>
            <div className="flex items-center gap-2 border-b border-[#27272a] pb-3 mb-4">
              <div className="w-6 h-6 rounded-md bg-rose-500/10 border border-rose-500/20 flex items-center justify-center">
                  <i className="fas fa-hand-holding-usd text-rose-500 animate-pulse text-[11px]"></i>
              </div>
              <span className="font-black text-[12px] text-rose-500 uppercase tracking-widest">Yêu Cầu Hoàn Tiền ({reimbursements.length})</span>
            </div>
            <div className="space-y-2">
              {reimbursements.map(req => (
                <div key={req.id} 
                     onClick={() => window.dispatchEvent(new CustomEvent('openAdminApprovalModal', { detail: req }))}
                     className="p-3 bg-[#121214] border border-[#27272a] rounded-lg flex items-center justify-between cursor-pointer hover:border-rose-500/50 transition-colors shadow-sm group"
                >
                  <div>
                    <span className="text-zinc-200 font-extrabold text-[12px] block group-hover:text-rose-400 transition-colors">{req.reason}</span>
                    <span className="text-[10px] font-medium text-zinc-500 block mt-1"><i className="fas fa-user-circle mr-1"></i> {req.staffName}</span>
                  </div>
                  <div className="text-right">
                    <span className="text-[13px] font-black text-emerald-400">{Number(req.amount).toLocaleString('vi-VN')} đ</span>
                    <span className="block mt-1 text-[9px] text-[#d4af37] font-bold uppercase"><i className="fas fa-search"></i> Bấm để duyệt</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
      )}

      {/* ==================== 1. KHUNG BẢNG THÔNG BÁO NHẬP HÀNG ==================== */}
      <div className="bg-[#09090b] border border-[#27272a] rounded-xl p-4 shadow-sm relative overflow-hidden">
        <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
        <div className="flex justify-between items-center border-b border-[#27272a] pb-3 mb-4">
          <div className="flex items-center gap-2">
            <div className="w-6 h-6 rounded-md bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                <i className="fas fa-boxes text-emerald-500 text-[11px]"></i>
            </div>
            <span className="font-black text-[12px] text-zinc-100 uppercase tracking-widest">Bảng Báo Nhập Hàng</span>
          </div>
          <button 
            onClick={() => {
              setRemText('');
              setShowAddReminder(!showAddReminder);
            }} 
            className="bg-[#121214] hover:bg-[#18181b] text-emerald-500 border border-[#27272a] hover:border-emerald-500/50 font-bold text-[10px] px-3 py-1.5 rounded flex items-center gap-1.5 uppercase tracking-wide transition-all"
          >
            <i className={`fas ${showAddReminder ? 'fa-times text-zinc-400' : 'fa-plus'}`}></i> {showAddReminder ? 'Đóng' : 'Báo Nhập'}
          </button>
        </div>

        {/* Form Yêu cầu nhập hàng của Nhân sự */}
        {showAddReminder && (
          <div className="bg-[#121214] border border-[#27272a] p-4 rounded-lg space-y-4 mb-4 text-[12px] animate-fade-in">
            <div>
              <label className="text-[10px] font-bold text-zinc-400 block mb-1.5 uppercase tracking-wide">
                Chọn Vật Tư / Phụ Kiện <span className="text-rose-500">*</span>
              </label>
              <select 
                value={selectedProdId} 
                onChange={e => setSelectedProdId(e.target.value)} 
                className="w-full bg-[#09090b] border border-[#27272a] text-zinc-100 font-medium rounded px-3 py-2 outline-none focus:border-emerald-500/50 transition-colors"
              >
                <option value="">-- Chọn vật tư / phụ kiện --</option>
                {selectableProducts.map(p => (
                  <option key={p.id} value={p.id}>
                    [{p.category || 'Vật tư'}] {p.name} {p.sku ? `(${p.sku})` : ''} - {Number(p.costPrice || p.price || 0).toLocaleString('vi-VN')}đ
                  </option>
                ))}
              </select>
            </div>

            <div className="grid grid-cols-3 gap-3">
              <div className="col-span-1">
                <label className="text-[10px] font-bold text-zinc-400 block mb-1.5 uppercase tracking-wide">Số Lượng <span className="text-rose-500">*</span></label>
                <input 
                  type="number" 
                  min="1"
                  value={reqQty} 
                  onChange={e => setReqQty(e.target.value)} 
                  className="w-full bg-[#09090b] border border-[#27272a] text-emerald-400 font-bold rounded px-3 py-2 outline-none focus:border-emerald-500/50 transition-colors" 
                  placeholder="SL"
                />
              </div>
              <div className="col-span-2">
                <label className="text-[10px] font-bold text-zinc-400 block mb-1.5 uppercase tracking-wide">Ghi chú</label>
                <input 
                  type="text" 
                  value={reqNote} 
                  onChange={e => setReqNote(e.target.value)} 
                  className="w-full bg-[#09090b] border border-[#27272a] text-zinc-100 font-medium rounded px-3 py-2 outline-none focus:border-emerald-500/50 transition-colors" 
                  placeholder="Ghi chú thêm..."
                />
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-2 border-t border-[#27272a]">
              <button 
                onClick={() => { setSelectedProdId(''); setReqQty('1'); setReqNote(''); setRemText(''); setShowAddReminder(false); }} 
                className="bg-transparent hover:bg-[#27272a] text-zinc-400 font-bold px-4 py-2 rounded transition-colors uppercase text-[10px] tracking-wide"
              >
                Huỷ
              </button>
              <button onClick={handleCreateMaterialRequest} disabled={processing} className="bg-emerald-500 hover:bg-emerald-600 text-[#09090b] font-black px-5 py-2 rounded transition-colors uppercase text-[10px] tracking-wide flex items-center gap-1.5">
                <i className="fas fa-check"></i> Tạo Phiếu Đặt
              </button>
            </div>
          </div>
        )}

        {/* Danh sách Chờ Đặt Hàng */}
        <div className="space-y-4">
          {pendingOrderRequests.length === 0 && orderedRequests.length === 0 && !showAddReminder ? (
            <div className="text-center py-6 text-zinc-500 font-medium text-[12px] italic border border-dashed border-[#27272a] rounded-lg">
              Không có yêu cầu nhập vật tư nào.
            </div>
          ) : null}

          {pendingOrderRequests.length > 0 && (
            <div className="space-y-2">
              <div className="text-[10px] font-bold text-amber-500 uppercase tracking-widest mb-2 flex items-center gap-1.5"><i className="fas fa-hourglass-half"></i> Chờ đặt hàng ({pendingOrderRequests.length})</div>
              {pendingOrderRequests.map(req => (
                <div key={req.id} className="p-3 bg-[#121214] border border-[#27272a] rounded-lg flex items-center justify-between gap-3 flex-wrap group hover:border-amber-500/30 transition-colors">
                  <div className="flex-1 min-w-0">
                    <span className="font-bold text-[12px] text-zinc-100 block">{req.name}</span>
                    <span className="text-[10px] font-medium text-zinc-500 block mt-1"><i className="fas fa-user-circle mr-1"></i> {req.phases.phase1.user}</span>
                  </div>
                  <div className="flex gap-2">
                    {(isAdmin || isBoss || currentUser === req.phases.phase1.user) && (
                        <button onClick={() => handleDeleteRequest(req)} disabled={processing} className="text-[10px] font-bold w-7 h-7 flex items-center justify-center bg-[#18181b] hover:bg-rose-500/10 text-zinc-400 hover:text-rose-500 border border-[#27272a] hover:border-rose-500/30 rounded transition-colors"><i className="fas fa-trash"></i></button>
                    )}
                    {(isAdmin || isBoss) && (
                        <button onClick={() => handleMarkAsOrdered(req)} disabled={processing} className="text-[10px] font-bold px-3 h-7 bg-amber-500 hover:bg-amber-600 text-[#09090b] rounded uppercase tracking-wide">Xác nhận Đã Đặt</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Danh sách Đã Đặt Hàng (Chờ hàng về) */}
          {orderedRequests.length > 0 && (
            <div className="space-y-2">
              <div className="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-2 flex items-center gap-1.5 mt-4"><i className="fas fa-truck-loading"></i> Đã đặt - Chờ nhận ({orderedRequests.length})</div>
              {orderedRequests.map(req => (
                <div key={req.id} className="p-3 bg-[#121214] border border-[#27272a] rounded-lg flex items-center justify-between gap-3 flex-wrap group hover:border-blue-500/30 transition-colors">
                  <div className="flex-1 min-w-0">
                    <span className="font-bold text-[12px] text-zinc-100 block">{req.name}</span>
                    <span className="text-[10px] font-medium text-blue-400/80 block mt-1"><i className="fas fa-check-circle mr-1"></i> Đang giao hàng</span>
                  </div>
                  <div className="flex gap-2">
                    {/* Chỉ Quản lý kho / Admin mới thấy nút Đã nhập hàng */}
                    {['QUẢN LÝ KHO', 'KẾ TOÁN', 'TỐI CAO', 'KHO VẬN', 'QUẢN LÝ KHO VẬN'].includes(String(localStorage.getItem('rf_role')).toUpperCase()) && (
                        <button onClick={() => handleMarkAsImported(req)} className="text-[10px] font-bold px-3 h-7 bg-blue-500 hover:bg-blue-600 text-[#09090b] rounded uppercase tracking-wide flex items-center gap-1.5">
                            <i className="fas fa-sign-in-alt"></i> Nhập Kho
                        </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Quest board UI moved to HR */}
      
    </div>
  );
});

// Component con xử lý render đồng hồ để tránh re-render toàn bộ Dashboard mỗi giây gây nóng máy và đơ giật
const RealtimeClock = React.memo(function RealtimeClock() {
    const [currentTime, setCurrentTime] = React.useState(new Date());
    React.useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
    }, []);
    
    const days = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    const day = days[currentTime.getDay()];
    const time = currentTime.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const dateStr = currentTime.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
    
    return <>{time} - {day}, {dateStr}</>;
});

const DashboardTab = React.memo(function DashboardTab({ reimbursements = [], orders = [], prodItems = [], attendance = [], packings = [], kpis = [], importExport = [], users = [], userConfigs = [], erpProducts = [], pushDeltas, triggerToast, erpData = {}, isAdmin = false, isBoss = false }) {

  // ==================== ĐỒNG HỒ REALTIME CHÍNH XÁC ====================

  const [todayStr, setTodayStr] = React.useState(() => {

      const timer = setInterval(() => {
          const now = new Date();
          const newDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split('T')[0];
          setTodayStr(prev => prev !== newDate ? newDate : prev);
      }, 60000);
      return () => clearInterval(timer);
  }, []);

  // ==================== KHUNG CHẤM CÔNG (MIGRATED FROM HR_TAB) ====================
  const extractTimeLocal = (str) => {
      if (!str) return null;
      let s = String(str).trim();
      if (s.includes('T') && s.includes('Z')) {

          if (!isNaN(d.getTime())) return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      const match = s.match(/([0-1]?[0-9]|2[0-3]):([0-5][0-9])/); 
      return match ? `${match[1].padStart(2, '0')}:${match[2]}` : null;
  };

      if (currentTimeMins >= 825 && currentTimeMins <= 1110) return 'Chiều';

      {/* NHẬT KÝ HOẠT ĐỘNG GẦN ĐÂY */}
      <div className="bg-[#09090b] border border-[#27272a] rounded-xl p-4 shadow-sm relative overflow-hidden">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 border-b border-[#27272a] pb-3">
          <div className="font-black text-[12px] text-zinc-100 uppercase tracking-widest flex items-center gap-2.5">
            <div className="w-6 h-6 rounded-md bg-zinc-800 text-zinc-400 border border-[#27272a] flex items-center justify-center">
                <i className="fas fa-list-ol text-[11px]"></i>
            </div>
            Hoạt động gần đây
          </div>
          <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="bg-[#121214] border border-[#27272a] text-zinc-300 text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded outline-none cursor-pointer focus:border-[#d4af37]/50 transition-colors">
            {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
          </select>
        </div>

        <div className="space-y-2.5 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
          {filteredLogs.length === 0 ? (
            <div className="text-center py-8 text-zinc-500 italic text-[11px] font-bold bg-[#121214] rounded-lg border border-[#27272a] border-dashed">Không có hoạt động nào được ghi nhận</div>
          ) : (
            filteredLogs.slice(0, 50).map((log, index) => {
              const style = getCategoryStyle(log.category);
              return (
                <div key={index} className="flex items-start gap-3.5 bg-[#121214] border border-[#27272a] rounded-lg px-3.5 py-3 transition-colors hover:border-[#3f3f46] group">
                  <div className="mt-0.5 text-[14px] w-6 shrink-0 flex items-center justify-center" style={{ color: style.color }}>{style.icon}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-[12px] text-zinc-200 font-bold leading-tight flex items-center gap-2 flex-wrap">
                      {log.message}
                      {log.amount > 0 && <span className="text-emerald-400 font-black text-[10px] bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20 whitespace-nowrap">+{canSeeMoney ? log.amount.toLocaleString('vi-VN') + 'đ' : '******đ'}</span>}
                    </div>
                    <div className="flex items-center gap-2 mt-1.5 text-[10px] font-medium text-zinc-500">
                      <span className="font-mono bg-[#18181b] px-1.5 rounded border border-[#27272a]">{log.time?.split(' ')[1]?.slice(0,5) || log.time?.slice(11,16)}</span>
                      {log.user && <span>• <span className="text-zinc-400 font-bold">{log.user}</span></span>}
                      <span>•</span>
                      <div className={`text-[9px] font-bold px-2 py-0.5 rounded ${style.bg}`} style={{ color: style.color }}>{log.category}</div>
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </div>
      </div>
    </div>
  );
});
</script>
