                        <div className="mt-4 text-center text-gray-400 text-[11px] font-bold bg-[#141414] px-4 py-2 rounded-full border border-[#333]">
                            <i className="fas fa-info-circle text-[#d4af37] mr-1"></i> Nhấn giữ ảnh để tải xuống hoặc copy gửi khách
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// THAY THẾ HOÀN TOÀN FUNCTION CTVProductionTab CŨ
function CTVProductionTab({ orders = [], prodItems = [], erpProducts = [], currentUser }) {
    const [typeTab, setTypeTab] = React.useState('Layout');
    const [statusTab, setStatusTab] = React.useState('CHỜ SẢN XUẤT');
    const [previewImg, setPreviewImg] = React.useState(null); // State phóng to ảnh

    const myOrderIds = React.useMemo(() => {
        return (orders || []).filter(o => String(o.channel).toUpperCase().trim() === 'CỘNG TÁC VIÊN' || String(o.orderCode).toUpperCase().startsWith('CTV')).map(o => o.id);
    }, [orders]);

    const myProdItems = React.useMemo(() => {
        return (prodItems || []).filter(i => myOrderIds.includes(i.orderId) && !i.fulfilledFromStock);
    }, [prodItems, myOrderIds]);

    const typeFiltered = React.useMemo(() => {
        return myProdItems.filter(i => {
            const isG = String(i.type || i.name).toLowerCase().includes('bể');
            return typeTab === 'Bể Kính' ? isG : !isG;
        });
    }, [myProdItems, typeTab]);

    const list = React.useMemo(() => {
        return typeFiltered.filter(i => {
            if (statusTab === 'TẤT CẢ') return true;
            let curSt = 'CHỜ SẢN XUẤT';
            const statusUpper = String(i.status || '').toUpperCase().trim();
            if (statusUpper === 'ĐÃ HUỶ' || statusUpper === 'HUỶ') curSt = 'ĐÃ HUỶ';
            else if (statusUpper === 'DONE' || statusUpper === 'ĐÃ XONG') curSt = 'ĐÃ XONG';
            else if (statusUpper === 'KIỂM ĐỊNH') curSt = 'KIỂM ĐỊNH';
            return curSt === statusTab;
        });
    }, [typeFiltered, statusTab]);

    const renderReadOnlyPhase = (phaseTitle, phaseData) => {
        const st = phaseData?.status || 'Pending';
        let badgeColor = 'text-gray-600 border-[#222]';
        let statusText = 'Chờ xếp thợ';

        if (st === 'In Progress') {
            badgeColor = 'text-amber-500 border-amber-500/20 bg-amber-500/5';
            statusText = `Đang làm (${phaseData.user ? phaseData.user.split(' ').pop() : 'Thợ'})`;
        } else if (st === 'Done') {
            badgeColor = 'text-emerald-400 border-emerald-400/20 bg-emerald-400/5';
            statusText = `Đã xong (${phaseData.user ? phaseData.user.split(' ').pop() : 'Thợ'})`;
        }

        return (
            <div className={`flex justify-between items-center px-3 py-2 bg-black border rounded-xl text-[11px] ${badgeColor}`}>
                <span className="font-black uppercase text-[10px] tracking-wide">{phaseTitle}</span>
                <span className="font-bold">{statusText}</span>
            </div>
        );
    };

    return (
        <div className="space-y-4 animate-fade-in pb-10">
            <div className="flex bg-[#141414] rounded-xl p-1 border border-[#333]">
                {['Layout', 'Bể Kính'].map(t => (
                    <button key={t} onClick={() => setTypeTab(t)} className={`flex-1 py-2 rounded-lg font-black text-[11px] ${typeTab === t ? 'bg-[#d4af37] text-black font-bold' : 'text-gray-400'}`}>{t.toUpperCase()}</button>
                ))}
            </div>

            <div className="flex gap-1.5 overflow-x-auto pb-1 custom-scrollbar">
                {['CHỜ SẢN XUẤT', 'KIỂM ĐỊNH', 'ĐÃ XONG', 'TẤT CẢ'].map(st => (
                    <button key={st} onClick={() => setStatusTab(st)} className={`px-3 py-1.5 rounded-lg font-bold text-[10px] whitespace-nowrap ${statusTab === st ? 'bg-zinc-100 text-black' : 'bg-[#141414] border border-[#222] text-gray-400'}`}>{st}</button>
                ))}
            </div>

            <div className="space-y-3">
                {list.length === 0 ? (
                    <div className="text-center py-10 text-gray-600 bg-[#0a0a0a] rounded-xl border border-dashed border-[#222]">Không có sản phẩm nào đang chế tác</div>
                ) : (
                    list.map(item => {
                        const prodInfo = (erpProducts || []).find(p => p.name === item.name) || {};
                        const matchingOrder = orders.find(o => o.id === item.orderId) || {};
                        const oCode = (matchingOrder.orderCode || '').split(' | ')[0] || 'ĐƠN LẺ';
                        
                        // Lấy ảnh hoàn thành từ khâu cuối (Khâu 2)
                        const completedPhoto = item.phases?.phase2?.photo || item.phases?.phase1?.photo;

                        return (
                            <div key={item.id} className="bg-[#141414] border border-[#222] p-3.5 rounded-2xl space-y-3 relative overflow-hidden">
                                <div className="flex gap-3 items-center">
                                    <div className="w-12 h-12 bg-black rounded-xl border border-[#333] overflow-hidden shrink-0 flex items-center justify-center">
                                        {prodInfo.image ? <img src={prodInfo.image} className="w-full h-full object-cover" /> : <i className="fas fa-hammer text-gray-700"></i>}
                                    </div>
                                    <div className="min-w-0 flex-1">
                                        <div className="text-[10px] font-mono text-gray-500 font-bold uppercase">MÃ ĐƠN: {oCode}</div>
                                        <h4 className="font-black text-[#d4af37] text-[13px] truncate mt-0.5">{item.name}</h4>
                                    </div>
                                    <span className="text-[9px] font-black px-1.5 py-0.5 bg-blue-950 text-blue-400 border border-blue-900 rounded uppercase">{item.status}</span>
                                </div>

                                <div className="space-y-1.5 pt-1.5 border-t border-[#1a1a1a]">
                                    {typeTab === 'Bể Kính' ? (
                                        <React.Fragment>
                                            {renderReadOnlyPhase('Khâu 1: Cắt Dán', item.phases?.phase1)}
                                            {renderReadOnlyPhase('Khâu 2: Gọt Keo', item.phases?.phase2)}
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            {renderReadOnlyPhase('Khâu 1: Dựng Khung', item.phases?.phase1)}
                                            {renderReadOnlyPhase('Khâu 2: Gia Cố', item.phases?.phase2)}
                                        </React.Fragment>
                                    )}
                                </div>

                                {/* KHỐI HIỂN THỊ ẢNH HOÀN THIỆN (GIỐNG APP CHÍNH) */}
                                {(statusTab === 'ĐÃ XONG' || statusTab === 'KIỂM ĐỊNH' || statusTab === 'TẤT CẢ') && completedPhoto && (
                                    <div className="mt-2 pt-2 border-t border-[#222]">
                                        <div className="text-[9px] text-[#10b981] font-black uppercase tracking-widest mb-1.5 flex items-center gap-1"><i className="fas fa-camera"></i> Ảnh hoàn thiện từ xưởng:</div>
                                        <div onClick={() => setPreviewImg(completedPhoto)} className="relative w-full h-24 rounded-xl border border-[#333] overflow-hidden bg-black cursor-pointer group">
                                            <img src={completedPhoto} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="Sản phẩm hoàn thiện" />
                                            <div className="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                                <i className="fas fa-search-plus text-white text-xl"></i>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {item.status === 'Kiểm Định' && (
                                    <div className="p-2 bg-indigo-950/20 border border-indigo-900/30 text-indigo-400 font-bold rounded-xl text-center text-[10px] uppercase tracking-wider mt-2">
                                        <i className="fas fa-shield-alt mr-1 animate-pulse"></i> Sản phẩm đang ở khu KCS chờ duyệt
                                    </div>
                                )}
                            </div>
                        );
                    })
                )}
            </div>

            {/* MODAL PHÓNG TO ẢNH */}
            {previewImg && (
                <div className="fixed inset-0 z-[99999] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-sm" onClick={() => setPreviewImg(null)}>
                    <div className="relative max-w-sm w-full flex flex-col items-center" onClick={e => e.stopPropagation()}>
                        <button className="absolute -top-12 right-0 text-white/70 text-2xl w-10 h-10 flex items-center justify-center bg-white/10 rounded-full" onClick={() => setPreviewImg(null)}>
                            <i className="fas fa-times"></i>
                        </button>
                        <img src={previewImg} alt="Phóng to" className="w-full h-auto max-h-[70vh] object-contain rounded-2xl border border-white/10" />
                        <div className="mt-4 text-center text-gray-400 text-[11px] font-bold bg-[#141414] px-4 py-2 rounded-full border border-[#333]">
                            <i className="fas fa-image text-[#d4af37] mr-1"></i> Ảnh thực tế tại xưởng chế tác
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}
// THAY THẾ HOÀN TOÀN FUNCTION CTVFinance
function CTVFinance({ orders = [], pushDeltas, currentUser }) {
    // 1. Logic lọc tháng
    const availableMonths = React.useMemo(() => {
        const months = new Set();
        orders.forEach(o => {
            const dateStr = o.createdAt || o.date;
            if (dateStr) months.add(dateStr.substring(0, 7)); 
        });
        const sorted = Array.from(months).sort((a, b) => b.localeCompare(a));
        const currentMonthStr = new Date().toISOString().substring(0, 7);
        if (!sorted.includes(currentMonthStr)) sorted.unshift(currentMonthStr);
        return sorted;
    }, [orders]);

    const [selectedMonth, setSelectedMonth] = React.useState(availableMonths[0]);
    
    // State quản lý Modal tạo phiếu
    const [showModal, setShowModal] = React.useState(false);
    const [vData, setVData] = React.useState({ type: 'Cộng Tác Viên Rút Hoa Hồng', amount: '', note: '' });
    const [isSubmitting, setIsSubmitting] = React.useState(false);

    // 2. Tính toán báo cáo theo tháng
    const monthStats = React.useMemo(() => {
        const monthOrders = orders.filter(o => {
            const dateStr = o.createdAt || o.date;
            return dateStr && dateStr.startsWith(selectedMonth) && (o.status === 'Đã Bàn Giao' || o.status === 'Đã nhập kho');
        });
        const totalRevenue = monthOrders.reduce((sum, o) => sum + Number(o.revenue || 0), 0);
        const totalCOD = monthOrders.reduce((sum, o) => sum + Number(o.cod || 0), 0);
        return { totalRevenue, totalCOD };
    }, [orders, selectedMonth]);

    // 3. Tính toán tổng dư nợ
    const currentDebt = React.useMemo(() => {
        const allSuccessOrders = orders.filter(o => o.status === 'Đã Bàn Giao' || o.status === 'Đã nhập kho');
        const totalHoaHong = allSuccessOrders.reduce((sum, o) => sum + (Number(o.revenue || 0) - Number(o.costTotal || 0)), 0);
        return totalHoaHong; 
    }, [orders]);

    const formatMonth = (str) => {
        const [y, m] = str.split('-');
        return `Tháng ${m}/${y}`;
    };

    // Hàm xử lý đẩy phiếu dư nợ lên hệ thống
    const handleSubmitVoucher = async () => {
        if (!vData.amount || Number(vData.amount) <= 0) return alert('Vui lòng nhập số tiền hợp lệ lớn hơn 0!');
        setIsSubmitting(true);
        
        const newVoucher = {
            id: 'VOUCHER_' + Date.now(),
            date: new Date().toISOString().replace('T', ' ').substring(0, 19),
            type: vData.type,
            amount: Number(vData.amount),
            note: vData.note,
            user: currentUser || 'CTV',
            status: 'Chờ Duyệt'
        };

        if (pushDeltas) {
            // Đẩy dữ liệu lên mảng transactions
            await pushDeltas({ transactions: [newVoucher] }, 'Đã gửi yêu cầu tạo phiếu!', 'fa-file-invoice-dollar');
        } else {
            alert("Lỗi: Hệ thống chưa được kết nối API đồng bộ!");
        }
        
        setIsSubmitting(false);
        setShowModal(false);
        setVData({ type: 'Cộng Tác Viên Rút Hoa Hồng', amount: '', note: '' });
    };

    return (
        <div className="space-y-4 animate-fade-in pb-10">
            <div className="flex justify-between items-center mb-4">
                <h2 className="font-black text-[#d4af37] text-lg uppercase tracking-widest"><i className="fas fa-wallet mr-2"></i>Tài Chính</h2>
                <select 
                    value={selectedMonth} 
                    onChange={e => setSelectedMonth(e.target.value)}
                    className="bg-[#141414] border border-[#333] text-[#d4af37] font-black text-[11px] rounded-lg px-2 py-1.5 outline-none focus:border-[#d4af37]"
                >
                    {availableMonths.map(m => <option key={m} value={m}>{formatMonth(m)}</option>)}
                </select>
            </div>

            {/* BLOCK BÁO CÁO THEO THÁNG */}
            <div className="bg-[#141414] border border-[#222] rounded-2xl p-4 shadow-sm space-y-3">
                <div className="text-[10px] text-gray-500 font-black uppercase tracking-widest mb-1 border-b border-[#333] pb-2">Báo cáo {formatMonth(selectedMonth)}</div>
                
                <div className="flex items-center justify-between bg-[#0a0a0a] p-3 rounded-xl border border-[#333]">
                    <div>
                        <i className="fas fa-box text-[#3b82f6] text-lg mb-1"></i>
                        <div className="text-[10px] font-black text-gray-400 uppercase">Tổng tiền hàng</div>
                    </div>
                    <div className="text-[16px] font-black text-[#3b82f6]">{monthStats.totalRevenue.toLocaleString('vi-VN')}đ</div>
                </div>

                <div className="flex items-center justify-between bg-[#0a0a0a] p-3 rounded-xl border border-[#333]">
                    <div>
                        <i className="fas fa-hand-holding-usd text-[#10b981] text-lg mb-1"></i>
                        <div className="text-[10px] font-black text-gray-400 uppercase">Xưởng thu COD</div>
                    </div>
                    <div className="text-[16px] font-black text-[#10b981]">{monthStats.totalCOD.toLocaleString('vi-VN')}đ</div>
                </div>
            </div>

            {/* BLOCK DƯ NỢ LUỸ KẾ & NÚT TẠO PHIẾU */}
            <div className="bg-gradient-to-br from-[#1a1a1a] to-[#0a0a0a] border border-[#d4af37]/30 rounded-2xl p-5 shadow-lg relative overflow-hidden">
                <div className="absolute top-0 right-0 w-24 h-24 bg-[#d4af37] opacity-5 rounded-bl-full pointer-events-none"></div>
                
                <div className="flex justify-between items-start relative z-10">
                    <div>
                        <div className="flex items-center gap-2 text-[#d4af37] mb-1">
                            <i className="fas fa-balance-scale text-sm"></i>
                            <span className="text-[10px] font-black uppercase tracking-widest">Tổng Dư Nợ (Lũy kế)</span>
                        </div>
                        <div className="text-[28px] font-black text-[#d4af37] mt-1">
                            {currentDebt >= 0 ? '+' : ''}{currentDebt.toLocaleString('vi-VN')}đ
                        </div>
                    </div>
                    
                    {/* NÚT KÍCH HOẠT TẠO PHIẾU */}
                    <button 
                        onClick={() => setShowModal(true)} 
                        className="w-10 h-10 bg-gradient-to-br from-[#d4af37] to-[#f3c846] text-black rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(212,175,55,0.4)] hover:scale-105 active:scale-95 transition-all"
                    >
                        <i className="fas fa-plus text-lg"></i>
                    </button>
                </div>
                
                <div className="text-[9px] text-gray-500 font-bold mt-3 border-t border-[#d4af37]/20 pt-2">
                    * Tổng tiền hoa hồng/dư nợ tính trên tất cả đơn hàng đã bàn giao thành công. Bấm dấu <strong>(+)</strong> để gửi yêu cầu nộp tiền/rút hoa hồng.
                </div>
            </div>

            {/* MODAL GIAO DIỆN TẠO PHIẾU */}
            {showModal && (
                <div className="fixed inset-0 z-[99999] bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={() => setShowModal(false)}>
                    <div className="w-full max-w-sm bg-[#0a0a0a] rounded-[2rem] border border-[#333] overflow-hidden shadow-2xl relative" onClick={e => e.stopPropagation()}>
                        {/* Viền sáng mờ trang trí */}
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-1/2 h-[1px] bg-gradient-to-r from-transparent via-[#d4af37]/50 to-transparent"></div>

                        <div className="p-5 border-b border-[#222] flex justify-between items-center bg-[#111]">
                            <h3 className="font-black text-[#d4af37] text-[14px] uppercase tracking-widest flex items-center gap-2">
                                <div className="w-8 h-8 rounded-full bg-[#d4af37]/10 flex items-center justify-center border border-[#d4af37]/30"><i className="fas fa-file-invoice-dollar text-[12px]"></i></div>
                                Tạo Phiếu Dư Nợ
                            </h3>
                            <button onClick={() => setShowModal(false)} className="text-gray-500 hover:text-rose-500 w-8 h-8 flex items-center justify-center rounded-full bg-[#222] active:scale-95"><i className="fas fa-times"></i></button>
                        </div>

                        <div className="p-6 space-y-5">
                            <div>
                                <label className="text-[10px] font-black text-gray-500 block mb-2 uppercase tracking-widest">Loại Phiếu *</label>
                                <select 
                                    value={vData.type} 
                                    onChange={e => setVData({...vData, type: e.target.value})} 
                                    className="w-full p-3.5 bg-[#141414] border border-[#333] rounded-xl text-white font-bold text-[13px] outline-none focus:border-[#d4af37] transition-colors"
                                >
                                    <option value="Cộng Tác Viên Rút Hoa Hồng">CTV: Đề nghị rút hoa hồng</option>
                                    <option value="Cộng Tác Viên Nộp Tiền COD">CTV: Nộp tiền COD thu hộ</option>
                                    <option value="Chiết Khấu - Điều Chỉnh Khác">Khác: Chiết khấu / Điều chỉnh</option>
                                </select>
                            </div>

                            <div>
                                <label className="text-[10px] font-black text-gray-500 block mb-2 uppercase tracking-widest">Số Tiền (VNĐ) *</label>
                                <div className="relative">
                                    <input 
                                        type="number" 
                                        value={vData.amount} 
                                        onChange={e => setVData({...vData, amount: e.target.value})} 
                                        placeholder="Ví dụ: 500000" 
                                        className="w-full p-4 pl-5 bg-[#141414] border border-[#333] rounded-xl text-[#10b981] font-black text-[18px] outline-none focus:border-[#10b981] transition-colors" 
                                    />
                                    <div className="absolute right-4 top-1/2 -translate-y-1/2 text-[12px] font-black text-gray-600">VNĐ</div>
                                </div>
                            </div>

                            <div>
                                <label className="text-[10px] font-black text-gray-500 block mb-2 uppercase tracking-widest">Ghi chú (Tùy chọn)</label>
                                <textarea 
                                    value={vData.note} 
                                    onChange={e => setVData({...vData, note: e.target.value})} 
                                    placeholder="Ghi rõ nội dung chuyển khoản, thông tin ngân hàng hoặc lý do..." 
                                    className="w-full p-4 bg-[#141414] border border-[#333] rounded-xl text-white font-bold text-[13px] outline-none focus:border-[#d4af37] min-h-[90px] custom-scrollbar transition-colors"
                                ></textarea>
                            </div>

                            <button 
                                onClick={handleSubmitVoucher} 
                                disabled={isSubmitting} 
                                className="w-full py-4 bg-gradient-to-r from-[#d4af37] to-[#f3c846] text-black font-black text-[13px] rounded-xl active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2 uppercase tracking-wider shadow-[0_4px_20px_rgba(212,175,55,0.2)] mt-2"
                            >
                                {isSubmitting ? <><i className="fas fa-spinner fa-spin"></i> ĐANG GỬI...</> : <><i className="fas fa-paper-plane"></i> GỬI YÊU CẦU DUYỆT</>}
                            </button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

    function CTVInventory() {
        return <div className="text-center py-20"><i className="fas fa-boxes text-6xl text-[#333] mb-4"></i><h2 className="font-black text-gray-400 text-lg uppercase">Kho Ký Gửi</h2></div>;
    }

    function NavBtn({ icon, label, active, onClick }) { 
        return (
            <button onClick={onClick} className={`flex flex-col items-center justify-center w-16 pt-2 pb-1 transition-all ${active ? 'text-[#d4af37]' : 'text-gray-500'}`}>
                <i className={`fas ${icon} text-lg mb-1`}></i>
                <span className="text-[8px] font-black uppercase">{label}</span>
            </button>
        ); 
    }
    
    function ToastManager({ toasts }) { 
        return (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 w-[90%] pointer-events-none">
                {toasts.map(t => (
                    <div key={t.id} className="bg-[#141414] border border-[#333] text-[#f5f5f5] text-[12px] font-bold p-3 rounded-xl shadow-lg flex items-center">
                        <i className={`fas ${t.icon} text-[#d4af37] mr-2`}></i>{t.msg}
                    </div>
                ))}
            </div>
        ); 
    }

    // COMPONENT MỚI: QUẢN LÝ KHÁCH HÀNG CỦA CTV
function CTVCustomers({ orders = [] }) {
    const [searchCus, setSearchCus] = React.useState('');

    // Nhóm khách hàng theo Số điện thoại
    const customers = React.useMemo(() => {
        const cusMap = {};
        orders.forEach(o => {
            const phone = String(o.phone || '').trim();
            if (!phone) return;
            if (!cusMap[phone]) {
                cusMap[phone] = { name: o.customer, phone: phone, totalOrders: 0, totalSpent: 0, lastOrderDate: o.createdAt || o.date };
            }
            cusMap[phone].totalOrders += 1;
            cusMap[phone].totalSpent += Number(o.revenue || 0);
            
            // Cập nhật ngày mua gần nhất
            if (new Date(o.createdAt || o.date) > new Date(cusMap[phone].lastOrderDate)) {
                cusMap[phone].lastOrderDate = o.createdAt || o.date;
                cusMap[phone].name = o.customer; // Cập nhật tên mới nhất nếu khách đổi tên
            }
        });
        return Object.values(cusMap).sort((a, b) => b.totalSpent - a.totalSpent); // Sắp xếp mua nhiều lên đầu
    }, [orders]);

    const filteredCus = customers.filter(c => 
        c.name.toLowerCase().includes(searchCus.toLowerCase()) || 
        c.phone.includes(searchCus)
    );

    return (
        <div className="space-y-4 animate-fade-in pb-10">
            <h2 className="font-black text-[#d4af37] text-lg uppercase tracking-widest"><i className="fas fa-users mr-2"></i>Khách Hàng</h2>
            
            <div className="relative">
                <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                <input 
                    type="text" placeholder="Tìm tên, SĐT khách..." 
                    value={searchCus} onChange={e => setSearchCus(e.target.value)} 
                    className="w-full pl-9 pr-4 py-2.5 bg-[#141414] border border-[#333] rounded-xl text-[12px] font-bold text-white outline-none focus:border-[#d4af37]" 
                />
            </div>

            <div className="bg-[#141414] border border-[#222] rounded-2xl p-3 shadow-sm">
                <div className="text-[10px] text-gray-500 font-black uppercase mb-3 px-1">Danh sách KH ({filteredCus.length})</div>
                <div className="space-y-2">
                    {filteredCus.map((c, i) => (
                        <div key={i} className="flex justify-between items-center bg-[#0a0a0a] p-3 rounded-xl border border-[#333]">
                            <div>
                                <div className="font-black text-[13px] text-white">{c.name}</div>
                                <div className="text-[11px] font-mono text-[#d4af37] mt-0.5"><i className="fas fa-phone-alt text-[9px] mr-1"></i>{c.phone}</div>
                            </div>
                            <div className="text-right">
                                <div className="text-[12px] font-black text-[#10b981]">{c.totalSpent.toLocaleString('vi-VN')}đ</div>
                                <div className="text-[9px] text-gray-400 font-bold mt-1">{c.totalOrders} đơn hàng</div>
                            </div>
                        </div>
                    ))}
                    {filteredCus.length === 0 && <div className="text-center py-6 text-gray-600 font-bold text-[11px]">Chưa có dữ liệu khách hàng</div>}
                </div>
            </div>
        </div>
    );
}

    // ==========================================
    // KHỞI CHẠY ỨNG DỤNG
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppCTV />);
  </script>
  <script>
    (function() {
      try {
        var rawJsx = document.getElementById('app-jsx').textContent;
        var hash = 0;
        for (var i = 0; i < rawJsx.length; i++) {
          var char = rawJsx.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash;
        }
        var cacheKey = 'rf_ctv_compiled_jsx_' + hash;
        var cachedCode = localStorage.getItem(cacheKey);
        
        for (var key in localStorage) {
          if (key.startsWith('rf_ctv_compiled_jsx_') && key !== cacheKey) {
            localStorage.removeItem(key);
          }
        }

        if (cachedCode) {
          console.log('CTV App loaded from local compilation cache');
          var script = document.createElement('script');
          script.textContent = cachedCode;
          document.body.appendChild(script);
        } else {
          console.log('No cache found. Compiling CTV JSX with Babel...');
          if (window.Babel) {
            var compiled = Babel.transform(rawJsx, { presets: ['react', 'es2015'] }).code;
            try {
              localStorage.setItem(cacheKey, compiled);
            } catch (e) {}
            var script = document.createElement('script');
            script.textContent = compiled;
            document.body.appendChild(script);
          } else {
            console.error('Babel is not loaded!');
          }
        }
      } catch (err) {
        console.error('Error in custom JSX cache loader:', err);
        if (window.Babel) {
          var compiled = Babel.transform(rawJsx, { presets: ['react', 'es2015'] }).code;
          var script = document.createElement('script');
          script.textContent = compiled;
          document.body.appendChild(script);
        }
      }
    })();
  </script>
</body>
