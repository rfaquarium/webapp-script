<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CTV Workspace - RichFish Aquarium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000000; color: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script id="app-jsx" type="text/plain">
    const runGAS = (func, ...args) => new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[func](...args);
    });

    // ==========================================
    // 1. MÀN HÌNH ĐĂNG NHẬP (PREMIUM)
    // ==========================================
    function Login({ onLogin }) {
        const [pin, setPin] = React.useState('');
        const [loading, setLoading] = React.useState(false);

        const handleLogin = async () => {
            if(pin.length < 6) return;
            setLoading(true);
            try {
                const res = await runGAS('validatePin', pin);
                if (res && res.valid && res.role === 'CỘNG TÁC VIÊN') {
                    onLogin(res.user);
                } else {
                    alert("Sai mã PIN hoặc bạn không có quyền Cộng Tác Viên!");
                    setPin('');
                }
            } catch(e) { alert("Lỗi mạng!"); }
            setLoading(false);
        };

        return (
            <div className="min-h-screen flex items-center justify-center bg-[#050505] p-6 relative overflow-hidden">
                {/* Background Effects - Hiệu ứng ánh sáng không gian */}
                <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-[#d4af37] opacity-[0.06] blur-[100px] rounded-full pointer-events-none"></div>
                <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-[#2563eb] opacity-[0.05] blur-[100px] rounded-full pointer-events-none"></div>

                <div className="w-full max-w-sm relative z-10 animate-fade-in">
                    <div className="bg-[#0a0a0a]/80 backdrop-blur-xl p-8 rounded-[2rem] border border-[#ffffff0a] text-center shadow-2xl relative overflow-hidden">
                        
                        {/* Hiệu ứng viền sáng mờ trên cùng của khung */}
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-1/2 h-[1px] bg-gradient-to-r from-transparent via-[#d4af37]/50 to-transparent"></div>

                        {/* Logo Box */}
                        <div className="w-20 h-20 mx-auto bg-gradient-to-br from-[#1a1a1a] to-[#000] border border-[#d4af37]/30 rounded-2xl flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(212,175,55,0.15)] relative overflow-hidden">
                            <div className="absolute inset-0 bg-gradient-to-tr from-[#d4af37]/20 to-transparent opacity-50"></div>
                            <i className="fas fa-crown text-4xl text-[#d4af37] drop-shadow-[0_0_10px_rgba(212,175,55,0.5)] z-10"></i>
                        </div>
                        
                        <h1 className="text-[22px] font-black bg-gradient-to-r from-[#d4af37] to-[#fde08b] bg-clip-text text-transparent mb-1 tracking-tight">RICH FISH</h1>
                        <div className="text-[10px] font-black text-gray-500 tracking-[0.3em] uppercase mb-8">CTV Workspace</div>
                        
                        <div className="relative mb-8">
                            <div className="absolute inset-y-0 left-0 flex items-center pl-5 pointer-events-none">
                                <i className="fas fa-lock text-[#444]"></i>
                            </div>
                            <input 
                                type="password" 
                                value={pin} 
                                onChange={e => setPin(e.target.value)} 
                                placeholder="Nhập PIN 6 số" 
                                className="w-full bg-[#000000] border border-[#222] text-center text-xl tracking-[0.4em] text-[#d4af37] font-black p-4 rounded-2xl outline-none focus:border-[#d4af37]/70 transition-all focus:shadow-[0_0_20px_rgba(212,175,55,0.15)] placeholder:text-gray-700 placeholder:tracking-normal placeholder:text-[14px]" 
                                maxLength="6" 
                            />
                        </div>

                        <button 
                            onClick={handleLogin} 
                            disabled={loading || pin.length < 6} 
                            className="w-full py-4 bg-gradient-to-r from-[#d4af37] to-[#f3c846] text-black font-black text-[13px] rounded-2xl hover:scale-[1.02] active:scale-95 transition-all disabled:opacity-50 disabled:hover:scale-100 flex justify-center items-center gap-2 uppercase tracking-wider shadow-[0_4px_20px_rgba(212,175,55,0.25)]"
                        >
                            {loading ? <><i className="fas fa-circle-notch fa-spin"></i> ĐANG XÁC THỰC...</> : <><i className="fas fa-sign-in-alt"></i> VÀO HỆ THỐNG</>}
                        </button>
                    </div>
                    
                    <div className="text-center mt-6 text-[9px] text-gray-600 font-bold uppercase tracking-widest flex items-center justify-center gap-2">
                        <i className="fas fa-shield-alt text-[#d4af37]"></i> Bảo mật bởi Rich Fish ERP
                    </div>
                </div>
            </div>
        );
    }

    // ==========================================
    // 2. KHUNG GIAO DIỆN CHÍNH CỦA CTV
    // ==========================================
    // TÌM VÀ THAY THẾ TOÀN BỘ FUNCTION AppCTV 
    function AppCTV() {
      const safeGet = (k, d) => { try { return localStorage.getItem(k) || d; } catch(e) { return d; } };
      const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };

      const [activeTab, setActiveTab] = React.useState('create_order');
      const [currentUser, setCurrentUser] = React.useState(() => safeGet('rf_user', ''));
      const [loading, setLoading] = React.useState(true);
      const [toasts, setToasts] = React.useState([]);

      const [erpData, setErpData] = React.useState({ Products: [], Orders: [], prodItems: [], packings: [] });

      const triggerToast = React.useCallback((msg, icon="fa-bell", color="primary") => {
          const id = Date.now(); setToasts(prev => [...prev, { id, msg, icon, color }]);
          setTimeout(() => { setToasts(prev => prev.filter(t => t.id !== id)); }, 4000);
      }, []);

      const loadData = async () => {
        try {
            const d = await runGAS('getAppData');
            if (d && !d.error) {
                const myOrders = (d.orders || []).filter(o => 
                    String(o.channel).toUpperCase().trim() === 'CỘNG TÁC VIÊN' || 
                    String(o.orderCode).toUpperCase().startsWith('CTV')
                );
                const myOrderIds = myOrders.map(o => o.id);
                
                const myProdItems = (d.prodItems || []).filter(p => myOrderIds.includes(p.orderId));
                const myPackings = (d.packings || []).filter(pk => myOrderIds.includes(pk.orderId));
                
                setErpData({ 
                    Products: d.Products || [], 
                    Orders: myOrders,
                    prodItems: myProdItems,
                    packings: myPackings
                });
            }
        } catch(e) { } finally { setLoading(false); }
      };

      React.useEffect(() => { 
          if (currentUser) loadData(); 
          const t = setInterval(() => { if (currentUser) loadData(); }, 30000);
          return () => clearInterval(t); 
      }, [currentUser]);

      const pushDeltas = async (payload, successMsg, successIcon) => {
        try {
            const payloadWithUser = { ...payload, user: currentUser };
            const d = await runGAS('syncDeltas', payloadWithUser);
            if (d && !d.error) {
                const myOrders = (d.orders || []).filter(o => 
                    String(o.channel).toUpperCase().trim() === 'CỘNG TÁC VIÊN' || 
                    String(o.orderCode).toUpperCase().startsWith('CTV')
                );
                const myOrderIds = myOrders.map(o => o.id);
                const myProdItems = (d.prodItems || []).filter(p => myOrderIds.includes(p.orderId));
                const myPackings = (d.packings || []).filter(pk => myOrderIds.includes(pk.orderId));

                setErpData({ 
                    Products: d.Products || [], 
                    Orders: myOrders,
                    prodItems: myProdItems,
                    packings: myPackings
                });
                if (successMsg) triggerToast(successMsg, successIcon || 'fa-check', 'success');
            }
        } catch(e) { triggerToast("Lỗi mạng!", "fa-wifi", 'danger'); }
      };

      if (!currentUser) return <Login onLogin={(u)=>{ safeSet('rf_user',u); setCurrentUser(u); }} />;
      if (loading) return (
    <div className="fixed inset-0 flex flex-col items-center justify-center bg-[#09090b] text-[#d4af37] z-[9999]" style={{fontFamily: "'Plus Jakarta Sans', sans-serif"}}>
      <div className="flex flex-col items-center px-8 text-center drop-shadow-2xl">
        <div className="mb-8 animate-pulse"><i className="fas fa-crown text-5xl drop-shadow-[0_0_15px_rgba(212,175,55,0.6)]"></i></div>
        <p className="text-[16px] italic font-medium leading-relaxed text-zinc-300 mb-4">"Sự sang trọng nằm ở sự tối giản của trí tuệ."</p>
        <div className="w-12 h-[1px] bg-[#d4af37] mx-auto mb-4"></div>
        <p className="text-[10px] tracking-[0.3em] font-black uppercase text-[#d4af37]">RFaquarium Philosophy</p>
      </div>
    </div>
  );

      return (
        <div className="h-screen flex flex-col text-[12px] max-w-md mx-auto bg-[#000000] text-zinc-100 pb-[70px] relative overflow-hidden">
          <ToastManager toasts={toasts} />
          <div className="p-4 pt-8 sticky top-0 z-50 bg-[#0a0a0a] border-b border-[#222] flex justify-between items-center shadow-md">
            <div>
                <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest">CỘNG TÁC VIÊN</div>
                <div className="font-black text-[#d4af37] text-[16px]">{currentUser.split(' ').pop()}</div>
            </div>
            <button onClick={() => { localStorage.removeItem('rf_user'); setCurrentUser(''); }} className="w-8 h-8 rounded-full bg-[#1a1a1a] text-rose-500 border border-[#333] flex items-center justify-center"><i className="fas fa-sign-out-alt"></i></button>
          </div>

          <main className="flex-1 w-full p-4 overflow-y-auto custom-scrollbar relative">
    {activeTab === 'create_order' && <CTVCreateOrder products={erpData.Products} pushDeltas={pushDeltas} currentUser={currentUser} />}
    {activeTab === 'orders' && <CTVOrdersTab orders={erpData.Orders} prodItems={erpData.prodItems} packings={erpData.packings} currentUser={currentUser} pushDeltas={pushDeltas} />}
    {activeTab === 'customers' && <CTVCustomers orders={erpData.Orders} />}
    {activeTab === 'production' && <CTVProductionTab orders={erpData.Orders} prodItems={erpData.prodItems} erpProducts={erpData.Products} currentUser={currentUser} />}
    
    {/* ĐÃ CẬP NHẬT: TRUYỀN THÊM pushDeltas VÀ currentUser VÀO CTVFinance */}
    {activeTab === 'finance' && <CTVFinance orders={erpData.Orders} pushDeltas={pushDeltas} currentUser={currentUser} />}
</main>

          <div className="absolute bottom-0 left-0 right-0 bg-[#0a0a0a]/95 backdrop-blur-md border-t border-[#222] flex justify-around p-2 z-50">
            <NavBtn icon="fa-plus-square" label="Lên Đơn" active={activeTab === 'create_order'} onClick={() => setActiveTab('create_order')} />
            <NavBtn icon="fa-list-alt" label="Đơn Hàng" active={activeTab === 'orders'} onClick={() => setActiveTab('orders')} />
            <NavBtn icon="fa-users" label="Khách" active={activeTab === 'customers'} onClick={() => setActiveTab('customers')} />
            <NavBtn icon="fa-hammer" label="Sản Xuất" active={activeTab === 'production'} onClick={() => setActiveTab('production')} />
            <NavBtn icon="fa-wallet" label="Tài Chính" active={activeTab === 'finance'} onClick={() => setActiveTab('finance')} />
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
// TAB 1: LÊN ĐƠN HÀNG DÀNH CHO CTV (ĐÃ PHỤC HỒI FULL TÍNH NĂNG CHỌN HÀNG THÔNG MINH)
// ----------------------------------------------------
function CTVCreateOrder({ products, pushDeltas, currentUser }) {
    const [customer, setCustomer] = React.useState('');
    const [phone, setPhone] = React.useState('');
    const [address, setAddress] = React.useState('');
    const [note, setNote] = React.useState('');
    
    const [retailTotal, setRetailTotal] = React.useState('');
    const [retailDiscount, setRetailDiscount] = React.useState('');
    const [isSubmitting, setIsSubmitting] = React.useState(false);

    // State quản lý Hàng hóa & Chọn hàng thông minh
    const [prods, setProds] = React.useState([]);
    const [accessories, setAccessories] = React.useState([]);
    const [searchTarget, setSearchTarget] = React.useState(null);
    const [sq, setSq] = React.useState('');
    const [layoutStep, setLayoutStep] = React.useState(1);
    const [selSub, setSelSub] = React.useState('');
    const [selVer, setSelVer] = React.useState('');
    
    // State cho tính năng THÊM MỚI (Quick Add)
    const [localProds, setLocalProds] = React.useState([]);
    const [showQuickAdd, setShowQuickAdd] = React.useState(false);
    const [qaData, setQaData] = React.useState({ name: '', dim: '', price: '', cost: '', sku: '', realImage: '', unit: 'Cái' });

    const combinedProds = React.useMemo(() => [...products, ...localProds], [products, localProds]);

    const activeProds = React.useMemo(() => {
        let targetCat = searchTarget === 'acc' ? 'PHỤ KIỆN' : (searchTarget === 'glass' ? 'BỂ KÍNH' : 'LAYOUT');
        let filtered = combinedProds.filter(p => (p.category || '').toUpperCase() === targetCat);
        if (sq) filtered = filtered.filter(p => String(p.name).toLowerCase().includes(sq.toLowerCase()) || String(p.sku).toLowerCase().includes(sq.toLowerCase()));
        return filtered;
    }, [combinedProds, searchTarget, sq]);

    const layoutData = React.useMemo(() => {
        if (searchTarget !== 'layout') return { subs: [], vers: [], dims: [] };
        const subs = [...new Set(activeProds.map(p => p.sub_category || 'Khác'))];
        let vers = []; let dims = [];
        if (selSub) {
            const prodInSub = activeProds.filter(p => (p.sub_category || 'Khác') === selSub);
            vers = [...new Set(prodInSub.map(p => { if(!String(p.name).includes(' - ')) return p.name; const parts = p.name.split(' - '); parts.pop(); return parts.join(' - '); }))];
            if (selVer) dims = prodInSub.filter(p => String(p.name).startsWith(selVer));
        }
        return { subs, vers, dims };
    }, [activeProds, searchTarget, selSub, selVer]);

    const selectProduct = (p) => {
        if (searchTarget === 'acc') { 
            setAccessories([...accessories, { name: p.name, quantity: 1, price: p.price||0 }]);
        } else {
            setProds([...prods, { id: 'P' + Date.now(), type: searchTarget === 'glass' ? 'Bể Kính' : 'Layout', name: p.name, note: '', status: 'Pending' }]);
        }
        closeSearch();
    };

    const closeSearch = () => { 
        setSearchTarget(null); setSq(''); setShowQuickAdd(false); setLayoutStep(1); 
        setSelSub(''); setSelVer(''); setQaData({name:'', dim:'', price:'', cost:'', sku:'', realImage:'', unit: 'Cái'}); 
    };

    // Hàm tạo kích thước nhanh & sinh SKU tự động
    const submitQuickAdd = () => {
        if (showQuickAdd === 'layout_sub') { setSelSub(qaData.name); setLayoutStep(2); setShowQuickAdd(false); setQaData({name:'',dim:'',price:'',cost:'',sku:'', realImage:'', unit:'Cái'}); return; }
        if (showQuickAdd === 'layout_ver') { setSelVer(qaData.name); setLayoutStep(3); setShowQuickAdd(false); setQaData({name:'',dim:'',price:'',cost:'',sku:'', realImage:'', unit:'Cái'}); return; }
        
        let finalName = qaData.name;
        let finalSku = qaData.sku || `SKU${Date.now().toString().slice(-6)}`; 
        let cat = searchTarget === 'acc' ? 'PHỤ KIỆN' : (searchTarget === 'glass' ? 'BỂ KÍNH' : 'LAYOUT'); 
        let subCat = searchTarget === 'layout' ? selSub : 'Khác';
        let templateImg = ''; 

        if (searchTarget === 'layout' || showQuickAdd === 'layout_dim') { 
            if (!qaData.dim) return alert('Nhập kích thước!');
            let cleanDimName = qaData.dim.toLowerCase().replace(/\s/g, '').replace(/cm/g, '');
            finalName = `${selVer} - ${cleanDimName}cm`;
            const templateProd = localProds.find(p => p.name && p.name.startsWith(selVer) && p.image);
            if (templateProd) templateImg = templateProd.image;
        } else if (searchTarget === 'glass' && qaData.dim) { 
            finalName = `${qaData.name} - ${qaData.dim}`;
        }
        
        if (!finalName) return alert('Nhập đủ thông tin!');
        const newP = { 
            id: 'PROD_NEW_' + Date.now(), sku: finalSku, name: finalName, category: cat, sub_category: subCat, 
            image: templateImg, realImage: qaData.realImage || '', costPrice: Number(qaData.cost) || 0, price: Number(qaData.price) || 0, quantity: 0, 
            unit: qaData.unit || (searchTarget === 'acc' ? 'Cái' : 'Bộ'), isNewLocal: true 
        };
        setLocalProds([...localProds, newP]); 
        selectProduct(newP); 
    };

    const handleSubmit = async () => {
        if (!customer || !phone || (prods.length === 0 && accessories.length === 0) || !retailTotal) {
            return alert('Vui lòng điền đủ Tên, SĐT, Chọn Sản Phẩm và Tổng tiền hàng!');
        }
        setIsSubmitting(true);

        const orderId = 'ORD_' + Date.now();
        const rand = (len) => Math.floor(Math.pow(10, len-1) + Math.random() * 9 * Math.pow(10, len-1));
        const orderCode = `CTV${rand(5)}`;
        const finalCod = (Number(retailTotal) || 0) - (Number(retailDiscount) || 0);

        let totalCost = 0;
        prods.forEach(p => { const match = combinedProds.find(x => x.name === p.name); if(match) totalCost += Number(match.costPrice || 0); });
        accessories.forEach(a => { const match = combinedProds.find(x => x.name === a.name); if(match) totalCost += (Number(match.costPrice || 0) * a.quantity); });
        
        let payload = {};
        
        const payloadOrder = {
            id: orderId, orderCode, channel: 'Cộng Tác Viên', customer, phone, address, note,
            revenue: Number(retailTotal), cod: finalCod, prePaid: Number(retailDiscount), costTotal: totalCost,
            createdAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
            date: new Date().toISOString().split('T')[0],
            status: 'Chờ Sản Xuất', accessories: accessories, hasProduction: prods.length > 0,
            updatedBy: currentUser, responsibleUser: currentUser
        };

        const prodItemsToPush = prods.map((p, idx) => ({
            ...p, orderId, fulfilledFromStock: false, 
            deadline: new Date(Date.now() + 2*24*60*60*1000).toISOString().slice(0,16)
        }));

        payload.orders = [payloadOrder];
        payload.prodItems = prodItemsToPush;

        // Đẩy sản phẩm mới tạo lên kho tổng
        let newItemsToPush = localProds.map(lp => { const { isNewLocal, ...cleanProd } = lp; return cleanProd; });
        if (newItemsToPush.length > 0) payload.Products = newItemsToPush;

        await pushDeltas(payload, 'Lên đơn thành công!', 'fa-rocket');
        
        setCustomer(''); setPhone(''); setAddress(''); setNote(''); 
        setProds([]); setAccessories([]); setRetailTotal(''); setRetailDiscount(''); setLocalProds([]);
        setIsSubmitting(false);
    };

    return (
        <div className="space-y-4 animate-fade-in pb-4">
            <div className="p-3 border-b border-[#222] bg-[#1a1a1a] rounded-t-xl flex items-center mb-2">
                <h2 className="font-black text-[14px] text-[#f5f5f5] tracking-wide"><i className="fas fa-shopping-cart text-[#3b82f6] mr-2"></i>LÊN ĐƠN CỘNG TÁC VIÊN</h2>
            </div>
            
            <div className="bg-[#0a0a0a] p-3 rounded-xl border border-[#222] space-y-3">
                <div className="grid grid-cols-2 gap-2">
                    <div><label className="text-[10px] font-bold text-gray-500 mb-1 block uppercase">Khách hàng *</label><input value={customer} onChange={e=>setCustomer(e.target.value)} className="w-full p-2.5 bg-[#141414] border border-[#333] rounded-lg text-[12px] font-bold text-white outline-none focus:border-[#2563eb]" placeholder="Tên..." /></div>
                    <div><label className="text-[10px] font-bold text-gray-500 mb-1 block uppercase">SĐT *</label><input value={phone} onChange={e=>setPhone(e.target.value)} className="w-full p-2.5 bg-[#141414] border border-[#333] rounded-lg text-[12px] font-bold text-white outline-none focus:border-[#2563eb]" placeholder="09..." /></div>
                </div>
                <div><label className="text-[10px] font-bold text-gray-500 mb-1 block uppercase">Địa chỉ</label><input value={address} onChange={e=>setAddress(e.target.value)} className="w-full p-2.5 bg-[#141414] border border-[#333] rounded-lg text-[12px] font-bold text-white outline-none focus:border-[#2563eb]" placeholder="Số nhà, đường..." /></div>
                <div><label className="text-[10px] font-bold text-gray-500 mb-1 block uppercase">Ghi chú đơn</label><textarea value={note} onChange={e=>setNote(e.target.value)} className="w-full p-2.5 bg-[#141414] border border-[#333] rounded-lg text-[12px] font-bold text-white outline-none focus:border-[#2563eb] min-h-[50px]"></textarea></div>
            </div>

            <div className="bg-[#0a0a0a] p-3 rounded-xl border border-[#222]">
                <div className="flex justify-between items-center border-b border-[#222] pb-2 mb-2">
                    <span className="text-[11px] font-black text-[#d4af37] uppercase tracking-wide">Hàng Trong Đơn *</span>
                    <div className="flex gap-1">
                        <button onClick={() => setSearchTarget('glass')} className="text-[9px] font-black bg-[#2563eb] text-white px-2 py-1.5 rounded active:scale-95">+ BỂ</button>
                        <button onClick={() => {setSearchTarget('layout'); setLayoutStep(1);}} className="text-[9px] font-black bg-[#10b981] text-white px-2 py-1.5 rounded active:scale-95">+ LAYOUT</button>
                        <button onClick={() => setSearchTarget('acc')} className="text-[9px] font-black bg-purple-500 text-white px-2 py-1.5 rounded active:scale-95">+ PHỤ KIỆN</button>
                    </div>
                </div>
                <div className="space-y-2">
                    {prods.map((p, i) => (
                        <div key={i} className="flex justify-between items-center bg-[#141414] p-2 rounded-lg border border-[#333]">
                            <div className="text-[11px] font-black text-white truncate">{p.name} <span className="text-[9px] text-[#2563eb] ml-1">({p.type})</span></div>
                            <button onClick={() => setProds(prods.filter((_, idx) => idx !== i))} className="text-rose-500 px-2"><i className="fas fa-trash text-[10px]"></i></button>
                        </div>
                    ))}
                    {accessories.map((a, i) => (

            <div className="p-3 rounded-xl border shadow-sm bg-[#3b0764]/30 border-[#9333ea]/30">
                <div className="flex items-center gap-2 text-[#c084fc] mb-3">
                    <i className="fas fa-handshake text-lg"></i>
                    <span className="font-black text-[11px] uppercase tracking-widest">Quyết toán CTV</span>

                    <label className="text-[10px] font-black text-gray-400 block mb-1">TỔNG TIỀN HÀNG</label>
                    <input type="number" value={retailTotal} onChange={(e) => setRetailTotal(e.target.value)} className="w-full bg-[#0a0a0a] border border-[#9333ea]/50 rounded-xl px-3 py-2 text-[14px] font-black text-[#c084fc] outline-none focus:border-[#c084fc]" placeholder="0" />
                </div>
                <div className="mb-3">
                    <label className="text-[10px] font-black text-gray-400 block mb-1">CHIẾT KHẤU / ĐỐI TRỪ</label>
                    <input type="number" value={retailDiscount} onChange={(e) => setRetailDiscount(e.target.value)} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-2 text-[12px] font-black text-white outline-none focus:border-[#c084fc]" placeholder="Ví dụ: -100000" />
                </div>
                <div className="bg-[#0a0a0a] border border-[#9333ea]/40 rounded-xl p-2 text-center">
                    <div className="text-[9px] text-gray-400 font-black tracking-wider uppercase">Cần Thu Khách (COD)</div>
                    <div className="text-[18px] font-black text-[#c084fc] mt-0.5">{((Number(retailTotal) || 0) - (Number(retailDiscount) || 0)).toLocaleString('vi-VN')}đ</div>
                </div>
            </div>

            <button onClick={handleSubmit} disabled={isSubmitting} className="w-full py-3.5 bg-[#d4af37] text-black font-black text-[13px] rounded-xl shadow-md active:scale-95 flex justify-center gap-2">
                {isSubmitting ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-save"></i> CHỐT ĐƠN</>}

            {/* OVERLAY CHỌN HÀNG HÓA THÔNG MINH (CÓ ẢNH & QUICK ADD) */}
            {searchTarget && (
                <div className="absolute inset-0 bg-[#0a0a0a] z-[200] flex flex-col animate-slide-up pb-20">
                    <div className="flex justify-between items-center p-4 border-b border-[#222] bg-[#111]">
                        <div className="flex items-center gap-3">
                            {searchTarget === 'layout' && layoutStep > 1 && !showQuickAdd && (<button onClick={() => setLayoutStep(layoutStep - 1)} className="w-8 h-8 rounded-full bg-[#222] text-white flex items-center justify-center hover:bg-[#333]"><i className="fas fa-arrow-left"></i></button>)}
                            {showQuickAdd && (<button onClick={() => setShowQuickAdd(false)} className="w-8 h-8 rounded-full bg-[#222] text-white flex items-center justify-center hover:bg-[#333]"><i className="fas fa-arrow-left"></i></button>)}
                            <h3 className="text-[#f5f5f5] font-black text-[14px] uppercase">{showQuickAdd ? 'THÊM MỚI' : (searchTarget === 'acc' ? 'CHỌN PHỤ KIỆN' : (searchTarget === 'glass' ? 'CHỌN BỂ KÍNH' : 'CHỌN MẪU LAYOUT'))}</h3>
                        </div>
                        <button onClick={closeSearch} className="w-8 h-8 bg-[#222] rounded-full text-gray-400 hover:text-rose-500 flex items-center justify-center"><i className="fas fa-times"></i></button>
                    </div>

                    {showQuickAdd ? (
                        <div className="p-5 space-y-4 overflow-y-auto pb-safe custom-scrollbar flex-1">
                            <div><label className="text-[10px] font-black text-gray-500 block mb-1 uppercase tracking-widest">{showQuickAdd === 'layout_sub' ? 'Tên Danh Mục' : (showQuickAdd === 'layout_ver' ? 'Tên Phiên Bản' : 'Tên Sản Phẩm')}</label><input autoFocus value={qaData.name} onChange={e=>setQaData({...qaData, name: e.target.value})} className="w-full p-3.5 bg-[#141414] border border-[#333] rounded-xl text-[#f5f5f5] font-bold text-[13px] outline-none focus:border-[#d4af37]" placeholder="Nhập tên..." /></div>
                            
                            <div className="grid grid-cols-2 gap-3">
                                {(searchTarget === 'glass' || showQuickAdd === 'layout_dim') ? (
                                    <div className="col-span-2 bg-[#2563eb]/5 border border-[#2563eb]/20 p-4 rounded-xl space-y-3">
                                        <div><label className="text-[10px] font-black text-[#60a5fa] block mb-1 uppercase tracking-widest"><i className="fas fa-ruler-combined mr-1"></i> Kích thước (VD: 60 x 40 x 40 cm)</label><input value={qaData.dim} onChange={e=>setQaData({...qaData, dim: e.target.value, sku: `SKU-${e.target.value.toLowerCase().replace(/cm/g, '').replace(/\\s/g, '').replace(/x/g, '')}`})} className="w-full p-3.5 bg-[#0a0a0a] border border-[#2563eb]/50 rounded-xl text-[#60a5fa] font-black text-[13px] outline-none focus:border-[#2563eb]" placeholder="60 x 40 x 40 cm" /></div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div><label className="text-[10px] font-black text-gray-500 block mb-1 uppercase tracking-widest">Mã SKU</label><input value={qaData.sku} onChange={e=>setQaData({...qaData, sku: e.target.value})} className="w-full p-2.5 bg-[#111] border border-[#333] rounded-xl text-[#d4af37] font-bold text-[12px] outline-none" placeholder="Tự tạo..." /></div>
                                            <div><label className="text-[10px] font-black text-gray-500 block mb-1 uppercase tracking-widest">Đơn vị tính</label><input value={qaData.unit} onChange={e=>setQaData({...qaData, unit: e.target.value})} className="w-full p-2.5 bg-[#111] border border-[#333] rounded-xl text-white font-bold text-[12px] outline-none focus:border-[#d4af37]" /></div>
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        <div><label className="text-[10px] font-black text-gray-500 block mb-1 uppercase tracking-widest">Mã SKU</label><input value={qaData.sku} onChange={e=>setQaData({...qaData, sku: e.target.value})} className="w-full p-3.5 bg-[#141414] border border-[#333] rounded-xl text-[#d4af37] font-bold text-[13px] outline-none focus:border-[#d4af37]" placeholder="Tùy chọn..." /></div>
                                        <div><label className="text-[10px] font-black text-gray-500 block mb-1 uppercase tracking-widest">Đơn vị tính</label><input value={qaData.unit} onChange={e=>setQaData({...qaData, unit: e.target.value})} className="w-full p-3.5 bg-[#141414] border border-[#333] rounded-xl text-white font-bold text-[13px] outline-none focus:border-[#d4af37]" placeholder="Cái, Bộ..." /></div>
                                    </>
                                )}
                            </div>
                            <button onClick={submitQuickAdd} className="w-full py-4 mt-4 bg-[#d4af37] text-[#0a0a0a] font-black text-[13px] rounded-xl active:scale-95"><i className="fas fa-save mr-2"></i> LƯU & CHỌN VÀO ĐƠN</button>
                        </div>
                    ) : (
                        <>
                            <div className="p-4 bg-[#141414] border-b border-[#222]">
                                <div className="bg-[#0a0a0a] border border-[#333] rounded-xl flex items-center px-4 py-3">
                                    <i className="fas fa-search text-[#666] mr-3"></i>
                                    <input placeholder="Nhập tên sản phẩm..." className="flex-1 bg-transparent outline-none font-bold text-white text-[12px]" value={sq} onChange={e => setSq(e.target.value)} />
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 custom-scrollbar bg-[#0a0a0a]">
                                {(searchTarget === 'acc' || searchTarget === 'glass') && (
                                    <div className="space-y-2">
                                        <button onClick={() => setShowQuickAdd(searchTarget)} className="w-full p-3.5 bg-[#d4af37]/10 border border-[#d4af37]/30 text-[#d4af37] rounded-xl font-black text-[11px] uppercase tracking-widest hover:bg-[#d4af37]/20 flex justify-center gap-2 mb-2"><i className="fas fa-plus-circle text-sm"></i> TẠO HÀNG MỚI</button>
                                        {activeProds.map(p => (
                                            <div key={p.id} onClick={() => selectProduct(p)} className="bg-[#141414] border border-[#222] p-3 rounded-xl active:scale-95 cursor-pointer flex justify-between items-center">
                                                <div className="font-black text-[13px] text-white">{p.name}</div>
                                                <div className="w-6 h-6 rounded-full bg-[#d4af37]/10 text-[#d4af37] flex items-center justify-center border border-[#d4af37]/30"><i className="fas fa-check text-[10px]"></i></div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {searchTarget === 'layout' && (
                                    <div>
                                        {layoutStep === 1 && (
                                            <div className="grid grid-cols-2 gap-3">
                                                <button onClick={() => setShowQuickAdd('layout_sub')} className="col-span-2 p-3.5 bg-[#10b981]/10 border border-[#10b981]/30 text-[#10b981] rounded-xl font-black text-[11px] uppercase flex justify-center gap-2 mb-1"><i className="fas fa-folder-plus text-sm"></i> TẠO DANH MỤC MỚI</button>
                                                {layoutData.subs.map(sub => (
                                                    <div key={sub} onClick={() => {setSelSub(sub); setLayoutStep(2);}} className="bg-[#141414] border border-[#333] p-4 rounded-xl text-center cursor-pointer active:scale-95"><i className="fas fa-layer-group text-2xl text-[#d4af37] mb-2"></i><div className="font-black text-[11px] text-white uppercase">{sub}</div></div>
                                                ))}
                                            </div>
                                        )}
                                        {layoutStep === 2 && (
                                            <div className="grid grid-cols-2 gap-2">
                                                {layoutData.vers.map(v => {
                                                    const matchedProd = combinedProds.find(p => p.name && p.name.startsWith(v) && p.image);
                                                    const versionImg = matchedProd ? matchedProd.image : '';
                                                    return (
                                                        <div key={v} onClick={() => { setSelVer(v); setLayoutStep(3); }} className="bg-[#141414] border border-[#222] rounded-xl overflow-hidden cursor-pointer active:scale-95 hover:border-[#10b981] transition-all flex flex-col h-[145px] relative">
                                                            <div className="w-full flex-1 bg-black relative overflow-hidden border-b border-[#222]">
                                                                {versionImg ? (
                                                                    <img src={versionImg} className="w-full h-full object-cover" alt={v} />
                                                                ) : (
                                                                    <div className="w-full h-full flex flex-col items-center justify-center text-gray-600 gap-1">
                                                                        <i className="fas fa-image text-lg opacity-40"></i>
                                                                        <span className="text-[9px] font-bold uppercase opacity-40">Chưa có ảnh</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                            <div className="p-2 bg-[#0d0d0d] flex items-center justify-center min-h-[38px]">
                                                                <span className="font-black text-[11px] text-gray-300 text-center line-clamp-1 uppercase tracking-tight">{v.replace(`${selSub} `, '') || v}</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                                <button onClick={() => { setShowQuickAdd('layout_ver'); }} className="col-span-2 w-full py-2 bg-[#141414] border border-dashed border-[#333] text-gray-400 rounded-xl font-bold text-[11px] uppercase hover:text-[#10b981] hover:border-[#10b981] mt-1"><i className="fas fa-plus-circle mr-1.5"></i> Thêm phiên bản mới</button>
                                            </div>
                                        )}
                                        {layoutStep === 3 && (
                                            <div className="space-y-2.5">
                                                <div className="text-[10px] text-gray-500 font-black uppercase mb-2">Kích thước mẫu: <span className="text-[#10b981]">{selVer}</span></div>
                                                
                                                {/* QUICK ADD TẠO KÍCH THƯỚC */}
                                                {(() => {
                                                    const templateProd = layoutData.dims[0] || activeProds.find(p => p.name.startsWith(selVer)) || {};
                                                    const templateImg = templateProd.image || '';
                                                    let baseSku = 'LAY-000';
                                                    if (templateProd.sku) {
                                                        const match = templateProd.sku.match(/^([A-Za-z0-9]+-\d+)/);
                                                        if (match) baseSku = match[1];
                                                    }

                                                    const handleQuickCreate = () => {
                                                        if (!qaData.dim) return alert('Nhập kích thước!');
                                                        let cleanDim = qaData.dim.toLowerCase().replace(/cm/g, '').replace(/\s/g, '');
                                                        const finalName = `${selVer} - ${cleanDim}cm`;
                                                        const finalSku = `${baseSku}-${cleanDim.replace(/x/g, '')}`;

                                                        const newP = { 
                                                            id: 'PROD_NEW_' + Date.now(), sku: finalSku, name: finalName, category: 'LAYOUT', sub_category: selSub, 
                                                            image: templateImg, realImage: qaData.realImage || '', costPrice: 0, price: 0, quantity: 0, unit: 'Bộ', isNewLocal: true 
                                                        };
                                                        setLocalProds([...localProds, newP]); selectProduct(newP);
                                                        setQaData({ name: '', dim: '', price: '', cost: '', sku: '', realImage: '', unit: 'Cái' });
                                                    };
                                                    return (
                                                        <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-3 relative overflow-hidden mb-3">
                                                            {templateImg && <div className="absolute right-0 top-0 w-1/3 h-full opacity-20 pointer-events-none"><img src={templateImg} className="w-full h-full object-cover" /></div>}
                                                            <div className="relative z-10">
                                                                <h4 className="text-[#10b981] font-black uppercase text-[11px] mb-2"><i className="fas fa-magic"></i> TẠO NHANH KÍCH THƯỚC</h4>
                                                                <div className="flex gap-2">
                                                                    <input value={qaData.dim} onChange={e => setQaData({...qaData, dim: e.target.value})} placeholder="VD: 30x20x25" className="flex-1 bg-[#141414] border border-[#333] rounded-lg px-3 py-2 text-[12px] font-black text-white outline-none focus:border-[#10b981]" />
                                                                    <button onClick={handleQuickCreate} disabled={!qaData.dim} className="px-3 bg-[#10b981] text-[#0a0a0a] font-black text-[11px] rounded-lg disabled:opacity-50"><i className="fas fa-plus"></i> CHỌN</button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })()}

                                                {layoutData.dims.map(p => (
                                                    <div key={p.id} onClick={() => selectProduct(p)} className="bg-[#141414] border border-[#222] p-3 rounded-xl cursor-pointer active:scale-95 flex justify-between items-center">
                                                        <span className="font-black text-[13px] text-[#10b981]">{p.name.replace(`${selVer} - `, '')}</span>
                                                        <div className="w-6 h-6 rounded-full bg-[#10b981]/10 text-[#10b981] flex items-center justify-center border border-[#10b981]/30"><i className="fas fa-check text-[10px]"></i></div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </>
                    )}
                </div>
            )}
        </div>
    );
}

// TÌM VÀ THAY THẾ LẠI FUNCTION CTVOrdersTab (BỎ TÍNH NĂNG NHẬP MÃ CỦA CTV)
function CTVOrdersTab({ orders = [], prodItems = [], packings = [], currentUser }) {
    const [searchCode, setSearchCode] = React.useState('');
    const [filterTime, setFilterTime] = React.useState('Tháng Này');
    const [filterStatus, setFilterStatus] = React.useState('Chờ Sản Xuất');
    const [previewImg, setPreviewImg] = React.useState(null);

    const myBaseOrders = React.useMemo(() => {
        return (orders || []).filter(o => 
            String(o.channel).toUpperCase().trim() === 'CỘNG TÁC VIÊN' || 
            String(o.orderCode).toUpperCase().startsWith('CTV')
        );
    }, [orders]);

    const baseFiltered = React.useMemo(() => {
        return myBaseOrders.filter(o => {
            const mvd = String(o.orderCode || '').toLowerCase();
            const tracking = String(o.trackingCode || '').toLowerCase();
            const cus = String(o.customer || '').toLowerCase();
            const matchSearch = mvd.includes(searchCode.toLowerCase()) || cus.includes(searchCode.toLowerCase()) || tracking.includes(searchCode.toLowerCase());
            
            const todayStr = new Date().toISOString().split('T')[0];
            const orderDate = (o.createdAt || o.date || '').split(' ')[0];
            if (filterTime === 'Hôm Nay') return orderDate === todayStr;
            return matchSearch;
        });
    }, [myBaseOrders, searchCode, filterTime]);

    const filtered = React.useMemo(() => {
        return baseFiltered.filter(o => {
            if (filterStatus === 'Chờ Sản Xuất') return o.status === 'Chờ Sản Xuất' || o.status === 'Quét Tự Động';
            if (filterStatus === 'Đã Bàn Giao') return o.status === 'Đã Bàn Giao' || o.status === 'Đã nhập kho';
            return o.status === filterStatus;
        });
    }, [baseFiltered, filterStatus]);

    const stats = React.useMemo(() => ({
        pending: myBaseOrders.filter(o => o.status === 'Chờ Sản Xuất' || o.status === 'Quét Tự Động').length,
        ready: myBaseOrders.filter(o => o.status === 'Sẵn sàng đóng gói').length,
        shipping: myBaseOrders.filter(o => o.status === 'Chờ Bàn Giao').length,
        done: myBaseOrders.filter(o => o.status === 'Đã Bàn Giao' || o.status === 'Đã nhập kho').length
    }), [myBaseOrders]);

    return (
        <div className="space-y-4 animate-fade-in pb-10">
            <div className="flex gap-2">
                <div className="relative flex-1">
                    <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input 
                        type="text" 
                        placeholder="Tìm mã đơn, tên khách, mã vận đơn..." 
                        value={searchCode} 
                        onChange={e => setSearchCode(e.target.value)} 
                        className="w-full pl-9 pr-4 py-2.5 bg-[#141414] border border-[#333] rounded-xl text-[12px] font-bold text-white outline-none shadow-inner focus:border-[#d4af37]" 
                    />
                </div>
                <select value={filterTime} onChange={e => setFilterTime(e.target.value)} className="bg-[#141414] rounded-xl border border-[#333] text-[10px] font-bold text-[#ccc] px-2 outline-none">
                    <option>Tháng Này</option><option>Hôm Nay</option><option>Tất Cả</option>
                </select>
            </div>

            <div className="flex gap-1 overflow-x-auto pb-1 custom-scrollbar">
                {[{id:'Chờ Sản Xuất', l:'Chờ SX', c:stats.pending}, {id:'Sẵn sàng đóng gói', l:'Chờ Gói', c:stats.ready}, {id:'Chờ Bàn Giao', l:'Chờ Giao', c:stats.shipping}, {id:'Đã Bàn Giao', l:'Hoàn Thành', c:stats.done}].map(t => (
                    <button key={t.id} onClick={() => setFilterStatus(t.id)} className={`px-3 py-2 rounded-xl text-[10px] font-black uppercase whitespace-nowrap tracking-tight border ${filterStatus === t.id ? 'bg-[#d4af37] text-black border-[#d4af37] shadow-md' : 'bg-[#141414] border-[#222] text-gray-400'}`}>
                        {t.l} ({t.c})
                    </button>
                ))}
            </div>

            <div className="space-y-3">
                {filtered.length === 0 ? (
                    <div className="text-center py-10 text-gray-600 bg-[#0a0a0a] rounded-xl border border-dashed border-[#222] font-bold">Không tìm thấy đơn hàng nào</div>
                ) : (
                    filtered.map(o => {
                        const relatedPacking = (packings || []).find(pk => pk.orderId === o.id);

                        return (
                            <div key={o.id} className="bg-[#141414] border border-[#222] p-3.5 rounded-2xl space-y-3 shadow-sm relative overflow-hidden">
                                <div className="flex justify-between items-center border-b border-[#222] pb-2">
                                    <div>
                                        <span className="font-mono text-[12px] text-[#d4af37] font-black tracking-wide">{o.orderCode}</span>
                                        <div className="text-[12px] font-black text-white mt-0.5">{o.customer} - <span className="text-gray-500 font-mono text-[11px]">{o.phone}</span></div>
                                    </div>
                                    <span className="text-[9px] font-black px-2 py-1 rounded bg-[#222] text-zinc-300 border border-[#333] font-mono uppercase tracking-tight">{o.status}</span>
                                </div>
                                
                                <div className="text-[11px] space-y-2.5">
                                    {(prodItems || []).filter(p => p.orderId === o.id).map((p, i) => {
                                        const p2Photo = p.phases?.phase2?.photo;
                                        const isLayout = !String(p.type || p.name).toLowerCase().includes('bể');

                                        return (
                                            <div key={i} className="bg-black/30 border border-[#1c1c1c] p-2 rounded-xl space-y-2">
                                                <div className="flex justify-between items-center text-zinc-300">
                                                    <span className="font-bold">• {p.name}</span>
                                                    <span className="text-[9px] text-amber-500 font-black uppercase">[{p.status || 'Chờ làm'}]</span>
                                                </div>

                                                {filterStatus === 'Sẵn sàng đóng gói' && isLayout && p2Photo && (
                                                    <div className="pt-1 flex flex-col items-start">
                                                        <div className="text-[9px] text-gray-500 font-black uppercase tracking-wider mb-1"><i className="fas fa-camera text-amber-500 mr-1"></i> Ảnh hoàn thành Layout:</div>
                                                        <div className="relative w-16 h-16 rounded-lg border border-[#333] overflow-hidden bg-black active:scale-95 transition-transform">
                                                            <img src={p2Photo} onClick={() => setPreviewImg(p2Photo)} className="w-full h-full object-cover cursor-pointer hover:opacity-80" alt="img" />
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* BLOCK HIỂN THỊ MÃ VẬN ĐƠN (CHỈ XEM VÀ COPY DÀNH CHO CTV) */}
                                <div className="pt-2 border-t border-[#1c1c1c]">
                                    {o.trackingCode ? (
                                        <div className="bg-[#2563eb]/10 border border-[#2563eb]/30 p-2.5 rounded-xl flex justify-between items-center">
                                            <div>
                                                <div className="text-[9px] text-[#60a5fa] font-black uppercase tracking-widest mb-0.5"><i className="fas fa-shipping-fast mr-1"></i> MÃ VẬN ĐƠN</div>
                                                <div className="text-[14px] font-black text-white tracking-wider">{o.trackingCode}</div>
                                            </div>
                                            <button onClick={() => {navigator.clipboard.writeText(o.trackingCode); alert('Đã copy mã vận đơn!');}} className="w-8 h-8 rounded-lg bg-[#2563eb] text-white flex items-center justify-center active:scale-95 shadow-md shadow-blue-900/20">
                                                <i className="fas fa-copy"></i>
                                            </button>

                                        <div className="text-[9px] text-emerald-400 font-black uppercase tracking-wider mb-1"><i className="fas fa-box-open mr-1"></i> Ảnh kiện hàng xuất xưởng:</div>
                                        <div className="relative w-16 h-16 rounded-lg border border-emerald-900/30 overflow-hidden bg-black active:scale-95 transition-transform">

                                        </div>
                                    </div>
                                )}

                                <div className="flex justify-between items-center pt-2 border-t border-[#1c1c1c]">
                                    <span className="text-[10px] text-gray-500 font-black uppercase tracking-widest">THU HỘ (COD)</span>
                                    <span className="text-[14px] font-black text-[#10b981]">{Number(o.cod || o.revenue).toLocaleString('vi-VN')}đ</span>

            {previewImg && (
                <div className="fixed inset-0 z-[99999] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-sm" onClick={() => setPreviewImg(null)}>
                    <div className="relative max-w-sm w-full flex flex-col items-center" onClick={e => e.stopPropagation()}>
                        <button className="absolute -top-12 right-0 text-white/70 text-2xl w-10 h-10 flex items-center justify-center bg-white/10 rounded-full" onClick={() => setPreviewImg(null)}>
                            <i className="fas fa-times"></i>
