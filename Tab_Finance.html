                    </div>
                </div>

                <div className="flex-1 overflow-hidden flex flex-col bg-[#0a0a0a] border border-[#222] rounded-xl">
                    <div className="flex items-center justify-between p-2 bg-[#1a1a1a] border-b border-[#333] shrink-0">
                        <div className="text-[11px] font-black text-white ml-2">KẾT QUẢ BÓC TÁCH VÍ SHOPEE ({scannedData.length} Giao dịch)</div>
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] text-gray-400 font-bold">Hợp lệ để Import: <b className="text-orange-400">{selectedRows.size}</b></span>
                            <button onClick={toggleAll} className="px-3 py-1.5 bg-[#222] text-[10px] font-bold text-white rounded hover:bg-[#333]">Chọn / Bỏ chọn tất cả</button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto custom-scrollbar p-2">
                        {scannedData.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-gray-500 opacity-50">
                                <i className="fas fa-wallet text-4xl mb-3 text-orange-500"></i>
                                <div className="text-[12px] font-bold">Chưa có dữ liệu. Vui lòng chọn file báo cáo Ví Shopee.</div>
                            </div>
                        ) : (
                            <table className="w-full text-left border-collapse text-[11px]">
                                <thead>
                                    <tr className="text-gray-500 font-black tracking-wider uppercase border-b border-[#333] sticky top-0 bg-[#0a0a0a] z-10">
                                        <th className="p-2 w-10 text-center">X</th>
                                        <th className="p-2 w-[120px]">Thời gian</th>
                                        <th className="p-2 w-[70px]">Loại</th>
                                        <th className="p-2 w-[110px] text-right">Số tiền</th>
                                        <th className="p-2 w-[140px]">Danh mục</th>
                                        <th className="p-2">Diễn giải giao dịch</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {scannedData.map(t => {
                                        const isSelected = selectedRows.has(t._id);
                                        let rowClass = 'hover:bg-[#1a1a1a] cursor-pointer';
                                        let textClass = 'text-gray-300';
                                        let tagHtml = null;
                                        let chkClass = isSelected ? 'bg-orange-500 border-orange-500 text-white' : 'border-[#444] text-transparent';

                                        if (t.dupLevel === 2) {
                                            rowClass = 'opacity-40 cursor-not-allowed bg-[#1a1a1a]';
                                            textClass = 'text-gray-500 line-through';
                                            tagHtml = <div className="text-[8px] text-rose-500 font-black bg-rose-500/10 px-1 py-0.5 rounded mt-1 inline-block border border-rose-500/30 tracking-widest uppercase">Trùng Lặp</div>;
                                        } else if (t.dupLevel === 3) {
                                            rowClass = 'hover:bg-[#10b981]/20 cursor-pointer bg-[#10b981]/10 border-[#10b981]/50';
                                            textClass = 'text-[#10b981]';
                                            tagHtml = <div className="text-[8px] text-[#10b981] font-black bg-[#10b981]/20 px-1.5 py-0.5 rounded mt-1 inline-block border border-[#10b981]/40 tracking-widest uppercase shadow-[0_0_10px_rgba(16,185,129,0.3)]"><i className="fas fa-check-double mr-1"></i> Đối Soát</div>;
                                            if (isSelected) chkClass = 'bg-[#10b981] border-[#10b981] text-white';
                                        } else if (t.dupLevel === 1) {
                                            rowClass = 'hover:bg-amber-900/20 cursor-pointer bg-amber-900/10 border-amber-900/50';
                                            textClass = 'text-amber-200';
                                            tagHtml = <div className="text-[8px] text-amber-500 font-black bg-amber-500/10 px-1 py-0.5 rounded mt-1 inline-block border border-amber-500/30 uppercase tracking-widest" title="Trùng ngày & số tiền nhưng khác nội dung">Nghi Ngờ</div>;
                                            if (isSelected) rowClass = t.type === 'Thu' ? 'bg-[#10b981]/10' : 'bg-orange-500/10';
                                        } else {
                                            if (isSelected) rowClass = t.type === 'Thu' ? 'bg-[#10b981]/10' : 'bg-orange-500/10';
                                        }

                                        return (
                                            <tr key={t._id} onClick={() => t.dupLevel !== 2 && toggleRow(t._id)} className={`border-b border-[#222] transition-colors ${rowClass}`}>
                                                <td className="p-2 text-center"><div className={`w-4 h-4 rounded border flex items-center justify-center mx-auto ${chkClass}`}><i className="fas fa-check text-[8px]"></i></div></td>
                                                <td className="p-2 font-mono"><div className={textClass}>{t.date}</div>{tagHtml}</td>
                                                <td className="p-2"><span className={`px-1.5 py-0.5 rounded font-black text-[9px] uppercase ${t.type === 'Thu' ? 'bg-[#10b981]/20 text-[#10b981]' : t.type === 'Chuyển' ? 'bg-blue-500/20 text-blue-400' : 'bg-rose-500/20 text-rose-500'}`}>{t.type}</span></td>
                                                <td className={`p-2 text-right font-black ${t.type === 'Thu' ? 'text-[#10b981]' : t.type === 'Chuyển' ? 'text-blue-400' : 'text-rose-500'}`}>{Number(t.amount).toLocaleString('vi-VN')}đ</td>
                                                <td className="p-2">
                                                    <select value={t.category} disabled={t.dupLevel === 2} onClick={e => e.stopPropagation()} onChange={(e) => { const newData = [...scannedData]; const idx = newData.findIndex(x => x._id === t._id); newData[idx].category = e.target.value; setScannedData(newData); }} className="w-full bg-[#111] border border-[#333] rounded text-[10px] p-1.5 outline-none font-bold text-white focus:border-orange-500">
                                                        <option value="Bán Hàng">Bán Hàng</option>
                                                        <option value="Chi Phí Bán Hàng">Chi Phí Bán Hàng</option>
                                                        <option value="Rút Tiền Shopee">Rút Tiền Shopee</option>
                                                        <option value="Hoàn Tiền Khách">Hoàn Tiền Khách</option>
                                                        <option value="Chi Phí Khác">Chi Phí Khác</option>
                                                    </select>
                                                </td>
                                                <td className="p-2 font-medium line-clamp-2 leading-snug text-gray-300" title={t.note}>{t.note}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        )}
                    </div>
                </div>

                <div className="mt-4 pt-4 border-t border-[#333] shrink-0">
                    <button onClick={handleImport} disabled={isProcessing || selectedRows.size === 0} className={`w-full py-4 font-black rounded-xl text-[13px] uppercase tracking-wider transition-all flex items-center justify-center gap-2 ${isProcessing || selectedRows.size === 0 ? 'bg-[#222] text-gray-500 cursor-not-allowed' : 'bg-gradient-to-r from-orange-600 to-amber-500 hover:opacity-90 text-white shadow-[0_0_20px_rgba(249,115,22,0.3)] active:scale-95'}`}>
                        {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> ĐANG CẬP NHẬT...</> : <><i className="fas fa-wallet text-lg"></i> CẬP NHẬT {selectedRows.size} GIAO DỊCH VÀO VÍ SHOPEE</>}
                    </button>
                </div>
            </div>
        </div>
    );
}

function ReceiptScannerModal({ onClose, onComplete, triggerToast, accountsData }) {
    const [isProcessing, setIsProcessing] = React.useState(false);
    const [previewImage, setPreviewImage] = React.useState(null);
    const [ocrStatus, setOcrStatus] = React.useState('');
    const fileInputRef = React.useRef(null);

    React.useEffect(() => {
        if (typeof window.Tesseract === 'undefined') {
            const script = document.createElement('script');
            script.src = "https:\/\/cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
            document.head.appendChild(script);
        }
    }, []);

    const compressImage = (file) => {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    };

    const processReceipt = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (typeof window.Tesseract === 'undefined') return triggerToast('Hệ thống AI đang tải, vui lòng đợi 3 giây rồi thử lại!', 'fa-spinner', 'warning');

        setIsProcessing(true);
        setOcrStatus('Đang nén ảnh chứng từ...');
        try {
            const base64Image = await compressImage(file);
            setPreviewImage(base64Image);
            setOcrStatus('AI đang đọc và bóc tách dữ liệu...');
            const worker = await window.Tesseract.createWorker('vie');
            const ret = await worker.recognize(base64Image);
            const text = ret.data.text;
            await worker.terminate();

            setOcrStatus('Đang phân tích thông tin giao dịch...');
            
            // 1. Tìm số tiền thông minh (Ưu tiên dạng: X,XXX,XXX VND hoặc X.XXX.XXX VNĐ hoặc đ/d)
            const amountWithCurrencyMatch = text.match(/([\d\.,\s]+)\s*(?:VND|VNĐ|đ|d|Vnđ|Vnd)\b/i);
            let maxAmt = 0;
            if (amountWithCurrencyMatch) {
                maxAmt = Number(amountWithCurrencyMatch[1].replace(/[^\d]/g, ''));
            }

            // Fallback: Tìm số lớn nhất dưới 10 tỷ
            if (!maxAmt) {
                const matches = text.match(/[\d][\d\.,\s]+[\d]/g);
                if (matches) {
                    matches.forEach(m => {
                        const cleanNum = Number(m.replace(/[^\d]/g, ''));
                        if (cleanNum > maxAmt && cleanNum < 10000000000) maxAmt = cleanNum;
                    });
                }
            }

            // 2. Tìm ngân hàng nguồn (tài khoản nguồn LP hoặc BIDV)
            let detectedAccId = accountsData[0]?.id;
            const textUpper = text.toUpperCase();
            if (textUpper.includes('BIDV')) {
                const bidv = accountsData.find(a => String(parseAccountInfo(a).name).toUpperCase().includes('BIDV'));
                if (bidv) detectedAccId = bidv.id;
            } else if (textUpper.includes('LP') || textUpper.includes('LIEN VIET') || textUpper.includes('LƯU NGƯỜI THỤ HƯỞNG') || textUpper.includes('LPBANK')) {
                const lp = accountsData.find(a => String(parseAccountInfo(a).name).toUpperCase().includes('LP'));
                if (lp) detectedAccId = lp.id;
            }

            // 3. Bóc tách người thụ hưởng (Người nhận)
            const payeeMatch = text.match(/(?:Người thụ hưởng|Nguoi thu huong|Đến|Den|Tới|To|Người nhận)[:\s\n\r]*([^\n\r]+)/i);
            let detectedPayee = "";
            if (payeeMatch) {
                detectedPayee = payeeMatch[1].replace(/^[:\s\-*]+/g, '').trim().toUpperCase();
                // Loại bỏ phần thừa (ví dụ tài khoản hoặc tên ngân hàng trên cùng dòng)
                detectedPayee = detectedPayee.split(/(?:MB Bank|Tài khoản|Số tài khoản|Tại|[\d]{5,})/i)[0].trim();
            }

            // 4. Bóc tách nội dung giao dịch (Lời nhắn)
            const noteMatch = text.match(/(?:Nội dung|Noi dung|Lời nhắn|Ghi chú)[:\s\n\r]*([^\n\r]+)/i);
            let detectedNote = "";
            if (noteMatch) {
                detectedNote = noteMatch[1].replace(/^[:\s\-]+/g, '').trim();
            }

            // 5. Bóc tách Phân loại thông minh dựa trên nội dung
            let detectedCategory = "Chi Phí Khác";
            if (detectedNote) {
                const noteLower = detectedNote.toLowerCase();
                if (noteLower.includes('luong') || noteLower.includes('lương') || noteLower.includes('salary') || noteLower.includes('thưởng') || noteLower.includes('thuong')) {
                    detectedCategory = 'Trả Lương';
                } else if (noteLower.includes('kinh') || noteLower.includes('kính') || noteLower.includes('nguyen lieu') || noteLower.includes('nguyên liệu') || noteLower.includes('đá') || noteLower.includes('lũa') || noteLower.includes('gỗ') || noteLower.includes('cat') || noteLower.includes('cát')) {
                    detectedCategory = 'Mua Nguyên Liệu';
                } else if (noteLower.includes('gang tay') || noteLower.includes('găng tay') || noteLower.includes('vật tư') || noteLower.includes('vat tu') || noteLower.includes('băng keo') || noteLower.includes('bang keo') || noteLower.includes('thùng') || noteLower.includes('bao bì') || noteLower.includes('hop') || noteLower.includes('hộp')) {
                    detectedCategory = 'Mua Vật Tư';
                } else if (noteLower.includes('hoá đơn') || noteLower.includes('hoa don') || noteLower.includes('điện') || noteLower.includes('nước') || noteLower.includes('internet') || noteLower.includes('bill')) {
                    detectedCategory = 'Thanh Toán Hoá Đơn';
                } else if (noteLower.includes('phần mềm') || noteLower.includes('phan mem') || noteLower.includes('software') || noteLower.includes('zoom') || noteLower.includes('host') || noteLower.includes('cloud')) {
                    detectedCategory = 'Dịch Vụ Phần Mềm';
                } else if (noteLower.includes('ads') || noteLower.includes('facebook') || noteLower.includes('quảng cáo') || noteLower.includes('quang cao') || noteLower.includes('marketing') || noteLower.includes('tiktok ads')) {
                    detectedCategory = 'Quảng Cáo & Marketing';
                } else if (noteLower.includes('thiết bị') || noteLower.includes('thiet bi') || noteLower.includes('điện thoại') || noteLower.includes('máy tính') || noteLower.includes('laptop')) {
                    detectedCategory = 'Trang Thiết Bị';
                } else if (noteLower.includes('máy móc') || noteLower.includes('may moc') || noteLower.includes('công cụ') || noteLower.includes('cong cu') || noteLower.includes('khoan') || noteLower.includes('mài') || noteLower.includes('cắt')) {
                    detectedCategory = 'Máy Móc & Công Cụ';
                } else if (noteLower.includes('sự kiện') || noteLower.includes('su kien') || noteLower.includes('hoạt động') || noteLower.includes('sinh nhật') || noteLower.includes('tiệc')) {
                    detectedCategory = 'Hoạt Động & Sự Kiện';
                }
            }

            // 6. Xây dựng Tiêu đề tự động
            let detectedTitle = "Chi chuyển khoản";
            if (detectedPayee) {
                detectedTitle = `Chi cho ${detectedPayee}`;
                if (detectedNote) {
                    detectedTitle += ` - ${detectedNote}`;
                }
            } else if (detectedNote) {
                detectedTitle = detectedNote;
            }
            if (detectedTitle.length > 80) {
                detectedTitle = detectedTitle.slice(0, 77) + "...";
            }

            // 7. Bóc tách Ngày giao dịch (YYYY-MM-DD)
            const dateMatch = text.match(/\b(\d{2})[\/\-](\d{2})[\/\-](\d{4})\b/);
            let detectedDate = new Date().toISOString().slice(0, 10);
            if (dateMatch) {
                detectedDate = `${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`;
            }

            // 8. Bóc tách Giờ giao dịch (HH:MM)
            const timeMatch = text.match(/\b(\d{2}):(\d{2}):(\d{2})\b/) || text.match(/\b(\d{2}):(\d{2})\b/);
            let detectedTime = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
            if (timeMatch) {
                detectedTime = `${timeMatch[1]}:${timeMatch[2]}`;
            }

            triggerToast('Bóc tách ảnh chứng từ thành công!', 'fa-magic', 'success');
            onComplete({ 
                amount: maxAmt, 
                accId: detectedAccId, 
                proofImage: base64Image, 
                rawText: text,
                category: detectedCategory,
                title: detectedTitle,
                note: detectedNote,
                date: detectedDate,
                time: detectedTime
            });
        } catch (error) {
            triggerToast('Ảnh mờ hoặc lỗi AI không đọc được!', 'fa-times', 'danger');
            setIsProcessing(false);
        }
    };

    return (
        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-[#141414] border border-[#d4af37]/50 w-full max-w-sm rounded-3xl p-6 shadow-[0_0_40px_rgba(212,175,55,0.2)] flex flex-col relative animate-slide-up text-center" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-500 hover:text-white hover:bg-rose-500 flex items-center justify-center transition-all z-20"><i className="fas fa-times text-sm"></i></button>
                <div className="w-16 h-16 rounded-full bg-gradient-to-br from-[#d4af37] to-[#eab308] text-black flex items-center justify-center text-3xl mx-auto mb-4 shadow-[0_0_20px_rgba(212,175,55,0.4)]"><i className="fas fa-camera"></i></div>
                <h3 className="font-black text-white text-[16px] uppercase tracking-widest mb-1">Máy Đọc Ảnh Giao Dịch</h3>
                <p className="text-gray-400 text-[11px] mb-6 leading-relaxed">Tải ảnh chụp màn hình Bill chuyển khoản lên, AI sẽ tự động đọc Số Tiền và Ngân hàng (BIDV / LPBank).</p>
                {previewImage ? (
                    <div className="w-full h-48 rounded-xl overflow-hidden border-2 border-dashed border-[#d4af37] relative bg-black flex items-center justify-center mb-4">
                        <img src={previewImage} className="w-full h-full object-contain opacity-50" alt="Preview" />
                        {isProcessing && <div className="absolute inset-0 flex flex-col items-center justify-center z-10 text-[#d4af37] bg-black/40"><i className="fas fa-magic fa-spin text-3xl mb-2"></i><span className="font-black text-[11px] uppercase tracking-wider bg-black/80 px-3 py-1 rounded-full">{ocrStatus}</span></div>}
                    </div>
                ) : (

                        <button onClick={() => fileInputRef.current?.click()} disabled={isProcessing} className="w-full bg-[#0a0a0a] border-2 border-dashed border-[#333] hover:border-[#d4af37] text-gray-400 hover:text-white rounded-xl py-8 flex flex-col items-center justify-center transition-all cursor-pointer shadow-inner">
                            <i className="fas fa-images text-4xl text-[#d4af37] mb-3 opacity-80"></i><span className="font-black text-[12px] uppercase tracking-wider text-[#d4af37]">Bấm để chọn Ảnh Bill</span>
                        </button>
                    </div>
                )}
            </div>
        </div>
    );
}

    if (filterTime.startsWith('Tháng ')) { const m = parseInt(filterTime.replace('Tháng ', ''), 10); return d.getMonth() + 1 === m && d.getFullYear() === today.getFullYear(); }

        if (!filterStart || !filterEnd) return true;
        const start = new Date(filterStart + 'T00:00:00');

  const handleSyncBIDV = async () => {

    const shopeeIncomeInputRef = React.useRef(null);
    const [isImportingIncome, setIsImportingIncome] = React.useState(false);

    const handleImportShopeeIncome = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsImportingIncome(true);
        triggerToast('Đang phân tích báo cáo doanh thu Shopee...', 'fa-spinner fa-spin', 'info');

        try {
            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const data = evt.target.result;
                    const workbook = window.XLSX.read(data, { type: 'binary' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    // Data usually starts at row 1 is header
                    // Tweak to skip initial blank lines if any
                    const json = window.XLSX.utils.sheet_to_json(sheet, { defval: 0 });
                    
                    let newTransactions = [];
                    let walletAccId = 'ACC_SHOPEE_' + Date.now();
                    let shopeeAcc = null;
                    if (accountsData) {
                        shopeeAcc = accountsData.find(a => String(a.accountName).toLowerCase().includes('shopee'));
                        if (shopeeAcc) walletAccId = shopeeAcc.id;
                    }

                    for(let i = 0; i < json.length; i++) {
                        const row = json[i];
                        const orderCode = String(row['Mã đơn hàng'] || '').trim();
                        if(!orderCode || orderCode === 'undefined' || orderCode === '0') continue;
                        
                        const dateRaw = row['Ngày hoàn thành'] || new Date().toISOString().slice(0, 10);
                        const dateStr = String(dateRaw).includes(' ') ? String(dateRaw).split(' ')[0] : String(dateRaw);
                        
                        const price = Number(row['Giá sản phẩm'] || 0);
                        const sellerVoucher = Number(row['Mã ưu đãi do Người Bán chiu'] || row['Mã ưu đãi do Người Bán chịu'] || 0);
                        
                        // Phí sàn
                        const paymentFee = Number(row['Phí xử lý giao dịch'] || 0);
                        const serviceFee = Number(row['Phí Dịch Vụ'] || 0);
                        const commissionFee = Number(row['Phí hoa hồng Tiếp thị liên kết'] || row['Phí hoa hồng'] || 0);
                        const transFee = Number(row['Phí giao dịch'] || 0);
                        const otherFee = Number(row['Phí dịch vụ hiển thị'] || 0);
                        const totalPlatformFee = Math.abs(paymentFee + serviceFee + commissionFee + transFee + otherFee);
                        
                        // Thuế
                        const taxVAT = Number(row['Thuế GTGT'] || 0);
                        const taxPersonal = Number(row['Thuế TNCN'] || 0);
                        const totalTax = Math.abs(taxVAT + taxPersonal);
                        
                        // Ship Discrepancy
                        const shipBuyer = Number(row['Phí vận chuyển Người mua trả'] || 0);
                        const shipActual = Number(row['Phí vận chuyển thực tế'] || 0);
                        const shipDiff = shipBuyer - Math.abs(shipActual);
                        
                        const totalNet = Number(row['Tổng tiền đã thanh toán'] || row['Tổng số tiền được thanh toán'] || 0);
                        if(totalNet <= 0) continue;
                        
                        const existingTx = (transactionsData || []).find(t => String(t.note).includes(orderCode) && String(t.note).includes('Nhóm 1'));
                        if(existingTx) continue;

                        const baseTxId = 'TX_SHPINC_' + Date.now() + '_' + i;
                        const dStr = new Date(dateStr).toISOString().slice(0, 16).replace('T', ' ');

                        const noteLines = [
                            `[SHOPEE] Doanh thu đơn: ${orderCode}`,
                            `Nhóm 1 (Giá gốc): ${price.toLocaleString('vi-VN')}đ`,
                            `Nhóm 2 (Mã ưu đãi tự giảm): ${sellerVoucher.toLocaleString('vi-VN')}đ`,
                            `Nhóm 3 (Tổng phí sàn): -${totalPlatformFee.toLocaleString('vi-VN')}đ`,
                            `Nhóm 4 (Thuế): -${totalTax.toLocaleString('vi-VN')}đ`,
                            `Nhóm 5 (Chênh lệch Ship): ${shipDiff.toLocaleString('vi-VN')}đ`,
                            `=> THỰC NHẬN: ${totalNet.toLocaleString('vi-VN')}đ`
                        ].join('\n');

                        newTransactions.push({
                            id: baseTxId,
                            type: 'Thu',
                            category: 'Bán hàng (Nền tảng)',
                            amount: totalNet,
                            date: dStr,
                            title: `Doanh thu Shopee: ${orderCode}`,
                            note: noteLines,
                            fromAccount: '',
                            toAccount: walletAccId,
                            isAuto: true
                        });
                    }

                    if(newTransactions.length > 0) {
                        let payload = { Transactions: newTransactions };
                        if(!shopeeAcc) {
                            payload.Accounts = [{ id: walletAccId, accountName: 'Ví Shopee - Tự Động | Ngân hàng | --- | ---', balance: 0 }];
                        }
                        await pushDeltas(payload, `Đã import thành công doanh thu của ${newTransactions.length} đơn hàng!`, 'fa-check');
                    } else {
                        triggerToast('Không có dữ liệu mới để import (đã tồn tại hoặc file trống)', 'fa-info-circle', 'info');
                    }

                } catch (err) {
                    triggerToast('File không đúng định dạng Shopee Income', 'fa-exclamation-triangle', 'danger');
                }
                setIsImportingIncome(false);
                if(shopeeIncomeInputRef.current) shopeeIncomeInputRef.current.value = '';
            };
            reader.readAsBinaryString(file);
        } catch(err) {
            triggerToast('Lỗi đọc file', 'fa-times', 'danger');
            setIsImportingIncome(false);
        }
    };

                              const file = e.target.files[0];
                              if (!file) return;
                              const reader = new FileReader();
                              reader.onload = (evt) => {
                                  const img = new Image();
                                  img.onload = () => {
                                      const canvas = document.createElement('canvas');
                                      const MAX_WIDTH = 800;
                                      const scaleSize = MAX_WIDTH / img.width;
                                      canvas.width = MAX_WIDTH;
                                      canvas.height = img.height * scaleSize;
                                      const ctx = canvas.getContext('2d');
                                      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                      setTxForm({...txForm, proofImage: canvas.toDataURL('image/jpeg', 0.6)});
                                  };
                                  img.src = evt.target.result;
                              };
                              reader.readAsDataURL(file);

// -------------------------------------------------------------------------

const ReportMetricField = ({ label, field, value, isEditing, disabled, onChange, color, canView }) => (
    <div className={`p-3.5 rounded-xl border transition-all ${isEditing && !disabled ? 'bg-[#0a0a0a] border-[#333] hover:border-[#555]' : 'bg-[#0a0a0a]/50 border-transparent'}`}>
        <div className="text-[9px] font-black uppercase text-gray-500 mb-1.5 tracking-widest">{label}</div>
        {isEditing && !disabled ? (
            <input 
                type="number" 
                value={value || ''} 
                onChange={e => onChange(field, e.target.value)} 
                className={`w-full bg-transparent border-b border-[#444] focus:border-[#d4af37] outline-none text-[15px] font-black ${color} pb-1.5 transition-colors`} 
                placeholder="0" 
            />
        ) : (
            <div className={`text-[15px] font-black ${color} truncate`}>
                {canView ? Number(value || 0).toLocaleString('vi-VN') + 'đ' : '******'}
            </div>
        )}
    </div>
);

const BusinessReportTab = React.memo(function BusinessReportTab({ erpData, pushDeltas, triggerToast }) {
    const currentRole = localStorage.getItem('rf_role');
    const isBoss = currentRole === 'TỐI CAO';
    
    // 1. BẢO MẬT & PHÂN QUYỀN
    if (!isBoss) {
        return (
            <div className="flex flex-col items-center justify-center min-h-[65vh] text-center animate-fade-in p-6">
                <div className="relative mb-8 group">
                    <div className="absolute inset-0 bg-rose-600 rounded-full blur-[50px] opacity-20 group-hover:opacity-40 transition-opacity duration-700"></div>
                    <div className="w-28 h-28 rounded-full bg-black/80 border border-rose-500/30 flex items-center justify-center relative z-10 shadow-[0_0_40px_rgba(225,29,72,0.15)] backdrop-blur-xl">
                        <i className="fas fa-lock text-5xl text-rose-500 drop-shadow-[0_0_15px_rgba(225,29,72,0.8)]"></i>
                    </div>
                </div>
                <h2 className="text-3xl font-black text-rose-500 tracking-[0.25em] uppercase drop-shadow-[0_0_10px_rgba(225,29,72,0.5)] mb-4">Tuyệt Mật</h2>
                <div className="w-16 h-[2px] bg-rose-500/50 mb-5 mx-auto"></div>
                <p className="text-[13px] font-bold text-gray-400 max-w-md tracking-wide leading-relaxed">
                    Khu vực này chứa dữ liệu P&L sinh tử của doanh nghiệp.<br/><br/>Chỉ tài khoản mang đặc quyền <span className="text-rose-400 drop-shadow-[0_0_5px_rgba(225,29,72,0.8)]">TỐI CAO</span> mới được phép truy cập.
                </p>
            </div>
        );
    }

    const formatMoney = (val) => Number(val || 0).toLocaleString('vi-VN');
    const REPORT_CHANNELS = ['Shopee VN', 'Tiktok Shop', 'Bán Lẻ', 'Bán Sỉ', 'Cộng Tác Viên', 'Xuất Khẩu'];

    const [filter, setFilter] = React.useState('Tháng Này');
    const [localReports, setLocalReports] = React.useState({}); 
    const [editingReport, setEditingReport] = React.useState(null);
    const [reportForm, setReportForm] = React.useState({});

    React.useEffect(() => {
        if (erpData?.ProfitReports && erpData.ProfitReports.length > 0) {
            const serverMap = {};
            erpData.ProfitReports.forEach(r => { 
                if (r.period && r.channel) { 
                    serverMap[`PROFIT_${r.period}_${r.channel}`] = r; 
                } 
            });
            setLocalReports(prev => ({ ...serverMap, ...prev }));
        }
    }, [erpData?.ProfitReports]);

    const filterOptions = React.useMemo(() => ['Tháng Này', 'Tháng Trước', 'Năm Nay', 'Tất Cả'], []);
    const isCurrentMonth = filter === 'Tháng Này';

    // 2. HYBRID DATA ENGINE
    const getAggregatedReport = React.useCallback((channelName) => {
        let agg = { revenue: 0, orderCount: 0, platformFee: 0, returns: 0, discount: 0, ads: 0, cogs: 0, salary: 0, operation: 0 };
        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        const currentYear = today.getFullYear();

        const reportId = `PROFIT_${filter}_${channelName}`;
        // Lấy dữ liệu đã lưu (nếu có) để đắp vào các chỉ số thủ công (Ads, Cogs, PlatformFee,...)
        const saved = localReports[reportId] || (erpData?.ProfitReports || []).find(r => r.period === filter && r.channel === channelName) || {};
        
        agg.platformFee = Number(saved.platformFee || 0);
        agg.discount = Number(saved.discount || 0);
        agg.ads = Number(saved.ads || 0);
        agg.cogs = Number(saved.cogs || 0);
        agg.salary = Number(saved.salary || 0);
        agg.operation = Number(saved.operation || 0);

        // Quét Live từ Orders nếu là Tháng Này hoặc nếu báo cáo lịch sử chưa được Lưu (revenue = 0)
        let dynamicRev = 0, dynamicRet = 0, dynamicCount = 0;
        let shouldScanLive = isCurrentMonth || !saved.revenue;
        
        if (shouldScanLive) {
            const orders = erpData?.Orders || [];
            for (let i = 0; i < orders.length; i++) {
                const o = orders[i];
                const oDate = new Date(o.date || o.createdAt);
                if (isNaN(oDate.getTime())) continue;
                
                let isMatch = false;
                if (filter === 'Tháng Này') {
                    isMatch = oDate.getFullYear() === currentYear && (oDate.getMonth() + 1) === currentMonth;
                } else if (filter === 'Tháng Trước') {
                    let lastMonth = currentMonth - 1;
                    let lastYear = currentYear;
                    if (lastMonth === 0) { lastMonth = 12; lastYear -= 1; }
                    isMatch = oDate.getFullYear() === lastYear && (oDate.getMonth() + 1) === lastMonth;
                } else if (filter === 'Năm Nay') {
                    isMatch = oDate.getFullYear() === currentYear;
                } else {
                    isMatch = true; // Tất Cả
                }
                
                if (isMatch) {
                    let ch = String(o.channel || '').trim().toUpperCase();
                    let code = String(o.orderCode || '').toUpperCase();
                    let isForeign = false, rate = 1;
                    
                    if (ch.includes('SG') || code.includes('SG')) { isForeign = true; rate = 18700; }
                    else if (ch.includes('MY') || ch.includes('MA') || code.includes('MY')) { isForeign = true; rate = 5400; }
                    else if (ch.includes('TH') || code.includes('TH')) { isForeign = true; rate = 700; }
                    else if (ch.includes('PH') || code.includes('PH')) { isForeign = true; rate = 440; }
                    
                    let mappedChannel = 'Bán Lẻ';
                    if (isForeign || ch.includes('XUẤT KHẨU') || ch.includes('QUỐC TẾ')) mappedChannel = 'Xuất Khẩu';
                    else if (ch.includes('SHOPEE')) mappedChannel = 'Shopee VN';
                    else if (ch.includes('TIKTOK')) mappedChannel = 'Tiktok Shop';
                    else if (ch.includes('CỘNG TÁC VIÊN') || ch.includes('CTV')) mappedChannel = 'Cộng Tác Viên';
                    else if (ch.includes('BÁN SỈ') || ch.includes('SỈ') || ch.includes('SI')) mappedChannel = 'Bán Sỉ';
                    else if (REPORT_CHANNELS.includes(o.channel)) mappedChannel = o.channel;

                    if (mappedChannel === channelName) {
                        const status = String(o.status || '').toUpperCase();
                        const val = Number(o.revenue || 0) * rate;
                        if (status === 'ĐƠN HỦY' || status === 'ĐƠN HUỶ') { continue; }
                        else if (status === 'HÀNG HOÀN') { dynamicRet += val; }
                        else { dynamicRev += val; dynamicCount++; }
                    }
                }
            }
            agg.revenue = dynamicRev;
            agg.returns = dynamicRet;
            agg.orderCount = dynamicCount;
        } else {
            // Đã chốt sổ, lấy cứng từ dữ liệu đã lưu
            agg.revenue = Number(saved.revenue || 0);
            agg.returns = Number(saved.returns || 0);
            agg.orderCount = Number(saved.orderCount || 0);
        }

        return agg;
    }, [erpData?.ProfitReports, erpData?.Orders, filter, localReports, isCurrentMonth]);

    const profitData = React.useMemo(() => {
        let summary = { totalRev: 0, totalSalesExp: 0, totalGeneralExp: 0, netProfit: 0 };
        
        REPORT_CHANNELS.forEach(channel => {
            const data = getAggregatedReport(channel);
            summary.totalRev += data.revenue;
            summary.totalSalesExp += data.platformFee + data.returns + data.discount + data.ads;
        });
        
        const genData = getAggregatedReport('COMPANY_GENERAL');
        summary.totalGeneralExp = genData.cogs + genData.salary + genData.operation;
        summary.netProfit = summary.totalRev - summary.totalSalesExp - summary.totalGeneralExp;
        
        return summary;
    }, [getAggregatedReport]);

    const handleEditReport = (channel) => {
        const reportId = `PROFIT_${filter}_${channel}`;
        const saved = localReports[reportId] || {};
        const agg = getAggregatedReport(channel);
        setReportForm({ 
            revenue: agg.revenue || 0, 
            orderCount: agg.orderCount || 0, 
            platformFee: saved.platformFee || 0, 
            returns: agg.returns || 0, 
            discount: saved.discount || 0, 
            ads: saved.ads || 0, 
            cogs: saved.cogs || 0, 
            salary: saved.salary || 0, 
            operation: saved.operation || 0 
        });
        setEditingReport(channel);
    };

    const handleFormChange = React.useCallback((field, value) => { 
        setReportForm(prev => ({ ...prev, [field]: Number(value) || 0 })); 
    }, []);

    const handleSaveReport = async (channel) => {
        const reportId = `PROFIT_${filter}_${channel}`;
        try {
            const payload = { 
                id: reportId, 
                period: filter, 
                channel: channel, 
                ...reportForm, 
                updatedAt: new Date().toISOString() 
            };
            await pushDeltas({ ProfitReports: [payload] }, `Đã lưu ${channel}`, 'fa-save');
            setLocalReports(prev => ({ ...prev, [reportId]: payload }));
            setEditingReport(null); 
            triggerToast(`Đã lưu báo cáo ${channel} thành công!`, 'fa-check', 'success');
        } catch(e) { 
            triggerToast('Lỗi khi lưu báo cáo!', 'fa-times', 'danger'); 
        }
    };

    const getChannelIcon = (channel) => {
        if (channel.includes('Shopee')) return 'fa-shopping-bag text-[#ea580c]'; 
        if (channel === 'Tiktok Shop') return 'fa-music text-white';
        if (channel === 'Bán Lẻ') return 'fa-store text-[#3b82f6]'; 
        if (channel === 'Bán Sỉ') return 'fa-boxes text-[#d4af37]';
        if (channel === 'Cộng Tác Viên') return 'fa-users text-[#ec4899]'; 
        if (channel === 'Xuất Khẩu') return 'fa-globe-asia text-[#10b981]'; 
        return 'fa-tag text-gray-400';
    };

    return (
        <div className="space-y-6 animate-fade-in pb-12 w-full">
            {/* Filters */}
            <div className="flex gap-2.5 overflow-x-auto custom-scrollbar pb-2 pt-1">
                {filterOptions.map(p => (
                    <button key={p} onClick={() => { setFilter(p); setEditingReport(null); }} className={`whitespace-nowrap px-5 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-wider transition-all shadow-sm border ${filter === p ? 'bg-gradient-to-r from-zinc-800 to-black text-[#d4af37] border-white/20 shadow-[0_4px_15px_rgba(212,175,55,0.15)] drop-shadow-[0_0_2px_rgba(212,175,55,0.8)]' : 'bg-black/40 text-gray-500 border-white/5 hover:border-white/10 hover:text-white backdrop-blur-md'}`}>
                        {p}
                    </button>
                ))}
            </div>

            {/* 3. DASHBOARD UI/UX (Hero Metrics) */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-2">
                <div className="bg-[#09090b]/60 backdrop-blur-xl p-5 rounded-3xl border border-blue-500/20 shadow-[0_8px_32px_rgba(0,0,0,0.3)] relative overflow-hidden group">
                    <div className="absolute top-0 right-0 w-24 h-24 bg-blue-500/10 rounded-full blur-2xl -mr-10 -mt-10 group-hover:bg-blue-500/20 transition-all duration-500"></div>
                    <div className="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-2 opacity-90"><i className="fas fa-arrow-trend-up mr-2"></i>Tổng Doanh Thu</div>
                    <div className="text-[22px] lg:text-[26px] font-black text-white truncate drop-shadow-[0_0_5px_rgba(59,130,246,0.3)]">{formatMoney(profitData.totalRev)}</div>
                </div>
                
                <div className="bg-[#09090b]/60 backdrop-blur-xl p-5 rounded-3xl border border-amber-500/20 shadow-[0_8px_32px_rgba(0,0,0,0.3)] relative overflow-hidden group">
                    <div className="absolute top-0 right-0 w-24 h-24 bg-amber-500/10 rounded-full blur-2xl -mr-10 -mt-10 group-hover:bg-amber-500/20 transition-all duration-500"></div>
                    <div className="text-[10px] font-black text-amber-500 uppercase tracking-widest mb-2 opacity-90"><i className="fas fa-bullhorn mr-2"></i>Chi Phí Bán Hàng</div>
                    <div className="text-[22px] lg:text-[26px] font-black text-white truncate drop-shadow-[0_0_5px_rgba(245,158,11,0.3)]">{formatMoney(profitData.totalSalesExp)}</div>
                </div>
                
                <div className="bg-[#09090b]/60 backdrop-blur-xl p-5 rounded-3xl border border-rose-500/20 shadow-[0_8px_32px_rgba(0,0,0,0.3)] relative overflow-hidden group">
                    <div className="absolute top-0 right-0 w-24 h-24 bg-rose-500/10 rounded-full blur-2xl -mr-10 -mt-10 group-hover:bg-rose-500/20 transition-all duration-500"></div>
                    <div className="text-[10px] font-black text-rose-500 uppercase tracking-widest mb-2 opacity-90"><i className="fas fa-industry mr-2"></i>Chi Phí Hoạt Động</div>
                    <div className="text-[22px] lg:text-[26px] font-black text-white truncate drop-shadow-[0_0_5px_rgba(244,63,94,0.3)]">{formatMoney(profitData.totalGeneralExp)}</div>
                </div>
                
                <div className="bg-[#09090b]/80 backdrop-blur-xl p-5 rounded-3xl border border-emerald-500/30 shadow-[0_0_40px_rgba(16,185,129,0.15)] relative overflow-hidden group scale-[1.02] transform-gpu">
                    <div className="absolute inset-0 bg-emerald-500/5 group-hover:bg-emerald-500/10 transition-colors duration-500"></div>
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-emerald-500/20 rounded-full blur-3xl opacity-70 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>
                    <div className="relative z-10">
                        <div className="text-[11px] font-black text-emerald-400 uppercase tracking-[0.2em] mb-2"><i className="fas fa-gem mr-2"></i>Lợi Nhuận Ròng</div>
                        <div className={`text-[26px] lg:text-[30px] font-black truncate drop-shadow-[0_0_15px_rgba(16,185,129,0.5)] ${profitData.netProfit >= 0 ? 'text-emerald-400' : 'text-rose-500 drop-shadow-[0_0_15px_rgba(225,29,72,0.5)]'}`}>
                            {formatMoney(profitData.netProfit)}<span className="text-[14px] ml-1 opacity-70">đ</span>
                        </div>
                    </div>
                </div>
            </div>

            {/* Channels Breakdown */}
            <div className="flex items-center gap-3 mt-8 mb-5 pl-2">
                <i className="fas fa-layer-group text-[#d4af37]"></i>
                <span className="text-[13px] font-black text-gray-300 uppercase tracking-[0.15em] drop-shadow-md">Phân Tích Kênh Bán & Vận Hành ({filter})</span>
                <div className="h-[1px] flex-1 bg-gradient-to-r from-white/10 to-transparent ml-2"></div>
            </div>

            <div className="space-y-5">
                {REPORT_CHANNELS.map(channel => {
                    const isEditing = editingReport === channel; 
                    const reportId = `PROFIT_${filter}_${channel}`;
                    const data = isEditing ? reportForm : (localReports[reportId] || (erpData?.ProfitReports || []).find(r => r.period === filter && r.channel === channel) || {});
                    const channelGrossProfit = Number(data.revenue || 0) - (Number(data.platformFee || 0) + Number(data.returns || 0) + Number(data.discount || 0) + Number(data.ads || 0));
                    
                    return (
                        <div key={channel} className={`bg-[#09090b]/50 backdrop-blur-lg rounded-3xl border transition-all duration-300 p-5 lg:p-6 shadow-[0_8px_32px_rgba(0,0,0,0.2)] relative overflow-hidden group ${isEditing ? 'border-[#3b82f6]/50 shadow-[0_0_20px_rgba(59,130,246,0.15)]' : 'border-white/5 hover:border-white/15 hover:bg-black/60'}`}>
                            <div className="flex justify-between items-start sm:items-center flex-col sm:flex-row mb-5 pb-5 border-b border-white/10 gap-4 relative z-10">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-xl bg-black/60 border border-white/10 flex items-center justify-center shadow-inner group-hover:border-[#d4af37]/30 transition-colors">
                                        <i className={`fas ${getChannelIcon(channel)} text-[18px] drop-shadow-md`}></i>
                                    </div>
                                    <span className="font-black text-white text-[16px] uppercase tracking-wider drop-shadow-md">{channel}</span>
                                </div>
                                {isEditing ? (
                                    <div className="flex gap-2.5 flex-wrap w-full sm:w-auto justify-end">
                                        <button onClick={() => setEditingReport(null)} className="px-5 py-2.5 bg-white/5 hover:bg-white/10 text-gray-300 rounded-xl text-[11px] font-black uppercase tracking-wider border border-white/10 active:scale-95 transition-all backdrop-blur-sm">HỦY</button>
                                        <button onClick={() => handleSaveReport(channel)} className="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-[11px] font-black uppercase tracking-wider border border-blue-400/30 active:scale-95 transition-all flex items-center gap-2 shadow-[0_0_15px_rgba(37,99,235,0.4)]"><i className="fas fa-save"></i> LƯU SỐ LIỆU</button>
                                    </div>
                                ) : (
                                    <button onClick={() => handleEditReport(channel)} className="px-5 py-2.5 bg-[#d4af37]/10 text-[#d4af37] border border-[#d4af37]/30 rounded-xl text-[11px] font-black uppercase tracking-wider hover:bg-[#d4af37]/20 hover:shadow-[0_0_15px_rgba(212,175,55,0.2)] active:scale-95 transition-all flex items-center gap-2.5"><i className="fas fa-edit"></i> NHẬP SỐ LIỆU</button>
                                )}
                            </div>

                            <div className="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-6 relative z-10">
                                <ReportMetricField label="Doanh Thu" field="revenue" value={data.revenue} isEditing={isEditing} disabled={isCurrentMonth} onChange={handleFormChange} color="text-blue-400" canView={true} />
                                <ReportMetricField label="SL Đơn Hàng" field="orderCount" value={data.orderCount} isEditing={isEditing} disabled={isCurrentMonth} onChange={handleFormChange} color="text-zinc-200" canView={true} />
                                <ReportMetricField label="Phí Sàn" field="platformFee" value={data.platformFee} isEditing={isEditing} onChange={handleFormChange} color="text-rose-400" canView={true} />
                                <ReportMetricField label="Trả Hàng" field="returns" value={data.returns} isEditing={isEditing} disabled={isCurrentMonth} onChange={handleFormChange} color="text-rose-400" canView={true} />
                                <ReportMetricField label="Giảm Giá / Voucher" field="discount" value={data.discount} isEditing={isEditing} onChange={handleFormChange} color="text-amber-400" canView={true} />
                                <ReportMetricField label="Chi Phí ADS" field="ads" value={data.ads} isEditing={isEditing} onChange={handleFormChange} color="text-amber-400" canView={true} />
                            </div>

                            <div className={`rounded-2xl p-5 flex justify-between items-center transition-colors relative z-10 ${channelGrossProfit >= 0 ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-rose-500/10 border border-rose-500/20'}`}>
                                <span className={`text-[12px] font-black uppercase tracking-[0.2em] ${channelGrossProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>Lợi Nhuận Gộp Kênh</span>
                                <span className={`text-[22px] font-black drop-shadow-md ${channelGrossProfit >= 0 ? 'text-emerald-400' : 'text-rose-500'}`}>{formatMoney(channelGrossProfit)}<span className="text-[14px] opacity-70 ml-1">đ</span></span>
                            </div>
                        </div>
                    )
                })}
            </div>

            {/* Company General */}
            <div className="bg-[#09090b]/70 backdrop-blur-xl rounded-3xl border border-white/10 p-6 lg:p-8 mt-10 shadow-[0_8px_40px_rgba(0,0,0,0.5)] relative overflow-hidden group hover:border-[#d4af37]/30 transition-colors duration-500">
                <div className="absolute top-0 right-0 w-48 h-48 bg-zinc-800/50 rounded-full blur-[60px] -mr-16 -mt-16 group-hover:bg-[#d4af37]/10 transition-colors duration-700 pointer-events-none"></div>
                <div className="flex justify-between items-start sm:items-center flex-col sm:flex-row mb-6 pb-5 border-b border-white/10 gap-4 relative z-10">
                    <div className="flex items-center gap-4">
                        <div className="w-12 h-12 rounded-xl bg-black/60 border border-white/10 flex items-center justify-center shadow-inner group-hover:border-[#d4af37]/30 transition-colors">
                            <i className="fas fa-building text-[18px] text-gray-300 group-hover:text-[#d4af37] transition-colors drop-shadow-md"></i>
                        </div>
                        <span className="font-black text-white text-[16px] uppercase tracking-wider drop-shadow-md">Chi Phí Cố Định Công Ty</span>
                    </div>
                    {editingReport === 'COMPANY_GENERAL' ? (
                        <div className="flex gap-2.5 flex-wrap w-full sm:w-auto justify-end">
                            <button onClick={() => setEditingReport(null)} className="px-5 py-2.5 bg-white/5 hover:bg-white/10 text-gray-300 rounded-xl text-[11px] font-black uppercase tracking-wider border border-white/10 active:scale-95 transition-all backdrop-blur-sm">HỦY</button>
                            <button onClick={() => handleSaveReport('COMPANY_GENERAL')} className="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-[11px] font-black uppercase tracking-wider border border-emerald-400/30 active:scale-95 transition-all flex items-center gap-2 shadow-[0_0_15px_rgba(16,185,129,0.4)]"><i className="fas fa-save"></i> LƯU SỐ LIỆU</button>
                        </div>
                    ) : (
                        <button onClick={() => handleEditReport('COMPANY_GENERAL')} className="px-5 py-2.5 bg-white/10 text-white border border-white/20 rounded-xl text-[11px] font-black uppercase tracking-wider hover:bg-white/20 hover:shadow-[0_0_15px_rgba(255,255,255,0.1)] active:scale-95 transition-all flex items-center gap-2.5"><i className="fas fa-edit"></i> NHẬP SỐ LIỆU</button>
                    )}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-5 relative z-10">
                    {(() => {
                        const isEditing = editingReport === 'COMPANY_GENERAL'; 
                        const genId = `PROFIT_${filter}_COMPANY_GENERAL`;
                        const data = isEditing ? reportForm : (localReports[genId] || (erpData?.ProfitReports || []).find(r => r.period === filter && r.channel === 'COMPANY_GENERAL') || {});
                        return (
                            <>
                                <ReportMetricField label="Giá Vốn Hàng Bán (COGS)" field="cogs" value={data.cogs} isEditing={isEditing} onChange={handleFormChange} color="text-rose-400" canView={true} />
                                <ReportMetricField label="Quỹ Lương & Thưởng (Salary)" field="salary" value={data.salary} isEditing={isEditing} onChange={handleFormChange} color="text-purple-400" canView={true} />
                                <ReportMetricField label="Vận Hành, Mặt Bằng, Kho Bãi" field="operation" value={data.operation} isEditing={isEditing} onChange={handleFormChange} color="text-gray-400" canView={true} />
                            </>
                        );
                    })()}
                </div>
            </div>
        </div>
    );
});
</script>
