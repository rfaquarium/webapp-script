    const handleSaveTx = async (formData) => {
        const amt = Number(String(formData.amount).replace(/[^0-9]/g, ''));
        if (!amt || !formData.title?.trim()) {
            return triggerToast('Vui lòng điền đủ Số tiền và Tiêu đề!', 'fa-exclamation', 'warning');
        }
        if (formData.type !== 'Thu' && !formData.fromAccount) {
            return triggerToast('Vui lòng chọn Từ tài khoản!', 'fa-exclamation', 'warning');
        }
        if (formData.type !== 'Chi' && !formData.toAccount) {
            return triggerToast('Vui lòng chọn Đến tài khoản!', 'fa-exclamation', 'warning');
        }

        setIsSavingTx(true);
        try {
            const isEdit = !!formData.id;
            const oldTx = isEdit ? allTxs.find(t => t.id === formData.id) : null;

            const newTx = { 
                id: isEdit ? formData.id : 'TX_' + Date.now(), 
                type: formData.type, 
                category: formData.category, 
                amount: amt, 
                title: formData.title.trim(), 
                date: formData.date, 
                time: formData.time, 
                note: formData.note || '', 
                proofImage: formData.proofImage || null,
                fromAccount: formData.type !== 'Thu' ? formData.fromAccount : '',
                toAccount: formData.type !== 'Chi' ? formData.toAccount : '',
                isAuto: formData.isAuto || false
            };
            
            let payload = { Transactions: [newTx] };
            let updatedAccsMap = {};
            const getAcc = (id) => {
                if (!id) return null;
                let found = updatedAccsMap[id] || accountsData.find(a => a.id === id);
                return found ? { ...found } : null;
            };

            if (oldTx) {
                if (oldTx.fromAccount) { 
                    let acc = getAcc(oldTx.fromAccount); 
                    if (acc) { acc.balance = Number(acc.balance) + Number(oldTx.amount); updatedAccsMap[acc.id] = acc; } 
                }
                if (oldTx.toAccount) { 
                    let acc = getAcc(oldTx.toAccount); 
                    if (acc) { acc.balance = Number(acc.balance) - Number(oldTx.amount); updatedAccsMap[acc.id] = acc; } 
                }
            }

            if (newTx.fromAccount) { 
                let acc = getAcc(newTx.fromAccount); 
                if (acc) { acc.balance = Number(acc.balance) - Number(newTx.amount); updatedAccsMap[acc.id] = acc; } 
            }
            if (newTx.toAccount) { 
                let acc = getAcc(newTx.toAccount); 
                if (acc) { acc.balance = Number(acc.balance) + Number(newTx.amount); updatedAccsMap[acc.id] = acc; } 
            }

            payload.Accounts = Object.values(updatedAccsMap);

            if (isEdit) setLocalTxs(prev => prev.map(t => t.id === newTx.id ? newTx : t));
            else setLocalTxs(prev => [newTx, ...prev]);

            if (payload.Accounts.length > 0) {
                const newLocal = { ...localAccounts };
                payload.Accounts.forEach(u => newLocal[u.id] = u);
                setLocalAccounts(newLocal);
            }

            await pushDeltas(payload, isEdit ? `Đã cập nhật phiếu thành công!` : `Đã thêm giao dịch!`, 'fa-check-circle');
            setShowAddTx(false);
            setEditingTxData(null);
        } catch(e) {
            triggerToast('Lỗi khi lưu giao dịch!', 'fa-times', 'danger');
        } finally {
            setIsSavingTx(false);
        }
    };

    const handleDeleteTx = (t) => {
        if (!window.confirm('Xoá giao dịch này? Số dư tài khoản sẽ được hoàn lại tương ứng.')) return;
        
        let payload = { deletes: { Transactions: [t.id] }, Accounts: [] };
        let updatedAccsMap = {};
        const getAcc = (id) => {
            if (!id) return null;
            let found = updatedAccsMap[id] || accountsData.find(a => a.id === id);
            return found ? { ...found } : null;
        };

        if (t.fromAccount) { 
            let acc = getAcc(t.fromAccount); 
            if (acc) { acc.balance = Number(acc.balance) + Number(t.amount); updatedAccsMap[acc.id] = acc; } 
        }
        if (t.toAccount) { 
            let acc = getAcc(t.toAccount); 
            if (acc) { acc.balance = Number(acc.balance) - Number(t.amount); updatedAccsMap[acc.id] = acc; } 
        }
        payload.Accounts = Object.values(updatedAccsMap);
        
        if (payload.Accounts.length > 0) {
            const newLocal = { ...localAccounts };
            payload.Accounts.forEach(u => newLocal[u.id] = u);
            setLocalAccounts(newLocal);
        }
        setLocalTxs(prev => prev.filter(tx => tx.id !== t.id));

                </div>

                                        }`}
                                        title="Chọn hoặc bỏ chọn tất cả phiếu hiển thị"
                                    >
                                        <i className={`fas ${filteredTxs.slice(0, displayLimit).every(t => selectedTxIds.has(t.id)) && selectedTxIds.size > 0 ? 'fa-check-square text-zinc-950' : 'fa-square text-amber-400'} text-xs`}></i>

                                    <i className="fas fa-file-excel text-xs text-emerald-400"></i> Xuất Excel
                                </button>
                            </div>

                    <div className="space-y-2">

                                <i className="fas fa-receipt text-3xl mb-2 text-zinc-600 block"></i>
                                Không tìm thấy giao dịch nào phù hợp với bộ lọc
                            </div>
                        ) : (
                            filteredTxs.slice(0, displayLimit).map((t, index) => {
                                const isThu = t.type === 'Thu';
                                const isAdj = isAdjustmentTx(t);
                                const isSelected = selectedTxIds.has(t.id);
                                const fAcc = accountsData.find(a => a.id === t.fromAccount);
                                const tAcc = accountsData.find(a => a.id === t.toAccount);
                                let accDisplay = '';
                                const pFAcc = fAcc ? parseAccountInfo(fAcc) : null;
                                const pTAcc = tAcc ? parseAccountInfo(tAcc) : null;

                                if (t.type === 'Thu') {
                                    accDisplay = pTAcc ? pTAcc.name : (t.toAccount || 'N/A');
                                } else if (t.type === 'Chi') {
                                    accDisplay = pFAcc ? pFAcc.name : (t.fromAccount || 'N/A');
                                } else {
                                    accDisplay = `${pFAcc ? pFAcc.name : 'N/A'} ➔ ${pTAcc ? pTAcc.name : 'N/A'}`;
                                }

                                return (
                                    <div 
                                        key={t.id} 
                                        onClick={() => setViewingTxDetail(t)}
                                        className={`bg-[#121216] border ${
                                            isSelected 
                                                ? 'border-amber-500/70 bg-amber-950/15 shadow-[0_0_15px_rgba(245,158,11,0.12)]' 
                                                : 'border-zinc-800/80 hover:border-zinc-700'
                                        } p-3 rounded-2xl flex flex-col sm:flex-row justify-between sm:items-center shadow-sm relative overflow-hidden group gap-2.5 transition-all cursor-pointer`}
                                    >
                                        <div className={`absolute top-0 left-0 w-1 h-full ${
                                            isSelected ? 'bg-amber-400' : (isAdj ? 'bg-purple-500' : isThu ? 'bg-emerald-500' : t.type === 'Chuyển' ? 'bg-sky-500' : 'bg-rose-500')
                                        }`}></div>
                                        
                                        <div className="flex gap-2.5 items-start flex-1 min-w-0 pl-1.5">
                                            {/* Ô CHECKBOX CHỌN HÀNG LOẠT */}
                                            {canManageFinance && (
                                                <div 
                                                    onClick={(e) => handleToggleSelectTx(t.id, e)} 
                                                    className="pt-1.5 pr-0.5 flex items-center justify-center shrink-0"
                                                    title="Chọn phiếu để xoá hoặc phân bổ danh mục"
                                                >
                                                    <div className={`w-5 h-5 rounded-lg border flex items-center justify-center transition-all cursor-pointer ${
                                                        isSelected 
                                                            ? 'bg-amber-500 border-amber-400 text-zinc-950 shadow-sm' 
                                                            : 'border-zinc-700 bg-[#09090b] hover:border-amber-400/80 text-transparent'
                                                    }`}>
                                                        <i className="fas fa-check text-[9px] font-black"></i>
                                                    </div>
                                                </div>
                                            )}

                                            {t.proofImage ? (
                                                <div 
                                                    onClick={(e) => { e.stopPropagation(); setViewingProofImage(t.proofImage); }} 
                                                    className="w-11 h-11 rounded-xl overflow-hidden border border-zinc-700 shrink-0 cursor-pointer hover:border-amber-400 transition-colors relative"
                                                >
                                                    <img src={t.proofImage} className="w-full h-full object-cover" alt="Chứng từ" />
                                                </div>
                                            ) : (
                                                <div className="w-11 h-11 rounded-xl bg-[#09090b] border border-zinc-800 shrink-0 flex items-center justify-center">
                                                    <i className={`fas ${isAdj ? 'fa-sliders-h text-purple-400' : isThu ? 'fa-arrow-down text-emerald-400' : t.type === 'Chuyển' ? 'fa-exchange-alt text-sky-400' : 'fa-arrow-up text-rose-400'} text-sm`}></i>
                                                </div>
                                            )}
                                            
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-1.5 flex-wrap leading-tight">
                                                    <span className={`font-bold text-[12px] uppercase tracking-wide ${isAdj ? 'text-purple-300' : (t.category === 'Chờ Xử Lý' ? 'text-amber-400 font-black' : 'text-zinc-100')}`}>
                                                        {t.category || 'Chung'}
                                                    </span>
                                                    <span className="text-[10px] text-zinc-400 font-mono bg-[#09090b] px-1.5 py-0.2 rounded border border-zinc-800">
                                                        {String(t.date).slice(5, 10)} {t.time || ''}
                                                    </span>
                                                    {t.isAuto && (
                                                        <span className="bg-sky-950/40 text-sky-300 text-[9px] font-bold px-1.5 py-0.2 rounded border border-sky-500/30 uppercase">
                                                            Auto
                                                        </span>
                                                    )}
                                                    {t.isCleared && (
                                                        <span className="bg-emerald-950/40 text-emerald-300 text-[9px] font-bold px-1.5 py-0.2 rounded border border-emerald-500/30">
                                                            ✔ Đối Soát
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="text-[11px] text-zinc-300 font-bold truncate mt-0.5">{t.title}</div>
                                                <div className="flex items-center gap-2 mt-0.5 text-[10px] text-zinc-400">
                                                    <span className="text-sky-400 font-medium truncate"><i className="fas fa-university mr-1"></i>{accDisplay}</span>
                                                    {t.note && <span className="text-zinc-500 truncate" title={t.note}>- {t.note}</span>}
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="text-left sm:text-right shrink-0 pl-1.5 sm:pl-0 pt-1.5 sm:pt-0 border-t sm:border-t-0 border-zinc-800 flex sm:flex-col justify-between sm:justify-center items-center sm:items-end">
                                            <div className={`text-[15px] sm:text-[16px] font-mono font-black leading-none ${
                                                isAdj ? 'text-purple-400' : isThu ? 'text-emerald-400' : t.type === 'Chuyển' ? 'text-sky-400' : 'text-rose-400'
                                            }`}>
                                                {isThu ? '+' : t.type === 'Chuyển' ? '↔' : '-'}{secureMoney(t.amount)}đ
                                            </div>

                                            {txBalances[t.id] && (
                                                <div className="text-[10px] text-zinc-500 font-mono mt-1">
                                                    {t.type === 'Thu' && t.toAccount && <span>SD: <b className="text-amber-400">{secureMoney(txBalances[t.id].to)}</b></span>}
                                                    {t.type === 'Chi' && t.fromAccount && <span>SD: <b className="text-amber-400">{secureMoney(txBalances[t.id].from)}</b></span>}
                                                    {t.type === 'Chuyển' && (
                                                        <span>N: <b className="text-rose-400">{secureMoney(txBalances[t.id].from)}</b> | Đ: <b className="text-emerald-400">{secureMoney(txBalances[t.id].to)}</b></span>
                                                    )}
                                                </div>
                                            )}

                                            <div className="flex items-center gap-1.5 mt-1.5" onClick={e => e.stopPropagation()}>
                                                <button onClick={() => setViewingTxDetail(t)} className="w-6 h-6 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-sky-400 flex items-center justify-center transition-colors cursor-pointer" title="Xem chi tiết phiếu">
                                                    <i className="fas fa-eye text-[10px]"></i>
                                                </button>
                                                <button onClick={() => handlePrintK58(t)} className="w-6 h-6 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer" title="In phiếu">
                                                    <i className="fas fa-print text-[10px]"></i>
                                                </button>
                                                {canManageFinance && (
                                                    <>
                                                        <button onClick={() => { setEditingTxData(t); setShowAddTx(true); }} className="w-6 h-6 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 flex items-center justify-center transition-colors cursor-pointer" title="Sửa">
                                                            <i className="fas fa-pen text-[10px]"></i>
                                                        </button>
                                                        <button onClick={() => handleDeleteTx(t)} className="w-6 h-6 rounded-lg bg-zinc-900 hover:bg-rose-950/60 text-zinc-400 hover:text-rose-400 flex items-center justify-center transition-colors cursor-pointer" title="Xóa">
                                                            <i className="fas fa-trash text-[10px]"></i>
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                        {filteredTxs.length > displayLimit && (
                            <button 
                                onClick={() => setDisplayLimit(prev => prev + 50)} 
                                className="w-full py-2.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 text-[11px] font-bold uppercase rounded-xl border border-zinc-800 transition-colors cursor-pointer"
                            >
                                Xem thêm ({displayLimit} / {filteredTxs.length}) <i className="fas fa-chevron-down ml-1"></i>
                            </button>
                        )}
                    </div>

                    {/* FLOATING BATCH ACTION BAR */}
                    {canManageFinance && selectedTxIds.size > 0 && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[990] bg-[#121216]/95 border border-amber-500/50 rounded-2xl px-4 py-3 shadow-2xl backdrop-blur-xl flex items-center justify-between gap-3 max-w-[95vw] sm:max-w-xl w-full animate-slide-up">
                            <div className="flex items-center gap-2 min-w-0">
                                <span className="bg-amber-500 text-zinc-950 font-black text-[11px] px-2 py-0.5 rounded-lg shrink-0">
                                    {selectedTxIds.size}
                                </span>
                                <div className="text-[12px] font-bold text-zinc-200 truncate">
                                    Đã chọn: <span className="font-mono text-amber-300">{secureMoney(selectedTotalAmount)}đ</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                                <button 
                                    onClick={() => setShowBatchCategoryModal(true)} 
                                    className="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-[11px] uppercase rounded-xl flex items-center gap-1.5 transition-all shadow-sm cursor-pointer"
                                    title="Phân bổ danh mục cho tất cả các phiếu đã chọn"
                                >
                                    <i className="fas fa-tags text-xs"></i>
                                    <span className="hidden sm:inline">Phân Bổ</span> Danh Mục
                                </button>
                                <button 
                                    onClick={handleBatchDeleteTxs} 
                                    className="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-[11px] uppercase rounded-xl flex items-center gap-1.5 transition-all shadow-sm cursor-pointer"
                                    title="Xoá hàng loạt tất cả các phiếu đã chọn"
                                >
                                    <i className="fas fa-trash text-xs"></i>
                                    <span>Xoá ({selectedTxIds.size})</span>
                                </button>
                                <button 
                                    onClick={handleClearSelection} 
                                    className="w-7 h-7 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer shrink-0" 
                                    title="Bỏ chọn"
                                >
                                    <i className="fas fa-times text-xs"></i>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            )}

            {/* 5. SUB-TAB 2: QUẢN LÝ QUỸ (SO_QUY) */}
            {activeSubTab === 'SO_QUY' && (
                <div className="space-y-3 animate-fade-in w-full">
                    <div className="flex justify-between items-center px-1">
                        <h3 className="font-bold text-[13px] text-zinc-200 uppercase tracking-wider">Danh Sách Quỹ Doanh Nghiệp</h3>
                        {canManageFinance && (
                            <button 
                                onClick={() => { setEditingAccount(null); setShowAccountModal(true); }} 
                                className="bg-amber-500 hover:bg-amber-400 text-zinc-950 text-[11px] font-black px-3.5 py-1.5 rounded-xl shadow-sm transition-all cursor-pointer flex items-center gap-1.5"
                            >
                                <i className="fas fa-plus text-xs"></i>
                                <span>Thêm Quỹ Mới</span>
                            </button>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {accountsData.map(a => {
                            const parsed = parseAccountInfo(a);
                            const visuals = getBankVisuals(parsed.name, parsed.type);
                            return (
                                <div key={a.id} className="bg-[#121216] border border-zinc-800/80 p-4 rounded-2xl flex flex-col justify-between shadow-sm hover:border-zinc-700 transition-all">
                                    <div className="flex items-start justify-between mb-3">
                                        <div className={`w-11 h-11 rounded-xl ${visuals.bg} border ${visuals.border} flex items-center justify-center ${visuals.color} text-lg shrink-0`}>
                                            <i className={`fas ${visuals.icon}`}></i>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-[9px] font-bold text-zinc-400 uppercase tracking-wider block mb-0.5">Số Dư Sổ Sách</span>
                                            <span className="text-[16px] sm:text-[18px] font-mono font-black text-amber-300">{secureMoney(a.balance)}đ</span>
                                        </div>
                                    </div>
                                    <div className="mb-3">
                                        <h4 className="font-bold text-[14px] text-zinc-100 truncate mb-0.5">{parsed.name}</h4>
                                        {parsed.type !== 'Tiền mặt' ? (
                                            <div className="text-[11px] font-mono text-zinc-400">
                                                <span>STK: <b className="text-sky-400">{parsed.number || '---'}</b></span> · <span>Chủ: <b className="text-zinc-300">{parsed.owner || '---'}</b></span>
                                            </div>
                                        ) : (
                                            <span className="text-teal-400 text-[11px] font-bold">Quỹ Tiền Mặt (Két sắt)</span>
                                        )}
                                    </div>
                                    <div className="flex gap-2 items-center pt-3 border-t border-zinc-800">
                                        <button 
                                            onClick={() => setViewingAccountTxs(a)} 
                                            className={`flex-1 text-[11px] font-bold ${visuals.color} bg-zinc-900 hover:bg-zinc-800 px-3 py-1.5 rounded-xl border border-zinc-800 transition-all text-center cursor-pointer`}
                                        >
                                            <i className="fas fa-history mr-1"></i> Lịch Sử
                                        </button>
                                        {canManageFinance && (
                                            <>
                                                <button 
                                                    onClick={() => { setEditingAccount(a); setShowAccountModal(true); }} 
                                                    className="w-8 h-8 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 border border-zinc-800 flex items-center justify-center transition-colors cursor-pointer"
                                                >
                                                    <i className="fas fa-pencil-alt text-xs"></i>
                                                </button>
                                                {isAdmin && (
                                                    <button 
                                                        onClick={() => { 
                                                            if (window.confirm(`Xoá vĩnh viễn quỹ [${parsed.name}]?`)) {
                                                                pushDeltas({ deletes: { Accounts: [a.id] } });
                                                            } 
                                                        }} 
                                                        className="w-8 h-8 rounded-xl bg-zinc-900 hover:bg-rose-950/60 text-zinc-400 hover:text-rose-400 border border-zinc-800 flex items-center justify-center transition-colors cursor-pointer"
                                                    >
                                                        <i className="fas fa-trash text-xs"></i>
                                                    </button>
                                                )}
                                            </>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            )}

            {/* 6. SUB-TAB 3: THỐNG KÊ CƠ CẤU (THONG_KE) */}
            {activeSubTab === 'THONG_KE' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 animate-fade-in">
                    {/* Tỷ trọng Thu */}
                    <div className="bg-[#121216] border border-zinc-800/80 rounded-2xl p-4 shadow-sm">
                        <div className="text-[12px] font-bold text-emerald-400 uppercase tracking-wider mb-3 border-b border-zinc-800 pb-2 flex items-center gap-2">
                            <i className="fas fa-arrow-down"></i> Tỷ Trọng Tiền Thu ({filterTime})
                        </div>
                        <div className="space-y-2">
                            {(() => {
                                let catThu = {};
                                basePeriodTxs.filter(t => t.type === 'Thu' && !isAdjustmentTx(t)).forEach(t => {
                                    catThu[t.category || 'Khác'] = (catThu[t.category || 'Khác'] || 0) + Number(t.amount || 0);
                                });
                                const entries = Object.entries(catThu).sort((a, b) => b[1] - a[1]);
                                if (entries.length === 0) return <div className="text-zinc-500 text-[11px] italic">Không có dữ liệu thu</div>;
                                return entries.map(([cat, val]) => (
                                    <div key={cat} className="flex justify-between items-center text-[12px]">
                                        <span className="text-zinc-300 font-medium">{cat}</span>
                                        <div className="flex items-center gap-2">
                                            <span className="text-emerald-400 font-mono font-bold">{secureMoney(val)}đ</span>
                                            <span className="text-[10px] text-zinc-400 bg-[#09090b] px-1.5 py-0.5 rounded border border-zinc-800 font-mono">
                                                {totalThu > 0 ? ((val / totalThu) * 100).toFixed(0) : 0}%
                                            </span>
                                        </div>
                                    </div>
                                ));
                            })()}
                        </div>
                    </div>

                    {/* Tỷ trọng Chi */}
                    <div className="bg-[#121216] border border-zinc-800/80 rounded-2xl p-4 shadow-sm">
                        <div className="text-[12px] font-bold text-rose-400 uppercase tracking-wider mb-3 border-b border-zinc-800 pb-2 flex items-center gap-2">
                            <i className="fas fa-arrow-up"></i> Tỷ Trọng Tiền Chi ({filterTime})
                        </div>
                        <div className="space-y-2">
                            {(() => {
                                let catChi = {};
                                basePeriodTxs.filter(t => t.type === 'Chi' && !isAdjustmentTx(t)).forEach(t => {
                                    catChi[t.category || 'Khác'] = (catChi[t.category || 'Khác'] || 0) + Number(t.amount || 0);
                                });
                                const entries = Object.entries(catChi).sort((a, b) => b[1] - a[1]);
                                if (entries.length === 0) return <div className="text-zinc-500 text-[11px] italic">Không có dữ liệu chi</div>;
                                return entries.map(([cat, val]) => (
                                    <div key={cat} className="flex justify-between items-center text-[12px]">
                                        <span className="text-zinc-300 font-medium">{cat}</span>
                                        <div className="flex items-center gap-2">
                                            <span className="text-rose-400 font-mono font-bold">{secureMoney(val)}đ</span>
                                            <span className="text-[10px] text-zinc-400 bg-[#09090b] px-1.5 py-0.5 rounded border border-zinc-800 font-mono">
                                                {totalChi > 0 ? ((val / totalChi) * 100).toFixed(0) : 0}%
                                            </span>
                                        </div>
                                    </div>
                                ));
                            })()}
                        </div>
                    </div>
                </div>
            )}

            {/* MODALS */}
            {viewingTxDetail && (
                <TransactionDetailModal 
                    tx={viewingTxDetail} 
                    accountsData={accountsData} 
                    onClose={() => setViewingTxDetail(null)} 
                    onEdit={(t) => { setEditingTxData(t); setShowAddTx(true); }} 
                    onDelete={handleDeleteTx} 
                    onPrint={handlePrintK58} 
                    secureMoney={secureMoney} 
                    canManageFinance={canManageFinance} 
                />
            )}
            {showAddTx && (
                <TransactionFormModal 
                    initialData={editingTxData} 
                    categories={categories} 
                    accountsData={accountsData} 
                    onClose={() => { setShowAddTx(false); setEditingTxData(null); }} 
                    onSave={handleSaveTx} 
                    isSaving={isSavingTx} 
                />
            )}
            {showImportScanner && (
                <ImportStatementModal 
                    categories={categories} 
                    erpData={erpData} 
                    onClose={() => setShowImportScanner(false)} 
                    pushDeltas={pushDeltas} 
                    triggerToast={triggerToast} 
                />
            )}
            {showShopeeWalletScanner && (
                <ShopeeWalletScannerModal 
                    categories={categories} 
                    erpData={erpData} 
                    onClose={() => setShowShopeeWalletScanner(false)} 
                    pushDeltas={pushDeltas} 
                    triggerToast={triggerToast} 
                    accountsData={accountsData} 
                />
            )}
            {showReceiptScanner && (
                <ReceiptScannerModal 
                    accountsData={accountsData} 
                    onClose={() => setShowReceiptScanner(false)} 
                    triggerToast={triggerToast} 
                    onComplete={handleReceiptScanned} 
                />
            )}
            {viewingProofImage && (
                <ProofViewerModal 
                    imageUrl={viewingProofImage} 
                    onClose={() => setViewingProofImage(null)} 
                />
            )}
            {showBatchCategoryModal && (
                <BatchCategoryModal 
                    selectedCount={selectedTxIds.size} 
                    categories={categories} 
                    onClose={() => setShowBatchCategoryModal(false)} 
                    onApply={handleBatchAssignCategory} 
                />
            )}
            {showAccountModal && (
                <AccountModal 
                    initialData={editingAccount} 
                    onClose={() => { setShowAccountModal(false); setEditingAccount(null); }} 
                    onSubmit={handleSaveAccount} 
                />
            )}
            {viewingAccountTxs && (
                <AccountHistoryModal 
                    account={viewingAccountTxs} 
                    allTxs={allTxs} 
                    onClose={() => setViewingAccountTxs(null)} 
                    secureMoney={secureMoney} 
                    canManageFinance={canManageFinance} 
                    onDeleteTx={handleDeleteTx} 
                />
            )}
        </div>
    );
});

// -------------------------------------------------------------------------
// 4. MAIN TAB: BusinessReportTab (BÁO CÁO DOANH THU & P&L TOÀN DOANH NGHIỆP)
// -------------------------------------------------------------------------

const ReportMetricField = React.memo(({ label, field, value, isEditing, disabled, onChange, color, canView = true }) => (
    <div className={`p-3 rounded-xl border transition-all ${
        isEditing && !disabled ? 'bg-[#09090b] border-zinc-700' : 'bg-[#09090b]/60 border-zinc-800/80'
    }`}>
        <div className="text-[10px] font-bold uppercase text-zinc-400 mb-1 tracking-wider">{label}</div>
        {isEditing && !disabled ? (
            <input 
                type="number" 
                value={value === 0 ? '' : value} 
                onChange={e => onChange(field, e.target.value)} 
                className={`w-full bg-transparent border-b border-zinc-700 focus:border-amber-400 outline-none text-[15px] font-mono font-black ${color} pb-1 transition-colors`} 
                placeholder="0" 
            />
        ) : (
            <div className={`text-[15px] font-mono font-black ${color} truncate`}>
                {field === 'orderCount' ? (value || 0) : (canView ? formatFinanceMoney(value) + 'đ' : '******')}
            </div>
        )}
    </div>
));

const BusinessReportTab = React.memo(function BusinessReportTab({ erpData, pushDeltas, triggerToast }) {
    const currentRole = localStorage.getItem('rf_role');
    const isBoss = currentRole === 'TỐI CAO' || localStorage.getItem('rf_boss') === 'true';
    
    // Bảo mật phân quyền tuyệt đối
    if (!isBoss) {
        return (
            <div className="flex flex-col items-center justify-center min-h-[60vh] text-center animate-fade-in p-6">
                <div className="w-20 h-20 rounded-2xl bg-rose-950/40 border border-rose-500/30 flex items-center justify-center mb-4">
                    <i className="fas fa-lock text-3xl text-rose-400"></i>
                </div>
                <h2 className="text-xl font-bold text-rose-400 uppercase tracking-widest mb-2">Khu Vực Tuyệt Mật</h2>
                <p className="text-[12px] font-medium text-zinc-400 max-w-sm leading-relaxed">
                    Báo cáo P&L Kết Quả Kinh Doanh chỉ dành riêng cho quyền quản trị <b className="text-rose-400">TỐI CAO</b>.
                </p>
            </div>
        );
    }

    const REPORT_CHANNELS = ['Shopee VN', 'Tiktok Shop', 'Bán Lẻ', 'Bán Sỉ', 'Cộng Tác Viên', 'Xuất Khẩu'];

    // Dynamic Periods list
    const filterOptions = React.useMemo(() => {
        const currentM = new Date().getMonth() + 1;
        const baseMonths = [];
        for (let m = currentM; m >= 1; m--) {
            baseMonths.push(`Tháng ${m}`);
        }

        const dbPeriods = (erpData?.ProfitReports || [])
            .map(r => String(r.period || '').trim())
            .filter(p => p && p !== 'Năm Nay' && p !== 'Tất Cả');

        const allMonthsSet = new Set([...baseMonths, ...dbPeriods]);
        const sortedMonths = Array.from(allMonthsSet).sort((a, b) => {
            const numA = parseInt(a.replace(/\D/g, '')) || 0;
            const numB = parseInt(b.replace(/\D/g, '')) || 0;
            return numB - numA;
        });

        return [...sortedMonths, 'Năm Nay', 'Tất Cả'];
    }, [erpData?.ProfitReports]);

    const [filter, setFilter] = React.useState(() => `Tháng ${new Date().getMonth() + 1}`);
    const [localReports, setLocalReports] = React.useState({}); 
    const [editingReport, setEditingReport] = React.useState(null);
    const [reportForm, setReportForm] = React.useState({});

    React.useEffect(() => {
        if (erpData?.ProfitReports?.length > 0) {
            const serverMap = {};
            erpData.ProfitReports.forEach(r => { 
                if (r.period && r.channel) { 
                    serverMap[`PROFIT_${r.period}_${r.channel}`] = r; 
                } 
            });
            setLocalReports(prev => ({ ...serverMap, ...prev }));
        }
    }, [erpData?.ProfitReports]);

    // Aggregate report logic
    const getAggregatedReport = React.useCallback((channelName) => {
        let agg = { revenue: 0, orderCount: 0, platformFee: 0, returns: 0, discount: 0, ads: 0, cogs: 0, salary: 0, operation: 0 };
        const currentYear = new Date().getFullYear();
        const reportId = `PROFIT_${filter}_${channelName}`;
        
        const saved = localReports[reportId] || (erpData?.ProfitReports || []).find(r => 
            (String(r.period || '').trim() === String(filter || '').trim() && String(r.channel || '').trim() === String(channelName || '').trim()) || 
            String(r.id || '').trim() === reportId
        ) || {};

        const hasSavedData = saved && (
            Number(saved.revenue || 0) > 0 || 
            Number(saved.orderCount || 0) > 0 || 
            Number(saved.cogs || 0) > 0 || 
            Number(saved.platformFee || 0) > 0 ||
            Number(saved.salary || 0) > 0 ||
            Number(saved.operation || 0) > 0 ||
            Number(saved.ads || 0) > 0 ||
            Number(saved.discount || 0) > 0 ||
            Number(saved.returns || 0) > 0
        );

        if (hasSavedData) {
            agg.revenue = Number(saved.revenue || 0);
            agg.orderCount = Number(saved.orderCount || 0);
            agg.platformFee = Number(saved.platformFee || 0);
            agg.returns = Number(saved.returns || 0);
            agg.discount = Number(saved.discount || 0);
            agg.ads = Number(saved.ads || 0);
            agg.cogs = Number(saved.cogs || 0);
            agg.salary = Number(saved.salary || 0);
            agg.operation = Number(saved.operation || 0);
            return agg;
        }

        if (channelName === 'COMPANY_GENERAL') {
            agg.cogs = Number(saved.cogs || 0);
            agg.salary = Number(saved.salary || 0);
            agg.operation = Number(saved.operation || 0);
            return agg;
        }

        // Fallback: Calculate from Orders
        let dynamicRev = 0, dynamicRet = 0, dynamicCount = 0;
        const orders = erpData?.Orders || [];

        let filterMonthNum = null;
        if (filter.startsWith('Tháng')) {
            const mMatch = filter.match(/\d+/);
            if (mMatch) filterMonthNum = parseInt(mMatch[0], 10);
        }

        for (let i = 0; i < orders.length; i++) {
            const o = orders[i];
            const rawCh = String(o.channel || '').trim();
            if (rawCh === 'Sản Xuất Tồn' || rawCh === 'Sản Xuất Bù Kho') continue;

            const oDate = new Date(o.date || o.createdAt);
            if (isNaN(oDate.getTime())) continue;

            let isMatch = false;
            if (filterMonthNum !== null) {
                isMatch = (oDate.getMonth() + 1) === filterMonthNum && oDate.getFullYear() === currentYear;
            } else if (filter === 'Năm Nay') {
                isMatch = oDate.getFullYear() === currentYear;
            } else {
                isMatch = true;
            }

            if (isMatch) {
                let ch = String(o.channel || '').trim().toUpperCase();
                let rate = 1;
                let rawVal = Number(String(o.revenue || 0).replace(/[^\d.]/g, '')) || 0;
                if (rawVal > 100000000 && Number.isInteger(rawVal)) rawVal = 0;

                if (ch.includes('USD') && rawVal < 10000) rate = 25500;

                let mappedChannel = 'Bán Lẻ';
                if (ch.includes('XUẤT KHẨU') || ch.includes('USD')) mappedChannel = 'Xuất Khẩu';
                else if (ch.includes('SHOPEE')) mappedChannel = 'Shopee VN';
                else if (ch.includes('TIKTOK')) mappedChannel = 'Tiktok Shop';
                else if (ch.includes('CỘNG TÁC VIÊN') || ch.includes('CTV')) mappedChannel = 'Cộng Tác Viên';
                else if (ch.includes('BÁN SỈ') || ch.includes('SỈ')) mappedChannel = 'Bán Sỉ';
                else if (REPORT_CHANNELS.includes(o.channel)) mappedChannel = o.channel;

                if (mappedChannel === channelName) {
                    const status = String(o.status || '').toUpperCase();
                    const val = Math.round(rawVal * rate);
                    if (status === 'ĐƠN HỦY' || status === 'ĐƠN HUỶ') continue;
                    else if (status === 'HÀNG HOÀN') dynamicRet += val;
                    else { dynamicRev += val; dynamicCount++; }
                }
            }
        }

        agg.revenue = dynamicRev;
        agg.returns = dynamicRet;
        agg.orderCount = dynamicCount;
        agg.platformFee = Number(saved.platformFee || 0);
        agg.discount = Number(saved.discount || 0);
        agg.ads = Number(saved.ads || 0);
        agg.cogs = Number(saved.cogs || 0);
        agg.salary = Number(saved.salary || 0);
        agg.operation = Number(saved.operation || 0);

        return agg;
    }, [erpData?.ProfitReports, erpData?.Orders, filter, localReports]);

    const profitData = React.useMemo(() => {
        let summary = { totalRev: 0, totalSalesExp: 0, totalGeneralExp: 0, netProfit: 0 };
        
        REPORT_CHANNELS.forEach(channel => {
            const data = getAggregatedReport(channel);
            summary.totalRev += data.revenue;
            summary.totalSalesExp += (data.platformFee + data.returns + data.discount + data.ads);
        });
        
        const genData = getAggregatedReport('COMPANY_GENERAL');
        summary.totalGeneralExp = genData.cogs + genData.salary + genData.operation;
        summary.netProfit = summary.totalRev - summary.totalSalesExp - summary.totalGeneralExp;
        
        return summary;
    }, [getAggregatedReport]);

    const handleEditReport = (channel) => {
        const reportId = `PROFIT_${filter}_${channel}`;
        const saved = localReports[reportId] || (erpData?.ProfitReports || []).find(r => 
            (String(r.period || '').trim() === String(filter || '').trim() && String(r.channel || '').trim() === String(channel || '').trim()) || 
            String(r.id || '').trim() === reportId
        ) || {};
        const agg = getAggregatedReport(channel);
        setReportForm({ 
            revenue: agg.revenue || 0, 
            orderCount: agg.orderCount || 0, 
            platformFee: saved.platformFee || agg.platformFee || 0, 
            returns: agg.returns || 0, 
            discount: saved.discount || agg.discount || 0, 
            ads: saved.ads || agg.ads || 0, 
            cogs: saved.cogs || agg.cogs || 0, 
            salary: saved.salary || agg.salary || 0, 
            operation: saved.operation || agg.operation || 0 
        });
        setEditingReport(channel);
    };

    const handleFormChange = React.useCallback((field, value) => { 
        setReportForm(prev => ({ ...prev, [field]: Number(value) || 0 })); 
    }, []);

    const handleSaveReport = async (channel) => {
        const reportId = `PROFIT_${filter}_${channel}`;
        try {
            const payload = { 
                id: reportId, 
                period: filter, 
                channel: channel, 
                ...reportForm, 
                updatedAt: new Date().toISOString() 
            };
            await pushDeltas({ ProfitReports: [payload] }, `Đã lưu báo cáo ${channel} (${filter})`, 'fa-save');
            setLocalReports(prev => ({ ...prev, [reportId]: payload }));
            setEditingReport(null); 
            triggerToast(`Đã lưu báo cáo ${channel} (${filter}) thành công!`, 'fa-check', 'success');
        } catch(e) { 
            triggerToast('Lỗi khi lưu báo cáo!', 'fa-times', 'danger'); 
        }
    };

    return (
        <div className="space-y-4 animate-fade-in pb-12 w-full">
            {/* 1. Thanh Lọc Kỳ Báo Cáo */}
            <div className="flex gap-2 overflow-x-auto custom-scrollbar no-scrollbar py-1">
                {filterOptions.map(p => (
                    <button 
                        key={p} 
                        onClick={() => { setFilter(p); setEditingReport(null); }} 
                        className={`whitespace-nowrap px-4 py-2 rounded-xl text-[11px] font-bold uppercase transition-all border cursor-pointer ${
                            filter === p 
                                ? 'bg-amber-500 text-zinc-950 font-black border-amber-500 shadow-sm' 
                                : 'bg-[#121216] text-zinc-400 hover:text-zinc-200 border-zinc-800'
                        }`}
                    >
                        {p}
                    </button>
                ))}
            </div>

            {/* 2. DASHBOARD P&L HERO CARDS */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                <div className="bg-[#121216] border border-zinc-800/80 p-3.5 rounded-2xl shadow-sm">
                    <span className="text-[10px] font-bold text-sky-400 uppercase tracking-wider block mb-1">Tổng Doanh Thu</span>
                    <span className="text-[18px] sm:text-[20px] font-mono font-black text-white">{formatFinanceMoney(profitData.totalRev)}đ</span>
                </div>
                
                <div className="bg-[#121216] border border-zinc-800/80 p-3.5 rounded-2xl shadow-sm">
                    <span className="text-[10px] font-bold text-amber-400 uppercase tracking-wider block mb-1">Chi Phí Bán Hàng</span>
                    <span className="text-[18px] sm:text-[20px] font-mono font-black text-amber-400">{formatFinanceMoney(profitData.totalSalesExp)}đ</span>
                </div>
                
                <div className="bg-[#121216] border border-zinc-800/80 p-3.5 rounded-2xl shadow-sm">
                    <span className="text-[10px] font-bold text-rose-400 uppercase tracking-wider block mb-1">Chi Phí Vận Hành</span>
                    <span className="text-[18px] sm:text-[20px] font-mono font-black text-rose-400">{formatFinanceMoney(profitData.totalGeneralExp)}đ</span>
                </div>
                
                <div className="bg-[#121216] border border-emerald-500/30 p-3.5 rounded-2xl shadow-sm bg-emerald-950/10">
                    <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider block mb-1">Lợi Nhuận Ròng (P&L)</span>
                    <span className={`text-[20px] sm:text-[22px] font-mono font-black ${profitData.netProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {formatFinanceMoney(profitData.netProfit)}đ
                    </span>
                </div>
            </div>

            {/* 3. PHÂN TÍCH KÊNH BÁN HÀNG */}
            <div className="space-y-3 pt-2">
                <div className="flex items-center gap-2 px-1">
                    <i className="fas fa-layer-group text-amber-400 text-xs"></i>
                    <h3 className="font-bold text-[13px] text-zinc-200 uppercase tracking-wider">Phân Tích Kênh Bán Hàng ({filter})</h3>
                </div>

                <div className="space-y-3">
                    {REPORT_CHANNELS.map(channel => {
                        const isEditing = editingReport === channel; 
                        const data = isEditing ? reportForm : getAggregatedReport(channel);
                        const channelGrossProfit = Number(data.revenue || 0) - (Number(data.platformFee || 0) + Number(data.returns || 0) + Number(data.discount || 0) + Number(data.ads || 0));
                        
                        return (
                            <div key={channel} className="bg-[#121216] rounded-2xl border border-zinc-800/80 p-4 shadow-sm">
                                <div className="flex justify-between items-center mb-3 pb-3 border-b border-zinc-800 gap-3">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-8 h-8 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-amber-400 text-sm">
                                            <i className="fas fa-store"></i>
                                        </div>
                                        <span className="font-bold text-zinc-100 text-[14px] uppercase">{channel}</span>
                                    </div>
                                    {isEditing ? (
                                        <div className="flex gap-2">
                                            <button onClick={() => setEditingReport(null)} className="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-[11px] font-bold uppercase transition-all cursor-pointer">
                                                Hủy
                                            </button>
                                            <button onClick={() => handleSaveReport(channel)} className="px-4 py-1.5 bg-sky-600 hover:bg-sky-500 text-zinc-950 rounded-xl text-[11px] font-black uppercase transition-all flex items-center gap-1.5 cursor-pointer shadow-sm">
                                                <i className="fas fa-save text-xs"></i> Lưu
                                            </button>
                                        </div>
                                    ) : (
                                        <button onClick={() => handleEditReport(channel)} className="px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-amber-400 border border-amber-500/30 rounded-xl text-[11px] font-bold uppercase transition-all flex items-center gap-1.5 cursor-pointer">
                                            <i className="fas fa-pencil-alt text-xs"></i> Nhập Số Liệu
                                        </button>
                                    )}
                                </div>

                                <div className="grid grid-cols-2 lg:grid-cols-3 gap-2 mb-3">
                                    <ReportMetricField label="Doanh Thu" field="revenue" value={data.revenue} isEditing={isEditing} onChange={handleFormChange} color="text-sky-400" />
                                    <ReportMetricField label="SL Đơn Hàng" field="orderCount" value={data.orderCount} isEditing={isEditing} onChange={handleFormChange} color="text-zinc-200" />
                                    <ReportMetricField label="Phí Sàn" field="platformFee" value={data.platformFee} isEditing={isEditing} onChange={handleFormChange} color="text-rose-400" />
                                    <ReportMetricField label="Trả Hàng" field="returns" value={data.returns} isEditing={isEditing} onChange={handleFormChange} color="text-rose-400" />
                                    <ReportMetricField label="Voucher / Giảm Giá" field="discount" value={data.discount} isEditing={isEditing} onChange={handleFormChange} color="text-amber-400" />
                                    <ReportMetricField label="Chi Phí ADS" field="ads" value={data.ads} isEditing={isEditing} onChange={handleFormChange} color="text-amber-400" />
                                </div>

                                <div className="rounded-xl p-3 flex justify-between items-center bg-[#09090b] border border-zinc-800">
                                    <span className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider">Lợi Nhuận Gộp Kênh:</span>
                                    <span className={`text-[16px] font-mono font-black ${channelGrossProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                        {formatFinanceMoney(channelGrossProfit)}đ
                                    </span>
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>

            {/* 4. CHI PHÍ CỐ ĐỊNH CÔNG TY */}
            <div className="bg-[#121216] rounded-2xl border border-zinc-800/80 p-4 shadow-sm mt-4">
                <div className="flex justify-between items-center mb-3 pb-3 border-b border-zinc-800 gap-3">
                    <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-amber-400 text-sm">
                            <i className="fas fa-building"></i>
                        </div>
                        <span className="font-bold text-zinc-100 text-[14px] uppercase">Chi Phí Cố Định Công Ty ({filter})</span>
                    </div>
                    {editingReport === 'COMPANY_GENERAL' ? (
                        <div className="flex gap-2">
                            <button onClick={() => setEditingReport(null)} className="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-[11px] font-bold uppercase transition-all cursor-pointer">
                                Hủy
                            </button>
                            <button onClick={() => handleSaveReport('COMPANY_GENERAL')} className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-zinc-950 rounded-xl text-[11px] font-black uppercase transition-all flex items-center gap-1.5 cursor-pointer shadow-sm">
                                <i className="fas fa-save text-xs"></i> Lưu
                            </button>
                        </div>
                    ) : (
                        <button onClick={() => handleEditReport('COMPANY_GENERAL')} className="px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-amber-400 border border-amber-500/30 rounded-xl text-[11px] font-bold uppercase transition-all flex items-center gap-1.5 cursor-pointer">
                            <i className="fas fa-pencil-alt text-xs"></i> Nhập Số Liệu
                        </button>
                    )}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                    {(() => {
                        const isEditing = editingReport === 'COMPANY_GENERAL'; 
                        const data = isEditing ? reportForm : getAggregatedReport('COMPANY_GENERAL');
                        return (
                            <>
                                <ReportMetricField label="Giá Vốn Hàng Bán (COGS)" field="cogs" value={data.cogs} isEditing={isEditing} onChange={handleFormChange} color="text-rose-400" />
                                <ReportMetricField label="Quỹ Lương & Thưởng (Salary)" field="salary" value={data.salary} isEditing={isEditing} onChange={handleFormChange} color="text-purple-400" />
                                <ReportMetricField label="Vận Hành, Mặt Bằng, Kho Bãi" field="operation" value={data.operation} isEditing={isEditing} onChange={handleFormChange} color="text-zinc-400" />
                            </>
                        );
                    })()}
                </div>
            </div>
        </div>
    );
});
</script>
