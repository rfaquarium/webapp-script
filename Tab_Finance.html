<script type="text/babel">
// =========================================================================
// 💰 MODULE: TÀI CHÍNH & SỔ QUỸ DOANH NGHIỆP (Tab_Finance.html)
// Clean Fintech Architecture · Pure Functions · Anti-AI-Slop · High Performance
// =========================================================================

// -------------------------------------------------------------------------
// 1. PURE FUNCTIONS & UTILITIES
// -------------------------------------------------------------------------

/**
 * Format số tiền chuẩn VNĐ
 */
const formatFinanceMoney = (val) => {
    if (val === null || val === undefined || isNaN(Number(val))) return '0';
    return Math.round(Number(val)).toLocaleString('vi-VN');
};

/**
 * Parse thông tin quỹ / tài khoản từ chuỗi chuẩn hóa "Tên | Loại | STK | Chủ TK"
 */
const parseAccountInfo = (acc) => {
    if (!acc) return { id: '', name: 'Chưa xác định', type: 'Ngân hàng', number: '', owner: '', balance: 0 };
    const raw = String(acc.accountName || acc.name || '').trim();
    const balance = Number(acc.balance || 0);
    const id = acc.id || '';

    if (raw.includes('|')) {
        const parts = raw.split('|').map(p => p.trim());
        return {
            id,
            name: parts[0] || 'Chưa đặt tên',
            type: parts[1] || 'Ngân hàng',
            number: parts[2] || '',
            owner: parts[3] || '',
            balance
        };
    }
    
    // Tương thích ngược dữ liệu cũ
    let inferredType = 'Ngân hàng';
    const lower = raw.toLowerCase();
    if (lower.includes('tiền mặt') || lower.includes('két') || lower.includes('cash')) {
        inferredType = 'Tiền mặt';
    }
    return {
        id,
        name: raw || 'Chưa đặt tên',
        type: acc.type || inferredType,
        number: acc.accountNumber || '',
        owner: acc.accountOwner || '',
        balance
    };
};

/**
 * Nhận diện trực quan biểu tượng và màu sắc tài khoản
 */
const getBankVisuals = (accName, type) => {
    const str = String(accName || '').toLowerCase();
    
    if (str.includes('công ty') || str.includes('cong ty')) {
        return { icon: 'fa-building', color: 'text-sky-400', bg: 'bg-sky-950/40', border: 'border-sky-500/30' };
    }
    if (str.includes('giám đốc') || str.includes('giam doc') || str.includes('tối cao')) {
        return { icon: 'fa-user-tie', color: 'text-amber-400', bg: 'bg-amber-950/40', border: 'border-amber-500/30' };
    }
    if (str.includes('kế toán') || str.includes('ke toan')) {
        return { icon: 'fa-piggy-bank', color: 'text-purple-400', bg: 'bg-purple-950/40', border: 'border-purple-500/30' };
    }
    if (str.includes('đầu tư') || str.includes('dau tu')) {
        return { icon: 'fa-chart-line', color: 'text-emerald-400', bg: 'bg-emerald-950/40', border: 'border-emerald-500/30' };
    }
    if (str.includes('tiền mặt') || str.includes('tien mat') || type === 'Tiền mặt') {
        return { icon: 'fa-wallet', color: 'text-teal-400', bg: 'bg-teal-950/40', border: 'border-teal-500/30' };
    }
    if (str.includes('shopee') || str.includes('ví')) {
        return { icon: 'fa-shopping-bag', color: 'text-orange-400', bg: 'bg-orange-950/40', border: 'border-orange-500/30' };
    }

    const THEMES = [
        { icon: 'fa-university', color: 'text-sky-400', bg: 'bg-sky-950/40', border: 'border-sky-500/30' },
        { icon: 'fa-landmark', color: 'text-indigo-400', bg: 'bg-indigo-950/40', border: 'border-indigo-500/30' },
        { icon: 'fa-vault', color: 'text-amber-400', bg: 'bg-amber-950/40', border: 'border-amber-500/30' },
        { icon: 'fa-credit-card', color: 'text-cyan-400', bg: 'bg-cyan-950/40', border: 'border-cyan-500/30' }
    ];

    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return THEMES[Math.abs(hash) % THEMES.length];
};

/**
 * Phân tích timestamp từ date + time
 */
const parseTxTimestamp = (t) => {
    if (!t) return 0;
    let dateStr = String(t.date || '').trim();
    let timeStr = String(t.time || '').trim();
    if (dateStr.includes(' ')) {
        const parts = dateStr.split(' ');
        dateStr = parts[0];
        if (!timeStr) timeStr = parts[1];
    }
    if (!timeStr) timeStr = '00:00:00';
    if (timeStr.split(':').length === 2) timeStr += ':00';
    const dt = new Date(`${dateStr}T${timeStr}`);
    return isNaN(dt.getTime()) ? 0 : dt.getTime();
};

/**
 * Trích xuất Order ID chuẩn hóa (DH, RF, SO, HD)
 */
const extractOrderId = (text) => {
    if (!text) return null;
    const match = String(text).match(/(DH|RF|SO|HD|DH-)\s*([0-9]{4,8})/i);
    return match ? match[0].replace(/\s+/g, '').toUpperCase() : null;
};

/**
 * Xóa ký tự đặc biệt để đối soát chuỗi
 */
const cleanAlphanumeric = (str) => {
    if (!str) return '';
    return String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
};

/**
 * Trích xuất đối tác/người gửi từ diễn giải sao kê ngân hàng
 */
const extractBankParty = (desc) => {
    if (!desc) return '';
    const d = String(desc).trim();
    let m = d.match(/Beneficiary\s*name\s*:\s*([^,;\n\r\-]+)/i);
    if (m && m[1].trim()) return m[1].trim();
    m = d.match(/B\/O\s+([A-Z0-9\s\.\_\/]{3,40}?)(?:\s+F\/O|\s+DTLS|\s+-\s*|\s*,\s*|$)/i);
    if (m && m[1].trim()) return m[1].trim();
    m = d.match(/CT\s+tu\s+\d+\s+([A-Z\s]{3,35}?)(?:\s+toi|\s+den|\s+va|$)/i);
    if (m && m[1].trim()) return m[1].trim();
    m = d.match(/tai\s+[A-Za-z0-9]+\.\s*([A-Za-z0-9\s\-_]{3,30}?)(?:\s+chuyen|\s*-\s*|\s*,\s*|$)/i);
    if (m && m[1].trim()) return m[1].trim();
    m = d.match(/([A-Z\s]{3,30})\s+(?:chuyen\s+khoan|chuyen\s+tien|ck|nop\s+tien|thanh\s+toan)/i);
    if (m && m[1].trim() && !['CT', 'REM', 'TK', 'SO', 'THONG BAO'].includes(m[1].trim())) return m[1].trim();
    if (d.toUpperCase().includes('SHOPEEPAY') || d.toUpperCase().includes('SHOPEE')) return 'Shopee VN';
    if (d.toUpperCase().includes('TIKTOK')) return 'TikTok Shop';
    if (d.toUpperCase().includes('ZALOPAY')) return 'ZaloPay';
    return '';
};

/**
 * Modal Quét và Nhập Sao Kê Ngân Hàng (Excel / CSV)
 */
const ImportStatementModal = React.memo(function ImportStatementModal({ onClose, pushDeltas, triggerToast, erpData, categories }) {
    const [isProcessing, setIsProcessing] = React.useState(false);
    const [scannedData, setScannedData] = React.useState([]);
    const [selectedRows, setSelectedRows] = React.useState(new Set());
    const [selectedBankId, setSelectedBankId] = React.useState('');
    const fileInputRef = React.useRef(null);

    const bankAccounts = React.useMemo(() => erpData?.Accounts || [], [erpData?.Accounts]);

    React.useEffect(() => {
        if (bankAccounts.length > 0 && !selectedBankId) {
            setSelectedBankId(bankAccounts[0].id);
        }
        if (typeof window.XLSX === 'undefined') {
            const script = document.createElement('script');
            script.src = "https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
            document.body.appendChild(script);
        }
    }, [bankAccounts, selectedBankId]);

    const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessing(true);
        if (typeof window.ensureXLSXLoaded === 'function') {
            await window.ensureXLSXLoaded();
        }

        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const data = evt.target.result;
                let workbook;
                let isCSV = false;
                try { workbook = window.XLSX.read(data, { type: 'binary' }); } 
                catch (err) { 
                    if (err?.message?.toLowerCase().includes('password')) {
                        triggerToast('File đang bị khóa mật khẩu! Hãy lưu lại thành file không pass.', 'fa-lock', 'danger');
                        setIsProcessing(false);
                        return;
                    }
                    isCSV = true; 
                }

                if (isCSV) {
                    const readerCSV = new FileReader();
                    readerCSV.onload = (eCSV) => {
                        processSheetData(window.XLSX.read(eCSV.target.result, { type: 'string' }).Sheets[window.XLSX.read(eCSV.target.result, { type: 'string' }).SheetNames[0]]);
                    };
                    readerCSV.readAsText(file);
                    return;
                }
                processSheetData(workbook.Sheets[workbook.SheetNames[0]]);
            } catch (err) {
                triggerToast('Lỗi đọc file sao kê!', 'fa-times', 'danger');
                setIsProcessing(false);
            }
        };
        reader.readAsBinaryString(file);
    };

    const processSheetData = (worksheet) => {
        const json = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
        const existingTxs = erpData?.Transactions || []; 
        let parsedTransactions = [];
        let headerRowIndex = -1;
        let colMap = { date: -1, debit: -1, credit: -1, desc: -1, party: -1 };

        // Tự động nhận diện tài khoản đích từ số tài khoản trong header
        const headerTextAll = json.slice(0, 20).map(r => Object.values(r).join(' ')).join(' ');
        for (const a of bankAccounts) {
            const p = parseAccountInfo(a);
            const num = (p.number || a.accountNumber || '').trim();
            if (num && num.length >= 5 && headerTextAll.includes(num)) {
                setSelectedBankId(a.id);
                break;
            }
        }

        for (let i = 0; i < Math.min(20, json.length); i++) {
            const row = Object.values(json[i]);
            let foundDate = -1, foundDebit = -1, foundCredit = -1, foundDesc = -1, foundParty = -1;
            
            row.forEach((cellText, colIndex) => {
                const text = String(cellText).toLowerCase().trim();
                if (text.includes('ngày') || text.includes('date') || text.includes('thời gian')) { if (foundDate === -1) foundDate = colIndex; }
                if (text.includes('phát sinh nợ') || text.includes('ghi nợ') || text === 'nợ' || text.includes('debit') || text === 'chi' || text === 'số tiền chi') foundDebit = colIndex;
                if (text.includes('phát sinh có') || text.includes('ghi có') || text === 'có' || text.includes('credit') || text === 'thu' || text === 'số tiền thu') foundCredit = colIndex;
                if (text.includes('diễn giải') || text.includes('nội dung') || text.includes('desc') || text.includes('detail')) foundDesc = colIndex;
                if (text.includes('đối tác') || text.includes('đối ứng') || text.includes('người nhận') || text.includes('người gửi') || text.includes('thụ hưởng') || text.includes('beneficiary')) {
                    if (foundParty === -1) foundParty = colIndex;
                }
            });

            if (foundDate > -1 && foundDesc > -1 && (foundDebit > -1 || foundCredit > -1)) {
                headerRowIndex = i; 
                colMap = { date: foundDate, debit: foundDebit, credit: foundCredit, desc: foundDesc, party: foundParty }; 
                break;
            }
        }

        if (headerRowIndex === -1) { 
            headerRowIndex = 14; 
            colMap = { date: 2, debit: 5, credit: 6, desc: 11, party: -1 }; 
        }

        for (let i = headerRowIndex + 1; i < json.length; i++) {
            const row = Object.values(json[i]);
            if (row.length === 0 || !row[colMap.date]) continue; 
            
            const rawDate = String(row[colMap.date]);
            const rawDesc = String(row[colMap.desc] || '');
            let rawParty = colMap.party > -1 ? String(row[colMap.party] || '').trim() : '';
            
            let debit = 0;
            if (colMap.debit > -1) {
                debit = typeof row[colMap.debit] === 'number' ? row[colMap.debit] : (Number(String(row[colMap.debit] || '').replace(/[^\d]/g, '')) || 0);
            }

            let credit = 0;
            if (colMap.credit > -1) {
                credit = typeof row[colMap.credit] === 'number' ? row[colMap.credit] : (Number(String(row[colMap.credit] || '').replace(/[^\d]/g, '')) || 0);
            }

            if (rawDate.trim() === '' || (debit === 0 && credit === 0)) continue;

            let formattedDate = rawDate;
            try {
                const dateParts = rawDate.split(/[\s/:]+/);
                if (dateParts.length >= 3) {
                    const day = dateParts[0].padStart(2, '0');
                    const month = dateParts[1].padStart(2, '0');
                    const year = dateParts[2].length === 2 ? '20' + dateParts[2] : dateParts[2];
                    const hour = dateParts[3] ? dateParts[3].padStart(2, '0') : '12';
                    const min = dateParts[4] ? dateParts[4].padStart(2, '0') : '00';
                    formattedDate = `${year}-${month}-${day} ${hour}:${min}`;
                }
            } catch(e) {}

            let type = ''; 
            let amount = 0; 
            let category = 'Chờ Xử Lý';
            let originalDirection = 'credit';
            
            if (credit > 0) {
                type = 'Thu'; amount = credit; originalDirection = 'credit';
                const thuVals = (categories?.THU || []).map(c => c.value);
                if (rawDesc.toUpperCase().includes('SHOPEE') || rawDesc.toUpperCase().includes('TIKTOK')) {
                    category = thuVals.includes('Thu Tiền Bán Hàng') ? 'Thu Tiền Bán Hàng' : 'Chờ Xử Lý';
                }
            } else if (debit > 0) {
                type = 'Chi'; amount = debit; originalDirection = 'debit';
                const chiVals = (categories?.CHI || []).map(c => c.value);
                if (rawDesc.toUpperCase().includes('LUONG') || rawDesc.toUpperCase().includes('THUONG')) {
                    category = chiVals.includes('Trả Lương') ? 'Trả Lương' : 'Chờ Xử Lý';
                } else if (rawDesc.toUpperCase().includes('CHUYEN TIEN') || rawDesc.toUpperCase().includes('CHUYEN KHOAN')) {
                    category = chiVals.includes('Thanh Toán NCC') ? 'Thanh Toán NCC' : 'Chờ Xử Lý';
                }
            }

            if (!rawParty) {
                rawParty = extractBankParty(rawDesc);
            }
            const initialTitle = rawParty || `${type} Sao Kê`;
            const noteImportClean = cleanAlphanumeric(rawDesc);
            const orderIdImport = extractOrderId(rawDesc);

            let dupLevel = 0; // 0: Xanh, 1: Vàng (Nghi ngờ), 2: Đỏ (Trùng), 3: Xanh ngọc (Khớp lệnh)
            let matchedTxId = null;

            existingTxs.forEach(t => {
                if (dupLevel === 2) return;
                
                const sameAmount = Number(t.amount) === amount;
                const sameType = t.type === type;
                if (!sameAmount || !sameType) return;
                
                const noteDBClean = cleanAlphanumeric(t.note);
                const orderIdDB = extractOrderId(t.note);
                
                // Tier 1: Khớp tuyệt đối theo Order ID (Idempotency)
                if (orderIdImport && orderIdDB && orderIdImport === orderIdDB) {
                    if (t.isCleared || t.isAuto) {
                        dupLevel = 2; // Đã đối soát hoặc đã nạp trước đó
                    } else {
                        dupLevel = 3; // Khớp lệnh
                        matchedTxId = t.id;
                    }
                    return;
                }
                
                // Tier 2: Khớp tương đối trong cửa sổ +- 5 ngày
                const tDate = new Date(t.date);
                const importDate = new Date(formattedDate);
                const diffDays = Math.abs(tDate - importDate) / (1000 * 60 * 60 * 24);
                
                if (diffDays <= 5) {
                    const isSameDesc = (noteDBClean && noteImportClean && (noteDBClean.includes(noteImportClean) || noteImportClean.includes(noteDBClean)));
                    if (isSameDesc) {
                        if (t.isCleared || t.isAuto) {
                            dupLevel = 2;
                        } else {
                            dupLevel = 3;
                            matchedTxId = t.id;
                        }
                    } else if (dupLevel < 2 && diffDays === 0) {
                        dupLevel = 1; // Vàng: Trùng ngày & số tiền nhưng khác nội dung
                    }
                }
            });
            
            if (dupLevel === 3 && type === 'Thu') category = 'Bán Hàng';

            parsedTransactions.push({ 
                _id: 'TEMP_' + Date.now() + '_' + i, 
                date: formattedDate, 
                type, 
                originalDirection,
                amount, 
                category, 
                targetAccount: '',
                note: rawDesc, 
                title: initialTitle, 
                dupLevel, 
                matchedTxId 
            });
        }

        setScannedData(parsedTransactions);
        // Tự động chọn các dòng Hợp lệ (dupLevel 0 hoặc 3)
        setSelectedRows(new Set(parsedTransactions.filter(t => t.dupLevel === 0 || t.dupLevel === 3).map(t => t._id)));
        setIsProcessing(false);
        triggerToast(`Đã phân tích ${parsedTransactions.length} giao dịch sao kê!`, 'fa-check', 'success');
    };

    const toggleRow = (id) => {
        const next = new Set(selectedRows);
        if (next.has(id)) next.delete(id); else next.add(id);
        setSelectedRows(next);
    };

    const toggleAll = () => {
        if (selectedRows.size === scannedData.length) setSelectedRows(new Set());
        else setSelectedRows(new Set(scannedData.map(t => t._id)));
    };

    const handleImport = async () => {
        if (selectedRows.size === 0) return triggerToast('Vui lòng chọn ít nhất 1 giao dịch!', 'fa-exclamation', 'warning');
        if (!selectedBankId) return triggerToast('Vui lòng chọn tài khoản ngân hàng tương ứng!', 'fa-exclamation', 'warning');

        setIsProcessing(true);
        const transactionsToImport = scannedData.filter(t => selectedRows.has(t._id));
        
        let payload = { Transactions: [], Accounts: [] };
        let accountBalanceDeltas = {};

        transactionsToImport.forEach((t, i) => {
            if (t.dupLevel === 3 && t.matchedTxId) {
                payload.Transactions.push({
                    id: t.matchedTxId,
                    isCleared: true,
                    bankRef: 'BNK_' + Date.now() + '_' + i
                });
                const delta = (t.originalDirection === 'debit' || t.type === 'Chi') ? -t.amount : t.amount;
                accountBalanceDeltas[selectedBankId] = (accountBalanceDeltas[selectedBankId] || 0) + delta;
            } else {
                const finalId = 'TX_SK_' + Date.now() + '_' + i;
                let fromAcc = '';
                let toAcc = '';

                if (t.type === 'Thu') {
                    toAcc = selectedBankId;
                    accountBalanceDeltas[selectedBankId] = (accountBalanceDeltas[selectedBankId] || 0) + t.amount;
                } else if (t.type === 'Chi') {
                    fromAcc = selectedBankId;
                    accountBalanceDeltas[selectedBankId] = (accountBalanceDeltas[selectedBankId] || 0) - t.amount;
                } else if (t.type === 'Chuyển') {
                    const isDebit = t.originalDirection === 'debit';
                    if (isDebit) {
                        fromAcc = selectedBankId;
                        toAcc = t.targetAccount || '';
                        accountBalanceDeltas[selectedBankId] = (accountBalanceDeltas[selectedBankId] || 0) - t.amount;
                        if (t.targetAccount) {
                            accountBalanceDeltas[t.targetAccount] = (accountBalanceDeltas[t.targetAccount] || 0) + t.amount;
                        }
                    } else {
                        fromAcc = t.targetAccount || '';
                        toAcc = selectedBankId;
                        accountBalanceDeltas[selectedBankId] = (accountBalanceDeltas[selectedBankId] || 0) + t.amount;
                        if (t.targetAccount) {
                            accountBalanceDeltas[t.targetAccount] = (accountBalanceDeltas[t.targetAccount] || 0) - t.amount;
                        }
                    }
                }

                payload.Transactions.push({
                    id: finalId, 
                    type: t.type, 
                    category: t.type === 'Chuyển' ? (t.category || 'Chuyển Tiền Nội Bộ') : t.category, 
                    amount: t.amount, 
                    date: t.date, 
                    title: t.title || `${t.type} Sao Kê`, 
                    note: t.note,
                    fromAccount: fromAcc,
                    toAccount: toAcc,
                    isAuto: true,
                    isCleared: true,
                    bankRef: 'BNK_' + Date.now() + '_' + i
                });
            }
        });

        Object.keys(accountBalanceDeltas).forEach(accId => {
            const acc = bankAccounts.find(a => a.id === accId);
            if (acc) {
                payload.Accounts.push({
                    ...acc,
                    balance: Number(acc.balance || 0) + accountBalanceDeltas[accId]
                });
            }
        });

        try {
            await pushDeltas(payload, `Đã import ${transactionsToImport.length} giao dịch sao kê!`, 'fa-cloud-upload-alt');
            onClose();
        } catch (e) {
            triggerToast('Lỗi khi import sao kê!', 'fa-times', 'danger');
            setIsProcessing(false);
        }
    };

    return (
        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-[#121216] border border-zinc-800 w-full max-w-5xl rounded-2xl p-4 sm:p-5 shadow-2xl flex flex-col h-[90vh] relative animate-slide-up" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} className="absolute top-4 right-4 w-7 h-7 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer z-20">
                    <i className="fas fa-times text-xs"></i>
                </button>

                <div className="flex items-center gap-3 mb-4 border-b border-zinc-800 pb-3 shrink-0">
                    <div className="w-9 h-9 rounded-xl bg-sky-950/50 border border-sky-500/30 text-sky-400 flex items-center justify-center text-lg">
                        <i className="fas fa-file-invoice-dollar"></i>
                    </div>
                    <div>
                        <h3 className="font-bold text-zinc-100 text-[15px] uppercase tracking-wide leading-none">Máy Quét Sao Kê Ngân Hàng</h3>
                        <p className="text-zinc-400 text-[11px] mt-1">Đọc và đối soát tự động từ file Excel/CSV ngân hàng</p>
                    </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-[1fr_260px] gap-3 mb-3 shrink-0">
                    <div>
                        <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".xlsx, .xls, .csv" className="hidden" />
                        <button 
                            onClick={() => fileInputRef.current?.click()} 
                            disabled={isProcessing} 
                            className="w-full bg-[#09090b] border border-dashed border-zinc-700 hover:border-sky-500 text-zinc-400 hover:text-zinc-200 rounded-xl py-3 px-4 flex items-center justify-center gap-3 transition-colors cursor-pointer"
                        >
                            {isProcessing ? <i className="fas fa-spinner fa-spin text-sky-400 text-lg"></i> : <i className="fas fa-cloud-upload-alt text-sky-400 text-lg"></i>}
                            <span className="font-bold text-[12px]">{isProcessing ? 'Đang phân tích file...' : 'Tải lên File Sao Kê Excel/CSV'}</span>
                        </button>
                    </div>

                    <div>
                        <select 
                            value={selectedBankId} 
                            onChange={(e) => setSelectedBankId(e.target.value)} 
                            className="w-full bg-[#09090b] border border-zinc-700 rounded-xl px-3 py-2.5 text-white font-bold text-[12px] outline-none focus:border-sky-500"
                        >
                            {bankAccounts.length === 0 ? <option value="">-- Chưa có Quỹ nào --</option> : null}
                            {bankAccounts.map(a => {
                                const p = parseAccountInfo(a);
                                return <option key={a.id} value={a.id}>{p.name} {p.number ? `(${p.number})` : ''}</option>;
                            })}
                        </select>
                    </div>
                </div>

                <div className="flex-1 overflow-hidden flex flex-col bg-[#09090b] border border-zinc-800/80 rounded-xl">
                    <div className="flex items-center justify-between p-2.5 bg-zinc-900/60 border-b border-zinc-800 shrink-0">
                        <span className="text-[11px] font-bold text-zinc-300">
                            Kết Quả Quét: <b className="text-white">{scannedData.length}</b> dòng | Đã chọn: <b className="text-sky-400">{selectedRows.size}</b>
                        </span>
                        <button onClick={toggleAll} className="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-[10px] font-bold text-zinc-300 rounded-lg transition-colors cursor-pointer">
                            Chọn / Bỏ chọn tất cả
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto custom-scrollbar p-2">
                        {scannedData.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-zinc-500">
                                <i className="fas fa-file-excel text-3xl mb-2 text-zinc-600"></i>
                                <div className="text-[12px] font-medium">Chưa có dữ liệu. Vui lòng tải file sao kê lên.</div>
                            </div>
                        ) : (
                            <table className="w-full text-left border-collapse text-[11px]">
                                <thead>
                                    <tr className="text-zinc-400 font-bold uppercase border-b border-zinc-800 sticky top-0 bg-[#09090b] z-10 text-[10px]">
                                        <th className="p-2 w-8 text-center">X</th>
                                        <th className="p-2 w-[110px]">Thời gian</th>
                                        <th className="p-2 w-[75px]">Loại</th>
                                        <th className="p-2 w-[100px] text-right">Số tiền</th>
                                        <th className="p-2 w-[140px]">Danh mục / Đích</th>
                                        <th className="p-2 w-[140px]">Người gửi / Nhận</th>
                                        <th className="p-2">Diễn giải</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {scannedData.map(t => {
                                        const isSelected = selectedRows.has(t._id);
                                        return (
                                            <tr 
                                                key={t._id} 
                                                onClick={() => t.dupLevel !== 2 && toggleRow(t._id)} 
                                                className={`border-b border-zinc-800/60 transition-colors ${
                                                    t.dupLevel === 2 ? 'opacity-40 cursor-not-allowed bg-zinc-950 line-through' :
                                                    isSelected ? 'bg-sky-950/20 hover:bg-sky-950/30' : 'hover:bg-zinc-900/50'
                                                }`}
                                            >
                                                <td className="p-2 text-center">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={isSelected} 
                                                        disabled={t.dupLevel === 2} 
                                                        onChange={() => {}} 
                                                        className="rounded text-sky-500" 
                                                    />
                                                </td>
                                                <td className="p-2 font-mono text-zinc-300">
                                                    <div>{t.date}</div>
                                                    {t.dupLevel === 2 && <span className="text-[9px] text-rose-400 font-bold">Trùng lặp</span>}
                                                    {t.dupLevel === 3 && <span className="text-[9px] text-emerald-400 font-bold">✔ Khớp lệnh</span>}
                                                    {t.dupLevel === 1 && <span className="text-[9px] text-amber-400 font-bold">Nghi ngờ</span>}
                                                </td>
                                                <td className="p-2" onClick={e => e.stopPropagation()}>
                                                    <select 
                                                        value={t.type} 
                                                        disabled={t.dupLevel === 2} 
                                                        onChange={(e) => {
                                                            const newType = e.target.value;
                                                            setScannedData(prev => prev.map(item => item._id === t._id ? { ...item, type: newType } : item));
                                                        }}
                                                        className={`w-full border rounded text-[10px] py-1 px-1 font-bold outline-none cursor-pointer ${
                                                            t.type === 'Thu' ? 'bg-emerald-950/40 text-emerald-300 border-emerald-500/40' :
                                                            t.type === 'Chuyển' ? 'bg-sky-950/40 text-sky-300 border-sky-500/40' :
                                                            'bg-rose-950/40 text-rose-300 border-rose-500/40'
                                                        }`}
                                                    >
                                                        <option value="Thu">Thu</option>
                                                        <option value="Chi">Chi</option>
                                                        <option value="Chuyển">Chuyển</option>
                                                    </select>
                                                </td>
                                                <td className={`p-2 text-right font-mono font-bold ${t.type === 'Thu' ? 'text-emerald-400' : t.type === 'Chuyển' ? 'text-sky-400' : 'text-rose-400'}`}>
                                                    {formatFinanceMoney(t.amount)}đ
                                                </td>
                                                <td className="p-2" onClick={e => e.stopPropagation()}>
                                                    {t.type === 'Chuyển' ? (
                                                        <select 
                                                            value={t.targetAccount || ''} 
                                                            disabled={t.dupLevel === 2} 
                                                            onChange={(e) => { 
                                                                const val = e.target.value; 
                                                                setScannedData(prev => prev.map(x => x._id === t._id ? { ...x, targetAccount: val } : x)); 
                                                            }} 
                                                            className="w-full bg-[#121216] border border-sky-500/40 text-sky-300 rounded text-[10px] p-1.5 outline-none font-bold"
                                                        >
                                                            <option value="">-- Quỹ Đối Ứng --</option>
                                                            {bankAccounts.filter(a => a.id !== selectedBankId).map(a => {
                                                                const p = parseAccountInfo(a);
                                                                return <option key={a.id} value={a.id}>{p.name}</option>;
                                                            })}
                                                        </select>
                                                    ) : (
                                                        <select 
                                                            value={t.category} 
                                                            disabled={t.dupLevel === 2} 
                                                            onChange={(e) => { 
                                                                const val = e.target.value; 
                                                                setScannedData(prev => prev.map(x => x._id === t._id ? { ...x, category: val } : x)); 
                                                            }} 
                                                            className="w-full bg-[#121216] border border-zinc-700 rounded text-[10px] p-1.5 outline-none font-bold text-zinc-200"
                                                        >
                                                            {(t.type === 'Thu' ? (categories?.THU || []) : (categories?.CHI || [])).map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
                                                        </select>
                                                    )}
                                                </td>
                                                <td className="p-2" onClick={e => e.stopPropagation()}>
                                                    <input 
                                                        type="text" 
                                                        value={t.title || ''} 
                                                        disabled={t.dupLevel === 2} 
                                                        onChange={(e) => { 
                                                            const val = e.target.value; 
                                                            setScannedData(prev => prev.map(x => x._id === t._id ? { ...x, title: val } : x)); 
                                                        }} 
                                                        className="w-full bg-[#121216] border border-zinc-700 rounded text-[11px] px-2 py-1 outline-none text-zinc-200" 
                                                    />
                                                </td>
                                                <td className="p-2" onClick={e => e.stopPropagation()}>
                                                    <textarea 
                                                        rows={1} 
                                                        value={t.note || ''} 
                                                        disabled={t.dupLevel === 2} 
                                                        onChange={(e) => { 
                                                            const val = e.target.value; 
                                                            setScannedData(prev => prev.map(x => x._id === t._id ? { ...x, note: val } : x)); 
                                                        }} 
                                                        className="w-full bg-[#121216] border border-zinc-700 rounded text-[11px] px-2 py-1 outline-none text-zinc-400 resize-y" 
                                                    />
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        )}
                    </div>
                </div>

                <div className="mt-3 pt-3 border-t border-zinc-800 shrink-0">
                    <button 
                        onClick={handleImport} 
                        disabled={isProcessing || selectedRows.size === 0} 
                        className="w-full py-3 bg-sky-600 hover:bg-sky-500 disabled:opacity-40 text-zinc-950 font-black rounded-xl text-[12px] uppercase tracking-wider transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer"
                    >
                        {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> Đang Import...</> : <><i className="fas fa-cloud-download-alt"></i> Nạp {selectedRows.size} Giao Dịch Vào Sổ Quỹ</>}
                    </button>
                </div>
            </div>
        </div>
    );
});

/**
 * Modal Quét Báo Cáo Giao Dịch Ví Shopee (my_balance_transaction_report...)
 */
const ShopeeWalletScannerModal = React.memo(function ShopeeWalletScannerModal({ categories, erpData, onClose, pushDeltas, triggerToast, accountsData }) {
    const [isProcessing, setIsProcessing] = React.useState(false);
    const [scannedData, setScannedData] = React.useState([]);
    const [selectedRows, setSelectedRows] = React.useState(new Set());
    const [selectedWalletId, setSelectedWalletId] = React.useState('');
    const fileInputRef = React.useRef(null);

    const shopeeAccounts = React.useMemo(() => {
        return (accountsData || []).filter(a => {
            const p = parseAccountInfo(a);
            return p.name.toLowerCase().includes('shopee') || p.name.toLowerCase().includes('ví');
        });
    }, [accountsData]);

    React.useEffect(() => {
        if (shopeeAccounts.length > 0 && !selectedWalletId) {
            setSelectedWalletId(shopeeAccounts[0].id);
        } else if (accountsData?.length > 0 && !selectedWalletId) {
            setSelectedWalletId(accountsData[0].id);
        }
    }, [shopeeAccounts, accountsData, selectedWalletId]);

    const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessing(true);
        const reader = new FileReader();

        reader.onload = (evt) => {
            try {
                const data = new Uint8Array(evt.target.result);
                const wb = window.XLSX.read(data, { type: 'array' });
                let bestSheet = wb.Sheets[wb.SheetNames[0]];
                let rows = window.XLSX.utils.sheet_to_json(bestSheet, { header: 1, defval: '' });

                if (rows.length < 2) {
                    triggerToast('File rỗng hoặc không đúng định dạng!', 'fa-exclamation', 'warning');
                    setIsProcessing(false);
                    return;
                }

                let headerIdx = 0;
                for (let i = 0; i < Math.min(15, rows.length); i++) {
                    const rowStr = (rows[i] || []).join(' ').toLowerCase();
                    if (rowStr.includes('loại giao dịch') || rowStr.includes('số tiền') || rowStr.includes('mô tả') || rowStr.includes('transaction type')) {
                        headerIdx = i;
                        break;
                    }
                }

                const headers = (rows[headerIdx] || []).map(h => String(h).toLowerCase().trim());
                const findCol = (keys) => headers.findIndex(h => keys.some(k => String(h).includes(k)));

                let iDate = findCol(['ngày', 'thời gian', 'date', 'created at']);
                let iType = findCol(['loại giao dịch', 'transaction type', 'loại']);
                let iAmount = findCol(['số tiền (vnd)', 'số tiền', 'amount', 'tiền']);
                let iDesc = findCol(['mô tả', 'description', 'mã đơn hàng', 'order id']);

                if (iAmount === -1) {
                    alert('Không tìm thấy cột Số tiền trong file!');
                    setIsProcessing(false);
                    return;
                }

                const parseAmt = (val) => {
                    if (val === undefined || val === null || val === '') return 0;
                    if (typeof val === 'number') return isNaN(val) ? 0 : val;
                    let s = String(val).trim().replace(/[^\d.,-]/g, '');
                    if (!s || s === '-') return 0;
                    if (s.includes(',') && s.includes('.')) {
                        s = s.lastIndexOf('.') > s.lastIndexOf(',') ? s.replace(/,/g, '') : s.replace(/\./g, '').replace(/,/g, '.');
                    } else if (s.includes(',')) {
                        s = /\,\d{3}$/.test(s) ? s.replace(/,/g, '') : s.replace(/,/g, '.');
                    }
                    const num = parseFloat(s);
                    return isNaN(num) ? 0 : num;
                };

                const existingTxs = erpData?.Transactions || [];
                let parsedTransactions = [];

                for (let i = headerIdx + 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (!cols || cols.length === 0) continue;

                    let amount = parseAmt(cols[iAmount]);
                    if (amount === 0) continue;

                    let rawDate = iDate >= 0 && cols[iDate] ? String(cols[iDate]).trim() : new Date().toISOString().slice(0, 10);
                    let formattedDate = rawDate;
                    if (rawDate.includes('/')) {
                        const parts = rawDate.split(' ')[0].split('/');
                        if (parts.length === 3 && parts[2].length === 4) {
                            formattedDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                    }

                    let rawType = iType >= 0 && cols[iType] ? String(cols[iType]).trim() : '';
                    let rawDesc = iDesc >= 0 && cols[iDesc] ? String(cols[iDesc]).trim() : '';
                    
                    let type = amount > 0 ? 'Thu' : 'Chi';
                    if (rawType.toLowerCase().includes('rút tiền') || rawDesc.toLowerCase().includes('rút tiền')) {
                        type = 'Chuyển';
                    }

                    let category = type === 'Chuyển' ? 'Rút Tiền Shopee' : (type === 'Thu' ? 'Bán Hàng' : 'Chi Phí Bán Hàng');
                    let fullNote = (rawType ? `[${rawType}] ` : '') + rawDesc;

                    const noteImportClean = cleanAlphanumeric(fullNote);
                    const orderIdImport = extractOrderId(fullNote);
                    let dupLevel = 0;
                    let matchedTxId = null;

                    existingTxs.forEach(t => {
                        if (dupLevel === 2) return;
                        if (Math.abs(Number(t.amount)) !== Math.abs(amount)) return;
                        
                        const noteDBClean = cleanAlphanumeric(t.note);
                        const orderIdDB = extractOrderId(t.note);
                        
                        if (orderIdImport && orderIdDB && orderIdImport === orderIdDB) {
                            if (t.isCleared || t.isAuto) dupLevel = 2;
                            else { dupLevel = 3; matchedTxId = t.id; }
                            return;
                        }
                        
                        const tDate = new Date(t.date);
                        const importDate = new Date(formattedDate);
                        const diffDays = Math.abs(tDate - importDate) / (1000 * 60 * 60 * 24);
                        
                        if (diffDays <= 5) {
                            const isSameDesc = (noteDBClean && noteImportClean && (noteDBClean.includes(noteImportClean) || noteImportClean.includes(noteDBClean)));
                            if (isSameDesc) {
                                if (t.isCleared || t.isAuto) dupLevel = 2;
                                else { dupLevel = 3; matchedTxId = t.id; }
                            } else if (dupLevel < 2 && diffDays === 0) {
                                dupLevel = 1;
                            }
                        }
                    });

                    parsedTransactions.push({
                        _id: 'TEMP_SHP_' + Date.now() + '_' + i,
                        date: formattedDate,
                        type,
                        amount: Math.abs(amount),
                        category,
                        note: fullNote,
                        title: rawType || 'Giao Dịch Ví Shopee',
                        dupLevel,
                        matchedTxId
                    });
                }

                setScannedData(parsedTransactions);
                setSelectedRows(new Set(parsedTransactions.filter(t => t.dupLevel === 0 || t.dupLevel === 3).map(t => t._id)));
                setIsProcessing(false);
                triggerToast(`Bóc tách thành công ${parsedTransactions.length} giao dịch Ví Shopee!`, 'fa-check', 'success');
            } catch (err) {
                alert("Lỗi phân tích file Ví Shopee!");
                setIsProcessing(false);
            }
        };
        reader.readAsArrayBuffer(file);
    };

    const toggleRow = (id) => {
        const next = new Set(selectedRows);
        if (next.has(id)) next.delete(id); else next.add(id);
        setSelectedRows(next);
    };

    const handleImport = async () => {
        if (selectedRows.size === 0) return triggerToast('Vui lòng chọn ít nhất 1 giao dịch!', 'fa-exclamation', 'warning');
        
        let walletAccId = selectedWalletId;
        let newAccounts = [];

        if (!walletAccId) {
            const shopeeAcc = (accountsData || []).find(a => String(a.accountName).toLowerCase().includes('shopee'));
            if (shopeeAcc) {
                walletAccId = shopeeAcc.id;
            } else {
                walletAccId = 'ACC_SHOPEE_' + Date.now();
                newAccounts.push({ id: walletAccId, accountName: 'Ví Shopee | Ngân hàng | --- | ---', balance: 0 });
            }
        }

        setIsProcessing(true);
        const transactionsToImport = scannedData.filter(t => selectedRows.has(t._id));
        let payload = { Transactions: [], Accounts: [...newAccounts] };
        let walletBalanceDelta = 0;

        transactionsToImport.forEach((t, i) => {
            const isThu = t.type === 'Thu';
            const isChi = t.type === 'Chi';
            const isChuyen = t.type === 'Chuyển';
            
            if (t.dupLevel === 3 && t.matchedTxId) {
                payload.Transactions.push({
                    id: t.matchedTxId,
                    isCleared: true,
                    bankRef: 'SHP_' + Date.now() + '_' + i
                });
            } else {
                payload.Transactions.push({
                    id: 'TX_SHP_' + Date.now() + '_' + i,
                    type: t.type,
                    category: t.category,
                    amount: t.amount,
                    date: t.date,
                    title: t.title,
                    note: t.note,
                    fromAccount: isChi || isChuyen ? walletAccId : '',
                    toAccount: isThu ? walletAccId : '',
                    isAuto: true,
                    isCleared: true,
                    bankRef: 'SHP_' + Date.now() + '_' + i
                });
            }

            if (isThu) walletBalanceDelta += t.amount;
            if (isChi || isChuyen) walletBalanceDelta -= t.amount;
        });

        const targetAcc = (accountsData || []).find(a => a.id === walletAccId) || newAccounts[0];
        if (targetAcc) {
            payload.Accounts.push({ ...targetAcc, balance: Number(targetAcc.balance || 0) + walletBalanceDelta });
        }

        try {
            await pushDeltas(payload, `Đã nạp ${transactionsToImport.length} giao dịch vào Ví Shopee!`, 'fa-wallet');
            onClose();
        } catch (e) {
            triggerToast('Lỗi lưu giao dịch Ví Shopee!', 'fa-times', 'danger');
            setIsProcessing(false);
        }
    };

    return (

            <div className="bg-[#121216] border border-orange-500/30 w-full max-w-4xl rounded-2xl p-4 sm:p-5 shadow-2xl flex flex-col h-[90vh] relative animate-slide-up" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} className="absolute top-4 right-4 w-7 h-7 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer z-20">
                    <i className="fas fa-times text-xs"></i>
                </button>

                <div className="flex items-center gap-3 mb-4 border-b border-zinc-800 pb-3 shrink-0">
                    <div className="w-9 h-9 rounded-xl bg-orange-950/50 border border-orange-500/30 text-orange-400 flex items-center justify-center text-lg">
                        <i className="fas fa-wallet"></i>
                    </div>
                    <div>
                        <h3 className="font-bold text-zinc-100 text-[15px] uppercase tracking-wide leading-none">Máy Quét Giao Dịch Ví Shopee</h3>
                        <p className="text-zinc-400 text-[11px] mt-1">Đọc file báo cáo Ví Shopee (my_balance_transaction_report...)</p>
                    </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-[1fr_240px] gap-3 mb-3 shrink-0">
                    <div>
                        <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".xlsx, .xls, .csv" className="hidden" />
                        <button 
                            onClick={() => fileInputRef.current?.click()} 
                            disabled={isProcessing} 
                            className="w-full bg-[#09090b] border border-dashed border-zinc-700 hover:border-orange-500 text-zinc-400 hover:text-zinc-200 rounded-xl py-3 px-4 flex items-center justify-center gap-3 transition-colors cursor-pointer"
                        >
                            {isProcessing ? <i className="fas fa-spinner fa-spin text-orange-400 text-lg"></i> : <i className="fas fa-file-excel text-orange-400 text-lg"></i>}
                            <span className="font-bold text-[12px]">{isProcessing ? 'Đang phân tích...' : 'Tải lên File Báo Cáo Ví Shopee'}</span>
                        </button>
                    </div>

                    <div>
                        <select 
                            value={selectedWalletId} 
                            onChange={(e) => setSelectedWalletId(e.target.value)} 
                            className="w-full bg-[#09090b] border border-zinc-700 rounded-xl px-3 py-2.5 text-orange-400 font-bold text-[12px] outline-none focus:border-orange-500"
                        >
                            {(accountsData || []).map(a => {
                                const p = parseAccountInfo(a);

                <div className="flex-1 overflow-hidden flex flex-col bg-[#09090b] border border-zinc-800/80 rounded-xl">

                    <div className="flex-1 overflow-y-auto custom-scrollbar p-2">

                                <thead>
                                    <tr className="text-zinc-400 font-bold uppercase border-b border-zinc-800 sticky top-0 bg-[#09090b] z-10 text-[10px]">

                                        <th className="p-2 w-[110px]">Thời gian</th>
                                        <th className="p-2 w-[70px]">Loại</th>

                                </thead>
                                <tbody>
                                    {scannedData.map(t => {

/**
 * Modal Quét Ảnh Bill Giao Dịch Bằng OCR AI (Tesseract)
 */
const ReceiptScannerModal = React.memo(function ReceiptScannerModal({ accountsData, onClose, onComplete, triggerToast }) {
    const [isProcessing, setIsProcessing] = React.useState(false);
    const [previewImage, setPreviewImage] = React.useState(null);
    const [ocrStatus, setOcrStatus] = React.useState('');
    const fileInputRef = React.useRef(null);

    React.useEffect(() => {
        if (typeof window.Tesseract === 'undefined') {
            const script = document.createElement('script');
            script.src = "https:\/\/cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
            document.head.appendChild(script);
        }
    }, []);

    const compressImage = (file) => {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    };

    const processReceipt = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (typeof window.Tesseract === 'undefined') return triggerToast('AI OCR đang tải, vui lòng đợi 3 giây rồi thử lại!', 'fa-spinner', 'warning');

        setIsProcessing(true);
        setOcrStatus('Đang nén ảnh chứng từ...');
        try {
            const base64Image = await compressImage(file);
            setPreviewImage(base64Image);
            setOcrStatus('AI đang đọc và bóc tách dữ liệu...');
            
            const worker = await window.Tesseract.createWorker('vie');
            const ret = await worker.recognize(base64Image);
            const text = ret.data.text;
            await worker.terminate();

            setOcrStatus('Đang phân tích thông tin...');
            
            // 1. Số tiền
            const amountWithCurrencyMatch = text.match(/([\d\.,\s]+)\s*(?:VND|VNĐ|đ|d|Vnđ|Vnd)\b/i);
            let maxAmt = 0;
            if (amountWithCurrencyMatch) {
                maxAmt = Number(amountWithCurrencyMatch[1].replace(/[^\d]/g, ''));
            }
            if (!maxAmt) {
                const matches = text.match(/[\d][\d\.,\s]+[\d]/g);
                if (matches) {
                    matches.forEach(m => {
                        const cleanNum = Number(m.replace(/[^\d]/g, ''));
                        if (cleanNum > maxAmt && cleanNum < 10000000000) maxAmt = cleanNum;
                    });
                }
            }

            // 2. Tài khoản nguồn
            let detectedAccId = accountsData?.[0]?.id || '';
            const textUpper = text.toUpperCase();
            if (textUpper.includes('BIDV')) {
                const bidv = (accountsData || []).find(a => String(parseAccountInfo(a).name).toUpperCase().includes('BIDV'));
                if (bidv) detectedAccId = bidv.id;
            } else if (textUpper.includes('LP') || textUpper.includes('LIEN VIET') || textUpper.includes('LPBANK')) {
                const lp = (accountsData || []).find(a => String(parseAccountInfo(a).name).toUpperCase().includes('LP'));
                if (lp) detectedAccId = lp.id;
            }

            // 3. Người thụ hưởng
            const payeeMatch = text.match(/(?:Người thụ hưởng|Nguoi thu huong|Đến|Den|Tới|To|Người nhận)[:\s\n\r]*([^\n\r]+)/i);
            let detectedPayee = "";
            if (payeeMatch) {
                detectedPayee = payeeMatch[1].replace(/^[:\s\-*]+/g, '').trim().toUpperCase();
                detectedPayee = detectedPayee.split(/(?:MB Bank|Tài khoản|Số tài khoản|Tại|[\d]{5,})/i)[0].trim();
            }

            // 4. Lời nhắn
            const noteMatch = text.match(/(?:Nội dung|Noi dung|Lời nhắn|Ghi chú)[:\s\n\r]*([^\n\r]+)/i);
            let detectedNote = noteMatch ? noteMatch[1].replace(/^[:\s\-]+/g, '').trim() : '';

            // 5. Phân loại thông minh
            let detectedCategory = "Chi Phí Khác";
            if (detectedNote) {
                const noteLower = detectedNote.toLowerCase();
                if (noteLower.includes('luong') || noteLower.includes('lương') || noteLower.includes('thưởng')) detectedCategory = 'Trả Lương';
                else if (noteLower.includes('kinh') || noteLower.includes('nguyen lieu') || noteLower.includes('đá') || noteLower.includes('lũa')) detectedCategory = 'Mua Nguyên Liệu';
                else if (noteLower.includes('gang tay') || noteLower.includes('vật tư') || noteLower.includes('băng keo') || noteLower.includes('thùng')) detectedCategory = 'Mua Vật Tư';
                else if (noteLower.includes('hoá đơn') || noteLower.includes('điện') || noteLower.includes('nước') || noteLower.includes('internet')) detectedCategory = 'Thanh Toán Hoá Đơn';
                else if (noteLower.includes('ads') || noteLower.includes('quảng cáo')) detectedCategory = 'Quảng Cáo & Marketing';
            }

            let detectedTitle = detectedPayee ? `Chi cho ${detectedPayee}` : (detectedNote || 'Chi chuyển khoản');
            if (detectedTitle.length > 80) detectedTitle = detectedTitle.slice(0, 77) + "...";

            const dateMatch = text.match(/\b(\d{2})[\/\-](\d{2})[\/\-](\d{4})\b/);
            let detectedDate = dateMatch ? `${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}` : new Date().toISOString().slice(0, 10);
            
            const timeMatch = text.match(/\b(\d{2}):(\d{2}):(\d{2})\b/) || text.match(/\b(\d{2}):(\d{2})\b/);
            let detectedTime = timeMatch ? `${timeMatch[1]}:${timeMatch[2]}` : new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });

            triggerToast('Bóc tách ảnh chứng từ thành công!', 'fa-magic', 'success');
            onComplete({ 
                amount: maxAmt, 
                accId: detectedAccId, 
                proofImage: base64Image, 
                category: detectedCategory,
                title: detectedTitle,
                note: detectedNote,
                date: detectedDate,
                time: detectedTime
            });
        } catch (error) {
            triggerToast('Ảnh mờ hoặc AI không nhận dạng được!', 'fa-times', 'danger');
            setIsProcessing(false);
        }
    };

    return (
        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-[#121216] border border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl flex flex-col relative animate-slide-up text-center" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} className="absolute top-4 right-4 w-7 h-7 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer z-10">
                    <i className="fas fa-times text-xs"></i>
                </button>
                <div className="w-12 h-12 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl mx-auto mb-3">
                    <i className="fas fa-camera"></i>
                </div>
                <h3 className="font-bold text-zinc-100 text-[15px] uppercase tracking-wider mb-1">Máy Đọc Ảnh Bill Giao Dịch</h3>
                <p className="text-zinc-400 text-[11px] mb-5 leading-relaxed">Tải ảnh chụp màn hình Bill chuyển khoản lên, AI sẽ tự động đọc Số Tiền, Người Nhận và Ngân Hàng.</p>
                
                {previewImage ? (
                    <div className="w-full h-44 rounded-xl overflow-hidden border border-zinc-700 relative bg-black flex items-center justify-center mb-3">
                        <img src={previewImage} className="w-full h-full object-contain opacity-50" alt="Preview" />
                        {isProcessing && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center z-10 text-amber-400 bg-black/60">
                                <i className="fas fa-magic fa-spin text-2xl mb-2"></i>
                                <span className="font-bold text-[11px] uppercase tracking-wider">{ocrStatus}</span>
                            </div>
                        )}
                    </div>
                ) : (
                    <div className="relative mb-3">
                        <input type="file" ref={fileInputRef} onChange={processReceipt} accept="image/png, image/jpeg, image/jpg, image/webp" className="hidden" />
                        <button 
                            onClick={() => fileInputRef.current?.click()} 
                            disabled={isProcessing} 
                            className="w-full bg-[#09090b] border border-dashed border-zinc-700 hover:border-amber-500 text-zinc-400 hover:text-zinc-200 rounded-xl py-6 flex flex-col items-center justify-center transition-colors cursor-pointer"
                        >
                            <i className="fas fa-images text-3xl text-amber-400 mb-2 opacity-80"></i>
                            <span className="font-bold text-[11px] uppercase tracking-wider text-amber-300">Bấm để chọn Ảnh Bill</span>
                        </button>
                    </div>
                )}
            </div>
        </div>
    );
});

/**

const TransactionFormModal = React.memo(function TransactionFormModal({ initialData, categories, accountsData, onClose, onSave, isSaving }) {

        id: initialData?.id || '',

        title: initialData?.title || '',
        note: initialData?.note || '',
        fromAccount: initialData?.fromAccount || (initialData?.type !== 'Thu' ? accountsData?.[0]?.id || '' : ''),
        toAccount: initialData?.toAccount || (initialData?.type !== 'Chi' ? accountsData?.[0]?.id || '' : ''),
        date: initialData?.date || new Date().toISOString().slice(0, 10),
        time: initialData?.time || new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false }),
        proofImage: initialData?.proofImage || null,

        try { return JSON.parse(localStorage.getItem('financeContacts')) || []; }
        catch(e) { return []; }

        const name = form.title.trim();
        if (!name) return;
        if (!savedContacts.includes(name)) {

            setSavedContacts(updated);
            localStorage.setItem('financeContacts', JSON.stringify(updated));

            ...prev,
            type: newType,
            category: newCat,
            fromAccount: newType !== 'Thu' ? (prev.fromAccount || accountsData?.[0]?.id || '') : '',

            <div className="bg-[#121216] border border-zinc-800 w-full max-w-md rounded-2xl p-4 sm:p-5 shadow-2xl flex flex-col max-h-[90vh] animate-slide-up" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4 border-b border-zinc-800 pb-3">

                        <i className="fas fa-times text-xs"></i>
                    </button>

                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3.5 pr-1">
                    {/* Loại giao dịch: Thu / Chi / Chuyển */}

                            if (t === 'Chi') selTheme = 'bg-rose-600 text-white font-black shadow-sm';
                            if (t === 'Chuyển') selTheme = 'bg-sky-600 text-white font-black shadow-sm';
                            
                            return (

                                    {t}

const FinanceTab = React.memo(function FinanceTab({ orders, erpData, pushDeltas, triggerToast, isAdmin, categories: customCategories }) {
    const isBoss = localStorage.getItem('rf_boss') === 'true';
    const currentRole = localStorage.getItem('rf_role') || '';
    const canManageFinance = isBoss || ['TỐI CAO', 'KẾ TOÁN', 'QUẢN TRỊ VIÊN'].includes(String(currentRole).toUpperCase());
    const secureMoney = (val) => canManageFinance ? formatFinanceMoney(val) : '*******';

    const DEFAULT_CATEGORIES = {
        THU: [
            { value: 'Doanh Thu Bán Hàng', label: 'Doanh thu bán hàng', icon: 'fa-shopping-cart' },
            { value: 'Bán Phế Liệu', label: 'Bán phế liệu', icon: 'fa-recycle' },
            { value: 'Thu Nợ Khách', label: 'Thu nợ khách', icon: 'fa-handshake' },
            { value: 'Lợi Nhuận Đầu Tư', label: 'Lợi nhuận đầu tư', icon: 'fa-chart-line' },
            { value: 'Thu Khác', label: 'Thu khác', icon: 'fa-plus-circle' }
        ],
        CHI: [
            { value: 'Trả Lương', label: 'Trả lương nhân sự', icon: 'fa-user-tie' },
            { value: 'Mua Nguyên Liệu', label: 'Mua nguyên liệu', icon: 'fa-boxes' },
            { value: 'Mua Vật Tư', label: 'Mua vật tư sản xuất', icon: 'fa-tools' },
            { value: 'Thanh Toán Hoá Đơn', label: 'Thanh toán hoá đơn', icon: 'fa-file-invoice' },
            { value: 'Dịch Vụ Phần Mềm', label: 'Dịch vụ phần mềm', icon: 'fa-laptop' },
            { value: 'Quảng Cáo & Marketing', label: 'Quảng cáo & Marketing', icon: 'fa-bullhorn' },
            { value: 'Trang Thiết Bị', label: 'Trang thiết bị', icon: 'fa-desktop' },
            { value: 'Máy Móc & Công Cụ', label: 'Máy móc & công cụ', icon: 'fa-cogs' },
            { value: 'Hoạt Động & Sự Kiện', label: 'Hoạt động & sự kiện', icon: 'fa-calendar-alt' },
            { value: 'Chi Phí Khác', label: 'Chi phí khác', icon: 'fa-ellipsis-h' }
        ]
    };

    const categories = React.useMemo(() => {
        if (customCategories && (customCategories.THU?.length > 0 || customCategories.CHI?.length > 0)) {
            return {
                THU: customCategories.THU?.length > 0 ? customCategories.THU : DEFAULT_CATEGORIES.THU,
                CHI: customCategories.CHI?.length > 0 ? customCategories.CHI : DEFAULT_CATEGORIES.CHI
            };
        }
        try {
            const saved = localStorage.getItem('rf_transaction_categories');
            return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
        } catch (e) {
            return DEFAULT_CATEGORIES;
        }
    }, [customCategories]);

    const [activeSubTab, setActiveSubTab] = React.useState('CASHBOOK'); // CASHBOOK | SO_QUY | THONG_KE
    const [filterTime, setFilterTime] = React.useState('Tháng Này'); 
    const [customMonth, setCustomMonth] = React.useState('');
    const [filterAccount, setFilterAccount] = React.useState('ALL');
    const [filterTxType, setFilterTxType] = React.useState('ALL'); // ALL | THU | CHI | CHUYEN | DIEU_CHINH
    const [displayLimit, setDisplayLimit] = React.useState(50);
    const [localAccounts, setLocalAccounts] = React.useState({}); 
    const [localTxs, setLocalTxs] = React.useState([]); 

    // Modals & Batch Selection
    const [showAddTx, setShowAddTx] = React.useState(false);
    const [editingTxData, setEditingTxData] = React.useState(null);
    const [viewingTxDetail, setViewingTxDetail] = React.useState(null);
    const [isSavingTx, setIsSavingTx] = React.useState(false);
    const [showImportScanner, setShowImportScanner] = React.useState(false);
    const [showReceiptScanner, setShowReceiptScanner] = React.useState(false);
    const [showShopeeWalletScanner, setShowShopeeWalletScanner] = React.useState(false);
    const [viewingProofImage, setViewingProofImage] = React.useState(null);
    const [showAccountModal, setShowAccountModal] = React.useState(false);
    const [editingAccount, setEditingAccount] = React.useState(null);
    const [viewingAccountTxs, setViewingAccountTxs] = React.useState(null);
    const [selectedTxIds, setSelectedTxIds] = React.useState(new Set());
    const [showBatchCategoryModal, setShowBatchCategoryModal] = React.useState(false);

    // Dynamic accounts list
    const accountsData = React.useMemo(() => {
        let accs = [...(erpData?.Accounts || [])];
        Object.values(localAccounts).forEach(localAcc => {
            if (!accs.find(a => a.id === localAcc.id)) accs.push(localAcc);
        });
        return accs.map(acc => { 
            const cached = localAccounts[acc.id]; 
            return cached ? { ...acc, ...cached } : acc; 
        });
    }, [erpData?.Accounts, localAccounts]);

    // Helper kiểm tra giao dịch điều chỉnh số dư kỹ thuật
    const isAdjustmentTx = React.useCallback((t) => {
        if (!t) return false;
        const cat = String(t.category || '').toLowerCase();
        const title = String(t.title || '').toLowerCase();
        const note = String(t.note || '').toLowerCase();
        const id = String(t.id || '');
        return id.startsWith('TX_ADJ_') || 
               cat.includes('điều chỉnh') || 
               cat.includes('cân đối') || 
               title.includes('điều chỉnh số dư') || 
               note.includes('điều chỉnh số dư') ||
               note.includes('sinh phiếu điều chỉnh');
    }, []);

    // All transactions combined & chronologically sorted
    const allTxs = React.useMemo(() => {
        const serverTxs = erpData?.Transactions || []; 
        const merged = [...serverTxs];
        localTxs.forEach(ltx => { 
            if (!merged.find(s => s.id === ltx.id)) merged.push(ltx); 
        });
        return merged.sort((a, b) => parseTxTimestamp(b) - parseTxTimestamp(a));
    }, [erpData?.Transactions, localTxs]);

    // Time window calculation for high performance comparison
    const timeRange = React.useMemo(() => {
        const today = new Date();
        if (filterTime === 'Tháng Này') {
            const start = new Date(today.getFullYear(), today.getMonth(), 1).getTime();
            const end = new Date(today.getFullYear(), today.getMonth() + 1, 0, 23, 59, 59, 999).getTime();
            return { start, end };
        }
        if (filterTime === 'Tháng Trước') {
            const start = new Date(today.getFullYear(), today.getMonth() - 1, 1).getTime();
            const end = new Date(today.getFullYear(), today.getMonth(), 0, 23, 59, 59, 999).getTime();
            return { start, end };
        }
        if (filterTime === 'Chọn Tháng' && customMonth) {
            const [year, month] = customMonth.split('-');
            const y = parseInt(year, 10);
            const m = parseInt(month, 10) - 1;
            const start = new Date(y, m, 1).getTime();
            const end = new Date(y, m + 1, 0, 23, 59, 59, 999).getTime();
            return { start, end };
        }
        return null; // All
    }, [filterTime, customMonth]);

    // Base Time & Account Filtered List
    const basePeriodTxs = React.useMemo(() => {
        return allTxs.filter(t => {
            if (timeRange) {
                const ts = parseTxTimestamp(t);
                if (ts < timeRange.start || ts > timeRange.end) return false;
            }
            if (filterAccount !== 'ALL') {
                if (t.fromAccount !== filterAccount && t.toAccount !== filterAccount) return false;
            }
            return true;
        });
    }, [allTxs, timeRange, filterAccount]);

    // Filtered transaction list based on Quick Filter (Thu / Chi / Chuyển / Điều Chỉnh)
    const filteredTxs = React.useMemo(() => {
        return basePeriodTxs.filter(t => {
            if (filterTxType === 'THU') return t.type === 'Thu' && !isAdjustmentTx(t);
            if (filterTxType === 'CHI') return t.type === 'Chi' && !isAdjustmentTx(t);
            if (filterTxType === 'CHUYEN') return t.type === 'Chuyển';
            if (filterTxType === 'DIEU_CHINH') return isAdjustmentTx(t);
            return true;
        });
    }, [basePeriodTxs, filterTxType, isAdjustmentTx]);

    // Running balances computed in single pass
    const txBalances = React.useMemo(() => {
        let running = {};
        accountsData.forEach(a => running[a.id] = Number(a.balance) || 0);
        const balances = {};

        allTxs.forEach(t => {
            const amt = Number(t.amount || 0);
            balances[t.id] = {
                from: t.fromAccount ? (running[t.fromAccount] || 0) : null,
                to: t.toAccount ? (running[t.toAccount] || 0) : null
            };
            if (t.type === 'Thu') {
                if (t.toAccount) running[t.toAccount] -= amt;
            } else if (t.type === 'Chi') {
                if (t.fromAccount) running[t.fromAccount] += amt;
            } else if (t.type === 'Chuyển') {
                if (t.fromAccount) running[t.fromAccount] += amt;
                if (t.toAccount) running[t.toAccount] -= amt;
            }
        });
        return balances;
    }, [allTxs, accountsData]);

    // Financial summaries (Loại trừ hoàn toàn các giao dịch điều chỉnh số dư khỏi Thu/Chi kinh doanh)
    const { totalThu, totalChi, countThu, countChi, countChuyen, countAdj } = React.useMemo(() => {
        let thu = 0, chi = 0, cThu = 0, cChi = 0, cChuyen = 0, cAdj = 0;
        basePeriodTxs.forEach(t => {
            const isAdj = isAdjustmentTx(t);
            if (isAdj) {
                cAdj++;
                return; // Không cộng vào Doanh thu / Chi phí kinh doanh
            }

            const amt = Number(t.amount || 0);
            if (t.type === 'Thu') {
                thu += amt;
                cThu++;
            } else if (t.type === 'Chi') {
                chi += amt;
                cChi++;
            } else if (t.type === 'Chuyển') {
                cChuyen++;
            }
        });
        return { totalThu: thu, totalChi: chi, countThu: cThu, countChi: cChi, countChuyen: cChuyen, countAdj: cAdj };
    }, [basePeriodTxs, isAdjustmentTx]);

    const totalCurrentBalance = React.useMemo(() => {
        return accountsData.reduce((sum, acc) => sum + (Number(acc.balance) || 0), 0);
    }, [accountsData]);

    const totalDebtSuppliers = React.useMemo(() => {
        return (erpData?.Suppliers || []).reduce((s, x) => s + (Number(x.totalDebt) || 0), 0);
    }, [erpData?.Suppliers]);

    const selectedTotalAmount = React.useMemo(() => {
        return allTxs.filter(t => selectedTxIds.has(t.id)).reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
    }, [allTxs, selectedTxIds]);

    // Batch Action Handlers
    const handleToggleSelectTx = React.useCallback((id, e) => {
        if (e) e.stopPropagation();
        setSelectedTxIds(prev => {
            const next = new Set(prev);
            if (next.has(id)) next.delete(id);
            else next.add(id);
            return next;
        });
    }, []);

    const handleSelectAllVisible = React.useCallback(() => {
        const visibleTxs = filteredTxs.slice(0, displayLimit);
        const allSelected = visibleTxs.length > 0 && visibleTxs.every(t => selectedTxIds.has(t.id));
        if (allSelected) {
            setSelectedTxIds(new Set());
        } else {
            const next = new Set(selectedTxIds);
            visibleTxs.forEach(t => next.add(t.id));
            setSelectedTxIds(next);
        }
    }, [filteredTxs, displayLimit, selectedTxIds]);

    const handleClearSelection = React.useCallback(() => {
        setSelectedTxIds(new Set());
    }, []);

    const handleBatchDeleteTxs = async () => {
        if (selectedTxIds.size === 0) return;
        const count = selectedTxIds.size;
        if (!window.confirm(`XÁC NHẬN XOÁ HÀNG LOẠT:\n\nBạn có chắc chắn muốn xoá ${count} giao dịch đã chọn?\nSố dư các tài khoản quỹ liên quan sẽ được tự động hoàn lại tương ứng.`)) return;

        const txsToDelete = allTxs.filter(t => selectedTxIds.has(t.id));
        let updatedAccsMap = {};
        const getAcc = (id) => {
            if (!id) return null;
            let found = updatedAccsMap[id] || accountsData.find(a => a.id === id);
            return found ? { ...found } : null;
        };

        txsToDelete.forEach(t => {
            const amt = Number(t.amount || 0);
            if (t.fromAccount) {
                let acc = getAcc(t.fromAccount);
                if (acc) { acc.balance = Number(acc.balance) + amt; updatedAccsMap[acc.id] = acc; }
            }
            if (t.toAccount) {
                let acc = getAcc(t.toAccount);
                if (acc) { acc.balance = Number(acc.balance) - amt; updatedAccsMap[acc.id] = acc; }
            }
        });

        const deleteIds = Array.from(selectedTxIds);
        let payload = { 
            deletes: { Transactions: deleteIds }, 
            Accounts: Object.values(updatedAccsMap) 
        };

        if (payload.Accounts.length > 0) {
            const newLocal = { ...localAccounts };
            payload.Accounts.forEach(u => newLocal[u.id] = u);
            setLocalAccounts(newLocal);
        }
        setLocalTxs(prev => prev.filter(tx => !selectedTxIds.has(tx.id)));
        setSelectedTxIds(new Set());

        await pushDeltas(payload, `Đã xoá ${count} giao dịch và hoàn số dư quỹ!`, 'fa-trash');
    };

    const handleBatchAssignCategory = async (newCategory) => {
        if (selectedTxIds.size === 0 || !newCategory) return;
        const count = selectedTxIds.size;
        const txsToUpdate = allTxs.filter(t => selectedTxIds.has(t.id)).map(t => ({
            ...t,
            category: newCategory
        }));

        let payload = { Transactions: txsToUpdate };

        setLocalTxs(prev => prev.map(t => {
            if (selectedTxIds.has(t.id)) {
                return { ...t, category: newCategory };
            }
            return t;
        }));

        setShowBatchCategoryModal(false);
        setSelectedTxIds(new Set());
        await pushDeltas(payload, `Đã phân bổ danh mục "${newCategory}" cho ${count} giao dịch!`, 'fa-tags');
    };

    // Handlers
    const handleOpenAddTx = () => {
        setEditingTxData({
            type: 'Chi',
            category: categories?.CHI?.[0]?.value || 'Chi Phí Khác',
            amount: '',
            title: '',
            note: '',
            fromAccount: accountsData[0]?.id || '',
            toAccount: '',
            date: new Date().toISOString().slice(0, 10),
            time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false })
        });

            fromAccount: scanned.accId || accountsData[0]?.id || '',
            toAccount: '',
            date: scanned.date || new Date().toISOString().slice(0, 10),
            time: scanned.time || new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false }),
            proofImage: scanned.proofImage

        setShowAddTx(true);
