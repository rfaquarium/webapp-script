<script type="text/babel">
// =========================================================================
// 💰 FILE: Tab_Finance.txt (BẢN VÁ LỖI CỐT LÕI - THUẬT TOÁN NHỒI DỮ LIỆU)
// =========================================================================

// -------------------------------------------------------------------------
// 1. HÀM HỖ TRỢ & UTILS (BUNG NÉN VÀ TẠO GIAO DIỆN)
// -------------------------------------------------------------------------

// Thuật toán bung nén dữ liệu từ cột accountName cũ
const parseAccountInfo = (acc) => {
    if (!acc) return { name: 'Unknown', type: 'Ngân hàng', number: '', owner: '' };
    const raw = acc.accountName || acc.name || '';
    if (raw.includes('|')) {
        const parts = raw.split('|').map(p => p.trim());
        return {
            name: parts[0] || '',
            type: parts[1] || 'Ngân hàng',
            number: parts[2] || '',
            owner: parts[3] || ''
        };
    }
    // Tương thích ngược với các quỹ cũ chưa bị nhồi dữ liệu
    let inferredType = 'Ngân hàng';
    if (raw.toLowerCase().includes('tiền mặt') || raw.toLowerCase().includes('két')) inferredType = 'Tiền mặt';
    return { name: raw, type: inferredType, number: '', owner: '' };
};

const getBankVisuals = (accName, type) => {
    const str = String(accName || '').toLowerCase();
    
    if (str.includes('công ty') || str.includes('cong ty')) {
        return { icon: 'fa-building', color: 'text-blue-500', bg: 'bg-blue-500/10', border: 'border-blue-500/30' };
    }
    if (str.includes('giám đốc') || str.includes('giam doc')) {
        return { icon: 'fa-user-tie', color: 'text-[#8B4513]', bg: 'bg-[#8B4513]/10', border: 'border-[#8B4513]/30' };
    }
    if (str.includes('kế toán') || str.includes('ke toan')) {
        return { icon: 'fa-piggy-bank', color: 'text-pink-500', bg: 'bg-pink-500/10', border: 'border-pink-500/30' };
    }
    if (str.includes('đầu tư') || str.includes('dau tu')) {
        return { icon: 'fa-chart-line', color: 'text-yellow-500', bg: 'bg-yellow-500/10', border: 'border-yellow-500/30' };
    }
    if (str.includes('tiền mặt') || str.includes('tien mat') || type === 'Tiền mặt') {
        return { icon: 'fa-wallet', color: 'text-sky-500', bg: 'bg-sky-500/10', border: 'border-sky-500/30' };
    }
    if (str.includes('shopee')) {
        return { icon: 'fa-shopping-bag', color: 'text-orange-500', bg: 'bg-orange-500/10', border: 'border-orange-500/30' };
    }

    const THEMES = [
        { icon: 'fa-university', color: 'text-blue-500', bg: 'bg-blue-500/10', border: 'border-blue-500/30' },
        { icon: 'fa-landmark', color: 'text-rose-500', bg: 'bg-rose-500/10', border: 'border-rose-500/30' },
        { icon: 'fa-piggy-bank', color: 'text-pink-500', bg: 'bg-pink-500/10', border: 'border-pink-500/30' },
        { icon: 'fa-vault', color: 'text-amber-500', bg: 'bg-amber-500/10', border: 'border-amber-500/30' },
        { icon: 'fa-credit-card', color: 'text-cyan-500', bg: 'bg-cyan-500/10', border: 'border-cyan-500/30' }
    ];

    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    const index = Math.abs(hash) % THEMES.length;
    return THEMES[index];
};

const MetricField = React.memo(({ label, field, value, isEditing, onChange, color, canView = true, disabled = false }) => {
    const formatMoney = (val) => Number(val || 0).toLocaleString('vi-VN');
    return (
        <div className={`bg-[#0a0a0a] border border-[#222] p-2.5 rounded-xl flex flex-col justify-center ${disabled ? 'opacity-70' : ''}`}>
            <span className="text-[9px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">{label}</span>
            {isEditing ? (
                <input type="number" disabled={disabled} value={value === 0 ? '' : value} onChange={(e) => onChange(field, Number(e.target.value))} className={`w-full bg-[#1a1a1a] border border-[#444] rounded-lg px-2.5 py-1.5 text-[13px] font-black outline-none focus:border-[#d4af37] ${color} transition-colors ${disabled ? 'cursor-not-allowed' : ''}`} placeholder="0" />
            ) : (
                <span className={`text-[13px] font-black ${color}`}>
                    {field === 'orderCount' ? (value || 0) : (canView ? formatMoney(value) + 'đ' : '******* đ')}
                </span>
            )}
        </div>
    );
});

function ProofViewerModal({ imageUrl, onClose }) {

    return (

                <img src={imageUrl} alt="Chứng từ" className="max-w-full max-h-[80vh] object-contain rounded-xl border-4 border-[#333] shadow-[0_0_50px_rgba(0,0,0,0.8)]" />

function AccountModal({ onClose, onSubmit, initialData }) {
    const parsed = parseAccountInfo(initialData);
    const [form, setForm] = React.useState({ 
        accountName: parsed.name === 'Unknown' ? '' : parsed.name, 
        type: parsed.type, 
        accountNumber: parsed.number, 
        accountOwner: parsed.owner, 
        balance: initialData?.balance || '' 
    });

    const save = () => {
        if (!form.accountName) return alert('Nhập tên quỹ!');
        
        // NHỒI DỮ LIỆU: Bọc tất cả vào 1 chuỗi để lách qua Google Sheets
        const cleanName = form.accountName.replace(/\|/g, '');
        const cleanType = form.type.replace(/\|/g, '');
        const cleanNumber = form.accountNumber.replace(/\|/g, '');
        const cleanOwner = form.accountOwner.replace(/\|/g, '');
        
        const combinedName = `${cleanName} | ${cleanType} | ${cleanNumber} | ${cleanOwner}`;
        
        const targetId = initialData?.id || 'ACC_' + Date.now();
        let payload = { Accounts: [{ id: targetId, accountName: combinedName, balance: Number(form.balance) || 0 }] };
        
        if (initialData && Number(form.balance) !== Number(initialData.balance || 0)) {
            const diff = Number(form.balance) - Number(initialData.balance || 0);
            payload.Transactions = [{
                id: 'TX_ADJ_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                type: diff > 0 ? 'Thu' : 'Chi',
                category: 'Chi phí khác', // Fallback to a general category
                amount: Math.abs(diff),
                title: 'Điều chỉnh cân bằng quỹ',
                fromAccount: diff < 0 ? targetId : '',
                toAccount: diff > 0 ? targetId : '',
                date: new Date().toISOString().replace('T', ' ').slice(0, 19),
                note: `Hệ thống sinh phiếu điều chỉnh số dư từ ${typeof formatMoney === 'function' ? formatMoney(initialData.balance) : initialData.balance} thành ${typeof formatMoney === 'function' ? formatMoney(form.balance) : form.balance}`,
                isAuto: true
            }];
        }

        onSubmit(payload);
    };

    return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-[#141414] w-full max-w-sm rounded-3xl p-5 border border-[#333] shadow-2xl flex flex-col relative" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-3">
                    <h3 className="font-black text-[#3b82f6] text-[14px] uppercase tracking-widest"><i className="fas fa-university mr-2"></i>{initialData ? 'CẬP NHẬT QUỸ' : 'TẠO QUỸ MỚI'}</h3>
                    <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#222] text-gray-500 hover:text-white flex items-center justify-center"><i className="fas fa-times text-sm"></i></button>
                </div>

                <div className="space-y-3">
                    <div><label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">Tên Quỹ / Ngân Hàng</label><input type="text" value={form.accountName} onChange={e=>setForm({...form, accountName: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-[#3b82f6]" placeholder="VD: Vietcombank, Quỹ Tiền Mặt..." autoFocus /></div>
                    <div>
                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">Loại Quỹ</label>
                        <select value={form.type} onChange={e=>setForm({...form, type: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-[#3b82f6]">
                            <option value="Ngân hàng">Tài khoản Ngân hàng</option>
                            <option value="Tiền mặt">Quỹ Tiền Mặt (Két sắt)</option>
                        </select>
                    </div>
                    {form.type === 'Ngân hàng' && (
                        <div className="grid grid-cols-2 gap-3">
                            <div><label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">Số Tài Khoản</label><input type="text" value={form.accountNumber} onChange={e=>setForm({...form, accountNumber: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-[#3b82f6]" placeholder="VD: 1903..." /></div>
                            <div><label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">Chủ Tài Khoản</label><input type="text" value={form.accountOwner} onChange={e=>setForm({...form, accountOwner: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-[#3b82f6]" placeholder="VD: NGUYEN VAN A" /></div>

                    <div><label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">Số dư hiện tại (VNĐ)</label><input type="number" value={form.balance} onChange={e=>setForm({...form, balance: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-2.5 text-[15px] font-black text-[#d4af37] outline-none focus:border-[#3b82f6]" placeholder="0" /></div>
                </div>

                <div className="flex gap-2 mt-5 shrink-0 pt-3 border-t border-[#222]">
                    <button onClick={onClose} className="flex-1 py-3 bg-[#222] text-gray-400 font-black rounded-xl text-[12px] active:scale-95 transition-all uppercase tracking-wider">HỦY</button>

}

function AccountHistoryModal({ account, allTxs, onClose, secureMoney, pushDeltas, canManageFinance, onDeleteTx }) {
    const [viewingProof, setViewingProof] = React.useState(null);
    const [displayLimit, setDisplayLimit] = React.useState(50);
    const parsed = parseAccountInfo(account);

    const historyTxs = React.useMemo(() => {
        if (!account) return [];
        return allTxs.filter(t => {
            const accId = account.id;
            return (t.fromAccount === accId || t.toAccount === accId);
        }).sort((a, b) => new Date(`${b.date}T${b.time || '00:00'}`) - new Date(`${a.date}T${a.time || '00:00'}`));
    }, [account, allTxs]);

    const stats = React.useMemo(() => {
        let inAmt = 0, outAmt = 0;
        historyTxs.forEach(t => {
            if (t.type === 'Chuyển') {
                if (t.fromAccount === account.id) outAmt += Number(t.amount || 0); 
                if (t.toAccount === account.id) inAmt += Number(t.amount || 0); 
            } else if (t.type === 'Thu') {
                inAmt += Number(t.amount || 0);
            } else if (t.type === 'Chi') {
                outAmt += Number(t.amount || 0);
            }
        });
        return { inAmt, outAmt };
    }, [historyTxs, account]);

    if (!account) return null;
    const visuals = getBankVisuals(parsed.name, parsed.type);

    return (
        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-[#141414] border border-[#333] w-full max-w-2xl rounded-3xl p-5 shadow-2xl flex flex-col h-[85vh] relative animate-slide-up" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-500 hover:text-white hover:bg-rose-500 flex items-center justify-center transition-all z-20"><i className="fas fa-times text-sm"></i></button>

                <div className="flex items-center gap-3 mb-4 border-b border-[#222] pb-3 shrink-0">
                    <div className={`w-11 h-11 rounded-full ${visuals.bg} border ${visuals.border} ${visuals.color} flex items-center justify-center text-xl`}>
                        <i className={`fas ${visuals.icon}`}></i>
                    </div>
                    <div>
                        <h3 className="font-black text-white text-[15px] uppercase tracking-widest leading-none">Lịch Sử: {parsed.name}</h3>
                        
                        {parsed.type !== 'Tiền mặt' && (
                            <>
                                <div className="text-[#3b82f6] text-[12px] mt-1 font-mono font-bold tracking-wider">STK: {parsed.number || '---'}</div>
                                <div className="text-gray-400 text-[10px] mt-0.5 font-mono font-bold tracking-wider">Chủ TK: {parsed.owner || '---'}</div>
                            </>
                        )}
                        {parsed.type === 'Tiền mặt' && <p className="text-[#10b981] text-[12px] mt-1 font-mono font-bold tracking-wider">Quỹ Tiền Mặt (Két sắt)</p>}
                    </div>
                </div>

                <div className="flex gap-2 mb-4 shrink-0">
                    <div className="flex-1 bg-[#1a1a1a] p-3 rounded-xl border border-[#333]">
                        <div className="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1">Tổng Tiền Chảy Vào</div>
                        <div className="text-[15px] font-black text-[#10b981]">+{secureMoney(stats.inAmt)}đ</div>
                    </div>
                    <div className="flex-1 bg-[#1a1a1a] p-3 rounded-xl border border-[#333]">
                        <div className="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1">Tổng Tiền Trút Ra</div>
                        <div className="text-[15px] font-black text-[#f43f5e]">{secureMoney(stats.outAmt)}đ</div>
                    </div>
                    <div className="flex-1 bg-[#1a1a1a] p-3 rounded-xl border border-[#3b82f6]/30">
                        <div className="text-[9px] font-black text-[#3b82f6] uppercase tracking-widest mb-1">Sổ Sách Báo Dư</div>
                        <div className="text-[15px] font-black text-[#d4af37]">{secureMoney(account.balance)}đ</div>
                    </div>
                </div>

                <div className="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-2.5">
                    {historyTxs.length === 0 ? (
                        <div className="h-full flex flex-col items-center justify-center text-gray-500 opacity-50">
                            <i className="fas fa-receipt text-4xl mb-3"></i>
                            <div className="text-[12px] font-bold">Chưa có giao dịch nào liên quan đến quỹ này.</div>
                        </div>
                    ) : (
                        historyTxs.slice(0, displayLimit).map(t => {
                            let displayType = t.type;
                            let displayAmt = t.amount;
                            let colorClass = ''; let sign = '';

                            if (t.type === 'Chuyển') {
                                if (t.fromAccount === account.id) {
                                    displayType = 'Chuyển Đi'; colorClass = 'text-[#f43f5e]'; sign = '-';
                                } else {
                                    displayType = 'Nhận Tiền'; colorClass = 'text-[#10b981]'; sign = '+';
                                }
                            } else {
                                if (t.type === 'Thu') { colorClass = 'text-[#10b981]'; sign = '+'; }
                                else { colorClass = 'text-[#f43f5e]'; sign = '-'; }
                            }

                            return (
                                <div key={t.id} className="bg-[#0a0a0a] border border-[#222] p-3 rounded-xl flex justify-between items-center shadow-sm hover:border-[#333] transition-colors group">
                                    <div className="flex-1 min-w-0 pr-3">
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="font-black text-[12px] text-white truncate">{t.title}</span>
                                            <span className={`px-1.5 py-0.5 rounded text-[8px] font-black uppercase border ${displayType.includes('Chuyển') || displayType.includes('Nhận') ? 'bg-[#3b82f6]/20 text-[#3b82f6] border-[#3b82f6]/30' : t.type === 'Thu' ? 'bg-[#10b981]/20 text-[#10b981] border-[#10b981]/30' : 'bg-[#f43f5e]/20 text-[#f43f5e] border-[#f43f5e]/30'}`}>{displayType}</span>
                                            {t.isAuto && <span className="bg-gray-800 text-gray-400 text-[8px] font-black px-1.5 py-0.5 rounded border border-gray-700 uppercase tracking-wider shrink-0">Auto</span>}
                                            {t.isCleared && <span className="bg-[#10b981]/20 text-[#10b981] border border-[#10b981]/40 text-[8px] font-black px-1.5 py-0.5 rounded shadow-[0_0_8px_rgba(16,185,129,0.3)] tracking-wider shrink-0">✔ ĐÃ ĐỐI SOÁT</span>}
                                            {t.proofImage && (
                                                <button onClick={() => setViewingProof(t.proofImage)} className="text-[#eab308] hover:text-[#d4af37] text-[10px] bg-[#eab308]/10 px-1.5 py-0.5 rounded border border-[#eab308]/30 flex items-center gap-1 transition-all active:scale-95" title="Xem ảnh chứng từ"><i className="fas fa-image"></i> Ảnh</button>
                                            )}
                                        </div>
                                        <div className="text-[10px] text-gray-400 font-medium truncate mb-1.5">{t.note}</div>
                                        <div className="flex items-center gap-2 text-[9px] text-gray-500 font-bold">
                                            <span className="bg-[#1a1a1a] px-1.5 py-0.5 rounded border border-[#222]"><i className="far fa-calendar-alt mr-1"></i>{String(t.date).slice(0, 16)}</span>
                                            <span className="bg-[#1a1a1a] px-1.5 py-0.5 rounded border border-[#222] truncate max-w-[100px]"><i className="fas fa-folder-open mr-1"></i>{t.category}</span>
                                        </div>
                                    </div>
                                    <div className="text-right shrink-0">
                                        <div className={`text-[15px] font-black ${colorClass}`}>
                                            {sign}{secureMoney(displayAmt)}
                                        </div>
                                        {canManageFinance && (
                                            <div className="flex justify-end gap-2 mt-1">
                                                {t.isCleared && localStorage.getItem('rf_boss') !== 'true' ? (
                                                    <span className="text-[9px] text-gray-600 opacity-0 group-hover:opacity-100 transition-opacity" title="Đã đối soát, không thể xoá"><i className="fas fa-lock mr-1"></i>Đã Khóa</span>
                                                ) : (
                                                    <button onClick={(e) => { e.stopPropagation(); if (onDeleteTx) onDeleteTx(t); }} className="text-[10px] text-gray-500 hover:text-rose-500 underline decoration-gray-600 underline-offset-2 opacity-0 group-hover:opacity-100 transition-opacity">Xoá</button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })
                    )}
                    {historyTxs.length > displayLimit && (
                        <button onClick={() => setDisplayLimit(prev => prev + 50)} className="w-full py-3 mt-2 bg-[#222] text-gray-400 text-[11px] font-bold uppercase rounded-xl hover:bg-[#333] hover:text-white transition-colors border border-[#333] shrink-0">
                            Xem thêm ({displayLimit} / {historyTxs.length}) <i className="fas fa-chevron-down ml-1"></i>
                        </button>
                    )}
                </div>
            </div>
            {viewingProof && <ProofViewerModal imageUrl={viewingProof} onClose={() => setViewingProof(null)} />}
        </div>
    );
}

function ImportStatementModal({ onClose, pushDeltas, triggerToast, erpData, categories }) {
    const [isProcessing, setIsProcessing] = React.useState(false);
    const [scannedData, setScannedData] = React.useState([]);
    const [selectedRows, setSelectedRows] = React.useState(new Set());
    const [bankAccounts, setBankAccounts] = React.useState([]);
    const [selectedBankId, setSelectedBankId] = React.useState('');
    const fileInputRef = React.useRef(null);

    React.useEffect(() => {
        const accs = (erpData?.Accounts || []);
        setBankAccounts(accs);
        if (accs.length > 0) setSelectedBankId(accs[0].id);
        
        if (typeof window.XLSX === 'undefined') {
            const script = document.createElement('script');
            script.src = "https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
            document.body.appendChild(script);
        }
    }, [erpData]);

    const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessing(true);
        if (typeof window.XLSX === 'undefined') {
            triggerToast('Đang tải thư viện xử lý Excel, vui lòng thử lại sau 3 giây!', 'fa-spinner', 'warning');
            setIsProcessing(false);
            return;
        }

        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const data = evt.target.result;
                let workbook;
                let isCSV = false;
                try { workbook = window.XLSX.read(data, { type: 'binary' }); } 
                catch (err) { isCSV = true; }

                if(isCSV) {
                   const readerCSV = new FileReader();
                   readerCSV.onload = (eCSV) => { processSheetData(window.XLSX.read(eCSV.target.result, {type: 'string'}).Sheets[window.XLSX.read(eCSV.target.result, {type: 'string'}).SheetNames[0]]); };
                   readerCSV.readAsText(file);
                   return;
                }
                processSheetData(workbook.Sheets[workbook.SheetNames[0]]);
            } catch (err) {
                triggerToast('Lỗi đọc file!', 'fa-times', 'danger');
                setIsProcessing(false);
            }
        };
        reader.readAsBinaryString(file);
    };

    const processSheetData = (worksheet) => {
        const json = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
        const existingTxs = erpData?.Transactions || []; 
        let parsedTransactions = [];
        let headerRowIndex = -1;
        let colMap = { date: -1, debit: -1, credit: -1, desc: -1 };

        for (let i = 0; i < Math.min(20, json.length); i++) {
            const row = Object.values(json[i]);
            let foundDate = -1, foundDebit = -1, foundCredit = -1, foundDesc = -1;
            
            row.forEach((cellText, colIndex) => {
                const text = String(cellText).toLowerCase().trim();
                if (text.includes('ngày') || text.includes('date') || text.includes('thời gian')) { if (foundDate === -1) foundDate = colIndex; }
                if (text.includes('phát sinh nợ') || text.includes('ghi nợ') || text === 'nợ' || text.includes('debit') || text === 'chi' || text === 'số tiền chi') foundDebit = colIndex;
                if (text.includes('phát sinh có') || text.includes('ghi có') || text === 'có' || text.includes('credit') || text === 'thu' || text === 'số tiền thu') foundCredit = colIndex;
                if (text.includes('diễn giải') || text.includes('nội dung') || text.includes('desc') || text.includes('detail')) foundDesc = colIndex;
            });

            if (foundDate > -1 && foundDesc > -1 && (foundDebit > -1 || foundCredit > -1)) {
                headerRowIndex = i; colMap = { date: foundDate, debit: foundDebit, credit: foundCredit, desc: foundDesc }; break;
            }
        }

        if (headerRowIndex === -1) { headerRowIndex = 14; colMap = { date: 2, debit: 5, credit: 6, desc: 11 }; }

        for (let i = headerRowIndex + 1; i < json.length; i++) {
            const row = Object.values(json[i]);
            if (row.length === 0 || !row[colMap.date]) continue; 
            
            const rawDate = String(row[colMap.date]);
            const rawDesc = String(row[colMap.desc] || '');
            
            let debit = 0;
            if (colMap.debit > -1) debit = typeof row[colMap.debit] === 'number' ? row[colMap.debit] : (Number(String(row[colMap.debit] || '').replace(/[^\d]/g, '')) || 0);

            let credit = 0;
            if (colMap.credit > -1) credit = typeof row[colMap.credit] === 'number' ? row[colMap.credit] : (Number(String(row[colMap.credit] || '').replace(/[^\d]/g, '')) || 0);

            if (rawDate.trim() === '' || (debit === 0 && credit === 0)) continue;

            let formattedDate = rawDate;
            try {
                const dateParts = rawDate.split(/[\s/:]+/);
                if (dateParts.length >= 3) {
                    const day = dateParts[0].padStart(2, '0');
                    const month = dateParts[1].padStart(2, '0');
                    const year = dateParts[2].length === 2 ? '20'+dateParts[2] : dateParts[2];
                    const hour = dateParts[3] ? dateParts[3].padStart(2, '0') : '12';
                    const min = dateParts[4] ? dateParts[4].padStart(2, '0') : '00';
                    formattedDate = `${year}-${month}-${day} ${hour}:${min}`;
                }
            } catch(e) {}

            let type = ''; let amount = 0; let category = 'Chờ Xử Lý';
            
            if (credit > 0) {
                type = 'Thu'; amount = credit;
                const thuVals = (categories?.THU || []).map(c => c.value);
                if (rawDesc.toUpperCase().includes('SHOPEE') || rawDesc.toUpperCase().includes('TIKTOK')) {
                    category = thuVals.includes('Thu Tiền Bán Hàng') ? 'Thu Tiền Bán Hàng' : 'Chờ Xử Lý';
                }
            } else if (debit > 0) {
                type = 'Chi'; amount = debit;
                const chiVals = (categories?.CHI || []).map(c => c.value);
                if (rawDesc.toUpperCase().includes('LUONG') || rawDesc.toUpperCase().includes('THUONG')) {
                    category = chiVals.includes('Trả Lương') ? 'Trả Lương' : 'Chờ Xử Lý';
                } else if (rawDesc.toUpperCase().includes('CHUYEN TIEN') || rawDesc.toUpperCase().includes('CHUYEN KHOAN')) {
                    category = chiVals.includes('Thanh Toán NCC') ? 'Thanh Toán NCC' : 'Chờ Xử Lý';
                }
            }

            const cleanText = (str) => {
                if (!str) return '';
                return String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
            };

            let dupLevel = 0; // 0: Xanh, 1: Vàng (Nghi ngờ), 2: Đỏ (Chắc chắn trùng), 3: Xanh lá ngọc (Khớp lệnh)
            let matchedTxId = null;

            const extractOrderId = (text) => {
                const match = String(text || '').match(/(DH|RF|SO|HD|DH-)\s*([0-9]{4,8})/i);
                return match ? match[0].replace(/\s+/g, '').toUpperCase() : null;
            };

            const noteImportClean = cleanText(rawDesc);
            const orderIdImport = extractOrderId(rawDesc);

            existingTxs.forEach(t => {
                if (dupLevel === 2) return;
                
                const sameAmount = Number(t.amount) === amount;
                const sameType = t.type === type;
                if (!sameAmount || !sameType) return;
                
                const noteDBClean = cleanText(t.note);
                const orderIdDB = extractOrderId(t.note);
                
                // Tier 1: Khớp tuyệt đối (Order ID)
                if (orderIdImport && orderIdDB && orderIdImport === orderIdDB) {
                    if (t.isCleared || t.isAuto) {
                        dupLevel = 2; // Đã đối soát hoặc đã import trước đó -> Trùng lặp
                    } else {
                        dupLevel = 3; // Khớp lệnh
                        matchedTxId = t.id;
                    }
                    return;
                }
                
                // Tier 2: Khớp tương đối (+- 5 ngày)
                const tDate = new Date(t.date);
                const importDate = new Date(formattedDate);
                const diffDays = Math.abs(tDate - importDate) / (1000 * 60 * 60 * 24);
                
                if (diffDays <= 5) {
                    const isSameDesc = (noteDBClean && noteImportClean && (noteDBClean.includes(noteImportClean) || noteImportClean.includes(noteDBClean)));
                    if (isSameDesc) {
                        if (t.isCleared || t.isAuto) {
                            dupLevel = 2; // Trùng
                        } else {
                            dupLevel = 3; // Khớp lệnh
                            matchedTxId = t.id;
                        }
                    } else if (dupLevel < 2 && diffDays === 0) {
                        dupLevel = 1; // Vàng: Trùng ngày & số tiền nhưng khác nội dung
                    }
                }
            });
            
            if (dupLevel === 3 && type === 'Thu') category = 'Bán Hàng';

            parsedTransactions.push({ _id: 'TEMP_' + Date.now() + i, date: formattedDate, type: type, amount: amount, category: category, note: rawDesc, title: `${type} Sao Kê`, dupLevel: dupLevel, matchedTxId: matchedTxId });
        }

        setScannedData(parsedTransactions);
        // Mặc định CHỈ TỰ ĐỘNG CHỌN các giao dịch màu Xanh (Hợp lệ) hoặc Xanh Ngọc (Khớp lệnh)
        setSelectedRows(new Set(parsedTransactions.filter(t => t.dupLevel === 0 || t.dupLevel === 3).map(t => t._id)));
        setIsProcessing(false);
        triggerToast(`Đã quét xong ${parsedTransactions.length} giao dịch!`, 'fa-check', 'success');
    };

    const toggleRow = (id) => {
        const newSet = new Set(selectedRows);
        if (newSet.has(id)) newSet.delete(id); else newSet.add(id);
        setSelectedRows(newSet);
    };

    const toggleAll = () => {
        if (selectedRows.size === scannedData.length) setSelectedRows(new Set());
        else setSelectedRows(new Set(scannedData.map(t => t._id)));
    };

    const handleImport = async () => {
        if (selectedRows.size === 0) return triggerToast('Vui lòng chọn ít nhất 1 giao dịch!', 'fa-exclamation', 'warning');
        if (!selectedBankId) return triggerToast('Vui lòng chọn tài khoản ngân hàng tương ứng!', 'fa-exclamation', 'warning');

        setIsProcessing(true);
        const transactionsToImport = scannedData.filter(t => selectedRows.has(t._id));
        
        let payload = { Transactions: [], Accounts: [] };
        let totalNet = 0;

        transactionsToImport.forEach((t, i) => {
            if (t.dupLevel === 3 && t.matchedTxId) {
                // UPDATE EXISITNG TRANSACTION -> Cập nhật isCleared = true, và ghi nhận bankRef
                payload.Transactions.push({
                    id: t.matchedTxId,
                    isCleared: true,
                    bankRef: 'BNK_' + Date.now() + '_' + i
                });
                // Nếu đối soát thu thì có thể là không cộng tiền vào quỹ nữa vì quỹ có thể đã cộng lúc thủ quỹ cầm tiền mặt
                // Tuy nhiên, bank đã nhận tiền, tức là quỹ Bank tăng. Tuỳ thuộc hệ thống có tách quỹ Bank riêng không.
                // Nếu Bank Account là quỹ đích, thì vẫn phải cộng cho nó, trừ khi Quỹ Bán Hàng chuyển sang.
                // Tạm thời vẫn cộng trừ theo logic cũ để đảm bảo quỹ Bank đúng với sao kê.
                totalNet += t.type === 'Thu' ? t.amount : -t.amount;
            } else {
                // TẠO MỚI GIAO DỊCH SAO KÊ
                const finalId = 'TX_SK_' + Date.now() + i;
                payload.Transactions.push({
                    id: finalId, type: t.type, category: t.category, amount: t.amount, date: t.date, title: t.title, note: t.note,
                    fromAccount: t.type === 'Chi' ? selectedBankId : '',
                    toAccount: t.type === 'Thu' ? selectedBankId : '',
                    isAuto: true,
                    isCleared: true,
                    bankRef: 'BNK_' + Date.now() + '_' + i
                });
                totalNet += t.type === 'Thu' ? t.amount : -t.amount;
            }
        });

        const acc = bankAccounts.find(a => a.id === selectedBankId);
        if (acc) payload.Accounts.push({ ...acc, balance: Number(acc.balance || 0) + totalNet });

        try {
            await pushDeltas(payload, `Đã import ${transactionsToImport.length} giao dịch thành công!`, 'fa-cloud-upload-alt');
            onClose();
        } catch (e) {
            triggerToast('Lỗi khi import!', 'fa-times', 'danger');
            setIsProcessing(false);
        }
    };

    return (
        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-[#141414] border border-[#3b82f6]/50 w-full max-w-4xl rounded-3xl p-5 shadow-[0_0_40px_rgba(59,130,246,0.2)] flex flex-col h-[90vh] relative animate-slide-up" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-500 hover:text-white hover:bg-rose-500 flex items-center justify-center transition-all z-20"><i className="fas fa-times text-sm"></i></button>
                <div className="flex items-center gap-3 mb-4 border-b border-[#222] pb-3 shrink-0">
                    <div className="w-10 h-10 rounded-full bg-[#3b82f6]/20 text-[#3b82f6] flex items-center justify-center text-xl"><i className="fas fa-file-excel"></i></div>
                    <div><h3 className="font-black text-white text-[16px] uppercase tracking-widest leading-none">Máy Quét Sao Kê</h3><p className="text-gray-400 text-[11px] mt-1">Đọc file Excel/CSV từ ngân hàng</p></div>
                </div>
                <div className="flex gap-3 mb-4 shrink-0">
                    <div className="flex-1">
                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">1. Tải lên File Sao Kê</label>
                        <div className="relative">
                            <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".xlsx, .xls, .csv" className="hidden" />
                            <button onClick={() => fileInputRef.current?.click()} disabled={isProcessing} className="w-full bg-[#0a0a0a] border-2 border-dashed border-[#333] hover:border-[#3b82f6] text-gray-400 hover:text-white rounded-xl py-4 flex flex-col items-center justify-center transition-all cursor-pointer">
                                {isProcessing ? <i className="fas fa-spinner fa-spin text-2xl text-[#3b82f6] mb-2"></i> : <i className="fas fa-cloud-upload-alt text-2xl text-[#3b82f6] mb-2"></i>}
                                <span className="font-bold text-[12px]">{isProcessing ? 'Đang phân tích...' : 'Bấm để chọn File Excel/CSV'}</span>
                            </button>
                        </div>
                    </div>
                    <div className="flex-[0.5]">
                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">2. Chọn Ngân Hàng Đích</label>
                        <select value={selectedBankId} onChange={(e) => setSelectedBankId(e.target.value)} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3 text-white font-bold outline-none focus:border-[#3b82f6] h-[78px]">
                            {bankAccounts.length === 0 ? <option value="">-- Chưa có Quỹ nào --</option> : null}
                            {bankAccounts.map(a => {
                                const p = parseAccountInfo(a);
                                return <option key={a.id} value={a.id}>{p.name} {p.number ? `- ${p.number}` : ''}</option>;
                            })}
                        </select>
                    </div>
                </div>
                <div className="flex-1 overflow-hidden flex flex-col bg-[#0a0a0a] border border-[#222] rounded-xl">
                    <div className="flex items-center justify-between p-2 bg-[#1a1a1a] border-b border-[#333] shrink-0">
                        <div className="text-[11px] font-black text-white ml-2">KẾT QUẢ QUÉT ({scannedData.length} Dòng)</div>
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] text-gray-400 font-bold">Hợp lệ để Import: <b className="text-[#3b82f6]">{selectedRows.size}</b></span>
                            <button onClick={toggleAll} className="px-3 py-1.5 bg-[#222] text-[10px] font-bold text-white rounded hover:bg-[#333]">Chọn / Bỏ chọn tất cả</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto custom-scrollbar p-2">
                        {scannedData.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-gray-500 opacity-50"><i className="fas fa-search-dollar text-4xl mb-3"></i><div className="text-[12px] font-bold">Chưa có dữ liệu. Vui lòng tải file lên.</div></div>
                        ) : (
                            <table className="w-full text-left border-collapse text-[11px]">
                                <thead>
                                    <tr className="text-gray-500 font-black tracking-wider uppercase border-b border-[#333] sticky top-0 bg-[#0a0a0a] z-10">
                                        <th className="p-2 w-10 text-center">X</th>
                                        <th className="p-2 w-[120px]">Thời gian</th>
                                        <th className="p-2 w-[50px]">Loại</th>
                                        <th className="p-2 w-[100px] text-right">Số tiền</th>
                                        <th className="p-2 w-[150px]">Phân loại Thu / Chi</th>
                                        <th className="p-2">Nội dung (Diễn giải)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {scannedData.map(t => {
                                        const isSelected = selectedRows.has(t._id);
                                        
                                        let rowClass = 'hover:bg-[#1a1a1a] cursor-pointer';
                                        let textClass = 'text-gray-300';
                                        let tagHtml = null;
                                        let chkClass = isSelected ? 'bg-[#3b82f6] border-[#3b82f6] text-white' : 'border-[#444] text-transparent';

                                        if (t.dupLevel === 2) {
                                            rowClass = 'opacity-40 cursor-not-allowed bg-[#1a1a1a]';
                                            textClass = 'text-gray-500 line-through';
                                            tagHtml = <div className="text-[8px] text-rose-500 font-black bg-rose-500/10 px-1 py-0.5 rounded mt-1 inline-block border border-rose-500/30 tracking-widest uppercase">Trùng Lặp</div>;
                                        } else if (t.dupLevel === 3) {
                                            rowClass = 'hover:bg-[#10b981]/20 cursor-pointer bg-[#10b981]/10 border-[#10b981]/50';
                                            textClass = 'text-[#10b981]';
                                            tagHtml = <div className="text-[8px] text-[#10b981] font-black bg-[#10b981]/20 px-1.5 py-0.5 rounded mt-1 inline-block border border-[#10b981]/40 tracking-widest uppercase shadow-[0_0_10px_rgba(16,185,129,0.3)]"><i className="fas fa-check-double mr-1"></i> Đối Soát</div>;
                                            if (isSelected) chkClass = 'bg-[#10b981] border-[#10b981] text-white';
                                        } else if (t.dupLevel === 1) {
                                            rowClass = 'hover:bg-amber-900/20 cursor-pointer bg-amber-900/10 border-amber-900/50';
                                            textClass = 'text-amber-200';
                                            tagHtml = <div className="text-[8px] text-amber-500 font-black bg-amber-500/10 px-1 py-0.5 rounded mt-1 inline-block border border-amber-500/30 tracking-widest uppercase" title="Trùng ngày & số tiền nhưng khác nội dung">Nghi Ngờ</div>;
                                            if (isSelected) rowClass = t.type === 'Thu' ? 'bg-[#10b981]/10' : 'bg-rose-500/10';
                                        } else {
                                            if (isSelected) rowClass = t.type === 'Thu' ? 'bg-[#10b981]/10' : 'bg-rose-500/10';
                                        }

                                        return (
                                            <tr key={t._id} onClick={() => t.dupLevel !== 2 && toggleRow(t._id)} className={`border-b border-[#222] transition-colors ${rowClass}`}>
                                                <td className="p-2 text-center"><div className={`w-4 h-4 rounded border flex items-center justify-center mx-auto ${chkClass}`}><i className="fas fa-check text-[8px]"></i></div></td>
                                                <td className="p-2 font-mono"><div className={textClass}>{t.date}</div>{tagHtml}</td>
                                                <td className="p-2"><span className={`px-1.5 py-0.5 rounded font-black text-[9px] uppercase ${t.dupLevel === 2 ? 'bg-[#333] text-gray-500' : (t.type === 'Thu' ? 'bg-[#10b981]/20 text-[#10b981]' : 'bg-rose-500/20 text-rose-500')}`}>{t.type}</span></td>
                                                <td className={`p-2 text-right font-black ${t.dupLevel === 2 ? 'text-gray-500 line-through' : (t.type === 'Thu' ? 'text-[#10b981]' : 'text-rose-500')}`}>{Number(t.amount).toLocaleString('vi-VN')}đ</td>
                                                <td className="p-2">
                                                    <select value={t.category} disabled={t.dupLevel === 2} onClick={e => e.stopPropagation()} onChange={(e) => { const newData = [...scannedData]; const idx = newData.findIndex(x => x._id === t._id); newData[idx].category = e.target.value; setScannedData(newData); }} className={`w-full bg-[#111] border border-[#333] rounded text-[10px] p-1.5 outline-none font-bold ${t.dupLevel === 2 ? 'text-gray-600' : 'text-white focus:border-[#3b82f6]'}`}>
                                                        {(t.type === 'Thu' ? (categories?.THU || []) : (categories?.CHI || [])).map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
                                                    </select>
                                                </td>
                                                <td className={`p-2 font-medium line-clamp-2 leading-snug ${t.dupLevel === 2 ? 'text-gray-600' : (t.dupLevel === 1 ? 'text-amber-200/80' : 'text-gray-300')}`} title={t.note}>{t.note}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        )}
                    </div>
                </div>
                <div className="mt-4 pt-4 border-t border-[#333] shrink-0">
                    <button onClick={handleImport} disabled={isProcessing || selectedRows.size === 0} className={`w-full py-4 font-black rounded-xl text-[13px] uppercase tracking-wider transition-all flex items-center justify-center gap-2 ${isProcessing || selectedRows.size === 0 ? 'bg-[#222] text-gray-500 cursor-not-allowed' : 'bg-[#3b82f6] hover:bg-[#2563eb] text-white shadow-[0_0_20px_rgba(59,130,246,0.3)] active:scale-95'}`}>
                        {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> ĐANG IMPORT...</> : <><i className="fas fa-cloud-download-alt text-lg"></i> IMPORT {selectedRows.size} GIAO DỊCH MỚI VÀO HỆ THỐNG</>}
                    </button>
                </div>
            </div>
        </div>
    );
}

function ShopeeWalletScannerModal({ categories, erpData, onClose, pushDeltas, triggerToast, accountsData }) {
    const [isProcessing, setIsProcessing] = React.useState(false);
    const [scannedData, setScannedData] = React.useState([]);
    const [selectedRows, setSelectedRows] = React.useState(new Set());
    const [selectedWalletId, setSelectedWalletId] = React.useState('');
    const fileInputRef = React.useRef(null);

    const shopeeAccounts = React.useMemo(() => {
        return (accountsData || []).filter(a => {
            const p = parseAccountInfo(a);
            return p.name.toLowerCase().includes('shopee') || p.name.toLowerCase().includes('ví');
        });
    }, [accountsData]);

    React.useEffect(() => {
        if (shopeeAccounts.length > 0) {
            setSelectedWalletId(shopeeAccounts[0].id);
        } else if (accountsData && accountsData.length > 0) {
            setSelectedWalletId(accountsData[0].id);
        }
    }, [shopeeAccounts, accountsData]);

    const existingTxs = erpData?.Transactions || [];

    const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessing(true);
        const reader = new FileReader();

        reader.onload = (evt) => {
            try {
                const data = new Uint8Array(evt.target.result);
                const wb = window.XLSX.read(data, { type: 'array' });
                let bestSheet = wb.Sheets[wb.SheetNames[0]];
                let rows = window.XLSX.utils.sheet_to_json(bestSheet, { header: 1, defval: '' });

                if (rows.length < 2) {
                    triggerToast('File rỗng hoặc không đúng định dạng!', 'fa-exclamation', 'warning');
                    setIsProcessing(false);
                    return;
                }

                let headerIdx = 0;
                for (let i = 0; i < Math.min(15, rows.length); i++) {
                    const rowStr = (rows[i] || []).join(' ').toLowerCase();
                    if (rowStr.includes('loại giao dịch') || rowStr.includes('số tiền') || rowStr.includes('mô tả') || rowStr.includes('mã đơn hàng') || rowStr.includes('transaction type') || rowStr.includes('amount')) {
                        headerIdx = i;
                        break;
                    }
                }

                const headers = (rows[headerIdx] || []).map(h => String(h).toLowerCase().trim());
                const findCol = (keys) => headers.findIndex(h => keys.some(k => String(h).includes(k)));

                let iDate = findCol(['ngày', 'thời gian', 'date', 'created at', 'thời gian tạo']);
                let iType = findCol(['loại giao dịch', 'transaction type', 'loại']);
                let iAmount = findCol(['số tiền (vnd)', 'số tiền', 'amount', 'tiền']);
                let iDesc = findCol(['mô tả', 'description', 'mã đơn hàng/mã hoàn tiền', 'mã đơn hàng', 'order id', 'mã giao dịch']);

                if (iAmount === -1) {
                    alert('Không tìm thấy cột Số tiền trong file này! Các cột hiện có: ' + headers.join(', '));
                    setIsProcessing(false);
                    return;
                }

                let parsedTransactions = [];
                const parseAmt = (val) => parseFloat(String(val || '0').replace(/[^0-9.-]/g, '')) || 0;

                for (let i = headerIdx + 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (!cols || cols.length === 0) continue;

                    let amount = parseAmt(cols[iAmount]);
                    if (amount === 0) continue;

                    let rawDate = iDate >= 0 && cols[iDate] ? String(cols[iDate]).trim() : new Date().toISOString().slice(0, 10);
                    let formattedDate = rawDate;
                    if (rawDate.includes('/')) {
                        const parts = rawDate.split(' ')[0].split('/');
                        if (parts.length === 3) {
                            if (parts[2].length === 4) formattedDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                    }

                    let rawType = iType >= 0 && cols[iType] ? String(cols[iType]).trim() : '';
                    let rawDesc = iDesc >= 0 && cols[iDesc] ? String(cols[iDesc]).trim() : '';
                    
                    let type = amount > 0 ? 'Thu' : 'Chi';
                    if (rawType.toLowerCase().includes('rút tiền') || rawDesc.toLowerCase().includes('rút tiền')) {
                        type = 'Chuyển';
                    }

                    let category = 'Giao Dịch Shopee';
                    if (type === 'Chuyển') {
                        category = 'Rút Tiền Shopee';
                    } else if (type === 'Thu') {
                        category = 'Bán Hàng';
                    } else {
                        category = 'Chi Phí Bán Hàng';
                    }

                    let fullNote = (rawType ? `[${rawType}] ` : '') + rawDesc;

                    const cleanText = (str) => String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    const extractOrderId = (text) => {
                        const match = String(text || '').match(/(DH|RF|SO|HD|DH-)\s*([0-9]{4,8})/i);
                        return match ? match[0].replace(/\s+/g, '').toUpperCase() : null;
                    };
                    
                    let dupLevel = 0; // 0: Xanh, 1: Vàng (Nghi ngờ), 2: Đỏ (Chắc chắn trùng), 3: Khớp lệnh
                    let matchedTxId = null;
                    const noteImportClean = cleanText(fullNote);
                    const orderIdImport = extractOrderId(fullNote);

                    existingTxs.forEach(t => {
                        if (dupLevel === 2) return;
                        
                        const sameAmount = Math.abs(Number(t.amount)) === Math.abs(amount);
                        if (!sameAmount) return;
                        
                        const noteDBClean = cleanText(t.note);
                        const orderIdDB = extractOrderId(t.note);
                        
                        // Tier 1: Khớp tuyệt đối (Order ID)
                        if (orderIdImport && orderIdDB && orderIdImport === orderIdDB) {
                            if (t.isCleared || t.isAuto) {
                                dupLevel = 2; // Đã đối soát hoặc đã import trước đó -> Trùng lặp
                            } else {
                                dupLevel = 3; // Khớp lệnh
                                matchedTxId = t.id;
                            }
                            return;
                        }
                        
                        // Tier 2: Khớp tương đối (+- 5 ngày)
                        const tDate = new Date(t.date);
                        const importDate = new Date(formattedDate);
                        const diffDays = Math.abs(tDate - importDate) / (1000 * 60 * 60 * 24);
                        
                        if (diffDays <= 5) {
                            const isSameDesc = (noteDBClean && noteImportClean && (noteDBClean.includes(noteImportClean) || noteImportClean.includes(noteDBClean)));
                            if (isSameDesc) {
                                if (t.isCleared || t.isAuto) {
                                    dupLevel = 2; // Trùng
                                } else {
                                    dupLevel = 3; // Khớp lệnh
                                    matchedTxId = t.id;
                                }
                            } else if (dupLevel < 2 && diffDays === 0) {
                                dupLevel = 1; // Vàng: Trùng ngày & số tiền nhưng khác nội dung
                            }
                        }
                    });

                    parsedTransactions.push({
                        _id: 'TEMP_SHP_' + Date.now() + i,
                        date: formattedDate,
                        type: type,
                        amount: Math.abs(amount),
                        rawAmount: amount,
                        category: category,
                        note: fullNote,
                        title: rawType || `Giao Dịch Ví Shopee`,
                        dupLevel: dupLevel,
                        matchedTxId: matchedTxId
                    });
                }

                setScannedData(parsedTransactions);
                setSelectedRows(new Set(parsedTransactions.filter(t => t.dupLevel === 0 || t.dupLevel === 3).map(t => t._id)));
                setIsProcessing(false);
                triggerToast(`Đã bóc tách thành công ${parsedTransactions.length} giao dịch Ví Shopee!`, 'fa-check', 'success');
            } catch (err) {
                alert("Lỗi phân tích file Excel Ví Shopee!");
                setIsProcessing(false);
            }
        };
        reader.readAsArrayBuffer(file);
    };

    const toggleRow = (id) => {
        const newSet = new Set(selectedRows);
        if (newSet.has(id)) newSet.delete(id); else newSet.add(id);
        setSelectedRows(newSet);
    };

    const toggleAll = () => {
        if (selectedRows.size === scannedData.length) setSelectedRows(new Set());
        else setSelectedRows(new Set(scannedData.map(t => t._id)));
    };

    const handleImport = async () => {
        if (selectedRows.size === 0) return triggerToast('Vui lòng chọn ít nhất 1 giao dịch!', 'fa-exclamation', 'warning');
        
        let walletAccId = selectedWalletId;
        let newAccounts = [];

        if (!walletAccId) {
            const shopeeAcc = (accountsData || []).find(a => String(a.accountName).toLowerCase().includes('shopee'));
            if (shopeeAcc) {
                walletAccId = shopeeAcc.id;
            } else {
                walletAccId = 'ACC_SHOPEE_' + Date.now();
                newAccounts.push({ id: walletAccId, accountName: 'Ví Shopee - 0945445497 | Ngân hàng | --- | ---', balance: 0 });
            }
        }

        setIsProcessing(true);
        const transactionsToImport = scannedData.filter(t => selectedRows.has(t._id));
        
        let payload = { Transactions: [], Accounts: [...newAccounts] };
        let walletBalanceDelta = 0;

        transactionsToImport.forEach((t, i) => {
            let isThu = t.type === 'Thu';
            let isChi = t.type === 'Chi';
            let isChuyen = t.type === 'Chuyển';
            
            if (t.dupLevel === 3 && t.matchedTxId) {
                payload.Transactions.push({
                    id: t.matchedTxId,
                    isCleared: true,
                    bankRef: 'SHP_' + Date.now() + '_' + i
                });
            } else {
                const finalId = 'TX_SHP_' + Date.now() + i;
                payload.Transactions.push({
                    id: finalId,
                    type: t.type,
                    category: t.category,
                    amount: t.amount,
                    date: t.date,
                    title: t.title,
                    note: t.note,
                    fromAccount: isChi || isChuyen ? walletAccId : '',
                    toAccount: isThu ? walletAccId : '',
                    isAuto: true,
                    isCleared: true,
                    bankRef: 'SHP_' + Date.now() + '_' + i
                });
            }

            if (isThu) walletBalanceDelta += t.amount;
            if (isChi || isChuyen) walletBalanceDelta -= t.amount;
        });

        const targetAcc = (accountsData || []).find(a => a.id === walletAccId) || newAccounts[0];
        if (targetAcc) {
            payload.Accounts.push({ ...targetAcc, balance: Number(targetAcc.balance || 0) + walletBalanceDelta });
        }

        try {
            await pushDeltas(payload, `Đã cập nhật ${transactionsToImport.length} giao dịch vào Ví Shopee!`, 'fa-wallet');
            onClose();
        } catch (e) {
            triggerToast('Lỗi khi lưu giao dịch Ví Shopee!', 'fa-times', 'danger');
            setIsProcessing(false);
        }
    };

    return (
        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-[#141414] border border-orange-500/50 w-full max-w-4xl rounded-3xl p-5 shadow-[0_0_40px_rgba(249,115,22,0.2)] flex flex-col h-[90vh] relative animate-slide-up" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-500 hover:text-white hover:bg-rose-500 flex items-center justify-center transition-all z-20"><i className="fas fa-times text-sm"></i></button>
                
                <div className="flex items-center gap-3 mb-4 border-b border-[#222] pb-3 shrink-0">
                    <div className="w-10 h-10 rounded-full bg-orange-500/20 text-orange-500 flex items-center justify-center text-xl"><i className="fas fa-wallet"></i></div>
                    <div>
                        <h3 className="font-black text-white text-[16px] uppercase tracking-widest leading-none">Máy Quét Giao Dịch Ví Shopee</h3>
                        <p className="text-orange-400 text-[11px] mt-1">Đọc file báo cáo Ví Shopee (my_balance_transaction_report...)</p>
                    </div>
                </div>

                <div className="flex gap-3 mb-4 shrink-0">
                    <div className="flex-1">
                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">1. Tải lên File Báo Cáo Ví Shopee</label>
                        <div className="relative">
                            <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".xlsx, .xls, .csv" className="hidden" />
                            <button onClick={() => fileInputRef.current?.click()} disabled={isProcessing} className="w-full bg-[#0a0a0a] border-2 border-dashed border-[#333] hover:border-orange-500 text-gray-400 hover:text-white rounded-xl py-4 flex flex-col items-center justify-center transition-all cursor-pointer">
                                {isProcessing ? <i className="fas fa-spinner fa-spin text-2xl text-orange-500 mb-2"></i> : <i className="fas fa-file-excel text-2xl text-orange-500 mb-2"></i>}
                                <span className="font-bold text-[12px]">{isProcessing ? 'Đang phân tích...' : 'Bấm để chọn File Excel (my_balance_transaction_report...)'}</span>
                            </button>
                        </div>
                    </div>

                    <div className="flex-[0.5]">
                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1">2. Chọn Quỹ Ví Shopee</label>
                        <select value={selectedWalletId} onChange={(e) => setSelectedWalletId(e.target.value)} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3 text-orange-400 font-bold outline-none focus:border-orange-500 h-[78px]">
                            {(accountsData || []).length === 0 ? <option value="">-- Tự động tạo Ví Shopee --</option> : null}
                            {(accountsData || []).map(a => {
                                const p = parseAccountInfo(a);
                                return <option key={a.id} value={a.id}>{p.name} {p.number ? `- ${p.number}` : ''}</option>;
