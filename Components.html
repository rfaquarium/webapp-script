window.safeJSONParse = (jsonString) => {
    if (!jsonString) return [];
    try {
        const parsed = JSON.parse(jsonString);
        return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
        console.error("FATAL PARSE ERROR: ", e);
        throw new Error("FATAL_DATA_CORRUPTION");
    }
};

class ErrorBoundary extends React.Component {
    constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
    }
    static getDerivedStateFromError(error) {
        return { hasError: true, error };
    }
    render() {
        if (this.state.hasError) {
            if (this.state.error && this.state.error.message === "FATAL_DATA_CORRUPTION") {
                return (
                    <div className="fixed inset-0 z-[999999] bg-[#09090b] flex flex-col items-center justify-center text-white p-8 animate-fade-in">

                    <i className="fas fa-exclamation-triangle text-4xl text-amber-400 mb-4"></i>

}

const getDrivePreviewUrl = (url) => {
    if (!url) return '';
    const match = url.match(/[-\w]{25,}/);
    if (match) return ('https:\x2F\x2Fdrive.google.com/file/d/' + match[0] + '/preview');
    return url;
};

// PERF: Chuyển đổi Google Drive URL sang thumbnail proxy nhẹ hơn ~10-20x
// size: 'sm' (120px), 'md' (300px), 'lg' (600px), 'full' (ảnh gốc)
window.rfOptimizeImageUrl = (url, size = 'sm') => {
    if (!url || typeof url !== 'string') return '';
    const str = url.trim();
    
    // Đã là thumbnail proxy rồi thì không cần convert lại
    if (str.includes('lh3.googleusercontent.com/d/')) return str;
    
    // Nếu là postimg, imgur, hoặc URL ngoài thì giữ nguyên
    if (!str.includes('drive.google.com') && !str.includes('googleusercontent.com')) return str;
    
    // Extract Google Drive file ID
    let fileId = null;
    const patterns = [
        /\/d\/([a-zA-Z0-9_-]{20,})/,         // /file/d/ID/...
        /id=([a-zA-Z0-9_-]{20,})/,            // ?id=ID
        /[-\w]{25,}/                            // raw ID fallback
    ];
    for (const p of patterns) {
        const m = str.match(p);
        if (m) { fileId = m[1] || m[0]; break; }
    }
    if (!fileId) return str;
    
    // Chuyển sang lh3 proxy với kích thước nhỏ
    const sizeMap = { sm: 'w120-h120', md: 'w300-h300', lg: 'w600-h600', full: 'w0' };
    const sizeParam = sizeMap[size] || sizeMap.sm;
    return `https:\x2F\x2Flh3.googleusercontent.com/d/${fileId}=${sizeParam}`;
};

// PERF: Component ảnh tối ưu — lazy load, skeleton, tự nén URL Drive
window.RFImage = React.memo(function RFImage({ src, alt = 'img', className = '', size = 'sm', onClick, title, style }) {
    const [loaded, setLoaded] = React.useState(false);
    const [errored, setErrored] = React.useState(false);
    const optimizedSrc = React.useMemo(() => window.rfOptimizeImageUrl(src, size), [src, size]);
    
    if (!optimizedSrc || errored) {
        return (
            <div className={`bg-[#18181c] border border-white/[0.08] flex items-center justify-center text-zinc-600 ${className}`} style={style}>
                <i className="fas fa-box text-[11px] opacity-60"></i>
            </div>
        );
    }
    
    return (
        <div className={`relative overflow-hidden ${className}`} style={style}>
            {!loaded && <div className="absolute inset-0 skeleton-loader rounded"></div>}
            <img
                src={optimizedSrc}
                alt={alt}
                loading="lazy"
                decoding="async"
                className={`w-full h-full object-cover transition-opacity duration-200 ${loaded ? 'opacity-100' : 'opacity-0'} ${onClick ? 'cursor-pointer' : ''}`}
                onLoad={() => setLoaded(true)}
                onError={() => setErrored(true)}
                onClick={onClick}
                title={title}
            />
        </div>
    );
});

window.resizeImage = (file, maxWidth = 800, maxHeight = 800, initialQuality = 0.5) => {
    return new Promise((resolve, reject) => {
        if (!file || !file.type.match(/image.*/)) return reject(new Error("Not an image"));
        const reader = new FileReader();
        reader.onload = (e) => {
            const image = new Image();
            image.onload = () => {
                let width = image.width; let height = image.height;
                if (width > height && width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                else if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(image, 0, 0, width, height);
                
                let quality = initialQuality;
                let dataUrl = canvas.toDataURL('image/jpeg', quality);
                
                // Google Sheets cell limit is 50,000 chars. We aim for < 45,000.
                while (dataUrl.length > 45000 && quality > 0.1) {
                    quality -= 0.1;
                    dataUrl = canvas.toDataURL('image/jpeg', Math.max(0.1, quality));
                }
                
                while (dataUrl.length > 45000 && width > 100) {
                    width = Math.round(width * 0.7);
                    height = Math.round(height * 0.7);
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(image, 0, 0, width, height);
                    dataUrl = canvas.toDataURL('image/jpeg', quality);
                }
                
                resolve(dataUrl);
            };
            image.onerror = reject;
            image.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
};

const Avatar = React.memo(function Avatar({ name, userConfigs, className="" }) { 
    const [hasError, setHasError] = React.useState(false);
    let id = null;
    try {
        if (userConfigs && name) {
            const cleanName = String(name).trim().toLowerCase();
            const sourceMap = userConfigs.avatars ? userConfigs.avatars : userConfigs;
            if (sourceMap[name]) {
                id = sourceMap[name];
            } else {
                const nameParts = cleanName.split(/[\s.]+/).filter(Boolean);
                const mainName = nameParts[nameParts.length - 1];
                const firstLetter = nameParts[0]?.[0];
                const matchedKey = Object.keys(sourceMap).find(key => {
                    const keyParts = String(key).trim().toLowerCase().split(/[\s.]+/).filter(Boolean);
                    return keyParts[keyParts.length - 1] === mainName && keyParts[0]?.[0] === firstLetter;
                });
                if (matchedKey) id = sourceMap[matchedKey];
            }
        }
    } catch(e) {}

    let cleanId = id;
    if (id && String(id).includes('drive.google.com')) {
        const match = String(id).match(/[-\w]{25,}/);
        if (match) cleanId = match[0];
    }

    if (cleanId && !hasError) { 
        const isFullUrl = String(cleanId).startsWith('http://') || String(cleanId).startsWith('https://');
        const imgSrc = isFullUrl ? cleanId : ('https:\x2F\x2Flh3.googleusercontent.com/d/' + cleanId + '=w120-h120');
        return <img src={imgSrc} className={`object-cover rounded-full shadow-sm bg-[#18181c] ${className}`} alt={name} onError={() => setHasError(true)} />;
    } 
    return <div className={`flex items-center justify-center rounded-full bg-[#18181c] text-zinc-500 border border-white/[0.08] ${className}`}><i className="fas fa-user text-[11px]"></i></div>;
});
