window.safeJSONParse = (jsonString) => {
    if (!jsonString) return [];
    try {
        const parsed = JSON.parse(jsonString);
        return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
        console.error("FATAL PARSE ERROR: ", e);
        throw new Error("FATAL_DATA_CORRUPTION");
    }
};

class ErrorBoundary extends React.Component {
    constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
    }
    static getDerivedStateFromError(error) {
        return { hasError: true, error };
    }
    render() {
        if (this.state.hasError) {
            if (this.state.error && this.state.error.message === "FATAL_DATA_CORRUPTION") {
                return (
                    <div className="fixed inset-0 z-[999999] bg-red-950 flex flex-col items-center justify-center text-white p-8 animate-fade-in">
                        <i className="fas fa-skull-crossbones text-7xl mb-6 text-red-500 animate-pulse"></i>

                            <br/><br/>

            );
        }

    }

const getDrivePreviewUrl = (url) => {
    if (!url) return '';
    const match = url.match(/[-\w]{25,}/);
    if (match) return ('https:\x2F\x2Fdrive.google.com/file/d/' + match[0] + '/preview');
    return url;
};

window.resizeImage = (file, maxWidth = 600, maxHeight = 600, initialQuality = 0.7) => {
    return new Promise((resolve, reject) => {
        if (!file || !file.type.match(/image.*/)) return reject(new Error("Not an image"));
        const reader = new FileReader();
        reader.onload = (e) => {
            const image = new Image();
            image.onload = () => {
                let width = image.width; let height = image.height;
                if (width > height && width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                else if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(image, 0, 0, width, height);
                
                let quality = initialQuality;
                let dataUrl = canvas.toDataURL('image/jpeg', quality);
                
                // Google Sheets cell limit is 50,000 chars. We aim for < 45,000.
                while (dataUrl.length > 45000 && quality > 0.1) {
                    quality -= 0.1;
                    dataUrl = canvas.toDataURL('image/jpeg', Math.max(0.1, quality));
                }
                
                // If it's still too large, we must scale down dimensions
                while (dataUrl.length > 45000 && width > 100) {
                    width = Math.round(width * 0.8);
                    height = Math.round(height * 0.8);
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(image, 0, 0, width, height);
                    dataUrl = canvas.toDataURL('image/jpeg', quality);
                }
                
                resolve(dataUrl);
            };
            image.onerror = reject;
            image.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
};

function ToastManager({ toasts }) {

                if(t.color === 'danger') bgColors = "bg-[#4c0519]/95 border-[#e11d48]/50 text-[#fb7185]";
                if(t.color === 'primary') bgColors = "bg-[#1e3a8a]/95 border-[#3b82f6]/50 text-[#60a5fa]";

                    </div> 
                );
            })} 
        </div> 
    ) 
}

function Avatar({ name, userConfigs, className="" }) { 
    const [hasError, setHasError] = React.useState(false);
    let id = null;
    try {
        if (userConfigs && name) {
            const cleanName = String(name).trim().toLowerCase();
            const sourceMap = userConfigs.avatars ? userConfigs.avatars : userConfigs;
            if (sourceMap[name]) {
                id = sourceMap[name];
            } else {
                const nameParts = cleanName.split(/[\s.]+/).filter(Boolean);
                const mainName = nameParts[nameParts.length - 1];
                const firstLetter = nameParts[0]?.[0];
                const matchedKey = Object.keys(sourceMap).find(key => {
                    const keyParts = String(key).trim().toLowerCase().split(/[\s.]+/).filter(Boolean);
                    return keyParts[keyParts.length - 1] === mainName && keyParts[0]?.[0] === firstLetter;
                });
                if (matchedKey) id = sourceMap[matchedKey];
            }
        }
    } catch(e) {}

    let cleanId = id;
    if (id && String(id).includes('drive.google.com')) {
        const match = String(id).match(/[-\w]{25,}/);
        if (match) cleanId = match[0];
    }

    if (cleanId && !hasError) { 
        const isFullUrl = String(cleanId).startsWith('http://') || String(cleanId).startsWith('https://');
        const imgSrc = isFullUrl ? cleanId : ('https:\x2F\x2Fdrive.google.com/thumbnail?id=' + cleanId + '&sz=w150');
        return <img src={imgSrc} className={`object-cover rounded-full shadow-sm bg-[#1a1a1a] ${className}`} alt={name} onError={() => setHasError(true)} />;
    } 
    return <div className={`flex items-center justify-center rounded-full bg-[#111] text-[#666] border border-[#333] ${className}`}><i className="fas fa-user text-[10px]"></i></div>;
}

    return ( 
        <div className="flex flex-col"> 
            {label && <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1.5">{label}</label>} 
            <div className="flex items-center gap-1.5">

                <select value={currentM} onChange={e=>onChange(`${currentH||'00'}:${e.target.value}`)} className="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 flex-1 appearance-none text-center"> 
                    <option value="">Phút</option> 
                    {mins.map(m => <option key={`m${m}`} value={m}>{m}p</option>)} 
                </select> 
            </div> 
        </div> 
    ) 
}
