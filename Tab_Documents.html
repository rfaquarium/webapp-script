<script type="text/babel">
// =========================================================================
// 📚 FILE: Tab_Documents.txt
// CHỨC NĂNG: Quản lý tài liệu, SOP, biểu mẫu nội bộ
// =========================================================================

// -------------------------------------------------------------------------
// MỤC 1: MODAL TẢI LÊN TÀI LIỆU
// -------------------------------------------------------------------------
function DocumentUploadModal({ onClose, pushDeltas, triggerToast }) {
  const [title, setTitle] = React.useState('');
  const [description, setDescription] = React.useState('');
  const [category, setCategory] = React.useState('SOP');
  const [file, setFile] = React.useState(null);
  const [uploading, setUploading] = React.useState(false);
  const [progress, setProgress] = React.useState(0);

  const categories = ['SOP', 'Hướng dẫn', 'Biểu mẫu', 'Khác'];

  const handleUpload = async () => {
    if (!title || !file) {
      alert('Vui lòng nhập tiêu đề và chọn file');
      return;
    }
    setUploading(true);
    setProgress(0);
    try {
      const reader = new FileReader();
      reader.onprogress = (e) => {
        if (e.lengthComputable) setProgress(Math.round((e.loaded / e.total) * 100));
      };
      reader.onload = async (e) => {
        try {
          const base64 = e.target.result;
          const fileName = file.name;
          const link = await runGAS('uploadDocumentToDrive', base64, fileName, file.type);
          if (!link) throw new Error('Upload thất bại, không nhận được link');
          const newDoc = {
            id: 'DOC_' + Date.now(),
            title: title.trim(),
            description: description.trim(),
            category: category,
            link: link,
            createdAt: new Date().toISOString(),
            createdBy: localStorage.getItem('rf_user') || 'Unknown'
          };
          await pushDeltas({ documents: [newDoc] }, 'Đã tải lên tài liệu thành công!', 'fa-check-circle');
          triggerToast('Tải lên thành công!', 'fa-check', 'success');
          onClose();
        } catch (err) {
          alert('Lỗi khi tải lên: ' + err.message);
        } finally {
          setUploading(false);
          setProgress(0);
        }
      };
      reader.readAsDataURL(file);
    } catch (e) {
      alert('Lỗi đọc file: ' + e.message);
      setUploading(false);
    }
  };

  return (
    <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[999] p-4 backdrop-blur-sm animate-fade-in">
      <div className="bg-[#141414] border border-[#333] w-full max-w-md rounded-[24px] p-6 shadow-2xl">
        <div className="flex justify-between items-center mb-6 border-b border-[#222] pb-3">
          <div className="font-black text-[15px] text-[#f5f5f5] tracking-wide uppercase"><i className="fas fa-cloud-upload-alt mr-2 text-[#d4af37]"></i>TẢI LÊN TÀI LIỆU</div>
          <button onClick={onClose} disabled={uploading} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-rose-500 flex items-center justify-center transition-colors"><i className="fas fa-times"></i></button>
        </div>

        <div className="space-y-4">
          <div>
            <label className="text-[10px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">TIÊU ĐỀ *</label>
            <input type="text" value={title} onChange={e => setTitle(e.target.value)} disabled={uploading} className="w-full p-3.5 bg-[#0a0a0a] border border-[#333] text-white font-bold rounded-xl outline-none focus:border-[#d4af37] transition-colors shadow-inner" placeholder="Nhập tiêu đề tài liệu" />
          </div>
          <div>
            <label className="text-[10px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">MÔ TẢ (TÙY CHỌN)</label>
            <textarea value={description} onChange={e => setDescription(e.target.value)} disabled={uploading} className="w-full p-3.5 bg-[#0a0a0a] border border-[#333] text-white font-medium rounded-xl h-24 outline-none focus:border-[#d4af37] custom-scrollbar transition-colors shadow-inner" placeholder="Mô tả ngắn gọn..."/>
          </div>
          <div>
            <label className="text-[10px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">DANH MỤC</label>
            <select value={category} onChange={e => setCategory(e.target.value)} disabled={uploading} className="w-full p-3.5 bg-[#0a0a0a] border border-[#333] text-white font-bold rounded-xl outline-none focus:border-[#d4af37] transition-colors">
              {categories.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[10px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">CHỌN FILE *</label>
            <input type="file" onChange={e => setFile(e.target.files[0])} disabled={uploading} className="w-full p-2.5 border border-[#333] bg-[#0a0a0a] rounded-xl text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-[10px] file:font-black file:bg-[#d4af37]/20 file:text-[#d4af37] hover:file:bg-[#d4af37]/30 transition-colors cursor-pointer disabled:opacity-50" />
            {file && <div className="text-[11px] text-[#10b981] mt-2 font-bold flex items-center gap-1 bg-[#10b981]/10 px-3 py-1.5 rounded-lg border border-[#10b981]/30 w-fit"><i className="fas fa-check-circle"></i> Đã chọn: {file.name}</div>}
          </div>
          
          {uploading && progress > 0 && (
            <div className="w-full bg-[#222] rounded-full h-2.5 mt-4 overflow-hidden border border-[#333]">
              <div className="bg-[#10b981] h-2.5 rounded-full transition-all" style={{ width: `${progress}%` }}></div>
            </div>
          )}
        </div>

        <div className="flex gap-3 mt-6">
          <button onClick={onClose} disabled={uploading} className="flex-1 py-3.5 bg-[#222] hover:bg-[#333] text-gray-300 rounded-xl font-black active:scale-95 transition-all disabled:opacity-50 text-[12px]">HỦY</button>
          <button onClick={handleUpload} disabled={uploading || !title || !file} className="flex-[2] py-3.5 bg-[#d4af37] text-[#0a0a0a] font-black rounded-xl disabled:bg-[#333] disabled:text-gray-500 flex items-center justify-center gap-2 active:scale-95 shadow-md transition-all text-[12px]">
            {uploading ? (
              <><i className="fas fa-spinner fa-spin"></i> ĐANG TẢI... {progress}%</>
            ) : (
              <><i className="fas fa-cloud-upload-alt"></i> TẢI LÊN TÀI LIỆU</>
            )}
          </button>
        </div>
      </div>
    </div>
  );
}

// -------------------------------------------------------------------------
// MỤC 2: GIAO DIỆN CHÍNH TAB TÀI LIỆU
// -------------------------------------------------------------------------
function DocumentsTab({ documents = [], isAdmin, pushDeltas, triggerToast }) {
  const [search, setSearch] = React.useState('');
  const [categoryFilter, setCategoryFilter] = React.useState('Tất cả');
  const [editingDoc, setEditingDoc] = React.useState(null);
  const [previewDoc, setPreviewDoc] = React.useState(null);

  const categories = ['Tất cả', 'SOP', 'Hướng dẫn', 'Biểu mẫu', 'Khác'];

  const filteredDocs = React.useMemo(() => {
    return documents
      .filter(doc => {
        const text = `${doc.title} ${doc.description || ''}`.toLowerCase();
        const matchSearch = text.includes(search.toLowerCase());
        const matchCategory = categoryFilter === 'Tất cả' || doc.category === categoryFilter;
        return matchSearch && matchCategory;
      })
      .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  }, [documents, search, categoryFilter]);

  const openPreview = (doc) => {
    if (doc.link) {
      setPreviewDoc(doc);
    } else {
      triggerToast('Không có link xem tài liệu', 'fa-exclamation', 'warning');
    }
  };

  const closePreview = () => setPreviewDoc(null);

  const handleDelete = async (doc) => {
    if (!window.confirm(`Xoá tài liệu "${doc.title}"?`)) return;
    try {
      await pushDeltas({ deletes: { documents: [doc.id] } }, `Đã xoá: ${doc.title}`, 'fa-trash');
      triggerToast('Đã xoá tài liệu', 'fa-check', 'success');
    } catch (e) {
      triggerToast('Lỗi khi xoá', 'fa-times', 'danger');
    }
  };

  const openEdit = (doc) => setEditingDoc({ ...doc });

  const saveEdit = async () => {
    if (!editingDoc) return;
    try {
      const updatedDocs = documents.map(d => 
        d.id === editingDoc.id ? editingDoc : d
      );
      await pushDeltas({ documents: updatedDocs }, 'Đã cập nhật tài liệu', 'fa-edit');
      triggerToast('Đã lưu thay đổi', 'fa-check', 'success');
      setEditingDoc(null);
    } catch (e) {
      triggerToast('Lỗi khi lưu', 'fa-times', 'danger');
    }
  };

  const getCategoryIcon = (cat) => {
    if (cat === 'SOP') return 'fa-book';
    if (cat === 'Hướng dẫn') return 'fa-lightbulb';
    if (cat === 'Biểu mẫu') return 'fa-file-alt';
    return 'fa-file';
  };

  return (
    <div className="space-y-4 animate-fade-in pb-10">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="font-black text-xl text-white">Tài Liệu</h2>
          <p className="text-sm text-gray-400">{filteredDocs.length} tài liệu</p>
        </div>
        {isAdmin && (
          <button 
            onClick={() => window.dispatchEvent(new CustomEvent('openDocumentUpload'))}
            className="bg-[#d4af37] text-[#0a0a0a] px-5 py-2.5 rounded-2xl font-black text-sm flex items-center gap-2 active:scale-95 transition-transform shadow-md hover:bg-[#b8972e]"
          >
            <i className="fas fa-upload"></i> TẢI LÊN
          </button>
        )}
      </div>

      <div className="space-y-3">
        <div className="relative">
          <i className="fas fa-search absolute left-4 top-4 text-gray-500"></i>
          <input
            type="text"
            placeholder="Tìm theo tên hoặc nội dung..."
            value={search}
            onChange={e => setSearch(e.target.value)}
            className="w-full pl-11 py-3 bg-[#141414] rounded-2xl border border-[#333] font-bold outline-none focus:border-[#d4af37] text-white transition-colors shadow-sm"
          />
        </div>

        <div className="flex gap-2 overflow-x-auto pb-1 custom-scrollbar">
          {categories.map(cat => (
            <button
              key={cat}
              onClick={() => setCategoryFilter(cat)}
              className={`px-4 py-1.5 rounded-full text-[11px] uppercase tracking-wider font-black whitespace-nowrap transition-all ${
                categoryFilter === cat 
                  ? 'bg-[#d4af37] text-[#0a0a0a] shadow-md' 
                  : 'bg-[#1a1a1a] text-gray-400 hover:bg-[#222] border border-[#333]'
              }`}
            >
              {cat}
            </button>
          ))}
        </div>
      </div>

      <div className="space-y-3">
        {filteredDocs.length === 0 ? (
          <div className="text-center py-12 bg-[#141414] rounded-2xl border-2 border-dashed border-[#333]">
            <i className="fas fa-folder-open text-4xl text-[#444] mb-3"></i>
            <div className="font-bold text-gray-500">Không tìm thấy tài liệu</div>
          </div>
        ) : (
          filteredDocs.map(doc => (
            <div 
              key={doc.id} 
              onClick={() => openPreview(doc)}
              className="bg-[#141414] p-4 rounded-2xl border border-[#2a2a2a] flex items-start gap-4 active:scale-[0.985] cursor-pointer hover:border-[#d4af37]/40 transition-all group shadow-sm"
            >
              <div className="w-12 h-12 bg-[#1e3a8a]/20 text-[#60a5fa] rounded-2xl flex items-center justify-center shrink-0 mt-0.5 border border-[#1e3a8a]/30 group-hover:text-[#d4af37] group-hover:border-[#d4af37]/30 transition-colors">
                <i className={`fas ${getCategoryIcon(doc.category)} text-2xl`}></i>
              </div>

              <div className="flex-1 min-w-0">
                <div className="font-black text-[15px] leading-snug text-[#f5f5f5] group-hover:text-[#d4af37] transition-colors">
                  {doc.title}
                </div>
                {doc.description && (
                  <div className="text-[12px] font-medium text-gray-400 mt-1.5 leading-relaxed line-clamp-2">{doc.description}</div>
                )}
                <div className="flex items-center gap-2 mt-2.5 flex-wrap">
                  <span className="text-[9px] bg-[#0a0a0a] border border-[#333] text-gray-400 px-2 py-0.5 rounded font-black uppercase tracking-widest shadow-sm">
                    {doc.category || 'Khác'}
                  </span>
                  {doc.createdAt && (
                    <span className="text-[10px] text-gray-500 font-bold">
                      {new Date(doc.createdAt).toLocaleDateString('vi-VN')}
                    </span>
                  )}
                </div>
              </div>

              {isAdmin && (
                <div className="flex items-center gap-1 shrink-0 pt-1" onClick={e => e.stopPropagation()}>
                  <button onClick={() => openEdit(doc)} className="w-9 h-9 flex items-center justify-center text-amber-500 hover:bg-amber-500/10 rounded-xl transition-colors border border-transparent hover:border-amber-500/30" title="Sửa">
                    <i className="fas fa-edit"></i>
                  </button>
                  <button onClick={() => handleDelete(doc)} className="w-9 h-9 flex items-center justify-center text-rose-500 hover:bg-rose-500/10 rounded-xl transition-colors border border-transparent hover:border-rose-500/30" title="Xoá">
                    <i className="fas fa-trash"></i>
                  </button>
                </div>
              )}
            </div>
          ))
        )}
      </div>

      {/* MODAL XEM TÀI LIỆU FULL MÀN HÌNH */}
      {previewDoc && (
        <div className="fixed inset-0 bg-black/95 z-[9999] flex flex-col backdrop-blur-md animate-fade-in">
          <div className="flex items-center justify-between px-4 py-3 bg-[#0a0a0a] border-b border-[#222] z-10 shadow-md">
            <div className="font-black text-white text-[14px] pr-4 truncate flex-1 uppercase tracking-wide">
              <i className="fas fa-file-alt mr-2 text-[#d4af37]"></i>
              {previewDoc.title}
            </div>
            <button onClick={closePreview} className="w-10 h-10 flex items-center justify-center text-2xl text-gray-400 hover:text-rose-500 hover:bg-[#222] rounded-full transition-colors"><i className="fas fa-times"></i></button>
          </div>

          <div className="flex-1 bg-black overflow-hidden flex items-center justify-center">
            {previewDoc.link ? (
              <iframe 
                src={previewDoc.link} 
                className="w-full h-full max-w-5xl border-0 shadow-2xl bg-white"
                title={previewDoc.title}
                allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowFullScreen
              />
            ) : (
              <div className="flex flex-col items-center justify-center h-full text-gray-500 text-lg gap-3">
                <i className="fas fa-link-slash text-4xl opacity-50"></i>
                <span className="font-bold text-sm">Không có link tài liệu</span>
              </div>
            )}
          </div>
        </div>
      )}

      {/* MODAL SỬA TÀI LIỆU NỘI BỘ */}
      {editingDoc && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
          <div className="bg-[#141414] w-full max-w-md rounded-[24px] p-6 border border-[#333] shadow-2xl">
            <div className="font-black text-[15px] mb-5 text-[#f5f5f5] tracking-wide uppercase border-b border-[#222] pb-3">
              <i className="fas fa-edit mr-2 text-[#d4af37]"></i>CẬP NHẬT TÀI LIỆU
            </div>

            <div className="space-y-4">
              <div>
                <label className="text-[10px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">TIÊU ĐỀ</label>
                <input value={editingDoc.title} onChange={e => setEditingDoc({...editingDoc, title: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-4 py-3 text-white font-bold outline-none focus:border-[#d4af37] transition-colors" />
              </div>
              <div>
                <label className="text-[10px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">MÔ TẢ</label>
                <textarea value={editingDoc.description || ''} onChange={e => setEditingDoc({...editingDoc, description: e.target.value})} rows={3} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-4 py-3 text-white font-bold outline-none focus:border-[#d4af37] resize-y custom-scrollbar transition-colors" />
              </div>
              <div>
                <label className="text-[10px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">DANH MỤC</label>
                <select value={editingDoc.category || 'Khác'} onChange={e => setEditingDoc({...editingDoc, category: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-4 py-3 text-white font-bold outline-none focus:border-[#d4af37] transition-colors">
                  {categories.filter(c => c !== 'Tất cả').map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            </div>

            <div className="flex gap-3 mt-6">
              <button onClick={() => setEditingDoc(null)} className="flex-1 py-3.5 bg-[#222] hover:bg-[#333] text-gray-300 font-black rounded-xl text-[12px] transition-colors active:scale-95">HỦY BỎ</button>
              <button onClick={saveEdit} className="flex-[2] py-3.5 bg-[#d4af37] hover:bg-[#b8972e] text-[#0a0a0a] font-black rounded-xl text-[12px] shadow-md transition-all active:scale-95">LƯU THAY ĐỔI</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
</script>
