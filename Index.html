        document.body.style.height = vh + 'px';

      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', function () {

        var errorDiv = document.createElement('div');
        errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#09090b;color:#f87171;padding:24px;z-index:999999;font-family:monospace;overflow:auto;display:flex;flex-direction:column;gap:16px;';
        errorDiv.innerHTML = '<h2 style="color:#ef4444;font-size:20px;font-weight:bold;">⚠️ PHÁT HIỆN LỖI KHI TẢI ỨNG DỤNG</h2>' +
          '<p style="color:#e2e4e9;">Hệ thống phát hiện lỗi biên dịch JavaScript/JSX. Chi tiết lỗi bên dưới:</p>' +
          '<pre style="background:#18181b;padding:16px;border-radius:8px;border:1px solid #27272a;white-space:pre-wrap;color:#fca5a5;">' + messages.join('\n\n') + '</pre>' +
          '<button onclick="localStorage.clear();location.reload();" style="background:#ef4444;color:white;padding:12px 24px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:fit-content;">Xóa Cache & Tải Lại Trang</button>';
        document.body.appendChild(errorDiv);
      }

      function cleanupBootDOM() {
        try {
          var container = document.getElementById('jsx-container');
          if (container) container.remove();
          var appJsx = document.getElementById('app-jsx');
          if (appJsx) appJsx.remove();
          var babelScript = document.getElementById('babel-script');
          if (babelScript) babelScript.remove();
          setTimeout(function () {
            if (window.Babel) {
              try { delete window.Babel; } catch (e) { window.Babel = undefined; }
            }
          }, 1500);
        } catch (e) {
          console.warn("Lỗi dọn dẹp bộ nhớ boot:", e);
        }
      }

      // ═══════════════════════════════════════════════
      // PHASE 1: CORE — App Shell + Dashboard + Orders
      // Biên dịch tức thì, người dùng thấy app ngay
      // ═══════════════════════════════════════════════
      var bootT0 = performance.now();
      var coreJsx = buildJsx(coreFileIds);
      var coreResult = transpileAndExec(coreJsx, 'rf_core_', 'Phase 1 — Core');
      coreJsx = null; // Giải phóng heap

      if (!coreResult.ok) {
        // Core lỗi — dò tìm file nào gây ra
        var msgs = diagnoseSyntaxErrors(coreFileIds);
        showErrorOverlay(msgs.length > 0 ? msgs : ['Lỗi biên dịch không xác định tại Core modules.']);
        return;
      }

      var coreMs = (performance.now() - bootT0).toFixed(0);
      console.log('🚀 Phase 1 hoàn tất trong ' + coreMs + 'ms — App Shell đã sẵn sàng!');

      // ═══════════════════════════════════════════════
      // PHASE 2: DEFERRED — Tất cả tab còn lại
      // Biên dịch nền sau khi app đã hiện lên màn hình
      // ═══════════════════════════════════════════════
      var runPhase2 = function () {
        var deferredJsx = buildJsx(deferredFileIds);
        if (!deferredJsx) {
          cleanupBootDOM();
          return;
        }

        var deferResult = transpileAndExec(deferredJsx, 'rf_deferred_', 'Phase 2 — Deferred Tabs');
        deferredJsx = null;

        if (!deferResult.ok) {
          // Deferred lỗi — dò tìm file cụ thể
          var errMsgs = diagnoseSyntaxErrors(deferredFileIds);
          errMsgs.forEach(function (m) { console.error(m); });
        }

        // Thông báo cho React re-render để phát hiện component mới
        if (typeof window.__rfOnDeferredLoaded === 'function') {
          window.__rfOnDeferredLoaded();
        }

        var totalMs = (performance.now() - bootT0).toFixed(0);
        console.log('🏁 Phase 2 hoàn tất — Toàn bộ hệ thống sẵn sàng! (Tổng: ' + totalMs + 'ms)');
        cleanupBootDOM();
      };

      // Chạy Phase 2 khi browser rảnh, ưu tiên render Phase 1 trước
      if (window.requestIdleCallback) {
        requestIdleCallback(runPhase2, { timeout: 3000 });
      } else {
        setTimeout(runPhase2, 150);
      }
    })();
  </script>

  <script>
    function applyKpiPreset(type) {
      const nameInput = document.getElementById('kpiNameInput');
      const unitSelect = document.getElementById('kpiUnitSelect');
      const targetInput = document.getElementById('kpiTargetInput');
      const rewardInput = document.getElementById('kpiRewardInput');
      const guideInput = document.getElementById('kpiGuideInput');

      if (!type) return;

      if (type === 'san_xuat') {
        if (nameInput) nameInput.value = 'Tổng khâu sản xuất hoàn thành';
        if (unitSelect) unitSelect.value = 'SP';
        if (targetInput) targetInput.value = '150';
        if (rewardInput) rewardInput.value = '500000';
        if (guideInput) guideInput.value = 'Hệ thống tự động quét tổng số khâu (Khâu 1, Khâu 2, Đóng gói) đạt trạng thái Done trong tháng của nhân sự.';
      } else if (type === 'khau_1') {
        if (nameInput) nameInput.value = 'Năng suất Khâu 1 (Cắt & Dán)';
        if (unitSelect) unitSelect.value = 'SP';
        if (targetInput) targetInput.value = '80';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động đếm số lượng lệnh sản xuất Khâu 1 mà nhân sự hoàn thành đạt chuẩn.';
      } else if (type === 'khau_2') {
        if (nameInput) nameInput.value = 'Năng suất Khâu 2 (Gọt keo & Gia cố)';
        if (unitSelect) unitSelect.value = 'SP';
        if (targetInput) targetInput.value = '80';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động đếm số lượng lệnh sản xuất Khâu 2 mà nhân sự hoàn thành đạt chuẩn.';
      } else if (type === 'dong_goi') {
        if (nameInput) nameInput.value = 'Năng suất Đóng gói hoàn thành';
        if (unitSelect) unitSelect.value = 'Đơn';
        if (targetInput) targetInput.value = '200';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động đếm số đơn hàng đóng gói thành công có ảnh QC nghiệm thu.';
      } else if (type === 'ban_hang') {
        if (nameInput) nameInput.value = 'Doanh thu bán hàng tháng';
        if (unitSelect) unitSelect.value = 'VNĐ';
        if (targetInput) targetInput.value = '50000000';
        if (rewardInput) rewardInput.value = '1000000';
        if (guideInput) guideInput.value = 'Hệ thống tự động cộng dồn tổng doanh thu từ tất cả các đơn hàng chốt thành công của nhân sự phụ trách trong kỳ.';
      } else if (type === 'khieu_nai') {
        if (nameInput) nameInput.value = 'Tỷ lệ thắng khiếu nại sàn > 60%';
        if (unitSelect) unitSelect.value = '%';
        if (targetInput) targetInput.value = '60';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động quét tỷ lệ đơn khiếu nại thành công có tag [KN-THANG] trên tổng số khiếu nại.';
      } else if (type === 'hang_hoan') {
        if (nameInput) nameInput.value = 'Tỷ lệ xử lý hàng hoàn > 80%';
        if (unitSelect) unitSelect.value = '%';
        if (targetInput) targetInput.value = '80';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động tính tỷ lệ đơn hàng hoàn đã được kiểm tra và đối soát nhập kho.';
      }
    }

    function populateUserSelect(selectElem, targetVal) {
      if (!selectElem) return;
      if (selectElem.options.length <= 1) {
        let users = [];
        try {
          const cfg = window._userConfigs || window.userConfigs || JSON.parse(localStorage.getItem('USER_CONFIG') || '{}');
          if (cfg.users && Array.isArray(cfg.users) && cfg.users.length > 0) {
            users = cfg.users.map(u => ({ name: u, title: cfg.titles?.[u] || cfg.roles?.[u] || '' }));
          } else if (cfg.pins) {
            const seen = new Set();
            Object.values(cfg.pins).forEach(u => {
              if (u && u.name && !seen.has(u.name)) {
                seen.add(u.name);
                users.push(u);
              }
            });
          }
        } catch (e) { }
        if (users.length === 0) {
          const defaults = ['Nguyễn Ngọc Tiến', 'Nguyễn Thị Diệu Hương', 'Nguyễn Hoàng Dương', 'Đoàn Quang Trí', 'Võ Thành Tâm'];
          users = defaults.map(n => ({ name: n, title: 'Nhân sự' }));
        }
        users.forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.name;
          opt.textContent = `${u.name}${u.title ? ' (' + u.title + ')' : ''}`;
          selectElem.appendChild(opt);
        });
      }
      if (targetVal) selectElem.value = targetVal;
    }

    function openKpiModalStandalone(targetUserName) {
      const modal = document.getElementById('modal-kpi-standalone');
      if (modal) {
        modal.style.display = 'flex';
        const userSelect = document.getElementById('kpiUserSelect');
        populateUserSelect(userSelect, targetUserName);
      }
    }
    function closeKpiModalStandalone() {
      const modal = document.getElementById('modal-kpi-standalone');
      if (modal) modal.style.display = 'none';
    }

    // Mở / Đóng Modal Nhiệm vụ
    function openTaskModalStandalone() {
      const modal = document.getElementById('modal-task-standalone');
      if (modal) {
        modal.style.display = 'flex';
        const taskSelect = document.getElementById('task-user');
        populateUserSelect(taskSelect);
      }
    }
    function closeTaskModalStandalone() {
      const modal = document.getElementById('modal-task-standalone');
      if (modal) modal.style.display = 'none';
    }

    function applyKpiPreset(type) {
      const nameInput = document.getElementById('kpiNameInput');
      const unitInput = document.getElementById('kpiUnitSelect');
      const targetInput = document.getElementById('kpiTargetInput');
      const rewardInput = document.getElementById('kpiRewardInput');
      const penaltyInput = document.getElementById('kpiPenaltyInput');
      const guideInput = document.getElementById('kpiGuideInput');

      if (!type) return;

      if (type === 'san_xuat') {
        if (nameInput) nameInput.value = 'Tổng khâu sản xuất hoàn thành';
        if (unitInput) unitInput.value = 'SP';
        if (targetInput) targetInput.value = '150';
        if (rewardInput) rewardInput.value = '500000';
        if (penaltyInput) penaltyInput.value = '0';
        if (guideInput) guideInput.value = 'Hệ thống tự động quét tổng số khâu (Khâu 1, Khâu 2, Đóng gói) đạt trạng thái Done trong tháng của nhân sự.';
      } else if (type === 'khau_1') {
        if (nameInput) nameInput.value = 'Năng suất Khâu 1 (Cắt & Dán / Dựng Khung)';
        if (unitInput) unitInput.value = 'SP';
        if (targetInput) targetInput.value = '80';
        if (rewardInput) rewardInput.value = '300000';
        if (penaltyInput) penaltyInput.value = '50000';
        if (guideInput) guideInput.value = 'Hệ thống tự động đếm số lượng lệnh sản xuất Khâu 1 mà nhân sự hoàn thành đạt chuẩn KCS.';
      } else if (type === 'khau_2') {
        if (nameInput) nameInput.value = 'Năng suất Khâu 2 (Gọt Keo & Gia Cố)';
        if (unitInput) unitInput.value = 'SP';
        if (targetInput) targetInput.value = '80';
        if (rewardInput) rewardInput.value = '300000';
        if (penaltyInput) penaltyInput.value = '50000';
        if (guideInput) guideInput.value = 'Hệ thống tự động đếm số lượng lệnh sản xuất Khâu 2 mà nhân sự hoàn thành đạt chuẩn KCS.';
      } else if (type === 'dong_goi') {
        if (nameInput) nameInput.value = 'Năng suất Đóng gói hoàn thành trước 19:30';
        if (unitInput) unitInput.value = 'Kiện';
        if (targetInput) targetInput.value = '290';
        if (rewardInput) rewardInput.value = '300000';
        if (penaltyInput) penaltyInput.value = '50000';
        if (guideInput) guideInput.value = 'Hệ thống tự động đếm số đơn hàng đóng gói thành công có đủ 2 ảnh nghiệm thu trước 19:30 hằng ngày.';
      } else if (type === 'ban_hang') {
        if (nameInput) nameInput.value = 'Doanh thu bán hàng tháng chốt đơn';
        if (unitInput) unitInput.value = 'VNĐ';
        if (targetInput) targetInput.value = '20000000';
        if (rewardInput) rewardInput.value = '500000';
        if (penaltyInput) penaltyInput.value = '0';
        if (guideInput) guideInput.value = 'Hệ thống tự động cộng dồn tổng doanh thu từ tất cả các đơn hàng chốt thành công của nhân sự phụ trách trong kỳ.';
      } else if (type === 'khieu_nai') {
        if (nameInput) nameInput.value = 'Tỷ lệ thắng khiếu nại sàn > 60%';
        if (unitInput) unitInput.value = '%';
        if (targetInput) targetInput.value = '60';
        if (rewardInput) rewardInput.value = '875000';
        if (penaltyInput) penaltyInput.value = '100000';
        if (guideInput) guideInput.value = 'Bắt buộc quay video đồng kiểm 6 mặt khi bóc kiện hàng hoàn. Hệ thống tự động quét đơn khiếu nại thắng có tag [KN-THANG].';
      } else if (type === 'hang_hoan') {
        if (nameInput) nameInput.value = 'Xử lý hàng huỷ hoàn & gắn trách nhiệm > 90%';
        if (unitInput) unitInput.value = '%';
        if (targetInput) targetInput.value = '90';
        if (rewardInput) rewardInput.value = '750000';
        if (penaltyInput) penaltyInput.value = '50000';
        if (guideInput) guideInput.value = 'Hàng hoàn về kho phải được phân loại và xử lý trong 48h. Tỷ lệ tính trên tổng đơn hoàn phát sinh trong tháng.';
      }
    }

    // Submit KPI -> Bảng KPI_Progress
    function submitKPIStandalone() {
      const btn = event ? event.target : document.querySelector('#modal-kpi-standalone .rf-btn-submit');
      const originalText = btn ? btn.innerHTML : 'Lưu Thiết Lập KPI';
      if (btn) { btn.innerHTML = 'Đang lưu...'; btn.disabled = true; }

      const payload = {
        user: document.getElementById('kpiUserSelect').value,
        kpiName: document.getElementById('kpiNameInput').value,
        target: document.getElementById('kpiTargetInput').value,
        unit: document.getElementById('kpiUnitSelect').value,
        reward: document.getElementById('kpiRewardInput').value,
        penalty: document.getElementById('kpiPenaltyInput') ? document.getElementById('kpiPenaltyInput').value : '0',
        guide: document.getElementById('kpiGuideInput').value
      };

      if (!payload.user || !payload.kpiName || !payload.target || !payload.unit) {
        alert("Vui lòng điền đầy đủ: Nhân sự, Tên KPI, Chỉ tiêu và Đơn vị tính!");
        if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
        return;
      }

      google.script.run
        .withSuccessHandler(function (res) {
          if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
          if (res && res.success) {
            alert("Đã thiết lập KPI thành công!");
            closeKpiModalStandalone();
            // Reset form
            document.getElementById('kpiNameInput').value = '';
            document.getElementById('kpiTargetInput').value = '';
            document.getElementById('kpiRewardInput').value = '';
            if (document.getElementById('kpiPenaltyInput')) document.getElementById('kpiPenaltyInput').value = '';
            document.getElementById('kpiUnitSelect').value = '';
            document.getElementById('kpiGuideInput').value = '';
            if (document.getElementById('kpiPresetSelect')) document.getElementById('kpiPresetSelect').value = '';
            // Kích hoạt reload data ở frontend
            window.dispatchEvent(new CustomEvent('triggerReloadData'));
          } else {
            alert("Lỗi: " + (res ? res.message : "Không rõ"));
          }
        })
        .withFailureHandler(function (err) {
          if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
          alert("Lỗi kết nối Server: " + err.message);
        })
        .api_insertManualKPI(payload);
    }

    // Submit Nhiệm vụ -> Bảng BonusPenalty (Thưởng Xu)
    function submitTaskStandalone() {
      const btn = event ? event.target : document.querySelector('#modal-task-standalone .rf-btn-submit');
      const originalText = btn ? btn.innerHTML : 'Giao Việc';
      if (btn) { btn.innerHTML = 'Đang lưu...'; btn.disabled = true; }

      const payload = {
        user: document.getElementById('task-user').value,
        title: document.getElementById('task-title').value,
        note: document.getElementById('task-note').value,
        target: document.getElementById('task-target').value,
        unit: document.getElementById('task-unit').value,
        startTime: document.getElementById('task-start').value,
        endTime: document.getElementById('task-end').value,
        amount: document.getElementById('task-reward').value.replace(/[^0-9-]/g, ''),
        penalty: document.getElementById('task-penalty').value.replace(/[^0-9-]/g, ''),
        type: 'XU_REWARD'
      };

      if (!payload.user || !payload.title) {
        alert("Vui lòng chọn nhân sự và nhập tiêu đề nhiệm vụ!");
        if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
        return;
      }

      google.script.run
        .withSuccessHandler(function (res) {
          if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
          if (res && res.success) {
            alert("Đã giao nhiệm vụ thành công! Nhân sự cần báo cáo hoàn thành để nhận Xu.");
            closeTaskModalStandalone();
            // Reset form
            document.getElementById('task-title').value = '';
            document.getElementById('task-note').value = '';
            document.getElementById('task-target').value = '';
            document.getElementById('task-unit').value = '';
            document.getElementById('task-reward').value = '';
            document.getElementById('task-penalty').value = '';
            document.getElementById('task-start').value = '';
            document.getElementById('task-end').value = '';
            // Kích hoạt reload data ở frontend
            window.dispatchEvent(new CustomEvent('triggerReloadData'));
          } else {
            alert("Lỗi: " + (res ? res.message : "Không rõ"));
          }
        })
        .withFailureHandler(function (err) {
          if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
          alert("Lỗi kết nối Server: " + err.message);
        })
        .api_insertManualTask(payload);
    }

    // TỰ ĐỘNG LOAD DANH SÁCH NHÂN SỰ
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withFailureHandler(function (err) { console.error("Error loading employees:", err); })
          .withSuccessHandler(function (employees) {
            const kpiSelect = document.getElementById('kpiUserSelect');
            const taskSelect = document.getElementById('task-user');

            if (kpiSelect && taskSelect && employees && employees.length > 0) {
              employees.forEach(function (name) {
                let optKpi = document.createElement('option');
                optKpi.value = name;
                optKpi.innerHTML = name;
                kpiSelect.appendChild(optKpi);

                let optTask = document.createElement('option');
                optTask.value = name;
                optTask.innerHTML = name;
                taskSelect.appendChild(optTask);
              });
            }
          })
          .api_getActiveEmployees();
      }
    });
  </script>
