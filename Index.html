    /* --- ENHANCED ANIMATIONS --- */
    @keyframes slide-down {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -400px 0;
      }

      100% {
        background-position: 400px 0;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes glow-pulse {

      0%,
      100% {
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.15), 0 0 20px rgba(212, 175, 55, 0.08);
      }

      50% {
        box-shadow: 0 0 16px rgba(212, 175, 55, 0.30), 0 0 40px rgba(212, 175, 55, 0.12);
      }
    }

    @keyframes count-up {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes border-flow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {

    }

        <label style="display: block; font-size: 13px; color: #a0aec0; margin-bottom: 6px;">Tên mục tiêu (KPI)</label>
        <input type="text" id="kpiNameInput"
          class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
          placeholder="VD: Tổng khâu sản xuất hoàn thành hoặc Doanh thu bán hàng">
      </div>

      <!-- 3. SOP Guide (NEW FIELD) -->
      <div class="form-group" style="margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; color: #f6ad55; font-weight: 600; margin-bottom: 6px;">💡 Hướng
          dẫn thực thi & Tiêu chuẩn nghiệm thu (SOP)</label>
        <textarea id="kpiGuideInput"
          class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
          rows="3"
          placeholder="Mô tả rõ nhân sự phải làm gì, chụp ảnh ở đâu hoặc hệ thống quét dữ liệu nào để duyệt KPI này..."></textarea>
      </div>

      <!-- 4. Target & Unit -->
      <div class="form-group" style="margin-bottom: 16px; display: flex; gap: 12px;">
        <div style="flex: 2;">
          <label style="display: block; font-size: 13px; color: #a0aec0; margin-bottom: 6px;">Chỉ tiêu (Target)</label>
          <input type="number" id="kpiTargetInput"
            class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
            placeholder="VD: 80">
        </div>
        <div style="flex: 1;">
          <label style="display: block; font-size: 13px; color: #a0aec0; margin-bottom: 6px;">Đơn vị</label>
          <select id="kpiUnitSelect"
            class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full">
            <option value="%">%</option>
            <option value="Đơn">Đơn</option>
            <option value="VNĐ">VNĐ</option>
            <option value="SP">SP</option>
          </select>
        </div>
      </div>

      <!-- 5. Reward -->
      <div class="form-group" style="margin-bottom: 24px;">
        <label style="display: block; font-size: 13px; font-weight: bold; color: #10b981; margin-bottom: 6px;"><i
            class="fas fa-money-bill-wave" style="margin-right: 4px;"></i>Mức thưởng (VNĐ) vào bảng lương</label>
        <input type="number" id="kpiRewardInput"
          class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
          placeholder="VD: 520000" style="color: #34d399;">
      </div>

      <!-- Actions -->
      <div style="display: flex; justify-content: flex-end; gap: 12px;">
        <button onclick="closeKpiModalStandalone()"
          style="background: #4a5568; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600;">Hủy
          bỏ</button>
        <button class="rf-btn-submit" onclick="submitKPIStandalone()"
          style="background: #f59e0b; color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700;">Lưu
          Thiết Lập</button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. MODAL NHIỆM VỤ STANDALONE               -->
  <!-- ========================================== -->
  <div id="modal-task-standalone" class="rf-modal-overlay">
    <div class="rf-modal-content">
      <div class="rf-modal-header text-zinc-100 font-extrabold tracking-wide text-base"
        style="border-bottom-color: #f59e0b;"><i class="fas fa-coins"
          style="margin-right: 8px; color: #f59e0b;"></i>GIAO NHIỆM VỤ (XU)</div>
      <div class="rf-form-group">
        <label class="text-zinc-400 font-normal text-[12px] leading-relaxed">Người thực hiện</label>
        <select id="task-user"
          class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full">
          <option value="">-- Chọn nhân sự --</option>
        </select>
      </div>
      <div class="rf-form-group">
        <label class="text-zinc-400 font-normal text-[12px] leading-relaxed">Tiêu đề nhiệm vụ</label>
        <input type="text" id="task-title"
          class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
          placeholder="VD: Dọn dẹp bể cá phòng khách">
      </div>
      <div class="rf-form-group">
        <label class="text-zinc-400 font-normal text-[12px] leading-relaxed">Mô tả chi tiết</label>
        <input type="text" id="task-note"
          class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
          placeholder="Mô tả cụ thể yêu cầu...">
      </div>
      <div class="rf-form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label class="text-zinc-400 font-normal text-[12px] leading-relaxed">Mục tiêu chỉ tiêu (Target)</label>
          <input type="number" id="task-target"
            class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
            placeholder="VD: 10, 50, 1000000...">
        </div>
        <div style="flex: 1;">
          <label class="text-zinc-400 font-normal text-[12px] leading-relaxed">Đơn vị tính (Unit)</label>
          <input type="text" id="task-unit"
            class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
            placeholder="VD: Bộ, Lần, SP, VNĐ...">
        </div>
      </div>
      <div class="rf-form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label class="text-zinc-400 font-normal text-[12px] leading-relaxed">Ngày bắt đầu</label>
          <input type="date" id="task-start"
            class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full">
        </div>
        <div style="flex: 1;">
          <label class="text-zinc-400 font-normal text-[12px] leading-relaxed">Ngày kết thúc</label>
          <input type="date" id="task-end"
            class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full">
        </div>
      </div>
      <div class="rf-form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label style="color: #f59e0b; font-weight: bold;"><i class="fas fa-coins"
              style="margin-right: 4px;"></i>Thưởng hoàn thành (XU)</label>
          <input type="number" id="task-reward"
            class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
            placeholder="VD: 100" style="color: #fbbf24; font-weight: bold;">
        </div>
        <div style="flex: 1;">
          <label style="color: #f43f5e; font-weight: bold;"><i class="fas fa-gavel" style="margin-right: 4px;"></i>Phạt
            nếu quá hạn (VNĐ)</label>
          <input type="number" id="task-penalty"
            class="rf-input-glass rounded-xl px-4 py-3 text-[13px] text-white outline-none font-medium placeholder-zinc-600 w-full"
            placeholder="VD: 50000" style="color: #fda4af; font-weight: bold;">
        </div>
      </div>
      <div class="rf-modal-actions">
        <button class="rf-btn rf-btn-cancel" onclick="closeTaskModalStandalone()">Hủy bỏ</button>
        <button class="rf-btn rf-btn-submit" style="background: #00cec9;" onclick="submitTaskStandalone()">Giao
          Việc</button>
      </div>
    </div>
  </div>

  <script>
    function applyKpiPreset(type) {
      const nameInput = document.getElementById('kpiNameInput');
      const unitSelect = document.getElementById('kpiUnitSelect');
      const targetInput = document.getElementById('kpiTargetInput');
      const rewardInput = document.getElementById('kpiRewardInput');
      const guideInput = document.getElementById('kpiGuideInput');

      if (!type) return;

      if (type === 'san_xuat') {
        if (nameInput) nameInput.value = 'Tổng khâu sản xuất hoàn thành';
        if (unitSelect) unitSelect.value = 'SP';
        if (targetInput) targetInput.value = '150';
        if (rewardInput) rewardInput.value = '500000';
        if (guideInput) guideInput.value = 'Hệ thống tự động quét tổng số khâu (Khâu 1, Khâu 2, Đóng gói) đạt trạng thái Done trong tháng của nhân sự.';
      } else if (type === 'khau_1') {
        if (nameInput) nameInput.value = 'Năng suất Khâu 1 (Cắt & Dán)';
        if (unitSelect) unitSelect.value = 'SP';
        if (targetInput) targetInput.value = '80';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động đếm số lượng lệnh sản xuất Khâu 1 mà nhân sự hoàn thành đạt chuẩn.';
      } else if (type === 'khau_2') {
        if (nameInput) nameInput.value = 'Năng suất Khâu 2 (Gọt keo & Gia cố)';
        if (unitSelect) unitSelect.value = 'SP';
        if (targetInput) targetInput.value = '80';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động đếm số lượng lệnh sản xuất Khâu 2 mà nhân sự hoàn thành đạt chuẩn.';
      } else if (type === 'dong_goi') {
        if (nameInput) nameInput.value = 'Năng suất Đóng gói hoàn thành';
        if (unitSelect) unitSelect.value = 'Đơn';
        if (targetInput) targetInput.value = '200';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động đếm số đơn hàng đóng gói thành công có ảnh QC nghiệm thu.';
      } else if (type === 'ban_hang') {
        if (nameInput) nameInput.value = 'Doanh thu bán hàng tháng';
        if (unitSelect) unitSelect.value = 'VNĐ';
        if (targetInput) targetInput.value = '50000000';
        if (rewardInput) rewardInput.value = '1000000';
        if (guideInput) guideInput.value = 'Hệ thống tự động cộng dồn tổng doanh thu từ tất cả các đơn hàng chốt thành công của nhân sự phụ trách trong kỳ.';
      } else if (type === 'khieu_nai') {
        if (nameInput) nameInput.value = 'Tỷ lệ thắng khiếu nại sàn > 60%';
        if (unitSelect) unitSelect.value = '%';
        if (targetInput) targetInput.value = '60';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động quét tỷ lệ đơn khiếu nại thành công có tag [KN-THANG] trên tổng số khiếu nại.';
      } else if (type === 'hang_hoan') {
        if (nameInput) nameInput.value = 'Tỷ lệ xử lý hàng hoàn > 80%';
        if (unitSelect) unitSelect.value = '%';
        if (targetInput) targetInput.value = '80';
        if (rewardInput) rewardInput.value = '300000';
        if (guideInput) guideInput.value = 'Hệ thống tự động tính tỷ lệ đơn hàng hoàn đã được kiểm tra và đối soát nhập kho.';
      }
    }

    function openKpiModalStandalone(targetUserName) {
      const modal = document.getElementById('modal-kpi-standalone');
      if (modal) {
        modal.style.display = 'flex';
        const userSelect = document.getElementById('kpiUserSelect');
        if (userSelect && userSelect.options.length <= 1) {
          const pins = window._userConfigs?.pins || window.userConfigs?.pins || {};
          Object.values(pins).forEach(u => {
            if (u.name) {
              const opt = document.createElement('option');
              opt.value = u.name;
              opt.textContent = `${u.name} (${u.title || u.role || 'Nhân sự'})`;
              userSelect.appendChild(opt);
            }
          });
        }
        if (targetUserName && userSelect) {
          userSelect.value = targetUserName;
        }
      }
    }
    function closeKpiModalStandalone() {
      const modal = document.getElementById('modal-kpi-standalone');
      if (modal) modal.style.display = 'none';
    }

    // Mở / Đóng Modal Nhiệm vụ
    function openTaskModalStandalone() {
      const modal = document.getElementById('modal-task-standalone');
      if (modal) modal.style.display = 'flex';
    }
    function closeTaskModalStandalone() {
      const modal = document.getElementById('modal-task-standalone');
      if (modal) modal.style.display = 'none';
    }

    // Submit KPI -> Bảng KPI_Progress
    function submitKPIStandalone() {
      const btn = event ? event.target : document.querySelector('#modal-kpi-standalone .rf-btn-submit');
      const originalText = btn ? btn.innerHTML : 'Lưu Thiết Lập';
      if (btn) { btn.innerHTML = 'Đang lưu...'; btn.disabled = true; }

      const payload = {
        user: document.getElementById('kpiUserSelect').value,
        kpiName: document.getElementById('kpiNameInput').value,
        target: document.getElementById('kpiTargetInput').value,
        unit: document.getElementById('kpiUnitSelect').value,
        reward: document.getElementById('kpiRewardInput').value,
        guide: document.getElementById('kpiGuideInput').value
      };

      if (!payload.user || !payload.kpiName) {
        alert("Vui lòng chọn nhân sự và nhập tên KPI!");
        if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
        return;
      }

      google.script.run
        .withSuccessHandler(function (res) {
          if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
          if (res && res.success) {
            alert("Đã thiết lập KPI thành công!");
            closeKpiModalStandalone();
            // Reset form
            document.getElementById('kpiNameInput').value = '';
            document.getElementById('kpiTargetInput').value = '';
            document.getElementById('kpiRewardInput').value = '';
            document.getElementById('kpiUnitSelect').value = '%';
            document.getElementById('kpiGuideInput').value = '';
            // Kích hoạt reload data ở frontend
            window.dispatchEvent(new CustomEvent('triggerReloadData'));
          } else {
            alert("Lỗi: " + (res ? res.message : "Không rõ"));
          }
        })
        .withFailureHandler(function (err) {
          if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
          alert("Lỗi kết nối Server: " + err.message);
        })
        .api_insertManualKPI(payload);
    }

    // Submit Nhiệm vụ -> Bảng BonusPenalty (Thưởng Xu)
    function submitTaskStandalone() {
      const btn = event ? event.target : document.querySelector('#modal-task-standalone .rf-btn-submit');
      const originalText = btn ? btn.innerHTML : 'Giao Việc';
      if (btn) { btn.innerHTML = 'Đang lưu...'; btn.disabled = true; }

      const payload = {
        user: document.getElementById('task-user').value,
        title: document.getElementById('task-title').value,
        note: document.getElementById('task-note').value,
        target: document.getElementById('task-target').value,
        unit: document.getElementById('task-unit').value,
        startTime: document.getElementById('task-start').value,
        endTime: document.getElementById('task-end').value,
        amount: document.getElementById('task-reward').value.replace(/[^0-9-]/g, ''),
        penalty: document.getElementById('task-penalty').value.replace(/[^0-9-]/g, ''),
        type: 'XU_REWARD'
      };

      if (!payload.user || !payload.title) {
        alert("Vui lòng chọn nhân sự và nhập tiêu đề nhiệm vụ!");
        if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
        return;
      }

      google.script.run
        .withSuccessHandler(function (res) {
          if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
          if (res && res.success) {
            alert("Đã giao nhiệm vụ thành công! Nhân sự cần báo cáo hoàn thành để nhận Xu.");
            closeTaskModalStandalone();
            // Reset form
            document.getElementById('task-title').value = '';
            document.getElementById('task-note').value = '';
            document.getElementById('task-target').value = '';
            document.getElementById('task-unit').value = '';
            document.getElementById('task-reward').value = '';
            document.getElementById('task-penalty').value = '';
            document.getElementById('task-start').value = '';
            document.getElementById('task-end').value = '';
            // Kích hoạt reload data ở frontend
            window.dispatchEvent(new CustomEvent('triggerReloadData'));
          } else {
            alert("Lỗi: " + (res ? res.message : "Không rõ"));
          }
        })
        .withFailureHandler(function (err) {
          if (btn) { btn.innerHTML = originalText; btn.disabled = false; }
          alert("Lỗi kết nối Server: " + err.message);
        })
        .api_insertManualTask(payload);
    }

    // TỰ ĐỘNG LOAD DANH SÁCH NHÂN SỰ
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function (employees) {
            const kpiSelect = document.getElementById('kpiUserSelect');
            const taskSelect = document.getElementById('task-user');

            if (kpiSelect && taskSelect && employees && employees.length > 0) {
              employees.forEach(function (name) {
                let optKpi = document.createElement('option');
                optKpi.value = name;
                optKpi.innerHTML = name;
                kpiSelect.appendChild(optKpi);

                let optTask = document.createElement('option');
                optTask.value = name;
                optTask.innerHTML = name;
                taskSelect.appendChild(optTask);
              });
            }
          })
          .api_getActiveEmployees();
      }
    });
  </script>
</body>

</html>
