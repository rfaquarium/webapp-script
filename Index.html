    const { useState, useEffect, useMemo, useCallback } = React;

    // Lucide Icon Component
    const LucideIcon = ({ name, size = 16, className = "", color = "currentColor" }) => {
      const [iconHtml, setIconHtml] = React.useState('');
      React.useEffect(() => {
        if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
          const svg = window.lucide.icons[name].toSvg({ width: size, height: size, color, 'stroke-width': 2.25, class: className });
          setIconHtml(svg);
        } else {
          // Fallback map Lucide names -> FontAwesome names
          const faMap = {
            'bot': 'robot',
            'menu': 'bars',
            'layout-grid': 'th',
            'log-out': 'sign-out-alt',
            'home': 'home',
            'shopping-bag': 'shopping-bag',
            'hammer': 'hammer',
            'users': 'users',
            'trending-up': 'chart-line',
            'package': 'boxes',
            'wallet': 'wallet',
            'briefcase': 'handshake'
          };
          const faName = faMap[name] || name;
          setIconHtml(`<i class="fas fa-${faName} ${className}" style="font-size:${size}px; color:${color}"></i>`);
        }
      }, [name, size, className, color]);
      return <span dangerouslySetInnerHTML={{ __html: iconHtml }} />;
    };

    (function() {
      try {
        var rawJsx = document.getElementById('app-jsx').textContent;
        var hash = 0;
        for (var i = 0; i < rawJsx.length; i++) {
          var char = rawJsx.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash;
        }
        var cacheKey = 'rf_compiled_jsx_' + hash;
        var cachedCode = localStorage.getItem(cacheKey);
        
        for (var key in localStorage) {
          if (key.startsWith('rf_compiled_jsx_') && key !== cacheKey) {
            localStorage.removeItem(key);
          }
        }

        if (cachedCode) {
          console.log('App loaded from local compilation cache (Super Fast!)');
          var script = document.createElement('script');
          script.textContent = cachedCode;
          document.body.appendChild(script);
        } else {
          console.log('No cache found. Compiling JSX with Babel Standalone...');
          if (window.Babel) {
            var compiled = Babel.transform(rawJsx, { presets: ['react', 'es2015'] }).code;
            try {
              localStorage.setItem(cacheKey, compiled);
            } catch (e) {
              console.warn('Failed to save to localStorage:', e);
            }
            var script = document.createElement('script');
            script.textContent = compiled;
            document.body.appendChild(script);
          } else {
            console.error('Babel is not loaded!');
          }
        }
      } catch (err) {
        console.error('Error in custom JSX cache loader:', err);
        if (window.Babel) {
