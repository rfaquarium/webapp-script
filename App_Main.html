    // HÀM PARSE ACCESSORIES AN TOÀN TOÀN CỤC
    window.safeParseAccessories = function (accData) {
        if (!accData) return [];
        if (Array.isArray(accData)) return accData;
        try {
            if (typeof accData === 'string') {
                var trimmed = accData.trim();
                if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
                    var parsed = JSON.parse(trimmed);
                    if (typeof parsed === 'string') parsed = JSON.parse(parsed);
                    return Array.isArray(parsed) ? parsed : (typeof parsed === 'object' && parsed !== null ? [parsed] : []);
                } else if (trimmed.includes(',')) {
                    return trimmed.split(',').map(function (s) { return { name: s.trim(), quantity: 1 }; }).filter(function (x) { return x.name; });
                } else if (trimmed.length > 0) {
                    return [{ name: trimmed, quantity: 1 }];
                }
            }
            return [];
        } catch (e) {
            return [];
        }
    };

    // HÀM FETCH JSON AN TOÀN ĐỂ TRÁNH LỖI HTML ERROR PAGES (SYNTAX ERROR)
    window.safeFetchJSON = async function (url, options = {}) {
        const response = await fetch(url, options);
        const contentType = response.headers.get("content-type");
        if (contentType && contentType.indexOf("application/json") !== -1) {
            return await response.json();
        } else {
            const text = await response.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                console.warn("safeFetchJSON: API returned non-JSON response from", url, text.substring(0, 200));
                throw new Error("Máy chủ đối tác trả về dữ liệu không hợp lệ (không phải JSON). Vui lòng thử lại sau.");
            }
        }
    };

    // KHAI BÁO HÀM ĐỒNG BỘ DỮ LIỆU TỪ SERVER (APP SCRIPT) XUỐNG CLIENT
    window.runGAS = function (serverFunctionName, ...args) {
        return new Promise((resolve, reject) => {
            try {
                let finalArgs = args;
                if (serverFunctionName === 'getAppData' || serverFunctionName === 'syncDeltas' || serverFunctionName === 'getArchivedData' || serverFunctionName === 'getArchivedOrders' || serverFunctionName === 'archiveReconciledOrders') {
                    const pin = localStorage.getItem('rf_pin') || '';
                    finalArgs = [...args, pin];
                }

                if (typeof google === 'undefined' || !google.script || !google.script.run) {
                    console.warn('Môi trường không hỗ trợ google.script.run');
                    return resolve({ success: false, message: 'Môi trường không hỗ trợ google.script.run' });
                }

                const runner = google.script.run
                    .withSuccessHandler((res) => {
                        if (res && (res._AUTH_FAILED || res.isAuthFailed || res.error === "AUTH_FAILED")) {
                            alert('Phiên làm việc chưa xác thực hoặc đã hết hạn! Vui lòng đăng nhập lại.');
                            localStorage.clear();
                            window.location.reload();
                            return;
                        }
                        resolve(res);
                    })
                    .withFailureHandler((err) => {
                        if (err && err.message && err.message.includes('AUTH_FAILED')) {
                            alert('Lỗi xác thực! Vui lòng đăng nhập lại.');
                            localStorage.clear();
                            window.location.reload();
                            return;
                        }
                        reject(err);
                    });

                if (typeof runner[serverFunctionName] !== 'function') {
                    console.warn(`Hàm backend ${serverFunctionName} chưa tồn tại trên Google Apps Script.`);
                    return resolve({ success: false, message: `Hàm ${serverFunctionName} chưa sẵn sàng` });
                }

                runner[serverFunctionName](...finalArgs);
            } catch (e) {
                console.error(`Lỗi gọi runGAS (${serverFunctionName}):`, e);
                reject(e);
            }
        });
    };

    // CHUYỂN ĐỔI VAPID PUBLIC KEY DẠNG BASE64 SANG UINT8ARRAY
    window.urlBase64ToUint8Array = function (base64String) {
        const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    };

        const safeGet = (k, d) => {
            try {
                let v = localStorage.getItem(k);
                if (!v) {
                    const m = document.cookie.match(new RegExp('(^| )' + k + '=([^;]+)'));
                    if (m) v = m[2];
                }
                return v || d;
            } catch (e) { return d; }
        };
        const safeSet = (k, v) => {
            try {

        };

        // ĐỘNG CƠ "OPTIMISTIC UI": XỬ LÝ SIÊU TỐC - ĐÓNG FORM NGAY - LƯU NGẦM KHÔNG CHỜ ĐỢI
        const pushDeltas = React.useCallback(async (payload, successMsg, successIcon) => {
            pendingSyncsRef.current += 1;
            syncCounterRef.current += 1;
            const currentSyncId = syncCounterRef.current;

            const currentRole = localStorage.getItem('rf_role') || '';
            if (currentRole === 'KHÁCH') {
                triggerToast("Tài khoản KHÁCH (Demo) chỉ có quyền xem, không thể thay đổi dữ liệu!", "fa-exclamation-triangle", "warning");
                return Promise.resolve();
            }
            if (successMsg) triggerToast(successMsg, successIcon || 'fa-check', 'success');

            const optimisticMerge = (currentArray, newItems, deleteIds) => {
                let result = [...(currentArray || [])];
                if (deleteIds && deleteIds.length > 0) {
                    result = result.filter(x => !deleteIds.some(dId => String(dId) === String(x.id)));
                }
                if (newItems && newItems.length > 0) {
                    newItems.forEach(item => {
                        const idx = result.findIndex(x => String(x.id) === String(item.id));
                        if (idx >= 0) {
                            const existing = result[idx];
                            let mergedAcc = item.accessories;
                            const isIncomingEmpty = mergedAcc === undefined || mergedAcc === null || mergedAcc === '' || mergedAcc === '[]' || (Array.isArray(mergedAcc) && mergedAcc.length === 0);
                            if (isIncomingEmpty && existing && existing.accessories) {
                                const isExistingEmpty = !existing.accessories || existing.accessories === '[]' || existing.accessories === '' || (Array.isArray(existing.accessories) && existing.accessories.length === 0);
                                if (!isExistingEmpty) {
                                    mergedAcc = existing.accessories;
                                }
                            }
                            result[idx] = { ...existing, ...item, accessories: mergedAcc };
                        } else {
                            result.unshift(item);
                        }
                    });
                }
                return result;
            };

            // --- ĐỒNG BỘ TRẠNG THÁI ĐƠN HÀNG CHUẨN ---
            if (payload.orders && Array.isArray(payload.orders)) {
                payload.orders = payload.orders.map(order => {
                    if (order.status) {
                        const s = String(order.status).trim().toLowerCase();
                        let cleanStatus = s;
                        if (s.includes('hủy') || s.includes('huỷ') || s === 'cancelled') cleanStatus = 'Đơn Huỷ';
                        else if (s.includes('đang sản xuất')) cleanStatus = 'Đang Sản Xuất';
                        else if (s === 'đã bàn giao' || s === 'delivered') cleanStatus = 'Đã Bàn Giao';
                        else if (s === 'đối soát thành công' || s === 'completed') cleanStatus = 'Đối Soát Thành Công';
                        else if (s.includes('sẵn sàng đóng gói')) cleanStatus = 'Sẵn Sàng Đóng Gói';
                        else if (s === 'hàng hoàn' || s === 'returned') cleanStatus = 'Hàng Hoàn';
                        else if (s === 'chờ sản xuất') cleanStatus = 'Chờ Sản Xuất';
                        else if (s === 'đã nhập kho') cleanStatus = 'Đã Nhập Kho';
                        else cleanStatus = s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

                        order.status = cleanStatus;
                    }
                    return order;
                });
            }

            const deletes = payload.deletes || {};

            setOrders(prev => optimisticMerge(prev, payload.orders, deletes.Orders || deletes.orders));
            setProdItems(prev => optimisticMerge(prev, payload.prodItems, deletes.Production || deletes.prodItems));
            setPackings(prev => optimisticMerge(prev, payload.packings, deletes.Packings || deletes.packings));
            setAttendance(prev => optimisticMerge(prev, payload.attendance, deletes.Attendance || deletes.attendance));
            if (payload.ctvTransactions) setCtvFinance(prev => optimisticMerge(prev, payload.ctvTransactions, []));
            setDocuments(prev => optimisticMerge(prev, payload.documents, deletes.Documents || deletes.documents));
            setTrainings(prev => optimisticMerge(prev, payload.trainings, deletes.Trainings || deletes.trainings));
            setReimbursements(prev => optimisticMerge(prev, payload.Reimbursements, deletes.Reimbursements || deletes.reimbursements));

            if (payload.orders || deletes.Orders || deletes.orders) {
                try { window.dispatchEvent(new CustomEvent('ordersUpdated')); } catch (e) { }
            }

            if (payload.UserConfigs && payload.UserConfigs.length > 0) {
                setUserConfigs(payload.UserConfigs[0]);
            }

            setErpData(prev => ({
                ...prev,
                Products: optimisticMerge(prev.Products, payload.Products, deletes.Products),
                Accounts: optimisticMerge(prev.Accounts, payload.Accounts, deletes.Accounts),
                Suppliers: optimisticMerge(prev.Suppliers, payload.Suppliers, deletes.Suppliers),
                Transactions: optimisticMerge(prev.Transactions, payload.Transactions, deletes.Transactions),
                ImportExport: optimisticMerge(prev.ImportExport, payload.ImportExport, deletes.ImportExport),
                ProfitReports: optimisticMerge(prev.ProfitReports, payload.ProfitReports, deletes.ProfitReports),
                BonusPenalty: optimisticMerge(prev.BonusPenalty, payload.BonusPenalty, deletes.BonusPenalty),
                KPI_Progress: optimisticMerge(prev.KPI_Progress, payload.KPI_Progress, deletes.KPI_Progress),
                ThongKe_TichLuyXu: optimisticMerge(prev.ThongKe_TichLuyXu, payload.ThongKe_TichLuyXu || payload.xuTransactions, deletes.ThongKe_TichLuyXu || deletes.xuTransactions),
                BOM_Config: optimisticMerge(prev.BOM_Config, payload.BOM_Config, deletes.BOM_Config),
                Orders: optimisticMerge(prev.Orders, payload.orders, deletes.Orders || deletes.orders),
                Packings: optimisticMerge(prev.Packings, payload.packings, deletes.Packings || deletes.packings),

                                            <i className="fas fa-coins text-[#d4af37] text-[11px] sm:text-[12px]"></i>
                                            <span className="text-[11px] sm:text-[12px] font-bold text-[#d4af37] font-mono leading-none">{Math.ceil(Number(totalXu)).toLocaleString('vi-VN')}</span>
                                        </div>
                                    );
                                }
                                return null;
                            })()}

                            {isAdmin && (
                                <div className="hidden md:block animate-fade-in shrink-0">
                                    <div className="text-[10px] font-bold text-[#d4af37] uppercase tracking-wider bg-[#d4af37]/10 px-2.5 py-1 rounded-md border border-[#d4af37]/20 shadow-sm">
                                        {isBoss ? 'TỐI CAO' : getDisplayRole(userRole)}
                                    </div>
                                </div>
                            )}
                            <div
                                className="relative cursor-pointer group shrink-0 ml-0.5 sm:ml-1"
                                onClick={() => {
                                    if (typeof window !== 'undefined') {
                                        const setIsSpinning = (val) => { }; // dummy or actual if needed
                                        window.dispatchEvent(new CustomEvent('triggerReloadData', { detail: { setIsSpinning } }));
                                    }
                                }}
                                title="Nhấn để làm mới dữ liệu"
                            >
                                {syncing ? <i className="fas fa-sync animate-spin text-[16px] text-[#d4af37] w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center"></i> : (typeof Avatar !== 'undefined' ? <Avatar name={currentUser} userConfigs={userConfigs} className="w-8 h-8 sm:w-9 sm:h-9 border border-white/10 rounded-full transition-transform group-hover:scale-105 shadow-sm object-cover" /> : <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-zinc-800"></div>)}
                                {!syncing && (
                                    <div className="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 sm:w-4 sm:h-4 bg-emerald-500 rounded-full flex items-center justify-center border-2 border-[#09090b] shadow-sm group-hover:rotate-180 transition-all duration-300">
                                        <i className="fas fa-sync-alt text-[6px] sm:text-[7px] text-[#09090b]"></i>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className={`flex-1 min-h-0 w-full max-w-full p-3 sm:p-4 lg:p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom))] md:pb-8 overflow-y-auto overflow-x-hidden custom-scrollbar relative z-10 overscroll-none touch-pan-y ${userRole === 'KHÁCH' ? 'rf-guest-mode' : ''}`}>
                        <ErrorBoundary>
                            {(() => {
                                const isCTV = userRole === 'CTV';
                                const renderCTVLocked = () => (
                                    <div className="flex flex-col items-center justify-center h-full text-gray-500 py-32 animate-fade-in">
                                        <i className="fas fa-lock text-6xl mb-6 opacity-30"></i>
                                        <h2 className="text-2xl font-black uppercase tracking-widest text-center text-gray-400">******</h2>
                                        <p className="text-sm font-bold mt-2 text-center uppercase text-gray-600">Vùng Dữ Liệu Bảo Mật</p>
                                    </div>
                                );

                                return (
                                    <div className="w-full max-w-full h-full relative overflow-x-hidden">
                                        {/* WORKSPACE TABS */}
                                        {(activeTab === 'dashboard' || mountedTabs.includes('dashboard')) && typeof DashboardTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'dashboard' ? 'block' : 'hidden'}`}><DashboardTab reimbursements={memoizedReimbursements} attendance={memoizedAttendance} records={memoizedAttendance} prodItems={memoizedProdItems} currentUser={currentUser} packings={memoizedPackings} users={memoizedUsers} orders={memoizedOrders} kpiConfig={typeof kpiConfig !== 'undefined' ? kpiConfig : []} erpData={erpData || {}} kpis={memoizedBonusPenalty} importExport={memoizedImportExport} userConfigs={userConfigs} erpProducts={memoizedErpProducts} pushDeltas={pushDeltas} triggerToast={triggerToast} isAdmin={isAdmin} isBoss={isBoss} documents={memoizedDocuments} /></div>}
                                        
                                        {(activeTab === 'orders' || mountedTabs.includes('orders')) && typeof OrdersTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'orders' ? 'block' : 'hidden'}`}><OrdersTab loadArchiveData={loadArchiveData} fetchArchivedOrders={fetchArchivedOrders} isArchiveLoaded={isArchiveLoaded} isLoadingArchive={isLoadingArchive} attendance={memoizedAttendance} orders={memoizedOrders} prodItems={memoizedProdItems} packings={memoizedPackings} erpProducts={memoizedErpProducts} erpData={erpData || {}} isAdmin={isAdmin} currentUser={currentUser} pushDeltas={pushDeltas} userConfigs={userConfigs} triggerToast={triggerToast} kpiConfig={typeof kpiConfig !== 'undefined' ? kpiConfig : []} configGiaLayout={memoizedConfigGiaLayout} /></div>}
                                        
                                        {(activeTab === 'production' || mountedTabs.includes('production')) && typeof ProductionTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'production' ? 'block' : 'hidden'}`}><ProductionTab attendance={memoizedAttendance} orders={memoizedOrders} prodItems={memoizedProdItems} packings={memoizedPackings} erpProducts={memoizedErpProducts} erpData={erpData || {}} currentUser={currentUser} pushDeltas={pushDeltas} userConfigs={userConfigs} triggerToast={triggerToast} kpiConfig={typeof kpiConfig !== 'undefined' ? kpiConfig : []} models3D={memoizedModels3D} /></div>}
                                        
                                        
                                        {(activeTab === 'hr' || mountedTabs.includes('hr')) && typeof HRTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'hr' ? 'block' : 'hidden'}`}>{isCTV ? renderCTVLocked() : <HRTab orders={memoizedOrders} documents={memoizedDocuments} hasPerm={hasPerm} attendance={memoizedAttendance} erpData={erpData || {}} userConfigs={userConfigs} prodItems={memoizedProdItems} packings={memoizedPackings} pushDeltas={pushDeltas} triggerToast={triggerToast} />}</div>}
                                        
                                        {(activeTab === 'documents' || mountedTabs.includes('documents')) && typeof DocumentsTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'documents' ? 'block' : 'hidden'}`}>{isCTV ? renderCTVLocked() : <DocumentsTab documents={memoizedDocuments} isAdmin={isAdmin} pushDeltas={pushDeltas} triggerToast={triggerToast} />}</div>}
                                        
                                        {(activeTab === 'viewer3d' || mountedTabs.includes('viewer3d')) && typeof Viewer3DTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'viewer3d' ? 'block' : 'hidden'}`}><Viewer3DTab models3D={memoizedModels3D} pushDeltas={pushDeltas} erpProducts={memoizedErpProducts} /></div>}
                                        
                                        {(activeTab === 'affiliate' || mountedTabs.includes('affiliate')) && typeof TabAffiliate !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'affiliate' ? 'block' : 'hidden'}`}><TabAffiliate orders={memoizedOrders} ctvFinance={memoizedCtvFinance} configGiaLayout={memoizedConfigGiaLayout} pushDeltas={pushDeltas} currentUser={currentUser} triggerToast={triggerToast} userRole={userRole} userConfigs={userConfigs} erpData={erpData || {}} prodItems={memoizedProdItems} /></div>}

                                        {(activeTab === 'changelog' || mountedTabs.includes('changelog')) && typeof ChangelogTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'changelog' ? 'block' : 'hidden'}`}><ChangelogTab currentUser={currentUser} triggerToast={triggerToast} /></div>}

                                        {/* ERP TABS */}
                                        {(activeTab === 'warehouse' || mountedTabs.includes('warehouse')) && typeof InventoryTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'warehouse' ? 'block' : 'hidden'}`}><InventoryTab data={memoizedInventoryData} userConfigs={userConfigs} pushData={pushErpData} isAdmin={isAdmin} triggerToast={triggerToast} /></div>}
                                        
                                        {(activeTab === 'import_export' || mountedTabs.includes('import_export')) && typeof ImportExportTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'import_export' ? 'block' : 'hidden'}`}>{isCTV ? renderCTVLocked() : <ImportExportTab data={erpData} userConfigs={userConfigs} pushData={pushErpData} isAdmin={isAdmin} triggerToast={triggerToast} />}</div>}
                                        
                                        {(activeTab === 'cashflow' || mountedTabs.includes('cashflow')) && typeof FinanceTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'cashflow' ? 'block' : 'hidden'}`}>{isCTV ? renderCTVLocked() : <FinanceTab orders={memoizedOrders} erpData={erpData || {}} pushDeltas={pushDeltas} triggerToast={triggerToast} isAdmin={isAdmin} categories={memoizedFinanceCategories} />}</div>}
                                        
                                        {(activeTab === 'analytics' || mountedTabs.includes('analytics')) && typeof AnalyticsTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'analytics' ? 'block' : 'hidden'}`}>{isCTV ? renderCTVLocked() : <AnalyticsTab data={memoizedAnalyticsData} pushData={pushErpData} isAdmin={isAdmin} mode={mode} userConfigs={userConfigs} />}</div>}
                                        
                                        {(activeTab === 'business_report' || mountedTabs.includes('business_report')) && typeof BusinessReportTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'business_report' ? 'block' : 'hidden'}`}>{isCTV ? renderCTVLocked() : <BusinessReportTab erpData={erpData || {}} pushDeltas={pushDeltas} triggerToast={triggerToast} />}</div>}
                                        
                                        {(activeTab === 'suppliers' || mountedTabs.includes('suppliers')) && typeof SuppliersTab !== 'undefined' && <div className={`w-full h-full rf-tab-view rf-gpu-accelerated ${activeTab === 'suppliers' ? 'block' : 'hidden'}`}>{isCTV ? renderCTVLocked() : <SuppliersTab data={erpData || {}} pushData={pushErpData} isAdmin={isAdmin} triggerToast={triggerToast} />}</div>}

                                        {/* LOADING FALLBACK — Hiển thị khi tab deferred chưa sẵn sàng */}
                                        {!deferredReady && !['dashboard', 'orders', 'changelog'].includes(activeTab) && (() => {
                                            const tabComponentMap = {
                                                'production': typeof ProductionTab, 'hr': typeof HRTab, 'warehouse': typeof InventoryTab,
                                                'import_export': typeof ImportExportTab, 'cashflow': typeof FinanceTab, 'suppliers': typeof SuppliersTab,
                                                'analytics': typeof AnalyticsTab, 'documents': typeof DocumentsTab, 'viewer3d': typeof Viewer3DTab,
                                                'affiliate': typeof TabAffiliate, 'business_report': typeof BusinessReportTab
                                            };
                                            if (tabComponentMap[activeTab] === 'undefined') {
                                                return (
                                                    <div className="flex flex-col items-center justify-center h-[50vh] gap-4 animate-pulse">
                                                        <div className="w-12 h-12 rounded-full border-4 border-[#00a8e8]/30 border-t-[#00a8e8] animate-spin"></div>
                                                        <p className="text-[13px] font-black text-zinc-500 uppercase tracking-widest">Đang tải module...</p>
                                                    </div>
                                                );
                                            }
                                            return null;
                                        })()}
                                    </div>
                                );
                            })()}
                        </ErrorBoundary>
                    </main>

                    {/* NÚT TẢI LẠI TRANG */}
                    {typeof ReloadAppButton !== 'undefined' && <ReloadAppButton />}

                    {/* CÁC MODAL TOÀN CỤC CHẠY NGẦM */}
                    {showBulkImport && typeof BulkImportModal !== 'undefined' && <BulkImportModal onClose={() => setShowBulkImport(false)} pushDeltas={pushDeltas} existingOrders={orders} products={erpData.Products} existingProdItems={prodItems} />}
                    {showScanLabel && typeof ScanLabelModal !== 'undefined' && <ScanLabelModal onClose={() => setShowScanLabel(false)} pushDeltas={pushDeltas} existingOrders={orders} products={erpData.Products} triggerToast={triggerToast} />}
                    {showDocumentUpload && typeof DocumentUploadModal !== 'undefined' && <DocumentUploadModal onClose={() => setShowDocumentUpload(false)} pushDeltas={pushDeltas} triggerToast={triggerToast} />}
                    {stockHistoryItem && typeof StockHistoryModal !== 'undefined' && <StockHistoryModal product={stockHistoryItem} onClose={() => setStockHistoryItem(null)} importExport={erpData?.ImportExport} />}

                    <>
                        {typeof ConfirmModal !== 'undefined' && <ConfirmModal visible={confirmModal.visible} title={confirmModal.title} message={confirmModal.message} onConfirm={() => { if (confirmModal.onConfirm) confirmModal.onConfirm(); closeModals(); }} onCancel={closeModals} />}
                        {typeof AlertModal !== 'undefined' && <AlertModal visible={alertModal.visible} title={alertModal.title} message={alertModal.message} onClose={closeModals} />}
                        {typeof InputModal !== 'undefined' && <InputModal visible={inputModal.visible} title={inputModal.title} placeholder={inputModal.placeholder} onConfirm={(value) => { if (inputModal.onConfirm) inputModal.onConfirm(value); closeModals(); }} onCancel={closeModals} />}
                        {typeof FreightCalculatorModal !== 'undefined' && <FreightCalculatorModal visible={freightModal} onClose={closeModals} />}
                        {typeof TankPriceModal !== 'undefined' && <TankPriceModal visible={tankPriceModal} onClose={closeModals} />}
                        {typeof LayoutCalculatorModal !== 'undefined' && <LayoutCalculatorModal visible={layoutCalcModal} onClose={closeModals} configGiaLayout={configGiaLayout || []} />}
                        {typeof PriceListModal !== 'undefined' && <PriceListModal visible={priceListModal} onClose={closeModals} triggerToast={triggerToast} erpProducts={erpData?.Products || []} />}
                        {typeof StaffReimbursementModal !== 'undefined' && <StaffReimbursementModal visible={staffReimbModal} onClose={closeModals} pushDeltas={pushDeltas} currentUser={currentUser} triggerToast={triggerToast} />}
                        {typeof AdminApprovalModal !== 'undefined' && <AdminApprovalModal data={adminApproveModalData} onClose={closeModals} pushDeltas={pushDeltas} triggerToast={triggerToast} />}
                        {typeof QuickPenaltyModal !== 'undefined' && <QuickPenaltyModal visible={quickPenaltyModal} onClose={closeModals} pushDeltas={pushDeltas} triggerToast={triggerToast} userConfigs={userConfigs} />}
                        {typeof QuickExpenseModal !== 'undefined' && <QuickExpenseModal visible={quickExpenseModal} onClose={closeModals} pushDeltas={pushDeltas} triggerToast={triggerToast} accounts={erpData?.Accounts || []} />}
                    </>


                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
