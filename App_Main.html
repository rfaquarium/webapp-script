<script type="text/babel">
    // ==========================================
    // BỘ KHUNG UI/UX CHUYÊN NGHIỆP - TÍCH HỢP LÕI "OPTIMISTIC UI" VÀ FULL TABS
    // ==========================================

    // HÀM PARSE ACCESSORIES AN TOÀN TOÀN CỤC
    window.safeParseAccessories = function (accData) {
        if (!accData) return [];
        if (Array.isArray(accData)) return accData;
        try {
            if (typeof accData === 'string') {
                var trimmed = accData.trim();
                if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
                    var parsed = JSON.parse(trimmed);
                    if (typeof parsed === 'string') parsed = JSON.parse(parsed);
                    return Array.isArray(parsed) ? parsed : (typeof parsed === 'object' && parsed !== null ? [parsed] : []);
                } else if (trimmed.includes(',')) {
                    return trimmed.split(',').map(function (s) { return { name: s.trim(), quantity: 1 }; }).filter(function (x) { return x.name; });
                } else if (trimmed.length > 0) {
                    return [{ name: trimmed, quantity: 1 }];
                }
            }
            return [];
        } catch (e) {
            return [];
        }
    };

    // KHAI BÁO HÀM ĐỒNG BỘ DỮ LIỆU TỪ SERVER (APP SCRIPT) XUỐNG CLIENT
    window.runGAS = function (serverFunctionName, ...args) {
        return new Promise((resolve, reject) => {
            try {
                let finalArgs = args;
                if (serverFunctionName === 'getAppData' || serverFunctionName === 'syncDeltas' || serverFunctionName === 'getArchivedData') {
                    const pin = localStorage.getItem('rf_pin') || '';
                    finalArgs = [...args, pin];
                }

                if (typeof google === 'undefined' || !google.script || !google.script.run) {
                    console.warn('Môi trường không hỗ trợ google.script.run');
                    return resolve({ success: false, message: 'Môi trường không hỗ trợ google.script.run' });
                }

                const runner = google.script.run
                    .withSuccessHandler((res) => {
                        if (res && (res._AUTH_FAILED || res.isAuthFailed)) {
                            if (localStorage.getItem('rf_pin')) {
                                alert('Phiên làm việc hết hạn hoặc bị thu hồi! Vui lòng đăng nhập lại.');
                                localStorage.clear();
                                window.location.reload();
                            } else {
                                resolve(res);
                            }
                            return;
                        }
                        resolve(res);
                    })
                    .withFailureHandler((err) => {
                        if (err && err.message && err.message.includes('AUTH_FAILED')) {
                            if (localStorage.getItem('rf_pin')) {
                                alert('Lỗi xác thực! Vui lòng đăng nhập lại.');
                                localStorage.clear();
                                window.location.reload();
                            } else {
                                reject(err);
                            }
                            return;
                        }
                        reject(err);
                    });

                if (typeof runner[serverFunctionName] !== 'function') {
                    console.warn(`Hàm backend ${serverFunctionName} chưa tồn tại trên Google Apps Script.`);
                    return resolve({ success: false, message: `Hàm ${serverFunctionName} chưa sẵn sàng` });
                }

                runner[serverFunctionName](...finalArgs);
            } catch (e) {
                console.error(`Lỗi gọi runGAS (${serverFunctionName}):`, e);
                reject(e);
            }
        });
    };

    // CHUYỂN ĐỔI VAPID PUBLIC KEY DẠNG BASE64 SANG UINT8ARRAY
    window.urlBase64ToUint8Array = function (base64String) {
        const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    };

    // ĐĂNG KÝ SERVICE WORKER VÀ LẤY PUSH TOKEN CHO NHÂN SỰ
    window.registerWebPushNotifications = async function (currentUser) {
        if (!currentUser) return;
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
            console.warn('⚠️ Trình duyệt/Thiết bị này không hỗ trợ Web Push Notification');
            return;
        }

        try {
            const reg = await navigator.serviceWorker.register('./sw.js');
            await navigator.serviceWorker.ready;

            // Kiểm tra trạng thái cấp quyền hiện tại
            let permission = Notification.permission;
            if (permission === 'default') {
                permission = await Notification.requestPermission();
            }
            if (permission !== 'granted') {
                console.log('ℹ️ Người dùng chưa cấp quyền thông báo');
                return;
            }

            const VAPID_PUBLIC_KEY = 'BE28tc0C-AHuGSmjcuTFRwIZpyz_bVAqq-SgMltz7zLF8gpa8B0fewHHw2oRDbcr8mHNqDF_r3Hpm_cqpHdMwZo';
            const convertedVapidKey = window.urlBase64ToUint8Array(VAPID_PUBLIC_KEY);

            let subscription = await reg.pushManager.getSubscription();
            if (!subscription) {
                subscription = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: convertedVapidKey
                });
            }

            if (subscription) {
                await runGAS('saveUserPushSubscription', {
                    user: currentUser,
                    subscription: JSON.stringify(subscription),
                    userAgent: navigator.userAgent
                });
                console.log('✅ Đã đăng ký Web Push cho nhân sự:', currentUser);
            }
        } catch (err) {
            console.error('❌ Lỗi registerWebPushNotifications:', err);
        }
    };

    function App() {
        const getDisplayRole = (role) => {
            if (!role || role === 'TỐI CAO') return role;
            if (role === 'KẾ TOÁN' || role === 'KIỂM TOÁN') return role;
            if (role === 'CỘNG TÁC VIÊN' || role === 'CTV' || role === 'KHÁCH') return role;
            if (role.includes('QUẢN LÝ')) return role;
            return `QUẢN LÝ ${role}`;
        };
        const safeGet = (k, d) => {
            try {
                let v = localStorage.getItem(k);
                if (!v) {
                    const m = document.cookie.match(new RegExp('(^| )' + k + '=([^;]+)'));
                    if (m) v = m[2];
                }
                return v || d;
            } catch (e) { return d; }
        };
        const safeSet = (k, v) => {
            try {
                localStorage.setItem(k, v);
                document.cookie = `${k}=${v}; max-age=31536000; path=/`;
            } catch (e) { }
        };

        const [mode, setMode] = React.useState('WORKSPACE');
        const [activeTab, setActiveTab] = React.useState(() => { const r = safeGet('rf_role', ''); return (r === 'CỘNG TÁC VIÊN' || r === 'CTV') ? 'orders' : 'dashboard'; });
        const [isMenuOpen, setIsMenuOpen] = React.useState(false);

        const [isDarkMode, setIsDarkMode] = React.useState(() => safeGet('rf_theme', 'dark') !== 'light');

        const [currentUser, setCurrentUser] = React.useState(() => safeGet('rf_user', ''));
        const [isAdmin, setIsAdmin] = React.useState(() => safeGet('rf_admin', 'false') === 'true');
        const [isBoss, setIsBoss] = React.useState(() => safeGet('rf_boss', 'false') === 'true');
        const [userRole, setUserRole] = React.useState(() => safeGet('rf_role', ''));

        const [orders, setOrders] = React.useState(() => {
            try {
                const raw = localStorage.getItem('rf_app_instant_cache');
                if (raw) return JSON.parse(raw)?.orders || [];
            } catch (e) { }
            return [];
        });
        const [prodItems, setProdItems] = React.useState(() => {
            try {
                const raw = localStorage.getItem('rf_app_instant_cache');
                if (raw) return JSON.parse(raw)?.prodItems || [];
            } catch (e) { }
            return [];
        });
        const [packings, setPackings] = React.useState(() => {
            try {
                const raw = localStorage.getItem('rf_app_instant_cache');
                if (raw) return JSON.parse(raw)?.packings || [];
            } catch (e) { }
            return [];
        });
        const [attendance, setAttendance] = React.useState(() => {
            try {
                const raw = localStorage.getItem('rf_app_instant_cache');
                if (raw) return JSON.parse(raw)?.attendance || [];
            } catch (e) { }
            return [];
        });
        const [ctvFinance, setCtvFinance] = React.useState(() => {
            try {
                const raw = localStorage.getItem('rf_app_instant_cache');
                if (raw) return JSON.parse(raw)?.ctvFinance || [];
            } catch (e) { }
            return [];
        });
        const [configGiaLayout, setConfigGiaLayout] = React.useState(() => {
            try {
                const raw = localStorage.getItem('rf_app_instant_cache');
                if (raw) return JSON.parse(raw)?.configGiaLayout || [];
            } catch (e) { }
            return [];
        });
        const [erpData, setErpData] = React.useState(() => {
            try {
                const raw = localStorage.getItem('rf_app_instant_cache');
                if (raw) {
                    const c = JSON.parse(raw);
                    return {
                        Products: c?.Products || [],
                        Accounts: c?.Accounts || [],
                        Suppliers: c?.Suppliers || [],
                        Transactions: c?.Transactions || [],
                        ImportExport: c?.ImportExport || [],
                        ProfitReports: c?.ProfitReports || [],
                        BOM_Config: c?.BOM_Config || []
                    };
                }
            } catch (e) { }
            return { Products: [], Accounts: [], Suppliers: [], Transactions: [], ImportExport: [], ProfitReports: [], BOM_Config: [] };
        });
        const [userConfigs, setUserConfigs] = React.useState({});
        const [kpiConfig, setKpiConfig] = React.useState([]);
        const [documents, setDocuments] = React.useState([]);
        const [trainings, setTrainings] = React.useState([]);
        const [models3D, setModels3D] = React.useState([]);
        const [reimbursements, setReimbursements] = React.useState([]);
        const [showPwaBanner, setShowPwaBanner] = React.useState(() => {
            const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
            return !isStandalone;
        });

        // Kiểm tra quyền hạn chi tiết dựa trên permissions array của user trong userConfigs
        const hasPerm = React.useCallback((permId) => {
            if (isBoss) return true;
            const pin = Object.keys(userConfigs?.pins || {}).find(p => userConfigs.pins[p]?.name === currentUser);
            if (!pin) return isAdmin;
            const perms = userConfigs?.pins?.[pin]?.permissions || [];
            return perms.includes(permId) || isAdmin;
        }, [isBoss, isAdmin, currentUser, userConfigs]);

        const [loading, setLoading] = React.useState(true);
        const [syncing, setSyncing] = React.useState(false);
        const [isArchiveLoaded, setIsArchiveLoaded] = React.useState(false);
        const [isLoadingArchive, setIsLoadingArchive] = React.useState(false);
        const clientId = React.useMemo(() => Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15), []);

        const [showBulkImport, setShowBulkImport] = React.useState(false);
        const [showScanLabel, setShowScanLabel] = React.useState(false);
        const [showDocumentUpload, setShowDocumentUpload] = React.useState(false);
        const [stockHistoryItem, setStockHistoryItem] = React.useState(null);

        const [toasts, setToasts] = React.useState([]);
        React.useEffect(() => { safeSet('rf_theme', isDarkMode ? 'dark' : 'light'); }, [isDarkMode]);

        // ===== GEN 2: REACTIVE BADGE COUNTERS =====
        const pendingOrdersCount = React.useMemo(() => {
            if (!orders || !orders.length) return 0;
            return orders.filter(o => {
                if (!o.status) return false;
                const s = String(o.status).toUpperCase().trim();
                return s !== 'ĐÃ GIAO' && s !== 'ĐÃ HỦY' && s !== 'HOÀN THÀNH';
            }).length;
        }, [orders]);

        const activeProdCount = React.useMemo(() => {
            if (!prodItems || !prodItems.length) return 0;
            return prodItems.filter(p => {
                if (!p.status) return false;
                const s = String(p.status).toUpperCase().trim();
                return s !== 'DONE' && s !== 'ĐÃ XONG' && s !== 'ĐÃ HỦY' && s !== 'HỦY/VỠ' && s !== 'HOÀN KHO ĐẠT' && !p.fulfilledFromStock;
            }).length;
        }, [prodItems]);

        const outOfStockCount = React.useMemo(() => {
            if (!erpData?.Products || !erpData.Products.length) return 0;
            return erpData.Products.filter(p => {
                const qty = Number(p.quantity) || 0;
                return qty <= 0;
            }).length;
        }, [erpData?.Products]);

        const unreadTrainingsCount = React.useMemo(() => {
            const uRole = localStorage.getItem('rf_role') || '';
            const uUser = localStorage.getItem('rf_user') || '';
            if (!uUser) return 0;
            return (trainings || []).filter(t => {
                if (t.targetRole !== 'ALL' && t.targetRole !== uRole) return false;
                let rList = [];
                try {
                    rList = typeof t.readUsers === 'string' ? JSON.parse(t.readUsers || '[]') : (t.readUsers || []);
                } catch (e) { rList = []; }
                return !rList.some(r => r.user === uUser);
            }).length;
        }, [trainings, currentUser, userRole]);

        const [confirmModal, setConfirmModal] = React.useState({ visible: false, title: '', message: '', onConfirm: null });
        const [alertModal, setAlertModal] = React.useState({ visible: false, title: '', message: '' });
        const [inputModal, setInputModal] = React.useState({ visible: false, title: '', placeholder: '', onConfirm: null });
        const [freightModal, setFreightModal] = React.useState(false);
        const [tankPriceModal, setTankPriceModal] = React.useState(false);
        const [layoutCalcModal, setLayoutCalcModal] = React.useState(false);
        const [priceListModal, setPriceListModal] = React.useState(false);
        const [staffReimbModal, setStaffReimbModal] = React.useState(false);
        const [adminApproveModalData, setAdminApproveModalData] = React.useState(null);

        const triggerToast = React.useCallback((msg, icon = "fa-bell", color = "primary") => {
            const id = Date.now(); setToasts(prev => [...prev, { id, msg, icon, color }]);
            setTimeout(() => { setToasts(prev => prev.filter(t => t.id !== id)); }, 3500);
        }, []);

        const closeModals = () => {
            setConfirmModal({ visible: false, title: '', message: '', onConfirm: null });
            setAlertModal({ visible: false, title: '', message: '' });
            setInputModal({ visible: false, title: '', placeholder: '', onConfirm: null });
            setShowDocumentUpload(false);
            setFreightModal(false);
            setTankPriceModal(false);
            setLayoutCalcModal(false);
            setPriceListModal(false);
            setStaffReimbModal(false);
            setAdminApproveModalData(null);
        };

        const lastSyncTimeRef = React.useRef(0);
        const syncCounterRef = React.useRef(0);
        const pendingSyncsRef = React.useRef(0);

        const updateStateWithData = React.useCallback((d) => {
            if (d.orders && Array.isArray(d.orders)) {
                setOrders(prevOrders => {
                    const prevMap = {};
                    (prevOrders || []).forEach(o => { if (o && o.id) prevMap[o.id] = o; });
                    return d.orders.map(o => {
                        if (!o) return o;
                        const prev = prevMap[o.id];
                        let acc = o.accessories;
                        const isIncomingEmpty = !acc || acc === '[]' || acc === '' || (Array.isArray(acc) && acc.length === 0);
                        if (isIncomingEmpty && prev && prev.accessories) {
                            const isPrevEmpty = !prev.accessories || prev.accessories === '[]' || prev.accessories === '' || (Array.isArray(prev.accessories) && prev.accessories.length === 0);
                            if (!isPrevEmpty) {
                                acc = prev.accessories;
                            }
                        }
                        return { ...o, accessories: acc };
                    });
                });
            }
            if (d.prodItems) setProdItems(d.prodItems);
            if (d.packings) setPackings(d.packings);
            if (d.attendance) setAttendance(d.attendance);
            if (d.ctvFinance) setCtvFinance(d.ctvFinance);
            if (d.configGiaLayout) setConfigGiaLayout(d.configGiaLayout);

            setErpData(prev => ({
                ...prev,
                Products: d.Products || prev.Products || [],
                Accounts: d.Accounts || prev.Accounts || [],
                Suppliers: d.Suppliers || prev.Suppliers || [],
                Transactions: d.Transactions || prev.Transactions || [],
                ImportExport: d.ImportExport || prev.ImportExport || [],
                ProfitReports: d.ProfitReports || prev.ProfitReports || [],
                BonusPenalty: d.BonusPenalty || prev.BonusPenalty || [],
                KPI_Progress: d.KPI_Progress || prev.KPI_Progress || [],
                BOM_Config: d.BOM_Config || prev.BOM_Config || [],
                kpis: d.kpis || prev.kpis || []
            }));

            if (d.kpiConfig) { setKpiConfig(d.kpiConfig); window.kpiConfig = d.kpiConfig; }
            if (d.documents) setDocuments(d.documents);
            if (d.trainings) setTrainings(d.trainings);
            if (d.models3D) setModels3D(d.models3D);
            if (d.reimbursements) setReimbursements(d.reimbursements);

            try {
                localStorage.setItem('rf_app_instant_cache', JSON.stringify({
                    orders: d.orders || [],
                    prodItems: d.prodItems || [],
                    packings: d.packings || [],
                    attendance: d.attendance || [],
                    ctvFinance: d.ctvFinance || [],
                    configGiaLayout: d.configGiaLayout || [],
                    Products: d.Products || [],
                    Accounts: d.Accounts || [],
                    Suppliers: d.Suppliers || [],
                    Transactions: d.Transactions || [],
                    ImportExport: d.ImportExport || [],
                    ProfitReports: d.ProfitReports || [],
                    BOM_Config: d.BOM_Config || [],
                    kpiConfig: d.kpiConfig || [],
                    documents: d.documents || [],
                    models3D: d.models3D || [],
                    reimbursements: d.reimbursements || []
                }));
            } catch (e) { }
        }, []);

        const loadData = async (isInitial = false) => {
            if (!isInitial && pendingSyncsRef.current > 0) {
                // Skip polling if there's an ongoing pushDeltas to prevent overwriting optimistic UI with stale data
                return;
            }
            try {
                if (isInitial) {
                    const [d, cfg] = await Promise.all([runGAS('getAppData'), runGAS('getUserConfig')]);
                    if (d && !d.error) {
                        updateStateWithData(d);
                        if (d.serverTime) lastSyncTimeRef.current = d.serverTime;
                    } else if (d && d.error) {
                        if (d.error !== "AUTH_FAILED" && !d.isAuthFailed) {
                            alert("Lỗi tải dữ liệu: " + d.error);
                            triggerToast("Lỗi tải dữ liệu: " + d.error, "fa-times", "danger");
                        }
                    }
                    if (cfg) setUserConfigs(cfg);
                } else {
                    const delta = await runGAS('getAppData');
                    if (pendingSyncsRef.current > 0) return;
                    if (delta && !delta.error) {
                        updateStateWithData(delta);
                        if (delta.serverTime) {
                            lastSyncTimeRef.current = delta.serverTime;
                        }
                    }
                }
            } catch (e) {
                console.error("Lỗi đồng bộ nhịp đập:", e);
            } finally {
                if (isInitial) setLoading(false);
            }
        };

        const loadArchiveData = async () => {
            if (isArchiveLoaded || isLoadingArchive) return;
            setIsLoadingArchive(true);
            triggerToast("Đang tải dữ liệu lịch sử...", "fa-spinner fa-spin", "info");
            try {
                const d = await runGAS('getArchivedData');
                if (d && !d.error) {
                    setOrders(prev => {
                        const newArr = [...prev];
                        (d.orders || []).forEach(o => { if (!newArr.find(x => x.id === o.id)) newArr.push(o); });
                        return newArr;
                    });
                    setProdItems(prev => {
                        const newArr = [...prev];
                        (d.prodItems || []).forEach(p => { if (!newArr.find(x => x.id === p.id)) newArr.push(p); });
                        return newArr;
                    });
                    setPackings(prev => {
                        const newArr = [...prev];
                        (d.packings || []).forEach(p => { if (!newArr.find(x => x.id === p.id)) newArr.push(p); });
                        return newArr;
                    });
                    setIsArchiveLoaded(true);
                    triggerToast("Tải lịch sử thành công!", "fa-check", "success");
                } else {
                    triggerToast("Lỗi tải lịch sử: " + (d.error || ''), "fa-times", "danger");
                }
            } catch (e) {
                triggerToast("Lỗi tải lịch sử", "fa-times", "danger");
                console.error(e);
            } finally {
                setIsLoadingArchive(false);
            }
        };

        React.useEffect(() => {
            if (!currentUser) {
                setLoading(false);
                return;
            }
            setLoading(true);
            loadData(true);

            // Đăng ký Web Push Notification chạy ngầm khi đã đăng nhập
            if (window.registerWebPushNotifications) {
                window.registerWebPushNotifications(currentUser);
            }

            // Bật tính năng Real-time Sync với Firebase
            if (window.firebase) {
                let isSyncing = false;
                const dbRef = window.firebase.database().ref('rf_last_action');
                dbRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.timestamp) {
                        if (data.client_id !== clientId && data.timestamp > lastSyncTimeRef.current) {
                            lastSyncTimeRef.current = data.timestamp;
                            console.log("⚡ [Firebase] Đã phát hiện thay đổi từ:", data.trigger_by, "-> Kéo dữ liệu về ngay!");
                            if (!isSyncing) {
                                isSyncing = true;
                                Promise.resolve(loadData(false)).finally(() => { isSyncing = false; });
                            }
                        }
                    }
                });

                // Safety Net: Quét dự phòng 60 giây (Thay vì 15 giây) để tiết kiệm quota
                const interval = setInterval(() => { loadData(false); }, 60000);

                return () => {
                    dbRef.off();
                    clearInterval(interval);
                };
            } else {
                // Fallback nếu Firebase lỗi
                const interval = setInterval(() => { loadData(false); }, 15000);
                return () => clearInterval(interval);
            }
        }, [currentUser]);

        React.useEffect(() => {
            const h = async (e) => {
                triggerToast('Đang làm mới dữ liệu hệ thống...', 'fa-sync fa-spin', 'info');
                await loadData(true);
                triggerToast('Dữ liệu đã được cập nhật!', 'fa-check', 'success');
                if (e.detail && e.detail.setIsSpinning) e.detail.setIsSpinning(false);
            };
            window.addEventListener('triggerReloadData', h);
            return () => window.removeEventListener('triggerReloadData', h);
        }, []);

        React.useEffect(() => { const h = () => setShowBulkImport(true); window.addEventListener('openBulkImport', h); return () => window.removeEventListener('openBulkImport', h); }, []);
        React.useEffect(() => { const h = () => setShowScanLabel(true); window.addEventListener('openScanLabel', h); return () => window.removeEventListener('openScanLabel', h); }, []);
        React.useEffect(() => { const h = () => setShowDocumentUpload(true); window.addEventListener('openDocumentUpload', h); return () => window.removeEventListener('openDocumentUpload', h); }, []);
        React.useEffect(() => { const h = (e) => setStockHistoryItem(e.detail); window.addEventListener('openStockHistory', h); return () => window.removeEventListener('openStockHistory', h); }, []);
        React.useEffect(() => {
            const h = (e) => {
                setMode('ERP');
                setActiveTab('import_export');
                setTimeout(() => {
                    const event = new CustomEvent('triggerCreateImportTicket', { detail: e.detail });
                    window.dispatchEvent(event);
                }, 200);
            };
            window.addEventListener('openImportExportForm', h);
            return () => window.removeEventListener('openImportExportForm', h);
        }, []);

        React.useEffect(() => {
            const h = (e) => {
                const { tab, trigger, data, mode } = e.detail;
                if (mode) setMode(mode);
                setActiveTab(tab);
                let attempts = 0;
                const interval = setInterval(() => {
                    if (attempts > 10) { clearInterval(interval); return; }
                    window.dispatchEvent(new CustomEvent(trigger, { detail: data }));
                    attempts++;
                }, 100);
            };
            window.addEventListener('globalNavigateAndTrigger', h);
            const openFm = () => setFreightModal(true);
            window.addEventListener('openFreightModal', openFm);
            const openTm = () => setTankPriceModal(true);
            window.addEventListener('openTankPriceModal', openTm);
            const openLm = () => setLayoutCalcModal(true);
            window.addEventListener('openLayoutCalcModal', openLm);
            const openPlm = () => setPriceListModal(true);
            window.addEventListener('openPriceListModal', openPlm);
            const openSrm = () => setStaffReimbModal(true);
            window.addEventListener('openStaffReimbursementModal', openSrm);
            const openAam = (e) => setAdminApproveModalData(e.detail);
            window.addEventListener('openAdminApprovalModal', openAam);
            return () => {
                window.removeEventListener('globalNavigateAndTrigger', h);
                window.removeEventListener('openFreightModal', openFm);
                window.removeEventListener('openTankPriceModal', openTm);
                window.removeEventListener('openLayoutCalcModal', openLm);
                window.removeEventListener('openPriceListModal', openPlm);
                window.removeEventListener('openStaffReimbursementModal', openSrm);
                window.removeEventListener('openAdminApprovalModal', openAam);
            };
        }, []);

        // ĐỘNG CƠ "OPTIMISTIC UI": XỬ LÝ SIÊU TỐC - ĐÓNG FORM NGAY - LƯU NGẦM KHÔNG CHỜ ĐỢI
        const pushDeltas = React.useCallback(async (payload, successMsg, successIcon) => {
            pendingSyncsRef.current += 1;
            syncCounterRef.current += 1;
            const currentSyncId = syncCounterRef.current;

            const currentRole = localStorage.getItem('rf_role') || '';
            if (currentRole === 'KHÁCH') {
                triggerToast("Tài khoản KHÁCH (Demo) chỉ có quyền xem, không thể thay đổi dữ liệu!", "fa-exclamation-triangle", "warning");
                return Promise.resolve();
            }
            if (successMsg) triggerToast(successMsg, successIcon || 'fa-check', 'success');

            const optimisticMerge = (currentArray, newItems, deleteIds) => {
                let result = [...(currentArray || [])];
                if (deleteIds && deleteIds.length > 0) {
                    result = result.filter(x => !deleteIds.some(dId => String(dId) === String(x.id)));
                }
                if (newItems && newItems.length > 0) {
                    newItems.forEach(item => {
                        const idx = result.findIndex(x => String(x.id) === String(item.id));
                        if (idx >= 0) {
                            const existing = result[idx];
                            let mergedAcc = item.accessories;
                            const isIncomingEmpty = mergedAcc === undefined || mergedAcc === null || mergedAcc === '' || mergedAcc === '[]' || (Array.isArray(mergedAcc) && mergedAcc.length === 0);
                            if (isIncomingEmpty && existing && existing.accessories) {
                                const isExistingEmpty = !existing.accessories || existing.accessories === '[]' || existing.accessories === '' || (Array.isArray(existing.accessories) && existing.accessories.length === 0);
                                if (!isExistingEmpty) {
                                    mergedAcc = existing.accessories;
                                }
                            }
                            result[idx] = { ...existing, ...item, accessories: mergedAcc };
                        } else {
                            result.unshift(item);
                        }
                    });
                }
                return result;
            };

            // --- ĐỒNG BỘ TRẠNG THÁI ĐƠN HÀNG CHUẨN ---
            if (payload.orders && Array.isArray(payload.orders)) {
                payload.orders = payload.orders.map(order => {
                    if (order.status) {
                        const s = String(order.status).trim().toLowerCase();
                        let cleanStatus = s;
                        if (s.includes('hủy') || s.includes('huỷ') || s === 'cancelled') cleanStatus = 'Đơn Huỷ';
                        else if (s.includes('đang sản xuất')) cleanStatus = 'Đang Sản Xuất';
                        else if (s === 'đã bàn giao' || s === 'delivered') cleanStatus = 'Đã Bàn Giao';
                        else if (s === 'đối soát thành công' || s === 'completed') cleanStatus = 'Đối Soát Thành Công';
                        else if (s.includes('sẵn sàng đóng gói')) cleanStatus = 'Sẵn Sàng Đóng Gói';
                        else if (s === 'hàng hoàn' || s === 'returned') cleanStatus = 'Hàng Hoàn';
                        else if (s === 'chờ sản xuất') cleanStatus = 'Chờ Sản Xuất';
                        else if (s === 'đã nhập kho') cleanStatus = 'Đã Nhập Kho';
                        else cleanStatus = s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

                        order.status = cleanStatus;
                    }
                    return order;
                });
            }

            const deletes = payload.deletes || {};

            setOrders(prev => optimisticMerge(prev, payload.orders, deletes.Orders || deletes.orders));
            setProdItems(prev => optimisticMerge(prev, payload.prodItems, deletes.Production || deletes.prodItems));
            setPackings(prev => optimisticMerge(prev, payload.packings, deletes.Packings || deletes.packings));
            setAttendance(prev => optimisticMerge(prev, payload.attendance, deletes.Attendance || deletes.attendance));
            if (payload.ctvTransactions) setCtvFinance(prev => optimisticMerge(prev, payload.ctvTransactions, []));
            setDocuments(prev => optimisticMerge(prev, payload.documents, deletes.Documents || deletes.documents));
            setTrainings(prev => optimisticMerge(prev, payload.trainings, deletes.Trainings || deletes.trainings));
            setReimbursements(prev => optimisticMerge(prev, payload.Reimbursements, deletes.Reimbursements || deletes.reimbursements));

            if (payload.UserConfigs && payload.UserConfigs.length > 0) {
                setUserConfigs(payload.UserConfigs[0]);
            }

            setErpData(prev => ({
                ...prev,
                Products: optimisticMerge(prev.Products, payload.Products, deletes.Products),
                Accounts: optimisticMerge(prev.Accounts, payload.Accounts, deletes.Accounts),
                Suppliers: optimisticMerge(prev.Suppliers, payload.Suppliers, deletes.Suppliers),
                Transactions: optimisticMerge(prev.Transactions, payload.Transactions, deletes.Transactions),
                ImportExport: optimisticMerge(prev.ImportExport, payload.ImportExport, deletes.ImportExport),
                ProfitReports: optimisticMerge(prev.ProfitReports, payload.ProfitReports, deletes.ProfitReports),
                BonusPenalty: optimisticMerge(prev.BonusPenalty, payload.BonusPenalty, deletes.BonusPenalty),
                KPI_Progress: optimisticMerge(prev.KPI_Progress, payload.KPI_Progress, deletes.KPI_Progress),
                BOM_Config: optimisticMerge(prev.BOM_Config, payload.BOM_Config, deletes.BOM_Config),
                Orders: optimisticMerge(prev.Orders, payload.orders, deletes.Orders || deletes.orders),
                Packings: optimisticMerge(prev.Packings, payload.packings, deletes.Packings || deletes.packings),
                Production: optimisticMerge(prev.Production, payload.prodItems, deletes.Production || deletes.prodItems),
                Attendance: optimisticMerge(prev.Attendance, payload.attendance, deletes.Attendance || deletes.attendance),

                try {
                    const payloadWithUser = { ...payload, user: currentUser };
                    const d = await runGAS('syncDeltas', payloadWithUser);
                    if (currentSyncId === syncCounterRef.current) {
                        if (d && !d.error) {
                            if (d.serverTime) lastSyncTimeRef.current = d.serverTime;
                            updateStateWithData(d);

                            // [FIREBASE] Phát tín hiệu Real-time cho toàn bộ các máy khác cập nhật ngay!
                            if (window.firebase) {
                                try {
                                    window.firebase.database().ref('rf_last_action').set({
                                        timestamp: d.serverTime || Date.now(),
                                        trigger_by: currentUser,
                                        client_id: clientId,
                                        action_time: new Date().toISOString()
                                    });
                                } catch (fbErr) {
                                    console.warn("Lỗi Firebase Broadcast:", fbErr);
                                }
                            }
                        } else {
                            triggerToast(d?.error || "Cảnh báo: Không thể lưu ngầm lên Server!", "fa-exclamation-triangle", "danger");
                        }
                    }
                } catch (e) {
                    console.error("Lỗi syncToServer:", e);
                    triggerToast("Lỗi đồng bộ Server: " + (e?.message || e?.toString() || "Mạng không ổn định"), "fa-exclamation-triangle", 'warning');
                } finally {
                    pendingSyncsRef.current -= 1;
                    if (currentSyncId === syncCounterRef.current) {
                        setSyncing(false);
                    }
                }
            };

            syncToServer();
            return Promise.resolve();

                            <div className="text-[10px] font-medium uppercase tracking-wider text-zinc-400 mt-0.5">
                                {isAdmin ? (isBoss ? 'TỐI CAO' : getDisplayRole(userRole)) : 'Nhân sự'}
                            </div>
                        </div>

                        <button onClick={() => {
                            if (window.confirm('Bạn muốn đăng xuất?')) {
                                localStorage.removeItem('rf_user');
                                localStorage.removeItem('rf_admin');
                                localStorage.removeItem('rf_boss');
                                localStorage.removeItem('rf_role');
                                setIsMenuOpen(false);
                                setIsAdmin(false);
                                setIsBoss(false);
                                setUserRole('');
                                setCurrentUser('');
                            }
                        }} className="w-8 h-8 rounded-md flex items-center justify-center transition-all text-zinc-400 hover:text-rose-400 hover:bg-rose-500/10">
                            {typeof LucideIcon !== 'undefined' ? <LucideIcon name="log-out" size={16} /> : <i className="fas fa-sign-out-alt"></i>}
                        </button>
                    </div>
                </aside>

                <div className="flex-1 flex flex-col min-w-0 h-screen overflow-hidden relative">
                    <header className="px-5 py-3 lg:py-4 sticky top-0 z-50 flex justify-between items-center w-full mx-auto transition-all duration-300 bg-[#09090b]/90 backdrop-blur-xl border-b border-white/[0.08] shadow-sm">
                        <div className="flex items-center gap-3 lg:gap-4">
                            <button onClick={() => setIsMenuOpen(true)} className="lg:hidden w-9 h-9 rounded-md flex items-center justify-center transition-all text-zinc-400 hover:text-zinc-100 hover:bg-white/5">{typeof LucideIcon !== 'undefined' ? <LucideIcon name="menu" size={20} /> : <i className="fas fa-bars text-lg"></i>}</button>

                            <div className="flex flex-col justify-center cursor-pointer" onClick={() => {
                                if (!isAdmin) {
                                    const p = prompt('Nhập Mã Quản Lý để mở khóa hệ thống:');
                                    if (!p) return;

                                    const userConfig = userConfigs?.pins ? userConfigs.pins[p] : null;
                                    if (userConfig) {
                                        const roleName = userConfig.role;
                                        const isB = roleName === 'TỐI CAO';
                                        const isManager = ['TỐI CAO', 'QUẢN LÝ CẤP TRUNG', 'QUẢN LÝ SẢN XUẤT', 'SẢN XUẤT', 'QUẢN LÝ KHO VẬN', 'KHO VẬN', 'BÁN HÀNG', 'QUẢN LÝ BÁN HÀNG', 'QUẢN LÝ NHÂN SỰ', 'NHÂN SỰ', 'KẾ TOÁN', 'QUẢN LÝ KIỂM TOÁN', 'KIỂM TOÁN', 'KHÁCH', 'CỘNG TÁC VIÊN', 'CTV'].includes(roleName);
                                        if (isManager) {
                                            setIsAdmin(true);
                                            setIsBoss(isB); setUserRole(roleName);
                                            safeSet('rf_admin', 'true'); safeSet('rf_boss', isB ? 'true' : 'false'); safeSet('rf_role', roleName);
                                            triggerToast(`Đã mở khóa quyền: ${roleName} (${userConfig.name})`, 'fa-user-shield', 'success');
                                        } else {
                                            alert(`Mã này là của ${userConfig.name} (Quyền: ${roleName}), không có chức năng Quản Lý!`);
                                        }
                                    } else {
                                        alert('Mã PIN không tồn tại trong hệ thống!');
                                    }
                                } else {
                                    if (window.confirm(`Khóa phiên làm việc của Quản Lý ${userRole}?`)) {
                                        setIsAdmin(false);
                                        setIsBoss(false); setUserRole('');
                                        setMode('WORKSPACE'); setActiveTab('dashboard');
                                        safeSet('rf_admin', 'false'); safeSet('rf_boss', 'false'); safeSet('rf_role', '');
                                        triggerToast('Đã khóa lại hệ thống', 'fa-user-lock', 'primary');
                                    }
                                }
                            }}>
                                <span className="text-[10px] font-semibold uppercase tracking-widest mb-0.5 text-zinc-400">{mode === 'ERP' ? 'Kế Toán & Kho Vận' : 'Hệ Thống Nội Bộ'}</span>
                                <span className="font-display font-semibold text-[16px] leading-none flex items-center text-zinc-100">
                                    {isAdmin ? (isBoss ? 'Workspace Pro' : getDisplayRole(userRole)) : 'Workspace'}
                                    {isAdmin && <i className={`fas fa-shield-check ml-2 text-[12px] ${isBoss ? 'text-[#d4af37]' : 'text-emerald-400'}`}></i>}
                                </span>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            {/* TIỀN XU (XU) */}
                            {currentUser && (() => {
                                const totalXu = (erpData?.KPI_Progress || []).filter(k => k.user === currentUser && String(k.unit).toLowerCase() === 'xu').reduce((sum, k) => sum + Number(k.reward || 0), 0) +
                                    (erpData?.BonusPenalty || []).filter(b => b.user === currentUser && b.type === 'XU_REWARD').reduce((sum, b) => sum + Number(b.amount || 0), 0);

                                if (totalXu > 0) {
                                    return (
                                        <div className="animate-fade-in flex items-center gap-1.5 bg-[#d4af37]/10 px-2.5 py-1 rounded-md border border-[#d4af37]/20 shadow-sm cursor-default" title="Điểm Thưởng Tích Lũy">
                                            <i className="fas fa-coins text-[#d4af37] text-[12px]"></i>
                                            <span className="text-[12px] font-bold text-[#d4af37] font-mono leading-none">{Math.ceil(Number(totalXu)).toLocaleString('vi-VN')}</span>
                                        </div>
                                    );
                                }
                                return null;
                            })()}

                            {isAdmin && (
                                <div className="hidden sm:block animate-fade-in">
                                    <div className="text-[10px] font-bold text-[#d4af37] uppercase tracking-wider bg-[#d4af37]/10 px-2.5 py-1 rounded-md border border-[#d4af37]/20 shadow-sm">
                                        {isBoss ? 'TỐI CAO' : getDisplayRole(userRole)}
                                    </div>
                                </div>
                            )}
                            <div
                                className="relative cursor-pointer group ml-1"
                                onClick={() => {
                                    if (typeof window !== 'undefined') {
                                        const setIsSpinning = (val) => { }; // dummy or actual if needed
                                        window.dispatchEvent(new CustomEvent('triggerReloadData', { detail: { setIsSpinning } }));
                                    }
                                }}
                                title="Nhấn để làm mới dữ liệu"
                            >
                                {syncing ? <i className="fas fa-sync animate-spin text-[16px] text-[#d4af37] w-9 h-9 flex items-center justify-center"></i> : (typeof Avatar !== 'undefined' ? <Avatar name={currentUser} userConfigs={userConfigs} className="w-9 h-9 border border-white/10 rounded-full transition-transform group-hover:scale-105 shadow-sm" /> : <div className="w-9 h-9 rounded-full bg-zinc-800"></div>)}
                                {!syncing && (
                                    <div className="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 rounded-full flex items-center justify-center border-2 border-[#09090b] shadow-sm group-hover:rotate-180 transition-all duration-300">
                                        <i className="fas fa-sync-alt text-[7px] text-[#09090b]"></i>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className={`flex-1 w-full p-4 lg:p-6 pb-24 md:pb-8 overflow-y-auto custom-scrollbar relative z-10 ${userRole === 'KHÁCH' ? 'rf-guest-mode' : ''}`}>
                        <ErrorBoundary>
                            {(() => {
                                const isCTV = userRole === 'CTV';
                                const renderCTVLocked = () => (
                                    <div className="flex flex-col items-center justify-center h-full text-gray-500 py-32 animate-fade-in">
                                        <i className="fas fa-lock text-6xl mb-6 opacity-30"></i>
                                        <h2 className="text-2xl font-black uppercase tracking-widest text-center text-gray-400">******</h2>
                                        <p className="text-sm font-bold mt-2 text-center uppercase text-gray-600">Vùng Dữ Liệu Bảo Mật</p>
                                    </div>
                                );

                                if (mode === 'WORKSPACE') {
                                    return (
                                        <div key={`workspace_${activeTab}`} className="w-full h-full rf-tab-view rf-gpu-accelerated">
                                            {activeTab === 'dashboard' && typeof DashboardTab !== 'undefined' && <DashboardTab reimbursements={reimbursements || []} attendance={attendance || []} records={attendance || []} prodItems={prodItems || []} currentUser={currentUser} packings={packings || []} users={userConfigs?.users || []} orders={orders || []} kpiConfig={typeof kpiConfig !== 'undefined' ? kpiConfig : []} erpData={erpData || {}} kpis={erpData?.BonusPenalty || []} importExport={erpData?.ImportExport || []} userConfigs={userConfigs} erpProducts={erpData?.Products || []} pushDeltas={pushDeltas} triggerToast={triggerToast} isAdmin={isAdmin} isBoss={isBoss} />}
                                            {activeTab === 'orders' && typeof OrdersTab !== 'undefined' && <OrdersTab loadArchiveData={loadArchiveData} isArchiveLoaded={isArchiveLoaded} isLoadingArchive={isLoadingArchive} attendance={attendance || []} orders={orders || []} prodItems={prodItems || []} packings={packings || []} erpProducts={erpData?.Products || []} erpData={erpData || {}} isAdmin={isAdmin} currentUser={currentUser} pushDeltas={pushDeltas} userConfigs={userConfigs} triggerToast={triggerToast} kpiConfig={typeof kpiConfig !== 'undefined' ? kpiConfig : []} configGiaLayout={configGiaLayout || []} />}
                                            {activeTab === 'production' && typeof ProductionTab !== 'undefined' && <ProductionTab attendance={attendance || []} orders={orders || []} prodItems={prodItems || []} erpProducts={erpData?.Products || []} erpData={erpData || {}} currentUser={currentUser} pushDeltas={pushDeltas} userConfigs={userConfigs} triggerToast={triggerToast} kpiConfig={typeof kpiConfig !== 'undefined' ? kpiConfig : []} models3D={models3D || []} />}
                                            {activeTab === 'ERRORS' && typeof TabErrors !== 'undefined' && <TabErrors activeTab={activeTab} runGAS={runGAS} triggerToast={triggerToast} currentUser={currentUser} prodItems={prodItems || []} erpProducts={erpData?.Products || []} erpData={erpData || {}} orders={orders || []} pushDeltas={pushDeltas} isAdmin={isAdmin} />}
                                            {activeTab === 'hr' && typeof HRTab !== 'undefined' && (isCTV ? renderCTVLocked() : <HRTab documents={documents} hasPerm={hasPerm} attendance={attendance || []} erpData={erpData || {}} userConfigs={userConfigs} prodItems={prodItems || []} packings={packings || []} pushDeltas={pushDeltas} triggerToast={triggerToast} />)}
                                            {activeTab === 'documents' && typeof DocumentsTab !== 'undefined' && (isCTV ? renderCTVLocked() : <DocumentsTab documents={documents} isAdmin={isAdmin} pushDeltas={pushDeltas} triggerToast={triggerToast} />)}
                                            {activeTab === 'viewer3d' && typeof Viewer3DTab !== 'undefined' && <Viewer3DTab models3D={models3D} pushDeltas={pushDeltas} erpProducts={erpData?.Products || []} />}
                                            {activeTab === 'affiliate' && typeof TabAffiliate !== 'undefined' && <TabAffiliate orders={orders || []} ctvFinance={ctvFinance || []} configGiaLayout={configGiaLayout || []} pushDeltas={pushDeltas} currentUser={currentUser} triggerToast={triggerToast} userRole={userRole} userConfigs={userConfigs} erpData={erpData || {}} prodItems={prodItems || []} />}
                                        </div>
                                    );
                                } else {
                                    return (
                                        <div key={`erp_${activeTab}`} className="w-full h-full rf-tab-view rf-gpu-accelerated">
                                            {activeTab === 'warehouse' && typeof InventoryTab !== 'undefined' && <InventoryTab data={{ ...(erpData || {}), Orders: orders || [] }} userConfigs={userConfigs} pushData={pushErpData} isAdmin={isAdmin} triggerToast={triggerToast} />}
                                            {activeTab === 'import_export' && typeof ImportExportTab !== 'undefined' && (isCTV ? renderCTVLocked() : <ImportExportTab data={erpData} userConfigs={userConfigs} pushData={pushErpData} isAdmin={isAdmin} triggerToast={triggerToast} />)}
                                            {activeTab === 'cashflow' && typeof FinanceTab !== 'undefined' && (isCTV ? renderCTVLocked() : <FinanceTab orders={orders || []} erpData={erpData || {}} pushDeltas={pushDeltas} triggerToast={triggerToast} isAdmin={isAdmin} categories={{ THU: typeof FINANCE_CATEGORIES !== 'undefined' ? FINANCE_CATEGORIES.filter(c => c.type === 'Thu' && c.module === 'FINANCE').map(c => ({ label: c.name, value: c.name })) : (typeof CAT_THU !== 'undefined' ? CAT_THU.map(c => ({ label: c, value: c })) : []), CHI: typeof FINANCE_CATEGORIES !== 'undefined' ? FINANCE_CATEGORIES.filter(c => c.type === 'Chi' && c.module === 'FINANCE').map(c => ({ label: c.name, value: c.name })) : (typeof CAT_CHI !== 'undefined' ? CAT_CHI.map(c => ({ label: c, value: c })) : []) }} />)}
                                            {activeTab === 'analytics' && typeof AnalyticsTab !== 'undefined' && (isCTV ? renderCTVLocked() : <AnalyticsTab data={{ ...(erpData || {}), Orders: orders || [] }} pushData={pushErpData} isAdmin={isAdmin} mode={mode} userConfigs={userConfigs} />)}
                                            {activeTab === 'business_report' && typeof BusinessReportTab !== 'undefined' && (isCTV ? renderCTVLocked() : <BusinessReportTab erpData={erpData || {}} pushDeltas={pushDeltas} triggerToast={triggerToast} />)}
                                            {activeTab === 'suppliers' && typeof SuppliersTab !== 'undefined' && (isCTV ? renderCTVLocked() : <SuppliersTab data={erpData || {}} pushData={pushErpData} isAdmin={isAdmin} triggerToast={triggerToast} />)}
                                        </div>
                                    );
                                }
                            })()}
                        </ErrorBoundary>
                    </main>

                    {/* NÚT TẢI LẠI TRANG */}
                    {typeof ReloadAppButton !== 'undefined' && <ReloadAppButton />}

                    {/* CÁC MODAL TOÀN CỤC CHẠY NGẦM */}
                    {showBulkImport && typeof BulkImportModal !== 'undefined' && <BulkImportModal onClose={() => setShowBulkImport(false)} pushDeltas={pushDeltas} existingOrders={orders} products={erpData.Products} existingProdItems={prodItems} />}
                    {showScanLabel && typeof ScanLabelModal !== 'undefined' && <ScanLabelModal onClose={() => setShowScanLabel(false)} pushDeltas={pushDeltas} existingOrders={orders} products={erpData.Products} triggerToast={triggerToast} />}
                    {showDocumentUpload && typeof DocumentUploadModal !== 'undefined' && <DocumentUploadModal onClose={() => setShowDocumentUpload(false)} pushDeltas={pushDeltas} triggerToast={triggerToast} />}
                    {stockHistoryItem && typeof StockHistoryModal !== 'undefined' && <StockHistoryModal product={stockHistoryItem} onClose={() => setStockHistoryItem(null)} importExport={erpData?.ImportExport} />}

                    <>
                        {typeof ConfirmModal !== 'undefined' && <ConfirmModal visible={confirmModal.visible} title={confirmModal.title} message={confirmModal.message} onConfirm={() => { if (confirmModal.onConfirm) confirmModal.onConfirm(); closeModals(); }} onCancel={closeModals} />}
                        {typeof AlertModal !== 'undefined' && <AlertModal visible={alertModal.visible} title={alertModal.title} message={alertModal.message} onClose={closeModals} />}
                        {typeof InputModal !== 'undefined' && <InputModal visible={inputModal.visible} title={inputModal.title} placeholder={inputModal.placeholder} onConfirm={(value) => { if (inputModal.onConfirm) inputModal.onConfirm(value); closeModals(); }} onCancel={closeModals} />}
                        {typeof FreightCalculatorModal !== 'undefined' && <FreightCalculatorModal visible={freightModal} onClose={closeModals} />}
                        {typeof TankPriceModal !== 'undefined' && <TankPriceModal visible={tankPriceModal} onClose={closeModals} />}
                        {typeof LayoutCalculatorModal !== 'undefined' && <LayoutCalculatorModal visible={layoutCalcModal} onClose={closeModals} configGiaLayout={configGiaLayout || []} />}
                        {typeof PriceListModal !== 'undefined' && <PriceListModal visible={priceListModal} onClose={closeModals} triggerToast={triggerToast} erpProducts={erpData?.Products || []} />}
                        {typeof StaffReimbursementModal !== 'undefined' && <StaffReimbursementModal visible={staffReimbModal} onClose={closeModals} pushDeltas={pushDeltas} currentUser={currentUser} triggerToast={triggerToast} />}
                        {typeof AdminApprovalModal !== 'undefined' && <AdminApprovalModal data={adminApproveModalData} onClose={closeModals} pushDeltas={pushDeltas} triggerToast={triggerToast} />}
                    </>

                    {/* MOBILE BOTTOM NAVIGATION (Chỉ hiển thị trên Mobile) */}
                    <div className={`md:hidden fixed bottom-0 left-0 w-full z-[150] border-t backdrop-blur-xl pb-[env(safe-area-inset-bottom)] ${isDarkMode ? 'bg-[#000000]/80 border-white/10' : 'bg-white/90 border-gray-200 shadow-[0_-4px_15px_rgba(0,0,0,0.05)]'}`}>
                        <div className="flex justify-around items-center h-[60px]">
                            {[
                                { id: 'dashboard', icon: 'fa-home', label: 'Tổng Quan', mode: 'WORKSPACE' },
                                { id: 'orders', icon: 'fa-shopping-cart', label: 'Đơn Hàng', mode: 'WORKSPACE' },
                                { id: 'production', icon: 'fa-hammer', label: 'Sản Xuất', mode: 'WORKSPACE' }
                            ].map(item => {
                                const isActive = activeTab === item.id;
                                return (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setMode(item.mode); setIsMenuOpen(false); }} className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition-all ${isActive ? (isDarkMode ? 'text-[#d4af37]' : 'text-yellow-600') : (isDarkMode ? 'text-zinc-500 hover:text-zinc-300' : 'text-gray-400 hover:text-gray-600')}`}>
                                        <div className={`text-[18px] transition-transform ${isActive ? 'scale-110 -translate-y-0.5' : ''}`}><i className={`fas ${item.icon}`}></i></div>
                                        <span className="text-[9px] font-black">{item.label}</span>
                                    </button>
                                );
                            })}
                            <button onClick={() => setIsMenuOpen(true)} className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition-all ${isDarkMode ? 'text-zinc-500 hover:text-zinc-300' : 'text-gray-400 hover:text-gray-600'}`}>
                                <div className="text-[18px]"><i className="fas fa-bars"></i></div>
                                <span className="text-[9px] font-black">Menu</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
