<script type="text/babel">
// =========================================================================
// 👥 FILE: Tab_HR.txt
// CHỨC NĂNG: Trung Tâm Nhân Sự (Chấm Công, Giao Việc KPI, Bảng Lương)
// NÂNG CẤP: Lọc thời gian theo Tháng (Tùy chỉnh) & Phân quyền RBAC CHUẨN CHỈ
// =========================================================================

function HRTab({ hasPerm, attendance, erpData, userConfigs, prodItems, packings, pushDeltas, triggerToast }) {
  const currentUser = localStorage.getItem('rf_user') || '';
  const currentRole = localStorage.getItem('rf_role') || '';
  const isBoss = localStorage.getItem('rf_boss') === 'true';
  
  // PHÂN QUYỀN CHUẨN CHỈ: Chỉ Quản lý Nhân sự mới được Sửa Công. Các nút Tiền/KPI đều là isBoss.
  const canEditAttendance = hasPerm ? hasPerm('HR_PAYROLL') : (isBoss || currentRole === 'NHÂN SỰ');

  const formatMoney = (val) => Number(val || 0).toLocaleString('vi-VN');
  const cleanNumber = (val) => typeof val === 'number' ? val : Number(String(val || '').replace(/[^0-9]/g, '')) || 0;
  
  const [weeklyGift, setWeeklyGift] = React.useState(() => localStorage.getItem('rf_weekly_gift') || '1 Cốc Trà Sữa');
  const [openSection, setOpenSection] = React.useState({});
  const toggleSection = (user, section, e) => {
      if(e) e.stopPropagation();
      setOpenSection(prev => ({...prev, [`${user}_${section}`]: !prev[`${user}_${section}`]}));
  };
  
  const [expandedKPIs, setExpandedKPIs] = React.useState({});
  const toggleKPIExpand = (user) => setExpandedKPIs(prev => ({...prev, [user]: !prev[user]}));

  const [subTab, setSubTab] = React.useState('ATTENDANCE');
  
  const [filter, setFilter] = React.useState('Tháng Này');
  const [customMonth, setCustomMonth] = React.useState(() => new Date().toISOString().slice(0, 7)); // Format YYYY-MM
  const currentDate = new Date().toISOString().split('T')[0];

  const users = userConfigs?.users || [];
  const rawAttData = attendance || [];
  const bpData = erpData?.BonusPenalty || [];
  const kpiData = erpData?.KPI_Progress || [];
  const safeProdItems = prodItems || [];
  const safePackings = packings || [];
  const orders = erpData?.Orders || []; 

  const [showCoins, setShowCoins] = React.useState(false);
  const [claimingIds, setClaimingIds] = React.useState([]);

  const [editingPayroll, setEditingPayroll] = React.useState(null);

  const extractTimeLocal = (str) => {
      if (!str) return null;
      let s = String(str).trim();
      if (s.includes('T') && s.includes('Z')) { 
          const d = new Date(s); 
          if (!isNaN(d.getTime())) return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      const match = s.match(/([0-1]?[0-9]|2[0-3]):([0-5][0-9])/); 
      return match ? `${match[1].padStart(2, '0')}:${match[2]}` : null;
  };

  const [currentTimeMins, setCurrentTimeMins] = React.useState(() => new Date().getHours() * 60 + new Date().getMinutes());
  React.useEffect(() => {
      const interval = setInterval(() => {
          setCurrentTimeMins(new Date().getHours() * 60 + new Date().getMinutes());
      }, 30000); 
      return () => clearInterval(interval);
  }, []);

  const activeShift = React.useMemo(() => {
      if (currentTimeMins >= 390 && currentTimeMins <= 750) return 'Sáng';      
      if (currentTimeMins >= 825 && currentTimeMins <= 1110) return 'Chiều';    
      if (currentTimeMins >= 1140 || currentTimeMins <= 180) return 'Tối';      
      return null;
  }, [currentTimeMins]);

  const isDateInRange = (dateStr, filterStr = filter, customM = customMonth) => {
      if (!dateStr) return false;
      const d = new Date(dateStr); const today = new Date();
      if (filterStr === 'Hôm Nay') return d.toDateString() === today.toDateString();
      if (filterStr === 'Hôm Qua') { const y = new Date(today); y.setDate(y.getDate() - 1); return d.toDateString() === y.toDateString(); }
      if (filterStr === 'Tháng Này') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
      if (filterStr === 'Tháng Trước') { 
          const m = new Date(today); m.setMonth(m.getMonth() - 1);
          return d.getMonth() === m.getMonth() && d.getFullYear() === m.getFullYear(); 
      }
      if (filterStr === 'Tuỳ Chỉnh') {
          if (!customM) return true;
          const [year, month] = customM.split('-');
          return d.getFullYear() === parseInt(year, 10) && d.getMonth() === (parseInt(month, 10) - 1);
      }
      return false;
  };

  const attData = React.useMemo(() => {
      const uniqueMap = new Map();
      rawAttData.forEach(a => {
          const sft = a.shift || (a.leaveType ? 'Nghỉ' : 'Ca Cũ');
          const key = `${String(a.user).trim()}_${a.date}_${sft}`;
          if (!uniqueMap.has(key) || (a.timeOut && !uniqueMap.get(key).timeOut)) {
              uniqueMap.set(key, a);
          }
      });
      const dedupedRaw = Array.from(uniqueMap.values());

      return dedupedRaw.map(a => {
          let tIn = extractTimeLocal(a.timeIn) || extractTimeLocal(a.morningIn || a.afternoonIn) || '';
          let tOut = extractTimeLocal(a.timeOut) || extractTimeLocal(a.afternoonOut || a.morningOut) || '';
          let penalty = Number(a.penalty || 0);
          let status = a.status;
          let shift = a.shift || (a.leaveType ? 'Nghỉ' : 'Ca Cũ');
          
          const isToday = a.date === currentDate;
          const isPast = a.date < currentDate;

          if (tIn && !tOut && shift !== 'Nghỉ Phép' && !a.isEdited) {
              let isMissed = false;
              if (shift === 'Sáng' && (isPast || (isToday && currentTimeMins > 750))) { 
                  isMissed = true; tOut = '12:00';
              } else if (shift === 'Chiều' && (isPast || (isToday && currentTimeMins > 1110))) { 
                  isMissed = true; tOut = '18:00';
              } else if (shift === 'Tối' && (isPast || (isToday && (currentTimeMins > 180 && currentTimeMins < 1140)))) { 
                  isMissed = true; tOut = '23:00';
              }
              if (isMissed) {
                  if (!String(status).includes('Quên chấm ra')) {
                      penalty += 5000; status = 'Quên chấm ra (-5k)';
                  }
              }
          }

          let h = 0;
          const calcH = (inStr, outStr) => {
              if (!inStr || !outStr) return 0;
              const [inH, inM] = inStr.split(':').map(Number); 
              const [outH, outM] = outStr.split(':').map(Number);
              let startMins = inH * 60 + inM; let endMins = outH * 60 + outM;
              if (endMins < startMins) endMins += 24 * 60;
              const lunchStart = 720; const lunchEnd = 840;
              const overlapStart = Math.max(startMins, lunchStart);
              const overlapEnd = Math.min(endMins, lunchEnd);
              const lunchBreakMins = Math.max(0, overlapEnd - overlapStart);
              let totalMins = (endMins - startMins) - lunchBreakMins;
              return Math.max(0, totalMins / 60);
          };

          if (tIn && tOut) h = calcH(tIn, tOut);
          else if (a.totalHours) h = Number(String(a.totalHours).replace(/,/g, '.'));
          return { 
              ...a, shift, timeIn: tIn, timeOut: tOut, 
              totalHours: h.toFixed(2), 
              status: status || (a.leaveType ? `Nghỉ: ${a.leaveType}` : (h > 0 ? 'Hoàn thành' : 'Đang làm việc')), 
              penalty: penalty, isEdited: a.isEdited || false 
          };
      });
  }, [rawAttData, currentDate, currentTimeMins]);

  const streakDays = React.useMemo(() => {
      const myAtt = attData.filter(a => a.user === currentUser && Number(a.totalHours) > 0).map(a => a.date).sort((a, b) => new Date(b) - new Date(a));
      const uniqueDays = [...new Set(myAtt)];
      if (uniqueDays.length === 0) return 0;
      
      let count = 0;
      let d = new Date(currentDate); 
      const todayStr = d.toISOString().split('T')[0];
      d.setDate(d.getDate() - 1);
      const yesterdayStr = d.toISOString().split('T')[0];

      if (uniqueDays[0] !== todayStr && uniqueDays[0] !== yesterdayStr) return 0;

      let checkDate = new Date(uniqueDays[0]);
      for (let i = 0; i < uniqueDays.length; i++) {
          if (uniqueDays[i] === checkDate.toISOString().split('T')[0]) { count++; checkDate.setDate(checkDate.getDate() - 1); } 
          else break;
      }
      return count;
  }, [attData, currentUser, currentDate]);

  const displayStreak = streakDays > 0 && streakDays % 7 === 0 ? 7 : streakDays % 7;
  const filterMonth = filter === 'Tuỳ Chỉnh' ? customMonth : new Date().toISOString().slice(0, 7);

  // Ép ngày nhập tay vào đúng với kỳ lương đang xem để data không bay sang tháng sau
  const payrollTargetDate = React.useMemo(() => {
      if (filter === 'Tháng Trước') {
          const d = new Date(); d.setMonth(d.getMonth() - 1);
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-28`;
      }
      if (filter === 'Tuỳ Chỉnh') return `${customMonth}-28`;
      return currentDate;
  }, [filter, customMonth, currentDate]);

  const [showLeaveModal, setShowLeaveModal] = React.useState(false);
  const [leaveForm, setLeaveForm] = React.useState({ start: '', end: '', note: '' });
  const [showHistoryUser, setShowHistoryUser] = React.useState(null);
  const [expandedPayroll, setExpandedPayroll] = React.useState(null);
  const [editAtt, setEditAtt] = React.useState(null);
  const [payrollAction, setPayrollAction] = React.useState(null);

  const [showKPIModal, setShowKPIModal] = React.useState(false);
  const [kpiType, setKpiType] = React.useState('task'); 
  const [kpiForm, setKpiForm] = React.useState({ user: users[0] || '', kpiName: 'Dựng khung', target: '', unit: 'SP', startTime: currentDate, endTime: '', reward: '', penalty: '' });
  const [devGoals, setDevGoals] = React.useState([{ name: '', reward: '' }]); 
  const [editKPI, setEditKPI] = React.useState(null);
  const [kpiPeriodType, setKpiPeriodType] = React.useState('Daily');
  const [kpiTrackingType, setKpiTrackingType] = React.useState('auto');

  const handleCheckInOut = async (action, targetShift) => {
      const timeStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
      let existingRec = attData.find(a => String(a.user).trim() === currentUser.trim() && a.date === currentDate && a.shift === targetShift);
      let payload = {};
      if (action === 'IN') {
          if (existingRec && existingRec.timeIn) return triggerToast(`Bạn đã vào ca ${targetShift} rồi!`, 'fa-exclamation', 'warning');
          payload = { id: existingRec ? existingRec.id : `ATT_${Date.now()}`, user: currentUser, date: currentDate, shift: targetShift, timeIn: timeStr, status: 'Đang làm việc', penalty: 0, isEdited: false };
      } else {
          if (!existingRec || !existingRec.timeIn) return triggerToast(`Chưa vào ca ${targetShift}!`, 'fa-exclamation', 'warning');
          if (existingRec.timeOut) return triggerToast(`Đã ra ca ${targetShift} rồi!`, 'fa-exclamation', 'warning');
          let inH = Number(existingRec.timeIn.split(':')[0]); let inM = Number(existingRec.timeIn.split(':')[1]);
          let outH = Number(timeStr.split(':')[0]); let outM = Number(timeStr.split(':')[1]);
          let diffMins = (outH * 60 + outM) - (inH * 60 + inM);
          if (diffMins < 0) diffMins += 24 * 60;
          payload = { ...existingRec, timeOut: timeStr, totalHours: (diffMins/60).toFixed(2), status: 'Hoàn thành' };
      }
      try { await pushDeltas({ attendance: [payload] }, `Đã ${action==='IN'?'vào':'ra'} ${targetShift}!`, 'fa-check');
      } catch(e) { triggerToast('Lỗi mạng!', 'fa-times', 'danger'); }
  };

  const handleSaveEditAtt = async () => {
      if (!editAtt.timeIn || !editAtt.timeOut) return triggerToast('Thiếu giờ vào/ra', 'fa-times', 'danger');
      let inH = Number(editAtt.timeIn.split(':')[0]); let inM = Number(editAtt.timeIn.split(':')[1]); let outH = Number(editAtt.timeOut.split(':')[0]); let outM = Number(editAtt.timeOut.split(':')[1]);
      let diffMins = (outH * 60 + outM) - (inH * 60 + inM);
      if (diffMins < 0) diffMins += 24 * 60;
      
      const payload = { ...editAtt, totalHours: (diffMins/60).toFixed(2), isEdited: true };
      
      try { 
          await pushDeltas({ attendance: [payload] }, 'Cập nhật chấm công thành công!', 'fa-check'); 
          setEditAtt(null);
      } catch(e) { triggerToast('Lỗi đồng bộ!', 'fa-times', 'danger'); }
  };

  const submitLeave = async () => {
      if(!leaveForm.start || !leaveForm.end) return triggerToast('Thiếu thông tin!', 'fa-exclamation', 'warning');
      const sDate = new Date(leaveForm.start);
      const hoursNotice = (sDate.getTime() - new Date().getTime()) / 3600000;
      const leavesThisPeriod = attData.filter(a => String(a.user).trim() === currentUser.trim() && a.date && isDateInRange(a.date) && String(a.status || '').includes('Nghỉ')).length;
      let status = 'Nghỉ có phép'; let penalty = 0;
      if (hoursNotice < 24 || leavesThisPeriod >= 2) { status = 'Nghỉ không phép'; penalty = 200000; }
      const payload = { id: `ATT_LEAVE_${Date.now()}`, user: currentUser, date: sDate.toISOString().split('T')[0], shift: 'Nghỉ Phép', status, penalty, leaveStart: leaveForm.start, leaveEnd: leaveForm.end, leaveReportAt: new Date().toISOString(), note: leaveForm.note };
      try { await pushDeltas({ attendance: [payload] }, 'Đã gửi báo nghỉ!', 'fa-check'); setShowLeaveModal(false);
      if(penalty>0) alert(`LƯU Ý: Bị phạt ${formatMoney(penalty)}đ do vi phạm quy chế.`); } catch(e) {}
  };

  const getDynamicKPIProgress = (k, u) => {
      if (k.unit === 'Checklist') return Number(k.current) || 0;
      let count = 0;
      const s = k.startTime || '2000-01-01'; const e = k.endTime || '2099-12-31';
      const inR = (d) => { if(!d) return false; const dt = String(d).split(' ')[0]; return dt >= s && dt <= e; };

      if (k.kpiName === 'Dựng khung' || k.kpiName === 'Cắt Mài') {
          safeProdItems.forEach(p => { 
              const user = p.p1_user || p.phases?.phase1?.user;
              const status = p.p1_status || p.phases?.phase1?.status;
              const endTime = p.p1_endTime || p.phases?.phase1?.endTime || p.date;
              if (String(user).trim() === String(u).trim() && status === 'Done' && inR(endTime)) count++; 
          });
      } else if (k.kpiName === 'Gia cố' || k.kpiName === 'Gọt Keo') {
          safeProdItems.forEach(p => { 
              const user = p.p2_user || p.phases?.phase2?.user;
              const status = p.p2_status || p.phases?.phase2?.status;
              const endTime = p.p2_endTime || p.phases?.phase2?.endTime || p.date;
              if (String(user).trim() === String(u).trim() && status === 'Done' && inR(endTime)) count++; 
          });
      } else if (k.kpiName === 'Đóng Gói') {
          safePackings.forEach(pk => { if (String(pk.user).trim() === String(u).trim() && pk.status === 'Done' && inR(pk.endTime || pk.date)) count++; });
      } else if (k.kpiName === 'Bán Hàng') {
          bpData.forEach(bp => { if (String(bp.user).trim() === String(u).trim() && bp.type === 'Thưởng Bán Hàng' && inR(bp.date)) count++; });
      }
      return count > 0 ? count : (Number(k.current) || 0);
  };

  const claimReward = async (k) => {
      if (k.isClaimed === 'true' || k.isClaimed === true || claimingIds.includes(k.id)) return;
      setClaimingIds(prev => [...prev, k.id]);
      setShowCoins(true); setTimeout(() => setShowCoins(false), 2500);

      const payload = {
          KPI_Progress: [{ ...k, isClaimed: true }],
          BonusPenalty: [{
              id: 'BP_KPI_' + Date.now(), user: k.user, amount: Number(k.reward || 0),
              type: 'Thưởng Nhiệm Vụ', note: `Thưởng hoàn thành nhiệm vụ: ${k.kpiName}`, date: payrollTargetDate, orderCode: ''
          }]
      };
      try { await pushDeltas(payload, 'Nhận thưởng thành công!', 'fa-coins');
      } catch(e) { triggerToast('Lỗi nhận thưởng, thử lại sau', 'fa-times', 'danger');
      } finally { setClaimingIds(prev => prev.filter(id => id !== k.id)); }
  };

  const saveKPI = async () => {
      if (!kpiForm.startTime || !kpiForm.endTime) return triggerToast('Vui lòng chọn thời gian Bắt đầu và Kết thúc!', 'fa-exclamation', 'warning');
      if (kpiType === 'dev' && !editKPI) {
          const validGoals = devGoals.filter(g => g.name.trim());
          if (validGoals.length === 0) return triggerToast('Vui lòng nhập ít nhất 1 mục tiêu phát triển!', 'fa-exclamation', 'warning');
          const payloads = validGoals.map((g, idx) => ({ id: `KPI_DEV_${Date.now()}_${idx}`, user: kpiForm.user, kpiName: g.name.trim(), current: 0, target: 1, unit: 'Checklist', startTime: kpiForm.startTime, endTime: kpiForm.endTime, reward: Number(g.reward) || 0, penalty: 0, isClaimed: false, lastUpdated: new Date().toISOString() }));
          await pushDeltas({ KPI_Progress: payloads }, 'Đã giao nhiệm vụ phát triển!', 'fa-seedling');
      } else {
          if (!kpiForm.kpiName || !kpiForm.kpiName.trim()) return triggerToast('Vui lòng nhập hoặc chọn tên nhiệm vụ!', 'fa-exclamation', 'warning');
          const payload = { id: editKPI ? editKPI.id : `KPI_${Date.now()}`, user: kpiForm.user, kpiName: kpiForm.kpiName.trim(), current: editKPI ? editKPI.current : 0, target: kpiForm.target, unit: kpiForm.unit, startTime: kpiForm.startTime, endTime: kpiForm.endTime, reward: Number(kpiForm.reward) || 0, penalty: Number(kpiForm.penalty) || 0, isClaimed: editKPI ? editKPI.isClaimed : false, lastUpdated: new Date().toISOString() };
          await pushDeltas({ KPI_Progress: [payload] }, 'Lưu nhiệm vụ thành công!', 'fa-check');
      }
      setShowKPIModal(false); setEditKPI(null);
  };

  const toggleDevGoal = async (k) => { 
      if (!isBoss) return triggerToast('Bạn không có quyền duyệt mục tiêu!', 'fa-lock', 'danger');
      const newCurrent = Number(k.current) >= 1 ? 0 : 1;
      await pushDeltas({ KPI_Progress: [{ ...k, current: newCurrent, lastUpdated: new Date().toISOString() }] }, newCurrent ? 'Đã nghiệm thu!' : 'Hủy duyệt', 'fa-check-double');
  };

  const handleApplyKPIPenalty = async (k, current, target) => {
      const amt = Number(k.penalty) || 0;
      if (amt <= 0) return triggerToast('Nhiệm vụ này không cài đặt mức phạt!', 'fa-info', 'warning');
      if (!window.confirm(`⚠️ Xác nhận giáng phạt ${k.user} số tiền ${formatMoney(amt)}đ do chưa đạt KPI "${k.kpiName}"?`)) return;
      const payload = { id: 'BP_PEN_' + Date.now(), user: k.user, amount: -Math.abs(amt), type: 'Phạt KPI', note: `Không đạt mục tiêu: ${k.kpiName} (${current}/${target})`, date: payrollTargetDate, orderCode: '' };
      try { await pushDeltas({ BonusPenalty: [payload] }, 'Đã giáng phạt KPI!', 'fa-gavel');
      } catch(e) { triggerToast('Lỗi giáng phạt', 'fa-times', 'danger'); }
  };

  const handleDeleteKPI = async (k) => {
      if(!window.confirm(`Bạn có chắc muốn xoá nhiệm vụ "${k.kpiName}"?\n⚠️ Hệ thống sẽ tự động THU HỒI toàn bộ tiền thưởng/phạt liên quan đến nhiệm vụ này!`)) return;
      const relatedBPs = bpData.filter(b => b.user === k.user && ((b.type === 'Thưởng Nhiệm Vụ' && String(b.note).includes(k.kpiName)) || (b.type === 'Phạt KPI' && String(b.note).includes(k.kpiName))));
      const payload = { deletes: { KPI_Progress: [k.id] } };
      if (relatedBPs.length > 0) { payload.deletes.BonusPenalty = relatedBPs.map(b => b.id); }
      try { await pushDeltas(payload, 'Đã xoá và thu hồi tiền liên quan!', 'fa-trash');
      } catch(e) { triggerToast('Lỗi khi xoá!', 'fa-times', 'danger'); }
  };

  const formatDR = (s, e) => { if (!s || !e) return 'Vô hạn'; return `${s.split('-').reverse().slice(0,2).join('/')} - ${e.split('-').reverse().slice(0,2).join('/')}`; };

  // Hàm parse ngày an toàn, chống lỗi Type/NaN do định dạng dữ liệu Google Sheets
  const parseDateSafe = (val) => {
    if (!val) return NaN;
    const str = String(val).trim();
    if (!str) return NaN;
    let s = str;
    if (s.includes(' ')) {
      s = s.replace(' ', 'T');
    }
    if (s.includes('T') && s.split(':').length === 2) {
      s += ':00';
    }
    const t = new Date(s).getTime();
    if (!isNaN(t)) return t;
    return new Date(val).getTime();
  };

  // Hàm tính toán giờ thực chiến chi tiết theo từng ngày của thợ
  const calcActiveHoursForDay = (user, dateStr, gateHours) => {
    let totalActiveMins = 0;
    const safeGateHours = Number(gateHours) || 0;
    
    // 1. Duyệt prodItems
    (safeProdItems || []).forEach(p => {
      ['phase1', 'phase2'].forEach(phKey => {
        const ph = p?.phases?.[phKey];
        if (ph && String(ph.user).trim() === String(user).trim()) {
          if (ph.start && String(ph.start).startsWith(dateStr)) {
            const startMs = parseDateSafe(ph.start);
            let endMs = 0;
            if (ph.endTime) {
              endMs = parseDateSafe(ph.endTime);
            } else if (ph.status === 'In Progress' && dateStr === currentDate) {
              endMs = Date.now();
            }
            if (!isNaN(startMs) && endMs > startMs) {
              totalActiveMins += (endMs - startMs) / 60000;
            }
          }
        }
      });
    });

    // 2. Duyệt packings
    (safePackings || []).forEach(pk => {
      if (String(pk.user).trim() === String(user).trim()) {
        if (pk.start && String(pk.start).startsWith(dateStr)) {
          const startMs = parseDateSafe(pk.start);
          let endMs = 0;
          const et = pk.endTime || pk.end;
          if (et) {
            endMs = parseDateSafe(et);
          } else if (pk.status === 'In Progress' && dateStr === currentDate) {
            endMs = Date.now();
          }
          if (!isNaN(startMs) && endMs > startMs) {
            totalActiveMins += (endMs - startMs) / 60000;
          }
        }
      }
    });

    const activeH = Math.max(0, totalActiveMins / 60);
    // Capping active hours at gate hours

                              </div>

                              <div className={"grid grid-cols-2 gap-3"}>
                                  <div><label className={"text-[10px] font-black text-amber-500 block mb-1.5"}>Thưởng (VNĐ)</label><input value={kpiForm.reward} onChange={e=>setKpiForm({...kpiForm, reward: e.target.value})} type="number" className={"w-full bg-[#2a1a08] border border-amber-500/50 rounded-xl p-3.5 text-amber-400 font-black"} placeholder="0" /></div>
                                  <div><label className={"text-[10px] font-black text-rose-500 block mb-1.5"}>Phạt (VNĐ)</label><input value={kpiForm.penalty} onChange={e=>setKpiForm({...kpiForm, penalty: e.target.value})} type="number" className={"w-full bg-[#4c0519]/40 border border-rose-500/50 rounded-xl p-3.5 text-rose-400 font-black"} placeholder="0" /></div>
                              </div>
                          </div>
                      ) : (
                          <div className={"space-y-4"}>
                              <div>
                                  <label className={"text-[10px] font-black text-[#10b981] block mb-2"}>DANH SÁCH MỤC TIÊU CHECK-LIST</label>
                                  <div className={"space-y-2.5"}>
                                      {devGoals.map((g, i) => (
                                          <div key={i} className={"flex gap-2"}>
                                              <input value={g.name} onChange={e => { const newG = [...devGoals]; newG[i].name = e.target.value; setDevGoals(newG); }} className={"flex-1 bg-[#0a0a0a] border border-[#333] rounded-xl px-3.5 text-white font-bold text-xs outline-none"} placeholder="Mục tiêu..." />
                                              <input type="number" value={g.reward} onChange={e => { const newG = [...devGoals]; newG[i].reward = e.target.value; setDevGoals(newG); }} className={"w-24 bg-[#2a1a08] border border-amber-500/30 rounded-xl text-amber-400 font-black text-center text-xs outline-none"} placeholder="Thưởng..." />
                                          </div>
                                      ))}
                                  </div>
                              </div>
                              {devGoals.length < 10 && (
                                  <button onClick={() => setDevGoals([...devGoals, {name:'', reward:''}])} className={"w-full py-3 border-2 border-dashed border-[#333] text-gray-400 font-bold rounded-xl text-[11px]"}><i className={"fas fa-plus mr-1"}></i> THÊM MỤC TIÊU</button>
                              )}
                          </div>
                      )}
                  </div>
                  <div className={"p-4 bg-[#1a1a1a] border-t border-[#222] flex gap-2"}>
                      <button onClick={() => { setShowKPIModal(false); setEditKPI(null); }} className={"flex-1 py-3.5 bg-[#222] text-gray-300 font-black rounded-xl text-[12px]"}>HỦY BỎ</button>
                      <button onClick={saveKPI} className={`flex-1 py-3.5 font-black rounded-xl text-[12px] text-black ${kpiType === 'dev' ? 'bg-[#10b981]' : 'bg-[#8b5cf6] text-white'}`}>LƯU THIẾT LẬP</button>
                  </div>
              </div>
          </div>
      )}

      {showHistoryUser && (
          <div className={"fixed inset-0 bg-black/90 flex items-center justify-center z-[999] p-3 backdrop-blur-sm animate-fade-in"}>
              <div className={"bg-[#141414] border border-[#333] w-full max-w-2xl rounded-2xl p-4 flex flex-col max-h-[85vh] shadow-2xl relative"}>
                  <div className={"flex justify-between items-center mb-4 pb-3 border-b border-[#222]"}>
                      <h3 className={"font-black text-[14px] text-white uppercase flex items-center gap-2"}><i className={"fas fa-history text-[#3b82f6]"}></i> LỊCH SỬ CÔNG: <span className={"text-[#d4af37]"}>{showHistoryUser}</span></h3>
                      <button onClick={() => setShowHistoryUser(null)} className={"w-8 h-8 rounded-full bg-[#222] text-gray-400 flex items-center justify-center"}><i className={"fas fa-times"}></i></button>
                  </div>
                  <div className={"flex-1 overflow-auto custom-scrollbar bg-black rounded-xl border border-[#222]"}>
                      <table className={"w-full text-left border-collapse text-[11px]"}>
                          <thead>
                              <tr className={"bg-[#1a1a1a] text-gray-500 font-black border-b border-[#333]"}>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10 w-[80px]"}>Ngày</th>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10"}>Ca</th>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10"}>Trạng thái</th>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10"}>Vào-Ra</th>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10"}>Giờ</th>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10"}>Phạt</th>
                                  {canEditAttendance && <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10 text-center"}>Sửa</th>}
                              </tr>
                          </thead>
                          <tbody>
                              {(() => {
                                  let fMonth = filterMonth;
                                  if (filter === 'Tháng Trước') {
                                      const d = new Date(); d.setMonth(d.getMonth() - 1);
                                      fMonth = d.toISOString().slice(0,7);
                                  }
                                  
                                  const [yyyy, mm] = fMonth.split('-');
                                  const daysInMonth = new Date(yyyy, mm, 0).getDate();
                                  const tObj = new Date(currentDate);
                                  const isCurrentM = tObj.getFullYear() === Number(yyyy) && (tObj.getMonth() + 1) === Number(mm);
                                  const maxD = isCurrentM ? tObj.getDate() : daysInMonth;
                                  
                                  const allDaysArr = [];
                                  for (let i = maxD; i >= 1; i--) {
                                      allDaysArr.push(`${yyyy}-${mm}-${String(i).padStart(2, '0')}`);
                                  }

                                  return allDaysArr.map(dateStr => {
                                      const dateRecords = attData.filter(x => x.user === showHistoryUser && x.date === dateStr);
                                      const shiftsToEnsure = ['Sáng', 'Chiều', 'Tối'];
                                      const displayRecords = [...dateRecords];
                                      
                                      shiftsToEnsure.forEach(s => {
                                          if (!displayRecords.find(x => x.shift === s)) {
                                              displayRecords.push({ isEmpty: true, user: showHistoryUser, date: dateStr, shift: s });
                                          }
                                      });
                                      
                                      const shiftOrder = { 'Sáng': 1, 'Chiều': 2, 'Tối': 3 };
                                      displayRecords.sort((a, b) => (shiftOrder[a.shift] || 4) - (shiftOrder[b.shift] || 4));

                                      return (
                                          <React.Fragment key={dateStr}>
                                              {displayRecords.map((a, idx) => {
                                                  const isEditedBadge = a.isEdited === true || a.isEdited === 'true';
                                                  
                                                  if (a.isEmpty) {
                                                      return (
                                                          <tr key={`${dateStr}_${a.shift}`} className="border-b border-[#222] text-zinc-500 opacity-70">
                                                              {idx === 0 && <td rowSpan={displayRecords.length} className="p-3 font-black text-[#d4af37] border-r border-[#222] align-top bg-[#111]">{dateStr.split('-').reverse().slice(0,2).join('/')}</td>}
                                                              <td className="p-3 text-[#3b82f6] font-bold">{a.shift}</td>
                                                              <td className="p-3"><span className="px-1.5 py-0.5 rounded font-bold text-[9px] uppercase bg-[#222] text-gray-500">Trống</span></td>
                                                              <td className="p-3 text-gray-500 font-mono">--:-- - --:--</td>
                                                              <td className="p-3 font-black text-gray-500 text-[13px]">0h</td>
                                                              <td className="p-3 font-black text-rose-500 text-[10px]"></td>
                                                              {canEditAttendance && (
                                                                  <td className="p-3 text-center">
                                                                      <button onClick={() => setEditAtt({ id: `ATT_MANUAL_${Date.now()}_${Math.random().toString(36).substr(2,5)}`, user: showHistoryUser, date: dateStr, shift: a.shift, timeIn: '', timeOut: '', status: 'Hoàn thành', penalty: 0, isEdited: true })} className="w-7 h-7 rounded-lg bg-[#222] border border-[#333] text-gray-400 hover:text-[#10b981] hover:border-[#10b981] transition-all" title="Bổ sung ca này">
                                                                          <i className="fas fa-plus"></i>
                                                                      </button>
                                                                  </td>
                                                              )}
                                                          </tr>
                                                      );
                                                  }

                                                  return (
                                                      <tr key={a.id} className={`border-b border-[#222] text-zinc-300 ${isEditedBadge ? 'bg-amber-900/10' : ''}`}>
                                                          {idx === 0 && <td rowSpan={displayRecords.length} className="p-3 font-black text-[#d4af37] border-r border-[#222] align-top bg-[#111]">{dateStr.split('-').reverse().slice(0,2).join('/')}</td>}
                                                          <td className="p-3 text-[#3b82f6] font-bold">{a.shift}</td>
                                                          <td className="p-3">
                                                              <span className={`px-1.5 py-0.5 rounded font-bold text-[9px] uppercase ${String(a.status).includes('Nghỉ') || String(a.status).includes('Quên') ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}`}>{a.status}</span>
                                                              {isEditedBadge && <div className="mt-1"><span className="px-1.5 py-0.5 rounded font-black text-[8px] bg-amber-500 text-black"><i className="fas fa-pen text-[8px] mr-1"></i>Sửa</span></div>}
                                                          </td>
                                                          <td className="p-3 text-gray-400 font-mono">{a.timeIn || '--:--'} - {a.timeOut || '--:--'}</td>
                                                           <td className="p-3 font-semibold text-[10px] leading-tight space-y-0.5">
                                                               <div className="text-zinc-500">🚪 Xưởng: {a.gateHours || a.totalHours}h</div>
                                                               <div className="text-emerald-400 font-bold">⚡ Việc: {a.activeHours || a.totalHours}h</div>
                                                               {Number(a.idleHours || 0) > 0 && <div className="text-rose-400 font-medium">💤 Chết: {a.idleHours}h</div>}
                                                           </td>
                                                          <td className="p-3 font-black text-rose-500 text-[10px]">{a.penalty > 0 ? `-${formatMoney(a.penalty)}` : ''}<br/><span className="text-[8px] text-gray-500 font-normal">{a.note}</span></td>
                                                          
                                                          {canEditAttendance && <td className="p-3 text-center"><button onClick={() => setEditAtt({...a, isEdited: true})} className="w-7 h-7 rounded-lg bg-[#222] text-gray-400 hover:text-amber-400" title="Sửa giờ"><i className="fas fa-edit"></i></button></td>}
                                                      </tr>
                                                  );
                                              })}
                                          </React.Fragment>
                                      );
                                  });
                              })()}
                          </tbody>
                      </table>
                  </div>
              </div>
          </div>
      )}

      {editAtt && (
          <div className={"fixed inset-0 bg-black/80 flex items-center justify-center z-[1000] p-4 backdrop-blur-sm animate-fade-in"}>
              <div className={"bg-[#141414] border border-[#333] w-full max-w-sm rounded-2xl p-5 text-[11px] shadow-2xl"}>
                  <h3 className={"font-black text-amber-500 uppercase mb-4 text-[13px] border-b border-[#222] pb-2"}><i className={"fas fa-user-edit"}></i> Chỉnh sửa công: {editAtt.user}</h3>
                  <div className={"space-y-3"}>
                      <div className={"flex gap-2"}>
                          <div className={"flex-1"}><label className={"text-gray-400 block mb-1"}>Giờ Vào</label><input type="time" value={editAtt.timeIn || ''} onChange={e => setEditAtt({...editAtt, timeIn: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white"} /></div>
                          <div className={"flex-1"}><label className={"text-gray-400 block mb-1"}>Giờ Ra</label><input type="time" value={editAtt.timeOut || ''} onChange={e => setEditAtt({...editAtt, timeOut: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white"} /></div>
                      </div>
                      <div>
                          <label className={"text-gray-400 block mb-1"}>Trạng thái</label>
                          <select value={editAtt.status || ''} onChange={e => setEditAtt({...editAtt, status: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white"}>
                              <option value="Hoàn thành">Hoàn thành</option>
                              <option value="Đang làm việc">Đang làm việc</option>
                              <option value="Đi muộn">Đi muộn</option>
                              <option value="Nghỉ có phép">Nghỉ có phép</option>
                              <option value="Nghỉ không phép">Nghỉ không phép</option>
                              <option value="Quên chấm ra (-5k)">Quên chấm ra (-5k)</option>
                          </select>
                      </div>
                      <div className={"grid grid-cols-2 gap-3"}>
                          <div><label className={"text-gray-400 block mb-1"}>Tiền phạt</label><input type="number" value={editAtt.penalty || 0} onChange={e => setEditAtt({...editAtt, penalty: Number(e.target.value)})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-rose-500 font-black"} /></div>
                          <div><label className={"text-gray-400 block mb-1"}>Lý do phạt</label><input type="text" value={editAtt.note || ''} onChange={e => setEditAtt({...editAtt, note: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white"} placeholder="Lý do..." /></div>
                      </div>
                  </div>
                  <div className={"flex gap-2 mt-5"}>
                      <button onClick={() => setEditAtt(null)} className={"flex-1 py-2.5 bg-[#222] text-gray-400 font-black rounded-xl"}>HỦY</button>
                      <button onClick={handleSaveEditAtt} className={"flex-[2] py-2.5 bg-amber-500 text-black font-black rounded-xl"}>XÁC NHẬN SỬA</button>
                  </div>
              </div>
          </div>
      )}

      {editingPayroll && (
          <PayrollEditModal 
              p={editingPayroll} 
              filterMonth={filterMonth} 
              currentDate={payrollTargetDate} 
              onClose={() => setEditingPayroll(null)} 
              pushDeltas={pushDeltas} 
          />
      )}
    </div>
  );
}

// -------------------------------------------------------------------------
// 5. COMPONENT MODAL CẬP NHẬT CHI TIẾT SỐ LIỆU LƯƠNG ĐỘC LẬP CHUẨN CHỈ
// -------------------------------------------------------------------------
function PayrollEditModal({ p, onClose, pushDeltas, filterMonth, currentDate }) {
    const [form, setForm] = React.useState({
        luongLamThemGio: p.luongLamThemGio || '',
        hoTroSanLuong: p.hoTroSanLuong || '',
        cacKhoanThuKhac: p.cacKhoanThuKhac || '',
        cacKhoanThuKhacNote: p.cacKhoanThuKhacNote || '',
        phatQuyDinh: p.phatQuyDinh || '',
        phatQuyDinhNote: p.phatQuyDinhNote || '',
        chiPhiBaoHanh: p.chiPhiBaoHanh || '',
        daTraNhanVien: p.daTraNhanVien || '',
        nhanXetText: p.nhanXetText || ''
    });
    const [isSaving, setIsSaving] = React.useState(false);

    const handleSave = async () => {
        setIsSaving(true);
        const buildBP = (amt, type, defaultNote) => ({
            id: `BP_${type.toUpperCase()}_${p.user}_${filterMonth}`.replace(/[^A-Z0-9_]/g, ''),
            user: p.user,
            amount: Number(amt) || 0,
            type: type,
            note: type === 'Thu Nhập Khác' ? (form.cacKhoanThuKhacNote || defaultNote) : 
                  type === 'Phạt Quy Định' ? (form.phatQuyDinhNote || defaultNote) : 
                  type === 'Nhận Xét' ? (form.nhanXetText || defaultNote) : defaultNote,
            date: currentDate,
            orderCode: ''
        });

        const payload = {
            BonusPenalty: [
                buildBP(form.luongLamThemGio, 'Lương Làm Thêm Giờ', 'Tăng ca nội bộ xưởng'),
                buildBP(form.hoTroSanLuong, 'Hỗ Trợ Sản Lượng', 'Hỗ trợ định mức kho sản lượng'),
                buildBP(form.cacKhoanThuKhac, 'Thu Nhập Khác', 'Khoản điều chỉnh bổ sung'),
                buildBP(-Math.abs(Number(form.phatQuyDinh)), 'Phạt Quy Định', 'Trừ vi phạm nội quy KCS'),
                buildBP(-Math.abs(Number(form.chiPhiBaoHanh)), 'Chi Phí Bảo Hành', 'Khấu trừ đền bù hàng hỏng vỡ lỗi'),
                buildBP(-Math.abs(Number(form.daTraNhanVien)), 'Đã Trả', 'Ứng quyết toán lương kỳ trước'),
                buildBP(0, 'Nhận Xét', 'Đạt chỉ tiêu khối lượng xưởng đề ra.')
            ]
        };

        try {
            await pushDeltas(payload, `Đã nhồi số bảng lương của ${p.user} thành công!`, 'fa-save');
            onClose();
        } catch(e) { alert('Lỗi đồng bộ dữ liệu mạng!'); }
        setIsSaving(false);
    };

    return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
            <div className="bg-[#141414] border border-[#333] w-full max-w-md rounded-[24px] p-5 shadow-2xl flex flex-col max-h-[90vh]">
                <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-2.5">
                    <h3 className="font-black text-[#3b82f6] text-[13px] uppercase tracking-wider"><i className="fas fa-edit mr-2"></i>Sửa số liệu lương: {p.user}</h3>
                    <button onClick={onClose} disabled={isSaving} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white flex items-center justify-center"><i className="fas fa-times text-xs"></i></button>
                </div>
                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3.5 pr-1 text-[11px]">
                    <div className="grid grid-cols-2 gap-3">
                        <div><label className="text-gray-400 font-bold block mb-1">Lương Làm Thêm Giờ</label><input type="number" value={form.luongLamThemGio} onChange={e=>setForm({...form, luongLamThemGio: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white font-bold" /></div>
                        <div><label className="text-gray-400 font-bold block mb-1">Hỗ Trợ Sản Lượng</label><input type="number" value={form.hoTroSanLuong} onChange={e=>setForm({...form, hoTroSanLuong: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white font-bold" /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2 p-2.5 bg-zinc-900/30 rounded-xl border border-white/5">
                        <div className="col-span-2 font-black text-blue-400">THU NHẬP KHÁC</div>
                        <div><label className="text-gray-500 block mb-1">Số tiền</label><input type="number" value={form.cacKhoanThuKhac} onChange={e=>setForm({...form, cacKhoanThuKhac: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white" /></div>
                        <div><label className="text-gray-500 block mb-1">Ghi chú</label><input type="text" value={form.cacKhoanThuKhacNote} onChange={e=>setForm({...form, cacKhoanThuKhacNote: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white" /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2 p-2.5 bg-zinc-900/30 rounded-xl border border-white/5">
                        <div className="col-span-2 font-black text-rose-400">PHẠT QUY ĐỊNH MỤC</div>
                        <div><label className="text-gray-500 block mb-1">Tiền phạt</label><input type="number" value={form.phatQuyDinh} onChange={e=>setForm({...form, phatQuyDinh: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-rose-400 font-bold" /></div>
                        <div><label className="text-gray-500 block mb-1">Lý do phạt lỗi</label><input type="text" value={form.phatQuyDinhNote} onChange={e=>setForm({...form, phatQuyDinhNote: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white" /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        <div><label className="text-gray-400 block mb-1">Chi Phí Bảo Hành</label><input type="number" value={form.chiPhiBaoHanh} onChange={e=>setForm({...form, chiPhiBaoHanh: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white" /></div>
                        <div><label className="text-gray-400 block mb-1">Đã Chi Trả Trước</label><input type="number" value={form.daTraNhanVien} onChange={e=>setForm({...form, daTraNhanVien: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white" /></div>
                    </div>
                    <div><label className="text-gray-400 block mb-1">Nhận Xét Năng Suất Phiếu</label><textarea rows="2" value={form.nhanXetText} onChange={e=>setForm({...form, nhanXetText: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none" placeholder="Đạt tiến độ..."></textarea></div>
                </div>
                <div className="flex gap-2 mt-4 pt-2 border-t border-[#222]">
                    <button onClick={onClose} className="flex-1 py-2.5 bg-[#222] text-gray-400 font-black rounded-xl">HỦY</button>
                    <button onClick={handleSave} disabled={isSaving} className="flex-[2] py-2.5 bg-blue-500 text-black font-black rounded-xl">{isSaving ? 'ĐANG GHI...' : 'LƯU SỐ LIỆU'}</button>
                </div>
            </div>
        </div>
    );
}
</script>
