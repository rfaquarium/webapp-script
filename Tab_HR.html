                  <div className={"p-4 border-b border-[#222] bg-[#1a1a1a] flex justify-between items-center"}>
                      <h3 className={"font-black text-[#d4af37] uppercase text-[13px] tracking-widest"}><i className={"fas fa-scroll mr-2"}></i>{editKPI ? 'Chỉnh Sửa Nhiệm Vụ' : 'Giao Nhiệm Vụ Mới'}</h3>
                      <button onClick={() => { setShowKPIModal(false); setEditKPI(null); }} className={"w-8 h-8 rounded-full bg-[#222] hover:bg-rose-500 flex items-center justify-center"}><i className={"fas fa-times"}></i></button>
                  </div>
                  <div className={"p-4 sm:p-5 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar flex-1"}>
                      {/* 1. RECURRENCE SELECTOR */}
                      {!editKPI && kpiType === 'task' && (
                          <div>
                              <label className={"text-[10px] font-black text-gray-500 block mb-1.5"}>CHU KỲ NHIỆM VỤ</label>
                              <select 
                                  value={kpiPeriodType} 
                                  onChange={e => {
                                      const val = e.target.value;
                                      setKpiPeriodType(val);
                                      const now = new Date();
                                      if (val === 'Daily') {
                                          setKpiForm(prev => ({ ...prev, startTime: currentDate, endTime: currentDate }));
                                      } else if (val === 'Monthly') {
                                          const y = now.getFullYear();
                                          const m = String(now.getMonth() + 1).padStart(2, '0');
                                          const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
                                          setKpiForm(prev => ({ ...prev, startTime: `${y}-${m}-01`, endTime: `${y}-${m}-${lastDay}` }));
                                      }
                                  }} 
                                  className={"w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3.5 text-white font-bold outline-none"}
                              >
                                  <option value="Daily">Hàng Ngày (Daily)</option>
                                  <option value="Monthly">Hàng Tháng (Monthly)</option>
                                  <option value="Custom">Tùy Chọn Khoảng Ngày</option>
                              </select>
                          </div>
                      )}

                      {/* 2. DURATION DATES RENDER */}
                      <div className={"grid grid-cols-2 gap-3 bg-[#0a0a0a] p-3 rounded-xl border border-[#333] opacity-90"}>
                          <div>
                              <label className={"text-[10px] font-black text-gray-500 block mb-1"}>TỪ NGÀY</label>
                              <input 
                                  type="date" 
                                  disabled={kpiPeriodType !== 'Custom' && !editKPI} 
                                  value={kpiForm.startTime} 
                                  onChange={e=>setKpiForm({...kpiForm, startTime: e.target.value})} 
                                  className={"w-full bg-transparent text-white font-bold text-[12px] disabled:opacity-60 disabled:cursor-not-allowed"} 
                              />
                          </div>
                          <div className={"pl-3 border-l border-[#333]"}>
                              <label className={"text-[10px] font-black text-gray-500 block mb-1"}>ĐẾN NGÀY</label>
                              <input 
                                  type="date" 
                                  disabled={kpiPeriodType !== 'Custom' && !editKPI} 
                                  value={kpiForm.endTime} 
                                  onChange={e=>setKpiForm({...kpiForm, endTime: e.target.value})} 
                                  className={"w-full bg-transparent text-white font-bold text-[12px] disabled:opacity-60 disabled:cursor-not-allowed"} 
                              />
                          </div>
                      </div>

                      {!editKPI && (
                          <div className={"flex bg-[#0a0a0a] p-1.5 rounded-xl border border-[#333]"}><button onClick={() => setKpiType('task')} className={`flex-1 py-2.5 rounded-lg text-[11px] font-black ${kpiType === 'task' ? 'bg-[#8b5cf6] text-white' : 'text-gray-500'}`}>NHIỆM VỤ</button><button onClick={() => setKpiType('dev')} className={`flex-1 py-2.5 rounded-lg text-[11px] font-black ${kpiType === 'dev' ? 'bg-[#10b981] text-black' : 'text-gray-500'}`}>MỤC TIÊU KPI</button></div>
                      )}
                      
                      {!editKPI && (
                          <div>
                              <label className={"text-[10px] font-black text-gray-500 block mb-1.5"}>NHÂN SỰ NHẬN</label>
                              <select value={kpiForm.user} onChange={e=>setKpiForm({...kpiForm, user: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3.5 text-white font-bold outline-none"}>
                                  {users.map(u => <option key={u} value={u}>{u}</option>)}
                              </select>
                          </div>
                      )}

                      {kpiType === 'task' ? (
                          <div className={"space-y-4"}>
                              {/* 3. TRACKING TYPE */}
                              {!editKPI && (
                                  <div>
                                      <label className={"text-[10px] font-black text-gray-500 block mb-1.5"}>PHƯƠNG THỨC THEO DÕI</label>
                                      <select 
                                          value={kpiTrackingType} 
                                          onChange={e => {
                                              const val = e.target.value;
                                              setKpiTrackingType(val);
                                              if (val === 'auto') {
                                                  setKpiForm(prev => ({ ...prev, kpiName: 'Dựng khung', unit: 'SP', target: '10' }));
                                              } else {
                                                  setKpiForm(prev => ({ ...prev, kpiName: '', unit: 'Lần', target: '1' }));
                                              }
                                          }} 
                                          className={"w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3.5 text-white font-bold outline-none"}
                                      >
                                          <option value="auto">Hệ thống tự động theo dõi (Auto-tracked)</option>
                                          <option value="manual">Tự định nghĩa / Nhập tay (Manual checklist)</option>
                                      </select>
                                  </div>
                              )}

                              {/* 4. TASK NAME FIELD */}
                              {kpiTrackingType === 'auto' ? (
                                  <div>
                                      <label className={"text-[10px] font-black text-gray-500 block mb-1.5"}>TÊN NHIỆM VỤ HỆ THỐNG</label>
                                      <select disabled={!!editKPI} value={kpiForm.kpiName} onChange={e=>setKpiForm({...kpiForm, kpiName: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3.5 text-white font-bold outline-none"}>
                                          <option value="Dựng khung">Dựng khung (Làm Layout)</option>
                                          <option value="Gia cố">Gia cố (Gắn Keo Layout)</option>
                                          <option value="Cắt Mài">Cắt Mài (Làm Bể Kính)</option>
                                          <option value="Gọt Keo">Gọt Keo (Làm Bể Kính)</option>
                                          <option value="Đóng Gói">Đóng Gói</option>
                                          <option value="Bán Hàng">Bán Hàng (Chốt đơn)</option>
                                      </select>
                                  </div>
                              ) : (
                                  <div>
                                      <label className={"text-[10px] font-black text-gray-500 block mb-1.5"}>TÊN NHIỆM VỤ TỰ ĐỊNH NGHĨA</label>
                                      <input disabled={!!editKPI} type="text" value={kpiForm.kpiName} onChange={e=>setKpiForm({...kpiForm, kpiName: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3.5 text-white font-bold outline-none"} placeholder="VD: Vệ sinh phân xưởng, Sắp xếp kệ kính..." />
                                  </div>
                              )}

                              {/* 5. TARGET & UNIT */}
                              <div className={"grid grid-cols-2 gap-3"}>
                                  <div>
                                      <label className={"text-[10px] font-black text-gray-500 block mb-1.5"}>Mục tiêu số lượng</label>
                                      <input disabled={!!editKPI} type="number" value={kpiForm.target} onChange={e=>setKpiForm({...kpiForm, target: Number(e.target.value)})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3.5 text-white font-bold"} placeholder="10" />
                                  </div>
                                  <div>
                                      <label className={"text-[10px] font-black text-gray-500 block mb-1.5"}>Đơn vị tính</label>
                                      <input disabled={!!editKPI} type="text" value={kpiForm.unit} onChange={e=>setKpiForm({...kpiForm, unit: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3.5 text-white font-bold"} placeholder="Lần" />
                                  </div>
                              </div>

                              <div className={"grid grid-cols-2 gap-3"}>
                                  <div><label className={"text-[10px] font-black text-amber-500 block mb-1.5"}>Thưởng (VNĐ)</label><input value={kpiForm.reward} onChange={e=>setKpiForm({...kpiForm, reward: e.target.value})} type="number" className={"w-full bg-[#2a1a08] border border-amber-500/50 rounded-xl p-3.5 text-amber-400 font-black"} placeholder="0" /></div>
                                  <div><label className={"text-[10px] font-black text-rose-500 block mb-1.5"}>Phạt (VNĐ)</label><input value={kpiForm.penalty} onChange={e=>setKpiForm({...kpiForm, penalty: e.target.value})} type="number" className={"w-full bg-[#4c0519]/40 border border-rose-500/50 rounded-xl p-3.5 text-rose-400 font-black"} placeholder="0" /></div>
                              </div>
                          </div>
                      ) : (
                          <div className={"space-y-4"}>
                              <div>
                                  <label className={"text-[10px] font-black text-[#10b981] block mb-2"}>DANH SÁCH MỤC TIÊU CHECK-LIST</label>
                                  <div className={"space-y-2.5"}>
                                      {devGoals.map((g, i) => (
                                          <div key={i} className={"flex gap-2"}>
                                              <input value={g.name} onChange={e => { const newG = [...devGoals]; newG[i].name = e.target.value; setDevGoals(newG); }} className={"flex-1 bg-[#0a0a0a] border border-[#333] rounded-xl px-3.5 text-white font-bold text-xs outline-none"} placeholder="Mục tiêu..." />
                                              <input type="number" value={g.reward} onChange={e => { const newG = [...devGoals]; newG[i].reward = e.target.value; setDevGoals(newG); }} className={"w-24 bg-[#2a1a08] border border-amber-500/30 rounded-xl text-amber-400 font-black text-center text-xs outline-none"} placeholder="Thưởng..." />
                                          </div>
                                      ))}
                                  </div>
                              </div>
                              {devGoals.length < 10 && (
                                  <button onClick={() => setDevGoals([...devGoals, {name:'', reward:''}])} className={"w-full py-3 border-2 border-dashed border-[#333] text-gray-400 font-bold rounded-xl text-[11px]"}><i className={"fas fa-plus mr-1"}></i> THÊM MỤC TIÊU</button>
                              )}
                          </div>
                      )}
                      <div className={"mt-4 pt-4 border-t border-[#333]"}>
                          <label className={"text-[10px] font-black text-[#3b82f6] block mb-1.5 uppercase"}>Hướng dẫn / Ghi chú (Cho nhân sự)</label>
                          <textarea value={kpiForm.note || ''} onChange={e=>setKpiForm({...kpiForm, note: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3 text-white font-bold outline-none min-h-[70px] text-[11px] placeholder:text-gray-600"} placeholder="Nhập hướng dẫn chi tiết về nhiệm vụ, yêu cầu hoặc lưu ý đặc biệt..."></textarea>
                      </div>
                  </div>
                  <div className={"p-4 bg-[#1a1a1a] border-t border-[#222] flex gap-2"}>
                      <button onClick={() => { setShowKPIModal(false); setEditKPI(null); }} className={"flex-1 py-3.5 bg-[#222] text-gray-300 font-black rounded-xl text-[12px]"}>HỦY BỎ</button>
                      <button onClick={saveKPI} className={`flex-1 py-3.5 font-black rounded-xl text-[12px] text-black ${kpiType === 'dev' ? 'bg-[#10b981]' : 'bg-[#8b5cf6] text-white'}`}>LƯU THIẾT LẬP</button>
                  </div>
              </div>
          </div>
      )}

      {showHistoryUser && (
          <div className={"fixed inset-0 bg-black/90 flex items-center justify-center z-[999] p-3 backdrop-blur-sm animate-fade-in"}>
              <div className={"rf-modal-content w-full max-w-2xl p-4 flex flex-col max-h-[85vh] shadow-2xl relative"}>
                  <div className={"flex justify-between items-center mb-4 pb-3 border-b border-[#222]"}>
                      <h3 className={"font-black text-[14px] text-white uppercase flex items-center gap-2"}><i className={"fas fa-history text-[#3b82f6]"}></i> LỊCH SỬ CÔNG: <span className={"text-[#d4af37]"}>{showHistoryUser}</span></h3>
                      <button onClick={() => setShowHistoryUser(null)} className={"w-8 h-8 rounded-full bg-[#222] text-gray-400 flex items-center justify-center"}><i className={"fas fa-times"}></i></button>
                  </div>
                  <div className={"flex-1 overflow-auto custom-scrollbar bg-black rounded-xl border border-[#222]"}>
                      <table className={"w-full text-left border-collapse text-[11px]"}>
                          <thead>
                              <tr className={"bg-[#1a1a1a] text-gray-500 font-black border-b border-[#333]"}>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10 w-[80px]"}>Ngày</th>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10"}>Ca</th>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10"}>Trạng thái</th>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10"}>Vào-Ra</th>
                                  <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10"}>Giờ</th>
                                  {canEditAttendance && <th className={"p-3 sticky top-0 bg-[#1a1a1a] z-10 text-center"}>Sửa</th>}
                              </tr>
                          </thead>
                          <tbody>
                              {(() => {
                                  let fMonth = filterMonth;
                                  if (filter === 'Tháng Trước') {
                                      const d = new Date(); d.setMonth(d.getMonth() - 1);
                                      fMonth = d.toISOString().slice(0,7);
                                  }
                                  
                                  const [yyyy, mm] = fMonth.split('-');
                                  const daysInMonth = new Date(yyyy, mm, 0).getDate();
                                  const tObj = new Date(currentDate);
                                  const isCurrentM = tObj.getFullYear() === Number(yyyy) && (tObj.getMonth() + 1) === Number(mm);
                                  const maxD = isCurrentM ? tObj.getDate() : daysInMonth;
                                  
                                  const allDaysArr = [];
                                  for (let i = maxD; i >= 1; i--) {
                                      allDaysArr.push(`${yyyy}-${mm}-${String(i).padStart(2, '0')}`);
                                  }

                                  return allDaysArr.map(dateStr => {
                                      const dateRecords = attData.filter(x => x.user === showHistoryUser && x.date === dateStr);
                                      const shiftsToEnsure = ['Sáng', 'Chiều', 'Tối'];
                                      const displayRecords = [...dateRecords];
                                      
                                      shiftsToEnsure.forEach(s => {
                                          if (!displayRecords.find(x => x.shift === s)) {
                                              displayRecords.push({ isEmpty: true, user: showHistoryUser, date: dateStr, shift: s });
                                          }
                                      });
                                      
                                      const shiftOrder = { 'Sáng': 1, 'Chiều': 2, 'Tối': 3 };
                                      displayRecords.sort((a, b) => (shiftOrder[a.shift] || 4) - (shiftOrder[b.shift] || 4));

                                      return (
                                          <React.Fragment key={dateStr}>
                                              {displayRecords.map((a, idx) => {
                                                  const isEditedBadge = a.isEdited === true || a.isEdited === 'true';
                                                  
                                                  if (a.isEmpty) {
                                                      return (
                                                          <tr key={`${dateStr}_${a.shift}`} className="border-b border-[#222] text-zinc-500 opacity-70">
                                                              {idx === 0 && <td rowSpan={displayRecords.length} className="p-3 font-black text-[#d4af37] border-r border-[#222] align-top bg-[#111]">{dateStr.split('-').reverse().slice(0,2).join('/')}</td>}
                                                              <td className="p-3 text-[#3b82f6] font-bold">{a.shift}</td>
                                                              <td className="p-3"><span className="px-1.5 py-0.5 rounded font-bold text-[9px] uppercase bg-[#222] text-gray-500">Trống</span></td>
                                                              <td className="p-3 text-gray-500 font-mono">--:-- - --:--</td>
                                                              <td className="p-3 font-black text-gray-500 text-[13px]">0h</td>
                                                              {canEditAttendance && (
                                                                  <td className="p-3 text-center">
                                                                      <button onClick={() => setEditAtt({ id: `ATT_MANUAL_${Date.now()}_${Math.random().toString(36).substr(2,5)}`, user: showHistoryUser, date: dateStr, shift: a.shift, timeIn: '', timeOut: '', status: 'Hoàn thành', penalty: 0, isEdited: true })} className="w-7 h-7 rounded-lg bg-[#222] border border-[#333] text-gray-400 hover:text-[#10b981] hover:border-[#10b981] transition-all" title="Bổ sung ca này">
                                                                          <i className="fas fa-plus"></i>
                                                                      </button>
                                                                  </td>
                                                              )}
                                                          </tr>
                                                      );
                                                  }

                                                  return (
                                                      <tr key={a.id} className={`border-b border-[#222] text-zinc-300 ${isEditedBadge ? 'bg-amber-900/10' : ''}`}>
                                                          {idx === 0 && <td rowSpan={displayRecords.length} className="p-3 font-black text-[#d4af37] border-r border-[#222] align-top bg-[#111]">{dateStr.split('-').reverse().slice(0,2).join('/')}</td>}
                                                          <td className="p-3 text-[#3b82f6] font-bold">{a.shift}</td>
                                                          <td className="p-3">
                                                              <span className={`px-1.5 py-0.5 rounded font-bold text-[9px] uppercase ${String(a.status).includes('Nghỉ') || String(a.status).includes('Quên') ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}`}>{a.status}</span>
                                                              {isEditedBadge && <div className="mt-1"><span className="px-1.5 py-0.5 rounded font-black text-[8px] bg-amber-500 text-black"><i className="fas fa-pen text-[8px] mr-1"></i>Sửa</span></div>}
                                                          </td>
                                                          <td className="p-3 text-gray-400 font-mono">{a.timeIn || '--:--'} - {a.timeOut || '--:--'}</td>
                                                          <td className="p-3 font-black text-[#10b981] text-[12px]">{a.totalHours}h</td>
                                                          
                                                          {canEditAttendance && (
                                                              <td className="p-3 text-center space-x-2">
                                                                  <button onClick={() => setEditAtt({...a, isEdited: true})} className="w-7 h-7 rounded-lg bg-[#222] text-gray-400 hover:text-amber-400" title="Sửa giờ"><i className="fas fa-edit"></i></button>
                                                                  <button onClick={async () => {
                                                                      if(window.confirm('Bạn có chắc muốn xoá ca chấm công này không?')) {
                                                                          try {
                                                                              await pushDeltas({ deletes: { Attendance: [a.id] } }, 'Đã xoá ca làm việc', 'fa-trash');
                                                                          } catch(e) {
                                                                              triggerToast('Lỗi mạng!', 'fa-times', 'danger');
                                                                          }
                                                                      }
                                                                  }} className="w-7 h-7 rounded-lg bg-[#222] text-gray-400 hover:text-red-500" title="Xoá ca này"><i className="fas fa-trash"></i></button>
                                                              </td>
                                                          )}
                                                      </tr>
                                                  );
                                              })}
                                          </React.Fragment>
                                      );
                                  });
                              })()}
                          </tbody>
                      </table>
                  </div>
              </div>
          </div>
      )}

      {editAtt && (
          <div className={"fixed inset-0 bg-black/80 flex items-center justify-center z-[1000] p-4 backdrop-blur-sm animate-fade-in"}>
              <div className={"rf-modal-content w-full max-w-sm p-5 text-[11px] shadow-2xl"}>
                  <h3 className={"font-black text-amber-500 uppercase mb-4 text-[13px] border-b border-[#222] pb-2"}><i className={"fas fa-user-edit"}></i> Chỉnh sửa công: {editAtt.user}</h3>
                  <div className={"space-y-3"}>
                      <div className={"flex gap-2"}>
                          <div className={"flex-1"}><label className={"text-gray-400 block mb-1"}>Giờ Vào</label><input type="time" value={editAtt.timeIn || ''} onChange={e => setEditAtt({...editAtt, timeIn: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white"} /></div>
                          <div className={"flex-1"}><label className={"text-gray-400 block mb-1"}>Giờ Ra</label><input type="time" value={editAtt.timeOut || ''} onChange={e => setEditAtt({...editAtt, timeOut: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white"} /></div>
                      </div>
                      <div className={"mt-2 text-gray-500 text-[10px] italic"}>
                          Trạng thái sẽ được tự động tính toán dựa trên giờ Vào/Ra.
                      </div>
                  </div>
                  <div className={"flex gap-2 mt-5"}>
                      <button onClick={() => setEditAtt(null)} className={"flex-1 py-2.5 bg-[#222] text-gray-400 font-black rounded-xl"}>HỦY</button>
                      <button onClick={handleSaveEditAtt} className={"flex-[2] py-2.5 bg-amber-500 text-black font-black rounded-xl"}>XÁC NHẬN SỬA</button>
                  </div>
              </div>
          </div>
      )}

      {directPenalty && (
          <div className={"fixed inset-0 bg-black/80 flex items-center justify-center z-[1000] p-4 backdrop-blur-sm animate-fade-in"}>
              <div className={"rf-modal-content w-full max-w-sm p-5 text-[11px] shadow-2xl"}>
                  <h3 className={"font-black text-rose-500 uppercase mb-4 text-[13px] border-b border-[#222] pb-2"}><i className={"fas fa-gavel"}></i> Phạt trực tiếp: {directPenalty.user}</h3>
                  <div className={"space-y-3"}>
                      <div><label className={"text-gray-400 block mb-1"}>Số tiền phạt</label><input type="number" value={directPenalty.amount} onChange={e => setDirectPenalty({...directPenalty, amount: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-rose-500 font-black"} placeholder="Ví dụ: 50000" /></div>
                      <div><label className={"text-gray-400 block mb-1"}>Lý do phạt</label><input type="text" value={directPenalty.note} onChange={e => setDirectPenalty({...directPenalty, note: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white"} placeholder="Lý do..." /></div>
                  </div>
                  <div className={"flex gap-2 mt-5"}>
                      <button onClick={() => setDirectPenalty(null)} className={"flex-1 py-2.5 bg-[#222] text-gray-400 font-black rounded-xl"}>HỦY</button>
                      <button onClick={handleDirectPenalty} className={"flex-[2] py-2.5 bg-rose-500 text-white font-black rounded-xl"}>XÁC NHẬN PHẠT</button>
                  </div>
              </div>
          </div>
      )}

      {showSalesKPIModal && (
          <SalesKPIModal 
              onClose={() => setShowSalesKPIModal(false)} 
              pushDeltas={pushDeltas} 
              triggerToast={triggerToast} 
          />
      )}

      {editingPayroll && (
          <PayrollEditModal 
              p={editingPayroll} 
              filterMonth={filterMonth} 
              currentDate={payrollTargetDate} 
              onClose={() => setEditingPayroll(null)} 
              pushDeltas={pushDeltas} 
          />
      )}


      {viewingPayslip && (
          <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[1000] p-4 backdrop-blur-sm animate-fade-in" onClick={() => setViewingPayslip(null)}>
              <div className="bg-white text-black w-full max-w-[210mm] max-h-[90vh] overflow-y-auto rounded-lg shadow-2xl p-5 custom-scrollbar" onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 border-b border-gray-200 pb-2">
                      <h3 className="font-bold text-lg text-gray-800"><i className="fas fa-file-invoice-dollar mr-2 text-blue-500"></i> Phiếu Lương Đã Chốt</h3>
                      <div className="flex items-center gap-2">
                          <button onClick={() => {
                              const win = window.open('', '_blank');
                              win.document.write(`<html><head><title>In Phiếu Lương</title><style>@media print { @page { size: A4 portrait; margin: 15mm auto; } body { background: white !important; margin: 0 !important; } * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; } }</style></head><body>${viewingPayslip}</body></html>`);
                              win.document.close();
                              win.focus();
                              setTimeout(() => win.print(), 300);
                          }} className="px-3 py-1.5 bg-amber-500 text-black font-black text-xs rounded-lg shadow hover:bg-amber-400 transition-colors flex items-center gap-1"><i className="fas fa-print"></i> IN LẠI</button>
                          <button onClick={() => setViewingPayslip(null)} className="text-gray-400 hover:text-red-500 transition-colors p-1"><i className="fas fa-times text-xl"></i></button>
                      </div>
                  </div>
                  <div dangerouslySetInnerHTML={{ __html: viewingPayslip }}></div>
              </div>
          </div>
      )}

    </div>
  );
});

// -------------------------------------------------------------------------
// 5. COMPONENT MODAL CẬP NHẬT CHI TIẾT SỐ LIỆU LƯƠNG ĐỘC LẬP CHUẨN CHỈ
// -------------------------------------------------------------------------
const PayrollEditModal = React.memo(function PayrollEditModal({ p, onClose, pushDeltas, filterMonth, currentDate }) {
    const [form, setForm] = React.useState({
        luongLamThemGio: p.luongLamThemGio || '',
        hoTroSanLuong: p.hoTroSanLuong || '',
        cacKhoanThuKhac: p.cacKhoanThuKhac || '',
        cacKhoanThuKhacNote: p.cacKhoanThuKhacNote || '',
        phatQuyDinh: p.phatQuyDinh || '',
        phatQuyDinhNote: p.phatQuyDinhNote || '',
        chiPhiBaoHanh: p.chiPhiBaoHanh || '',
        daTraNhanVien: p.daTraNhanVien || '',
        nhanXetText: p.nhanXetText || ''
    });
    const [isSaving, setIsSaving] = React.useState(false);

    const handleSave = async () => {
        setIsSaving(true);
        const buildBP = (amt, type, defaultNote) => ({
            id: `BP_${type.toUpperCase()}_${p.user}_${filterMonth}`.replace(/[^A-Z0-9_]/g, ''),
            user: p.user,
            amount: Number(amt) || 0,
            type: type,
            note: type === 'Thu Nhập Khác' ? (form.cacKhoanThuKhacNote || defaultNote) : 
                  type === 'Phạt Quy Định' ? (form.phatQuyDinhNote || defaultNote) : 
                  type === 'Nhận Xét' ? (form.nhanXetText || defaultNote) : defaultNote,
            date: currentDate,
            orderCode: ''
        });

        const payload = {
            monthStr: filterMonth,
            BonusPenalty_Updates: [
                buildBP(form.luongLamThemGio, 'Lương Làm Thêm Giờ', 'Tăng ca nội bộ xưởng'),
                buildBP(form.hoTroSanLuong, 'Hỗ Trợ Sản Lượng', 'Hỗ trợ định mức kho sản lượng'),
                buildBP(form.cacKhoanThuKhac, 'Thu Nhập Khác', 'Khoản điều chỉnh bổ sung'),
                buildBP(-Math.abs(Number(form.phatQuyDinh)), 'Phạt Quy Định', 'Trừ vi phạm nội quy KCS'),
                buildBP(-Math.abs(Number(form.chiPhiBaoHanh)), 'Chi Phí Bảo Hành', 'Khấu trừ đền bù hàng hỏng vỡ lỗi'),
                buildBP(-Math.abs(Number(form.daTraNhanVien)), 'Đã Trả', 'Ứng quyết toán lương kỳ trước'),
                buildBP(0, 'Nhận Xét', 'Đạt chỉ tiêu khối lượng xưởng đề ra.')
            ]
        };

        try {
            if (typeof window.runGAS === 'function') {
                const res = await window.runGAS('api_syncMasterPayroll', payload);
                if (res && res.success) {
                    if (typeof triggerToast === 'function') triggerToast(`Đã nhồi số và đồng bộ lương cho ${p.user} thành công!`, 'fa-check', 'success');
                    window.dispatchEvent(new CustomEvent('triggerReloadData'));
                    onClose();
                } else {
                    alert('Lỗi đồng bộ lương: ' + (res ? res.message : 'Không rõ'));
                }
            } else {
                await pushDeltas({ BonusPenalty: payload.BonusPenalty_Updates }, `Đã nhồi số bảng lương của ${p.user} thành công!`, 'fa-save');
                onClose();
            }
        } catch(e) { alert('Lỗi đồng bộ dữ liệu mạng!'); }
        setIsSaving(false);
    };

    return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
            <div className="bg-[#141414] border border-[#333] w-full max-w-md rounded-[24px] p-5 shadow-2xl flex flex-col max-h-[90vh]">
                <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-2.5">
                    <h3 className="font-black text-[#3b82f6] text-[13px] uppercase tracking-wider"><i className="fas fa-edit mr-2"></i>Sửa số liệu lương: {p.user}</h3>
                    <button onClick={onClose} disabled={isSaving} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white flex items-center justify-center"><i className="fas fa-times text-xs"></i></button>
                </div>
                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3.5 pr-1 text-[11px]">
                    {p.isLocked && (
                        <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 font-bold flex items-center gap-2">
                            <i className="fas fa-lock text-sm"></i>
                            <span>Kỳ lương này đã Khóa Sổ / Đã Trả. Hệ thống khóa quyền chỉnh sửa để đảm bảo tính toàn vẹn tài chính!</span>
                        </div>
                    )}
                    <div className="grid grid-cols-2 gap-3">
                        <div><label className="text-gray-400 font-bold block mb-1">Lương Làm Thêm Giờ</label><input type="number" disabled={p.isLocked} value={form.luongLamThemGio} onChange={e=>setForm({...form, luongLamThemGio: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white font-bold disabled:opacity-50" /></div>
                        <div><label className="text-gray-400 font-bold block mb-1">Hỗ Trợ Sản Lượng</label><input type="number" disabled={p.isLocked} value={form.hoTroSanLuong} onChange={e=>setForm({...form, hoTroSanLuong: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white font-bold disabled:opacity-50" /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2 p-2.5 bg-zinc-900/30 rounded-xl border border-white/5">
                        <div className="col-span-2 font-black text-blue-400">THU NHẬP KHÁC</div>
                        <div><label className="text-gray-500 block mb-1">Số tiền</label><input type="number" disabled={p.isLocked} value={form.cacKhoanThuKhac} onChange={e=>setForm({...form, cacKhoanThuKhac: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                        <div><label className="text-gray-500 block mb-1">Ghi chú</label><input type="text" disabled={p.isLocked} value={form.cacKhoanThuKhacNote} onChange={e=>setForm({...form, cacKhoanThuKhacNote: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2 p-2.5 bg-zinc-900/30 rounded-xl border border-white/5">
                        <div className="col-span-2 font-black text-rose-400">PHẠT QUY ĐỊNH MỤC</div>
                        <div><label className="text-gray-500 block mb-1">Tiền phạt</label><input type="number" disabled={p.isLocked} value={form.phatQuyDinh} onChange={e=>setForm({...form, phatQuyDinh: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-rose-400 font-bold disabled:opacity-50" /></div>
                        <div><label className="text-gray-500 block mb-1">Lý do phạt lỗi</label><input type="text" disabled={p.isLocked} value={form.phatQuyDinhNote} onChange={e=>setForm({...form, phatQuyDinhNote: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        <div><label className="text-gray-400 block mb-1">Chi Phí Bảo Hành</label><input type="number" disabled={p.isLocked} value={form.chiPhiBaoHanh} onChange={e=>setForm({...form, chiPhiBaoHanh: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                        <div><label className="text-gray-400 block mb-1">Đã Chi Trả Trước</label><input type="number" disabled={p.isLocked} value={form.daTraNhanVien} onChange={e=>setForm({...form, daTraNhanVien: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                    </div>
                    <div><label className="text-gray-400 block mb-1">Nhận Xét Năng Suất Phiếu</label><textarea rows="2" disabled={p.isLocked} value={form.nhanXetText} onChange={e=>setForm({...form, nhanXetText: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none disabled:opacity-50" placeholder="Đạt tiến độ..."></textarea></div>
                </div>
                <div className="flex gap-2 mt-4 pt-2 border-t border-[#222]">
                    <button onClick={onClose} className="flex-1 py-2.5 bg-[#222] text-gray-400 font-black rounded-xl">HỦY</button>
                    <button onClick={handleSave} disabled={isSaving || p.isLocked} className="flex-[2] py-2.5 bg-blue-500 text-black font-black rounded-xl disabled:opacity-50">{isSaving ? 'ĐANG GHI...' : (p.isLocked ? 'ĐÃ KHÓA SỔ' : 'LƯU SỐ LIỆU')}</button>
                </div>
            </div>
        </div>
    );
});

// -------------------------------------------------------------------------
// 6. COMPONENT MODAL TÍNH KPI QUẢN LÝ BÁN HÀNG
// -------------------------------------------------------------------------
const SalesKPIModal = React.memo(function SalesKPIModal({ onClose, pushDeltas, triggerToast }) {
    const [form, setForm] = React.useState({
        userName: 'Nguyễn Thị Diệu Hương',
        revenueAchieved: 0,
        responseRate: 0,
        refundHandlingRate: 0,
        complaintWinRate: 0,
        msgResponseRate: 0,
        lowRatingWinRate: 0
    });
    const [isSaving, setIsSaving] = React.useState(false);

    const handleSave = async () => {
        setIsSaving(true);
        try {
            if (typeof window.runGAS === 'function') {
                const res = await window.runGAS('calculateMonthlyKPI', form);
                if (res && res.success) {
                    triggerToast(res.message, 'fa-check', 'success');
                    onClose();
                } else {
                    triggerToast(res?.message || 'Lỗi tính toán KPI!', 'fa-times', 'danger');
                }
            }
        } catch(e) {
            triggerToast('Lỗi mạng', 'fa-times', 'danger');
        }
        setIsSaving(false);
    };

    return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
            <div className="bg-[#141414] border border-[#333] w-full max-w-md rounded-[24px] p-5 shadow-2xl flex flex-col">
                <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-2.5">
                    <h3 className="font-black text-amber-500 text-[13px] uppercase tracking-wider"><i className="fas fa-calculator mr-2"></i>TÍNH KPI BÁN HÀNG: {form.userName}</h3>
                    <button onClick={onClose} disabled={isSaving} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white flex items-center justify-center"><i className="fas fa-times text-xs"></i></button>
                </div>
                <div className="flex-1 space-y-3.5 pr-1 text-[11px] mt-2">
                    <div><label className="text-gray-400 font-bold block mb-1">Doanh thu bán hàng (VNĐ)</label><input type="number" value={form.revenueAchieved} onChange={e=>setForm({...form, revenueAchieved: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white font-bold" /></div>
                    <div className="grid grid-cols-2 gap-3">
                        <div><label className="text-gray-400 font-bold block mb-1">TL Phản hồi kênh (0 - 1.0)</label><input type="number" step="0.01" value={form.responseRate} onChange={e=>setForm({...form, responseRate: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white font-bold" /></div>
                        <div><label className="text-gray-400 font-bold block mb-1">TL Hàng hoàn xử lý (0 - 1.0)</label><input type="number" step="0.01" value={form.refundHandlingRate} onChange={e=>setForm({...form, refundHandlingRate: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white font-bold" /></div>
                        <div><label className="text-gray-400 font-bold block mb-1">TL Khiếu nại thắng (0 - 1.0)</label><input type="number" step="0.01" value={form.complaintWinRate} onChange={e=>setForm({...form, complaintWinRate: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white font-bold" /></div>
                        <div><label className="text-gray-400 font-bold block mb-1">TL Tin nhắn phản hồi (0 - 1.0)</label><input type="number" step="0.01" value={form.msgResponseRate} onChange={e=>setForm({...form, msgResponseRate: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white font-bold" /></div>
                        <div><label className="text-gray-400 font-bold block mb-1">TL Xử lý đánh giá thấp (0 - 1.0)</label><input type="number" step="0.01" value={form.lowRatingWinRate} onChange={e=>setForm({...form, lowRatingWinRate: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white font-bold" /></div>
                    </div>
                </div>
                <div className="flex gap-2 mt-5 pt-2 border-t border-[#222]">
                    <button onClick={onClose} className="flex-1 py-3 bg-[#222] text-gray-400 font-black rounded-xl">HỦY</button>
                    <button onClick={handleSave} disabled={isSaving} className="flex-[2] py-3 bg-amber-500 text-black font-black rounded-xl">{isSaving ? 'ĐANG TÍNH & GHI...' : 'TÍNH TOÁN & GHI NHẬN'}</button>
                </div>
            </div>
        </div>
    );
});
</script>
