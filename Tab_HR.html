              const bpId = `BP_${type.replace(/ /g, '')}_${p.user}_${filterMonth}`;

  const handleAddPrintComment = (e, p) => {
      e.stopPropagation();
      const comment = prompt(`Nhập nhận xét (hiển thị trên Phiếu Lương) cho ${p.user}:`, p.nhanXetText !== 'Không có nhận xét nào được viết tại đây.' ? p.nhanXetText : '');
      if (comment === null) return;

      const userBPs = bpData.filter(b => String(b.user).trim() === String(p.user).trim() && b.date && isDateInRange(b.date, filter, customMonth));
      const nhanXetRec = userBPs.find(b => b.type === 'Nhận Xét');

  const [isGeneratingKPI, setIsGeneratingKPI] = React.useState(false);

  const handleGenerateAllKPI = () => {

                  .then(res => {

                      } else {
                          Swal.fire('Lỗi', res.message, 'error');
                      }
                  })
                  .catch(err => {

                      Swal.fire('Lỗi', String(err), 'error');

  const [claimingIds, setClaimingIds] = React.useState([]);

  const mvpId = React.useMemo(() => {

      users.forEach(u => {
          const userKPIs = kpiData.filter(k => k.user === u);
          const claimed = userKPIs.filter(k => (k.isClaimed === 'true' || k.isClaimed === true));

          if (monthly > maxTasks && monthly > 0) { maxTasks = monthly; mId = u; }

      return mId;
  }, [kpiData, users, currentDate]);

  const [editingPayroll, setEditingPayroll] = React.useState(null);

  const formatExactDateTime = (dateStr) => {
      if (!dateStr) return '---';
      try {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return String(dateStr);
          const hours = String(d.getHours()).padStart(2, '0');
          const mins = String(d.getMinutes()).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const year = d.getFullYear();
          return `${hours}:${mins} ngày ${day}/${month}/${year}`;
      } catch(e) {
          return String(dateStr);
      }
  };

              badge: 'bg-rose-950/95 text-rose-200 border-rose-500 shadow-[0_0_25px_rgba(244,63,94,0.9)] animate-pulse',

              bar: 'from-amber-300 via-cyan-300 to-white',

          }
      ];
      return styles[Math.min(tier, styles.length - 1)];
  };

  const get100LevelInfo = (totalExp) => {
      const exp = Math.max(0, Number(totalExp) || 0);
      const MAX_EXP = 2000000000; // 2 Tỷ EXP (20 năm cống hiến)
      
      if (exp >= MAX_EXP) {
          return {
              level: 100,
              currentBaseExp: MAX_EXP,
              nextBaseExp: MAX_EXP,
              expInLevel: 0,
              neededForNext: 0,
              progressPct: 100,
              title: 'TỐI CAO GRANDMASTER',
              colorStyle: getLevelColorStyle(100)
          };
      }

      let level = Math.floor(Math.pow(exp / MAX_EXP, 1 / 2.25) * 99) + 1;
      level = Math.max(1, Math.min(99, level));

      const getExpForLevel = (l) => {
          if (l <= 1) return 0;
          if (l >= 100) return MAX_EXP;
          return Math.round(MAX_EXP * Math.pow((l - 1) / 99, 2.25));
      };

      const currentBaseExp = getExpForLevel(level);
      const nextBaseExp = getExpForLevel(level + 1);
      const expInLevel = exp - currentBaseExp;
      const neededForNext = Math.max(1, nextBaseExp - currentBaseExp);
      const progressPct = Math.min(100, Math.max(0, (expInLevel / neededForNext) * 100));

      let title = 'Tân Thủ';
      if (level >= 90) title = 'Huyền Thoại Xưởng';
      else if (level >= 80) title = 'Đại Tôn Tự';
      else if (level >= 70) title = 'Táo Quân Xưởng';
      else if (level >= 60) title = 'Cao Thủ Kỳ Cựu';
      else if (level >= 50) title = 'Trụ Cột Doanh Nghiệp';
      else if (level >= 40) title = 'Chuyên Gia Tinh Anh';
      else if (level >= 30) title = 'Thợ Lành Nghề';
      else if (level >= 20) title = 'Nhân Sự Vững Vàng';
      else if (level >= 10) title = 'Thành Viên Tích Cực';

      return {
          level,
          currentBaseExp,
          nextBaseExp,
          expInLevel,
          neededForNext,
          progressPct,
          title,
          colorStyle: getLevelColorStyle(level)
      };
  };

  const extractTimeLocal = (str) => {
      if (!str) return null;
      let s = String(str).trim();
      if (s.includes('T') && s.includes('Z')) { 
          const d = new Date(s); 
          if (!isNaN(d.getTime())) return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      const match = s.match(/([0-1]?[0-9]|2[0-3]):([0-5][0-9])/); 
      return match ? `${match[1].padStart(2, '0')}:${match[2]}` : null;
  };

  const [currentTimeMins, setCurrentTimeMins] = React.useState(() => new Date().getHours() * 60 + new Date().getMinutes());
  React.useEffect(() => {
      const interval = setInterval(() => {
          setCurrentTimeMins(new Date().getHours() * 60 + new Date().getMinutes());
      }, 30000); 
      return () => clearInterval(interval);
  }, []);

  const activeShift = React.useMemo(() => {

      if (filterStr === 'Tháng Này') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
      if (filterStr === 'Tháng Trước') {

          const [year, month] = customM.split('-');

          let h = 0;

              let totalMins = (endMins - startMins) - lunchBreakMins;
              return Math.max(0, totalMins / 60);

  // Hàm parse ngày an toàn, chống lỗi Type/NaN do định dạng dữ liệu Google Sheets
  const parseDateSafe = (val) => {
    if (!val) return NaN;
    const str = String(val).trim();
    if (!str) return NaN;
    let s = str;
    if (s.includes(' ')) {
      s = s.replace(' ', 'T');
    }
    if (s.includes('T') && s.split(':').length === 2) {
      s += ':00';
    }
    const t = new Date(s).getTime();
    if (!isNaN(t)) return t;
    return new Date(val).getTime();
  };

  // Hàm tính toán giờ thực chiến chi tiết theo từng ngày của thợ
  const calcActiveHoursForDay = (user, dateStr, gateHours) => {
    let totalActiveMins = 0;
    const safeGateHours = Number(gateHours) || 0;
    
    // 1. Duyệt prodItems
    (safeProdItems || []).forEach(p => {
      ['phase1', 'phase2'].forEach(phKey => {
        const ph = p?.phases?.[phKey];
        if (ph && String(ph.user).trim() === String(user).trim()) {
          if (ph.start && String(ph.start).startsWith(dateStr)) {
            const startMs = parseDateSafe(ph.start);
            let endMs = 0;
            if (ph.endTime) {
              endMs = parseDateSafe(ph.endTime);
            } else if (ph.status === 'In Progress' && dateStr === currentDate) {
              endMs = Date.now();
            }
            if (!isNaN(startMs) && endMs > startMs) {
              totalActiveMins += (endMs - startMs) / 60000;
            }
          }
        }
      });
    });

    // 2. Duyệt packings
    (safePackings || []).forEach(pk => {
      if (String(pk.user).trim() === String(user).trim()) {
        if (pk.start && String(pk.start).startsWith(dateStr)) {
          const startMs = parseDateSafe(pk.start);
          let endMs = 0;
          const et = pk.endTime || pk.end;
          if (et) {
            endMs = parseDateSafe(et);
          } else if (pk.status === 'In Progress' && dateStr === currentDate) {
            endMs = Date.now();
          }
          if (!isNaN(startMs) && endMs > startMs) {
            totalActiveMins += (endMs - startMs) / 60000;
          }
        }
      }
    });

    const activeH = Math.max(0, totalActiveMins / 60);
    // Capping active hours at gate hours
    const cappedActiveH = Math.min(activeH, safeGateHours);
    const idleH = Math.max(0, safeGateHours - cappedActiveH);
    return { activeHours: cappedActiveH, idleHours: idleH };
  };

                  const parts = pOrd.split('|').map(x => x.trim());

                      <div style={{ fontSize: '13px', marginTop: '4px' }}>Tổng giờ thực chiến (Chạm việc): {hoursWorked.toFixed(1)}h</div>
                      <div style={{ fontSize: '13px', marginTop: '4px' }}>Tổng thời gian chết (Idle): {totalIdleHours.toFixed(1)}h</div>
                      <div style={{ fontSize: '13px', marginTop: '4px' }}>Số giờ nghỉ làm không phép: {soGioNghiKhongPhep}</div>
                      <div style={{ border: '1px solid #000', padding: '6px', fontSize: '13px', marginTop: '4px', minHeight: '60px' }}>Nhận xét: {nhanXetText}</div>
                      
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '10px', fontSize: '14px', fontWeight: 'bold', paddingBottom: '30px' }}>
                          <div style={{ width: '45%', textAlign: 'center', marginTop: '10px' }}>Chữ ký kế toán</div>
                          <div style={{ width: '45%', textAlign: 'center', marginTop: '10px' }}>Chữ ký người nhận lương</div>
                      </div>
                  </div>
              </div>
          )
      };
  }).sort((a, b) => b.totalSalary - a.totalSalary);

  const top3Att = [...payroll].filter(p => Number(p.totalGateHours) > 0).sort((a,b) => Number(b.totalGateHours) - Number(a.totalGateHours)).slice(0, 3).map(p => ({ name: p.user, label: parseFloat(Number(p.totalGateHours).toFixed(1)) + ' giờ' }));
  const renderSafeAvatar = (name, className) => { 
      if (typeof Avatar !== 'undefined') return <Avatar name={name} userConfigs={userConfigs} className={className} />;
      return <div className={`${className} flex items-center justify-center bg-[#3b82f6] text-white font-black overflow-hidden uppercase rounded-full border-2 border-inherit shadow-lg`}>{name.charAt(0)}</div>; 
  };

  const handlePayrollActionSubmit = async () => {
      const amt = parseInt(payrollAction.amount);
      if (isNaN(amt) || amt === 0) return triggerToast('Số tiền không hợp lệ (Phải khác 0)', 'fa-times', 'danger');
      if (amt < 0) return triggerToast('Số tiền không hợp lệ', 'fa-times', 'danger');
      
      const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
      const accountsData = erpData?.Accounts || [];
      const selectedAccId = payrollAction.accountId || (accountsData.find(a => (a.accountName || a.name) === 'Công Ty') || accountsData[0])?.id;
      const selectedAcc = accountsData.find(a => a.id === selectedAccId);
      let payload = { BonusPenalty: [], Transactions: [], Accounts: [] };
      if (payrollAction.requestId) {
          payload.deletes = { BonusPenalty: [payrollAction.requestId] };
      }
      
      if (payrollAction.type === 'thuong') {
          payload.BonusPenalty.push({ id: 'BP_THUONG_' + Date.now(), user: payrollAction.target, amount: amt, type: 'Thưởng Nóng', note: payrollAction.note || 'Thưởng nóng', date: payrollTargetDate, orderCode: '' });
      } else if (payrollAction.type === 'tam_ung' || payrollAction.type === 'cho_vay') {
          if (!selectedAcc) return alert('Không tìm thấy tài khoản trích tiền!');
          
          if (payrollAction.type === 'tam_ung') {
              const prevMonthDate = new Date();
              prevMonthDate.setMonth(prevMonthDate.getMonth() - 1);
              const prevMonthStr = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth() + 1).padStart(2, '0')}`;
              const snap = erpData?.monthlySnapshots?.find(s => s.user === payrollAction.target && s.month === prevMonthStr);
              const prevSalary = snap ? Number(snap.totalSalary) || 0 : 0;
              const maxAdvance = Math.round(prevSalary * 0.5);
              
              if (amt > maxAdvance && maxAdvance > 0) {
                  return triggerToast(`Tạm ứng vượt quá 50% lương tháng trước (${Number(maxAdvance).toLocaleString('vi-VN')}đ). Vui lòng dùng khoản Cho Vay!`, 'fa-times', 'danger');
              } else if (maxAdvance <= 0) {
                  return triggerToast(`Lương tháng trước không đủ để tạm ứng! Vui lòng dùng khoản Cho Vay.`, 'fa-times', 'danger');
              }
          }
          
          const isVay = payrollAction.type === 'cho_vay';
          if (isVay && !payrollAction.dueDate) {
              return triggerToast('Vui lòng chọn ngày cần thu!', 'fa-times', 'danger');
          }
          const finalNote = isVay ? `${payrollAction.note || 'Cho Vay'} (Hạn thu: ${payrollAction.dueDate.split('-').reverse().join('/')})` : (payrollAction.note || 'Tạm ứng lương');
          
          payload.BonusPenalty.push({ id: (isVay ? 'BP_CHOVAY_' : 'BP_TAMUNG_') + Date.now(), user: payrollAction.target, amount: -amt, type: isVay ? 'Cho Vay' : 'Tạm Ứng', note: finalNote, date: isVay ? payrollAction.loanDate : payrollTargetDate, orderCode: isVay ? `Hạn thu: ${payrollAction.dueDate}` : '' });
          payload.Transactions.push({ id: 'TX_TAMUNG_' + Date.now(), type: 'Chi', category: isVay ? 'Cho Vay' : 'Tạm Ứng Lương', amount: amt, fromAccount: selectedAcc.id, toAccount: '', title: `${isVay ? 'Cho Vay' : 'Tạm ứng lương'}: ${payrollAction.target}`, date: safeDateFull.replace('T',' ').slice(0,16), note: finalNote, isAuto: true });
          payload.Accounts.push({ ...selectedAcc, balance: Number(selectedAcc.balance) - amt });
      } else if (payrollAction.type === 'ket_chuyen_no') {
          triggerToast('Đang xử lý kết chuyển dư nợ...', 'fa-spinner fa-spin', 'info');
          const debtPayload = {
              user: payrollAction.target,
              amount: amt,
              monthStr: filterMonth,
              mode: payrollAction.mode,
              monthlyDeduction: Number(payrollAction.monthlyDeduction) || 0
          };
          google.script.run
              .withSuccessHandler(res => {
                  if (res && res.success) {
                      triggerToast('Đã kết chuyển dư nợ thành công!', 'fa-check', 'success');
                      setPayrollAction(null);
                  } else {
                      triggerToast('Lỗi: ' + (res ? res.message : 'Không rõ'), 'fa-times', 'danger');
                  }
              })
              .withFailureHandler(err => {
                  triggerToast('Lỗi Server: ' + err.message, 'fa-times', 'danger');
              })
              .api_settleMonthlyDebt(debtPayload);
          return;
      } else if (payrollAction.type === 'thanh_toan') {
          if (!selectedAcc) return alert('Không tìm thấy tài khoản trích tiền!');
          payload.BonusPenalty.push({ id: 'BP_DATRA_' + Date.now(), user: payrollAction.target, amount: -amt, type: 'Đã Trả', note: payrollAction.note || `Thanh toán dứt điểm lương`, date: payrollTargetDate, orderCode: '' });
          payload.Transactions.push({ id: 'TX_LUONG_' + Date.now(), type: 'Chi', category: 'Trả Lương', amount: amt, fromAccount: selectedAcc.id, toAccount: '', title: `Trả lương: ${payrollAction.target}`, date: safeDateFull.replace('T',' ').slice(0,16), note: payrollAction.note || `Thanh toán lương tháng ${filterMonth}`, isAuto: true });
          payload.Accounts.push({ ...selectedAcc, balance: Number(selectedAcc.balance) - amt });
      }
      
      try {
          await pushDeltas(payload, 'Đã lưu hệ thống!', 'fa-check');
          setPayrollAction(null);
      } catch(e) { triggerToast('Lỗi hệ thống', 'fa-times', 'danger'); }
  };

  const handleRequestAdvance = (e, p) => {
      e.stopPropagation();
      const prevMonthDate = new Date();
      prevMonthDate.setMonth(prevMonthDate.getMonth() - 1);
      const prevMonthStr = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth() + 1).padStart(2, '0')}`;
      const snap = erpData?.monthlySnapshots?.find(s => s.user === p.user && s.month === prevMonthStr);
      const prevSalary = snap ? Number(snap.totalSalary) || 0 : 0;
      const maxAmount = Math.round(prevSalary * 0.5);
      
      let amountStr = prompt(`Xin tạm ứng (Tối đa 50% lương tháng trước: ${formatMoney(maxAmount)}đ).\nNếu xin vay vượt mức hoặc chưa có lương tháng trước, hệ thống sẽ duyệt dạng "Cho Vay".\n\nNhập số tiền muốn xin (VNĐ):`);
      if(!amountStr) return;
      const amount = Number(amountStr.replace(/[^0-9]/g, ''));
      if(amount <= 0) return;
      
      let isChoVay = false;
      if (amount > maxAmount || maxAmount === 0) {
          if(!confirm(`Số tiền bạn xin vượt mức 50% lương tháng trước (hoặc bạn chưa có lương tháng trước).\nYêu cầu sẽ được chuyển thành "Cho Vay". Bạn có đồng ý gửi yêu cầu?`)) return;
          isChoVay = true;
      }
      
      const reason = prompt("Nhập lý do xin ứng/vay:");
      if(!reason) return;
      
      const payload = {
          BonusPenalty: [{
              id: 'REQ_' + Date.now() + Math.random().toString(36).substring(7),
              user: p.user,
              amount: amount,
              type: 'Yêu Cầu Tạm Ứng',
              note: reason + (isChoVay ? ' (Cho Vay)' : ''),
              date: new Date().toISOString(),
              orderCode: 'Chờ Duyệt'
          }]
      };
      pushDeltas(payload, 'Đã gửi yêu cầu thành công!', 'fa-paper-plane');
  };

  const handlePrintPayslip = (p) => {
      setTimeout(() => {
          const printContents = document.getElementById(`payslip-print-${p.user}`).innerHTML;
          const periodLabel = filter === 'Tuỳ Chỉnh' ? `Tháng ${customMonth.split('-')[1]}/${customMonth.split('-')[0]}` : filter;
          
          // TỰ ĐỘNG CHỐT BẢNG LƯƠNG VÀO TÀI LIỆU (DOCUMENTS) SAU KHI IN
          if (documents && pushDeltas) {
              const normalizedFilter = filter === 'Tuỳ Chỉnh' ? customMonth.replace(/-/g, '') : filter.replace(/[^a-zA-Z0-9]/g, '');
              const docId = `PS_${p.user}_${normalizedFilter}`;
              const docIndex = documents.findIndex(d => d.id === docId || (d.category === 'Phiếu Lương' && d.title?.includes(p.user) && d.title?.includes(periodLabel)));
              const targetId = docIndex !== -1 ? documents[docIndex].id : docId;
              const newDoc = {
                  id: targetId,
                  category: 'Phiếu Lương',
                  title: `Phiếu Lương - ${p.user} - ${periodLabel}`,
                  description: printContents,
                  link: '',
                  createdAt: new Date().toISOString().slice(0, 19).replace('T', ' '),
                  createdBy: currentUser,
                  attachments: '', testLink: '', readBy: ''
              };
              if(docIndex === -1) {
                  pushDeltas({ documents: [newDoc] }, `Đã lưu chốt phiếu lương ${p.user}!`, 'fa-check');
              } else {
                  pushDeltas({ documents: [newDoc] }, `Đã cập nhật phiếu lương ${p.user}!`, 'fa-check');
              }
          }
          
          const style = document.createElement('style');
          style.innerHTML = `
              @media print {
                  @page { size: A4 portrait; margin: 15mm auto; } 
                  body > *:not(#print-section) { display: none !important; }
                  body { background: white !important; margin: 0 !important; padding: 0 !important; }
                  #print-section { display: block !important; width: 100% !important; background: white !important; }
                  #print-section > div { width: 100% !important; max-width: 190mm !important; margin: 0 auto !important; padding: 10px !important; }
                  table { page-break-inside: auto; width: 100% !important; }
                  tr    { page-break-inside: avoid; page-break-after: auto; }
                  thead { display: table-header-group; }
                  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
              }
          `;
          document.head.appendChild(style);
          const printDiv = document.createElement('div');
          printDiv.id = 'print-section';
          printDiv.innerHTML = printContents;
          document.body.appendChild(printDiv);
          window.print();
          document.body.removeChild(printDiv);
          document.head.removeChild(style);
      }, 100);
  };

  return (
    <div className={"w-full space-y-4 pb-32 md:pb-12 animate-fade-in relative"}>



      <div className="flex gap-3 w-full max-w-lg mx-auto mb-5 bg-[#111] p-1.5 rounded-2xl border border-[#333] shadow-inner">
        <button onClick={() => setSubTab('ATTENDANCE')} className={`flex-1 py-2 rounded-xl text-[12px] font-black uppercase transition-all duration-300 flex items-center justify-center gap-2 ${subTab === 'ATTENDANCE' ? 'bg-[#00a8e8] text-white shadow-[0_0_15px_rgba(0,168,232,0.3)] scale-[1.02]' : 'bg-transparent text-gray-400 hover:text-white hover:bg-white/5'}`}>CHẤM CÔNG</button>
        <button onClick={() => setSubTab('KPI')} className={`flex-1 py-2 rounded-xl text-[12px] font-black uppercase transition-all duration-300 flex items-center justify-center gap-2 ${subTab === 'KPI' ? 'bg-[#00a8e8] text-white shadow-[0_0_15px_rgba(0,168,232,0.3)] scale-[1.02]' : 'bg-transparent text-gray-400 hover:text-white hover:bg-white/5'}`}>NHIỆM VỤ</button>
        <button onClick={() => setSubTab('PAYROLL')} className={`flex-1 py-2 rounded-xl text-[12px] font-black uppercase transition-all duration-300 flex items-center justify-center gap-2 ${subTab === 'PAYROLL' ? 'bg-[#00a8e8] text-white shadow-[0_0_15px_rgba(0,168,232,0.3)] scale-[1.02]' : 'bg-transparent text-gray-400 hover:text-white hover:bg-white/5'}`}>BẢNG LƯƠNG</button>
      </div>
      <RFCard noPadding className="p-2 flex flex-col md:flex-row gap-2 items-center mb-4 shrink-0">
          <div className="flex items-center gap-2 pl-2 border-r border-[#333] pr-3 shrink-0">
              <i className="fas fa-calendar-alt text-[#00a8e8]"></i>
              <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">KỲ BÁO CÁO</span>
          </div>
          <select value={filter} onChange={e => { setFilter(e.target.value); if (e.target.value !== 'Chọn Tháng') setCustomMonth(''); }} className="h-[42px] px-3 bg-[#0a0a0a] rounded-xl border border-[#333] text-[11px] font-black uppercase tracking-wider outline-none text-white shadow-sm focus:border-[#00a8e8] transition-colors cursor-pointer shrink-0">
              <option value="Tháng Này">Tháng Này</option>
              <option value="Tháng Trước">Tháng Trước</option>
              <option value="Chọn Tháng">Chọn Tháng</option>
          </select>
          {filter === 'Chọn Tháng' && (
              <input type="month" value={customMonth} onChange={e => setCustomMonth(e.target.value)} className="h-[42px] px-3 bg-[#0a0a0a] rounded-xl border border-[#333] text-[12px] font-black uppercase outline-none text-[#00a8e8] shadow-sm focus:border-[#00a8e8] transition-colors shrink-0" />
          )}
          <div className="flex-1"></div>
          <div className="flex gap-2 shrink-0 flex-wrap">
              {isBoss && (
                  <>
                      <RFButton variant="outline" onClick={() => typeof openKpiModalStandalone === 'function' ? openKpiModalStandalone() : (window.openKpiModalStandalone && window.openKpiModalStandalone())} className="!border-amber-500/50 text-amber-500 hover:bg-amber-500 hover:text-white !h-[42px]" title="Tạo KPI">
                          <i className="fas fa-fire mr-1"></i> TẠO KPI
                      </RFButton>
                      <RFButton variant="outline" onClick={() => typeof openTaskModalStandalone === 'function' ? openTaskModalStandalone() : (window.openTaskModalStandalone && window.openTaskModalStandalone())} className="!border-emerald-500/50 text-emerald-500 hover:bg-emerald-500 hover:text-white !h-[42px]" title="Giao Việc">
                          <i className="fas fa-tasks mr-1"></i> GIAO VIỆC
                      </RFButton>
                  </>
              )}
              <RFButton variant="outline" onClick={() => setShowLeaveModal(true)} className="!border-rose-500/50 text-rose-500 hover:bg-rose-500 hover:text-white !h-[42px]" title="Báo Nghỉ">
                  <i className="fas fa-calendar-minus mr-1"></i> BÁO NGHỈ
              </RFButton>
          </div>
      </RFCard>

      {subTab === 'ATTENDANCE' && (
          <div className={"grid grid-cols-1 xl:grid-cols-2 gap-5"}>
              {/* CỘT TRÁI: Widget Chấm Công & Top Chuyên Cần */}
              <div className={"space-y-4"}>
              {/* ATTENDANCE CARD WIDGET */}
              <RFCard className="w-full relative group">
                  <div className="absolute top-0 left-0 w-1.5 bg-gradient-to-b from-[#00a8e8] to-[#3b82f6] h-full z-10"></div>
                  <div className="absolute -right-10 -top-10 w-40 h-40 bg-[#00a8e8]/5 rounded-full blur-3xl group-hover:bg-[#00a8e8]/10 transition-all"></div>
                  
                  {/* Shift selector grid */}
                  <div className="grid grid-cols-3 gap-3 mb-4 relative z-10">
                      <div 
                          className={`p-3 rounded-2xl border flex flex-col items-center justify-center cursor-default transition-all ${
                              selectedShiftTab === 'Sáng' 
                                  ? 'bg-[#2563eb]/10 border-[#2563eb] text-[#60a5fa] ring-1 ring-[#2563eb]' 
                                  : 'bg-[#0a0a0a] border-[#333] text-zinc-400 opacity-70'
                          }`}
                      >
                          <div className="flex items-center gap-1 text-[11px] font-black uppercase tracking-wider mb-1"><i className="fas fa-cloud-sun text-amber-400"></i> Ca Sáng</div>
                          <div className="text-[9px] font-bold opacity-80">06:00 - 13:00</div>
                      </div>
                      <div 
                          className={`p-3 rounded-2xl border flex flex-col items-center justify-center cursor-default transition-all ${
                              selectedShiftTab === 'Chiều' 
                                  ? 'bg-[#2563eb]/10 border-[#2563eb] text-[#60a5fa] ring-1 ring-[#2563eb]' 
                                  : 'bg-[#0a0a0a] border-[#333] text-zinc-400 opacity-70'
                          }`}
                      >
                          <div className="flex items-center gap-1 text-[11px] font-black uppercase tracking-wider mb-1"><i className="fas fa-sun text-yellow-400"></i> Ca Chiều</div>
                          <div className="text-[9px] font-bold opacity-80">13:00 - 19:00</div>
                      </div>

                          className={`p-3 rounded-2xl border flex flex-col items-center justify-center cursor-default transition-all ${

                                  ? 'bg-[#2563eb]/10 border-[#2563eb] text-[#60a5fa] ring-1 ring-[#2563eb]'

                          }`}
                      >
                          <div className="flex items-center gap-1 text-[11px] font-black uppercase tracking-wider mb-1"><i className="fas fa-moon text-yellow-300"></i> Ca Tối</div>

                      </button>
                  </div>

                  {/* GIỜ LÀM THỰC TẾ HÔM NAY */}
                  <div className="bg-[#0b0b0c]/80 border border-zinc-800/80 rounded-2xl p-4 space-y-3">

                          <i className="fas fa-history text-blue-400"></i> GIỜ LÀM THỰC TẾ HÔM NAY
                      </div>
                      
                      <div className="space-y-2">
                          {/* Row Sáng */}

                              <div className="flex items-center gap-2 text-[11px] font-bold text-zinc-300">
                                  <span className={`w-1.5 h-1.5 rounded-full ${morningRecord && !morningRecord.timeOut ? 'bg-blue-500 animate-pulse' : 'bg-zinc-700'}`}></span>
                                  Ca Sáng

                                          <div className="flex items-center gap-2">

                                      ) : (

                                              <span>{afternoonRecord.timeIn}</span> ➔ <span className="text-amber-550 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded text-[9px] font-black text-amber-500">Đang làm</span>

                                  )}
                              </div>

                          const isOverdue = k.endTime && k.endTime < currentDate; 
                          const isFailed = currentProg < target;

                          // Phân biệt KPI tự động (Bán hàng, Sản xuất, Đóng gói) vs KPI thủ công
                          const kNameLower = String(k.kpiName || '').toLowerCase().trim();
                          const isAutoTracked = ['dựng khung', 'gia cố', 'cắt dán', 'gọt keo', 'đóng gói', 'bán hàng', 'khâu 1', 'khâu 2', 'sản xuất', 'khâu hoàn thành', 'tổng khâu'].includes(kNameLower) || 
                              kNameLower.includes('doanh thu') || 
                              kNameLower.includes('thanh lý') || 
                              kNameLower.includes('bán hàng') ||
                              kNameLower.includes('chốt đơn') ||

                                          {isBoss && !isCompleted && (

                              <div onClick={() => toggleKPIExpand(u)} className={"p-3.5 pb-4 cursor-pointer flex justify-between items-center relative group"}>

                                                                      <span className={"font-black text-purple-400"}>+{formatMoney(detail.amount)}</span>
                                                                  </div>

                                                                  <div key={idx} className={"flex justify-between items-center text-[10px] border-b border-[#222] pb-1.5 last:border-0"}>

                                          <span className={"text-rose-500 font-black tracking-wide"}><i className={"fas fa-exclamation-triangle mr-1"}></i> Khấu Trừ & KCS Phạt:</span>
                                          <div className={"flex items-center gap-2"}>
                                              <span className={"text-rose-500 font-black text-[13px]"}>-{formatMoney(p.tongGiamTru)}đ</span>
                                              <i className={`fas fa-chevron-${openSection[`${p.user}_penalty`] ? 'up' : 'down'} text-gray-500 text-[10px] w-4 text-right transition-transform`}></i>
                                          </div>
                                      </div>

                                          <div className={"bg-[#0a0a0a] p-2 border-t border-[#333] animate-fade-in"}>

                                                      <span className={"text-gray-300 truncate pr-2 flex-1"}><span className={"text-zinc-600 font-bold mr-1.5"}>[Cố định]</span>Phí Công Đoàn</span>

                                                  </div>

                                                      <div key={idx} className={"flex justify-between items-center text-[10px] border-b border-[#222] pb-1.5 last:border-0 last:pb-0"}>
                                                          <span className={"text-gray-300 truncate pr-2 flex-1"} title={detail.name}><span className={"text-zinc-600 font-bold mr-1.5"}>{detail.time ? `[${detail.time.slice(5)}]` : ''}</span>{detail.name}</span>
                                                          <span className={"font-black shrink-0 text-rose-500"}>-{formatMoney(detail.amount)}</span>
                                                      </div>
                                                  ))}

                                                      <div className={"text-emerald-500 font-bold text-[10px] mt-1.5 italic"}>Tuyệt vời, không phạm lỗi KCS!</div>

                                              </div>
                                          </div>
                                      )}
                                  </div>

                                  {/* KHỐI SO SÁNH: LƯƠNG MỤC TIÊU (ĐÃ CỘNG TẤT CẢ KPI) VS THỰC NHẬN (ĐẠT KPI MỚI CỘNG) */}
                                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mt-3">
                                      <div className="bg-[#18150d] p-3 rounded-xl border border-amber-500/30 shadow-sm">
                                          <div className="text-[9px] font-black text-amber-400 uppercase tracking-wider flex items-center gap-1 mb-0.5">
                                              <i className="fas fa-bullseye text-[#d4af37]"></i> Tổng Lương Mục Tiêu:
                                          </div>
                                          <div className="text-[17px] font-black text-amber-300 font-mono">
                                              {formatMoney(p.tongThuNhapTarget || p.tongThuNhap)}đ
                                          </div>
                                          <div className="text-[8px] text-amber-400/70 mt-0.5 font-bold">

                                      </div>

                                          <div className="text-[17px] font-black text-emerald-400 font-mono">
                                              {formatMoney(p.totalSalary)}đ
                                          </div>
                                          <div className="text-[8px] text-emerald-400/70 mt-0.5 font-bold">
                                              * Chỉ cộng thưởng khi thực sự đạt KPI
                                          </div>
                                      </div>
                                  </div>

                                   )}
                                   {canManagePayroll && (
                                       <>
                                       <button onClick={(e) => { e.stopPropagation(); setPayrollAction({ type: 'thuong', target: p.user, amount: '', note: '' }) }} style={{ backgroundColor: '#451a03', color: '#fbbf24', borderColor: '#78350f' }} className={"flex-1 py-2 font-black rounded-lg text-[10px] border hover:bg-amber-500 hover:text-black transition-colors"}><i className={"fas fa-gift mr-1"}></i> THƯỞNG</button>
                                       <button onClick={(e) => { e.stopPropagation(); const defaultAcc = (erpData?.Accounts || []).find(a => (a.accountName || a.name) === 'Công Ty') || (erpData?.Accounts || [])[0]; setPayrollAction({ type: 'tam_ung', target: p.user, amount: '', note: '', accountId: defaultAcc?.id || '' }) }} style={{ backgroundColor: '#4c0519', color: '#fb7185', borderColor: '#881337' }} className={"flex-1 py-2 font-black rounded-lg text-[10px] border hover:bg-rose-500 hover:text-white transition-colors"}><i className={"fas fa-hand-holding-usd mr-1"}></i> TẠM ỨNG</button>

                                       ) : (
                                           <button onClick={(e) => { e.stopPropagation(); const defaultAcc = (erpData?.Accounts || []).find(a => (a.accountName || a.name) === 'Công Ty') || (erpData?.Accounts || [])[0]; setPayrollAction({ type: 'thanh_toan', target: p.user, amount: p.conCanTra, note: `Thanh toán dứt điểm lương`, accountId: defaultAcc?.id || '' }) }} style={{ backgroundColor: '#064e3b', color: '#34d399', borderColor: '#065f46' }} className={"flex-[1.5] py-2 font-black rounded-lg text-[10px] border hover:bg-[#10b981] hover:text-black transition-colors"}><i className={"fas fa-check-double mr-1"}></i> TRẢ LƯƠNG</button>
                                       )}
                                       </>
                                   )}
                              </div>

                              {p.renderPrintDiv()}
                          </div>
                      )}
                  </div>
              ))}
              </div>
          </div>

          <div className={"fixed inset-0 bg-black/80 flex items-center justify-center z-[1000] p-4 backdrop-blur-sm animate-fade-in"}>

                      {payrollAction.type === 'ket_chuyen_no' ? (
                          <>
                              <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-center mb-3">

                                  <div className="text-red-500 text-xl font-black">-{formatMoney(payrollAction.amount)}đ</div>
                              </div>
                              <div className="space-y-2 mt-3">
                                  <label className={"text-gray-400 font-bold block mb-1 text-[11px] uppercase"}>Chọn Phương Án Xử Lý</label>

                                      <div className="flex items-center gap-2">
                                          <input type="radio" name="debt-mode" checked={payrollAction.mode === 'DEBT_NEXT_MONTH'} onChange={() => setPayrollAction({...payrollAction, mode: 'DEBT_NEXT_MONTH'})} className="accent-red-500" />
                                          <span className={`font-bold ${payrollAction.mode === 'DEBT_NEXT_MONTH' ? 'text-red-500' : 'text-gray-300'} text-[12px]`}>Kết chuyển Nợ Tháng Trước (Trừ sạch vào kỳ sau)</span>
                                      </div>
                                      <div className="text-gray-500 text-[10px] ml-5 mt-0.5">Khuyên dùng cho khoản dư nợ &lt; 1 triệu VNĐ</div>
                                  </label>
                                  <label className={`block border ${payrollAction.mode === 'LOAN_INSTALLMENT' ? 'border-purple-500 bg-purple-500/10' : 'border-[#333] bg-[#0a0a0a]'} rounded-lg p-2.5 cursor-pointer hover:border-purple-500/50 transition-colors`}>

                                          <input type="radio" name="debt-mode" checked={payrollAction.mode === 'LOAN_INSTALLMENT'} onChange={() => setPayrollAction({...payrollAction, mode: 'LOAN_INSTALLMENT'})} className="accent-purple-500" />
                                          <span className={`font-bold ${payrollAction.mode === 'LOAN_INSTALLMENT' ? 'text-purple-400' : 'text-gray-300'} text-[12px]`}>Chuyển thành Khoản Vay Nội Bộ (Trả góp)</span>
                                      </div>
                                      <div className="text-gray-500 text-[10px] ml-5 mt-0.5">Khuyên dùng cho dư nợ lớn để tránh âm lương kỳ sau</div>
                                  </label>
                              </div>
                              {payrollAction.mode === 'LOAN_INSTALLMENT' && (
                                  <div className="mt-3 animate-fade-in pl-5 border-l-2 border-purple-500/50 ml-1">
                                      <label className={"text-purple-400 font-bold block mb-1 text-[11px]"}>Mức trừ góp mỗi tháng (VNĐ)</label>
                                      <input type="number" value={payrollAction.monthlyDeduction} onChange={e => setPayrollAction({...payrollAction, monthlyDeduction: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 font-black outline-none text-purple-400 focus:border-purple-500" placeholder="VD: 1000000" />
                                  </div>
                              )}
                          </>
                      ) : (
                          <>
                          <div>
                              <label className={"text-gray-400 font-bold block mb-1"}>Số tiền (VNĐ)</label>
                              <input type="number" value={payrollAction.amount} onChange={e => setPayrollAction({...payrollAction, amount: e.target.value})} className={`w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 font-black outline-none ${payrollAction.type === 'thuong' ? 'text-amber-500 focus:border-amber-500' : (payrollAction.type === 'tam_ung' || payrollAction.type === 'cho_vay' ? 'text-rose-500 focus:border-rose-500' : 'text-[#10b981] focus:border-[#10b981]')}`} placeholder="0" />
                          </div>
                          <div>
                              <label className={"text-gray-400 font-bold block mb-1"}>Ghi chú / Lý do</label>
                              <input type="text" value={payrollAction.note} onChange={e => setPayrollAction({...payrollAction, note: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white outline-none focus:border-blue-500" placeholder="Nhập lý do chi..." />
                          </div>

                              <div className={"flex gap-3"}>
                                  <div className={"flex-1"}>
                                      <label className={"text-gray-400 font-bold block mb-1"}>Ngày cho vay</label>

                                  </div>
                                  <div className={"flex-1"}>
                                      <label className={"text-gray-400 font-bold block mb-1"}>Ngày cần thu</label>
                                      <input type="date" value={payrollAction.dueDate || ''} onChange={e => setPayrollAction({...payrollAction, dueDate: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none focus:border-purple-500" />
                                  </div>
                              </div>

                          {payrollAction.type === 'thanh_toan' && (
                              <div>
                                  <label className={"text-gray-400 font-bold block mb-1"}>Trích từ tài khoản</label>
                                  <select 
                                      value={payrollAction.accountId} 
                                      onChange={e => setPayrollAction({...payrollAction, accountId: e.target.value})} 
                                      className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white outline-none font-bold focus:border-blue-500"

                                          <option key={acc.id} value={acc.id}>
                                              {acc.accountName || acc.name} ({Number(acc.balance || 0).toLocaleString('vi-VN')}đ)
                                          </option>
                                      ))}
                                  </select>
                              </div>
                          )}
                          </>
                      )}

                  <div className={"flex gap-2 mt-5"}>
                      <button onClick={() => setPayrollAction(null)} className={"flex-1 py-2.5 bg-[#222] text-gray-400 font-black rounded-xl"}>HỦY BỎ</button>

              </div>

                  <div className={"space-y-3 text-[11px]"}>
                      {canEditAttendance && (
                          <div>
                              <label className={"text-gray-400 font-bold block mb-1"}>Nhân sự báo nghỉ</label>
                              <select value={leaveForm.user || currentUser} onChange={e=>setLeaveForm({...leaveForm, user: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none"}>
                                  <option value={currentUser}>{currentUser} (Bản thân)</option>
                                  {users.filter(u => u !== currentUser).map(u => (
                                      <option key={u} value={u}>{u}</option>
                                  ))}
                              </select>
                          </div>
                      )}
                      <div>
                          <label className={"text-gray-400 font-bold block mb-1"}>Ngày nghỉ</label>
                          <input type="date" value={leaveForm.date} onChange={e=>setLeaveForm({...leaveForm, date: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none"} />
                      </div>
                      <div>
                          <label className={"text-gray-400 font-bold block mb-1"}>Ca nghỉ</label>
                          <select value={leaveForm.shift} onChange={e=>setLeaveForm({...leaveForm, shift: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none"}>
                              <option value="Cả Ngày">Cả Ngày</option>
                              <option value="Sáng">Ca Sáng</option>
                              <option value="Chiều">Ca Chiều</option>
                              <option value="Tối">Ca Tối</option>
                          </select>
                      </div>
                      <div>
                          <label className={"text-gray-400 font-bold block mb-1"}>Lý do</label>
                          <textarea value={leaveForm.note} onChange={e=>setLeaveForm({...leaveForm, note: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white min-h-[60px] outline-none"} placeholder="Ghi rõ lý do xin nghỉ..."></textarea>

                  </div>
                  <div className={"flex gap-2 mt-5"}>

                      <button onClick={submitLeave} className={"flex-1 py-2 bg-[#3b82f6] text-white font-black rounded-xl text-[11px]"}>GỬI YÊU CẦU</button>
                  </div>
              </div>
          </div>

          <div className={"fixed inset-0 bg-black/85 flex items-center justify-center z-[9999] p-3 sm:p-4 backdrop-blur-md animate-fade-in overflow-y-auto"}>
