<script type="text/babel">
    // =========================================================================
    // 👥 FILE: Tab_HR.txt
    // CHỨC NĂNG: Trung Tâm Nhân Sự (Chấm Công, Giao Việc KPI, Bảng Lương)
    // NÂNG CẤP: Lọc thời gian theo Tháng (Tùy chỉnh) & Phân quyền RBAC CHUẨN CHỈ
    // =========================================================================
    // HÀM SO KHỚP TÊN NHÂN SỰ TOÀN DIỆN (Hỗ trợ họ tên đầy đủ & tên gọi)
    const matchUser = (u1, u2) => {
        if (!u1 || !u2) return false;
        const s1 = String(u1).toLowerCase().trim();
        const s2 = String(u2).toLowerCase().trim();
        if (s1 === s2) return true;
        if (s1.includes(s2) || s2.includes(s1)) return true;
        const c1 = s1.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
        const c2 = s2.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
        return c1 === c2 || c1.includes(c2) || c2.includes(c1);
    };

    const formatDR = (s, e) => {
        if (!s && !e) return '';
        const f = d => d ? d.substring(5, 10).split('-').reverse().join('/') : '';
        if (s && e && s === e) return f(s);
        if (s && e) return `${f(s)} - ${f(e)}`;
        return f(s || e);
    };

    const HRTab = React.memo(function HRTab({ orders: propOrders, documents, hasPerm, attendance, erpData, userConfigs, prodItems, packings, pushDeltas, triggerToast }) {
        const currentUser = localStorage.getItem('rf_user') || '';
        const currentRole = localStorage.getItem('rf_role') || '';
        const isBoss = localStorage.getItem('rf_boss') === 'true';

        // PHÂN QUYỀN CHUẨN CHỈ: Quản lý nhân sự không được phép sửa công nữa
        const canEditAttendance = (hasPerm && hasPerm('HR_PAYROLL')) || isBoss;
        const canManagePayroll = isBoss || String(currentRole).toUpperCase() === 'KẾ TOÁN' || String(currentRole).toUpperCase() === 'TỐI CAO';
        const canPenalize = isBoss || ['QUẢN LÝ NHÂN SỰ', 'QUẢN LÝ KHO', 'QUẢN LÝ BÁN HÀNG', 'TỐI CAO'].includes(String(currentRole).toUpperCase());

        const formatMoney = (val) => Math.ceil(Number(val || 0)).toLocaleString('vi-VN');
        const cleanNumber = (val) => {
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            if (!val) return 0;
            const str = String(val).trim().replace(/,/g, '.');
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        };


        const [openSection, setOpenSection] = React.useState({});
        const toggleSection = (user, section, e) => {
            if (e) e.stopPropagation();
            setOpenSection(prev => ({ ...prev, [`${user}_${section}`]: !prev[`${user}_${section}`] }));
        };

        const [expandedKPIs, setExpandedKPIs] = React.useState({});
        const toggleKPIExpand = (user) => setExpandedKPIs(prev => ({ ...prev, [user]: !prev[user] }));

        const [subTab, setSubTab] = React.useState('ATTENDANCE');
        const [attViewMode, setAttViewMode] = React.useState('CARDS'); // 'CARDS' | 'MATRIX'
        const [editingLeave, setEditingLeave] = React.useState(null);
        const [expModalUser, setExpModalUser] = React.useState(null); // Quản lý modal lịch sử EXP & lộ trình cấp độ

        const [filter, setFilter] = React.useState('Tháng Này');
        const [customMonth, setCustomMonth] = React.useState(() => new Date().toISOString().slice(0, 7)); // Format YYYY-MM
        const currentDate = new Date().toISOString().split('T')[0];

        const isDateInRange = (dateStr, filterStr = filter, customM = customMonth) => {
            if (!dateStr) return false;
            const d = new Date(dateStr); const today = new Date();
            if (filterStr === 'Tháng Này') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
            if (filterStr === 'Tháng Trước') {
                const m = new Date(today); m.setMonth(m.getMonth() - 1);
                return d.getMonth() === m.getMonth() && d.getFullYear() === m.getFullYear();
            }
            if (filterStr === 'Tuỳ Chỉnh' || filterStr === 'Chọn Tháng') {
                if (!customM) return true;
                const [year, month] = customM.split('-');
                return d.getFullYear() === parseInt(year, 10) && d.getMonth() === (parseInt(month, 10) - 1);
            }
            return false;
        };

        const filterMonth = filter === 'Tuỳ Chỉnh' ? customMonth : new Date().toISOString().slice(0, 7);
        const periodLabel = filter === 'Tuỳ Chỉnh' ? (customMonth ? `Tháng ${customMonth.split('-')[1]}/${customMonth.split('-')[0]}` : filter) : filter;

        // Ép ngày nhập tay vào đúng với kỳ lương đang xem để data không bay sang tháng sau
        const payrollTargetDate = React.useMemo(() => {
            if (filter === 'Tháng Trước') {
                const d = new Date(); d.setMonth(d.getMonth() - 1);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-28`;
            }
            if (filter === 'Tuỳ Chỉnh') return `${customMonth}-28`;
            return currentDate;
        }, [filter, customMonth, currentDate]);

        const users = userConfigs?.users || [];
        const rawAttData = attendance || [];
        const bpData = erpData?.BonusPenalty || [];
        const kpiData = erpData?.KPI_Progress || [];
        const xuSheetData = erpData?.ThongKe_TichLuyXu || erpData?.xuTransactions || [];
        const safeProdItems = prodItems || [];
        const safePackings = packings || [];
        const orders = propOrders || erpData?.Orders || erpData?.orders || [];

        // HÀM SO KHỚP TÊN NHÂN SỰ TOÀN DIỆN (Hỗ trợ họ tên đầy đủ & tên gọi)
        const matchUser = (u1, u2) => {
            if (!u1 || !u2) return false;
            const s1 = String(u1).toLowerCase().trim();
            const s2 = String(u2).toLowerCase().trim();
            if (s1 === s2) return true;
            if (s1.includes(s2) || s2.includes(s1)) return true;
            const c1 = s1.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
            const c2 = s2.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
            return c1 === c2 || c1.includes(c2) || c2.includes(c1);
        };

        // O(1) FAST LOOKUP MAP FOR ORDERS (Prevents UI freezing / lag on render)
        const orderLookupMap = React.useMemo(() => {
            const map = new Map();
            (orders || []).forEach(o => {
                if (!o) return;
                if (o.id) {
                    const sId = String(o.id).trim();
                    map.set(sId, o);
                    map.set(sId.toLowerCase(), o);
                }
                if (o.orderCode) {
                    const sCode = String(o.orderCode).trim();
                    map.set(sCode, o);
                    map.set(sCode.toLowerCase(), o);
                }
            });
            return map;
        }, [orders]);

        const getOrderMatch = React.useCallback((pOrd) => {
            if (!pOrd) return null;
            const str = String(pOrd).trim();
            if (!str) return null;
            let direct = orderLookupMap.get(str) || orderLookupMap.get(str.toLowerCase());
            if (direct) return direct;
            if (str.includes('|') || str.includes('_')) {
                const parts = str.split(/[|_]/).map(x => x.trim()).filter(Boolean);
                for (const part of parts) {
                    const match = orderLookupMap.get(part) || orderLookupMap.get(part.toLowerCase());
                    if (match) return match;
                }
            }
            return null;
        }, [orderLookupMap]);

                        ...userConfigs,
                        salaries: updatedSalaries

                        id: `AUDIT_SALARY_${Date.now()}_${Math.floor(Math.random() * 1000)}`,

                        amount: 0,
                        type: 'Điều Chỉnh Lương',
                        date: new Date().toISOString().slice(0, 10),

                        orderCode: 'SYS_AUDIT'

                    if (pushDeltas) {
                        pushDeltas({ UserConfigs: [newUserConfigs], BonusPenalty: [auditLog] }, `Đã lưu ${displayLabel} cho ${p.user}!`, 'fa-check');
                    } else {
                        triggerToast('Lỗi: Thiếu quyền đồng bộ', 'fa-times', 'danger');
                    }
                }
            });
        };

        const handleDirectBonusEdit = (e, p, type, currentAmount) => {
            e.stopPropagation();
            Swal.fire({
                title: `Sửa ${type}`,

              </div>

              <div class="text-[10px] text-gray-500 mt-2"><i class="fas fa-history"></i> Có lưu vết (Audit Log).</div>
          `,

                confirmButtonText: 'Lưu thay đổi',
                cancelButtonText: 'Hủy',
                background: '#1a1a1a',
                color: '#fff',
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#333',
                preConfirm: () => {
                    return document.getElementById('swal-bonus-input').value;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const newVal = result.value;
                    const cleanVal = newVal.replace(/[^0-9-]/g, '');
                    const numVal = Number(cleanVal) || 0;

                    const bpId = `BP_${type.replace(/ /g, '')}_${p.user}_${filterMonth}`;
                    const newBP = {
                        id: bpId,
                        user: p.user,
                        amount: numVal,
                        type: type,
                        date: payrollTargetDate,
                        note: 'Sửa trực tiếp',
                        isResolved: true
                    };

                    // LOG AUDIT
                    const auditLog = {
                        id: `AUDIT_BONUS_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
                        user: p.user,
                        amount: 0,
                        type: 'Điều Chỉnh Lương',
                        date: new Date().toISOString().slice(0, 10),
                        note: `[BẢO MẬT] ${currentUser} đổi ${type}: ${formatMoney(currentAmount)}đ -> ${formatMoney(numVal)}đ`,
                        orderCode: 'SYS_AUDIT'
                    };

                    if (pushDeltas) {
                        pushDeltas({ BonusPenalty: [newBP, auditLog] }, `Đã lưu ${type} cho ${p.user}!`, 'fa-check');
                    } else {
                        triggerToast('Lỗi: Thiếu quyền đồng bộ', 'fa-times', 'danger');
                    }
                }
            });
        };

        const handleAddPrintComment = (e, p) => {
            e.stopPropagation();
            const comment = prompt(`Nhập nhận xét (hiển thị trên Phiếu Lương) cho ${p.user}:`, p.nhanXetText !== 'Không có nhận xét nào được viết tại đây.' ? p.nhanXetText : '');
            if (comment === null) return;

            const userBPs = bpData.filter(b => String(b.user).trim() === String(p.user).trim() && b.date && isDateInRange(b.date, filter, customMonth));
            const nhanXetRec = userBPs.find(b => b.type === 'Nhận Xét');

            const newBp = {
                id: nhanXetRec ? nhanXetRec.id : `BP_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
                user: p.user,
                type: 'Nhận Xét',
                amount: 0,
                note: comment,
                date: nhanXetRec ? nhanXetRec.date : currentDate,
                recordedBy: currentUser,
                timestamp: new Date().toISOString()
            };

            if (pushDeltas) {
                pushDeltas({ BonusPenalty: [newBp] }, `Đã lưu nhận xét cho ${p.user}!`, 'fa-check');
            } else {
                triggerToast('Lỗi: Thiếu quyền đồng bộ', 'fa-times', 'danger');
            }
        };

        const [isGeneratingKPI, setIsGeneratingKPI] = React.useState(false);

        const handleGenerateAllKPI = () => {
            Swal.fire({
                title: 'Tạo KPI Hàng Loạt?',
                text: 'Hệ thống sẽ tính toán Lương Thời Gian và sinh KPI mục tiêu cho TOÀN BỘ nhân sự dựa trên Chức Danh (Role-Based).',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#222',
                confirmButtonText: 'Tạo Ngay'
            }).then((result) => {
                if (result.isConfirmed) {
                    setIsGeneratingKPI(true);
                    // Khởi tạo map rỗng (backend sẽ tự generate target based on Role)
                    window.runGAS('generateMonthlyKPI_All', { pin: window.adminPin || prompt('Nhập mã PIN Quản Lý:'), allStatsMap: {} })
                        .then(res => {
                            setIsGeneratingKPI(false);
                            if (res.success) {
                                Swal.fire('Thành công!', res.message, 'success');
                                if (typeof window.forceRefresh === 'function') window.forceRefresh();
                            } else {
                                Swal.fire('Lỗi', res.message, 'error');
                            }
                        })
                        .catch(err => {
                            setIsGeneratingKPI(false);
                            Swal.fire('Lỗi', String(err), 'error');
                        });
                }
            });
        };

        const [claimingIds, setClaimingIds] = React.useState([]);

        const mvpId = React.useMemo(() => {
            let maxTasks = 0; let mId = null;
            users.forEach(u => {
                const userKPIs = kpiData.filter(k => k.user === u);
                const claimed = userKPIs.filter(k => (k.isClaimed === 'true' || k.isClaimed === true));
                const monthly = claimed.filter(k => k.startTime && k.startTime.startsWith(currentDate.slice(0, 7))).length;
                if (monthly > maxTasks && monthly > 0) { maxTasks = monthly; mId = u; }
            });
            return mId;
        }, [kpiData, users, currentDate]);

        const [editingPayroll, setEditingPayroll] = React.useState(null);
        const [directPenalty, setDirectPenalty] = React.useState(null);
        const [expandedTaskMap, setExpandedTaskMap] = React.useState({});

        const formatExactDateTime = (dateStr) => {
            if (!dateStr) return '---';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return String(dateStr);
                const hours = String(d.getHours()).padStart(2, '0');
                const mins = String(d.getMinutes()).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                return `${hours}:${mins} ngày ${day}/${month}/${year}`;
            } catch (e) {
                return String(dateStr);
            }
        };

        const getLevelColorStyle = (lvl) => {
            const num = Math.max(1, Number(lvl) || 1);
            let tier = 0;
            if (num <= 9) {
                tier = 0; // Cấp 1 - 9 (Tân Thủ Khởi Nghiệp)
            } else if (num <= 14) {
                tier = 1; // Cấp 10 - 14 (Hổ Phách Tinh Anh)
            } else if (num <= 19) {
                tier = 2; // Cấp 15 - 19 (Lục Bảo Tiên Phong)
            } else if (num <= 24) {
                tier = 3; // Cấp 20 - 24 (Lam Ngọc Cao Thủ)
            } else if (num <= 29) {
                tier = 4; // Cấp 25 - 29 (Thạch Anh Huyền Bí)
            } else if (num <= 34) {
                tier = 5; // Cấp 30 - 34 (Huyết Tướng Chiến Binh)
            } else if (num <= 39) {
                tier = 6; // Cấp 35 - 39 (Hoả Phụng Hoàng)
            } else if (num <= 49) {
                tier = 7; // Cấp 40 - 49 (Thái Dương Hoàng Kim)
            } else {
                tier = 8; // Cấp 50 - 100 (Tối Cao Thần Thoại)
            }

            const styles = [
                /* Tier 0: Lvl 1-9 (Stealth Obsidian / Tân Thủ Khởi Nghiệp) */
                {
                    tier: 0,
                    tierLabel: "TÂN THỦ",

        const get100LevelInfo = (totalExp) => {
            const exp = Math.max(0, Number(totalExp) || 0);
            const MAX_EXP = 2000000000; // 2 Tỷ EXP (Lũy tiến 20 năm cống hiến)

            const getExpForLevel = (l) => {
                if (l <= 1) return 0;
                if (l >= 100) return MAX_EXP;
                // Càng lên cao càng cần nhiều EXP (Số mũ 2.35 lũy tiến chuẩn RPG)
                return Math.round(MAX_EXP * Math.pow((l - 1) / 99, 2.35));
            };

            if (exp >= MAX_EXP) {
                return {
                    level: 100,
                    currentBaseExp: MAX_EXP,
                    nextBaseExp: MAX_EXP,
                    expInLevel: 0,
                    neededForNext: 0,
                    progressPct: 100,
                    title: 'TỐI CAO GRANDMASTER',
                    colorStyle: getLevelColorStyle(100),
                    totalExp: exp
                };
            }

            let level = Math.floor(Math.pow(exp / MAX_EXP, 1 / 2.35) * 99) + 1;
            level = Math.max(1, Math.min(99, level));

            const currentBaseExp = getExpForLevel(level);
            const nextBaseExp = getExpForLevel(level + 1);
            const expInLevel = exp - currentBaseExp;
            const neededForNext = Math.max(1, nextBaseExp - currentBaseExp);
            const progressPct = Math.min(100, Math.max(0, (expInLevel / neededForNext) * 100));

            let title = 'Tân Thủ Khởi Nghiệp';
            if (level >= 90) title = 'Huyền Thoại Xưởng';
            else if (level >= 75) title = 'Đại Tôn Sư';
            else if (level >= 50) title = 'Tối Cao Thần Thoại';
            else if (level >= 40) title = 'Thái Dương Chi Tôn';
            else if (level >= 35) title = 'Hoả Phụng Tiên Phong';
            else if (level >= 30) title = 'Huyết Tướng Chiến Binh';
            else if (level >= 25) title = 'Thạch Anh Huyền Bí';
            else if (level >= 20) title = 'Lam Ngọc Cao Thủ';
            else if (level >= 15) title = 'Lục Bảo Tiên Phong';
            else if (level >= 10) title = 'Hổ Phách Tinh Anh';

            return {
                level,
                currentBaseExp,
                nextBaseExp,
                expInLevel,
                neededForNext,
                progressPct,
                title,
                colorStyle: getLevelColorStyle(level),
                totalExp: exp
            };
        };

        const extractTimeLocal = (str) => {
            if (!str) return null;
            let s = String(str).trim();
            if (s.includes('T') && s.includes('Z')) {
                const d = new Date(s);
                if (!isNaN(d.getTime())) return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }
            const match = s.match(/([0-1]?[0-9]|2[0-3]):([0-5][0-9])/);
            return match ? `${match[1].padStart(2, '0')}:${match[2]}` : null;
        };

        React.useEffect(() => {

            }, 30000);
            return () => clearInterval(interval);

        const activeShift = React.useMemo(() => {

            return dedupedRaw.map(a => {

                let tOut = extractTimeLocal(a.timeOut) || extractTimeLocal(a.afternoonOut || a.morningOut) || '';
                let penalty = Number(a.penalty || 0);
                let status = a.status;
                let shift = a.shift || (a.leaveType ? 'Nghỉ' : 'Ca Cũ');

                const isToday = a.date === currentDate;
                const isPast = a.date < currentDate;

                if (tIn && !tOut && shift !== 'Nghỉ Phép' && !a.isEdited) {
                    let isMissed = false;
                    if (shift === 'Sáng' && (isPast || (isToday && currentTimeMins >= 780))) {
                        isMissed = true; tOut = '13:00';
                    } else if (shift === 'Chiều' && (isPast || (isToday && currentTimeMins >= 1140))) {
                        isMissed = true; tOut = '19:00';
                    } else if (shift === 'Tối' && (isPast || (isToday && (currentTimeMins >= 360 && currentTimeMins < 1140)))) {
                        isMissed = true; tOut = '06:00';
                    }
                    if (isMissed) {
                        if (!String(status).includes('Quên chấm ra')) {
                            penalty += 5000; status = 'Quên chấm ra (-5k)';
                        }
                    }
                }

                let h = 0;
                const calcH = (inStr, outStr) => {
                    if (!inStr || !outStr) return 0;
                    const [inH, inM] = inStr.split(':').map(Number);
                    const [outH, outM] = outStr.split(':').map(Number);
                    let startMins = inH * 60 + inM; let endMins = outH * 60 + outM;
                    if (endMins < startMins) endMins += 24 * 60;
                    const lunchStart = 720; const lunchEnd = 840;
                    const overlapStart = Math.max(startMins, lunchStart);
                    const overlapEnd = Math.min(endMins, lunchEnd);
                    const lunchBreakMins = Math.max(0, overlapEnd - overlapStart);
                    let totalMins = (endMins - startMins) - lunchBreakMins;
                    return Math.max(0, totalMins / 60);
                };

                if (tIn && tOut) h = calcH(tIn, tOut);
                else if (a.totalHours) h = Number(String(a.totalHours).replace(/,/g, '.'));

        const handleCheckInOut = async (action, targetShift) => {

        const submitLeave = async () => {

            let totalLeaveDays = 0;

        const getDynamicKPIProgress = (k, u) => {
            if (!k) return 0;
            if (k.unit === 'Checklist') return Number(k.current) || 0;

            const unitLower = String(k.unit || '').toLowerCase().trim();
            const phase = String(k.kpiName || '').toLowerCase().trim();

            // Nếu là đơn vị đếm thủ công (Bộ, Cái, Lần, Điểm, Kiện, Xu) mà không phải các khâu sản xuất cốt lõi -> Trả về k.current đã nhập
            const isManualCount = ['bộ', 'cái', 'lần', 'xu', 'điểm'].includes(unitLower) &&
                !phase.includes('dựng khung') && !phase.includes('gia cố') && !phase.includes('cắt dán') &&
                !phase.includes('gọt keo') && !phase.includes('đóng gói') && !phase.includes('khâu 1') && !phase.includes('khâu 2');
            if (isManualCount) {
                return Number(k.current) || 0;
            }

            let count = 0;

            const normalizeToYMD = (d, isEnd = false) => {
                if (!d) return '';
                if (d instanceof Date) {
                    if (isNaN(d.getTime())) return '';
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${y}-${m}-${day}`;
                }
                let str = String(d).trim().split(' ')[0].split('T')[0];
                const curYear = new Date().getFullYear();
                if (str.includes('/')) {
                    const parts = str.split('/');
                    if (parts.length === 3) {
                        if (parts[2].length === 4) {
                            return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        } else if (parts[0].length === 4) {
                            return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                        }
                    } else if (parts.length === 2) {
                        if (parts[1].length === 4) {
                            const m = parseInt(parts[0], 10);
                            const y = parseInt(parts[1], 10);
                            if (isEnd) {
                                const lastDay = new Date(y, m, 0).getDate();
                                return `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
                            }
                            return `${y}-${String(m).padStart(2, '0')}-01`;
                        }
                        // '01/08' hoặc '31/08' -> DD/MM
                        return `${curYear}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                    }
                } else if (str.includes('-')) {
                    const parts = str.split('-');
                    if (parts.length === 3) {
                        if (parts[0].length === 4) {
                            return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                        } else if (parts[2].length === 4) {
                            return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        }
                    } else if (parts.length === 2) {
                        if (parts[0].length === 4) {
                            const y = parseInt(parts[0], 10);
                            const m = parseInt(parts[1], 10);
                            if (isEnd) {
                                const lastDay = new Date(y, m, 0).getDate();
                                return `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
                            }
                            return `${parts[0]}-${parts[1].padStart(2, '0')}-01`;
                        }
                        return `${curYear}-${parts[0].padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
                    }
                }
                return str;
            };

            const s = normalizeToYMD(k.startTime, false) || '2000-01-01';
            const e = normalizeToYMD(k.endTime, true) || '2099-12-31';
            const inR = (d) => {
                if (!d) return false;
                const dt = normalizeToYMD(d);

            // 1. KPI BÁN HÀNG / DOANH THU (Chỉ áp dụng khi đơn vị tính là VNĐ / Tiền tệ)

            if ((phase.includes('doanh thu') || phase.includes('bán hàng') || phase.includes('sale') || phase.includes('chốt đơn')) && isRevenueUnit) {
                let revTotal = 0;
                let revPending = 0;
                const allOrders = orders || erpData?.orders || erpData?.Orders || [];
                const uTarget = String(u || '').toLowerCase().trim();
                const isFounderOrBoss = uTarget.includes('nguyễn ngọc tiến') || uTarget.includes('tiến') || uTarget.includes('founder') || uTarget.includes('giám đốc') || uTarget.includes('tối cao') || uTarget.includes('toàn xưởng');

                const parseCleanRev = (rawRev, ch = '') => {
                    if (rawRev === null || rawRev === undefined || rawRev === '') return 0;
                    let num = 0;
                    if (typeof rawRev === 'number') {
                        num = rawRev;
                    } else {
                        let str = String(rawRev).trim();
                        // Xoá ký tự tiền tệ, chữ cái và khoảng trắng thừa
                        str = str.replace(/[đĐ\sVNDvnd$฿₱RM]/g, '').trim();
                        if (!str) return 0;

                        if (str.includes('.') && str.includes(',')) {
                            if (str.lastIndexOf('.') > str.lastIndexOf(',')) {
                                str = str.replace(/,/g, '');
                            } else {
                                str = str.replace(/\./g, '').replace(/,/g, '.');
                            }
                        } else if (str.includes(',')) {
                            if (/\,\d{3}($|\D)/.test(str) || /^\d{1,3}(,\d{3})+$/.test(str)) {
                                str = str.replace(/,/g, '');
                            } else {
                                str = str.replace(/,/g, '.');
                            }
                        } else if (str.includes('.')) {
                            const parts = str.split('.');
                            if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3 && parseInt(parts[0]) > 0)) {
                                str = str.replace(/\./g, '');
                            }
                        }
                        num = parseFloat(str);
                    }
                    if (isNaN(num) || !isFinite(num) || num <= 0) return 0;
                    if (num > 1000000000 && Number.isInteger(num)) return 0;
                    let channelStr = String(ch || '').toUpperCase().trim();
                    let rate = 1;
                    if (channelStr.includes('USD') || (channelStr.includes('XUẤT KHẨU') && num < 10000)) {
                        rate = 25500;
                    }
                    return Math.round(num * rate);
                };

                const isUserMatch = (oUser, targetUser, oCh = '') => {
                    if (!targetUser) return false;
                    const uT = String(targetUser).toLowerCase().trim();
                    const uOrder = String(oUser || '').toLowerCase().trim();
                    const ch = String(oCh || '').toLowerCase().trim();

                    // 1. Nếu đơn có gán responsibleUser đích danh
                    if (uOrder) {
                        if (uOrder === uT) return true;
                        if (uOrder.includes('diệu hương') && uT.includes('diệu hương')) return true;
                        if (uOrder.includes('hương') && uT.includes('hương')) return true;
                        if (uOrder.includes('dương') && uT.includes('dương')) return true;
                        if (uOrder.includes('tân') && uT.includes('tân')) return true;

                    if (uT.includes('diệu hương') || uT.includes('hương')) {

                            ch.includes('facebook') || ch.includes('fb') ||
                            ch.includes('zalo') || ch.includes('tư vấn') ||

                            ch.includes('khách lẻ') || ch.includes('cửa hàng') ||

                        return isDirectSaleChannel;

                    return false;

                allOrders.forEach(o => {

                    const rawStatus = String(o.status || '').toUpperCase().trim();

                    // Nhận diện đơn trả hàng (khớp Tab Đơn Hàng)
                    const isReturned = st === 'HÀNG HOÀN' || st === 'KIỂM HÀNG HOÀN' || st === 'HÀNG HOÀN CHỜ XỬ LÝ' || st.includes('HOÀN CHỜ XỬ') || 
                        rawStatus === 'HÀNG HOÀN' || rawStatus.includes('HOÀN TRẢ') || 
                        Boolean(o.returnedAt) || 
                        note.includes('[kn-thang]') || note.includes('[kn-thua]') || note.includes('hàng hoàn') || note.includes('trả hàng');

                    // Nhận diện đơn huỷ triệt để (khớp Tab Đơn Hàng)
                    const isCancelled = !isReturned && (
                        st === 'ĐƠN HUỶ' || st === 'HUỶ' || st === 'ĐƠN HỦY' || st === 'HỦY' || 
                        st.includes('HUỶ') || st.includes('HỦY') || st.includes('CANCEL') ||
                        rawStatus.includes('HUỶ') || rawStatus.includes('HỦY') || rawStatus.includes('CANCEL') ||
                        rawStatus.includes('ยกเลิก') ||
                        note.includes('[đã hủy]') || note.includes('[đơn huỷ]') || note.includes('[đơn hủy]') || 
                        note.includes('[huỷ]') || note.includes('[hủy]') || note.includes('hủy đơn') || note.includes('huỷ đơn') ||
                        Boolean(o.isCancelled)
                    );

                    if (isCancelled || isReturned) return;

                    // Xác định ngày lọc theo chu kỳ
                    let dateToFilter = o.date || o.createdAt;
                    if (o.isReconciled || o.reconciledAt || st === 'HOÀN THÀNH' || st === 'ĐỐI SOÁT THÀNH CÔNG') {
                        dateToFilter = o.reconciledAt || o.updatedAt || o.date || o.createdAt;
                    } else if (st === 'ĐÃ BÀN GIAO' || st === 'ĐÃ NHẬP KHO') {
                        dateToFilter = o.updatedAt || o.date || o.createdAt;
                    }

                    const isClosed = (st === 'HOÀN THÀNH' || st === 'ĐỐI SOÁT THÀNH CÔNG' || st === 'ĐÃ BÀN GIAO' || st === 'ĐÃ NHẬP KHO');
                    let inPeriod = false;
                    if (inR(dateToFilter) || inR(o.date) || inR(o.createdAt)) {
                        inPeriod = true;
                    } else if (!isClosed) {
                        // Đơn đang chạy trong tháng hiện tại
                        const nowYM = new Date().toISOString().slice(0, 7);
                        if (s.startsWith(nowYM) || e.startsWith(nowYM)) {
                            inPeriod = true;
                        }
                    }

                    if (!inPeriod) return;

                    const orderRev = parseCleanRev(o.revenue, oChannel);
                    if (orderRev <= 0) return;

                    // A. NGUYỄN NGỌC TIẾN / FOUNDER / TOÀN XƯỞNG:
                    // Đo doanh thu tổng toàn bộ các kênh bán hàng (khớp 100% với Doanh Thu Tổng bên Tab Đơn Hàng)
                    if (isFounderOrBoss) {
                        revTotal += orderRev;
                        return;
                    }

                    // B. NHÂN SỰ SALES LẺ (Diệu Hương...):
                    if (oChannel.includes('Cộng Tác Viên') || oChannel === 'CTV') return;
                    const oUser = o.responsibleUser || o.sale || '';
                    if (isUserMatch(oUser, u, oChannel)) {
                        revTotal += orderRev;
                    }
                });

                return { current: Math.round(revTotal), pending: 0, reconciled: Math.round(revTotal) };
            }

            // 1.1. KPI LỢI NHUẬN RÒNG (% Net Profit / P&L) — QUÉT 100% DỮ LIỆU THỰC TẾ TỪ CSDL
            if ((phase.includes('lợi nhuận') || phase.includes('net profit') || phase.includes('p&l')) && (unitLower === '%' || phase.includes('%') || unitLower === '')) {
                const allOrders = orders || erpData?.orders || erpData?.Orders || [];
                const allTransactions = erpData?.Transactions || erpData?.transactions || [];
                let totalPeriodRev = 0;
                let totalCOGS = 0;
                let totalPlatformFee = 0;
                let totalDiscount = 0;

                allOrders.forEach(o => {
                    const oChannel = String(o.channel || '').trim();
                    if (oChannel === 'Sản Xuất Tồn' || oChannel === 'Sản Xuất Bù Kho') return;

                    const st = String(o._effectiveStatus || o.status || '').toUpperCase().trim();
                    const rawStatus = String(o.status || '').toUpperCase().trim();
                    const note = String(o.note || '').toLowerCase();

                    const isReturned = st === 'HÀNG HOÀN' || st === 'KIỂM HÀNG HOÀN' || st === 'HÀNG HOÀN CHỜ XỬ LÝ' || st.includes('HOÀN CHỜ XỬ') || 
                        rawStatus === 'HÀNG HOÀN' || rawStatus.includes('HOÀN TRẢ') || 
                        Boolean(o.returnedAt) || 
                        note.includes('[kn-thang]') || note.includes('[kn-thua]') || note.includes('hàng hoàn') || note.includes('trả hàng');

                    const isCancelled = !isReturned && (
                        st === 'ĐƠN HUỶ' || st === 'HUỶ' || st === 'ĐƠN HỦY' || st === 'HỦY' || 
                        st.includes('HUỶ') || st.includes('HỦY') || st.includes('CANCEL') ||
                        rawStatus.includes('HUỶ') || rawStatus.includes('HỦY') || rawStatus.includes('CANCEL') ||
                        rawStatus.includes('ยกเลิก') ||
                        note.includes('[đã hủy]') || note.includes('[đơn huỷ]') || note.includes('[đơn hủy]') || 
                        note.includes('[huỷ]') || note.includes('[hủy]') || note.includes('hủy đơn') || note.includes('huỷ đơn') ||
                        Boolean(o.isCancelled)
                    );

                    let dateToFilter = o.date || o.createdAt;
                    if (o.isReconciled || o.reconciledAt || st === 'HOÀN THÀNH' || st === 'ĐỐI SOÁT THÀNH CÔNG') {
                        dateToFilter = o.reconciledAt || o.updatedAt || o.date || o.createdAt;
                    } else if (st === 'ĐÃ BÀN GIAO' || st === 'ĐÃ NHẬP KHO') {
                        dateToFilter = o.updatedAt || o.date || o.createdAt;
                    }

                    const isClosed = (st === 'HOÀN THÀNH' || st === 'ĐỐI SOÁT THÀNH CÔNG' || st === 'ĐÃ BÀN GIAO' || st === 'ĐÃ NHẬP KHO');
                    let inPeriod = false;
                    if (inR(dateToFilter) || inR(o.date) || inR(o.createdAt)) {
                        inPeriod = true;
                    } else if (!isClosed) {
                        const nowYM = new Date().toISOString().slice(0, 7);
                        if (s.startsWith(nowYM) || e.startsWith(nowYM)) inPeriod = true;
                    }

                    if (!inPeriod) return;

                    const parseCleanRev = (rawRev, ch = '') => {
                        if (rawRev === null || rawRev === undefined || rawRev === '') return 0;
                        let num = typeof rawRev === 'number' ? rawRev : parseFloat(String(rawRev).replace(/[đĐ\sVNDvnd$฿₱RM]/g, '').replace(/,/g, ''));
                        if (isNaN(num) || num <= 0) return 0;
                        if (num > 100000000 && Number.isInteger(num)) return 0;
                        if (String(ch || '').toUpperCase().includes('USD') || (String(ch || '').toUpperCase().includes('XUẤT KHẨU') && num < 10000)) num *= 25500;
                        return Math.round(num);
                    };

                    const val = parseCleanRev(o.revenue, oChannel);
                    if (val <= 0) return;

                    totalPeriodRev += val;

                    // Giá vốn thực tế (COGS)
                    let cogsVal = Number(o.cogs) || 0;
                    if (cogsVal <= 0 && o.accessories) {
                        try {
                            const accs = typeof o.accessories === 'string' ? JSON.parse(o.accessories) : o.accessories;
                            if (Array.isArray(accs)) {
                                accs.forEach(a => {
                                    const cost = Number(a.costPrice || a.cogs || 0);
                                    const qty = Number(a.quantity || a.qty || 1);
                                    cogsVal += (cost * qty);
                                });
                            }
                        } catch (e) {}
                    }
                    if (cogsVal <= 0) {
                        cogsVal = Math.round(val * 0.165); // Giá vốn chuẩn xưởng Rich Fish (~16.5% doanh thu theo Báo Cáo Kênh)
                    }

                    // Chi phí sàn thực tế
                    const feeVal = (Number(o.feeFixed) || 0) + (Number(o.feeService) || 0) + (Number(o.feePayment) || 0) + (Number(o.feeAffiliate) || 0) + (Number(o.tax) || 0);
                    const discountVal = Number(o.shopVoucher) || Number(o.discount) || 0;

                    totalCOGS += cogsVal;
                    totalPlatformFee += (feeVal > 0 ? feeVal : Math.round(val * 0.156)); // Chi phí sàn thực tế (~15.6% doanh thu sàn)
                    totalDiscount += discountVal;
                });

                // Quét 100% Chi Phí Lương & Vận Hành Thực Tế từ Sổ Quỹ (Transactions)
                let actualSalaryExpense = 0;
                let actualOperationExpense = 0;

                allTransactions.forEach(t => {
                    const tDate = String(t.date || t.createdAt || '').slice(0, 10);
                    if (!tDate || !inR(tDate)) return;

                    const cat = String(t.category || '').toLowerCase();
                    const type = String(t.type || '').toUpperCase();
                    const title = String(t.title || t.note || '').toLowerCase();
                    const amt = Math.abs(Number(t.amount || 0));
                    if (amt <= 0) return;

                    // Bỏ qua giao dịch nội bộ / chuyển khoản / rút quỹ / chờ xử lý
                    if (type === 'TRANSFER' || type === 'CHUYỂN KHOẢN' || cat.includes('chuyển khoản') || cat.includes('nội bộ') || cat.includes('rút tiền') || cat.includes('chờ xử lý') || cat.includes('chờ phân bổ')) {
                        return;
                    }

                    // Chi phí lương
                    if (cat.includes('lương') || title.includes('lương') || cat.includes('trả lương') || cat.includes('tạm ứng')) {
                        actualSalaryExpense += amt;
                    }
                    // Chi phí vận hành / mặt bằng / điện nước / marketing / vật tư
                    else if (
                        cat.includes('vận hành') || cat.includes('mặt bằng') || cat.includes('điện nước') || 
                        cat.includes('tiếp khách') || cat.includes('vật tư') || cat.includes('bao bì') || 
                        cat.includes('quảng cáo') || cat.includes('ads') || cat.includes('marketing') ||
                        ((type === 'EXPENSE' || type === 'CHI') && !cat.includes('nhập hàng') && !cat.includes('nhà cung cấp') && !cat.includes('trả nợ') && !cat.includes('đối tác') && !cat.includes('chờ'))
                    ) {
                        actualOperationExpense += amt;
                    }
                });

                const totalRealExpense = actualSalaryExpense + actualOperationExpense;
                // Nếu sổ quỹ chưa chốt chi trong kỳ, hệ thống quét bảng lương và chi phí cơ sở
                const finalOperatingExpense = totalRealExpense > 0 ? totalRealExpense : (totalPeriodRev * 0.20);

                const dynamicNetProfit = totalPeriodRev - totalCOGS - totalPlatformFee - totalDiscount - finalOperatingExpense;
                const margin = totalPeriodRev > 0 ? ((dynamicNetProfit / totalPeriodRev) * 100) : 0;
                return Math.max(0, Math.round(margin * 10) / 10);
            }

            // 2. KPI SẢN XUẤT THEO TỪNG KHÂU (CHỈ ÁP DỤNG KHI KHÔNG PHẢI KPI TỶ LỆ / % / KCS / KỶ LUẬT)
            const isPercentKPI = unitLower === '%' || phase.includes('tỷ lệ') || phase.includes('sla') || phase.includes('kcs') || phase.includes('vòng 1') || phase.includes('kỷ luật') || phase.includes('chấm công') || phase.includes('5s');

            if (!isPercentKPI) {
                if (phase.includes('khâu 1') || phase.includes('cắt') || phase.includes('dán') || phase.includes('dựng khung') || phase.includes('phase1')) {

                    });
                } else if (phase.includes('đóng gói') || phase.includes('pack')) {
                    safePackings.forEach(pk => {
                        if (String(pk.user).trim() === String(u).trim() && pk.status === 'Done' && inR(pk.endTime || pk.date)) {
                            count++;
                        }
                    });
                } else if (phase.includes('sản xuất') || phase.includes('sản lượng') || phase.includes('khâu hoàn thành') || phase.includes('tổng khâu')) {
                    safeProdItems.forEach(p => {
                        const u1 = p.p1_user || p.phases?.phase1?.user;
                        const s1 = p.p1_status || p.phases?.phase1?.status;
                        const t1 = p.p1_endTime || p.phases?.phase1?.endTime || p.date;
                        if (String(u1).trim() === String(u).trim() && s1 === 'Done' && inR(t1)) count++;

                        const s2 = p.p2_status || p.phases?.phase2?.status;
                        const t2 = p.p2_endTime || p.phases?.phase2?.endTime || p.date;
                        if (String(u2).trim() === String(u).trim() && s2 === 'Done' && inR(t2)) count++;
                    });
                    safePackings.forEach(pk => {
                        if (String(pk.user).trim() === String(u).trim() && pk.status === 'Done' && inR(pk.endTime || pk.date)) count++;
                    });
                }
            } else {
                // 3. CÁC KPI TỶ LỆ / % / SLA / KCS
                // 3.1. SLA Cấp Phôi Kính Ca Sáng (Hoàng Dương)
                if (phase.includes('ca sáng') || (phase.includes('sla') && phase.includes('phôi'))) {
                    let totalP1 = 0;
                    let onTimeP1 = 0;
                    safeProdItems.forEach(p => {
                        const user = p.p1_user || p.phases?.phase1?.user;
                        const status = p.p1_status || p.phases?.phase1?.status;
                        const endTime = p.p1_endTime || p.phases?.phase1?.endTime;
                        if (String(user).trim() === String(u).trim() && (status === 'Done' || status === 'ĐÃ XONG') && inR(endTime)) {
                            totalP1++;
                            try {
                                const dt = new Date(endTime);
                                const hh = dt.getHours();
                                const mm = dt.getMinutes();
                                if (hh < 11 || (hh === 11 && mm <= 30)) {
                                    onTimeP1++;
                                }
                            } catch (e) { }
                        }
                    });
                    if (totalP1 > 0) return Math.round((onTimeP1 / totalP1) * 100);
                    const rawVal = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 100;
                    return Math.round(rawVal);
                }

                // 3.2. Tỷ lệ đạt chuẩn KCS Khâu 2 vòng 1 (Lại Trường Tâm)
                else if (phase.includes('kcs') || phase.includes('vòng 1') || (phase.includes('đạt chuẩn') && phase.includes('khâu 2'))) {
                    let totalTamProds = 0;
                    let passFirstRound = 0;
                    safeProdItems.forEach(p => {
                        const user = p.p2_user || p.phases?.phase2?.user;

                                passFirstRound++;
                            }
                        }
                    });
                    if (totalTamProds > 0) return Math.min(100, Math.max(0, Math.round((passFirstRound / totalTamProds) * 100)));
                    const rawVal = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 100;
                    return Math.round(rawVal);
                }

                // 3.3. Kỷ luật chấm công & giờ giấc xưởng (Lại Trường Tâm)
                else if (phase.includes('kỷ luật') || phase.includes('chấm công') || phase.includes('giờ giấc')) {

                            if (st.includes('quên chấm') || st.includes('đi muộn') || st.includes('muộn') || st.includes('không phép') || st.includes('vi phạm') || pen > 0) {
                                violationShifts++;
                            }
                        }
                    });
                    if (totalShifts > 0) return Math.max(0, Math.round((1 - (violationShifts / totalShifts)) * 100));
                    const rawVal = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 100;
                    return Math.round(rawVal);
                }
            }

            const fallbackVal = k.current !== undefined && k.current !== null && k.current !== '' ? cleanNumber(k.current) : 0;
            return Math.round(count > 0 ? count : fallbackVal);
        };

        const parseDateSafe = (val) => {

            const str = String(val).trim();
            if (!str) return NaN;
            let s = str;
            if (s.includes(' ')) {
                s = s.replace(' ', 'T');
            }
            if (s.includes('T') && s.split(':').length === 2) {
                s += ':00';

        const calcActiveHoursForDay = (user, dateStr, gateHours) => {
            let totalActiveMins = 0;
            const safeGateHours = Number(gateHours) || 0;

            // 1. Duyệt prodItems
            (safeProdItems || []).forEach(p => {
                ['phase1', 'phase2'].forEach(phKey => {
                    const ph = p?.phases?.[phKey];
                    if (ph && String(ph.user).trim() === String(user).trim()) {
                        if (ph.start && String(ph.start).startsWith(dateStr)) {
                            const startMs = parseDateSafe(ph.start);
                            let endMs = 0;
                            if (ph.endTime) {
                                endMs = parseDateSafe(ph.endTime);
                            } else if (ph.status === 'In Progress' && dateStr === currentDate) {
                                endMs = Date.now();
                            }
                            if (!isNaN(startMs) && endMs > startMs) {
                                totalActiveMins += (endMs - startMs) / 60000;
                            }
                        }
                    }
                });
            });

            // 2. Duyệt packings
            (safePackings || []).forEach(pk => {
                if (String(pk.user).trim() === String(user).trim()) {
                    if (pk.start && String(pk.start).startsWith(dateStr)) {
                        const startMs = parseDateSafe(pk.start);
                        let endMs = 0;
                        const et = pk.endTime || pk.end;
                        if (et) {
                            endMs = parseDateSafe(et);
                        } else if (pk.status === 'In Progress' && dateStr === currentDate) {
                            endMs = Date.now();
                        }
                        if (!isNaN(startMs) && endMs > startMs) {
                            totalActiveMins += (endMs - startMs) / 60000;
                        }
                    }
                }
            });

            const activeH = Math.max(0, totalActiveMins / 60);
            // Capping active hours at gate hours
            const cappedActiveH = Math.min(activeH, safeGateHours);
            const idleH = Math.max(0, safeGateHours - cappedActiveH);
            return { activeHours: cappedActiveH, idleHours: idleH };

        const handleSharedPhotoUpload = async (task, e) => {

        const handleCompleteShared = async (task) => {

        const handleApproveShared = async (task) => {

                    }];

        const handleRejectShared = async (task) => {

            try {

        const handleDeleteShared = async (task) => {

            setProcessing(false);
        };
        // ----------------------------------------------------

        // =========================================================================
        // CORE THUẬT TOÁN BẢNG LƯƠNG NHỒI SỐ CHI TIẾT (Memoized for high performance)
        // =========================================================================
        const payroll = React.useMemo(() => {
            return users.map(u => {
            const sal = userConfigs?.salaries?.[u] || {};
            const userBPs = bpData.filter(b => isUserMatch(b.user, u) && b.date && isDateInRange(b.date, filter, customMonth));
            const userAtts = attData.filter(a => isUserMatch(a.user, u) && a.date && isDateInRange(a.date, filter, customMonth));

            // Tính toán Lương Thực Chiến theo từng ngày
            let totalActiveHours = 0;
            let totalIdleHours = 0;
            const userAttsWithRealTime = userAtts.map(a => {
                const gateHours = Number(a.totalHours) || 0;
                const { activeHours, idleHours } = calcActiveHoursForDay(u, a.date, gateHours);
                totalActiveHours += activeHours;
                totalIdleHours += idleHours;
                return {
                    ...a,
                    activeHours: activeHours.toFixed(2),
                    idleHours: idleHours.toFixed(2),
                    totalHours: activeHours.toFixed(2),
                    gateHours: gateHours.toFixed(2)
                };
            });

            const daysWorked = new Set(userAtts.filter(a => Number(a.totalHours) > 0).map(a => a.date)).size;
            const hoursWorked = totalActiveHours;
            const totalGateHours = userAtts.reduce((sum, a) => sum + Number(a.totalHours || 0), 0);
            const baseSalary = cleanNumber(sal.baseSalary) || cleanNumber(sal['Lương Cơ Bản']) || 0;
            let hourlyRate = baseSalary > 1000000 ? Math.round(baseSalary / 28 / 8) : baseSalary;

            // I. CÁC KHOẢN THU NHẬP
            const luongChinh = Math.round(hourlyRate * totalGateHours);
            const luongLamThemGio = userBPs.filter(b => b.type === 'Lương Làm Thêm Giờ').reduce((sum, b) => sum + Number(b.amount || 0), 0);

            let prodSalary = 0;
            let kpiSanXuatDetails = [];
            let kpiDongGoiDetails = [];
            let kpiBanHangDetails = [];
            let thuongDetails = [];

            let hoaHongBanHang = 0;
            userBPs.filter(b => b.type === 'Thưởng Bán Hàng').forEach(b => {
                let amt = Number(b.amount || 0);
                hoaHongBanHang += amt;
                const detailName = (b.note || b.orderCode) ? `Chốt đơn: ${b.orderCode || ''} ${b.note || ''}`.trim() : 'Thưởng chốt đơn bán hàng';
                if (amt !== 0) kpiBanHangDetails.push({ name: detailName, amount: amt, time: b.date });
            });

            let hoTroSanLuong = 0;
            userBPs.filter(b => b.type === 'Hỗ Trợ Sản Lượng').forEach(b => {
                let amt = Number(b.amount || 0);
                hoTroSanLuong += amt;
                if (amt !== 0) thuongDetails.push({ name: b.note ? `Hỗ trợ: ${b.note}` : 'Hỗ trợ năng suất kho', amount: amt, time: b.date });
            });

            safeProdItems.forEach(p => {
                const k1Time = p.phases?.phase1?.endTime || p.date || p.deadline;
                const k2Time = p.phases?.phase2?.endTime || p.date || p.deadline;

                const orderMatch = getOrderMatch(p.orderId);

                const channel = String(p.channel || p.orderChannel || orderMatch?.channel || '').toUpperCase().trim();
                const isIntl = (typeof isExportChannel === 'function' && isExportChannel(channel)) || (
                    channel.includes('XUẤT KHẨU') || channel.includes('EXPORT') || channel.includes('QUỐC TẾ') ||
                    /\bSHOPEE\s*[-_]?\s*(TH|MA|MY|SG|TW|PH|MALAYSIA|THAILAND|PHILIPPINES|SINGAPORE|TAIWAN)\b/i.test(channel) ||
                    /\b(SHOPEE_TH|SHOPEE_MA|SHOPEE_MY|SHOPEE_SG|SHOPEE_TW|SHOPEE_PH)\b/i.test(channel) ||
                    (/\b(MY|TH|PH|SG|TW|MA)\b/i.test(channel) && channel.includes('SHOPEE'))
                );

                const isStockItem = p.fulfilledFromStock === true || String(p.fulfilledFromStock).toUpperCase() === 'TRUE';
                if (isStockItem) return; 

                const isItemCompleted = p.status === 'Done' || String(p.status).toUpperCase() === 'ĐÃ XONG' || String(p.status).toUpperCase() === 'HOÀN KHO ĐẠT';

                if (isUserMatch(p.phases?.phase1?.user, u) && p.phases?.phase1?.status === 'Done' && isItemCompleted && k1Time && isDateInRange(k1Time, filter, customMonth)) {
                    let amt = 0;
                    let isAppliedX3 = false;
                    if (typeof getSopAndReward === 'function') {
                        const kInfo = getSopAndReward(p, p.phases?.phase1?.name || 'phase1', window.kpiConfig || erpData?.Config_KPI || [], channel);
                        if (kInfo && kInfo.reward) {
                            amt = kInfo.reward;
                            isAppliedX3 = isIntl;
                        }
                    }
                    if (amt === 0) {
                        amt = Number(p.phases?.phase1?.reward_vnd || 0);
                        if (isIntl && amt > 0) {
                            amt = amt * 3;
                            isAppliedX3 = true;
                        }
                    }
                    prodSalary += amt;
                    if (amt > 0) kpiSanXuatDetails.push({ name: `[K1] ${p.name}`, amount: amt, time: k1Time, isX3: isAppliedX3 });
                }

                if (isUserMatch(p.phases?.phase2?.user, u) && p.phases?.phase2?.status === 'Done' && isItemCompleted && k2Time && isDateInRange(k2Time, filter, customMonth)) {
                    let amt = 0;
                    let isAppliedX3 = false;
                    if (typeof getSopAndReward === 'function') {
                        const kInfo = getSopAndReward(p, p.phases?.phase2?.name || 'phase2', window.kpiConfig || erpData?.Config_KPI || [], channel);
                        if (kInfo && kInfo.reward) {
                            amt = kInfo.reward;
                            isAppliedX3 = isIntl;
                        }
                    }
                    if (amt === 0) {
                        amt = Number(p.phases?.phase2?.reward_vnd || 0);
                        if (isIntl && amt > 0) {
                            amt = amt * 3;
                            isAppliedX3 = true;
                        }
                    }
                    prodSalary += amt;
                    if (amt > 0) kpiSanXuatDetails.push({ name: `[K2] ${p.name}`, amount: amt, time: k2Time, isX3: isAppliedX3 });
                }
            });

            safePackings.forEach(pk => {
                if (isUserMatch(pk.user, u) && pk.status === 'Done' && (pk.endTime || pk.date) && isDateInRange(pk.endTime || pk.date, filter, customMonth)) {
                    const orderMatch = getOrderMatch(pk.orderId);

                    const orderStatus = String(orderMatch?.status || '').toUpperCase().trim();
                    if (orderStatus.includes('HỦY') || orderStatus.includes('HUỶ') || orderStatus.includes('HOÀN') || orderStatus === 'CANCELLED') {
                        return;
                    }

                    const channel = String(pk.channel || pk.orderChannel || orderMatch?.channel || '').toUpperCase().trim();
                    const isIntl = (typeof isExportChannel === 'function' && isExportChannel(channel)) || (

                        /\bSHOPEE\s*[-_]?\s*(TH|MA|MY|SG|TW|PH|MALAYSIA|THAILAND|PHILIPPINES|SINGAPORE|TAIWAN)\b/i.test(channel) ||

            const tongThuong = thuongNong + chuyenCan;

            if (thuongNong > 0 || userBPs.some(b => b.type === 'Thưởng Nóng')) thuongDetails.push({ name: 'Thưởng Nóng', amount: thuongNong });

            const tongThuNhap = luongChinh + luongLamThemGio + hoaHongSanXuat + hoTroSanLuong + tongPhuCap + tongThuong + hoaHongBanHang + cacKhoanThuKhac;

            const soNgayNghi = userAtts.filter(a => String(a.status || '').includes('Nghỉ') || String(a.shift || '').includes('Nghỉ')).length;

            userAtts.forEach(a => { if (Number(a.penalty) > 0) penaltyDetails.push({ name: a.note || 'Vi phạm giờ công', amount: Number(a.penalty), time: a.date }); });
            if (phatVuotNgayNghi > 0) penaltyDetails.push({ name: `Vượt ${soNgayNghi - 2} ngày nghỉ quy định`, amount: phatVuotNgayNghi, time: new Date().toISOString() });

            const periodLabel = filter === 'Tuỳ Chỉnh' ? `Tháng ${customMonth.split('-')[1]}/${customMonth.split('-')[0]}` : filter;
            const soLanDiMuon = userAtts.filter(a => String(a.status).includes('Đi muộn')).length;
            const soLanPhat = penaltyDetails.length;
            let leaveRecords = userAtts.filter(a => a.leaveStart || a.shift === 'Nghỉ Phép');
            let lastLeave = leaveRecords.length > 0 ? leaveRecords[leaveRecords.length - 1] : null;

            kpiSanXuatDetails.sort((a, b) => new Date(b.time || 0).getTime() - new Date(a.time || 0).getTime());
            kpiDongGoiDetails.sort((a, b) => new Date(b.time || 0).getTime() - new Date(a.time || 0).getTime());
            kpiBanHangDetails.sort((a, b) => new Date(b.time || 0).getTime() - new Date(a.time || 0).getTime());
            thuongDetails.sort((a, b) => new Date(b.time || 0).getTime() - new Date(a.time || 0).getTime());
            penaltyDetails.sort((a, b) => new Date(b.time || 0).getTime() - new Date(a.time || 0).getTime());

            const currentMonthStr = filter === 'Tuỳ Chỉnh' ? customMonth : (typeof getLocalISODate === 'function' ? getLocalISODate().slice(0, 7) : new Date().toISOString().slice(0, 7));
            const allSnapshots = erpData?.monthlySnapshots || erpData?.Monthly_Snapshots || [];
            const userLockedSnap = allSnapshots.find(s => isUserMatch(s.user, u) && String(s.month).trim() === String(currentMonthStr).trim());
            const isLocked = !!userLockedSnap;
            let snapDetails = null;

    // -------------------------------------------------------------------------
    const PayrollEditModal = React.memo(function PayrollEditModal({ p, onClose, pushDeltas, filterMonth, currentDate }) {
        const [form, setForm] = React.useState({
            luongLamThemGio: p.luongLamThemGio || '',
            hoTroSanLuong: p.hoTroSanLuong || '',
            cacKhoanThuKhac: p.cacKhoanThuKhac || '',
            cacKhoanThuKhacNote: p.cacKhoanThuKhacNote || '',
            phatQuyDinh: p.phatQuyDinh || '',
            phatQuyDinhNote: p.phatQuyDinhNote || '',
            chiPhiBaoHanh: p.chiPhiBaoHanh || '',
            daTraNhanVien: p.daTraNhanVien || '',
            nhanXetText: p.nhanXetText || ''
        });
        const [isSaving, setIsSaving] = React.useState(false);

        const handleSave = async () => {
            setIsSaving(true);
            const buildBP = (amt, type, defaultNote) => ({
                id: `BP_${type.toUpperCase()}_${p.user}_${filterMonth}`.replace(/[^A-Z0-9_]/g, ''),
                user: p.user,
                amount: Number(amt) || 0,
                type: type,
                note: type === 'Thu Nhập Khác' ? (form.cacKhoanThuKhacNote || defaultNote) :
                    type === 'Phạt Quy Định' ? (form.phatQuyDinhNote || defaultNote) :
                        type === 'Nhận Xét' ? (form.nhanXetText || defaultNote) : defaultNote,
                date: currentDate,
                orderCode: ''
            });

            const payload = {
                monthStr: filterMonth,
                BonusPenalty_Updates: [
                    buildBP(form.luongLamThemGio, 'Lương Làm Thêm Giờ', 'Tăng ca nội bộ xưởng'),
                    buildBP(form.hoTroSanLuong, 'Hỗ Trợ Sản Lượng', 'Hỗ trợ định mức kho sản lượng'),
                    buildBP(form.cacKhoanThuKhac, 'Thu Nhập Khác', 'Khoản điều chỉnh bổ sung'),
                    buildBP(-Math.abs(Number(form.phatQuyDinh)), 'Phạt Quy Định', 'Trừ vi phạm nội quy KCS'),
                    buildBP(-Math.abs(Number(form.chiPhiBaoHanh)), 'Chi Phí Bảo Hành', 'Khấu trừ đền bù hàng hỏng vỡ lỗi'),
                    buildBP(-Math.abs(Number(form.daTraNhanVien)), 'Đã Trả', 'Ứng quyết toán lương kỳ trước'),
                    buildBP(0, 'Nhận Xét', 'Đạt chỉ tiêu khối lượng xưởng đề ra.')
                ]
            };

            try {
                if (typeof window.runGAS === 'function') {
                    const res = await window.runGAS('api_syncMasterPayroll', payload);
                    if (res && res.success) {
                        if (typeof triggerToast === 'function') triggerToast(`Đã nhồi số và đồng bộ lương cho ${p.user} thành công!`, 'fa-check', 'success');
                        window.dispatchEvent(new CustomEvent('triggerReloadData'));
                        onClose();
                    } else {
                        alert('Lỗi đồng bộ lương: ' + (res ? res.message : 'Không rõ'));
                    }
                } else {
                    await pushDeltas({ BonusPenalty: payload.BonusPenalty_Updates }, `Đã nhồi số bảng lương của ${p.user} thành công!`, 'fa-save');
                    onClose();
                }
            } catch (e) { alert('Lỗi đồng bộ dữ liệu mạng!'); }
            setIsSaving(false);
        };

        return (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
                <div className="bg-[#141414] border border-[#333] w-full max-w-md rounded-[24px] p-5 shadow-2xl flex flex-col max-h-[90vh]">
                    <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-2.5">

                        <button onClick={onClose} disabled={isSaving} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white flex items-center justify-center"><i className="fas fa-times text-xs"></i></button>
                    </div>
                    <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3.5 pr-1 text-[11px]">
                        {p.isLocked && (
                            <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 font-bold flex items-center gap-2">
                                <i className="fas fa-lock text-sm"></i>
                                <span>Kỳ lương này đã Khóa Sổ / Đã Trả. Hệ thống khóa quyền chỉnh sửa để đảm bảo tính toàn vẹn tài chính!</span>
                            </div>
                        )}
                        <div className="grid grid-cols-2 gap-3">
                            <div><label className="text-gray-400 font-bold block mb-1">Lương Làm Thêm Giờ</label><input type="number" disabled={p.isLocked} value={form.luongLamThemGio} onChange={e => setForm({ ...form, luongLamThemGio: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white font-bold disabled:opacity-50" /></div>
                            <div><label className="text-gray-400 font-bold block mb-1">Hỗ Trợ Sản Lượng</label><input type="number" disabled={p.isLocked} value={form.hoTroSanLuong} onChange={e => setForm({ ...form, hoTroSanLuong: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white font-bold disabled:opacity-50" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-2 p-2.5 bg-zinc-900/30 rounded-xl border border-white/5">
                            <div className="col-span-2 font-black text-blue-400">THU NHẬP KHÁC</div>
                            <div><label className="text-gray-500 block mb-1">Số tiền</label><input type="number" disabled={p.isLocked} value={form.cacKhoanThuKhac} onChange={e => setForm({ ...form, cacKhoanThuKhac: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                            <div><label className="text-gray-500 block mb-1">Ghi chú</label><input type="text" disabled={p.isLocked} value={form.cacKhoanThuKhacNote} onChange={e => setForm({ ...form, cacKhoanThuKhacNote: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-2 p-2.5 bg-zinc-900/30 rounded-xl border border-white/5">
                            <div className="col-span-2 font-black text-rose-400">PHẠT QUY ĐỊNH MỤC</div>
                            <div><label className="text-gray-500 block mb-1">Tiền phạt</label><input type="number" disabled={p.isLocked} value={form.phatQuyDinh} onChange={e => setForm({ ...form, phatQuyDinh: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-rose-400 font-bold disabled:opacity-50" /></div>
                            <div><label className="text-gray-500 block mb-1">Lý do phạt lỗi</label><input type="text" disabled={p.isLocked} value={form.phatQuyDinhNote} onChange={e => setForm({ ...form, phatQuyDinhNote: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div><label className="text-gray-400 block mb-1">Chi Phí Bảo Hành</label><input type="number" disabled={p.isLocked} value={form.chiPhiBaoHanh} onChange={e => setForm({ ...form, chiPhiBaoHanh: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                            <div><label className="text-gray-400 block mb-1">Đã Chi Trả Trước</label><input type="number" disabled={p.isLocked} value={form.daTraNhanVien} onChange={e => setForm({ ...form, daTraNhanVien: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white disabled:opacity-50" /></div>
                        </div>
                        <div><label className="text-gray-400 block mb-1">Nhận Xét Năng Suất Phiếu</label><textarea rows="2" disabled={p.isLocked} value={form.nhanXetText} onChange={e => setForm({ ...form, nhanXetText: e.target.value })} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none disabled:opacity-50" placeholder="Đạt tiến độ..."></textarea></div>
                    </div>
                    <div className="flex gap-2 mt-4 pt-2 border-t border-[#222]">
                        <button onClick={onClose} className="flex-1 py-2.5 bg-[#222] text-gray-400 font-black rounded-xl">HỦY</button>
                        <button onClick={handleSave} disabled={isSaving || p.isLocked} className="flex-[2] py-2.5 bg-blue-500 text-black font-black rounded-xl disabled:opacity-50">{isSaving ? 'ĐANG GHI...' : (p.isLocked ? 'ĐÃ KHÓA SỔ' : 'LƯU SỐ LIỆU')}</button>
                    </div>
                </div>
            </div>
        );
    });

    // -------------------------------------------------------------------------
    // 7. COMPONENT MODAL DUYỆT TRẠNG THÁI LỊCH NGHỈ & CHẤM CÔNG NHANH
    // -------------------------------------------------------------------------
    const LeaveManagementModal = React.memo(function LeaveManagementModal({
        leaveData,
        onClose,
        pushDeltas,
        triggerToast,
        currentUser
    }) {
        if (!leaveData) return null;
        const { user, date, attRecord } = leaveData;
        const currentStatus = String(attRecord?.status || 'Chưa điểm danh');
        const [status, setStatus] = React.useState(() => {
            if (currentStatus.includes('không phép')) return 'Nghỉ không phép';
            if (currentStatus.includes('có phép') || attRecord?.shift === 'Nghỉ Phép' || attRecord?.leaveType) return 'Nghỉ có phép';
            if (currentStatus.includes('Đi muộn')) return 'Đi muộn';
            if (currentStatus === 'Hoàn thành' || Number(attRecord?.totalHours) > 0) return 'Hoàn thành';
            return currentStatus;
        });
        const [penalty, setPenalty] = React.useState(() => Number(attRecord?.penalty || 0));
        const [note, setNote] = React.useState(() => String(attRecord?.note || ''));
        const [isSaving, setIsSaving] = React.useState(false);

        const handleSelectStatus = (newSt) => {
            setStatus(newSt);
            if (newSt === 'Nghỉ có phép' || newSt === 'Hoàn thành') {
                setPenalty(0);
            } else if (newSt === 'Nghỉ không phép') {
                setPenalty(200000);
            } else if (newSt === 'Đi muộn') {
                if (penalty === 0) setPenalty(50000);
            }
        };

        const handleSave = async () => {
            setIsSaving(true);
            const attId = attRecord?.id || `ATT_${user}_${date.replace(/-/g, '')}`;
            const isLeave = status.includes('Nghỉ');
            const leaveTypeVal = status.includes('có phép') ? 'Có phép' : (status.includes('không phép') ? 'Không phép' : (isLeave ? 'Nghỉ Phép' : ''));
            const preservedShift = (attRecord?.shift && attRecord.shift !== 'Nghỉ Phép') ? attRecord.shift : (attRecord?.leaveShift || 'Cả Ngày');

            const updatedAtt = {
                id: attId,
                user: user,
                date: date,
                status: status,
                penalty: Number(penalty) || 0,
                note: note,
                isEdited: true,
                leaveType: leaveTypeVal,
                shift: isLeave ? preservedShift : (attRecord?.shift || 'Sáng'),
                timeIn: isLeave ? '' : (attRecord?.timeIn || '08:00'),
                timeOut: isLeave ? '' : (attRecord?.timeOut || '17:00'),
                totalHours: isLeave ? 0 : (attRecord?.totalHours || 8)
            };

            const deltas = { Attendance: [updatedAtt] };

            if (Number(penalty) > 0) {
                deltas.BonusPenalty = [{
                    id: 'BP_PEN_' + Date.now(),
                    user: user,
                    amount: -Math.abs(Number(penalty)),
                    type: 'Phạt Quy Định',
                    note: note || `Phạt vi phạm ngày ${date} (${status})`,
                    date: date,
                    orderCode: ''
                }];
            }

            try {
                if (typeof window.runGAS === 'function') {
                    window.runGAS('api_updateLeaveStatus', attId, status, penalty, note);
                } else if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.api_updateLeaveStatus(attId, status, penalty, note);
                }
                if (pushDeltas) {
                    await pushDeltas(deltas, `Đã cập nhật trạng thái ${user} ngày ${date} thành "${status}"`, 'fa-calendar-check');
                }
                if (triggerToast) {
                    triggerToast(`Đã duyệt trạng thái "${status}" cho ${user}!`, 'fa-check', 'success');
                }
                onClose();
            } catch (e) {
                if (triggerToast) triggerToast('Lỗi cập nhật trạng thái!', 'fa-times', 'danger');
            } finally {
                setIsSaving(false);
            }
        };

        return (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
                <div className="bg-[#121214] border border-[#333] w-full max-w-md rounded-2xl p-5 shadow-2xl flex flex-col relative overflow-hidden">

                            <div className="w-8 h-8 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                                <i className="fas fa-user-clock text-sm"></i>
                            </div>
                            <div>
                                <h3 className="font-black text-white text-[13px] uppercase tracking-wider">Duyệt Trạng Thái Chấm Công & Lịch Nghỉ</h3>
                                <div className="text-[10px] text-gray-400 font-bold">{user} • Ngày: <span className="text-amber-400 font-mono">{date}</span></div>
                            </div>
                        </div>
                        <button onClick={onClose} disabled={isSaving} className="w-7 h-7 rounded-lg bg-[#222] text-gray-400 hover:text-white flex items-center justify-center transition-colors"><i className="fas fa-times text-xs"></i></button>
                    </div>

                    <div className="space-y-3.5 text-[11px]">
                        {/* Chọn trạng thái nhanh */}
                        <div>
                            <label className="text-gray-400 font-bold block mb-1.5 uppercase text-[10px] tracking-wider">Chọn Trạng Thái Chấm Công / Lịch Nghỉ:</label>
                            <div className="grid grid-cols-2 gap-2">
                                <button
                                    type="button"
                                    onClick={() => handleSelectStatus('Nghỉ có phép')}
                                    className={`p-2.5 rounded-xl border text-left flex items-center gap-2 transition-all cursor-pointer ${status === 'Nghỉ có phép' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300 font-black shadow-[0_0_10px_rgba(6,182,212,0.2)]' : 'bg-[#18181b] border-[#27272a] text-gray-400 hover:text-white'}`}
                                >
                                    <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                                    <span>Nghỉ có phép (P)</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => handleSelectStatus('Nghỉ không phép')}
                                    className={`p-2.5 rounded-xl border text-left flex items-center gap-2 transition-all cursor-pointer ${status === 'Nghỉ không phép' ? 'bg-rose-500/20 border-rose-500 text-rose-300 font-black shadow-[0_0_10px_rgba(244,63,94,0.2)]' : 'bg-[#18181b] border-[#27272a] text-gray-400 hover:text-white'}`}
                                >
                                    <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                                    <span>Nghỉ không phép (KP)</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => handleSelectStatus('Hoàn thành')}
                                    className={`p-2.5 rounded-xl border text-left flex items-center gap-2 transition-all cursor-pointer ${status === 'Hoàn thành' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 font-black shadow-[0_0_10px_rgba(16,185,129,0.2)]' : 'bg-[#18181b] border-[#27272a] text-gray-400 hover:text-white'}`}
                                >
                                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                                    <span>Đi làm đủ (8h)</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => handleSelectStatus('Đi muộn')}
                                    className={`p-2.5 rounded-xl border text-left flex items-center gap-2 transition-all cursor-pointer ${status === 'Đi muộn' ? 'bg-amber-500/20 border-amber-500 text-amber-300 font-black shadow-[0_0_10px_rgba(245,158,11,0.2)]' : 'bg-[#18181b] border-[#27272a] text-gray-400 hover:text-white'}`}
                                >
                                    <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                                    <span>Đi muộn (M)</span>
                                </button>
                            </div>
                        </div>

                        {/* Mức phạt vi phạm */}
                        <div>

                                    value={penalty}
                                    onChange={e => setPenalty(e.target.value)}

                                    placeholder="0"
                                />
                                <span className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 font-bold text-[10px]">VNĐ</span>

                        {/* Ghi chú */}
                        <div>
                            <label className="text-gray-400 font-bold block mb-1 uppercase text-[10px] tracking-wider">Lý Do / Ghi Chú Của Quản Lý:</label>
                            <textarea
                                rows="2"
                                value={note}
                                onChange={e => setNote(e.target.value)}
                                className="w-full bg-[#0a0a0c] border border-[#27272a] focus:border-amber-500 rounded-xl p-2.5 text-white text-[11px] outline-none"
