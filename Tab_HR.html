                                  </div>
                              ))}
                              {sharedTasks.length === 0 && globalXuTasks.length === 0 && (
                                  <div className="col-span-full text-center py-6 text-gray-500 text-[12px] font-bold uppercase">Chưa có nhiệm vụ chung hoặc nhiệm vụ Xu nào</div>
                              )}
                          </div>
                      </div>
                  );
              })()}
              {/* ========================================================================= */}
              
              <div className="mt-4"></div>

              <div className={"grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-2 gap-4"}>
                  {(() => {
                      const userRanks = users.map(u => {
                          const claimed = kpiData.filter(k => k.user === u && (k.isClaimed === 'true' || k.isClaimed === true));
                          const monthly = claimed.filter(k => k.startTime && k.startTime.startsWith(currentDate.slice(0, 7))).length;
                          return { u, monthly };
                      }).sort((a, b) => b.monthly - a.monthly);
                      
                      return userRanks.map((ur, index) => {
                          const u = ur.u;
                          const userKPIs = kpiData.filter(k => k.user === u);
                          const activeKPIs = userKPIs.filter(k => !(k.isClaimed === 'true' || k.isClaimed === true));
                          const claimedKPIs = userKPIs.filter(k => (k.isClaimed === 'true' || k.isClaimed === true));
                          const taskKPIs = activeKPIs.filter(k => k.unit !== 'Checklist');
                          const devKPIs = activeKPIs.filter(k => k.unit === 'Checklist');
                          
                          const xuTasksBP = bpData.filter(b => b.user === u && b.type === 'XU_REWARD');
                          const xuTasksKPI = claimedKPIs.filter(k => String(k.unit).toLowerCase() === 'xu');
                          const xuTasks = [
                              ...xuTasksBP.map(b => ({id: b.id, name: b.note || 'Nhiệm vụ', amount: b.amount, date: b.date})),
                              ...xuTasksKPI.map(k => ({id: k.id, name: k.kpiName, amount: k.reward, date: formatDR(k.startTime, k.endTime)}))
                          ].sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
                          const totalXu = xuTasks.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
                          
                          const displayClaimedKPIs = claimedKPIs.filter(k => String(k.unit).toLowerCase() !== 'xu');
                          
                          const dailyTasks = taskKPIs.filter(k => k.startTime === k.endTime || (new Date(k.endTime) - new Date(k.startTime)) <= 24*60*60*1000);
                          const monthlyKPIs = taskKPIs.filter(k => !(k.startTime === k.endTime || (new Date(k.endTime) - new Date(k.startTime)) <= 24*60*60*1000));
                          
                          const isExpanded = expandedKPIs[u]; const uRole = userConfigs?.titles?.[u] || 'Nhân Sự';
                          
                          const rank = ur.monthly > 0 ? index + 1 : 0;
                          const isMVP = rank === 1 && ur.monthly > 0;
                          
                          const userLevel = Math.floor(claimedKPIs.length / 5) + 1;
                          const currentBase = (userLevel - 1) * 5;
                          const nextBase = userLevel * 5;
                          const expPct = Math.min(100, ((claimedKPIs.length - currentBase) / 5) * 100);
                          
                          const totalActive = activeKPIs.length;
                          const totalClaimed = claimedKPIs.length;
                          const totalTasks = totalActive + totalClaimed;
                          const manaPct = totalTasks > 0 ? Math.round((totalClaimed / totalTasks) * 100) : 0;
                          const manaColor = manaPct >= 80 ? 'emerald' : manaPct >= 40 ? 'amber' : 'rose';
                          const isCritical = totalActive > 0 && manaPct < 30;

                      const renderTaskRow = (k, workerName) => {
                          const isAutoTracked = ['Dựng khung', 'Gia cố', 'Cắt Mài', 'Gọt Keo', 'Đóng Gói', 'Bán Hàng'].includes(k.kpiName) || k.kpiName.toLowerCase().includes('hoàn') || k.kpiName.toLowerCase().includes('khiếu nại') || k.kpiName.toLowerCase().includes('doanh thu') || k.kpiName.toLowerCase().includes('thanh lý');
                          const currentProg = getDynamicKPIProgress(k, workerName); 
                          const target = Number(k.target) || 1; 
                          const pct = Math.min(100, (currentProg / target) * 100);
                          const barColor = pct >= 100 ? 'from-emerald-600 to-emerald-400' : (pct >= 50 ? 'from-blue-600 to-blue-400' : 'from-rose-600 to-orange-400');
                          const textColor = pct >= 100 ? 'text-emerald-400' : (pct >= 50 ? 'text-blue-400' : 'text-rose-400');
                          const isOverdue = k.endTime && k.endTime < currentDate; 
                          const isFailed = currentProg < target; 
                          const isCompleted = currentProg >= target; 
                          const isPercentage = String(k.unit).trim() === '%';
                          // Fix loophole: For percentage KPIs, must wait until end of period to claim
                          const canClaim = isCompleted && (!isPercentage || (k.endTime && currentDate >= k.endTime.substring(0,10)));
                          const isClaiming = claimingIds.includes(k.id);
                          const isTaskOpen = openSection[`task_${k.id}`];

                          return (
                              <div key={k.id} className={`relative group bg-[#0d0d0d] rounded-xl border-l-4 ${isCompleted ? 'border-emerald-500/50' : isFailed && isOverdue ? 'border-rose-500/50' : 'border-[#333]'} hover:bg-[#111] overflow-hidden transition-colors flex flex-col`}>
                                  {pct >= 100 && <div className={"absolute inset-0 bg-emerald-500/5 z-0 pointer-events-none"}></div>}
                                  <div onClick={(e) => { e.stopPropagation(); setOpenSection(prev => ({ ...prev, [`task_${k.id}`]: !prev[`task_${k.id}`] })); }} className={"cursor-pointer p-3.5 flex justify-between items-center relative z-10"}>
                                      <div>
                                          <div className="flex items-center gap-1.5">
                                              <span className={"text-[#f5f5f5] font-black text-[13px]"}>{k.kpiName}</span>
                                          </div>
                                          {Number(k.reward) > 0 && <div className={"text-amber-500 text-[11px] font-bold mt-1"}><i className={"fas fa-coins mr-1"}></i> Thưởng: +{formatMoney(k.reward)}đ</div>}
                                      </div>
                                      <div className="flex items-center gap-3">
                                          {isAutoTracked ? (
                                              <div className={`${textColor} font-black text-[14px] text-right`}>{formatMoney(currentProg)}/{formatMoney(k.target)} <span className={"text-[9px] text-gray-500"}>{k.unit}</span></div>
                                          ) : (
                                              isCompleted ? (
                                                  <div className="text-emerald-500 text-[11px] font-black flex items-center gap-1"><i className="fas fa-check-circle"></i> ĐÃ DUYỆT</div>
                                              ) : (
                                                  <div className="text-gray-500 text-[11px] font-black flex items-center gap-1"><i className="fas fa-clock"></i> CHỜ DUYỆT</div>
                                              )
                                          )}
                                          <i className={`fas fa-chevron-${isTaskOpen ? 'up' : 'down'} text-gray-600 text-[11px] ml-1`}></i>
                                      </div>
                                  </div>
                                  
                                  {isTaskOpen && (
                                      <div className="animate-fade-in p-3.5 pt-0 border-t border-[#222] mt-1 relative z-10">
                                          {k.note && <div className="text-gray-400 text-[11px] mb-2.5 mt-2.5 bg-[#1a1a1a] p-2 rounded-lg border border-[#333]"><i className="fas fa-info-circle mr-1 text-gray-500"></i> {k.note}</div>}
                                          <div className={"text-gray-500 text-[10px] mb-2.5 mt-2 flex items-center gap-2"}>
                                              <span><i className={"far fa-calendar-alt mr-1"}></i> {formatDR(k.startTime, k.endTime)}</span>
                                              {(isOverdue && isFailed) && <span className="text-rose-500 font-black animate-pulse flex items-center gap-1"><i className="fas fa-fire"></i> TRỄ HẠN!</span>}
                                          </div>

                                          {/* Chỉ hiện thanh máu cho KPI tự động (có tiến trình đo đếm được) */}
                                          {isAutoTracked && !isCompleted && (
                                              <div className={"w-full bg-[#1a1a1a] rounded-full h-3 border border-[#000] overflow-hidden relative z-10 mb-2 mt-1"}>
                                                  <div className={`h-full rounded-full transition-all duration-1000 bg-gradient-to-r ${barColor}`} style={{ width: `${pct}%` }}></div>
                                              </div>
                                          )}

                                          {isCompleted ? (
                                              canClaim ? (
                                                  currentUser !== workerName ? (
                                                      <div className={"w-full mt-2 py-2.5 bg-[#1a1a1a] border border-[#333] text-gray-500 rounded-xl flex items-center justify-center gap-2 font-black text-[11px] uppercase tracking-widest"}><i className={"fas fa-lock text-lg"}></i> CHỜ NHÂN SỰ NHẬN THƯỞNG</div>
                                                  ) : (
                                                      <button onClick={() => claimReward(k)} disabled={isClaiming} className={`w-full mt-2 py-2.5 rounded-xl flex items-center justify-center gap-2 font-black text-[12px] uppercase tracking-widest transition-all ${isClaiming ? 'bg-[#333] text-gray-500 cursor-not-allowed' : 'bg-gradient-to-r from-amber-400 to-amber-500 text-[#0a0a0a] shadow-[0_0_15px_rgba(251,191,36,0.6)] animate-pulse active:scale-95'}`}>{isClaiming ? <><i className={"fas fa-spinner fa-spin text-lg"}></i> ĐANG XỬ LÝ...</> : <><i className={"fas fa-coins text-lg"}></i> NHẬN THƯỞNG NGAY</>}</button>
                                                  )
                                              ) : (
                                                  <div className={"w-full mt-2 py-2.5 bg-[#1a1a1a] border border-blue-500/30 text-blue-400 rounded-xl flex items-center justify-center gap-2 font-black text-[11px] uppercase tracking-widest animate-pulse"}><i className={"fas fa-shield-alt text-lg"}></i> ĐẠT MỐC - CHỜ CHỐT SỔ CUỐI THÁNG</div>
                                              )
                                          ) : null}

                                          {!isCompleted && !isAutoTracked && (
                                              <div className="flex gap-2 mt-2 relative z-10">
                                                  {currentUser === workerName ? (
                                                      <button onClick={async () => {
                                                          if (window.confirm('Báo cáo hoàn thành nhiệm vụ này để sếp duyệt?')) {
                                                              await pushDeltas({ KPI_Progress: [{ ...k, current: target, lastUpdated: new Date().toISOString() }] }, `Báo cáo hoàn thành: ${k.kpiName}`, 'fa-check-circle');
                                                          }
                                                      }} className="flex-1 py-2 bg-purple-600/20 text-[#a855f7] border border-[#a855f7]/30 hover:bg-[#a855f7] hover:text-black font-black text-[10px] rounded-lg shadow-sm transition-all uppercase tracking-wider relative overflow-hidden group">
                                                          <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] group-hover:animate-[shine_1.5s_infinite]"></div>
                                                          <i className="fas fa-paper-plane mr-1"></i> Báo cáo hoàn thành
                                                      </button>
                                                  ) : (
                                                      isBoss && (
                                                          <button onClick={async () => {
                                                              await pushDeltas({ KPI_Progress: [{ ...k, current: target, lastUpdated: new Date().toISOString() }] }, `Đã duyệt hoàn thành: ${k.kpiName}`, 'fa-check-double');
                                                          }} className="flex-1 py-2 bg-emerald-600/20 text-[#10b981] border border-[#10b981]/30 hover:bg-[#10b981] hover:text-black font-black text-[10px] rounded-lg shadow-sm transition-all uppercase tracking-wider">
                                                              <i className="fas fa-check-double mr-1"></i> Duyệt hoàn thành
                                                          </button>
                                                      )
                                                  )}
                                              </div>
                                          )}

                                          {isCompleted && !isAutoTracked && isBoss && (
                                              <button onClick={async () => {
                                                  if (window.confirm('Hủy duyệt hoàn thành nhiệm vụ này?')) {
                                                      await pushDeltas({ KPI_Progress: [{ ...k, current: 0, lastUpdated: new Date().toISOString() }] }, `Hủy duyệt: ${k.kpiName}`, 'fa-undo');
                                                  }
                                              }} className="w-full mt-2 py-2 bg-rose-950/40 text-rose-400 border border-rose-900/30 hover:bg-rose-500 hover:text-white font-black text-[9px] rounded-lg transition-colors uppercase tracking-wider relative z-10">
                                                  <i className="fas fa-undo mr-1"></i> Hủy duyệt hoàn thành
                                              </button>
                                          )}
                                          
                                          {(isOverdue && isFailed && isBoss && Number(k.penalty) > 0) && (
                                              <div className="mt-2 flex justify-end relative z-10">
                                                  <button onClick={() => handleApplyKPIPenalty(k, currentProg, target)} className={"px-3 py-1.5 bg-rose-500/20 hover:bg-rose-500 text-rose-500 hover:text-white border border-rose-500/30 text-[9px] font-black uppercase rounded-lg transition-colors"}>GIÁNG PHẠT ({formatMoney(k.penalty)}đ)</button>
                                              </div>
                                          )}

                                          {isBoss && (
                                              <div className={"absolute right-1 -top-8 flex gap-1 z-20"}><button onClick={(e) => { e.stopPropagation(); setEditKPI(k); setKpiForm({ user: k.user, kpiName: k.kpiName, target: k.target, unit: k.unit, startTime: k.startTime, endTime: k.endTime, reward: k.reward || '', penalty: k.penalty || '', note: k.note || '' }); setKpiType('task'); const isCustom = !['Dựng khung', 'Gia cố', 'Cắt Mài', 'Gọt Keo', 'Đóng Gói', 'Bán Hàng'].includes(k.kpiName); setKpiTrackingType(isCustom ? 'manual' : 'auto'); const isDaily = k.startTime === k.endTime || (new Date(k.endTime) - new Date(k.startTime)) <= 24*60*60*1000; setKpiPeriodType(isDaily ? 'Daily' : 'Custom'); setShowKPIModal(true); }} className={"w-7 h-7 rounded-lg bg-[#1a1a1a] border border-[#333] text-gray-400 hover:text-white hover:bg-amber-500 shadow-lg"}><i className={"fas fa-edit text-[10px]"}></i></button><button onClick={(e) => { e.stopPropagation(); handleDeleteKPI(k); }} className={"w-7 h-7 rounded-lg bg-[#1a1a1a] border border-[#333] text-gray-400 hover:bg-rose-500 hover:text-white shadow-lg"}><i className={"fas fa-trash text-[10px]"}></i></button></div>
                                          )}
                                      </div>
                                  )}
                              </div>
                          );
                      };

                      return (
                          <div key={u} className={`rf-card shadow-lg relative transition-all duration-300 border-l-4 flex flex-col ${isExpanded ? 'border-[#3b82f6] bg-[#111]' : 'border-[#222] hover:bg-[#141414]'}`}>
                              <div onClick={() => toggleKPIExpand(u)} className={"p-3.5 pb-4 cursor-pointer flex justify-between items-center relative group"}>
                                  <div className={"flex items-center gap-3 relative z-10"}>
                                      <div className="relative">
                                          {renderSafeAvatar(u, `w-10 h-10 shadow-sm border-2 transition-colors ${rank === 1 ? 'border-[#00d2ff] shadow-[0_0_15px_rgba(0,210,255,0.8)]' : rank === 2 ? 'border-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.6)]' : rank === 3 ? 'border-orange-600 shadow-[0_0_15px_rgba(234,88,12,0.6)]' : isExpanded ? 'border-[#3b82f6]' : 'border-transparent group-hover:border-[#555]'}`)}
                                          {rank === 1 && <i className="fas fa-gem absolute -top-2 -right-2 text-[#00d2ff] drop-shadow-[0_0_5px_rgba(0,210,255,1)] text-[10px] animate-bounce"></i>}
                                          {rank === 2 && <i className="fas fa-medal absolute -top-2 -right-2 text-yellow-400 drop-shadow-[0_0_5px_rgba(250,204,21,1)] text-[10px] animate-pulse"></i>}
                                          {rank === 3 && <i className="fas fa-medal absolute -top-2 -right-2 text-orange-600 drop-shadow-[0_0_5px_rgba(234,88,12,1)] text-[10px]"></i>}
                                      </div>
                                      <div className="flex-1 w-full">
                                          <div className={`font-black text-[14px] uppercase transition-colors flex items-center gap-2 ${isExpanded ? 'text-[#3b82f6]' : 'text-[#f5f5f5]'}`}>
                                              <span>{u}</span>
                                              {isMVP && <span className={"badge-mvp"}>👑 MVP THÁNG</span>}
                                          </div>
                                          <div className={"text-[10px] text-gray-500 font-bold mt-1 flex flex-col gap-1"}>
                                              <div className="flex items-center gap-1.5">
                                                  <span>{uRole}</span>
                                                  <span className={"text-gray-700"}>•</span>
                                                  <span className={"text-emerald-500 tracking-wide"}>Cấp {userLevel}</span>
                                              </div>
                                              <div className="flex items-center gap-2 mt-0.5">
                                                  <div className="flex-1 h-1.5 bg-gray-800 rounded-full overflow-hidden max-w-[120px]">
                                                      <div className="h-full bg-blue-500 rounded-full" style={{width: `${Math.min(100, expPct)}%`}}></div>
                                                  </div>
                                                  <span className="text-[9px] text-[#3b82f6] font-black">{Math.floor(expPct)}%</span>
                                              </div>
                                          </div>
                                      </div>
                                  </div>
                                  <div className={"flex items-center gap-4 relative z-10"}>
                                      <div className={"flex items-center gap-3"}>
                                          {totalActive > 0 && <span className={"text-[11px] font-black text-amber-500 flex items-center gap-1"}><i className="fas fa-clock opacity-80"></i> {totalActive}</span>}
                                          {totalClaimed > 0 && <span className={"text-[11px] font-black text-emerald-500 flex items-center gap-1"}><i className="fas fa-check-circle opacity-80"></i> {totalClaimed}</span>}
                                      </div>
                                      <div className={`w-7 h-7 shrink-0 rounded-full flex items-center justify-center transition-all duration-300 border ${isExpanded ? 'bg-[#3b82f6]/10 text-[#3b82f6] border-[#3b82f6]/30 rotate-180' : 'bg-[#1a1a1a] text-gray-500 border-transparent group-hover:bg-[#222]'}`}><i className={"fas fa-chevron-down text-[11px]"}></i></div>
                                  </div>
                                  
                                  {/* MANA BAR */}
                                  <div className="absolute bottom-0 left-0 w-full h-1 bg-[#1a1a1a] rounded-b-2xl overflow-hidden">
                                      <div className={`h-full transition-all duration-1000 ${isCritical ? 'bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.8)] animate-pulse' : `bg-${manaColor}-500`}`} style={{ width: `${manaPct}%` }}></div>
                                  </div>
                              </div>

                              {isExpanded && (
                                  <div className={"p-4 pt-0 border-t border-[#222] relative z-10 animate-fade-in mt-2 space-y-5 max-h-[60vh] overflow-y-auto custom-scrollbar"}>
                                      {userKPIs.length === 0 ? (
                                          <div className={"text-center py-6 text-gray-500 font-bold text-[11px]"}>Nhân sự này hiện chưa có nhiệm vụ nào.</div>
                                      ) : (
                                          <>
                                              {activeKPIs.length > 0 && (
                                                  <div className={`space-y-4`}>
                                                      {dailyTasks.length > 0 && (
                                                          <div className={"space-y-2.5"}>
                                                              <div className={"text-[10px] font-black text-[#60a5fa] uppercase tracking-widest flex items-center gap-1.5 border-b border-[#222] pb-1.5 w-full"}><i className={"fas fa-calendar-day mr-1.5"}></i> Nhiệm Vụ Hàng Ngày ({dailyTasks.length})</div>
                                                              <div className={"space-y-2.5"}>
                                                                  {dailyTasks.map(k => renderTaskRow(k, u))}
                                                              </div>
                                                          </div>
                                                      )}
                                                      {monthlyKPIs.length > 0 && (
                                                          <div className={`space-y-3 ${dailyTasks.length > 0 ? 'pt-5 border-t border-[#222]' : ''}`}>
                                                              <div className={"text-[12px] font-black text-amber-500 uppercase tracking-widest flex items-center gap-1.5 border-b border-[#222] py-2 w-full"}><i className={"fas fa-calendar-alt mr-1.5"}></i> KPI & Mục Tiêu Tháng ({monthlyKPIs.length})</div>
                                                              <div className={"space-y-2.5"}>
                                                                  {monthlyKPIs.map(k => renderTaskRow(k, u))}
                                                              </div>
                                                          </div>
                                                      )}
                                                  </div>
                                              )}
                                              {devKPIs.length > 0 && (
                                                  <div className={`space-y-3 ${taskKPIs.length > 0 ? 'pt-4 border-t border-[#222]' : ''}`}>
                                                      <div className={"text-[10px] font-black text-[#a855f7] uppercase tracking-widest flex items-center justify-between gap-1.5 w-full"}><span className={"bg-[#a855f7]/10 px-2.5 py-1 rounded-md border border-[#a855f7]/20"}><i className={"fas fa-rocket mr-1"} z-10></i> Mục Tiêu Dài Hạn</span>{!isBoss && <span className={"text-[9px] text-rose-400 bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/20"}><i className={"fas fa-lock mr-1"}></i>Chỉ Tối Cao Được Duyệt</span>}</div>
                                                      <div className={"space-y-2"}>
                                                          {devKPIs.map(k => {
                                                              const isChecked = Number(k.current) >= 1; const isClaiming = claimingIds.includes(k.id);
                                                              return (
                                                                  <div key={k.id} className={"flex items-start gap-3 group relative bg-[#0a0a0a] p-3 rounded-xl border border-[#222] hover:border-[#a855f7]/50"}>
                                                                      <button onClick={() => toggleDevGoal(k)} disabled={!isBoss} className={`mt-0.5 w-5 h-5 rounded-md flex items-center justify-center shrink-0 border transition-all ${isChecked ? 'bg-[#a855f7] border-[#a855f7] text-white' : 'bg-[#1a1a1a] border-[#444] text-transparent'}`}><i className={"fas fa-check text-[10px]"}></i></button>
                                                                      <div className={"flex-1 min-w-0"}><div className={"text-[12px] font-bold leading-relaxed pt-0.5 text-[#e5e5e5]"}>{k.kpiName}</div><div className={"flex justify-between items-center text-[9px] font-bold mt-1.5"}><span className={"text-gray-500"}><i className={"far fa-calendar-alt mr-1"}></i> {formatDR(k.startTime, k.endTime)}</span>{Number(k.reward) > 0 && <span className={"text-amber-400"}><i className={"fas fa-coins mr-1"}></i> {formatMoney(k.reward)}đ</span>}</div></div>
                                                                      {isChecked && (currentUser !== u ? <span className={"shrink-0 px-2 py-1 text-gray-500 font-black text-[9px] bg-[#1a1a1a] rounded border border-[#333] flex items-center gap-1"}><i className={"fas fa-lock"}></i> Chờ nhận</span> : <button onClick={() => claimReward(k)} disabled={isClaiming} className={`shrink-0 px-3 py-1.5 font-black text-[9px] uppercase rounded transition-all ${isClaiming ? 'bg-[#333] text-gray-500' : 'bg-amber-500 text-black shadow-md animate-pulse'}`}>{isClaiming ? 'XỬ LÝ...' : 'Nhận thưởng'}</button>)}
                                                                      {isBoss && <div className={"absolute right-2 -top-3 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-20"}><button onClick={() => handleDeleteKPI(k)} className={"w-7 h-7 rounded-lg bg-[#1a1a1a] border border-[#333] text-gray-400 hover:bg-rose-500"}><i className={"fas fa-trash text-[10px]"}></i></button></div>}
                                                                  </div>
                                                              );
                                                          })}
                                                      </div>
                                                  </div>
                                              )}
                                              {displayClaimedKPIs.length > 0 && (
                                                  <div className={`space-y-2.5 ${activeKPIs.length > 0 ? 'pt-4 border-t border-[#222]' : ''}`}>
                                                      <div 
                                                          onClick={(e) => toggleSection(u, 'claimedKPIs', e)}
                                                          className={"flex justify-between items-center bg-[#111] px-3 py-2 rounded-xl border border-[#222] cursor-pointer hover:bg-[#1a1a1a] transition-colors shadow-sm"}
                                                      >
                                                          <div className={"text-[10px] font-black text-gray-500 uppercase tracking-widest flex items-center"}><i className={"fas fa-archive mr-2"}></i> ĐÃ NHẬN THƯỞNG ({displayClaimedKPIs.length})</div>
                                                          <i className={`fas fa-chevron-${openSection[`${u}_claimedKPIs`] ? 'up' : 'down'} text-gray-600 text-[10px] transition-transform`}></i>
                                                      </div>
                                                      {openSection[`${u}_claimedKPIs`] && (
                                                          <div className={"space-y-3 animate-slide-down"}>
                                                              {displayClaimedKPIs.map(k => (
                                                                  <div key={k.id} className={"relative bg-[#10b981]/5 p-3 rounded-xl border border-[#10b981]/20 flex items-center justify-between shadow-sm"}>
                                                                      <div className={"flex items-center gap-3"}><div className={"w-8 h-8 rounded-full bg-[#10b981]/20 flex items-center justify-center text-[#10b981]"}><i className={"fas fa-check"}></i></div><div><div className={"text-[12px] font-black text-[#10b981]"}>{k.kpiName}</div><div className={"text-[10px] text-gray-400 font-bold mt-0.5"}><i className={"far fa-calendar-check mr-1"}></i> {formatDR(k.startTime, k.endTime)}</div></div></div>
                                                                      <div className={"flex items-center gap-3"}>{Number(k.reward) > 0 && <div className={"text-right"}><div className={"text-[9px] text-gray-500 uppercase"}>Đã nhận</div><div className={"text-[13px] font-black text-amber-400"}>+{formatMoney(k.reward)}đ</div></div>}
                                                                      {isBoss && <button onClick={() => handleDeleteKPI(k)} className={"w-7 h-7 rounded-lg bg-[#1a1a1a] border border-[#333] text-rose-500/50 hover:bg-rose-500 flex items-center justify-center"}><i className={"fas fa-trash text-[10px]"}></i></button>}</div>
                                                                  </div>
                                                              ))}
                                                          </div>
                                                      )}
                                                  </div>
                                              )}
                                          </>
                                      )}
                                  </div>
                              )}
                          </div>
                       );
                   })})()}
              </div>
          </div>
      )}

      {subTab === 'PAYROLL' && (
          <div className={"mt-4 animate-fade-in pb-10"}>
              
              {/* KHUNG TỔNG QUỸ LƯƠNG (Chỉ Boss/HR/Kế toán thấy) */}
              <div className={"bg-gradient-to-br from-[#1a1c29] to-[#0a0a0a] border border-[#3b82f6]/30 rounded-2xl p-4 shadow-lg mb-5"}>
                  <div className={"flex items-center justify-between mb-3 border-b border-[#222] pb-2"}>
                      <div className={"flex items-center gap-2"}>
                          <div className={"w-7 h-7 rounded-full bg-[#3b82f6]/20 flex items-center justify-center text-[#3b82f6]"}><i className={"fas fa-wallet"}></i></div>
                          <span className={"font-black text-[13px] text-[#3b82f6] uppercase tracking-widest"}>Tổng Quỹ Lương Kỳ Này</span>
                      </div>
                      <div className={"flex items-center gap-2"}>
                          {isBoss && (
                              <button onClick={handleCloseMonth} disabled={closingMonth} className={"text-[10px] bg-rose-500/20 text-rose-500 hover:bg-rose-500 hover:text-white px-3 py-1.5 rounded border border-rose-500/50 font-black transition-all shadow-sm flex items-center gap-1"}>
                                  {closingMonth ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-lock"></i>}
                                  {closingMonth ? 'Đang xử lý...' : 'Chốt Sổ Cuối Tháng'}
                              </button>
                          )}
                          <div className={"text-[10px] text-gray-500 font-bold bg-[#111] px-2 py-1 rounded border border-[#222]"}>
                              {payroll.length} Nhân sự
                          </div>
                      </div>
                  </div>
                  <div className={"flex justify-between items-center"}>
                      <div>
                          <div className={"text-[10px] text-gray-400 uppercase font-bold mb-1"}>Tổng lương toàn xưởng (Gross)</div>
                          <div className={"text-[22px] font-black text-white"}>
                              {(isBoss || ['KẾ TOÁN', 'QUẢN LÝ NHÂN SỰ', 'NHÂN SỰ'].includes(String(currentRole).toUpperCase())) 
                                  ? `${formatMoney(payroll.reduce((sum, p) => sum + p.tongThuNhap, 0))} đ` 
                                  : '*****'}
                          </div>
                      </div>
                      <div className={"text-right"}>
                          <div className={"text-[10px] text-gray-400 uppercase font-bold mb-1"}>Thực tế cần chi trả</div>
                          <div className={"text-[22px] font-black text-[#10b981]"}>
                              {(isBoss || ['KẾ TOÁN', 'QUẢN LÝ NHÂN SỰ', 'NHÂN SỰ'].includes(String(currentRole).toUpperCase())) 
                                  ? `${formatMoney(payroll.reduce((sum, p) => sum + p.conCanTra, 0))} đ` 
                                  : '*****'}
                          </div>
                      </div>
                  </div>
              </div>

              <div className={"grid grid-cols-1 lg:grid-cols-2 gap-5 mt-5"}>
              {payroll.map(p => (
                  <div key={p.user} className={"rf-card p-4 md:p-5 relative overflow-hidden"}>
                      {canManagePayroll && (erpData?.BonusPenalty || []).filter(b => b.user === p.user && b.type === 'Yêu Cầu Tạm Ứng' && b.orderCode === 'Chờ Duyệt').map(req => (
                          <div key={req.id} className="bg-rose-500/10 border border-rose-500/30 rounded-lg p-3 mb-4 flex justify-between items-center animate-fade-in shadow-sm">
                              <div>
                                  <div className="text-rose-500 font-bold text-[12px]"><i className="fas fa-hand-holding-usd mr-1"></i> Yêu cầu tạm ứng: {formatMoney(req.amount)}đ</div>
                                  <div className="text-gray-400 text-[11px] mt-1">Lý do: {req.note}</div>
                              </div>
                              <div className="flex gap-2">
                                  <button onClick={(e) => { e.stopPropagation(); pushDeltas({ deletes: { BonusPenalty: [req.id] } }, 'Đã từ chối', 'fa-times') }} className="px-3 py-1.5 bg-[#111] border border-[#333] text-gray-400 rounded text-[10px] hover:text-white transition-colors"><i className="fas fa-times"></i> Từ chối</button>
                                  <button onClick={(e) => { e.stopPropagation(); 
                                      const defaultAcc = (erpData?.Accounts || []).find(a => (a.accountName || a.name) === 'Công Ty') || (erpData?.Accounts || [])[0]; 
                                      setPayrollAction({ 
                                          type: String(req.note).includes('(Cho Vay)') ? 'cho_vay' : 'tam_ung', 
                                          target: p.user, 
                                          amount: req.amount, 
                                          note: req.note, 
                                          accountId: defaultAcc?.id || '',
                                          requestId: req.id
                                      });
                                  }} className="px-4 py-1.5 bg-gradient-to-r from-rose-500 to-red-500 text-white rounded text-[11px] font-black shadow-sm hover:scale-105 active:scale-95 transition-transform">DUYỆT</button>
                              </div>
                          </div>

                          <>

                                  <div className="text-gray-400 text-[11px] uppercase font-bold">Dư Nợ Hiện Tại</div>
                                  <div className="text-red-500 text-xl font-black">-{formatMoney(payrollAction.amount)}đ</div>
                              </div>
                              <div className="space-y-2 mt-3">
                                  <label className={"text-gray-400 font-bold block mb-1 text-[11px] uppercase"}>Chọn Phương Án Xử Lý</label>
                                  <label className={`block border ${payrollAction.mode === 'DEBT_NEXT_MONTH' ? 'border-red-500 bg-red-500/10' : 'border-[#333] bg-[#0a0a0a]'} rounded-lg p-2.5 cursor-pointer hover:border-red-500/50 transition-colors`}>
                                      <div className="flex items-center gap-2">
                                          <input type="radio" name="debt-mode" checked={payrollAction.mode === 'DEBT_NEXT_MONTH'} onChange={() => setPayrollAction({...payrollAction, mode: 'DEBT_NEXT_MONTH'})} className="accent-red-500" />
                                          <span className={`font-bold ${payrollAction.mode === 'DEBT_NEXT_MONTH' ? 'text-red-500' : 'text-gray-300'} text-[12px]`}>Kết chuyển Nợ Tháng Trước (Trừ sạch vào kỳ sau)</span>
                                      </div>
                                      <div className="text-gray-500 text-[10px] ml-5 mt-0.5">Khuyên dùng cho khoản dư nợ &lt; 1 triệu VNĐ</div>
                                  </label>
                                  <label className={`block border ${payrollAction.mode === 'LOAN_INSTALLMENT' ? 'border-purple-500 bg-purple-500/10' : 'border-[#333] bg-[#0a0a0a]'} rounded-lg p-2.5 cursor-pointer hover:border-purple-500/50 transition-colors`}>
                                      <div className="flex items-center gap-2">
                                          <input type="radio" name="debt-mode" checked={payrollAction.mode === 'LOAN_INSTALLMENT'} onChange={() => setPayrollAction({...payrollAction, mode: 'LOAN_INSTALLMENT'})} className="accent-purple-500" />
                                          <span className={`font-bold ${payrollAction.mode === 'LOAN_INSTALLMENT' ? 'text-purple-400' : 'text-gray-300'} text-[12px]`}>Chuyển thành Khoản Vay Nội Bộ (Trả góp)</span>
                                      </div>
                                      <div className="text-gray-500 text-[10px] ml-5 mt-0.5">Khuyên dùng cho dư nợ lớn để tránh âm lương kỳ sau</div>
                                  </label>
                              </div>
                              {payrollAction.mode === 'LOAN_INSTALLMENT' && (
                                  <div className="mt-3 animate-fade-in pl-5 border-l-2 border-purple-500/50 ml-1">
                                      <label className={"text-purple-400 font-bold block mb-1 text-[11px]"}>Mức trừ góp mỗi tháng (VNĐ)</label>
                                      <input type="number" value={payrollAction.monthlyDeduction} onChange={e => setPayrollAction({...payrollAction, monthlyDeduction: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 font-black outline-none text-purple-400 focus:border-purple-500" placeholder="VD: 1000000" />
                                  </div>
                              )}
                          </>
                      ) : (
                          <>
                          <div>
                              <label className={"text-gray-400 font-bold block mb-1"}>Số tiền (VNĐ)</label>
                              <input type="number" value={payrollAction.amount} onChange={e => setPayrollAction({...payrollAction, amount: e.target.value})} className={`w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 font-black outline-none ${payrollAction.type === 'thuong' ? 'text-amber-500 focus:border-amber-500' : (payrollAction.type === 'tam_ung' || payrollAction.type === 'cho_vay' ? 'text-rose-500 focus:border-rose-500' : 'text-[#10b981] focus:border-[#10b981]')}`} placeholder="0" />
                          </div>
                          <div>
                              <label className={"text-gray-400 font-bold block mb-1"}>Ghi chú / Lý do</label>
                              <input type="text" value={payrollAction.note} onChange={e => setPayrollAction({...payrollAction, note: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white outline-none focus:border-blue-500" placeholder="Nhập lý do chi..." />
                          </div>
                      {payrollAction.type === 'cho_vay' && (
                          <div className={"flex gap-3"}>
                              <div className={"flex-1"}>
                                  <label className={"text-gray-400 font-bold block mb-1"}>Ngày cho vay</label>
                                  <input type="date" value={payrollAction.loanDate || ''} onChange={e => setPayrollAction({...payrollAction, loanDate: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none focus:border-purple-500" />
                              </div>
                              <div className={"flex-1"}>
                                  <label className={"text-gray-400 font-bold block mb-1"}>Ngày cần thu</label>
                                  <input type="date" value={payrollAction.dueDate || ''} onChange={e => setPayrollAction({...payrollAction, dueDate: e.target.value})} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none focus:border-purple-500" />
                              </div>
                          </div>
                      )}
                      </>
                      )}
                      {(payrollAction.type === 'tam_ung' || payrollAction.type === 'cho_vay' || payrollAction.type === 'thanh_toan') && (
                          <div>
                              <label className={"text-gray-400 font-bold block mb-1"}>Trích từ tài khoản</label>
                              <select 
                                  value={payrollAction.accountId} 
                                  onChange={e => setPayrollAction({...payrollAction, accountId: e.target.value})} 
                                  className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2.5 text-white outline-none font-bold focus:border-blue-500"
                              >
                                  {(erpData?.Accounts || []).map(acc => (
                                      <option key={acc.id} value={acc.id}>
                                          {acc.accountName || acc.name} ({Number(acc.balance || 0).toLocaleString('vi-VN')}đ)
                                      </option>
                                  ))}
                              </select>
                          </div>
                      )}
                  </div>
                  <div className={"flex gap-2 mt-5"}>
                      <button onClick={() => setPayrollAction(null)} className={"flex-1 py-2.5 bg-[#222] text-gray-400 font-black rounded-xl"}>HỦY BỎ</button>
                      <button onClick={handlePayrollActionSubmit} className={`flex-1 py-2.5 font-black rounded-xl text-black ${payrollAction.type === 'thuong' ? 'bg-amber-500' : (payrollAction.type === 'tam_ung' ? 'bg-rose-500 text-white' : 'bg-[#10b981]')}`}>XÁC NHẬN</button>
                  </div>
              </div>
          </div>
      )}

      {showLeaveModal && (
          <div className={"fixed inset-0 bg-black/80 flex items-center justify-center z-[999] p-4 backdrop-blur-sm animate-fade-in"}>
              <div className={"rf-modal-content w-full max-w-sm p-5 shadow-2xl"}>
                  <h3 className={"font-black text-white mb-4 text-[13px] uppercase tracking-wide border-b border-[#222] pb-2"}>TẠO LỆNH BÁO NGHỈ</h3>
                  <div className={"space-y-3 text-[11px]"}>
                      <div>
                          <label className={"text-gray-400 font-bold block mb-1"}>Ngày nghỉ</label>
                          <input type="date" value={leaveForm.date} onChange={e=>setLeaveForm({...leaveForm, date: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none"} />
                      </div>
                      <div>
                          <label className={"text-gray-400 font-bold block mb-1"}>Ca nghỉ</label>
                          <select value={leaveForm.shift} onChange={e=>setLeaveForm({...leaveForm, shift: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white outline-none"}>
                              <option value="Cả Ngày">Cả Ngày</option>
                              <option value="Sáng">Ca Sáng</option>
                              <option value="Chiều">Ca Chiều</option>
                              <option value="Tối">Ca Tối</option>
                          </select>
                      </div>
                      <div>
                          <label className={"text-gray-400 font-bold block mb-1"}>Lý do</label>
                          <textarea value={leaveForm.note} onChange={e=>setLeaveForm({...leaveForm, note: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#333] rounded-lg p-2 text-white min-h-[60px] outline-none"} placeholder="Ghi rõ lý do xin nghỉ..."></textarea>
                      </div>
                  </div>
                  <div className={"flex gap-2 mt-5"}>
                      <button onClick={() => setShowLeaveModal(false)} className={"flex-1 py-2 bg-[#222] text-gray-300 font-black rounded-xl text-[11px]"}>HỦY BỎ</button>
                      <button onClick={submitLeave} className={"flex-1 py-2 bg-[#3b82f6] text-white font-black rounded-xl text-[11px]"}>GỬI YÊU CẦU</button>
                  </div>
              </div>
          </div>
      )}

      {showKPIModal && (
          <div className={"fixed inset-0 bg-black/80 flex items-center justify-center z-[999] p-4 backdrop-blur-sm animate-fade-in"}>

                  <div className={"p-4 border-b border-[#222] bg-[#1a1a1a] flex justify-between items-center"}>
                      <h3 className={"font-black text-[#d4af37] uppercase text-[13px] tracking-widest"}><i className={"fas fa-scroll mr-2"}></i >{editKPI ? 'Chỉnh Sửa Nhiệm Vụ' : 'Giao Nhiệm Vụ Mới'}</h3>
                      <button onClick={() => { setShowKPIModal(false); setEditKPI(null); }} className={"w-8 h-8 rounded-full bg-[#222] hover:bg-rose-500 flex items-center justify-center"}><i className={"fas fa-times"}></i></button>
                  </div>
                  <div className={"p-5 space-y-4 max-h-[70vh] overflow-y-auto custom-scrollbar"}>
                      {/* 1. RECURRENCE SELECTOR */}
                      {!editKPI && kpiType === 'task' && (
                          <div>
                              <label className={"text-[10px] font-black text-gray-500 block mb-1.5"}>CHU KỲ NHIỆM VỤ</label>
                              <select 
                                  value={kpiPeriodType} 
                                  onChange={e => {
                                      const val = e.target.value;
                                      setKpiPeriodType(val);
                                      const now = new Date();
                                      if (val === 'Daily') {
                                          setKpiForm(prev => ({ ...prev, startTime: currentDate, endTime: currentDate }));
                                      } else if (val === 'Monthly') {
                                          const y = now.getFullYear();
                                          const m = String(now.getMonth() + 1).padStart(2, '0');
                                          const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
                                          setKpiForm(prev => ({ ...prev, startTime: `${y}-${m}-01`, endTime: `${y}-${m}-${lastDay}` }));
                                      }
                                  }} 
                                  className={"w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3.5 text-white font-bold outline-none"}
                              >
                                  <option value="Daily">Hàng Ngày (Daily)</option>
                                  <option value="Monthly">Hàng Tháng (Monthly)</option>
                                  <option value="Custom">Tùy Chọn Khoảng Ngày</option>
                              </select>
                          </div>
                      )}
