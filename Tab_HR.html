<script type="text/babel">
// =========================================================================
// 👥 FILE: Tab_HR.txt
// CHỨC NĂNG: Trung Tâm Nhân Sự (Chấm Công, Giao Việc KPI, Bảng Lương)
// NÂNG CẤP: Lọc thời gian theo Tháng (Tùy chỉnh) & Phân quyền RBAC CHUẨN CHỈ
// =========================================================================



const HRTab = React.memo(function HRTab({ documents, hasPerm, attendance, erpData, userConfigs, prodItems, packings, pushDeltas, triggerToast }) {
  const currentUser = localStorage.getItem('rf_user') || '';
  const currentRole = localStorage.getItem('rf_role') || '';
  const isBoss = localStorage.getItem('rf_boss') === 'true';
  
  // PHÂN QUYỀN CHUẨN CHỈ: Chỉ Quản lý Nhân sự mới được Sửa Công. Các nút Tiền/KPI đều là isBoss.
  const canEditAttendance = (hasPerm && hasPerm('HR_PAYROLL')) || isBoss || currentRole === 'NHÂN SỰ' || currentRole === 'QUẢN LÝ';
  const canManagePayroll = (hasPerm && (hasPerm('HR_PAYROLL') || hasPerm('FINANCE'))) || isBoss || currentRole === 'KẾ TOÁN' || currentRole === 'NHÂN SỰ' || currentRole === 'QUẢN LÝ';


  const formatMoney = (val) => Math.ceil(Number(val || 0)).toLocaleString('vi-VN');
  const cleanNumber = (val) => typeof val === 'number' ? val : Number(String(val || '').replace(/[^0-9]/g, '')) || 0;
  

  const [openSection, setOpenSection] = React.useState({});
  const toggleSection = (user, section, e) => {
      if(e) e.stopPropagation();
      setOpenSection(prev => ({...prev, [`${user}_${section}`]: !prev[`${user}_${section}`]}));
  };
  
  const [expandedKPIs, setExpandedKPIs] = React.useState({});
  const toggleKPIExpand = (user) => setExpandedKPIs(prev => ({...prev, [user]: !prev[user]}));

  const [subTab, setSubTab] = React.useState('ATTENDANCE');
  
  const [filter, setFilter] = React.useState('Tháng Này');
  const [customMonth, setCustomMonth] = React.useState(() => new Date().toISOString().slice(0, 7)); // Format YYYY-MM
  const currentDate = new Date().toISOString().split('T')[0];

  const users = userConfigs?.users || [];
  const rawAttData = attendance || [];
  const bpData = erpData?.BonusPenalty || [];
  const kpiData = erpData?.KPI_Progress || [];
  const safeProdItems = prodItems || [];
  const safePackings = packings || [];
  const orders = erpData?.Orders || []; 

  // --- QUEST BOARD STATES ---
  const [showAddShared, setShowAddShared] = React.useState(false);
  const [shName, setShName] = React.useState('');
  const [shNote, setShNote] = React.useState('');
  const [shReward, setShReward] = React.useState('');
  const [processing, setProcessing] = React.useState(false);
  const [viewingPayslip, setViewingPayslip] = React.useState(null);
  
  const sharedTasks = React.useMemo(() => {
    return (safeProdItems || []).filter(i => i.orderId === 'SHARED_TASK');
  }, [safeProdItems]);
  // --------------------------

  const handleDirectEdit = (e, p, fieldName, displayLabel, currentVal) => {
      e.stopPropagation();
      const newVal = prompt(`Sửa ${displayLabel} (Dữ liệu gốc) cho ${p.user}:\nNhập số tiền mới (VND):`, currentVal);
      if (newVal === null) return;
      
      const cleanVal = newVal.replace(/[^0-9]/g, '');
      const numSalary = Number(cleanVal) || 0;
      
      let updatedSalaries = { ...(userConfigs?.salaries || {}) };
      updatedSalaries[p.user] = {
          ...(updatedSalaries[p.user] || {})
      };
      
      if (fieldName === 'baseSalary') {
          updatedSalaries[p.user].baseSalary = numSalary;
          updatedSalaries[p.user]['Lương Cơ Bản'] = numSalary;
      } else if (fieldName === 'funcSalary') {
          updatedSalaries[p.user].funcSalary = numSalary;
          updatedSalaries[p.user]['Lương Chức Vụ'] = numSalary;
      } else if (fieldName === 'allowance') {
          updatedSalaries[p.user].allowance = numSalary;
          updatedSalaries[p.user]['Phụ Cấp Xăng Xe'] = numSalary;
      }

      const newUserConfigs = {
          ...userConfigs,
          salaries: updatedSalaries
      };

      if (pushDeltas) {
          pushDeltas({ UserConfigs: [newUserConfigs] }, `Đã lưu ${displayLabel} cho ${p.user}!`, 'fa-check');
      } else {
          triggerToast('Lỗi: Thiếu quyền đồng bộ', 'fa-times', 'danger');
      }
  };

  const handleDirectBonusEdit = (e, p, type, currentAmount) => {
      e.stopPropagation();
      const newVal = prompt(`Sửa [${type}] cho ${p.user}:\nNhập số tiền mới (VND):`, currentAmount);
      if (newVal === null) return;
      
      const cleanVal = newVal.replace(/[^0-9-]/g, '');
      const numVal = Number(cleanVal) || 0;
      
      const bpId = `BP_${type.replace(/ /g, '')}_${p.user}_${filterMonth}`;
      const newBP = {
          id: bpId,
          user: p.user,
          amount: numVal,
          type: type,
          date: payrollTargetDate,
          note: 'Sửa trực tiếp',
          isResolved: true
      };
      
      if (pushDeltas) {
          pushDeltas({ BonusPenalty: [newBP] }, `Đã lưu ${type} cho ${p.user}!`, 'fa-check');
      } else {
          triggerToast('Lỗi: Thiếu quyền đồng bộ', 'fa-times', 'danger');
      }
  };

  const handleAddPrintComment = (e, p) => {
      e.stopPropagation();
      const comment = prompt(`Nhập nhận xét (hiển thị trên Phiếu Lương) cho ${p.user}:`, p.nhanXetText !== 'Không có nhận xét nào được viết tại đây.' ? p.nhanXetText : '');
      if (comment === null) return;

      const userBPs = bpData.filter(b => String(b.user).trim() === String(p.user).trim() && b.date && isDateInRange(b.date, filter, customMonth));
      const nhanXetRec = userBPs.find(b => b.type === 'Nhận Xét');

      const newBp = {
          id: nhanXetRec ? nhanXetRec.id : `BP_${Date.now()}_${Math.floor(Math.random()*1000)}`,
          user: p.user,
          type: 'Nhận Xét',
          amount: 0,
          note: comment,
          date: nhanXetRec ? nhanXetRec.date : currentDate,
          recordedBy: currentUser,
          timestamp: new Date().toISOString()
      };
      
      if (pushDeltas) {
          pushDeltas({ BonusPenalty: [newBp] }, `Đã lưu nhận xét cho ${p.user}!`, 'fa-check');
      } else {
          triggerToast('Lỗi: Thiếu quyền đồng bộ', 'fa-times', 'danger');
      }
  };

  const [isGeneratingKPI, setIsGeneratingKPI] = React.useState(false);

  const handleGenerateAllKPI = () => {
      Swal.fire({
          title: 'Tạo KPI Hàng Loạt?',
          text: 'Hệ thống sẽ tính toán Lương Thời Gian và sinh KPI mục tiêu cho TOÀN BỘ nhân sự dựa trên Chức Danh (Role-Based).',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#3b82f6',
          cancelButtonColor: '#222',
          confirmButtonText: 'Tạo Ngay'
      }).then((result) => {
          if (result.isConfirmed) {
              setIsGeneratingKPI(true);
              // Khởi tạo map rỗng (backend sẽ tự generate target based on Role)
              window.runGAS('generateMonthlyKPI_All', { pin: window.adminPin || prompt('Nhập mã PIN Quản Lý:'), allStatsMap: {} })
                  .then(res => {
                      setIsGeneratingKPI(false);
                      if (res.success) {
                          Swal.fire('Thành công!', res.message, 'success');
                          if (typeof window.forceRefresh === 'function') window.forceRefresh();
                      } else {
                          Swal.fire('Lỗi', res.message, 'error');
                      }
                  })
                  .catch(err => {
                      setIsGeneratingKPI(false);
                      Swal.fire('Lỗi', String(err), 'error');
                  });
          }
      });
  };

  const [claimingIds, setClaimingIds] = React.useState([]);

  const mvpId = React.useMemo(() => {
      let maxTasks = 0; let mId = null;
      users.forEach(u => {
          const userKPIs = kpiData.filter(k => k.user === u);
          const claimed = userKPIs.filter(k => (k.isClaimed === 'true' || k.isClaimed === true));
          const monthly = claimed.filter(k => k.startTime && k.startTime.startsWith(currentDate.slice(0, 7))).length;
          if (monthly > maxTasks && monthly > 0) { maxTasks = monthly; mId = u; }
      });
      return mId;
  }, [kpiData, users, currentDate]);

  const [editingPayroll, setEditingPayroll] = React.useState(null);
  const [directPenalty, setDirectPenalty] = React.useState(null);

  const extractTimeLocal = (str) => {
      if (!str) return null;
      let s = String(str).trim();
      if (s.includes('T') && s.includes('Z')) { 
          const d = new Date(s); 
          if (!isNaN(d.getTime())) return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      const match = s.match(/([0-1]?[0-9]|2[0-3]):([0-5][0-9])/); 
      return match ? `${match[1].padStart(2, '0')}:${match[2]}` : null;
  };

  const [currentTimeMins, setCurrentTimeMins] = React.useState(() => new Date().getHours() * 60 + new Date().getMinutes());
  React.useEffect(() => {
      const interval = setInterval(() => {
          setCurrentTimeMins(new Date().getHours() * 60 + new Date().getMinutes());
      }, 30000); 
      return () => clearInterval(interval);
  }, []);

  const activeShift = React.useMemo(() => {
      if (currentTimeMins >= 360 && currentTimeMins < 780) return 'Sáng';      
      if (currentTimeMins >= 780 && currentTimeMins < 1140) return 'Chiều';    
      if (currentTimeMins >= 1140 || currentTimeMins < 360) return 'Tối';      
      return null;
  }, [currentTimeMins]);

  const isDateInRange = (dateStr, filterStr = filter, customM = customMonth) => {
      if (!dateStr) return false;
      const d = new Date(dateStr); const today = new Date();
      if (filterStr === 'Hôm Nay') return d.toDateString() === today.toDateString();
      if (filterStr === 'Hôm Qua') { const y = new Date(today); y.setDate(y.getDate() - 1); return d.toDateString() === y.toDateString(); }
      if (filterStr === 'Tháng Này') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
      if (filterStr === 'Tháng Trước') { 
          const m = new Date(today); m.setMonth(m.getMonth() - 1);
          return d.getMonth() === m.getMonth() && d.getFullYear() === m.getFullYear(); 
      }
      if (filterStr === 'Tuỳ Chỉnh') {
          if (!customM) return true;
          const [year, month] = customM.split('-');
          return d.getFullYear() === parseInt(year, 10) && d.getMonth() === (parseInt(month, 10) - 1);
      }
      return false;
  };

  const attData = React.useMemo(() => {
      const uniqueMap = new Map();
      rawAttData.forEach(a => {
          const sft = a.shift || (a.leaveType ? 'Nghỉ' : 'Ca Cũ');
          const key = `${String(a.user).trim()}_${a.date}_${sft}`;
          if (!uniqueMap.has(key) || (a.timeOut && !uniqueMap.get(key).timeOut)) {
              uniqueMap.set(key, a);
          }
      });
      const dedupedRaw = Array.from(uniqueMap.values());

      return dedupedRaw.map(a => {
          let tIn = extractTimeLocal(a.timeIn) || extractTimeLocal(a.morningIn || a.afternoonIn) || '';
          let tOut = extractTimeLocal(a.timeOut) || extractTimeLocal(a.afternoonOut || a.morningOut) || '';
          let penalty = Number(a.penalty || 0);
          let status = a.status;
          let shift = a.shift || (a.leaveType ? 'Nghỉ' : 'Ca Cũ');
          
          const isToday = a.date === currentDate;
          const isPast = a.date < currentDate;

          if (tIn && !tOut && shift !== 'Nghỉ Phép' && !a.isEdited) {
              let isMissed = false;
              if (shift === 'Sáng' && (isPast || (isToday && currentTimeMins >= 780))) { 
                  isMissed = true; tOut = '13:00';
              } else if (shift === 'Chiều' && (isPast || (isToday && currentTimeMins >= 1140))) { 
                  isMissed = true; tOut = '19:00';
              } else if (shift === 'Tối' && (isPast || (isToday && (currentTimeMins >= 360 && currentTimeMins < 1140)))) { 
                  isMissed = true; tOut = '06:00';
              }
              if (isMissed) {
                  if (!String(status).includes('Quên chấm ra')) {
                      penalty += 5000; status = 'Quên chấm ra (-5k)';
                  }
              }
          }

          let h = 0;
          const calcH = (inStr, outStr) => {
              if (!inStr || !outStr) return 0;
              const [inH, inM] = inStr.split(':').map(Number); 
              const [outH, outM] = outStr.split(':').map(Number);
              let startMins = inH * 60 + inM; let endMins = outH * 60 + outM;
              if (endMins < startMins) endMins += 24 * 60;
              const lunchStart = 720; const lunchEnd = 840;
              const overlapStart = Math.max(startMins, lunchStart);
              const overlapEnd = Math.min(endMins, lunchEnd);
              const lunchBreakMins = Math.max(0, overlapEnd - overlapStart);
              let totalMins = (endMins - startMins) - lunchBreakMins;
              return Math.max(0, totalMins / 60);
          };

          if (tIn && tOut) h = calcH(tIn, tOut);
          else if (a.totalHours) h = Number(String(a.totalHours).replace(/,/g, '.'));
          return { 
              ...a, shift, timeIn: tIn, timeOut: tOut, 
              totalHours: h.toFixed(2), 
              status: status || (a.leaveType ? `Nghỉ: ${a.leaveType}` : (h > 0 ? 'Hoàn thành' : 'Đang làm việc')), 
              penalty: penalty, isEdited: a.isEdited || false 
          };
      });
  }, [rawAttData, currentDate, currentTimeMins]);


  const filterMonth = filter === 'Tuỳ Chỉnh' ? customMonth : new Date().toISOString().slice(0, 7);

  // Ép ngày nhập tay vào đúng với kỳ lương đang xem để data không bay sang tháng sau
  const payrollTargetDate = React.useMemo(() => {
      if (filter === 'Tháng Trước') {
          const d = new Date(); d.setMonth(d.getMonth() - 1);
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-28`;
      }
      if (filter === 'Tuỳ Chỉnh') return `${customMonth}-28`;
      return currentDate;
  }, [filter, customMonth, currentDate]);

  const [showLeaveModal, setShowLeaveModal] = React.useState(false);
  const [leaveForm, setLeaveForm] = React.useState({ date: currentDate, shift: 'Cả Ngày', note: '' });
  const [showHistoryUser, setShowHistoryUser] = React.useState(null);
  const [expandedPayroll, setExpandedPayroll] = React.useState(null);
  const [editAtt, setEditAtt] = React.useState(null);
  const [payrollAction, setPayrollAction] = React.useState(null);

  const [showKPIModal, setShowKPIModal] = React.useState(false);
  const [showSalesKPIModal, setShowSalesKPIModal] = React.useState(false);
  const [kpiType, setKpiType] = React.useState('task'); 
  const [kpiForm, setKpiForm] = React.useState({ user: users[0] || '', kpiName: 'Dựng khung', target: '', unit: 'SP', startTime: currentDate, endTime: '', reward: '', penalty: '' });
  const [devGoals, setDevGoals] = React.useState([{ name: '', reward: '' }]); 
  const [editKPI, setEditKPI] = React.useState(null);
  const [kpiPeriodType, setKpiPeriodType] = React.useState('Daily');
  const [kpiTrackingType, setKpiTrackingType] = React.useState('auto');

  const [selectedShiftTab, setSelectedShiftTab] = React.useState('Sáng');
  React.useEffect(() => {
      if (activeShift) setSelectedShiftTab(activeShift);
  }, [activeShift]);

  const morningRecord = React.useMemo(() => attData.find(a => String(a.user).trim() === currentUser.trim() && a.date === currentDate && a.shift === 'Sáng'), [attData, currentUser, currentDate]);
  const afternoonRecord = React.useMemo(() => attData.find(a => String(a.user).trim() === currentUser.trim() && a.date === currentDate && a.shift === 'Chiều'), [attData, currentUser, currentDate]);
  const eveningRecord = React.useMemo(() => attData.find(a => String(a.user).trim() === currentUser.trim() && a.date === currentDate && a.shift === 'Tối'), [attData, currentUser, currentDate]);
  
  const currentSelectedRecord = React.useMemo(() => {
      if (selectedShiftTab === 'Sáng') return morningRecord;
      if (selectedShiftTab === 'Chiều') return afternoonRecord;
      if (selectedShiftTab === 'Tối') return eveningRecord;
      return null;
  }, [selectedShiftTab, morningRecord, afternoonRecord, eveningRecord]);

  const handleCheckInOut = async (action, targetShift) => {
      const timeStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
      let existingRec = attData.find(a => String(a.user).trim() === currentUser.trim() && a.date === currentDate && a.shift === targetShift);
      let payload = {};
      if (action === 'IN') {
          if (existingRec && existingRec.timeIn) return triggerToast(`Bạn đã vào ca ${targetShift} rồi!`, 'fa-exclamation', 'warning');
          payload = { id: existingRec ? existingRec.id : `ATT_${Date.now()}`, user: currentUser, date: currentDate, shift: targetShift, timeIn: timeStr, status: 'Đang làm việc', penalty: 0, isEdited: false };
      } else {
          if (!existingRec || !existingRec.timeIn) return triggerToast(`Chưa vào ca ${targetShift}!`, 'fa-exclamation', 'warning');
          if (existingRec.timeOut) return triggerToast(`Đã ra ca ${targetShift} rồi!`, 'fa-exclamation', 'warning');
          let inH = Number(existingRec.timeIn.split(':')[0]); let inM = Number(existingRec.timeIn.split(':')[1]);
          let outH = Number(timeStr.split(':')[0]); let outM = Number(timeStr.split(':')[1]);
          let diffMins = (outH * 60 + outM) - (inH * 60 + inM);
          if (diffMins < 0) diffMins += 24 * 60;
          payload = { ...existingRec, timeOut: timeStr, totalHours: (diffMins/60).toFixed(2), status: 'Hoàn thành' };
      }
      try { await pushDeltas({ attendance: [payload] }, `Đã ${action==='IN'?'vào':'ra'} ${targetShift}!`, 'fa-check');
      } catch(e) { triggerToast('Lỗi mạng!', 'fa-times', 'danger'); }
  };

  React.useEffect(() => {
      const missedRecord = attData.find(a => 
          String(a.user).trim() === currentUser.trim() &&
          String(a.status).includes('Quên chấm ra') &&
          a.timeIn &&
          a.timeOut &&
          a.penalty > 0
      );
      if (missedRecord) {
          const rawMatches = rawAttData.find(r => r.id === missedRecord.id);
          if (rawMatches && !String(rawMatches.status).includes('Quên chấm ra')) {
              pushDeltas({ attendance: [missedRecord] }, `Tự động đóng ca (Quên chấm ra ca ${missedRecord.shift})`, 'fa-exclamation');
          }
      }
  }, [attData, rawAttData, currentUser, pushDeltas]);

  const handleSaveEditAtt = async () => {
      let tIn = editAtt.timeIn || '';
      let tOut = editAtt.timeOut || '';
      let shift = editAtt.shift;
      
      let status = '';
      let diffMins = 0;

      if (!tIn && !tOut) {
          const leavesThisPeriod = attData.filter(a => String(a.user).trim() === String(editAtt.user).trim() && a.date && isDateInRange(a.date) && String(a.status || '').includes('Nghỉ')).length;
          if (leavesThisPeriod >= 2) {
              status = 'Nghỉ quá quy định';
          } else {
              status = 'Nghỉ có phép';
          }
      } else if (tIn && !tOut) {
          status = 'Đang làm việc';
      } else if (tIn && tOut) {
          let inH = Number(tIn.split(':')[0]); let inM = Number(tIn.split(':')[1]); 
          let outH = Number(tOut.split(':')[0]); let outM = Number(tOut.split(':')[1]);
          diffMins = (outH * 60 + outM) - (inH * 60 + inM);
          if (diffMins < 0) diffMins += 24 * 60;
          status = 'Hoàn thành';
      }

      if (tIn) {
          let inH = Number(tIn.split(':')[0]); let inM = Number(tIn.split(':')[1]);
          let totalInMins = inH * 60 + inM;
          if (shift === 'Sáng' && totalInMins > (8 * 60 + 10)) {
              status = 'Đi muộn';
          } else if (shift === 'Chiều' && totalInMins > (14 * 60 + 10)) {
              status = 'Đi muộn';
          }
      }
      
      const payload = { ...editAtt, totalHours: (diffMins/60).toFixed(2), status: status, penalty: 0, isEdited: true };
      
      try { 
          await pushDeltas({ attendance: [payload] }, 'Cập nhật chấm công thành công!', 'fa-check'); 
          setEditAtt(null);
      } catch(e) { triggerToast('Lỗi đồng bộ!', 'fa-times', 'danger'); }
  };

  const handleDirectPenalty = async () => {
      if (!directPenalty.amount || !directPenalty.note) return triggerToast('Vui lòng nhập đầy đủ tiền và lý do phạt', 'fa-times', 'danger');
      const payload = { id: 'BP_PENALTY_' + Date.now(), user: directPenalty.user, amount: -Math.abs(Number(directPenalty.amount)), type: 'Phạt Quy Định', note: directPenalty.note, date: payrollTargetDate, orderCode: '' };
      try { 
          await pushDeltas({ BonusPenalty: [payload] }, 'Đã ghi nhận phạt!', 'fa-gavel'); 
          setDirectPenalty(null);
      } catch(e) { triggerToast('Lỗi đồng bộ!', 'fa-times', 'danger'); }
  };

  const submitLeave = async () => {
      if(!leaveForm.date || !leaveForm.shift) return triggerToast('Thiếu thông tin!', 'fa-exclamation', 'warning');
      const sDate = new Date(leaveForm.date + 'T00:00:00');
      const hoursNotice = (sDate.getTime() - new Date().getTime()) / 3600000;
      
      const leavesThisPeriod = attData.filter(a => String(a.user).trim() === currentUser.trim() && a.date && isDateInRange(a.date) && String(a.shift).includes('Nghỉ Phép'));
      let totalLeaveDays = 0;
      leavesThisPeriod.forEach(l => {
          if (l.leaveShift === 'Cả Ngày' || !l.leaveShift) totalLeaveDays += 1;
          else totalLeaveDays += 0.5;
      });
      
      const currentLeaveCost = leaveForm.shift === 'Cả Ngày' ? 1 : 0.5;
      
      let status = 'Nghỉ có phép'; let penalty = 0;
      if (hoursNotice < 12 || (totalLeaveDays + currentLeaveCost) > 2) { 
          status = 'Nghỉ không phép'; 
          penalty = leaveForm.shift === 'Cả Ngày' ? 200000 : 100000; 
      }
      
      const payload = { 
          id: `ATT_LEAVE_${Date.now()}`, 
          user: currentUser, 
          date: leaveForm.date, 
          shift: 'Nghỉ Phép', 
          leaveShift: leaveForm.shift,
          status, 
          penalty, 
          leaveReportAt: new Date().toISOString(), 
          note: leaveForm.note 
      };
      
      try { 
          await pushDeltas({ attendance: [payload] }, 'Đã gửi báo nghỉ!', 'fa-check'); 
          setShowLeaveModal(false);
          if (penalty > 0) alert(`LƯU Ý: Lệnh nghỉ này sẽ bị phạt ${formatMoney(penalty)}đ do báo sát giờ hoặc quá 2 ngày/tháng.`);

      const s = k.startTime || '2000-01-01'; const e = k.endTime || '2099-12-31';
      const inR = (d) => { if(!d) return false; const dt = String(d).split(' ')[0]; return dt >= s && dt <= e; };

      const phase = String(k.kpiName || '').toLowerCase();

      if (phase.includes('phase1') || phase.includes('cắt') || phase.includes('dán') || phase.includes('dựng') || phase.includes('khâu 1')) {
          safeProdItems.forEach(p => { 
              const user = p.p1_user || p.phases?.phase1?.user;
              const status = p.p1_status || p.phases?.phase1?.status;
              const endTime = p.p1_endTime || p.phases?.phase1?.endTime || p.date;
              if (String(user).trim() === String(u).trim() && status === 'Done' && inR(endTime)) count++; 
          });
      } else if (phase.includes('phase2') || phase.includes('gọt') || phase.includes('keo') || phase.includes('gia cố') || phase.includes('khâu 2')) {
          safeProdItems.forEach(p => { 
              const user = p.p2_user || p.phases?.phase2?.user;
              const status = p.p2_status || p.phases?.phase2?.status;

              if (String(user).trim() === String(u).trim() && status === 'Done' && inR(endTime)) count++; 
          });
      } else if (phase.includes('đóng gói') || phase.includes('pack')) {
          safePackings.forEach(pk => { 
              if (String(pk.user).trim() === String(u).trim() && pk.status === 'Done' && inR(pk.endTime || pk.date)) {

                  if (!orderStatus.includes('HỦY') && !orderStatus.includes('HUỶ') && !orderStatus.includes('HOÀN') && orderStatus !== 'CANCELLED') {
                      count++;
                  }

          bpData.forEach(bp => { if (String(bp.user).trim() === String(u).trim() && bp.type === 'Thưởng Bán Hàng' && inR(bp.date)) count += (Number(bp.amount) / 0.05); });

  const formatDR = (s, e) => { if (!s || !e) return 'Vô hạn'; return `${s.split('-').reverse().slice(0,2).join('/')} - ${e.split('-').reverse().slice(0,2).join('/')}`; };

  // Hàm parse ngày an toàn, chống lỗi Type/NaN do định dạng dữ liệu Google Sheets
  const parseDateSafe = (val) => {
    if (!val) return NaN;
    const str = String(val).trim();
    if (!str) return NaN;
    let s = str;
    if (s.includes(' ')) {
      s = s.replace(' ', 'T');
    }
    if (s.includes('T') && s.split(':').length === 2) {
      s += ':00';
    }
    const t = new Date(s).getTime();
    if (!isNaN(t)) return t;
    return new Date(val).getTime();
  };

  // Hàm tính toán giờ thực chiến chi tiết theo từng ngày của thợ
  const calcActiveHoursForDay = (user, dateStr, gateHours) => {
    let totalActiveMins = 0;
    const safeGateHours = Number(gateHours) || 0;
    
    // 1. Duyệt prodItems
    (safeProdItems || []).forEach(p => {
      ['phase1', 'phase2'].forEach(phKey => {
        const ph = p?.phases?.[phKey];
        if (ph && String(ph.user).trim() === String(user).trim()) {
          if (ph.start && String(ph.start).startsWith(dateStr)) {
            const startMs = parseDateSafe(ph.start);
            let endMs = 0;
            if (ph.endTime) {
              endMs = parseDateSafe(ph.endTime);
            } else if (ph.status === 'In Progress' && dateStr === currentDate) {
              endMs = Date.now();
            }
            if (!isNaN(startMs) && endMs > startMs) {
              totalActiveMins += (endMs - startMs) / 60000;
            }
          }
        }
      });
    });

    // 2. Duyệt packings
    (safePackings || []).forEach(pk => {
      if (String(pk.user).trim() === String(user).trim()) {
        if (pk.start && String(pk.start).startsWith(dateStr)) {
          const startMs = parseDateSafe(pk.start);
          let endMs = 0;
          const et = pk.endTime || pk.end;
          if (et) {
            endMs = parseDateSafe(et);
          } else if (pk.status === 'In Progress' && dateStr === currentDate) {
            endMs = Date.now();
          }
          if (!isNaN(startMs) && endMs > startMs) {
            totalActiveMins += (endMs - startMs) / 60000;
          }
        }
      }
    });

    const activeH = Math.max(0, totalActiveMins / 60);
    // Capping active hours at gate hours
    const cappedActiveH = Math.min(activeH, safeGateHours);
    const idleH = Math.max(0, safeGateHours - cappedActiveH);
    return { activeHours: cappedActiveH, idleHours: idleH };
  };

  const payroll = users.map(u => {

      // Tính toán Lương Thực Chiến theo từng ngày
      let totalActiveHours = 0;

      const userAttsWithRealTime = userAtts.map(a => {

      const baseSalary = cleanNumber(sal.baseSalary) || cleanNumber(sal['Lương Cơ Bản']) || 0;
      let hourlyRate = baseSalary > 1000000 ? Math.round(baseSalary / 28 / 8) : baseSalary;

          const isIntl = /SG|MY|TH|PH|MA|TW|Quốc Tế|Xuất Khẩu/i.test(channel);

          if (String(pk.user).trim() === String(u).trim() && pk.status === 'Done' && (pk.endTime || pk.date) && isDateInRange(pk.endTime || pk.date, filter, customMonth)) {

              }

                  amt = getPackingReward(itemsStr, window.kpiConfig || [], channel);

      const tongGiamTru = phatQuyDinh + phiCongDoan + chiPhiBaoHanh + tamUng + giamTruKhac;

          payload.deletes = { BonusPenalty: [payrollAction.requestId] };
      }
      
      if (payrollAction.type === 'thuong') {
          payload.BonusPenalty.push({ id: 'BP_THUONG_' + Date.now(), user: payrollAction.target, amount: amt, type: 'Thưởng Nóng', note: payrollAction.note || 'Thưởng nóng', date: payrollTargetDate, orderCode: '' });
      } else if (payrollAction.type === 'tam_ung' || payrollAction.type === 'cho_vay') {
          if (!selectedAcc) return alert('Không tìm thấy tài khoản trích tiền!');
          
          if (payrollAction.type === 'tam_ung') {
              const prevMonthDate = new Date();
              prevMonthDate.setMonth(prevMonthDate.getMonth() - 1);
              const prevMonthStr = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth() + 1).padStart(2, '0')}`;
              const snap = erpData?.monthlySnapshots?.find(s => s.user === payrollAction.target && s.month === prevMonthStr);
              const prevSalary = snap ? Number(snap.totalSalary) || 0 : 0;
              const maxAdvance = Math.round(prevSalary * 0.5);
              
              if (amt > maxAdvance && maxAdvance > 0) {
                  return triggerToast(`Tạm ứng vượt quá 50% lương tháng trước (${Number(maxAdvance).toLocaleString('vi-VN')}đ). Vui lòng dùng khoản Cho Vay!`, 'fa-times', 'danger');
              } else if (maxAdvance <= 0) {
                  return triggerToast(`Lương tháng trước không đủ để tạm ứng! Vui lòng dùng khoản Cho Vay.`, 'fa-times', 'danger');
              }
          }
          
          const isVay = payrollAction.type === 'cho_vay';
          if (isVay && !payrollAction.dueDate) {
              return triggerToast('Vui lòng chọn ngày cần thu!', 'fa-times', 'danger');
          }
          const finalNote = isVay ? `${payrollAction.note || 'Cho Vay'} (Hạn thu: ${payrollAction.dueDate.split('-').reverse().join('/')})` : (payrollAction.note || 'Tạm ứng lương');
          
          payload.BonusPenalty.push({ id: (isVay ? 'BP_CHOVAY_' : 'BP_TAMUNG_') + Date.now(), user: payrollAction.target, amount: -amt, type: isVay ? 'Cho Vay' : 'Tạm Ứng', note: finalNote, date: isVay ? payrollAction.loanDate : payrollTargetDate, orderCode: isVay ? `Hạn thu: ${payrollAction.dueDate}` : '' });
          payload.Transactions.push({ id: 'TX_TAMUNG_' + Date.now(), type: 'Chi', category: isVay ? 'Cho Vay' : 'Tạm Ứng Lương', amount: amt, fromAccount: selectedAcc.id, toAccount: '', title: `${isVay ? 'Cho Vay' : 'Tạm ứng lương'}: ${payrollAction.target}`, date: safeDateFull.replace('T',' ').slice(0,16), note: finalNote, isAuto: true });
          payload.Accounts.push({ ...selectedAcc, balance: Number(selectedAcc.balance) - amt });
      } else if (payrollAction.type === 'ket_chuyen_no') {
          triggerToast('Đang xử lý kết chuyển dư nợ...', 'fa-spinner fa-spin', 'info');
          const debtPayload = {
              user: payrollAction.target,
              amount: amt,
              monthStr: filterMonth,
              mode: payrollAction.mode,
              monthlyDeduction: Number(payrollAction.monthlyDeduction) || 0
          };
          google.script.run
              .withSuccessHandler(res => {
                  if (res && res.success) {
                      triggerToast('Đã kết chuyển dư nợ thành công!', 'fa-check', 'success');
                      setPayrollAction(null);
                  } else {
                      triggerToast('Lỗi: ' + (res ? res.message : 'Không rõ'), 'fa-times', 'danger');
                  }
              })
              .withFailureHandler(err => {
                  triggerToast('Lỗi Server: ' + err.message, 'fa-times', 'danger');
              })
              .api_settleMonthlyDebt(debtPayload);
          return;
      } else if (payrollAction.type === 'thanh_toan') {
          if (!selectedAcc) return alert('Không tìm thấy tài khoản trích tiền!');
          payload.BonusPenalty.push({ id: 'BP_DATRA_' + Date.now(), user: payrollAction.target, amount: -amt, type: 'Đã Trả', note: payrollAction.note || `Thanh toán dứt điểm lương`, date: payrollTargetDate, orderCode: '' });
          payload.Transactions.push({ id: 'TX_LUONG_' + Date.now(), type: 'Chi', category: 'Trả Lương', amount: amt, fromAccount: selectedAcc.id, toAccount: '', title: `Trả lương: ${payrollAction.target}`, date: safeDateFull.replace('T',' ').slice(0,16), note: payrollAction.note || `Thanh toán lương tháng ${filterMonth}`, isAuto: true });
          payload.Accounts.push({ ...selectedAcc, balance: Number(selectedAcc.balance) - amt });
      }
      
      try {
          await pushDeltas(payload, 'Đã lưu hệ thống!', 'fa-check');
          setPayrollAction(null);
      } catch(e) { triggerToast('Lỗi hệ thống', 'fa-times', 'danger'); }
  };

  const handleRequestAdvance = (e, p) => {
      e.stopPropagation();
      const prevMonthDate = new Date();
      prevMonthDate.setMonth(prevMonthDate.getMonth() - 1);
      const prevMonthStr = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth() + 1).padStart(2, '0')}`;
      const snap = erpData?.monthlySnapshots?.find(s => s.user === p.user && s.month === prevMonthStr);
      const prevSalary = snap ? Number(snap.totalSalary) || 0 : 0;
      const maxAmount = Math.round(prevSalary * 0.5);
      
      let amountStr = prompt(`Xin tạm ứng (Tối đa 50% lương tháng trước: ${formatMoney(maxAmount)}đ).\nNếu xin vay vượt mức hoặc chưa có lương tháng trước, hệ thống sẽ duyệt dạng "Cho Vay".\n\nNhập số tiền muốn xin (VNĐ):`);
      if(!amountStr) return;
      const amount = Number(amountStr.replace(/[^0-9]/g, ''));
      if(amount <= 0) return;
      
      let isChoVay = false;
      if (amount > maxAmount || maxAmount === 0) {
          if(!confirm(`Số tiền bạn xin vượt mức 50% lương tháng trước (hoặc bạn chưa có lương tháng trước).\nYêu cầu sẽ được chuyển thành "Cho Vay". Bạn có đồng ý gửi yêu cầu?`)) return;
          isChoVay = true;
      }
      
      const reason = prompt("Nhập lý do xin ứng/vay:");
      if(!reason) return;
      
      const payload = {
          BonusPenalty: [{
              id: 'REQ_' + Date.now() + Math.random().toString(36).substring(7),
              user: p.user,
              amount: amount,
              type: 'Yêu Cầu Tạm Ứng',
              note: reason + (isChoVay ? ' (Cho Vay)' : ''),
              date: new Date().toISOString(),
              orderCode: 'Chờ Duyệt'
          }]
      };
      pushDeltas(payload, 'Đã gửi yêu cầu thành công!', 'fa-paper-plane');
  };

  const handlePrintPayslip = (p) => {
      setTimeout(() => {
          const printContents = document.getElementById(`payslip-print-${p.user}`).innerHTML;
          const periodLabel = filter === 'Tuỳ Chỉnh' ? `Tháng ${customMonth.split('-')[1]}/${customMonth.split('-')[0]}` : filter;
          
          // TỰ ĐỘNG CHỐT BẢNG LƯƠNG VÀO TÀI LIỆU (DOCUMENTS) SAU KHI IN
          if (documents && pushDeltas) {
              const docId = `PS_${p.user}_${filter.replace(/\//g,'')}`;
              const docIndex = documents.findIndex(d => d.id === docId);
              const newDoc = {
                  id: docId,
                  category: 'Phiếu Lương',
                  title: `Phiếu Lương - ${p.user} - ${periodLabel}`,
                  description: printContents,
                  link: '',
                  createdAt: new Date().toISOString().slice(0, 19).replace('T', ' '),
                  createdBy: currentUser,
                  attachments: '', testLink: '', readBy: ''
              };
              if(docIndex === -1) {
                  pushDeltas({ documents: [newDoc] }, `Đã lưu chốt phiếu lương ${p.user}!`, 'fa-check');
              } else {
                  pushDeltas({ documents: [newDoc] }, `Đã cập nhật phiếu lương ${p.user}!`, 'fa-check');
              }
          }
          
          const style = document.createElement('style');
          style.innerHTML = `
              @media print {
                  @page { size: A4 portrait; margin: 15mm auto; } 
                  body > *:not(#print-section) { display: none !important; }
                  body { background: white !important; margin: 0 !important; padding: 0 !important; }
                  #print-section { display: block !important; width: 100% !important; background: white !important; }
                  #print-section > div { width: 100% !important; max-width: 190mm !important; margin: 0 auto !important; padding: 10px !important; }
                  table { page-break-inside: auto; width: 100% !important; }
                  tr    { page-break-inside: avoid; page-break-after: auto; }
                  thead { display: table-header-group; }
                  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
              }
          `;
          document.head.appendChild(style);
          const printDiv = document.createElement('div');
          printDiv.id = 'print-section';
          printDiv.innerHTML = printContents;
          document.body.appendChild(printDiv);
          window.print();
          document.body.removeChild(printDiv);
          document.head.removeChild(style);
      }, 100);
  };

  return (
    <div className={"w-full space-y-4 pb-32 md:pb-12 animate-fade-in relative"}>



      <div className="flex gap-3 w-full max-w-lg mx-auto mb-5 bg-[#111] p-1.5 rounded-2xl border border-[#333] shadow-inner">
        <button onClick={() => setSubTab('ATTENDANCE')} className={`flex-1 py-2 rounded-xl text-[12px] font-black uppercase transition-all duration-300 flex items-center justify-center gap-2 ${subTab === 'ATTENDANCE' ? 'bg-[#00a8e8] text-white shadow-[0_0_15px_rgba(0,168,232,0.3)] scale-[1.02]' : 'bg-transparent text-gray-400 hover:text-white hover:bg-white/5'}`}>CHẤM CÔNG</button>
        <button onClick={() => setSubTab('KPI')} className={`flex-1 py-2 rounded-xl text-[12px] font-black uppercase transition-all duration-300 flex items-center justify-center gap-2 ${subTab === 'KPI' ? 'bg-[#00a8e8] text-white shadow-[0_0_15px_rgba(0,168,232,0.3)] scale-[1.02]' : 'bg-transparent text-gray-400 hover:text-white hover:bg-white/5'}`}>NHIỆM VỤ</button>
        <button onClick={() => setSubTab('PAYROLL')} className={`flex-1 py-2 rounded-xl text-[12px] font-black uppercase transition-all duration-300 flex items-center justify-center gap-2 ${subTab === 'PAYROLL' ? 'bg-[#00a8e8] text-white shadow-[0_0_15px_rgba(0,168,232,0.3)] scale-[1.02]' : 'bg-transparent text-gray-400 hover:text-white hover:bg-white/5'}`}>BẢNG LƯƠNG</button>
      </div>

      <RFCard noPadding className="p-2 flex flex-col md:flex-row gap-2 items-center mb-4 shrink-0">
          <div className="flex items-center gap-2 pl-2 border-r border-[#333] pr-3 shrink-0">
              <i className="fas fa-calendar-alt text-[#00a8e8]"></i>
              <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">KỲ BÁO CÁO</span>
          </div>
          <select value={filter} onChange={e => setFilter(e.target.value)} className="h-[42px] px-3 bg-[#0a0a0a] rounded-xl border border-[#333] text-[11px] font-black uppercase tracking-wider outline-none text-white shadow-sm focus:border-[#00a8e8] transition-colors appearance-none cursor-pointer shrink-0">
              <option value="Hôm Nay">Hôm Nay</option>
              <option value="Tháng Này">Tháng Này</option>
              <option value="Tháng Trước">Tháng Trước</option>
              <option value="Tuỳ Chỉnh">Tuỳ Chỉnh Tháng</option>
          </select>
          {filter === 'Tuỳ Chỉnh' && (
              <input type="month" value={customMonth} onChange={e => setCustomMonth(e.target.value)} className="h-[42px] px-3 bg-[#0a0a0a] rounded-xl border border-[#333] text-[12px] font-black uppercase outline-none text-[#00a8e8] shadow-sm focus:border-[#00a8e8] transition-colors shrink-0" />
          )}
          <div className="flex-1"></div>
          {isBoss && (
              <div className="flex gap-2 shrink-0">
                  <RFButton variant="outline" onClick={() => typeof openKpiModalStandalone === 'function' ? openKpiModalStandalone() : (window.openKpiModalStandalone && window.openKpiModalStandalone())} className="!border-amber-500/50 text-amber-500 hover:bg-amber-500 hover:text-white !h-[42px]" title="Tạo KPI">
                      <i className="fas fa-fire mr-1"></i> TẠO KPI
                  </RFButton>
                  <RFButton variant="outline" onClick={() => typeof openTaskModalStandalone === 'function' ? openTaskModalStandalone() : (window.openTaskModalStandalone && window.openTaskModalStandalone())} className="!border-emerald-500/50 text-emerald-500 hover:bg-emerald-500 hover:text-white !h-[42px]" title="Giao Việc">
                      <i className="fas fa-tasks mr-1"></i> GIAO VIỆC
                  </RFButton>
              </div>
          )}
      </RFCard>

      {subTab === 'ATTENDANCE' && (
          <div className={"grid grid-cols-1 xl:grid-cols-2 gap-5"}>
              {/* CỘT TRÁI: Widget Chấm Công & Top Chuyên Cần */}
              <div className={"space-y-4"}>
              {/* ATTENDANCE CARD WIDGET */}
              <RFCard className="w-full relative group">
                  <div className="absolute top-0 left-0 w-1.5 bg-gradient-to-b from-[#00a8e8] to-[#3b82f6] h-full z-10"></div>
                  <div className="absolute -right-10 -top-10 w-40 h-40 bg-[#00a8e8]/5 rounded-full blur-3xl group-hover:bg-[#00a8e8]/10 transition-all"></div>
                  
                  {/* Shift selector grid */}
                  <div className="grid grid-cols-3 gap-3 mb-4 relative z-10">
                      <div 
                          className={`p-3 rounded-2xl border flex flex-col items-center justify-center cursor-default transition-all ${
                              selectedShiftTab === 'Sáng' 
                                  ? 'bg-[#2563eb]/10 border-[#2563eb] text-[#60a5fa] ring-1 ring-[#2563eb]' 
                                  : 'bg-[#0a0a0a] border-[#333] text-zinc-400 opacity-70'
                          }`}
                      >
                          <div className="flex items-center gap-1 text-[11px] font-black uppercase tracking-wider mb-1"><i className="fas fa-cloud-sun text-amber-400"></i> Ca Sáng</div>
                          <div className="text-[9px] font-bold opacity-80">06:00 - 13:00</div>
                      </div>
                      <div 
                          className={`p-3 rounded-2xl border flex flex-col items-center justify-center cursor-default transition-all ${
                              selectedShiftTab === 'Chiều' 
                                  ? 'bg-[#2563eb]/10 border-[#2563eb] text-[#60a5fa] ring-1 ring-[#2563eb]' 
                                  : 'bg-[#0a0a0a] border-[#333] text-zinc-400 opacity-70'
                          }`}
                      >
                          <div className="flex items-center gap-1 text-[11px] font-black uppercase tracking-wider mb-1"><i className="fas fa-sun text-yellow-400"></i> Ca Chiều</div>
                          <div className="text-[9px] font-bold opacity-80">13:00 - 19:00</div>
                      </div>
                      <div 
                          className={`p-3 rounded-2xl border flex flex-col items-center justify-center cursor-default transition-all ${
                              selectedShiftTab === 'Tối' 
                                  ? 'bg-[#2563eb]/10 border-[#2563eb] text-[#60a5fa] ring-1 ring-[#2563eb]' 
                                  : 'bg-[#0a0a0a] border-[#333] text-zinc-400 opacity-70'
                          }`}
                      >
                          <div className="flex items-center gap-1 text-[11px] font-black uppercase tracking-wider mb-1"><i className="fas fa-moon text-yellow-300"></i> Ca Tối</div>
                          <div className="text-[9px] font-bold opacity-80">19:00 - 06:00</div>
                      </div>
                  </div>

                  {/* Action buttons */}
                  <div className="grid grid-cols-2 gap-3 mb-3 relative z-10">
                      <button 
                          onClick={() => handleCheckInOut('IN', selectedShiftTab)} 
                          disabled={currentSelectedRecord?.timeIn} 
                          className={`py-3.5 rounded-2xl font-black text-[12px] uppercase tracking-wider flex items-center justify-center gap-2 border transition-all ${
                              currentSelectedRecord?.timeIn 
                                  ? 'bg-[#0a0a0a] border-[#333] text-zinc-600 cursor-not-allowed' 
                                  : 'bg-[#10b981] hover:bg-[#10b981]/80 text-[#0a0a0a] border-transparent shadow-[0_0_15px_rgba(16,185,129,0.3)] active:scale-95'
                          }`}
                      >
                          <i className="fas fa-sign-in-alt"></i> VÀO LÀM
                      </button>
                      <button 
                          onClick={() => handleCheckInOut('OUT', selectedShiftTab)} 
                          disabled={!currentSelectedRecord?.timeIn || currentSelectedRecord?.timeOut} 
                          className={`py-3.5 rounded-2xl font-black text-[12px] uppercase tracking-wider flex items-center justify-center gap-2 transition-all ${
                              (!currentSelectedRecord?.timeIn || currentSelectedRecord?.timeOut)
                                  ? 'bg-[#0a0a0a] border-[#333] text-zinc-600 cursor-not-allowed' 
                                  : 'bg-[#e11d48] hover:bg-[#f43f5e] text-white border border-[#e11d48]/40 active:scale-95 shadow-[0_0_15px_rgba(225,29,72,0.25)]'
                          }`}
                      >
                          <i className="fas fa-sign-out-alt"></i> RA VỀ
                      </button>
                  </div>

                  {/* Leave Request Button */}
                  <button 
                      onClick={() => setShowLeaveModal(true)} 
                      className="w-full py-3 bg-[#d4af37]/10 hover:bg-[#d4af37]/20 text-[#d4af37] border border-[#d4af37]/30 font-black text-[10px] uppercase tracking-widest rounded-2xl shadow-[0_0_15px_rgba(212,175,55,0.1)] flex items-center justify-center gap-2 transition-all active:scale-[0.98] mb-4 relative z-10"
                  >
                      <i className="fas fa-calendar-alt"></i> XIN NGHỈ PHÉP
                  </button>

                  {/* GIỜ LÀM THỰC TẾ HÔM NAY */}
                  <div className="bg-[#0b0b0c]/80 border border-zinc-800/80 rounded-2xl p-4 space-y-3">
                      <div className="flex items-center gap-2 text-[10px] font-black text-zinc-400 uppercase tracking-widest border-b border-zinc-900 pb-2.5">
                          <i className="fas fa-history text-blue-400"></i> GIỜ LÀM THỰC TẾ HÔM NAY
                      </div>
                      
                      <div className="space-y-2">
                          {/* Row Sáng */}
                          <div className="flex justify-between items-center bg-[#0d0d0e] border border-zinc-900 rounded-xl px-3 py-2.5">
                              <div className="flex items-center gap-2 text-[11px] font-bold text-zinc-300">
                                  <span className={`w-1.5 h-1.5 rounded-full ${morningRecord && !morningRecord.timeOut ? 'bg-blue-500 animate-pulse' : 'bg-zinc-700'}`}></span>
                                  Ca Sáng
                              </div>
                              <div className="text-[11px] font-black text-zinc-400 font-mono">
                                  {morningRecord ? (
                                      morningRecord.timeOut ? (
                                          `${morningRecord.timeIn} ➔ ${morningRecord.timeOut}`
                                      ) : (
                                          <div className="flex items-center gap-2">
                                              <span>{morningRecord.timeIn}</span> ➔ <span className="text-amber-505 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded text-[9px] font-black text-amber-500">Đang làm</span>
                                          </div>
                                      )
                                  ) : (
                                      '--:-- ➔ --:--'
                                  )}
                              </div>
                          </div>

                          {/* Row Chiều */}
                          <div className="flex justify-between items-center bg-[#0d0d0e] border border-zinc-900 rounded-xl px-3 py-2.5">
                              <div className="flex items-center gap-2 text-[11px] font-bold text-zinc-300">
                                  <span className={`w-1.5 h-1.5 rounded-full ${afternoonRecord && !afternoonRecord.timeOut ? 'bg-blue-500 animate-pulse' : 'bg-zinc-700'}`}></span>
                                  Ca Chiều
                              </div>
                              <div className="text-[11px] font-black text-zinc-400 font-mono">
                                  {afternoonRecord ? (
                                      afternoonRecord.timeOut ? (
                                          `${afternoonRecord.timeIn} ➔ ${afternoonRecord.timeOut}`
                                      ) : (
                                          <div className="flex items-center gap-2">
                                              <span>{afternoonRecord.timeIn}</span> ➔ <span className="text-amber-550 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded text-[9px] font-black text-amber-500">Đang làm</span>
                                          </div>
                                      )
                                  ) : (
                                      '--:-- ➔ --:--'
                                  )}
                              </div>
                          </div>

                          {/* Row Tối */}
                          <div className="flex justify-between items-center bg-[#0d0d0e] border border-zinc-900 rounded-xl px-3 py-2.5">
                              <div className="flex items-center gap-2 text-[11px] font-bold text-zinc-300">
                                  <span className={`w-1.5 h-1.5 rounded-full ${eveningRecord && !eveningRecord.timeOut ? 'bg-blue-500 animate-pulse' : 'bg-zinc-700'}`}></span>
                                  Ca Tối
                              </div>
                              <div className="text-[11px] font-black text-zinc-400 font-mono">
                                  {eveningRecord ? (
                                      eveningRecord.timeOut ? (
                                          `${eveningRecord.timeIn} ➔ ${eveningRecord.timeOut}`
                                      ) : (
                                          <div className="flex items-center gap-2">
                                              <span>{eveningRecord.timeIn}</span> ➔ <span className="text-amber-550 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded text-[9px] font-black text-amber-500">Đang làm</span>
                                          </div>
                                      )
                                  ) : (
                                      '--:-- ➔ --:--'
                                  )}
                              </div>
                          </div>
                      </div>
                  </div>
              </RFCard>

              {top3Att.length > 0 && (
                <div className={"bg-[#141414] pt-8 pb-4 px-4 rounded-xl border border-[#2a2a2a] relative mt-6 mb-4 shadow-sm"}>
                  <h3 className={"absolute -top-3 left-1/2 -translate-x-1/2 bg-[#0a0a0a] px-4 py-1.5 border border-[#333] rounded-full font-black text-[#3b82f6] text-[11px] uppercase tracking-widest flex items-center gap-2 whitespace-nowrap shadow-md"}><i className={"fas fa-fire text-[10px]"}></i> TOP CHUYÊN CẦN</h3>
                  <div className={"flex justify-center items-end gap-2 h-[130px]"}>
                    {top3Att[1] && <div className={"flex-1 flex flex-col items-center justify-end h-[85%] bg-gradient-to-t from-[#94a3b8]/20 to-transparent rounded-t-xl border-b-2 border-[#94a3b8] pb-2"}>{renderSafeAvatar(top3Att[1].name, "w-10 h-10 border-[#94a3b8] mb-1.5")}<div className={"text-[10px] font-black text-[#f5f5f5] uppercase truncate w-full text-center px-1"}>{top3Att[1].name.split(' ').pop()}</div><div className={"text-[9px] font-bold text-[#94a3b8] mt-0.5 bg-[#0a0a0a] px-1.5 py-0.5 rounded-full border border-[#94a3b8]/30"}>{top3Att[1].label}</div></div>}

                      {payroll.map(p => {
                          const attsInPeriod = p.atts;

                          const hasWarning = todayAtts.some(a => Number(a.penalty) > 0 || (a.note && (a.note.toLowerCase().includes('muộn') || a.note.toLowerCase().includes('sớm'))));
                          const statusColor = todayStatus.includes('Đang làm') ? 'text-[#10b981]' : (hasWarning ? 'text-rose-400 font-semibold' : 'text-gray-500');
                          const bpPenalties = bpData.filter(b => b.user === p.user && isDateInRange(b.date) && (Number(b.amount) < 0 || b.type === 'Phạt'));
                          const attPenalties = p.atts.filter(a => Number(a.penalty) > 0).map(a => ({ date: a.date, note: a.status || 'Đi muộn/Vi phạm chấm công', amount: -Number(a.penalty) }));
                          const userPenalties = [...bpPenalties, ...attPenalties].sort((a,b) => new Date(b.date) - new Date(a.date));
                          const isPenaltyExpanded = openSection[`${p.user}_penalty`];

                          return (
                              <div key={p.user} className={"bg-[#0a0a0a] border border-[#333] rounded-xl p-3 hover:border-[#00a8e8] hover:shadow-[0_0_15px_rgba(0,168,232,0.15)] transition-all group cursor-pointer"} onClick={() => toggleSection(p.user, 'penalty')}>
                                  <div className="flex justify-between items-start">
                                      <div className={"flex items-start gap-3"} onClick={(e) => { e.stopPropagation(); setShowHistoryUser(p.user); }}>

                                                      <span className={`ml-1 px-1.5 py-0.5 rounded text-[9px] text-white ${p.lastLeave.status === 'Nghỉ không phép' ? 'bg-rose-500' : 'bg-emerald-500'}`}>{p.lastLeave.status}</span>

                                              <div className="text-zinc-500">Đi muộn/Phạt: <span className={`font-black ${p.soLanDiMuon + p.soLanPhat > 0 ? 'text-rose-400' : 'text-white'}`}>{p.soLanDiMuon + p.soLanPhat}</span> lần</div>
                                          </div>
                                          <div className="flex flex-col gap-2">
                                              {canEditAttendance && (
                                                  <button onClick={(e) => { e.stopPropagation(); setDirectPenalty({user: p.user, amount: '', note: ''}); }} className={"w-7 h-7 rounded-lg bg-[#222] text-rose-500 hover:bg-rose-500 hover:text-white flex items-center justify-center transition-colors shadow-sm shrink-0"} title="Phạt trực tiếp">

                                              <div className={`w-7 h-7 rounded-lg border border-[#333] bg-[#111] flex items-center justify-center transition-transform duration-300 ${isPenaltyExpanded ? 'rotate-180 text-[#00a8e8]' : 'text-gray-500 group-hover:border-[#00a8e8] group-hover:text-[#00a8e8]'}`}>

                                              </div>

                                                  <span><i className="far fa-calendar-alt mr-1"></i> {pen.date ? pen.date.slice(5, 10).replace('-', '/') : ''} - {pen.note || pen.type}</span>
                                                  <span className="text-rose-400 font-bold">{formatMoney(pen.amount)}đ</span>
                                              </div>
                                          )) : (
                                              <div className="text-[11px] text-gray-500 italic text-center py-2 bg-[#111] rounded-lg border border-[#222]">Không có vi phạm nào trong tháng</div>
                                          )}
                                      </div>
                                  </div>
                              </div>
                          );
                      })}
                  </div>
                  </RFCard>
              </div>
          </div>
      )}

      {subTab === 'KPI' && (
          <div className={"space-y-4"}>
              {/* ==================== 2. NHIỆM VỤ CHUNG CỦA XƯỞNG ==================== */}
              {(() => {
                  const allXuTasksBP = bpData.filter(b => b.type === 'XU_REWARD').map(b => ({id: b.id, name: b.note || 'Nhiệm vụ', amount: b.amount, date: b.date, user: b.user, isDone: true, desc: '', startTime: b.date, endTime: b.date}));
                  const allXuTasksKPI = kpiData.filter(k => String(k.unit).toLowerCase() === 'xu').map(k => ({id: k.id, name: k.kpiName, amount: k.reward, date: formatDR(k.startTime, k.endTime), user: k.user, isDone: (k.isClaimed === 'true' || k.isClaimed === true), desc: k.desc, startTime: k.startTime, endTime: k.endTime}));
                  const globalXuTasks = [...allXuTasksBP, ...allXuTasksKPI].sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));

                  return (
                      <div className={"bg-[#0a0a0a] border border-[#333] p-5 rounded-2xl mb-6 shadow-sm relative overflow-hidden"}>
                          <div className={"flex items-center justify-between mb-4 relative z-10"}>
                              <h2 className={"text-[#f5f5f5] font-black text-[15px] uppercase tracking-wider"}><i className={"fas fa-users mr-2 text-cyan-500"}></i>Nhiệm Vụ Chung</h2>
                          </div>
                          
                          <div className={"grid grid-cols-1 md:grid-cols-2 gap-3 relative z-10"}>
                              {sharedTasks.map(t => {
                                  const isDone = t.status === 'DONE' || t.status === 'Hoàn thành';
                                  return (
                                      <div key={t.id} className={`p-4 rounded-xl border ${isDone ? 'bg-emerald-900/10 border-emerald-500/30' : 'bg-[#111] border-[#333] hover:border-cyan-500/30'}`}>
                                          <div className="flex justify-between items-start mb-2">
                                              <div className={`font-black text-[14px] ${isDone ? 'text-emerald-400' : 'text-[#f5f5f5]'}`}>{t.sku}</div>
                                              {isDone ? (
                                                  <span className="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold uppercase"><i className="fas fa-check mr-1"></i>Hoàn thành</span>
                                              ) : (
                                                  <span className="text-[10px] bg-amber-500/20 text-amber-500 px-2 py-0.5 rounded font-bold uppercase"><i className="fas fa-clock mr-1"></i>Đang xử lý</span>
                                              )}
                                          </div>
                                          {t.note && <div className="text-gray-400 text-[11px] mb-2"><i className="fas fa-info-circle mr-1 text-gray-500"></i>HD: {t.note}</div>}
                                          <div className="flex gap-4 text-[10px] text-gray-500 mb-2">
                                              <div>Bắt đầu: {t.createdAt ? new Date(t.createdAt).toLocaleDateString('vi-VN') : '---'}</div>
                                              <div>Kết thúc: {t.deadline ? new Date(t.deadline).toLocaleDateString('vi-VN') : '---'}</div>
                                          </div>
                                          {Number(t.price) > 0 && <div className="text-amber-500 text-[11px] font-bold mt-1"><i className="fas fa-coins mr-1"></i>Thưởng: {formatMoney(t.price)}đ</div>}
                                          
                                          {!isDone && (canEditAttendance) && (
                                              <button onClick={() => {
                                                  if(window.confirm(`Xác nhận hoàn thành nhiệm vụ chung: ${t.sku}?`)) {
                                                      triggerToast('Đang cập nhật...', 'fa-spinner fa-spin', 'info');
                                                      google.script.run
                                                          .withSuccessHandler((res) => { if(res.success) { triggerToast('Đã hoàn thành!', 'fa-check', 'success'); window.dispatchEvent(new CustomEvent('triggerReloadData')); } else alert(res.message); })
                                                          .withFailureHandler(err => alert("Lỗi: " + err))
                                                          .updateRowAPI('ProductionLog', t.id, {status: 'DONE', updatedBy: currentUser});
                                                  }
                                              }} className="mt-3 w-full py-1.5 bg-emerald-500/10 text-emerald-500 border border-emerald-500/30 rounded-lg text-[10px] font-black uppercase hover:bg-emerald-500 hover:text-white transition-colors">Xác nhận xong</button>
                                          )}
                                      </div>
                                  )
                              })}
                              {globalXuTasks.map(t => (
                                  <div key={t.id} className={`p-4 rounded-xl border flex flex-col justify-between ${t.isDone ? 'bg-amber-900/10 border-amber-500/30' : 'bg-[#111] border-[#333] hover:border-amber-500/30'}`}>
                                      <div>
                                          <div className="flex justify-between items-start mb-2">
                                              <div className={`font-black text-[14px] ${t.isDone ? 'text-amber-500' : 'text-[#f5f5f5]'}`}>{t.name}</div>
                                              {t.isDone ? (
                                                  <span className="text-[10px] bg-amber-500/20 text-amber-500 px-2 py-0.5 rounded font-bold uppercase"><i className="fas fa-check mr-1"></i>Đã nhận Xu</span>
                                              ) : (
                                                  <span className="text-[10px] bg-gray-500/20 text-gray-400 px-2 py-0.5 rounded font-bold uppercase"><i className="fas fa-clock mr-1"></i>Đang làm</span>
                                              )}
                                          </div>
                                          <div className="text-gray-400 text-[11px] mb-2 flex items-center gap-1.5"><i className="fas fa-user-circle text-gray-500"></i> Giao cho: <span className="font-bold text-gray-300">{t.user}</span></div>
                                          {t.desc && <div className="text-gray-400 text-[11px] mb-2"><i className="fas fa-info-circle mr-1 text-gray-500"></i>HD: {t.desc}</div>}
                                          <div className="flex gap-4 text-[10px] text-gray-500 mb-2">
                                              <div>Bắt đầu: {t.startTime ? new Date(t.startTime).toLocaleDateString('vi-VN') : '---'}</div>
                                              <div>Kết thúc: {t.endTime ? new Date(t.endTime).toLocaleDateString('vi-VN') : '---'}</div>
                                          </div>
                                      </div>
                                      <div className="text-amber-500 text-[13px] font-black mt-2 text-right flex justify-between items-center">
                                          {isBoss ? (
                                              <button onClick={() => {
                                                  if(window.confirm(`Xoá khoản xu thưởng này của ${t.user}?`)) {
                                                      const isKPI = String(t.id).startsWith('KPI_');
                                                      if(isKPI) {
                                                          pushDeltas({ deletes: { KPI_Progress: [t.id] } }, 'Xoá xu KPI', 'fa-trash');
                                                      } else {
                                                          pushDeltas({ deletes: { BonusPenalty: [t.id] } }, 'Xoá xu thưởng', 'fa-trash');
                                                      }
                                                  }
                                              }} className="text-rose-500 hover:text-rose-400 text-[11px] px-2 py-1 bg-rose-500/10 border border-rose-500/30 rounded active:scale-95 transition-all"><i className="fas fa-trash"></i> Xoá</button>
                                          ) : <span></span>}
