            const skuSuffix = val.toLowerCase().replace(/cm/g, '').replace(/\s/g, '').replace(/x/g, '');
            let finalSku = `SKU-${skuSuffix}`;

            if (selVer) {
                const cleanVer = selVer.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, '');
                let baseSku = cleanVer.length >= 3 ? cleanVer.substring(0, 3).toUpperCase() : 'LAY';

                const verMatch = selVer.match(/ver\.?\s*(\d+)/i);
                if (verMatch) baseSku += `-${String(verMatch[1]).padStart(3, '0')}`;
                else baseSku += '-001';
                finalSku = `${baseSku}-${skuSuffix}`;
            }
            setQaData({ ...qaData, dim: val, sku: finalSku });
        };

        const submitQuickAdd = () => {
            if (showQuickAdd === 'layout_sub') { setSelSub(qaData.name); setLayoutStep(2); setShowQuickAdd(false); setQaData({ name: '', dim: '', price: '', cost: '', sku: '', realImage: '', unit: 'Cái' }); return; }
            if (showQuickAdd === 'layout_ver') { setSelVer(qaData.name); setLayoutStep(3); setShowQuickAdd(false); setQaData({ name: '', dim: '', price: '', cost: '', sku: '', realImage: '', unit: 'Cái' }); return; }

            let finalName = qaData.name;
            let finalSku = qaData.sku || `SKU${Date.now().toString().slice(-6)}`;
            let cat = searchTarget === 'acc' ? 'PHỤ KIỆN' : (searchTarget === 'glass' ? 'BỂ KÍNH' : 'LAYOUT');
            let subCat = searchTarget === 'layout' ? selSub : 'Khác';
            let templateImg = '';

            if (searchTarget === 'layout' || showQuickAdd === 'layout_dim') {
                if (!qaData.dim) return alert('Nhập kích thước!');
                let cleanDimName = qaData.dim.toLowerCase().replace(/\s/g, '').replace(/cm/g, '');
                finalName = `${selVer} - ${cleanDimName}cm`;
                const templateProd = localProds.find(p => p.name && (p.name === selVer || p.name.startsWith(selVer + ' - ')) && p.image);
                if (templateProd) templateImg = templateProd.image;
            } else if (searchTarget === 'glass' && qaData.dim) {
                finalName = `${qaData.name} - ${qaData.dim}`;
            }

            if (!finalName) return alert('Nhập đủ thông tin!');
            const newP = {
                id: 'PROD_NEW_' + Date.now(), sku: finalSku, name: finalName, category: cat, sub_category: subCat,
                image: templateImg, realImage: qaData.realImage || '', costPrice: Number(qaData.cost) || 0,
                price: Number(qaData.price) || 0, quantity: 0,
                unit: qaData.unit || (searchTarget === 'acc' ? 'Cái' : 'Bộ'),
                isNewLocal: true
            };
            setLocalProds([...localProds, newP]);
            selectProduct(newP);
        };

        const autoCostTotal = React.useMemo(() => {
            let total = 0;
            prods.forEach(p => { const match = combinedProds.find(x => x.name === p.name); if (match) total += Number(match.costPrice || 0); });
            accessories.forEach(a => { const match = combinedProds.find(x => x.name === a.name); if (match) total += Number(match.costPrice || 0) * (Number(a.quantity) || 1); });
            return total;
        }, [prods, accessories, combinedProds]);

        const handleVideoAppealUpload = (e) => {
            if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                if (file.size > 35 * 1024 * 1024) {
                    alert("Dung lượng video quá lớn (> 35MB). Vui lòng quay video ngắn hơn (dưới 30s) hoặc giảm độ phân giải.");
                    e.target.value = '';
                    return;
                }
                setAppealVideo(file);
            }
        };

        const submitAppealData = async () => {
            if (!editOrder || !editOrder.id) return alert('Chưa xác định được ID đơn hàng!');
            if (appealStatus === 'Hoàn - Đang Khiếu Nại' && !appealVideo) {
                return alert('Vui lòng tải lên video bóc hàng để có bằng chứng khiếu nại!');
            }

            setIsUploadingAppeal(true);
            try {
                let videoUrl = '';
                if (appealVideo) {
                    triggerToast('Đang tải video lên kho lưu trữ...', 'fa-spinner fa-spin', 'info');
                    videoUrl = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = async (e) => {
                            try {
                                const b64 = e.target.result.split(',')[1];
                                const url = await runGAS('uploadDocumentToDrive', b64, `[APPEAL_EVIDENCE]_${editOrder.orderCode || editOrder.id}_${appealVideo.name}`, appealVideo.type);
                                resolve(url);
                            } catch (err) { reject(err); }
                        };
                        reader.onerror = (err) => reject(err);
                        reader.readAsDataURL(appealVideo);
                    });
                    if (!videoUrl) throw new Error("Upload video thất bại.");
                }

                triggerToast('Đang cập nhật hồ sơ khiếu nại...', 'fa-spinner fa-spin', 'info');
                const res = await runGAS('updateAppealStatus', editOrder.id, appealStatus, videoUrl);
                if (!res.success) throw new Error(res.message);

                triggerToast(res.message, 'fa-check', 'success');
                onClose && onClose();

                // Optionally push deltas so the UI updates
                const newNote = videoUrl ? `[Video Hoàn]: ${videoUrl} \n${editOrder.note || ''}` : (editOrder.note || '');
                const updatedOrder = { ...editOrder, status: appealStatus, note: newNote };
                pushDeltas({ orders: [updatedOrder] }, 'Đã cập nhật trạng thái khiếu nại!', 'fa-video');

            } catch (err) {
                console.error(err);
                triggerToast('Lỗi: ' + (err.message || 'Không thể upload video'), 'fa-times', 'danger');
            } finally {
                setIsUploadingAppeal(false);
            }
        };

        const submit = async () => {
            if (isSaleUI) {
                if (!customer || !phone) return alert('Vui lòng nhập Tên và Số điện thoại khách hàng!');
                if (!isEdit && (channel === 'Bán Lẻ' || channel === 'Bán Sỉ')) {
                    if (!depositFile) return alert('LỖI BẢO MẬT: BẮT BUỘC phải TẢI ẢNH BILL CỌC / XÁC NHẬN CHỐT ĐƠN!');
                }
            } else {
                if (!orderCode) return alert('Nhập mã đơn!');
            }

            setIsSubmitting(true);
            try {
                let billUrl = '';
                if (depositFile) {
                    const base64Data = typeof resizeImage === 'function' ?
                        await resizeImage(depositFile) : await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(depositFile); });
                    billUrl = await runGAS('uploadImage', base64Data, `BILL_SALE_${orderCode || Date.now()}.jpg`);
                }

                const finalOrderCode = trackingId ? `${orderCode} | MVĐ: ${trackingId}` : orderCode;
                const orderId = editOrder ? editOrder.id : 'ORD_' + Date.now();
                const finalNote = billUrl ? (note ? `${note} | Link Bill Cọc: ${billUrl}` : `Link Bill Cọc: ${billUrl}`) : note;

                // Xử lý upload ảnh Cover thực tế
                for (let idx = 0; idx < prods.length; idx++) {
                    let p = prods[idx];
                    if (p.coverFile) {
                        let base64Data;
                        if (typeof resizeImage === 'function') {
                            base64Data = await resizeImage(p.coverFile);
                        } else {
                            base64Data = await new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onload = () => resolve(reader.result.split(',')[1]);
                                reader.onerror = reject;
                                reader.readAsDataURL(p.coverFile);
                            });
                        }
                        const timestamp = orderCode ? orderCode : Date.now();
                        const coverUrl = await runGAS('uploadImage', base64Data, 'COVER_SALE_' + timestamp + '_' + idx + '.jpg');
                        p.realCoverImage = coverUrl;
                        p.note = p.note ? `${p.note} | Cover: ${coverUrl}` : `Cover: ${coverUrl}`;
                        delete p.coverFile;
                    }
                }

                let currentStatus = isSXT ? 'Chờ Sản Xuất' : 'Sẵn Sàng Đóng Gói';
                let processedProds = [];
                if (!isEdit && !isSXT && prods.length > 0) {
                    // Khởi tạo bộ đếm tồn kho ảo để trừ lùi liên tục
                    let virtualStockMap = {};

                    prods.forEach((p, idx) => {
                        const inStockItem = combinedProds.find(x => x.name === p.name);
                        const realStockQty = inStockItem ? Number(inStockItem.quantity) : 0;

                        // Lấy tồn kho hiện tại (Nếu chưa có trong map thì lấy số thực tế)
                        let currentAvailable = virtualStockMap[p.name] !== undefined ? virtualStockMap[p.name] : realStockQty;

                        let pNameStr = p.name ? String(p.name).toLowerCase() : '';
                        let subCatStr = (inStockItem && inStockItem.sub_category) ? String(inStockItem.sub_category).toUpperCase() : '';
                        let isCover = false;
                        if (pNameStr.indexOf('cover') !== -1) {
                            isCover = true;
                        } else if (subCatStr === 'COVER') {
                            isCover = true;
                        }

                        if (isCover === false && currentAvailable > 0) {
                            // Đủ kho -> Lệnh Bù Kho
                            let newProd = Object.assign({}, p);
                            newProd.note = p.note;
                            newProd.fulfilledFromStock = true;
                            newProd.deadline = typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : deadline;
                            processedProds.push(newProd);
                            // Trừ lùi tồn kho ảo đi 1
                            virtualStockMap[p.name] = currentAvailable - 1;
                        } else {
                            // Hết kho HOẶC Hàng Cover -> Ép trạng thái đơn về Chờ Sản Xuất & Chuyển lệnh xuống xưởng
                            currentStatus = 'Chờ Sản Xuất';
                            let newProd = Object.assign({}, p);
                            newProd.deadline = deadline;
                            newProd.fulfilledFromStock = false;
                            processedProds.push(newProd);
                            if (isCover === false) {
                                virtualStockMap[p.name] = currentAvailable;
                            }
                        }
                    });
                } else {
                    currentStatus = editOrder ? editOrder.status : (isSXT || prods.length > 0 ? 'Chờ Sản Xuất' : 'Sẵn Sàng Đóng Gói');
                    processedProds = prods.map(p => ({ ...p, orderId, deadline }));
                }

                let payloadOrder = {
                    id: orderId, orderCode: finalOrderCode, channel, customer: customer || 'Khách', phone, address, note: finalNote,
                    revenue: Number(retailTotal) || 0, prePaid: Number(prePaid) || 0, discount: Number(retailDiscount) || 0, shippingFee: Number(additionalCost) || 0,
                    feeFixed: Number(feeFixed) || 0, feeService: Number(feeService) || 0, feePayment: Number(feePayment) || 0, feeAffiliate: Number(feeAffiliate) || 0, shopVoucher: Number(shopVoucher) || 0, tax: Number(tax) || 0,
                    deadline, createdAt: editOrder ? editOrder.createdAt : safeDate.replace('T', ' '), date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0],
                    status: currentStatus, accessories, hasProduction: prods.length > 0,
                    updatedBy: currentUser, responsibleUser: responsibleUser, shippingMethod: isSaleUI ? shippingMethod : ''
                };

                let payload = { orders: [payloadOrder], prodItems: processedProds.map(p => ({ ...p, orderId })) };

                if (isSaleUI) {
                    let codAmt = 0;
                    if (channel === 'Bán Lẻ' || channel === 'Bán Sỉ') {
                        codAmt = (Number(retailTotal) || 0) - (Number(prePaid) || 0);
                        const kpiAmt = (Number(retailTotal) || 0) * 0.05;
                        const beneficiary = responsibleUser || currentUser;
                        // Luôn gửi KPI (kể cả 0đ) cùng orderId để Code.js có thể update/reset KPI nếu Sửa Đơn
                        payload.BonusPenalty = [{ id: 'BP_KPI_' + orderId, user: beneficiary, amount: kpiAmt, type: 'Thưởng Bán Hàng', note: `Thưởng 5% đơn ${finalOrderCode} (Cập nhật bởi: ${currentUser})`, date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0], orderCode: finalOrderCode }];

                        if (Number(prePaid) >= 0 && receivingAccount) {
                            const selAcc = accountsData.find(a => {
                                const raw = a.accountName || a.name || '';
                                let cleanName = raw;
                                if (raw.includes('|')) {
                                    cleanName = raw.split('|')[0].trim();
                                }
                                return String(cleanName || '').toLowerCase().includes(receivingAccount.toLowerCase()) ||
                                    String(raw || '').toLowerCase().includes(receivingAccount.toLowerCase());
                            });
                            const targetAccId = selAcc ? selAcc.id : (accountsData[0] ? accountsData[0].id : 'ACC_COMPANY');

                            payload.Transactions = [{
                                id: 'TX_PRE_' + orderId,
                                type: 'Thu',
                                category: 'Doanh Thu Bán Hàng',
                                amount: Number(prePaid),
                                fromAccount: '',
                                toAccount: targetAccId,
                                title: `Khách cọc đơn ${finalOrderCode}`,
                                date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0],
                                note: billUrl ? `Có kèm Bill Cọc` : `Cập nhật từ hệ thống`
                            }];
                        }
                    }
                    else if (channel === 'Cộng Tác Viên') { codAmt = (Number(retailTotal) || 0) - (Number(retailDiscount) || 0); }
                    else if (channel === 'Bảo Hành & Thu Hồi' || channel === 'Bảo Hành') {
                        const totalBH = autoCostTotal + Number(additionalCost);
                        payloadOrder.costTotal = totalBH;
                        if (responsibleUser) payload.BonusPenalty = [{ id: 'BP_PEN_' + orderId, user: responsibleUser, amount: -totalBH, type: 'Phạt Bảo Hành', note: `Trừ phí bảo hành đơn ${finalOrderCode}`, date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0], orderCode: finalOrderCode }];
                    }
                    payloadOrder.cod = codAmt;
                }

                // 📜 GHI NHẬN LỊCH SỬ SỬA ĐƠN HÀNG CÔNG KHAI
                if (isEdit && editOrder) {
                    const editTime = typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ').slice(0, 16) : new Date().toLocaleString('vi-VN');
                    let changes = [];
                    if (String(editOrder.customer || '').trim() !== String(payloadOrder.customer || '').trim()) {
                        changes.push(`Khách: "${editOrder.customer || ''}" ➔ "${payloadOrder.customer || ''}"`);
                    }
                    if (String(editOrder.phone || '').trim() !== String(payloadOrder.phone || '').trim()) {
                        changes.push(`SĐT: "${editOrder.phone || ''}" ➔ "${payloadOrder.phone || ''}"`);
                    }
                    if (String(editOrder.address || '').trim() !== String(payloadOrder.address || '').trim()) {
                        changes.push(`Địa chỉ: "${editOrder.address || ''}" ➔ "${payloadOrder.address || ''}"`);
                    }
                    if (Number(editOrder.revenue || 0) !== Number(payloadOrder.revenue || 0)) {
                        changes.push(`Doanh thu: ${Number(editOrder.revenue || 0).toLocaleString('vi-VN')}đ ➔ ${Number(payloadOrder.revenue || 0).toLocaleString('vi-VN')}đ`);
                    }
                    if (Number(editOrder.cod || 0) !== Number(payloadOrder.cod || 0)) {
                        changes.push(`COD: ${Number(editOrder.cod || 0).toLocaleString('vi-VN')}đ ➔ ${Number(payloadOrder.cod || 0).toLocaleString('vi-VN')}đ`);
                    }
                    if (Number(editOrder.prePaid || 0) !== Number(payloadOrder.prePaid || 0)) {
                        changes.push(`Cọc: ${Number(editOrder.prePaid || 0).toLocaleString('vi-VN')}đ ➔ ${Number(payloadOrder.prePaid || 0).toLocaleString('vi-VN')}đ`);
                    }
                    if (String(editOrder.status || '') !== String(payloadOrder.status || '')) {
                        changes.push(`Trạng thái: "${editOrder.status || ''}" ➔ "${payloadOrder.status || ''}"`);
                    }
                    if (changes.length > 0) {
                        const historyEntry = `[LỊCH SỬ SỬA ${editTime} bởi ${currentUser || 'Hệ thống'}]: ${changes.join(' | ')}`;
                        payloadOrder.note = payloadOrder.note ? `${payloadOrder.note}\n${historyEntry}` : historyEntry;
                    }
                }

                // 🛠 FIX BUG XÓA SẢN PHẨM Ở ĐÂY: Ép định dạng tên Sheet 'Production' chuẩn trên Database
                if (deletedProds.length > 0) {
                    payload.deletes = { Production: deletedProds, prodItems: deletedProds };
                }

                let newItemsToPush = localProds.map(lp => { const { isNewLocal, ...cleanProd } = lp; return cleanProd; });
                if (newItemsToPush.length > 0) payload.Products = newItemsToPush;

                await pushDeltas(payload, isEdit ? 'Cập nhật thành công!' : 'Tạo đơn thành công!', 'fa-check');
                onClose();
            } catch (e) { if (triggerToast) triggerToast('Lỗi lưu đơn!', 'fa-times', 'danger'); }
            setIsSubmitting(false);
        };

        return (
            <div className="fixed inset-0 z-[9999] bg-[#0a0a0a]/95 flex flex-col sm:items-center sm:justify-center sm:p-4 backdrop-blur-md animate-fade-in" style={{ height: '100%', top: 0, left: 0, right: 0, bottom: 0 }}>
                <style>{`
        .add-modal-box { flex: 1; width: 100%; min-height: 0; }
        @media (min-width: 640px) {
          .add-modal-box { flex: none; height: 90vh; width: 95vw; max-width: 1200px; max-height: 95vh; }
        }
      `}</style>
                <div className="bg-[#141414] add-modal-box flex flex-col sm:rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.8)] border-0 sm:border border-[#333] relative overflow-hidden">

                    <div className="p-4 border-b border-[#222] flex justify-between items-center bg-[#1a1a1a] shrink-0 pt-[max(1rem,env(safe-area-inset-top))]">
                        <h2 className="font-black text-[15px] text-[#f5f5f5] tracking-wide">
                            {isEdit ? <><i className="fas fa-edit text-[#2563eb] mr-2"></i>SỬA ĐƠN {isSaleUI ? 'BÁN HÀNG' : ''}</> : (isSaleUI ? <><i className="fas fa-shopping-cart text-[#3b82f6] mr-2"></i>LÊN ĐƠN BÁN HÀNG</> : <><i className="fas fa-plus-circle text-[#10b981] mr-2"></i>TẠO LỆNH {isSXT ? 'TỒN KHO' : ''}</>)}
                        </h2>
                        <button onClick={onClose} disabled={isSubmitting} className="w-8 h-8 bg-[#222] rounded-full text-gray-400 hover:text-rose-500 flex items-center justify-center transition-colors"><i className="fas fa-times"></i></button>
                    </div>

                    <div className="flex-1 min-h-0 overflow-y-auto p-4 custom-scrollbar">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                            <div className="space-y-4">
                                {!isSXT && !isEdit && (
                                    <div className="bg-[#0a0a0a] text-[#888] p-3 rounded-xl border border-[#222] text-[11px] font-bold shadow-sm flex items-center">
                                        <i className="fas fa-brain mr-2 text-[#3b82f6] text-lg"></i>
                                        <span>Lên đơn ngay, hệ thống tự động quét kho và chia việc xưởng lúc chốt.</span>
                                    </div>
                                )}

                                {forceSXT && !isEdit && (<div className="bg-[#10b981]/10 border border-[#10b981]/30 text-[#10b981] p-3 rounded-xl text-center font-black text-[11px] mb-1 uppercase tracking-widest"><i className="fas fa-bolt mr-2"></i> Giao diện quản lý: Sản Xuất Nhanh</div>)}

                                <div className="bg-[#0a0a0a] p-3 rounded-xl border border-[#222] space-y-3 shadow-sm">
                                    {!isSXT && (
                                        <div>
                                            <label className="text-[10px] font-bold text-gray-500 mb-1 block uppercase">Kênh Bán</label>
                                            <select value={channel} onChange={e => handleChannelChange(e.target.value)} className="w-full p-2.5 bg-[#141414] border border-[#333] rounded-lg text-[12px] font-bold text-[#e5e5e5] outline-none focus:border-[#2563eb]">
                                                {isSaleRole ? (
                                                    saleChannels.map(c => <option key={c} value={c}>{c}</option>)
                                                ) : (
                                                    <>
                                                        {typeof CHANNELS !== 'undefined' ? CHANNELS.map(c => <option key={c} value={c}>{c}</option>) : <option>Shopee VN</option>}
                                                        <option value="Bảo Hành & Thu Hồi">Bảo Hành & Thu Hồi (Form Sale)</option>
                                                    </>
                                                )}
                                            </select>
                                        </div>
                                    )}

                                    <div className="flex gap-2">
                                        {!isSXT && (
                                            <div className="flex-1">
                                                <label className="text-[10px] font-bold text-gray-500 mb-1 block uppercase">Mã đơn</label>
                                                <input value={orderCode} onChange={e => setOrderCode(e.target.value)} disabled={isSXT || isSaleUI} className="w-full p-2.5 bg-[#141414] border border-[#333] rounded-lg text-[12px] font-bold text-[#e5e5e5] outline-none focus:border-[#2563eb] disabled:opacity-50 disabled:text-[#d4af37]" placeholder="VD: 2506..." />
                                            </div>
                                        )}
                                        {!isSXT && (
                                            <div className="flex-1 animate-fade-in">
                                                <label className="text-[10px] font-bold text-gray-500 mb-1 block uppercase">Mã vận đơn</label>
                                                <input value={trackingId} onChange={e => setTrackingId(e.target.value)} className="w-full p-2.5 bg-[#141414] border border-[#333] rounded-lg text-[12px] font-bold text-[#e5e5e5] outline-none focus:border-[#2563eb]" placeholder="VD: SPX..." />
                                            </div>
                                        )}
                                    </div>

                                    {isSaleUI ? (
                                        <>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div><label className="text-[10px] font-bold text-gray-500 mb-1 block uppercase">Tên khách hàng *</label><input value={customer} onChange={e => setCustomer(e.target.value)} className="w-full p-2.5 bg-[#141414] border border-[#333] rounded-lg text-[12px] font-bold text-[#e5e5e5] outline-none focus:border-[#2563eb]" placeholder="Nguyễn Văn A" /></div>
                                                <div><label className="text-[10px] font-bold text-gray-500 mb-1 block uppercase">Số điện thoại *</label><input value={phone} onChange={e => setPhone(e.target.value)} className="w-full p-2.5 bg-[#141414] border border-[#333] rounded-lg text-[12px] font-bold text-[#e5e5e5] outline-none focus:border-[#2563eb]" placeholder="09..." /></div>

                                                                    image: templateImg, realImage: qaData.realImage || '', costPrice: 0,
                                                                    price: Number(qaData.price) || 0, quantity: Number(qaData.quantity) || 0,
                                                                    unit: 'Bộ',
                                                                    isNewLocal: true
                                                                };
                                                                setLocalProds([...localProds, newP]); selectProduct(newP);
                                                                setQaData({ name: '', dim: '', price: '', cost: '', sku: '', realImage: '', unit: 'Cái' });
                                                            };
                                                            return (
                                                                <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-3 relative overflow-hidden mb-3 shadow-inner">
                                                                    {templateImg && (
                                                                        <div className="absolute right-0 top-0 w-1/3 h-full opacity-20 pointer-events-none">
                                                                            <img src={templateImg} className="w-full h-full object-cover" alt="template" />
                                                                        </div>
                                                                    )}
                                                                    <div className="relative z-10">
                                                                        <h4 className="text-[#10b981] font-black uppercase text-[11px] mb-2 flex items-center gap-1.5"><i className="fas fa-magic"></i> TẠO NHANH KÍCH THƯỚC</h4>
                                                                        <div className="flex flex-col gap-2">
                                                                            <div className="flex gap-2">
                                                                                <input value={qaData.dim} onChange={e => setQaData({ ...qaData, dim: e.target.value })} placeholder="Kích thước. VD: 30x20x25cm" className="flex-1 bg-[#141414] border border-[#333] rounded-lg px-3 py-2 text-[12px] font-black text-white outline-none focus:border-[#10b981]" />
                                                                                <button onClick={handleQuickCreate} disabled={!qaData.dim} className="px-3 bg-[#10b981] text-[#0a0a0a] font-black text-[11px] rounded-lg hover:bg-emerald-400 disabled:opacity-50 transition-all shadow-md shrink-0"><i className="fas fa-plus mr-1"></i> TẠO & CHỌN</button>
                                                                            </div>
                                                                            <div className="flex gap-2">
                                                                                <input type="number" value={qaData.price || ''} onChange={e => setQaData({ ...qaData, price: e.target.value })} placeholder="Giá bán..." className="flex-1 bg-[#141414] border border-[#333] rounded-lg px-3 py-2 text-[11px] text-white outline-none focus:border-[#10b981]" />
                                                                                <input type="number" value={qaData.quantity || ''} onChange={e => setQaData({ ...qaData, quantity: e.target.value })} placeholder="Tồn kho..." className="w-1/3 bg-[#141414] border border-[#333] rounded-lg px-3 py-2 text-[11px] text-white outline-none focus:border-[#10b981]" />
                                                                            </div>
                                                                            <div className="relative">
                                                                                <input type="file" accept="image/png, image/jpeg, image/jpg, image/webp" onChange={async e => { const f = e.target.files[0]; if (f) { try { setQaData({ ...qaData, realImage: await resizeImage(f) }); } catch (err) { } } }} className="hidden" id="quick-create-upload" />
                                                                                <label htmlFor="quick-create-upload" className="w-full flex items-center justify-center gap-2 bg-[#141414] hover:bg-[#1a1a1a] cursor-pointer border border-[#333] rounded-lg px-3 py-2 text-[11px] text-gray-400 transition-colors">
                                                                                    <i className="fas fa-camera text-emerald-500"></i> {qaData.realImage ? 'Đã tải lên ảnh thực tế' : 'Chụp/Tải lên ảnh thực tế'}
                                                                                </label>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })()}

                                                        {layoutData.dims.length === 0 ? (
                                                            <div className="text-center text-[#555] mt-3 text-[12px] font-bold">Chưa có kích thước nào</div>
                                                        ) : layoutData.dims.map(p => {
                                                            const dim = p.name.replace(`${selVer} - `, '').trim();
                                                            return (
                                                                <div key={p.id} onClick={() => selectProduct(p)} className="bg-[#141414] border border-[#222] p-3 rounded-xl shadow-sm active:scale-95 cursor-pointer flex items-center justify-between hover:border-[#10b981] transition-colors group mb-2.5">
                                                                    {p.image && (
                                                                        <div className="w-12 h-12 shrink-0 rounded-lg overflow-hidden border border-[#444] mr-3 bg-black">
                                                                            <img src={p.image} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" alt="img" />
                                                                        </div>
                                                                    )}
                                                                    <div className="flex flex-col flex-1 min-w-0 pr-3">
                                                                        <span className="font-black text-[13px] text-[#10b981] mb-1 truncate">{dim || 'Mặc định'}</span>
                                                                        <span className="text-[10px] font-bold text-gray-500 bg-[#0a0a0a] px-2 py-0.5 rounded border border-[#333] w-fit truncate">SKU: <span className="text-[#d4af37]">{p.sku}</span></span>
                                                                    </div>
                                                                    <div className="w-8 h-8 rounded-full bg-[#10b981]/10 text-[#10b981] flex items-center justify-center border border-[#10b981]/30 group-hover:bg-[#10b981] group-hover:text-white transition-colors shrink-0"><i className="fas fa-check"></i></div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                        </div>
                    )}
                </div>
                {ctvLayoutModal && (
                    <LayoutConfigModal
                        product={ctvLayoutModal}
                        configGiaLayout={configGiaLayout}
                        onClose={() => setCtvLayoutModal(null)}
                        triggerToast={triggerToast}
                        onConfirm={(newName, finalPrice) => {
                            const phases = { phase1: { name: 'Dựng Khung', status: 'Pending' }, phase2: { name: 'Gia Cố', status: 'Pending' } };
                            if (swapIndex !== null) {
                                const newProds = [...prods];
                                newProds[swapIndex] = { ...newProds[swapIndex], type: 'Layout', name: newName, phases, ctvPrice: finalPrice };
                                setProds(newProds);
                                setSwapIndex(null);
                            } else {
                                setProds([...prods, { id: 'P' + Date.now() + Math.random(), type: 'Layout', name: newName, note: '', status: 'Pending', fulfilledFromStock: false, phases, ctvPrice: finalPrice }]);
                            }
                            setRetailTotal(prev => (Number(prev) || 0) + finalPrice);
                            triggerToast(`Đã tự động tính giá: ${finalPrice.toLocaleString('vi-VN')}đ`, 'fa-check', 'success');
                            setCtvLayoutModal(null);
                        }}
                    />
                )}
            </div>
        );
    }

    // ==========================================
    // COMPONENT XEM / TẠO ÁNH HOÁ ĐƠN BÁN LẺ (PHIẾU NHIỆT GIỐNG MẪU KIOTVIET)
    // ==========================================
    function OrderInvoiceModal({ order, prods, accessories, erpProducts, onClose, triggerToast }) {
        const [receiptImageUrl, setReceiptImageUrl] = React.useState('');
        const [isGeneratingImg, setIsGeneratingImg] = React.useState(false);
        const printRef = React.useRef();

        if (!order) return null;

        let mainCode = order.orderCode || order.id || '';
        let trackingCode = order.shippingCode || '';
        if (!trackingCode && mainCode.includes('MVĐ:')) {
            const parts = mainCode.split('MVĐ:');
            mainCode = parts[0].trim();
            trackingCode = parts[1].trim();
        } else if (mainCode.includes(' | ')) {
            mainCode = mainCode.split(' | ')[0].trim();
        }

        const generateReceiptCanvas = React.useCallback(() => {
            setIsGeneratingImg(true);
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 380;
                
                const itemsList = [];
                (prods || []).forEach(p => {
                    let pPrice = Number(p.price || 0);
                    if (!pPrice && Array.isArray(erpProducts)) {
                        const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(p.name || p.type || '').trim().toLowerCase());
                        if (match && Number(match.price)) pPrice = Number(match.price);
                    }
                    itemsList.push({ name: p.name || p.type || 'Sản phẩm', price: pPrice, qty: 1 });
                });
                (accessories || []).forEach(a => {
                    let aPrice = Number(a.price || 0);
                    if (!aPrice && Array.isArray(erpProducts)) {
                        const match = erpProducts.find(x => String(x.name || '').trim().toLowerCase() === String(a.name || '').trim().toLowerCase());
                        if (match && Number(match.price)) aPrice = Number(match.price);
                    }
                    itemsList.push({ name: a.name || 'Phụ kiện', price: aPrice, qty: Number(a.quantity || 1) });
                });

                // Phân bổ giá bán thông minh từ Tổng Doanh Thu nếu chưa có đơn giá riêng lẻ
                const totalQty = itemsList.reduce((sum, i) => sum + (i.qty || 1), 0);
                const knownSum = itemsList.reduce((sum, i) => sum + (i.price * (i.qty || 1)), 0);
                const orderRevenue = Number(order.revenue || 0);
                if (knownSum === 0 && orderRevenue > 0 && totalQty > 0) {
                    const avgUnitPrice = Math.round(orderRevenue / totalQty);
                    itemsList.forEach(i => { if (!i.price) i.price = avgUnitPrice; });
                }

                // Tính toán chiều cao linh hoạt
                let estimatedHeight = 340;
                ctx.font = '12px Arial, sans-serif';
                itemsList.forEach(item => {
                    const words = item.name.split(' ');
                    let line = '';
                    let lineCount = 1;
                    for (let w = 0; w < words.length; w++) {
                        if (ctx.measureText(line + words[w] + ' ').width > 200) {
                            lineCount++;
                            line = words[w] + ' ';
                        } else {
                            line += words[w] + ' ';
                        }
                    }
                    estimatedHeight += (lineCount * 18) + 16;
                });

                const noteText = order.note || '';
                if (noteText) {
                    estimatedHeight += Math.ceil(noteText.length / 32) * 18 + 10;
                }

                canvas.width = width;
                canvas.height = Math.max(500, Math.min(1600, estimatedHeight));

                // Nền trắng
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let y = 35;
                ctx.fillStyle = '#000000';
                
                // Tiêu đề HÓA ĐƠN BÁN LẺ
                ctx.textAlign = 'center';
                ctx.font = 'bold 22px "Courier New", monospace, Arial';
                ctx.fillText('HÓA ĐƠN BÁN LẺ', width / 2, y);
                y += 30;

                // Các dòng thông tin đơn hàng
                ctx.textAlign = 'left';
                ctx.font = '12px Arial, sans-serif';

                const drawInfoLine = (label, val) => {
                    if (!val && val !== 0 && val !== '0') return;
                    ctx.font = 'bold 12px Arial, sans-serif';
                    ctx.fillText(label, 15, y);
                    const labelWidth = ctx.measureText(label).width;
                    ctx.font = '12px Arial, sans-serif';
                    
                    const maxValW = width - 30 - labelWidth;
                    const valStr = String(val);
                    if (ctx.measureText(valStr).width > maxValW) {
                        const words = valStr.split(' ');
                        let line = '';
                        let isFirst = true;
                        for (let w = 0; w < words.length; w++) {
                            if (ctx.measureText(line + words[w] + ' ').width > maxValW) {
                                ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                                y += 18;
                                line = words[w] + ' ';
                                isFirst = false;
                            } else {
                                line += words[w] + ' ';
                            }
                        }
                        if (line.trim()) {
                            ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                            y += 18;
                        }
                    } else {
                        ctx.fillText(valStr, 15 + labelWidth, y);
                        y += 18;
                    }
                };

                drawInfoLine('Số HĐ: ', mainCode);
                drawInfoLine('ĐVVC: ', order.shippingMethod || order.carrier || (order.channel?.includes('Shopee') ? 'SHOPEE' : 'BÁN LẺ'));
                drawInfoLine('Kênh bán: ', order.channel || 'RF Aquarium');
                drawInfoLine('Khách hàng: ', order.customer || 'Khách lẻ');
                if (order.phone) drawInfoLine('Số điện thoại: ', order.phone);
                if (order.note) drawInfoLine('Ghi chú: ', order.note);

                // Đường kẻ phân cách
                y += 5;
                ctx.font = '12px monospace';
                ctx.fillText('----------------------------------------------------', 10, y);
                y += 18;

                // Tiêu đề bảng hàng hóa
                ctx.font = 'bold 12px Arial, sans-serif';
                ctx.fillText('Tên hàng hóa', 15, y);
                ctx.textAlign = 'right';
                ctx.fillText('Đ. giá', 300, y);
                ctx.fillText('SL', 365, y);
                y += 14;

                ctx.textAlign = 'left';
                ctx.font = '12px monospace';
                ctx.fillText('----------------------------------------------------', 10, y);
                y += 18;

                // In từng dòng sản phẩm
                itemsList.forEach(item => {
                    ctx.font = 'bold 12px Arial, sans-serif';
                    const words = item.name.split(' ');
                    let line = '';
                    let startY = y;
                    for (let w = 0; w < words.length; w++) {
                        if (ctx.measureText(line + words[w] + ' ').width > 220) {
                            ctx.fillText(line.trim(), 15, y);
                            y += 18;
                            line = words[w] + ' ';
                        } else {
                            line += words[w] + ' ';
                        }
                    }
                    if (line.trim()) {
                        ctx.fillText(line.trim(), 15, y);
                    }

                    // Giá & SL
                    ctx.font = '12px Arial, sans-serif';
                    ctx.textAlign = 'right';
                    const priceText = item.price > 0 ? item.price.toLocaleString('vi-VN') : '---';
                    ctx.fillText(priceText, 300, y);
                    ctx.fillText(String(item.qty), 365, y);

                    ctx.textAlign = 'left';
                    y += 22;
                });

                // Đường kẻ phân cách
                ctx.font = '12px monospace';
                ctx.fillText('----------------------------------------------------', 10, y);
                y += 22;

                // Khung tổng tiền
                const drawTotalRow = (label, valStr, isBold = false) => {
                    ctx.font = isBold ? 'bold 13px Arial, sans-serif' : '12px Arial, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(label, 15, y);
                    ctx.textAlign = 'right';
                    ctx.fillText(valStr, 365, y);
                    y += 22;
                };

                const revStr = Number(order.revenue || 0).toLocaleString('vi-VN');
                const paidStr = Number(order.prePaid || 0) > 0 ? Number(order.prePaid).toLocaleString('vi-VN') : '---';
                const discountStr = Number(order.discount || 0) > 0 ? Number(order.discount).toLocaleString('vi-VN') : '0';
                const createdTimeStr = order.createdAt || order.date || new Date().toLocaleString('vi-VN');

                drawTotalRow('Tổng tiền hàng:', revStr, true);
                drawTotalRow('Đã thanh toán:', paidStr);
                drawTotalRow('Giảm giá:', discountStr);
                drawTotalRow('Thời gian tạo:', createdTimeStr);

                // Đường kẻ kéo cắt ở cuối
                y += 5;
                ctx.font = '12px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('✂--------------------------------------------------', 10, y);

                const dataUrl = canvas.toDataURL('image/png');
                setReceiptImageUrl(dataUrl);
            } catch (err) {
                console.error("Lỗi tạo ảnh hoá đơn:", err);
            } finally {
                setIsGeneratingImg(false);
            }
        }, [order, prods, accessories, mainCode]);

        React.useEffect(() => {
            generateReceiptCanvas();
        }, [generateReceiptCanvas]);

        const handleDownloadImage = () => {
            if (!receiptImageUrl) return;
            const a = document.createElement('a');
            a.href = receiptImageUrl;
            a.download = `HoaDon_${mainCode}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            if (typeof triggerToast === 'function') {
                triggerToast('Đã tải ảnh hoá đơn về máy thành công!', 'fa-download', 'success');
            } else {
                alert('Đã tải ảnh hoá đơn về máy thành công!');
            }
        };

        const handleCopyImage = () => {
            if (!receiptImageUrl) return;
            fetch(receiptImageUrl)
                .then(res => res.blob())
                .then(blob => {
                    if (navigator.clipboard && window.ClipboardItem) {
                        return navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                    } else {
                        throw new Error('Trình duyệt chưa hỗ trợ sao chép ảnh trực tiếp, tự động chuyển sang tải ảnh.');
                    }
                })
                .then(() => {
                    if (typeof triggerToast === 'function') {
                        triggerToast('Đã sao chép ảnh hoá đơn! Nhấn Ctrl+V để dán gửi Zalo/FB.', 'fa-copy', 'success');
                    } else {
                        alert('Đã sao chép ảnh hoá đơn! Nhấn Ctrl+V để dán gửi Zalo/FB.');
                    }
                })
                .catch(err => {
                    handleDownloadImage();
                });
        };

        const handleCopySummary = () => {
            const formattedRevenue = Number(order.revenue || 0).toLocaleString('vi-VN');
            const formattedPrePaid = Number(order.prePaid || 0).toLocaleString('vi-VN');
            const codRemain = Math.max(0, Number(order.revenue || 0) - Number(order.prePaid || 0));
            const formattedCodRemain = codRemain.toLocaleString('vi-VN');

            let text = `📄 HÓA ĐƠN BÁN LẺ - RICH FISH AQUARIUM\n`;
            text += `------------------------------------\n`;
            text += `Số HĐ: ${mainCode}\n`;
            if (trackingCode) text += `Mã VĐ: ${trackingCode}\n`;
            text += `Khách hàng: ${order.customer || 'Khách lẻ'}\n`;
            if (order.phone) text += `SĐT: ${order.phone}\n`;
            text += `------------------------------------\n`;
            text += `DANH SÁCH MẶT HÀNG:\n`;
            
            let count = 1;
            (prods || []).forEach(p => { text += `${count++}. ${p.name || p.type} (x1)\n`; });
            (accessories || []).forEach(a => { text += `${count++}. ${a.name} (x${a.quantity || 1})\n`; });
            
            text += `------------------------------------\n`;
            text += `Tổng tiền hàng: ${formattedRevenue}đ\n`;
            if (Number(order.prePaid) > 0) text += `Đã thanh toán: ${formattedPrePaid}đ\n`;
            text += `Còn lại thu (COD): ${formattedCodRemain}đ\n`;
            if (order.note) text += `Ghi chú: ${order.note}\n`;
            text += `------------------------------------\n`;
            text += `Cảm ơn quý khách đã ủng hộ Rich Fish Aquarium! 🐠✨`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                const el = document.createElement('textarea');
                el.value = text; document.body.appendChild(el); el.select();
                document.execCommand('copy'); document.body.removeChild(el);
            }

            if (typeof triggerToast === 'function') {
                triggerToast('Đã sao chép nội dung văn bản hoá đơn!', 'fa-copy', 'success');
            } else {
                alert('Đã sao chép nội dung văn bản hoá đơn!');
            }
        };

        return ReactDOM.createPortal(
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[9999] flex items-center justify-center p-4 overflow-y-auto animate-fade-in" onClick={onClose}>
                <div className="bg-[#12131a] border border-[#2e3248] rounded-2xl w-full max-w-xl shadow-2xl overflow-hidden flex flex-col my-auto max-h-[92vh]" onClick={e => e.stopPropagation()}>
                    
                    {/* MODAL HEADER TOOLBAR */}
                    <div className="bg-[#1a1c29] px-4 py-3 border-b border-[#2e3248] flex items-center justify-between shrink-0">
                        <div className="flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">
                                <i className="fas fa-file-invoice text-base"></i>
                            </div>
                            <div>
                                <h3 className="font-extrabold text-white text-sm tracking-wide">
                                    HÓA ĐƠN BÁN LẺ
                                </h3>
                                <p className="text-[11px] text-slate-400 font-medium">{mainCode}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={handleCopyImage}
                                className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition shadow flex items-center gap-1.5 cursor-pointer border border-blue-400/30"
                                title="Sao chép ảnh hoá đơn để dán vào Zalo/Facebook (Ctrl+V)"
                            >
                                <i className="fas fa-copy"></i>
                                <span>Sao Chép Ảnh</span>
                            </button>
                            <button
                                onClick={handleDownloadImage}
                                className="px-3 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-black transition shadow-lg flex items-center gap-1.5 cursor-pointer border border-emerald-400/30"
                                title="Tải file ảnh PNG về máy"
                            >
                                <i className="fas fa-download"></i>
                                <span>Tải Ảnh PNG</span>
                            </button>
                            <button
                                onClick={onClose}
                                className="w-8 h-8 rounded-xl bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition flex items-center justify-center cursor-pointer ml-1"
                            >
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    {/* MODAL BODY - IMAGE PREVIEW CONTAINER */}
                    <div className="p-5 overflow-y-auto custom-scrollbar flex-1 bg-[#0a0b0e] flex flex-col items-center justify-center">
                        {isGeneratingImg && (
                            <div className="py-12 text-center text-slate-400 text-xs font-bold space-y-2">
                                <i className="fas fa-spinner fa-spin text-2xl text-emerald-400"></i>
                                <p>Đang khởi tạo ảnh Hóa Đơn Bán Lẻ...</p>
                            </div>
                        )}

                        {!isGeneratingImg && receiptImageUrl && (
                            <div className="flex flex-col items-center space-y-3 w-full">
                                <div className="p-3 bg-[#181924] rounded-2xl border border-slate-700/60 shadow-2xl max-w-[400px] w-full text-center">
                                    <p className="text-[11px] text-emerald-400 font-bold mb-2 flex items-center justify-center gap-1.5">
                                        <i className="fas fa-check-circle"></i> Ảnh Hoá Đơn Đã Sẵn Sàng Để Gửi Khách
                                    </p>
                                    <div className="bg-white p-1 rounded-xl shadow-inner border border-slate-300 inline-block overflow-hidden max-w-full">
                                        <img
                                            src={receiptImageUrl}
                                            alt="Hoa Don Ban Le"
                                            className="mx-auto rounded max-w-full h-auto shadow-md"
                                            title="Nhấp chuột phải hoặc giữ ảnh để chọn 'Sao chép ảnh' hoặc 'Lưu ảnh'"
                                        />
                                    </div>
                                    <p className="text-[10px] text-slate-400 italic mt-2">
                                        💡 Bạn có thể bấm <b>Sao Chép Ảnh</b> (rồi ấn Ctrl+V gửi Zalo) hoặc <b>Tải Ảnh PNG</b>.
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODAL FOOTER */}

    // ==========================================
    // 3. COMPONENT THẺ ĐƠN HÀNG (ĐÃ CẬP NHẬT TÔ MÀU XANH KHI ĐẠT KCS)
    // ==========================================
    function OrderCardV2({
        attendance, order, prods, pack, packings, erpProducts, erpData, isAdmin, currentUser, pushDeltas,
        prodItems, userConfigs, triggerToast, isSelected, onToggleSelect, kpiConfig, idx_num,
        handleCancelOrder, handleConfirmStockIn, openReturnModal, onEditOrder, filterStatus
    }) {
        const [optimisticOrder, setOptimisticOrder] = React.useState(null);
        const [optimisticPack, setOptimisticPack] = React.useState(null);
        const [sosTarget, setSosTarget] = React.useState(null);

        React.useEffect(() => {
            setOptimisticOrder(null);
            setCheckedItems([]);
            setGoodsFile(null);
            setBoxFile(null);
            setWhFile(null);
        }, [order?.status, order?.isCarriedToWH, order?.id]);
        React.useEffect(() => { setOptimisticPack(null); }, [pack?.status, pack?.id, pack?.photo]);

        const _order = optimisticOrder || order;
        const _pack = optimisticPack || pack;

        const isBossRole = localStorage.getItem('rf_boss') === 'true';
        const currentRole = localStorage.getItem('rf_role') || '';
        const isCTV = currentRole === 'CTV';
        const isOwnOrder = _order.createdBy === currentUser || _order.sale === currentUser || _order.updatedBy === currentUser || _order.responsibleUser === currentUser || String(_order.channel || '').toUpperCase().includes('CỘNG TÁC VIÊN') || String(_order.channel || '').toUpperCase() === 'CTV';
        const canEdit = isBossRole || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || currentRole === 'KẾ TOÁN' || currentRole === 'TỐI CAO' || (isCTV && isOwnOrder);
        const canCancel = isBossRole || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || currentRole === 'KẾ TOÁN' || currentRole === 'TỐI CAO';

        const [goodsFile, setGoodsFile] = React.useState(null);
        const [boxFile, setBoxFile] = React.useState(null);
        const [whFile, setWhFile] = React.useState(null);
        const [processing, setProcessing] = React.useState(false);
        const [checkedItems, setCheckedItems] = React.useState([]);
        const [isExpanded, setIsExpanded] = React.useState(false);
        const [showDetailModal, setShowDetailModal] = React.useState(false);
        const [showInvoiceModal, setShowInvoiceModal] = React.useState(false);
        const [showReconcile, setShowReconcile] = React.useState(false);
        const [showGHNModal, setShowGHNModal] = React.useState(false);
        const [showHistoryModal, setShowHistoryModal] = React.useState(false);
        const [importingAcc, setImportingAcc] = React.useState(null);

        const handleQuickImportAccessory = async (accName, missingQty, costPrice) => {
            if (processing || importingAcc) return;
            try {
                setImportingAcc(accName);
                const itemsData = [{ name: accName, qty: missingQty, price: Number(costPrice || 0) }];
                const stockLogs = [{
                    id: 'IE_QUICK_' + Date.now(),
                    type: 'Nhập',
                    target: 'Bổ sung thiếu kho',
                    totalAmount: missingQty * Number(costPrice || 0),
                    date: typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ').slice(0, 19) : new Date().toISOString().replace('T', ' ').slice(0, 19),
                    note: `Nhập nhanh phụ kiện thiếu cho Đơn ${_order.orderCode}`,
                    itemsData: JSON.stringify(itemsData)
                }];

                const prodList = erpProducts || (typeof erpData !== 'undefined' ? (erpData.Products || erpData.products) : []) || [];
                const pMatch = prodList.find(x => String(x.name).trim() === String(accName).trim());
                let productUpdates = [];
                if (pMatch) {
                    productUpdates.push({
                        id: pMatch.id,
                        quantity: Number(pMatch.quantity || 0) + missingQty
                    });
                }
                
                await pushDeltas({ ImportExport: stockLogs, Products: productUpdates }, `Đã nhập bù ${missingQty} ${accName}!`, 'fa-download');
                triggerToast(`Đã nhập bù thành công ${missingQty} ${accName}!`, 'fa-check', 'success');
            } catch (e) {
                triggerToast('Lỗi nhập nhanh: ' + e.message, 'fa-times', 'danger');
            } finally {
                setImportingAcc(null);
            }
        };

        const accountsData = erpData?.Accounts || [];
        const [recForm, setRecForm] = React.useState(() => {
            const fullCode = order?.orderCode || '';
            let mCode = fullCode;
            if (!order?.shippingCode) {
                if (fullCode.includes(' | MVĐ: ')) mCode = fullCode.split(' | MVĐ: ')[0];
                else if (fullCode.includes('|MVĐ:')) mCode = fullCode.split('|MVĐ:')[0];
            }
            const orderTxs = (erpData?.Transactions || erpData?.transactions || []).filter(tx => tx.type === 'Thu' && (String(tx.title || '').includes(mCode) || String(tx.note || '').includes(mCode) || String(tx.orderCode || '').includes(mCode)));
            const paidAmt = orderTxs.reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
            const total = Number(order?.cod || order?.revenue || 0);
            const remaining = Math.max(0, total - paidAmt);
            return {
                amount: remaining,
                accountId: (accountsData.find(a => (a.accountName || a.name) === 'Công Ty') || accountsData[0])?.id || '',
                createTx: remaining > 0
            };
        });

        const fmtImg = (url) => {
            if (!url || typeof url !== 'string') return '';
            const str = url.trim();
            if (str.includes('drive.google.com/file/d/')) {
                const match = str.match(/\/d\/([^/]+)/);
                return match ? ('https:\x2F\x2Fdrive.google.com/uc?export=view&id=' + match[1]) : str;
            }
            if (str.includes('drive.google.com/open?id=')) {
                const match = str.match(/id=([^&]+)/);
                return match ? ('https:\x2F\x2Fdrive.google.com/uc?export=view&id=' + match[1]) : str;
            }
            return str;
        };

        const getProductInfo = (name) => {
            if (!name) return null;
            const prodList = erpProducts || (typeof erpData !== 'undefined' ? (erpData.Products || erpData.products) : []) || [];
            if (!prodList || prodList.length === 0) return null;

            const rawName = String(name).trim();
            const rawLower = rawName.toLowerCase();

            // 1. Khớp chính xác 100% theo tên (ưu tiên sản phẩm có ảnh/realImage)
            let match = prodList.find(x => String(x.name || '').trim().toLowerCase() === rawLower && (x.image || x.realImage));
            if (!match) match = prodList.find(x => String(x.name || '').trim().toLowerCase() === rawLower);
            if (match && (match.image || match.realImage)) {
                return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
            }

            // Chuẩn hóa tên sản phẩm (bỏ rác, chuẩn hóa ver / v)
            const norm = (str) => String(str || '').toLowerCase()
                .replace(/ver\.?\s*/gi, 'ver')
                .replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/gi, ' ')
                .replace(/\s+/g, ' ').trim();

            const normRaw = norm(rawName);
            const rawBaseName = norm(rawName.split(' - ')[0]);

            // 2. Khớp theo Tên Phân Loại Gốc (BaseName - VD: "rừng ver.16")
            if (rawBaseName) {
                match = prodList.find(x => {
                    const xNorm = norm(x.name);
                    const xBase = norm(String(x.name || '').split(' - ')[0]);
                    return (xBase === rawBaseName || xNorm === rawBaseName) && (x.image || x.realImage);
                });
                if (match) {
                    return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
                }
            }

            // 3. Khớp theo số Version cụ thể (VD: "ver16")
            const verMatch = normRaw.match(/ver\s*(\d+)/);
            if (verMatch && verMatch[1]) {
                const targetVer = `ver${verMatch[1]}`;
                match = prodList.find(x => {
                    const xNorm = norm(x.name);
                    return xNorm.includes(targetVer) && (x.image || x.realImage);
                });
                if (match) {
                    return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
                }
            }

            // 4. Khớp theo chuỗi con (Substring), nhưng KHÔNG lấy danh mục gốc nếu tên chứa ver
            if (normRaw.length >= 3) {
                const sorted = [...prodList].filter(x => x.image || x.realImage).sort((a, b) => (b.name || '').length - (a.name || '').length);
                match = sorted.find(x => {
                    const xNorm = norm(x.name);
                    const xBase = norm(String(x.name || '').split(' - ')[0]);
                    if (rawBaseName && rawBaseName.includes('ver') && !xBase.includes('ver')) return false;
                    return xNorm && xNorm.length >= 3 && (normRaw.includes(xNorm) || xNorm.includes(normRaw));
                });
                if (match) {
                    return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
                }
            }

            const finalFallback = match || prodList.find(x => String(x.name || '').trim().toLowerCase() === rawLower) || null;
            if (finalFallback) {
                return { ...finalFallback, image: fmtImg(finalFallback.image || finalFallback.realImage), realImage: fmtImg(finalFallback.realImage || finalFallback.image) };
            }
            return null;
        };

        const accessories = React.useMemo(() => {
            let acc = _order.accessories || _order.products || _order.itemsData;
            if (!acc) return [];
            try {
                if (typeof acc === 'string') {
                    acc = acc.trim();
                    if (acc.startsWith('[') || acc.startsWith('{')) {
                        acc = JSON.parse(acc);
                        if (typeof acc === 'string') acc = JSON.parse(acc);
                    } else if (acc.includes(',')) {
                        acc = acc.split(',').map(s => s.trim()).filter(Boolean);
                    } else if (acc.length > 0) {
                        acc = [acc];
                    }
                }
            } catch (e) {
                console.warn("Lỗi parse accessories:", e);
                return [];
            }
            if (!Array.isArray(acc)) return [];
            return acc.map((a, idx) => {
                if (typeof a === 'string') {
                    return { id: `acc_str_${_order.id}_${idx}`, name: a, quantity: 1, hasProduction: false };
                }
                if (typeof a === 'object' && a !== null && (a.name || a.Name || a.productName)) {
                    return {
                        id: a.id || `acc_obj_${_order.id}_${idx}`,
                        name: a.name || a.Name || a.productName || 'Không tên',
                        quantity: Number(a.quantity || a.Quantity || a.qty || 1),
                        hasProduction: Boolean(a.hasProduction)
                    };
                }
                return null;
            }).filter(Boolean);
        }, [_order.accessories, _order.products, _order.itemsData, _order.id]);

        const { effectiveProds, effectiveAccessories } = React.useMemo(() => {
            const effProds = [...(prods || [])];
            const effAccs = [];

            (accessories || []).forEach((accItem, idx) => {
                const itemName = accItem?.name || '';
                const pInfo = getProductInfo(itemName);
                const cat = String(pInfo?.category || '').toUpperCase();
                const lname = itemName.toLowerCase();
                const isTargetCat = cat === 'BỂ KÍNH' || cat === 'LAYOUT' || ['BỂ MINI', 'TERRARIUM', 'BÁN CẠN', 'BỂ BETTA', 'BỂ NÂNG ĐÁY', 'LINH THÚ', 'VÁCH SUỐI', 'HẺM NÚI', 'NATURE', 'NHẤT TRỤ', 'TRĂNG', 'BONSAI', 'CẦU VỒNG', 'BIOTOP CUỘI', 'HANG ĐỘNG', 'RỪNG', 'ĐẢO BAY', 'CỔNG VÒM', 'COVER'].some(sc => cat.includes(sc)) ||
                    lname.includes('bể') || lname.includes('kính') || lname.includes('terarium') || lname.includes('terrarium') || lname.includes('bán cạn') || lname.includes('layout') || lname.includes('rừng') || lname.includes('bonsai') || lname.includes('vách suối') || lname.includes('hẻm núi') || lname.includes('nhất trụ') || lname.includes('đảo bay') || lname.includes('hang động') || lname.includes('cổng vòm') || lname.includes('linh thú') || lname.includes('cầu vồng') || lname.includes('biotop') || lname.includes('cuội') || lname.includes('tiểu cảnh') || lname.includes('lũa') || lname.includes('thác cát');

                if (isTargetCat) {
                    const existsInProds = effProds.some(p => String(p.name || '').trim().toLowerCase() === String(itemName).trim().toLowerCase());
                    if (!existsInProds) {
                        const qty = Number(accItem.quantity) || 1;
                        for (let q = 0; q < qty; q++) {
                            effProds.push({
                                id: `acc_prod_${_order.id}_${idx}_${q}`,
                                name: itemName,
                                status: (_order.status === 'Đã Bàn Giao' || _order.status === 'Hoàn Thành' || _order.status === 'Sẵn Sàng Đóng Gói') ? 'Done' : 'Pending',
                                fulfilledFromStock: false,
                                note: '',
                                isFromAccFallback: true
                            });
                        }
                    }
                } else {
                    effAccs.push(accItem);
                }
            });

            return { effectiveProds: effProds, effectiveAccessories: effAccs };
        }, [prods, accessories, _order.id, _order.status]);

        const fullOrderCode = _order.orderCode || '';
        let mainOrderCode = fullOrderCode; let shippingCode = _order.shippingCode || '';
        if (!_order.shippingCode) {
            if (fullOrderCode.includes(' | MVĐ: ')) { const parts = fullOrderCode.split(' | MVĐ: '); mainOrderCode = parts[0] || fullOrderCode; shippingCode = parts[1] || ''; }
            else if (fullOrderCode.includes('|MVĐ:')) { const parts = fullOrderCode.split('|MVĐ:'); mainOrderCode = parts[0] || fullOrderCode; shippingCode = parts[1] || ''; }
        } else {
            if (mainOrderCode.includes(' | MVĐ: ')) mainOrderCode = mainOrderCode.split(' | MVĐ: ')[0];
            else if (mainOrderCode.includes('|MVĐ:')) mainOrderCode = mainOrderCode.split('|MVĐ:')[0];
        }

        // BÓC TÁCH LINK ẢNH VÀ GHI CHÚ
        const parsedNote = React.useMemo(() => {
            if (!_order.note) return { text: '', images: [] };
            let text = _order.note; let images = [];
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const matchedUrls = text.match(urlRegex);
            if (matchedUrls) {
                images = matchedUrls;
                text = text.replace(/\|?\s*Link Bill Cọc:\s*(https?:\/\/[^\s]+)/g, '').trim();
                text = text.replace(urlRegex, '').trim();
            }
            text = text.replace(/^\|\s*/, '').trim();
            return { text, images };
        }, [_order.note]);

        const allProdsDone = React.useMemo(() => {
            if (!prods || prods.length === 0) return true;
            return prods.every(p => {
                if (!p) return true;
                const pStatus = String(p.status || '').toUpperCase().trim();
                if (pStatus === 'DONE' || pStatus === 'ĐÃ XONG' || pStatus === 'HỦY/VỠ' || pStatus === 'HOÀN KHO ĐẠT' || pStatus === 'HOÀN THÀNH') return true;

                const ff = p.fulfilledFromStock;
                if (ff === true || ff === 1 || ff === '1') return true;
                const ffStr = String(ff || '').toUpperCase().trim();
                if (ffStr === 'TRUE' || ffStr.includes('LẤY TỪ TỒN KHO') || ffStr.includes('TỒN KHO') || ffStr.includes('KHO CÓ SẴN')) return true;

                const pNote = String(p.note || '').toUpperCase();
                if (pNote.includes('LẤY TỪ TỒN KHO') || pNote.includes('KHO CÓ SẴN')) return true;

                return false;
            });
        }, [prods]);

        const stockMap = React.useMemo(() => {
            const map = new Map();
            const list = erpProducts || erpData?.Products || [];
            for (let i = 0; i < list.length; i++) {
                const item = list[i];
                if (item && item.name) {
                    map.set(String(item.name).trim(), Number(item.quantity || 0));
                }
            }
            return map;
        }, [erpProducts, erpData?.Products]);

        const stockValid = React.useMemo(() => {
            const list = erpProducts || erpData?.Products || [];
            if (!list || list.length === 0) return true;

            const accsOk = (!accessories || accessories.length === 0) ? true : accessories.every(a => {
                if (!a || !a.name) return true;
                const qty = stockMap.get(String(a.name).trim());
                if (qty === undefined) return true;
                const needed = Number(a.quantity) || 1;
                return qty >= needed;
            });
            if (!accsOk) return false;

            const prodsOk = (!prods || prods.length === 0) ? true : prods.every(p => {
                if (!p || !p.fulfilledFromStock || String(p.fulfilledFromStock).toUpperCase() !== 'TRUE') return true;
                const qty = stockMap.get(String(p.name).trim());
                if (qty === undefined) return true;
                return qty >= 1;
            });

            return prodsOk;
        }, [accessories, prods, stockMap, erpProducts, erpData?.Products]);

        const isGHNShipping = _order.shippingMethod === 'Gửi GHN' || String(_order.shippingMethod || '').toLowerCase().includes('ghn') || (!_order.shippingMethod && (_order.channel === 'Cộng Tác Viên' || _order.channel === 'Bán Lẻ'));
        const isGuiXeShipping = _order.shippingMethod === 'Gửi Xe';
        const isShopeeOrTMDT = String(_order.channel || '').toUpperCase().includes('SHOPEE') || String(_order.channel || '').toUpperCase().includes('TIKTOK') || String(_order.channel || '').toUpperCase().includes('LAZADA');
        const hasShippingCode = Boolean(shippingCode && String(shippingCode).trim());
        const requiresShippingCode = isShopeeOrTMDT || isGHNShipping || isGuiXeShipping;
        const shippingGatePassed = !requiresShippingCode || hasShippingCode;

        let effectiveStatus = _order._effectiveStatus || _order.status;
        const upperStatus = String(effectiveStatus || '').toUpperCase().trim();
        const allPackingsList = (typeof packings !== 'undefined' && packings) ? packings : (erpData?.Packings || []);
        const oIdStr = String(_order.id || '').trim();
        const oCodeStr = String(_order.orderCode || '').trim();
        const baseCodeStr = oCodeStr.split(' | ')[0].trim();
        const orderPacks = allPackingsList.filter(p => {
            const pOrd = String(p.orderId || '').trim();
            return pOrd && (pOrd === oIdStr || pOrd === oCodeStr || pOrd === baseCodeStr);
        });

                                                    {(isItemDone || isReadyPack) ? (

                    {isDone && canEdit && (

                                <i className="fas fa-check-double mr-1.5"></i> ĐỐI SOÁT THÀNH CÔNG

                            {showReconcile && (
                                <div className="bg-[#0a0a0a] border border-[#333] rounded-xl p-3 animate-fade-in flex flex-col gap-2 mt-2 shadow-inner">
                                    <div>

                                        <input type="number" value={recForm.amount} onChange={e => setRecForm({ ...recForm, amount: e.target.value })} className="w-full bg-[#141414] border border-[#333] text-[#34d399] font-black p-2 rounded-lg text-sm outline-none focus:border-[#8b5cf6]" placeholder="Nhập số tiền..." />

                                        <label className="text-[9px] text-gray-500 font-bold uppercase block mb-1">Tài khoản tiền vào</label>
                                        <select value={recForm.accountId} onChange={e => setRecForm({ ...recForm, accountId: e.target.value })} className="w-full bg-[#141414] border border-[#333] text-gray-300 font-bold p-2 rounded-lg text-[11px] outline-none focus:border-[#8b5cf6]" disabled={!recForm.createTx}>
                                            {accountsData.map(a => <option key={a.id} value={a.id}>{a.accountName || a.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="bg-rose-500/10 border border-rose-500/20 p-2 rounded-lg mt-1">
                                        <label className="flex items-start gap-2 cursor-pointer">
                                            <input type="checkbox" checked={recForm.createTx} onChange={e => setRecForm({ ...recForm, createTx: e.target.checked })} className="w-4 h-4 mt-0.5 accent-rose-500 rounded cursor-pointer" />
                                            <div className="flex-1">
                                                <div className="text-[11px] font-black text-rose-400">TẠO PHIẾU THU VÀO TÀI KHOẢN</div>
                                                <div className="text-[9px] text-rose-400/80 mt-0.5 leading-tight">Bỏ chọn nếu khách chuyển khoản và hệ thống đã tự quét tạo phiếu thu (tránh nhân đôi doanh thu).</div>
                                            </div>
