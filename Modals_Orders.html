<script type="text/babel">
    // =========================================================================
    // 📦 FILE: Modals_Orders.txt
    // CHỨC NĂNG: Các khối giao diện phức tạp dành riêng cho nghiệp vụ Đơn Hàng
    // BAO GỒM: Trạm bơm Excel, Form Tạo đơn thông minh, Thẻ hiển thị đơn hàng (OrderCard)
    // =========================================================================

    const showCopyModal = (msg) => {
        const overlay = document.createElement('div');
        overlay.className = 'fixed inset-0 bg-black/80 z-[99999] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in';
        
        const box = document.createElement('div');
        box.className = 'bg-[#141414] border border-[#333] w-full max-w-sm rounded-[24px] p-5 shadow-2xl flex flex-col gap-4 text-center';
        
        const icon = document.createElement('div');
        icon.className = 'w-12 h-12 mx-auto bg-blue-500/20 text-blue-500 rounded-full flex items-center justify-center text-xl mb-1';
        icon.innerHTML = '<i class="fas fa-paper-plane"></i>';
        
        const text = document.createElement('div');
        text.className = 'text-[13px] text-gray-200 bg-[#0a0a0a] border border-[#222] p-4 rounded-xl leading-relaxed text-left';
        text.innerText = msg;
        
        const btn = document.createElement('button');
        btn.className = 'w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl uppercase tracking-wider transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95 text-[12px]';
        btn.innerHTML = '📋 COPY ĐỂ GỬI KHÁCH';
        
        btn.onclick = () => {
            navigator.clipboard.writeText(msg).then(() => {
                btn.innerHTML = '✅ Đã Copy!';
                btn.className = 'w-full py-3 bg-emerald-500 text-white font-black rounded-xl uppercase tracking-wider transition-all flex items-center justify-center gap-2 shadow-lg text-[12px]';
                setTimeout(() => { 
                    if(document.body.contains(overlay)) document.body.removeChild(overlay); 
                }, 1500);
            }).catch(err => {
                alert('Lỗi copy: ' + err);
            });
        };
        
        const closeBtn = document.createElement('button');
        closeBtn.className = 'absolute top-3 right-3 w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-white flex items-center justify-center';
        closeBtn.innerHTML = '<i class="fas fa-times"></i>';
        closeBtn.onclick = () => document.body.removeChild(overlay);
        
        box.style.position = 'relative';
        box.appendChild(closeBtn);
        box.appendChild(icon);
        box.appendChild(text);
        box.appendChild(btn);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
    };
    const parseCoverFromNote = (noteStr) => {
        if (!noteStr || noteStr.indexOf('Cover:') === -1) return { coverUrl: null, cleanNote: noteStr || '' };
        const parts = noteStr.split('|');
        const cleanParts = [];
        let coverUrl = null;
        for (let k = 0; k < parts.length; k++) {
            const p = parts[k].trim();
            if (p.indexOf('Cover:') === 0) {
                coverUrl = p.replace('Cover:', '').trim();
            } else if (p) {
                cleanParts.push(p);
            }
        }
        return { coverUrl, cleanNote: cleanParts.join(' | ').trim() };
    };

    // ==========================================
    // 1. MODAL BƠM ĐƠN EXCEL (TÍCH HỢP AI QUÉT KHO & BƠM LỆNH XƯỞNG + CHỐNG CRASH)
    // ==========================================
    function BulkImportModal({ onClose, pushDeltas, existingOrders, products, existingProdItems }) {
        const [preview, setPreview] = React.useState([]);
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [isDragging, setIsDragging] = React.useState(false);
        const [fileName, setFileName] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);
        const [progress, setProgress] = React.useState(0);

        const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ') : new Date().toISOString().slice(0, 16).replace('T', ' ');

        const skuMap = React.useMemo(() => {
            const map = new Map();
            const sortedProducts = [...(products || [])].sort((a, b) => String(b.sku || '').length - String(a.sku || '').length);
            sortedProducts.forEach(p => { const sku = String(p.sku || '').trim().toLowerCase(); if (sku) map.set(sku, p); });
            return map;
        }, [products]);

        const matchProductFromCatalog = React.useCallback((targetSku, rawFullName, pName, pVar) => {
            if (!products || !Array.isArray(products) || products.length === 0) return null;

            const cleanSku = (targetSku || '').trim().toLowerCase();
            const cleanSkuNoDash = cleanSku.replace(/[^a-z0-9]/g, '');

            // 1. MATCH BY SELLER SKU FIRST
            if (cleanSku && cleanSku !== 'n/a' && cleanSku !== 'none') {
                for (const p of products) {
                    const pSku = String(p.sku || '').trim().toLowerCase();
                    if (pSku && pSku === cleanSku) return p;
                }
                if (cleanSkuNoDash.length >= 3) {
                    for (const p of products) {
                        const pSkuNoDash = String(p.sku || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
                        if (pSkuNoDash && pSkuNoDash === cleanSkuNoDash) return p;
                    }
                }
                for (const p of products) {
                    const pSku = String(p.sku || '').trim().toLowerCase();
                    if (pSku && pSku.length >= 3 && (cleanSku.includes(pSku) || (pSku.includes(cleanSku) && cleanSku.length >= 3))) return p;
                }
            }

            // 2. PREPARE TEXT FOR SMART MATCHING
            const fullText = (rawFullName || '').trim().toLowerCase();
            // Map dimensions / size aliases: S -> 20x20x20cm, M -> 30x20x20cm, L -> 40x23x25cm
            let augmentedText = fullText;
            if (/\bsize\s*s\b|\bs\b/i.test(fullText) && !fullText.includes('20x20x20')) augmentedText += ' 20x20x20 20x20x20cm';
            if (/\bsize\s*m\b|\bm\b/i.test(fullText) && !fullText.includes('30x20x20')) augmentedText += ' 30x20x20 30x20x20cm';
            if (/\bsize\s*l\b|\bl\b/i.test(fullText) && !fullText.includes('40x23x25')) augmentedText += ' 40x23x25 40x23x25cm';

            // Sort products by length of name descending
            const sortedProds = [...products].sort((a, b) => String(b.name || '').length - String(a.name || '').length);

            // Direct exact name match
            for (const p of sortedProds) {
                const pNameStr = String(p.name || '').trim().toLowerCase();
                if (!pNameStr) continue;
                if (augmentedText === pNameStr || fullText === pNameStr) return p;
            }

            // Substring inclusion (stripped of punctuation)
            const normFullText = augmentedText.replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ\s]/gi, ' ').replace(/\s+/g, ' ');
            for (const p of sortedProds) {
                const pNameStr = String(p.name || '').trim().toLowerCase();
                if (!pNameStr || pNameStr.length < 3) continue;
                const normPName = pNameStr.replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ\s]/gi, ' ').replace(/\s+/g, ' ');
                if (normPName && normFullText.includes(normPName)) return p;
            }

            // Keyword token match (if core keywords exist in title)
            for (const p of sortedProds) {
                const pNameStr = String(p.name || '').trim().toLowerCase();
                if (!pNameStr || pNameStr.length < 4) continue;
                const normPName = pNameStr.replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ\s]/gi, ' ');
                const tokens = normPName.split(/\s+/).filter(t => t.length >= 2);
                if (tokens.length >= 2) {
                    const allTokensMatch = tokens.every(tok => normFullText.includes(tok));
                    if (allTokensMatch) return p;
                }
            }

            return null;
        }, [products]);

        const cleanProductTitle = React.useCallback((rawStr) => {
            if (!rawStr) return 'SP Không tên';
            let str = String(rawStr).trim();
            // Clean marketing filler phrases from TikTok titles
            str = str.replace(/aquascape\s*thủy\s*sinh\s*đa\s*dạng\s*kích\s*thước\s*được\s*chế\s*tác\s*thủ\s*công/gi, '');
            str = str.replace(/chế\s*tác\s*thủ\s*công/gi, '');
            str = str.replace(/rf\s*aquarium/gi, '');
            str = str.replace(/thủy\s*sinh/gi, '');
            str = str.replace(/aquascape/gi, '');
            str = str.replace(/chính\s*hãng/gi, '');
            str = str.replace(/cao\s*cấp/gi, '');
            str = str.replace(/\|\s*\|/g, '|');
            str = str.replace(/\|\s*$/g, '');
            str = str.replace(/^\s*\|/g, '');
            str = str.replace(/[\s|]+-/g, ' -');
            str = str.replace(/-[\s|]+/g, '- ');
            str = str.replace(/\|/g, ' - ');
            str = str.replace(/\s+/g, ' ').trim();
            str = str.replace(/^-\s*|\s*-$/g, '').trim();
            return str || rawStr;
        }, []);

        const handleItemLink = (orderIdx, itemIdx, prodName) => {
            setPreview(prev => {
                const next = [...prev];
                const targetOrder = { ...next[orderIdx] };
                const targetItems = [...targetOrder.items];
                const matched = (products || []).find(p => p.name === prodName);
                targetItems[itemIdx] = {
                    ...targetItems[itemIdx],
                    name: prodName,
                    matchedProd: matched || null
                };
                targetOrder.items = targetItems;
                next[orderIdx] = targetOrder;
                return next;
            });
        };

        const handleDateChange = (orderIdx, newDate) => {
            setPreview(prev => {
                const next = [...prev];
                next[orderIdx] = { ...next[orderIdx], rawDate: newDate };
                return next;
            });
        };

        // RULE: Exact Match Status theo yêu cầu 
        const mapOrderStatusExact = (raw) => {
            if (!raw) return null;
            const s = String(raw).trim().toLowerCase();
            if (s === 'hoàn thành' || s === 'đã hoàn thành' || s === 'completed') return 'Đối Soát Thành Công';
            if (s === 'đã giao' || s === 'đã giao thành công' || s === 'delivered') return 'Đã Bàn Giao';
            if (s === 'hoàn trả' || s === 'trả hàng' || s === 'trả hàng/hoàn tiền' || s === 'trả hàng / hoàn tiền' || s === 'returned' || s === 'return/refund') return 'Hàng Hoàn';
            if (s === 'đã hủy' || s === 'đã huỷ' || s === 'cancelled' || s === 'canceled') return 'Đơn Huỷ';
            return null; // Mọi trạng thái khác (Default) => rơi xuống fallback
        };

        const processExcelData = (rows) => {
            if (rows.length < 2) { setPreview([]); return; }
            setIsProcessing(true); setProgress(0);
            let headerIdx = 0;
            for (let i = 0; i < Math.min(10, rows.length); i++) {
                const rowStr = (rows[i] || []).join(' ').toLowerCase();
                if (rowStr.includes('mã đơn hàng') || rowStr.includes('order id') || rowStr.includes('หมายเลขคำสั่งซื้อ')) { headerIdx = i; break; }
            }
            const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());
            const findCol = (keys) => {
                let idx = headers.findIndex(h => keys.some(k => String(h) === k));
                if (idx === -1) idx = headers.findIndex(h => keys.some(k => String(h).includes(k)));
                return idx;
            };
            let detectedChannel = 'Shopee VN';
            const hStr = headers.join(' ');
            if (hStr.includes('id người dùng') || hStr.includes('tiktok') || hStr.includes('buyer username')) detectedChannel = 'Tiktok Shop';
            else if (hStr.includes('หมายเลขคำสั่งซื้อ')) detectedChannel = 'Shopee TH';
            else if (hStr.includes('username (buyer)') || hStr.includes('tracking number')) detectedChannel = 'Shopee VN';

            let iCode = findCol(['mã đơn hàng', 'order id', 'หมายเลขคำสั่งซื้อ']);
            let iTrack = findCol(['mã vận đơn', 'tracking number', 'tracking id', 'หมายเลขติดตามพัสดุ']);
            let iProd = findCol(['tên sản phẩm', 'product name', 'ชื่อสินค้า']);
            let iVar = findCol(['tên phân loại', 'variation name', 'variation', 'tên mẫu mã', 'tên biến thể', 'tên sku', 'sku name', 'thông tin phân loại', 'phân loại', 'ชื่อตัวเลือกสินค้า']);
            let iQty = findCol(['số lượng', 'quantity', 'จำนวน']);
            let iBuyer = findCol(['người mua', 'tên đăng nhập', 'username (buyer)', 'buyer username', 'id người dùng', 'tên người dùng', 'user id', 'buyer id', 'ชื่อผู้ใช้', 'ชื่อผู้ใช้(ผู้ซื้อ)']);
            let iRecipient = findCol(['người nhận', 'recipient name', 'tên người nhận', 'ชื่อผู้รับ']);
            let iRevenue = findCol(['tổng số tiền người mua thanh toán', 'người mua thanh toán', 'buyer paid', 'doanh thu', 'tổng doanh thu', 'total paid', 'deal price', 'giá bán deal', 'giá sản phẩm', 'ยอดเงินที่ผู้ซื้อจ่าย']);
            let iSku = findCol(['mã sku người bán', 'sku người bán', 'seller sku', 'mã sku phân loại', 'sku phân loại', 'mã sku', 'seller_sku', 'sku reference no.', 'เลข sku อ้างอิง']);
            let iShipping = findCol(['shipping option', 'vận chuyển', 'đơn vị vận chuyển', 'ตัวเลือกการจัดส่ง']);
            let iDate = findCol(['ngày đặt hàng', 'thời gian tạo đơn', 'thời gian đặt hàng', 'order creation date', 'ngày tạo đơn', 'เวลาที่ทำการสั่งซื้อ']);
            let iFeeFixed = findCol(['phí cố định', 'ค่าธรรมเนียมคอมมิชชัน']);
            let iFeeService = findCol(['phí dịch vụ', 'ค่าบริการ', 'ค่าธรรมเนียมการขาย']);
            let iFeePayment = findCol(['phí thanh toán', 'phí giao dịch', 'ค่าธรรมเนียมการทำธุรกรรม']);
            let iFeeAffiliate = findCol(['phí hoa hồng tiếp thị', 'phí tiếp thị liên kết', 'ค่าคอมมิชชั่นพันธมิตร']);
            let iShopVoucher = findCol(['voucher của shop', 'khuyến mãi của shop', 'โค้ดส่วนลดจากร้านค้า']);
            let iStatus = findCol(['trạng thái đơn hàng', 'order status', 'status', 'สถานะการสั่งซื้อ']); // Lấy duy nhất cột trạng thái chính để tránh rác chuỗi
            const existingOrdersMap = new Map();
            (existingOrders || []).forEach(o => {
                const baseCode = (o.orderCode || '').split(' | MVĐ: ')[0].trim().toLowerCase();
                if (baseCode) {
                    existingOrdersMap.set(baseCode, o);
                }
            });
            const orderMap = {};
            const totalRows = rows.length; const BATCH_SIZE = 300; let currentIndex = headerIdx + 1;

            const processBatch = () => {
                const endIndex = Math.min(currentIndex + BATCH_SIZE, totalRows);
                for (let i = currentIndex; i < endIndex; i++) {
                    const cols = rows[i];
                    if (iCode < 0 || !cols[iCode]) continue;
                    const oCode = String(cols[iCode]).trim();
                    if (!oCode || oCode.toLowerCase().includes('mã đơn') || oCode.toLowerCase().includes('platform unique')) continue;
                    const tCode = (iTrack >= 0 && cols[iTrack]) ? String(cols[iTrack]).trim() : '';
                    const finalOrderCode = tCode ? `${oCode} | MVĐ: ${tCode}` : oCode;
                    const targetSku = (iSku >= 0 && cols[iSku]) ? String(cols[iSku]).trim().toLowerCase() : '';

                    let customerName = 'Khách';
                    if (iBuyer >= 0 && cols[iBuyer]) {
                        customerName = String(cols[iBuyer]).trim();
                    } else if (iRecipient >= 0 && cols[iRecipient]) {
                        customerName = String(cols[iRecipient]).trim();
                    }

                    let rowRevenue = 0;
                    if (iRevenue >= 0 && cols[iRevenue]) {
                        let cleanVal = String(cols[iRevenue]).replace(/[^0-9.-]/g, '');
                        rowRevenue = parseFloat(cleanVal) || 0;
                    }
                    let rowFeeFixed = (iFeeFixed >= 0 && cols[iFeeFixed]) ? Math.abs(parseFloat(String(cols[iFeeFixed]).replace(/[^0-9.-]/g, '')) || 0) : 0;
                    let rowFeeService = (iFeeService >= 0 && cols[iFeeService]) ? Math.abs(parseFloat(String(cols[iFeeService]).replace(/[^0-9.-]/g, '')) || 0) : 0;
                    let rowFeePayment = (iFeePayment >= 0 && cols[iFeePayment]) ? Math.abs(parseFloat(String(cols[iFeePayment]).replace(/[^0-9.-]/g, '')) || 0) : 0;
                    let rowFeeAffiliate = (iFeeAffiliate >= 0 && cols[iFeeAffiliate]) ? Math.abs(parseFloat(String(cols[iFeeAffiliate]).replace(/[^0-9.-]/g, '')) || 0) : 0;
                    let rowShopVoucher = (iShopVoucher >= 0 && cols[iShopVoucher]) ? Math.abs(parseFloat(String(cols[iShopVoucher]).replace(/[^0-9.-]/g, '')) || 0) : 0;

                    let rawStatus = (iStatus >= 0 && cols[iStatus]) ? String(cols[iStatus]).trim() : '';

                    let rowChannel = detectedChannel;
                    if (iShipping >= 0 && cols[iShipping]) {
                        const shipOpt = String(cols[iShipping]).toUpperCase();
                        if (shipOpt.includes('VNMY') || shipOpt.includes('MALAYSIA')) rowChannel = 'Shopee MY';
                        else if (shipOpt.includes('VNSG') || shipOpt.includes('SINGAPORE')) rowChannel = 'Shopee SG';
                        else if (shipOpt.includes('VNTH') || shipOpt.includes('THAILAND')) rowChannel = 'Shopee TH';
                        else if (shipOpt.includes('VNPH') || shipOpt.includes('PHILIPPINES')) rowChannel = 'Shopee PH';
                        else if (shipOpt.includes('INTERNATIONAL') || shipOpt.includes('QUỐC TẾ')) rowChannel = 'Shopee Quốc Tế';
                    }
                    if (oCode.endsWith('MY4') || oCode.endsWith('MY5')) rowChannel = 'Shopee MY';
                    if (oCode.endsWith('SG4') || oCode.endsWith('SG5')) rowChannel = 'Shopee SG';
                    if (oCode.endsWith('TH4') || oCode.endsWith('TH5')) rowChannel = 'Shopee TH';

                    if (rowChannel === 'Shopee TH') {
                        const THB_RATE = 715;
                        rowRevenue *= THB_RATE;
                        rowFeeFixed *= THB_RATE;
                        rowFeeService *= THB_RATE;
                        rowFeePayment *= THB_RATE;
                        rowFeeAffiliate *= THB_RATE;
                        rowShopVoucher *= THB_RATE;
                        
                        let lowerStatus = rawStatus.toLowerCase();
                        if (lowerStatus.includes('สำเร็จแล้ว')) rawStatus = 'Hoàn thành';
                        else if (lowerStatus.includes('จัดส่งแล้ว') || lowerStatus.includes('ได้รับสินค้าแล้ว')) rawStatus = 'Đã giao';
                        else if (lowerStatus.includes('คืนเงิน') || lowerStatus.includes('คืนสินค้า')) rawStatus = 'Trả hàng/Hoàn tiền';
                        else if (lowerStatus.includes('ยกเลิกแล้ว')) rawStatus = 'Đã hủy';
                    }

                    if (!orderMap[oCode]) {
                        orderMap[oCode] = {
                            orderCode: finalOrderCode,
                            channel: rowChannel,
                            customer: customerName,
                            isDuplicate: false,
                            isUpdate: false,
                            existingId: null,
                            revenue: rowRevenue,
                            feeFixed: rowFeeFixed,
                            feeService: rowFeeService,
                            feePayment: rowFeePayment,
                            feeAffiliate: rowFeeAffiliate,
                            shopVoucher: rowShopVoucher,
                            rawStatus: rawStatus,
                            rawDate: (iDate >= 0 && cols[iDate]) ? String(cols[iDate]).trim() : '',
                            items: []
                        };
                    } else {
                        if (orderMap[oCode].customer === 'Khách' && customerName !== 'Khách') {
                            orderMap[oCode].customer = customerName;
                        }
                        if (!orderMap[oCode].orderCode.includes(' | MVĐ: ') && finalOrderCode.includes(' | MVĐ: ')) {
                            orderMap[oCode].orderCode = finalOrderCode;
                        }
                        // [REMOVED] Không cộng dồn rawStatus để Exact Match luôn chính xác với dòng đầu tiên của sản phẩm
                        const isItemLevel = ['đơn giá', 'deal price', 'giá bán deal', 'giá bán', 'original price'].some(k => headers[iRevenue] && headers[iRevenue].includes(k));
                        if (isItemLevel) {
                            orderMap[oCode].revenue += rowRevenue;
                            orderMap[oCode].feeFixed += rowFeeFixed;
                            orderMap[oCode].feeService += rowFeeService;
                            orderMap[oCode].feePayment += rowFeePayment;
                            orderMap[oCode].feeAffiliate += rowFeeAffiliate;
                            orderMap[oCode].shopVoucher += rowShopVoucher;
                        } else {
                            orderMap[oCode].revenue = Math.max(orderMap[oCode].revenue || 0, rowRevenue);
                            orderMap[oCode].feeFixed = Math.max(orderMap[oCode].feeFixed || 0, rowFeeFixed);
                            orderMap[oCode].feeService = Math.max(orderMap[oCode].feeService || 0, rowFeeService);
                            orderMap[oCode].feePayment = Math.max(orderMap[oCode].feePayment || 0, rowFeePayment);
                            orderMap[oCode].feeAffiliate = Math.max(orderMap[oCode].feeAffiliate || 0, rowFeeAffiliate);
                            orderMap[oCode].shopVoucher = Math.max(orderMap[oCode].shopVoucher || 0, rowShopVoucher);
                        }
                    }

                    let pName = iProd >= 0 && cols[iProd] ? String(cols[iProd]) : 'SP Không tên';
                    let pVar = iVar >= 0 && cols[iVar] ? String(cols[iVar]) : '';
                    let rawFullName = pName + (pVar ? ' - ' + pVar : '');
                    let matchedProd = matchProductFromCatalog(targetSku, rawFullName, pName, pVar);

                    let finalProdName = matchedProd ? matchedProd.name : cleanProductTitle(rawFullName);
                    let qty = (iQty >= 0 && parseInt(cols[iQty])) ? parseInt(cols[iQty]) : 1;

                    // KIỂM TRA TRÙNG LẶP & CỘNG DỒN SỐ LƯỢNG
                    const existingItemIndex = orderMap[oCode].items.findIndex(item => item.name === finalProdName);
                    if (existingItemIndex !== -1) {
                        // Nếu đã có hàng hóa này trong đơn, chỉ cần cộng dồn số lượng
                        orderMap[oCode].items[existingItemIndex].qty += qty;
                    } else {
                        // Nếu chưa có, đẩy thành một dòng mới
                        orderMap[oCode].items.push({ name: finalProdName, qty, sku: targetSku, matchedProd });
                    }
                }

                currentIndex = endIndex;
                setProgress(Math.min(Math.floor(((currentIndex - headerIdx - 1) / (totalRows - headerIdx - 1)) * 100), 100));
                if (currentIndex < totalRows) { setTimeout(processBatch, 10); }
                else {
                    const result = Object.values(orderMap).map(o => {
                        const parts = o.orderCode.split(' | MVĐ: ');
                        const baseCode = parts[0].trim();
                        const tCode = parts.length > 1 ? parts[1].trim() : '';

                        const existing = existingOrdersMap.get(baseCode.toLowerCase());
                        if (existing) {
                            const existingTrack = (existing.orderCode || '').split(' | MVĐ: ')[1] || '';
                            const existingCustomer = existing.customer || '';
                            const existingRevenue = Number(existing.revenue || 0);

                            const hasNewTrack = tCode && !existingTrack;
                            const hasNewCustomer = (o.customer && o.customer !== 'Khách') && (!existingCustomer || existingCustomer === 'Khách');
                            const hasNewRevenue = o.revenue > 0 && existingRevenue === 0;

                            const existingFeeFixed = Number(existing.feeFixed || 0);
                            const existingFeeService = Number(existing.feeService || 0);
                            const existingFeePayment = Number(existing.feePayment || 0);
                            const existingFeeAffiliate = Number(existing.feeAffiliate || 0);
                            const existingShopVoucher = Number(existing.shopVoucher || 0);
                            const hasNewFees = (o.feeFixed !== 0 && o.feeFixed !== existingFeeFixed) ||
                                               (o.feeService !== 0 && o.feeService !== existingFeeService) ||
                                               (o.feePayment !== 0 && o.feePayment !== existingFeePayment) ||
                                               (o.feeAffiliate !== 0 && o.feeAffiliate !== existingFeeAffiliate) ||
                                               (o.shopVoucher !== 0 && o.shopVoucher !== existingShopVoucher) || 
                                               (o.revenue !== existingRevenue);

                            const mappedStatus = mapOrderStatusExact(o.rawStatus);
                            // Cập nhật trạng thái nếu file import có trạng thái dứt điểm khác với trạng thái cũ
                            const hasNewStatus = mappedStatus !== null && existing.status !== mappedStatus;
                            o.mappedStatus = mappedStatus; // Truyền xuống function submit

                            if (hasNewTrack || hasNewCustomer || hasNewRevenue || hasNewStatus || hasNewFees) {
                                return {
                                    ...o,
                                    isDuplicate: false,
                                    isUpdate: true,
                                    existingId: existing.id,
                                    existingRecord: existing
                                };
                            } else {
                                return {
                                    ...o,
                                    isDuplicate: true,
                                    isUpdate: false,
                                    existingId: existing.id
                                };
                            }
                        }
                        return {
                            ...o,
                            isDuplicate: false,
                            isUpdate: false
                        };
                    });
                    setPreview(result.slice(0, 150)); setIsProcessing(false); setProgress(100);
                    if (result.length > 150) setTimeout(() => { alert(`File có ${result.length} đơn. Hệ thống hiển thị 150 đơn đầu tiên để tránh đơ. Toàn bộ vẫn được xử lý khi bấm CHỐT.`); }, 300);
                }
            };
            setTimeout(processBatch, 50);
        };

        // ĐÃ SỬA THÀNH ArrayBuffer CHỐNG CRASH
        const handleFileUpload = (file) => {
            if (!file) return;
            setFileName(file.name); setIsProcessing(true); setProgress(0); setPreview([]);
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });

                    let sheetName = wb.SheetNames.find(s => s.toLowerCase().trim() === 'orders');
                    if (!sheetName) sheetName = wb.SheetNames[0];

                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
                    processExcelData(rows);
                } catch (error) {
                    alert("Lỗi đọc file Excel! Vui lòng đảm bảo file chuẩn.");
                    setFileName(''); setIsProcessing(false);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        // LƯU Ý: Phải luôn có từ khóa "async" ở đây
        const submit = async () => {
            const validOrders = preview.filter(p => !p.isDuplicate);
            if (validOrders.length === 0) return alert('Không có đơn hàng MỚI nào để chốt!');

            setIsSubmitting(true);
            const activeUser = localStorage.getItem('rf_user') || 'Hệ thống';
            try {
                let newOrders = [];
                let newProdItems = [];
                let d = new Date(); d.setDate(d.getDate() + 2); d.setHours(12, 0, 0, 0);
                const defaultDeadline = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

                // Tạo bộ đếm tồn kho ảo tạm thời cho toàn bộ lượt import
                let importStockMap = {};

                validOrders.forEach((o, oIdx) => {
                    let calculatedStatus = o.mappedStatus || mapOrderStatusExact(o.rawStatus);

                    let targetOrderId = o.isUpdate ? o.existingId : ('ORD_' + Date.now() + '_' + oIdx);
                    let accessories = [];
                    let orderStatus = calculatedStatus || (o.isUpdate ? (o.existingRecord.status || 'Chờ Sản Xuất') : 'Sẵn sàng đóng gói');
                    let orderHasProductionNeeded = o.isUpdate ? (o.existingRecord.hasProduction !== undefined ? o.existingRecord.hasProduction : true) : false;

                    const hasExistingProds = o.isUpdate && existingProdItems && existingProdItems.some(p => {
                        if (!p.orderId) return false;
                        const pOrd = String(p.orderId).trim();
                        if (pOrd === targetOrderId) return true;
                        if (pOrd.startsWith(targetOrderId + '_')) return true;
                        const parts = pOrd.split('|').map(x => x.trim());
                        return parts.includes(targetOrderId) || parts.some(part => part.startsWith(targetOrderId + '_'));
                    });

                    // Nếu là đơn mới, hoặc đơn cập nhật nhưng chưa có sản phẩm
                    if (!o.isUpdate || !hasExistingProds) {
                        if (o.isUpdate) {
                            // Nếu cập nhật mà chưa có sản phẩm, reset flag để tính toán lại
                            orderHasProductionNeeded = false;
                        }

                        o.items.forEach((item, itemIdx) => {
                            let matchedItem = item.matchedProd || (products || []).find(p => p.name === item.name);
                            let realStockQty = matchedItem ? Number(matchedItem.quantity || 0) : 0;
                            let itemCat = 'KHÁC';
                            if (matchedItem) {
                                itemCat = String(matchedItem.category || '').toUpperCase();
                            } else {
                                const lname = String(item.name || '').toLowerCase();
                                if (lname.includes('phụ kiện') || lname.includes('cát') || lname.includes('đèn') || lname.includes('bơm') || lname.includes('sạn') || lname.includes('suối')) {
                                    itemCat = 'PHỤ KIỆN';
                                } else if (lname.includes('bể') || lname.includes('kính') || lname.includes('terarium')) {
                                    itemCat = 'BỂ KÍNH';
                                } else if (lname.includes('layout') || lname.includes('nhất trụ') || lname.includes('rễ rừng') || lname.includes('vách suối') || lname.includes('hẻm núi') || lname.includes('bonsai') || lname.includes('đảo bay') || lname.includes('hang động')) {
                                    itemCat = 'LAYOUT';
                                }
                            }

                            if (itemCat === 'PHỤ KIỆN') {
                                accessories.push({ name: item.name, quantity: item.qty, price: 0 });
                            } else {
                                if (calculatedStatus) return; // skip production ticket

                                const orderQty = Number(item.qty || 1);
                                const isGlass = itemCat === 'BỂ KÍNH';
                                const workerPhases = isGlass ?
                                    { phase1: { name: 'Cắt Dán', status: 'Pending' }, phase2: { name: 'Gọt Keo', status: 'Pending' } } :
                                    { phase1: { name: 'Dựng Khung', status: 'Pending' }, phase2: { name: 'Gia Cố', status: 'Pending' } };

                                let currentAvailable = importStockMap[item.name] !== undefined ? importStockMap[item.name] : realStockQty;

                                for (let q = 0; q < orderQty; q++) {
                                    const prodId = 'PROD_' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + oIdx + '_' + itemIdx + '_' + q;

                                    if (currentAvailable > 0) {
                                        newProdItems.push({
                                            id: prodId, orderId: targetOrderId,
                                            type: isGlass ? 'Bể Kính' : 'Layout',
                                            name: item.name,
                                            note: `Có sẵn ở kho (Đã tự động tạo lệnh bù kho)`,
                                            status: 'Pending', fulfilledFromStock: true,
                                            phases: workerPhases,
                                            deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : defaultDeadline
                                        });
                                        currentAvailable--;
                                    } else {
                                        orderHasProductionNeeded = true;
                                        newProdItems.push({
                                            id: prodId, orderId: targetOrderId,
                                            type: isGlass ? 'Bể Kính' : 'Layout',
                                            name: item.name,
                                            note: `Sản xuất mới cho đơn ${o.orderCode || ''} (Cái ${q + 1}/${orderQty})`,
                                            status: 'Pending', fulfilledFromStock: false,
                                            phases: workerPhases,
                                            deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline(o.channel) : defaultDeadline
                                        });
                                    }
                                }
                                importStockMap[item.name] = currentAvailable;
                            }
                        });

                        if (!calculatedStatus && orderHasProductionNeeded && !o.isUpdate) {
                            orderStatus = 'Chờ Sản Xuất';
                        }
                    }

                    if (o.isUpdate && o.existingRecord) {
                        let mergedAccessories = accessories;
                        if (o.existingRecord.accessories) {
                            try {
                                const oldAcc = JSON.parse(o.existingRecord.accessories);
                                if (Array.isArray(oldAcc)) {
                                    mergedAccessories = [...oldAcc, ...accessories];
                                } else if (typeof o.existingRecord.accessories === 'string') {
                                    mergedAccessories = o.existingRecord.accessories; // Fallback string
                                }
                            } catch (e) {
                                mergedAccessories = o.existingRecord.accessories;
                            }
                        }
                        
                        const finalHasProduction = orderHasProductionNeeded || newProdItems.some(p => p.orderId === targetOrderId);

                        newOrders.push({
                            id: targetOrderId,
                            orderCode: o.orderCode,
                            channel: o.channel,
                            customer: (o.customer && o.customer !== 'Khách') ? o.customer : (o.existingRecord.customer || 'Khách'),
                            createdAt: o.existingRecord.createdAt || safeDateFull,
                            deadline: o.existingRecord.deadline || defaultDeadline,
                            date: o.existingRecord.date || safeDateFull.split(' ')[0],
                            status: calculatedStatus || o.existingRecord.status || 'Chờ Sản Xuất',
                            accessories: typeof mergedAccessories === 'string' ? mergedAccessories : JSON.stringify(mergedAccessories),
                            hasProduction: finalHasProduction,
                            updatedBy: activeUser,
                            revenue: Number(o.revenue || 0) > 0 ? Number(o.revenue) : Number(o.existingRecord.revenue || 0),
                            feeFixed: o.feeFixed || o.existingRecord.feeFixed || 0,
                            feeService: o.feeService || o.existingRecord.feeService || 0,
                            feePayment: o.feePayment || o.existingRecord.feePayment || 0,
                            feeAffiliate: o.feeAffiliate || o.existingRecord.feeAffiliate || 0,
                            shopVoucher: o.shopVoucher || o.existingRecord.shopVoucher || 0
                        });
                    } else {
                        const orderDateFormatted = o.rawDate ? (o.rawDate.includes(' ') || o.rawDate.includes('T') ? o.rawDate.replace('T', ' ') : o.rawDate + ' 12:00') : safeDateFull;
                        const dateOnly = orderDateFormatted.split(' ')[0];
                        const hasProdItems = newProdItems.some(p => p.orderId === targetOrderId);

                        newOrders.push({
                            id: targetOrderId, orderCode: o.orderCode, channel: o.channel, customer: o.customer,
                            createdAt: orderDateFormatted, deadline: defaultDeadline, date: dateOnly,
                            status: orderStatus, accessories: JSON.stringify(accessories),
                            hasProduction: hasProdItems, updatedBy: activeUser,
                            revenue: Number(o.revenue || 0),
                            feeFixed: o.feeFixed || 0,
                            feeService: o.feeService || 0,
                            feePayment: o.feePayment || 0,
                            feeAffiliate: o.feeAffiliate || 0,
                            shopVoucher: o.shopVoucher || 0
                        });
                    }
                });

                const updateCount = newOrders.filter(o => {
                    const matchingO = validOrders.find(v => v.existingId === o.id);
                    return matchingO && matchingO.isUpdate;
                }).length;
                const newCount = newOrders.length - updateCount;
                let msg = '';
                if (newCount > 0 && updateCount > 0) {
                    msg = `Đã bơm ${newCount} đơn mới, cập nhật ${updateCount} đơn & kích hoạt ${newProdItems.length} lệnh xưởng!`;
                } else if (newCount > 0) {
                    msg = `Đã bơm ${newCount} đơn mới & kích hoạt ${newProdItems.length} lệnh xưởng!`;
                } else {
                    msg = `Đã cập nhật thông tin cho ${updateCount} đơn hàng!`;
                }

                await pushDeltas({ orders: newOrders, prodItems: newProdItems }, msg, 'fa-rocket');
                setIsSubmitting(false);
                onClose();
            } catch (e) {
                alert('Lỗi khi bơm đơn: ' + e.message);
                setIsSubmitting(false);
            }
        };
        const validCount = preview.filter(p => !p.isDuplicate).length;

        return (
            <div className="fixed inset-0 bg-black/80 z-[110] flex items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm">
                <div className="bg-[#141414] border border-[#333] w-full max-w-lg h-[88vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl flex flex-col shadow-2xl overflow-hidden">
                    <div className="p-4 border-b border-[#222] bg-[#1a1a1a] flex justify-between items-center">
                        <h2 className="font-black text-lg text-[#3b82f6] tracking-wide"><i className="fas fa-file-excel mr-2"></i>TRẠM BƠM ĐƠN</h2>
                        <button onClick={onClose} disabled={isSubmitting || isProcessing} className="w-8 h-8 bg-[#222] rounded-full text-gray-400 hover:text-rose-500 flex items-center justify-center disabled:opacity-50 transition-colors"><i className="fas fa-times"></i></button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                        <div className="bg-[#0a0a0a] text-[#888] p-3 rounded-xl border border-[#222] text-[11px] font-bold shadow-sm flex items-center">
                            <i className="fas fa-brain mr-2 text-[#3b82f6] text-lg"></i>
                            <span>Hệ thống tự động quét kho: Đủ hàng ➔ <b>Bù kho</b> | Thiếu hàng ➔ <b>Chờ Sản Xuất</b>.</span>
                        </div>

                        <div onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }} onDragLeave={(e) => { e.preventDefault(); setIsDragging(false); }} onDrop={(e) => {
                            e.preventDefault();
                            setIsDragging(false); if (e.dataTransfer.files.length > 0) handleFileUpload(e.dataTransfer.files[0]);
                        }} className={`relative w-full h-32 flex flex-col items-center justify-center border-2 border-dashed rounded-2xl transition-all ${isDragging ?
                            'border-[#3b82f6] bg-[#3b82f6]/10' : 'border-[#333] bg-[#0a0a0a]'}`}>
                            <input type="file" accept=".xlsx, .xls, .csv" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onChange={(e) => handleFileUpload(e.target.files[0])} />
                            <div className="group-hover:-translate-y-1 transition-transform text-center">
                                <i className={`fas ${fileName ? 'fa-file-excel text-[#10b981]' : 'fa-cloud-upload-alt text-[#3b82f6]'} text-4xl mb-3 drop-shadow-md`}></i>
                                <div className="text-[13px] font-bold text-[#f5f5f5] mb-1">{fileName ? fileName : 'Chạm để chọn file Excel / CSV'}</div>
                                <div className="text-[10px] text-gray-500 font-medium">Hỗ trợ mọi định dạng xuất từ Shopee/Tiktok</div>
                            </div>
                        </div>

                        {isProcessing && (
                            <div className="bg-[#0a0a0a] border border-[#333] p-3 rounded-xl">
                                <div className="flex justify-between text-[11px] font-bold mb-1.5 text-gray-400"><span>Đang phân tích và quét kho...</span><span className="text-[#3b82f6]">{progress}%</span></div>
                                <div className="w-full bg-[#222] rounded-full h-2 overflow-hidden border border-[#333]"><div className="bg-[#3b82f6] h-2 rounded-full transition-all" style={{ width: `${progress}%` }}></div></div>
                            </div>
                        )}

                        {preview.length > 0 && !isProcessing && (
                            <div className="space-y-2 max-h-[42vh] overflow-y-auto custom-scrollbar pr-1">
                                {preview.map((p, idx) => (
                                    <div key={idx} className={`p-3 rounded-xl border transition-all ${p.isDuplicate ? 'bg-[#4c0519]/40 border-rose-500/30' :
                                            p.isUpdate ? 'bg-amber-500/10 border-amber-500/30 border-l-4 border-l-amber-500' :
                                                'bg-[#0a0a0a] border-[#222] border-l-4 border-l-[#3b82f6]'
                                        }`}>
                                        <div className="flex justify-between items-center mb-1">
                                            <div className={`font-black text-[12px] ${p.isDuplicate ? 'text-rose-400 line-through opacity-70' : 'text-[#f5f5f5]'}`}>{p.orderCode} <span className="text-[9px] text-[#3b82f6] bg-[#3b82f6]/10 px-1.5 py-0.5 rounded ml-1">{p.channel}</span></div>
                                            {p.isDuplicate && <span className="text-[9px] font-black bg-rose-500/20 text-rose-500 px-2 py-0.5 rounded border border-rose-500/30">ĐÃ BƠM</span>}
                                            {p.isUpdate && <span className="text-[9px] font-black bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30">CẬP NHẬT</span>}
                                        </div>
                                        <div className="flex justify-between items-center text-[9px] text-gray-500 font-bold mb-2 gap-2 flex-wrap bg-[#111] p-1.5 rounded-lg border border-[#222]">
                                            <span>Khách: <span className="text-[#3b82f6]">{p.customer}</span></span>
                                            <span className="flex items-center gap-1">
                                                <i className="far fa-calendar-alt text-[#3b82f6]"></i> Ngày đơn:
                                                <input
                                                    type="date"
                                                    className="bg-[#1a1a1a] text-gray-200 border border-[#333] rounded px-1.5 py-0.5 text-[10px] focus:border-[#3b82f6] outline-none"
                                                    value={p.rawDate ? p.rawDate.slice(0, 10) : safeDateFull.slice(0, 10)}
                                                    onChange={(e) => handleDateChange(idx, e.target.value)}
                                                />
                                            </span>
                                            <span>Doanh thu: <span className="text-emerald-500">{Number(p.revenue || 0).toLocaleString('vi-VN')}đ</span></span>
                                        </div>
                                        {p.items.map((it, i) => {
                                            const inStock = it.matchedProd ? Number(it.matchedProd.quantity) : 0;
                                            const isEnough = inStock >= Number(it.qty);
                                            const itemCat = it.matchedProd ? String(it.matchedProd.category || '').toUpperCase() : '';
                                            const isAcc = itemCat === 'PHỤ KIỆN';

                                            return (
                                                <div key={i} className="py-2 border-t border-[#222] space-y-1.5">
                                                    <div className="flex justify-between items-start text-[11px] font-bold">
                                                        <div className="flex flex-col flex-1 pr-2">
                                                            <span className="text-[#d4af37] leading-snug">{it.name}</span>
                                                            {!p.isDuplicate && (
                                                                <span className={`text-[9px] mt-0.5 ${p.isUpdate ? 'text-amber-400' : (isAcc ? 'text-gray-400' : (isEnough ? 'text-emerald-400' : 'text-orange-400'))}`}>
                                                                    {p.isUpdate ? '✓ Lệnh cũ được giữ nguyên (Chỉ cập nhật thông tin)' : (isAcc ? '✓ Phụ kiện (Chỉ gói kèm, không tạo lệnh)' : (isEnough ? '✓ Đủ hàng trong kho (Tự động bù kho)' : `⚠ Thiếu hàng (Kho: ${inStock} -> Lệnh sản xuất)`))}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <span className={`${p.isDuplicate ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-[#3b82f6] text-white'} text-[10px] font-black px-2 py-0.5 rounded-md shrink-0 ml-2`}>x{it.qty}</span>
                                                    </div>

                                                    {/* Bộ chọn liên kết sản phẩm kho trực tiếp ngay trên form */}
                                                    <div className="flex items-center gap-1.5 pt-0.5">
                                                        <span className="text-[9px] text-[#3b82f6] font-bold shrink-0 flex items-center gap-1">
                                                            <i className="fas fa-link text-[10px]"></i> Liên kết SP:
                                                        </span>
                                                        <select
                                                            className="bg-[#18181b] text-gray-200 text-[10px] font-medium border border-[#333] hover:border-[#3b82f6] focus:border-[#3b82f6] rounded-lg px-2 py-1 w-full outline-none transition-colors cursor-pointer"
                                                            value={it.matchedProd ? it.matchedProd.name : (it.name || '')}
                                                            onChange={(e) => handleItemLink(idx, i, e.target.value)}
                                                        >
                                                            <option value={it.name}>-- Tự động quét: {it.name} --</option>
                                                            <optgroup label="📦 DANH MỤC HÀNG HOÁ KHO ERP">
                                                                {(products || []).map(prod => (
                                                                    <option key={prod.id || prod.name} value={prod.name}>
                                                                        {prod.name} ({prod.category || 'Khác'} - Tồn: {prod.quantity || 0})
                                                                    </option>
                                                                ))}
                                                            </optgroup>
                                                        </select>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="p-4 bg-[#1a1a1a] border-t border-[#333] rounded-b-3xl sm:rounded-b-3xl flex gap-3">
                        <button onClick={onClose} disabled={isSubmitting || isProcessing} className="flex-1 py-3.5 bg-[#222] hover:bg-[#333] text-gray-300 font-black text-[12px] rounded-xl active:scale-95 transition-all disabled:opacity-50">HỦY TÁC VỤ</button>
                        <button onClick={submit} disabled={isSubmitting || isProcessing || validCount === 0} className={`flex-[2] py-3.5 text-white rounded-xl font-black text-[13px] tracking-wide shadow-md flex items-center justify-center gap-2 transition-all active:scale-95 ${isSubmitting || isProcessing || validCount === 0 ? 'bg-[#333] text-gray-500' : 'bg-[#3b82f6] hover:bg-[#2563eb]'}`}>
                            {isSubmitting ? <><i className="fas fa-spinner fa-spin"></i> ĐANG XỬ LÝ...</> : `CHỐT BƠM ${validCount} ĐƠN`}
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // ==========================================
    // 2. FORM TẠO ĐƠN THÔNG MINH - TÍCH HỢP AI QUÉT KHO & ĐƠN VỊ TÍNH
    // ==========================================
    function AddModal({ onClose, pushDeltas, products = [], erpData, triggerToast, editOrder = null, editProds = [], userConfigs, configGiaLayout = [], draftData = null, forceSXTOnly = false }) {
        const isEdit = !!editOrder;
        const currentUser = localStorage.getItem('rf_user') || 'Quản lý';
        const role = localStorage.getItem('rf_role');

                        let currentAvailable = virtualStockMap[p.name] !== undefined ? virtualStockMap[p.name] : realStockQty;
                        
                        let pNameStr = p.name ? String(p.name).toLowerCase() : '';
                        let subCatStr = (inStockItem && inStockItem.sub_category) ? String(inStockItem.sub_category).toUpperCase() : '';
                        let isCover = false;

                            isCover = true;
                        } else if (subCatStr === 'COVER') {
                            isCover = true;
                        }

                            // Đủ kho -> Lệnh Bù Kho
                            let newProd = Object.assign({}, p);
                            newProd.note = p.note;
                            newProd.fulfilledFromStock = true;
                            newProd.deadline = typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : deadline;
                            processedProds.push(newProd);
                            // Trừ lùi tồn kho ảo đi 1
                            virtualStockMap[p.name] = currentAvailable - 1;
                        } else {
                            // Hết kho HOẶC Hàng Cover -> Ép trạng thái đơn về Chờ Sản Xuất & Chuyển lệnh xuống xưởng
                            currentStatus = 'Chờ Sản Xuất';
                            let newProd = Object.assign({}, p);
                            newProd.deadline = deadline;
                            newProd.fulfilledFromStock = false;
                            processedProds.push(newProd);
                            if (isCover === false) {
                                virtualStockMap[p.name] = currentAvailable;
                            }
                        }
                    });
                } else {
                    currentStatus = editOrder ? editOrder.status : (isSXT || prods.length > 0 ? 'Chờ Sản Xuất' : 'Sẵn Sàng Đóng Gói');
                    processedProds = prods.map(p => ({ ...p, orderId, deadline }));

                    id: orderId, orderCode: finalOrderCode, channel, customer: customer || 'Khách', phone, address, note: finalNote,

                    deadline, createdAt: editOrder ? editOrder.createdAt : safeDate.replace('T', ' '), date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0],
                    status: currentStatus, accessories, hasProduction: prods.length > 0,

                    if (channel === 'Bán Lẻ' || channel === 'Bán Sỉ') {
                        codAmt = (Number(retailTotal) || 0) - (Number(prePaid) || 0);
                        const kpiAmt = (Number(retailTotal) || 0) * 0.05;
                        const beneficiary = responsibleUser || currentUser;
                        // Luôn gửi KPI (kể cả 0đ) cùng orderId để Code.js có thể update/reset KPI nếu Sửa Đơn
                        payload.BonusPenalty = [{ id: 'BP_KPI_' + orderId, user: beneficiary, amount: kpiAmt, type: 'Thưởng Bán Hàng', note: `Thưởng 5% đơn ${finalOrderCode} (Cập nhật bởi: ${currentUser})`, date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0], orderCode: finalOrderCode }];

                        if (Number(prePaid) >= 0 && receivingAccount) {
                            const selAcc = accountsData.find(a => {
                                const raw = a.accountName || a.name || '';
                                let cleanName = raw;
                                if (raw.includes('|')) {
                                    cleanName = raw.split('|')[0].trim();
                                }
                                return String(cleanName || '').toLowerCase().includes(receivingAccount.toLowerCase()) ||
                                    String(raw || '').toLowerCase().includes(receivingAccount.toLowerCase());
                            });
                            const targetAccId = selAcc ? selAcc.id : (accountsData[0] ? accountsData[0].id : 'ACC_COMPANY');

                            payload.Transactions = [{
                                id: 'TX_PRE_' + orderId,
                                type: 'Thu',
                                category: 'Doanh Thu Bán Hàng',
                                amount: Number(prePaid),
                                fromAccount: '',
                                toAccount: targetAccId,
                                title: `Khách cọc đơn ${finalOrderCode}`,
                                date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0],
                                note: billUrl ? `Có kèm Bill Cọc` : `Cập nhật từ hệ thống`
                            }];
                        }
                    }
                    else if (channel === 'Cộng Tác Viên') { codAmt = (Number(retailTotal) || 0) - (Number(retailDiscount) || 0); }
                    else if (channel === 'Bảo Hành & Thu Hồi' || channel === 'Bảo Hành') {
                        const totalBH = autoCostTotal + Number(additionalCost);
                        payloadOrder.costTotal = totalBH;
                        if (responsibleUser) payload.BonusPenalty = [{ id: 'BP_PEN_' + orderId, user: responsibleUser, amount: -totalBH, type: 'Phạt Bảo Hành', note: `Trừ phí bảo hành đơn ${finalOrderCode}`, date: (editOrder ? editOrder.createdAt : safeDate).split('T')[0], orderCode: finalOrderCode }];
                    }
                    payloadOrder.cod = codAmt;
                }

                    payload.deletes = { Production: deletedProds, prodItems: deletedProds };
                }

                let newItemsToPush = localProds.map(lp => { const { isNewLocal, ...cleanProd } = lp; return cleanProd; });
                if (newItemsToPush.length > 0) payload.Products = newItemsToPush;

                await pushDeltas(payload, isEdit ? 'Cập nhật thành công!' : 'Tạo đơn thành công!', 'fa-check');
