    // ==========================================
    // 3. COMPONENT THẺ ĐƠN HÀNG (ĐÃ CẬP NHẬT TÔ MÀU XANH KHI ĐẠT KCS)
    // ==========================================
    function OrderCardV2({
        attendance, order, prods, pack, erpProducts, erpData, isAdmin, currentUser, pushDeltas,
        prodItems, userConfigs, triggerToast, isSelected, onToggleSelect, kpiConfig, idx_num,
        handleCancelOrder, handleConfirmStockIn, openReturnModal, onEditOrder, filterStatus
    }) {
        const [optimisticOrder, setOptimisticOrder] = React.useState(null);
        const [optimisticPack, setOptimisticPack] = React.useState(null);
        const [sosTarget, setSosTarget] = React.useState(null);

        React.useEffect(() => { setOptimisticOrder(null); }, [order?.status, order?.isCarriedToWH, order?.id]);
        React.useEffect(() => { setOptimisticPack(null); }, [pack?.status, pack?.id, pack?.photo]);

        const _order = optimisticOrder || order;
        const _pack = optimisticPack || pack;

        const isBossRole = localStorage.getItem('rf_boss') === 'true';
        const currentRole = localStorage.getItem('rf_role') || '';
        const isCTV = currentRole === 'CTV';
        const isOwnOrder = _order.createdBy === currentUser || _order.sale === currentUser;
        const canEdit = isBossRole || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || currentRole === 'KẾ TOÁN' || currentRole === 'TỐI CAO' || (isCTV && isOwnOrder);
        const canCancel = isBossRole || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || currentRole === 'KẾ TOÁN' || currentRole === 'TỐI CAO';

        const [goodsFile, setGoodsFile] = React.useState(null);
        const [boxFile, setBoxFile] = React.useState(null);
        const [whFile, setWhFile] = React.useState(null);
        const [processing, setProcessing] = React.useState(false);
        const [checkedItems, setCheckedItems] = React.useState([]);
        const [isExpanded, setIsExpanded] = React.useState(false);
        const [showReconcile, setShowReconcile] = React.useState(false);
        const [showGHNModal, setShowGHNModal] = React.useState(false);
        const accountsData = erpData?.Accounts || [];
        const [recForm, setRecForm] = React.useState(() => {
            const fullCode = order?.orderCode || '';
            let mCode = fullCode;
            if (!order?.shippingCode) {
                if (fullCode.includes(' | MVĐ: ')) mCode = fullCode.split(' | MVĐ: ')[0];
                else if (fullCode.includes('|MVĐ:')) mCode = fullCode.split('|MVĐ:')[0];
            }
            const orderTxs = (erpData?.Transactions || erpData?.transactions || []).filter(tx => tx.type === 'Thu' && (String(tx.title || '').includes(mCode) || String(tx.note || '').includes(mCode) || String(tx.orderCode || '').includes(mCode)));
            const paidAmt = orderTxs.reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
            const total = Number(order?.cod || order?.revenue || 0);
            const remaining = Math.max(0, total - paidAmt);
            return {
                amount: remaining,
                accountId: (accountsData.find(a => (a.accountName || a.name) === 'Công Ty') || accountsData[0])?.id || '',
                createTx: remaining > 0
            };
        });

        const getProductInfo = (name) => {
            if (!name) return null;
            let match = (erpProducts || []).find(x => String(x.name).trim() === String(name).trim());
            if (!match && name.includes(' - ')) {
                const baseName = name.split(' - ')[0].trim().toLowerCase();
                match = (erpProducts || []).find(x => {
                    const xBase = String(x.name || '').split(' - ')[0].trim().toLowerCase();
                    return xBase === baseName;
                });
            }
            return match;
        };

        const accessories = React.useMemo(() => {
            let acc = _order.accessories;
            if (!acc) return [];
            try {
                if (typeof acc === 'string') {
                    acc = acc.trim();
                    if (acc.startsWith('[') || acc.startsWith('{')) {
                        acc = JSON.parse(acc);
                        if (typeof acc === 'string') acc = JSON.parse(acc);
                    } else if (acc.includes(',')) {
                        acc = acc.split(',').map(s => s.trim()).filter(Boolean);
                    } else if (acc.length > 0) {
                        acc = [acc];
                    }
                }
            } catch (e) {
                console.warn("Lỗi parse accessories:", e);
                return [];
            }
            if (!Array.isArray(acc)) return [];
            return acc.map((a, idx) => {
                if (typeof a === 'string') {
                    return { id: `acc_str_${_order.id}_${idx}`, name: a, quantity: 1, hasProduction: false };
                }
                if (typeof a === 'object' && a !== null && (a.name || a.Name)) {
                    return {
                        id: a.id || `acc_obj_${_order.id}_${idx}`,
                        name: a.name || a.Name || 'Không tên',
                        quantity: Number(a.quantity || a.Quantity || a.qty || 1),
                        hasProduction: Boolean(a.hasProduction)
                    };
                }
                return null;
            }).filter(Boolean);
        }, [_order.accessories, _order.id]);

        const fullOrderCode = _order.orderCode || '';
        let mainOrderCode = fullOrderCode; let shippingCode = _order.shippingCode || '';
        if (!_order.shippingCode) {
            if (fullOrderCode.includes(' | MVĐ: ')) { const parts = fullOrderCode.split(' | MVĐ: '); mainOrderCode = parts[0] || fullOrderCode; shippingCode = parts[1] || ''; }
            else if (fullOrderCode.includes('|MVĐ:')) { const parts = fullOrderCode.split('|MVĐ:'); mainOrderCode = parts[0] || fullOrderCode; shippingCode = parts[1] || ''; }
        }

        // BÓC TÁCH LINK ẢNH VÀ GHI CHÚ
        const parsedNote = React.useMemo(() => {
            if (!_order.note) return { text: '', images: [] };
            let text = _order.note; let images = [];
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const matchedUrls = text.match(urlRegex);
            if (matchedUrls) {
                images = matchedUrls;
                text = text.replace(/\|?\s*Link Bill Cọc:\s*(https?:\/\/[^\s]+)/g, '').trim();
                text = text.replace(urlRegex, '').trim();
            }
            text = text.replace(/^\|\s*/, '').trim();
            return { text, images };
        }, [_order.note]);

        const allProdsDone = React.useMemo(() => {
            if (!prods || prods.length === 0) return !_order.hasProduction;
            return prods.every(p => {
                const pStatus = String(p.status || '').toUpperCase().trim();
                return pStatus === 'DONE' || pStatus === 'ĐÃ XONG' || pStatus === 'HỦY/VỠ' || pStatus === 'HOÀN KHO ĐẠT' || p.fulfilledFromStock === true || String(p.fulfilledFromStock).toUpperCase() === 'TRUE';
            });
        }, [prods, _order.hasProduction]);

        const stockValid = React.useMemo(() => {
            if (!accessories || accessories.length === 0) return true;
            return accessories.every(a => {
                const prodMatch = (erpProducts || []).find(x => x.name === a.name);
                const needed = Number(a.quantity) || 1;
                return prodMatch && Number(prodMatch.quantity) >= needed;
            });
        }, [accessories, erpProducts]);

        const isGHNShipping = _order.shippingMethod === 'Gửi GHN';
        const isGuiXeShipping = _order.shippingMethod === 'Gửi Xe';
        const hasShippingCode = Boolean(shippingCode && String(shippingCode).trim());
        const shippingGatePassed = (!isGHNShipping && !isGuiXeShipping) || hasShippingCode;

        let effectiveStatus = _order._effectiveStatus || _order.status;
        const upperStatus = String(effectiveStatus || '').toUpperCase().trim();
        if (upperStatus === 'CHỜ SẢN XUẤT' || upperStatus === 'QUÉT TỰ ĐỘNG' || upperStatus === 'ĐANG SẢN XUẤT' || upperStatus === 'SẴN SÀNG ĐÓNG GÓI') {
            if (allProdsDone && shippingGatePassed) {
                effectiveStatus = 'Sẵn sàng đóng gói';
            } else {
                effectiveStatus = 'Chờ Sản Xuất';
            }
        }

        if (upperStatus === 'HÀNG HOÀN' || upperStatus === 'NHÓM HÀNG HOÀN CHỜ XỬ' || upperStatus === 'KIỂM HÀNG HOÀN') effectiveStatus = 'Kiểm hàng hoàn';
        const isReadyPack = effectiveStatus === 'Sẵn sàng đóng gói' || String(effectiveStatus).toUpperCase() === 'SẴN SÀNG ĐÓNG GÓI';
        const isPendingHandover = effectiveStatus === 'Chờ Bàn Giao' || String(effectiveStatus).toUpperCase() === 'CHỜ BÀN GIAO';
        const isDone = effectiveStatus === 'Đã Bàn Giao' || String(effectiveStatus).toUpperCase() === 'ĐÃ BÀN GIAO';
        const isCanceled = effectiveStatus === 'Đơn Huỷ' || String(effectiveStatus).toUpperCase() === 'ĐƠN HUỶ' || String(effectiveStatus).toUpperCase() === 'ĐƠN HỦY';
        const isReturn = effectiveStatus === 'Kiểm hàng hoàn' || upperStatus === 'HÀNG HOÀN' || upperStatus === 'KIỂM HÀNG HOÀN';
        const isBuKho = _order.channel === 'Sản Xuất Bù Kho' || _order.channel === 'Sản Xuất Tồn';
        const orderPacks = (erpData?.Packings || []).filter(p => p.orderId === _order.id);

        const optimisticPacks = [...orderPacks];
        if (_pack && !optimisticPacks.find(p => p.id === _pack.id)) optimisticPacks.push(_pack);

        const packRecord = optimisticPacks.find(p => p.status === 'Done' && (!p.note || !p.note.includes('kho'))) || null;
        const whRecord = optimisticPacks.find(p => p.status === 'Done' && p.note && p.note.includes('kho')) || null;

        const packPhotoStr = packRecord?.photo || '';
        let pGoods = ''; let pBox = '';
        if (packPhotoStr) {
            if (packPhotoStr.includes('||')) {
                const parts = packPhotoStr.split('||');
                pGoods = parts[0]; pBox = parts[1];
            } else { pBox = packPhotoStr; }
        }
        const whPhoto = whRecord?.photo;

        const thumbnailCount = [pGoods, pBox, whPhoto].filter(Boolean).length;
        const titlePadding = thumbnailCount === 3 ? 'pr-32' : (thumbnailCount === 2 ? 'pr-24' : 'pr-14');

        const p1Users = [...new Set(prods.map(p => p.phases?.phase1?.user).filter(Boolean))].map(u => u.split(' ').pop());
        const p2Users = [...new Set(prods.map(p => p.phases?.phase2?.user).filter(Boolean))].map(u => u.split(' ').pop());
        const packUser = packRecord?.user || packRecord?.updatedBy;
        const whUser = whRecord?.user || (typeof _order.isCarriedToWH === 'string' ? _order.isCarriedToWH : null);

        const currentPackingTask = optimisticPacks.find(p => p.status === 'Packing' && (!p.note || !p.note.includes('kho'))) || _pack;
        const isPacking = currentPackingTask?.status === 'Packing';
        const isPackOwner = currentPackingTask?.user === currentUser;

        const globalActivePacking = (erpData?.Packings || []).find(p => p.user === currentUser && p.status === 'Packing');
        const isPackingOtherOrder = globalActivePacking && globalActivePacking.orderId !== _order.id;

        const allItemsChecked = (prods.length + accessories.length) === 0 || checkedItems.length === (prods.length + accessories.length);
        const toggleCheckItem = (productId) => setCheckedItems(prev => prev.includes(productId) ? prev.filter(id => id !== productId) : [...prev, productId]);

        const getUnit = React.useCallback((itemName) => {
            const item = (erpProducts || []).find(x => x.name === itemName);
            return item?.unit ? ` ${item.unit}` : '';
        }, [erpProducts]);

        const handleQuickAdjustStock = async (e) => {
            e.stopPropagation();
            if (!window.confirm('Thao tác này sẽ cộng thẳng tồn kho ảo cho các mã bị âm để hệ thống không bị kẹt đóng gói. Khuyến nghị chỉ dùng trong trường hợp Kế toán chưa kịp nhập liệu.\n\nTiếp tục cộng kho?')) return;
            setProcessing(true);
            try {
                let productUpdates = [];
                let itemsData = [];
                accessories.forEach(a => {
                    const prodMatch = (erpProducts || []).find(x => x.name === a.name);
                    const needed = Number(a.quantity) || 1;
                    if (prodMatch && Number(prodMatch.quantity) < needed) {
                        productUpdates.push({ id: prodMatch.id, quantity: needed });
                        itemsData.push({ name: prodMatch.name, qty: needed, price: prodMatch.costPrice || 0 });
                    }
                });
                
                if (productUpdates.length > 0) {
                    let payload = {
                        Products: productUpdates,
                        ImportExport: [{ id: 'IE_QUICK_' + Date.now(), type: 'Nhập', target: 'Kho Tổng', totalAmount: 0, date: new Date().toISOString().replace('T', ' ').slice(0, 23), note: `Nhập kho khẩn cấp (Quick Adjust) - Đơn ${_order.orderCode}`, itemsData: JSON.stringify(itemsData) }]
                    };
                    await pushDeltas(payload, `Đã cộng bù tồn kho khẩn cấp!`, 'fa-check-circle');
                } else {
                    triggerToast('Không có mã nào cần cộng bù!', 'fa-info-circle', 'info');
                }
            } catch (err) {
                triggerToast('Lỗi cộng kho khẩn cấp!', 'fa-times', 'danger');
            }
            setProcessing(false);
        };

        const handleReturnOK = async (item, type) => {
            if (!window.confirm(`Xác nhận hàng đạt chuẩn và nhập lại kho: ${item.name}?`)) return;
            setProcessing(true);
            try {
                const erpP = (erpProducts || []).find(x => x.name === item.name) || {};
                let payload = {}; const qtyToAdd = type === 'acc' ? (Number(item.quantity) || 1) : 1;
                if (erpP && erpP.id) {
                    payload.Products = [{ id: erpP.id, quantity: Number(erpP.quantity) + qtyToAdd }];
                    payload.ImportExport = [{ id: 'IE_' + Date.now(), type: 'Nhập', target: 'Kho Tổng', totalAmount: 0, date: new Date().toISOString().replace('T', ' ').slice(0, 23), note: `Hoàn kho đạt KCS - Đơn ${_order.orderCode}`, itemsData: JSON.stringify([{ name: item.name, qty: qtyToAdd, price: erpP.costPrice || 0 }]) }];
                }
                if (type === 'acc') {
                    const newAccs = accessories.map(a => a.name === item.name ? { ...a, _retStatus: 'OK' } : a);
                    payload.orders = [{ ..._order, accessories: JSON.stringify(newAccs) }];
                    setOptimisticOrder({ ..._order, accessories: newAccs });
                } else {
                    payload.prodItems = [{ ...item, status: 'Hoàn Kho Đạt' }];
                }
                await pushDeltas(payload, `Đã nhập kho ${item.name}`, 'fa-check');
            } catch (e) { triggerToast('Lỗi!', 'fa-times', 'danger'); }
            setProcessing(false);
        };

        const handleAct = async (act) => {
            try {
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
                const safeDateOnly = safeDateFull.split('T')[0];
                const currentFullTime = safeDateFull.slice(0, 16).replace('T', ' ');

                const deductStock = () => {
                    const isLayoutOrGlass = (pName) => {
                        const match = (erpProducts || []).find(x => String(x.name).trim() === String(pName).trim());
                        const cat = String(match?.category || '').toUpperCase();
                        return cat === 'LAYOUT' || cat === 'BỂ KÍNH';
                    };

                    let changes = {};
                    accessories.forEach(a => { changes[a.name] = (changes[a.name] || 0) + (Number(a.quantity) || 1); });
                    prods.forEach(p => {
                        if (p.fulfilledFromStock === true || String(p.fulfilledFromStock).toUpperCase() === 'TRUE' || isLayoutOrGlass(p.name)) {
                            changes[p.name] = (changes[p.name] || 0) + 1;
                        }
                    });
                    let productUpdates = []; let stockLogs = []; let itemsData = [];
                    Object.keys(changes).forEach(name => {
                        let match = (erpProducts || []).find(p => p.name === name);
                        if (match) {
                            let qty = changes[name];
                            productUpdates.push({ id: match.id, quantity: Math.max(0, Number(match.quantity) - qty) });
                            itemsData.push({ name: name, qty: qty, price: match.costPrice || 0 });
                        }
                    });
                    if (productUpdates.length > 0) {
                        stockLogs.push({ id: 'IE_SHIP_' + Date.now(), type: 'Xuất', target: _order.channel, totalAmount: 0, date: new Date().toISOString().replace('T', ' ').slice(0, 23), note: `Xuất kho bàn giao - Đơn ${mainOrderCode}`, itemsData: JSON.stringify(itemsData) });
                        return { Products: productUpdates, ImportExport: stockLogs };
                    }
                    return {};
                };

                if (act === 'RETURN') {
                    if (!window.confirm(`Xác nhận chuyển đơn ${_order.orderCode} sang trạng thái HÀNG HOÀN?`)) return;
                    const newOrder = { ..._order, status: 'Hàng Hoàn' }; setOptimisticOrder(newOrder);
                    const dummyPack = { id: 'PK_D' + Date.now(), orderId: _order.id, user: currentUser, date: safeDateOnly, start: currentFullTime, status: 'Done', photo: 'DUMMY_RETURN_FIX' };
                    pushDeltas({ orders: [newOrder], packings: [dummyPack] }, 'Đã chuyển sang Hàng Hoàn!', 'fa-undo').catch(() => { });
                } else if (act === 'START') {
                    const hasActiveCheckin = (attendance || []).some(a =>
                        String(a.user).trim() === currentUser.trim() &&
                        a.timeIn && !a.timeOut
                    );
                    if (!hasActiveCheckin) {
                        triggerToast('Bạn phải Chấm Công vào ca trước khi bắt đầu Đóng Gói!', 'fa-exclamation-triangle', 'danger');
                        return;
                    }

                    const activePacking = (erpData?.Packings || []).find(p => p.user === currentUser && p.status === 'Packing');
                    if (activePacking) {
                        triggerToast(`Bạn đang đóng gói dở dang đơn hàng của mã ${activePacking.orderId}! Hãy hoàn thành trước khi nhận đơn mới.`, 'fa-box', 'danger');
                        return;
                    }

                    if (!goodsFile) { triggerToast('Cần chụp ảnh hàng hóa trước!', 'fa-camera', 'danger'); return; }
                    setProcessing(true); let gUrl = '';
                    try {
                        const b64 = typeof resizeImage === 'function' ? await resizeImage(goodsFile) : await new Promise((res, rej) => { const rd = new FileReader(); rd.onload = () => res(rd.result.split(',')[1]); rd.onerror = rej; rd.readAsDataURL(goodsFile); });
                        gUrl = await runGAS('uploadImage', b64, `PKG_${_order.id}.jpg`);
                        if (!gUrl) throw new Error("Không thể upload ảnh hàng hóa.");
                    } catch (e) { triggerToast('Lỗi upload ảnh hàng hóa!', 'fa-times', 'danger'); setProcessing(false); return; }

                    const newPack = { id: 'PK' + Date.now(), orderId: _order.id, user: currentUser, date: safeDateOnly, start: currentFullTime, status: 'Packing', photo: gUrl };
                    setOptimisticPack(newPack);
                    pushDeltas({ packings: [newPack] }, 'Đã bắt đầu tính giờ, hãy gói hàng!', 'fa-box').catch(() => { });
                    setProcessing(false);
                } else if (act === 'DONE') {
                    if (!boxFile) { triggerToast('Vui lòng chụp ảnh kiện hàng đã đóng kín!', 'fa-camera', 'danger'); return; }

                    let packReward = 1100;
                    const isInternational = /SG|MY|TH|PH|MA|TW|Quốc Tế|Xuất Khẩu/i.test((_order.channel || '') + ' ' + (_order.orderCode || ''));
                    let itemName = '';
                    const hasProductionItems = Array.isArray(prods) && prods.length > 0;
                    
                    if (hasProductionItems) {
                        itemName = String(prods[0]?.name || '').trim();
                    } else {
                        try {
                            if (typeof _order.products === 'string' && _order.products.startsWith('[')) {
                                const parsed = JSON.parse(_order.products);
                                if (parsed && parsed.length > 0) itemName = String(parsed[0].name || '').trim();
                            } else {
                                itemName = String(_order.products || '').trim();
                            }
                        } catch(e) {}
                    }
                    
                    try {
                        if (itemName.length > 0 && typeof getPackingReward === 'function') {
                            packReward = getPackingReward(itemName, kpiConfig, (_order.channel || '') + ' ' + (_order.orderCode || ''));
                        } else {
                            packReward = 1100 * (isInternational ? 3 : 1);
                        }
                    } catch(e) {
                        packReward = 1100 * (isInternational ? 3 : 1);
                    }

                    setProcessing(true); let bUrl = '';
                    try {
                        const b64 = typeof resizeImage === 'function' ? await resizeImage(boxFile) : await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(boxFile); });
                        bUrl = await runGAS('uploadImage', b64, `PKB_${_order.id}.jpg`);
                        if (!bUrl) throw new Error("Không thể upload ảnh kiện hàng.");
                    } catch (err) { triggerToast('Lỗi upload ảnh kiện hàng!', 'fa-times', 'danger'); setProcessing(false); return; }
                    setProcessing(false);

                    const existingPhoto = currentPackingTask?.photo || '';
                    const finalPhotoStr = existingPhoto ? `${existingPhoto}||${bUrl}` : bUrl;

                    const newPack = { ...(currentPackingTask || { id: 'PK' + Date.now(), orderId: _order.id, user: currentUser, date: safeDateOnly }), status: 'Done', end: currentFullTime, endTime: currentFullTime, photo: finalPhotoStr, reward_vnd: packReward };
                    const newOrder = { ..._order, status: 'Chờ Bàn Giao' };

                    setOptimisticPack(newPack); setOptimisticOrder(newOrder);
                    pushDeltas({ orders: [newOrder], packings: [newPack] }, `Gói xong (+${packReward / 1000}k)!`, 'fa-check').catch(() => { });
                } else if (act === 'START_CARRY') {
                    const newOrder = { ..._order, isCarriedToWH: currentUser };
                    setOptimisticOrder(newOrder);
                    pushDeltas({ orders: [newOrder] }, 'Đã nhận chở kho!', 'fa-truck-loading').catch(() => { });
                } else if (act === 'DONE_CARRY') {
                    if (!whFile) { triggerToast('Vui lòng chụp ảnh khi mang ra kho!', 'fa-camera', 'danger'); return; }
                    setProcessing(true); let photoUrl = '';
                    try {
                        const b64 = typeof resizeImage === 'function' ? await resizeImage(whFile) : await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(whFile); });
                        photoUrl = await runGAS('uploadImage', b64, `WH_${_order.id}.jpg`);
                        if (!photoUrl) throw new Error("Không thể upload ảnh mang ra kho.");
                    } catch (e) { triggerToast('Lỗi upload ảnh khi mang ra kho!', 'fa-times', 'danger'); setProcessing(false); return; }
                    setProcessing(false);

                    const isIntlCarry = /SG|MY|TH|PH|MA|TW|Quốc Tế|Xuất Khẩu/i.test((_order.channel || '') + ' ' + (_order.orderCode || ''));
                    const carryReward = 10000;
                    const newWhPack = { id: 'PK_WH_' + Date.now(), orderId: _order.id, user: currentUser, date: safeDateOnly, status: 'Done', end: currentFullTime, endTime: currentFullTime, photo: photoUrl, reward_vnd: carryReward };
                    const newOrder = { ..._order, status: 'Đã Bàn Giao', isCarriedToWH: true };

                    setOptimisticPack(newWhPack); setOptimisticOrder(newOrder);
                    pushDeltas({ orders: [newOrder], packings: [newWhPack], ...deductStock() }, 'Đã mang ra kho & TRỪ TỒN KHO!', 'fa-check-circle').catch(() => { });
                } else if (act === 'SHIP') {
                    if (!shippingCode && (_order.channel === 'Bán Lẻ' || _order.channel === 'Cộng Tác Viên' || _order.channel === 'Bán Sỉ')) {
                        triggerToast('Vui lòng Đẩy Đơn GHN hoặc nhập Mã Vận Đơn/SĐT Xe trước khi Giao ĐVVC!', 'fa-times', 'danger');
                        return;
                    }
                    const newOrder = { ..._order, status: 'Đã Bàn Giao' };
                    setOptimisticOrder(newOrder);
                    pushDeltas({ orders: [newOrder], ...deductStock() }, 'Đã bàn giao & TRỪ TỒN KHO!', 'fa-truck').catch(() => { });
                }
            } catch (e) { triggerToast("Có lỗi xảy ra!", "fa-times", "danger"); setProcessing(false); }
        };

        const [isFetchingAppeal, setIsFetchingAppeal] = React.useState(false);
        const fetchAppealEvidence = async (e) => {
            e.stopPropagation();
            if (isFetchingAppeal) return;
            setIsFetchingAppeal(true);
            triggerToast('Đang quét hồ sơ khiếu nại...', 'fa-spinner fa-spin', 'info');
            try {
                const res = await runGAS('getAppealEvidence', _order.orderCode || _order.id);
                if (res.status === 'error') throw new Error(res.message);
                
                const ev = res.data;
                const images = [
                    ev.productionQC.qcFront, ev.productionQC.qcSide, 
                    ev.packingEvidence.photoBefore, ev.packingEvidence.photoPacked
                ].filter(Boolean);
                
                if (images.length === 0) {
                    triggerToast('Không tìm thấy ảnh bằng chứng nào!', 'fa-exclamation-triangle', 'warning');
                } else {
                    triggerToast(`Tìm thấy ${images.length} ảnh bằng chứng. Tự động mở tab mới.`, 'fa-check', 'success');
                    images.forEach(url => window.open(url, '_blank'));
                }
            } catch (err) {
                triggerToast('Lỗi truy xuất bằng chứng: ' + err.message, 'fa-times', 'danger');
            } finally {
                setIsFetchingAppeal(false);
            }
        };

        return (
            <div className={`bg-[#141414] rounded-2xl shadow-sm relative overflow-hidden border p-3.5 transition-colors hover:border-[#444] ${isReturn ? 'border-[#b45309]' : 'border-[#2a2a2a]'} ${isSelected ? 'ring-2 ring-[#2563eb]' : ''}`}>
                {sosTarget && ReactDOM.createPortal(
                    <ReturnSosModal sosTarget={sosTarget} erpProducts={erpProducts} order={_order} packRecord={packRecord} onClose={() => setSosTarget(null)} pushDeltas={pushDeltas} triggerToast={triggerToast} setOptimisticOrder={setOptimisticOrder} />,
                    document.body
                )}

                {/* Moved ctvLayoutModal to AddModal */}

                <div className="absolute top-2 left-2 w-5 h-5 bg-[#0a0a0a] text-[#888] font-black text-[10px] rounded-full flex items-center justify-center border border-[#333] z-10 shadow-sm">{idx_num}</div>
                {(filterStatus === 'Chờ Bàn Giao' || isAdmin || isBossRole || currentRole === 'QUẢN LÝ BÁN HÀNG') && !isCTV && onToggleSelect && (
                    <div className="absolute top-2 left-8 z-30" onClick={(e) => { e.stopPropagation(); onToggleSelect(); }}>
                        <input type="checkbox" checked={isSelected} readOnly className="w-5 h-5 accent-[#2563eb] rounded cursor-pointer" />
                    </div>
                )}

                {(isAdmin || (isCTV && isOwnOrder)) && canEdit && (
                    <div className="absolute top-2 right-2 flex gap-1 z-30">
                        {currentRole === 'KẾ TOÁN' && (isReturn || String(_order.status).includes('Hoàn')) && (
                            <button onClick={fetchAppealEvidence} title="Lấy Hồ Sơ Khiếu Nại Shopee" className="w-7 h-7 bg-[#cf1322]/10 text-[#cf1322] border border-[#cf1322]/30 hover:bg-[#cf1322] hover:text-white rounded-lg flex items-center justify-center transition-colors shadow-sm"><i className={isFetchingAppeal ? "fas fa-spinner fa-spin text-[10px]" : "fas fa-file-download text-[10px]"}></i></button>
                        )}
                        {isGHNShipping && (isAdmin || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || isBossRole || currentRole === 'TỐI CAO') && (
                            <button disabled={hasShippingCode} onClick={(e) => { e.stopPropagation(); setShowGHNModal(true); }} title="Đẩy đơn qua GHN" className={`w-7 h-7 flex items-center justify-center rounded-lg transition-colors shadow-sm ${!hasShippingCode ? 'bg-[#f97316] text-white border border-[#f97316] hover:bg-[#ea580c]' : 'bg-gray-500/10 text-gray-500 border border-gray-500/30 cursor-not-allowed opacity-60'}`}><i className="fas fa-truck text-[10px]"></i></button>
                        )}
                        {isGuiXeShipping && (isAdmin || currentRole === 'BÁN HÀNG' || currentRole === 'QUẢN LÝ BÁN HÀNG' || isBossRole || currentRole === 'TỐI CAO') && (
                            <button disabled={hasShippingCode} onClick={(e) => {
                                e.stopPropagation();
                                const tracking = window.prompt('Nhập SĐT Nhà Xe:', shippingCode || '');
                                if (tracking !== null) {
                                    const newOrderCode = tracking.trim() ? `${mainOrderCode} | MVĐ: ${tracking.trim()}` : mainOrderCode;
                                    const newOrder = { ..._order, orderCode: newOrderCode };
                                    setOptimisticOrder(newOrder);
                                    pushDeltas({ orders: [newOrder] }, 'Đã cập nhật SĐT Nhà Xe!', 'fa-bus').then(() => {
                                        if(tracking.trim() && typeof showCopyModal === 'function') {
                                            const msg = `Dạ Rich Fish Aquarium gửi anh/chị thông tin nhà xe: ${tracking.trim()}. Anh/chị chú ý điện thoại để nhận hàng giúp shop nhé!`;
                                            showCopyModal(msg);
                                        }
                                    }).catch(() => { });
                                }
                            }} title="Nhập SĐT Nhà Xe" className={`w-7 h-7 flex items-center justify-center rounded-lg transition-colors shadow-sm ${!hasShippingCode ? 'bg-[#10b981] text-white border border-[#10b981] hover:bg-[#059669]' : 'bg-gray-500/10 text-gray-500 border border-gray-500/30 cursor-not-allowed opacity-60'}`}><i className="fas fa-bus text-[10px]"></i></button>
                        )}
                        <button onClick={() => {
                            if (isCTV && shippingCode) {
                                window.alert('Đơn hàng đã được đẩy qua đơn vị vận chuyển, bạn không thể tự sửa. Vui lòng nhắn bộ phận CSKH để được hỗ trợ!');
                            } else {
                                if (window.confirm('ĐÂY LÀ THAO TÁC SẼ LÀM SAI DỮ LIỆU BẠN VẪN MUỐN SỬA?\n\nMọi thao tác sửa đều được ghi lại để đảm bảo dữ liệu chính xác.')) {
                                    onEditOrder && onEditOrder();
                                }
                            }

                                            { key: 'cod', label: 'Cần thu', val: _order.cod ? Number(_order.cod).toLocaleString('vi-VN') + ' đ' : '0 đ' },
                                            { key: 'sizeCoefficient', label: 'Hệ số K.Thước', val: _order.sizeCoefficient || 1.0 },

    // ==========================================
    // 4. COMPONENT QUÉT NHÃN VẬN ĐƠN TỰ ĐỘNG (BƠM ĐƠN TRỰC TIẾP GIỐNG EXCEL)
    // ==========================================
    function ScanLabelModal({ onClose, pushDeltas, existingOrders = [], products = [], triggerToast }) {
        const [imageFile, setImageFile] = React.useState(null);
        const [preview, setPreview] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);
        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [parsedOrder, setParsedOrder] = React.useState(null);
        const [manualMatchIndex, setManualMatchIndex] = React.useState(null);
        const [productSearch, setProductSearch] = React.useState('');

        const handleSelectProduct = (selectedProd) => {
            if (manualMatchIndex === null || !parsedOrder) return;
            const updatedItems = [...parsedOrder.items];
            updatedItems[manualMatchIndex] = {
                ...updatedItems[manualMatchIndex],
                name: selectedProd.name,
                matchedProd: selectedProd
            };
            setParsedOrder({
                ...parsedOrder,
                items: updatedItems
            });
            setManualMatchIndex(null);
            setProductSearch('');
            triggerToast(`Đã khớp thủ công với: ${selectedProd.name}`, 'fa-link', 'success');
        };

        const formatMoney = (val) => Number(val || 0).toLocaleString('vi-VN');

        const handleCapture = (e) => {
            const file = e.target.files[0];
            if (file) {
                setImageFile(file);
                const reader = new FileReader();
                reader.onload = (ev) => setPreview(ev.target.result);
                reader.readAsDataURL(file);
            }
        };

        const handlePasteClick = async () => {
            try {
                if (!navigator.clipboard || !navigator.clipboard.read) {
                    triggerToast('Trình duyệt không hỗ trợ nút dán ảnh trực tiếp, vui lòng bấm phím Ctrl+V (hoặc Command+V) để dán!', 'fa-exclamation', 'warning');
                    return;
                }
                const clipboardItems = await navigator.clipboard.read();
                for (const clipboardItem of clipboardItems) {
                    const validTypes = clipboardItem.types.filter(type => type.startsWith('image/') || type === 'application/pdf');
                    if (validTypes.length > 0) {
                        const blob = await clipboardItem.getType(validTypes[0]);
                        setImageFile(blob);
                        const reader = new FileReader();
                        reader.onload = (ev) => setPreview(ev.target.result);
                        reader.readAsDataURL(blob);
                        triggerToast('Đã nhận tài liệu từ bộ nhớ tạm!', 'fa-check', 'success');
                        return;
                    }
                }
                triggerToast('Không tìm thấy tệp hợp lệ trong bộ nhớ tạm!', 'fa-exclamation', 'warning');
            } catch (err) {
                triggerToast('Vui lòng cấp quyền xem bộ nhớ tạm hoặc dùng phím Ctrl+V để dán!', 'fa-times', 'danger');
            }
        };

        React.useEffect(() => {
            const handleGlobalPaste = (e) => {
                const items = (e.clipboardData || e.originalEvent?.clipboardData || window.clipboardData)?.items;
                if (!items) return;
                for (let index in items) {
                    const item = items[index];
                    if (item.kind === 'file' && (item.type.startsWith('image/') || item.type === 'application/pdf')) {
                        const blob = item.getAsFile();
                        if (blob) {
                            setImageFile(blob);
                            const reader = new FileReader();
                            reader.onload = (ev) => setPreview(ev.target.result);
                            reader.readAsDataURL(blob);
                            triggerToast('Đã dán tài liệu thành công!', 'fa-check', 'success');
                            e.preventDefault();
                        }
                    }
                }
            };
            window.addEventListener('paste', handleGlobalPaste);
            return () => window.removeEventListener('paste', handleGlobalPaste);
        }, []);

        const processImage = async () => {
            if (!imageFile) return;
            setIsProcessing(true);
            try {
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(imageFile);
                });

                triggerToast('Đang quét và mổ xẻ dữ liệu...', 'fa-spinner fa-spin', 'info');

                let textResult = "";
                if (typeof runGAS === 'function') {
                    try {
                        textResult = await runGAS('processOCR', base64Data);
                    } catch (e) {
                        textResult = "";
                    }
                }

                if (!textResult) {
                    setIsProcessing(false);
                    triggerToast('Không thể quét được dữ liệu từ ảnh (mờ hoặc lỗi). Vui lòng thử lại!', 'fa-exclamation-triangle', 'error');
                    return;
                }

                // BỘ LỌC THÔNG MINH (ĐỌC TỪNG DÒNG)
                const lines = textResult.split('\n').map(l => l.trim()).filter(l => l);
                let draft = { orderCode: '', trackingId: '', customer: '', address: '', phone: '', retailTotal: 0, items: [] };

                let isReadingCustomer = false;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    // 1. Mã Vận Đơn (Bắt SPX, GHN, J&T... hỗ trợ dấu cách/gạch ngang)
                    const trackMatch = line.match(/(SPX[\s-]*[A-Z0-9]+|GYX[\s-]*[A-Z0-9]+|JT[\s-]*[A-Z0-9]+|GHN[\s-]*[A-Z0-9]+)/i);
                    if (trackMatch) draft.trackingId = trackMatch[0].replace(/[^A-Z0-9]/gi, '').toUpperCase();

                    // 2. Mã Đơn Hàng Shopee (Bắt chuẩn format 6 số ngày tháng + 8,9 chữ/số, hỗ trợ dấu cách/gạch ngang)
                    const orderMatch = line.match(/\b([0-9]{6}[\s-]*[A-Z0-9]{8,9})\b/);
                    if (orderMatch) draft.orderCode = orderMatch[1].replace(/[^A-Z0-9]/gi, '').toUpperCase();

                    // 3. Tiền Thu
                    if (line.includes('VND') || line.includes('Tiền thu')) {
                        const moneyMatch = line.match(/([0-9]{1,3}(,[0-9]{3})*|[0-9]+)\s*VND/i);
                        if (moneyMatch) draft.retailTotal = parseInt(moneyMatch[1].replace(/,/g, ''));
                    }

                    // 4. Số điện thoại (Loại trừ số của shop)
                    const phoneMatch = line.match(/(?:84|0[3|5|7|8|9])([0-9]{8})\b/);
                    if (phoneMatch && !line.includes('945445497') && !line.includes('Từ:')) {
                        draft.phone = phoneMatch[0].replace(/^84/, '0');
                    }

                    // 5. Tên Khách & Địa chỉ
                    if (/^(Đến:|To:)$/i.test(line)) {
                        isReadingCustomer = true;
                        if (lines[i + 1]) draft.customer = lines[i + 1].replace(/^Đến:\s*/i, '');
                        if (lines[i + 2]) draft.address = lines[i + 2];
                    } else if (/^Đến:\s*(.+)/i.test(line)) {
                        draft.customer = line.replace(/^Đến:\s*/i, '').trim();
                        if (lines[i + 1] && !lines[i + 1].includes('Nội dung hàng')) draft.address = lines[i + 1];
                    }

                    // 6. Hàng hoá (Bắt đầu bằng số thứ tự "1.", "2." ...)
                    if (/^\d+\.\s/.test(line)) {
                        // Lấy số lượng
                        let qty = 1;
                        const qtyMatch = line.match(/(?:SL|Số lượng)[:\s]*(\d+)/i);
                        if (qtyMatch) qty = parseInt(qtyMatch[1], 10);

                        // Gọt rác tên Shopee (Bỏ số đếm, bỏ mọi thứ sau dấu '|' hoặc dấu phẩy)
                        let rawName = line.replace(/^\d+\.\s/, '');
                        let cleanName = rawName.split(/\||,/)[0].trim();

                        // Dò với kho hàng thực tế (ƯU TIÊN LẤY CHUẨN TÊN TAB KHO HÀNG)
                        let finalName = cleanName;
                        let matchedProd = null;
                        if (products && products.length > 0) {
                            const searchStr = cleanName.toLowerCase();

                            // Bước 1: Tìm khớp chính xác 100%
                            matchedProd = products.find(p => p.name && p.name.toLowerCase() === searchStr);

                            // Bước 2: Nếu không khớp 100%, tìm chuỗi con nhưng xếp tên dài nhất lên trước để tránh nhận diện nhầm
                            if (!matchedProd) {
                                const sortedProds = [...products].sort((a, b) => (b.name || '').length - (a.name || '').length);
                                matchedProd = sortedProds.find(p => p.name && p.name.length > 3 && searchStr.includes(String(p.name).toLowerCase()));
                            }

                            // Nếu tìm thấy trong kho, ép giá trị về đúng tên chuẩn
                            if (matchedProd) {
                                finalName = matchedProd.name;
                            }
                        }

                        draft.items.push({ name: finalName, qty: qty, matchedProd: matchedProd });
                    }
                }

                // Fallback nếu Regex lỗi không tìm thấy tên khách
                if (!draft.customer) draft.customer = 'Khách Quét Mã (Cần check lại)';

                // Kiểm tra trùng lặp
                const baseCode = draft.orderCode;
                const existing = (existingOrders || []).find(o => {
                    const oBase = (o.orderCode || '').split(' | MVĐ: ')[0].trim().toLowerCase();
                    return oBase === baseCode.toLowerCase();
                });

                let isDuplicate = false;
                let isUpdate = false;
                let existingId = null;
                let existingRecord = null;

                if (existing) {
                    existingId = existing.id;
                    existingRecord = existing;
                    const existingTrack = (existing.orderCode || '').split(' | MVĐ: ')[1] || '';
                    const existingCustomer = existing.customer || '';
                    const existingRevenue = Number(existing.revenue || 0);

                    const hasNewTrack = draft.trackingId && !existingTrack;
                    const hasNewCustomer = (draft.customer && draft.customer !== 'Khách') && (!existingCustomer || existingCustomer === 'Khách');
                    const hasNewRevenue = draft.retailTotal > 0 && existingRevenue === 0;

                    if (hasNewTrack || hasNewCustomer || hasNewRevenue) {
                        isUpdate = true;
                    } else {
                        isDuplicate = true;
                    }
                }

                setParsedOrder({
                    ...draft,
                    isDuplicate,
                    isUpdate,
                    existingId,
                    existingRecord
                });

                triggerToast(`Bóc tách chuẩn ${draft.items.length} món hàng!`, 'fa-check', 'success');
            } catch (err) {
                triggerToast('Lỗi phân tích ảnh!', 'fa-times', 'danger');

            setIsProcessing(false);

        const submitOrder = async () => {
            if (!parsedOrder) return;
            if (parsedOrder.isDuplicate) {
                alert('Đơn hàng này đã tồn tại trên hệ thống!');

                const finalOrderCode = parsedOrder.trackingId ? `${parsedOrder.orderCode} | MVĐ: ${parsedOrder.trackingId}` : parsedOrder.orderCode;

                if (parsedOrder.isUpdate && parsedOrder.existingRecord) {
                    newOrders.push({

                        orderCode: finalOrderCode,
                        channel: parsedOrder.existingRecord.channel || 'Shopee VN',

                } else {
                    const orderId = 'ORD_' + Date.now();

                    let accessories = [];

                                { phase1: { name: 'Cắt Dán', status: 'Pending' }, phase2: { name: 'Gọt Keo', status: 'Pending' } } :
                                { phase1: { name: 'Dựng Khung', status: 'Pending' }, phase2: { name: 'Gia Cố', status: 'Pending' } };

                            let currentAvailable = realStockQty;
                            for (let q = 0; q < orderQty; q++) {
                                const prodId = 'PROD_' + Date.now() + Math.random().toString(36).substr(2, 5) + '_' + itemIdx + '_' + q;
                                if (currentAvailable > 0) {
                                    newProdItems.push({
                                        id: prodId, orderId: orderId,
                                        type: isGlass ? 'Bể Kính' : 'Layout',
                                        name: item.name,
                                        note: `Sản xuất bù kho cho đơn ${parsedOrder.orderCode || ''} (Cái ${q + 1}/${orderQty})`,

                                        phases: workerPhases,
                                        deadline: typeof getAutoDeadline === 'function' ? getAutoDeadline('Nội Bộ') : defaultDeadline
