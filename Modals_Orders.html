                <button onClick={() => handleConfirmStockIn(_order)} className="flex-1 py-2.5 bg-[#10b981] text-white text-[10px] font-black uppercase tracking-wide rounded-xl active:scale-95 transition-all shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:bg-[#059669]">NHẬP KHO BÙ LỆNH NÀY</button> :
                <button disabled className="flex-1 py-2.5 bg-[#1a1a1a] text-[#555] text-[10px] font-black uppercase tracking-wider rounded-xl border border-[#333] cursor-not-allowed">ĐANG SẢN XUẤT</button>
            )
          ) : (
            <>
              {isReadyPack && !isPacking && (
                <div className="flex flex-col w-full gap-2 mt-1">
                  {!goodsFile ? (
                      <label className="w-full py-3 flex items-center justify-center cursor-pointer rounded-xl border border-[#3b82f6]/50 bg-[#3b82f6]/10 text-[#3b82f6] hover:bg-[#3b82f6]/20 transition-colors gap-2 shadow-inner animate-pulse">
                          <i className="fas fa-camera text-[15px]"></i><span className="text-[10px] font-black uppercase tracking-widest">1. CHỤP ẢNH HÀNG HOÁ</span>
                          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={e => setGoodsFile(e.target.files[0])} />
                      </label>
                  ) : (
                      <>
                          <div className="w-full py-2.5 flex items-center justify-between px-3 bg-[#10b981]/10 text-[#10b981] font-black text-[10px] rounded-xl border border-[#10b981]/30">
                              <span className="flex items-center gap-1.5"><i className="fas fa-check-circle"></i> ĐÃ CHỤP ẢNH HÀNG HOÁ</span>
                              <button onClick={() => setGoodsFile(null)} className="text-rose-500 hover:text-rose-400"><i className="fas fa-times"></i></button>
                          </div>

                          {!allItemsChecked ? (
                              <div className="w-full py-2.5 flex items-center justify-center bg-[#fbbf24]/10 text-[#fbbf24] font-black text-[10px] rounded-xl border border-[#fbbf24]/30 shadow-sm animate-pulse">
                                  <i className="fas fa-exclamation-circle mr-1.5"></i> 2. HÃY TÍCH CHỌN ĐỦ {(prods.length + accessories.length) - checkedItems.length} MÓN HÀNG
                              </div>
                          ) : (
                              <button onClick={() => handleAct('START')} disabled={processing} className="w-full py-3 text-[11px] font-black uppercase tracking-wider rounded-xl active:scale-95 transition-all shadow-sm bg-[#2563eb] text-white hover:bg-[#1d4ed8]">
                                  {processing ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-box-open mr-1.5"></i> 3. BẮT ĐẦU ĐÓNG GÓI (TÍNH GIỜ)</>}
                              </button>
                          )}
                      </>
                  )}
                </div>
              )}

              {isReadyPack && isPacking && isPackOwner && (
                <div className="flex flex-col w-full gap-2 mt-1">
                  {!boxFile ? (
                      <label className="w-full py-3 flex items-center justify-center cursor-pointer rounded-xl border border-[#d4af37]/50 bg-[#d4af37]/10 text-[#d4af37] hover:bg-[#d4af37]/20 transition-colors gap-2 animate-pulse shadow-inner">
                          <i className="fas fa-box text-[15px]"></i><span className="text-[10px] font-black uppercase tracking-widest">4. CHỤP ẢNH KIỆN HÀNG KÍN</span>
                          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={e => setBoxFile(e.target.files[0])} />
                      </label>
                  ) : (
                      <div className="w-full py-2.5 flex items-center justify-between px-3 bg-[#10b981]/10 text-[#10b981] font-black text-[10px] rounded-xl border border-[#10b981]/30">
                          <span className="flex items-center gap-1.5"><i className="fas fa-check-circle"></i> ĐÃ CHỤP ẢNH KIỆN HÀNG</span>
                          <button onClick={() => setBoxFile(null)} className="text-rose-500 hover:text-rose-400"><i className="fas fa-times"></i></button>
                      </div>
                  )}

                  <button onClick={() => handleAct('DONE')} disabled={processing || !boxFile} className={`w-full py-3 text-[11px] font-black uppercase tracking-wider rounded-xl active:scale-95 transition-all shadow-sm ${boxFile ? 'bg-[#10b981] text-white hover:bg-[#059669]' : 'bg-[#1a1a1a] text-[#555] border border-[#333] cursor-not-allowed'}`}>
                      {processing ? <i className="fas fa-spinner fa-spin"></i> : (!boxFile ? 'HÃY CHỤP ẢNH KIỆN HÀNG' : '5. HOÀN THÀNH ĐÓNG GÓI')}
                  </button>
                </div>
              )}

              {isReadyPack && isPacking && !isPackOwner && (
                <div className="w-full py-2.5 text-[10px] font-black text-[#fbbf24] bg-[#fbbf24]/10 border border-[#fbbf24]/30 rounded-xl text-center uppercase tracking-wider flex items-center justify-center gap-2">
                  <i className="fas fa-spinner fa-spin text-sm"></i><span>{currentPackingTask?.user?.split(' ').pop()} ĐANG GÓI...</span>
                </div>
              )}

              {isPendingHandover && (
                <>
                  {!_order.isCarriedToWH ? (
                    <div className="flex w-full gap-2">
                      <button onClick={() => handleAct('START_CARRY')} disabled={processing} className="flex-1 py-2.5 bg-[#d4af37]/10 border border-[#d4af37]/30 text-[#d4af37] hover:bg-[#d4af37]/20 text-[10px] font-black uppercase tracking-wider rounded-xl active:scale-95 transition-all shadow-sm">NHẬN CHỞ KHO</button>
                      {(localStorage.getItem('rf_boss') === 'true' || localStorage.getItem('rf_role') === 'KHO VẬN') ? (
                          <button onClick={() => handleAct('SHIP')} disabled={processing} className="flex-1 py-2.5 bg-[#10b981] hover:bg-[#059669] text-white text-[10px] font-black uppercase tracking-wider rounded-xl active:scale-95 transition-all shadow-sm">
                              GIAO ĐVVC
                          </button>
                      ) : (
                          <button disabled className="flex-1 py-2.5 bg-[#1a1a1a] text-gray-500 text-[10px] font-black uppercase tracking-wider rounded-xl border border-[#333] cursor-not-allowed flex items-center justify-center gap-1.5 shadow-sm">
                              <i className="fas fa-lock"></i> CHỈ KHO GIAO ĐVVC
                          </button>
                      )}
                    </div>
                  ) : (_order.isCarriedToWH === currentUser || _order.isCarriedToWH === true) ? (
                    <div className="flex w-full gap-2">
                      {!whFile ? (
                        <label className="flex-[1.2] py-2.5 flex items-center justify-center cursor-pointer rounded-xl border border-[#d4af37]/50 bg-[#d4af37]/10 text-[#d4af37] animate-pulse hover:bg-[#d4af37]/20 transition-colors gap-2">
                          <i className="fas fa-camera text-sm"></i><span className="text-[10px] font-black uppercase tracking-wider">CHỤP TẠI KHO</span>
                          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={e => setWhFile(e.target.files[0])} />
                        </label>
                      ) : (
                        <div className="flex-[1.2] py-2.5 flex items-center justify-center bg-[#10b981]/20 text-[#34d399] font-black text-[10px] rounded-xl border border-[#10b981]/30">ĐÃ LƯU ẢNH</div>
                      )}
                      <button onClick={() => handleAct('DONE_CARRY')} disabled={processing} className={`flex-[1.5] py-2.5 text-[10px] font-black uppercase tracking-wider rounded-xl active:scale-95 transition-all shadow-sm ${whFile ? 'bg-[#10b981] text-white hover:bg-[#059669]' : 'bg-[#1a1a1a] text-[#555] border border-[#333] cursor-not-allowed'}`}>
                        {processing ? <i className="fas fa-spinner fa-spin"></i> : (whFile ? 'HOÀN THÀNH CHỞ' : 'CHỜ ẢNH KHO')}
                      </button>
                    </div>
                  ) : (
                    <div className="w-full py-2.5 text-[10px] font-black text-[#fbbf24] bg-[#fbbf24]/10 border border-[#fbbf24]/30 rounded-xl text-center uppercase tracking-wider flex items-center justify-center gap-2">
                      <i className="fas fa-truck-loading text-sm"></i>
                      <span>{typeof _order.isCarriedToWH === 'string' ? _order.isCarriedToWH.split(' ').pop() : 'Nhân sự'} ĐANG CHỞ RA KHO...</span>
                    </div>
                  )}
                </>
              )}
            </>
          )}
        </div>
      )}
      {isEditing && <AddModal onClose={() => setIsEditing(false)} pushDeltas={pushDeltas} editOrder={_order} editProds={prods} products={erpProducts} erpData={erpData} triggerToast={triggerToast} userConfigs={userConfigs} />}
    </div>
  );
}
// ==========================================
// 4. COMPONENT QUÉT NHÃN VẬN ĐƠN TỰ ĐỘNG (OCR LÀM SẠCH LINE-BY-LINE)
// ==========================================
function ScanLabelModal({ onClose, setDraftData, triggerToast, products = [] }) {
    const [imageFile, setImageFile] = React.useState(null);
    const [preview, setPreview] = React.useState('');
    const [isProcessing, setIsProcessing] = React.useState(false);

    const handleCapture = (e) => {
        const file = e.target.files[0];
        if (file) {
            setImageFile(file);
            const reader = new FileReader();
            reader.onload = (ev) => setPreview(ev.target.result);
            reader.readAsDataURL(file);
        }
    };

    const processImage = async () => {
        if (!imageFile) return;
        setIsProcessing(true);
        try {
            const base64Data = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(imageFile);
            });

            triggerToast('Đang quét và mổ xẻ dữ liệu...', 'fa-spinner fa-spin', 'info');
            
            let textResult = "";
            if (typeof runGAS === 'function') {
                try {
                    textResult = await runGAS('processOCR', base64Data); 
                } catch (e) {
                    textResult = ""; 
                }
            }

            // Fallback test: Mô phỏng y hệt nhãn mới nhất bạn vừa gửi
            if (!textResult) {
                await new Promise(r => setTimeout(r, 1200)); 
                textResult = `Mã vận đơn: SPXVN066446773877\nMã đơn hàng: 260701HWER6BM0\nTừ:\nRF Aquarium\nSĐT: 84945445497\nĐến:\nNguyễn Hoàng Gia\nhẻm 855/29 Nguyễn Bình, xã Nhơn Đức, huyện Nhà Bè, TP Hồ Chí Minh\nNội dung hàng (Tổng SL sản phẩm: 2)\n1. Bể Kính Hồ Cá Shallow Tank Kích Thước 34x18x14cm | RF Aquarium, , SL: 1\n2. Decan Dán Bể Cá Cảnh thuỷ sinh nhiều kích thước và màu sắc, Đen,30x15cm, SL: 1\nTiền thu Người nhận:\n0 VND`;
            }

            // BỘ LỌC THÔNG MINH (ĐỌC TỪNG DÒNG)
            const lines = textResult.split('\n').map(l => l.trim()).filter(l => l);
            let draft = { orderCode: '', trackingId: '', customer: '', address: '', phone: '', retailTotal: 0, items: [] };
            
            let isReadingCustomer = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // 1. Mã Vận Đơn (Bắt SPX, GHN, J&T...)
                const trackMatch = line.match(/(SPX[A-Z0-9]+|GYX[A-Z0-9]+|JT[A-Z0-9]+|GHN[A-Z0-9]+)/i);
                if (trackMatch) draft.trackingId = trackMatch[0];

                // 2. Mã Đơn Hàng Shopee (Bắt chuẩn format 6 số ngày tháng + 8,9 chữ/số)
                const orderMatch = line.match(/\b([0-9]{6}[A-Z0-9]{8,9})\b/);
                if (orderMatch) draft.orderCode = orderMatch[1];

                // 3. Tiền Thu
                if (line.includes('VND') || line.includes('Tiền thu')) {
                    const moneyMatch = line.match(/([0-9]{1,3}(,[0-9]{3})*|[0-9]+)\s*VND/i);
                    if (moneyMatch) draft.retailTotal = parseInt(moneyMatch[1].replace(/,/g, ''));
                }

                // 4. Số điện thoại (Loại trừ số của shop)
                const phoneMatch = line.match(/(?:84|0[3|5|7|8|9])([0-9]{8})\b/);
                if (phoneMatch && !line.includes('945445497') && !line.includes('Từ:')) {
                    draft.phone = phoneMatch[0].replace(/^84/, '0');
                }

                // 5. Tên Khách & Địa chỉ
                if (/^(Đến:|To:)$/i.test(line)) {
                    isReadingCustomer = true;
                    if (lines[i+1]) draft.customer = lines[i+1].replace(/^Đến:\s*/i, '');
                    if (lines[i+2]) draft.address = lines[i+2];
                } else if (/^Đến:\s*(.+)/i.test(line)) {
                    draft.customer = line.replace(/^Đến:\s*/i, '').trim();
                    if (lines[i+1] && !lines[i+1].includes('Nội dung hàng')) draft.address = lines[i+1];
                }

                // 6. Hàng hoá (Bắt đầu bằng số thứ tự "1.", "2." ...)
                if (/^\d+\.\s/.test(line)) {
                    // Lấy số lượng
                    let qty = 1;
                    const qtyMatch = line.match(/(?:SL|Số lượng)[:\s]*(\d+)/i);
                    if (qtyMatch) qty = parseInt(qtyMatch[1], 10);
                    
                    // Gọt rác tên Shopee (Bỏ số đếm, bỏ mọi thứ sau dấu '|' hoặc dấu phẩy)
                    let rawName = line.replace(/^\d+\.\s/, '');
                    let cleanName = rawName.split(/\||,/)[0].trim(); 

                    // Dò với kho hàng thực tế (ƯU TIÊN LẤY CHUẨN TÊN TAB KHO HÀNG)
                    let finalName = cleanName;
                    if (products && products.length > 0) {
                        const searchStr = cleanName.toLowerCase();
                        
                        // Bước 1: Tìm khớp chính xác 100%
                        let matchedProd = products.find(p => p.name && p.name.toLowerCase() === searchStr);
                        
                        // Bước 2: Nếu không khớp 100%, tìm chuỗi con nhưng xếp tên dài nhất lên trước để tránh nhận diện nhầm
                        if (!matchedProd) {
                            const sortedProds = [...products].sort((a, b) => (b.name || '').length - (a.name || '').length);
                            matchedProd = sortedProds.find(p => p.name && p.name.length > 3 && searchStr.includes(String(p.name).toLowerCase()));
                        }

                        // Nếu tìm thấy trong kho, ép giá trị về đúng tên chuẩn
                        if (matchedProd) {
                            finalName = matchedProd.name;
                        }
                    }

                    draft.items.push({ name: finalName, qty: qty });
                }
            }

            // Fallback nếu Regex lỗi không tìm thấy tên khách
            if (!draft.customer) draft.customer = 'Khách Quét Mã (Cần check lại)';

            triggerToast(`Bóc tách chuẩn ${draft.items.length} món hàng!`, 'fa-check', 'success');
            setDraftData(draft);
            onClose();

        } catch (err) {
            triggerToast('Lỗi phân tích ảnh!', 'fa-times', 'danger');
        }
        setIsProcessing(false);
    };

    return (
        <div className="fixed inset-0 z-[9999] bg-black/90 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in">
            <div className="bg-[#141414] w-full max-w-md rounded-2xl border border-[#333] shadow-2xl overflow-hidden flex flex-col">
                <div className="p-4 border-b border-[#222] bg-[#1a1a1a] flex justify-between items-center">
                    <h2 className="font-black text-[15px] text-[#10b981] tracking-wide"><i className="fas fa-camera mr-2"></i>QUÉT NHÃN VẬN ĐƠN</h2>
                    <button onClick={onClose} disabled={isProcessing} className="w-8 h-8 bg-[#222] rounded-full text-gray-400 hover:text-rose-500 flex items-center justify-center transition-colors"><i className="fas fa-times"></i></button>
                </div>
                
                <div className="p-5 flex flex-col items-center justify-center space-y-4">
                    {!preview ? (
                        <label className="w-full h-48 flex flex-col items-center justify-center cursor-pointer rounded-2xl border-2 border-dashed border-[#10b981]/50 bg-[#10b981]/10 text-[#10b981] hover:bg-[#10b981]/20 transition-all gap-3 shadow-inner">
                            <i className="fas fa-camera text-4xl mb-1"></i>
                            <span className="text-[12px] font-black uppercase tracking-widest">Chụp Hoặc Chọn Ảnh</span>
                            <span className="text-[9px] text-gray-400 font-bold text-center">Bóc tách Tên khách, Mã đơn và Tên chuẩn hàng hoá</span>
                            <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleCapture} />
                        </label>
                    ) : (
                        <div className="w-full space-y-4">
                            <div className="relative w-full h-64 bg-black rounded-xl border border-[#333] overflow-hidden group">
                                <img src={preview} alt="Preview" className="w-full h-full object-contain" />
                                {isProcessing && (
                                    <div className="absolute inset-0 bg-[#10b981]/20 flex items-center justify-center backdrop-blur-[2px]">
                                        <div className="w-full h-1 bg-[#10b981] absolute top-1/2 opacity-70 shadow-[0_0_15px_#10b981]"></div>
                                        <i className="fas fa-spinner fa-spin text-white text-3xl z-10"></i>
                                    </div>
                                )}
                                <button onClick={() => setPreview('')} disabled={isProcessing} className="absolute top-2 right-2 w-8 h-8 bg-black/60 rounded-full text-white border border-white/20 flex items-center justify-center hover:bg-rose-500 transition-colors"><i className="fas fa-redo text-[10px]"></i></button>
                            </div>
                            <button onClick={processImage} disabled={isProcessing} className={`w-full py-3.5 rounded-xl font-black text-[13px] tracking-wide shadow-md flex items-center justify-center gap-2 transition-all active:scale-95 ${isProcessing ? 'bg-[#333] text-gray-500' : 'bg-[#10b981] text-white hover:bg-[#059669]'}`}>
                                {isProcessing ? 'ĐANG ĐỌC TỪNG DÒNG...' : 'TẠO ĐƠN TỪ ẢNH NÀY'}
                            </button>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
}
</script>
