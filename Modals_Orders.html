        return (
            <div className="fixed inset-0 z-[999] bg-black/85 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in" onClick={onClose}>
                <div className="bg-[#18181b] w-full max-w-lg rounded-[24px] border border-[#333] shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-slide-up" onClick={e => e.stopPropagation()}>
                    {/* Header */}
                    <div className="p-4 border-b border-[#27272a] bg-gradient-to-r from-orange-900/40 to-[#18181b] flex justify-between items-center shrink-0">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-full bg-orange-500/20 flex items-center justify-center border border-orange-500/30">
                                <i className="fas fa-truck text-orange-500 text-sm"></i>
                            </div>
                            <div>
                                <h3 className="font-black text-[14px] text-white uppercase tracking-widest leading-tight">Đẩy Đơn GHN</h3>
                                <div className="text-[10px] text-gray-400 font-bold">Xác nhận tạo đơn nhanh</div>
                            </div>
                        </div>
                        <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#27272a] text-gray-400 hover:text-rose-500 flex items-center justify-center transition-colors">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>

                    {/* Body */}
                    <div className="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-5">
                        {/* Customer Info */}
                        <div className="bg-[#111] border border-[#222] p-4 rounded-xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-16 h-16 bg-orange-500/10 rounded-bl-[100%]"></div>
                            <div className="text-[10px] font-black text-orange-500 mb-2 uppercase tracking-widest"><i className="fas fa-user mr-1"></i> Thông tin Người Nhận</div>
                            <div className="grid grid-cols-2 gap-3 mb-3">
                                <div>
                                    <label className="text-[9px] text-gray-500 font-bold block mb-1">Họ tên</label>
                                    <div className="text-[12px] text-white font-bold">{order.customer}</div>
                                </div>
                                <div>
                                    <label className="text-[9px] text-gray-500 font-bold block mb-1">Số điện thoại</label>
                                    <div className="text-[12px] text-white font-bold">{customerPhone}</div>
                                </div>
                            </div>
                            <div>
                                <label className="text-[9px] text-gray-500 font-bold block mb-1">Địa chỉ đồng bộ GHN (Tự động theo chuẩn mới)</label>
                                <input value={finalAddress} onChange={e => setFinalAddress(e.target.value)} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2 text-[11px] font-bold text-white outline-none focus:border-orange-500" />
                            </div>
                        </div>

                        {/* Address Mapping */}
                        <div className="space-y-3">
                            <div className="text-[10px] font-black text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                <i className="fas fa-map-marker-alt"></i> Phân tích địa chỉ GHN
                                {selectedWard && selectedDist && selectedProv && <span className="text-emerald-500"><i className="fas fa-check-circle"></i> Tự động khớp</span>}
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <select value={selectedProv} onChange={e => { setSelectedProv(e.target.value); fetchDistricts(e.target.value, { "Content-Type": "application/json", "Token": apiToken, "ShopId": shopId }); }} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2 text-[11px] font-bold text-white outline-none focus:border-orange-500">
                                    <option value="">- Chọn Tỉnh/Thành -</option>
                                    {provinces.map(p => <option key={p.ProvinceID} value={p.ProvinceID}>{p.ProvinceName}</option>)}
                                </select>
                                <select value={selectedDist} onChange={e => { setSelectedDist(e.target.value); fetchWards(e.target.value, { "Content-Type": "application/json", "Token": apiToken, "ShopId": shopId }); }} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2 text-[11px] font-bold text-white outline-none focus:border-orange-500" disabled={!selectedProv}>
                                    <option value="">- Chọn Quận/Huyện -</option>
                                    {districts.map(d => <option key={d.DistrictID} value={d.DistrictID}>{d.DistrictName}</option>)}
                                </select>
                                <select value={selectedWard} onChange={e => setSelectedWard(e.target.value)} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2 text-[11px] font-bold text-white outline-none focus:border-orange-500" disabled={!selectedDist}>
                                    <option value="">- Chọn Phường/Xã -</option>
                                    {wards.map(w => <option key={w.WardCode} value={w.WardCode}>{w.WardName}</option>)}
                                </select>
                            </div>
                        </div>

                        {/* Package Info */}
                        <div className="space-y-3">
                            <div className="text-[10px] font-black text-gray-400 uppercase tracking-widest flex items-center gap-2">
                                <i className="fas fa-box-open"></i> Cấu hình kiện hàng
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Cửa hàng (ShopId)</label>
                                    <select value={shopId} onChange={e => { setShopId(e.target.value); if(selectedDist) fetchServices(selectedDist, e.target.value, apiToken); }} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500">
                                        {shops.map(s => <option key={s._id} value={s._id}>{s.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Người trả phí Ship</label>
                                    <select value={formData.paymentTypeId} onChange={e => setFormData({ ...formData, paymentTypeId: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500">
                                        <option value={1}>Shop trả (Người gửi)</option>
                                        <option value={2}>Khách trả (Người nhận)</option>
                                    </select>
                                </div>
                                <div className="col-span-2 bg-[#121214] border border-orange-500/30 rounded-xl p-3">
                                    <label className="text-[10px] text-orange-400 font-black uppercase tracking-wider flex items-center gap-1.5 mb-1.5"><i className="fas fa-shipping-fast text-orange-500"></i> Gói cước GHN</label>
                                    <select value={selectedService} onChange={e => setSelectedService(e.target.value)} className="w-full bg-[#18181b] border border-orange-500/40 rounded-lg px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500">
                                        {availableServices.length > 0 ? availableServices.map(s => <option key={s.service_type_id} value={s.service_type_id}>{s.short_name || 'Giao Hàng Nhanh'}</option>) : <option value="">Đang tìm dịch vụ khả dụng...</option>}
                                    </select>
                                </div>
                                <div className="col-span-2 bg-[#121214] border border-orange-500/30 rounded-xl p-3">
                                    <label className="text-[10px] text-orange-400 font-black uppercase tracking-wider flex items-center gap-1.5 mb-1.5"><i className="fas fa-calendar-check text-orange-500"></i> Ca lấy hàng (Bắt buộc)</label>
                                    <select value={selectedShift} onChange={e => setSelectedShift(e.target.value)} className="w-full bg-[#18181b] border border-orange-500/40 rounded-lg px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500">
                                        {shifts.map((s, idx) => <option key={s.id + '_' + idx} value={String(s.id)}>{s.title || `Ca #${s.id}`}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Trọng lượng (gram)</label>
                                    <input type="number" value={formData.weight} onChange={e => setFormData({ ...formData, weight: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-3 py-2.5 text-[12px] font-bold text-white outline-none focus:border-orange-500 text-center" />
                                </div>
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Kích thước (D-R-C cm)</label>
                                    <div className="flex gap-1">
                                        <input type="number" value={formData.length} onChange={e => setFormData({ ...formData, length: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-1 py-2.5 text-[11px] font-bold text-white outline-none focus:border-orange-500 text-center" />
                                        <input type="number" value={formData.width} onChange={e => setFormData({ ...formData, width: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-1 py-2.5 text-[11px] font-bold text-white outline-none focus:border-orange-500 text-center" />
                                        <input type="number" value={formData.height} onChange={e => setFormData({ ...formData, height: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-1 py-2.5 text-[11px] font-bold text-white outline-none focus:border-orange-500 text-center" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] text-emerald-500 font-bold block mb-1">Tiền Thu Hộ (COD)</label>
                                    <input type="number" value={formData.cod} onChange={e => setFormData({ ...formData, cod: e.target.value })} className="w-full bg-[#111] border border-emerald-500/50 rounded-lg px-3 py-2.5 text-[13px] font-black text-emerald-400 outline-none focus:border-emerald-500 text-center shadow-[0_0_10px_rgba(16,185,129,0.1)]" />
                                </div>
                                <div>
                                    <label className="text-[10px] text-gray-400 font-bold block mb-1">Ghi chú bắt buộc</label>
                                    <select value={formData.noteCode} onChange={e => setFormData({ ...formData, noteCode: e.target.value })} className="w-full bg-[#111] border border-[#333] rounded-lg px-2 py-2.5 text-[11px] font-bold text-white outline-none focus:border-orange-500">
                                        <option value="CHOTHUHANG">Cho thử hàng</option>
                                        <option value="CHOXEMHANGKHONGTHU">Cho xem hàng, ko thử</option>
                                        <option value="KHONGCHOXEMHANG">Không cho xem hàng</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="p-4 border-t border-[#27272a] bg-[#18181b] shrink-0">
                        <button onClick={handleCreate} disabled={submitting} className="w-full py-3.5 bg-gradient-to-r from-orange-600 to-orange-500 hover:from-orange-500 hover:to-orange-400 text-white font-black rounded-xl shadow-lg shadow-orange-950/30 active:scale-95 transition-all text-center uppercase tracking-wider flex items-center justify-center gap-2">
                            {submitting ? <><i className="fas fa-spinner fa-spin"></i> ĐANG ĐẨY ĐƠN GHN...</> : <><i className="fas fa-paper-plane"></i> XÁC NHẬN TẠO ĐƠN GHN</>}
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // ==========================================
    // TRẠM ĐỐI SOÁT TÀI CHÍNH TỰ ĐỘNG
    // ==========================================
    function BulkFinanceModal({ onClose, pushDeltas, orders, transactions, accounts }) {
        const [fileName, setFileName] = React.useState('');
        const [isProcessing, setIsProcessing] = React.useState(false);
        const [progress, setProgress] = React.useState(0);
        const [previewLogs, setPreviewLogs] = React.useState([]);
        const [reportType, setReportType] = React.useState(''); // 'INCOME' or 'BALANCE'
        const [resultPayload, setResultPayload] = React.useState(null);

        const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate().replace('T', ' ') : new Date().toISOString().slice(0, 16).replace('T', ' ');

        const processExcel = (rows) => {
            if (rows.length < 2) return;
            setIsProcessing(true);
            let headerIdx = 0;
            for (let i = 0; i < Math.min(15, rows.length); i++) {
                const rowStr = (rows[i] || []).join(' ').toLowerCase();
                if (rowStr.includes('mã đơn hàng') || rowStr.includes('mã giao dịch') || rowStr.includes('loại giao dịch') || rowStr.includes('order id') || rowStr.includes('mã tham chiếu')) { headerIdx = i; break; }
            }

            if (!rows[headerIdx]) {
                alert('Lỗi định dạng file: Không tìm thấy dòng tiêu đề (Mã đơn hàng, Loại giao dịch).');
                setIsProcessing(false);
                return;
            }

            const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());
            const findCol = (keys) => {
                let idx = headers.findIndex(h => keys.some(k => String(h) === k));
                if (idx === -1) idx = headers.findIndex(h => keys.some(k => String(h).includes(k)));
                return idx;
            };

            const allHeaderStr = rows.slice(0, 5).map(r => (r || []).join(' ').toLowerCase()).join(' ');
            const isBalance = allHeaderStr.includes('loại giao dịch') && (allHeaderStr.includes('số dư') || allHeaderStr.includes('rút tiền') || allHeaderStr.includes('số tiền'));
            const isIncome = !isBalance && (allHeaderStr.includes('mã đơn hàng') || allHeaderStr.includes('order id') || allHeaderStr.includes('mã tham chiếu') || allHeaderStr.includes('doanh thu'));

            let newTransactions = [];
            let updatedOrders = [];
            let logs = [];
            let newAccounts = [];

            // Check if accounts exist
            const shopeeWalletName = 'Ví Shopee - 0945445497';
            const defaultBankName = 'TÀI KHOẢN CÔNG TY';

            const accountsList = accounts || [];
            let walletAcc = accountsList.find(a => String(a.accountName).toLowerCase().includes('ví shopee'));
            let bankAcc = accountsList.find(a => String(a.accountName).toLowerCase().includes('công ty'));

            let finalWalletName = walletAcc ? walletAcc.accountName : shopeeWalletName;
            let finalBankName = bankAcc ? bankAcc.accountName : defaultBankName;

            if (!walletAcc) newAccounts.push({ id: 'ACC_SHOPEE_' + Date.now(), accountName: finalWalletName, balance: 0 });
            if (!bankAcc) newAccounts.push({ id: 'ACC_BANK_' + Date.now(), accountName: finalBankName, balance: 0 });

            if (isIncome) {
                setReportType('INCOME (Doanh Thu)');
                let iCode = findCol(['mã đơn hàng', 'mã giao dịch', 'order id', 'mã tham chiếu']);

                // Tiền thực tế Shopee trả
                let iRevenue = findCol(['tổng tiền đã thanh toán', 'số tiền được ghi nhận', 'doanh thu', 'quyết toán', 'thu nhập ròng', 'số tiền chuyển khoản']);

                // Nhóm 1: Tiền Hàng
                let iTotalSale = findCol(['giá sản phẩm', 'tổng số tiền người mua thanh toán', 'tổng số tiền', 'tổng giá bán', 'tổng tiền sản phẩm']); // Giá trị Gross

                // Nhóm 2: Bù trừ
                let iRefund = findCol(['số tiền hoàn lại']);
                let iSellerVoucher = findCol(['mã ưu đãi do người bán chịu', 'voucher của shop', 'mã giảm giá của shop']);

                // Nhóm 3: Vận chuyển
                let iShippingBuyer = findCol(['phí vận chuyển người mua trả']);
                let iShippingActual = findCol(['phí vận chuyển thực tế', 'phí vận chuyển do người bán trả', 'phí trả đtgh']);
                let iShippingShopee = findCol(['phí vận chuyển được trợ giá từ shopee']);

                // Nhóm 4: Phí sàn
                let iFixedFee = findCol(['phí cố định']);
                let iServiceFee = findCol(['phí dịch vụ']);
                let iPaymentFee = findCol(['phí xử lý giao dịch', 'phí thanh toán']);
                let iAffiliate = findCol(['phí hoa hồng tiếp thị liên kết', 'phí hoa hồng', 'hoa hồng', 'affiliate']);
                let iPiShip = findCol(['phí dịch vụ piship']);
                let iNTTD = findCol(['phí dịch vụ hiển thị nttd', 'hiển thị nttd', 'nttd']);
                let iTroGia = findCol(['trợ giá']);

                // Nhóm 5: Thuế
                let iTaxVAT = findCol(['thuế gtgt', 'thuế thu hộ']);
                let iTaxTNCN = findCol(['thuế tncn', 'thuế']);

                let iProd = findCol(['tên sản phẩm', 'product name']);
                let iVar = findCol(['tên phân loại', 'variation name', 'variation']);
                let iQty = findCol(['số lượng', 'quantity']);
                let iDate = findCol(['ngày đặt hàng', 'thời gian tạo đơn', 'thời gian đặt hàng', 'order creation date', 'ngày tạo đơn', 'thời gian thanh toán']);

                if (iCode === -1 || (iRevenue === -1 && iTotalSale === -1)) {
                    alert('Không tìm thấy cột Mã Đơn Hàng hoặc cột Tiền (Doanh thu/Giá sản phẩm)! Các cột hiện có: ' + headers.join(', '));
                    setIsProcessing(false);
                    return;
                }

                // Nhóm các dòng theo mã đơn hàng
                const fileOrderMap = {};
                for (let i = headerIdx + 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (!cols[iCode]) continue;
                    let oCode = String(cols[iCode]).trim();

                    // If oCode is just a sequence number (1, 2, 3) or too short, scan the row for a real order code
                    if (oCode.length < 5) {
                        for (let c = 0; c < cols.length; c++) {
                            const val = String(cols[c] || '').trim();
                            if (val.length >= 8 && /[A-Z0-9]{8,}/i.test(val) && !val.includes(' ') && !val.includes(':')) {
                                oCode = val;
                                break;
                            }
                        }
                    }

                    if (!oCode || oCode.length < 5 || oCode.toLowerCase().includes('mã đơn')) continue;

                    if (!fileOrderMap[oCode]) {
                        fileOrderMap[oCode] = { rows: [], cols: cols };
                    }
                    fileOrderMap[oCode].rows.push(cols);
                }

                Object.keys(fileOrderMap).forEach((oCode, idx) => {
                    const orderRows = fileOrderMap[oCode].rows;
                    const mainCols = fileOrderMap[oCode].cols;

                    let txDate = safeDateFull;
                    if (iDate > -1 && mainCols[iDate]) {
                        let rawD = String(mainCols[iDate]).trim();
                        if (rawD.length >= 10) {
                            if (rawD.substring(2, 3) === '/' || rawD.substring(2, 3) === '-') {
                                let parts = rawD.split(' ')[0].split(/[\/\-]/);
                                if (parts.length === 3) txDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')} 12:00`;
                            } else if (rawD.substring(4, 5) === '-') {
                                txDate = rawD.replace('T', ' ').substring(0, 16);
                                if (txDate.length === 10) txDate += " 12:00";
                            }
                        }
                    }

                    const parseAmt = (val) => {
                        if (val === undefined || val === null || val === '') return 0;
                        return parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0;
                    };

                    // Giá trị gốc (có thể âm) để tính tổng
                    let rawTotalSale = iTotalSale > -1 ? parseAmt(mainCols[iTotalSale]) : 0;

                    let rawRefund = iRefund > -1 ? parseAmt(mainCols[iRefund]) : 0;
                    let rawSellerVoucher = iSellerVoucher > -1 ? parseAmt(mainCols[iSellerVoucher]) : 0;

                    let rawShipBuyer = iShippingBuyer > -1 ? parseAmt(mainCols[iShippingBuyer]) : 0;
                    let rawShipActual = iShippingActual > -1 ? parseAmt(mainCols[iShippingActual]) : 0;
                    let rawShipShopee = iShippingShopee > -1 ? parseAmt(mainCols[iShippingShopee]) : 0;

                    let rawFixed = iFixedFee > -1 ? parseAmt(mainCols[iFixedFee]) : 0;
                    let rawService = iServiceFee > -1 ? parseAmt(mainCols[iServiceFee]) : 0;
                    let rawPayment = iPaymentFee > -1 ? parseAmt(mainCols[iPaymentFee]) : 0;
                    let rawAffiliate = iAffiliate > -1 ? parseAmt(mainCols[iAffiliate]) : 0;
                    let rawPiShip = iPiShip > -1 ? parseAmt(mainCols[iPiShip]) : 0;
                    let rawNTTD = iNTTD > -1 ? parseAmt(mainCols[iNTTD]) : 0;
                    let rawTroGia = iTroGia > -1 ? parseAmt(mainCols[iTroGia]) : 0;

                    let rawTaxVAT = iTaxVAT > -1 ? parseAmt(mainCols[iTaxVAT]) : 0;
                    let rawTaxTNCN = iTaxTNCN > -1 ? parseAmt(mainCols[iTaxTNCN]) : 0;

                    // Tiền đối soát tính toán (cộng dồn đầy đủ tất cả các phụ phí và trợ giá)
                    let calculatedReconciliation = rawTotalSale + rawRefund + rawSellerVoucher + rawTroGia +
                        rawShipBuyer + rawShipActual + rawShipShopee +
                        rawFixed + rawService + rawPayment + rawAffiliate + rawPiShip + rawNTTD +
                        rawTaxVAT + rawTaxTNCN;

                    // Tổng tiền đã thanh toán (Shopee trả)
                    let actualShopeePaid = iRevenue > -1 ? parseAmt(mainCols[iRevenue]) : 0;

                    // Chênh lệch đối soát giữa tiền Shopee trả thực tế và tiền công thức tính toán
                    let delta = actualShopeePaid - calculatedReconciliation;

                    // Absolute values for legacy object and transactions
                    let grossRevenue = rawTotalSale;
                    let netRevenue = actualShopeePaid;

                    let fixedFee = Math.abs(rawFixed);
                    let paymentFee = Math.abs(rawPayment);
                    let serviceFee = Math.abs(rawService) + Math.abs(rawPiShip) + Math.abs(rawNTTD);
                    let affiliateFee = Math.abs(rawAffiliate);
                    let tax = Math.abs(rawTaxVAT) + Math.abs(rawTaxTNCN);
                    let shopVoucher = Math.abs(rawSellerVoucher);
                    let shippingFee = Math.abs(rawShipActual);
                    let totalFees = fixedFee + paymentFee + serviceFee + affiliateFee + tax;

                    // Trích xuất danh sách sản phẩm từ các dòng trong file
                    let extractedProducts = [];
                    orderRows.forEach(r => {
                        let pName = iProd >= 0 && r[iProd] ? String(r[iProd]).trim() : '';
                        let pVar = iVar >= 0 && r[iVar] ? String(r[iVar]).trim() : '';
                        let q = iQty >= 0 && r[iQty] ? (parseInt(r[iQty]) || 1) : 1;
                        if (pName) {
                            extractedProducts.push({ name: pName + (pVar ? ' - ' + pVar : ''), quantity: q, price: 0 });
                        }
                    });

                    const cleanCode = oCode.split(' | ')[0].trim().toUpperCase();
                    const matchOrder = (orders || []).find(o => {
                        const dbCode = String(o.orderCode || '').toUpperCase();
                        if (cleanCode.length < 5) return dbCode === cleanCode;
                        return dbCode === cleanCode || dbCode.includes(cleanCode);
                    });

                    if (matchOrder) {
                        let expected = parseAmt(matchOrder.totalAmount || matchOrder.revenue);

                        // Chỉ cảnh báo khi tiền Shopee trả bị lệch thực tế so với công thức > 5.000đ (loại bỏ cảnh báo giả khi chênh lệch phí chuẩn)
                        let isWarning = Math.abs(delta) > 5000;
                        const effectiveTxDate = (iDate > -1 && mainCols[iDate]) ? txDate : (matchOrder.createdAt || matchOrder.date || txDate || safeDateFull);

                        let updatedOrderObj = {
                            ...matchOrder,
                            revenue: grossRevenue > 0 ? grossRevenue : Number(matchOrder.revenue || 0),
                            feeFixed: fixedFee,
                            feeService: serviceFee,
                            feePayment: paymentFee,
                            feeAffiliate: affiliateFee,
                            shopVoucher: shopVoucher,
                            tax: tax,
                            isReconciled: true,
                            reconciledAt: effectiveTxDate
                        };

                        // Bổ sung danh sách sản phẩm nếu đơn hàng trên hệ thống chưa có thông tin sản phẩm
                        if (extractedProducts.length > 0 && (!matchOrder.products || matchOrder.products === '[]' || matchOrder.products.length === 0)) {
                            updatedOrderObj.products = JSON.stringify(extractedProducts);
                        }

                        if (matchOrder.status !== 'Đối Soát Thành Công' && matchOrder.status !== 'Hàng Hoàn' && matchOrder.status !== 'Đơn Huỷ') {
                            updatedOrderObj.status = 'Đối Soát Thành Công';
                        }

                        updatedOrders.push(updatedOrderObj);

                        // Check for duplicate transactions before creating new ones
                        const hasTx = (transactions || []).some(t =>
                            (String(t.title || '').includes(cleanCode)) ||
                            (String(t.note || '').includes(cleanCode))
                        );

                        const walletTargetId = walletAcc ? walletAcc.id : (newAccounts[0] ? newAccounts[0].id : 'ACC_SHOPEE');

                        if (!hasTx) {
                            let baseTxId = 'TXN_INC_' + Date.now() + '_' + idx;
                            newTransactions.push({
                                id: baseTxId + '_REV',
                                type: 'Thu',
                                category: 'Doanh Thu Bán Hàng',
                                amount: grossRevenue,
                                fromAccount: '',
                                toAccount: walletTargetId,
                                title: `Doanh thu Shopee: ${oCode}`,
                                date: effectiveTxDate,
                                note: `Kênh: ${matchOrder.channel || 'Shopee'} | Khách: ${matchOrder.customer || ''}`,
                                isAuto: true
                            });

                            if (totalFees > 0) {
                                newTransactions.push({
                                    id: baseTxId + '_FEE',
                                    type: 'Chi',
                                    category: 'Chi Phí Bán Hàng',
                                    amount: totalFees,
                                    fromAccount: walletTargetId,
                                    toAccount: '',
                                    title: `Phí sàn Shopee: ${oCode}`,
                                    date: effectiveTxDate,
                                    note: `Phí sàn đơn ${oCode}`,
                                    isAuto: true
                                });
                            }

                            // Phí ship quá cân (Phí thực tế > Khách trả + Trợ giá)
                            const buyerShip = Math.abs(rawShipBuyer);
                            const actualShip = Math.abs(rawShipActual);
                            const shopeeShip = Math.abs(rawShipShopee);
                            const shipOverweight = Math.max(0, actualShip - (buyerShip + shopeeShip));

                            if (shipOverweight > 0) {
                                newTransactions.push({
                                    id: baseTxId + '_SHIP_OVERWEIGHT',
                                    type: 'Chi',
                                    category: 'Chi Phí Vận Chuyển',
                                    amount: shipOverweight,
                                    fromAccount: walletTargetId,
                                    toAccount: '',
                                    title: `Phí ship quá cân: ${oCode}`,
                                    date: txDate,
                                    note: `Chênh lệch phí ship do ĐVVC cân lại đơn ${oCode}`,
                                    isAuto: true
                                });
                            }

                            // Phí xử lý đơn hàng hoàn (2,700đ/đơn hoàn)
                            const isReturnedOrder = matchOrder.status === 'Hàng Hoàn' || rawRefund !== 0;
                            if (isReturnedOrder) {
                                const returnProcessingFee = 2700;
                                newTransactions.push({
                                    id: baseTxId + '_RETURN_FEE',
                                    type: 'Chi',
                                    category: 'Chi Phí Hàng Hoàn',
                                    amount: returnProcessingFee,
                                    fromAccount: walletTargetId,
                                    toAccount: '',
                                    title: `Phí xử lý đơn hoàn: ${oCode}`,
                                    date: txDate,
                                    note: `Phí Shopee 2,700đ xử lý hàng hoàn đơn ${oCode}`,
                                    isAuto: true
                                });
                            }
                        }

                        logs.push({
                            oCode,
                            customerName: matchOrder.customer || '',
                            expected,
                            netRevenue,
                            grossRevenue,
                            totalFees,
                            shopVoucher: Math.abs(Number(shopVoucher || 0)),
                            delta,
                            isWarning,
                            type: 'income'
                        });
                    } else {
                        logs.push({
                            oCode,
                            isError: true,
                            msg: 'Không tìm thấy đơn hàng trên hệ thống',
                            type: 'income'
                        });
                    }
                });
            } else if (isBalance) {
                setReportType('BALANCE (Số dư ví Shopee)');
                let iType = findCol(['loại giao dịch']);
                let iAmount = findCol(['số tiền (vnd)', 'số tiền']);
                let iDesc = findCol(['mô tả', 'mã đơn hàng/mã hoàn tiền']);
                let iDate = findCol(['ngày', 'thời gian', 'date']);

                if (iType === -1 || iAmount === -1) {
                    alert('Không tìm thấy cột Loại giao dịch hoặc Số tiền trong file Báo cáo Số dư ví này!');
                    setIsProcessing(false);
                    return;
                }

                for (let i = headerIdx + 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (!cols[iType]) continue;
                    const typeStr = String(cols[iType]).toLowerCase();
                    const descStr = cols[iDesc] ? String(cols[iDesc]) : '';
                    let cleanVal = String(cols[iAmount] || '0').replace(/[^0-9.-]/g, '');
                    let rowAmt = parseFloat(cleanVal) || 0;

                    let txDate = safeDateFull;
                    if (iDate > -1 && cols[iDate]) {
                        let rawD = String(cols[iDate]).trim();
                        if (rawD.length >= 10) {
                            if (rawD.substring(2, 3) === '/' || rawD.substring(2, 3) === '-') {
                                let parts = rawD.split(' ')[0].split(/[\/\-]/);
                                if (parts.length === 3) txDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')} 12:00`;
                            } else if (rawD.substring(4, 5) === '-') {
                                txDate = rawD.replace('T', ' ').substring(0, 16);
                                if (txDate.length === 10) txDate += " 12:00";
                            }
                        }
                    }

                    if (typeStr.includes('rút tiền')) {
                        newTransactions.push({
                            id: 'TXN_WD_' + Date.now() + '_' + i,
                            type: 'Điều Chuyển',
                            category: 'Rút Tiền Shopee',
                            amount: Math.abs(rowAmt),
                            fromAccount: finalWalletName,
                            toAccount: finalBankName,
                            title: `Rút tiền từ Ví Shopee`,
                            date: txDate,
                            note: descStr,
                            isAuto: true
                        });
                        logs.push(`✅ Rút tiền về Ngân hàng: ${Math.abs(rowAmt).toLocaleString('vi-VN')}đ`);
                    }
                }
            } else {
                alert('Định dạng file không được hỗ trợ. Hãy tải lên Báo cáo doanh thu (Income) hoặc Báo cáo số dư ví!');
                setIsProcessing(false);
                return;
            }

            setPreviewLogs(logs);
            setResultPayload({
                orders: updatedOrders,
                Transactions: newTransactions,
                Accounts: newAccounts.length > 0 ? newAccounts : undefined
            });
            setProgress(100);
            setIsProcessing(false);
        };

        const handleUpload = async (file) => {
            if (!file) return;
            setFileName(file.name); setIsProcessing(true); setProgress(0); setPreviewLogs([]);
            try {
                if (typeof window.ensureXLSXLoaded === 'function') {
                    await window.ensureXLSXLoaded();
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        let wb;
                        const data = new Uint8Array(e.target.result);
                        try {
                            wb = window.XLSX.read(data, { type: 'array' });
                        } catch (errArr) {
                            wb = window.XLSX.read(e.target.result, { type: 'binary' });
                        }
                        let bestRows = [];
                        for (let s of wb.SheetNames) {
                            const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[s], { header: 1, defval: '' });
                            let foundHeader = false;
                            for (let i = 0; i < Math.min(15, rows.length); i++) {
                                const rowStr = (rows[i] || []).join(' ').toLowerCase();
                                if (rowStr.includes('mã đơn hàng') || rowStr.includes('mã giao dịch') || rowStr.includes('loại giao dịch') || rowStr.includes('order id') || rowStr.includes('mã tham chiếu')) {
                                    foundHeader = true; break;
                                }
                            }
                            if (foundHeader && rows.length > bestRows.length) {
                                bestRows = rows;
                            }
                        }
                        if (bestRows.length === 0) bestRows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
                        processExcel(bestRows);
                    } catch (err) {
                        console.error("Lỗi đọc file Excel:", err);
                        alert("Lỗi đọc file Excel!");
                        setIsProcessing(false);
                    }
                };
                reader.readAsArrayBuffer(file);
            } catch (loadErr) {
                console.error("Lỗi nạp thư viện XLSX:", loadErr);
                alert("Không thể nạp thư viện xử lý Excel. Vui lòng thử lại!");
                setIsProcessing(false);
            }
        };

        const submit = async () => {
            if (!resultPayload) return;
            setIsProcessing(true);
            try {
                await pushDeltas(resultPayload, 'Đã lưu đối soát tài chính!', 'fa-check-circle');
                onClose();
            } catch (e) {
                alert('Lỗi lưu dữ liệu: ' + e.message);
                setIsProcessing(false);
            }
        };

        return (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[9999] p-4 backdrop-blur-md">
                <div className="bg-[#111] border border-emerald-500/30 w-full max-w-4xl rounded-2xl flex flex-col max-h-[90vh] shadow-[0_0_50px_rgba(16,185,129,0.1)] overflow-hidden">
                    <div className="p-4 border-b border-[#222] flex justify-between items-center bg-[#0a0a0a]">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-500 flex items-center justify-center border border-emerald-500/30 shadow-sm">
                                <i className="fas fa-file-invoice-dollar text-lg"></i>
                            </div>
                            <div>
                                <div className="font-black text-lg text-white tracking-wide">TRẠM QUÉT FILE ĐƠN HÀNG (ORDER.ALL)</div>
                                <div className="text-[10px] text-emerald-500 font-bold tracking-widest uppercase">Cập nhật sản phẩm, phí sàn & doanh thu chuẩn</div>
                            </div>
                        </div>
                        <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-rose-500 flex items-center justify-center transition-colors"><i className="fas fa-times"></i></button>
                    </div>

                    <div className="p-5 flex-1 overflow-y-auto custom-scrollbar flex flex-col">
                        {!resultPayload ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-center p-10 animate-fade-in">
                                <i className="fas fa-cloud-upload-alt text-6xl text-emerald-500/30 mb-5"></i>
                                <h3 className="text-xl font-black text-white mb-2">Tải Báo Cáo Shopee Lên Đây</h3>
                                <p className="text-sm text-gray-400 mb-6 max-w-md">Hỗ trợ 2 loại file: Báo cáo doanh thu (Income) để đối soát đơn hàng, hoặc Báo cáo số dư ví để ghi nhận rút tiền.</p>

                                <label className="relative overflow-hidden cursor-pointer bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-black px-8 py-3.5 rounded-xl shadow-lg shadow-emerald-900/30 transition-all active:scale-95 group border border-emerald-400/30">
                                    <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={(e) => handleUpload(e.target.files[0])} />
                                    <span className="flex items-center gap-2"><i className="fas fa-file-excel group-hover:animate-bounce"></i> TẢI FILE EXCEL</span>
                                </label>

                                {isProcessing && <div className="mt-5 text-emerald-500 font-bold animate-pulse"><i className="fas fa-spinner fa-spin mr-2"></i> Đang phân tích dữ liệu AI...</div>}
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col animate-slide-up">
                                <div className="bg-[#1a1a1a] border border-[#333] rounded-xl p-4 mb-4 flex justify-between items-center shadow-inner">
                                    <div>
                                        <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Loại Báo Cáo Nhận Diện</div>
                                        <div className="text-emerald-400 font-bold text-lg"><i className="fas fa-check-circle mr-1"></i> {reportType}</div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Tệp tin đang xử lý</div>
                                        <div className="text-white font-bold">{fileName}</div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-4 text-center shadow-sm">
                                        <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Đơn Hàng Đã Chốt</div>
                                        <div className="text-3xl font-black text-blue-500">{resultPayload.Orders?.length || 0}</div>
                                    </div>
                                    <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-4 text-center shadow-sm">
                                        <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1">Phiếu Kế Toán Mới</div>
                                        <div className="text-3xl font-black text-emerald-500">{resultPayload.Transactions?.length || 0}</div>
                                    </div>
                                </div>

                                <div className="flex-1 bg-[#0a0a0a] border border-[#222] rounded-xl overflow-hidden flex flex-col shadow-inner">
                                    <div className="bg-[#111] border-b border-[#222] p-3 text-[10px] font-black text-gray-500 uppercase tracking-widest flex justify-between items-center">
                                        <span><i className="fas fa-list-alt mr-1 text-[#333]"></i> Chi tiết đối soát tự động</span>
                                        <span>{previewLogs.length} dòng dữ liệu</span>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-3 space-y-1.5 custom-scrollbar text-[11px] font-medium">
                                        {previewLogs.length === 0 && <div className="text-gray-500 text-center py-4">Không có giao dịch nào mới để ghi nhận.</div>}
                                        {previewLogs.length > 0 && typeof previewLogs[0] === 'object' ? (
                                            <div className="w-full overflow-x-auto">
                                                <table className="w-full min-w-[700px] text-left border-collapse">
                                                    <thead>
                                                        <tr className="border-b border-[#333] text-gray-400 text-[10px] uppercase tracking-wider">
                                                            <th className="p-2 font-black">Trạng thái</th>
                                                            <th className="p-2 font-black">Mã Đơn</th>
                                                            <th className="p-2 font-black text-right">Giá Trị Nội Bộ</th>
                                                            <th className="p-2 font-black text-right text-emerald-500">Gross Shopee</th>
                                                            <th className="p-2 font-black text-right text-rose-400">Phí Sàn</th>
                                                            <th className="p-2 font-black text-right text-rose-400">Phí Vận Chuyển</th>
                                                            <th className="p-2 font-black text-right text-blue-400">Net Thực Nhận</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {previewLogs.map((log, idx) => (
                                                            <tr key={idx} className={`border-b border-[#222] hover:bg-[#1a1a1a] transition-colors ${log.isError ? 'opacity-50 grayscale' : ''} ${log.isWarning ? 'bg-rose-900/10' : ''}`}>
                                                                <td className="p-2">
                                                                    {log.isError ? <span className="text-gray-500"><i className="fas fa-times-circle mr-1"></i> Bỏ qua</span> :
                                                                        log.isWarning ? <span className="text-rose-500 font-bold animate-pulse"><i className="fas fa-exclamation-triangle mr-1"></i> Lệch lớn</span> :
                                                                            <span className="text-emerald-500"><i className="fas fa-check-circle mr-1"></i> OK</span>}
                                                                </td>
                                                                <td className="p-2 font-mono text-gray-300">{log.oCode}</td>
                                                                <td className="p-2 text-right text-gray-400">{log.expected ? Number(log.expected).toLocaleString('vi-VN') + 'đ' : '-'}</td>
                                                                <td className="p-2 text-right text-emerald-400 font-bold">{log.grossRevenue ? Number(log.grossRevenue).toLocaleString('vi-VN') + 'đ' : '-'}</td>
                                                                <td className="p-2 text-right text-rose-300">{log.totalFees ? '-' + Number(log.totalFees).toLocaleString('vi-VN') + 'đ' : '-'}</td>
                                                                <td className="p-2 text-right text-rose-400 font-bold">{log.shippingFee ? '-' + Number(log.shippingFee).toLocaleString('vi-VN') + 'đ' : '-'}</td>
                                                                <td className="p-2 text-right text-blue-400 font-black">{log.netRevenue ? Number(log.netRevenue).toLocaleString('vi-VN') + 'đ' : '-'}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        ) : (
                                            previewLogs.map((log, idx) => (
                                                <div key={idx} className={`p-1.5 rounded bg-[#111] border border-[#222] ${log.includes('✅') ? 'text-emerald-400' : log.includes('❌') ? 'text-rose-400' : 'text-gray-400'}`}>
                                                    {log}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {resultPayload && (
                        <div className="p-4 border-t border-[#222] bg-[#0a0a0a] flex gap-3 shrink-0">
                            <button onClick={() => { setResultPayload(null); setPreviewLogs([]); }} disabled={isProcessing} className="flex-1 py-3 bg-[#222] hover:bg-[#333] text-gray-300 font-black rounded-xl active:scale-95 transition-all text-[13px] border border-[#333]">
                                HUỶ BỎ
                            </button>
                            <button onClick={submit} disabled={isProcessing || (resultPayload.Orders?.length === 0 && resultPayload.Transactions?.length === 0)} className="flex-[2] py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-black rounded-xl shadow-lg shadow-emerald-900/30 active:scale-95 transition-all text-[13px] flex items-center justify-center gap-2 border border-emerald-400/30 disabled:opacity-50 disabled:grayscale">
                                {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> ĐANG LƯU DỮ LIỆU...</> : <><i className="fas fa-save"></i> HOÀN TẤT ĐỐI SOÁT & LƯU</>}
                            </button>
                        </div>
                    )}
                </div>
            </div>
        );
    }
</script>
