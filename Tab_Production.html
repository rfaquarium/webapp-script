<script type="text/babel">
    // =========================================================================
    // 🔨 FILE: Tab_Production.txt
    // CHỨC NĂNG: Giao diện Xưởng sản xuất, chia việc cho thợ, theo dõi tiến độ
    // =========================================================================

    // -------------------------------------------------------------------------
    // MỤC 1: COMPONENT CÁC KHÂU NHỎ BÊN TRONG (WorkerPhaseV2)
    // -------------------------------------------------------------------------
    const WorkerPhaseV2 = React.memo(function WorkerPhaseV2({ attendance, item, c, configs, order, prodItems, erpProducts, currentUser, pushDeltas, userConfigs, triggerToast, kpiConfig, isAdmin }) {
        const isCTV = localStorage.getItem('rf_role') === 'CTV';
        const roleStr = String(userConfigs?.[currentUser]?.role || localStorage.getItem('rf_role') || '').toUpperCase();
        const isSenior = isAdmin && (roleStr === 'TỐI CAO' || currentUser === 'TỐI CAO');

        // KIỂM TRA PHÂN QUYỀN TỰ ĐỘNG DUYỆT CỦA TỐI CAO (LAYOUT) VÀ QUẢN LÝ KHO (BỂ KÍNH)
        const activeRole = String(localStorage.getItem('rf_role') || roleStr || '').toUpperCase();
        const isBossRole = activeRole === 'TỐI CAO' || roleStr === 'TỐI CAO' || currentUser === 'TỐI CAO' || currentUser === 'Đỗ Tiến' || currentUser === 'Tài';
        const isWhManager = activeRole === 'QUẢN LÝ KHO' || roleStr === 'QUẢN LÝ KHO';

        const itemTypeUpper = String(item.type || item.category || '').toUpperCase();
        const itemNameLower = String(item.name || '').toLowerCase();
        const isLayoutProduct = itemTypeUpper.includes('LAYOUT') || itemNameLower.includes('layout') || itemNameLower.includes('rừng') || itemNameLower.includes('bonsai') || itemNameLower.includes('vách suối') || itemNameLower.includes('hẻm núi') || itemNameLower.includes('nhất trụ') || itemNameLower.includes('đảo bay') || itemNameLower.includes('hang động');
        const isGlassProduct = itemTypeUpper.includes('BỂ KÍNH') || itemNameLower.includes('bể') || itemNameLower.includes('kính') || itemNameLower.includes('terarium') || itemNameLower.includes('bán cạn') || itemNameLower.includes('betta');

        // Miễn duyệt Khâu 1 & Tự động KCS Khâu 2 nếu đúng phân quyền và loại hàng
        const isAutoBypassQC = (isLayoutProduct && isBossRole) || (isGlassProduct && isWhManager) || isBossRole;

        const data = (item.phases || {})[c.k] || { status: 'Pending' };
        const [processing, setProcessing] = React.useState(false);
        const [isEditingUser, setIsEditingUser] = React.useState(false);
        const [qcFront, setQcFront] = React.useState(null);
        const [qcSide, setQcSide] = React.useState(null);

        const parseDateSafe = (val) => {
            if (!val) return NaN;
            const str = String(val).trim();
            if (!str) return NaN;
            let s = str;
            if (s.includes(' ')) {
                s = s.replace(' ', 'T');
            }
            if (s.includes('T') && s.split(':').length === 2) {
                s += ':00';
            }
            const t = new Date(s).getTime();
            if (!isNaN(t)) return t;
            return new Date(val).getTime();
        };

        let isLocked = c.req.some(rk => (item.phases[rk] || {}).status !== 'Done');

        if (c.k === 'phase2' && item.phases?.phase1) {
            const isLegacyDone = item.phases.phase1.status === 'Done' && !item.qc_status && !item.qc_front_photo;
            if (!isLegacyDone && !String(item.qc_status || '').includes('Đã duyệt') && !isAutoBypassQC) {
                isLocked = true;
            }
        }

        const isOwner = !data.user || String(data.user).trim() === '' || data.user === currentUser;
        const isPending = data.status !== 'In Progress' && data.status !== 'Done';
        const isInProgress = data.status === 'In Progress';
        const isDone = data.status === 'Done';

        const [timeText, setTimeText] = React.useState('');
        const [timeColorClass, setTimeColorClass] = React.useState('text-emerald-500');
        const [progressPercent, setProgressPercent] = React.useState(100);

        // Lấy định mức thời gian từ Config_KPI
        const kpiData = React.useMemo(() => {
            return typeof getSopAndReward === 'function'
                ? getSopAndReward(item, c.n, kpiConfig || [], order?.channel)
                : { time: 30, reward: 0 };
        }, [item, c.n, kpiConfig, order]);

        const limitMins = kpiData.time || 30;

        React.useEffect(() => {
            if (!isInProgress || !data.start) return;

            const updateTimer = () => {
                const startMs = parseDateSafe(data.start);
                let nowMs = Date.now();
                if (item.qc_status === 'Chờ duyệt khung' && data.endTime) {
                    nowMs = parseDateSafe(data.endTime);
                }
                if (isNaN(startMs)) return;

                const elapsedMs = nowMs - startMs;
                const elapsedMins = elapsedMs / 60000;
                const remainingMins = limitMins - elapsedMins;

                if (remainingMins <= 0) {
                    const overdueMs = Math.abs(remainingMins) * 60000;
                    const overdueH = Math.floor(overdueMs / 3600000);
                    const overdueM = Math.floor((overdueMs % 3600000) / 60000);
                    const overdueS = Math.floor((overdueMs % 60000) / 1000);
                    const overdueText = overdueH > 0
                        ? `${overdueH}h:${String(overdueM).padStart(2, '0')}m`
                        : `${overdueM}:${String(overdueS).padStart(2, '0')}`;

                    setTimeText(`Quá giờ ${overdueText}`);
                    setTimeColorClass('text-rose-500 animate-pulse font-black');
                    setProgressPercent(0);
                } else {
                    const remainingMs = remainingMins * 60000;
                    const remH = Math.floor(remainingMs / 3600000);
                    const remM = Math.floor((remainingMs % 3600000) / 60000);
                    const remS = Math.floor((remainingMs % 60000) / 1000);
                    const remText = remH > 0
                        ? `${remH}h:${String(remM).padStart(2, '0')}m`
                        : `${remM}:${String(remS).padStart(2, '0')}`;

                    setTimeText(`Còn ${remText}`);
                    const ratio = remainingMins / limitMins;
                    setProgressPercent(ratio * 100);
                    if (ratio <= 0.25) {
                        setTimeColorClass('text-amber-500 font-black animate-pulse');
                    } else {
                        setTimeColorClass('text-emerald-400 font-bold');
                    }
                }
            };

            updateTimer();
            const interval = setInterval(updateTimer, 1000);
            return () => clearInterval(interval);
        }, [isInProgress, data.start, limitMins]);

        const completedDurationText = React.useMemo(() => {
            const startMs = parseDateSafe(data.start);
            const endMs = parseDateSafe(data.endTime);
            if (isNaN(startMs) || !endMs) return '';
            const diffMins = Math.round((endMs - startMs) / 60000);
            return `Làm mất ${diffMins} phút`;
        }, [isDone, data.start, data.endTime]);

        if (isLocked) return null;

        const act = async (s) => {
            if (item.assignee && String(item.assignee).trim() !== '' && String(item.assignee).trim() !== String(currentUser).trim() && !isAdmin) {
                triggerToast(`Lệnh này đã được chỉ định cho ${item.assignee}. Bạn không thể nhận!`, 'fa-lock', 'danger');
                return;
            }

            if (s === 'In Progress') {
                const hasActiveCheckin = (attendance || []).some(a =>
                    String(a.user).trim() === currentUser.trim() &&
                    a.timeIn && !a.timeOut
                );
                if (!hasActiveCheckin) {
                    triggerToast('Bạn phải Chấm Công vào ca trước khi bắt đầu làm việc!', 'fa-exclamation-triangle', 'danger');
                    return;
                }
            }

            setProcessing(true);
            const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
            const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

            const upd = JSON.parse(JSON.stringify(item));
            upd.phases[c.k] = {
                ...upd.phases[c.k],
                status: s,
                user: currentUser,
                date: currentDateTime.split(' ')[0],
                start: s === 'In Progress' ? currentDateTime : data.start,
                endTime: s === 'Done' ? currentDateTime : ''
            };

            let penaltyPayload = null;
            let payloadDeltas = { prodItems: [upd] };

            if (s === 'Done') {
                const startMs = parseDateSafe(data.start);
                const endMs = parseDateSafe(currentDateTime);
                let durationMins = 0;
                let isLate = false;
                let slaPenaltyRatio = 0;

                if (!isNaN(startMs) && !isNaN(endMs)) {
                    durationMins = Math.round((endMs - startMs) / 60000);

                    // 1. Anti-cheat (< 2 phút)
                    if (durationMins < 2) {
                        if (!window.confirm(`CẢNH BÁO ANTI-CHEAT: Bạn bấm Hoàn thành khi chưa đủ 2 phút làm việc. Hệ thống sẽ ghi nhận lỗi vi phạm thao tác (phạt 10.000đ). Vẫn tiếp tục?`)) {
                            setProcessing(false);
                            return;
                        }
                        penaltyPayload = {
                            id: 'BP_ANTICHEAT_' + Date.now(),
                            user: currentUser,
                            amount: -10000,
                            type: 'Phạt Vi Phạm',
                            note: `Bấm hoàn thành quá nhanh (< 2 phút) cho khâu ${c.n}`,
                            date: currentDateTime.split(' ')[0],
                            orderCode: item.orderId || ''
                        };
                        payloadDeltas.BonusPenalty = [penaltyPayload];
                    }

                    // 2. SLA Phạt trễ
                    if (durationMins > limitMins) {
                        isLate = true;
                        const overdueMins = durationMins - limitMins;
                        if (overdueMins <= 2) {
                            slaPenaltyRatio = 0.5; // Trễ <= 2 phút (ân hạn): Trừ 50%
                        } else {
                            slaPenaltyRatio = 1.0; // Trễ > 2 phút: Trừ 100%
                        }
                    }
                }

                let baseReward = (item.note === 'Chất Lượng Kém') ? 0 : (kpiData.reward || 0);
                if (slaPenaltyRatio > 0) {
                    baseReward = baseReward * (1 - slaPenaltyRatio);
                    upd.phases[c.k].note = `Trễ hạn ${Math.round((endMs - startMs) / 60000) - limitMins}p - Phạt ${slaPenaltyRatio * 100}% KPI`;
                }
                upd.phases[c.k].reward_vnd = baseReward;
            }

            if (s === 'Done' && isAdmin) upd.phases[c.k].adminCompleted = true;

            const p1 = upd.phases['phase1']?.status || 'Pending';
            const p2 = upd.phases['phase2']?.status || 'Pending';
            const isAllDone = (p1 === 'Done' && p2 === 'Done');
            if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';
            if (isAllDone) {
                if (upd.phases['phase1']?.adminCompleted || upd.phases['phase2']?.adminCompleted || isAdmin) {
                    upd.status = 'Done';
                } else {
                    upd.status = 'Kiểm Định';
                }
            }

            await pushDeltas(payloadDeltas, s === 'In Progress' ? `Đã nhận ${c.n}` : `Xong ${c.n}`, s === 'In Progress' ? 'fa-play' : 'fa-check');
            setProcessing(false);
        };

        const handlePhotoUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setProcessing(true);
            try {
                const b64 = typeof resizeImage === 'function' ? await resizeImage(file) : await new Promise((res, rej) => { const rd = new FileReader(); rd.onload = () => res(rd.result.split(',')[1]); rd.readAsDataURL(file); });
                const url = await runGAS('uploadImage', b64, `SX_${item.id}_${c.k}.jpg`);
                if (!url) {
                    throw new Error("Không thể tải ảnh lên Drive. Vui lòng kiểm tra lại quyền truy cập hoặc dung lượng Drive.");
                }

                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
                const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

                const upd = JSON.parse(JSON.stringify(item));
                upd.phases[c.k] = {
                    ...upd.phases[c.k],
                    status: 'Done',
                    user: currentUser,
                    date: currentDateTime.split(' ')[0],
                    start: data.start || currentDateTime,
                    endTime: currentDateTime,
                    photo: url
                };
                if (c.k === 'phase1') {
                    upd.qc_front_photo = url;
                    if (isSenior || isAutoBypassQC || isBossRole) {
                        upd.qc_status = 'Đã duyệt (Auto-Pass)';
                    } else {
                        upd.qc_status = 'Chờ duyệt khung';
                    }
                }

                let penaltyPayload = null;
                let payloadDeltas = { prodItems: [upd] };

                let durationMins = 0;
                let isLate = false;
                let slaPenaltyRatio = 0;

                if (upd.phases[c.k].start) {
                    const startMs = parseDateSafe(upd.phases[c.k].start);
                    const endMs = parseDateSafe(currentDateTime);
                    if (!isNaN(startMs) && !isNaN(endMs)) {
                        durationMins = Math.round((endMs - startMs) / 60000);

                        // Anti-cheat (< 2 phút)
                        if (durationMins < 2) {
                            if (!window.confirm(`CẢNH BÁO ANTI-CHEAT: Bạn bấm Hoàn thành khi chưa đủ 2 phút làm việc. Hệ thống sẽ ghi nhận lỗi vi phạm thao tác (phạt 10.000đ). Vẫn tiếp tục?`)) {
                                setProcessing(false);
                                return;
                            }
                            penaltyPayload = {
                                id: 'BP_ANTICHEAT_' + Date.now(),
                                user: currentUser,
                                amount: -10000,
                                type: 'Phạt Vi Phạm',
                                note: `Bấm hoàn thành quá nhanh (< 2 phút) cho khâu ${c.n}`,
                                date: currentDateTime.split(' ')[0],
                                orderCode: item.orderId || ''
                            };
                            payloadDeltas.BonusPenalty = [penaltyPayload];
                        }

                        if (durationMins > limitMins) {
                            isLate = true;
                            const overdueMins = durationMins - limitMins;
                            if (overdueMins <= 2) {
                                slaPenaltyRatio = 0.5;
                            } else {
                                slaPenaltyRatio = 1.0;
                            }
                        }
                    }
                }

                let baseReward = (item.note === 'Chất Lượng Kém') ? 0 : (kpiData.reward || 0);
                if (slaPenaltyRatio > 0) {
                    baseReward = baseReward * (1 - slaPenaltyRatio);
                    upd.phases[c.k].note = `Trễ hạn ${durationMins - limitMins}p - Phạt ${slaPenaltyRatio * 100}% KPI`;
                }
                upd.phases[c.k].reward_vnd = baseReward;

                if (isSenior || isAutoBypassQC) upd.phases[c.k].adminCompleted = true;

                const p1 = upd.phases['phase1']?.status || 'Pending';
                const p2 = upd.phases['phase2']?.status || 'Pending';
                const isAllDone = (p1 === 'Done' && p2 === 'Done');
                if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';
                if (isAllDone) {
                    if (upd.phases['phase1']?.adminCompleted || upd.phases['phase2']?.adminCompleted || isSenior || isAutoBypassQC) {
                        upd.status = 'Done';
                        upd.qc_status = 'Đã duyệt (Tự động KCS)';

                        // Gọi API trừ tồn kho BOM & đối soát tự động đóng gói đơn hàng
                        fetch(window.SCRIPT_URL || '', {
                            method: 'POST',
                            body: JSON.stringify({ action: 'deductInventoryBOM', pin: localStorage.getItem('rf_pin'), prodId: upd.id })
                        }).then(r => r.json()).catch(console.error);

                        if (order && order.id) {
                            await checkAndToggleOrderReadiness(order, prodItems, erpProducts);
                        }
                    } else {
                        upd.status = 'Kiểm Định';
                    }
                }

                await pushDeltas(payloadDeltas, `Tải ảnh & hoàn thành ${c.n}`, 'fa-check-double');
                if (isLate || durationMins < 2) {
                    triggerToast(`Có lỗi vi phạm thao tác/trễ hạn. Đã ghi nhận phạt!`, 'fa-times-circle', 'danger');
                } else {
                    triggerToast(`Tải ảnh & hoàn thành ${c.n} thành công!`, 'fa-check', 'success');
                }

                // CẢNH BÁO TỒN KHO THÔNG MINH
                if (erpProducts && Array.isArray(erpProducts)) {
                    const sku = String(item.sku || '').trim().toLowerCase();
                    const pName = String(item.name || '').trim().toLowerCase();
                    const matchedProd = erpProducts.find(p =>
                        (sku && String(p.sku).trim().toLowerCase() === sku) ||
                        (pName && String(p.name).trim().toLowerCase() === pName)
                    );
                    if (matchedProd) {
                        const qty = Number(matchedProd.quantity) || 0;
                        const minStk = Number(matchedProd.minStock) || 0;
                        if (qty <= minStk) {
                            setTimeout(() => {
                                triggerToast(`🚨 KHO SẮP CẠN: ${matchedProd.name} (Còn ${qty} - Định mức ${minStk}). Cần bổ sung!`, 'fa-exclamation-triangle', 'danger');
                            }, 1500);
                        }
                    }
                }
            } catch (err) {
                console.error(err);
                triggerToast(`Lỗi tải ảnh!`, 'fa-times', 'danger');
            } finally {
                e.target.value = '';
                setProcessing(false);
            }
        };

        // ==========================================
        // CHỐT CHẶN TIỀN TRẠM (PRE-FLIGHT CHECK) KHI HOÀN THÀNH KCS
        // ==========================================
        const checkAndToggleOrderReadiness = async (targetOrder, allProdItems, currentErpProducts) => {
            // Lọc ra toàn bộ các sản phẩm con cùng thuộc đơn hàng gốc này
            const orderProds = (allProdItems || []).filter(p => String(p.orderId) === String(targetOrder.id) && !p.fulfilledFromStock);
            const isAllProdDone = orderProds.every(p => {
                if (p.id === item.id) return true;
                const s = String(p.status).toUpperCase().trim();
                return s === 'DONE' || s === 'ĐÃ XONG' || s === 'HỦY/VỠ' || s === 'HOÀN KHO ĐẠT';
            });

            if (isAllProdDone && (targetOrder.status === 'Chờ Sản Xuất' || targetOrder.status === 'Quét Tự Động' || targetOrder.status === 'Đang Sản Xuất')) {
                // Giải mã mảng phụ kiện đi kèm đơn hàng an toàn toàn cục
                let accList = typeof window.safeParseAccessories === 'function'
                    ? window.safeParseAccessories(targetOrder.accessories)
                    : [];

                if (!accList || accList.length === 0) {
                    try { accList = JSON.parse(targetOrder.accessories); } catch (e) { accList = []; }
                }

                let isShortOfAccessories = false;
                let warningDetails = [];

                // Duyệt qua từng phụ kiện để đối soát số lượng tồn kho thực tế
                accList.forEach(acc => {
                    const matchProduct = (currentErpProducts || []).find(p => String(p.name).trim() === String(acc.name).trim());
                    const availableQty = matchProduct ? (Number(matchProduct.quantity) || 0) : 0;
                    const requiredQty = Number(acc.quantity) || 1;

                    if (availableQty < requiredQty) {
                        isShortOfAccessories = true;
                        warningDetails.push(`${acc.name} (Thiếu ${requiredQty - availableQty})`);
                    }
                });

                let updatedOrder = { ...targetOrder };
                let finalStatus = '';

                if (isShortOfAccessories) {
                    finalStatus = 'Chờ Phụ Kiện';
                    updatedOrder.status = finalStatus;
                    updatedOrder.note = String(updatedOrder.note || '') + ` [Cảnh báo: Thiếu phụ kiện đóng gói: ${warningDetails.join(', ')}]`;
                } else {
                    finalStatus = 'Sẵn Sàng Đóng Gói';
                    updatedOrder.status = finalStatus;
                }

                await pushDeltas(
                    { orders: [updatedOrder] },
                    `Đơn hàng #${targetOrder.orderCode || targetOrder.id} đã chuyển trạng thái sang: ${finalStatus}`,
                    isShortOfAccessories ? 'fa-boxes-packing' : 'fa-check-double'
                );
            }
        };

        const submitQC = async (b64Front) => {
            const targetB64 = b64Front || qcFront;
            if (!targetB64) return;
            setProcessing(true);
            try {
                const urlFront = await runGAS('uploadQCImage', targetB64, `QC_FRONT_${item.id}.jpg`);
                const urlSide = '';
                if (!urlFront) throw new Error("Không thể tải ảnh QC");

                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
                const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

                const upd = JSON.parse(JSON.stringify(item));
                upd.qc_front_photo = urlFront;
                upd.qc_side_photo = urlSide;
                upd.phases[c.k].photo = urlFront;
                upd.phases[c.k].endTime = currentDateTime;

                let payload = { prodItems: [upd] };
                // PHÂN QUYỀN DUYỆT TỰ ĐỘNG KHÂU 1 KHI CHỤP/TẢI ẢNH:
                // - Layout: Quyền TỐI CAO (isBoss)
                // - Bể Kính: Quyền QUẢN LÝ KHO (isManager || isBoss || userRole chứa KHO / Dương / Tâm)
                const itemType = String(item.type || '').trim().toLowerCase();
                const isBeKinh = itemType === 'bể kính' || itemType.includes('bể');
                const isLayout = !isBeKinh;

                const isKhoManager = isManager || isBoss || String(userRole || '').toUpperCase().includes('KHO') || String(currentUser || '').includes('Dương') || String(currentUser || '').includes('Tâm');
                const isAutoBypassQC = isLayout ? isBoss : isKhoManager;

                let msg = 'Đã gửi duyệt QC';
                let icon = 'fa-check';

                if (isAutoBypassQC) {
                    upd.qc_status = 'Đã duyệt (Auto-Pass)';
                    upd.phases[c.k].status = 'Done';

                    if (c.k === 'phase1' && upd.phases['phase2'] && upd.phases['phase2'].status === 'Pending') {
                        let selectedWorker = null;
                        if (attendance && attendance.length > 0) {
                            const todayStr = safeDateFull.slice(0, 10);
                            const activeWorkers = attendance.filter(a => a.timeIn && !a.timeOut && String(a.date).startsWith(todayStr));
                            if (activeWorkers.length > 0) {
                                const others = activeWorkers.filter(a => a.user !== currentUser);
                                selectedWorker = (others.length > 0 ? others[0] : activeWorkers[0]).user;
                            }
                        }
                        if (selectedWorker) {
                            upd.phases['phase2'].status = 'In Progress';
                            upd.phases['phase2'].user = selectedWorker;
                            upd.phases['phase2'].start = currentDateTime;
                        }
                    }

                    fetch(window.SCRIPT_URL || '', {
                        method: 'POST',
                        body: JSON.stringify({ action: 'deductInventoryBOM', pin: localStorage.getItem('rf_pin'), prodId: upd.id })
                    }).then(r => r.json()).then(res => {
                        if (!res.success) console.warn("Lỗi trừ tồn kho BOM:", res.message);
                    }).catch(console.error);

                    const p1 = upd.phases['phase1']?.status || 'Pending';
                    const p2 = upd.phases['phase2']?.status || 'Pending';
                    const isAllDone = (p1 === 'Done' && p2 === 'Done');
                    if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';

                    if (isAllDone) {
                        upd.status = 'Done';
                        if (order && order.id) {
                            await checkAndToggleOrderReadiness(order, prodItems, erpProducts);
                        }
                    }
                    msg = `Đã Auto-Pass QC ${c.n}`;
                    icon = 'fa-check-double';
                } else {
                    upd.qc_status = 'Chờ duyệt khung';
                }

                await pushDeltas(payload, msg, icon);

    // -------------------------------------------------------------------------
    // MỤC 2: COMPONENT THẺ HIỂN THỊ BAO NGOÀI (WorkerCardV2)

    const WorkerCardV2 = React.memo(function WorkerCardV2({ attendance, item, order, prodItems, erpProducts, currentUser, pushDeltas, configs, userConfigs, triggerToast, kpiConfig, idx_num, isAdmin, orders, models3D, onEditItem }) {
        const isCTV = localStorage.getItem('rf_role') === 'CTV';

        const canApproveQC = isAdmin || isBossRole || userRole === 'TỐI CAO' || userRole === 'QUẢN LÝ SẢN XUẤT' || userRole === 'QUẢN LÝ KHO' || userRole === 'QUẢN LÝ BÁN HÀNG' || userRole === 'BÁN HÀNG';
        const [optimisticItem, setOptimisticItem] = React.useState(null);

        const [previewImg, setPreviewImg] = React.useState(null);

        const [showReworkForm, setShowReworkForm] = React.useState(false);

        const getModelForProduct = (productId) => {
            if (!models3D || !erpProducts) return null;
            const prod = erpProducts.find(p => p.id === productId);
            if (!prod) return null;
            let baseName = prod.name || '';
            if (baseName.includes(' - ')) baseName = baseName.split(' - ')[0].trim();

            const sameBaseProds = erpProducts.filter(p => {
                let bn = p.name || '';
                if (bn.includes(' - ')) bn = bn.split(' - ')[0].trim();
                return bn.toLowerCase() === baseName.toLowerCase();
            });

            return models3D.find(m => sameBaseProds.some(p => p.id === m.productId));
        };

        React.useEffect(() => { setOptimisticItem(null); }, [item]);

        const _item = optimisticItem || item;
        const wrappedPushDeltas = (payload, msg, icon) => {
            if (payload.prodItems && payload.prodItems[0]) { setOptimisticItem(payload.prodItems[0]); }
            return pushDeltas(payload, msg, icon).catch(() => triggerToast("Đang đồng bộ ngầm...", "fa-wifi", "warning"));
        };

        const fmtImg = (url) => {
            if (!url || typeof url !== 'string') return '';
            const str = url.trim();
            if (str.includes('drive.google.com/file/d/')) {
                const match = str.match(/\/d\/([^/]+)/);
                return match ? ('https:\x2F\x2Fdrive.google.com/uc?export=view&id=' + match[1]) : str;
            }
            if (str.includes('drive.google.com/open?id=')) {
                const match = str.match(/id=([^&]+)/);
                return match ? ('https:\x2F\x2Fdrive.google.com/uc?export=view&id=' + match[1]) : str;
            }
            return str;
        };

        const getProductInfoSmart = (rawName) => {
            if (!rawName) return null;
            const prodList = erpProducts || [];
            const rawLower = String(rawName).trim().toLowerCase();

            let match = prodList.find(x => String(x.name || '').trim().toLowerCase() === rawLower && (x.image || x.realImage));
            if (!match) match = prodList.find(x => String(x.name || '').trim().toLowerCase() === rawLower);
            if (match && (match.image || match.realImage)) {
                return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
            }

            const norm = (str) => String(str || '').toLowerCase()
                .replace(/ver\.?\s*/gi, 'ver')
                .replace(/[^a-z0-9àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/gi, ' ')
                .replace(/\s+/g, ' ').trim();

            const normRaw = norm(rawName);
            const rawBaseName = norm(rawName.split(' - ')[0].split('–')[0].split('—')[0]);

            if (rawBaseName) {
                match = prodList.find(x => {
                    const xBase = norm(String(x.name || '').split(' - ')[0].split('–')[0].split('—')[0]);
                    const xNorm = norm(x.name);
                    return (xBase === rawBaseName || xNorm === rawBaseName) && (x.image || x.realImage);
                });
                if (match) {
                    return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
                }
            }

            const verMatch = normRaw.match(/ver\s*(\d+)/);
            if (verMatch && verMatch[1]) {
                const targetVer = `ver${verMatch[1]}`;
                match = prodList.find(x => {
                    const xNorm = norm(x.name);
                    return xNorm.includes(targetVer) && (x.image || x.realImage);
                });
                if (match) {
                    return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
                }
            }

            if (normRaw.length >= 3) {
                const sorted = [...prodList].filter(x => x.image || x.realImage).sort((a, b) => (b.name || '').length - (a.name || '').length);
                match = sorted.find(x => {
                    const xNorm = norm(x.name);
                    const xBase = norm(String(x.name || '').split(' - ')[0].split('–')[0].split('—')[0]);
                    if (rawBaseName && rawBaseName.includes('ver') && !xBase.includes('ver')) return false;
                    return xNorm && xNorm.length >= 3 && (normRaw.includes(xNorm) || xNorm.includes(normRaw));
                });
                if (match) {
                    return { ...match, image: fmtImg(match.image || match.realImage), realImage: fmtImg(match.realImage || match.image) };
                }
            }

            const finalFallback = match || prodList.find(x => String(x.name || '').trim().toLowerCase() === rawLower) || null;
            if (finalFallback) {
                return { ...finalFallback, image: fmtImg(finalFallback.image || finalFallback.realImage), realImage: fmtImg(finalFallback.realImage || finalFallback.image) };
            }
            return null;
        };

        const productInfo = getProductInfoSmart(_item.name) || {};

        let displayCoverImage = _item.realCoverImage;
        let rawNote = String(_item.note || '');
        if (!displayCoverImage) {
            const match = rawNote.match(/\|\s*Cover:\s*(https?:\/\/[^\s|]+)/i);
            if (match && match[1]) {
                displayCoverImage = match[1];
            }
        }
        const realImage = displayCoverImage || productInfo.realImage || productInfo.image;
        const productImage = displayCoverImage || productInfo.image || productInfo.realImage;
        const oCode = (order.orderCode || '').split(' | MVĐ: ')[0] || 'ĐƠN LẺ';
        const isBuKho = order.channel === 'Sản Xuất Bù Kho' || order.channel === 'Sản Xuất Tồn' || _item.fulfilledFromStock;

        const p1Status = _item.phases?.phase1?.status || 'Pending';
        const p2Status = _item.phases?.phase2?.status || 'Pending';
        const isAnyInProgress = p1Status === 'In Progress' || p2Status === 'In Progress';

                    </div>

                                <div className="mb-2 p-2 bg-[#141414] rounded-xl relative rf-production-running-border flex items-center gap-2.5">

    });

    const GroupedWorkerCardAccordion = React.memo(function GroupedWorkerCardAccordion({ groupItems, order, prodItems, erpProducts, currentUser, pushDeltas, userConfigs, triggerToast, kpiConfig, isAdmin, orders, models3D, attendance, typeTab }) {

        return (

                            <div className="absolute top-0.5 left-0.5 w-3.5 h-3.5 bg-[#d4af37] text-black font-black text-[8px] rounded-full flex items-center justify-center border border-[#333] z-10">

                    </div>
                    <div className="flex items-center gap-3 shrink-0">
                        <div className="bg-[#ffc107] text-black text-[12px] font-black px-2.5 py-1 rounded-full shadow-[0_0_10px_rgba(255,193,7,0.3)] border border-[#ffc107]">
                            SL: x{qty}
                        </div>
                        <i className={`fas fa-chevron-${expanded ? 'up' : 'down'} text-gray-500 text-lg`}></i>
                    </div>
                </div>

                {expanded && (
                    <div className="pl-3 border-l-2 border-[#333] mt-3 space-y-3">
                        {groupItems.map((item, idx) => {

                                        ? [{ k: 'phase1', n: 'Cắt Dán', req: [] }, { k: 'phase2', n: 'Gọt Keo', req: ['phase1'] }]
                                        : [{ k: 'phase1', n: 'Dựng Khung', req: [] }, { k: 'phase2', n: 'Gia Cố', req: ['phase1'] }]

    // -------------------------------------------------------------------------
    // MỤC 3: GIAO DIỆN CHÍNH TAB SẢN XUẤT (ProductionTab)
    // -------------------------------------------------------------------------
    const ProductionTab = React.memo(function ProductionTab({ attendance, orders, prodItems, erpProducts, currentUser, pushDeltas, userConfigs, triggerToast, kpiConfig, erpData, models3D }) {
        const [typeTab, setTypeTab] = React.useState('Layout');
        const [statusTab, setStatusTab] = React.useState('CHỜ SẢN XUẤT');
        const [filterTime, setFilterTime] = React.useState('Tháng Này');
        const [searchQuery, setSearchQuery] = React.useState('');
        const [globalPreview, setGlobalPreview] = React.useState(null);
        const [showRules, setShowRules] = React.useState(false);
        const [showAddSXTModal, setShowAddSXTModal] = React.useState(false);
        const [editingProdItem, setEditingProdItem] = React.useState(null);
        const [annotationData, setAnnotationData] = React.useState(null);
        const [collapsedGroups, setCollapsedGroups] = React.useState({});

        React.useEffect(() => {
            const handleGlobalPreview = (e) => { if (e.detail) setGlobalPreview(e.detail); };
            const handleAnnotation = (e) => { if (e.detail) setAnnotationData(e.detail); };
            window.addEventListener('triggerInternalPreview', handleGlobalPreview);
            window.addEventListener('openAnnotationModal', handleAnnotation);
            return () => {
                window.removeEventListener('triggerInternalPreview', handleGlobalPreview);
                window.removeEventListener('openAnnotationModal', handleAnnotation);
            };
        }, []);

        const isCTV = localStorage.getItem('rf_role') === 'CTV';

        const [customMonth, setCustomMonth] = React.useState('');
        const checkTimeFilter = (dateStr, filterStr, customM) => {
            if (!dateStr) return false;
            const d = new Date(dateStr);
            const today = new Date();
            if (filterStr === 'Tháng Này') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
            if (filterStr === 'Tháng Trước') {
                const lastMonth = new Date(today);
                lastMonth.setMonth(lastMonth.getMonth() - 1);
                return d.getMonth() === lastMonth.getMonth() && d.getFullYear() === lastMonth.getFullYear();
            }
            if (filterStr === 'Chọn Tháng') {
                if (!customM) return true;
                const [year, month] = customM.split('-');
                return d.getFullYear() === parseInt(year, 10) && d.getMonth() === (parseInt(month, 10) - 1);
            }
            return true;
        };

        const orderMap = React.useMemo(() => {
            const map = {};
            (orders || []).forEach(o => { if (o && o.id) map[o.id] = o; });
            return map;
        }, [orders]);

        const baseFiltered = React.useMemo(() => {
            return (prodItems || []).filter(i => {
                if (i.orderId === 'SHARED_TASK' || i.orderId === 'REMINDER') return false;
                const o = orderMap[i.orderId] || {};
                const isCtvOrder = String(o.channel || '').toUpperCase().includes('CỘNG TÁC VIÊN') || String(o.channel || '').toUpperCase() === 'CTV';
                if (isCTV && o.createdBy !== currentUser && o.sale !== currentUser && o.responsibleUser !== currentUser && !isCtvOrder) return false;

                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    const matchName = String(i.name || '').toLowerCase().includes(q);
                    const matchOrder = String(o.orderCode || '').toLowerCase().includes(q);
                    if (!matchName && !matchOrder) return false;
                }

                const deadlineStr = i.deadline || o.createdAt;
                const isTimeMatch = checkTimeFilter(deadlineStr, filterTime, customMonth);

                if (filterTime === 'Tháng Này' && !isTimeMatch) {
                    const isFinished = i.status === 'Done' || i.status === 'Đã Huỷ' || i.status === 'Cancel' || i.status === 'Huỷ';
                    if (!isFinished && deadlineStr) {
                        const tzOffset = (new Date()).getTimezoneOffset() * 60000;
                        const nowMonthStr = new Date(Date.now() - tzOffset).toISOString().slice(0, 7);
                        if (String(deadlineStr) < nowMonthStr) {
                            return true;
                        }
                    }
                }
                if (!isTimeMatch) return false;
                return true;
            });
        }, [prodItems, orderMap, filterTime, customMonth, searchQuery]);

        const countBeKinh = baseFiltered.filter(i => {
            const searchStr = String(i.type || '') + ' ' + String(i.name || '');
            return searchStr.toLowerCase().includes('bể');
        }).length;

        const countLayout = baseFiltered.filter(i => {
            const searchStr = String(i.type || '') + ' ' + String(i.name || '');
            return !searchStr.toLowerCase().includes('bể');
        }).length;

        const typeFiltered = React.useMemo(() => {
            return baseFiltered.filter(i => {
                const searchStr = String(i.type || '') + ' ' + String(i.name || '');
                const isG = searchStr.toLowerCase().includes('bể');

                if (typeTab === 'Bể Kính' && !isG) return false;
                if (typeTab === 'Layout' && isG) return false;
                return true;
            });
        }, [baseFiltered, typeTab]);

        const listWithStatus = typeFiltered.map(i => {
            let curSt = 'CHỜ SẢN XUẤT';
            const p1 = i.phases?.phase1?.status || 'Pending';
            const p2 = i.phases?.phase2?.status || 'Pending';
            const statusUpper = String(i.status || '').toUpperCase();
            const isStock = i.fulfilledFromStock === true || String(i.fulfilledFromStock).toUpperCase() === 'TRUE';

            if (statusUpper === 'ĐÃ HUỶ' || statusUpper === 'HUỶ' || statusUpper === 'CANCEL' || statusUpper === 'HỦY') {
                curSt = 'ĐÃ HUỶ';
            } else if (i.qc_status === 'Đạt' || statusUpper === 'DONE' || statusUpper === 'ĐÃ XONG' || statusUpper === 'HOÀN KHO ĐẠT') {
                curSt = 'ĐÃ XONG';
            } else if (p1 === 'Done' && p2 === 'Done') {
                curSt = 'KIỂM ĐỊNH';
            } else {
                curSt = 'CHỜ SẢN XUẤT';
            }

            return { ...i, _computedStatus: curSt };
        });

        const workerTodayKPI = React.useMemo(() => {
            const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
            const today = safeDateFull.split('T')[0];
            let framesCount = 0;
            let layoutCount = 0;
            let kpiVND = 0;

            listWithStatus.forEach(i => {
                ['phase1', 'phase2'].forEach(pk => {
                    if (i.phases && i.phases[pk] && i.phases[pk].status === 'Done' && i.phases[pk].user === currentUser && i.phases[pk].date === today) {
                        if (String(i.type || '').toLowerCase().includes('bể')) framesCount++;
                        else layoutCount++;
                        kpiVND += (i.phases[pk].reward_vnd || 0);
                    }
                });
            });
            return { framesCount, layoutCount, kpiVND };
        }, [listWithStatus, currentUser]);

        const workerFilteredStats = React.useMemo(() => {
            if (!prodItems || !currentUser) return { beKinhP1: 0, beKinhP2: 0, layoutP1: 0, layoutP2: 0 };

            let beKinhP1 = 0;
            let beKinhP2 = 0;
            let layoutP1 = 0;
            let layoutP2 = 0;

            (prodItems || []).forEach(item => {
                const searchStr = (String(item.type || '') + ' ' + String(item.name || '')).toLowerCase();
                const isBeKinh = searchStr.includes('bể');

                // Phase 1 (Cắt Dán / Dựng Khung)
                const p1Status = item?.phases?.phase1?.status || item.p1_status;
                const p1User = item?.phases?.phase1?.user || item.p1_user;
                const p1Date = item?.phases?.phase1?.endTime || item?.phases?.phase1?.start || item?.phases?.phase1?.date || item.p1_endTime || item.p1_start || item.createdAt;

                if ((p1Status === 'Done' || p1Status === 'ĐÃ XONG') && String(p1User || '').trim() === String(currentUser || '').trim()) {
                    if (checkTimeFilter(p1Date, filterTime, customMonth)) {
                        if (isBeKinh) beKinhP1++;
                        else layoutP1++;
                    }
                }

                // Phase 2 (Gọt Keo / Gia Cố)
                const p2Status = item?.phases?.phase2?.status || item.p2_status;
                const p2User = item?.phases?.phase2?.user || item.p2_user;
                const p2Date = item?.phases?.phase2?.endTime || item?.phases?.phase2?.start || item?.phases?.phase2?.date || item.p2_endTime || item.p2_start || item.createdAt;

                if ((p2Status === 'Done' || p2Status === 'ĐÃ XONG') && String(p2User || '').trim() === String(currentUser || '').trim()) {
                    if (checkTimeFilter(p2Date, filterTime, customMonth)) {
                        if (isBeKinh) beKinhP2++;
                        else layoutP2++;
                    }
                }
            });

            return { beKinhP1, beKinhP2, layoutP1, layoutP2 };
        }, [prodItems, currentUser, filterTime, customMonth]);

        const allWorkersReport = React.useMemo(() => {
            if (!prodItems) return [];

            const statsMap = {};
            const EXCLUDED_USERS = ['Nguyễn Thị Huyền Trang', 'Trung Kiên', 'Nguyễn Thị Diệu Hương', 'Huyền Trang', 'Diệu Hương'];

            // 1. Khởi tạo danh sách thợ từ userConfigs (Config_NhanSu)
            if (userConfigs && userConfigs.pins) {
                Object.values(userConfigs.pins).forEach(u => {
                    if (u && u.name) {
                        const fullName = String(u.name).trim();
                        if (fullName && !EXCLUDED_USERS.includes(fullName) && !statsMap[fullName]) {
                            statsMap[fullName] = {
                                fullName: fullName,
                                name: fullName.split(' ').pop(),
                                dungKhung: 0,
                                giaCo: 0,
                                catDan: 0,
                                gotKeo: 0,
                                reworkCount: 0,
                                overdueCount: 0
                            };
                        }
                    }
                });
            }

            (prodItems || []).forEach(item => {
                const searchStr = (String(item.type || '') + ' ' + String(item.name || '')).toLowerCase();
                const isBeKinh = item.type === 'Bể Kính' || searchStr.includes('bể');

                const p1 = item?.phases?.phase1 || {};
                const p2 = item?.phases?.phase2 || {};

                const p1User = String(p1.user || item.p1_user || '').trim();
                const p2User = String(p2.user || item.p2_user || '').trim();

                const p1Status = p1.status || item.p1_status;
                const p2Status = p2.status || item.p2_status;

                const p1Date = p1.endTime || p1.start || item.p1_endTime || item.p1_start || item.deadline || item.createdAt || item.date;
                const p2Date = p2.endTime || p2.start || item.p2_endTime || item.p2_start || item.deadline || item.createdAt || item.date;
                const itemDate = item.updatedAt || item.createdAt || p1Date || p2Date;

                if (p1User && !EXCLUDED_USERS.includes(p1User) && !statsMap[p1User]) {
                    statsMap[p1User] = { fullName: p1User, name: p1User.split(' ').pop(), dungKhung: 0, giaCo: 0, catDan: 0, gotKeo: 0, reworkCount: 0, overdueCount: 0 };
                }
                if (p2User && !EXCLUDED_USERS.includes(p2User) && !statsMap[p2User]) {
                    statsMap[p2User] = { fullName: p2User, name: p2User.split(' ').pop(), dungKhung: 0, giaCo: 0, catDan: 0, gotKeo: 0, reworkCount: 0, overdueCount: 0 };
                }

                // --- KHÂU 1 (DỰNG KHUNG / CẮT DÁN) ---
                if (p1User && statsMap[p1User]) {
                    const matchTime = checkTimeFilter(p1Date, filterTime, customMonth) || checkTimeFilter(itemDate, filterTime, customMonth);
                    if ((p1Status === 'Done' || String(p1Status).toUpperCase() === 'ĐÃ XONG') && matchTime) {
                        if (isBeKinh) statsMap[p1User].catDan++;
                        else statsMap[p1User].dungKhung++;
                    }
                    if (matchTime) {
                        const p1NoteStr = String(p1.note || item.p1_note || '').toLowerCase();
                        if (p1NoteStr.includes('trễ') || p1NoteStr.includes('quá hạn') || (p1.reward_vnd === 0 && p1Status === 'Done' && p1NoteStr.includes('kpi'))) {
                            statsMap[p1User].overdueCount++;
                        }
                    }
                }

                // --- KHÂU 2 (GIA CỐ / GỌT KEO) ---
                if (p2User && statsMap[p2User]) {
                    const matchTime = checkTimeFilter(p2Date, filterTime, customMonth) || checkTimeFilter(itemDate, filterTime, customMonth);
                    if ((p2Status === 'Done' || String(p2Status).toUpperCase() === 'ĐÃ XONG') && matchTime) {
                        if (isBeKinh) statsMap[p2User].gotKeo++;
                        else statsMap[p2User].giaCo++;
                    }
                    if (matchTime) {
                        const p2NoteStr = String(p2.note || item.p2_note || '').toLowerCase();
                        if (p2NoteStr.includes('trễ') || p2NoteStr.includes('quá hạn') || (p2.reward_vnd === 0 && p2Status === 'Done' && p2NoteStr.includes('kpi'))) {
                            statsMap[p2User].overdueCount++;
                        }
                    }
                }

                // --- ĐẾM SỐ LẦN BỊ LÀM LẠI (REWORK) ---
                const itemNote = String(item.note || '').toLowerCase();
                const qcNote = String(item.qc_note || '').toLowerCase();
                const qcStatus = String(item.qc_status || '').toLowerCase();
                const combinedNote = itemNote + ' ' + qcNote + ' ' + qcStatus;

                const isRework = combinedNote.includes('làm lại') || combinedNote.includes('từ chối') || combinedNote.includes('báo lỗi') || qcStatus === 'từ chối';

                if (isRework) {
                    const matchTime = checkTimeFilter(itemDate, filterTime, customMonth) || checkTimeFilter(p1Date, filterTime, customMonth) || checkTimeFilter(p2Date, filterTime, customMonth);
                    if (matchTime) {
                        if (combinedNote.includes('gia cố') || combinedNote.includes('gọt keo') || combinedNote.includes('khâu 2') || combinedNote.includes('phase2')) {
                            if (p2User && statsMap[p2User]) statsMap[p2User].reworkCount++;
                            else if (p1User && statsMap[p1User]) statsMap[p1User].reworkCount++;
                        } else {
                            if (p1User && statsMap[p1User]) statsMap[p1User].reworkCount++;
                            else if (p2User && statsMap[p2User]) statsMap[p2User].reworkCount++;
                        }
                    }
                }
            });

            return Object.values(statsMap)
                .filter(w => !EXCLUDED_USERS.includes(w.fullName))
                .sort((a, b) => {
                    const totalA = a.dungKhung + a.giaCo + a.catDan + a.gotKeo;
                    const totalB = b.dungKhung + b.giaCo + b.catDan + b.gotKeo;
                    return totalB - totalA;
                });
        }, [prodItems, userConfigs, filterTime, customMonth]);

        const completedPhasesThisMonth = React.useMemo(() => {
            if (!prodItems || !currentUser) return 0;
            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            let count = 0;

            (prodItems || []).forEach(item => {
                // Phase 1 (Cắt Dán Bể / Dựng Khung Layout)
                const p1Status = item?.phases?.phase1?.status || item.p1_status;
                const p1User = item?.phases?.phase1?.user || item.p1_user;
                const p1Date = item?.phases?.phase1?.endTime || item?.phases?.phase1?.start || item.p1_endTime || item.p1_start || item.deadline || item.createdAt;
                if (p1Status === 'Done' && String(p1User || '').trim() === String(currentUser || '').trim()) {
                    if (p1Date && String(p1Date).startsWith(currentMonthStr)) {
                        count++;
                    }
                }

                // Phase 2 (Gọt Keo Bể / Gia Cố Layout)
                const p2Status = item?.phases?.phase2?.status || item.p2_status;
                const p2User = item?.phases?.phase2?.user || item.p2_user;
                const p2Date = item?.phases?.phase2?.endTime || item?.phases?.phase2?.start || item.p2_endTime || item.p2_start || item.deadline || item.createdAt;
                if (p2Status === 'Done' && String(p2User || '').trim() === String(currentUser || '').trim()) {
                    if (p2Date && String(p2Date).startsWith(currentMonthStr)) {
                        count++;
                    }
                }
            });
            return count;

                if (!attendance || !currentUser) return;

                const todayCheckin = attendance.find(a =>
                    String(a.user).trim() === currentUser.trim() && a.timeIn && !a.timeOut

                    setShiftTimeText('Chưa vào ca');
                    setShiftTimeColor('text-zinc-500 font-bold');
                    return;
                }

                // Định mức ca làm việc tiêu chuẩn: 8 tiếng = 28,800,000 ms
                const shiftDurationMs = 8 * 60 * 60 * 1000;

                // Xử lý parse thời gian an toàn
                let inStr = String(todayCheckin.timeIn).trim();
                if (inStr.includes(' ') && !inStr.includes('T')) inStr = inStr.replace(' ', 'T');
                if (inStr.includes('T') && inStr.split(':').length === 2) inStr += ':00';

                const timeInMs = new Date(inStr).getTime();
                if (isNaN(timeInMs)) {
                    setShiftTimeText('Đang làm việc');
                    setShiftTimeColor('text-emerald-400');
                    return;
                }

                const elapsedMs = Date.now() - timeInMs;
                const remainingMs = shiftDurationMs - elapsedMs;

                if (remainingMs <= 0) {
                    setShiftTimeText('Hết ca tiêu chuẩn');
                    setShiftTimeColor('text-rose-500 font-black animate-pulse');
                } else {
                    const remH = Math.floor(remainingMs / 3600000);
                    const remM = Math.floor((remainingMs % 3600000) / 60000);
                    const remS = Math.floor((remainingMs % 60000) / 1000);

                    setShiftTimeText(`Ca: ${remH}h:${String(remM).padStart(2, '0')}m:${String(remS).padStart(2, '0')}s`);
                    setShiftTimeColor(remainingMs < 30 * 60 * 1000 ? 'text-amber-500 font-black animate-pulse' : 'text-emerald-400 font-bold');
                }
            };

            updateShiftTimer();
            const shiftInterval = setInterval(updateShiftTimer, 1000);
            return () => clearInterval(shiftInterval);

                                        className="w-full py-3 px-4 mt-4 mb-3 flex items-center justify-between gap-2 rounded-2xl uppercase tracking-wider shadow-lg cursor-pointer select-none transition-all hover:opacity-95 active:scale-[0.99] font-black"
                                    >
                                        <div className="font-black text-[13px] flex items-center gap-2 truncate">
                                            <i className="fas fa-layer-group opacity-90 text-[12px]"></i>
                                            <span className="truncate">{groupKey}</span>
                                        </div>
                                        <div className="flex items-center gap-1.5 bg-black/25 text-current px-2.5 py-1 rounded-xl shrink-0 border border-black/10 font-black">
                                            <span className="text-[11px] font-black">{items.length} LỆNH</span>
                                            <i className={`fas fa-chevron-${isGroupCollapsed ? 'down' : 'up'} text-[11px]`}></i>
                                        </div>
                                    </div>
                                );

                                if (isGroupCollapsed) {
                                    return <React.Fragment key={groupKey}>{groupHeader}</React.Fragment>;
                                }

                                // Render items inside this channel
                                let content = items.map((item, idx) => {
                                    const order = (orders || []).find(o => {
                                        const pOrd = String(item.orderId || '').trim();
                                        const oOrd = String(o.id).trim();
                                        if (pOrd === oOrd) return true;
                                        if (pOrd.startsWith(oOrd + '_')) return true;
                                        const parts = pOrd.split('|').map(x => x.trim());
                                        if (parts.includes(oOrd)) return true;
                                        if (parts.some(part => part.startsWith(oOrd + '_'))) return true;
                                        return false;
                                    }) || {};
                                    return (
                                        <WorkerCardV2
                                            key={item.id}
                                            item={item}
                                            order={order}
                                            prodItems={prodItems}
                                            erpProducts={erpProducts}
                                            currentUser={currentUser}
                                            pushDeltas={pushDeltas}
                                            userConfigs={userConfigs}
                                            triggerToast={triggerToast}
                                            kpiConfig={kpiConfig}
                                            idx_num={idx + 1}
                                            isAdmin={adminCheck}
                                            orders={orders}
                                            models3D={models3D}
                                            attendance={attendance}
                                            configs={typeTab === 'Bể Kính'
                                                ? [{ k: 'phase1', n: 'Cắt Dán', req: [] }, { k: 'phase2', n: 'Gọt Keo', req: ['phase1'] }]
                                                : [{ k: 'phase1', n: 'Dựng Khung', req: [] }, { k: 'phase2', n: 'Gia Cố', req: ['phase1'] }]
                                            }
                                            onEditItem={setEditingProdItem}
                                        />
                                    );
                                });

                                return (
                                    <React.Fragment key={groupKey}>
                                        {groupHeader}
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3">
                                            {content}
                                        </div>
                                    </React.Fragment>
                                );
                            });
                        })()
                    )}
                </div>

                {globalPreview && (
                    <div className="fixed inset-0 z-[99999] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in select-none" onClick={() => setGlobalPreview(null)}>
                        {/* Nút Đóng Luôn Hiển Thị Cố Định Ở Góc Trên Phải */}
                        <button
                            onClick={() => setGlobalPreview(null)}
                            className="fixed top-4 right-4 z-[100000] text-white hover:text-rose-400 text-lg w-10 h-10 flex items-center justify-center bg-black/70 hover:bg-rose-600 border border-white/20 rounded-full transition-all shadow-xl backdrop-blur-md active:scale-95"
                            title="Đóng xem ảnh"
                        >
                            <i className="fas fa-times"></i>
                        </button>

                        <div className="relative max-w-lg w-full flex flex-col items-center animate-slide-up my-auto" onClick={e => e.stopPropagation()}>
                            <img src={globalPreview} alt="Ảnh nghiệm thu" className="w-full h-auto max-h-[75vh] object-contain rounded-2xl shadow-[0_0_30px_rgba(16,185,129,0.3)] border border-white/10 bg-black cursor-pointer" onClick={() => setGlobalPreview(null)} />
                            <div className="mt-4 flex items-center justify-center gap-3 flex-wrap">
                                <div className="flex items-center gap-2 text-[#10b981] text-[11px] font-black uppercase tracking-[0.15em] bg-[#141414] px-4 py-2 rounded-full border border-[#10b981]/30 shadow-md">
                                    <i className="fas fa-check-circle"></i> ẢNH KẾT QUẢ SẢN XUẤT CHÍNH XÁC
                                </div>
                                <button
                                    onClick={() => setGlobalPreview(null)}
                                    className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-black text-[11px] uppercase tracking-wider rounded-full shadow-lg flex items-center gap-1.5 active:scale-95 transition-all"
                                >
                                    <i className="fas fa-times"></i> ĐÓNG LẠI
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {showAddSXTModal && (
                    <AddModal
                        onClose={() => setShowAddSXTModal(false)}
                        pushDeltas={pushDeltas}
                        products={erpProducts}
                        erpData={erpData}
                        triggerToast={triggerToast}
                        userConfigs={userConfigs}
                        forceSXTOnly={true}
                    />
                )}

                {editingProdItem && (
                    <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={() => setEditingProdItem(null)}>
                        <div className="bg-[#141414] border border-[#333] w-full max-w-sm rounded-[24px] p-5 shadow-2xl flex flex-col relative animate-slide-up" onClick={e => e.stopPropagation()}>
                            <button onClick={() => setEditingProdItem(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-rose-500 flex items-center justify-center transition-all z-20"><i className="fas fa-times text-sm"></i></button>
                            <h3 className="text-white font-black text-[16px] uppercase tracking-widest mb-4 flex items-center gap-2"><i className="fas fa-edit text-[#d4af37]"></i> CHỈNH SỬA LỆNH</h3>

                            <div className="space-y-4">
                                <div>
                                    <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1.5">Ghi chú Lệnh</label>
                                    <textarea
                                        value={editingProdItem.note || ''}
                                        onChange={e => setEditingProdItem({ ...editingProdItem, note: e.target.value })}
                                        className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3 text-[12px] font-bold text-white outline-none focus:border-[#d4af37] min-h-[80px]"
                                        placeholder="Nhập ghi chú hoặc cảnh báo cho thợ..."
                                    ></textarea>
                                </div>

                                <div>
                                    <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1.5">Giao đích danh (Bỏ trống = Ai cũng nhận được)</label>
                                    <select
                                        value={editingProdItem.assignee || ''}
                                        onChange={e => setEditingProdItem({ ...editingProdItem, assignee: e.target.value })}
                                        className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-3 text-[12px] font-bold text-[#d4af37] outline-none focus:border-[#d4af37]"
                                    >
                                        <option value="">-- KHÔNG GIAO ĐÍCH DANH --</option>
                                        {(Object.values(userConfigs?.pins || {})).map(u => <option key={u.name} value={u.name}>{u.name}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1.5">Hạn bàn giao</label>
                                    <input
                                        type="datetime-local"
                                        value={editingProdItem.deadline ? String(editingProdItem.deadline).replace(' ', 'T').substring(0, 16) : ''}
                                        onChange={e => setEditingProdItem({ ...editingProdItem, deadline: e.target.value })}
                                        className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-3 text-[12px] font-bold text-white outline-none focus:border-[#d4af37]"
                                    />
                                </div>
                            </div>

                            <button
                                onClick={() => {
                                    const upd = { ...editingProdItem };
                                    pushDeltas({ prodItems: [upd] }, 'Đã lưu thay đổi', 'fa-save');
                                    setEditingProdItem(null);
                                }}
                                className="w-full mt-6 py-3.5 bg-[#d4af37] hover:bg-yellow-500 text-black font-black rounded-xl text-[12px] uppercase tracking-wider flex items-center justify-center gap-2 shadow-md active:scale-95 transition-all"
                            >
                                <i className="fas fa-check-circle"></i> LƯU THAY ĐỔI
                            </button>
                        </div>
                    </div>
                )}

                {annotationData && (window.ImageAnnotationModal || typeof ImageAnnotationModal !== 'undefined') && (() => {
                    const AnnotationComp = window.ImageAnnotationModal || ImageAnnotationModal;
                    return (
                        <AnnotationComp
                            item={annotationData.item || annotationData}
                            readOnly={annotationData.readOnly ?? annotationData._readOnly ?? false}
                            onClose={() => setAnnotationData(null)}
                            onSave={(updatedItem) => {
                                pushDeltas({ prodItems: [updatedItem] }, 'Từ chối khung, đã báo lỗi cho thợ!', 'fa-exclamation-triangle');
                                setAnnotationData(null);
                            }}
                        />
                    );
                })()}
            </div>
        );
    });
</script>
