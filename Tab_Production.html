          ['phase1', 'phase2'].forEach(pk => {
              if (i.phases && i.phases[pk] && i.phases[pk].status === 'Done' && i.phases[pk].user === currentUser && i.phases[pk].date === today) {
                  if (String(i.type || '').toLowerCase().includes('bể')) framesCount++;
                  else layoutCount++;
                  kpiVND += (i.phases[pk].reward_vnd || 0);
              }
          });
      });
      return { framesCount, layoutCount, kpiVND };
  }, [listWithStatus, currentUser]);

  const counts = { 'CHỜ SẢN XUẤT': 0, 'KIỂM ĐỊNH': 0, 'ĐÃ XONG': 0, 'ĐÃ HUỶ': 0, 'TẤT CẢ': typeFiltered.length };
  listWithStatus.forEach(i => { counts[i._computedStatus] = (counts[i._computedStatus] || 0) + 1; });

  const list = listWithStatus.filter(i => {
    if (statusTab !== 'TẤT CẢ' && statusTab !== i._computedStatus) return false;
    return true;
  });


  const adminCheck = localStorage.getItem('rf_admin') === 'true';

  return (
    <div className="space-y-4 max-w-5xl mx-auto px-1 sm:px-0">
      <style>
        {`
          @keyframes rf-glow-border {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
          }
          .rf-production-running-orange-border {
            position: relative;
            border: 1px solid transparent !important;
            background: linear-gradient(#141414, #141414) padding-box, linear-gradient(90deg, #f97316, #f59e0b, #ea580c, #f97316) border-box !important;
            background-size: 250% 250% !important;
            animation: rf-glow-border 3.5s linear infinite !important;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.25) !important;
          }
          .rf-production-running-red-border {
            position: relative;
            border: 1px solid transparent !important;
            background: linear-gradient(#141414, #141414) padding-box, linear-gradient(90deg, #ef4444, #f43f5e, #dc2626, #ef4444) border-box !important;
            background-size: 250% 250% !important;
            animation: rf-glow-border 3.5s linear infinite !important;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3) !important;
          }
          .rf-production-running-border {
            position: relative;
            border: 1px solid transparent !important;
            background: linear-gradient(#141414, #141414) padding-box, linear-gradient(90deg, #d4af37, #f59e0b, #3b82f6, #d4af37) border-box !important;
            background-size: 250% 250% !important;
            animation: rf-glow-border 3.5s linear infinite !important;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2) !important;
          }
          .rf-production-running-border-green {
            position: relative;
            border: 1px solid transparent !important;
            background: linear-gradient(#141414, #141414) padding-box, linear-gradient(90deg, #10b981, #34d399, #059669, #10b981) border-box !important;
            background-size: 250% 250% !important;
            animation: rf-glow-border 3.5s linear infinite !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4) !important;
          }

          @keyframes rf-spin-slow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
          }
          .neon-running-dot {
            position: relative;
            overflow: hidden;
            border: none !important;
          }
          .neon-running-dot::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 250%; height: 250%;
            background: conic-gradient(transparent, transparent, transparent, var(--neon-color));
            animation: rf-spin-slow 3s linear infinite;
            z-index: 0;
          }
          .neon-running-dot::after {
            content: "";
            position: absolute;
            inset: 1.5px;
            background: #141414;
            border-radius: 15px;
            z-index: 0;
          }
          .neon-running-dot > * {
            position: relative;
            z-index: 10;
          }
          .neon-running-blue { --neon-color: #3b82f6; }
          .neon-running-yellow { --neon-color: #eab308; }
          .neon-running-green { --neon-color: #10b981; }
          .neon-running-orange { --neon-color: #f59e0b; }
          .neon-running-red { --neon-color: #ef4444; }
        `}
      </style>

      {/* DASHBOARD KPI (WORKER ONLY) */}
      {!adminCheck && !isCTV && (
        <RFCard className="mb-4 relative overflow-hidden group">
            <div className="absolute top-0 left-0 w-1.5 bg-gradient-to-b from-[#d4af37] to-[#f59e0b] h-full z-10"></div>
            <div className="absolute -right-10 -top-10 w-40 h-40 bg-[#d4af37]/5 rounded-full blur-3xl group-hover:bg-[#d4af37]/10 transition-all"></div>
            <div className="flex justify-between items-center mb-4 pl-2 relative z-10">
                <h3 className="text-white font-black text-[13px] tracking-wide flex items-center gap-2">
                    <i className="fas fa-chart-line text-[#d4af37]"></i> KPI HÔM NAY
                </h3>
                <RFBadge text={new Date().toLocaleDateString('vi-VN')} type="default" />
            </div>
            <div className="grid grid-cols-3 gap-3 relative z-10">
                <div className="bg-[#0a0a0a] rounded-xl p-3 border border-[#333] text-center shadow-inner relative overflow-hidden group/item">
                    <div className="absolute inset-0 bg-blue-500/5 opacity-0 group-hover/item:opacity-100 transition-opacity"></div>
                    <div className="text-gray-500 text-[9px] sm:text-[10px] font-black mb-1.5 tracking-wider">KHUNG BỂ</div>
                    <div className="text-xl sm:text-2xl font-black text-[#3b82f6] drop-shadow-[0_0_8px_rgba(59,130,246,0.3)]">{workerTodayKPI.framesCount}</div>
                </div>
                <div className="bg-[#0a0a0a] rounded-xl p-3 border border-[#333] text-center shadow-inner relative overflow-hidden group/item">
                    <div className="absolute inset-0 bg-green-500/5 opacity-0 group-hover/item:opacity-100 transition-opacity"></div>
                    <div className="text-gray-500 text-[9px] sm:text-[10px] font-black mb-1.5 tracking-wider">LAYOUT</div>
                    <div className="text-xl sm:text-2xl font-black text-[#10b981] drop-shadow-[0_0_8px_rgba(16,185,129,0.3)]">{workerTodayKPI.layoutCount}</div>
                </div>
                <div className="bg-[#0a0a0a] rounded-xl p-3 border border-[#333] text-center shadow-inner relative overflow-hidden group/item">
                    <div className="absolute inset-0 bg-[#d4af37]/5 opacity-0 group-hover/item:opacity-100 transition-opacity"></div>
                    <div className="text-gray-500 text-[9px] sm:text-[10px] font-black mb-1.5 tracking-wider">TẠM TÍNH</div>
                    <div className="text-sm sm:text-base font-black text-[#d4af37] drop-shadow-[0_0_8px_rgba(212,175,55,0.3)] mt-1.5">
                        {workerTodayKPI.kpiVND > 0 ? `+${workerTodayKPI.kpiVND.toLocaleString()}đ` : '0đ'}
                    </div>
                </div>
            </div>
        </RFCard>
      )}

      {/* FILTER TABS */}
      <div className="flex gap-2 w-full max-w-sm mx-auto mb-4 bg-[#111] p-1.5 rounded-2xl border border-[#333] shadow-inner">
        {[{id: 'Bể Kính', c: countBeKinh}, {id: 'Layout', c: countLayout}].map(t => (
          <button key={t.id} onClick={() => setTypeTab(t.id)} className={`flex-1 py-2 font-black text-[13px] rounded-xl transition-all duration-300 flex items-center justify-center gap-2 ${typeTab === t.id ? 'bg-[#d4af37] text-black shadow-[0_0_15px_rgba(212,175,55,0.3)] scale-[1.02]' : 'bg-transparent text-gray-400 hover:text-white hover:bg-white/5'}`}>
            {t.id.toUpperCase()} <span className={`px-2 py-0.5 rounded-lg text-[11px] ${typeTab === t.id ? 'bg-black/20 text-black' : 'bg-white/10 text-gray-300'}`}>{t.c}</span>
          </button>
        ))}
      </div>

      {/* SEARCH AND FILTERS */}
      <RFCard noPadding className="p-2 flex flex-col md:flex-row gap-2 mb-4 items-center shrink-0">
        <div className="flex items-center gap-2 pl-2 border-r border-[#333] pr-3 shrink-0">
            <i className="fas fa-bolt text-[#d4af37]"></i>
            <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">ACTIONS</span>
        </div>
        
        {adminCheck && !isCTV && (
          <RFButton variant="outline" onClick={() => setShowAddSXTModal(true)} className="w-10 h-10 !p-0 rounded-xl shrink-0" title="Tạo Lệnh SX Tồn">
            <i className="fas fa-plus text-lg"></i>
          </RFButton>
        )}
        <select value={filterTime} onChange={e => setFilterTime(e.target.value)} className="h-[42px] px-2.5 bg-[#0a0a0a] rounded-xl border border-[#333] text-[11px] font-bold outline-none text-white shadow-sm focus:border-[#d4af37] transition-colors appearance-none cursor-pointer shrink-0">
          <option>Hôm Nay</option><option>Hôm Qua</option><option>Tháng Này</option><option>Tháng Trước</option><option>Tất Cả</option>
        </select>
        
        <div className="flex-1 w-full min-w-[200px]">
            <RFInput 
                value={searchQuery} 
                onChange={e => setSearchQuery(e.target.value)} 
                placeholder="Tìm tên hàng, mã đơn..." 
                icon="fa-search"
            />
        </div>
      </RFCard>

      <div className="flex overflow-x-auto gap-2 pb-2 custom-scrollbar shrink-0">
        {['CHỜ SẢN XUẤT', 'KIỂM ĐỊNH', 'ĐÃ XONG', 'ĐÃ HUỶ', 'TẤT CẢ'].map(t => (
          <button key={t} onClick={() => setStatusTab(t)} className={`flex-shrink-0 px-4 py-2.5 text-[11px] font-bold rounded-xl transition-all duration-300 border flex items-center gap-1.5 ${statusTab === t ? 'border-[#d4af37] bg-[#d4af37]/10 text-[#d4af37] shadow-[0_0_15px_rgba(212,175,55,0.15)]' : 'border-transparent bg-[#111] text-gray-400 hover:text-white hover:bg-white/5'}`}>
            {t} <span className={`px-2 py-0.5 rounded-lg text-[10px] ${statusTab === t ? 'bg-[#d4af37] text-black' : 'bg-black/40 text-gray-300'}`}>{counts[t]}</span>
          </button>
        ))}
      </div>

      <div className="space-y-3 mt-1 pb-4">
        {list.length === 0 ? (
          <div className="text-center py-16 text-[#8a8a8a] font-bold text-[13px] bg-[#0f0f11] rounded-2xl border-2 border-dashed border-white/[0.07] flex flex-col items-center justify-center">
            <i className="fas fa-clipboard-check text-4xl block mb-3 opacity-50"></i> KHÔNG CÓ LỆNH THỢ
          </div>
        ) : (
          (() => {
            const channelPriority = {
                'QUỐC TẾ': 1,
                'BẢO HÀNH': 2,
                'TIKTOK SHOP': 3,
                'SHOPEE VN': 4,
                'CỘNG TÁC VIÊN': 5,
                'CTV': 5,
                'BÁN LẺ': 6,
                'BÁN SỈ': 7,
                'SẢN XUẤT TỒN': 8,
                'SẢN XUẤT BÙ KHO': 8
            };
            const getChannelPrio = (chan) => {
                const upper = String(chan || '').toUpperCase();
                for (const key in channelPriority) {
                    if (upper.includes(key)) return channelPriority[key];
                }
                return 99; // unknown channel
            };

            const sortedList = list.sort((a, b) => {
              const oA = (orders || []).find(x => x.id === a.orderId) || {};
              const oB = (orders || []).find(x => x.id === b.orderId) || {};
              
              const pA = getChannelPrio(oA.channel);
              const pB = getChannelPrio(oB.channel);
              if (pA !== pB) return pA - pB;

              if (statusTab === 'ĐÃ XONG' || statusTab === 'KIỂM ĐỊNH') {
                  const getEnd = (i) => i.phases?.phase2?.endTime || i.phases?.phase1?.endTime || i.phases?.phase2?.date || i.phases?.phase1?.date || '0';
                  const comp = String(getEnd(b)).localeCompare(String(getEnd(a)));
                  if (comp !== 0) return comp;
              } else {
                  const dateA = oA.createdAt || oA.date || '0';
                  const dateB = oB.createdAt || oB.date || '0';
                  const dateComp = String(dateA).localeCompare(String(dateB));
                  if (dateComp !== 0) return dateComp;
              }

              const dDiff = new Date(a.deadline || 0) - new Date(b.deadline || 0);
              if (dDiff !== 0) return dDiff;
              return String(a.id).localeCompare(String(b.id));
            });

            // 1. Group by channel first, preserving sorted order
            const channelGroups = [];
            
            sortedList.forEach(item => {
                const order = (orders || []).find(o => o.id === item.orderId) || {};
                const channelName = order.channel || 'KHÁC';
                const pA = getChannelPrio(channelName);
                const groupKey = pA === 99 ? 'KHÁC' : (Object.keys(channelPriority).find(k => String(channelName).toUpperCase().includes(k)) || channelName).toUpperCase();
                
                let group = channelGroups.find(g => g.groupKey === groupKey);
                if (!group) {
                    group = { groupKey, items: [], priority: pA };
                    channelGroups.push(group);
                }
                group.items.push(item);
            });

            // 2. Render channel groups
            return channelGroups.map((channelGroup, cgIdx) => {
                const { groupKey, items } = channelGroup;
                
                let isGroupCollapsed = collapsedGroups[groupKey];
                if (isGroupCollapsed === undefined) {
                    isGroupCollapsed = statusTab === 'ĐÃ XONG';
                }

                const badgeClass = typeof getChannelBadge === 'function' ? getChannelBadge(groupKey) : 'bg-gray-800 text-white border-gray-700';
                
                const groupHeader = (
                    <div 
                        onClick={() => setCollapsedGroups(prev => ({ ...prev, [groupKey]: !isGroupCollapsed }))}
                        className={`w-full py-2.5 px-4 mt-5 mb-2 flex items-center gap-3 rounded-2xl border uppercase tracking-widest shadow-md cursor-pointer select-none transition-all hover:opacity-90 active:scale-[0.99] ${badgeClass}`}
                    >
                        <div className="font-black text-[11px] flex items-center gap-2">
                            <i className="fas fa-layer-group opacity-80"></i> KÊNH BÁN: {groupKey}
                        </div>
                        <div className="ml-auto flex items-center gap-1.5 bg-black/30 px-2 py-1 rounded-lg">
                            <span className="text-[10px] text-white font-black">{items.length} lệnh</span>
                            <i className={`fas fa-chevron-${isGroupCollapsed ? 'down' : 'up'} ml-1 text-white/70`}></i>
                        </div>
                    </div>
                );

                if (isGroupCollapsed) {
                    return <React.Fragment key={groupKey}>{groupHeader}</React.Fragment>;
                }

                // Render items inside this channel
                let content = items.map((item, idx) => {
                    const order = (orders || []).find(o => {
                        const pOrd = String(item.orderId || '').trim();
                        const oOrd = String(o.id).trim();
                        if (pOrd === oOrd) return true;
                        if (pOrd.startsWith(oOrd + '_')) return true;
                        const parts = pOrd.split('|').map(x => x.trim());
                        if (parts.includes(oOrd)) return true;
                        if (parts.some(part => part.startsWith(oOrd + '_'))) return true;
                        return false;
                    }) || {};
                    return (
                        <WorkerCardV2 
                            key={item.id}
                            item={item} 
                            order={order} 
                            prodItems={prodItems} 
                            erpProducts={erpProducts} 
                            currentUser={currentUser} 
                            pushDeltas={pushDeltas} 
                            userConfigs={userConfigs} 
                            triggerToast={triggerToast} 
                            kpiConfig={kpiConfig} 
                            idx_num={idx + 1} 
                            isAdmin={adminCheck}
                            orders={orders}
                            models3D={models3D}
                            attendance={attendance}
                            configs={typeTab === 'Bể Kính' 
                              ? [{k:'phase1', n:'Cắt Dán', req:[]}, {k:'phase2', n:'Gọt Keo', req:['phase1']}] 
                              : [{k:'phase1', n:'Dựng Khung', req:[]}, {k:'phase2', n:'Gia Cố', req:['phase1']}]
                            } 
                            onEditItem={setEditingProdItem}
                        />
                    );
                });

                return (
                    <React.Fragment key={groupKey}>
                        {groupHeader}
                        {content}
                    </React.Fragment>
                );
            });
          })()
        )}
      </div>

      {globalPreview && (
          <div className="fixed inset-0 z-[99999] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in" onClick={() => setGlobalPreview(null)}>
              <div className="relative max-w-md w-full flex flex-col items-center animate-slide-up" onClick={e => e.stopPropagation()}>
                  <button className="absolute -top-12 right-0 text-white/70 hover:text-rose-400 text-2xl w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/20 rounded-full transition-all shadow-md" onClick={() => setGlobalPreview(null)}>
                      <i className="fas fa-times"></i>
                  </button>
                  <img src={globalPreview} alt="Ảnh nghiệm thu" className="w-full h-auto max-h-[75vh] object-contain rounded-2xl shadow-[0_0_30px_rgba(16,185,129,0.3)] border border-white/10 bg-black" />
                  <div className="mt-4 flex items-center justify-center gap-2 text-[#10b981] text-[11px] font-black uppercase tracking-[0.15em] bg-[#141414] px-5 py-2 rounded-full border border-[#10b981]/30 shadow-md">
                      <i className="fas fa-check-circle"></i> ẢNH KẾT QUẢ SẢN XUẤT CHÍNH XÁC
                  </div>
              </div>
          </div>
      )}

      {showAddSXTModal && (
        <AddModal 
          onClose={() => setShowAddSXTModal(false)} 
          pushDeltas={pushDeltas} 
          products={erpProducts} 
          erpData={erpData} 
          triggerToast={triggerToast} 
          userConfigs={userConfigs} 
          forceSXTOnly={true} 
        />
      )}

      {editingProdItem && (
          <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={() => setEditingProdItem(null)}>
              <div className="bg-[#141414] border border-[#333] w-full max-w-sm rounded-[24px] p-5 shadow-2xl flex flex-col relative animate-slide-up" onClick={e => e.stopPropagation()}>
                  <button onClick={() => setEditingProdItem(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-rose-500 flex items-center justify-center transition-all z-20"><i className="fas fa-times text-sm"></i></button>
                  <h3 className="text-white font-black text-[16px] uppercase tracking-widest mb-4 flex items-center gap-2"><i className="fas fa-edit text-[#d4af37]"></i> CHỈNH SỬA LỆNH</h3>
                  
                  <div className="space-y-4">
                      <div>
                          <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1.5">Ghi chú Lệnh</label>
                          <textarea 
                              value={editingProdItem.note || ''} 
                              onChange={e => setEditingProdItem({...editingProdItem, note: e.target.value})} 
                              className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl p-3 text-[12px] font-bold text-white outline-none focus:border-[#d4af37] min-h-[80px]"
                              placeholder="Nhập ghi chú hoặc cảnh báo cho thợ..."
                          ></textarea>
                      </div>

                      <div>
                          <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1.5">Giao đích danh (Bỏ trống = Ai cũng nhận được)</label>
                          <select 
                              value={editingProdItem.assignee || ''} 
                              onChange={e => setEditingProdItem({...editingProdItem, assignee: e.target.value})} 
                              className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-3 text-[12px] font-bold text-[#d4af37] outline-none focus:border-[#d4af37]"
                          >
                              <option value="">-- KHÔNG GIAO ĐÍCH DANH --</option>
                              {(Object.values(userConfigs?.pins || {})).map(u => <option key={u.name} value={u.name}>{u.name}</option>)}
                          </select>
                      </div>

                      <div>
                          <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest block mb-1.5">Hạn bàn giao</label>
                          <input 
                              type="datetime-local" 
                              value={editingProdItem.deadline ? String(editingProdItem.deadline).replace(' ', 'T').substring(0, 16) : ''} 
                              onChange={e => setEditingProdItem({...editingProdItem, deadline: e.target.value})} 
                              className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-3 text-[12px] font-bold text-white outline-none focus:border-[#d4af37]"
                          />
                      </div>
                  </div>

                  <button 
                      onClick={() => {
                          const upd = { ...editingProdItem };
                          pushDeltas({ prodItems: [upd] }, 'Đã lưu thay đổi', 'fa-save');
                          setEditingProdItem(null);
                      }} 
                      className="w-full mt-6 py-3.5 bg-[#d4af37] hover:bg-yellow-500 text-black font-black rounded-xl text-[12px] uppercase tracking-wider flex items-center justify-center gap-2 shadow-md active:scale-95 transition-all"
                  >
                      <i className="fas fa-check-circle"></i> LƯU THAY ĐỔI
                  </button>
              </div>
          </div>
      )}

      {annotationData && typeof ImageAnnotationModal !== 'undefined' && (
          <ImageAnnotationModal 
              item={annotationData.item || annotationData} 
              readOnly={annotationData.readOnly || false}
              onClose={() => setAnnotationData(null)} 
              onSave={(updatedItem) => {
                  pushDeltas({ prodItems: [updatedItem] }, 'Từ chối khung, đã báo lỗi cho thợ!', 'fa-exclamation-triangle');
                  setAnnotationData(null);
              }} 
          />
      )}
    </div>
  );
});
</script>
