<script type="text/babel">
// =========================================================================
// 🔨 FILE: Tab_Production.txt
// CHỨC NĂNG: Giao diện Xưởng sản xuất, chia việc cho thợ, theo dõi tiến độ
// =========================================================================

// -------------------------------------------------------------------------
// MỤC 1: COMPONENT CÁC KHÂU NHỎ BÊN TRONG (WorkerPhaseV2)
// -------------------------------------------------------------------------
function WorkerPhaseV2({ attendance, item, c, configs, order, prodItems, erpProducts, currentUser, pushDeltas, userConfigs, triggerToast, kpiConfig, isAdmin }) {
  const isCTV = localStorage.getItem('rf_role') === 'CTV';
  const roleStr = String(userConfigs?.[currentUser]?.role || '').toUpperCase();
  const isSenior = isAdmin && (roleStr === 'TỐI CAO' || currentUser === 'TỐI CAO');
  const data = (item.phases || {})[c.k] || { status: 'Pending' };
  const [processing, setProcessing] = React.useState(false);
  const [isEditingUser, setIsEditingUser] = React.useState(false);
  const [qcFront, setQcFront] = React.useState(null);
  const [qcSide, setQcSide] = React.useState(null);

  const parseDateSafe = (val) => {
    if (!val) return NaN;
    const str = String(val).trim();
    if (!str) return NaN;
    let s = str;
    if (s.includes(' ')) {
      s = s.replace(' ', 'T');
    }
    if (s.includes('T') && s.split(':').length === 2) {
      s += ':00';
    }
    const t = new Date(s).getTime();
    if (!isNaN(t)) return t;
    return new Date(val).getTime();
  };

  let isLocked = c.req.some(rk => (item.phases[rk] || {}).status !== 'Done');
  
  if (c.k === 'phase2' && item.phases?.phase1) {
      const isLegacyDone = item.phases.phase1.status === 'Done' && !item.qc_status && !item.qc_front_photo;
      if (!isLegacyDone && !String(item.qc_status || '').includes('Đã duyệt')) {
          isLocked = true;
      }
  }

  const isOwner = !data.user || String(data.user).trim() === '' || data.user === currentUser;
  const isPending = data.status !== 'In Progress' && data.status !== 'Done';
  const isInProgress = data.status === 'In Progress';
  const isDone = data.status === 'Done';

  const [timeText, setTimeText] = React.useState('');
  const [timeColorClass, setTimeColorClass] = React.useState('text-emerald-500');
  const [progressPercent, setProgressPercent] = React.useState(100);

  // Lấy định mức thời gian từ Config_KPI
  const kpiData = React.useMemo(() => {
    return typeof getSopAndReward === 'function' 
        ? getSopAndReward(item, c.n, kpiConfig || [], order?.channel) 
        : { time: 30, reward: 0 };
  }, [item, c.n, kpiConfig, order]);

  const limitMins = kpiData.time || 30;

  React.useEffect(() => {
    if (!isInProgress || !data.start) return;

    const updateTimer = () => {
      const startMs = parseDateSafe(data.start);
      let nowMs = Date.now();
      if (item.qc_status === 'Chờ duyệt khung' && data.endTime) {
          nowMs = parseDateSafe(data.endTime);
      }
      if (isNaN(startMs)) return;

      const elapsedMs = nowMs - startMs;
      const elapsedMins = elapsedMs / 60000;
      const remainingMins = limitMins - elapsedMins;

      if (remainingMins <= 0) {
        const overdueMs = Math.abs(remainingMins) * 60000;
        const overdueH = Math.floor(overdueMs / 3600000);
        const overdueM = Math.floor((overdueMs % 3600000) / 60000);
        const overdueS = Math.floor((overdueMs % 60000) / 1000);
        const overdueText = overdueH > 0 
            ? `${overdueH}h:${String(overdueM).padStart(2, '0')}m`
            : `${overdueM}:${String(overdueS).padStart(2, '0')}`;
        
        setTimeText(`Quá giờ ${overdueText}`);
        setTimeColorClass('text-rose-500 animate-pulse font-black');
        setProgressPercent(0);
      } else {
        const remainingMs = remainingMins * 60000;
        const remH = Math.floor(remainingMs / 3600000);
        const remM = Math.floor((remainingMs % 3600000) / 60000);
        const remS = Math.floor((remainingMs % 60000) / 1000);
        const remText = remH > 0 
            ? `${remH}h:${String(remM).padStart(2, '0')}m`
            : `${remM}:${String(remS).padStart(2, '0')}`;
        
        setTimeText(`Còn ${remText}`);
        const ratio = remainingMins / limitMins;
        setProgressPercent(ratio * 100);
        if (ratio <= 0.25) {
          setTimeColorClass('text-amber-500 font-black animate-pulse');
        } else {
          setTimeColorClass('text-emerald-400 font-bold');
        }
      }
    };

    updateTimer();
    const interval = setInterval(updateTimer, 1000);
    return () => clearInterval(interval);
  }, [isInProgress, data.start, limitMins]);

  const completedDurationText = React.useMemo(() => {
    const startMs = parseDateSafe(data.start);
    const endMs = parseDateSafe(data.endTime);
    if (isNaN(startMs) || !endMs) return '';
    const diffMins = Math.round((endMs - startMs) / 60000);
    return `Làm mất ${diffMins} phút`;
  }, [isDone, data.start, data.endTime]);

  if (isLocked) return null;

  const act = async (s) => {
    if (item.assignee && String(item.assignee).trim() !== '' && String(item.assignee).trim() !== String(currentUser).trim() && !isAdmin) {
        triggerToast(`Lệnh này đã được chỉ định cho ${item.assignee}. Bạn không thể nhận!`, 'fa-lock', 'danger');
        return;
    }

    if (s === 'In Progress') {
        const hasActiveCheckin = (attendance || []).some(a => 
            String(a.user).trim() === currentUser.trim() && 
            a.timeIn && !a.timeOut
        );
        if (!hasActiveCheckin) {
            triggerToast('Bạn phải Chấm Công vào ca trước khi bắt đầu làm việc!', 'fa-exclamation-triangle', 'danger');
            return;
        }
    }

    setProcessing(true);
    const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
    const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

    const upd = JSON.parse(JSON.stringify(item));
    upd.phases[c.k] = {
      ...upd.phases[c.k], 
      status: s, 
      user: currentUser, 
      date: currentDateTime.split(' ')[0], 
      start: s === 'In Progress' ? currentDateTime : data.start, 
      endTime: s === 'Done' ? currentDateTime : ''
    };

    let penaltyPayload = null;
    let payloadDeltas = { prodItems: [upd] };

    if (s === 'Done') {
        const startMs = parseDateSafe(data.start);
        const endMs = parseDateSafe(currentDateTime);
        let durationMins = 0;
        let isLate = false;
        let slaPenaltyRatio = 0;

        if (!isNaN(startMs) && !isNaN(endMs)) {
            durationMins = Math.round((endMs - startMs) / 60000);
            
            // 1. Anti-cheat (< 2 phút)
            if (durationMins < 2) {
                if (!window.confirm(`CẢNH BÁO ANTI-CHEAT: Bạn bấm Hoàn thành khi chưa đủ 2 phút làm việc. Hệ thống sẽ ghi nhận lỗi vi phạm thao tác (phạt 10.000đ). Vẫn tiếp tục?`)) {
                    setProcessing(false);
                    return;
                }
                penaltyPayload = {
                    id: 'BP_ANTICHEAT_' + Date.now(),
                    user: currentUser,
                    amount: -10000,
                    type: 'Phạt Vi Phạm',
                    note: `Bấm hoàn thành quá nhanh (< 2 phút) cho khâu ${c.n}`,
                    date: currentDateTime.split(' ')[0],
                    orderCode: item.orderId || ''
                };
                payloadDeltas.BonusPenalty = [penaltyPayload];
            }

            // 2. SLA Phạt trễ
            if (durationMins > limitMins) {
                isLate = true;
                const overdueMins = durationMins - limitMins;
                if (overdueMins <= 2) {
                    slaPenaltyRatio = 0.5; // Trễ <= 2 phút (ân hạn): Trừ 50%
                } else {
                    slaPenaltyRatio = 1.0; // Trễ > 2 phút: Trừ 100%
                }
            }
        }

        let baseReward = (item.note === 'Chất Lượng Kém') ? 0 : (kpiData.reward || 0);
        if (slaPenaltyRatio > 0) {
            baseReward = baseReward * (1 - slaPenaltyRatio);
            upd.phases[c.k].note = `Trễ hạn ${Math.round((endMs - startMs)/60000) - limitMins}p - Phạt ${slaPenaltyRatio * 100}% KPI`;
        }
        upd.phases[c.k].reward_vnd = baseReward;
    }

    if (s === 'Done' && isAdmin) upd.phases[c.k].adminCompleted = true;

    const p1 = upd.phases['phase1']?.status || 'Pending';
    const p2 = upd.phases['phase2']?.status || 'Pending';
    const isAllDone = (p1 === 'Done' && p2 === 'Done');
    if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';
    if (isAllDone) {
        if (upd.phases['phase1']?.adminCompleted || upd.phases['phase2']?.adminCompleted || isAdmin) {
            upd.status = 'Done';
        } else {
            upd.status = 'Kiểm Định';
        }
    }

    await pushDeltas(payloadDeltas, s === 'In Progress' ? `Đã nhận ${c.n}` : `Xong ${c.n}`, s === 'In Progress' ? 'fa-play' : 'fa-check');
    setProcessing(false);
  };

  const handlePhotoUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setProcessing(true);
    try {
      const b64 = typeof resizeImage === 'function' ? await resizeImage(file) : await new Promise((res, rej) => { const rd = new FileReader(); rd.onload=()=>res(rd.result.split(',')[1]); rd.readAsDataURL(file); });
      const url = await runGAS('uploadImage', b64, `SX_${item.id}_${c.k}.jpg`);
      if (!url) {
        throw new Error("Không thể tải ảnh lên Drive. Vui lòng kiểm tra lại quyền truy cập hoặc dung lượng Drive.");
      }
      
      const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
      const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

      const upd = JSON.parse(JSON.stringify(item));
      upd.phases[c.k] = {
        ...upd.phases[c.k], 
        status: 'Done', 
        user: currentUser, 
        date: currentDateTime.split(' ')[0], 
        start: data.start || currentDateTime, 
        endTime: currentDateTime,
        photo: url
      };

      let penaltyPayload = null;
      let payloadDeltas = { prodItems: [upd] };
      
      let durationMins = 0;
      let isLate = false;
      let slaPenaltyRatio = 0;

      if (upd.phases[c.k].start) {
        const startMs = parseDateSafe(upd.phases[c.k].start);
        const endMs = parseDateSafe(currentDateTime);
        if (!isNaN(startMs) && !isNaN(endMs)) {
          durationMins = Math.round((endMs - startMs) / 60000);
          
          // Anti-cheat (< 2 phút)
          if (durationMins < 2) {
              if (!window.confirm(`CẢNH BÁO ANTI-CHEAT: Bạn bấm Hoàn thành khi chưa đủ 2 phút làm việc. Hệ thống sẽ ghi nhận lỗi vi phạm thao tác (phạt 10.000đ). Vẫn tiếp tục?`)) {
                  setProcessing(false);
                  return;
              }
              penaltyPayload = {
                  id: 'BP_ANTICHEAT_' + Date.now(),
                  user: currentUser,
                  amount: -10000,
                  type: 'Phạt Vi Phạm',
                  note: `Bấm hoàn thành quá nhanh (< 2 phút) cho khâu ${c.n}`,
                  date: currentDateTime.split(' ')[0],
                  orderCode: item.orderId || ''
              };
              payloadDeltas.BonusPenalty = [penaltyPayload];
          }

          if (durationMins > limitMins) {
            isLate = true;
            const overdueMins = durationMins - limitMins;
            if (overdueMins <= 2) {
                slaPenaltyRatio = 0.5;
            } else {
                slaPenaltyRatio = 1.0;
            }
          }
        }
      }

      let baseReward = (item.note === 'Chất Lượng Kém') ? 0 : (kpiData.reward || 0);
      if (slaPenaltyRatio > 0) {
          baseReward = baseReward * (1 - slaPenaltyRatio);
          upd.phases[c.k].note = `Trễ hạn ${durationMins - limitMins}p - Phạt ${slaPenaltyRatio * 100}% KPI`;
      }
      upd.phases[c.k].reward_vnd = baseReward;

      if (isSenior) upd.phases[c.k].adminCompleted = true;

      const p1 = upd.phases['phase1']?.status || 'Pending';
      const p2 = upd.phases['phase2']?.status || 'Pending';
      const isAllDone = (p1 === 'Done' && p2 === 'Done');
      if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';
      if (isAllDone) {
          if (upd.phases['phase1']?.adminCompleted || upd.phases['phase2']?.adminCompleted || isSenior) {
              upd.status = 'Done';
          } else {
              upd.status = 'Kiểm Định';
          }
      }

      await pushDeltas(payloadDeltas, `Tải ảnh & hoàn thành ${c.n}`, 'fa-check-double');
      if (isLate || durationMins < 2) {
        triggerToast(`Có lỗi vi phạm thao tác/trễ hạn. Đã ghi nhận phạt!`, 'fa-times-circle', 'danger');
      } else {
        triggerToast(`Tải ảnh & hoàn thành ${c.n} thành công!`, 'fa-check', 'success');
      }

      // CẢNH BÁO TỒN KHO THÔNG MINH
      if (erpProducts && Array.isArray(erpProducts)) {
          const sku = String(item.sku || '').trim().toLowerCase();
          const pName = String(item.name || '').trim().toLowerCase();
          const matchedProd = erpProducts.find(p => 
              (sku && String(p.sku).trim().toLowerCase() === sku) || 
              (pName && String(p.name).trim().toLowerCase() === pName)
          );
          if (matchedProd) {
              const qty = Number(matchedProd.quantity) || 0;
              const minStk = Number(matchedProd.minStock) || 0;
              if (qty <= minStk) {
                  setTimeout(() => {
                      triggerToast(`🚨 KHO SẮP CẠN: ${matchedProd.name} (Còn ${qty} - Định mức ${minStk}). Cần bổ sung!`, 'fa-exclamation-triangle', 'danger');
                  }, 1500);
              }
          }
      }
    } catch (err) { 
      console.error(err);
      triggerToast(`Lỗi tải ảnh!`, 'fa-times', 'danger'); 
    } finally {
      e.target.value = '';
      setProcessing(false);
    }
  };

  const submitQC = async () => {
    if (!qcFront) return;
    setProcessing(true);
    try {
      const urlFront = await runGAS('uploadQCImage', qcFront, `QC_FRONT_${item.id}.jpg`);
      const urlSide = '';
      if (!urlFront) throw new Error("Không thể tải ảnh QC");
      
      const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
      const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

      const upd = JSON.parse(JSON.stringify(item));
      upd.qc_front_photo = urlFront;
      upd.qc_side_photo = urlSide;
      upd.phases[c.k].photo = urlFront;
      upd.phases[c.k].endTime = currentDateTime; 

      let payload = { prodItems: [upd] };
      let msg = `Đã gửi duyệt QC ${c.n}`;
      let icon = 'fa-upload';

      if (isSenior) {
          upd.qc_status = 'Đã duyệt (Auto-Pass)';
          
          fetch(window.SCRIPT_URL || '', {
              method: 'POST',
              body: JSON.stringify({ action: 'deductInventoryBOM', pin: localStorage.getItem('rf_pin'), prodId: upd.id })
          }).then(r => r.json()).then(res => {
              if (!res.success) console.warn("Lỗi trừ tồn kho BOM:", res.message);
          }).catch(console.error);
          
          const p1 = upd.phases['phase1']?.status || 'Pending';
          const p2 = upd.phases['phase2']?.status || 'Pending';
          const isAllDone = (p1 === 'Done' && p2 === 'Done');
          if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';
          
          if (isAllDone) {
              upd.status = 'Done';
              if (order && order.id) {
                  const allOrderProds = (prodItems || []).filter(p => p.orderId === item.orderId);
                  const isAllProdDone = allOrderProds.every(p => {
                      if (p.id === item.id) return true;
                      const pStatusUpper = String(p.status || '').toUpperCase().trim();
                      return pStatusUpper === 'DONE' || pStatusUpper === 'ĐÃ XONG' || pStatusUpper === 'HỦY/VỠ' || pStatusUpper === 'HOÀN KHO ĐẠT' || p.fulfilledFromStock;
                  });

                  if (isAllProdDone && (order.status === 'Chờ Sản Xuất' || order.status === 'Quét Tự Động' || order.status === 'Đang Sản Xuất')) {
                      payload.orders = [{ ...order, status: 'Sẵn sàng đóng gói' }];
                  }
              }
          }
          msg = `Đã Auto-Pass QC ${c.n}`;
          icon = 'fa-check-double';
      } else {
          upd.qc_status = 'Chờ duyệt khung';
      }

      await pushDeltas(payload, msg, icon);
      triggerToast(isSenior ? `Tự động duyệt QC thành công!` : `Gửi duyệt QC thành công!`, 'fa-check', 'success');
      
      // CẢNH BÁO TỒN KHO THÔNG MINH
      if (erpProducts && Array.isArray(erpProducts)) {
          const sku = String(item.sku || '').trim().toLowerCase();
          const pName = String(item.name || '').trim().toLowerCase();
          const matchedProd = erpProducts.find(p => 
              (sku && String(p.sku).trim().toLowerCase() === sku) || 
              (pName && String(p.name).trim().toLowerCase() === pName)
          );
          if (matchedProd) {
              const qty = Number(matchedProd.quantity) || 0;
              const minStk = Number(matchedProd.minStock) || 0;
              if (qty <= minStk) {
                  setTimeout(() => {
                      triggerToast(`🚨 KHO SẮP CẠN: ${matchedProd.name} (Còn ${qty} - Định mức ${minStk}). Cần bổ sung!`, 'fa-exclamation-triangle', 'danger');
                  }, 1500);
              }
          }
      }
      setQcFront(null); setQcSide(null);
    } catch (err) {
      console.error(err);
      triggerToast(`Lỗi tải ảnh QC!`, 'fa-times', 'danger');
    } finally {
      setProcessing(false);
    }
  };

  const adminAutoPass = async () => {
      setProcessing(true);
      try {
          const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
          const currentDateTime = safeDateFull.slice(0, 16).replace('T', ' ');

          const upd = JSON.parse(JSON.stringify(item));
          upd.phases[c.k] = {
            ...upd.phases[c.k], 
            status: 'Done', 
            user: currentUser, 
            date: currentDateTime.split(' ')[0], 
            start: data.start || currentDateTime, 
            endTime: currentDateTime,
            photo: 'AUTO-PASS',
            adminCompleted: true
          };

          let durationMins = 0;
          if (upd.phases[c.k].start) {
              const startMs = parseDateSafe(upd.phases[c.k].start);
              const endMs = parseDateSafe(currentDateTime);
              if (!isNaN(startMs) && !isNaN(endMs)) {
                  durationMins = Math.round((endMs - startMs) / 60000);
              }
          }

          upd.phases[c.k].reward_vnd = (item.note === 'Chất Lượng Kém') ? 0 : (kpiData.reward || 0);
          
          let payloadDeltas = { prodItems: [upd] };
          
          if (c.k === 'phase1') {
              upd.qc_status = 'Đã duyệt (Auto-Pass)';
              
              fetch(window.SCRIPT_URL || '', {
                  method: 'POST',
                  body: JSON.stringify({ action: 'deductInventoryBOM', pin: localStorage.getItem('rf_pin'), prodId: upd.id })
              }).then(r => r.json()).catch(console.error);
          }
          
          const p1 = upd.phases['phase1']?.status || 'Pending';
          const p2 = upd.phases['phase2']?.status || 'Pending';
          const isAllDone = (p1 === 'Done' && p2 === 'Done');
          if (!isAllDone && upd.status === 'Pending') upd.status = 'In Progress';
          
          if (isAllDone) {
              upd.status = 'Done';
              if (c.k === 'phase1' && order && order.id) {
                  const allOrderProds = (prodItems || []).filter(p => p.orderId === item.orderId);
                  const isAllProdDone = allOrderProds.every(p => {
                      if (p.id === item.id) return true;
                      const pStatusUpper = String(p.status || '').toUpperCase().trim();
                      return pStatusUpper === 'DONE' || pStatusUpper === 'ĐÃ XONG' || pStatusUpper === 'HỦY/VỠ' || pStatusUpper === 'HOÀN KHO ĐẠT' || p.fulfilledFromStock;
                  });

                  if (isAllProdDone && (order.status === 'Chờ Sản Xuất' || order.status === 'Quét Tự Động' || order.status === 'Đang Sản Xuất')) {
                      payloadDeltas.orders = [{ ...order, status: 'Sẵn sàng đóng gói' }];
                  }
              }
          }

          await pushDeltas(payloadDeltas, `Auto-Pass khâu ${c.n}`, 'fa-check-double');
          triggerToast(`Đã Auto-Pass thành công!`, 'fa-check', 'success');

          // CẢNH BÁO TỒN KHO THÔNG MINH
          if (erpProducts && Array.isArray(erpProducts)) {
              const sku = String(item.sku || '').trim().toLowerCase();
              const pName = String(item.name || '').trim().toLowerCase();
              const matchedProd = erpProducts.find(p => 
                  (sku && String(p.sku).trim().toLowerCase() === sku) || 
                  (pName && String(p.name).trim().toLowerCase() === pName)
              );
              if (matchedProd) {
                  const qty = Number(matchedProd.quantity) || 0;
                  const minStk = Number(matchedProd.minStock) || 0;
                  if (qty <= minStk) {
                      setTimeout(() => {
                          triggerToast(`🚨 KHO SẮP CẠN: ${matchedProd.name} (Còn ${qty} - Định mức ${minStk}). Cần bổ sung!`, 'fa-exclamation-triangle', 'danger');
                      }, 1500);
                  }
              }
          }
      } catch (err) {
          console.error(err);
          triggerToast(`Lỗi Auto-Pass!`, 'fa-times', 'danger');
      } finally {
          setProcessing(false);
      }
  };

  const handleQC = async (e, type) => {
      const file = e.target.files[0];
      if (!file) return;
      setProcessing(true);
      try {
          const resImg = typeof resizeImage === 'function' ? await resizeImage(file) : await new Promise((res) => { const rd = new FileReader(); rd.onload=()=>res(rd.result); rd.readAsDataURL(file); });
          const b64 = resImg.includes(',') ? resImg.split(',')[1] : resImg;
          if (type === 'front') setQcFront(b64);
          if (type === 'side') setQcSide(b64);
      } catch (err) {
          triggerToast('Lỗi xử lý ảnh!', 'fa-times', 'danger');
      } finally {
          e.target.value = '';
          setProcessing(false);
      }
  };

  const userName = data.user ? data.user.split(' ').pop() : 'Chờ nhận việc';
  const phaseAvatar = data.user ? 
      <Avatar name={data.user} userConfigs={userConfigs} className="w-[32px] h-[32px] shrink-0 border border-[#333] shadow-sm rounded-full" /> 
      : 
      <div className="w-[32px] h-[32px] rounded-full bg-[#222] border border-[#333] flex items-center justify-center text-gray-500"><i className="fas fa-user text-[14px]"></i></div>;

  return (
    <div className="w-full py-2 bg-[#0a0a0a] rounded-xl px-2.5 border border-[#222] flex flex-col gap-1">
      <div className="flex items-center justify-between w-full">
        <div className="flex items-center gap-3 min-w-0 pr-2">
            {phaseAvatar}
            <div className="flex flex-col">
                <span className={`font-black text-[10px] uppercase ${isDone ? 'text-[#10b981]' : (isInProgress ? 'text-amber-500' : 'text-gray-500')}`}>{c.n}</span>
                <div className="flex flex-col">
                    <div className="flex items-center gap-1.5 relative">
                        {isEditingUser ? (
                            <select 
                                autoFocus
                                className="bg-[#141414] text-amber-400 font-bold text-[12px] border border-[#d4af37] rounded outline-none py-0.5 px-1 max-w-[120px]"
                                defaultValue={data.user}
                                onChange={(e) => {
                                    const newName = e.target.value;
                                    const upd = JSON.parse(JSON.stringify(item));
                                    if (newName === "") {
                                        upd.phases[c.k].user = "";
                                        upd.phases[c.k].status = "Pending";
                                        if (upd.status === "In Progress" && upd.phases[c.k === 'phase1' ? 'phase2' : 'phase1']?.status !== "In Progress") {
                                            upd.status = "Pending";
                                        }
                                    } else {
                                        upd.phases[c.k].user = newName;
                                    }
                                    pushDeltas({ prodItems: [upd] }, 'Đã đổi người nhận việc', 'fa-user-edit');
                                    setIsEditingUser(false);
                                }}
                                onBlur={() => setIsEditingUser(false)}
                                onClick={e => e.stopPropagation()}
                            >
                                <option value="">-- Bỏ nhận việc --</option>
                                {(Object.values(userConfigs?.pins || {})).map(u => (
                                    <option key={u.name} value={u.name}>{u.name}</option>
                                ))}
                            </select>
                        ) : (
                            <React.Fragment>
                                <span className={`font-bold text-[13px] truncate ${isOwner && !isDone && isInProgress ? 'text-amber-400' : 'text-[#f5f5f5]'}`}>{userName}</span>
                                {isAdmin && data.user && !isDone && (
                                    <button onClick={(e) => { e.stopPropagation(); setIsEditingUser(true); }} className="w-5 h-5 bg-gray-500/20 text-gray-400 hover:text-[#d4af37] rounded flex items-center justify-center transition-colors">
                                        <i className="fas fa-pencil-alt text-[9px]"></i>
                                    </button>
                                )}
                            </React.Fragment>
                        )}
                    </div>
                    {isDone && completedDurationText && (
                        <span className="text-[9px] text-zinc-500 font-bold leading-tight flex items-center flex-wrap">
                            🕒 {completedDurationText} 
                            {data.reward_vnd === 0 ? (
                                <span className="text-rose-500 font-black ml-1">(Trễ - Cắt Thưởng)</span>
                            ) : (data.reward_vnd > 0 && (
                                <span className={`${item.status === 'Done' || String(item.status).toUpperCase() === 'ĐÃ XONG' ? 'text-emerald-500' : 'text-amber-500'} font-black ml-1`}>
                                    (+{(localStorage.getItem('rf_role') === 'CTV') ? '***' : data.reward_vnd.toLocaleString()}đ {item.status === 'Done' || String(item.status).toUpperCase() === 'ĐÃ XONG' ? 'Đã duyệt' : 'Tạm thời'})
                                </span>
                            ))}
                        </span>
                    )}
                </div>
            </div>
        </div>

        <div className="shrink-0 w-[130px]">
            {item.qc_note && (isPending || isInProgress) && (
                <button onClick={(e) => { e.stopPropagation(); window.dispatchEvent(new CustomEvent('openAnnotationModal', { detail: { item, readOnly: true } })); }} className="w-full py-1.5 mb-1.5 bg-rose-500/10 text-rose-500 border border-rose-500/30 hover:bg-rose-500 hover:text-white rounded-lg font-black text-[10px] uppercase tracking-wider flex justify-center items-center gap-1.5 shadow-sm active:scale-95 transition-all animate-pulse">
                    <i className="fas fa-exclamation-circle text-[12px]"></i> XEM LỖI KCS
                </button>
            )}
            {isPending && !isCTV && (
                (!data.user || String(data.user).trim() === String(currentUser).trim() || isAdmin) ? (
                    <button onClick={(e) => { e.stopPropagation(); act('In Progress'); }} disabled={processing} className="w-full py-2 bg-[#2563eb] text-white rounded-lg font-black text-[11px] uppercase tracking-wider hover:bg-blue-600 active:scale-95 shadow-md flex justify-center items-center gap-1.5">
                        {processing ? <i className="fas fa-spinner fa-spin text-[14px]"></i> : <><i className="fas fa-play text-[10px]"></i> NHẬN LÀM</>}
                    </button>
                ) : (
                    <div className="w-full py-2 bg-[#1a1a1a] text-rose-500 rounded-lg font-black text-[10px] uppercase tracking-wider text-center border border-rose-500/30 flex justify-center items-center gap-1">
                        <i className="fas fa-lock text-[10px]"></i> KHOÁ: {String(data.user).split(' ').pop().toUpperCase()}
                    </div>
                )
            )}
            {isPending && isCTV && (
                <div className="w-full py-2 bg-[#1a1a1a] text-gray-500 rounded-lg font-bold text-[10px] uppercase tracking-wider text-center border border-[#333]">CHỜ LÀM</div>
            )}

            {isInProgress && isOwner && !isCTV && (
                c.k === 'phase1' ? (
                    item.qc_status === 'Chờ duyệt khung' ? (
                        <div className="w-full py-2 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-lg text-center font-black text-[10px] uppercase tracking-wider">
                            <i className="fas fa-spinner fa-spin mr-1"></i> CHỜ DUYỆT KHUNG
                        </div>
                    ) : (
                        <div className="flex flex-col gap-1.5 w-full">
                            <label onClick={(e) => e.stopPropagation()} className={`w-full m-0 py-1.5 border rounded cursor-pointer flex items-center justify-center text-[9px] uppercase tracking-wider font-bold gap-1.5 ${qcFront ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-[#1a1a1a] border-[#333] text-gray-300 hover:bg-[#222]'}`}>
                               {qcFront ? <i className="fas fa-check"></i> : <i className="fas fa-camera"></i>} {qcFront ? "Đã chụp ảnh mặt trước" : "Chụp ảnh chính diện"}
                               <input type="file" accept="image/png, image/jpeg, image/jpg" capture="environment" className="hidden" onChange={(e) => handleQC(e, 'front')} disabled={processing}/>
                            </label>
                            <div className="flex gap-1.5 w-full">
                                <button onClick={(e) => { e.stopPropagation(); submitQC(); }} disabled={processing || !qcFront} className={`flex-1 py-1.5 rounded font-black text-[10px] uppercase tracking-wider shadow-md flex justify-center items-center gap-1.5 ${(processing || !qcFront) ? 'bg-gray-600 text-gray-400 cursor-not-allowed' : 'bg-amber-500 text-black hover:bg-amber-400 active:scale-95'}`}>
                                    {processing ? <i className="fas fa-spinner fa-spin text-[14px]"></i> : <><i className="fas fa-paper-plane text-[11px]"></i> GỬI DUYỆT</>}
                                </button>
                                {isSenior && (
                                    <button onClick={(e) => { e.stopPropagation(); adminAutoPass(); }} disabled={processing} className="px-3 py-1.5 bg-[#d4af37] text-black hover:bg-yellow-500 rounded font-black text-[10px] uppercase tracking-wider shadow-md flex justify-center items-center gap-1 active:scale-95" title="Bỏ qua tải ảnh & Xong ngay">
                                        <i className="fas fa-forward"></i> PASS
                                    </button>
                                )}
                            </div>
                        </div>
                    )
                ) : (
                    <div className="flex gap-1.5 w-full">
                        <label onClick={(e) => e.stopPropagation()} className="flex-1 m-0 py-2 bg-amber-500 text-black rounded-lg cursor-pointer hover:bg-amber-400 flex items-center justify-center active:scale-95 shadow-md font-black text-[11px] uppercase tracking-wider gap-1.5">
                            {processing ? <i className="fas fa-spinner fa-spin text-[14px]"></i> : <><i className="fas fa-camera text-[14px]"></i> CHỤP ẢNH</>}
                            <input type="file" accept="image/png, image/jpeg, image/jpg" capture="environment" className="hidden" onChange={handlePhotoUpload} disabled={processing}/>
                        </label>
                        {isSenior && (
                            <button onClick={(e) => { e.stopPropagation(); adminAutoPass(); }} disabled={processing} className="px-4 py-2 bg-[#d4af37] text-black hover:bg-yellow-500 rounded-lg font-black text-[11px] uppercase tracking-wider shadow-md flex justify-center items-center gap-1.5 active:scale-95" title="Bỏ qua tải ảnh & Xong ngay">
                                <i className="fas fa-forward"></i> PASS
                            </button>
                        )}
                    </div>
                )
            )}

            {isInProgress && (!isOwner || isCTV) && (
                <div className="w-full py-2 bg-[#1a1a1a] text-amber-500 rounded-lg font-bold text-[10px] uppercase tracking-wider text-center border border-[#333]">ĐANG LÀM</div>
            )}

            {isDone && data.photo && (
                <div className="flex gap-1 w-full mt-1">
                    <button onClick={(e) => { e.stopPropagation(); window.dispatchEvent(new CustomEvent('triggerInternalPreview', { detail: data.photo })); }} className="flex-1 py-1.5 bg-[#10b981]/10 text-[#10b981] border border-[#10b981]/30 hover:bg-[#10b981] hover:text-white rounded-lg font-black text-[11px] flex items-center justify-center shadow-sm gap-1.5 uppercase active:scale-95 transition-all">
                        <i className="fas fa-image text-[13px]"></i> XEM ẢNH
                    </button>
                    {isAdmin && c.k === 'phase1' && (
                        <button onClick={(e) => {
                            e.stopPropagation();
                            const reason = window.prompt('Vị trí/chi tiết cần sửa (để trống nếu không có):');
                            if (reason !== null) {
                                const upd = JSON.parse(JSON.stringify(item));
                                upd.phases[c.k].status = 'Pending';
                                upd.status = 'Pending';
                                const prefix = reason.trim() ? `YÊU CẦU LÀM LẠI ${c.n} (Sửa: ${reason.trim()})` : `YÊU CẦU LÀM LẠI ${c.n}`;
                                upd.note = prefix + (upd.note ? ' | ' + upd.note : '');
                                pushDeltas({ prodItems: [upd] }, 'Yêu cầu làm lại khâu 1', 'fa-undo');
                            }
                        }} className="w-[32px] shrink-0 py-1.5 bg-rose-500/10 text-rose-500 border border-rose-500/30 hover:bg-rose-500 hover:text-white rounded-lg font-black text-[11px] flex items-center justify-center shadow-sm uppercase active:scale-95 transition-all" title="Yêu cầu làm lại">
                            <i className="fas fa-undo text-[12px]"></i>
                        </button>
                    )}
                </div>
            )}
        </div>
      </div>

      {/* Progress Bar đếm ngược khi đang làm việc */}
      {isInProgress && (
          <div className="w-full border-t border-zinc-900 pt-1.5 mt-1 space-y-1">
              <div className="flex justify-between items-center text-[9px] font-bold">
                  <span className="text-zinc-500">Định mức: {limitMins} phút</span>
                  <span className={timeColorClass}>{timeText}</span>
              </div>
              <div className="w-full bg-zinc-900 rounded-full h-1 overflow-hidden">
                  <div 
                      className={`h-full transition-all duration-1000 ${
                          progressPercent > 25 ? 'bg-emerald-500' : (progressPercent > 0 ? 'bg-amber-500' : 'bg-rose-500')
                      }`}
                      style={{ width: `${progressPercent}%` }}
                  ></div>
              </div>
          </div>
      )}
    </div>
  );
}

// -------------------------------------------------------------------------
// MỤC 2: COMPONENT THẺ HIỂN THỊ BAO NGOÀI (WorkerCardV2)
// -------------------------------------------------------------------------
function WorkerCardV2({ attendance, item, order, prodItems, erpProducts, currentUser, pushDeltas, configs, userConfigs, triggerToast, kpiConfig, idx_num, isAdmin, orders, models3D, onEditItem }) {
  const isCTV = localStorage.getItem('rf_role') === 'CTV';
  const userRole = String(localStorage.getItem('rf_role') || '').toUpperCase();
  const canApproveQC = userRole === 'TỐI CAO' || userRole === 'QUẢN LÝ SẢN XUẤT' || userRole === 'QUẢN LÝ KHO';
  const [optimisticItem, setOptimisticItem] = React.useState(null);
  const [isExpanded, setIsExpanded] = React.useState(false);
  const [previewImg, setPreviewImg] = React.useState(null);
  const [preview3DUrl, setPreview3DUrl] = React.useState(null);
  const [showReworkForm, setShowReworkForm] = React.useState(false);
  const [reworkPhase, setReworkPhase] = React.useState('');
  const [reworkReason, setReworkReason] = React.useState('');
  const [overrideSLA, setOverrideSLA] = React.useState(false);

  const getModelForProduct = (productId) => {
      if (!models3D || !erpProducts) return null;
      const prod = erpProducts.find(p => p.id === productId);
      if (!prod) return null;
      let baseName = prod.name || '';
      if (baseName.includes(' - ')) baseName = baseName.split(' - ')[0].trim();
      
      const sameBaseProds = erpProducts.filter(p => {
          let bn = p.name || '';
          if (bn.includes(' - ')) bn = bn.split(' - ')[0].trim();
          return bn.toLowerCase() === baseName.toLowerCase();
      });
      
      return models3D.find(m => sameBaseProds.some(p => p.id === m.productId));
  };

  React.useEffect(() => { setOptimisticItem(null); }, [item]);
  
  const _item = optimisticItem || item;
  const wrappedPushDeltas = (payload, msg, icon) => {
    if (payload.prodItems && payload.prodItems[0]) { setOptimisticItem(payload.prodItems[0]); }
    return pushDeltas(payload, msg, icon).catch(() => triggerToast("Đang đồng bộ ngầm...", "fa-wifi", "warning"));
  };

  const productInfo = (erpProducts || []).find(p => p.name === _item.name) || {};
  const productImage = productInfo.image;
  
  let displayCoverImage = _item.realCoverImage;
  let rawNote = String(_item.note || '');
  if (!displayCoverImage) {
      const match = rawNote.match(/\|\s*Cover:\s*(https?:\/\/[^\s|]+)/i);
      if (match && match[1]) {
          displayCoverImage = match[1];
      }
  }
  const realImage = displayCoverImage || productInfo.realImage;
  const oCode = (order.orderCode || '').split(' | MVĐ: ')[0] || 'ĐƠN LẺ';
  const isBuKho = order.channel === 'Sản Xuất Bù Kho' || order.channel === 'Sản Xuất Tồn' || _item.fulfilledFromStock;

  const p1Status = _item.phases?.phase1?.status || 'Pending';
  const p2Status = _item.phases?.phase2?.status || 'Pending';
  const isAnyInProgress = p1Status === 'In Progress' || p2Status === 'In Progress';
  const isLegacyDone = p1Status === 'Done' && !_item.qc_status && !_item.qc_front_photo;
  const isPhase2Pending = (isLegacyDone || _item.qc_status === 'Đã duyệt') && p2Status === 'Pending' && _item.status !== 'Done' && _item.status !== 'Đã Huỷ';
  const isReadyForInspection = _item.status === 'Kiểm Định' || (p1Status === 'Done' && p2Status === 'Done' && _item.status !== 'Done' && _item.status !== 'Đã Huỷ');
  
  const isItemDone = _item.status === 'Done' || String(_item.status).toUpperCase() === 'ĐÃ XONG';
  const noteStr = String(_item.note || '').toUpperCase();
  const qcStatusStr = String(_item.qc_status || '').toUpperCase();
  const isRejected = noteStr.includes('CHẤT LƯỢNG KÉM') || 
                     noteStr.includes('TỪ CHỐI') || 
                     noteStr.includes('LÀM LẠI') || 
                     qcStatusStr.includes('TỪ CHỐI') ||
                     qcStatusStr.includes('LÀM LẠI');

  const assignedUser = (_item.phases?.phase1?.user || _item.phases?.phase2?.user || '').trim();

  const cleanItemNote = (note) => {
    if (!note) return '';
    let n = String(note);
    n = n.replace(/Sản xuất bù kho cho đơn \S+ \(Tự động bốc từ kho tồn\)/gi, '');
    n = n.replace(/\|?\s*\[TỰ ĐỘNG BÙ KHO\] Trả hàng cho đơn \S+/gi, '');
    n = n.replace(/\[TỰ ĐỘNG BÙ KHO\] Trả hàng cho đơn \S+/gi, '');
    n = n.replace(/SẢN XUẤT MỚI CHO ĐƠN \S+/gi, '');
    n = n.replace(/SẢN XUẤT BÙ KHO CHO ĐƠN \S+/gi, '');
    n = n.replace(/\|\s*Cover:\s*https?:\/\/[^\s|]+/gi, '');
    n = n.replace(/^\|\s*/, '');
    n = n.replace(/\s*\|$/, '');
    return n.trim();
  };

  const cleanOrderNote = (note) => {
    if (!note) return '';
    return String(note).replace(/\|?\s*Link Bill Cọc:.*$/, '').trim();
  };

  const isStock = _item.fulfilledFromStock === true || String(_item.fulfilledFromStock).toUpperCase() === 'TRUE';
  if (isStock) {
      return (
          <div className="rf-card rounded-2xl p-4 border border-[#10b981]/30 bg-[#10b981]/5 mb-3 shadow-sm flex items-center justify-between">
              <div className="flex gap-3 items-center min-w-0">
                  <div className="w-12 h-12 shrink-0 bg-[#0a0a0a] rounded-lg border border-[#333] overflow-hidden flex items-center justify-center">
                      {productImage ? <img src={productImage} className="w-full h-full object-cover opacity-90" alt="img" /> : <i className="fas fa-image text-[#444] text-xl"></i>}
                  </div>
                  <div className="flex flex-col">
                      <span className="text-white font-black text-[13px] uppercase truncate">{_item.name}</span>
                      <span className="text-[#10b981] text-[10px] font-bold mt-1"><i className="fas fa-check-circle mr-1"></i>HÀNG ĐÃ CÓ SẴN (XUẤT TỪ KHO)</span>
                  </div>
              </div>
          </div>
      );
  }

  return (
    <React.Fragment>
      <div className={`rf-card relative hover:border-[#444] transition-all p-3.5 mb-3 ${
            isItemDone 
                ? 'bg-[#10b981]/15 border border-[#10b981]/40' 
                : isAnyInProgress 
                    ? 'neon-running-dot neon-running-blue shadow-[0_0_15px_rgba(59,130,246,0.3)]' 
                    : isPhase2Pending
                        ? 'neon-running-dot neon-running-green shadow-[0_0_15px_rgba(16,185,129,0.3)]'
                        : isReadyForInspection
                            ? 'neon-running-dot neon-running-yellow shadow-[0_0_15px_rgba(234,179,8,0.3)]'
                            : isRejected
                                ? 'neon-running-dot neon-running-red shadow-[0_0_15px_rgba(239,68,68,0.3)]'
                                : 'bg-[#141414] border border-[#2a2a2a]'
        }`}>
        
        <div className="flex flex-col w-full cursor-pointer relative" onClick={() => setIsExpanded(!isExpanded)}>
           
           {/* === HÀNG NHÃN Ở TRÊN CÙNG === */}
           <div className="flex items-center gap-1.5 mb-2.5 w-full flex-wrap pr-20">
              <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border uppercase shadow-sm truncate ${typeof getChannelBadge === 'function' ? getChannelBadge(order.channel) : 'bg-blue-600 text-white border border-blue-500'}`}>
                  {order.channel || 'OFFLINE'}
              </span>
              <span className="text-[10px] font-black text-gray-400 truncate uppercase">{oCode}</span>

              {/* HẠN BÀN GIAO NẰM CẠNH MÃ ĐƠN HÀNG */}
              {_item.deadline && (
                <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border uppercase shadow-sm flex items-center gap-1 ${
                  new Date(_item.deadline) < new Date() 
                    ? 'bg-rose-500/25 text-rose-400 border-rose-500/30 animate-pulse' 
                    : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
                }`}>
                    <i className="fas fa-clock"></i> HẠN: {String(_item.deadline).replace('T', ' ').slice(0, 16)}
                </span>
              )}

              {/* CÁC NHÃN TRẠNG THÁI */}
              {isItemDone && (
                  <span className="text-[8px] font-black px-1.5 py-0.5 bg-[#10b981]/20 text-[#10b981] border border-[#10b981]/40 rounded shadow-sm uppercase tracking-wider flex items-center gap-1">
                      <i className="fas fa-check-circle"></i> {(_item.fulfilledFromStock === true || String(_item.fulfilledFromStock).toUpperCase() === 'TRUE') ? 'ĐÃ LẤY TỪ KHO' : 'ĐẠT KCS'}
                  </span>
              )}

              {_item.qc_status === 'Chờ duyệt khung' && (
                  <span className="text-[8px] font-black px-1.5 py-0.5 bg-indigo-500/20 text-indigo-400 border border-indigo-500/40 rounded shadow-sm uppercase tracking-wider flex items-center gap-1 animate-pulse">
                      <i className="fas fa-search"></i> CHỜ DUYỆT KHÂU 1
                  </span>
              )}

              {_item.assignee && (
                <span className="text-[8px] font-black px-1.5 py-0.5 bg-[#d4af37]/20 text-[#d4af37] border border-[#d4af37]/40 rounded shadow-sm uppercase tracking-wider flex items-center gap-1">
                    <i className="fas fa-lock"></i> CHỈ ĐỊNH: {_item.assignee}
                </span>
              )}

              {assignedUser && (
                <span className="text-[8px] font-black px-1.5 py-0.5 bg-[#3b82f6]/20 text-[#60a5fa] border border-[#3b82f6]/30 rounded shadow-sm uppercase tracking-wider flex items-center gap-1">
                    <i className="fas fa-user-cog"></i> THỢ: {assignedUser}
                </span>
              )}
           </div>

           {/* === HÌNH ẢNH & THÔNG TIN SẢN PHẨM === */}
           <div className="flex gap-3 w-full relative">
               <div className="w-[60px] h-[60px] shrink-0 relative z-10">
                  <div className="w-full h-full bg-[#0a0a0a] rounded-lg border border-[#333] overflow-hidden flex items-center justify-center relative shadow-sm">
                    <div className="absolute top-0.5 left-0.5 w-3.5 h-3.5 bg-black/80 text-[#d4af37] font-black text-[8px] rounded-full flex items-center justify-center border border-[#333] z-10">{idx_num}</div>
                    {productImage ? <img src={productImage} className="w-full h-full object-cover opacity-90" alt="img" /> : <i className="fas fa-image text-[#444] text-xl"></i>}
                  </div>
               </div>

               <div className="flex-1 min-w-0 flex flex-col justify-center pr-8">
                  {(() => {
                      const isFinished = _item.status === 'Done' || _item.status === 'Đã Huỷ' || _item.status === 'Cancel' || _item.status === 'Huỷ';
                      const deadlineStr = _item.deadline || order.createdAt;
                      const tzOffset = (new Date()).getTimezoneOffset() * 60000;
                      const nowMonthStr = new Date(Date.now() - tzOffset).toISOString().slice(0, 7);
                      const isBacklog = !isFinished && deadlineStr && String(deadlineStr) < nowMonthStr;
                      return (
                          <div className="flex items-center gap-1.5 flex-wrap">
                              {isBacklog && <span className="bg-rose-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm animate-pulse">TỒN ĐỌNG</span>}
                              <h4 className={`font-black text-[13px] break-words ${isItemDone ? 'text-[#34d399]' : 'text-[#d4af37]'}`} title={_item.name}>{_item.name}</h4>
                          </div>
                      );
                  })()}
                  
                  {/* === KHỐI GHI CHÚ (VISUAL ENFORCEMENT) CẢNH BÁO CHO THỢ === */}
                  {(() => {
                    const displayItemNote = cleanItemNote(_item.note);
                    return displayItemNote && (
                      <div className="mt-2 p-2 bg-rose-500/10 border-l-[3px] border-rose-500 rounded-r-lg flex items-start gap-1.5 shadow-sm w-full relative">
                          <i className="fas fa-exclamation-triangle text-rose-500 animate-pulse mt-[2px] shrink-0 text-[11px]"></i>
                          <div className="text-[11px] font-black text-rose-400 leading-snug whitespace-normal break-words pr-8">
                              {displayItemNote}
                          </div>
                          {_item.qc_note && (
                              <button 
                                  onClick={(e) => {
                                      e.stopPropagation();
                                      window.dispatchEvent(new CustomEvent('openAnnotationModal', { detail: { item: _item, readOnly: true } }));
                                  }}
                                  className="absolute right-2 top-1/2 -translate-y-1/2 bg-rose-500 text-white w-7 h-7 rounded-full flex items-center justify-center hover:bg-rose-600 shadow-md active:scale-95 transition-all"
                                  title="Xem ảnh ghim lỗi chi tiết"
                              >
                                  <i className="fas fa-search-plus text-[12px]"></i>
                              </button>
                          )}
                      </div>
                    );
                  })()}

                  {/* === KHỐI GHI CHÚ ĐƠN HÀNG === */}
                  {(() => {
                    const displayOrderNote = cleanOrderNote(order.note);
                    const displayOrderNoteClean = cleanItemNote(displayOrderNote);
                    return displayOrderNoteClean && (
                      <div className="mt-2 p-2 bg-indigo-500/10 border-l-[3px] border-indigo-500 rounded-r-lg flex items-start gap-1.5 shadow-sm w-full">
                          <i className="fas fa-comment-alt text-indigo-400 mt-[2.5px] shrink-0 text-[10px]"></i>
                          <div className="text-[11px] font-black text-indigo-300 leading-snug whitespace-normal break-words">
                              <span className="uppercase mr-1 underline decoration-indigo-500/50">LƯU Ý ĐƠN HÀNG:</span>{displayOrderNoteClean}
                          </div>
                      </div>
                    );
                  })()}
               </div>
           </div>

           {/* NÚT THAO TÁC Ở GÓC TRÊN CÙNG BÊN PHẢI */}
           <div className="absolute top-0 right-0 flex gap-1 z-30">
              {realImage && (
                 <button onClick={(e) => { 
                     e.stopPropagation(); 
                     const m3d = getModelForProduct(_item.productId);
                     if (m3d && m3d.url) {
                         setPreview3DUrl(m3d.url);
                     } else {
                         setPreviewImg(realImage); 
                     }
                 }} className="w-6 h-6 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500 hover:text-black rounded flex items-center justify-center transition-colors shadow-sm" title="Xem ảnh thật/mẫu 3D">
                   <i className="fas fa-camera text-[10px]"></i>
                 </button>
              )}
              {(localStorage.getItem('rf_role') === 'QUẢN LÝ SẢN XUẤT' || localStorage.getItem('rf_role') === 'TỐI CAO') && (
                <React.Fragment>

                  <button onClick={(e) => { e.stopPropagation(); onEditItem && onEditItem(_item); }} className="w-6 h-6 bg-[#1a1a1a] text-[#d4af37] border border-[#333] hover:border-[#d4af37]/50 rounded flex items-center justify-center transition-colors shadow-sm"><i className="fas fa-edit text-[10px]"></i></button>
                  <button onClick={(e) => { e.stopPropagation(); if (window.confirm("Xoá lệnh này?")) wrappedPushDeltas({ deletes: { prodItems: [_item.id] } }); }} className="w-6 h-6 bg-[#4c0519]/50 text-[#e11d48] border border-[#e11d48]/30 hover:bg-[#e11d48] hover:text-white rounded flex items-center justify-center transition-colors shadow-sm"><i className="fas fa-trash text-[10px]"></i></button>
                </React.Fragment>
              )}
           </div>

           <div className="absolute right-0 bottom-0 text-gray-500 text-[10px]">
               {isExpanded ? <i className="fas fa-chevron-up"></i> : <i className="fas fa-chevron-down"></i>}
           </div>
        </div>

        {isExpanded && (
            <div className={`px-2 pb-2 border-t border-[#222] pt-2 flex flex-col gap-1 w-full animate-fade-in rounded-b-xl ${isItemDone ? 'bg-[#0f2e24]' : 'bg-[#111]'}`}>
              {canApproveQC && _item.qc_status === 'Chờ duyệt khung' && (
                  <div className="mb-2 p-2.5 bg-[#141414] rounded-xl relative rf-production-running-border">
                      <div className="text-[10px] font-black text-indigo-400 mb-2 text-center uppercase"><i className="fas fa-search"></i> QUẢN LÝ DUYỆT KHUNG</div>
                      <div className="flex gap-2 mb-2">
                          <img src={_item.qc_front_photo} onClick={(e)=>{e.stopPropagation(); setPreviewImg(_item.qc_front_photo)}} className="w-full h-32 object-contain rounded-lg border border-indigo-500/20 cursor-pointer bg-black/20" alt="Mặt trước"/>
                      </div>
                      <div className="flex gap-2">
                          <button onClick={(e) => { 
                              e.stopPropagation();
                              window.dispatchEvent(new CustomEvent('openAnnotationModal', { detail: _item }));
                          }} className="flex-1 py-2 bg-[#4c0519] text-[#fb7185] hover:bg-[#e11d48] hover:text-white font-black text-[10px] rounded-lg shadow-sm active:scale-95 transition-all">TỪ CHỐI LÀM LẠI</button>
                          
                          <button onClick={(e) => { 
                              e.stopPropagation();
                              if (window.confirm('Khung đạt yêu cầu, cho phép dán keo?')) {
                                  const upd = JSON.parse(JSON.stringify(_item));
                                  upd.qc_status = 'Đã duyệt';
                                  upd.phases['phase1'].status = 'Done';
                                  
                                  if (typeof getSopAndReward === 'function') {
                                      const kInfo = getSopAndReward(upd, configs[0].n, kpiConfig || [], order?.channel);
                                      const limit = kInfo.time || 30;
                                      
                                      let durationMins = 0;
                                      let isLate = false;
                                      const p1 = upd.phases['phase1'];
                                      if (p1.start && p1.endTime) {
                                          const startMs = new Date(p1.start.replace(' ', 'T')).getTime();
                                          const endMs = new Date(p1.endTime.replace(' ', 'T')).getTime();
                                          if (!isNaN(startMs) && !isNaN(endMs)) {
                                              durationMins = Math.round((endMs - startMs) / 60000);
                                              if (durationMins > limit) isLate = true;
                                          }
                                      }
                                      if (isLate) {
                                          p1.reward_vnd = 0;
                                          p1.note = `Trễ hạn (${durationMins}/${limit}p) - Cắt thưởng KPI`;
                                      } else {
                                          p1.reward_vnd = kInfo.reward;
                                      }
                                  }
                                  
                                  wrappedPushDeltas({ prodItems: [upd] }, 'Đã duyệt khung', 'fa-check');
                              }
                          }} className="flex-1 py-2 bg-indigo-600 text-white hover:bg-indigo-500 font-black text-[10px] rounded-lg shadow-sm active:scale-95 transition-all">
                              DUYỆT ĐẠT
                          </button>
                      </div>
                  </div>
              )}

              {/* Vẫn render các công đoạn như bình thường */}
              {configs.map(c => (
                  <WorkerPhaseV2 key={c.k} attendance={attendance} item={_item} c={c} configs={configs} order={order} prodItems={prodItems} erpProducts={erpProducts} currentUser={currentUser} pushDeltas={wrappedPushDeltas} userConfigs={userConfigs} triggerToast={triggerToast} kpiConfig={kpiConfig} isAdmin={isAdmin} />
              ))}

              {isReadyForInspection && !isItemDone && canApproveQC && (
                <div className="mt-1 p-2.5 bg-[#1e1b4b]/50 border border-[#4338ca]/30 rounded-xl relative">
                  <div className="text-[10px] font-black text-[#818cf8] mb-2 text-center uppercase"><i className="fas fa-search-dollar mr-1"></i> KIỂM ĐỊNH CHẤT LƯỢNG</div>
                  <div className="flex gap-2">
                    <button onClick={(e) => { 
                        e.stopPropagation();
                        setShowReworkForm(true);
                    }} className="flex-1 py-2 bg-[#4c0519] text-[#fb7185] hover:bg-[#e11d48] hover:text-white font-black text-[10px] rounded-lg shadow-sm active:scale-95 transition-all">LÀM LẠI</button>
                    
                    <button onClick={(e) => { 
                        e.stopPropagation();
                        if (window.confirm('Xác nhận sản phẩm ĐẠT yêu cầu xuất xưởng?')) {
                            const upd = JSON.parse(JSON.stringify(_item));
                            upd.status = 'Done';
                            
                            if (overrideSLA) {
                                if (upd.phases?.phase1 && upd.phases.phase1.reward_vnd === 0 && upd.phases.phase1.note?.includes('Trễ hạn')) {
                                    const kpi = typeof getSopAndReward === 'function' ? getSopAndReward(upd, 'DỰNG KHUNG', kpiConfig || [], order?.channel) : null;
                                    if (kpi) upd.phases.phase1.reward_vnd = kpi.reward || 0;
                                    upd.phases.phase1.note = upd.phases.phase1.note.replace(/Trễ hạn.*?Cắt thưởng KPI/gi, 'Trễ hạn (Đã được Admin miễn phạt)');
                                }
                                if (upd.phases?.phase2 && upd.phases.phase2.reward_vnd === 0 && upd.phases.phase2.note?.includes('Trễ hạn')) {
                                    const kpi = typeof getSopAndReward === 'function' ? getSopAndReward(upd, 'GIA CỐ', kpiConfig || [], order?.channel) : null;
                                    if (kpi) upd.phases.phase2.reward_vnd = kpi.reward || 0;
                                    upd.phases.phase2.note = upd.phases.phase2.note.replace(/Trễ hạn.*?Cắt thưởng KPI/gi, 'Trễ hạn (Đã được Admin miễn phạt)');
                                }
                            }
                            
                            // Gọi API trừ tồn kho BOM
                            fetch(window.SCRIPT_URL || '', {
                                method: 'POST',
                                body: JSON.stringify({ action: 'deductInventoryBOM', pin: localStorage.getItem('rf_pin'), prodId: upd.id })
                            }).then(r => r.json()).then(res => {
                                if (!res.success) console.warn("Lỗi trừ tồn kho BOM:", res.message);
                            }).catch(console.error);

                            let payload = { prodItems: [upd] };
                            
                            if (order && order.id) {
                                const allOrderProds = (prodItems || []).filter(p => p.orderId === _item.orderId);
                                const isAllDone = allOrderProds.every(p => {
                                    if (p.id === _item.id) return true;
                                    const pStatusUpper = String(p.status || '').toUpperCase().trim();
                                    return pStatusUpper === 'DONE' || pStatusUpper === 'ĐÃ XONG' || pStatusUpper === 'HỦY/VỠ' || pStatusUpper === 'HOÀN KHO ĐẠT' || p.fulfilledFromStock;
                                });

                                if (isAllDone && (order.status === 'Chờ Sản Xuất' || order.status === 'Quét Tự Động' || order.status === 'Đang Sản Xuất')) {
                                    payload.orders = [{ ...order, status: 'Sẵn sàng đóng gói' }];
                                }
                            }
                            wrappedPushDeltas(payload, 'Đã xác nhận Đạt KCS!', 'fa-check-double');
                        }
                    }} className="flex-1 py-2 bg-[#10b981] text-[#0a0a0a] hover:bg-[#059669] hover:text-white font-black text-[10px] rounded-lg shadow-[0_0_10px_rgba(16,185,129,0.3)] active:scale-95 transition-all">
                        DUYỆT ĐẠT KCS
                    </button>
                  </div>
                  
                  {isAdmin && (
                      <label className="flex items-center gap-2 mt-2 px-2 py-1 bg-[#0a0a0a] border border-[#333] rounded-lg cursor-pointer hover:border-[#10b981]/50 transition-colors" onClick={e => e.stopPropagation()}>
                          <input type="checkbox" checked={overrideSLA} onChange={e => setOverrideSLA(e.target.checked)} className="w-3 h-3 accent-[#10b981]" />
                          <span className="text-[10px] text-gray-400 font-bold uppercase">Miễn phạt SLA (Khôi phục thưởng KPI cho thợ)</span>
                      </label>
                  )}
                  {showReworkForm && (
                      <div className="mt-3 p-3 bg-[#111] border border-rose-500/50 rounded-xl relative animate-fade-in" onClick={e => e.stopPropagation()}>
                          <div className="text-[11px] font-black text-rose-500 mb-2 uppercase">Yêu cầu thợ làm lại</div>
                          <select value={reworkPhase} onChange={e => setReworkPhase(e.target.value)} className="w-full bg-[#0a0a0a] border border-[#333] text-gray-200 text-[11px] font-bold rounded p-2.5 mb-2.5 outline-none focus:border-rose-500 transition-colors">
                              <option value="">-- Chọn khâu cần làm lại --</option>
                              {configs.map(c => (
                                  <option key={c.k} value={c.k}>{c.n} (Thợ: {_item.phases?.[c.k]?.user || 'Chưa có'})</option>
                              ))}
                          </select>
                          <textarea 
                              value={reworkReason} 
                              onChange={e => setReworkReason(e.target.value)} 
                              placeholder="Nhập lý do chính xác thợ cần làm lại ở đâu (bắt buộc)..."
                              className="w-full bg-[#0a0a0a] border border-[#333] text-gray-200 text-[11px] font-bold rounded p-2.5 mb-2.5 min-h-[60px] outline-none focus:border-rose-500 transition-colors placeholder:text-gray-600"
                          ></textarea>
                          <div className="flex gap-2">
                              <button onClick={() => setShowReworkForm(false)} className="flex-1 py-2 bg-zinc-800 text-zinc-400 hover:bg-zinc-700 font-black text-[10px] rounded-lg uppercase tracking-wider transition-all">HỦY BỎ</button>
                              <button onClick={() => {
                                  if (!reworkPhase || !reworkReason.trim()) {
                                      triggerToast('Vui lòng chọn khâu và nhập lý do!', 'fa-exclamation-triangle', 'warning');
                                      return;
                                  }
                                  const upd = JSON.parse(JSON.stringify(_item));
                                  upd.status = 'Pending';
                                  if (upd.phases && upd.phases[reworkPhase]) {
                                      upd.phases[reworkPhase].status = 'Pending';
                                      const phaseName = configs.find(c => c.k === reworkPhase)?.n || (reworkPhase === 'phase1' ? 'DỰNG KHUNG' : 'GIA CỐ');
                                      upd.note = `YÊU CẦU LÀM LẠI ${phaseName}: ${reworkReason.trim()}` + (upd.note ? ' | ' + upd.note : '');
                                  }
                                  wrappedPushDeltas({ updItems: [upd], prodItems: [upd] }, 'Yêu cầu làm lại', 'fa-undo');
                                  setShowReworkForm(false);
                                  setReworkPhase('');
                                  setReworkReason('');
                              }} className="flex-1 py-2 bg-rose-600 text-white hover:bg-rose-500 font-black text-[10px] rounded-lg shadow-[0_0_10px_rgba(225,29,72,0.3)] uppercase tracking-wider transition-all">XÁC NHẬN LÀM LẠI</button>
                          </div>
                      </div>
                  )}
                </div>
              )}
            </div>
        )}
      </div>

      {previewImg && (
          <div className="fixed inset-0 z-[99999] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in" onClick={() => setPreviewImg(null)}>
              <div className="relative max-w-md w-full flex flex-col items-center animate-slide-up" onClick={e => e.stopPropagation()}>
                  <button className="absolute -top-12 right-0 text-white/70 hover:text-rose-400 text-2xl w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/20 rounded-full transition-all shadow-md" onClick={() => setPreviewImg(null)}>
                      <i className="fas fa-times"></i>
                  </button>
                  <img src={previewImg} alt="Ảnh sản phẩm thực tế" className="w-full h-auto max-h-[75vh] object-contain rounded-2xl shadow-[0_0_30px_rgba(212,175,55,0.3)] border border-white/10 bg-black" />
                  <div className="mt-4 flex items-center justify-center gap-2 text-[#d4af37] text-[11px] font-black uppercase tracking-[0.15em] bg-[#141414] px-5 py-2 rounded-full border border-[#d4af37]/30 shadow-md">
                      <i className="fas fa-eye"></i> MẪU THỰC TẾ ĐƯỢC CHỈ ĐỊNH
                  </div>
              </div>
          </div>
      )}

      {preview3DUrl && (
          <div className="fixed inset-0 z-[99999] bg-black flex flex-col animate-fade-in" onClick={(e) => e.stopPropagation()}>
              <div className="h-16 bg-[#0a0a0a] border-b border-white/10 flex items-center justify-between px-4 sm:px-6 shrink-0 relative z-20">
                  <div className="flex items-center gap-3">
                      <div className="w-2 h-2 rounded-full bg-[#10b981] animate-pulse"></div>
                      <span className="text-[14px] font-black text-white">MẪU 3D ĐƯỢC CHỈ ĐỊNH</span>
                  </div>
                  <button onClick={() => setPreview3DUrl(null)} className="px-4 h-10 rounded-xl bg-rose-500/10 hover:bg-rose-500 text-rose-500 hover:text-white flex items-center justify-center transition-colors shadow-[0_0_15px_rgba(244,63,94,0.2)] gap-2 font-black text-[11px] uppercase tracking-wider">
                      <i className="fas fa-times text-sm"></i> ĐÓNG LẠI
                  </button>
              </div>
              <div className="flex-1 relative bg-[#09090b]">
                  <model-viewer src={preview3DUrl} auto-rotate camera-controls shadow-intensity="1.5" environment-image="neutral" exposure="1" style={{width: '100%', height: '100%', backgroundColor: '#09090b', outline: 'none', display: 'block'}}></model-viewer>
              </div>
          </div>
      )}
    </React.Fragment>
  );
}

function GroupedWorkerCardAccordion({ groupItems, order, prodItems, erpProducts, currentUser, pushDeltas, userConfigs, triggerToast, kpiConfig, isAdmin, orders, models3D, attendance, typeTab }) {
    const [expanded, setExpanded] = React.useState(false);
    const firstItem = groupItems[0];
    const qty = groupItems.length;
    const channelName = order.channel || 'SẢN XUẤT TỒN';
    const isP1Started = firstItem.phases?.phase1?.status === 'Done' || firstItem.phases?.phase1?.status === 'In Progress' || firstItem.phases?.phase1?.status === 'Đang làm';
    
    const productInfo = (erpProducts || []).find(p => p.name === firstItem.name || p.id === firstItem.productId) || {};
    const productImage = productInfo.image || productInfo.img || firstItem.image || firstItem.img;

    if (qty === 1) {
        return (
            <WorkerCardV2 
                item={firstItem} 
                order={order} 
                prodItems={prodItems} 
                erpProducts={erpProducts} 
                currentUser={currentUser} 
                pushDeltas={pushDeltas} 
                userConfigs={userConfigs} 
                triggerToast={triggerToast} 
                kpiConfig={kpiConfig} 
                idx_num={1} 
                isAdmin={isAdmin}
                orders={orders}
                models3D={models3D}
                attendance={attendance}
                configs={typeTab === 'Bể Kính' 
                  ? [{k:'phase1', n:'Cắt Dán', req:[]}, {k:'phase2', n:'Gọt Keo', req:['phase1']}] 
                  : [{k:'phase1', n:'Dựng Khung', req:[]}, {k:'phase2', n:'Gia Cố', req:['phase1']}]
                } 
            />
        );
    }

    return (
        <div className="mb-4">
            <div onClick={() => setExpanded(!expanded)} className="rf-card rounded-2xl relative hover:border-[#444] transition-all p-3.5 cursor-pointer flex items-center justify-between shadow-sm">
                <div className="flex gap-3 items-center min-w-0">
                    <div className="w-[50px] h-[50px] shrink-0 bg-[#0a0a0a] rounded-xl border border-[#333] overflow-hidden flex items-center justify-center relative shadow-sm">
                        <div className="absolute top-0.5 left-0.5 w-3.5 h-3.5 bg-[#d4af37] text-black font-black text-[8px] rounded-full flex items-center justify-center border border-[#333] z-10">
                            LÔ
                        </div>
                        {productImage ? (
                            <img src={productImage} className="w-full h-full object-cover opacity-90" alt="product" />
                        ) : (
                            <i className="fas fa-boxes text-[#444] text-lg"></i>
                        )}
                    </div>
                    <div className="min-w-0 pr-2">
                        <h4 className="font-black text-[13px] text-[#d4af37] uppercase truncate">{firstItem.name}</h4>
                        <div className="text-[9px] text-gray-400 mt-1 uppercase tracking-wider flex items-center gap-2 flex-wrap">
                            <span className="bg-[#141414] px-1.5 py-0.5 rounded border border-[#2a2a2a]"><i className="fas fa-layer-group"></i> {channelName}</span>
                            <span className={isP1Started ? 'text-indigo-400' : 'text-gray-500'}>
                                {isP1Started ? 'ĐÃ BẮT ĐẦU' : 'CHỜ LÀM'}
                            </span>
                        </div>
                    </div>
                </div>
                <div className="flex items-center gap-3 shrink-0">
                    <div className="bg-[#ffc107] text-black text-[12px] font-black px-2.5 py-1 rounded-full shadow-[0_0_10px_rgba(255,193,7,0.3)] border border-[#ffc107]">
                        SL: x{qty}
                    </div>
                    <i className={`fas fa-chevron-${expanded ? 'up' : 'down'} text-gray-500 text-lg`}></i>
                </div>
            </div>
            
            {expanded && (
                <div className="pl-3 border-l-2 border-[#333] mt-3 space-y-3">
                    {groupItems.map((item, idx) => {
                        const o = (orders || []).find(x => x.id === item.orderId) || {};
                        return (
                            <WorkerCardV2 
                                key={item.id}
                                item={item} 
                                order={o} 
                                prodItems={prodItems} 
                                erpProducts={erpProducts} 
                                currentUser={currentUser} 
                                pushDeltas={pushDeltas} 
                                userConfigs={userConfigs} 
                                triggerToast={triggerToast} 
                                kpiConfig={kpiConfig} 
                                idx_num={idx + 1} 
                                isAdmin={isAdmin}
                                orders={orders}
                                models3D={models3D}
                                attendance={attendance}
                                configs={typeTab === 'Bể Kính' 
                                  ? [{k:'phase1', n:'Cắt Dán', req:[]}, {k:'phase2', n:'Gọt Keo', req:['phase1']}] 
                                  : [{k:'phase1', n:'Dựng Khung', req:[]}, {k:'phase2', n:'Gia Cố', req:['phase1']}]
                                } 
                            />
                        );
                    })}
                </div>
            )}
        </div>
    );
}

// -------------------------------------------------------------------------
// MỤC 3: GIAO DIỆN CHÍNH TAB SẢN XUẤT (ProductionTab)
// -------------------------------------------------------------------------
const ProductionTab = React.memo(function ProductionTab({ attendance, orders, prodItems, erpProducts, currentUser, pushDeltas, userConfigs, triggerToast, kpiConfig, erpData, models3D }) {
  const [typeTab, setTypeTab] = React.useState('Layout'); 
  const [statusTab, setStatusTab] = React.useState('CHỜ SẢN XUẤT'); 
  const [filterTime, setFilterTime] = React.useState('Tháng Này'); 
  const [searchQuery, setSearchQuery] = React.useState('');
  const [globalPreview, setGlobalPreview] = React.useState(null);
  const [showRules, setShowRules] = React.useState(false);
  const [showAddSXTModal, setShowAddSXTModal] = React.useState(false);
  const [editingProdItem, setEditingProdItem] = React.useState(null);
  const [annotationData, setAnnotationData] = React.useState(null);
  const [collapsedGroups, setCollapsedGroups] = React.useState({});

  React.useEffect(() => {
    const handleGlobalPreview = (e) => { if(e.detail) setGlobalPreview(e.detail); };
    const handleAnnotation = (e) => { if(e.detail) setAnnotationData(e.detail); };
    window.addEventListener('triggerInternalPreview', handleGlobalPreview);
    window.addEventListener('openAnnotationModal', handleAnnotation);
    return () => {
        window.removeEventListener('triggerInternalPreview', handleGlobalPreview);
        window.removeEventListener('openAnnotationModal', handleAnnotation);
    };
  }, []);

  const isCTV = localStorage.getItem('rf_role') === 'CTV';

  const checkTimeFilter = (dateStr, filterStr) => {
      if (!dateStr) return false;
      if (filterStr === 'Tất Cả') return true;
      const d = new Date(dateStr); 
      const today = new Date();
      if (filterStr === 'Hôm Nay') return d.toDateString() === today.toDateString();
      if (filterStr === 'Hôm Qua') { const y = new Date(today); y.setDate(y.getDate() - 1); return d.toDateString() === y.toDateString(); }
      if (filterStr === 'Tháng Này') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
      if (filterStr === 'Tháng Trước') {
          const lastMonth = new Date(today);
          lastMonth.setMonth(lastMonth.getMonth() - 1);
          return d.getMonth() === lastMonth.getMonth() && d.getFullYear() === lastMonth.getFullYear();
      }
      return true;
  };

  const baseFiltered = React.useMemo(() => { 
      return (prodItems || []).filter(i => { 
          if (i.orderId === 'SHARED_TASK' || i.orderId === 'REMINDER') return false; 
          const o = (orders || []).find(x => x.id === i.orderId) || {}; 
          const isCtvOrder = String(o.channel || '').toUpperCase().includes('CỘNG TÁC VIÊN') || String(o.channel || '').toUpperCase() === 'CTV';
          if (isCTV && o.createdBy !== currentUser && o.sale !== currentUser && o.responsibleUser !== currentUser && !isCtvOrder) return false;
          
          if (searchQuery) {
              const q = searchQuery.toLowerCase();
              const matchName = String(i.name || '').toLowerCase().includes(q);
              const matchOrder = String(o.orderCode || '').toLowerCase().includes(q);
              if (!matchName && !matchOrder) return false;
          }

          const deadlineStr = i.deadline || o.createdAt;
          const isTimeMatch = checkTimeFilter(deadlineStr, filterTime);
          
          if (filterTime === 'Tháng Này' && !isTimeMatch) {
              const isFinished = i.status === 'Done' || i.status === 'Đã Huỷ' || i.status === 'Cancel' || i.status === 'Huỷ';
              if (!isFinished && deadlineStr) {
                  const tzOffset = (new Date()).getTimezoneOffset() * 60000; 
                  const nowMonthStr = new Date(Date.now() - tzOffset).toISOString().slice(0, 7);
                  if (String(deadlineStr) < nowMonthStr) {
                      return true;
                  }
              }
          }
          if (!isTimeMatch) return false;
          return true; 
      }); 
  }, [prodItems, orders, filterTime, searchQuery]);

  const countBeKinh = baseFiltered.filter(i => {
      const searchStr = String(i.type || '') + ' ' + String(i.name || '');
      return searchStr.toLowerCase().includes('bể');
  }).length; 

  const countLayout = baseFiltered.filter(i => {
      const searchStr = String(i.type || '') + ' ' + String(i.name || '');
      return !searchStr.toLowerCase().includes('bể');
  }).length;

  const typeFiltered = React.useMemo(() => { 
      return baseFiltered.filter(i => { 
          const searchStr = String(i.type || '') + ' ' + String(i.name || '');
          const isG = searchStr.toLowerCase().includes('bể'); 
          
          if (typeTab === 'Bể Kính' && !isG) return false; 
          if (typeTab === 'Layout' && isG) return false; 
          return true; 
      }); 
  }, [baseFiltered, typeTab]);

  const listWithStatus = typeFiltered.map(i => {
    let curSt = 'CHỜ SẢN XUẤT';
    const p1 = i.phases?.phase1?.status || 'Pending';
    const p2 = i.phases?.phase2?.status || 'Pending';
    const statusUpper = String(i.status || '').toUpperCase();
    const isStock = i.fulfilledFromStock === true || String(i.fulfilledFromStock).toUpperCase() === 'TRUE';

    if (statusUpper === 'ĐÃ HUỶ' || statusUpper === 'HUỶ' || statusUpper === 'CANCEL' || statusUpper === 'HỦY') {
        curSt = 'ĐÃ HUỶ';
    } else if (i.qc_status === 'Đạt' || statusUpper === 'DONE' || statusUpper === 'ĐÃ XONG' || isStock) {
        curSt = 'ĐÃ XONG';
    } else if (p1 === 'Done' && p2 === 'Done') {
        curSt = 'KIỂM ĐỊNH';
    } else {
        curSt = 'CHỜ SẢN XUẤT';
    }
    
    return { ...i, _computedStatus: curSt };
  });

  const workerTodayKPI = React.useMemo(() => {
      const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString();
      const today = safeDateFull.split('T')[0];
      let framesCount = 0;
      let layoutCount = 0;
      let kpiVND = 0;

      listWithStatus.forEach(i => {
