<script type="text/babel">
// =========================================================================
// 📦 FILE: Tab_Analytics.html
// CHỨC NĂNG: Trung tâm Chỉ huy Phân Tích P&L & Hiệu Quả Kinh Doanh Toàn Diện
// KÊNH CHUẨN: Shopee VN, TH, SG, MA, PH, TW, TikTok Shop, Cộng Tác Viên, Bán Lẻ, Bán Sỉ, Bảo Hành, Sản Xuất Tồn
// =========================================================================

const AnalyticsTab = React.memo(function AnalyticsTab({ data, pushData, isAdmin, mode, userConfigs }) {
    const currentRole = localStorage.getItem('rf_role') || '';
    const isBoss = currentRole === 'TỐI CAO' || currentRole === 'ADMIN' || isAdmin;
    
    // 1. BẢO MẬT & PHÂN QUYỀN
    if (!isBoss) {
        return (
            <div className="flex flex-col items-center justify-center min-h-[65vh] text-center animate-fade-in p-6">
                <div className="relative mb-8 group">
                    <div className="absolute inset-0 bg-rose-600 rounded-full blur-[50px] opacity-20 group-hover:opacity-40 transition-opacity duration-700"></div>
                    <div className="w-28 h-28 rounded-full bg-[#121214] border border-rose-500/30 flex items-center justify-center relative z-10 shadow-[0_0_40px_rgba(225,29,72,0.15)] backdrop-blur-xl">
                        <i className="fas fa-lock text-5xl text-rose-500 drop-shadow-[0_0_15px_rgba(225,29,72,0.8)]"></i>
                    </div>
                </div>
                <h2 className="text-3xl font-black text-rose-500 tracking-[0.25em] uppercase drop-shadow-[0_0_10px_rgba(225,29,72,0.5)] mb-4">Tuyệt Mật</h2>
                <div className="w-16 h-[2px] bg-rose-500/50 mb-5 mx-auto"></div>
                <p className="text-[13px] font-bold text-gray-400 max-w-md tracking-wide leading-relaxed">
                    Khu vực này chứa dữ liệu P&L sinh tử của doanh nghiệp.<br/><br/>Chỉ tài khoản mang đặc quyền <span className="text-rose-400 drop-shadow-[0_0_5px_rgba(225,29,72,0.8)]">TỐI CAO</span> mới được phép truy cập.
                </p>
            </div>
        );
    }

    // Thiết lập ngày mặc định theo tháng hiện tại
    const [datePreset, setDatePreset] = React.useState('thisMonth');
    const [startDateStr, setStartDateStr] = React.useState(() => {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}-01`;
    });
    const [endDateStr, setEndDateStr] = React.useState(() => {
        const d = new Date();
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        const lastDay = new Date(y, m, 0).getDate();
        return `${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
    });

    const [filterChannel, setFilterChannel] = React.useState('Tất cả kênh');
    const [showCostModal, setShowCostModal] = React.useState(false);
    const [reloadKey, setReloadKey] = React.useState(0);

    // Chi phí thêm cấu hình động (lưu vào localStorage)
    const [extraCosts, setExtraCosts] = React.useState(() => {
        try {
            return JSON.parse(localStorage.getItem('rf_analytics_extra_costs')) || [];
        } catch (e) { return []; }
    });

    const [newCostTitle, setNewCostTitle] = React.useState('');
    const [newCostAmount, setNewCostAmount] = React.useState('');
    const [newCostType, setNewCostType] = React.useState('per_month'); // 'per_month' hoặc 'per_order'

    // ==========================================
    // 2. REAL-TIME EVENT BUS HOOK
    // ==========================================
    React.useEffect(() => {
        const refreshHandler = () => {
            setReloadKey(prev => prev + 1);
        };

        window.refreshAnalyticsData = refreshHandler;
        window.addEventListener('ordersUpdated', refreshHandler);
        window.addEventListener('triggerReloadData', refreshHandler);

        return () => {
            window.removeEventListener('ordersUpdated', refreshHandler);
            window.removeEventListener('triggerReloadData', refreshHandler);
        };
    }, []);

    // Xử lý đổi Preset ngày
    const handlePresetChange = (preset) => {
        setDatePreset(preset);
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth();

        if (preset === 'today') {
            const todayStr = now.toISOString().slice(0, 10);
            setStartDateStr(todayStr);
            setEndDateStr(todayStr);
        } else if (preset === 'thisMonth') {
            const first = `${y}-${String(m + 1).padStart(2, '0')}-01`;
            const lastDay = new Date(y, m + 1, 0).getDate();
            const last = `${y}-${String(m + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
            setStartDateStr(first);
            setEndDateStr(last);
        } else if (preset === 'lastMonth') {
            const prevMonth = new Date(y, m - 1, 1);
            const py = prevMonth.getFullYear();
            const pm = prevMonth.getMonth();
            const first = `${py}-${String(pm + 1).padStart(2, '0')}-01`;
            const lastDay = new Date(py, pm + 1, 0).getDate();
            const last = `${py}-${String(pm + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
            setStartDateStr(first);
            setEndDateStr(last);
        } else if (preset === '7days') {
            const end = new Date();
            const start = new Date();
            start.setDate(end.getDate() - 6);
            setStartDateStr(start.toISOString().slice(0, 10));
            setEndDateStr(end.toISOString().slice(0, 10));
        } else if (preset === '30days') {
            const end = new Date();
            const start = new Date();
            start.setDate(end.getDate() - 29);
            setStartDateStr(start.toISOString().slice(0, 10));
            setEndDateStr(end.toISOString().slice(0, 10));
        } else if (preset === 'all') {
            setStartDateStr('2020-01-01');
            setEndDateStr('2030-12-31');
        }
    };

    // Hàm an toàn parse số tiền tránh tràn số hoặc dính mã vạch
    const safeNum = React.useCallback((val, max = 50000000) => {
        const n = Number(val) || 0;
        if (n < 0 || n > max) return 0;
        return n;
    }, []);

    // Hàm lấy giá vốn COGS cho sản phẩm từ bảng Products hoặc ImportExport
    const getProductCOGS = React.useCallback((prodName, sku = '') => {
        if (!prodName && !sku) return 0;
        const pClean = String(prodName || '').trim().toLowerCase();
        const skuClean = String(sku || '').trim().toLowerCase();

        const allProds = data?.Products || window.allProducts || [];
        
        // 1. Tìm chính xác theo SKU hoặc Tên
        const p = allProds.find(x => 
            (skuClean && String(x.sku || '').trim().toLowerCase() === skuClean) ||
            (pClean && String(x.name || '').trim().toLowerCase() === pClean)
        );
        if (p && Number(p.costPrice) > 0) return Number(p.costPrice);

        // 2. Tìm tương đối theo Tên
        if (pClean) {
            const pMatch = allProds.find(x => {
                const xName = String(x.name || '').trim().toLowerCase();
                return xName && (pClean.includes(xName) || xName.includes(pClean));
            });
            if (pMatch && Number(pMatch.costPrice) > 0) return Number(pMatch.costPrice);
        }

        // 3. Fallback: Tìm trong lịch sử nhập gần nhất
        const imports = (data?.ImportExport || []).filter(x => x.type === 'Nhập');
        for (let log of imports) {
            try {
                let items = [];
                if (typeof log.itemsData === 'string') items = JSON.parse(log.itemsData || '[]');
                else if (Array.isArray(log.itemsData)) items = log.itemsData;
                const match = items.find(i => String(i.name || '').trim().toLowerCase() === pClean);
                if (match && Number(match.price) > 0) return Number(match.price);
            } catch (e) { }
        }
        return 0;
    }, [data?.Products, data?.ImportExport]);

    // Chuẩn hóa tên kênh bán hàng CHUẨN 100% CHỈ DỰA VÀO CỘT CHANNEL (KHÔNG QUÉT MÃ ĐƠN)
    const normalizeChannelName = React.useCallback((rawCh) => {
        const ch = String(rawCh || '').toUpperCase().trim();

        // 1. TikTok Shop
        if (ch.includes('TIKTOK') || ch.includes('TIK TOK') || ch === 'TT') {
            return 'TikTok Shop';
        }

        // 2. Shopee (VN, TH, SG, MA, PH, TW)
        if (ch.includes('SHOPEE') || ch.includes('SPX')) {
            if (ch.includes('TH') || ch.includes('THÁI')) return 'Shopee TH';
            if (ch.includes('SG') || ch.includes('SING')) return 'Shopee SG';
            if (ch.includes('MA') || ch.includes('MY') || ch.includes('MALAY')) return 'Shopee MA';
            if (ch.includes('PH') || ch.includes('PHILIP')) return 'Shopee PH';
            if (ch.includes('TW') || ch.includes('ĐÀI')) return 'Shopee TW';
            return 'Shopee VN';
        }

        // 3. Cộng Tác Viên
        if (ch.includes('CỘNG TÁC') || ch.includes('CỘNG TAC') || ch.includes('CTV') || ch === 'CTV') {
            return 'Cộng Tác Viên';
        }

        // 4. Bán Sỉ
        if (ch.includes('BÁN SỈ') || ch.includes('BAN SI') || ch.includes('SỈ') || ch.includes('WHOLESALE') || ch.includes('ĐẠI LÝ')) {
            return 'Bán Sỉ';
        }

        // 5. Bảo Hành
        if (ch.includes('BẢO HÀNH') || ch.includes('BAO HANH') || ch.includes('SỬA CHỮA') || ch.includes('LÀM LẠI')) {
            return 'Bảo Hành';
        }

        // 6. Sản Xuất Tồn / Bù Kho (Đơn nội bộ)
        if (ch.includes('TỒN') || ch.includes('BÙ KHO') || ch.includes('KHO')) {
            return 'Sản Xuất Tồn';
        }

        // 7. Bán Lẻ
        return 'Bán Lẻ';
    }, []);

    // Danh mục màu nhận diện theo kênh bán chuẩn
    const CHANNEL_COLORS = {
        'Shopee VN': '#f97316',      // Cam Shopee
        'Shopee TH': '#fb923c',      // Cam sáng
        'Shopee SG': '#ea580c',      // Cam đậm
        'Shopee MA': '#f59e0b',      // Vàng hổ phách
        'Shopee PH': '#facc15',      // Vàng sáng
        'Shopee TW': '#ca8a04',      // Vàng đồng
        'TikTok Shop': '#ec4899',    // Hồng TikTok
        'Cộng Tác Viên': '#10b981',  // Xanh Emerald
        'Bán Lẻ': '#0284c7',        // Xanh Dương
        'Bán Sỉ': '#8b5cf6',        // Tím Violet
        'Bảo Hành': '#ef4444'       // Đỏ Rose
    };

    const getChannelColor = (ch) => {
        return CHANNEL_COLORS[ch] || '#38bdf8';
    };

    // ==========================================
    // 3. TÍNH TOÁN SỐ LIỆU TỔNG HỢP THEO BỘ LỌC
    // ==========================================
    const stats = React.useMemo(() => {
        const sTime = new Date(`${startDateStr}T00:00:00`).getTime();
        const eTime = new Date(`${endDateStr}T23:59:59`).getTime();

        const allOrders = (data?.Orders || window.allOrders || []);
        const allTransactions = (data?.Transactions || window.allTransactions || []);
        const allProduction = (data?.Production || window.allProduction || []);

        let totalGenerated = 0; // Đơn phát sinh
        let totalReturned = 0;  // Trả hàng
        let totalCancelled = 0; // Đơn huỷ
        let totalSold = 0;      // Đơn đã bán thành công

        let totalRevenue = 0;      // Doanh thu thực nhận (VNĐ)
        let totalPlatformFee = 0;  // Tổng chi phí sàn
        let totalCOGS = 0;         // Tổng giá vốn nhập hàng (COGS)

        // Phân bổ chi tiết theo từng kênh bán hàng
        const channelBreakdown = {};

        const initChannel = (ch) => {
            if (!channelBreakdown[ch]) {
                channelBreakdown[ch] = {
                    channel: ch,
                    generated: 0,
                    sold: 0,
                    returned: 0,
                    cancelled: 0,
                    revenue: 0,
                    platformFee: 0,
                    cogs: 0,
                    profit: 0
                };
            }
        };

        allOrders.forEach(o => {
            const rawCh = String(o.channel || '').trim();
            // 1. LOẠI BỎ 'SẢN XUẤT TỒN' / 'SẢN XUẤT BÙ KHO' KHỎI BÁO CÁO DOANH SỐ & KÊNH BÁN
            if (
                rawCh === 'Sản Xuất Tồn' || rawCh === 'Sản Xuất Bù Kho' || 
                rawCh.toLowerCase().includes('sản xuất tồn') || rawCh.toLowerCase().includes('bù kho')
            ) {
                return;
            }

            const dateStr = String(o.createdAt || o.date || '').slice(0, 10);
            if (!dateStr) return;
            const oTime = new Date(`${dateStr}T12:00:00`).getTime();
            if (isNaN(oTime) || oTime < sTime || oTime > eTime) return;

            const chName = normalizeChannelName(o.channel, o.orderCode);
            if (chName === 'Sản Xuất Tồn' || chName === 'Sản Xuất Bù Kho') return;

            if (filterChannel !== 'Tất cả kênh' && filterChannel !== 'Tất cả shop' && filterChannel !== 'Tất cả') {
                if (chName !== filterChannel) return;
            }

            initChannel(chName);
            channelBreakdown[chName].generated += 1;
            totalGenerated += 1;

            const st = String(o.status || '').toUpperCase().trim();
            const isCancelled = st === 'ĐƠN HUỶ' || st === 'ĐƠN HỦY' || st === 'HUỶ' || st === 'HỦY' || st.includes('HỦY') || st.includes('HUỶ') || st === 'CANCELLED';
            const isReturned = st === 'HÀNG HOÀN' || (st.includes('HOÀN') && !st.includes('HOÀN THÀNH'));
            const isSold = !isCancelled && !isReturned;

            if (isReturned) {
                totalReturned += 1;
                channelBreakdown[chName].returned += 1;
            } else if (isCancelled) {
                totalCancelled += 1;
                channelBreakdown[chName].cancelled += 1;
            } else {
                totalSold += 1;
                channelBreakdown[chName].sold += 1;

                // 1. Doanh thu (Chuẩn hoá theo VNĐ)
                let rev = safeNum(o.revenue, 100000000) || safeNum(o.retailTotal, 100000000) || 0;
                if ((chName === 'Xuất Khẩu' || String(o.channel || '').toUpperCase().includes('USD')) && rev > 0 && rev < 10000) {
                    rev = Math.round(rev * 25500);
                }

                totalRevenue += rev;
                channelBreakdown[chName].revenue += rev;

                // 2. Chi phí sàn (Platform Fee)
                let pFee = safeNum(o.feeFixed, 50000000) + 
                            safeNum(o.feeService, 50000000) + 
                            safeNum(o.feePayment, 50000000) + 
                            safeNum(o.feeAffiliate, 50000000) + 
                            safeNum(o.tax, 50000000) + 
                            safeNum(o.shopVoucher, 50000000);
                
                if (pFee === 0) {
                    const rawCostTotal = safeNum(o.costTotal, 50000000);
                    const rawCogs = safeNum(o.cogs, 50000000);
                    if (rawCostTotal > rawCogs && (rawCostTotal - rawCogs) < 10000000) {
                        pFee = rawCostTotal - rawCogs;
                    }
                }

                totalPlatformFee += pFee;
                channelBreakdown[chName].platformFee += pFee;

                // 3. Giá vốn COGS tự động cho mọi đơn hàng
                let cogsVal = 0;
                if (safeNum(o.cogs, 500000000) > 0) {
                    cogsVal = safeNum(o.cogs, 500000000);
                } else {
                    // Quét phụ kiện accessories
                    let accList = [];
                    if (typeof window.safeParseAccessories === 'function') {
                        accList = window.safeParseAccessories(o.accessories);
                    } else if (Array.isArray(o.accessories)) {
                        accList = o.accessories;
                    } else if (typeof o.accessories === 'string') {
                        try { accList = JSON.parse(o.accessories); } catch (e) { accList = []; }
                    }
                    
                    if (Array.isArray(accList) && accList.length > 0) {
                        accList.forEach(acc => {
                            const cost = safeNum(acc.costPrice || acc.cogs, 50000000) || getProductCOGS(acc.name, acc.sku);
                            const qty = Number(acc.quantity || acc.qty || 1) || 1;
                            cogsVal += (cost * qty);
                        });
                    }

                    // Quét lệnh sản xuất Production liên quan
                    const matchedProds = allProduction.filter(p => String(p.orderId) === String(o.id) || (o.orderCode && String(p.orderId) === String(o.orderCode)));
                    if (matchedProds.length > 0) {
                        matchedProds.forEach(mp => {
                            const pCost = getProductCOGS(mp.name);
                            if (pCost > 0) cogsVal += pCost;
                        });
                    }
                }

                totalCOGS += cogsVal;
                channelBreakdown[chName].cogs += cogsVal;

                // Lợi nhuận của từng kênh
                channelBreakdown[chName].profit = channelBreakdown[chName].revenue - channelBreakdown[chName].cogs - channelBreakdown[chName].platformFee;
            }
        });

        // 4. Quét Chi Phí Lương & Vận Hành từ Transactions
        let totalSalaryExpense = 0;
        let totalOperationExpense = 0;

        allTransactions.forEach(t => {
            const tDate = String(t.date || t.createdAt || '').slice(0, 10);
            if (!tDate) return;
            const tTime = new Date(`${tDate}T12:00:00`).getTime();
            if (isNaN(tTime) || tTime < sTime || tTime > eTime) return;

            const cat = String(t.category || '').toLowerCase();
            const type = String(t.type || '').toUpperCase();
            const title = String(t.title || t.note || '').toLowerCase();
            const amt = Math.abs(Number(t.amount || 0));

            if (amt <= 0) return;

            // Bỏ qua giao dịch nội bộ / chuyển khoản / rút quỹ / tạm ứng chưa phân loại
            if (type === 'TRANSFER' || type === 'CHUYỂN KHOẢN' || cat.includes('chuyển khoản') || cat.includes('nội bộ') || cat.includes('rút tiền') || cat.includes('chờ xử lý') || cat.includes('chờ phân bổ')) {
                return;
            }

            // Chi phí lương
            if (cat.includes('lương') || title.includes('lương') || cat.includes('trả lương') || cat.includes('tạm ứng')) {
                totalSalaryExpense += amt;
            }
            // Chi phí vận hành / mặt bằng / điện nước / marketing / chi phí khác
            else if (
                cat.includes('vận hành') || cat.includes('mặt bằng') || cat.includes('điện nước') || 
                cat.includes('tiếp khách') || cat.includes('vật tư') || cat.includes('bao bì') || 
                cat.includes('quảng cáo') || cat.includes('ads') || cat.includes('marketing') ||
                ((type === 'EXPENSE' || type === 'CHI') && !cat.includes('nhập hàng') && !cat.includes('nhà cung cấp') && !cat.includes('trả nợ') && !cat.includes('đối tác') && !cat.includes('chờ'))
            ) {
                totalOperationExpense += amt;
            }
        });

        // Chi phí thêm cấu hình động (Dynamic Extra Costs)
        const filterDays = Math.max(1, Math.round((eTime - sTime) / (1000 * 60 * 60 * 24)));
        const manualPerOrderCost = extraCosts.filter(c => c.type === 'per_order').reduce((sum, c) => sum + (safeNum(c.amount) * totalSold), 0);
        const manualPerMonthCost = extraCosts.filter(c => c.type === 'per_month').reduce((sum, c) => sum + ((safeNum(c.amount) / 30) * filterDays), 0);
        const totalExtraCosts = manualPerOrderCost + manualPerMonthCost;

        // Lợi nhuận ròng toàn diện = Doanh thu - COGS - Phí sàn - Lương - Vận hành - Chi phí thêm
        const totalProfit = totalRevenue - totalCOGS - totalPlatformFee - totalSalaryExpense - totalOperationExpense - totalExtraCosts;
        const profitMargin = totalRevenue > 0 ? ((totalProfit / totalRevenue) * 100).toFixed(1) : '0.0';

        // Tỷ lệ %
        const returnRate = totalGenerated > 0 ? ((totalReturned / totalGenerated) * 100).toFixed(1) : '0.0';
        const cancelRate = totalGenerated > 0 ? ((totalCancelled / totalGenerated) * 100).toFixed(1) : '0.0';
        const soldRate = totalGenerated > 0 ? ((totalSold / totalGenerated) * 100).toFixed(1) : '0.0';

        // Sắp xếp các kênh theo thứ tự ưu tiên chuẩn (không bao gồm Sản Xuất Tồn)
        const STANDARD_ORDER = ['Shopee VN', 'Shopee TH', 'Shopee SG', 'Shopee MA', 'Shopee PH', 'Shopee TW', 'TikTok Shop', 'Cộng Tác Viên', 'Bán Lẻ', 'Bán Sỉ', 'Bảo Hành'];
        const channelList = Object.values(channelBreakdown).sort((a, b) => {
            const idxA = STANDARD_ORDER.indexOf(a.channel);
            const idxB = STANDARD_ORDER.indexOf(b.channel);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            return b.revenue - a.revenue;
        });

        return {
            totalGenerated,
            totalReturned,
            totalCancelled,
            totalSold,
            returnRate,
            cancelRate,
            soldRate,
            totalRevenue,
            totalPlatformFee,
            totalCOGS,
            totalSalaryExpense,
            totalOperationExpense,
            totalExtraCosts,
            totalProfit,
            profitMargin,
            channelList
        };
    }, [data?.Orders, data?.Transactions, data?.Production, startDateStr, endDateStr, filterChannel, extraCosts, reloadKey, getProductCOGS, normalizeChannelName, safeNum]);

    // Format tiền tệ chuẩn dạng 66,235,282
    const formatMoney = (val) => {
        const num = Math.round(Number(val || 0));
        return num.toLocaleString('vi-VN');
    };

    // Thêm / Xóa chi phí thêm
    const handleAddExtraCost = () => {
        if (!newCostTitle || !newCostAmount) {
            alert('Vui lòng nhập đầy đủ tên chi phí và số tiền!');
            return;
        }
        const updated = [...extraCosts, {
            id: Date.now(),
            name: newCostTitle,
            amount: Number(newCostAmount),
            type: newCostType
        }];
        setExtraCosts(updated);
        localStorage.setItem('rf_analytics_extra_costs', JSON.stringify(updated));
        setNewCostTitle('');
        setNewCostAmount('');
    };

    const handleDeleteExtraCost = (id) => {
        const updated = extraCosts.filter(c => c.id !== id);
        setExtraCosts(updated);
        localStorage.setItem('rf_analytics_extra_costs', JSON.stringify(updated));
    };

    // ==========================================
    // 4. COMPONENT BIỂU ĐỒ VÀNH KHĂN ĐỒNG BỘ 100% (SVG DOUGHNUT)
    // ==========================================
    const DynamicDoughnutChart = ({ channelList, totalValue, isCurrency = false, valueKey = 'sold' }) => {
        const total = Number(totalValue) || 0;

        // Chỉ hiển thị các kênh có số liệu > 0
        const activeSegments = channelList.filter(item => Number(item[valueKey] || 0) > 0);

        let accumulatedPercent = 0;
        const radius = 68;
        const strokeWidth = 24;
        const circumference = 2 * Math.PI * radius;

        const segments = activeSegments.map(item => {
            const val = Number(item[valueKey] || 0);
            const percent = total > 0 ? (val / total) : 0;

                                        <td className="py-3 px-3 text-right font-bold text-amber-400 font-mono">{formatMoney(item.cogs)}đ</td>
                                        <td className="py-3 px-3 text-right font-bold text-[#d4af37] font-mono">{formatMoney(chProfit)}đ</td>
                                        <td className="py-3 px-3 text-right font-bold font-mono">
                                            <span className={`px-2 py-0.5 rounded text-[11px] ${Number(chMargin) >= 30 ? 'bg-emerald-500/10 text-emerald-400' : (Number(chMargin) > 0 ? 'bg-amber-500/10 text-amber-400' : 'bg-rose-500/10 text-rose-400')}`}>
                                                {chMargin}%
                                            </span>
                                        </td>
                                    </tr>
                                );
                            })}
                            {stats.channelList.length === 0 && (
                                <tr>
                                    <td colSpan="7" className="text-center py-6 text-zinc-500 italic">Không có đơn hàng nào trong khoảng thời gian này.</td>
                                </tr>
                            )}
                        </tbody>
                        <tfoot>
                            <tr className="border-t-2 border-white/[0.1] bg-[#18181b] font-black text-zinc-100">
                                <td className="py-3.5 px-3 uppercase text-[11px] text-[#d4af37]">TỔNG CỘNG</td>
                                <td className="py-3.5 px-3 text-center font-mono">{stats.totalSold.toLocaleString('vi-VN')}</td>
                                <td className="py-3.5 px-3 text-right font-mono text-emerald-400">{formatMoney(stats.totalRevenue)}đ</td>
                                <td className="py-3.5 px-3 text-right font-mono text-rose-400">{formatMoney(stats.totalPlatformFee)}đ</td>
                                <td className="py-3.5 px-3 text-right font-mono text-amber-400">{formatMoney(stats.totalCOGS)}đ</td>
                                <td className="py-3.5 px-3 text-right font-mono text-[#d4af37]">{formatMoney(stats.totalRevenue - stats.totalCOGS - stats.totalPlatformFee)}đ</td>
                                <td className="py-3.5 px-3 text-right font-mono text-[#d4af37]">
                                    <span className="px-2 py-0.5 rounded bg-[#d4af37]/15 text-[#d4af37] text-[11px] font-black">
                                        {stats.totalRevenue > 0 ? (((stats.totalRevenue - stats.totalCOGS - stats.totalPlatformFee) / stats.totalRevenue) * 100).toFixed(1) : '0.0'}%
                                    </span>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            {/* ==========================================
                6. MODAL CẤU HÌNH CHI PHÍ THÊM
                ========================================== */}
            {showCostModal && (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={() => setShowCostModal(false)}>
                    <div className="bg-[#121214] border border-white/[0.15] w-full max-w-lg rounded-2xl p-5 shadow-2xl space-y-4" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-white/[0.08] pb-3">
                            <h3 className="text-white font-black text-sm tracking-wide flex items-center gap-2">
                                <i className="fas fa-receipt text-[#d4af37]"></i> CẤU HÌNH CHI PHÍ VẬN HÀNH THÊM
                            </h3>
                            <button onClick={() => setShowCostModal(false)} className="text-zinc-400 hover:text-white"><i className="fas fa-times"></i></button>
                        </div>

                        {/* Form thêm chi phí */}
                        <div className="space-y-3 bg-[#18181b] p-3.5 rounded-xl border border-white/[0.08]">
                            <div>
                                <label className="text-[11px] font-bold text-zinc-400 mb-1 block">Tên khoản chi:</label>
                                <input
                                    type="text"
                                    placeholder="VD: Thuê mặt bằng kho, phụ phí đóng gói..."
                                    value={newCostTitle}
                                    onChange={(e) => setNewCostTitle(e.target.value)}
                                    className="w-full bg-[#121214] border border-white/[0.1] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                                />
                            </div>
                            <div className="grid grid-cols-2 gap-2.5">
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-400 mb-1 block">Số tiền (VNĐ):</label>
                                    <input
                                        type="number"
                                        placeholder="VD: 2000000"
                                        value={newCostAmount}
                                        onChange={(e) => setNewCostAmount(e.target.value)}
                                        className="w-full bg-[#121214] border border-white/[0.1] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                                    />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-400 mb-1 block">Cách phân bổ:</label>
                                    <select
                                        value={newCostType}
                                        onChange={(e) => setNewCostType(e.target.value)}
                                        className="w-full bg-[#121214] border border-white/[0.1] rounded-lg p-2 text-xs text-white outline-none focus:border-[#d4af37]"
                                    >
                                        <option value="per_month">Theo tháng (chia theo ngày)</option>
                                        <option value="per_order">Theo mỗi đơn bán</option>
                                    </select>
                                </div>
                            </div>
                            <button
                                onClick={handleAddExtraCost}
                                className="w-full py-2.5 bg-[#d4af37] hover:bg-[#b89628] text-black font-black text-xs rounded-lg transition-all flex items-center justify-center gap-1.5 cursor-pointer shadow-md active:scale-95"
                            >
                                <i className="fas fa-plus text-xs"></i> Thêm chi phí
                            </button>
                        </div>

                        {/* Danh sách chi phí hiện có */}
                        <div className="max-h-48 overflow-y-auto space-y-2 custom-scrollbar pr-1">
                            {extraCosts.map((c) => (
                                <div key={c.id} className="flex justify-between items-center bg-[#18181b] p-2.5 rounded-xl border border-white/[0.08] text-xs">
                                    <div className="flex flex-col">
                                        <span className="text-white font-bold">{c.name}</span>
                                        <span className="text-zinc-400 text-[10px]">{c.type === 'per_month' ? 'Phân bổ theo tháng' : 'Phân bổ theo mỗi đơn'}</span>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-emerald-400 font-bold font-mono">{formatMoney(c.amount)}đ</span>
                                        <button onClick={() => handleDeleteExtraCost(c.id)} className="text-rose-400 hover:text-rose-300"><i className="fas fa-trash-alt"></i></button>
                                    </div>
                                </div>
                            ))}
                            {extraCosts.length === 0 && (
                                <div className="text-center text-zinc-500 text-xs py-4">Chưa có chi phí phụ nào được thiết lập.</div>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
});
</script>
