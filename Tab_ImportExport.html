<script type="text/babel">
// =========================================================================
// 📦 FILE: Tab_ImportExport.txt
// CHỨC NĂNG: Lịch sử xuất/nhập toàn hệ thống & Modal Tạo Phiếu (Giao diện nâng cấp)
// =========================================================================

// -------------------------------------------------------------------------
// 1. MODAL THẺ KHO CHI TIẾT (StockHistoryModal)
// -------------------------------------------------------------------------
function StockHistoryModal({ product, onClose, importExport }) {
    const logs = React.useMemo(() => {
        if (!importExport || !product) return [];
        let result = [];
        importExport.forEach(log => {
            try {
                const items = JSON.parse(log.itemsData || '[]');
                const match = items.find(i => i.name === product.name);
                if (match) {
                    result.push({
                        ...log,
                        changedQty: match.qty,
                        price: match.price
                    });
                }
            } catch(e) {}
        });
        return result.sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
    }, [importExport, product]);

    return (
        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-[#141414] border border-[#333] w-full max-w-md rounded-3xl p-5 shadow-2xl flex flex-col max-h-[80vh] animate-slide-up" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4 shrink-0 border-b border-[#222] pb-3">
                    <div>
                        <div className="font-black text-[11px] text-[#10b981] uppercase tracking-wider flex items-center gap-1.5"><i className="fas fa-history"></i> THẺ KHO SẢN PHẨM</div>
                        <div className="text-[#f5f5f5] font-black text-sm mt-1">{product.name}</div>
                    </div>
                    <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-rose-500 flex items-center justify-center transition-colors border border-[#333]"><i className="fas fa-times"></i></button>
                </div>

                <div className="flex gap-3 mb-4 shrink-0">
                    <div className="flex-1 bg-[#0a0a0a] border border-[#222] rounded-xl p-3 text-center shadow-inner">
                        <div className="text-[8px] text-gray-500 font-black uppercase tracking-widest mb-1">Mã SKU</div>
                        <div className="text-[12px] font-black text-[#d4af37]">{product.sku || 'N/A'}</div>
                    </div>
                    <div className="flex-1 bg-[#0a0a0a] border border-[#222] rounded-xl p-3 text-center shadow-inner">
                        <div className="text-[8px] text-gray-500 font-black uppercase tracking-widest mb-1">Tồn Hiện Tại</div>
                        <div className="text-[16px] font-black text-[#10b981] leading-none mt-0.5">{product.quantity || 0} <span className="text-[10px] text-gray-400 font-bold uppercase">{product.unit || 'Cái'}</span></div>
                    </div>
                </div>

                <div className="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-2">
                    {logs.length === 0 ? (
                        <div className="text-center text-gray-500 font-bold text-[11px] py-10 bg-[#0a0a0a] rounded-xl border border-[#222] italic">
                            Chưa có lịch sử xuất/nhập nào.
                        </div>
                    ) : (
                        logs.map((L, i) => (
                            <div key={i} className="bg-[#0a0a0a] p-3 rounded-xl border border-[#222] flex justify-between items-center hover:border-[#333] transition-colors group shadow-sm">
                                <div className="flex-1 min-w-0 pr-3">
                                    <div className="flex items-center gap-2 mb-1.5">
                                        <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border uppercase tracking-wider ${L.type==='Nhập' ? 'bg-[#10b981]/10 text-[#10b981] border-[#10b981]/25' : 'bg-[#e11d48]/10 text-[#fb7185] border-[#e11d48]/25'}`}>{L.type}</span>
                                        <span className="text-[9px] text-gray-500 font-bold font-mono">{String(L.date).slice(0, 16)}</span>
                                    </div>
                                    <div className="text-[11px] font-bold text-gray-300 leading-tight group-hover:text-white transition-colors line-clamp-2">{L.note || L.target}</div>
                                </div>
                                <div className={`text-[15px] font-black shrink-0 ${L.type==='Nhập' ? 'text-[#10b981]' : 'text-[#fb7185]'}`}>
                                    {L.type==='Nhập' ? '+' : '-'}{L.changedQty} <span className="text-[9px] font-bold uppercase opacity-70">{product.unit || 'Cái'}</span>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            </div>
        </div>
    );
}

// -------------------------------------------------------------------------
// 2. TAB LỊCH SỬ XUẤT NHẬP TỔNG HỢP & NÚT KIỂM KHO (ImportExportTab)
// -------------------------------------------------------------------------
function ImportExportTab({ data, pushData, isAdmin }) {
  const displayMoney = (val) => Number(val || 0).toLocaleString('vi-VN');
  const [showForm, setShowForm] = React.useState(false);
  const [filter, setFilter] = React.useState('Hôm Nay'); 
  const [typeTab, setTypeTab] = React.useState('Xuất'); 
  const [subWarehouse, setSubWarehouse] = React.useState('156');
  const [search, setSearch] = React.useState('');
  const [prefilledProduct, setPrefilledProduct] = React.useState(null);

  React.useEffect(() => {
      const handleTrigger = (e) => {
          const product = e.detail;
          setPrefilledProduct(product);
          setTypeTab('Nhập');
          const cat = String(product.category || '').toUpperCase();
          if (cat.includes('DANH MỤC SẢN XUẤT') || cat.includes('NGUYÊN LIỆU') || cat.includes('VẬT TƯ')) {
              setSubWarehouse('152');
          } else if (cat.includes('PHỤ KIỆN')) {
              setSubWarehouse('156');
          } else if (cat.includes('LAYOUT') || cat.includes('BỂ KÍNH') || cat.includes('THÀNH PHẨM')) {
              setSubWarehouse('155');
          } else {
              setSubWarehouse('156');
          }
          setShowForm(true);
      };
      window.addEventListener('triggerCreateImportTicket', handleTrigger);
      return () => window.removeEventListener('triggerCreateImportTicket', handleTrigger);
  }, []);

  const isDateInRangeLocal = (dateStr) => {
      if (!dateStr) return false;
      const d = new Date(dateStr.replace(' ', 'T')); 
      const today = new Date();
      if (filter === 'Hôm Nay') return d.toDateString() === today.toDateString();
      if (filter === 'Tháng Này') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
      return true; 
  };
  
  const getWarehouseAccount = (category) => {
      const cat = String(category || '').toUpperCase();
      if (cat.includes('DANH MỤC SẢN XUẤT') || cat.includes('NGUYÊN LIỆU') || cat.includes('VẬT TƯ')) return '152'; 
      if (cat.includes('PHỤ KIỆN')) return '156';
      if (cat.includes('LAYOUT') || cat.includes('BỂ KÍNH') || cat.includes('THÀNH PHẨM')) return '155'; 
      return '156'; 
  };

  const filteredLogs = React.useMemo(() => {
      return (data?.ImportExport || []).filter(log => isDateInRangeLocal(log.date || log.createdAt));
  }, [data?.ImportExport, filter]);

  // PHÂN TÍCH KPI SỐ LIỆU ĐẦU TRANG
  const stats = React.useMemo(() => {
      let count = 0;
      let totalAmount = 0;
      let lastDate = 'N/A';
      
      let allMatchedLogs = [];
      filteredLogs.forEach(log => {
          if (log.type !== typeTab) return;
          
          let parsedItems = [];
          try { parsedItems = JSON.parse(log.itemsData || '[]'); } catch(e){}
          
          let matchSearch = false;
          if (!search) { 
              matchSearch = true; 
          } else {
              const term = search.toLowerCase();
              if (String(log.id).toLowerCase().includes(term) || String(log.note).toLowerCase().includes(term) || String(log.target).toLowerCase().includes(term)) {
                  matchSearch = true;
              } else if (parsedItems.some(i => String(i.name).toLowerCase().includes(term))) {
                  matchSearch = true;
              }
          }
          
          if (matchSearch) {
              const hasWarehouseItem = parsedItems.some(item => {
                  const prodInfo = (data?.Products || []).find(p => p.name === item.name);
                  const cat = prodInfo ? prodInfo.category : 'PHỤ KIỆN';
                  return getWarehouseAccount(cat) === subWarehouse;
              });
              if (hasWarehouseItem) {
                  allMatchedLogs.push(log);
                  totalAmount += (Number(log.totalAmount) || 0);
                  count++;
              }
          }
      });
      
      if (allMatchedLogs.length > 0) {
          const sorted = [...allMatchedLogs].sort((a,b) => new Date(b.date || b.createdAt || 0) - new Date(a.date || a.createdAt || 0));
          const latest = sorted[0];
          lastDate = latest.date ? String(latest.date).slice(11, 16) : 'N/A';
      }
      
      return {
          count,
          totalAmount,
          lastDate
      };
  }, [filteredLogs, typeTab, subWarehouse, search, data?.Products]);

  // GROUP LOGS THEO NGÀY ĐỂ VẼ TIMELINE
  const logsByDate = React.useMemo(() => {
      const groups = {};
      filteredLogs.filter(log => log.type === typeTab).forEach(log => {
          let parsedItems = [];
          try { parsedItems = JSON.parse(log.itemsData || '[]'); } catch(e){}

          let matchSearch = false;
          if (!search) { 
              matchSearch = true; 
          } else {
              const term = search.toLowerCase();
              if (String(log.id).toLowerCase().includes(term) || String(log.note).toLowerCase().includes(term) || String(log.target).toLowerCase().includes(term)) {
                  matchSearch = true;
              } else if (parsedItems.some(i => String(i.name).toLowerCase().includes(term))) {
                  matchSearch = true;
              }
          }

          if (matchSearch) {
              let warehouseMatchedItems = [];
              parsedItems.forEach(item => {
                  const prodInfo = (data?.Products || []).find(p => p.name === item.name);
                  const cat = prodInfo ? prodInfo.category : 'PHỤ KIỆN';
                  if (getWarehouseAccount(cat) === subWarehouse) {
                      warehouseMatchedItems.push(item);
                  }
              });
              if (warehouseMatchedItems.length > 0) {
                  const rawDate = log.date || log.createdAt || new Date().toISOString();
                  const dateKey = String(rawDate).slice(0, 10);
                  if (!groups[dateKey]) groups[dateKey] = [];
                  groups[dateKey].push({ ...log, parsedItems: warehouseMatchedItems });
              }
          }
      });
      return groups;
  }, [filteredLogs, typeTab, subWarehouse, search, data?.Products]);

  const sortedDates = React.useMemo(() => {
      return Object.keys(logsByDate).sort((a,b) => new Date(b) - new Date(a));
  }, [logsByDate]);

  const getWarehouseName = (id) => {
      if (id === '152') return 'Nguyên Liệu 152';
      if (id === '155') return 'Thành Phẩm 155';
      return 'Hàng Hoá 156';
  };

  return (
    <div className="space-y-5 animate-fade-in pb-10 w-full">
      {/* 1. KHUNG TĨNH: NỘI QUY KHO VẬN */}
      <div className="bg-gradient-to-r from-[#2a0808] to-[#141414] border border-rose-500/20 rounded-2xl p-4 shadow-lg relative overflow-hidden">
          <div className="absolute top-0 right-0 w-24 h-24 bg-rose-500/5 rounded-full blur-2xl -mr-6 -mt-6 pointer-events-none"></div>
          <div className="flex items-center gap-2 mb-3 border-b border-rose-500/15 pb-2 relative z-10">
              <i className="fas fa-gavel text-rose-500 text-[14px]"></i>
              <span className="font-black text-[12px] text-rose-500 uppercase tracking-widest">Nội Quy & Phạt Kho Vận</span>
          </div>
          <ul className="text-[11px] text-gray-300 font-medium space-y-2 relative z-10 pl-1">
              <li className="flex items-start gap-2 leading-snug">
                  <i className="fas fa-times-circle text-[10px] text-rose-500/60 mt-0.5 shrink-0"></i>
                  <span>Đầu kỳ, cuối kỳ không kiểm hàng<b className="text-rose-400 bg-rose-500/10 px-1.5 py-0.5 rounded ml-1 border border-rose-500/20">-500k</b></span>
              </li>
              <li className="flex items-start gap-2 leading-snug">
                  <i className="fas fa-times-circle text-[10px] text-rose-500/60 mt-0.5 shrink-0"></i>
                  <span>Tạo lệnh xuất nhập sai thực tế, Chứng từ thiếu thông tin<b className="text-rose-400 bg-rose-500/10 px-1.5 py-0.5 rounded ml-1 border border-rose-500/20">-100k</b></span>
              </li>
              <li className="flex items-start gap-2 leading-snug">
                  <i className="fas fa-times-circle text-[10px] text-rose-500/60 mt-0.5 shrink-0"></i>
                  <span>Có tạo phiếu kiểm kho nhưng sai thực tế<b className="text-rose-400 bg-rose-500/10 px-1.5 py-0.5 rounded ml-1 border border-rose-500/20">-100k</b></span>
              </li>
          </ul>
      </div>

      {/* 2. CHỈ SỐ DASHBOARD KHO VẬN */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <div className="bg-[#141414] p-4 rounded-2xl border border-zinc-800/60 shadow-sm flex items-center justify-between">
              <div>
                  <span className="text-[8px] font-black text-gray-500 uppercase tracking-widest block mb-1">TỔNG SỐ PHIẾU</span>
                  <span className="text-[20px] font-black text-white leading-none">{stats.count} <span className="text-[10px] text-gray-500">phiếu</span></span>
              </div>
              <div className="w-9 h-9 rounded-xl bg-zinc-800 flex items-center justify-center text-sm text-gray-400"><i className="fas fa-file-invoice"></i></div>
          </div>
          <div className="bg-[#141414] p-4 rounded-2xl border border-zinc-800/60 shadow-sm flex items-center justify-between">
              <div>
                  <span className="text-[8px] font-black text-gray-500 uppercase tracking-widest block mb-1">TỔNG GIÁ TRỊ ({typeTab})</span>
                  <span className={`text-[18px] font-black leading-none ${typeTab === 'Nhập' ? 'text-emerald-500' : 'text-rose-500'}`}>{displayMoney(stats.totalAmount)}đ</span>
              </div>
              <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm ${typeTab==='Nhập'?'bg-emerald-500/10 text-emerald-500':'bg-rose-500/10 text-rose-500'}`}><i className="fas fa-coins"></i></div>
          </div>
          <div className="bg-[#141414] p-4 rounded-2xl border border-zinc-800/60 shadow-sm flex items-center justify-between">
              <div>
                  <span className="text-[8px] font-black text-gray-500 uppercase tracking-widest block mb-1">KHO ĐANG CHỌN</span>
                  <span className="text-[13px] font-black text-gray-300 leading-none truncate max-w-[120px] block mt-1">{getWarehouseName(subWarehouse)}</span>
              </div>
              <div className="w-9 h-9 rounded-xl bg-zinc-800 flex items-center justify-center text-sm text-gray-400"><i className="fas fa-warehouse"></i></div>
          </div>
          <div className="bg-[#141414] p-4 rounded-2xl border border-zinc-800/60 shadow-sm flex items-center justify-between">
              <div>
                  <span className="text-[8px] font-black text-gray-500 uppercase tracking-widest block mb-1">CẬP NHẬT GẦN NHẤT</span>
                  <span className="text-[15px] font-black text-[#d4af37] leading-none mt-1 block">{stats.lastDate}</span>
              </div>
              <div className="w-9 h-9 rounded-xl bg-zinc-800 flex items-center justify-center text-sm text-[#d4af37]/70"><i className="fas fa-clock"></i></div>
          </div>
      </div>

      {/* 3. ĐIỀU HƯỚNG & LỌC */}
      <div className="flex gap-2">
          <select value={filter} onChange={e=>setFilter(e.target.value)} className="w-1/3 bg-[#141414] border border-[#2a2a2a] rounded-xl px-3 py-2.5 text-[10px] font-black text-white outline-none focus:border-[#d4af37] shadow-inner cursor-pointer">
              <option value="Hôm Nay">HÔM NAY</option>
              <option value="Tháng Này">THÁNG NÀY</option>
              <option value="Tất Cả">TẤT CẢ GIAO DỊCH</option>
          </select>
          <select value={subWarehouse} onChange={e=>setSubWarehouse(e.target.value)} className="w-2/3 bg-[#141414] border border-[#2a2a2a] rounded-xl px-3 py-2.5 text-[10px] font-black text-white outline-none focus:border-[#d4af37] shadow-inner cursor-pointer">
              <option value="152">KHO NGUYÊN LIỆU (Kho 152)</option>
              <option value="156">KHO HÀNG HOÁ (Kho 156)</option>
              <option value="155">KHO THÀNH PHẨM (Kho 155)</option>
          </select>
      </div>

      {/* 4. TÌM KIẾM VÀ CHUYỂN TABS */}
      <div className="flex items-center gap-2">
          <div className="flex bg-[#141414] border border-[#2a2a2a] rounded-xl overflow-hidden shadow-sm shrink-0 p-0.5">
              <button onClick={()=>setTypeTab('Nhập')} className={`px-4 py-2.5 text-[10px] font-black uppercase transition-colors rounded-lg ${typeTab==='Nhập' ? 'bg-[#10b981] text-[#0a0a0a] shadow-sm' : 'text-gray-500 hover:text-gray-300'}`}>NHẬP</button>
              <button onClick={()=>setTypeTab('Xuất')} className={`px-4 py-2.5 text-[10px] font-black uppercase transition-colors rounded-lg ${typeTab==='Xuất' ? 'bg-[#f43f5e] text-white shadow-sm' : 'text-gray-500 hover:text-gray-300'}`}>XUẤT</button>
          </div>
          
          <div className="flex-1 relative">
              <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-[12px]"></i>
              <input 
                  type="text" 
                  placeholder="Tìm kiếm phiếu, tên sản phẩm..." 
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  className="w-full bg-[#141414] border border-[#2a2a2a] rounded-xl pl-9 pr-8 py-3 text-[11px] font-bold text-white outline-none focus:border-[#d4af37] shadow-inner transition-colors"
              />
              {search && <button onClick={()=>setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white"><i className="fas fa-times-circle"></i></button>}
          </div>
      </div>

      {/* 5. TIÊU ĐỀ HÀNG HOÁ & NÚT TẠO PHIẾU */}
      <div className="flex justify-between items-center bg-[#141414] p-3.5 rounded-2xl shadow-sm border border-[#2a2a2a]">
          <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-full bg-[#d4af37]/10 flex items-center justify-center"><i className="fas fa-receipt text-[#d4af37] text-[12px]"></i></div>
              <div>
                  <h3 className="font-black text-[#f5f5f5] text-[12px] uppercase tracking-wide">Danh sách chứng từ {typeTab}</h3>
                  <div className="text-[10px] text-gray-500 font-bold">Tìm thấy {stats.count} phiếu hợp lệ</div>
              </div>
          </div>
          <button onClick={() => {
              const currentRole = localStorage.getItem('rf_role');
              const currentUser = localStorage.getItem('rf_user');
              if (currentRole === 'TỐI CAO' || currentRole === 'KHO VẬN' || currentRole === 'KẾ TOÁN' || currentRole === 'KIỂM TOÁN' || currentUser === 'Nguyễn Thị Diệu Hương' || isAdmin) {
                  setShowForm(true);
              } else {
                  alert('Chỉ Quản Lý Kho, Kế Toán hoặc Kiểm Toán mới có quyền tạo phiếu xuất nhập!');
              }
          }} className="bg-[#2563eb] text-white text-[10px] font-black px-4.5 py-3 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.3)] hover:bg-blue-600 active:scale-95 transition-all uppercase tracking-wider">
              <i className="fas fa-plus mr-1"></i> Tạo Phiếu
          </button>
      </div>

      {/* 6. TIMELINE DANH SÁCH PHIẾU THEO NGÀY */}
      <div className="relative pl-4 border-l border-zinc-800 space-y-6">
         {sortedDates.length === 0 ? (
             <div className="text-center py-12 text-gray-500 font-bold text-[11px] bg-[#141414] rounded-2xl border border-[#2a2a2a] flex flex-col items-center justify-center -ml-4">
                <i className="fas fa-box-open text-3xl mb-3 opacity-20"></i> 
                <span>Không có dữ liệu {typeTab.toLowerCase()} kho khớp bộ lọc</span>
                <span className="text-[9px] font-medium opacity-65 mt-1">Vui lòng thử đổi từ khóa hoặc bộ lọc thời gian</span>
             </div>
         ) : sortedDates.map(date => {
             const displayDate = date.split('-').reverse().join('/');
             const logsForDate = logsByDate[date].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

             return (
                 <div key={date} className="relative space-y-3 animate-fade-in">
                     {/* ĐIỂM TIMELINE TRÒN */}
                     <div className="absolute -left-[21px] top-2.5 w-2.5 h-2.5 rounded-full bg-[#d4af37] border-2 border-[#0a0a0a] shadow-[0_0_8px_rgba(212,175,55,0.8)] z-20"></div>
                     
                     <div className="flex items-center gap-2 pl-1.5 py-1">
                         <span className="font-black text-[11px] text-gray-400 uppercase tracking-widest">Ngày {displayDate}</span>
                         <span className="text-[8px] text-zinc-500 font-black bg-[#141414] px-2 py-0.5 rounded-full border border-zinc-800">{logsForDate.length} phiếu</span>
                     </div>
                     
                     {logsForDate.map(log => (
                          <div key={log.id} className="bg-[#141414] rounded-2xl shadow-sm border border-[#2a2a2a] p-4 transition-colors hover:border-zinc-700 ml-1">
                              <div className="flex justify-between items-start mb-3 border-b border-zinc-800 pb-2">
                                  <div>
                                      <div className="flex items-center gap-2 mb-1">
                                          <span className="font-black text-[13px] text-[#f5f5f5] uppercase font-mono tracking-wide">{log.id}</span>
                                          <span className="text-[9px] font-mono font-bold bg-[#0a0a0a] border border-[#222] text-gray-400 px-2 py-0.5 rounded shadow-sm">{String(log.date).slice(11, 16)}</span>
                                      </div>
                                      <div className="text-[10px] text-gray-500 font-bold flex items-center gap-1.5">
                                          <i className="fas fa-user-edit text-[#d4af37]/80 text-[9px]"></i>{log.user || 'Hệ thống'}
                                      </div>
                                  </div>
                                  {isAdmin && (
                                      <button onClick={() => { if(window.confirm('Bạn có chắc muốn XOÁ VĨNH VIỄN phiếu nhập xuất này không?')) pushData({deletes:{ImportExport:[log.id]}}); }} className="w-7 h-7 bg-[#4c0519]/50 text-[#e11d48] border border-[#e11d48]/20 hover:bg-[#e11d48] hover:text-white rounded-lg flex items-center justify-center transition-colors shadow-sm active:scale-95">
                                          <i className="fas fa-trash text-[10px]"></i>
                                      </button>
                                  )}
                              </div>
                              
                              <div className="space-y-1.5 mb-3">
                                  {log.parsedItems.map((it, idx) => (
                                      <div key={idx} className="flex justify-between items-center text-[11px] bg-[#0a0a0a] p-2.5 rounded-xl border border-zinc-900 shadow-inner">
                                          <span className="text-gray-300 font-bold truncate pr-2">
                                              <i className="fas fa-caret-right text-[8px] opacity-40 mr-1.5 text-[#d4af37]"></i>{it.name}
                                          </span>
                                          <span className={`font-black shrink-0 ${typeTab === 'Nhập' ? 'text-emerald-500' : 'text-rose-500'}`}>
                                              {typeTab === 'Nhập' ? '+' : '-'}{it.qty} <span className="text-[9px] text-gray-500 ml-0.5 font-bold uppercase">{it.unit || 'Cái'}</span>
                                          </span>
                                      </div>
                                  ))}
                              </div>
                              
                              <div className="flex flex-col sm:flex-row justify-between sm:items-center bg-[#0a0a0a] p-2.5 rounded-xl border border-zinc-900 gap-2">
                                  <div className="flex-1">
                                      <div className="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-0.5"><i className="fas fa-tag mr-1 text-[7px]"></i>Mục đích / Ghi chú</div>
                                      <div className="text-[11px] text-[#60a5fa] font-medium italic leading-snug line-clamp-1">{log.note || log.target || 'Nội bộ'}</div>
                                  </div>
                                  <div className="text-left sm:text-right shrink-0 border-t sm:border-t-0 border-zinc-900 pt-1.5 sm:pt-0">
                                      <div className="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-0.5">TỔNG TRỊ GIÁ PHIẾU</div>
                                      <div className={`text-[14px] font-black leading-none tracking-tight ${typeTab === 'Nhập' ? 'text-[#10b981]' : 'text-[#f43f5e]'}`}>{Number(log.totalAmount || 0).toLocaleString('vi-VN')}đ</div>
                                  </div>
                              </div>
                          </div>
                     ))}
                 </div>
             )
         })}
      </div>

      {showForm && <IEFormModal data={data} onClose={() => { setShowForm(false); setPrefilledProduct(null); }} pushData={pushData} prefilledProduct={prefilledProduct} />}
    </div>
  )
}

function IEFormModal({ data, onClose, pushData, prefilledProduct }) {
   const [type, setType] = React.useState('Nhập'); 
   const [isSaving, setIsSaving] = React.useState(false);
   
   React.useEffect(() => {
       if (prefilledProduct) {
           setType('Nhập');
           const p = (data?.Products||[]).find(x => x.id === prefilledProduct.id) || prefilledProduct;
           setItems([{
               id: p.id,
               name: p.name,
               qty: 1,
               price: parseFloat(p.costPrice) || 0,
               unit: p.unit || 'Cái'
           }]);
           setSelProd(p.id);
           setSearchProd(p.name);
           setSelQty('1');
           setSelPrice(p.costPrice || '');
       }
   }, [prefilledProduct, data?.Products]);
   
   const currentRole = localStorage.getItem('rf_role');
   const currentUser = localStorage.getItem('rf_user');
   const isKiemToan = currentRole === 'TỐI CAO' || currentRole === 'KẾ TOÁN' || currentRole === 'KIỂM TOÁN' || currentUser === 'Nguyễn Thị Diệu Hương';
   
   const getVNTime = () => {
       const d = new Date();
       return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
   };

   const [supplierId, setSupplierId] = React.useState('');
   const [receiverName, setReceiverName] = React.useState(''); 
   const [accId, setAccId] = React.useState(''); 
   const [paidAmount, setPaidAmount] = React.useState('');
   const [note, setNote] = React.useState('');
   const [dateStr, setDateStr] = React.useState(getVNTime()); 
   
   const [showAddSup, setShowAddSup] = React.useState(false);
   const [newSup, setNewSup] = React.useState({ name: '', phone: '', category: 'HÀNG HOÁ' });

   const [items, setItems] = React.useState([]);
   const [searchProd, setSearchProd] = React.useState('');
   const [showDropdown, setShowDropdown] = React.useState(false); 
   const [selProd, setSelProd] = React.useState('');
   const [selQty, setSelQty] = React.useState('');
   const [selPrice, setSelPrice] = React.useState('');

   const [isUsingImportUnit, setIsUsingImportUnit] = React.useState(false);

   const [checkCat, setCheckCat] = React.useState('');
   const [checkSubCat, setCheckSubCat] = React.useState('');

   const [checkItems, setCheckItems] = React.useState(() => {
       try {
           const draft = localStorage.getItem('rf_kiemkho_draft');
           return draft ? JSON.parse(draft) : {};
       } catch(e) { return {}; }
   });

   React.useEffect(() => {
       if (type === 'Kiểm Kho' && checkSubCat) {
           const prods = (data?.Products||[]).filter(p => p.sub_category === checkSubCat);
           setCheckItems(prev => {
               const init = { ...prev };
               prods.forEach(p => { if (init[p.id] === undefined) { init[p.id] = p.quantity; } });
               return init;
           });
       }
   }, [type, checkSubCat, data?.Products]);

   const handleCheckInput = (id, val) => {
       const newItems = { ...checkItems, [id]: val };
       setCheckItems(newItems);
       localStorage.setItem('rf_kiemkho_draft', JSON.stringify(newItems));
   };

   const filteredProducts = React.useMemo(() => { 
       if (!showDropdown && !searchProd) return []; 
       return (data?.Products||[]).filter(p => String(p.name).toLowerCase().includes(searchProd.toLowerCase()) || String(p.sku).toLowerCase().includes(searchProd.toLowerCase())).slice(0, 30); 
   }, [data?.Products, searchProd, showDropdown]);

   const selectedProductInfo = React.useMemo(() => (data?.Products||[]).find(x => x.id === selProd), [data?.Products, selProd]);

   const handleSelectProduct = (p) => { 
       setSelProd(p.id); setSearchProd(p.name); setSelPrice(type === 'Nhập' ? p.costPrice : p.price); setShowDropdown(false); 
       setIsUsingImportUnit(false);
   };

   const totalAmount = items.reduce((acc, curr) => acc + (curr.qty * curr.price), 0);
   const displayMoney = (val) => Number(val || 0).toLocaleString('vi-VN');

   const addItem = () => { 
       const p = (data?.Products||[]).find(x=>x.id===selProd);
       let qtyNum = parseFloat(selQty);
       if(!p || isNaN(qtyNum) || qtyNum <= 0) return alert("Vui lòng nhập số lượng hợp lệ lớn hơn 0"); 
       let pPrice = parseFloat(selPrice) || 0;

       if (type === 'Nhập' && isUsingImportUnit && p.conversionRate > 1) {
           qtyNum = qtyNum * Number(p.conversionRate);
           pPrice = pPrice / Number(p.conversionRate);
       }

       setItems([...items, { id: p.id, name: p.name, qty: qtyNum, price: pPrice, unit: p.unit || 'Cái' }]); 
       setSelProd(''); setSelQty(''); setSelPrice(''); setSearchProd(''); 
       setIsUsingImportUnit(false);
   };

   const handleCreateSupplier = async () => {
       if (!newSup.name.trim()) return alert('Vui lòng nhập Tên Nhà Cung Cấp!');
       const sId = 'SUP_' + Date.now();
       const payloadSup = { id: sId, name: newSup.name, phone: newSup.phone, category: newSup.category, totalDebt: 0 };
       try {
           await pushData({ Suppliers: [payloadSup] });
           setSupplierId(sId);
           setShowAddSup(false);
           setNewSup({ name: '', phone: '', category: 'HÀNG HOÁ' });
       } catch (e) { alert('Lỗi tạo NCC!'); }
   };

   const save = async () => {
     if (isSaving) return;
     if (type === 'Kiểm Kho' && !checkSubCat) return alert('Vui lòng chọn danh mục con để kiểm kho!');
     if (type !== 'Kiểm Kho' && items.length === 0) return alert('Hãy thêm ít nhất 1 mặt hàng vào phiếu!');

     setIsSaving(true);
     let payload = { Products: [], ImportExport: [], Transactions: [], Accounts: [], Suppliers: [] };
     let formattedDate = new Date(dateStr).toISOString().slice(0, 16).replace('T', ' ');

     if (type === 'Kiểm Kho') {
         let nhapItems = []; let xuatItems = []; let totalNhapAmt = 0; let totalXuatAmt = 0;
         (data?.Products||[]).filter(p => p.sub_category === checkSubCat).forEach((p) => {
             const actual = parseInt(checkItems[p.id]);
             if (!isNaN(actual) && actual !== Number(p.quantity)) {
                 const diff = actual - Number(p.quantity);
                 payload.Products.push({ ...p, quantity: actual, _diff: diff });
                 if (diff > 0) {
                     nhapItems.push({ name: p.name, qty: diff, price: p.costPrice || 0, unit: p.unit || 'Cái' }); totalNhapAmt += diff * Number(p.costPrice || 0);
                 } else {
                     const absDiff = Math.abs(diff); xuatItems.push({ name: p.name, qty: absDiff, price: p.costPrice || 0, unit: p.unit || 'Cái' }); totalXuatAmt += absDiff * Number(p.costPrice || 0);
                 }
             }
         });
         
         if (nhapItems.length === 0 && xuatItems.length === 0) {
             alert('Không phát hiện chênh lệch! Toàn bộ mặt hàng trong danh mục khớp 100% với sổ sách.');
             localStorage.removeItem('rf_kiemkho_draft');
             setIsSaving(false); onClose(); return;
         }

         if (nhapItems.length > 0) payload.ImportExport.push({ id: 'IE_GCHK_N_' + Date.now(), type: 'Nhập', target: 'Kiểm kho (Cân tăng)', totalAmount: totalNhapAmt, date: formattedDate, note: `Cân đối kiểm kho tăng danh mục: ${checkSubCat}`, itemsData: JSON.stringify(nhapItems) });
         if (xuatItems.length > 0) payload.ImportExport.push({ id: 'IE_GCHK_X_' + Date.now() + 1, type: 'Xuất', target: 'Kiểm kho (Cân giảm)', totalAmount: totalXuatAmt, date: formattedDate, note: `Cân đối kiểm kho giảm danh mục: ${checkSubCat}`, itemsData: JSON.stringify(xuatItems) });
     } else {
         const logId = 'IE_'+Date.now(); let totalDebtAdd = 0;
         items.forEach(i => { 
             const p = (data?.Products||[]).find(x=>x.id===i.id); 
             if(p) {
                 const diffVal = type === 'Nhập' ? i.qty : -i.qty;
                 payload.Products.push({...p, quantity: Number(p.quantity) + diffVal, _diff: diffVal}); 
             }
         });
         let targetName = 'Nội bộ/Khác';

         if(type === 'Nhập') {
            targetName = supplierId ? ((data?.Suppliers||[]).find(s=>s.id===supplierId)?.name || 'Khác') : 'Khác';
            if(supplierId) {
                const paid = parseInt(paidAmount) || 0; totalDebtAdd = totalAmount - paid;
                if(paid > 0) { 
                    if(!accId) { setIsSaving(false); return alert('Vui lòng chọn quỹ để xuất Phiếu Chi thanh toán!'); }
                    const acc = (data?.Accounts||[]).find(a=>a.id===accId); 
                    payload.Accounts.push({...acc, balance: Number(acc.balance) - paid}); 
                    payload.Transactions.push({ id: 'TX_'+Date.now(), type: 'Chi', category: 'Thanh Toán Hoá Đơn', amount: paid, fromAccount: accId, toAccount: '', title: `Thanh toán nhập hàng: ${targetName}`, date: formattedDate, note: 'Hệ thống tạo tự động từ Phiếu Nhập Kho' });
                }
                if(totalDebtAdd > 0) { 
                    const sup = (data?.Suppliers||[]).find(s=>s.id===supplierId);
                    payload.Suppliers.push({...sup, totalDebt: Number(sup.totalDebt) + totalDebtAdd}); 
                }
            }
         } else { targetName = receiverName || 'Xuất nội bộ'; }
         
         let finalNote = note;
         if(type === 'Nhập') { 
             const u = (localStorage.getItem('rf_user') || 'Admin').split(' ').pop(); 
             finalNote = `${note ? note + ' - ' : ''}Nhập từ NCC (Người tạo: ${u})`;
         }
         payload.ImportExport.push({ id: logId, type, target: targetName, totalAmount, date: formattedDate, note: finalNote, itemsData: JSON.stringify(items) });
     }

     try {
         await pushData(payload);
         if (type === 'Kiểm Kho') localStorage.removeItem('rf_kiemkho_draft');
         onClose();
     } catch (e) { setIsSaving(false); alert("Lỗi lưu phiếu: " + e.message); }
   };

   const hasDraft = checkItems && Object.keys(checkItems).length > 0;

   // Tính toán tổng số lượng chênh lệch trong chế độ Kiểm Kho để hiển thị báo cáo tổng quan
   const checkDiffsSummary = React.useMemo(() => {
       if (type !== 'Kiểm Kho' || !checkSubCat) return { surplus: 0, deficit: 0, matched: 0 };
       let surplus = 0, deficit = 0, matched = 0;
       (data?.Products||[]).filter(p => p.sub_category === checkSubCat).forEach(p => {
           const actual = parseInt(checkItems[p.id]);
           if (isNaN(actual)) return;
           const diff = actual - Number(p.quantity);
           if (diff > 0) surplus++;
           else if (diff < 0) deficit++;
           else matched++;
       });
       return { surplus, deficit, matched };
   }, [type, checkSubCat, checkItems, data?.Products]);

   return (
     <div className="fixed inset-0 bg-[#0a0a0a]/90 z-[300] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={() => { if(!isSaving) onClose(); }}>
       <div className="bg-[#141414] w-full max-w-md rounded-[24px] p-5 border border-[#333] shadow-2xl flex flex-col max-h-[90vh] animate-slide-up" onClick={e => e.stopPropagation()}>
         <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-3">
             <h3 className="font-black text-[#d4af37] text-[15px] uppercase tracking-wider"><i className="fas fa-file-invoice mr-2"></i> Tạo Phiếu Kho</h3>
             <button onClick={onClose} disabled={isSaving} className="w-8 h-8 bg-[#1a1a1a] rounded-full text-gray-400 hover:text-rose-500 border border-[#333] transition-colors"><i className="fas fa-times"></i></button>
         </div>
         
         <div className="flex gap-1.5 mb-4 p-1 bg-[#0a0a0a] rounded-xl border border-[#222] shrink-0">
             <button onClick={()=>setType('Nhập')} disabled={isSaving} className={`flex-1 py-2 rounded-lg font-black text-[10px] uppercase transition-all ${type==='Nhập'?'bg-[#10b981] text-[#0a0a0a] shadow-sm':'text-gray-500'}`}>NHẬP KHO</button>
             <button onClick={()=>setType('Xuất')} disabled={isSaving} className={`flex-1 py-2 rounded-lg font-black text-[10px] uppercase transition-all ${type==='Xuất'?'bg-[#f43f5e] text-white shadow-sm':'text-gray-500'}`}>XUẤT KHO</button>
             {isKiemToan && (
                 <button onClick={()=>setType('Kiểm Kho')} disabled={isSaving} className={`flex-1 py-2 rounded-lg font-black text-[10px] uppercase transition-all ${type==='Kiểm Kho'?'bg-[#2563eb] text-white shadow-sm':'text-gray-500'}`}>KIỂM KHO</button>
             )}
         </div>

         <div className="flex-1 overflow-y-auto space-y-4 custom-scrollbar pr-1 pb-2">
           {/* GIAO DIỆN KIỂM KHO CHUYÊN NGHIỆP */}
           {type === 'Kiểm Kho' && (
             <div className="space-y-4 animate-fade-in">
                <div className="p-3 bg-[#2563eb]/10 border border-[#2563eb]/20 rounded-xl flex gap-2 items-start shadow-sm text-[10px] leading-relaxed text-gray-300">
                    <i className="fas fa-info-circle text-[#60a5fa] mt-0.5 text-xs"></i>
                    <span>Hệ thống sẽ tự động đối chiếu số lượng thực đếm với sổ sách. Các chênh lệch sẽ được **tự động bù trừ kho** và tạo chứng từ cân đối kho tương ứng.</span>
                </div>
                {hasDraft && (
                    <div className="text-[10px] text-amber-500 bg-amber-500/10 p-2.5 rounded-xl font-bold border border-amber-500/20 flex justify-between items-center shadow-sm">
                        <span><i className="fas fa-save mr-1"></i> Có dữ liệu đếm nháp của kỳ kiểm trước</span>
                        <button onClick={() => { if(confirm('Xóa dữ liệu nháp cũ?')) { localStorage.removeItem('rf_kiemkho_draft'); setCheckItems({}); } }} className="px-2.5 py-1 bg-[#1a1a1a] border border-amber-500/30 rounded text-amber-400 font-black active:scale-95 shadow-sm text-[9px] uppercase">Xóa nháp</button>
                    </div>
                )}
                <div className="grid grid-cols-2 gap-3 bg-[#0a0a0a] p-3 rounded-xl border border-[#222]">
                    <div>
                        <label className="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1.5 block">Danh Mục Chính</label>
                        <select disabled={isSaving} className="w-full p-2.5 bg-[#141414] border border-[#222] rounded-lg text-xs font-bold outline-none text-white focus:border-[#2563eb] cursor-pointer" value={checkCat} onChange={e => { setCheckCat(e.target.value); setCheckSubCat(''); }}>
                            <option value="">-- Chọn --</option>
                            {typeof CATEGORIES !== 'undefined' && CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                    </div>
                    <div>
                        <label className="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1.5 block">Danh Mục Con</label>
                        <select disabled={isSaving} className="w-full p-2.5 bg-[#141414] border border-[#222] rounded-lg text-xs font-bold outline-none text-white focus:border-[#2563eb] cursor-pointer" value={checkSubCat} onChange={e => setCheckSubCat(e.target.value)}>
                            <option value="">-- Chọn --</option>
                            {typeof SUB_CATEGORIES !== 'undefined' && checkCat && (SUB_CATEGORIES[checkCat]||[]).map(sc => <option key={sc} value={sc}>{sc}</option>)}
                        </select>
                    </div>
                </div>

                {checkSubCat && (
                    <div className="space-y-2 mt-4 max-h-[38vh] overflow-y-auto custom-scrollbar pr-1">
                        {(data?.Products||[]).filter(p => p.sub_category === checkSubCat).map(p => {
                            const actualVal = parseInt(checkItems[p.id]);
                            const isTyped = !isNaN(actualVal);
                            const diff = isTyped ? actualVal - Number(p.quantity) : 0;

                            return (
                                <div key={p.id} className="flex justify-between items-center bg-[#0a0a0a] p-3 rounded-xl border border-[#222] shadow-sm transition-all hover:border-[#2563eb]/40">
                                    <div className="flex-1 min-w-0 pr-3">
                                        <div className="font-black text-[12px] text-[#e5e5e5] leading-tight mb-1 truncate">{p.name}</div>
                                        <div className="text-[10px] text-gray-500 font-bold">
                                            Sổ sách: <span className="text-gray-300 font-black ml-1">{p.quantity} {p.unit || ''}</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3 shrink-0">
                                        {/* NHÃN CÂN ĐỐI TRỰC QUAN */}
                                        {isTyped && (
                                            <div className="text-right">
                                                {diff > 0 ? (
                                                    <span className="text-[9px] font-black text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20 shadow-sm animate-fade-in">Thừa +{diff}</span>
                                                ) : diff < 0 ? (
                                                    <span className="text-[9px] font-black text-rose-400 bg-rose-500/10 px-1.5 py-0.5 rounded border border-rose-500/20 shadow-sm animate-fade-in">Thiếu {diff}</span>
                                                ) : (
                                                    <span className="text-[9px] font-black text-gray-400 bg-gray-500/10 px-1.5 py-0.5 rounded border border-gray-500/20 shadow-sm animate-fade-in">Khớp</span>
                                                )}
                                            </div>
                                        )}
                                        <div className="flex flex-col items-end w-16">
                                            <input type="number" placeholder="Số đếm" disabled={isSaving} className="w-full p-1.5 text-center text-[13px] font-black text-[#60a5fa] rounded-lg border border-[#333] outline-none focus:border-[#2563eb] bg-[#141414]" value={checkItems[p.id] !== undefined ? checkItems[p.id] : ''} onChange={e => handleCheckInput(p.id, e.target.value)} />
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                )}
                
                {/* TÓM TẮT KẾT QUẢ KIỂM KHO */}
                {checkSubCat && (
                    <div className="bg-[#0a0a0a] border border-[#222] p-3 rounded-xl text-[10px] font-black text-gray-400 flex justify-between items-center gap-2 shadow-inner">
                        <span className="text-gray-500 uppercase tracking-widest text-[9px]"><i className="fas fa-calculator mr-1"></i> BÁO CÁO NHANH</span>
                        <div className="flex gap-3">
                            <span className="text-emerald-400"><i className="fas fa-arrow-up mr-0.5"></i> Thừa: {checkDiffsSummary.surplus}</span>
                            <span className="text-rose-400"><i className="fas fa-arrow-down mr-0.5"></i> Thiếu: {checkDiffsSummary.deficit}</span>
                            <span className="text-gray-300"><i className="fas fa-check-circle mr-0.5"></i> Khớp: {checkDiffsSummary.matched}</span>
                        </div>
                    </div>
                )}
             </div>
           )}

           {/* GIAO DIỆN NHẬP KHO / XUẤT KHO TIÊU CHUẨN */}
           {type !== 'Kiểm Kho' && (
             <div className="space-y-4 animate-fade-in">
                <div className="grid grid-cols-2 gap-3 bg-[#0a0a0a] p-3 rounded-xl border border-[#222]">
                    <div>
                        <label className="text-[9px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">Thời gian ghi sổ</label>
                        <input type="datetime-local" disabled={isSaving} className="w-full p-2 bg-[#141414] rounded-lg border border-[#222] text-[11px] font-bold outline-none text-white focus:border-[#d4af37] cursor-pointer" value={dateStr} onChange={e=>setDateStr(e.target.value)}/>
                    </div>
                    {type === 'Nhập' ? (
                        <div>
                            <div className="flex justify-between items-end mb-1.5">
                                <label className="text-[9px] font-black text-gray-500 uppercase tracking-widest">Nhà Cung Cấp</label>
                                <button onClick={() => setShowAddSup(true)} className="text-[8px] font-black text-[#10b981] hover:underline uppercase"><i className="fas fa-plus text-[7px]"></i> Thêm NCC</button>
                            </div>
                            <select disabled={isSaving} className="w-full p-2 bg-[#141414] rounded-lg border border-[#222] text-[11px] font-bold outline-none text-white focus:border-[#10b981] cursor-pointer" value={supplierId} onChange={e=>setSupplierId(e.target.value)}>
                                <option value="">-- Hàng trôi nổi / Khác --</option>
                                {(data?.Suppliers||[]).map(s=><option key={s.id} value={s.id}>{s.name} {s.category ? `(${s.category})` : ''}</option>)}
                            </select>
                        </div>
                    ) : (
                        <div>
                            <label className="text-[9px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">Người Nhận Hàng</label>
                            <input disabled={isSaving} placeholder="VD: Thợ Tùng..." className="w-full p-2 bg-[#141414] rounded-lg border border-[#222] text-[11px] font-bold outline-none text-white focus:border-[#f43f5e] placeholder-zinc-650" value={receiverName} onChange={e=>setReceiverName(e.target.value)}/>
                        </div>
                    )}
                </div>
                
                {showAddSup && (
                    <div className="bg-[#10b981]/5 border border-[#10b981]/20 p-3 rounded-xl animate-slide-down">
                        <div className="text-[10px] font-black text-[#10b981] mb-2 uppercase tracking-widest"><i className="fas fa-plus mr-1"></i>Thêm Nhanh Nhà Cung Cấp</div>
                        <div className="space-y-2">
                            <input type="text" placeholder="Tên NCC *" value={newSup.name} onChange={e=>setNewSup({...newSup, name: e.target.value})} className="w-full p-2 bg-[#0a0a0a] border border-[#222] rounded-lg text-xs text-white outline-none focus:border-[#10b981]" />
                            <div className="flex gap-2">
                                <input type="text" placeholder="Ngành hàng (VD: Keo, Cát...)" value={newSup.category} onChange={e=>setNewSup({...newSup, category: e.target.value})} className="flex-1 p-2 bg-[#0a0a0a] border border-[#222] rounded-lg text-xs text-white outline-none focus:border-[#10b981]" />
                                <input type="text" placeholder="SĐT (Tùy chọn)" value={newSup.phone} onChange={e=>setNewSup({...newSup, phone: e.target.value})} className="w-1/3 p-2 bg-[#0a0a0a] border border-[#222] rounded-lg text-xs text-white outline-none focus:border-[#10b981]" />
                            </div>
                            <div className="flex gap-2 mt-2">
                                <button onClick={()=>setShowAddSup(false)} className="flex-1 py-1.5 bg-[#1a1a1a] text-gray-400 text-[10px] font-bold rounded-lg border border-[#222] active:scale-95 transition-all">HỦY</button>
                                <button onClick={handleCreateSupplier} className="flex-1 py-1.5 bg-[#10b981] text-[#0a0a0a] text-[10px] font-black rounded-lg shadow-sm active:scale-95 transition-all">LƯU NCC</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* KHU VỰC THÊM HÀNG HOÁ VÀO GIỎ */}
                <div className="border border-[#222] p-3 rounded-2xl bg-[#0a0a0a]/50 space-y-3.5 shadow-sm">
                    <div className="flex items-center justify-between">
                        <div className="text-[9px] font-black text-gray-500 uppercase tracking-widest flex items-center gap-1.5"><i className="fas fa-boxes text-[#d4af37]/80"></i> CHI TIẾT MẶT HÀNG</div>
                        <div className="text-[8px] font-black text-gray-500 bg-zinc-800 px-2 py-0.5 rounded-full border border-zinc-700">{items.length} mục</div>
                    </div>
                    
                    <div className="relative z-50">
                        <div className="flex items-center bg-[#0a0a0a] border border-[#222] rounded-xl overflow-hidden focus-within:border-[#d4af37] transition-all">
                            <div className="pl-3.5 text-zinc-500"><i className="fas fa-search text-[13px]"></i></div>
                            <input disabled={isSaving} placeholder="Gõ tên hoặc SKU tìm kiếm..." className="w-full p-2.5 text-[12px] font-bold outline-none text-zinc-100 bg-transparent placeholder-zinc-600" value={searchProd} onChange={e => { setSearchProd(e.target.value); setShowDropdown(true); setSelProd(''); }} onFocus={() => setShowDropdown(true)}/>
                            {searchProd && <button onClick={() => { setSearchProd(''); setShowDropdown(false); }} className="pr-3 text-zinc-500 hover:text-red-400"><i className="fas fa-times-circle"></i></button>}
                        </div>
                        {showDropdown && (
                            <div className="absolute top-full left-0 right-0 mt-1.5 bg-[#141414] border border-[#333] rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] max-h-52 overflow-y-auto custom-scrollbar z-50">
                                {filteredProducts.length === 0 ? <div className="p-5 text-center text-zinc-500 flex flex-col items-center gap-2"><i className="fas fa-box-open text-xl opacity-20"></i><span className="text-[11px] font-bold">Không tìm thấy sản phẩm!</span></div> : filteredProducts.map(p => (
                                    <div key={p.id} onClick={() => handleSelectProduct(p)} className="p-3 border-b border-[#222] hover:bg-zinc-800/40 cursor-pointer transition-colors flex items-center justify-between group">
                                        <div className="flex-1 min-w-0 pr-3"><div className="text-[11px] font-black text-zinc-200 truncate mb-1 group-hover:text-[#d4af37] transition-colors">{p.name}</div><div className="text-[9px] font-bold text-zinc-500 flex gap-2"><span>Tồn: <span className={p.quantity > 0 ? "text-emerald-400" : "text-red-400"}>{p.quantity} {p.unit || ''}</span></span><span>•</span><span>Giá: <span className="text-zinc-400">{displayMoney(type === 'Nhập' ? p.costPrice : p.price)}đ</span></span></div></div>
                                        <i className="fas fa-plus-circle text-zinc-600 group-hover:text-[#d4af37] opacity-0 group-hover:opacity-100 transition-all text-base"></i>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    
                    <div className="flex gap-2">
                        <div className="relative w-[70px]">
                            <span className="absolute -top-1.5 left-2 bg-[#0a0a0a] px-1 text-[7px] font-black text-gray-500 uppercase z-10">SL</span>
                            <input type="number" disabled={isSaving} className="w-full p-2 bg-[#0a0a0a] rounded-lg border border-[#222] text-[13px] text-center font-black outline-none focus:border-[#d4af37] text-zinc-100" value={selQty} onChange={e => setSelQty(e.target.value)}/>
                        </div>
                        
                        {selectedProductInfo?.importUnit && Number(selectedProductInfo?.conversionRate) > 1 && type === 'Nhập' && (
                            <div className="relative w-[95px] shrink-0 animate-fade-in">
                                <span className="absolute -top-1.5 left-2 bg-[#0a0a0a] px-1 text-[7px] font-black text-emerald-500 uppercase z-10">ĐƠN VỊ</span>
                                <select value={isUsingImportUnit ? 'import' : 'base'} onChange={(e) => setIsUsingImportUnit(e.target.value === 'import')} className="w-full p-2 bg-[#0a0a0a] rounded-lg border border-emerald-500/30 text-[11px] font-black outline-none focus:border-emerald-500 text-emerald-400 appearance-none relative uppercase cursor-pointer">
                                    <option value="base">{selectedProductInfo.unit || 'Cái'}</option>
                                    <option value="import">{selectedProductInfo.importUnit}</option>
                                </select>
                                <i className="fas fa-chevron-down absolute right-2 top-1/2 -translate-y-1/2 text-[9px] text-emerald-500 pointer-events-none"></i>
                            </div>
                        )}

                        <div className="relative flex-1">
                            <span className="absolute -top-1.5 left-2 bg-[#0a0a0a] px-1 text-[7px] font-black text-gray-500 uppercase truncate max-w-[90%] z-10">
                                {type === 'Nhập' ? (isUsingImportUnit ? `GIÁ / 1 ${selectedProductInfo?.importUnit || ''}` : `GIÁ / 1 ${selectedProductInfo?.unit || 'Cái'}`) : "ĐƠN GIÁ XUẤT"}
                            </span>
                            <input type="number" disabled={isSaving} className={`w-full p-2 bg-[#0a0a0a] rounded-lg border border-[#222] text-[13px] font-black outline-none relative ${type === 'Nhập' ? 'text-emerald-400 focus:border-emerald-500/50' : 'text-rose-400 focus:border-rose-500/50'}`} value={selPrice} onChange={e => setSelPrice(e.target.value)}/>
                        </div>
                        <button disabled={isSaving} onClick={addItem} className={`w-[45px] flex items-center justify-center rounded-lg text-[13px] transition-all duration-300 ${selProd ? 'bg-[#d4af37] text-black font-black hover:bg-yellow-400 active:scale-95 shadow-[0_0_15px_rgba(212,175,55,0.2)]' : 'bg-zinc-800 text-zinc-600 cursor-not-allowed border border-white/5'}`}><i className="fas fa-plus"></i></button>
                    </div>

                    {selectedProductInfo?.importUnit && Number(selectedProductInfo?.conversionRate) > 1 && type === 'Nhập' && isUsingImportUnit && selQty && !isNaN(parseFloat(selQty)) && (
                        <div className="mt-2 text-[10px] text-emerald-400 font-medium bg-emerald-500/10 px-3 py-2 rounded-lg border border-emerald-500/20 shadow-sm flex items-start gap-2 leading-relaxed">
                            <i className="fas fa-exchange-alt mt-0.5"></i>
                            <span>Tự động quy đổi: <b className="font-black text-white">{parseFloat(selQty)} {selectedProductInfo.importUnit}</b> ➔ Số lượng thực tế nhập kho: <b className="font-black text-emerald-400">{parseFloat(selQty) * Number(selectedProductInfo.conversionRate)} {selectedProductInfo.unit || 'Cái'}</b></span>
                        </div>
                    )}

                    {items.length > 0 && (
                        <div className="mt-4 pt-4 border-t border-zinc-800 space-y-2">
                            <div className="max-h-[160px] overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                                {items.map((i, idx) => (
                                    <div key={idx} className="flex justify-between items-center bg-[#0a0a0a] p-2 rounded-lg border border-zinc-900 group">
                                        <div className="flex-1 min-w-0 pr-2"><div className="text-[11px] font-black text-zinc-200 truncate">{i.name}</div><div className="text-[9px] font-bold text-zinc-500 mt-0.5">{displayMoney(i.price)}đ / {i.unit || 'Cái'}</div></div>
                                        <div className="flex items-center gap-2 shrink-0">
                                            <div className="bg-zinc-800 px-2 py-0.5 rounded border border-zinc-700 flex items-center gap-1.5 justify-center text-[10px]">
                                                <span className="font-black text-[#d4af37]">{i.qty}</span>
                                                <span className="text-[8px] font-bold text-zinc-500 uppercase">{i.unit || 'Cái'}</span>
                                            </div>
                                            <button disabled={isSaving} onClick={() => { let n = [...items]; n.splice(idx, 1); setItems(n); }} className="w-7 h-7 flex items-center justify-center rounded-lg text-rose-500 bg-rose-500/5 hover:bg-rose-500/10 transition-all opacity-60 group-hover:opacity-100"><i className="fas fa-trash-alt text-[10px]"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-between items-end pt-3 pb-1 border-t border-zinc-800 mt-2">
                                <div className="text-[9px] font-black text-gray-500 uppercase tracking-widest">Tổng tiền phiếu</div>
                                <div className={`text-[16px] font-black tracking-tight ${type === 'Nhập' ? 'text-emerald-400' : 'text-rose-400'}`}>{displayMoney(totalAmount)}<span className="text-[11px] ml-1 text-gray-500 font-black">VND</span></div>
                            </div>
                        </div>
                    )}
                </div>

                <div>
                    <label className="text-[9px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">Ghi chú phiếu</label>
                    <input disabled={isSaving} placeholder="Nhập ghi chú mục đích xuất nhập..." className="w-full p-2.5 bg-[#0a0a0a] rounded-xl border border-[#333] text-[11px] font-bold outline-none text-white focus:border-[#d4af37]" value={note} onChange={e=>setNote(e.target.value)}/>
                </div>
                
                {/* TÍCH HỢP CHI TIỀN THANH TOÁN KHI NHẬP KHO CỦA NCC */}
                {type === 'Nhập' && supplierId && (
                    <div className="p-3.5 bg-emerald-950/15 border border-emerald-900/40 rounded-xl space-y-3 shadow-inner relative overflow-hidden">
                        <div className="flex justify-between items-center border-b border-emerald-900/20 pb-2"><span className="text-[10px] font-black text-[#10b981] uppercase tracking-widest">TỔNG CẦN TRẢ</span><span className="text-[16px] font-black text-[#10b981]">{displayMoney(totalAmount)}đ</span></div>
                        <div className="flex justify-between items-center gap-2">
                            <span className="text-[10px] font-bold text-gray-400">Chi trả ngay <br/><span className="text-[8px] text-gray-500 font-medium italic">(Hệ thống tự động tạo Phiếu Chi)</span></span>
                            <input type="number" disabled={isSaving} placeholder="Nhập số tiền chi..." className="w-1/2 p-2.5 bg-[#0a0a0a] rounded-lg border border-[#333] text-xs text-right font-black text-[#10b981] outline-none shadow-sm focus:border-[#10b981]" value={paidAmount} onChange={e=>setPaidAmount(e.target.value)}/>
                        </div>
                        {(parseInt(paidAmount)>0) && (
                            <div className="animate-fade-in pt-1.5">
                                <label className="text-[9px] font-bold text-gray-400 block mb-1">Trừ tiền từ quỹ nào?</label>
                                <select disabled={isSaving} className="w-full p-2 bg-[#0a0a0a] rounded-lg border border-[#333] text-[11px] font-bold outline-none shadow-sm focus:border-[#10b981] text-white cursor-pointer" value={accId} onChange={e=>setAccId(e.target.value)}><option value="">-- Chọn quỹ thanh toán --</option>{(data?.Accounts||[]).map(a=><option key={a.id} value={a.id}>{a.accountName} (Sẵn có: {displayMoney(a.balance)}đ)</option>)}</select>
                            </div>
                        )}
                        <div className="text-[10px] text-rose-500 font-bold text-right pt-2 border-t border-emerald-900/20 flex justify-end items-center gap-1.5"><i className="fas fa-hand-holding-usd opacity-60"></i> Nợ Đối Tác: <span className="bg-[#2a0808] text-rose-500 px-2 py-0.5 rounded border border-rose-900/30">{displayMoney(totalAmount - (parseInt(paidAmount)||0))}đ</span></div>
                    </div>
                )}
              </div>
            )}
          </div>
          
          <div className="pt-4 mt-2 shrink-0">
              <button onClick={save} disabled={isSaving} className={`w-full py-3.5 font-black rounded-xl text-[12px] uppercase tracking-wider shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 ${isSaving ? 'bg-[#333] text-gray-500 cursor-not-allowed' : (type === 'Kiểm Kho' ? 'bg-[#2563eb] text-white hover:bg-blue-600' : 'bg-[#d4af37] text-[#0a0a0a]')}`}>
                  {isSaving ? <><i className="fas fa-spinner fa-spin"></i> ĐANG ĐỒNG BỘ DỮ LIỆU...</> : (type === 'Kiểm Kho' ? <><i className="fas fa-magic"></i> LƯU PHIẾU KIỂM KHO</> : <><i className="fas fa-save"></i> LƯU PHIẾU {type.toUpperCase()}</>)}
              </button>
          </div>
        </div>
      </div>
    );
}
</script>
