<script type="text/babel">
// =========================================================================
// 📦 FILE: Tab_ImportExport.txt
// CHỨC NĂNG: Lịch sử xuất/nhập toàn hệ thống & Modal Tạo Phiếu (Giao diện nâng cấp)
// =========================================================================

// -------------------------------------------------------------------------
// 1. MODAL THẺ KHO CHI TIẾT (StockHistoryModal)
// -------------------------------------------------------------------------
function StockHistoryModal({ product, onClose, importExport }) {
    const logs = React.useMemo(() => {
        if (!importExport || !product) return [];
        let result = [];
        const prodNameClean = String(product.name || '').trim().toLowerCase();
        const prodSkuUpper = String(product.sku || '').trim().toUpperCase();

        importExport.forEach(log => {
            try {
                const items = typeof log.itemsData === 'string' ? safeJSONParse(log.itemsData) : (Array.isArray(log.itemsData) ? log.itemsData : []);
                if (!Array.isArray(items)) return;
                const match = items.find(i => {
                    const iName = String(i.name || '').trim().toLowerCase();
                    const iSku = String(i.sku || '').trim().toUpperCase();
                    return (iName && prodNameClean && (iName === prodNameClean || iName.includes(prodNameClean) || prodNameClean.includes(iName))) ||
                           (iSku && prodSkuUpper && (iSku === prodSkuUpper || iSku.includes(prodSkuUpper)));
                });
                if (match) {
                    const rawQty = match.qty !== undefined ? match.qty : (match.deductedQty !== undefined ? match.deductedQty : (parseFloat(match.quantity) || 0));
                    result.push({
                        ...log,
                        changedQty: Math.round(Number(rawQty || 0) * 1000) / 1000,
                        price: match.price || match.costPrice || 0
                    });
                }
            } catch(e) {}
        });
        result.sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
        
        let currentBal = Number(product.quantity || 0);
        result.forEach(log => {
            log.balanceAfter = Math.round(currentBal * 1000) / 1000;
            if (log.type === 'Nhập') {
                currentBal -= Number(log.changedQty || 0);
            } else {
                currentBal += Number(log.changedQty || 0);
            }
        });
        
        return result;
    }, [importExport, product]);

    return (
        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
            <div className="bg-[#141414] border border-[#333] w-full max-w-md rounded-3xl p-5 shadow-2xl flex flex-col max-h-[80vh] animate-slide-up" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4 shrink-0 border-b border-[#222] pb-3">
                    <div>
                        <div className="font-black text-[11px] text-[#10b981] uppercase tracking-wider flex items-center gap-1.5"><i className="fas fa-history"></i> THẺ KHO SẢN PHẨM</div>
                        <div className="text-[#f5f5f5] font-black text-sm mt-1">{product.name}</div>
                    </div>
                    <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#222] text-gray-400 hover:text-rose-500 flex items-center justify-center transition-colors border border-[#333]"><i className="fas fa-times"></i></button>
                </div>

                <div className="flex gap-3 mb-4 shrink-0">
                    <div className="flex-1 bg-[#0a0a0a] border border-[#222] rounded-xl p-3 text-center shadow-inner">
                        <div className="text-[8px] text-gray-500 font-black uppercase tracking-widest mb-1">Mã SKU</div>
                        <div className="text-[12px] font-black text-[#d4af37]">{product.sku || 'N/A'}</div>
                    </div>
                    <div className="flex-1 bg-[#0a0a0a] border border-[#222] rounded-xl p-3 text-center shadow-inner">
                        <div className="text-[8px] text-gray-500 font-black uppercase tracking-widest mb-1">Tồn Hiện Tại</div>
                        <div className="text-[16px] font-black text-[#10b981] leading-none mt-0.5">{product.quantity || 0} <span className="text-[10px] text-gray-400 font-bold uppercase">{product.unit || 'Cái'}</span></div>
                    </div>
                </div>

                <div className="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-2">
                    {logs.length === 0 ? (
                        <div className="text-center text-gray-500 font-bold text-[11px] py-10 bg-[#0a0a0a] rounded-xl border border-[#222] italic">
                            Chưa có lịch sử xuất/nhập nào.
                        </div>
                    ) : (
                        logs.map((L, i) => (
                            <div key={i} className="bg-[#0a0a0a] p-3 rounded-xl border border-[#222] flex justify-between items-center hover:border-[#333] transition-colors group shadow-sm">
                                <div className="flex-1 min-w-0 pr-3">
                                    <div className="flex items-center gap-2 mb-1.5">
                                        <span className={`text-[8px] font-black px-1.5 py-0.5 rounded border uppercase tracking-wider ${L.type==='Nhập' ? 'bg-[#10b981]/10 text-[#10b981] border-[#10b981]/25' : 'bg-[#e11d48]/10 text-[#fb7185] border-[#e11d48]/25'}`}>{L.type}</span>
                                        <span className="text-[9px] text-gray-500 font-bold font-mono">{String(L.date).slice(0, 16)}</span>
                                    </div>
                                    <div className="text-[11px] font-bold text-gray-300 leading-tight group-hover:text-white transition-colors line-clamp-2">{L.note || L.target}</div>
                                </div>
                                <div className="flex flex-col items-end shrink-0">
                                    <div className={`text-[15px] font-black ${L.type==='Nhập' ? 'text-[#10b981]' : 'text-[#fb7185]'}`}>
                                        {L.type==='Nhập' ? '+' : '-'}{L.changedQty} <span className="text-[9px] font-bold uppercase opacity-70">{product.unit || 'Cái'}</span>
                                    </div>
                                    <div className="text-[9px] text-gray-500 font-bold mt-1 bg-[#1a1a1a] px-2 py-0.5 rounded border border-[#333]">
                                        Tồn: <span className="text-[#f5f5f5]">{L.balanceAfter}</span>
                                    </div>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            </div>
        </div>
    );
}

// -------------------------------------------------------------------------
// MODAL IN PHIẾU XUẤT / NHẬP KHO (ImportExportPrintModal)
// -------------------------------------------------------------------------
function ImportExportPrintModal({ ticket, onClose, triggerToast }) {
    if (!ticket) return null;

    const canvasRef = React.useRef(null);
    const [receiptImageUrl, setReceiptImageUrl] = React.useState('');
    const [isGeneratingImg, setIsGeneratingImg] = React.useState(true);

    const ticketType = ticket.type || 'Nhập';
    const isImport = ticketType === 'Nhập';
    const ticketTitle = ticketType === 'Nhập' ? 'PHIẾU NHẬP KHO' : (ticketType === 'Xuất' ? 'PHIẾU XUẤT KHO' : `PHIẾU ${ticketType.toUpperCase()} KHO`);
    const ticketId = ticket.id || 'IE_' + Date.now();

    const generateReceiptCanvas = React.useCallback(() => {
        try {
            setIsGeneratingImg(true);
            const canvas = canvasRef.current || document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            const width = 380;
            const itemsList = Array.isArray(ticket.items) ? ticket.items : (typeof ticket.itemsData === 'string' ? safeJSONParse(ticket.itemsData) : []);

            let estimatedHeight = 360;
            ctx.font = '12px Arial, sans-serif';
            itemsList.forEach(item => {
                const words = (item.name || item.sku || 'Sản phẩm').split(' ');
                let line = '';
                let lineCount = 1;
                for (let w = 0; w < words.length; w++) {
                    if (ctx.measureText(line + words[w] + ' ').width > 200) {
                        lineCount++;
                        line = words[w] + ' ';
                    } else {
                        line += words[w] + ' ';
                    }
                }
                estimatedHeight += (lineCount * 18) + 16;
            });

            if (ticket.note) {
                estimatedHeight += Math.ceil(String(ticket.note).length / 32) * 18 + 10;
            }

            canvas.width = width;
            canvas.height = Math.max(480, Math.min(1600, estimatedHeight));

            // Nền trắng
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let y = 35;
            ctx.fillStyle = '#000000';

            // Tiêu đề PHIẾU NHẬP / XUẤT KHO
            ctx.textAlign = 'center';
            ctx.font = 'bold 20px "Courier New", monospace, Arial';
            ctx.fillText(ticketTitle, width / 2, y);
            y += 30;

            // Thông tin phiếu
            ctx.textAlign = 'left';
            ctx.font = '12px Arial, sans-serif';

            const drawInfoLine = (label, val) => {
                if (!val && val !== 0 && val !== '0') return;
                ctx.font = 'bold 12px Arial, sans-serif';
                ctx.fillText(label, 15, y);
                const labelWidth = ctx.measureText(label).width;
                ctx.font = '12px Arial, sans-serif';

                const maxValW = width - 30 - labelWidth;
                const valStr = String(val);
                if (ctx.measureText(valStr).width > maxValW) {
                    const words = valStr.split(' ');
                    let line = '';
                    let isFirst = true;
                    for (let w = 0; w < words.length; w++) {
                        if (ctx.measureText(line + words[w] + ' ').width > maxValW) {
                            ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                            y += 18;
                            line = words[w] + ' ';
                            isFirst = false;
                        } else {
                            line += words[w] + ' ';
                        }
                    }
                    if (line.trim()) {
                        ctx.fillText(line.trim(), isFirst ? 15 + labelWidth : 15, y);
                        y += 18;
                    }
                } else {
                    ctx.fillText(valStr, 15 + labelWidth, y);
                    y += 18;
                }
            };

            drawInfoLine('Số Phiếu: ', ticketId);
            drawInfoLine('Loại phiếu: ', ticketType);
            drawInfoLine(isImport ? 'Đối tác / NCC: ' : 'Người nhận / Khách: ', ticket.target || 'Nội bộ/Khác');
            if (ticket.creator) drawInfoLine('Người lập: ', ticket.creator);
            drawInfoLine('Thời gian ghi sổ: ', ticket.date || new Date().toLocaleString('vi-VN'));
            if (ticket.note) drawInfoLine('Ghi chú: ', ticket.note);

            // Đường kẻ phân cách
            y += 5;
            ctx.font = '12px monospace';
            ctx.fillText('----------------------------------------------------', 10, y);
            y += 18;

            // Tiêu đề bảng hàng hóa
            ctx.font = 'bold 12px Arial, sans-serif';
            ctx.fillText('Tên hàng hóa', 15, y);
            ctx.textAlign = 'right';
            ctx.fillText('Đ. giá', 300, y);
            ctx.fillText('SL', 365, y);
            y += 14;

            ctx.textAlign = 'left';
            ctx.font = '12px monospace';
            ctx.fillText('----------------------------------------------------', 10, y);
            y += 18;

            // In từng dòng sản phẩm
            itemsList.forEach(item => {
                ctx.font = 'bold 12px Arial, sans-serif';
                const words = (item.name || item.sku || 'Sản phẩm').split(' ');
                let line = '';
                for (let w = 0; w < words.length; w++) {
                    if (ctx.measureText(line + words[w] + ' ').width > 220) {
                        ctx.fillText(line.trim(), 15, y);
                        y += 18;
                        line = words[w] + ' ';
                    } else {
                        line += words[w] + ' ';
                    }
                }
                if (line.trim()) {
                    ctx.fillText(line.trim(), 15, y);
                }

                // Giá & SL
                ctx.font = '12px Arial, sans-serif';
                ctx.textAlign = 'right';
                const priceNum = Number(item.price || 0);
                const priceText = priceNum > 0 ? priceNum.toLocaleString('vi-VN') : '---';
                ctx.fillText(priceText, 300, y);
                ctx.fillText(`${item.qty} ${item.unit || ''}`.trim(), 365, y);

                ctx.textAlign = 'left';
                y += 22;
            });

            // Đường kẻ phân cách
            ctx.font = '12px monospace';
            ctx.fillText('----------------------------------------------------', 10, y);
            y += 22;

            // Khung tổng tiền
            const drawTotalRow = (label, valStr, isBold = false) => {
                ctx.font = isBold ? 'bold 13px Arial, sans-serif' : '12px Arial, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(label, 15, y);
                ctx.textAlign = 'right';
                ctx.fillText(valStr, 365, y);
                y += 22;
            };

            const baseAmount = itemsList.reduce((sum, i) => sum + (Number(i.price || 0) * Number(i.qty || 1)), 0);
            const otherFees = Number(ticket.otherFees || 0);
            const totalAmount = Number(ticket.totalAmount || (baseAmount + otherFees));
            const paidAmount = Number(ticket.paidAmount || 0);
            const debtAmount = Number(ticket.debtAmount || (isImport && paidAmount > 0 ? Math.max(0, totalAmount - paidAmount) : 0));

            drawTotalRow('Tổng tiền hàng:', baseAmount.toLocaleString('vi-VN') + ' đ', true);
            if (otherFees > 0) {
                drawTotalRow('Cước VC / Phụ phí:', otherFees.toLocaleString('vi-VN') + ' đ');
            }
            drawTotalRow('Tổng thanh toán:', totalAmount.toLocaleString('vi-VN') + ' đ', true);
            if (paidAmount > 0) {
                drawTotalRow('Đã thanh toán:', paidAmount.toLocaleString('vi-VN') + ' đ');
            }
            if (debtAmount > 0) {
                drawTotalRow('Còn nợ NCC:', debtAmount.toLocaleString('vi-VN') + ' đ');
            }

            // Đường kẻ kéo cắt ở cuối
            y += 5;
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('✂--------------------------------------------------', 10, y);

            const dataUrl = canvas.toDataURL('image/png');
            setReceiptImageUrl(dataUrl);
        } catch (err) {
            console.error("Lỗi tạo ảnh phiếu kho:", err);
        } finally {
            setIsGeneratingImg(false);
        }
    }, [ticket, ticketId, ticketTitle, ticketType, isImport]);

    React.useEffect(() => {
        generateReceiptCanvas();
    }, [generateReceiptCanvas]);

    const handleDownloadImage = () => {
        if (!receiptImageUrl) return;
        const a = document.createElement('a');
        a.href = receiptImageUrl;
        a.download = `PhieuKho_${ticketId}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        if (typeof triggerToast === 'function') triggerToast('Đã tải ảnh phiếu kho về máy thành công!', 'fa-download', 'success');
    };

    const handleCopyImage = () => {
        if (!receiptImageUrl) return;
        fetch(receiptImageUrl)
            .then(res => res.blob())
            .then(blob => {
                if (navigator.clipboard && window.ClipboardItem) {
                    return navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                } else {
                    throw new Error('Chuyển sang tải ảnh');
                }
            })
            .then(() => {
                if (typeof triggerToast === 'function') triggerToast('Đã sao chép ảnh phiếu! Nhấn Ctrl+V để dán gửi Zalo/FB.', 'fa-copy', 'success');
            })
            .catch(() => {
                handleDownloadImage();
            });
    };

    const handleCopySummary = () => {
        const itemsList = Array.isArray(ticket.items) ? ticket.items : (typeof ticket.itemsData === 'string' ? safeJSONParse(ticket.itemsData) : []);
        let text = `📄 ${ticketTitle} - RICH FISH AQUARIUM\n`;
        text += `------------------------------------\n`;
        text += `Số Phiếu: ${ticketId}\n`;
        text += `Thời gian: ${ticket.date || new Date().toLocaleString('vi-VN')}\n`;
        text += `${isImport ? 'Nhà cung cấp' : 'Người nhận'}: ${ticket.target || 'Nội bộ'}\n`;
        if (ticket.creator) text += `Người lập: ${ticket.creator}\n`;
        text += `------------------------------------\n`;
        text += `DANH SÁCH MẶT HÀNG:\n`;
        itemsList.forEach((it, idx) => {
            text += `${idx + 1}. ${it.name} (x${it.qty} ${it.unit || 'Cái'}) - ĐG: ${Number(it.price || 0).toLocaleString('vi-VN')}đ\n`;
        });
        text += `------------------------------------\n`;
        text += `TỔNG TIỀN: ${Number(ticket.totalAmount || 0).toLocaleString('vi-VN')} VNĐ\n`;
        if (ticket.note) text += `Ghi chú: ${ticket.note}\n`;

        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                if (typeof triggerToast === 'function') triggerToast('Đã sao chép nội dung tóm tắt phiếu!', 'fa-file-alt', 'success');
            });
        }
    };

    return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[9999] p-2 sm:p-4 animate-fade-in" onClick={onClose}>
            <div className="bg-[#141417] border border-zinc-700/80 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[92vh] animate-scale-up" onClick={e => e.stopPropagation()}>
                
                {/* Header với các nút thao tác nhanh */}
                <div className="p-3.5 bg-[#1c1c22] border-b border-zinc-800 flex items-center justify-between gap-2 shrink-0">
                    <div className="flex items-center gap-2 min-w-0">
                        <div className="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
                            <i className="fas fa-file-invoice"></i>
                        </div>
                        <div className="truncate">
                            <h3 className="text-xs font-black text-white uppercase tracking-wider truncate">{ticketTitle}</h3>
                            <span className="text-[10px] font-mono text-zinc-400 font-bold">{ticketId}</span>
                        </div>
                    </div>

                    <div className="flex items-center gap-1.5 shrink-0">
                        <button onClick={handleCopyImage} className="px-2.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-[10px] font-black uppercase flex items-center gap-1 shadow-sm transition-all active:scale-95 cursor-pointer">
                            <i className="fas fa-copy"></i>
                            <span className="hidden sm:inline">Sao Chép Ảnh</span>
                        </button>
                        <button onClick={handleDownloadImage} className="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[10px] font-black uppercase flex items-center gap-1 shadow-sm transition-all active:scale-95 cursor-pointer">
                            <i className="fas fa-download"></i>
                            <span className="hidden sm:inline">Tải Ảnh PNG</span>
                        </button>
                        <button onClick={onClose} className="w-7 h-7 rounded-lg bg-zinc-800 hover:bg-rose-600 text-zinc-400 hover:text-white flex items-center justify-center transition-colors text-xs cursor-pointer">&times;</button>
                    </div>
                </div>

                {/* Body Preview Hoá Đơn Nhiệt */}
                <div className="flex-1 overflow-y-auto p-4 flex flex-col items-center bg-[#09090b] custom-scrollbar">
                    <div className="text-[11px] font-black text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full mb-3 flex items-center gap-1.5 shadow-sm">
                        <i className="fas fa-check-circle text-xs"></i>
                        Ảnh Phiếu Kho Đã Sẵn Sàng Để Lưu / Gửi Đối Tác
                    </div>

                    <div className="bg-white rounded-2xl shadow-2xl p-2 max-w-[380px] w-full flex justify-center border-4 border-zinc-300">
                        {receiptImageUrl ? (
                            <img src={receiptImageUrl} alt="Phiếu Kho" className="w-full h-auto object-contain rounded-xl" />
                        ) : (
                            <div className="py-20 text-center text-zinc-500 flex flex-col items-center gap-2">
                                <i className="fas fa-spinner fa-spin text-2xl text-emerald-500"></i>
                                <span className="text-xs font-bold">Đang khởi tạo ảnh phiếu kho...</span>
                            </div>
                        )}
                    </div>

                    <p className="text-[10px] text-zinc-400 text-center mt-3 italic">
                        💡 Bạn có thể bấm <b className="text-zinc-200">Sao Chép Ảnh</b> (rồi ấn Ctrl+V gửi Zalo) hoặc <b className="text-zinc-200">Tải Ảnh PNG</b>.
                    </p>
                </div>

                {/* Footer */}
                <div className="p-3 bg-[#18181c] border-t border-zinc-800 flex items-center justify-between gap-2 shrink-0">
                    <button onClick={handleCopySummary} className="text-[10.5px] font-black text-amber-400 hover:text-amber-300 flex items-center gap-1.5 transition-colors cursor-pointer">
                        <i className="fas fa-file-alt"></i> Sao Chép Văn Bản Tóm Tắt
                    </button>
                    <button onClick={onClose} className="px-4 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-xs font-bold transition-colors cursor-pointer">
                        Đóng
                    </button>
                </div>
            </div>
        </div>
    );
}

// -------------------------------------------------------------------------
// 2. TAB LỊCH SỬ XUẤT NHẬP TỔNG HỢP & NÚT KIỂM KHO (ImportExportTab)
// -------------------------------------------------------------------------
const ImportExportTab = React.memo(function ImportExportTab({ data, pushData, isAdmin, mode, userConfigs, triggerToast }) {
    // 1. Modals & Forms State
    const [showForm, setShowForm] = React.useState(false);
    const [printTicketData, setPrintTicketData] = React.useState(null);
    const [prefilledProduct, setPrefilledProduct] = React.useState(null);
    const [editingLog, setEditingLog] = React.useState(null);
    const [editingItems, setEditingItems] = React.useState([]);

    React.useEffect(() => {
        const handleTrigger = (e) => {
            const product = e ? e.detail : {};
            setPrefilledProduct(product || null);
            setShowForm(true);
        };
        if (window.pendingAction === 'createImportTicket') {
            window.pendingAction = null;
            handleTrigger(null);
        }
        window.addEventListener('triggerCreateImportTicket', handleTrigger);
        return () => window.removeEventListener('triggerCreateImportTicket', handleTrigger);
    }, []);

    // 2. New UI State
    const [filterType, setFilterType] = React.useState('TẤT CẢ');
    const [filterMonth, setFilterMonth] = React.useState(new Date().toISOString().slice(0, 7));
    const [searchTerm, setSearchTerm] = React.useState('');
    const [expandedIds, setExpandedIds] = React.useState({});

    const currentRole = localStorage.getItem('rf_role') || '';
    const currentUser = localStorage.getItem('rf_user');
    const isBossRole = localStorage.getItem('rf_boss') === 'true';
    const isBoss = isBossRole || currentRole === 'TỐI CAO' || Boolean(isAdmin);
    const isKiemToan = isBoss || currentRole === 'KẾ TOÁN' || currentRole === 'KIỂM TOÁN' || currentUser === 'Nguyễn Thị Diệu Hương';
    const canDelete = isAdmin || isBoss || currentRole === 'TỐI CAO';

    const toggleExpand = (id) => {
        setExpandedIds(prev => ({ ...prev, [id]: !prev[id] }));
    };

    // 3. Filter Logs
    const logs = data?.ImportExport || [];
    const filteredLogs = React.useMemo(() => {
        let list = logs.filter(log => {
            // Loại bỏ hoàn toàn bản ghi thông báo hệ thống nếu có trong bảng ImportExport cũ
            if (log.type === 'THONG_BAO_HE_THONG' || (log.id && String(log.id).startsWith('SYS_ANNO_'))) return false;

            if (mode === 'KIEM_KHO') {
                if (!(log.id && String(log.id).includes('IE_GCHK'))) return false;
            } else if (mode === 'NHAT_KY') {
                if (log.id && String(log.id).includes('IE_GCHK')) return false;
            }

            const type = String(log.type || '').trim();
            const target = String(log.target || '').trim().toLowerCase();
            const note = String(log.note || '').trim().toLowerCase();
            const id = String(log.id || '').toLowerCase();
            const items = String(log.itemsData || '').toLowerCase();
            const user = String(log.user || '').toLowerCase();

            if (filterType !== 'TẤT CẢ') {
                let logCategories = [];
                const parsedItems = safeJSONParse(log.itemsData) || [];
                parsedItems.forEach(it => {
                    const p = (data?.Products || []).find(x => x.name === it.name);
                    if (p) logCategories.push(String(p.category || '').toUpperCase().trim());
                });

                if (filterType === 'KHO HÀNG HOÁ') {
                    if (!logCategories.some(c => c === 'PHỤ KIỆN' || c === 'HÀNG HOÁ' || c === 'PHỤ KIỆN BÁN LẺ')) return false;
                } else if (filterType === 'KHO THÀNH PHẨM') {
                    if (!logCategories.some(c => c === 'LAYOUT' || c === 'BỂ KÍNH' || c === 'THÀNH PHẨM')) return false;
                } else if (filterType === 'KHO NGUYÊN LIỆU') {
                    if (!logCategories.some(c => c === 'VẬT TƯ SẢN XUẤT' || c === 'DANH MỤC SẢN XUẤT' || c === 'NGUYÊN LIỆU')) return false;
                }
            }

            if (filterMonth) {
                const logDate = log.date || log.createdAt || '';
                if (!String(logDate).startsWith(filterMonth)) return false;
            }

            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                const matchId = id.includes(term);
                const matchTarget = target.includes(term);
                const matchNote = note.includes(term);
                const matchItems = items.includes(term);
                const matchUser = user.includes(term);
                if (!matchId && !matchTarget && !matchNote && !matchItems && !matchUser) return false;
            }
            return true;
        });
        
        return list.sort((a,b) => new Date(b.date || b.createdAt || 0) - new Date(a.date || a.createdAt || 0));
    }, [logs, filterType, filterMonth, searchTerm, mode, data?.Suppliers]);

    const totalValue = React.useMemo(() => {
        return filteredLogs.reduce((sum, l) => sum + (Number(l.totalAmount) || 0), 0);
    }, [filteredLogs]);

    const handleDelete = async (log) => {
        if (!canDelete) {
            if (triggerToast) triggerToast('Bạn không có quyền xóa chứng từ này!', 'fa-lock', 'danger');
            else alert('Bạn không có quyền xóa chứng từ này!');
            return;
        }
        if (!window.confirm(`Bạn có chắc muốn XOÁ VĨNH VIỄN phiếu ${log.id} này không?`)) return;
        
        const payload = { deletes: { ImportExport: [log.id] }, Products: [] };
        
        let parsed = safeJSONParse(log.itemsData) || [];
        parsed.forEach(item => {
            const p = (data?.Products||[]).find(x => x.name === item.name);
            if (p) {
                const diffVal = log.type === 'Nhập' ? -item.qty : item.qty; 
                payload.Products.push({...p, quantity: Number(p.quantity) + diffVal, _diff: diffVal});
            }
        });
        
        const hasPayment = Number(log.totalAmount || 0) > 0;
        if (hasPayment) {
            const relatedTx = (data?.Transactions || []).find(tx => String(tx.note).includes(log.id) || (String(tx.title).includes('Thanh toán') && String(tx.title).includes(log.target) && String(tx.date).slice(0,10) === String(log.date).slice(0,10)));
            if (relatedTx) {
                if (window.confirm(`Phiếu này có khoản thanh toán liên đới trên sổ quỹ (${relatedTx.id}). Bạn có muốn XOÁ LUÔN phiếu Thu/Chi này không?`)) {
                    payload.deletes.Transactions = [relatedTx.id];
                }
            } else {
                if (window.confirm('Hệ thống phát hiện phiếu này có giá trị tiền. Bạn có muốn tự tìm và xoá phiếu Thu/Chi liên quan (nếu có) không? \n(Chọn OK để đồng ý tự tìm thủ công)')) {}
            }
        }
        
        try {
            await pushData(payload);
            if (triggerToast) triggerToast('Đã xóa chứng từ!', 'fa-check', 'success');
        } catch (e) {
            alert('Lỗi khi xoá: ' + e.message);
        }
    };

    const handleConfirmReceived = async (log) => {
        if (!window.confirm(`Xác nhận ĐÃ NHẬN HÀNG cho phiếu đặt: ${log.id}?\nHệ thống sẽ tự động cộng số lượng các mặt hàng trong phiếu vào tồn kho hiện tại.`)) return;
        
        const payload = { ImportExport: [], Products: [] };
        
        // Update type from Đặt Hàng to Nhập
        payload.ImportExport.push({...log, type: 'Nhập'});
        
        let parsed = safeJSONParse(log.itemsData) || [];
        parsed.forEach(item => {
            const p = (data?.Products||[]).find(x => x.name === item.name);
            if (p) {
                payload.Products.push({...p, quantity: Number(p.quantity) + item.qty, _diff: item.qty});
            }
        });
        
        try {
            await pushData(payload);
            if (triggerToast) triggerToast('Đã xác nhận nhận hàng!', 'fa-check', 'success');
        } catch (e) {
            alert('Lỗi: ' + e.message);
        }
    };

    const handlePrintK58 = (log) => {

        let parsedItems = safeJSONParse(log.itemsData) || [];
        parsedItems.forEach(it => {

                <div style="width:15%; text-align:right;">${it.qty}</div>
                <div style="width:25%; text-align:right;">${Number(it.price || 0).toLocaleString('vi-VN')}</div>

        const printContent = `
            <html>

                    <div style="width:25%; text-align:right;">Đ.Giá</div>

                    <div class="text-center" style="width: 50%;">Người Giao/Nhận<br><br><br>Ký tên</div>
                </div>
                <div style="margin-top: 40px; text-align: center; font-size: 10px; border-top: 1px solid #000; padding-top: 5px;">
                    Cảm ơn quý khách!
                </div>
            </body>
            </html>
        `;
        const win = window.open('', '_blank');
        win.document.write(printContent);
        win.document.close();
        win.focus();
        setTimeout(() => { win.print(); win.close(); }, 800);
    };

    return (

                                <i className="fas fa-trash-restore text-[10px]"></i> Thanh Lý
                            </button>

                </div>

            {/* Thống kê tổng quan */}
            {mode !== 'KIEM_KHO' && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 w-full max-w-full">

            {/* Bộ lọc nghiệp vụ & Thanh tìm kiếm */}
            <div className="bg-[#141414] border border-[#2a2a2a] p-3.5 sm:p-4 rounded-2xl space-y-3 shadow-sm w-full max-w-full overflow-x-hidden">

                <div className="flex gap-2 overflow-x-auto custom-scrollbar pb-1 overscroll-x-contain touch-pan-x max-w-full">
                    <button onClick={() => setFilterType('TẤT CẢ')} className={`px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all whitespace-nowrap border ${filterType === 'TẤT CẢ' ? 'bg-zinc-950 text-white border-zinc-700 shadow-sm' : 'bg-transparent text-gray-500 border-[#333] hover:text-gray-300'}`}>TẤT CẢ</button>
                    <button onClick={() => setFilterType('KHO HÀNG HOÁ')} className={`px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all whitespace-nowrap border ${filterType === 'KHO HÀNG HOÁ' ? 'bg-blue-600 text-white border-blue-500 shadow-[0_0_10px_rgba(37,99,235,0.3)]' : 'bg-transparent text-gray-500 border-[#333] hover:text-gray-300'}`}>KHO HÀNG HOÁ (PHỤ KIỆN)</button>
                    <button onClick={() => setFilterType('KHO THÀNH PHẨM')} className={`px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all whitespace-nowrap border ${filterType === 'KHO THÀNH PHẨM' ? 'bg-emerald-600 text-white border-emerald-500 shadow-[0_0_10px_rgba(5,150,105,0.3)]' : 'bg-transparent text-gray-500 border-[#333] hover:text-gray-300'}`}>KHO THÀNH PHẨM (LAYOUT/BỂ)</button>
                    <button onClick={() => setFilterType('KHO NGUYÊN LIỆU')} className={`px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all whitespace-nowrap border ${filterType === 'KHO NGUYÊN LIỆU' ? 'bg-amber-600 text-white border-amber-500 shadow-[0_0_10px_rgba(217,119,6,0.3)]' : 'bg-transparent text-gray-500 border-[#333] hover:text-gray-300'}`}>KHO NGUYÊN LIỆU (VẬT TƯ)</button>
                </div>

                <div className="flex gap-2">
                    <div className="relative flex-1">
                        <i className="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input 
                            type="text" 
                            value={searchTerm} 
                            onChange={(e) => setSearchTerm(e.target.value)} 
                            placeholder="Tìm kiếm theo mã phiếu, đối tượng, ghi chú, nhân sự hoặc tên sản phẩm..." 
                            className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl pl-11 pr-4 py-3.5 text-xs font-bold text-white outline-none focus:border-[#0dcaf0] transition-colors shadow-inner"

            {/* Danh sách chứng từ dạng Accordion Cards */}
            <div className="space-y-3">
                {filteredLogs.length === 0 ? (
                    <div className="text-center py-16 bg-[#141414] border border-[#2a2a2a] rounded-2xl text-gray-500 font-bold">

                ) : (

                        return (

                                            <i className={`fas ${isImport ? 'fa-arrow-down' : 'fa-arrow-up'}`}></i>

                                        <div className="min-w-0">

                                                <span className={`px-2 py-0.5 rounded-md text-[9px] font-black uppercase tracking-wide ${isImport ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>

                                            </div>
                                            <div className="text-[10px] text-gray-500 font-bold mt-0.5">
                                                <i className="fas fa-user-edit mr-1"></i> {log.user || 'Hệ thống'}

                                            <i className="fas fa-chevron-down text-[10px]"></i>
                                        </div>
                                    </div>
                                </div>

                                {/* Expanded Mini-Table */}
                                {isExpanded && (
                                    <div className="border-t border-[#222] bg-[#0a0a0a] p-4 animate-fade-in">
                                        {/* Mobile view only total amount */}
                                        <div className="sm:hidden flex justify-between items-center mb-3 p-2 bg-[#141414] rounded-lg border border-[#2a2a2a]">
                                            <span className="text-[10px] font-black text-gray-400 uppercase">TỔNG TIỀN PHIẾU:</span>
                                            <span className={`font-black text-sm ${isImport ? 'text-emerald-400' : 'text-rose-400'}`}>{Number(log.totalAmount || 0).toLocaleString('vi-VN')}đ</span>
                                        </div>

                                        {log.note && (
                                            <div className="text-[11px] text-sky-300 mb-3 bg-sky-500/10 p-3 rounded-xl border border-sky-500/20 shadow-inner">
                                                <span className="font-black text-sky-400 uppercase tracking-wider text-[10px] block mb-0.5"><i className="fas fa-tag mr-1"></i> Ghi chú:</span> 
                                                {log.note}
                                            </div>
                                        )}
                                        <div className="text-[10px] font-black text-gray-500 uppercase tracking-wider mb-2 mt-2">Chi tiết sản phẩm ({items.length}):</div>
                                        {items.length === 0 ? (
                                            <div className="text-xs text-gray-500 italic py-2">Không có thông tin chi tiết mặt hàng.</div>
                                        ) : (
                                            <div className="overflow-x-auto rounded-xl border border-[#222] overscroll-x-contain touch-pan-x max-w-full">
                                                <table className="w-full text-left text-xs min-w-[320px]">
                                                    <thead>
                                                        <tr className="bg-[#141414] text-gray-500 border-b border-[#222]">
                                                            <th className="py-2.5 px-3 font-black uppercase text-[9px] tracking-wider">Tên Sản Phẩm</th>
                                                            <th className="py-2.5 px-3 font-black uppercase text-[9px] tracking-wider text-center">Số Lượng</th>
                                                            <th className="py-2.5 px-3 font-black uppercase text-[9px] tracking-wider text-right">Đơn Giá</th>
                                                            <th className="py-2.5 px-3 font-black uppercase text-[9px] tracking-wider text-right">Thành Tiền</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-[#222]">
                                                        {items.map((it, idx) => {
                                                            const qty = Number(it.qty) || 1;
                                                            const price = Number(it.price) || 0;
                                                            return (
                                                                <tr key={idx} className="hover:bg-[#1a1a1a]/40 transition-colors">
                                                                    <td className="py-2.5 px-3 font-bold text-gray-200">{it.name || it.sku || 'N/A'}</td>
                                                                    <td className="py-2.5 px-3 text-center font-black text-sky-400">
                                                                        <span className="bg-sky-500/10 px-2 py-0.5 rounded-md border border-sky-500/20">{qty} {it.unit || 'Cái'}</span>
                                                                    </td>
                                                                    <td className="py-2.5 px-3 text-right text-gray-400 font-mono">{price.toLocaleString('vi-VN')}đ</td>
                                                                    <td className="py-2.5 px-3 text-right font-black text-emerald-400 font-mono">{(qty * price).toLocaleString('vi-VN')}đ</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        );
                    })
                )}
            </div>

            {/* KEEP EXISTING MODALS */}
            {showForm && (
                <IEFormModal 
                    data={data} 
                    userConfigs={userConfigs} 
                    onClose={() => { setShowForm(false); setPrefilledProduct(null); }} 
                    pushData={pushData} 
                    prefilledProduct={prefilledProduct} 
                    onSaveSuccess={(ticketData) => setPrintTicketData(ticketData)}
                    triggerToast={triggerToast}
                />
            )}

            {printTicketData && (
                <ImportExportPrintModal 
                    ticket={printTicketData} 
                    onClose={() => setPrintTicketData(null)} 
                    triggerToast={triggerToast} 
                />
            )}
            
            {editingLog && (
                <div className="fixed inset-0 bg-[#0a0a0a]/90 z-[300] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={() => setEditingLog(null)}>
                    <div className="bg-[#141414] w-full max-w-lg rounded-[24px] p-5 border border-[#333] shadow-2xl flex flex-col relative overflow-hidden animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
                        <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-3">
                            <h3 className="font-black text-blue-400 text-[15px] uppercase tracking-wider"><i className="fas fa-edit mr-2"></i> Sửa Phiếu {editingLog.id}</h3>
                            <button onClick={() => setEditingLog(null)} className="w-8 h-8 bg-[#1a1a1a] rounded-full text-gray-400 hover:text-rose-500 border border-[#333] transition-colors"><i className="fas fa-times"></i></button>
                        </div>
                        
                        <div className="space-y-3 max-h-[50vh] overflow-y-auto custom-scrollbar pr-1">
                            {editingItems.map((it, idx) => (
                                <div key={idx} className="flex justify-between items-center bg-[#0a0a0a] p-3 rounded-xl border border-[#222]">
                                    <div className="flex-1">
                                        <div className="text-[12px] font-black text-gray-200">{it.name}</div>
                                        <div className="text-[10px] text-gray-500 font-bold">{Number(it.price || 0).toLocaleString()}đ / {it.unit || 'Cái'}</div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <label className="text-[10px] font-bold text-gray-500">SỐ LƯỢNG:</label>
                                        <input 
                                            type="number" 
                                            value={it.qty} 
                                            onChange={e => {
                                                const newItems = [...editingItems];
                                                newItems[idx].qty = Number(e.target.value);
                                                setEditingItems(newItems);
                                            }}
                                            className="w-20 bg-[#1a1a1a] border border-[#333] rounded-lg px-2 py-1.5 text-[13px] font-black text-center text-blue-400 outline-none focus:border-blue-500"
                                        />
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <div className="pt-4 mt-2 border-t border-[#222]">
                            <button onClick={async () => {
                                const payload = { ImportExport: [], Products: [], deletes: {} };
                                
                                let newTotal = 0;
                                let oldParsed = safeJSONParse(editingLog.itemsData) || [];
                                
                                editingItems.forEach(newItem => {
                                    newTotal += newItem.qty * (newItem.price || 0);
                                    const oldItem = oldParsed.find(x => x.name === newItem.name) || {qty: 0};
                                    const diffQty = newItem.qty - oldItem.qty;
                                    
                                    if (diffQty !== 0) {
                                        const p = (data?.Products||[]).find(x => x.name === newItem.name);
                                        if (p) {
                                            const sign = editingLog.type === 'Nhập' ? 1 : -1;
                                            const stockChange = diffQty * sign;
                                            payload.Products.push({...p, quantity: Number(p.quantity) + stockChange, _diff: stockChange});
                                        }
                                    }
                                });
                                
                                const updatedLog = { ...editingLog, itemsData: JSON.stringify(editingItems), totalAmount: newTotal };
                                payload.ImportExport.push(updatedLog);
                                
                                const relatedTx = (data?.Transactions || []).find(tx => String(tx.note).includes(editingLog.id) || (String(tx.title).includes('Thanh toán') && String(tx.title).includes(editingLog.target) && String(tx.date).slice(0,10) === String(editingLog.date).slice(0,10)));
                                
                                if (relatedTx && newTotal !== Number(editingLog.totalAmount)) {
                                    if (window.confirm('Phiếu này có khoản thanh toán liên đới trên sổ quỹ. Tổng tiền đã thay đổi, bạn có muốn XOÁ LUÔN phiếu Thu/Chi đó để sau đó tự tạo lại cho chính xác không?')) {
                                        payload.deletes.Transactions = [relatedTx.id];
                                    }
                                }
                                
                                try {
                                    await pushData(payload);
                                    setEditingLog(null);
                                    if (triggerToast) triggerToast('Đã lưu thành công!', 'fa-check', 'success');
                                } catch (e) {
                                    alert('Lỗi: ' + e.message);
                                }
                            }} className="w-full py-3.5 bg-blue-500 hover:bg-blue-600 text-[#0a0a0a] font-black rounded-xl text-[12px] tracking-widest uppercase transition-all shadow-md active:scale-95">
                                <i className="fas fa-save mr-2"></i> LƯU THAY ĐỔI
                            </button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
});

function IEFormModal({ data, onClose, pushData, prefilledProduct, userConfigs, onSaveSuccess, triggerToast }) {
   const [type, setType] = React.useState(window.pendingType === 'Thanh Lý' ? 'Xuất' : (window.pendingType || 'Nhập')); 
   const [importSubTab, setImportSubTab] = React.useState('NguyenLieu');
   const [exportSubTab, setExportSubTab] = React.useState(window.pendingType === 'Thanh Lý' ? 'ThanhLy' : 'SanXuat');
   const [thanhLyAmount, setThanhLyAmount] = React.useState('');
   const [isSaving, setIsSaving] = React.useState(false);
   
   const [linkedReqId, setLinkedReqId] = React.useState('');

   React.useEffect(() => {
       if (prefilledProduct && Object.keys(prefilledProduct).length > 0) {
           setType('Nhập');
           if (prefilledProduct.data && prefilledProduct.data.linkedRequestId) {
               setLinkedReqId(prefilledProduct.data.linkedRequestId);
               setNote(`Nhập hàng theo báo cáo nhập hàng: ${prefilledProduct.data.linkedMaterialName}`);
           } else {
               const p = (data?.Products||[]).find(x => x.id === prefilledProduct.id) || prefilledProduct;
               if (p && p.name) {
                   setItems([{
                       id: p.id,
                       name: p.name,
                       qty: 1,
                       price: parseFloat(p.costPrice) || 0,
                       unit: p.unit || 'Cái'
                   }]);
                   setSelProd(p.id);
                   setSearchProd(p.name || '');
                   setSelQty('1');
                   setSelPrice(p.costPrice || '');
               }
           }
       }
   }, [prefilledProduct, data?.Products]);
   
   const currentRole = localStorage.getItem('rf_role');
   const currentUser = localStorage.getItem('rf_user');
   const isKiemToan = currentRole === 'TỐI CAO' || currentRole === 'KẾ TOÁN' || currentRole === 'KIỂM TOÁN' || currentUser === 'Nguyễn Thị Diệu Hương';
   
   const getVNTime = () => {
       const d = new Date();
       return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
   };

   const [supplierId, setSupplierId] = React.useState('');
   const [receiverName, setReceiverName] = React.useState(''); 
   const [accId, setAccId] = React.useState(''); 
   const [paidAmount, setPaidAmount] = React.useState('');
   const [note, setNote] = React.useState('');
   const [dateStr, setDateStr] = React.useState(getVNTime()); 
   
   const [showAddSup, setShowAddSup] = React.useState(false);
   const [newSup, setNewSup] = React.useState({ name: '', phone: '', category: 'HÀNG HOÁ' });

   const [items, setItems] = React.useState([]);
   const [searchProd, setSearchProd] = React.useState('');
   const [showDropdown, setShowDropdown] = React.useState(false); 
   const [selProd, setSelProd] = React.useState('');
   const [selQty, setSelQty] = React.useState('');
   const [selPrice, setSelPrice] = React.useState('');

   const [isUsingImportUnit, setIsUsingImportUnit] = React.useState(false);

   const [checkCat, setCheckCat] = React.useState('');
   const [checkSubCat, setCheckSubCat] = React.useState('');

   const [checkItems, setCheckItems] = React.useState(() => {
       try {
           const draft = localStorage.getItem('rf_kiemkho_draft');
           return draft ? safeJSONParse(draft) : {};
       } catch(e) { return {}; }
   });

   React.useEffect(() => {
       if (type === 'Kiểm Kho' && checkSubCat) {
           const prods = (data?.Products||[]).filter(p => p.sub_category === checkSubCat);
           setCheckItems(prev => {
               const init = { ...prev };
               prods.forEach(p => { if (init[p.id] === undefined) { init[p.id] = p.quantity; } });
               return init;
           });
       }
   }, [type, checkSubCat, data?.Products]);

   const handleCheckInput = (id, val) => {
       const newItems = { ...checkItems, [id]: val };
       setCheckItems(newItems);
       localStorage.setItem('rf_kiemkho_draft', JSON.stringify(newItems));
   };

   const filteredProducts = React.useMemo(() => { 
       if (!showDropdown && !searchProd) return []; 
       const query = String(searchProd || '').toLowerCase();
       let list = (data?.Products||[]);
       if (type === 'Nhập') {
           if (importSubTab === 'NguyenLieu') {
               list = list.filter(p => String(p.category).toUpperCase().includes('DANH MỤC SẢN XUẤT') || String(p.category).toUpperCase().includes('NGUYÊN LIỆU') || String(p.category).toUpperCase().includes('VẬT TƯ'));
           } else if (importSubTab === 'HangHoa') {
               list = list.filter(p => String(p.category).toUpperCase().includes('PHỤ KIỆN') && !String(p.category).toUpperCase().includes('LAYOUT') && !String(p.category).toUpperCase().includes('BỂ KÍNH'));
           }
       } else if (type === 'Xuất') {
           if (exportSubTab === 'SanXuat') {
               list = list.filter(p => String(p.category).toUpperCase().includes('DANH MỤC SẢN XUẤT') || String(p.category).toUpperCase().includes('NGUYÊN LIỆU'));
           }
       }
       return list.filter(p => String(p.name).toLowerCase().includes(query) || String(p.sku).toLowerCase().includes(query)).slice(0, 30); 
   }, [data?.Products, searchProd, showDropdown, type, importSubTab, exportSubTab]);

   const selectedProductInfo = React.useMemo(() => (data?.Products||[]).find(x => x.id === selProd), [data?.Products, selProd]);

   const handleSelectProduct = (p) => { 
       setSelProd(p.id); setSearchProd(p.name); setSelPrice(type === 'Nhập' ? p.costPrice : p.price); setShowDropdown(false); 
       setIsUsingImportUnit(false);
   };

   const [otherFees, setOtherFees] = React.useState(0);
   const baseAmount = items.reduce((acc, curr) => acc + (curr.qty * curr.price), 0);
   const totalAmount = type === 'Nhập' ? baseAmount + (Number(otherFees) || 0) : baseAmount;
   const displayMoney = (val) => Math.round(Number(val || 0)).toLocaleString('vi-VN');

   const addItem = () => { 
       const p = (data?.Products||[]).find(x=>x.id===selProd);
       let qtyNum = parseFloat(selQty);
       if(!p || isNaN(qtyNum) || qtyNum <= 0) return alert("Vui lòng nhập số lượng hợp lệ lớn hơn 0"); 
       let pPrice = parseFloat(selPrice) || 0;

       if (type === 'Nhập' && isUsingImportUnit && p.conversionRate > 1) {
           qtyNum = qtyNum * Number(p.conversionRate);
           pPrice = pPrice / Number(p.conversionRate);
       }

       setItems([...items, { id: p.id, name: p.name, qty: qtyNum, price: pPrice, unit: p.unit || 'Cái' }]); 
       setSelProd(''); setSelQty(''); setSelPrice(''); setSearchProd(''); 
       setIsUsingImportUnit(false);
   };

   const handleCreateSupplier = async () => {
       if (!newSup.name.trim()) return alert('Vui lòng nhập Tên Nhà Cung Cấp!');
       const sId = 'SUP_' + Date.now();
       const payloadSup = { id: sId, name: newSup.name, phone: newSup.phone, category: newSup.category, totalDebt: 0 };
       try {
           await pushData({ Suppliers: [payloadSup] });
           setSupplierId(sId);
           setShowAddSup(false);
           setNewSup({ name: '', phone: '', category: 'HÀNG HOÁ' });
       } catch (e) { alert('Lỗi tạo NCC!'); }
   };

   const save = async () => {
     if (isSaving) return;
     if (type === 'Kiểm Kho' && !checkSubCat) return alert('Vui lòng chọn danh mục con để kiểm kho!');
     if (type !== 'Kiểm Kho' && items.length === 0) return alert('Hãy thêm ít nhất 1 mặt hàng vào phiếu!');

     setIsSaving(true);
     let payload = { Products: [], ImportExport: [], Transactions: [], Accounts: [], Suppliers: [] };
     let formattedDate = (dateStr || '').replace('T', ' ');

     if (type === 'Kiểm Kho') {
         let nhapItems = []; let xuatItems = []; let totalNhapAmt = 0; let totalXuatAmt = 0;
         (data?.Products||[]).filter(p => p.sub_category === checkSubCat).forEach((p) => {
             const actual = parseInt(checkItems[p.id]);
             if (!isNaN(actual) && actual !== Number(p.quantity)) {
                 const diff = actual - Number(p.quantity);
                 payload.Products.push({ ...p, quantity: actual, _diff: diff });
                 if (diff > 0) {
                     nhapItems.push({ name: p.name, qty: diff, price: p.costPrice || 0, unit: p.unit || 'Cái' }); totalNhapAmt += diff * Number(p.costPrice || 0);
                 } else {
                     const absDiff = Math.abs(diff); xuatItems.push({ name: p.name, qty: absDiff, price: p.costPrice || 0, unit: p.unit || 'Cái' }); totalXuatAmt += absDiff * Number(p.costPrice || 0);
                 }
             }
         });
         
         if (nhapItems.length === 0 && xuatItems.length === 0) {
             alert('Không phát hiện chênh lệch! Toàn bộ mặt hàng trong danh mục khớp 100% với sổ sách.');
             localStorage.removeItem('rf_kiemkho_draft');
             setIsSaving(false); onClose(); return;
         }

         if (nhapItems.length > 0) payload.ImportExport.push({ id: 'IE_GCHK_N_' + Date.now(), type: 'Nhập', target: 'Kiểm kho (Cân tăng)', totalAmount: totalNhapAmt, date: formattedDate, note: `Cân đối kiểm kho tăng danh mục: ${checkSubCat}`, itemsData: JSON.stringify(nhapItems) });
         if (xuatItems.length > 0) payload.ImportExport.push({ id: 'IE_GCHK_X_' + Date.now() + 1, type: 'Xuất', target: 'Kiểm kho (Cân giảm)', totalAmount: totalXuatAmt, date: formattedDate, note: `Cân đối kiểm kho giảm danh mục: ${checkSubCat}`, itemsData: JSON.stringify(xuatItems) });
     } else {
         const logId = 'IE_'+Date.now(); let totalDebtAdd = 0;
         items.forEach(i => { 
             const p = (data?.Products||[]).find(x=>x.id===i.id); 
             if(p && type !== 'Đặt Hàng') {
                 const diffVal = type === 'Nhập' ? i.qty : -i.qty;
                 payload.Products.push({...p, quantity: Number(p.quantity) + diffVal, _diff: diffVal}); 
             }
         });
         let targetName = 'Nội bộ/Khác';

         if(type === 'Nhập' || type === 'Đặt Hàng') {
            targetName = supplierId ? ((data?.Suppliers||[]).find(s=>s.id===supplierId)?.name || 'Khác') : 'Khác';
            if(supplierId) {
                const paid = parseInt(paidAmount) || 0; totalDebtAdd = totalAmount - paid;
                if(paid > 0) { 
                    if(!accId) { setIsSaving(false); return alert('Vui lòng chọn quỹ để xuất Phiếu Chi thanh toán!'); }
                    const acc = (data?.Accounts||[]).find(a=>a.id===accId); 
                    payload.Accounts.push({...acc, balance: Number(acc.balance) - paid}); 
                    payload.Transactions.push({ id: 'TX_'+Date.now(), type: 'Chi', category: 'Thanh Toán Hoá Đơn', amount: paid, fromAccount: accId, toAccount: '', title: `Thanh toán nhập hàng: ${targetName}`, date: formattedDate, note: `Hệ thống tạo tự động từ Phiếu ${type} (${logId})` });
                }
                if(totalDebtAdd > 0) { 
                    const sup = (data?.Suppliers||[]).find(s=>s.id===supplierId);
                    payload.Suppliers.push({...sup, totalDebt: Number(sup.totalDebt) + totalDebtAdd}); 
                }
            }
         } else { 
             targetName = receiverName || 'Xuất nội bộ';
             if (exportSubTab === 'ThanhLy') {
                 targetName = 'Thanh lý hàng hoá';
                 const amount = parseInt(thanhLyAmount) || 0;
                 if (amount > 0) {
                     if (!accId) { setIsSaving(false); return alert('Vui lòng chọn quỹ để tạo Phiếu Thu!'); }
                     const acc = (data?.Accounts||[]).find(a=>a.id===accId); 
                     payload.Accounts.push({...acc, balance: Number(acc.balance) + amount}); 
                     payload.Transactions.push({ id: 'TX_'+Date.now(), type: 'Thu', category: 'Thanh Lý Hàng Hoá', amount: amount, fromAccount: '', toAccount: accId, title: `Thu tiền thanh lý kho`, date: formattedDate, note: `Hệ thống tạo tự động từ Phiếu Xuất Thanh Lý (${logId})` });
                 }
             }
         }
         
         let finalNote = note;
         if(type === 'Nhập') { 
             const u = (localStorage.getItem('rf_user') || 'Admin').split(' ').pop(); 
             finalNote = `${note ? note + ' - ' : ''}Nhập từ NCC (Người tạo: ${u})`;
         } else if (type === 'Xuất' && exportSubTab === 'ThanhLy') {
             finalNote = `${note ? note + ' - ' : ''}Thanh lý (Hệ thống)`;
         } else if (type === 'Xuất' && exportSubTab === 'Huy') {
             finalNote = `${note ? note + ' - ' : ''}Xuất huỷ (Hệ thống)`;
         }
         payload.ImportExport.push({ id: logId, type, target: targetName, totalAmount, date: formattedDate, note: finalNote, itemsData: JSON.stringify(items), otherFees: type === 'Nhập' ? (Number(otherFees) || 0) : 0 });
     }

     if (linkedReqId) {
         payload.deletes = payload.deletes || {};
         if (!payload.deletes.Production) payload.deletes.Production = [];
         payload.deletes.Production.push(linkedReqId);
     }

     try {
          await pushData(payload);
          if (type === 'Kiểm Kho') localStorage.removeItem('rf_kiemkho_draft');
          
          if (onSaveSuccess && type !== 'Kiểm Kho') {
              onSaveSuccess({
                  id: logId,
                  type: type,
                  target: targetName,
                  date: formattedDate,
                  items: items,
                  baseAmount: baseAmount,
                  otherFees: Number(otherFees) || 0,
                  totalAmount: totalAmount,
                  paidAmount: Number(paidAmount) || 0,
                  debtAmount: totalDebtAdd,
                  note: finalNote,
                  creator: currentUser || 'Admin'
              });
          }
          if (triggerToast) triggerToast('Lưu phiếu kho thành công!', 'fa-check', 'success');
          onClose();
      } catch (e) { setIsSaving(false); alert("Lỗi lưu phiếu: " + e.message); }
   };

   const hasDraft = checkItems && Object.keys(checkItems).length > 0;

   const checkDiffsSummary = React.useMemo(() => {
       if (type !== 'Kiểm Kho' || !checkSubCat) return { surplus: 0, deficit: 0, matched: 0 };
       let surplus = 0, deficit = 0, matched = 0;
       (data?.Products||[]).filter(p => p.sub_category === checkSubCat).forEach(p => {
           const actual = parseInt(checkItems[p.id]);
           if (isNaN(actual)) return;
           const diff = actual - Number(p.quantity);
           if (diff > 0) surplus++;
           else if (diff < 0) deficit++;
           else matched++;
       });
       return { surplus, deficit, matched };
   }, [type, checkSubCat, checkItems, data?.Products]);

   return (
     <div className="fixed inset-0 bg-[#0a0a0a]/90 z-[300] flex items-center justify-center p-3 sm:p-4 backdrop-blur-sm animate-fade-in overscroll-contain" onClick={() => { if(!isSaving) onClose(); }}>

                    <i className="fas fa-info-circle text-[#60a5fa] mt-0.5 text-xs"></i>

                                <button onClick={()=>setShowAddSup(false)} className="flex-1 py-1.5 bg-[#1a1a1a] text-gray-400 text-[10px] font-bold rounded-lg border border-[#222] active:scale-95 transition-all">HỦY</button>

                    <div className="flex items-center justify-between">

                                    <span>Tổng tiền hàng: <span className="text-gray-300 font-mono">{displayMoney(baseAmount)}</span></span>
                                    {type === 'Nhập' && (
                                        <div className="flex items-center gap-2">
                                            <span>Thu/Chi Khác (Cộng vào vốn):</span>
                                            <input type="number" disabled={isSaving} placeholder="0" className="w-24 p-1 bg-[#141414] rounded border border-[#333] text-xs font-bold outline-none text-white focus:border-[#d4af37]" value={otherFees} onChange={e=>setOtherFees(e.target.value)} />
                                        </div>
                                    )}
                                </div>
                                {type === 'Xuất' && exportSubTab === 'ThanhLy' ? (
                                    <div className="flex flex-col items-end gap-1">
                                        <input type="number" disabled={isSaving} placeholder="Nhập số tiền thu được..." className="w-40 p-2 bg-[#0a0a0a] rounded-lg border border-[#f59e0b] text-[12px] font-black outline-none text-[#f59e0b] text-right focus:border-[#f59e0b]" value={thanhLyAmount} onChange={e=>setThanhLyAmount(e.target.value)} />
                                        {(parseInt(thanhLyAmount) > 0) && (
                                            <select disabled={isSaving} className="w-40 p-1.5 bg-[#0a0a0a] rounded-lg border border-[#333] text-[9px] font-bold outline-none shadow-sm focus:border-[#f59e0b] text-white cursor-pointer" value={accId} onChange={e=>setAccId(e.target.value)}>
                                                <option value="">-- Thu vào quỹ --</option>
                                                {(data?.Accounts||[]).map(a=><option key={a.id} value={a.id}>{a.accountName}</option>)}
                                            </select>
                                        )}
                                    </div>
                                ) : (
                                    <div className="text-right">
                                        <div className="text-[8px] font-black text-gray-500 uppercase tracking-widest mb-1">TỔNG CẦN TRẢ</div>
                                        <div className={`text-[16px] font-black tracking-tight ${type === 'Nhập' ? 'text-emerald-400' : 'text-rose-400'}`}>{displayMoney(totalAmount)}<span className="text-[11px] ml-1 text-gray-500 font-black">VND</span></div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>

                {/* CHI PHÍ KHÁC / CƯỚC VẬN CHUYỂN */}
                {type === 'Nhập' && (
                    <div className="bg-[#0a0a0a] border border-[#222] p-3.5 rounded-2xl space-y-1.5">
                        <div className="flex justify-between items-center">
                            <label className="text-[10px] font-black text-amber-400 uppercase tracking-widest flex items-center gap-1.5">
                                <i className="fas fa-truck text-xs"></i> CƯỚC VẬN CHUYỂN / CHI PHÍ KHÁC (VNĐ)
                            </label>
                            {Number(otherFees) > 0 && (
                                <span className="text-[10px] font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">+{displayMoney(otherFees)}đ</span>
                            )}
                        </div>
                        <input 
                            type="number" 
                            disabled={isSaving} 
                            placeholder="Nhập tiền cước vận chuyển (nếu có)..." 
                            className="w-full p-2.5 bg-[#141414] rounded-xl border border-[#333] text-xs font-bold text-amber-300 outline-none focus:border-amber-500 transition-colors" 
                            value={otherFees} 
                            onChange={e => setOtherFees(e.target.value)} 
                        />
                        <p className="text-[9.5px] text-zinc-500 italic">
                            * Cước xe/vận chuyển sẽ tự động được cộng vào tổng tiền vốn phiếu nhập kho.
                        </p>
                    </div>
                )}

                <div>
                    <label className="text-[9px] font-black text-gray-500 block mb-1.5 uppercase tracking-widest">Ghi chú phiếu</label>
                    <input disabled={isSaving} placeholder="Nhập ghi chú mục đích xuất nhập..." className="w-full p-2.5 bg-[#0a0a0a] rounded-xl border border-[#333] text-[11px] font-bold outline-none text-white focus:border-[#d4af37]" value={note} onChange={e=>setNote(e.target.value)}/>
                </div>
                
                {type === 'Nhập' && supplierId && (
                    <div className="p-3.5 bg-emerald-950/15 border border-emerald-900/40 rounded-xl space-y-3 shadow-inner relative overflow-hidden">
                        <div className="flex justify-between items-center border-b border-emerald-900/20 pb-2"><span className="text-[10px] font-black text-[#10b981] uppercase tracking-widest">TỔNG CẦN TRẢ</span><span className="text-[16px] font-black text-[#10b981]">{displayMoney(totalAmount)}đ</span></div>
                        <div className="flex justify-between items-center gap-2">
                            <span className="text-[10px] font-bold text-gray-400">Chi trả ngay <br/><span className="text-[8px] text-gray-500 font-medium italic">(Hệ thống tự động tạo Phiếu Chi)</span></span>
                            <input type="number" disabled={isSaving} placeholder="Nhập số tiền chi..." className="w-1/2 p-2.5 bg-[#0a0a0a] rounded-lg border border-[#333] text-xs text-right font-black text-[#10b981] outline-none shadow-sm focus:border-[#10b981]" value={paidAmount} onChange={e=>setPaidAmount(e.target.value)}/>
                        </div>
                        {(parseInt(paidAmount)>0) && (
                            <div className="animate-fade-in pt-1.5">
                                <label className="text-[9px] font-bold text-gray-400 block mb-1">Trừ tiền từ quỹ nào?</label>
                                <select disabled={isSaving} className="w-full p-2 bg-[#0a0a0a] rounded-lg border border-[#333] text-[11px] font-bold outline-none shadow-sm focus:border-[#10b981] text-white cursor-pointer" value={accId} onChange={e=>setAccId(e.target.value)}><option value="">-- Chọn quỹ thanh toán --</option>{(data?.Accounts||[]).map(a=><option key={a.id} value={a.id}>{a.accountName} (Sẵn có: {displayMoney(a.balance)}đ)</option>)}</select>
                            </div>
                        )}
                        <div className="text-[10px] text-rose-500 font-bold text-right pt-2 border-t border-emerald-900/20 flex justify-end items-center gap-1.5"><i className="fas fa-hand-holding-usd opacity-60"></i> Nợ Đối Tác: <span className="bg-[#2a0808] text-rose-500 px-2 py-0.5 rounded border border-rose-900/30">{displayMoney(totalAmount - (parseInt(paidAmount)||0))}đ</span></div>
                    </div>
                )}
              </div>
            )}
          </div>
          
          <div className="pt-4 mt-2 shrink-0">
              <button onClick={save} disabled={isSaving} className={`w-full py-3.5 font-black rounded-xl text-[12px] uppercase tracking-wider shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 ${isSaving ? 'bg-[#333] text-gray-500 cursor-not-allowed' : (type === 'Kiểm Kho' ? 'bg-[#2563eb] text-white hover:bg-blue-600' : 'bg-[#d4af37] text-[#0a0a0a]')}`}>
                  {isSaving ? <><i className="fas fa-spinner fa-spin"></i> ĐANG ĐỒNG BỘ DỮ LIỆU...</> : (type === 'Kiểm Kho' ? <><i className="fas fa-magic"></i> LƯU PHIẾU KIỂM KHO</> : <><i className="fas fa-save"></i> LƯU PHIẾU {type.toUpperCase()}</>)}
              </button>
          </div>
        </div>
      </div>
    );
}


</script>
