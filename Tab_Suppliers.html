<script type="text/babel">
// =========================================================================
// 🤝 FILE: Tab_Suppliers.txt
// CHỨC NĂNG: Quản lý Nhà Cung Cấp, công nợ và thanh toán (Giao diện nâng cấp)
// =========================================================================

const SuppliersTab = React.memo(function SuppliersTab({ data, pushData, isAdmin, triggerToast }) {
    const [searchTerm, setSearchTerm] = React.useState('');
    const [debtFilter, setDebtFilter] = React.useState('ALL'); // ALL, DEBT, NO_DEBT
    const [showAddModal, setShowAddModal] = React.useState(false);
    const [expandedIds, setExpandedIds] = React.useState({});
    const [isSaving, setIsSaving] = React.useState(false);
    const [historyFilters, setHistoryFilters] = React.useState({}); // supId -> ALL, UNPAID

    const [newSup, setNewSup] = React.useState({ id: null, name: '', phone: '', category: 'HÀNG HOÁ', note: '', totalDebt: 0 });
    const [payingLog, setPayingLog] = React.useState(null);
    const [payAccId, setPayAccId] = React.useState('');
    const [payAmount, setPayAmount] = React.useState('');
    const [editingLog, setEditingLog] = React.useState(null);
    const [editNote, setEditNote] = React.useState('');
    const [editTotal, setEditTotal] = React.useState('');

    // States cho tính năng Đối Soát Bank (N:1)
    const [reconcileSupplier, setReconcileSupplier] = React.useState(null);
    const [reconSelectedTxId, setReconSelectedTxId] = React.useState('');
    const [reconSelectedImportIds, setReconSelectedImportIds] = React.useState([]);

    const CATEGORIES = ['HÀNG HOÁ', 'NGUYÊN LIỆU & VẬT TƯ', 'CÔNG CỤ MÁY MÓC', 'NỘI BỘ', 'KHÁC'];
    const suppliers = data.Suppliers || [];

    // TÍNH TOÁN CÁC CHỈ SỐ DASHBOARD
    const stats = React.useMemo(() => {
        let totalDebt = 0;
        let unpaidBills = 0;
        suppliers.forEach(s => totalDebt += (Number(s.totalDebt) || 0));

        (data.ImportExport || []).forEach(log => {
            if (log.type === 'Nhập' && !log.isPaid && Number(log.totalAmount) > 0) {
                unpaidBills++;
            }
        });

        const currentMonthStr = new Date().toISOString().slice(0, 7); // YYYY-MM
        const paidThisMonth = (data.Transactions || [])
            .filter(t => t.type === 'Chi' && t.category === 'Thanh Toán Hoá Đơn' && t.date && t.date.startsWith(currentMonthStr))
            .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);

        return {
            totalDebt,
            totalPartners: suppliers.length,
            unpaidBills,
            paidThisMonth
        };
    }, [suppliers, data.ImportExport, data.Transactions]);

    // PHÂN LOẠI & LỌC NHÀ CUNG CẤP
    const groupedSuppliers = React.useMemo(() => {
        const groups = {};
        CATEGORIES.forEach(cat => groups[cat] = []);

        suppliers.forEach(sup => {
            // Lọc từ khoá tìm kiếm
            const matchSearch = !searchTerm || 
                sup.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                (sup.phone || '').includes(searchTerm);
            if (!matchSearch) return;

            // Lọc trạng thái nợ
            const debt = Number(sup.totalDebt || 0);
            if (debtFilter === 'DEBT' && debt <= 0) return;
            if (debtFilter === 'NO_DEBT' && debt > 0) return;

            const cat = CATEGORIES.includes(sup.category) ? sup.category : 'KHÁC';
            groups[cat].push(sup);
        });
        return groups;
    }, [suppliers, searchTerm, debtFilter]);

    const getImportHistory = (supName) => {
        const imports = (data.ImportExport || []).filter(log => log.type === 'Nhập' && log.target === supName);
        return imports.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
    };

    const toggleExpand = (id) => setExpandedIds(prev => ({ ...prev, [id]: !prev[id] }));
    const toggleHistoryFilter = (supId, filterType) => setHistoryFilters(prev => ({ ...prev, [supId]: filterType }));
    const displayMoney = (val) => Math.round(Number(val || 0)).toLocaleString('vi-VN');

    const getSupplierIcon = (category) => {
        switch(category) {
            case 'HÀNG HOÁ': return <i className="fas fa-boxes text-emerald-400 drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]"></i>;
            case 'NGUYÊN LIỆU & VẬT TƯ': return <i className="fas fa-cubes text-amber-400 drop-shadow-[0_0_8px_rgba(245,158,11,0.4)]"></i>;
            case 'CÔNG CỤ MÁY MÓC': return <i className="fas fa-cogs text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.4)]"></i>;
            case 'NỘI BỘ': return <i className="fas fa-building text-purple-400 drop-shadow-[0_0_8px_rgba(168,85,247,0.4)]"></i>;
            default: return <i className="fas fa-handshake text-gray-400"></i>;
        }
    };

    const handleSaveSup = async () => {
        if (!newSup.name.trim()) return triggerToast('Vui lòng nhập Tên Nhà Cung Cấp!', 'fa-exclamation', 'warning');
        setIsSaving(true);
        try {
            const debtInputVal = Number(newSup.totalDebt || 0);
            if (newSup.id) {
                const existing = suppliers.find(s => s.id === newSup.id);
                const payload = { Suppliers: [{ ...existing, name: newSup.name, phone: newSup.phone, category: newSup.category, note: newSup.note, totalDebt: debtInputVal }] };
                
                // QUÉT & ĐỒNG BỘ KHÓA NGOẠI: Cập nhật lại mục tiêu (target) của ImportExport nếu Nhà cung cấp bị đổi tên
                if (existing.name !== newSup.name) {
                    const relatedLogs = (data.ImportExport || []).filter(log => log.type === 'Nhập' && log.target === existing.name);
                    if (relatedLogs.length > 0) {
                        payload.ImportExport = relatedLogs.map(log => ({ ...log, target: newSup.name }));
                    }
                }
                
                await pushData(payload);
                triggerToast('Cập nhật Nhà Cung Cấp thành công!', 'fa-check', 'success');
            } else {
                await pushData({ Suppliers: [{ id: 'SUP_' + Date.now(), name: newSup.name, phone: newSup.phone, category: newSup.category, note: newSup.note, totalDebt: debtInputVal }] });
                triggerToast('Tạo Nhà Cung Cấp thành công!', 'fa-check', 'success');
            }
            setShowAddModal(false);
            setNewSup({ id: null, name: '', phone: '', category: 'HÀNG HOÁ', note: '', totalDebt: 0 });
        } catch (e) { triggerToast('Gặp lỗi khi lưu Nhà Cung Cấp: ' + e.message, 'fa-times', 'danger'); }
        setIsSaving(false);
    };

    const handleDeleteSup = async (sup) => {
        if (Number(sup.totalDebt || 0) > 0) {
            return triggerToast('Không thể xóa Nhà Cung Cấp đang còn công nợ chưa chi trả!', 'fa-ban', 'danger');
        }
        if (!window.confirm(`Bạn có chắc muốn XÓA VĨNH VIỄN Nhà Cung Cấp: [${sup.name}]?`)) return;
        setIsSaving(true);
        try {
            await pushData({ deletes: { Suppliers: [sup.id] } });
            triggerToast('Xóa Nhà Cung Cấp thành công!', 'fa-check', 'success');
        } catch (e) { triggerToast('Gặp lỗi khi xóa Nhà Cung Cấp: ' + e.message, 'fa-times', 'danger'); }
        setIsSaving(false);
    };

    const openPaymentModal = (log, sup) => {
        setPayingLog({ log, sup });
        setPayAmount(log.totalAmount || 0);
        setPayAccId('');
    };

    const isSavingRef = React.useRef(false);

    const handleConfirmPayment = async () => {
        if (isSavingRef.current) return;
        const amountToPay = Number(payAmount);
        if (!payAccId) return triggerToast('Vui lòng chọn quỹ tiền để trừ!', 'fa-exclamation', 'warning');
        if (amountToPay <= 0) return triggerToast('Số tiền thanh toán phải lớn hơn 0!', 'fa-exclamation', 'warning');

        isSavingRef.current = true;
        setIsSaving(true);
        try {
            const acc = (data.Accounts || []).find(a => a.id === payAccId);
            const sup = payingLog.sup;
            const log = payingLog.log;
            
            const newTransaction = {
                id: 'TX_' + Date.now() + Math.floor(Math.random()*1000), type: 'Chi', category: 'Thanh Toán Hoá Đơn', amount: amountToPay,
                fromAccount: payAccId, toAccount: '', title: `Thanh toán phiếu nhập: ${log.id}`,
                date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                note: `Chi trả tiền nhập hàng cho nhà cung cấp ${sup.name}`
            };

            await pushData({
                Transactions: [newTransaction],
                Accounts: [{ ...acc, balance: Number(acc.balance) - amountToPay }],
                Suppliers: [{ ...sup, totalDebt: Number(sup.totalDebt) - amountToPay }],
                ImportExport: [{ ...log, isPaid: true, paidAt: new Date().toISOString() }]
            });
            setPayingLog(null);
            triggerToast('Thanh toán thành công!', 'fa-check', 'success');
        } catch (e) { triggerToast('Lỗi thanh toán: ' + e.message, 'fa-times', 'danger'); }
        setIsSaving(false);
        setTimeout(() => { isSavingRef.current = false; }, 500);
    };

    const openEditModal = (log) => {
        setEditingLog(log);
        setEditNote(log.note || '');
        setEditTotal(log.totalAmount || 0);
    };

    const handleConfirmEdit = async () => {
        setIsSaving(true);
        try {
            const oldAmount = Number(editingLog.totalAmount || 0);
            const newAmount = Number(editTotal);
            const diff = newAmount - oldAmount;
            
            const payload = { ImportExport: [{ ...editingLog, note: editNote, totalAmount: newAmount }] };
            
            if (diff !== 0 && !editingLog.isPaid) {
                const sup = suppliers.find(s => s.name === editingLog.target);
                if (sup) {
                    payload.Suppliers = [{ ...sup, totalDebt: Number(sup.totalDebt || 0) + diff }];
                }
            }
            
            await pushData(payload);
            setEditingLog(null);
            triggerToast('Cập nhật phiếu thành công!', 'fa-check', 'success');
        } catch (e) { triggerToast('Lỗi sửa phiếu: ' + e.message, 'fa-times', 'danger'); }
        setIsSaving(false);
    };

    const handleDeleteTicket = async (log, sup) => {
        const choice = window.prompt(`XOÁ PHIẾU NHẬP: ${log.id}\n\nNhập "1" để: Xoá phiếu NHƯNG GIỮ NGUYÊN tồn kho (Dùng khi hàng vật lý đã vào kho, chỉ xoá rác sổ sách).\nNhập "2" để: Xoá phiếu và TRỪ LẠI số tồn kho đã cộng.\n\nHãy nhập số 1 hoặc 2:`);
        if (!choice) return;
        if (choice !== '1' && choice !== '2') return triggerToast('Lựa chọn không hợp lệ', 'fa-times', 'danger');

        setIsSaving(true);
        try {
            const payload = { deletes: { ImportExport: [log.id] }, Products: [], Suppliers: [] };
            
            if (!log.isPaid && Number(log.totalAmount || 0) > 0) {
                payload.Suppliers.push({
                    ...sup, 
                    totalDebt: Number(sup.totalDebt || 0) - Number(log.totalAmount)
                });
            }

            if (choice === '2') {
                let parsed = [];
                try { parsed = JSON.parse(log.itemsData); } catch(e) {}
                parsed.forEach(item => {
                    const p = (data?.Products||[]).find(x => x.name === item.name);
                    if (p) {
                        const diffVal = -Number(item.qty || 0);
                        payload.Products.push({...p, quantity: Number(p.quantity) + diffVal, _diff: diffVal});
                    }
                });
            }

            await pushData(payload);
            triggerToast('Đã xoá phiếu thành công!', 'fa-trash', 'success');
        } catch (e) {
            triggerToast('Lỗi xoá phiếu: ' + e.message, 'fa-times', 'danger');
        }
        setIsSaving(false);
    };

    // Bank Auto-sync Transactions cho Modal Đối Soát
    const recentBankTxs = React.useMemo(() => {
        const now = new Date();
        const thirtyDaysAgo = new Date(now.setDate(now.getDate() - 30)).toISOString().split('T')[0];
        return (data.Transactions || []).filter(t => {
            if (t.type !== 'Chi') return false;
            const tDate = (t.date || '').split('T')[0];
            if (tDate < thirtyDaysAgo) return false;
            const noteLower = String(t.note || '').toLowerCase();
            if (noteLower.includes('đối soát công nợ')) return false;
            return true;
        }).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    }, [data.Transactions]);

    const handleSaveReconciliation = async () => {
        if (!reconSelectedTxId) return triggerToast('Vui lòng chọn 1 Phiếu Chi Bank!', 'fa-exclamation', 'warning');
        if (reconSelectedImportIds.length === 0) return triggerToast('Vui lòng tick ít nhất 1 Phiếu Nhập!', 'fa-exclamation', 'warning');

        const tx = recentBankTxs.find(t => t.id === reconSelectedTxId);
        if (!tx) return;

        const allImports = getImportHistory(reconcileSupplier.name);
        const selectedImports = allImports.filter(log => reconSelectedImportIds.includes(log.id));
        const totalImportAmount = selectedImports.reduce((sum, log) => sum + Number(log.totalAmount || 0), 0);
        const balanceDiff = Number(tx.amount || 0) - totalImportAmount;

        if (balanceDiff < 0) {
            return triggerToast('LỖI BẢO MẬT: Phiếu Chi không đủ để thanh toán!', 'fa-ban', 'danger');
        }

        setIsSaving(true);
        try {
            // Update the Bank Transaction note
            const updatedTx = {
                ...tx,
                note: `[Đã đối soát công nợ: ${reconcileSupplier.name}]. ${tx.note || ''}`
            };

            // Deduct totalDebt by exactly the total of the checked import logs (not the bank amount, in case of fee)
            const updatedSupplier = {
                ...reconcileSupplier,
                totalDebt: Number(reconcileSupplier.totalDebt) - totalImportAmount
            };

            // Mark import logs as paid
            const updatedImports = selectedImports.map(log => ({
                ...log,
                isPaid: true,
                paidAt: new Date().toISOString()
            }));

            await pushData({
                Transactions: [updatedTx],
                Suppliers: [updatedSupplier],
                ImportExport: updatedImports
            });

            setReconcileSupplier(null);
            triggerToast('Đã đối soát Bank và Cấn trừ nợ thành công!', 'fa-shield-check', 'success');
        } catch (e) {
            triggerToast('Lỗi đối soát: ' + e.message, 'fa-times', 'danger');
        }
        setIsSaving(false);
    };

    const handleToggleImport = (id) => {
        setReconSelectedImportIds(prev => 
            prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
        );
    };

    const handlePrintReceipt = (log, sup) => {
        const printContent = `
            <html>
            <head>
                <meta charset="utf-8">
                <title>In Phiếu Chi</title>
                <style>
                    @page { margin: 0; size: 58mm auto; }
                    body { font-family: 'Courier New', Courier, monospace; width: 58mm; margin: 0; padding: 10px 5px; font-size: 11px; color: #000; line-height: 1.4; box-sizing: border-box; }
                    .text-center { text-align: center; }
                    .text-right { text-align: right; }
                    .bold { font-weight: bold; }
                    .border-bottom { border-bottom: 1px dashed #000; margin: 6px 0; padding-bottom: 6px; }
                    .title { font-size: 14px; margin-bottom: 4px; }
                    .row { display: flex; justify-content: space-between; }
                </style>
            </head>
            <body>
                <div class="text-center bold title">RICH FISH AQUARIUM</div>
                <div class="text-center" style="font-size: 10px;">Cá Cảnh & Phụ Kiện Thủy Sinh</div>
                <div class="border-bottom"></div>
                <div class="text-center bold" style="font-size: 15px; margin: 5px 0;">PHIẾU CHI TIỀN</div>
                <div class="border-bottom"></div>
                <div><span class="bold">Số phiếu:</span> ${log.id}</div>
                <div><span class="bold">Ngày lập:</span> ${new Date().toLocaleString('vi-VN')}</div>
                <div><span class="bold">Người nhận:</span> ${sup.name}</div>
                <div class="border-bottom"></div>
                <div class="bold">Lý do chi:</div>
                <div style="font-size: 10px;">Thanh toán phiếu nhập hàng [${log.id}]. ${log.note || ''}</div>
                <div class="border-bottom"></div>
                <div class="row bold" style="font-size: 13px;">
                    <span>TỔNG TIỀN:</span>
                    <span>${Number(log.totalAmount).toLocaleString('vi-VN')}đ</span>
                </div>
                <div class="border-bottom"></div>
                <div class="row" style="margin-top: 15px; font-size: 10px; font-weight: bold;">
                    <div class="text-center" style="width: 50%;">Người Lập<br><br><br>Ký tên</div>
                    <div class="text-center" style="width: 50%;">Người Nhận<br><br><br>Ký tên</div>
                </div>
                <div style="margin-top: 40px; text-align: center; font-size: 10px; border-top: 1px solid #000; padding-top: 5px;">
                    Cảm ơn quý khách!
                </div>
            </body>
            </html>
        `;
        const win = window.open('', '_blank');
        win.document.write(printContent);
        win.document.close();
        win.focus();
        setTimeout(() => {
            win.print();
            win.close();
        }, 800);
    };

    return (
        <div className="space-y-5 animate-fade-in pb-10 w-full relative">
            
            {/* 1. KHUNG THỐNG KÊ DASHBOARD CAO CẤP */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                <div className="bg-[#141414] p-4 rounded-2xl border border-rose-500/20 shadow-sm relative overflow-hidden flex items-center justify-between">
                    <div className="absolute top-0 right-0 w-16 h-16 bg-rose-500/5 rounded-full blur-xl pointer-events-none"></div>
                    <div>
                        <span className="text-[9px] font-black text-rose-400 uppercase tracking-widest block mb-1">CÔNG NỢ CẦN TRẢ</span>
                        <span className="text-[20px] font-black text-rose-500 leading-none">{displayMoney(stats.totalDebt)}đ</span>
                    </div>
                    <div className="w-10 h-10 rounded-full bg-rose-500/10 text-rose-500 border border-rose-500/20 flex items-center justify-center text-sm"><i className="fas fa-hand-holding-usd"></i></div>
                </div>

                <div className="bg-[#141414] p-4 rounded-2xl border border-blue-500/20 shadow-sm relative overflow-hidden flex items-center justify-between">
                    <div className="absolute top-0 right-0 w-16 h-16 bg-blue-500/5 rounded-full blur-xl pointer-events-none"></div>
                    <div>
                        <span className="text-[9px] font-black text-blue-400 uppercase tracking-widest block mb-1">TỔNG NHÀ CUNG CẤP</span>
                        <span className="text-[20px] font-black text-blue-400 leading-none">{stats.totalPartners} <span className="text-[10px] text-gray-500">nhà CC</span></span>
                    </div>
                    <div className="w-10 h-10 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center text-sm"><i className="fas fa-user-tie"></i></div>
                </div>

                <div className="bg-[#141414] p-4 rounded-2xl border border-amber-500/20 shadow-sm relative overflow-hidden flex items-center justify-between">
                    <div className="absolute top-0 right-0 w-16 h-16 bg-amber-500/5 rounded-full blur-xl pointer-events-none"></div>
                    <div>
                        <span className="text-[9px] font-black text-amber-400 uppercase tracking-widest block mb-1">ĐƠN CHƯA CHI TRẢ</span>
                        <span className="text-[20px] font-black text-amber-500 leading-none">{stats.unpaidBills} <span className="text-[10px] text-gray-500">phiếu</span></span>
                    </div>
                    <div className="w-10 h-10 rounded-full bg-amber-500/10 text-amber-500 border border-amber-500/20 flex items-center justify-center text-sm"><i className="fas fa-file-invoice-dollar"></i></div>
                </div>

                <div className="bg-[#141414] p-4 rounded-2xl border border-emerald-500/20 shadow-sm relative overflow-hidden flex items-center justify-between">
                    <div className="absolute top-0 right-0 w-16 h-16 bg-emerald-500/5 rounded-full blur-xl pointer-events-none"></div>
                    <div>
                        <span className="text-[9px] font-black text-emerald-400 uppercase tracking-widest block mb-1">ĐÃ CHI THÁNG NÀY</span>
                        <span className="text-[20px] font-black text-emerald-400 leading-none">{displayMoney(stats.paidThisMonth)}đ</span>
                    </div>
                    <div className="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center text-sm"><i className="fas fa-wallet"></i></div>
                </div>
            </div>

            {/* 2. THANH CÔNG CỤ TÌM KIẾM, BỘ LỌC NÂNG CAO */}
            <div className="bg-[#141414] border border-[#2a2a2a] p-4 rounded-2xl shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div className="flex flex-wrap items-center gap-3">
                    {/* BỘ LỌC CÔNG NỢ NHANH */}
                    <div className="bg-[#0a0a0a] rounded-xl border border-[#2a2a2a] p-1 flex">
                        <button onClick={() => setDebtFilter('ALL')} className={`px-4 py-2 text-[10px] font-black uppercase tracking-wider rounded-lg transition-all ${debtFilter === 'ALL' ? 'bg-[#10b981] text-[#0a0a0a]' : 'text-gray-400 hover:text-white'}`}>TẤT CẢ</button>
                        <button onClick={() => setDebtFilter('DEBT')} className={`px-4 py-2 text-[10px] font-black uppercase tracking-wider rounded-lg transition-all flex items-center gap-1.5 ${debtFilter === 'DEBT' ? 'bg-rose-600 text-white shadow-md shadow-rose-950/20' : 'text-gray-400 hover:text-white'}`}><i className="fas fa-exclamation-circle text-[10px]"></i> CÓ NỢ</button>
                        <button onClick={() => setDebtFilter('NO_DEBT')} className={`px-4 py-2 text-[10px] font-black uppercase tracking-wider rounded-lg transition-all ${debtFilter === 'NO_DEBT' ? 'bg-[#222] text-gray-300' : 'text-gray-400 hover:text-white'}`}>KHÔNG NỢ</button>
                    </div>
                </div>

                <div className="flex items-center gap-3 w-full md:w-auto">
                    <div className="relative flex-1 md:w-64">
                        <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-[12px]"></i>
                        <input type="text" placeholder="Tìm kiếm nhà cung cấp..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl pl-9 pr-4 py-2.5 text-[12px] font-bold text-white outline-none focus:border-[#10b981] shadow-inner transition-colors" />
                        {searchTerm && <button onClick={() => setSearchTerm('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white text-xs"><i className="fas fa-times-circle"></i></button>}
                    </div>

            {editingLog && (
                <div className="fixed inset-0 bg-[#0a0a0a]/90 z-[300] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={() => setEditingLog(null)}>
                    <div className="bg-[#141414] w-full max-w-sm rounded-[24px] p-5 border border-[#333] shadow-2xl flex flex-col relative overflow-hidden animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500 to-transparent opacity-50"></div>
                        <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-3">
                            <h3 className="font-black text-amber-500 text-[15px] uppercase tracking-wider"><i className="fas fa-edit mr-2"></i> Chỉnh sửa phiếu nhập</h3>
                            <button onClick={() => setEditingLog(null)} disabled={isSaving} className="w-8 h-8 bg-[#1a1a1a] rounded-full text-gray-400 hover:text-rose-500 border border-[#333] transition-colors"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="text-[10px] text-amber-500/70 italic mb-4 leading-relaxed bg-amber-500/10 p-2.5 rounded-lg border border-amber-500/20">
                            * Lưu ý: Thay đổi này chỉ sửa đổi Tổng tiền phiếu nhập và Ghi chú. Tồn kho nguyên vật liệu đã nhập trước đó sẽ không bị ảnh hưởng.
                        </div>
                        <div className="space-y-4">
                            <div>
                                <label className="text-[10px] font-black text-gray-500 uppercase block mb-1.5">TỔNG TIỀN PHIẾU (VNĐ)</label>
                                <input type="number" value={editTotal} onChange={e => setEditTotal(e.target.value)} disabled={isSaving} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-3 text-[16px] text-amber-400 font-black outline-none focus:border-amber-500 text-right shadow-inner" />
                            </div>
                            <div>
                                <label className="text-[10px] font-black text-gray-500 uppercase block mb-1.5">MỤC ĐÍCH / GHI CHÚ</label>
                                <textarea rows="3" value={editNote} onChange={e => setEditNote(e.target.value)} disabled={isSaving} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-3 text-[12px] text-white font-medium outline-none focus:border-amber-500 shadow-inner" placeholder="Ghi chú sửa đổi..."></textarea>
                            </div>
                        </div>
                        <div className="pt-5 mt-4 border-t border-[#222]">
                            <button onClick={handleConfirmEdit} disabled={isSaving} className="w-full py-3.5 bg-amber-500 hover:bg-yellow-500 text-[#0a0a0a] font-black rounded-xl text-[12px] tracking-widest uppercase transition-all shadow-[0_0_15px_rgba(245,158,11,0.2)] flex items-center justify-center gap-2 active:scale-95">
                                {isSaving ? <><i className="fas fa-spinner fa-spin"></i> Đang lưu...</> : <><i className="fas fa-save"></i> Lưu phiếu nhập</>}
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* MODAL ĐỐI SOÁT BANK N:1 */}
            {reconcileSupplier && (
                <div className="fixed inset-0 bg-[#0a0a0a]/90 z-[300] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={() => setReconcileSupplier(null)}>
                    <div className="bg-[#141414] w-full max-w-md max-h-[90vh] rounded-[24px] p-5 border border-[#333] shadow-2xl flex flex-col relative overflow-hidden animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#10b981] to-transparent opacity-50"></div>
                        <div className="flex justify-between items-center mb-4 border-b border-[#222] pb-3">
                            <h3 className="font-black text-[#10b981] text-[15px] uppercase tracking-wider flex items-center gap-2">
                                <i className="fas fa-link"></i> Đối Soát Bank (N:1)
                            </h3>
                            <button onClick={() => setReconcileSupplier(null)} disabled={isSaving} className="w-8 h-8 bg-[#1a1a1a] rounded-full text-gray-400 hover:text-rose-500 border border-[#333] transition-colors flex items-center justify-center"><i className="fas fa-times"></i></button>
                        </div>
                        
                        <div className="text-[10px] text-[#10b981]/70 italic mb-4 leading-relaxed bg-[#10b981]/10 p-2.5 rounded-lg border border-[#10b981]/20">
                            * Công cụ Khớp Lệnh: Ghép 1 Phiếu Chi tự động từ Ngân Hàng với N Phiếu Nhập Hàng của nhà cung cấp <strong>{reconcileSupplier.name}</strong>.
                        </div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-1">
                            {/* Chon Phieu Chi */}
                            <div>
                                <label className="text-[10px] font-black text-[#10b981] uppercase block mb-1.5">1. CHỌN PHIẾU CHI BANK (TỰ ĐỘNG)</label>
                                <select 
                                    value={reconSelectedTxId} 
                                    onChange={e => setReconSelectedTxId(e.target.value)} 
                                    disabled={isSaving} 
                                    className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-3 text-[12px] text-white font-bold outline-none focus:border-[#10b981] cursor-pointer shadow-inner"
                                >
                                    <option value="">-- Chọn Giao Dịch Chi Tiền (30 Ngày) --</option>
                                    {recentBankTxs.map(t => (
                                        <option key={t.id} value={t.id}>
                                            {(t.date||'').split('T')[0].split('-').reverse().join('/')} - {displayMoney(t.amount)}đ - {t.note || t.title}
                                        </option>
                                    ))}
                                </select>
                            </div>

                            {/* Chon Phieu Nhap */}
                            <div>
                                <div className="flex justify-between items-center mb-1.5">
                                    <label className="text-[10px] font-black text-amber-500 uppercase block">2. CHỌN CÁC PHIẾU NHẬP CẦN XÓA NỢ</label>
                                    <span className="text-[9px] bg-[#1a1a1a] border border-[#333] px-2 py-0.5 rounded text-gray-400 font-bold">Đã chọn: {reconSelectedImportIds.length}</span>
                                </div>
                                <div className="max-h-48 overflow-y-auto custom-scrollbar bg-[#0a0a0a] border border-[#333] rounded-xl p-2 space-y-2">
                                    {(() => {
                                        const unpaidLogs = getImportHistory(reconcileSupplier.name).filter(l => !l.isPaid && Number(l.totalAmount) > 0);
                                        if (unpaidLogs.length === 0) return <div className="text-center text-[10px] text-gray-500 italic py-4">Không có Phiếu Nhập nào đang nợ.</div>;
                                        return unpaidLogs.map(log => {
                                            const isChecked = reconSelectedImportIds.includes(log.id);
                                            return (
                                                <div 
                                                    key={log.id} 
                                                    onClick={() => handleToggleImport(log.id)}
                                                    className={`p-2.5 rounded-lg border cursor-pointer flex items-start gap-3 transition-colors ${isChecked ? 'bg-amber-500/10 border-amber-500/50' : 'bg-[#141414] border-[#333] hover:border-[#444]'}`}
                                                >
                                                    <div className={`w-4 h-4 rounded shrink-0 mt-0.5 flex items-center justify-center border ${isChecked ? 'bg-amber-500 border-amber-500' : 'border-gray-600'}`}>
                                                        {isChecked && <i className="fas fa-check text-[#0a0a0a] text-[10px]"></i>}
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-white font-black text-[12px]">{displayMoney(log.totalAmount)}đ</span>
                                                            <span className="text-gray-500 text-[10px]">{(log.date||'').split('T')[0].split('-').reverse().join('/')}</span>
                                                        </div>
                                                        <div className="text-gray-400 text-[10px] truncate mt-0.5"><span className="text-gray-600 font-mono">[{log.id}]</span> {log.note}</div>
                                                    </div>
                                                </div>
                                            );
                                        });
                                    })()}
                                </div>
                            </div>

                            {/* Cán Cân Kế Toán */}
                            {(() => {
                                const tx = recentBankTxs.find(t => t.id === reconSelectedTxId);
                                const txAmount = Number(tx?.amount || 0);
                                const allImports = getImportHistory(reconcileSupplier.name);
                                const selectedImports = allImports.filter(log => reconSelectedImportIds.includes(log.id));
                                const importsAmount = selectedImports.reduce((sum, log) => sum + Number(log.totalAmount || 0), 0);
                                const balanceDiff = txAmount - importsAmount;
                                
                                let balanceColor = 'text-gray-400';
                                let balanceMsg = 'Vui lòng chọn Phiếu Chi & Phiếu Nhập';
                                let canSave = false;

                                if (reconSelectedTxId && reconSelectedImportIds.length > 0) {
                                    if (balanceDiff === 0) {
                                        balanceColor = 'text-[#10b981]'; // Xanh lá
                                        balanceMsg = 'Khớp lệnh tuyệt đối. Sẵn sàng lưu.';
                                        canSave = true;
                                    } else if (balanceDiff > 0) {
                                        balanceColor = 'text-yellow-400'; // Vàng
                                        balanceMsg = 'Tiền dư sẽ ghi nhận vào phí giao dịch.';
                                        canSave = true;
                                    } else {
                                        balanceColor = 'text-rose-500'; // Đỏ gắt
                                        balanceMsg = 'Phiếu chi không đủ để thanh toán.';
                                        canSave = false;
                                    }
                                }

                                return (
                                    <div className="bg-[#0a0a0a] p-3 rounded-xl border border-[#333] mt-4">
                                        <div className="flex justify-between items-center text-[10px] font-black uppercase text-gray-500 mb-2">
                                            <span><i className="fas fa-balance-scale mr-1"></i> CÁN CÂN KẾ TOÁN</span>
                                            <span className={balanceColor}>Lệch: {displayMoney(Math.abs(balanceDiff))}đ</span>
                                        </div>
                                        <div className="flex justify-between items-center text-[12px] font-black">
                                            <div className="text-gray-400">P.Chi Bank: <span className="text-[#10b981]">{displayMoney(txAmount)}</span></div>
                                            <div className="text-[#333]">|</div>
                                            <div className="text-gray-400">Nợ Phiếu: <span className="text-amber-500">{displayMoney(importsAmount)}</span></div>
                                        </div>
                                        <div className={`text-[9px] mt-2 text-center font-bold ${balanceColor}`}>
                                            {balanceMsg}
                                        </div>
                                        <div className="pt-3 mt-3 border-t border-[#222]">
                                            <button 
                                                onClick={handleSaveReconciliation} 
                                                disabled={isSaving || !canSave} 
                                                className={`w-full py-3 font-black rounded-xl text-[12px] tracking-widest uppercase transition-all flex items-center justify-center gap-2 active:scale-95 ${canSave ? 'bg-[#10b981] hover:bg-emerald-500 text-black shadow-[0_0_15px_rgba(16,185,129,0.2)]' : 'bg-[#222] text-gray-500 cursor-not-allowed'}`}
                                            >
                                                {isSaving ? <><i className="fas fa-spinner fa-spin"></i> Đang khớp lệnh...</> : <><i className="fas fa-shield-check"></i> XÁC NHẬN KHỚP LỆNH</>}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
});
</script>
