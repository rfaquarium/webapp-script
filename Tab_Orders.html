<script type="text/babel">
// =========================================================================
// 📦 FILE: Tab_Orders.txt
// CHỨC NĂNG: Quản lý danh sách đơn hàng, bộ lọc trạng thái, bàn giao hàng loạt
// NGUYÊN TẮC: Bảo toàn 100% logic hoàn kho, nhập bù tồn kho và các state bộ lọc
// =========================================================================
// -------------------------------------------------------------------------

// ---------------------------------// COMPONENT: MÁY QUÉT ĐƠN HOÀN (EMAIL, FILE EXCEL ORDER.ALL, FILE PDF BIÊN BẢN, SÚNG MÃ VẠCH)
function ReturnScannerModal({ onClose, orders, pushDeltas, triggerToast }) {
    const [scanVal, setScanVal] = React.useState('');
    const [isProcessing, setIsProcessing] = React.useState(false);
    
    const [preview, setPreview] = React.useState('');
    const [scannedOrders, setScannedOrders] = React.useState([]);
    const [unmatchedCodes, setUnmatchedCodes] = React.useState([]);

    const inputRef = React.useRef(null);
    const fileInputRef = React.useRef(null);
    const lastScanRef = React.useRef({ code: '', time: 0 });

    React.useEffect(() => {
        if (inputRef.current && !isProcessing && !preview) inputRef.current.focus();
    }, [isProcessing, preview]);

    const processCode = async (rawCode) => {
        if (!rawCode) return;
        let originalRaw = String(rawCode).trim();
        let extractedCode = originalRaw;
        const isUrl = originalRaw.indexOf('http') > -1;
        
        if (isUrl) {
            const urlMatches = originalRaw.match(/(?:id|orderId|order_id|tracking_number|mvd|key)=([A-Za-z0-9_-]+)/i);
            if (urlMatches && urlMatches[1]) extractedCode = urlMatches[1];
        } else if (originalRaw.indexOf('|') > -1 || originalRaw.indexOf(';') > -1 || originalRaw.indexOf(':') > -1) {
            const parts = originalRaw.split(/[\s|;:,-]+/);
            const candidate = parts.find(p => p.trim().length >= 8 && /^[A-Za-z0-9_-]+$/.test(p.trim()));
            if (candidate) extractedCode = candidate;
        }

        const code = String(extractedCode).trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!code || code.length < 4) return;

        const now = Date.now();
        if (lastScanRef.current.code === code && (now - lastScanRef.current.time) < 3000) return;
        lastScanRef.current = { code, time: now };

        setIsProcessing(true);
        
        const order = orders.find(o => {
            const rawOrderCode = String(o.orderCode || '').toUpperCase();
            const rawShippingCode = String(o.shippingCode || '').toUpperCase();
            const phone = String(o.phone || '').replace(/[^0-9]/g, '');
            let maDon = rawOrderCode.replace(/[^A-Z0-9]/g, '');
            let mvd = rawShippingCode.replace(/[^A-Z0-9]/g, '');
            if (rawOrderCode.indexOf('MVĐ') > -1) {
                const parts = rawOrderCode.split('MVĐ');
                maDon = parts[0].replace(/[^A-Z0-9]/g, '');
                if (parts[1]) mvd = parts[1].replace(/[^A-Z0-9]/g, '') || mvd;
            }
            if (mvd && (mvd === code || mvd.indexOf(code) > -1 || code.indexOf(mvd) > -1)) return true;
            if (maDon && (maDon === code || maDon.indexOf(code) > -1 || code.indexOf(maDon) > -1)) return true;
            if (phone && phone.length >= 8 && (phone.indexOf(code) > -1 || code.indexOf(phone) > -1)) return true;
            const cleanOrderCode = rawOrderCode.replace(/[^A-Z0-9]/g, '');
            if (cleanOrderCode.indexOf(code) > -1 || code.indexOf(cleanOrderCode) > -1) return true;
            return false;
        });

        if (order) {
            const currentStatus = String(order.status || '').toUpperCase().trim();
            if (currentStatus === 'HÀNG HOÀN' || currentStatus.indexOf('HOÀN CHỜ XỬ') > -1 || currentStatus.indexOf('HOÀN KHO') > -1) {
                triggerToast('Đơn này đã ở trạng thái Hoàn rồi!', 'fa-info-circle', 'warning');
            } else {
                try {
                    const newOrder = { ...order, status: 'Hàng Hoàn' };
                    await pushDeltas({ orders: [newOrder] }, `Đã nhận hoàn đơn: ${order.orderCode}!`, 'fa-undo');
                    triggerToast(`Thành công! Đơn [${order.orderCode}] đã chuyển về Kho Hoàn.`, 'fa-check', 'success');
                } catch (err) { triggerToast('Lỗi kết nối đồng bộ kho hoàn!', 'fa-times', 'danger'); }
            }
        } else {
            triggerToast(`Không tìm thấy đơn khớp mã: ${code}`, 'fa-exclamation-triangle', 'danger');
        }
        
        if (typeof setScanVal === 'function') setScanVal('');
        setIsProcessing(false);
    };

    const handleScanInput = (e) => { if (e.key === 'Enter') processCode(scanVal); };

    const handleEmailScan = async () => {
        setIsProcessing(true);
        triggerToast('Đang tự động quét email đơn hoàn...', 'fa-sync fa-spin', 'info');
        try {
            const res = await runGAS('scanReturnedOrdersFromEmail');
            if (res && res.success) {
                triggerToast(res.message, 'fa-check', 'success');
                if (res.count > 0) window.dispatchEvent(new CustomEvent('triggerReloadData'));
                onClose();
            } else {
                triggerToast(res?.message || 'Lỗi quét email đơn hoàn', 'fa-times', 'danger');
            }
        } catch (e) { triggerToast('Lỗi kết nối Server', 'fa-times', 'danger'); }
        setIsProcessing(false);
    };

    const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fName = file.name.toLowerCase();
        setIsProcessing(true);

        if (fName.endsWith('.xlsx') || fName.endsWith('.xls') || fName.endsWith('.csv')) {
            triggerToast("Đang phân tích file Excel Order.all...", "fa-spinner fa-spin", "info");
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const wb = window.XLSX.read(data, { type: 'array' });
                    let sheetName = wb.SheetNames[0];
                    const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
                    
                    if (rows.length < 2) throw new Error("File rỗng");
                    let headerIdx = 0;
                    for (let i = 0; i < Math.min(15, rows.length); i++) {
                        const rStr = (rows[i] || []).join(' ').toLowerCase();
                        if (rStr.includes('mã đơn') || rStr.includes('order id')) { headerIdx = i; break; }
                    }
                    const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());
                    const iCode = headers.findIndex(h => h.includes('mã đơn') || h.includes('order id'));
                    let statusCols = [];
                    headers.forEach((h, idx) => {
                        if (h.includes('trạng thái') || h.includes('lý do') || h.includes('status') || h.includes('hoàn tiền')) statusCols.push(idx);
                    });

                    let foundOrders = [];
                    let notFound = [];

                    for (let i = headerIdx + 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (iCode < 0 || !cols[iCode]) continue;
                        let oCode = String(cols[iCode]).trim();
                        if (oCode.length < 5) {
                            for(let c=0; c<cols.length; c++) {
                                const val = String(cols[c] || '').trim();
                                if (val.length >= 8 && /[A-Z0-9]{8,}/i.test(val) && !val.includes(' ') && !val.includes(':')) {
                                    oCode = val; break;
                                }
                            }
                        }
                        if (!oCode || oCode.length < 5 || oCode.toLowerCase().includes('mã đơn')) continue;

                        let rowStatus = '';
                        statusCols.forEach(idx => { if (cols[idx]) rowStatus += String(cols[idx]).toLowerCase() + ' '; });

                        if ((rowStatus.includes('hoàn') && !rowStatus.includes('hoàn thành') && !rowStatus.includes('hoàn tất')) || rowStatus.includes('trả hàng') || rowStatus.includes('return') || rowStatus.includes('refund')) {
                            const cleanCode = oCode.split(' | ')[0].trim().toUpperCase();
                            const matchOrder = orders.find(o => {
                                const dbCode = String(o.orderCode || '').toUpperCase();
                                if (cleanCode.length < 5) return dbCode === cleanCode;
                                return dbCode === cleanCode || dbCode.includes(cleanCode);
                            });
                            if (matchOrder) {
                                const currentStatus = String(matchOrder.status || '').toUpperCase().trim();
                                if (currentStatus !== 'HÀNG HOÀN' && !currentStatus.includes('HOÀN CHỜ XỬ') && !currentStatus.includes('HOÀN KHO')) {
                                    if (!foundOrders.find(fo => fo.id === matchOrder.id)) foundOrders.push(matchOrder);
                                }
                            } else {
                                if (!notFound.includes(cleanCode)) notFound.push(cleanCode);
                            }
                        }
                    }

                    setScannedOrders(foundOrders);
                    setUnmatchedCodes(notFound);
                    setPreview('file_loaded');
                    if (foundOrders.length > 0) {
                        triggerToast(`Phân tích xong! Khớp ${foundOrders.length} đơn hoàn hợp lệ.`, "fa-check", "success");
                    } else {
                        triggerToast(`Không tìm thấy đơn hoàn mới nào cần cập nhật trong file!`, "fa-info", "warning");
                    }
                } catch (err) {
                    triggerToast("Lỗi đọc tệp Excel!", "fa-times", "danger");
                } finally {
                    e.target.value = '';
                    setIsProcessing(false);
                }
            };
            reader.readAsArrayBuffer(file);
            return;
        }

        if (fName.endsWith('.pdf')) {
            triggerToast("AI đang đọc dữ liệu PDF biên bản...", "fa-spinner fa-spin", "info");
            try {
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                setPreview('file_loaded');
                let textResult = "";
                if (typeof runGAS === 'function') {
                    try { textResult = await runGAS('processOCR', base64Data); } catch (e) { textResult = ""; }
                }

                const matches = textResult.match(/(SPXVN[\s-]*[A-Z0-9]+|SPX[\s-]*[A-Z0-9]+|GYX[\s-]*[A-Z0-9]+|JT[\s-]*[A-Z0-9]+|GHN[\s-]*[A-Z0-9]+|[0-9]{6}[\s-]*[A-Z0-9]{8,9})/gi) || [];
                const uniqueCodes = [...new Set(matches.map(c => c.replace(/[^A-Z0-9]/gi, '').toUpperCase()))];

                let foundOrders = []; let notFound = [];
                uniqueCodes.forEach(code => {
                    const order = orders.find(o => String(o.orderCode || '').toUpperCase().includes(code) || String(o.shippingCode || '').toUpperCase().includes(code));
                    if (order) {
                        const currentStatus = String(order.status || '').toUpperCase().trim();
                        if (currentStatus !== 'HÀNG HOÀN' && !currentStatus.includes('HOÀN KHO')) {
                            if (!foundOrders.find(fo => fo.id === order.id)) foundOrders.push(order);
                        }
                    } else { notFound.push(code); }
                });

                setScannedOrders(foundOrders);
                setUnmatchedCodes(notFound);
            } catch (err) { triggerToast("Lỗi phân tích tệp PDF!", "fa-times", "danger"); }
            finally { e.target.value = ''; setIsProcessing(false); }
            return;
        }

        triggerToast("Vui lòng chọn file Excel Order.all (.xlsx/.xls) hoặc PDF!", "fa-times", "danger");
        e.target.value = ''; setIsProcessing(false);
    };

    const confirmBulkReturn = async () => {
        if (scannedOrders.length === 0) return;
        setIsProcessing(true);
        try {
            const updatedOrders = scannedOrders.map(o => ({ ...o, status: 'Hàng Hoàn' }));
            await pushDeltas({ orders: updatedOrders }, `Đã chuyển ${updatedOrders.length} đơn về Hàng Hoàn!`, 'fa-undo');
            triggerToast(`Thành công! Đã chuyển ${updatedOrders.length} đơn sang Hàng Hoàn.`, 'fa-check', 'success');
            onClose();
        } catch (err) { triggerToast('Lỗi đồng bộ!', 'fa-times', 'danger'); }
        setIsProcessing(false);
    };

    const resetScan = () => {
        setPreview('');
        setScannedOrders([]);
        setUnmatchedCodes([]);
    };

    return (
        <div className="fixed inset-0 bg-black/95 flex items-center justify-center z-[9999] p-4 backdrop-blur-md animate-fade-in" onClick={() => onClose()}>
            <div className="bg-[#141414] border border-purple-500/50 w-full max-w-md rounded-3xl p-6 shadow-[0_0_50px_rgba(168,85,247,0.2)] text-center relative animate-slide-up flex flex-col" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} disabled={isProcessing} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-500 hover:text-white hover:bg-rose-500 flex items-center justify-center transition-all z-20"><i className="fas fa-times text-sm"></i></button>
                
                <h3 className="font-black text-white text-[15px] uppercase tracking-widest mb-1 flex items-center justify-center gap-2 mt-2">
                    <i className="fas fa-undo text-purple-400"></i> Quét Đơn Hoàn Tự Động
                </h3>

                {preview ? (
                    <div className="mt-4 flex flex-col space-y-4 animate-fade-in text-left">
                        <div className="relative w-full h-24 bg-black rounded-xl border border-[#333] overflow-hidden flex items-center justify-center shadow-inner">
                            <div className="flex flex-col items-center justify-center text-purple-400">
                                <i className="fas fa-file-excel text-3xl mb-1"></i>
                                <span className="text-[11px] font-black uppercase tracking-widest text-white">Đã Tải & Đọc File Báo Cáo</span>
                            </div>
                            <button onClick={resetScan} disabled={isProcessing} className="absolute top-3 right-3 w-8 h-8 bg-black/80 rounded-full text-white border border-white/20 flex items-center justify-center hover:bg-rose-500 transition-colors shadow-md"><i className="fas fa-redo text-xs"></i></button>
                        </div>

                        <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-3">
                            <div className="text-[10px] font-black text-purple-400 uppercase tracking-widest border-b border-[#333] pb-2 mb-2 flex justify-between">
                                <span><i className="fas fa-check-circle mr-1"></i> Khớp {scannedOrders.length} Đơn Hoàn</span>
                            </div>
                            {scannedOrders.length > 0 ? (
                                <div className="max-h-[140px] overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                                    {scannedOrders.map((o, idx) => (
                                        <div key={idx} className="bg-[#141414] border border-[#333] p-2 rounded-lg flex justify-between items-center hover:border-purple-500/50 transition-colors">
                                            <span className="text-[10px] text-white font-mono font-black truncate">{o.orderCode.split(' | ')[0]}</span>
                                            <span className="text-[9px] bg-[#222] px-1.5 py-0.5 rounded text-gray-400 truncate max-w-[120px]">{o.customer}</span>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="text-gray-500 text-[10px] font-bold py-2 text-center">Không có đơn hoàn mới nào khớp!</div>
                            )}
                        </div>

                        {unmatchedCodes.length > 0 && (
                            <div className="bg-rose-500/5 border border-rose-500/20 rounded-xl p-3">
                                <div className="text-[10px] font-black text-rose-400 uppercase tracking-widest border-b border-rose-500/20 pb-1 mb-1.5">
                                    <i className="fas fa-exclamation-triangle mr-1"></i> Không Khớp {unmatchedCodes.length} Mã Trong File
                                </div>
                                <div className="flex flex-wrap gap-1 max-h-[50px] overflow-y-auto custom-scrollbar">
                                    {unmatchedCodes.map((code, idx) => (
                                        <span key={idx} className="text-[9px] bg-rose-500/10 text-rose-400 px-1 py-0.5 rounded font-mono">{code}</span>
                                    ))}
                                </div>
                            </div>
                        )}

                        <button onClick={confirmBulkReturn} disabled={isProcessing || scannedOrders.length === 0} className={`w-full py-3.5 rounded-xl font-black text-[12px] tracking-wide shadow-md flex items-center justify-center gap-2 transition-all active:scale-95 mt-1 ${isProcessing || scannedOrders.length === 0 ? 'bg-[#333] text-gray-500' : 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white hover:opacity-90 shadow-purple-900/30'}`}>
                            {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> ĐANG CẬP NHẬT TRẠNG THÁI...</> : `XÁC NHẬN ĐƯA ${scannedOrders.length} ĐƠN VỀ HÀNG HOÀN`}
                        </button>
                    </div>
                ) : (
                    <>
                        <p className="text-gray-400 text-[11px] mb-3 leading-relaxed mt-1">Dùng súng bắn mã vạch, bấm Quét Email tự động, hoặc ném file Excel Order.all / PDF vào đây.</p>

                        <div className="w-full flex flex-col items-center">
                            <div className="relative w-full mb-2">
                                <input 
                                    ref={inputRef} type="text" value={scanVal} onChange={e => setScanVal(e.target.value)} onKeyDown={handleScanInput} disabled={isProcessing}
                                    placeholder="Dùng Súng Tít vào Mã Đơn / MVĐ"
                                    className="w-full bg-[#0a0a0a] border-2 border-[#333] focus:border-purple-500 rounded-xl pl-10 pr-4 py-3 text-center font-mono text-[13px] font-black text-white outline-none focus:shadow-[0_0_20px_rgba(168,85,247,0.3)] transition-all uppercase placeholder:font-sans placeholder:font-medium placeholder:normal-case placeholder:text-[11px]"
                                />
                                <i className="fas fa-barcode absolute left-4 top-1/2 -translate-y-1/2 text-purple-400 text-base"></i>
                            </div>
                        </div>

                        <div className="mt-3 border-t border-[#333] pt-4 flex flex-col gap-2.5">
                            <button onClick={handleEmailScan} disabled={isProcessing} className="w-full py-3 rounded-xl font-black text-[12px] uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:opacity-90 shadow-md active:scale-95">
                                <i className="fas fa-envelope-open-text text-base"></i> 1. QUÉT EMAIL ĐƠN HOÀN TỰ ĐỘNG
                            </button>
                            <button onClick={() => fileInputRef.current?.click()} disabled={isProcessing} className="w-full py-3 rounded-xl font-black text-[12px] uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2 bg-gradient-to-br from-purple-500/20 to-indigo-500/20 border border-purple-500/40 text-purple-300 hover:bg-purple-600 hover:text-white active:scale-95">
                                <i className="fas fa-file-excel text-base"></i> 2. TẢI FILE EXCEL (ORDER.ALL) / PDF
                            </button>
                            <input ref={fileInputRef} type="file" accept=".xlsx, .xls, .csv, .pdf" className="hidden" onChange={handleFileUpload} disabled={isProcessing} />
                        </div>
                    </>
                )}
            </div>
        </div>
    );
}

// COMPONENT: MÁY QUÉT ĐƠN HỦY (EMAIL, FILE EXCEL ORDER.ALL)
function CancelScannerModal({ onClose, orders, prodItems, pushDeltas, triggerToast }) {
    const [isProcessing, setIsProcessing] = React.useState(false);
    const [preview, setPreview] = React.useState('');
    const [scannedOrders, setScannedOrders] = React.useState([]);
    const [unmatchedCodes, setUnmatchedCodes] = React.useState([]);
    const fileInputRef = React.useRef(null);

    const handleEmailScan = async () => {
        setIsProcessing(true);
        triggerToast('Đang tự động quét email đơn hủy...', 'fa-sync fa-spin', 'info');
        try {
            const res = await runGAS('scanCancelledOrdersFromEmail');
            if (res && res.success) {
                triggerToast(res.message, 'fa-check', 'success');
                if (res.count > 0) window.dispatchEvent(new CustomEvent('triggerReloadData'));
                onClose();
            } else {
                triggerToast(res?.message || 'Lỗi quét email đơn hủy', 'fa-times', 'danger');
            }
        } catch (e) { triggerToast('Lỗi kết nối Server', 'fa-times', 'danger'); }
        setIsProcessing(false);
    };

    const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessing(true);
        triggerToast("Đang đọc file Excel Order.all...", "fa-spinner fa-spin", "info");

        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const data = new Uint8Array(evt.target.result);
                const wb = window.XLSX.read(data, { type: 'array' });
                let sheetName = wb.SheetNames[0];
                const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
                
                if (rows.length < 2) throw new Error("File rỗng");
                let headerIdx = 0;
                for (let i = 0; i < Math.min(15, rows.length); i++) {
                    const rStr = (rows[i] || []).join(' ').toLowerCase();
                    if (rStr.includes('mã đơn') || rStr.includes('order id')) { headerIdx = i; break; }
                }
                const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());
                const iCode = headers.findIndex(h => h.includes('mã đơn') || h.includes('order id'));
                let statusCols = [];
                headers.forEach((h, idx) => {
                    if (h.includes('trạng thái') || h.includes('lý do') || h.includes('status') || h.includes('hủy') || h.includes('huỷ')) statusCols.push(idx);
                });

                let foundOrders = [];
                let notFound = [];

                for (let i = headerIdx + 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (iCode < 0 || !cols[iCode]) continue;
                    let oCode = String(cols[iCode]).trim();
                    if (oCode.length < 5) {
                        for(let c=0; c<cols.length; c++) {
                            const val = String(cols[c] || '').trim();
                            if (val.length >= 8 && /[A-Z0-9]{8,}/i.test(val) && !val.includes(' ') && !val.includes(':')) {
                                oCode = val; break;
                            }
                        }
                    }
                    if (!oCode || oCode.length < 5 || oCode.toLowerCase().includes('mã đơn')) continue;

                    let rowStatus = '';
                    statusCols.forEach(idx => { if (cols[idx]) rowStatus += String(cols[idx]).toLowerCase() + ' '; });

                    if (rowStatus.includes('hủy') || rowStatus.includes('huỷ') || rowStatus.includes('cancel')) {
                        const cleanCode = oCode.split(' | ')[0].trim().toUpperCase();
                        const matchOrder = orders.find(o => {
                            const dbCode = String(o.orderCode || '').toUpperCase();
                            if (cleanCode.length < 5) return dbCode === cleanCode;
                            return dbCode === cleanCode || dbCode.includes(cleanCode);
                        });
                        if (matchOrder) {
                            const currentStatus = String(matchOrder.status || '').toUpperCase().trim();
                            if (currentStatus !== 'ĐƠN HUỶ' && !currentStatus.includes('HỦY') && !currentStatus.includes('HUỶ')) {
                                if (!foundOrders.find(fo => fo.id === matchOrder.id)) foundOrders.push(matchOrder);
                            }
                        } else {
                            if (!notFound.includes(cleanCode)) notFound.push(cleanCode);
                        }
                    }
                }

                setScannedOrders(foundOrders);
                setUnmatchedCodes(notFound);
                setPreview('file_loaded');
                if (foundOrders.length > 0) {
                    triggerToast(`Phân tích xong! Khớp ${foundOrders.length} đơn hủy hợp lệ.`, "fa-check", "success");
                } else {
                    triggerToast(`Không tìm thấy đơn hủy mới nào cần cập nhật trong file!`, "fa-info", "warning");
                }
            } catch (err) {
                triggerToast("Lỗi đọc tệp Excel!", "fa-times", "danger");
            } finally {
                e.target.value = '';
                setIsProcessing(false);
            }
        };
        reader.readAsArrayBuffer(file);
    };

    const confirmBulkCancel = async () => {
        if (scannedOrders.length === 0) return;
        setIsProcessing(true);
        try {
            const updatedOrders = scannedOrders.map(o => ({ ...o, status: 'Đơn Huỷ' }));
            
            let updatedProdItems = [];
            scannedOrders.forEach(order => {
                const relatedProds = (prodItems || []).filter(p => p.orderId && p.orderId.includes(order.id));
                relatedProds.forEach(p => {
                    const isComp = p.fulfilledFromStock === true || String(p.fulfilledFromStock).toUpperCase() === 'TRUE';
                    // Huỷ lệnh với đơn bù kho (isComp == true), còn sản xuất mới thì GIỮ LẠI (status giữ nguyên)
                    if (isComp) {
                        updatedProdItems.push({ ...p, status: 'Đã Huỷ' });
                    }
                });
            });

            let payload = { orders: updatedOrders };
            if (updatedProdItems.length > 0) payload.prodItems = updatedProdItems;

            await pushDeltas(payload, `Đã chuyển ${updatedOrders.length} đơn sang Đơn Hủy!`, 'fa-ban');
            triggerToast(`Thành công! Đã chuyển ${updatedOrders.length} đơn sang Đơn Hủy.`, 'fa-check', 'success');
            onClose();
        } catch (err) { triggerToast('Lỗi đồng bộ!', 'fa-times', 'danger'); }
        setIsProcessing(false);
    };

    const resetScan = () => {
        setPreview('');
        setScannedOrders([]);
        setUnmatchedCodes([]);
    };

    return (
        <div className="fixed inset-0 bg-black/95 flex items-center justify-center z-[9999] p-4 backdrop-blur-md animate-fade-in" onClick={() => onClose()}>
            <div className="bg-[#141414] border border-rose-500/50 w-full max-w-md rounded-3xl p-6 shadow-[0_0_50px_rgba(244,63,94,0.2)] text-center relative animate-slide-up flex flex-col" onClick={e => e.stopPropagation()}>
                <button onClick={onClose} disabled={isProcessing} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#222] text-gray-500 hover:text-white hover:bg-rose-500 flex items-center justify-center transition-all z-20"><i className="fas fa-times text-sm"></i></button>
                
                <h3 className="font-black text-white text-[15px] uppercase tracking-widest mb-1 flex items-center justify-center gap-2 mt-2">
                    <i className="fas fa-ban text-rose-500"></i> Quét Đơn Hủy Tự Động
                </h3>

                {preview ? (
                    <div className="mt-4 flex flex-col space-y-4 animate-fade-in text-left">
                        <div className="relative w-full h-24 bg-black rounded-xl border border-[#333] overflow-hidden flex items-center justify-center shadow-inner">
                            <div className="flex flex-col items-center justify-center text-rose-400">
                                <i className="fas fa-file-excel text-3xl mb-1"></i>
                                <span className="text-[11px] font-black uppercase tracking-widest text-white">Đã Tải & Đọc File Báo Cáo</span>
                            </div>
                            <button onClick={resetScan} disabled={isProcessing} className="absolute top-3 right-3 w-8 h-8 bg-black/80 rounded-full text-white border border-white/20 flex items-center justify-center hover:bg-rose-500 transition-colors shadow-md"><i className="fas fa-redo text-xs"></i></button>
                        </div>

                        <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-3">
                            <div className="text-[10px] font-black text-rose-400 uppercase tracking-widest border-b border-[#333] pb-2 mb-2 flex justify-between">
                                <span><i className="fas fa-check-circle mr-1"></i> Khớp {scannedOrders.length} Đơn Hủy</span>
                            </div>
                            {scannedOrders.length > 0 ? (
                                <div className="max-h-[140px] overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                                    {scannedOrders.map((o, idx) => (
                                        <div key={idx} className="bg-[#141414] border border-[#333] p-2 rounded-lg flex justify-between items-center hover:border-rose-500/50 transition-colors">
                                            <span className="text-[10px] text-white font-mono font-black truncate">{o.orderCode.split(' | ')[0]}</span>
                                            <span className="text-[9px] bg-[#222] px-1.5 py-0.5 rounded text-gray-400 truncate max-w-[120px]">{o.customer}</span>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="text-gray-500 text-[10px] font-bold py-2 text-center">Không có đơn hủy mới nào khớp!</div>
                            )}
                        </div>

                        {unmatchedCodes.length > 0 && (
                            <div className="bg-rose-500/5 border border-rose-500/20 rounded-xl p-3">
                                <div className="text-[10px] font-black text-rose-400 uppercase tracking-widest border-b border-rose-500/20 pb-1 mb-1.5">
                                    <i className="fas fa-exclamation-triangle mr-1"></i> Không Khớp {unmatchedCodes.length} Mã Trong File
                                </div>
                                <div className="flex flex-wrap gap-1 max-h-[50px] overflow-y-auto custom-scrollbar">
                                    {unmatchedCodes.map((code, idx) => (
                                        <span key={idx} className="text-[9px] bg-rose-500/10 text-rose-400 px-1 py-0.5 rounded font-mono">{code}</span>
                                    ))}
                                </div>
                            </div>
                        )}

                        <button onClick={confirmBulkCancel} disabled={isProcessing || scannedOrders.length === 0} className={`w-full py-3.5 rounded-xl font-black text-[12px] tracking-wide shadow-md flex items-center justify-center gap-2 transition-all active:scale-95 mt-1 ${isProcessing || scannedOrders.length === 0 ? 'bg-[#333] text-gray-500' : 'bg-gradient-to-r from-rose-600 to-red-600 text-white hover:opacity-90 shadow-rose-900/30'}`}>
                            {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> ĐANG CẬP NHẬT TRẠNG THÁI...</> : `XÁC NHẬN ĐƯA ${scannedOrders.length} ĐƠN VỀ ĐƠN HỦY`}
                        </button>
                    </div>
                ) : (
                    <>
                        <p className="text-gray-400 text-[11px] mb-3 leading-relaxed mt-1">Bấm Quét Email tự động để phát hiện email hủy đơn, hoặc ném file Excel Order.all vào đây.</p>

                        <div className="mt-3 border-t border-[#333] pt-4 flex flex-col gap-2.5">
                            <button onClick={handleEmailScan} disabled={isProcessing} className="w-full py-3.5 rounded-xl font-black text-[12px] uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2 bg-gradient-to-r from-rose-600 to-red-600 text-white hover:opacity-90 shadow-md active:scale-95">
                                <i className="fas fa-envelope-open-text text-base"></i> 1. QUÉT EMAIL ĐƠN HỦY TỰ ĐỘNG
                            </button>
                            <button onClick={() => fileInputRef.current?.click()} disabled={isProcessing} className="w-full py-3.5 rounded-xl font-black text-[12px] uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2 bg-gradient-to-br from-rose-500/20 to-red-500/20 border border-rose-500/40 text-rose-300 hover:bg-rose-600 hover:text-white active:scale-95">
                                <i className="fas fa-file-excel text-base"></i> 2. TẢI FILE EXCEL (ORDER.ALL)
                            </button>
                            <input ref={fileInputRef} type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleFileUpload} disabled={isProcessing} />
                        </div>
                    </>
                )}
            </div>
        </div>
    );
}

// COMPONENT BỌC ĐƠN HÀNG THÊM LOGIC SLA VÀ PHÂN LOẠI
const RFOrderWrapper = React.memo(({ order, prods, ...props }) => {
    const hasTank = prods.some(p => String(p.name).toLowerCase().includes('bể') || String(p.category).toLowerCase() === 'bể kính');
    const hasLayout = prods.some(p => String(p.name).toLowerCase().includes('bố cục') || String(p.category).toLowerCase() === 'layout');
    const hasAcc = prods.some(p => String(p.name).toLowerCase().includes('phụ kiện') || String(p.name).toLowerCase().includes('lọc') || String(p.name).toLowerCase().includes('đèn') || String(p.name).toLowerCase().includes('bơm'));

    const isEcom = String(order.channel).toUpperCase().includes('SHOPEE') || String(order.channel).toUpperCase().includes('TIKTOK');
    const createdDate = new Date(order.createdAt || order.date || Date.now());
    let deadline = new Date(createdDate);
    if (isEcom) {
        deadline.setDate(deadline.getDate() + 1);
        deadline.setHours(14, 0, 0, 0); // Deadline 14:00 hôm sau
    } else {
        deadline.setDate(deadline.getDate() + 3); // Khách lẻ 3 ngày
    }
    
    const now = new Date();
    const isLate = now > deadline;
    const hoursLeft = Math.max(0, Math.round((deadline - now) / (1000 * 60 * 60)));
    const isDone = String(order._effectiveStatus || order.status || '').toUpperCase().includes('BÀN GIAO') || String(order._effectiveStatus || order.status || '').toUpperCase().includes('HOÀN THÀNH');

    return (
        <div className="relative mb-6 mt-4">
            <div className="absolute -top-3 left-4 flex gap-2 z-20">
                {hasTank && <RFBadge text="BỂ KÍNH" type="info" icon="fa-water" className="shadow-sm" />}
                {hasLayout && <RFBadge text="BỐ CỤC" type="success" icon="fa-leaf" className="shadow-sm" />}
                {hasAcc && <RFBadge text="PHỤ KIỆN" type="warning" icon="fa-plug" className="shadow-sm" />}
            </div>
            
            {!isDone && (
                <div className="absolute -top-3 right-4 z-20">
                    {isLate ? (
                        <RFBadge text="QUÁ HẠN SLA" type="danger" icon="fa-exclamation-triangle" className="animate-pulse shadow-[0_0_10px_rgba(225,29,72,0.5)]" />
                    ) : (
                        <RFBadge text={`SLA: ${hoursLeft}h`} type={hoursLeft < 12 ? 'warning' : 'primary'} icon="fa-clock" className="shadow-sm" />
                    )}
                </div>
            )}
            
            <OrderCardV2 order={order} prods={prods} {...props} />
        </div>
    );
});

const OrdersTab = React.memo(function OrdersTab({ 
    loadArchiveData,
    isArchiveLoaded,
    isLoadingArchive,
    attendance,
    orders, 
    prodItems, 
    packings, 
    erpProducts, 
    erpData, 
    isAdmin, 
    currentUser, 
    pushDeltas, 
    userConfigs, 
    triggerToast, 
    kpiConfig,
    configGiaLayout
}) {
    const [searchCode, setSearchCode] = React.useState('');
    const [filterTime, setFilterTime] = React.useState('Tháng Này');
    const [customMonth, setCustomMonth] = React.useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    });
    const [filterStatus, setFilterStatus] = React.useState('Chờ Sản Xuất');
    const [handoverSubTab, setHandoverSubTab] = React.useState('ALL');
    const [renderLimit, setRenderLimit] = React.useState(30);
    const [addingMode, setAddingMode] = React.useState(false);
    const [draftData, setDraftData] = React.useState(null); 
    const [selectedIds, setSelectedIds] = React.useState([]);
    
    // STATE KÍCH HOẠT MÁY QUÉT HOÀN HÀNG & HỦY ĐƠN
    const [isScanningReturn, setIsScanningReturn] = React.useState(false);
    const [isScanningCancel, setIsScanningCancel] = React.useState(false);
    const [isBulkFinanceOpen, setIsBulkFinanceOpen] = React.useState(false);
    const [showRules, setShowRules] = React.useState(false);
    const [editingOrder, setEditingOrder] = React.useState(null);
    const isCTV = localStorage.getItem('rf_role') === 'CTV' || localStorage.getItem('rf_role') === 'CỘNG TÁC VIÊN';

// Removed buggy handleImportShopeeOrders, use BulkFinanceModal instead

    React.useEffect(() => {
        setSelectedIds([]);
        setRenderLimit(30);
    }, [filterStatus, filterTime, searchCode]);

    // Tự động đồng bộ Hàng Hoàn (chưa đóng gói) -> Đơn Huỷ
    const autoFixRef = React.useRef(false);
    React.useEffect(() => {
        if (!orders || !packings || orders.length === 0 || autoFixRef.current) return;
        
        const toFix = orders.filter(o => {
            let eff = String(o.status || '').toUpperCase().trim();
            if (eff === 'HÀNG HOÀN' || eff === 'HOÀN' || eff.includes('HOÀN CHỜ XỬ')) {
                const isPacked = packings.some(p => p.orderId === o.id && (p.status === 'Done' || p.status === 'Hoàn thành' || p.status === 'Đã Xong'));
                return !isPacked;
            }
            return false;
        });

        if (toFix.length > 0) {
            autoFixRef.current = true; // Chỉ chạy 1 lần khi load app
            const updatedOrders = toFix.map(o => ({ ...o, status: 'ĐƠN HUỶ', updatedBy: currentUser || 'AUTO_FIX' }));
            setTimeout(() => {
                if (typeof pushDeltas === 'function') {
                    pushDeltas({ orders: updatedOrders }, `Hệ thống tự động đồng bộ ${toFix.length} đơn bị khách huỷ (chưa đóng gói) về trạng thái Đơn Hủy!`, 'fa-magic');
                }
            }, 5000); 
        }
    }, [orders, packings, currentUser, pushDeltas]);

    const toggleSelect = (orderId) => {
        setSelectedIds(prev => prev.includes(orderId) ? prev.filter(id => id !== orderId) : [...prev, orderId]);
    };

    const clearSelection = () => setSelectedIds([]);

    const isDateInRangeLocal = (dateStr, filterStr, customM) => {
        if (!dateStr) return false;
        if (filterStr === 'Tất Cả') return true;
        const d = new Date(dateStr); const today = new Date();
        if (filterStr === 'Hôm Nay') return d.toDateString() === today.toDateString();
        if (filterStr === 'Hôm Qua') { const y = new Date(today); y.setDate(y.getDate() - 1); return d.toDateString() === y.toDateString(); }
        if (filterStr === 'Tuần Này') {
            const currentDay = today.getDay();
            const diff = today.getDate() - currentDay + (currentDay === 0 ? -6 : 1);
            const monday = new Date(today.setDate(diff)); monday.setHours(0,0,0,0);
            const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
            return d >= monday && d <= sunday;
        }
        if (filterStr === 'Tháng Này') return d.getMonth() === new Date().getMonth() && d.getFullYear() === new Date().getFullYear();
        if (filterStr === 'Tháng Trước') {
            const lastMonth = new Date();
            lastMonth.setMonth(lastMonth.getMonth() - 1);
            return d.getMonth() === lastMonth.getMonth() && d.getFullYear() === lastMonth.getFullYear();
        }
        if (filterStr === 'Tuỳ Chỉnh' || filterStr === 'Chọn Tháng') {
            if (!customM) return true;
            const [year, month] = customM.split('-');
            return d.getFullYear() === parseInt(year, 10) && d.getMonth() === (parseInt(month, 10) - 1);
        }
        return true;
    };

    const baseFiltered = React.useMemo(() => {
        return (orders || []).map(o => {
            let eff = String(o._effectiveStatus || o.status || '').toUpperCase().trim();
            // Nếu là HÀNG HOÀN nhưng chưa hề đóng gói -> bản chất là ĐƠN HỦY
            if (eff === 'HÀNG HOÀN' || eff === 'HOÀN' || eff.includes('HOÀN CHỜ XỬ')) {
                const isPacked = (packings || []).some(p => p.orderId === o.id && (p.status === 'Done' || p.status === 'Hoàn thành' || p.status === 'Đã Xong'));
                if (!isPacked) {
                    eff = 'ĐƠN HUỶ';
                }
            }
            return { ...o, _effectiveStatus: eff };
        }).filter(o => {
            const isCtvOrder = String(o.channel || '').toUpperCase().includes('CỘNG TÁC VIÊN') || String(o.channel || '').toUpperCase() === 'CTV';
            if (isCTV && o.createdBy !== currentUser && o.sale !== currentUser && o.responsibleUser !== currentUser && !isCtvOrder) return false;
            if (o.channel === 'Sản Xuất Tồn' || o.channel === 'Sản Xuất Bù Kho') return false;
            
            const mvd = String(o.orderCode || '').toLowerCase();
            const cus = String(o.customer || '').toLowerCase();
            const matchSearch = mvd.includes(searchCode.toLowerCase()) || cus.includes(searchCode.toLowerCase());
            // Sử dụng reconciledAt để các đơn hoàn cũ khi được xử lý trong tháng này vẫn hiện ra
            const dateToFilter = o.reconciledAt || o.createdAt || o.date;
            return matchSearch && isDateInRangeLocal(dateToFilter, filterTime, customMonth);
        });
    }, [orders, searchCode, filterTime, customMonth, currentUser, packings]);

    const filtered = React.useMemo(() => {
        return baseFiltered.filter(o => {
            let effectiveStatus = String(o._effectiveStatus || o.status || '').toUpperCase().trim();
            
            if (effectiveStatus === 'CHỜ SẢN XUẤT' || effectiveStatus === 'QUÉT TỰ ĐỘNG' || effectiveStatus === 'ĐANG SẢN XUẤT' || effectiveStatus === 'SẴN SÀNG ĐÓNG GÓI') {
                const isGHNShipping = String(o.shippingMethod || '').trim() === 'Gửi GHN';
                const isGuiXeShipping = String(o.shippingMethod || '').trim() === 'Gửi Xe';
                let pureShippingCode = String(o.shippingCode || '').trim();
                if (!pureShippingCode && String(o.orderCode || '').includes('MVĐ:')) {
                    pureShippingCode = String(o.orderCode).split('MVĐ:')[1].trim();
                }
                const hasShippingCode = pureShippingCode && pureShippingCode.length >= 3;
                const shippingGatePassed = (!isGHNShipping && !isGuiXeShipping) || hasShippingCode;

                const related = (prodItems || []).filter(p => p.orderId && p.orderId.includes(o.id));
                if (related.length > 0) {
                    const allDone = related.every(p => {
                        const pStatus = String(p.status || '').toUpperCase().trim();
                        return pStatus === 'DONE' || pStatus === 'ĐÃ XONG' || pStatus === 'HỦY/VỠ' || pStatus === 'HOÀN KHO ĐẠT' || p.fulfilledFromStock === true || String(p.fulfilledFromStock).toUpperCase() === 'TRUE';
                    });
                    if (allDone && shippingGatePassed) {
                        effectiveStatus = 'SẴN SÀNG ĐÓNG GÓI';
                    } else {
                        effectiveStatus = 'CHỜ SẢN XUẤT';
                    }
                } else {
                    if (effectiveStatus === 'SẴN SÀNG ĐÓNG GÓI' && !shippingGatePassed) {
                        effectiveStatus = 'CHỜ SẢN XUẤT';
                    }
                }
            }
            
            const targetStatus = String(filterStatus).toUpperCase().trim();
            if (targetStatus === 'CHỜ SẢN XUẤT') {
                return effectiveStatus === 'CHỜ SẢN XUẤT' || effectiveStatus === 'QUÉT TỰ ĐỘNG' || effectiveStatus === 'ĐANG SẢN XUẤT';
            }
            if (targetStatus === 'SẴN SÀNG ĐÓNG GÓI') return effectiveStatus === 'SẴN SÀNG ĐÓNG GÓI';
            if (targetStatus === 'CHỜ BÀN GIAO') return effectiveStatus === 'CHỜ BÀN GIAO';
            if (targetStatus === 'ĐÃ BÀN GIAO') {
                if (effectiveStatus === 'ĐÃ BÀN GIAO' || effectiveStatus === 'ĐÃ NHẬP KHO') {
                    if (handoverSubTab === 'ALL') return true;
                    const channel = String(o.channel || '').toUpperCase();
                    if (handoverSubTab === 'SHOPEE') return channel.includes('SHOPEE') || channel.includes('SHP') || channel.includes('SPX');
                    if (handoverSubTab === 'BÁN LẺ') return channel.includes('BÁN LẺ') || channel.includes('BAN LE') || channel.includes('ZALO') || channel.includes('FACEBOOK') || channel.includes('MESSENGER');
                    if (handoverSubTab === 'CTV') return channel.includes('CỘNG TÁC VIÊN') || channel === 'CTV';
                    if (handoverSubTab === 'TIKTOK') return channel.includes('TIKTOK') || channel.includes('TT') || channel.includes('TIK TOK');
                    return false;
                }
                return false;
            }
            if (targetStatus === 'ĐƠN HUỶ' || targetStatus === 'ĐƠN HỦY') return effectiveStatus === 'ĐƠN HUỶ' || effectiveStatus === 'HUỶ' || effectiveStatus === 'ĐƠN HỦY' || effectiveStatus === 'HỦY';
            if (targetStatus === 'HÀNG HOÀN') return effectiveStatus === 'HÀNG HOÀN' || effectiveStatus.includes('HOÀN TRẢ') || effectiveStatus.includes('HOÀN CHỜ XỬ');
            if (targetStatus === 'HOÀN THÀNH') {
                if (effectiveStatus === 'HOÀN THÀNH' || effectiveStatus === 'ĐÃ NHẬP KHO' || effectiveStatus === 'ĐỐI SOÁT THÀNH CÔNG' || effectiveStatus === 'GIAO HÀNG THÀNH CÔNG') return true;
                const knownStatuses = ['CHỜ SẢN XUẤT', 'QUÉT TỰ ĐỘNG', 'ĐANG SẢN XUẤT', 'SẴN SÀNG ĐÓNG GÓI', 'CHỜ BÀN GIAO', 'ĐÃ BÀN GIAO', 'ĐƠN HUỶ', 'HUỶ', 'ĐƠN HỦY', 'HỦY'];
                return !knownStatuses.includes(effectiveStatus) && !effectiveStatus.includes('HOÀN');
            }
            
            return effectiveStatus === targetStatus;
        });
    }, [baseFiltered, filterStatus, handoverSubTab, prodItems]);

    const sortedFiltered = React.useMemo(() => {
        return [...filtered].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    }, [filtered]);

    const latestPackMap = React.useMemo(() => {
        const map = {};
        if (!packings || packings.length === 0) return map;
        const sortedPackings = [...packings].sort((a, b) => new Date(b.end || b.start || 0) - new Date(a.end || a.start || 0));
        sortedPackings.forEach(p => { if (p.orderId && !map[p.orderId]) { map[p.orderId] = p; } });
        return map;
    }, [packings]);

    const stats = React.useMemo(() => {
        let pending = 0, ready = 0, shipping = 0, done = 0, cancel = 0, returns = 0, completed = 0;
        
        baseFiltered.forEach(o => {
            let finalStatus = String(o._effectiveStatus || o.status || '').toUpperCase().trim();
            
            if (finalStatus === 'CHỜ SẢN XUẤT' || finalStatus === 'QUÉT TỰ ĐỘNG' || finalStatus === 'ĐANG SẢN XUẤT' || finalStatus === 'SẴN SÀNG ĐÓNG GÓI') {
                const isGHNShipping = String(o.shippingMethod || '').trim() === 'Gửi GHN';
                const isGuiXeShipping = String(o.shippingMethod || '').trim() === 'Gửi Xe';
                let pureShippingCode = String(o.shippingCode || '').trim();
                if (!pureShippingCode && String(o.orderCode || '').includes('MVĐ:')) {
                    pureShippingCode = String(o.orderCode).split('MVĐ:')[1].trim();
                }
                const hasShippingCode = pureShippingCode && pureShippingCode.length >= 3;
                const shippingGatePassed = (!isGHNShipping && !isGuiXeShipping) || hasShippingCode;

                const related = (prodItems || []).filter(p => p.orderId && p.orderId.includes(o.id));
                if (related.length > 0) {
                    const allDone = related.every(p => {
                        const pStatus = String(p.status || '').toUpperCase().trim();
                        return pStatus === 'DONE' || pStatus === 'ĐÃ XONG' || pStatus === 'HỦY/VỠ' || pStatus === 'HOÀN KHO ĐẠT' || p.fulfilledFromStock === true || String(p.fulfilledFromStock).toUpperCase() === 'TRUE';
                    });
                    if (allDone && shippingGatePassed) {
                        finalStatus = 'SẴN SÀNG ĐÓNG GÓI';
                    } else {
                        finalStatus = 'CHỜ SẢN XUẤT';
                    }
                } else {
                    if (finalStatus === 'SẴN SÀNG ĐÓNG GÓI' && !shippingGatePassed) {
                        finalStatus = 'CHỜ SẢN XUẤT';
                    }
                }
            }
            
            if (finalStatus === 'CHỜ SẢN XUẤT' || finalStatus === 'QUÉT TỰ ĐỘNG' || finalStatus === 'ĐANG SẢN XUẤT') pending++;
            else if (finalStatus === 'SẴN SÀNG ĐÓNG GÓI') ready++;
            else if (finalStatus === 'CHỜ BÀN GIAO') shipping++;
            else if (finalStatus === 'ĐÃ BÀN GIAO') done++;
            else if (finalStatus === 'ĐƠN HUỶ' || finalStatus === 'HUỶ' || finalStatus === 'ĐƠN HỦY' || finalStatus === 'HỦY') cancel++;
            else if (finalStatus === 'HÀNG HOÀN' || finalStatus.includes('HOÀN TRẢ') || finalStatus.includes('HOÀN CHỜ XỬ')) returns++;
            else completed++;
        });
        return { pending, ready, shipping, done, cancel, returns, completed };
