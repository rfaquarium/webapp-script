                    if (shopId) h["ShopId"] = shopId;
                    await fetch("https:\/\/online-gateway.ghn.vn/shiip/public-api/v2/switch-status/cancel", {
                        method: "POST", headers: h, body: JSON.stringify({ order_codes: [codeToCancel] })
                    }).catch(() => { });
                } catch (e) { }
            }

            try {
                let payload = { orders: [{ ...order, status: targetStatus }] };
                if (relatedTransactions.length > 0) {
                    payload.deletes = { Transactions: relatedTransactions.map(tx => tx.id) };
                }
                const relatedKPIs = (erpData?.BonusPenalty || []).filter(bp =>
                    bp.orderCode === order.orderCode || bp.orderCode === localCode ||
                    (bp.note && bp.note.includes(localCode))
                );
                if (relatedKPIs.length > 0) {
                    payload.deletes = payload.deletes || {};
                    payload.deletes.BonusPenalty = relatedKPIs.map(bp => bp.id);
                }
                // ==========================================
                // QUÉT VÀ XỬ LÝ CASCADE UNLINK LỆNH SẢN XUẤT KHI HỦY ĐƠN
                // ==========================================
                let relatedProds = [];
                try {
                    const currentOrderId = order.id;
                    const currentOrderCode = order.orderCode;

                    // Lọc ra các lệnh sản xuất liên quan đến đơn hàng gốc này
                    relatedProds = (prodItems || []).filter(p =>
                        String(p.orderId).trim() === String(currentOrderId).trim() ||
                        String(p.orderId).trim() === String(currentOrderCode).trim()
                    );

                    if (relatedProds.length > 0) {
                        let prodsToUpdate = [];
                        let idsToDelete = [];
                        const timestamp = Date.now();

                        relatedProds.forEach(p => {
                            const p1Status = String(p.p1_status || '').toUpperCase().trim();
                            const p2Status = String(p.p2_status || '').toUpperCase().trim();

                            // Lệnh sản xuất đã bắt đầu (Thợ đã bấm làm/xong Khâu 1 hoặc Khâu 2)
                            if (p1Status === 'DONE' || p1Status === 'IN PROGRESS' || p2Status === 'IN PROGRESS') {
                                prodsToUpdate.push({
                                    ...p,
                                    orderId: 'STOCK_' + timestamp + '_' + Math.floor(Math.random() * 1000),
                                    note: String(p.note || '') + ` [Lệnh chuyển tồn kho độc lập do đơn gốc ${currentOrderCode || currentOrderId} bị hủy]`
                                });
                            }
                            // Lệnh sản xuất chưa bắt đầu (Đang treo Pending) -> Xóa rác khỏi DB
                            else {
                                idsToDelete.push(p.id);
                            }
                        });

                        // Gom toàn bộ vào delta payload đồng bộ trong 1 lần gọi API duy nhất
                        if (prodsToUpdate.length > 0) {
                            payload.prodItems = prodsToUpdate;
                        }
                        if (idsToDelete.length > 0) {
                            payload.deletes = payload.deletes || {};
                            payload.deletes.Production = idsToDelete;
                        }
                    }
                } catch (cascadeError) {
                    console.error("Lỗi thực thi Cascade Unlink:", cascadeError);
                }

                if (currentStatus === 'ĐÃ BÀN GIAO') {
                    let itemsToRefund = [];
                    let productUpdates = [];
                    let totalRefundValue = 0;

                    const accs = typeof order.accessories === 'string' ? safeJSONParse(order.accessories) : (order.accessories || []);
                    accs.forEach(a => {
                        const qty = Number(a.quantity) || 1;
                        const p = (erpProducts || []).find(x => x.name === a.name);
                        if (p) {
                            productUpdates.push({ ...p, quantity: Number(p.quantity || 0) + qty });
                            totalRefundValue += qty * (Number(p.costPrice) || 0);
                            itemsToRefund.push({ name: a.name, qty, price: p.costPrice || 0 });
                        }
                    });

                    relatedProds.forEach(rp => {
                        if (rp.fulfilledFromStock || isLayoutOrGlass(rp.name)) {
                            const p = (erpProducts || []).find(x => x.name === rp.name);
                            if (p) {
                                productUpdates.push({ ...p, quantity: Number(p.quantity || 0) + 1 });
                                totalRefundValue += 1 * (Number(p.costPrice) || 0);
                                itemsToRefund.push({ name: rp.name, qty: 1, price: p.costPrice || 0 });
                            }
                        }
                    });

                    if (productUpdates.length > 0) {
                        const mergedProducts = {};
                        productUpdates.forEach(p => {
                            if (!mergedProducts[p.id]) mergedProducts[p.id] = { ...p, _diff: 0 };
                            mergedProducts[p.id]._diff += (p.quantity - Number((erpProducts.find(x => x.id === p.id) || {}).quantity || 0));
                        });

                        payload.Products = Object.values(mergedProducts).map(p => {
                            const originalP = erpProducts.find(x => x.id === p.id);
                            return { ...originalP, quantity: Number(originalP.quantity || 0) + p._diff, _diff: p._diff };
                        });

                        payload.ImportExport = [{
                            id: 'IE_REFUND_' + Date.now(),
                            type: 'Nhập',
                            target: 'Hoàn Kho (Huỷ Đơn)',
                            totalAmount: totalRefundValue,
                            date: new Date().toISOString().replace('T', ' ').slice(0, 19),
                            note: `Nhập lại kho do khách huỷ/hoàn đơn: ${order.orderCode}`,
                            itemsData: JSON.stringify(itemsToRefund)
                        }];
                    }
                }

                await pushDeltas(payload, isShipped ? 'Đã chuyển đơn về nhóm Chờ Hoàn!' : 'Đã hủy đơn thành công!', 'fa-ban');
                if (isShipped) {
                    triggerToast('Đơn hàng đã đóng gói/giao đi, hệ thống đã chuyển về mục Hàng Hoàn Chờ Xử!', 'fa-undo', 'warning');
                }
            } catch (e) {
                triggerToast('Lỗi khi xử lý hủy/hoàn đơn!', 'fa-times', 'danger');
            }
        };

        const handleConfirmStockIn = async (order) => {
            if (!window.confirm(`Xác nhận NHẬP KHO toàn bộ sản phẩm của lệnh ${order.orderCode}?`)) return;
            try {
                const relatedProds = (prodItems || []).filter(p => p && p.orderId && String(p.orderId).includes(String(order.id)));
                if (relatedProds.length === 0) return triggerToast('Không có sản phẩm nào để nhập!', 'fa-exclamation', 'warning');

                let productUpdates = [];
                let itemsData = [];
                let totalCost = 0;

                const qtyMap = {};
                relatedProds.forEach(p => { qtyMap[p.name] = (qtyMap[p.name] || 0) + 1; });
                Object.keys(qtyMap).forEach(name => {
                    const match = (erpProducts || []).find(x => x.name === name);
                    if (match) {
                        const qty = qtyMap[name];
                        const cost = Number(match.costPrice || 0);
                        productUpdates.push({ id: match.id, quantity: Number(match.quantity || 0) + qty, _diff: qty });
                        itemsData.push({ name: name, qty: qty, price: cost });
                        totalCost += qty * cost;
                    }
                });
                let payload = { orders: [{ ...order, status: 'Đã nhập kho' }] };
                if (productUpdates.length > 0) {
                    payload.Products = productUpdates;
                    payload.ImportExport = [{
                        id: 'IE_STOCKIN_' + Date.now(),
                        type: 'Nhập',
                        target: 'Sản Xuất Nội Bộ',
                        totalAmount: totalCost,
                        date: new Date().toISOString().slice(0, 16).replace('T', ' '),
                        note: `Nhập kho từ lệnh sản xuất: ${order.orderCode}`,
                        itemsData: JSON.stringify(itemsData)
                    }];
                }
                await pushDeltas(payload, 'Đã nhập kho thành công!', 'fa-check-circle');
            } catch (e) { triggerToast('Lỗi khi nhập kho!', 'fa-times', 'danger'); }
        };

        const openReturnModal = (order, item) => { triggerToast('Chức năng đang phát triển', 'fa-info', 'warning'); };

        const handleBulkReturnApprove = async () => {
            if (!selectedIds || selectedIds.length === 0) return;
            if (!window.confirm(`Xác nhận DUYỆT HOÀN KHO & HOÀN THÀNH cho ${selectedIds.length} đơn hàng đã chọn?\n\nHệ thống sẽ tự động nhập lại toàn bộ hàng hoá vào Kho Tổng và chuyển trạng thái các đơn sang HOÀN THÀNH.`)) return;

            setIsBulkHandovering(true);
            try {
                const safeDateFull = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString().slice(0, 16).replace('T', ' ');
                const selectedOrders = orders.filter(o => selectedIds.includes(o.id));
                
                let updatedOrders = [];
                let productUpdatesMap = {};
                let itemsToRestockLog = [];
                let totalCost = 0;

                selectedOrders.forEach(o => {
                    updatedOrders.push({
                        ...o,
                        status: 'Hoàn Thành',
                        isReconciled: true,
                        reconciledAt: safeDateFull,
                        updatedBy: currentUser || 'SYSTEM'
                    });

                    // CHỈ cộng lại tồn kho nếu đơn ĐÃ TỪNG XUẤT KHO (đã đóng gói/bàn giao)
                    const hasExported = (erpData?.ImportExport || []).some(log => log.type === 'Xuất' && String(log.note || '').includes(o.orderCode || o.id));
                    if (!hasExported) return; // Đơn chưa xuất kho → không cộng lại tồn

                    let accs = typeof o.accessories === 'string' ? (safeJSONParse(o.accessories) || []) : (o.accessories || []);
                    if (!Array.isArray(accs)) accs = [];
                    accs.forEach(a => {
                        const qty = Number(a.quantity) || 1;
                        const p = (erpProducts || []).find(x => x.name === a.name);
                        if (p && p.id) {
                            productUpdatesMap[p.id] = (productUpdatesMap[p.id] || 0) + qty;
                            totalCost += qty * (Number(p.costPrice) || 0);
                            itemsToRestockLog.push({ name: a.name, qty, price: p.costPrice || 0 });
                        }
                    });

                    const relProds = (prodItems || []).filter(p => p && p.orderId && String(p.orderId).includes(String(o.id)));
                    relProds.forEach(rp => {
                        const p = (erpProducts || []).find(x => x.name === rp.name);
                        if (p && p.id) {
                            productUpdatesMap[p.id] = (productUpdatesMap[p.id] || 0) + 1;
                            totalCost += 1 * (Number(p.costPrice) || 0);
                            itemsToRestockLog.push({ name: rp.name, qty: 1, price: p.costPrice || 0 });
                        }
                    });
                });

                let payload = { orders: updatedOrders };
                if (Object.keys(productUpdatesMap).length > 0) {
                    payload.Products = Object.keys(productUpdatesMap).map(id => {
                        const orig = (erpProducts || []).find(x => x.id === id);
                        const addQty = productUpdatesMap[id];
                        return { id, quantity: Number(orig?.quantity || 0) + addQty, _diff: addQty };
                    });

                    payload.ImportExport = [{
                        id: 'IE_BULK_RET_' + Date.now(),
                        type: 'Nhập',
                        target: 'Kho Tổng (Hoàn Hàng Hàng Loạt)',
                        totalAmount: totalCost,
                        date: safeDateFull,
                        note: `Duyệt hoàn kho hàng loạt ${selectedOrders.length} đơn hàng`,
                        itemsData: JSON.stringify(itemsToRestockLog)
                    }];
                }

                await pushDeltas(payload, `Đã duyệt hoàn hàng loạt ${selectedOrders.length} đơn sang HOÀN THÀNH!`, 'fa-check-circle');
                triggerToast(`Đã duyệt hoàn thành ${selectedOrders.length} đơn hàng!`, 'fa-check', 'success');
                setSelectedIds([]);
            } catch (err) {
                triggerToast('Lỗi duyệt hoàn hàng loạt: ' + err.message, 'fa-times', 'danger');
            } finally {
                setIsBulkHandovering(false);
            }
        };

        const [isBulkDeleting, setIsBulkDeleting] = React.useState(false);

        const handleBulkDelete = async () => {
            if (!selectedIds || selectedIds.length === 0) return;
            const confirmMsg = `⚠️ BẠN CÓ CHẮC CHẮN MUỐN XÓA VĨNH VIỄN ${selectedIds.length} ĐƠN HÀNG ĐÃ CHỌN?\n\nThao tác này sẽ xóa các đơn hàng và các lệnh sản xuất liên quan khỏi hệ thống!`;
            if (!window.confirm(confirmMsg)) return;

            setIsBulkDeleting(true);
            try {
                const deletedOrders = selectedIds.map(id => ({ id: id, _delete: true }));
                const deletedProds = (prodItems || []).filter(p => selectedIds.includes(p.orderId)).map(p => ({ id: p.id, _delete: true }));

                const payload = {
                    orders: deletedOrders
                };
                if (deletedProds.length > 0) payload.prodItems = deletedProds;

                await pushDeltas(payload, `Đã xóa vĩnh viễn ${selectedIds.length} đơn hàng!`, 'fa-trash');
                triggerToast(`Đã xóa vĩnh viễn ${selectedIds.length} đơn hàng!`, 'fa-check', 'success');
                setSelectedIds([]);
            } catch (err) {
                triggerToast('Lỗi khi xóa hàng loạt: ' + err.message, 'fa-times', 'danger');
            } finally {
                setIsBulkDeleting(false);
            }
        };

        const reconciliationInputRef = React.useRef(null);
        const [isReconciling, setIsReconciling] = React.useState(false);

        const handleReconciliationImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setIsReconciling(true);
            triggerToast('Đang quét file báo cáo đối soát...', 'fa-spinner fa-spin', 'info');

            try {
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = window.XLSX.read(data, { type: 'binary' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                        if (!rows || rows.length < 2) throw new Error('File rỗng');

                        let headerIdx = 0;
                        for (let i = 0; i < Math.min(15, rows.length); i++) {
                            const rowStr = (rows[i] || []).join(' ').toLowerCase();
                            if (rowStr.includes('mã đơn') || rowStr.includes('mã giao dịch') || rowStr.includes('order id') || rowStr.includes('mã tham chiếu')) {
                                headerIdx = i; break;
                            }
                        }

                        const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());

                        const getCol = (keys) => headers.findIndex(h => keys.some(k => h.includes(k)));

                        const iCode = getCol(['mã đơn', 'mã vận đơn', 'order id', 'mã tham chiếu']);
                        const iAmt = getCol(['tổng số tiền được thanh toán', 'thực nhận', 'được thanh toán', 'thanh toán', 'số tiền', 'giá trị']);

                        if (iCode === -1) {
                            triggerToast('Không tìm thấy cột chứa Mã đơn hoặc Mã vận đơn!', 'fa-exclamation-triangle', 'danger');
                            setIsReconciling(false);
                            return;
                        }

                        const iFeeFixed = getCol(['phí cố định']);
                        const iFeeService = getCol(['phí dịch vụ']);
                        const iFeePayment = getCol(['phí thanh toán', 'phí giao dịch']);
                        const iFeeAffiliate = getCol(['phí tiếp thị', 'affiliate']);
                        const iShopVoucher = getCol(['mã giảm giá của shopee', 'shopee voucher']);
                        const iTax = getCol(['thuế']);

                        let matchedOrders = [];
                        for (let i = headerIdx + 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row[iCode]) continue;
                            let code = String(row[iCode]).trim();

                            // Prevent fake order codes (like STT 1,2,3)
                            if (code.length < 5) {
                                for (let c = 0; c < row.length; c++) {
                                    const val = String(row[c] || '').trim();
                                    if (val.length >= 8 && /[A-Z0-9]{8,}/i.test(val) && !val.includes(' ') && !val.includes(':')) {
                                        code = val; break;
                                    }
                                }
                            }

                            let amt = 0;
                            if (iAmt !== -1) {
                                amt = Number(String(row[iAmt]).replace(/[^0-9.-]+/g, "")) || 0;
                            }
                            if (code && code !== 'undefined' && code.length >= 5) {
                                matchedOrders.push({
                                    code: code, amount: amt,
                                    feeFixed: iFeeFixed !== -1 ? Number(String(row[iFeeFixed]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    feeService: iFeeService !== -1 ? Number(String(row[iFeeService]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    feePayment: iFeePayment !== -1 ? Number(String(row[iFeePayment]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    feeAffiliate: iFeeAffiliate !== -1 ? Number(String(row[iFeeAffiliate]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    shopVoucher: iShopVoucher !== -1 ? Number(String(row[iShopVoucher]).replace(/[^0-9.-]+/g, "")) || 0 : 0,
                                    tax: iTax !== -1 ? Number(String(row[iTax]).replace(/[^0-9.-]+/g, "")) || 0 : 0
                                });
                            }
                        }

                        if (matchedOrders.length === 0) {
                            triggerToast('Không tìm thấy dữ liệu hợp lệ trong file.', 'fa-info-circle', 'info');
                            setIsReconciling(false);
                            return;
                        }

                        if (window.confirm(`Tìm thấy ${matchedOrders.length} mã đơn. Bạn có muốn kích hoạt chuyển trạng thái sang HOÀN THÀNH cho các đơn hợp lệ không?`)) {
                            const accs = erpData?.Accounts || [];
                            let defaultAcc = accs.find(a => a.accountName.toLowerCase().includes('shopee'));
                            if (!defaultAcc) defaultAcc = accs[0];
                            const accInput = window.prompt(`Nhập ID hoặc Tên Quỹ để chứa tiền Đối Soát (VD: Ví Shopee). Để trống sẽ bỏ qua tạo Sổ Quỹ.`, defaultAcc ? defaultAcc.accountName : '');
                            let targetAccId = '';
                            if (accInput) {
                                const match = accs.find(a => a.id === accInput || a.accountName.toLowerCase().includes(accInput.toLowerCase()));
                                if (match) targetAccId = match.id;
                                else targetAccId = accInput; // fallback
                            }

                            triggerToast('Đang xử lý đối soát (Batch Process)...', 'fa-spinner fa-spin', 'info');
                            const res = await runGAS('processReconciliationBatch', matchedOrders, targetAccId);
                            if (res && res.success) {
                                triggerToast(res.message + ` (Bỏ qua: ${res.notFoundCount})`, 'fa-check', 'success');
                                if (res.updatedCount > 0) window.dispatchEvent(new CustomEvent('triggerReloadData'));
                            } else {
                                triggerToast(res?.message || 'Lỗi đối soát', 'fa-times', 'danger');
                            }
                        }
                    } catch (err) {
                        triggerToast('File không đúng định dạng hoặc lỗi đọc dữ liệu', 'fa-exclamation-triangle', 'danger');
                    }
                    setIsReconciling(false);
                    if (reconciliationInputRef.current) reconciliationInputRef.current.value = '';
                };
                reader.readAsArrayBuffer(file);
            } catch (err) {
                triggerToast('Lỗi đọc file', 'fa-times', 'danger');
                setIsReconciling(false);
            }
        };

        // ==========================================
        // 6. RENDER GIAO DIỆN
        // ==========================================
        return (
            <div className="space-y-4 animate-fade-in relative pb-10">

                <input type="file" accept=".xlsx, .xls" ref={reconciliationInputRef} className="hidden" onChange={handleReconciliationImport} />

                {/* HÀNG NÚT THAO TÁC & TÌM KIẾM */}
                <div className="flex flex-col gap-2.5 mb-3">
                    <div className="flex items-center justify-between gap-2 overflow-x-auto custom-scrollbar no-scrollbar py-0.5">
                        <div className="flex items-center gap-2 shrink-0">
                            {(isAdmin || isCTV) && (
                                <button
                                    onClick={() => setAddingMode(true)}
                                    className="w-9 h-9 rounded-xl bg-[#d4af37]/10 hover:bg-[#d4af37]/20 text-[#d4af37] font-medium flex items-center justify-center border border-[#d4af37]/30 transition-all duration-200 active:scale-95"
                                    title="Thêm Đơn Mới"
                                >
                                    <i className="fas fa-plus"></i>
                                </button>
                            )}
                            {isAdmin && (
                                <>
                                    <button
                                        onClick={() => window.dispatchEvent(new CustomEvent('openBulkImport'))}
                                        className="w-9 h-9 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 flex items-center justify-center border border-white/[0.08] transition-all duration-200 active:scale-95"
                                        title="Nhập File Excel"
                                    >
                                        <i className="fas fa-file-excel"></i>
                                    </button>
                                    <button
                                        onClick={() => setIsScanningReturn(true)}
                                        className="w-9 h-9 rounded-xl bg-[#f97316]/10 hover:bg-[#f97316]/20 text-[#f97316] flex items-center justify-center border border-[#f97316]/30 transition-all duration-200 active:scale-95"
                                        title="Quét Đơn Hoàn"
                                    >
                                        <i className="fas fa-undo"></i>
                                    </button>
                                    <button
                                        onClick={() => setIsBulkFinanceOpen(true)}
                                        className="w-9 h-9 rounded-xl bg-[#06b6d4]/10 hover:bg-[#06b6d4]/20 text-[#06b6d4] flex items-center justify-center border border-[#06b6d4]/30 transition-all duration-200 active:scale-95"
                                        title="Đối Soát"
                                    >
                                        <i className="fas fa-check-double"></i>
                                    </button>
                                    <button
                                        onClick={() => setIsScanningCancel(true)}
                                        className="w-9 h-9 rounded-xl bg-[#f43f5e]/10 hover:bg-[#f43f5e]/20 text-[#f43f5e] flex items-center justify-center border border-[#f43f5e]/30 transition-all duration-200 active:scale-95"
                                        title="Quét Đơn Huỷ"
                                    >
                                        <i className="fas fa-ban"></i>
                                    </button>
                                    <button
                                        onClick={() => setShowRevenueStats(prev => !prev)}
                                        className={`w-9 h-9 rounded-xl flex items-center justify-center transition-all duration-200 active:scale-95 ${showRevenueStats ? 'bg-[#a855f7]/20 text-[#c084fc] border border-[#a855f7]/50' : 'bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 border border-white/[0.08]'}`}
                                        title="Xem Thống Kê Doanh Thu"
                                    >
                                        <i className="fas fa-chart-bar"></i>
                                    </button>
                                </>
                            )}
                        </div>
                    </div>

                    {/* KHUNG THỐNG KÊ DOANH THU (NGAY BÊN DƯỚI HÀNG NÚT THAO TÁC) */}
                    {!isCTV && showRevenueStats && (
                        <div className="grid grid-cols-2 gap-3 my-1 animate-fade-in">
                            <RFCard className="flex items-center justify-between group">
                                <div className="absolute -right-6 -top-6 w-24 h-24 bg-[#10b981]/5 rounded-full blur-xl group-hover:bg-[#10b981]/15 transition-all"></div>
                                <div className="relative z-10">
                                    <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1.5">Tổng Doanh Thu</div>
                                    <div className="text-[#10b981] font-black text-2xl drop-shadow-[0_0_10px_rgba(16,185,129,0.3)]">{formatMoney(summaryStats.totalRevenue)}đ</div>
                                </div>

                                                                attendance={attendance}
                                                                order={o}
                                                                prods={matchedProds}
                                                                pack={latestPack}
                                                                erpProducts={erpProducts}
                                                                erpData={erpData}
                                                                isAdmin={isAdmin}
                                                                currentUser={currentUser}
                                                                pushDeltas={pushDeltas}
                                                                prodItems={prodItems}
                                                                userConfigs={userConfigs}
                                                                triggerToast={triggerToast}
                                                                isSelected={selectedIds.includes(o.id)}
                                                                onToggleSelect={() => toggleSelect(o.id)}
                                                                kpiConfig={kpiConfig}
                                                                idx_num={originalIdx}
                                                                handleCancelOrder={handleCancelOrder}
                                                                handleConfirmStockIn={handleConfirmStockIn}
                                                                openReturnModal={openReturnModal}
                                                                filterStatus={filterStatus}
                                                                onEditOrder={() => setEditingOrder({ order: o, prods: matchedProds })}
                                                            />
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    );
                                });
                            })()}
                            {renderLimit < sortedFiltered.length && (
                                <div className="pt-4 pb-2 flex justify-center">
                                    <RFButton variant="outline" onClick={() => setRenderLimit(prev => prev + 50)} className="w-full max-w-sm rounded-xl py-3 text-sm font-bold border-white/20 hover:bg-white/5">
                                        Tải thêm ({sortedFiltered.length - renderLimit} đơn)
                                    </RFButton>
                                </div>
                            )}
                        </>
                    )}
                </div>

                {/* Modal Tạo Đơn & Máy Quét Mã Đơn Hoàn */}
                {(addingMode || draftData || editingOrder) && <AddModal onClose={() => { setAddingMode(false); setDraftData(null); setEditingOrder(null); }} pushDeltas={pushDeltas} products={erpProducts} erpData={erpData} triggerToast={triggerToast} userConfigs={userConfigs} configGiaLayout={configGiaLayout} draftData={draftData} editOrder={editingOrder ? editingOrder.order : null} editProds={editingOrder ? editingOrder.prods : []} />}
                {isScanningReturn && <ReturnScannerModal onClose={() => setIsScanningReturn(false)} orders={orders} pushDeltas={pushDeltas} triggerToast={triggerToast} />}
                {isScanningCancel && <CancelScannerModal onClose={() => setIsScanningCancel(false)} orders={orders} prodItems={prodItems} pushDeltas={pushDeltas} triggerToast={triggerToast} />}

                {/* TRẠM ĐỐI SOÁT TÀI CHÍNH */}
                {isBulkFinanceOpen && typeof BulkFinanceModal !== 'undefined' && (
                    <BulkFinanceModal
                        onClose={() => setIsBulkFinanceOpen(false)}
                        pushDeltas={pushDeltas}
                        orders={orders}
                        transactions={erpData?.Transactions || []}
                        accounts={erpData?.Accounts || []}
                    />
                )}
            </div>
        );
    });
</script>
