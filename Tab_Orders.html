    const handleReconciliationImport = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsReconciling(true);
        triggerToast('Đang quét file báo cáo đối soát...', 'fa-spinner fa-spin', 'info');

        try {
            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const data = evt.target.result;
                    const workbook = window.XLSX.read(data, { type: 'binary' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    if (!rows || rows.length < 2) throw new Error('File rỗng');

                    let headerIdx = 0;
                    for (let i = 0; i < Math.min(15, rows.length); i++) {
                        const rowStr = (rows[i] || []).join(' ').toLowerCase();
                        if (rowStr.includes('mã đơn') || rowStr.includes('mã giao dịch') || rowStr.includes('order id') || rowStr.includes('mã tham chiếu')) {
                            headerIdx = i; break;
                        }
                    }

                    const headers = rows[headerIdx].map(h => String(h).toLowerCase().trim());
                    
                    const getCol = (keys) => headers.findIndex(h => keys.some(k => h.includes(k)));

                    const iCode = getCol(['mã đơn', 'mã vận đơn', 'order id', 'mã tham chiếu']);
                    const iAmt = getCol(['tổng số tiền được thanh toán', 'thực nhận', 'được thanh toán', 'thanh toán', 'số tiền', 'giá trị']);
                    
                    if (iCode === -1) {
                        triggerToast('Không tìm thấy cột chứa Mã đơn hoặc Mã vận đơn!', 'fa-exclamation-triangle', 'danger');
                        setIsReconciling(false);
                        return;
                    }

                    const iFeeFixed = getCol(['phí cố định']);
                    const iFeeService = getCol(['phí dịch vụ']);
                    const iFeePayment = getCol(['phí thanh toán', 'phí giao dịch']);
                    const iFeeAffiliate = getCol(['phí tiếp thị', 'affiliate']);
                    const iShopVoucher = getCol(['mã giảm giá của shopee', 'shopee voucher']);
                    const iTax = getCol(['thuế']);

                    let matchedOrders = [];
                    for (let i = headerIdx + 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row[iCode]) continue;
                        let code = String(row[iCode]).trim();
                        
                        // Prevent fake order codes (like STT 1,2,3)
                        if (code.length < 5) {
                            for(let c=0; c<row.length; c++) {
                                const val = String(row[c] || '').trim();
                                if (val.length >= 8 && /[A-Z0-9]{8,}/i.test(val) && !val.includes(' ') && !val.includes(':')) {
                                    code = val; break;
                                }
                            }
                        }

                        let amt = 0;
                        if (iAmt !== -1) {
                            amt = Number(String(row[iAmt]).replace(/[^0-9.-]+/g,"")) || 0;
                        }
                        if (code && code !== 'undefined' && code.length >= 5) {
                            matchedOrders.push({
                                code: code, amount: amt,
                                feeFixed: iFeeFixed !== -1 ? Number(String(row[iFeeFixed]).replace(/[^0-9.-]+/g,"")) || 0 : 0,
                                feeService: iFeeService !== -1 ? Number(String(row[iFeeService]).replace(/[^0-9.-]+/g,"")) || 0 : 0,
                                feePayment: iFeePayment !== -1 ? Number(String(row[iFeePayment]).replace(/[^0-9.-]+/g,"")) || 0 : 0,
                                feeAffiliate: iFeeAffiliate !== -1 ? Number(String(row[iFeeAffiliate]).replace(/[^0-9.-]+/g,"")) || 0 : 0,
                                shopVoucher: iShopVoucher !== -1 ? Number(String(row[iShopVoucher]).replace(/[^0-9.-]+/g,"")) || 0 : 0,
                                tax: iTax !== -1 ? Number(String(row[iTax]).replace(/[^0-9.-]+/g,"")) || 0 : 0
                            });
                        }
                    }

                    if (matchedOrders.length === 0) {
                        triggerToast('Không tìm thấy dữ liệu hợp lệ trong file.', 'fa-info-circle', 'info');
                        setIsReconciling(false);
                        return;
                    }

                    if (window.confirm(`Tìm thấy ${matchedOrders.length} mã đơn. Bạn có muốn kích hoạt chuyển trạng thái sang HOÀN THÀNH cho các đơn hợp lệ không?`)) {
                        const accs = erpData?.Accounts || [];
                        let defaultAcc = accs.find(a => a.accountName.toLowerCase().includes('shopee'));
                        if (!defaultAcc) defaultAcc = accs[0];
                        const accInput = window.prompt(`Nhập ID hoặc Tên Quỹ để chứa tiền Đối Soát (VD: Ví Shopee). Để trống sẽ bỏ qua tạo Sổ Quỹ.`, defaultAcc ? defaultAcc.accountName : '');
                        let targetAccId = '';
                        if (accInput) {
                            const match = accs.find(a => a.id === accInput || a.accountName.toLowerCase().includes(accInput.toLowerCase()));
                            if (match) targetAccId = match.id;
                            else targetAccId = accInput; // fallback
                        }

                        triggerToast('Đang xử lý đối soát (Batch Process)...', 'fa-spinner fa-spin', 'info');
                        const res = await runGAS('processReconciliationBatch', matchedOrders, targetAccId);
                        if (res && res.success) {
                            triggerToast(res.message + ` (Bỏ qua: ${res.notFoundCount})`, 'fa-check', 'success');
                            if (res.updatedCount > 0) window.dispatchEvent(new CustomEvent('triggerReloadData'));
                        } else {
                            triggerToast(res?.message || 'Lỗi đối soát', 'fa-times', 'danger');
                        }
                    }
                } catch (err) {
                    triggerToast('File không đúng định dạng hoặc lỗi đọc dữ liệu', 'fa-exclamation-triangle', 'danger');
                }
                setIsReconciling(false);
                if (reconciliationInputRef.current) reconciliationInputRef.current.value = '';
            };
            reader.readAsArrayBuffer(file);
        } catch (err) {
            triggerToast('Lỗi đọc file', 'fa-times', 'danger');
            setIsReconciling(false);
        }
    };

        // ==========================================
        // 6. RENDER GIAO DIỆN
        // ==========================================
        return (
            <div className="space-y-4 animate-fade-in relative pb-10">

                <input type="file" accept=".xlsx, .xls" ref={reconciliationInputRef} className="hidden" onChange={handleReconciliationImport} />

                {/* THANH CÔNG CỤ TÌM KIẾM & BỘ LỌC (SỬ DỤNG ATOMIC COMPONENTS) */}
                <RFCard noPadding className="p-2 flex flex-col md:flex-row items-center gap-3 overflow-x-auto custom-scrollbar no-scrollbar shrink-0">
                    <div className="flex items-center gap-2 pl-2 border-r border-[#333] pr-3 shrink-0">
                        <i className="fas fa-bolt text-[#d4af37]"></i>
                        <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">ACTIONS</span>
                    </div>
                    <div className="flex gap-2 shrink-0">
                        {(isAdmin || isCTV) && (
                            <RFButton variant="outline" onClick={() => setAddingMode(true)} className="w-10 h-10 !p-0 rounded-xl" title="Thêm Đơn Mới">
                                <i className="fas fa-plus text-lg"></i>
                            </RFButton>
                        )}
                        {isAdmin && (
                            <>
                            <RFButton variant="ghost" onClick={() => window.dispatchEvent(new CustomEvent('openBulkImport'))} className="w-10 h-10 !p-0 rounded-xl hover:text-[#3b82f6]" title="Nhập File Excel">
                                <i className="fas fa-file-excel"></i>
                            </RFButton>
                            <RFButton variant="ghost" onClick={() => setIsScanningReturn(true)} className="w-10 h-10 !p-0 rounded-xl hover:text-[#a855f7]" title="Quét Đơn Hoàn">
                                <i className="fas fa-undo"></i>
                            </RFButton>
                            <RFButton variant="ghost" onClick={() => setIsBulkFinanceOpen(true)} className="w-10 h-10 !p-0 rounded-xl hover:text-[#10b981]" title="Đối Soát">
                                <i className="fas fa-check-double"></i>
                            </RFButton>
                            <RFButton variant="ghost" onClick={() => setIsScanningCancel(true)} className="w-10 h-10 !p-0 rounded-xl hover:text-[#ef4444]" title="Quét Đơn Huỷ">
                                <i className="fas fa-ban"></i>
                            </RFButton>
                            </>
                        )}
                    </div>
                    <div className="flex-1"></div>
                    <div className="flex gap-2 shrink-0 items-center mr-4">
                        <RFButton 
                            variant={isArchiveLoaded ? "outline" : "primary"} 
                            onClick={loadArchiveData}
                            disabled={isArchiveLoaded || isLoadingArchive}
                            className={`rounded-xl px-4 py-2 ${isArchiveLoaded ? 'opacity-50 cursor-not-allowed border-green-500 text-green-500' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg hover:scale-105'}`}
                        >
                            {isLoadingArchive ? <><i className="fas fa-spinner fa-spin mr-2"></i> Đang tải...</> : 
                             isArchiveLoaded ? <><i className="fas fa-check-circle mr-2"></i> Đã nạp lịch sử</> : 
                             <><i className="fas fa-history mr-2"></i> Tra cứu lịch sử cũ</>}
                        </RFButton>
                    </div>
                    <div className="flex gap-2 w-full md:max-w-xl shrink-0 items-center">
                        <div className="flex-1">
                            <RFInput value={searchCode} onChange={e => setSearchCode(e.target.value)} placeholder="Tìm mã đơn, khách hàng..." icon="fa-search" />
                        </div>
                        <select value={filterTime} onChange={e => { setFilterTime(e.target.value); if (e.target.value !== 'Chọn Tháng' && e.target.value !== 'Tuỳ Chỉnh') setCustomMonth(''); }} className="h-[42px] w-[95px] bg-[#0a0a0a] border border-[#333] rounded-xl px-2 text-[10px] font-bold text-gray-300 outline-none focus:border-[#d4af37]">
                            <option>Hôm Nay</option><option>Hôm Qua</option><option>Tuần Này</option><option>Tháng Này</option><option>Tháng Trước</option><option>Chọn Tháng</option><option>Tất Cả</option>
                        </select>
                        {(filterTime === 'Tuỳ Chỉnh' || filterTime === 'Chọn Tháng') && (
                            <input type="month" value={customMonth} onChange={e => setCustomMonth(e.target.value)} className="h-[42px] w-[100px] bg-[#0a0a0a] border border-[#333] rounded-xl px-2 text-[10px] font-bold text-gray-300 outline-none focus:border-[#d4af37]" />
                        )}
                        {isAdmin && (
                            <RFButton variant="ghost" onClick={async () => {
                                triggerToast('Đang kết nối API GHN...', 'fa-spinner fa-spin', 'info');
                                try {
                                    const res = await runGAS('syncGHNViaAPI');
                                    if (res.success) {
                                        triggerToast(res.message, 'fa-check', 'success');
                                        if (res.count > 0) window.dispatchEvent(new CustomEvent('triggerReloadData'));
                                    } else {
                                        triggerToast(res.message, 'fa-times', 'danger');
                                    }
                                } catch(e) { triggerToast('Lỗi server', 'fa-times', 'danger'); }
                            }} className="w-10 h-10 !p-0 rounded-xl hover:text-[#f97316]" title="Đồng bộ tiến trình GHN">
                                <i className="fas fa-sync"></i>
                            </RFButton>
                        )}
                    </div>
                </RFCard>


                {/* 3. CẢNH BÁO URGENT TỰ ĐỘNG */}
                {!isCTV && realTimeSummary.urgentAlerts.length > 0 && (
                    <div className="bg-[#2a0808] border border-red-900/40 rounded-2xl p-3 space-y-2 animate-pulse">
                        <div className="flex items-center gap-2 text-red-400 font-black text-[10px] uppercase tracking-wider border-b border-red-950/60 pb-1.5">
                            <i className="fas fa-exclamation-triangle text-red-500 text-sm"></i>
                            <span>CẢNH BÁO: ĐƠN HỦY & HOÀN TRẢ</span>
                        </div>
                        <div className="max-h-[130px] overflow-y-auto custom-scrollbar space-y-1.5 pr-1">
                            {realTimeSummary.urgentAlerts.map(alertOrder => {
                                const isHuy = String(alertOrder.status || '').toUpperCase().includes('HỦY') || String(alertOrder.status || '').toUpperCase() === 'HUỶ';
                                return (
                                    <div key={alertOrder.id} className="flex justify-between items-center bg-black/40 border border-red-950/50 px-2.5 py-1.5 rounded-xl text-[11px] font-bold">
                                        <div className="flex items-center gap-2 truncate">
                                            <span className={`px-1.5 py-0.5 rounded text-[8px] font-black uppercase ${isHuy ? 'bg-red-600 text-white' : 'bg-orange-500 text-white'}`}>
                                                {isHuy ? 'HUỶ' : 'HOÀN'}
                                            </span>
                                            <span className="text-zinc-100 font-mono font-black tracking-wide truncate">{alertOrder.orderCode.split(' | ')[0]}</span>
                                        </div>
                                        {isHuy ? (
                                            <button onClick={() => {
                                                setSearchCode(alertOrder.orderCode.split(' | ')[0]);
                                                setFilterStatus('Đơn Hủy');
                                            }} className="text-[9px] bg-red-600 hover:bg-red-500 text-white px-2.5 py-1 rounded-lg transition-all font-black uppercase tracking-wider shrink-0 active:scale-95">
                                                Xem đơn
                                            </button>
                                        ) : (
                                            <button onClick={() => {
                                                setSearchCode(alertOrder.orderCode.split(' | ')[0]);
                                                setFilterStatus('Hàng Hoàn');
                                            }} className="text-[9px] bg-orange-600 hover:bg-orange-500 text-white px-2.5 py-1 rounded-lg transition-all font-black uppercase tracking-wider shrink-0 active:scale-95">
                                                Kiểm hoàn
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                )}
            {/* TỔNG HỢP DOANH THU THÁNG */}
            {!isCTV && (
                <div className="grid grid-cols-2 gap-3 mb-4">
                    <RFCard className="flex items-center justify-between group">
                        <div className="absolute -right-6 -top-6 w-24 h-24 bg-[#10b981]/5 rounded-full blur-xl group-hover:bg-[#10b981]/15 transition-all"></div>
                        <div className="relative z-10">
                            <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1.5">Tổng Doanh Thu</div>
                            <div className="text-[#10b981] font-black text-2xl drop-shadow-[0_0_10px_rgba(16,185,129,0.3)]">{formatMoney(summaryStats.totalRevenue)}đ</div>
                        </div>
                        <div className="w-12 h-12 rounded-2xl bg-[#10b981]/10 flex items-center justify-center text-[#10b981] text-xl border border-[#10b981]/20 relative z-10 group-hover:scale-110 transition-transform"><i className="fas fa-coins"></i></div>
                    </RFCard>
                    <RFCard className="flex items-center justify-between group">
                        <div className="absolute -right-6 -top-6 w-24 h-24 bg-[#f97316]/5 rounded-full blur-xl group-hover:bg-[#f97316]/15 transition-all"></div>
                        <div className="relative z-10">
                            <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1.5">Hoàn Trả</div>
                            <div className="text-[#f97316] font-black text-2xl drop-shadow-[0_0_10px_rgba(249,115,22,0.3)]">{formatMoney(summaryStats.totalReturnedValue)}đ</div>
                        </div>
                        <div className="w-12 h-12 rounded-2xl bg-[#f97316]/10 flex items-center justify-center text-[#f97316] text-xl border border-[#f97316]/20 relative z-10 group-hover:scale-110 transition-transform"><i className="fas fa-undo"></i></div>
                    </RFCard>
                    <RFCard className="flex items-center justify-between group">
                        <div className="absolute -right-6 -top-6 w-24 h-24 bg-[#3b82f6]/5 rounded-full blur-xl group-hover:bg-[#3b82f6]/15 transition-all"></div>
                        <div className="relative z-10">
                            <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1.5">Bán Lẻ</div>
                            <div className="text-[#3b82f6] font-black text-2xl drop-shadow-[0_0_10px_rgba(59,130,246,0.3)]">{formatMoney(summaryStats.totalRetail)}đ</div>
                        </div>
                        <div className="w-12 h-12 rounded-2xl bg-[#3b82f6]/10 flex items-center justify-center text-[#3b82f6] text-xl border border-[#3b82f6]/20 relative z-10 group-hover:scale-110 transition-transform"><i className="fas fa-store"></i></div>
                    </RFCard>
                    <RFCard className="flex items-center justify-between group">
                        <div className="absolute -right-6 -top-6 w-24 h-24 bg-[#d4af37]/5 rounded-full blur-xl group-hover:bg-[#d4af37]/15 transition-all"></div>
                        <div className="relative z-10">
                            <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-1.5">Cộng Tác Viên</div>
                            <div className="text-[#d4af37] font-black text-2xl drop-shadow-[0_0_10px_rgba(212,175,55,0.3)]">{formatMoney(summaryStats.totalCtv)}đ</div>
                        </div>
                        <div className="w-12 h-12 rounded-2xl bg-[#d4af37]/10 flex items-center justify-center text-[#d4af37] text-xl border border-[#d4af37]/20 relative z-10 group-hover:scale-110 transition-transform"><i className="fas fa-handshake"></i></div>
                    </RFCard>
                </div>
            )}

            {/* MENU TABS */}
            <div className="flex gap-2 overflow-x-auto pb-2 border-b border-[#2d313e] custom-scrollbar no-scrollbar w-full max-w-4xl mx-auto">
                {tabs.map(t => {
                    const isActive = filterStatus === t.id;
                    return (
                        <div key={t.id} onClick={() => setFilterStatus(t.id)} className={`flex-1 text-center py-2 text-[11px] font-black uppercase tracking-wider cursor-pointer border-b-2 transition-all duration-300 ${isActive ? 'border-[var(--rf-primary)] text-[var(--rf-primary)]' : 'border-transparent text-[var(--rf-text-muted)] hover:text-white'}`}>
                            {t.label} <span className={`ml-1 px-1.5 py-0.5 rounded text-[9px] ${isActive ? 'bg-[var(--rf-primary)] text-black' : 'bg-black/40 text-gray-300'}`}>({t.count})</span>
                        </div>
                    );
                })}
            </div>

            {/* SUB TABS FOR ĐÃ BÀN GIAO */}
            {filterStatus === 'Đã Bàn Giao' && (
                <div className="flex gap-2 overflow-x-auto pb-2 mb-2 custom-scrollbar no-scrollbar animate-fade-in border-b border-[#2d313e]">
                    {['ALL', 'SHOPEE', 'BÁN LẺ', 'CTV', 'TIKTOK'].map(subTab => {
                        const isActive = handoverSubTab === subTab;
                        const labelMap = { 'ALL': 'Tất Cả', 'SHOPEE': 'Shopee', 'BÁN LẺ': 'Bán Lẻ', 'CTV': 'Cộng Tác Viên', 'TIKTOK': 'TikTok Shop' };
                        return (
                            <div key={subTab} onClick={() => setHandoverSubTab(subTab)} className={`flex-none px-4 py-2 text-[10px] font-bold uppercase tracking-wider cursor-pointer border-b-2 transition-all ${isActive ? 'border-[var(--rf-primary)] text-[var(--rf-primary)]' : 'border-transparent text-[var(--rf-text-muted)] hover:text-white'}`}>
                                {labelMap[subTab]}
                            </div>
                        );
                    })}
                </div>
            )}

            {/* CHỌN TẤT CẢ (CHỜ BÀN GIAO) */}
            {(filterStatus === 'Chờ Bàn Giao' || isAdmin || isBossRole || currentRole === 'QUẢN LÝ BÁN HÀNG') && !isCTV && sortedFiltered.length > 0 && (
                <div className="flex items-center gap-3 bg-[#10b981]/10 border border-[#10b981]/20 rounded-xl p-3 mb-4 cursor-pointer hover:bg-[#10b981]/20 transition-colors" onClick={() => {
                    const allIds = sortedFiltered.map(o => o.id);
                    const allSelected = allIds.every(id => selectedIds.includes(id));
                    if (allSelected) {
                        setSelectedIds([]);
                    } else {
                        setSelectedIds(allIds);
                    }
                }}>
                    <input type="checkbox" checked={sortedFiltered.every(o => selectedIds.includes(o.id))} readOnly className="w-5 h-5 accent-[#10b981] rounded cursor-pointer pointer-events-none" />
                    <span className="text-[#10b981] font-black text-[12px] uppercase tracking-wider">CHỌN TẤT CẢ ({sortedFiltered.length} ĐƠN)</span>
                </div>
            )}

            {/* TÁC VỤ HÀNG LOẠT */}
            {!isCTV && selectedIds.length > 0 && (
                <div className="sticky top-0 z-40 bg-[#0a0a0c] border border-white/[0.07] rounded-2xl p-4 mb-4 flex items-center justify-between gen2-glass">
                    <div className="flex items-center gap-3">
                        <div className="bg-[#2563eb] text-white px-4 py-1.5 rounded-xl font-black text-sm">ĐÃ CHỌN: {selectedIds.length} đơn</div>
                        <button onClick={clearSelection} className="text-sm text-gray-400 hover:text-white underline">Bỏ chọn tất cả</button>
                    </div>
                    <button onClick={handleBulkHandover} className="flex items-center gap-2 bg-[#10b981] hover:bg-[#059669] text-white font-black px-6 py-3 rounded-2xl text-sm active:scale-95 transition-all">
                        <i className="fas fa-truck"></i> BÀN GIAO HÀNG LOẠT ({selectedIds.length})
                    </button>
                </div>
            )}

            {/* DANH SÁCH ĐƠN HÀNG */}
            <div className="space-y-3">
                {sortedFiltered.length === 0 ? (
                    <div className="text-center py-10 text-gray-500 font-bold text-[11px] bg-[#0f0f11] rounded-2xl border-2 border-dashed border-white/[0.07]">
                        <i className="fas fa-box-open text-3xl block mb-2 opacity-30"></i> Trống
                    </div>
                ) : (
                    <>
                    {sortedFiltered.slice(0, renderLimit).map((o, idx) => {
                        const latestPack = latestPackMap[o.id];
                        const matchedProds = (prodItems || []).filter(p => {
                            if (!p || !p.orderId || !o || !o.id) return false;
                            const pOrd = String(p.orderId).trim();
                            const oOrd = String(o.id).trim();
                            if (pOrd === oOrd) return true;
                            if (pOrd.startsWith(oOrd + '_')) return true;
                            const parts = pOrd.split('|').map(x => x.trim());
                            if (parts.includes(oOrd)) return true;
                            if (parts.some(part => part.startsWith(oOrd + '_'))) return true;
                            return false;
                        });
                        return (
                            <RFOrderWrapper 
                                key={o.id}
                                attendance={attendance}
                                order={o} 
                                prods={matchedProds} 
                                pack={latestPack} 
                                erpProducts={erpProducts} 
                                erpData={erpData} 
                                isAdmin={isAdmin} 
                                currentUser={currentUser} 
                                pushDeltas={pushDeltas} 
                                prodItems={prodItems} 
                                userConfigs={userConfigs} 
                                triggerToast={triggerToast} 
                                isSelected={selectedIds.includes(o.id)} 
                                onToggleSelect={() => toggleSelect(o.id)}
                                kpiConfig={kpiConfig} 
                                idx_num={idx + 1}
                                handleCancelOrder={handleCancelOrder} 
                                handleConfirmStockIn={handleConfirmStockIn}
                                openReturnModal={openReturnModal} 
                                filterStatus={filterStatus}
                                onEditOrder={() => setEditingOrder({ order: o, prods: matchedProds })}
                            />
                        );
                    })}
                    {renderLimit < sortedFiltered.length && (
                        <div className="pt-4 pb-2 flex justify-center">
                            <RFButton variant="outline" onClick={() => setRenderLimit(prev => prev + 50)} className="w-full max-w-sm rounded-xl py-3 text-sm font-bold border-white/20 hover:bg-white/5">
                                Tải thêm ({sortedFiltered.length - renderLimit} đơn)
                            </RFButton>
                        </div>
                    )}
                    </>
                )}
            </div>

            {/* Modal Tạo Đơn & Máy Quét Mã Đơn Hoàn */}
            {(addingMode || draftData || editingOrder) && <AddModal onClose={() => { setAddingMode(false); setDraftData(null); setEditingOrder(null); }} pushDeltas={pushDeltas} products={erpProducts} erpData={erpData} triggerToast={triggerToast} userConfigs={userConfigs} configGiaLayout={configGiaLayout} draftData={draftData} editOrder={editingOrder ? editingOrder.order : null} editProds={editingOrder ? editingOrder.prods : []} />}
            {isScanningReturn && <ReturnScannerModal onClose={() => setIsScanningReturn(false)} orders={orders} pushDeltas={pushDeltas} triggerToast={triggerToast} />}
            {isScanningCancel && <CancelScannerModal onClose={() => setIsScanningCancel(false)} orders={orders} prodItems={prodItems} pushDeltas={pushDeltas} triggerToast={triggerToast} />}

            {/* TRẠM ĐỐI SOÁT TÀI CHÍNH */}
            {isBulkFinanceOpen && typeof BulkFinanceModal !== 'undefined' && (
                <BulkFinanceModal
                    onClose={() => setIsBulkFinanceOpen(false)}
                    pushDeltas={pushDeltas}
                    orders={orders}
                    transactions={erpData?.Transactions || []}
                    accounts={erpData?.Accounts || []}
                />
            )}
        </div>
    );
});
</script>
