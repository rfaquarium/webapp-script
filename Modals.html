<script type="text/babel">
// ==========================================
// 1. MÀN HÌNH ĐĂNG NHẬP & PHÂN QUYỀN
// ==========================================
function Login({ onLogin }) {
  const [pin, setPin] = React.useState("");
  const [loading, setLoading] = React.useState(false);

  const submitPin = async (value) => {
    setLoading(true);
    try {
      const result = await runGAS('validatePin', value);
      if (result && result.valid && result.user) {
        localStorage.setItem('rf_pin', value);
        document.cookie = `rf_pin=${value}; max-age=31536000; path=/`;
        
        if (result.isAdmin) {
            localStorage.setItem('rf_admin', 'true');
            document.cookie = `rf_admin=true; max-age=31536000; path=/`;
        }
        if (result.isBoss) {
            localStorage.setItem('rf_boss', 'true');
            document.cookie = `rf_boss=true; max-age=31536000; path=/`;
        }
        if (result.role) {
            localStorage.setItem('rf_role', result.role);
            document.cookie = `rf_role=${result.role}; max-age=31536000; path=/`;
        }
        
        onLogin(result.user, result.isAdmin || false, result.isBoss || false, result.role || '');
      } else {
        alert('Sai mã PIN!');
        setPin('');
      }
    } catch (err) {
      alert('Lỗi xác thực. Vui lòng thử lại.');
      setPin('');
    }
    setLoading(false);
  };

  const handlePinChange = (e) => {
    const value = e.target.value;
    setPin(value);
    
    // Auto submit only if max length is reached (6)
    if (value.length === 6) {
      submitPin(value);
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && pin.length >= 4) {
      submitPin(pin);
    }
  };

  return (
      <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gradient-to-tr from-sky-100 via-white to-blue-50">
          <div className="bg-white/55 backdrop-blur-3xl p-8 rounded-3xl border border-white/80 max-w-sm w-full shadow-2xl flex flex-col items-center">
              {typeof RFLogo !== 'undefined' ? (
                  <RFLogo className="w-16 h-16 mb-6" size={64} />
              ) : (
                  <div className="w-16 h-16 bg-[#0284c7]/10 rounded-2xl flex items-center justify-center border border-[#0284c7]/30 mb-6">
                      <i className="fas fa-crown text-3xl text-[#0284c7]"></i>
                  </div>
              )}
              <h2 className="text-[#0f172a] font-black text-xl tracking-widest uppercase mb-2">RF WORKSPACE</h2>
              <p className="text-slate-500 text-[11px] font-bold mb-8 uppercase tracking-widest text-center">Nền tảng quản trị nội bộ</p>
              
              <div className="w-full relative">
                  <input type="password" inputMode="numeric" pattern="[0-9]*" value={pin} onChange={handlePinChange} onKeyDown={handleKeyDown} disabled={loading} className="w-full bg-white/60 border-2 border-slate-200 rounded-2xl px-4 py-4 text-center text-2xl font-black text-slate-800 tracking-[0.5em] outline-none focus:border-[#0284c7] focus:ring-4 focus:ring-sky-500/20 transition-all shadow-inner" placeholder="MÃ PIN" maxLength={6} autoFocus />
                  {loading && <div className="absolute right-4 top-1/2 -translate-y-1/2 text-[#0284c7]"><i className="fas fa-spinner fa-spin text-xl"></i></div>}
              </div>
          </div>
      </div>
  );
}

// ==========================================
// 2. CÁC MODAL THÔNG BÁO HỆ THỐNG
// ==========================================
function ConfirmModal({ visible, title, message, onConfirm, onCancel, confirmText = "XÁC NHẬN", cancelText = "HỦY" }) {
  if (!visible) return null;
  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
      <div className="bg-white/85 border border-sky-100/50 backdrop-blur-2xl w-full max-w-sm rounded-[24px] p-6 shadow-2xl">
        <div className="w-12 h-12 rounded-full bg-sky-100 text-[#0284c7] border border-sky-200/50 flex items-center justify-center text-xl mb-5"><i className="fas fa-question-circle"></i></div>
        <div className="font-black text-lg mb-3 text-[#0f172a] tracking-wide">{title}</div>
        <div className="text-slate-500 mb-6 text-[13px] leading-relaxed">{message}</div>
        <div className="flex gap-3"><button onClick={onCancel} className="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-black active:scale-95 transition-all">{cancelText}</button><button onClick={onConfirm} className="flex-1 py-3.5 bg-[#e11d48] text-white rounded-xl font-black active:scale-95 shadow-md transition-all">{confirmText}</button></div>
      </div>
    </div>
  );
}

function AlertModal({ visible, title, message, onClose, buttonText = "ĐÃ HIỂU" }) {
  if (!visible) return null;
  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
      <div className="bg-white/85 border border-sky-100/50 backdrop-blur-2xl w-full max-w-sm rounded-[24px] p-6 shadow-2xl text-center flex flex-col items-center">
        <div className="w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center text-2xl mb-5"><i className="fas fa-info-circle"></i></div>
        <div className="font-black text-lg mb-3 text-[#0f172a] tracking-wide">{title}</div>
        <div className="text-slate-500 mb-6 text-[13px] leading-relaxed">{message}</div>
        <button onClick={onClose} className="w-full py-3.5 bg-[#0284c7] hover:bg-sky-600 text-white rounded-xl font-black active:scale-95 shadow-md transition-all">{buttonText}</button>
      </div>
    </div>
  );
}

function InputModal({ visible, title, placeholder, defaultValue = "", onConfirm, onCancel }) {
  const [value, setValue] = React.useState(defaultValue);
  if (!visible) return null;
  const handleConfirm = () => { onConfirm(value); setValue(""); };
  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
      <div className="bg-white/85 border border-sky-100/50 backdrop-blur-2xl w-full max-w-sm rounded-[24px] p-6 shadow-2xl">
        <div className="font-black text-lg mb-5 text-[#0f172a] tracking-wide">{title}</div>
        <input type="text" value={value} onChange={(e) => setValue(e.target.value)} placeholder={placeholder} className="w-full p-4 bg-white border border-sky-200/60 rounded-xl text-[14px] text-slate-800 font-bold mb-6 focus:border-[#0284c7] outline-none transition-colors" autoFocus />
        <div className="flex gap-3"><button onClick={() => { onCancel(); setValue(""); }} className="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-black active:scale-95 transition-all">HỦY</button><button onClick={handleConfirm} className="flex-1 py-3.5 bg-[#0284c7] hover:bg-sky-600 text-white rounded-xl font-black active:scale-95 shadow-md transition-all">XÁC NHẬN</button></div>
      </div>
    </div>
  );
}

// ==========================================
// 3. MODAL XỬ LÝ SỰ CỐ (S.O.S) 
// ==========================================
function ReturnSosModal({ sosTarget, erpProducts, order, packRecord, onClose, pushDeltas, triggerToast, setOptimisticOrder }) {
    const { type, item } = sosTarget;
    const defaultQty = type === 'acc' ? (Number(item.quantity) || 1) : 1;
    const [recoveredQty, setRecoveredQty] = React.useState(defaultQty);
    const [reason, setReason] = React.useState('');
    const [condition, setCondition] = React.useState('REPAIR');
    const [processing, setProcessing] = React.useState(false);

    const erpP = (erpProducts || []).find(x => x.name === item.name) || {};
    const costPrice = Number(erpP.costPrice) || 0;

    const p1User = item.phases?.phase1?.user || '';
    const p2User = item.phases?.phase2?.user || '';
    const p1Reward = Number(item.phases?.phase1?.reward_vnd) || 0;
    const p2Reward = Number(item.phases?.phase2?.reward_vnd) || 0;
    const packUser = packRecord?.user || packRecord?.updatedBy || '';
    const packReward = Number(packRecord?.reward_vnd) || 0;

    const missingQty = Math.max(0, defaultQty - Number(recoveredQty || 0));

    const p1Label = item.phases?.phase1?.name || 'Khâu 1';
    const p2Label = item.phases?.phase2?.name || 'Khâu 2';

    const handleSubmit = async () => {
        if (!reason) return triggerToast('Vui lòng chọn nguyên nhân!', 'fa-exclamation', 'warning');
        setProcessing(true);
        try {
            let payload = {};
            let payloadMsg = '';
            const safeDate = new Date().toISOString().replace('T', ' ').slice(0, 23);
            const safeDateOnly = safeDate.split(' ')[0];

            if (type === 'acc') {
                if (Number(recoveredQty) > 0 && erpP.id) {
                    payload.Products = [{ id: erpP.id, quantity: Number(erpP.quantity) + Number(recoveredQty), _diff: Number(recoveredQty) }];
                }

                if (missingQty > 0) {
                    payload.ImportExport = payload.ImportExport || [];
                    payload.ImportExport.push({
                        id: 'IE_LOSS_' + Date.now(),
                        type: 'Xuất',
                        target: 'Hủy Hàng',
                        totalAmount: 0,
                        date: safeDate,
                        note: `Hủy phụ kiện thiếu/vỡ - Đơn ${order.orderCode}`,
                        itemsData: JSON.stringify([{ name: item.name, qty: missingQty, price: costPrice }])
                    });

                    if (reason === 'DONG_GOI' && packUser) {
                        const penaltyAmount = missingQty * costPrice;
                        payload.packings = [{
                            id: 'PENALTY_' + Date.now(),
                            orderId: order.id,
                            user: packUser,
                            date: safeDateOnly,
                            status: 'Penalty',
                            reward_vnd: -penaltyAmount,
                            note: `Phạt đền phụ kiện mất/thiếu: ${item.name}`
                        }];
                    }
                }

                let accList = order.accessories || [];
                while (typeof accList === 'string') {
                    try { accList = JSON.parse(accList); } catch(e) { break; }
                }
                if (!Array.isArray(accList)) accList = [];
                const newAccs = accList.map(a => a.name === item.name ? { ...a, _retStatus: 'SOS' } : a);
                payload.orders = [{ ...order, accessories: JSON.stringify(newAccs) }];
                setOptimisticOrder({ ...order, accessories: newAccs });
                payloadMsg = 'Đã ghi nhận sự cố phụ kiện!';
            }
            else if (type === 'prod') {
                let penaltyUser = '';
                let penaltyKPI = 0;

                if (reason === 'PHASE1') { penaltyUser = p1User; penaltyKPI = p1Reward; }
                else if (reason === 'PHASE2') { penaltyUser = p2User; penaltyKPI = p2Reward; }
                else if (reason === 'DONG_GOI') { penaltyUser = packUser; penaltyKPI = packReward; }

                if (condition === 'REPAIR') {
                    const newProdId = 'REP_' + Date.now();
                    const repItem = {
                        ...item,
                        id: newProdId,
                        status: 'Pending',
                        fulfilledFromStock: false,
                        note: `SỬA CHỮA HOÀN (Lỗi: ${reason})`,
                        phases: {
                            phase1: { status: 'Pending', user: reason === 'PHASE1' ? p1User : '', reward_vnd: 0, start: '', endTime: '', photo: '' },
                            phase2: { status: 'Pending', user: reason === 'PHASE2' ? p2User : '', reward_vnd: 0, start: '', endTime: '', photo: '' }
                        }
                    };
                    payload.prodItems = [{ ...item, status: 'Đã tạo lệnh sửa' }, repItem];
                    payloadMsg = 'Đã đẩy lệnh sửa chữa về xưởng!';

                    if (penaltyUser && penaltyKPI > 0) {
                        payload.packings = payload.packings || [];
                        payload.packings.push({
                            id: 'PENALTY_' + Date.now(),
                            orderId: order.id,
                            user: penaltyUser,
                            date: safeDateOnly,
                            status: 'Penalty',
                            reward_vnd: -penaltyKPI,
                            note: `Trừ KPI do hàng lỗi phải sửa lại: ${item.name}`
                        });
                    }
                } 
                else if (condition === 'BROKEN') {
                    payload.ImportExport = [{
                        id: 'IE_LOSS_' + Date.now(),
                        type: 'Xuất',
                        target: 'Hủy Hàng',
                        totalAmount: 0,
                        date: safeDate,
                        note: `Hủy hàng vỡ nát - Đơn ${order.orderCode}`,
                        itemsData: JSON.stringify([{ name: item.name, qty: 1, price: costPrice }])
                    }];

                    if (penaltyUser && penaltyKPI > 0) {
                        payload.packings = payload.packings || [];
                        payload.packings.push({
                            id: 'PENALTY_' + Date.now(),
                            orderId: order.id,
                            user: penaltyUser,
                            date: safeDateOnly,
                            status: 'Penalty',
                            reward_vnd: -penaltyKPI,
                            note: `Trừ KPI do làm vỡ nát hàng: ${item.name}`
                        });
                    }
                    payload.prodItems = [{ ...item, status: 'Hủy/Vỡ' }];
                    payloadMsg = 'Đã ghi nhận vỡ nát & Thu hồi KPI!';
                }
            }

            await pushDeltas(payload, payloadMsg, 'fa-check');
            onClose();
        } catch (e) {
            triggerToast('Lỗi xử lý!', 'fa-times', 'danger');
        }
        setProcessing(false);
    };

    return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm">
            <div className="bg-[#141414] border border-[#e11d48]/30 rounded-2xl w-full max-w-sm p-5 shadow-[0_10px_40px_rgba(225,29,72,0.15)] animate-slide-down">
                <h3 className="font-black text-[#fb7185] text-[15px] uppercase tracking-widest mb-1 flex items-center gap-2">
                    <i className="fas fa-exclamation-triangle"></i> BÁO CÁO SỰ CỐ
                </h3>
                <div className="text-[12px] font-bold text-gray-400 mb-4 pb-3 border-b border-[#222] truncate">{item.name}</div>

                <div className="space-y-4">
                    {type === 'acc' ? (
                        <>
                            <div>
                                <label className="text-[10px] font-black text-gray-500 block mb-1">Số lượng THỰC TẾ thu hồi được</label>
                                <input type="number" min="0" max={defaultQty} value={recoveredQty} onChange={e => setRecoveredQty(e.target.value)} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-2.5 text-white font-bold outline-none focus:border-[#fb7185] transition-colors" />
                                <div className="text-[9px] text-rose-500 mt-1 font-bold italic">*Hệ thống sẽ ghi nhận mất/thiếu {missingQty} SP.</div>
                            </div>
                            <div>
                                <label className="text-[10px] font-black text-gray-500 block mb-2">Nguyên nhân mất/hỏng</label>
                                <div className="flex flex-col gap-2">
                                    <label className={`p-2.5 rounded-xl border cursor-pointer flex items-center gap-2 transition-colors ${reason === 'KHACH' ? 'bg-[#2563eb]/20 border-[#2563eb] text-[#60a5fa]' : 'bg-[#0a0a0a] border-[#333] text-gray-400'}`}>
                                        <input type="radio" name="reason" className="hidden" checked={reason === 'KHACH'} onChange={() => setReason('KHACH')} />
                                        <i className="fas fa-user-times"></i> <span className="text-[11px] font-bold">Khách / ĐVVC làm mất/hỏng</span>
                                    </label>
                                    <label className={`p-2.5 rounded-xl border cursor-pointer flex items-center gap-2 transition-colors ${reason === 'DONG_GOI' ? 'bg-[#e11d48]/20 border-[#e11d48] text-[#fb7185]' : 'bg-[#0a0a0a] border-[#333] text-gray-400'}`}>
                                        <input type="radio" name="reason" className="hidden" checked={reason === 'DONG_GOI'} onChange={() => setReason('DONG_GOI')} />
                                        <i className="fas fa-box-open"></i> <span className="text-[11px] font-bold">Lỗi do Đóng gói (Bắt đền & Trừ tồn)</span>
                                    </label>
                                </div>
                            </div>
                        </>
                    ) : (
                        <>
                            <div>
                                <label className="text-[10px] font-black text-gray-500 block mb-2">Hàng bị lỗi ở khâu nào?</label>
                                <select value={reason} onChange={e => setReason(e.target.value)} className="w-full bg-[#0a0a0a] border border-[#333] rounded-xl px-3 py-2.5 text-white font-bold outline-none focus:border-[#fb7185] transition-colors">
                                    <option value="">-- Chọn Khâu Gây Lỗi --</option>
                                    <option value="PHASE1">Lỗi tại {p1Label} (Trừ KPI: {p1User || 'N/A'})</option>
                                    <option value="PHASE2">Lỗi tại {p2Label} (Trừ KPI: {p2User || 'N/A'})</option>
                                    <option value="DONG_GOI">Lỗi tại Đóng gói (Trừ KPI: {packUser || 'N/A'})</option>
                                    <option value="KHACH">Lỗi do Vận chuyển / Khách</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-[10px] font-black text-gray-500 block mb-2">Tình trạng hiện tại</label>
                                <div className="flex gap-2">
                                    <label className={`flex-1 p-2.5 rounded-xl border cursor-pointer text-center transition-colors ${condition === 'REPAIR' ? 'bg-[#f59e0b]/20 border-[#f59e0b] text-[#fbbf24]' : 'bg-[#0a0a0a] border-[#333] text-gray-400'}`}>
                                        <input type="radio" name="condition" className="hidden" checked={condition === 'REPAIR'} onChange={() => setCondition('REPAIR')} />
                                        <i className="fas fa-tools mb-1 block text-lg"></i>
                                        <span className="text-[10px] font-bold">CÒN CỨU ĐƯỢC</span>
                                    </label>
                                    <label className={`flex-1 p-2.5 rounded-xl border cursor-pointer text-center transition-colors ${condition === 'BROKEN' ? 'bg-[#e11d48]/20 border-[#e11d48] text-[#fb7185]' : 'bg-[#0a0a0a] border-[#333] text-gray-400'}`}>
                                        <input type="radio" name="condition" className="hidden" checked={condition === 'BROKEN'} onChange={() => setCondition('BROKEN')} />
                                        <i className="fas fa-dumpster-fire mb-1 block text-lg"></i>
                                        <span className="text-[10px] font-bold">VỠ NÁT / VỨT ĐI</span>
                                    </label>
                                </div>
                            </div>
                            {condition === 'REPAIR' && reason && (
                                <div className="text-[9px] text-[#fbbf24] bg-[#f59e0b]/10 p-2 rounded-lg border border-[#f59e0b]/20">
                                    * Lệnh sửa chữa sẽ được đẩy lại về xưởng sản xuất và KPI của người gây lỗi sẽ bị thu hồi.
                                </div>
                            )}
                            {condition === 'BROKEN' && reason && (
                                <div className="text-[9px] text-rose-400 bg-rose-500/10 p-2 rounded-lg border border-rose-500/20">
                                    * Sản phẩm sẽ bị đánh dấu VỠ NÁT, xuất thẳng ra khỏi kho, và KPI của người gây lỗi sẽ bị thu hồi.
                                </div>
                            )}
                        </>
                    )}
                </div>

                <div className="flex gap-2 mt-5">
                    <button onClick={onClose} disabled={processing} className="flex-1 py-3 bg-[#222] text-gray-300 font-black rounded-xl text-[11px] active:scale-95 transition-all">HỦY</button>
                    <button onClick={handleSubmit} disabled={processing || !reason} className="flex-[2] py-3 bg-[#e11d48] text-white font-black rounded-xl text-[11px] active:scale-95 transition-all shadow-md disabled:opacity-50">
                        {processing ? <><i className="fas fa-spinner fa-spin"></i> ĐANG XỬ LÝ...</> : 'XÁC NHẬN SỰ CỐ'}
                    </button>
                </div>
            </div>
        </div>
    );
}

// ==========================================
// 6. MODAL TÍNH GIÁ CƯỚC VẬN CHUYỂN
// ==========================================
function FreightCalculatorModal({ visible, onClose }) {
    const [length, setLength] = React.useState('');
    const [width, setWidth] = React.useState('');
    const [height, setHeight] = React.useState('');
    const [priceType, setPriceType] = React.useState('light');

    if (!visible) return null;

    const l = parseFloat(length) || 0;
    const w = parseFloat(width) || 0;
    const h = parseFloat(height) || 0;

    const convertedWeight = (l * w * h) / 5000;
    const weightToUse = Math.ceil(convertedWeight);

    let estimatedPrice = 0;
    if (priceType === 'light') {
        if (weightToUse <= 5) {
            estimatedPrice = 30000;
        } else {
            estimatedPrice = 30000 + (weightToUse - 5) * 7000;
        }
    } else {
        if (weightToUse <= 20) {
            estimatedPrice = 140000;
        } else {
            estimatedPrice = 140000 + (weightToUse - 20) * 7000;
        }
    }

    return (
        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in">
            <div className="bg-[#141414] border border-[#333] w-full max-w-md rounded-[24px] overflow-hidden shadow-2xl flex flex-col">
                
                {/* HEADER */}
                <div className="bg-[#0a0a0a] p-4 border-b border-[#333] flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-lg">
                            <i className="fas fa-truck-moving"></i>
                        </div>
                        <div>
                            <div className="font-black text-sm text-zinc-100 tracking-wide uppercase">Tính Giá Cước</div>
                            <div className="text-[10px] text-gray-500 font-bold uppercase">Dự toán cước vận chuyển</div>
                        </div>
                    </div>
                    <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#222] hover:bg-[#333] text-gray-400 flex items-center justify-center transition-colors active:scale-95">
                        <i className="fas fa-times"></i>
                    </button>
                </div>

                <div className="p-5 overflow-y-auto custom-scrollbar max-h-[80vh]">
                    
                    {/* BẢNG GIÁ ÁP DỤNG */}
                    <div className="mb-5">
                        <label className="text-[10px] font-black text-gray-400 block mb-3 uppercase tracking-wider">Bảng giá áp dụng</label>
                        <div className="flex gap-2">
                            <label className={`flex-1 p-3 rounded-xl border cursor-pointer flex flex-col gap-1 transition-all ${priceType === 'light' ? 'bg-orange-500/10 border-orange-500/50 text-orange-400' : 'bg-[#0a0a0a] border-[#333] text-gray-500'}`}>
                                <input type="radio" name="priceType" className="hidden" checked={priceType === 'light'} onChange={() => setPriceType('light')} />
                                <div className="font-black text-xs uppercase tracking-wide">Hàng nhẹ</div>
                                <div className="text-[9px] opacity-80 font-bold">30k/5kg (thêm 1kg +7k)</div>
                            </label>
                            <label className={`flex-1 p-3 rounded-xl border cursor-pointer flex flex-col gap-1 transition-all ${priceType === 'heavy' ? 'bg-orange-500/10 border-orange-500/50 text-orange-400' : 'bg-[#0a0a0a] border-[#333] text-gray-500'}`}>
                                <input type="radio" name="priceType" className="hidden" checked={priceType === 'heavy'} onChange={() => setPriceType('heavy')} />
                                <div className="font-black text-xs uppercase tracking-wide">Hàng nặng</div>

function TankPriceModal({ visible, onClose }) {
    const [glassType, setGlassType] = React.useState('280000');
    const [glassPrice, setGlassPrice] = React.useState(280000);
    const [length, setLength] = React.useState('');
    const [width, setWidth] = React.useState('');
    const [height, setHeight] = React.useState('');
    const [extraCost, setExtraCost] = React.useState(50000);
    const [showResult, setShowResult] = React.useState(false);

    if (!visible) return null;

    const handleGlassTypeChange = (e) => {
        setGlassType(e.target.value);
        setGlassPrice(Number(e.target.value));
    };

    const l = parseFloat(length) || 0;
    const w = parseFloat(width) || 0;
    const h = parseFloat(height) || 0;
    const extra = parseFloat(extraCost) || 0;

    const L = l / 100;
    const W = w / 100;
    const H = h / 100;

    const area = (L * W) + (2 * L * H) + (2 * W * H);
    const topPerimeter = (L + W) * 2;

    const costOfGlass = area * glassPrice;
    const costOfGrinding = topPerimeter * 25000;

    const totalCost = costOfGlass + costOfGrinding + extra;
    const sellPrice = totalCost * 1.45;

    const handleCalculate = () => {
        if (glassPrice <= 0 || l <= 0 || w <= 0 || h <= 0) {
            alert("Vui lòng nhập đầy đủ Kích thước và Đơn giá (lớn hơn 0)!");
            return;
        }
        setShowResult(true);
    };

    const role = localStorage.getItem('rf_role') || '';
    const isBoss = localStorage.getItem('rf_boss') === 'true' || localStorage.getItem('rf_admin') === 'true';
    const canViewCost = isBoss || ['QUẢN LÝ KHO', 'QUẢN LÝ KHO VẬN', 'KHO VẬN', 'KẾ TOÁN'].includes(role.toUpperCase());

    // Close on outside click
    const handleBackdropClick = (e) => {
        if (e.target === e.currentTarget) {
            onClose();
            setShowResult(false);
        }
    };

    return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={handleBackdropClick}>
            <div className="bg-[#111] p-6 rounded-3xl border border-[#333] max-w-md w-full shadow-2xl flex flex-col relative animate-scale-up">
                {/* Close Button */}
                <button onClick={() => { onClose(); setShowResult(false); }} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-[#222] text-gray-400 hover:text-white hover:bg-rose-500 transition-colors">
                    <i className="fas fa-times"></i>
                </button>

                <h2 className="text-xl font-black text-center text-[#c084fc] mb-6 uppercase tracking-wider">Công Cụ Định Giá Bể Kính</h2>

                <div className="space-y-4">
                    {/* Chọn loại kính và Đơn giá tự động */}
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="block text-[10px] font-black text-gray-400 mb-1.5 uppercase">Loại kính (li)</label>
                            <select value={glassType} onChange={handleGlassTypeChange} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg px-3 py-2.5 text-sm font-bold text-white outline-none focus:border-[#c084fc] transition-colors">
                                <option value="150000">Kính 3 li</option>
                                <option value="200000">Kính 4 li</option>
                                <option value="280000">Kính 5 li</option>
                                <option value="450000">Kính 8 li</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-[10px] font-black text-gray-400 mb-1.5 uppercase">Đơn giá kính (VNĐ/m2)</label>
                            <input type="number" value={glassPrice} onChange={(e) => setGlassPrice(Number(e.target.value))} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg px-3 py-2.5 text-sm font-bold text-white outline-none focus:border-[#c084fc]" placeholder="Nhập giá..." />
                        </div>
                    </div>

                    {/* Kích thước */}
                    <div>
                        <label className="block text-[10px] font-black text-gray-400 mb-1.5 uppercase">Kích thước Bể (Dài x Rộng x Cao) - CM</label>
                        <div className="flex items-center gap-2">
                            <input type="number" value={length} onChange={e => setLength(e.target.value)} min="1" placeholder="Dài" className="w-1/3 bg-[#0a0a0a] border border-[#333] rounded-lg px-3 py-2.5 text-sm font-bold text-center text-white outline-none focus:border-[#c084fc]" />
                            <span className="text-gray-500 font-bold">x</span>
                            <input type="number" value={width} onChange={e => setWidth(e.target.value)} min="1" placeholder="Rộng" className="w-1/3 bg-[#0a0a0a] border border-[#333] rounded-lg px-3 py-2.5 text-sm font-bold text-center text-white outline-none focus:border-[#c084fc]" />
                            <span className="text-gray-500 font-bold">x</span>
                            <input type="number" value={height} onChange={e => setHeight(e.target.value)} min="1" placeholder="Cao" className="w-1/3 bg-[#0a0a0a] border border-[#333] rounded-lg px-3 py-2.5 text-sm font-bold text-center text-white outline-none focus:border-[#c084fc]" />
                        </div>
                    </div>

                    {/* Chi phí phụ */}
                    <div>
                        <label className="block text-[10px] font-black text-gray-400 mb-1.5 uppercase">Chi phí phụ (Keo, nhân công, xốp) - VNĐ</label>

                    </div>

                    <button onClick={handleCalculate} className="w-full py-3 mt-4 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white rounded-lg font-black tracking-wider uppercase transition-all shadow-[0_0_15px_rgba(147,51,234,0.3)] active:scale-[0.98]">
                        Tính Giá Thành
                    </button>
                </div>

                {/* Kết quả */}
                {showResult && (
                    <div className="mt-6 p-4 bg-[#1a1a1a] rounded-xl border-l-4 border-purple-500">
                        {canViewCost && (
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-gray-400 font-semibold text-sm">Giá Vốn Tổng:</span>
                                <strong className="text-white text-lg">{Math.round(totalCost).toLocaleString('vi-VN')} đ</strong>
                            </div>
                        )}
                        <div className="flex justify-between items-center mb-3">
                            <span className="text-rose-400 font-black text-sm uppercase">Giá Bán (Biên độ 45%):</span>
                            <strong className="text-rose-500 text-2xl font-black">{Math.round(sellPrice).toLocaleString('vi-VN')} đ</strong>
                        </div>
                        <div className="w-full h-px bg-[#333] my-3"></div>
                        <p className="text-[11px] text-gray-500 text-center leading-relaxed">
                            Sử dụng <strong className="text-gray-300">{area.toFixed(3)}</strong> m2 kính | Mài <strong className="text-gray-300">{topPerimeter.toFixed(2)}</strong> mét vi tính miệng bể.<br />
                            Chi phí phụ được tính: <strong className="text-gray-300">{Math.round(extra).toLocaleString('vi-VN')}</strong> VNĐ.
                        </p>
                    </div>
                )}
            </div>
        </div>
    );
}

function LayoutCalculatorModal({ visible, onClose, configGiaLayout }) {
    const [priceMode, setPriceMode] = React.useState('TÍNH GIÁ NHẬP CTV');
    const [l, setL] = React.useState(50);
    const [w, setW] = React.useState(30);
    const [h, setH] = React.useState(30);
    const [kieuDang, setKieuDang] = React.useState(1.0);
    const [optDongGoi, setOptDongGoi] = React.useState(false);
    const [optReu, setOptReu] = React.useState(false);
    const [chiPhiPhu, setChiPhiPhu] = React.useState('');
    
    if (!visible) return null;

    // Tính diện tích = (Dài*Rộng + Dài*Cao)/10000
    const area = (l * w + l * h) / 10000;
    const parseNum = (val) => {
        if (!val && val !== 0) return 0;
        const num = Number(String(val).replace(/[^0-9.-]+/g, ''));
        return isNaN(num) ? 0 : num;
    };
    
    const lNum = parseNum(l);
    const wNum = parseNum(w);
    const hNum = parseNum(h);
    const maxSize = Math.max(lNum, wNum, hNum);
    
    let matchingRows = configGiaLayout ? configGiaLayout.filter(r => parseNum(r.Size_Max) >= maxSize).sort((a, b) => parseNum(a.Size_Max) - parseNum(b.Size_Max)) : [];
    
    let isFallback = false;
    let maxBaremSize = 0;

    if (matchingRows.length === 0 && configGiaLayout && configGiaLayout.length > 0) {
        const sortedDesc = [...configGiaLayout].sort((a, b) => parseNum(b.Size_Max) - parseNum(a.Size_Max));
        matchingRows = [sortedDesc[0]];
        isFallback = true;
        maxBaremSize = parseNum(sortedDesc[0].Size_Max) || 1;
    }
    
    const barem = matchingRows.length > 0 ? matchingRows[0] : null;
    let donGiaCoBan = barem ? parseNum(priceMode === 'BÁN LẺ' ? (barem.Gia_Ban_Le || barem.He_So_Gia) : barem.He_So_Gia) : 0;

    // Áp dụng hệ số phụ trội nếu kích thước vượt barem lớn nhất
    if (isFallback && maxBaremSize > 0) {
        donGiaCoBan = donGiaCoBan * (maxSize / maxBaremSize);
    }

    const phiDongGoi = (optDongGoi && barem) ? parseNum(barem.Phi_Gui_Xuong) : 0;
    const phiGanReu = (optReu && barem) ? parseNum(barem.Phi_Gan_Reu) : 0;
    const extra = parseNum(chiPhiPhu);

    const layoutGoc = area * donGiaCoBan * kieuDang;
    const tongPhuPhi = phiDongGoi + phiGanReu;
    const giaGocBanLe = layoutGoc + tongPhuPhi;
    
    const tongTien = giaGocBanLe + extra;

    const formatMoney = (n) => Math.round(n).toLocaleString('vi-VN');

    const handleBackdropClick = (e) => {
        if (e.target === e.currentTarget) onClose();
    };

    return (
        <React.Fragment>
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={handleBackdropClick}>
                <div className="bg-[#0a0a0a] border border-[#d4af37]/30 rounded-2xl w-full max-w-[500px] shadow-[0_0_50px_rgba(212,175,55,0.15)] overflow-hidden flex flex-col max-h-[95vh] animate-scale-up">

                    {/* HEADER */}
                    <div className="flex justify-between items-center p-4 border-b border-[#222] shrink-0">
                        <div className="flex items-center gap-3">
                            <i className="fas fa-calculator text-[#d4af37]"></i>
                            <h3 className="text-[16px] font-black text-[#d4af37] tracking-widest uppercase">ĐỊNH GIÁ LAYOUT</h3>
                        </div>
                        <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#1a1a1a] flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#333] transition-colors"><i className="fas fa-times"></i></button>
                    </div>

                    <div className="p-5 flex-1 overflow-y-auto custom-scrollbar">
                        {/* TABS */}
                        <div className="flex rounded-xl bg-[#141414] border border-[#222] p-1 mb-6">
                            <div onClick={() => setPriceMode('BÁN LẺ')} className={`flex-1 text-center py-2 text-[12px] font-bold uppercase cursor-pointer rounded-lg transition-colors ${priceMode === 'BÁN LẺ' ? 'text-black bg-gradient-to-r from-emerald-500 to-emerald-400 shadow-sm' : 'text-gray-500 hover:bg-[#222]'}`}>Bán Lẻ</div>
                            <div onClick={() => setPriceMode('TÍNH GIÁ NHẬP CTV')} className={`flex-1 text-center py-2 text-[12px] font-bold uppercase cursor-pointer rounded-lg transition-colors ${priceMode === 'TÍNH GIÁ NHẬP CTV' ? 'text-black bg-gradient-to-r from-[#d4af37] to-[#b8972e] shadow-sm' : 'text-gray-500 hover:bg-[#222]'}`}>Tính Giá Nhập CTV</div>
                        </div>

                        {/* KÍCH THƯỚC */}
                        <div className="mb-5">
                            <label className="text-[10px] font-bold text-gray-500 uppercase block mb-2 tracking-widest">KÍCH THƯỚC BỂ (DÀI x RỘNG x CAO) - CM</label>
                            <div className="flex items-center gap-3">
                                <input type="number" value={l} onChange={e => setL(e.target.value)} className="w-full bg-[#141414] border border-[#333] rounded-xl px-2 py-3 text-[16px] font-black text-white text-center outline-none focus:border-[#d4af37] transition-colors" />
                                <span className="text-gray-600 font-bold">x</span>
                                <input type="number" value={w} onChange={e => setW(e.target.value)} className="w-full bg-[#141414] border border-[#333] rounded-xl px-2 py-3 text-[16px] font-black text-white text-center outline-none focus:border-[#d4af37] transition-colors" />
                                <span className="text-gray-600 font-bold">x</span>
                                <input type="number" value={h} onChange={e => setH(e.target.value)} className="w-full bg-[#141414] border border-[#333] rounded-xl px-2 py-3 text-[16px] font-black text-white text-center outline-none focus:border-[#d4af37] transition-colors" />
                            </div>
                        </div>

                        {/* KIỂU DÁNG & OPTIONS */}
                        <div className="bg-[#141414] border border-[#222] rounded-xl p-4 mb-5">
                            <label className="text-[10px] font-bold text-[#d4af37] uppercase block mb-2 tracking-widest">KIỂU DÁNG / MỨC ĐỘ PHỨC TẠP</label>
                            <select id="ctv-kieu-dang" value={kieuDang} onChange={e => setKieuDang(Number(e.target.value))} className="w-full bg-[#0a0a0a] border border-[#333] rounded-lg px-3 py-3 text-[13px] font-bold text-white outline-none focus:border-[#d4af37] mb-4">
                                <option value={1.0}>TRĂNG, BIOTOP CUỘI, ĐẢO BAY (Hệ số 1.0)</option>
                                <option value={1.2}>VÁCH SUỐI, NHẤT TRỤ, CỔNG VÒM (Hệ số 1.2)</option>
                                <option value={1.5}>NATURE, CẦU VỒNG (Hệ số 1.5)</option>
                                <option value={2.0}>HANG ĐỘNG, HẺM NÚI (Hệ số 2.0)</option>
                                <option value={2.2}>RỪNG, BONSAI (Hệ số 2.2)</option>
                                <option value={3.0}>COVER 3.0 (Hệ số 3.0)</option>
                                <option value={5.0}>LINH THÚ (Hệ số 5.0)</option>
                            </select>

                            <div className="space-y-3">
                                <label className="flex items-center justify-between group cursor-pointer">
                                    <span className="text-[12px] font-bold text-gray-300 group-hover:text-white transition-colors uppercase">Dịch vụ đóng gói gia cố đơn hàng</span>
                                    <input type="checkbox" checked={optDongGoi} onChange={e => setOptDongGoi(e.target.checked)} className="w-5 h-5 rounded border-[#444] bg-[#0a0a0a] text-[#d4af37] focus:ring-[#d4af37] accent-[#d4af37]" />
                                </label>
                                <label className="flex items-center justify-between group cursor-pointer">
                                    <span className="text-[12px] font-bold text-gray-300 group-hover:text-white transition-colors uppercase">Gắn thêm rêu giả</span>
                                    <input type="checkbox" checked={optReu} onChange={e => setOptReu(e.target.checked)} className="w-5 h-5 rounded border-[#444] bg-[#0a0a0a] text-[#d4af37] focus:ring-[#d4af37] accent-[#d4af37]" />
                                </label>
                            </div>
                        </div>

                        {/* CHI TẾT GIÁ */}
                        <div className="mb-6">
                            <div>
                                <label className="text-[10px] font-bold text-gray-500 uppercase block mb-2 tracking-widest">CHI PHÍ PHỤ TÙY CHỈNH (VNĐ)</label>
                                <input type="number" value={chiPhiPhu} onChange={e => setChiPhiPhu(e.target.value)} placeholder="0" className="w-full bg-[#141414] border border-[#222] rounded-xl px-4 py-3 text-[14px] font-bold text-white outline-none focus:border-[#d4af37] transition-colors" />
                            </div>
                        </div>

                        {/* KẾT QUẢ */}
                        <div className="border-t border-[#222] pt-5 space-y-3">
                            <div className="flex justify-between items-center text-[13px]">
                                <span className="text-gray-400">Diện tích thiết kế quy đổi:</span>
                                <span className="text-white font-bold">{area.toFixed(3)} m2</span>
                            </div>
                            <div className="flex justify-between items-start text-[13px]">
                                <div className="flex flex-col">
                                    <span className={isFallback ? "text-amber-500 font-bold" : "text-gray-400"}>Đơn giá cơ bản {barem ? `(Bể ${barem.Size_Max})` : ''}:</span>
                                    {isFallback && <span className="text-[10px] text-amber-500/80 italic mt-0.5 max-w-[200px]">Kích thước vượt barem chuẩn. Đang nhân tỷ lệ phụ trội.</span>}
                                </div>
                                <span className={`font-bold ${isFallback ? 'text-amber-500' : 'text-white'}`}>{formatMoney(donGiaCoBan)} đ/m2</span>
                            </div>
                            <div className="flex justify-between items-center text-[13px]">
                                <span className="text-gray-400">Tiền Layout (Gốc x Hệ số {kieuDang}):</span>

                            </div>
                            <div className="flex justify-between items-center text-[13px]">

        if (activeTab === 'layout' && !cat.includes('layout')) return false;
        if (activeTab === 'be-kinh' && (!cat.includes('kính') && !cat.includes('bể'))) return false;
        if (activeTab === 'phu-kien' && !cat.includes('phụ kiện')) return false;

        if (searchTerm) {
            const term = searchTerm.toLowerCase();
            const skuMatch = p.sku && p.sku.toLowerCase().includes(term);
            const nameMatch = p.name && p.name.toLowerCase().includes(term);
            return skuMatch || nameMatch;
        }
        return true;
    });

    // Hàm Copy mã nhanh
    const handleCopy = (text) => {

function StaffReimbursementModal({ visible, onClose, pushDeltas, currentUser, triggerToast }) {
  const [amount, setAmount] = React.useState('');
  const [reason, setReason] = React.useState('');
  const [qrCodeUrl, setQrCodeUrl] = React.useState('');
  const [isUploading, setIsUploading] = React.useState(false);

  if (!visible) return null;

  const handleFileChange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setIsUploading(true);
    try {
        let base64 = "";
        if (typeof resizeImage === 'function') {
            const resImg = await resizeImage(file, 800, 800);
            base64 = resImg.includes(',') ? resImg.split(',')[1] : resImg;
        } else {
            base64 = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (ev) => resolve(ev.target.result.split(',')[1]);
                reader.readAsDataURL(file);
            });
        }
        
        triggerToast("Đang tải ảnh lên máy chủ...", "fa-spinner fa-spin", "info");
        const url = await runGAS('uploadImage', base64, `QR_REIM_${Date.now()}.jpg`);
        
        if (url) {
            setQrCodeUrl(url);
            triggerToast("Tải ảnh thành công!", "fa-check", "success");
        } else {
            triggerToast("Lỗi khi upload ảnh", "fa-times", "danger");
        }
        setIsUploading(false);
    } catch(err) {
        setIsUploading(false);
        triggerToast("Lỗi xử lý ảnh", "fa-times", "danger");
    }
  };

  const handleSubmit = () => {
    if (!amount || !reason || !qrCodeUrl) {
      triggerToast("Vui lòng nhập đủ thông tin và upload QR!", "fa-exclamation-triangle", "warning");
      return;
    }
    const req = {
      id: 'REIM_' + Date.now(),
      staffName: currentUser,
      reason: reason,
      amount: Number(amount),
      qrCodeUrl: qrCodeUrl,
      status: 'Chờ Duyệt',
      createdAt: new Date().toISOString()
    };
    pushDeltas({ Reimbursements: [req] });
    triggerToast("Đã gửi yêu cầu hoàn tiền!", "fa-check", "success");
    setAmount('');
    setReason('');
    setQrCodeUrl('');
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
      <div className="bg-gray-900 border border-gray-700 rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
        <div className="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
          <h2 className="text-xl font-bold text-yellow-500"><i className="fas fa-hand-holding-usd mr-2"></i> YÊU CẦU THANH KHOẢN</h2>
          <button onClick={onClose} className="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
        </div>
        <div className="p-6 space-y-4">
          <div>
            <label className="block text-xs font-bold text-gray-400 mb-1">SỐ TIỀN (VNĐ)</label>
            <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full bg-[#1a1a1a] border border-[#333] rounded-lg px-3 py-2 text-white font-bold outline-none focus:border-yellow-500 transition-colors" placeholder="VD: 50000" />
          </div>
          <div>
            <label className="block text-xs font-bold text-gray-400 mb-1">LÝ DO ỨNG/HOÀN</label>
            <input type="text" value={reason} onChange={(e) => setReason(e.target.value)} className="w-full bg-[#1a1a1a] border border-[#333] rounded-lg px-3 py-2 text-white outline-none focus:border-yellow-500 transition-colors" placeholder="VD: Mua keo 502" />
          </div>
          <div>
            <label className="block text-xs font-bold text-gray-400 mb-1">MÃ QR NHẬN TIỀN</label>
            <div className="flex items-center gap-4">
              <label className="cursor-pointer bg-gray-800 border border-dashed border-gray-600 rounded-lg px-4 py-2 hover:bg-gray-700 transition">
                <span className="text-sm font-bold text-gray-300">{isUploading ? 'Đang tải...' : 'Tải ảnh lên'}</span>
                
                {/* Đã thay đổi accept để tránh lỗi JSX compiler ăn comment */}
                <input type="file" className="hidden" accept="image/png, image/jpeg, image/webp, image/jpg" onChange={handleFileChange} />
                
              </label>
              {qrCodeUrl && <img src={qrCodeUrl} className="h-16 w-16 object-cover rounded border border-gray-600" alt="QR" />}
            </div>
          </div>
        </div>
        <div className="p-4 bg-gray-800 flex justify-end gap-3">
          <button onClick={onClose} className="px-4 py-2 bg-gray-700 text-gray-300 rounded hover:bg-gray-600 font-bold transition-colors">Đóng</button>
          <button onClick={handleSubmit} className="px-6 py-2 bg-yellow-600 text-white font-bold rounded shadow hover:bg-yellow-500 transition-colors">GỬI YÊU CẦU</button>
        </div>
      </div>
    </div>
  );
}


function AdminApprovalModal({ data, onClose, pushDeltas, triggerToast }) {
  if (!data) return null;
  const requestData = data;

  const handleCopyQR = async () => {
    try {
      if (requestData.qrCodeUrl.startsWith('data:image')) {
        const response = await fetch(requestData.qrCodeUrl);
        const blob = await response.blob();
        await navigator.clipboard.write([new ClipboardItem({[blob.type]: blob})]);
        triggerToast('Đã copy mã QR thành công!', 'fa-check', 'success');
      } else {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.src = requestData.qrCodeUrl;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          canvas.toBlob(async (blob) => {
             try {
                 await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
                 triggerToast('Đã copy mã QR thành công!', 'fa-check', 'success');
             } catch(err) {
                 triggerToast('Trình duyệt chặn copy. Hãy Chuột Phải -> Sao chép hình ảnh', 'fa-info-circle', 'warning');
             }
          }, 'image/png');
        };
        img.onerror = () => {
             triggerToast('Trình duyệt chặn tải ảnh. Hãy Chuột Phải -> Sao chép hình ảnh', 'fa-info-circle', 'warning');
        }
      }
    } catch (e) {
      triggerToast('Hãy bấm Chuột Phải -> Sao chép hình ảnh', 'fa-info-circle', 'warning');
    }
  };

  const handleApprove = () => {
    // Xoá Yêu cầu khỏi Vùng đệm
    pushDeltas({ deletes: { Reimbursements: [requestData.id] } });

    window.pendingAction = 'createTransaction';
    window.dispatchEvent(new CustomEvent('globalNavigateAndTrigger', { 
      detail: { 
        tab: 'cashflow', 
        trigger: 'triggerCreateTransaction', 
        data: {
          amount: requestData.amount,
          title: `Hoàn tiền vật tư: ${requestData.reason}`,
          note: `Hoàn cho nhân viên ${requestData.staffName}`
        }, 
        mode: 'ERP' 
      } 
    }));
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
      <div className="bg-gray-900 border border-gray-700 rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
        
        {/* Header */}
        <div className="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
          <h2 className="text-xl font-bold text-yellow-500"><i className="fas fa-check-circle mr-2"></i> DUYỆT HOÀN TIỀN</h2>
          <button onClick={onClose} className="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
        </div>

        {/* Body - Hiển thị QR và Thông tin */}
        <div className="p-6 space-y-4">
          <div className="text-center">
             <p className="text-gray-300">Người nhận: <span className="text-white font-bold text-lg">{requestData.staffName}</span></p>
             <p className="text-gray-300">Lý do: <span className="text-white text-lg">{requestData.reason}</span></p>
             <p className="text-3xl font-black text-green-400 my-4">{Number(requestData.amount).toLocaleString('vi-VN')} VNĐ</p>
          </div>
          
          {/* Vùng hiển thị QR Code */}
          <div className="flex flex-col items-center">
              <div className="flex justify-center bg-white p-2 rounded-lg max-w-[220px] mx-auto border-4 border-yellow-500 shadow-lg">
                 <img src={requestData.qrCodeUrl} alt="QR Code Thanh Toán" className="w-full h-auto object-contain" />
              </div>
              <button onClick={handleCopyQR} className="mt-3 px-4 py-1.5 bg-[#333] hover:bg-yellow-500 hover:text-black text-yellow-500 border border-yellow-500/50 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5">
                  <i className="fas fa-copy"></i> COPY MÃ QR NÀY
              </button>
          </div>
          <p className="text-xs text-center text-gray-500 italic mt-4">* Hãy dùng app ngân hàng quét QR trên để chuyển khoản trước khi bấm Xác nhận.</p>
        </div>

        {/* Footer - Nút Hành Động */}
        <div className="p-4 bg-gray-800 flex justify-end gap-3">
          <button onClick={onClose} className="px-4 py-2 bg-gray-700 text-gray-300 rounded hover:bg-gray-600 font-bold transition-colors">Đóng</button>
          <button 
            onClick={handleApprove}
            className="px-6 py-2 bg-yellow-600 text-white font-bold rounded shadow hover:bg-yellow-500 transition-colors"
          >
            ĐÃ CHUYỂN & TẠO PHIẾU CHI
          </button>
        </div>

      </div>
    </div>
  );
}

function ImageAnnotationModal({ item, onClose, onSave }) {
    const readOnly = item._readOnly || false;
    const [selectedImg, setSelectedImg] = React.useState('front'); 
    const [pinsFront, setPinsFront] = React.useState([]);
    const [pinsSide, setPinsSide] = React.useState([]);
    const [activePin, setActivePin] = React.useState(null); 
    const [quickNotes, setQuickNotes] = React.useState([]);
    const [extraText, setExtraText] = React.useState('');
    const imgRef = React.useRef(null);

    React.useEffect(() => {
        if (item.qc_note) {
            try {
                const parsed = JSON.parse(item.qc_note);
                setPinsFront(parsed.front || []);
                setPinsSide(parsed.side || []);
                if (parsed.front && parsed.front.length === 0 && parsed.side && parsed.side.length > 0) {
                    setSelectedImg('side');
                }
            } catch(e) {}
        }
    }, [item]);

    const QUICK_REASONS = [
        "Sai bố cục / Tỷ lệ", 
        "Rễ đơ / Sai hướng", 
        "Ghép đá lộ mí", 
        "Không giống mẫu",
        "Form chưa bay",
        "Làm quá ẩu"
    ];

    const handleImgClick = (e) => {
        if (activePin) { setActivePin(null); return; } 
        if (readOnly) return;
        
        const currentPins = selectedImg === 'front' ? pinsFront : pinsSide;
        if (currentPins.length >= 5) {
            alert('Chỉ được gắn tối đa 5 điểm lỗi trên mỗi ảnh!');
            return;
        }

        const rect = e.target.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        
        const newPin = { x, y, text: '' };
        if (selectedImg === 'front') {
            setPinsFront([...pinsFront, newPin]);
            setActivePin({ imgType: 'front', index: pinsFront.length });
        } else {
            setPinsSide([...pinsSide, newPin]);
            setActivePin({ imgType: 'side', index: pinsSide.length });
        }
    };

    const updatePinText = (text) => {
        if (!activePin) return;
        const { imgType, index } = activePin;
        if (imgType === 'front') {
            const newPins = [...pinsFront];
            newPins[index].text = text;
            setPinsFront(newPins);
        } else {
            const newPins = [...pinsSide];
            newPins[index].text = text;
            setPinsSide(newPins);
        }
    };

    const toggleQuickNote = (reason) => {
        if (readOnly) return;
        if (quickNotes.includes(reason)) setQuickNotes(quickNotes.filter(r => r !== reason));
        else setQuickNotes([...quickNotes, reason]);
    };

    const handleSave = () => {
        const hasAnyPin = pinsFront.length > 0 || pinsSide.length > 0;
        
        let finalReason = [];
        if (quickNotes.length > 0) finalReason.push(quickNotes.join(', '));
        if (extraText.trim()) finalReason.push(extraText.trim());
        
        let note = "TỪ CHỐI KHUNG";
        if (finalReason.length > 0) note += `: ${finalReason.join(' | ')}`;
        if (hasAnyPin) note += " (Có ghim lỗi cụ thể trên ảnh)";

        const upd = JSON.parse(JSON.stringify(item));
        upd.qc_status = 'Từ chối';
        upd.status = 'In Progress'; // Đặt lại trạng thái chung để thoát khỏi tab ĐÃ XONG
        if (upd.phases && upd.phases['phase1']) {
            upd.phases['phase1'].status = 'In Progress';
        }
        upd.note = note + (upd.note ? ' | ' + upd.note : '');
        
        if (hasAnyPin) {
            upd.qc_note = JSON.stringify({
                front: pinsFront,
                side: pinsSide
            });
        } else {
            upd.qc_note = '';
        }

        onSave(upd);
    };

    const currentImgSrc = selectedImg === 'front' ? item.qc_front_photo : item.qc_side_photo;
    const currentPins = selectedImg === 'front' ? pinsFront : pinsSide;

    return (
        <div className="fixed inset-0 z-[99999] bg-[#000000]/95 flex flex-col p-2 md:p-4 animate-fade-in pb-10" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="relative max-w-lg w-full mx-auto flex flex-col bg-[#111] rounded-2xl border border-white/10 shadow-2xl overflow-hidden h-full max-h-[90vh]" onClick={e => e.stopPropagation()}>
                
                {/* Header */}
                <div className="flex justify-between items-center p-3 border-b border-white/10 bg-[#1a1a1a] shrink-0">
                    <h3 className="text-[#fb7185] font-black text-[12px] uppercase tracking-wider"><i className="fas fa-exclamation-circle mr-2"></i> {readOnly ? 'CHI TIẾT LỖI KCS' : 'Báo lỗi khung'}</h3>
                    <button onClick={onClose} className="text-gray-400 hover:text-white w-8 h-8 flex items-center justify-center bg-white/5 rounded-full"><i className="fas fa-times"></i></button>
                </div>

                {/* Body scrollable */}
                <div className="flex-1 overflow-y-auto hide-scrollbar flex flex-col">
                    {/* Tabs */}
                    <div className="flex bg-[#0a0a0a] border-b border-white/10 p-2 gap-2 shrink-0">
                        <button onClick={() => setSelectedImg('front')} className={`flex-1 py-2 rounded-xl font-black text-[11px] uppercase tracking-wide transition-colors ${selectedImg==='front' ? 'bg-[#d4af37] text-black shadow-md' : 'bg-[#18181b] text-gray-400 hover:text-white'}`}>
                            MẶT TRƯỚC {pinsFront.length>0 && <span className="ml-1 bg-rose-600 text-white px-2 py-0.5 rounded-md text-[9px] shadow-inner">{pinsFront.length}</span>}
                        </button>
                        {item.qc_side_photo && (
                          <button onClick={() => setSelectedImg('side')} className={`flex-1 py-2 rounded-xl font-black text-[11px] uppercase tracking-wide transition-colors ${selectedImg==='side' ? 'bg-[#d4af37] text-black shadow-md' : 'bg-[#18181b] text-gray-400 hover:text-white'}`}>
                              MẶT NGHIÊNG {pinsSide.length>0 && <span className="ml-1 bg-rose-600 text-white px-2 py-0.5 rounded-md text-[9px] shadow-inner">{pinsSide.length}</span>}
                          </button>
                        )}
                    </div>

                    {/* Image Container */}
                    <div className="relative w-full bg-[#000] min-h-[250px] md:min-h-[350px] shrink-0 flex items-center justify-center overflow-hidden group select-none">
                        <img 
                            ref={imgRef}
                            src={currentImgSrc} 
                            className={`w-full h-auto max-h-[50vh] object-contain transition-opacity duration-300 ${!readOnly ? 'cursor-crosshair' : ''}`}
                            onClick={handleImgClick}
                            alt="QC Image"
                            draggable="false"
                        />
                        
                        {currentPins.map((pin, i) => (
                            <div 
                                key={i} 
                                className="absolute"
                                style={{ left: `${pin.x}%`, top: `${pin.y}%`, transform: 'translate(-50%, -50%)' }}
                            >
                                <div 
                                    className="w-10 h-10 flex items-center justify-center cursor-pointer relative z-10"
                                    onClick={(e) => { e.stopPropagation(); setActivePin({ imgType: selectedImg, index: i }); }}
                                >
                                    <div className="absolute inset-2 bg-yellow-500 rounded-full animate-ping opacity-60"></div>
                                    <div className="absolute inset-3 bg-[#d4af37] rounded-full shadow-[0_0_10px_rgba(212,175,55,0.8)] border border-white flex items-center justify-center text-black font-black text-[10px]">{i+1}</div>
                                </div>
                                
                                {activePin && activePin.imgType === selectedImg && activePin.index === i && (
                                    <div className="absolute top-10 left-1/2 -translate-x-1/2 w-[220px] bg-[#1a1a1a] rounded-xl shadow-2xl p-2 z-50 border border-yellow-500/30" onClick={e=>e.stopPropagation()}>
                                        {readOnly ? (
                                            <div className="w-full text-[#d4af37] text-[12px] font-black bg-[#0a0a0a] p-3 rounded-lg border border-white/10 break-words whitespace-pre-wrap">
                                                {pin.text || 'Không có ghi chú.'}
                                            </div>
                                        ) : (
                                            <textarea 
                                                autoFocus
                                                value={pin.text}
                                                onChange={e => updatePinText(e.target.value)}
                                                placeholder="Ghi chú chi tiết cho điểm này..."
                                                className="w-full text-white text-[12px] bg-[#0a0a0a] p-3 rounded-lg outline-none border border-white/10 focus:border-[#d4af37] resize-none h-20 transition-colors"
                                            ></textarea>
                                        )}
                                        <div className="flex justify-between mt-2 gap-2">
                                            {!readOnly && (
                                                <button 
                                                    onClick={() => {
                                                        if (selectedImg === 'front') setPinsFront(pinsFront.filter((_, idx) => idx !== i));
                                                        else setPinsSide(pinsSide.filter((_, idx) => idx !== i));
                                                        setActivePin(null);
                                                    }}
                                                    className="flex-1 bg-rose-500/10 text-rose-500 text-[10px] font-black uppercase tracking-wider py-2 rounded-lg hover:bg-rose-500 hover:text-white transition-colors"
                                                >
                                                    XÓA
                                                </button>
                                            )}
                                            <button 
                                                onClick={() => setActivePin(null)}
                                                className="flex-[2] bg-[#d4af37] text-black text-[10px] font-black uppercase tracking-wider py-2 rounded-lg hover:bg-yellow-500 transition-colors shadow-md"
                                            >
                                                XONG
                                            </button>
                                        </div>
                                    </div>
                                )}
                                
                                {(!activePin || activePin.index !== i) && pin.text && (
                                    <div className="absolute top-7 left-1/2 -translate-x-1/2 bg-black/90 text-[#d4af37] text-[10px] font-black uppercase px-3 py-1.5 rounded-lg whitespace-nowrap border border-[#d4af37]/40 pointer-events-none shadow-xl">
                                        {pin.text.length > 25 ? pin.text.substring(0, 25) + '...' : pin.text}
                                    </div>
                                )}
                            </div>
                        ))}
                        
                        {!currentPins.length && !readOnly && (
                            <div className="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-sm text-gray-300 text-[10px] font-black uppercase tracking-wider px-4 py-2 rounded-full pointer-events-none border border-white/10 flex items-center gap-2">
                                <div className="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div> Bấm vào vị trí lỗi để đánh dấu
                            </div>
                        )}
                    </div>

                    {/* Quick Reject / Hybrid UI */}
                    {!readOnly && (
                        <div className="p-3 bg-[#0a0a0a] flex-1 shrink-0">
                            <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Lý do nhanh (Tùy chọn)</div>
                            <div className="flex flex-wrap gap-2 mb-3">
                                {QUICK_REASONS.map(r => (
                                    <button 
                                        key={r}
                                        onClick={() => toggleQuickNote(r)}
                                        className={`px-3 py-1.5 rounded-full text-[10px] font-bold border transition-all ${quickNotes.includes(r) ? 'bg-rose-600/20 border-rose-500 text-rose-400' : 'bg-[#141414] border-[#333] text-gray-400 hover:border-gray-500'}`}
                                    >
                                        {r}
                                    </button>
                                ))}
                            </div>
                            <textarea 
                                value={extraText}
                                onChange={e => setExtraText(e.target.value)}
                                placeholder="Nhập thêm lý do hoặc mô tả chung (nếu có)..."
                                className="w-full text-white text-[12px] font-bold bg-[#141414] p-3 rounded-xl outline-none border border-[#333] focus:border-rose-500 resize-none h-16 transition-colors"
                            ></textarea>
                        </div>
                    )}
                </div>

                {/* Footer */}
                <div className="p-3 bg-[#1a1a1a] flex gap-2 border-t border-white/10 shrink-0">
                    <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-zinc-800 text-zinc-400 font-black hover:bg-zinc-700 transition-colors text-[11px] uppercase tracking-wider">
                        ĐÓNG
                    </button>
                    {!readOnly && (
                        <button onClick={handleSave} className="flex-[2] py-3 rounded-xl bg-[#e11d48] text-white font-black hover:bg-rose-500 transition-colors text-[11px] uppercase tracking-wider shadow-[0_0_15px_rgba(225,29,72,0.3)] flex items-center justify-center gap-2">
                            <i className="fas fa-paper-plane"></i> GỬI LỖI VỀ XƯỞNG
                        </button>
                    )}
                </div>
            </div>
        </div>
    );
}
</script>
