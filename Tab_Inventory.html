                      </div>
                      <div className="text-[16px] sm:text-[18px] font-mono font-black text-sky-400 tracking-tight truncate">
                          {formatMoney(catTotals['BỂ KÍNH'])}<span className="text-xs font-normal text-sky-500 ml-0.5">đ</span>
                      </div>
                  </div>

                  {/* Card 2: Layout */}
                  <div className="bg-[#121215] border border-white/[0.08] hover:border-amber-500/30 p-3 sm:p-3.5 rounded-2xl shadow-sm transition-all relative overflow-hidden group">
                      <div className="flex items-center justify-between mb-2">
                          <span className="text-[10.5px] font-bold uppercase tracking-wider text-amber-400">Giá Trị Layout</span>
                          <div className="w-7 h-7 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-xs">
                              <i className="fas fa-mountain-sun"></i>
                          </div>
                      </div>
                      <div className="text-[16px] sm:text-[18px] font-mono font-black text-amber-400 tracking-tight truncate">
                          {formatMoney(catTotals['LAYOUT'])}<span className="text-xs font-normal text-amber-500 ml-0.5">đ</span>
                      </div>
                  </div>

                  {/* Card 3: Vật Tư */}
                  <div className="bg-[#121215] border border-white/[0.08] hover:border-emerald-500/30 p-3 sm:p-3.5 rounded-2xl shadow-sm transition-all relative overflow-hidden group">
                      <div className="flex items-center justify-between mb-2">
                          <span className="text-[10.5px] font-bold uppercase tracking-wider text-emerald-400">Vật Tư Sản Xuất</span>
                          <div className="w-7 h-7 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-xs">
                              <i className="fas fa-boxes-stacked"></i>
                          </div>
                      </div>
                      <div className="text-[16px] sm:text-[18px] font-mono font-black text-emerald-400 tracking-tight truncate">
                          {formatMoney(catTotals['DANH MỤC SẢN XUẤT'])}<span className="text-xs font-normal text-emerald-500 ml-0.5">đ</span>
                      </div>
                  </div>

                  {/* Card 4: Tổng Giá Trị Kho */}
                  <div className="bg-gradient-to-br from-[#18181f] via-[#121215] to-[#09090b] border border-[#d4af37]/40 p-3 sm:p-3.5 rounded-2xl shadow-[0_0_20px_rgba(212,175,55,0.08)] relative overflow-hidden group">
                      <div className="flex items-center justify-between mb-2">
                          <span className="text-[10.5px] font-black uppercase tracking-wider text-[#d4af37]">Tổng Giá Trị Kho</span>
                          <div className="w-7 h-7 rounded-lg bg-[#d4af37]/15 border border-[#d4af37]/30 flex items-center justify-center text-[#d4af37] text-xs shadow-sm">
                              <i className="fas fa-vault"></i>
                          </div>
                      </div>
                      <div className="text-[17px] sm:text-[19px] font-mono font-black text-[#d4af37] drop-shadow-[0_0_10px_rgba(212,175,55,0.3)] tracking-tight truncate">
                          {formatMoney(totalInventoryValue)}<span className="text-xs font-normal text-[#d4af37]/80 ml-0.5">đ</span>
                      </div>
                  </div>
              </div>
          )}

          {/* THANH TÌM KIẾM VÀ CÁC THAO TÁC QUẢN TRỊ */}
          <div className="flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between w-full">
              {/* Search Bar with Glass Ring Focus */}
              <div className="flex-1 bg-[#121215] rounded-xl flex items-center border border-white/[0.08] focus-within:border-[#d4af37]/60 focus-within:ring-1 focus-within:ring-[#d4af37]/25 transition-all px-3 py-0.5 shadow-sm">
                  <i className="fas fa-search text-zinc-500 text-xs mr-2.5 shrink-0"></i>
                  <input 
                      placeholder="Tìm kiếm tên sản phẩm, mã SKU..." 
                      value={search} 
                      onChange={(e) => setSearch(e.target.value)} 
                      className="w-full py-2 text-[12px] font-bold outline-none bg-transparent text-white placeholder-zinc-500 font-sans min-w-0" 
                  />
                  {search && (
                      <button onClick={() => setSearch('')} className="text-zinc-500 hover:text-zinc-300 p-1 shrink-0 transition-colors cursor-pointer">
                          <i className="fas fa-times-circle text-xs"></i>
                      </button>
                  )}
              </div>

              {/* Action Buttons Toolbar */}
              <div className="flex items-center gap-1.5 overflow-x-auto custom-scrollbar no-scrollbar py-0.5 shrink-0 overscroll-x-contain touch-pan-x">
                  <button
                      onClick={handleExportExcel}
                      className="h-9 px-3 rounded-xl bg-emerald-950/30 hover:bg-emerald-900/50 text-emerald-300 font-bold text-[11px] uppercase tracking-wider flex items-center gap-1.5 border border-emerald-500/30 transition-all active:scale-95 cursor-pointer shadow-sm"
                      title="Xuất file Excel tồn kho"
                  >
                      <i className="fas fa-file-excel text-emerald-400"></i>
                      <span className="hidden sm:inline">Xuất Excel</span>
                  </button>

                  {(isAdmin || isAdminRole) && currentRole !== 'CTV' && (
                      <button 
                          onClick={async () => {
                              if (!window.confirm("CẢNH BÁO TÍNH TOÁN HÀNG LOẠT:\n\nBạn có muốn tự động nội suy định mức BOM và cập nhật Giá Vốn (costPrice) cho toàn bộ Layout từ Sheet Định Mức Mẫu không?")) return;
                              if (typeof triggerToast === 'function') triggerToast('Đang tính toán BOM & Giá Vốn...', 'fa-spinner fa-spin', 'info');
                              try {
                                  const res = await runGAS('autoCalculateBOMAndProductCosts');
                                  if (res && res.success) {
                                      if (typeof triggerToast === 'function') triggerToast('Đồng bộ BOM & Giá Vốn thành công!', 'fa-check', 'success');
                                      alert(res.message);
                                      if (typeof refreshData === 'function') refreshData();
                                  } else {
                                      alert(res?.message || 'Có lỗi xảy ra!');
                                  }
                              } catch(e) {
                                  alert('Lỗi: ' + e.message);
                              }
                          }}
                          className="h-9 px-3 rounded-xl bg-indigo-950/30 hover:bg-indigo-900/50 text-indigo-300 font-bold text-[11px] uppercase tracking-wider flex items-center gap-1.5 border border-indigo-500/30 transition-all active:scale-95 cursor-pointer shadow-sm"
                          title="Tự động tính BOM và Giá Vốn cho toàn bộ Layout từ Sheet Mẫu"
                      >
                          <i className="fas fa-calculator text-indigo-400"></i>
                          <span className="hidden sm:inline">Tính BOM</span>
                      </button>
                  )}

                  {(isAdmin || isAdminRole) && currentRole !== 'CTV' && (
                      <button 
                          onClick={() => setShowBulkEditPrice(true)} 
                          className="h-9 px-3 rounded-xl bg-purple-950/30 hover:bg-purple-900/50 text-purple-300 font-bold text-[11px] uppercase tracking-wider flex items-center gap-1.5 border border-purple-500/30 transition-all active:scale-95 cursor-pointer shadow-sm"
                          title="Sửa giá hàng loạt"
                      >
                          <i className="fas fa-edit text-purple-400"></i>
                          <span className="hidden sm:inline">Sửa Giá</span>
                      </button>
                  )}

                  {isAdminRole && currentRole !== 'CTV' && (
                      <button 
                          onClick={() => setEditProd({})} 
                          className="h-9 px-3.5 rounded-xl bg-gradient-to-r from-[#d4af37] to-[#f0ca5e] text-zinc-950 font-black text-[11px] uppercase tracking-wider flex items-center gap-1.5 shadow-[0_0_12px_rgba(212,175,55,0.2)] hover:brightness-110 transition-all active:scale-95 cursor-pointer"
                          title="Thêm hàng hóa mới"
                      >
                          <i className="fas fa-plus"></i>
                          <span>Thêm Hàng</span>
                      </button>
                  )}
              </div>
          </div>

          {/* PHÂN LOẠI KHO HÀNG (SEGMENTED RIBBON) */}
          <div className="flex overflow-x-auto gap-2 py-1 custom-scrollbar no-scrollbar items-center overscroll-x-contain touch-pan-x">
              {[
                  { id: 'KHO HÀNG HOÁ', label: 'Kho Hàng Hoá (Phụ Kiện)', icon: 'fa-plug', badgeColor: 'text-sky-400 border-sky-500/30 bg-sky-500/10' },
                  { id: 'KHO THÀNH PHẨM', label: 'Kho Thành Phẩm (Layout/Bể)', icon: 'fa-mountain-sun', badgeColor: 'text-[#d4af37] border-[#d4af37]/30 bg-[#d4af37]/10' },
                  { id: 'KHO NGUYÊN LIỆU', label: 'Kho Nguyên Liệu (Vật Tư)', icon: 'fa-boxes-stacked', badgeColor: 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10' }
              ].map(tab => {
                  const isActive = catFilter === tab.id && !isSearching;
                  return (
                      <button 
                          key={tab.id} 
                          onClick={() => { setCatFilter(tab.id); setSubCatFilter(null); setSearch(''); }} 
                          className={`px-3.5 py-2.5 rounded-xl text-[11px] font-bold uppercase transition-all shrink-0 border flex items-center gap-2 cursor-pointer active:scale-95 ${
                              isActive 
                                  ? `${tab.badgeColor} font-black shadow-sm` 
                                  : 'bg-[#121215] text-zinc-400 hover:text-zinc-200 border-white/[0.08] hover:border-white/[0.14]'
                          }`}
                      >
                          <i className={`fas ${tab.icon} text-xs`}></i>
                          <span>{tab.label}</span>
                      </button>
                  );
              })}
          </div>

          {/* EXECUTIVE SUMMARY STRIP FOR CURRENT WAREHOUSE CATEGORY */}
          {!isSearching && !subCatFilter && (
              <div className="bg-[#121215] border border-white/[0.08] px-3.5 py-2.5 rounded-2xl flex items-center justify-between gap-3 text-xs flex-wrap shadow-sm">
                  <div className="flex items-center gap-2">
                      <i className="fas fa-layer-group text-[#d4af37] text-xs"></i>
                      <span className="font-bold text-zinc-200 uppercase tracking-wide text-[11px]">{catFilter}</span>
                      <span className="text-[10px] text-zinc-400 font-mono">({activeFolders.length} nhóm danh mục)</span>
                  </div>
                  <div className="flex items-center gap-3 sm:gap-4 font-mono text-[11px] flex-wrap">
                      <span>Tổng mẫu: <b className="text-zinc-100 font-bold">{warehouseTotalModels}</b></span>
                      <span>Tổng tồn: <b className="text-sky-400 font-bold">{formatMoney(warehouseTotalQty)}</b></span>
                      {canViewCost && (
                          <span>Tổng giá trị kho: <b className="text-emerald-400 font-bold">{formatMoney(warehouseTotalVal)}đ</b></span>
                      )}
                  </div>
              </div>
          )}

          {/* DANH SÁCH SẢN PHẨM HOẶC BENTO FOLDER TILES */}
          {(isSearching || subCatFilter) ? (
              <div className="space-y-2.5 animate-fade-in">
                  {!isSearching && ( 
                      <div className="flex items-center justify-between gap-2 pb-1">
                          <button 
                              onClick={() => setSubCatFilter(null)} 
                              className="text-zinc-200 bg-[#121215] px-3.5 py-2 rounded-xl text-[11px] font-bold border border-white/[0.08] active:scale-95 hover:bg-white/[0.05] hover:border-white/[0.15] transition-all flex items-center gap-2 cursor-pointer shadow-sm"
                          >
                              <i className="fas fa-arrow-left text-[#d4af37]"></i>
                              <span>Quay lại {catFilter}</span>
                          </button>
                          <div className="text-[11px] font-bold text-zinc-400">
                              Đang xem: <span className="text-[#d4af37] uppercase">{subCatFilter}</span> ({groupedProducts.length} mẫu)
                          </div>
                      </div> 
                  )}
                  {groupedProducts.length === 0 ? (
                      <div className="text-center py-12 text-zinc-500 font-bold text-xs bg-[#121215] rounded-2xl border border-dashed border-white/[0.08]">
                          <i className="fas fa-box-open text-2xl mb-2 text-zinc-600 block"></i>
                          Không tìm thấy hàng hoá nào phù hợp!
                      </div>
                  ) : (
                      groupedProducts.map((group) => ( 
                          <VariantGroupCard 
                              key={group.baseName} 
                              group={group} 
                              setEditProd={setEditProd} 
                              setAddVarGroup={setAddVarGroup} 
                              pushData={pushData} 
                              data={data} 
                          /> 
                      ))
                  )}
              </div>
          ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1 animate-fade-in">
                  {activeFolders.length === 0 ? (
                      <div className="col-span-full text-center py-12 text-zinc-500 font-bold text-xs bg-[#121215] rounded-2xl border border-dashed border-white/[0.08]">
                          Chưa có danh mục con nào trong nhóm này
                      </div>
                  ) : (
                      activeFolders.map(folder => {
                          const folderProducts = uniqueProducts.filter(p => activeCategories.includes(String(p.category || '').toUpperCase().trim()) && ((p.sub_category || '').toUpperCase() || 'KHÁC') === folder);
                          const uniqueBaseNames = new Set();
                          folderProducts.forEach(p => {
                              let baseName = p.name || 'Chưa đặt tên'; 
                              if (p.name && p.name.includes(' - ')) { 
                                  baseName = p.name.split(' - ')[0].trim(); 
                              }
                              uniqueBaseNames.add(baseName);
                          });
                          const numVers = uniqueBaseNames.size;
                          const totalQty = folderProducts.reduce((sum, p) => sum + (Number(p.quantity) || 0), 0);
                          const totalVal = folderProducts.reduce((sum, p) => sum + ((Number(p.quantity) || 0) * (Number(p.costPrice) || 0)), 0);
                          const firstImage = folderProducts.find(p => p.image)?.image || folderProducts.find(p => p.realImage)?.realImage;
                          const outCount = folderProducts.filter(p => Number(p.quantity || 0) <= 0).length;

                          return ( 
                              <div 
                                  key={folder} 
                                  onClick={() => setSubCatFilter(folder)} 
                                  className="bg-[#121215] p-3.5 rounded-2xl border border-white/[0.08] cursor-pointer active:scale-[0.98] hover:border-white/[0.2] hover:bg-[#16161c] transition-all duration-200 flex items-center gap-3.5 shadow-sm group select-none relative overflow-hidden"
                              >
                                  {/* Thumbnail or Stylized Category Icon */}
                                  <div className="w-14 h-14 min-w-[56px] min-h-[56px] max-w-[56px] max-h-[56px] shrink-0 bg-[#09090b] rounded-xl flex items-center justify-center border border-white/[0.08] overflow-hidden shadow-sm group-hover:border-[#d4af37]/30 transition-colors relative">
                                      {firstImage ? (
                                          <img 
                                              src={typeof rfOptimizeImageUrl === 'function' ? rfOptimizeImageUrl(firstImage, 'sm') : firstImage} 
                                              className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" 
                                              alt="thumbnail" 
                                              loading="lazy" 
                                              decoding="async" 
                                          />
                                      ) : (
                                          <div className="w-full h-full flex items-center justify-center bg-white/[0.02]">
                                              <i className={`fas ${getSubCategoryIcon(folder)} text-xl text-[#d4af37]/80 group-hover:text-[#d4af37] transition-colors`}></i>
                                          </div>
                                      )}
                                  </div>
                                  
                                  {/* Folder Info */}
                                  <div className="flex-1 min-w-0">
                                      <div className="flex justify-between items-center mb-1">
                                          <h4 className="font-bold text-[13px] text-zinc-100 uppercase tracking-wide truncate pr-2 group-hover:text-[#d4af37] transition-colors">
                                              {folder}
                                          </h4>
                                          {outCount > 0 && (
                                              <span className="bg-rose-500/15 text-rose-400 border border-rose-500/30 text-[9px] font-black uppercase px-2 py-0.5 rounded-full shrink-0">
                                                  {outCount} hết hàng
                                              </span>
                                          )}
                                      </div>
                                      <div className="flex flex-wrap items-center gap-x-3 gap-y-0.5 text-[11px] text-zinc-400">
                                          <span><b className="font-mono font-bold text-zinc-200">{numVers}</b> mẫu</span>
                                          <span>Tồn: <b className="font-mono font-bold text-sky-400">{formatMoney(totalQty)}</b></span>
                                          {canViewCost && (
                                              <span>Giá trị: <b className="text-[#d4af37] font-mono font-bold">{formatMoney(totalVal)}đ</b></span>
                                          )}
                                      </div>
                                  </div>
                                  <div className="pr-1 text-zinc-600 group-hover:text-[#d4af37] group-hover:translate-x-0.5 transition-all">
                                      <i className="fas fa-chevron-right text-xs"></i>
                                  </div>
                              </div> 
                          );
                      })
                  )}
              </div>
          )}

          {editProd && (
              <ProductEditModal prod={editProd} onClose={() => setEditProd(null)} pushData={pushData} currentCat={catFilter} data={data} />
          )}
          {addVarGroup && (
            <AddVariantModal group={addVarGroup} onClose={() => setAddVarGroup(null)} pushData={pushData} data={data} />
          )}
          {showBulkEditPrice && (
            <BulkEditPriceModal data={data} pushData={pushData} onClose={() => setShowBulkEditPrice(false)} />
          )}
      </div>
  );
}

// =========================================================================
// 6. MAIN COMPONENT: INVENTORY TAB WRAPPER (InventoryTab)
// =========================================================================
const InventoryTab = React.memo(function InventoryTab(props) {
  const [activeSubTab, setActiveSubTab] = React.useState('KHO_HANG');
  
  return (
    <div className="w-full max-w-full flex flex-col space-y-3.5 overflow-x-hidden">
      {/* ROYAL WORKBENCH SUB-TABS SEGMENTED CONTROL */}
      <div className="flex bg-[#121215] border border-white/[0.08] rounded-2xl p-1 shrink-0 gap-1 shadow-sm overflow-x-auto custom-scrollbar no-scrollbar overscroll-x-contain touch-pan-x max-w-full">
          <button 
              onClick={() => setActiveSubTab('KHO_HANG')} 
              className={`flex-1 min-w-[100px] py-2.5 px-3 text-[11px] font-bold uppercase transition-all rounded-xl flex items-center justify-center gap-2 cursor-pointer active:scale-95 ${
                  activeSubTab === 'KHO_HANG' 
                      ? 'bg-gradient-to-r from-[#d4af37]/20 to-[#f0ca5e]/15 text-[#d4af37] border border-[#d4af37]/35 font-black shadow-sm' 
                      : 'text-zinc-400 hover:text-zinc-200 hover:bg-white/[0.03]'
              }`}
          >
              <i className="fas fa-boxes text-xs"></i>
              <span>Kho Hàng</span>
          </button>
          
          <button 
              onClick={() => setActiveSubTab('NHAT_KY')} 
              className={`flex-1 min-w-[100px] py-2.5 px-3 text-[11px] font-bold uppercase transition-all rounded-xl flex items-center justify-center gap-2 cursor-pointer active:scale-95 ${
                  activeSubTab === 'NHAT_KY' 
                      ? 'bg-sky-500/20 text-sky-300 border border-sky-500/35 font-black shadow-sm' 
                      : 'text-zinc-400 hover:text-zinc-200 hover:bg-white/[0.03]'
              }`}
          >
              <i className="fas fa-history text-xs"></i>
              <span>Nhật Ký</span>
          </button>
          
          <button 
              onClick={() => setActiveSubTab('KIEM_KHO')} 
              className={`flex-1 min-w-[100px] py-2.5 px-3 text-[11px] font-bold uppercase transition-all rounded-xl flex items-center justify-center gap-2 cursor-pointer active:scale-95 ${
                  activeSubTab === 'KIEM_KHO' 
                      ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/35 font-black shadow-sm' 
                      : 'text-zinc-400 hover:text-zinc-200 hover:bg-white/[0.03]'
              }`}
          >
              <i className="fas fa-clipboard-check text-xs"></i>
              <span>Kiểm Kho</span>
          </button>
      </div>

      {/* TAB CONTENT */}
      <div className="flex-1 w-full animate-fade-in">
          {activeSubTab === 'KHO_HANG' && <InventoryListView {...props} />}
          {activeSubTab === 'NHAT_KY' && (typeof ImportExportTab !== 'undefined' ? <ImportExportTab {...props} mode="NHAT_KY" /> : <div className="text-white text-xs p-4">Đang tải Lịch sử kho...</div>)}
          {activeSubTab === 'KIEM_KHO' && (typeof ImportExportTab !== 'undefined' ? <ImportExportTab {...props} mode="KIEM_KHO" /> : <div className="text-white text-xs p-4">Đang tải Kiểm kho...</div>)}
      </div>
    </div>
  );
});
</script>
