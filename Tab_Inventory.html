                      const folderProducts = uniqueProducts.filter(p => p.category === catFilter && ((p.sub_category || '').toUpperCase() || 'KHÁC') === folder);
                      const uniqueBaseNames = new Set();
                      folderProducts.forEach(p => {
                          let baseName = p.name || 'Chưa đặt tên'; 
                          if (p.name && p.name.includes(' - ')) { 
                              baseName = p.name.split(' - ')[0].trim(); 
                          }
                          uniqueBaseNames.add(baseName);
                      });
                      const numVers = uniqueBaseNames.size;
                      
                      const totalQty = folderProducts.reduce((sum, p) => sum + (Number(p.quantity) || 0), 0);
                      const totalVal = folderProducts.reduce((sum, p) => sum + ((Number(p.quantity) || 0) * (Number(p.costPrice) || 0)), 0);
                      const firstImage = folderProducts.find(p => p.image)?.image;
                      
                      return ( 
                      <div key={folder} onClick={()=>setSubCatFilter(folder)} className={"bg-[#141414] p-3.5 rounded-2xl border border-[#2a2a2a] cursor-pointer active:scale-95 transition-all flex items-center gap-4 relative group hover:border-[#d4af37]/50 shadow-sm"}>
                          <div className={"w-14 h-14 shrink-0 bg-[#0a0a0a] rounded-xl flex items-center justify-center border border-[#333] group-hover:border-[#d4af37]/50 transition-colors overflow-hidden"}>
                              {firstImage ? (
                                  <img src={firstImage} className="w-full h-full object-cover" alt="thumbnail" />
                              ) : (
                                  <i className={"fas fa-folder text-2xl text-[#d4af37] opacity-80"}></i>
                              )}
                          </div>
                          
                          <div className={"flex-1 min-w-0"}>
                              <div className={"flex justify-between items-start mb-1.5"}>
                                  <h4 className={"font-black text-[13px] text-gray-200 uppercase tracking-wide leading-tight truncate pr-2"}>{folder}</h4>
                                  {outOfStockInSubCat(folder) > 0 && (
                                      <span className={"bg-rose-500/10 text-rose-500 border border-rose-500/20 text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm animate-pulse whitespace-nowrap"}>{outOfStockInSubCat(folder)} hết</span>
                                  )}
                              </div>
                              <div className={"flex flex-wrap items-center gap-x-3 gap-y-1"}>
                                  <span className={"text-[10px] font-bold text-gray-500"}><i className={"fas fa-barcode mr-1 text-[#444]"}></i>{numVers} ver</span>
                                  <span className={"text-[10px] font-bold text-gray-500"}><i className={"fas fa-box-open mr-1 text-[#444]"}></i>Tồn: <span className={"text-white"}>{formatMoney(totalQty)}</span></span>
                                  {canViewCost && (
                                      <span className={"text-[10px] font-bold text-[#d4af37]"}><i className={"fas fa-coins mr-1 text-[#d4af37]/50"}></i>{formatMoney(totalVal)}đ</span>
                                  )}
                              </div>
                          </div>
                          <div className={"pr-2 text-gray-600 group-hover:text-[#d4af37] transition-colors"}>
                              <i className={"fas fa-chevron-right"}></i>
                          </div>
                      </div> 
                      );
                  })}
              </div>
          )}

          {editProd && (
              <ProductEditModal prod={editProd} onClose={() => setEditProd(null)} pushData={pushData} currentCat={catFilter} data={data} />
          )}
          {addVarGroup && (
            <AddVariantModal group={addVarGroup} onClose={() => setAddVarGroup(null)} pushData={pushData} data={data} />
          )}
          {showBulkEditPrice && (
            <BulkEditPriceModal data={data} pushData={pushData} onClose={() => setShowBulkEditPrice(false)} />
          )}
      </div>
  );
}

function FactoryInventoryCheck({ data, pushData, triggerToast }) {
    const products = data?.Products || [];
    const orders = data?.Orders || [];
    
    const factoryMaterials = React.useMemo(() => {
        const map = new Map();
        products.filter(p => {
            const cat = String(p.category || '').toUpperCase();
            const subCat = String(p.subCategory || '').toUpperCase();
            return cat.includes('DANH MỤC SẢN XUẤT') || cat.includes('NGUYÊN LIỆU') || cat.includes('VẬT TƯ') || 
                   subCat.includes('DANH MỤC SẢN XUẤT') || subCat.includes('NGUYÊN LIỆU') || subCat.includes('VẬT TƯ');
        }).forEach(p => {
            const key = String(p.name || '').toLowerCase().trim();
            if (!key) return;
            if (map.has(key)) {
                const existing = map.get(key);
                existing.quantity = Number(existing.quantity || 0) + Number(p.quantity || 0);
                existing._allIds = existing._allIds || [existing.id];
                if (!existing._allIds.includes(p.id)) existing._allIds.push(p.id);
                map.set(key, existing);
            } else {
                map.set(key, { ...p, _allIds: [p.id] });
            }
        });
        return Array.from(map.values());
    }, [products]);

    const [actualQtys, setActualQtys] = React.useState({});
    const [isCalculating, setIsCalculating] = React.useState(false);
    
    // Default to system qty if not set
    React.useEffect(() => {
        const initialQtys = {};
        factoryMaterials.forEach(m => {
            initialQtys[m.id] = Number(m.quantity || 0);
        });
        setActualQtys(initialQtys);
    }, [products.length]); // depend on products.length to trigger once loaded

    const handleQtyChange = (id, val) => {
        setActualQtys(prev => ({ ...prev, [id]: val === '' ? '' : Number(val) }));
    };

    const isTargetStatus = (status) => {
        const s = String(status || '').trim().toLowerCase();
        return s === 'đã bàn giao' || s === 'chờ bàn giao' || s === 'hoàn thành';
    };

    const handleCalculateAndAllocate = async () => {
        if (!window.confirm('Xác nhận chốt tồn kho xưởng và phân bổ Giá Vốn (COGS) cho các đơn hàng chưa phân bổ?')) return;
        setIsCalculating(true);

        try {
            // 1. Calculate Current Inventory Value
            let currentInventoryValue = 0;
            factoryMaterials.forEach(m => {
                const qty = Number(actualQtys[m.id] ?? m.quantity ?? 0);
                const price = Number(m.costPrice || m.price || 0);
                currentInventoryValue += (qty * price);
            });

            // 2. systemInventoryValue
            let systemInventoryValue = 0;
            factoryMaterials.forEach(m => {
                const sysQty = Number(m.quantity || 0);
                const price = Number(m.costPrice || m.price || 0);
                systemInventoryValue += (sysQty * price);
            });

            let consumedValue = systemInventoryValue - currentInventoryValue;
            if (consumedValue < 0) consumedValue = 0; // cannot consume negative

            // 3. Target Orders
            const targetOrders = orders.filter(o => 
                isTargetStatus(o.status) && 
                (!o.cogs || Number(o.cogs) === 0) &&
                (o.channel !== 'Bảo Hành' && o.channel !== 'Bảo Hành & Thu Hồi')
            );

            let totalCoefficient = 0;
            targetOrders.forEach(o => {
                totalCoefficient += Number(o.sizeCoefficient || 1.0);
            });

            if (totalCoefficient === 0) {
                triggerToast('Không có đơn hàng nào cần phân bổ (Tổng hệ số = 0)!', 'fa-exclamation', 'warning');
                setIsCalculating(false);
                return;
            }

            const unitCost = consumedValue / totalCoefficient;
            
            // 4. Order updates
            const orderUpdates = targetOrders.map(o => ({
                id: o.id,
                cogs: Math.round(unitCost * Number(o.sizeCoefficient || 1.0))
            }));

            // 5. Product updates & Deduplication
            const productUpdates = [];
            const productDeletes = [];
            
            factoryMaterials.forEach(m => {
                const actQty = Number(actualQtys[m.id] ?? m.quantity ?? 0);
                // Nếu có thay đổi số lượng HOẶC phát hiện có bản sao trùng lặp, cập nhật lại bản ghi chính xác
                if (actQty !== Number(m.quantity || 0) || (m._allIds && m._allIds.length > 1)) {
                    productUpdates.push({ id: m.id, quantity: actQty });
                    
                    // Xóa vĩnh viễn các bản ghi rác (duplicate) khỏi database
                    if (m._allIds && m._allIds.length > 1) {
                        m._allIds.forEach(dupId => {
                            if (dupId !== m.id) productDeletes.push(dupId);
                        });
                    }
                }
            });

            const payload = {};
            if (orderUpdates.length > 0) payload.Orders = orderUpdates;
            if (productUpdates.length > 0) payload.Products = productUpdates;
            if (productDeletes.length > 0) payload.deletes = { Products: productDeletes };

            if (Object.keys(payload).length > 0) {
                await pushData(payload);
            }
            
            triggerToast(`Đã phân bổ COGS thành công! Tổng tiêu hao: ${consumedValue.toLocaleString('vi-VN')}đ`, 'fa-check', 'success');
        } catch (e) {
            console.error(e);
            triggerToast('Lỗi khi phân bổ!', 'fa-times', 'danger');
        } finally {
            setIsCalculating(false);
        }
    };

    const formatMoney = (val) => Number(val || 0).toLocaleString('vi-VN');
    const systemVal = factoryMaterials.reduce((acc, m) => acc + (Number(m.quantity||0) * Number(m.costPrice || m.price || 0)), 0);
    const actualVal = factoryMaterials.reduce((acc, m) => acc + (Number(actualQtys[m.id] ?? m.quantity ?? 0) * Number(m.costPrice || m.price || 0)), 0);
    const diff = systemVal - actualVal;
    
    const unallocatedOrders = orders.filter(o => 
        isTargetStatus(o.status) && 
        (!o.cogs || Number(o.cogs) === 0) && 
        (o.channel !== 'Bảo Hành' && o.channel !== 'Bảo Hành & Thu Hồi')
    );
    const totalCoeff = unallocatedOrders.reduce((acc, o) => acc + Number(o.sizeCoefficient || 1.0), 0).toFixed(1);

    const safeJSONParse = (str) => { try { return JSON.parse(str); } catch(e) { return []; } };

    const handleAutoFixAndAllocate = async () => {
        if (!window.confirm('Hệ thống sẽ TỰ ĐỘNG đọc kết quả đếm từ các Phiếu Kiểm Kho vừa tạo, tính ra Tiền Tiêu Hao và phân bổ thẳng vào Đơn hàng. Sau đó dọn dẹp các phiếu sai. Dữ liệu đếm của nhân viên vẫn ĐƯỢC GIỮ NGUYÊN! Xác nhận?')) return;
        setIsCalculating(true);
        try {
            const startOfToday = new Date().setHours(0,0,0,0);
            
            const targetLogs = (data?.ImportExport || []).filter(log => {
                if (!String(log.id).includes('IE_GCHK')) return false;
                const ts = Number(log.id.split('_').pop() || 0);
                if (ts > startOfToday) {
                    let parsed = safeJSONParse(log.itemsData) || [];
                    // Only target logs that modify our 58 factory materials
                    return parsed.some(it => factoryMaterials.some(m => m.name === it.name));
                }
                return false;
            });

            if (targetLogs.length === 0) {
                triggerToast('Không tìm thấy phiếu kiểm kho sai nào trong hôm nay!', 'fa-info-circle', 'warning');
                setIsCalculating(false);
                return;
            }

            // 1. Calculate consumed value directly from the wrong logs!
            let consumedValue = 0;
            targetLogs.forEach(log => {
                let parsed = safeJSONParse(log.itemsData) || [];
                parsed.forEach(item => {
                    const m = factoryMaterials.find(x => x.name === item.name);
                    if (m) {
                        const price = Number(m.costPrice || m.price || 0);
                        const qty = Number(item.qty || 0);
                        if (log.type === 'Xuất') consumedValue += (qty * price);
                        else if (log.type === 'Nhập') consumedValue -= (qty * price);
                    }
                });
            });

            if (consumedValue < 0) consumedValue = 0;

            // 2. Allocate to orders
            if (unallocatedOrders.length === 0) {
                triggerToast('Không có đơn hàng chờ phân bổ!', 'fa-times', 'danger');
                setIsCalculating(false);
                return;
            }

            const totalCoeffValue = unallocatedOrders.reduce((acc, o) => acc + Number(o.sizeCoefficient || 1.0), 0);
            const unitCost = consumedValue / totalCoeffValue;
            
            const orderUpdates = unallocatedOrders.map(o => ({
                id: o.id,
                cogs: Math.round(unitCost * Number(o.sizeCoefficient || 1.0))
            }));

            // 3. Delete the wrong logs (DO NOT revert Products table, keep the physical counts!)
            const payload = { 
                deletes: { ImportExport: targetLogs.map(l => l.id) }, 
                Orders: orderUpdates 
            };
            
            // Xóa rác (duplicate) nếu phát hiện
            const productUpdates = [];
            const productDeletes = [];
            factoryMaterials.forEach(m => {
                if (m._allIds && m._allIds.length > 1) {
                    productUpdates.push({ id: m.id, quantity: Number(m.quantity || 0) });
                    m._allIds.forEach(dupId => {
                        if (dupId !== m.id) productDeletes.push(dupId);
                    });
                }
            });
            if (productUpdates.length > 0) payload.Products = productUpdates;
            if (productDeletes.length > 0) payload.deletes.Products = productDeletes;

            await pushData(payload);
            triggerToast(`Đã Fix & Phân Bổ thành công! Tiêu hao: ${consumedValue.toLocaleString('vi-VN')}đ`, 'fa-magic', 'success');
        } catch (e) {
            triggerToast('Lỗi khi khôi phục', 'fa-times', 'danger');
            console.error(e);
        } finally {
            setIsCalculating(false);
        }
    };

    return (
        <React.Fragment>
            <div className="flex flex-col gap-4 animate-fade-in">
                <div className="bg-[#10b981]/10 border border-[#10b981]/20 rounded-xl p-4 flex flex-col md:flex-row justify-between gap-4 shadow-sm">
                    <div>
                        <h3 className="text-[#10b981] font-black uppercase text-[13px] tracking-widest flex items-center gap-2 mb-2">
                            <i className="fas fa-balance-scale"></i> TRẠM QUẢN TRỊ KẾ TOÁN SẢN XUẤT
                        </h3>
                        <p className="text-gray-400 text-[11px] max-w-xl">
                            Thuật toán <b>"Chia Tỉ Trọng Toàn Xưởng"</b>: Tính toán tổng lượng vật tư tiêu hao trong kỳ và phân bổ đều vào giá vốn (COGS) của các đơn hàng dựa trên <b className="text-white">Hệ số kích thước bể</b>. TUYỆT ĐỐI không ghi đè Giá Vốn Dự Kiến (costTotal).
                        </p>
                    </div>
                    <div className="bg-[#0a0a0a] border border-[#222] rounded-xl p-3 shrink-0 flex flex-col justify-center min-w-[200px]">
                        <div className="flex justify-between items-center mb-1">
                            <span className="text-[10px] font-bold text-gray-500 uppercase">Tồn hệ thống</span>
                            <span className="text-[11px] font-black text-gray-300">{formatMoney(systemVal)}đ</span>
                        </div>
                        <div className="flex justify-between items-center mb-1 border-b border-[#222] pb-1">
                            <span className="text-[10px] font-bold text-[#10b981] uppercase">Tồn thực tế</span>
                            <span className="text-[11px] font-black text-[#10b981]">{formatMoney(actualVal)}đ</span>
                        </div>
                        <div className="flex justify-between items-center mt-1">
                            <span className="text-[10px] font-bold text-rose-500 uppercase">GIÁ TRỊ TIÊU HAO</span>
                            <span className="text-[14px] font-black text-rose-500">{formatMoney(Math.max(0, diff))}đ</span>
                        </div>
                    </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-[1fr_300px] gap-4 items-start">
                    {/* List of Materials */}
                    <div className="bg-[#141414] border border-[#2a2a2a] rounded-xl overflow-hidden shadow-sm">
                        <div className="p-3 bg-[#1a1a1a] border-b border-[#2a2a2a] flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <i className="fas fa-boxes text-[#d4af37]"></i>
                                <h4 className="text-[11px] font-black text-white uppercase tracking-wider">Danh Sách Vật Tư Xưởng ({factoryMaterials.length})</h4>
                            </div>
                            {factoryMaterials.some(m => actualQtys[m.id] !== undefined && Number(actualQtys[m.id]) !== Number(m.quantity || 0)) && (
                                <span className="text-[9px] font-black bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded-full animate-pulse">
                                    CÓ TIÊU HAO BIẾN ĐỘNG
                                </span>
                            )}
                        </div>
                        <div className="max-h-[50vh] overflow-y-auto custom-scrollbar p-2">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                {factoryMaterials.map(m => {
                                    const sysQty = Number(m.quantity || 0);
                                    const curQty = actualQtys[m.id] === '' ? '' : Number(actualQtys[m.id] ?? sysQty);
                                    const isChanged = curQty !== '' && curQty !== sysQty;
                                    
                                    return (
                                        <div key={m.id} className={`rounded-lg p-2.5 flex items-center justify-between gap-3 transition-all ${
                                            isChanged 
                                                ? 'bg-rose-950/20 border border-rose-500/50 shadow-[0_0_10px_rgba(244,63,94,0.1)]' 
                                                : 'bg-[#0a0a0a] border border-[#333] hover:border-[#444]'
                                        }`}>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-1.5">
                                                    <div className="text-[11px] font-bold text-gray-300 truncate" title={m.name}>{m.name}</div>
                                                    {isChanged && (
                                                        <span className="text-[8px] font-black bg-rose-500/30 text-rose-400 px-1 py-0.2 rounded shrink-0">
                                                            {curQty < sysQty ? `-${sysQty - curQty}` : `+${curQty - sysQty}`}
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="text-[9px] text-[#60a5fa] font-medium mt-0.5">Giá vốn: {formatMoney(m.costPrice || m.price)}đ / {m.unit || 'Cái'}</div>
                                            </div>
                                            <div className="flex flex-col items-end gap-1 shrink-0">
                                                <div className="text-[9px] font-bold text-gray-500">Sổ sách: <span className="text-gray-300">{sysQty}</span></div>
                                                <div className="flex items-center gap-1.5">
                                                    <span className={`text-[9px] font-black uppercase mt-0.5 ${isChanged ? 'text-rose-400' : 'text-[#10b981]'}`}>Thực tế:</span>
                                                    <input 
                                                        type="number" 
                                                        value={actualQtys[m.id] ?? sysQty} 
                                                        onChange={e => handleQtyChange(m.id, e.target.value)} 
                                                        className={`w-[60px] rounded text-[11px] font-bold text-center outline-none py-0.5 transition-colors ${
                                                            isChanged 
                                                                ? 'bg-rose-950/40 border border-rose-500/70 text-rose-300 focus:border-rose-400' 
                                                                : 'bg-[#1a1a1a] border border-[#444] text-[#10b981] focus:border-[#10b981]'
                                                        }`}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* Info Panel & Action */}
                    <div className="bg-[#0a0a0c] border border-[#222] rounded-xl p-4 shadow-sm sticky top-4">
                        <h4 className="text-[11px] font-black text-white uppercase tracking-wider border-b border-[#222] pb-2 mb-3">Thông Tin Phân Bổ</h4>
                        <div className="space-y-3 mb-4">
                            <div className="bg-[#111] p-3 rounded-lg border border-[#333]">
                                <div className="text-[10px] font-bold text-gray-500 uppercase mb-1">Đơn hàng chờ phân bổ</div>
                                <div className="text-[15px] font-black text-[#60a5fa]">
                                    {unallocatedOrders.length} <span className="text-[11px] text-gray-500 font-bold">đơn</span>
                                </div>
                            </div>
                            <div className="bg-[#111] p-3 rounded-lg border border-[#333]">
                                <div className="text-[10px] font-bold text-gray-500 uppercase mb-1">Tổng hệ số K.Thước</div>
                                <div className="text-[15px] font-black text-[#d4af37]">
                                    {totalCoeff}
                                </div>
                            </div>
                        </div>

                        <button 
                            onClick={handleCalculateAndAllocate} 
                            disabled={isCalculating || unallocatedOrders.length === 0}
                            className="w-full py-3 bg-gradient-to-r from-[#10b981] to-[#059669] hover:from-[#059669] hover:to-[#047857] disabled:opacity-50 disabled:cursor-not-allowed text-white font-black text-[11px] uppercase tracking-wider rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.2)] active:scale-95 transition-all flex items-center justify-center gap-2"
                        >
                            {isCalculating ? <><i className="fas fa-spinner fa-spin"></i> ĐANG PHÂN BỔ...</> : <><i className="fas fa-magic"></i> CHỐT TỒN &amp; PHÂN BỔ</>}
                        </button>
                        
                        <div className="mt-3 text-[9px] text-gray-500 font-medium text-center italic border-b border-[#222] pb-3 mb-3">
                            Thao tác này sẽ cập nhật số lượng tồn kho thực tế và áp mã Giá Vốn Phân Bổ (COGS) cho các đơn hàng chưa chốt.
                        </div>

                        <button 
                            onClick={handleAutoFixAndAllocate} 
                            disabled={isCalculating}
                            className="w-full py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 border border-rose-500/30 hover:border-rose-500/50 disabled:opacity-50 font-black text-[10px] uppercase tracking-wider rounded-lg active:scale-95 transition-all flex items-center justify-center gap-2"
                        >
                            <i className="fas fa-tools"></i> 1-CLICK SỬA LỖI KIỂM KHO SAI
                        </button>
                    </div>
                </div>
            </div>
        </React.Fragment>
    );
}

          <button 
              onClick={() => setActiveSubTab('KIEM_KHO')} 
              className={`flex-1 py-3.5 text-[11px] font-black uppercase transition-all rounded-xl relative z-10 flex items-center justify-center gap-2 ${activeSubTab === 'KIEM_KHO' ? 'bg-zinc-800/80 border-t border-white/10 text-[#f59e0b] shadow-[0_0_20px_rgba(245,158,11,0.15)] drop-shadow-[0_0_5px_rgba(245,158,11,0.5)]' : 'text-gray-500 hover:text-gray-300 hover:bg-white/5'}`}
          >
              <i className="fas fa-clipboard-check text-[13px]"></i> Kiểm Kho
          </button>
          
          <button 
              onClick={() => setActiveSubTab('PHAN_BO')} 
              className={`flex-1 py-3.5 text-[11px] font-black uppercase transition-all rounded-xl relative z-10 flex items-center justify-center gap-2 ${activeSubTab === 'PHAN_BO' ? 'bg-emerald-900/40 border-t border-emerald-500/30 text-[#10b981] shadow-[0_0_20px_rgba(16,185,129,0.2)] drop-shadow-[0_0_5px_rgba(16,185,129,0.5)]' : 'text-gray-500 hover:text-[#10b981] hover:bg-[#10b981]/10'}`}
          >
              <i className="fas fa-balance-scale text-[13px]"></i> Phân Bổ Xưởng
          </button>
      </div>

      {/* TAB CONTENT */}
      <div className="flex-1 w-full animate-fade-in">
          {activeSubTab === 'KHO_HANG' && <InventoryListView {...props} />}
          {activeSubTab === 'NHAT_KY' && (typeof ImportExportTab !== 'undefined' ? <ImportExportTab {...props} mode="NHAT_KY" /> : <div className="text-white">Đang tải Lịch sử...</div>)}
          {activeSubTab === 'KIEM_KHO' && (typeof ImportExportTab !== 'undefined' ? <ImportExportTab {...props} mode="KIEM_KHO" /> : <div className="text-white">Đang tải Kiểm kho...</div>)}
          {activeSubTab === 'PHAN_BO' && <FactoryInventoryCheck {...props} />}
      </div>
    </div>
  );
});
</script>
