<script type="text/babel">
function VariantGroupCard({ group, setEditProd, setAddVarGroup, pushData }) { 
    const [selectedVarId, setSelectedVarId] = React.useState(group.items[0]?.id);
    const selectedVar = group.items.find(item => item.id === selectedVarId) || group.items[0] || {};
    const [previewImg, setPreviewImg] = React.useState(null); 
    const [preview3D, setPreview3D] = React.useState(null);
    const formatMoney = (val) => Number(val || 0).toLocaleString('vi-VN');
    const isBoss = localStorage.getItem('rf_boss') === 'true';
    const currentRole = localStorage.getItem('rf_role');
    const canEdit = isBoss || currentRole === 'KHO VẬN' || currentRole === 'QUẢN LÝ KHO VẬN';
    const canViewCost = currentRole === 'QUẢN LÝ KHO' || currentRole === 'TỐI CAO' || currentRole === 'KẾ TOÁN';

    const [expanded, setExpanded] = React.useState(false);

    return ( 
        <React.Fragment>
        <div className={`bg-[#09090b]/60 backdrop-blur-xl rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.3)] border border-white/5 relative overflow-hidden group hover:border-[#d4af37]/40 hover:shadow-[0_8px_30px_rgba(212,175,55,0.15)] transition-all duration-300 mb-3 ${expanded ? 'p-4 bg-gradient-to-br from-zinc-900/80 to-black/90' : 'p-3'}`}> 
            {/* Header / Compact view */}
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setExpanded(!expanded)}>
                {/* Thumbnail */}
                <div className={`shrink-0 bg-black/50 rounded-xl overflow-hidden border border-white/10 flex items-center justify-center relative shadow-inner transition-all group-hover:border-[#d4af37]/30 ${expanded ? 'w-20 h-20 sm:w-24 sm:h-24' : 'w-14 h-14'}`}>
                    {group.image ? <img src={group.image} className="w-full h-full object-cover" alt="img" /> : <i className="fas fa-box-open text-[#333] text-2xl"></i>}
                    {currentRole !== 'CTV' && Number(selectedVar.quantity || 0) <= 0 ? (
                        <div className={`absolute bottom-0 w-full bg-rose-600/90 backdrop-blur text-white font-black uppercase tracking-widest text-center py-1 border-t border-rose-500 ${expanded ? 'text-[9px]' : 'text-[6px]'}`}>
                            HẾT HÀNG
                        </div>
                    ) : (currentRole !== 'CTV' && Number(selectedVar.minStock || 0) > 0 && Number(selectedVar.quantity || 0) <= Number(selectedVar.minStock || 0)) ? (
                        <div className={`absolute bottom-0 w-full bg-amber-500/90 backdrop-blur text-black font-black uppercase tracking-widest text-center py-1 border-t border-amber-400 animate-pulse ${expanded ? 'text-[9px]' : 'text-[6px]'}`}>
                            CẦN NHẬP
                        </div>
                    ) : null}
                </div>
                {/* Info */}
                <div className="flex-1 min-w-0 pr-4">
                    <h4 className={`font-black text-[#f5f5f5] leading-tight truncate transition-all ${expanded ? 'text-[14px] sm:text-[15px] mb-1' : 'text-[12px]'}`}>{group.baseName}</h4>
                    <div className="text-[10px] font-black text-gray-500 uppercase tracking-widest flex items-center gap-1.5 mt-1">
                        <span className="text-[#d4af37] bg-[#d4af37]/10 px-1.5 py-0.5 rounded border border-[#d4af37]/20 shadow-sm">{selectedVar.sku}</span>
                        {!expanded && (
                           <>
                              <span className="text-[#10b981] ml-2">{formatMoney(selectedVar.price)}đ</span>
                              <span className="text-gray-400 ml-2">| Tồn: {selectedVar.quantity || 0}</span>
                           </>
                        )}
                    </div>
                </div>
                <div className="pr-3 text-gray-400 group-hover:text-white transition-colors">
                    <i className={`fas fa-chevron-${expanded ? 'up' : 'down'}`}></i>
                </div>
            </div>

            {/* Expanded details */}
            {expanded && (
               <div className="mt-3 pt-3 border-t border-white/10 animate-fade-in relative">
                   {canEdit && ( 
                       <div className="absolute -top-11 right-0 flex gap-1.5 z-10"> 
                           <button onClick={(e) => { e.stopPropagation(); setEditProd(selectedVar); }} className="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-[#d4af37] bg-[#0a0a0a] rounded-lg border border-[#333] transition-colors shadow-sm" title="Chỉnh sửa sản phẩm"> 
                               <i className="fas fa-pencil-alt text-[11px]"></i> 
                           </button> 
                           {isBoss && (
                               <button onClick={(e) => { 
                                   e.stopPropagation();
                                   if(window.confirm(`Bạn có chắc muốn XÓA VĨNH VIỄN mã [${selectedVar.sku}] và tất cả các mục bị trùng lặp của nó?`)) { 
                                       pushData({deletes: {Products: selectedVar._allIds || [selectedVar.id]}});
                                   } 
                               }} className="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-rose-500 bg-[#0a0a0a] rounded-lg border border-[#333] hover:border-rose-500/30 transition-colors shadow-sm" title="Xóa sản phẩm"> 
                                   <i className="fas fa-trash text-[11px]"></i> 
                               </button> 
                           )}
                       </div> 
                   )}

                   <div className="flex-1 min-w-0">
                        <div className={"flex flex-wrap gap-2 mb-1"}>
                            {group.items.map(item => ( 
                                <button 
                                    key={item.id} 
                                    onClick={(e) => { e.stopPropagation(); setSelectedVarId(item.id); }} 
                                    className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-wider transition-all shadow-sm ${
                                        selectedVar.id === item.id 
                                            ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)] border border-white/10' 
                                            : 'bg-white/5 text-gray-400 border border-white/10 hover:border-white/20 hover:text-white hover:bg-white/10'
                                    }`}
                                >
                                    {item.variantLabel || 'MẶC ĐỊNH'}
                                </button> 
                            ))}
                            
                            {canEdit && (
                                <button 
                                    onClick={(e) => { e.stopPropagation(); setAddVarGroup(group); }} 
                                    className={"px-2.5 py-1.5 rounded-lg text-[9px] font-black bg-[#0a0a0a] text-[#2563eb] border border-[#2563eb]/30 hover:bg-[#2563eb] hover:text-white transition-colors flex items-center justify-center shadow-sm"}
                                    title="Thêm phân loại mới"
                                >
                                    <i className={"fas fa-plus"}></i>
                                </button>
                            )}
                        </div>
                    </div>

                    <div className={"flex justify-between items-end mt-4 pt-4 border-t border-white/10"}>
                        <div className={"flex gap-4 sm:gap-6"}>
                            {currentRole !== 'CTV' && (
                                <div>
                                    <span className={"text-[9px] font-black text-gray-500 block mb-1 uppercase tracking-widest"}><i className={"fas fa-tag mr-1 text-[#444]"}></i>Giá Vốn</span>
                                    <span className={"text-[12px] font-bold text-gray-400"}>{canViewCost ? <>{formatMoney(selectedVar.costPrice)}<span className={"text-[9px]"}>đ</span></> : '******'}</span>
                                </div>
                            )}
                            <div>
                                <span className={"text-[9px] font-black text-gray-500 block mb-1 uppercase tracking-widest"}><i className={"fas fa-shopping-cart mr-1 text-[#444]"}></i>Giá Bán</span>
                                <span className={"text-[14px] font-black text-[#10b981]"}>{formatMoney(selectedVar.price)}<span className={"text-[10px]"}>đ</span></span>
                            </div>
                            {selectedVar.price > 0 && selectedVar.costPrice > 0 && canViewCost && currentRole !== 'CTV' && (
                                <div>
                                    <span className={"text-[9px] font-black text-gray-500 block mb-1 uppercase tracking-widest"}><i className={"fas fa-chart-line mr-1 text-[#444]"}></i>Lợi Nhuận</span>
                                    <span className={"text-[12px] font-black text-[#d4af37] block"}>
                                        {formatMoney(selectedVar.price - selectedVar.costPrice)}đ <span className="text-[9px] text-[#10b981] font-bold ml-0.5">({((selectedVar.price - selectedVar.costPrice) / selectedVar.price * 100).toFixed(0)}%)</span>
                                    </span>
                                </div>
                            )}
                        </div>
                        
                        <div className={"flex items-center gap-2"}>
                            {currentRole !== 'CTV' && (
                                <div className={"flex items-center bg-black/40 rounded-xl border border-white/10 p-1.5 shadow-inner divide-x divide-white/10 backdrop-blur-sm"}>
                                    <div className={"px-2 text-center min-w-[32px]"}>
                                        <div className={"text-[7px] font-black text-gray-500 uppercase tracking-widest"}>Min</div>
                                        <div className={"text-[10px] font-bold text-gray-400"}>{selectedVar.minStock || 0}</div>
                                    </div>
                                    <div className={"px-3 text-center cursor-help"} title="Tồn kho hiện tại">
                                        <div className={"text-[8px] font-black text-[#d4af37] uppercase tracking-widest mb-0.5"}>Tồn Kho</div>
                                        <div className={`text-[14px] font-black leading-none ${Number(selectedVar.quantity || 0) <= 0 ? 'text-rose-500 animate-pulse' : 'text-[#d4af37]'}`}>
                                            {selectedVar.quantity || 0}
                                        </div>
                                    </div>
                                    <div className={"px-2 text-center min-w-[32px]"}>
                                        <div className={"text-[7px] font-black text-gray-500 uppercase tracking-widest"}>Max</div>
                                        <div className={"text-[10px] font-bold text-gray-400"}>{selectedVar.maxStock || 0}</div>
                                    </div>
                                </div>
                            )}

                            {selectedVar.realImage && (
                                <button 
                                    onClick={(e) => { e.stopPropagation(); setPreviewImg(selectedVar.realImage); }}
                                    className={"w-10 h-10 rounded-xl bg-[#d4af37]/10 text-[#d4af37] border border-[#d4af37]/30 flex items-center justify-center hover:bg-[#d4af37] hover:text-[#0a0a0a] transition-all active:scale-95 shadow-[0_0_10px_rgba(212,175,55,0.1)]"}
                                    title="Xem ảnh thực tế Layout cho thợ"
                                >
                                    <i className={"fas fa-camera-retro text-[14px]"}></i>
                                </button>
                            )}
                            
                            {selectedVar.model3D && (
                                <button 
                                    onClick={(e) => { e.stopPropagation(); setPreview3D(selectedVar.model3D); }}
                                    className={"w-10 h-10 rounded-xl bg-[#3b82f6]/10 text-[#3b82f6] border border-[#3b82f6]/30 flex items-center justify-center hover:bg-[#3b82f6] hover:text-white transition-all active:scale-95 shadow-[0_0_10px_rgba(59,130,246,0.1)]"}
                                    title="Xem mô hình 3D"
                                >
                                    <i className={"fas fa-cube text-[14px]"}></i>
                                </button>
                            )}
                            
                            {currentRole !== 'CTV' && (
                                <button 
                                    onClick={() => window.dispatchEvent(new CustomEvent('openStockHistory', {detail: selectedVar}))} 
                                    className={"w-10 h-10 rounded-xl bg-[#10b981]/10 text-[#10b981] border border-[#10b981]/30 flex items-center justify-center hover:bg-[#10b981] hover:text-white transition-all active:scale-95 shadow-[0_0_10px_rgba(16,185,129,0.1)]"}
                                    title="Thẻ Kho"
                                >
                                    <i className={"fas fa-history text-[14px]"}></i>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>

        {previewImg && (
            <div className={"fixed inset-0 z-[9999] bg-black/90 flex flex-col items-center justify-center p-4 backdrop-blur-md animate-fade-in"} onClick={() => setPreviewImg(null)}>
                <div className={"relative max-w-2xl w-full flex flex-col items-center animate-slide-up"} onClick={e => e.stopPropagation()}>
                    <button className={"absolute -top-12 right-0 text-white/70 hover:text-rose-400 text-2xl w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/20 rounded-full transition-all"} onClick={() => setPreviewImg(null)}>
                        <i className={"fas fa-times"}></i>
                    </button>
                    <img src={previewImg} alt="Preview" className={"w-full h-auto max-h-[80vh] object-contain rounded-2xl shadow-[0_0_40px_rgba(212,175,55,0.2)] border border-white/10"} />
                    <div className={"mt-5 flex items-center justify-center gap-2 text-[#d4af37] text-[11px] font-black uppercase tracking-[0.2em] bg-[#0a0a0a] px-6 py-2.5 rounded-full border border-[#d4af37]/30 shadow-sm"}>
                        <i className={"fas fa-eye"}></i> GÓC NHÌN THỰC TẾ TỪ THỢ LAYOUT
                    </div>
                </div>
            </div>
        )}
        
        {preview3D && (
            <div className={"fixed inset-0 z-[9999] bg-black/95 flex flex-col items-center justify-center p-0 backdrop-blur-md animate-fade-in"} onClick={() => setPreview3D(null)}>
                <div className={"relative w-full h-full flex flex-col items-center animate-slide-up"} onClick={e => e.stopPropagation()}>
                    <button className={"absolute top-4 right-4 z-10 text-white/70 hover:text-rose-400 text-3xl w-12 h-12 flex items-center justify-center bg-black/50 hover:bg-black/80 rounded-full transition-all border border-white/10"} onClick={() => setPreview3D(null)}>
                        <i className={"fas fa-times"}></i>
                    </button>
                    <model-viewer 
                        key={preview3D}
                        src={preview3D} 
                        auto-rotate="true" 
                        camera-controls="true" 
                        shadow-intensity="1"
                        style={{width: '100%', height: '80vh', minHeight: '400px', backgroundColor: '#09090b', outline: 'none'}}
                    >
                    </model-viewer>
                    <div className={"absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center justify-center gap-2 text-[#3b82f6] text-[11px] font-black uppercase tracking-[0.2em] bg-[#0a0a0a]/80 backdrop-blur px-6 py-2.5 rounded-full border border-[#3b82f6]/30 shadow-sm whitespace-nowrap"}>
                        <i className={"fas fa-cube"}></i> CỔNG HIỂN THỊ 3D TRỰC QUAN
                    </div>
                </div>
            </div>
        )}
        </React.Fragment>
    );
}

function ProductEditModal({ prod, onClose, pushData, currentCat, data }) {
  const isNew = !prod || !prod.id;
  const [form, setForm] = React.useState({
    id: prod?.id || ('PROD_' + Date.now()),
    sku: prod?.sku || '',
    name: prod?.name || '',
    category: prod?.category || currentCat || 'PHỤ KIỆN',
    sub_category: prod?.sub_category || '',
    costPrice: prod?.costPrice || 0,
    price: prod?.price || 0,
    quantity: prod?.quantity || 0,
    image: prod?.image || '',
    minStock: prod?.minStock || 0,
    maxStock: prod?.maxStock || 0,
    realImage: prod?.realImage || '',
    model3D: prod?.model3D || '',
    unit: prod?.unit || 'Cái',
    importUnit: prod?.importUnit || '',
    conversionRate: prod?.conversionRate || 1
  });
  
  const [showConversion, setShowConversion] = React.useState(!!prod?.importUnit);
  const [skuError, setSkuError] = React.useState('');

  const initialBom = React.useMemo(() => {
    if (!prod || !prod.id) return [];
    return (data?.BOM_Config || []).filter(b => b.product_id === prod.id);
  }, [prod, data]);
  const [bomItems, setBomItems] = React.useState(initialBom);

  const materials = React.useMemo(() => {
      return (data?.Products || []).filter(p => p.category === 'PHỤ KIỆN' || p.category === 'DANH MỤC SẢN XUẤT');
  }, [data]);

  const existingSkus = React.useMemo(() => {
    const setObj = new Set();
    if (data && data.Products) {
        data.Products.forEach(p => {
            if (p.sku) setObj.add(String(p.sku).trim().toLowerCase());
        });
    }
    return setObj;
  }, [data]);

  React.useEffect(() => {
    const currentSku = String(form.sku || '').trim().toLowerCase();
    if (currentSku === '') {
      setSkuError('');
      return;
    }
    const prodSku = String(prod?.sku || '').trim().toLowerCase();
    const isDuplicate = existingSkus.has(currentSku) && (isNew || prodSku !== currentSku);
    if (isDuplicate) {
        setSkuError('Mã SKU này đã tồn tại!');
    } else {
        setSkuError('');
    }
  }, [form.sku, existingSkus, isNew, prod]);

  const categories = typeof CATEGORIES !== 'undefined' ? CATEGORIES : ['LAYOUT', 'BỂ KÍNH', 'PHỤ KIỆN', 'DANH MỤC SẢN XUẤT'];
  const subCats = (typeof SUB_CATEGORIES !== 'undefined' && SUB_CATEGORIES[form.category]) ? SUB_CATEGORIES[form.category] : [];

  const handleSave = async () => {
    if (form.name.trim() === '') return triggerToast ? triggerToast('Tên sản phẩm không được để trống!', 'fa-exclamation', 'warning') : alert('Tên sản phẩm không được để trống!');
    if (form.sku.trim() === '') return triggerToast ? triggerToast('Mã SKU không được để trống!', 'fa-exclamation', 'warning') : alert('Mã SKU không được để trống!');
    if (skuError !== '') return triggerToast ? triggerToast(skuError, 'fa-exclamation', 'warning') : alert(skuError);

    try {
      const oldQty = Number(prod?.quantity) || 0;
      const newQty = Number(form.quantity) || 0;
      const diffVal = newQty - oldQty;

      const payloadItem = {
        ...form,
        costPrice: Number(form.costPrice) || 0,
        price: Number(form.price) || 0,
        quantity: newQty,
        _diff: diffVal,
        minStock: Number(form.minStock) || 0,
        maxStock: Number(form.maxStock) || 0,
        conversionRate: Number(form.conversionRate) || 1,
        category: form.category || 'PHỤ KIỆN',
        sub_category: form.sub_category || 'KHÁC'
      };
      
      const payload = { Products: [payloadItem] };
      const oldRealImage = prod?.realImage || '';
      const oldImage = prod?.image || '';
      const oldModel3D = prod?.model3D || '';
      
      if (!isNew && form.category === 'LAYOUT' && (form.realImage !== oldRealImage || form.image !== oldImage || form.model3D !== oldModel3D)) {
          const baseName = form.name.split(' - ')[0];
          const confirmBulk = window.confirm(`CẢNH BÁO ĐỒNG BỘ:\n\nBạn vừa đổi ảnh/3D của mẫu [${baseName}].\nBạn có muốn tự động áp dụng ảnh/3D này cho TẤT CẢ các kích thước khác của mẫu này không?`);
          
          if (confirmBulk) {
              const relatedProducts = (data.Products || []).filter(p => p.id !== form.id && p.name && (p.name === baseName || p.name.startsWith(baseName + ' - ')));
              relatedProducts.forEach(p => {
                  payload.Products.push({
                      id: p.id,
                      image: form.image,          
                      realImage: form.realImage,
                      model3D: form.model3D
                  });
              });
          }
      }

      if (form.category === 'LAYOUT' || form.category === 'BỂ KÍNH') {
          payload.BOM_Config = bomItems.map(b => ({
              ...b,
              id: b.id || 'BOM_' + Date.now() + Math.random().toString(36).substr(2,5),
              product_id: form.id
          }));
          const bomIdsToKeep = bomItems.map(b => b.id).filter(Boolean);
          const bomIdsToDelete = initialBom.filter(b => !bomIdsToKeep.includes(b.id)).map(b => b.id);
          if (bomIdsToDelete.length > 0) {
              payload.deletes = payload.deletes || {};
              payload.deletes.BOM_Config = bomIdsToDelete;
          }
      }

      await pushData(payload);
      onClose();
    } catch (e) {
      if (triggerToast) triggerToast('Lỗi lưu sản phẩm: ' + e.message, 'fa-times', 'danger'); else alert('Lỗi lưu sản phẩm: ' + e.message);
    }
  };

  const isDuplicate = skuError !== '';
  const disableSave = isDuplicate || form.sku.trim() === '' || form.name.trim() === '';

  return (
    <div className={"fixed inset-0 bg-black/80 flex items-end sm:items-center justify-center z-[9999] p-4 backdrop-blur-sm"}>
      <div className={"bg-[#141414] border border-[#333] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl flex flex-col"}>
        
        <div className={"flex justify-between items-center mb-4 shrink-0"}>
          <div className={"font-black text-lg text-[#d4af37]"}>{isNew ? 'THÊM HÀNG MỚI' : 'CHỈNH SỬA HÀNG HOÁ'}</div>
          <button onClick={onClose} className={"text-3xl text-gray-500 hover:text-white"}>×</button>
        </div>

        <div className={"space-y-3 text-sm max-h-[70vh] overflow-y-auto custom-scrollbar pr-1 flex-1"}>
          <div>
            <label className={"text-[10px] font-black text-gray-400 block mb-1"}>TÊN SẢN PHẨM</label>
            <input value={form.name} onChange={(e) => setForm({...form, name: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#444] rounded-xl px-3 py-2.5 text-white font-bold outline-none focus:border-[#d4af37]"} placeholder="Tên đầy đủ" />
          </div>

          <div className={"grid grid-cols-2 gap-3"}>
            <div>
              <label className={"text-[10px] font-black text-gray-400 block mb-1"}>MÃ SKU <span className={"text-rose-500"}>*</span></label>
              <input value={form.sku} onChange={(e) => setForm({...form, sku: e.target.value})} className={`w-full bg-[#0a0a0a] border ${isDuplicate ? 'border-rose-500' : 'border-[#444]'} rounded-xl px-3 py-2.5 text-[#d4af37] font-black outline-none focus:border-[#d4af37]`} placeholder="SKU-001" />
              {isDuplicate && <div className={"text-rose-500 text-[10px] font-bold mt-1 flex items-center gap-1"}><i className={"fas fa-exclamation-circle"}></i> {skuError}</div>}
            </div>
            <div>
              <label className={"text-[10px] font-black text-gray-400 block mb-1"}>DANH MỤC</label>
              <select value={form.category} onChange={(e) => setForm({...form, category: e.target.value, sub_category: ''})} className={"w-full bg-[#0a0a0a] border border-[#444] rounded-xl px-3 py-2.5 text-white font-bold outline-none focus:border-[#d4af37]"}>
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>

          <div>
            <label className={"text-[10px] font-black text-gray-400 block mb-1"}>DANH MỤC CON / PHIÊN BẢN</label>
            <input value={form.sub_category} onChange={(e) => setForm({...form, sub_category: e.target.value})} list="subcat-list" className={"w-full bg-[#0a0a0a] border border-[#444] rounded-xl px-3 py-2.5 text-white font-bold outline-none focus:border-[#d4af37]"} placeholder="VD: LINH THÚ" />
            <datalist id="subcat-list">
              {subCats.map(s => <option key={s} value={s}>{s}</option>)}
            </datalist>
          </div>

          <div className={"grid grid-cols-3 gap-3"}>
            <div>
              <label className={"text-[10px] font-black text-gray-400 block mb-1"}>GIÁ VỐN</label>
              <input type="number" value={form.costPrice} onChange={(e) => setForm({...form, costPrice: e.target.value})} className={"w-full bg-[#0a0a0a] border border-[#444] rounded-xl px-3 py-2.5 text-white font-black outline-none focus:border-[#d4af37]"} />
            </div>
            <div>

function AddVariantModal({ group, onClose, pushData, data }) {
  const [variantLabel, setVariantLabel] = React.useState('');
  const [sku, setSku] = React.useState('');
  const [costPrice, setCostPrice] = React.useState(group.items[0]?.costPrice || 0);
  const [price, setPrice] = React.useState(group.items[0]?.price || 0);
  const [quantity, setQuantity] = React.useState(0);
  
  const [unit, setUnit] = React.useState(group.items[0]?.unit || 'Cái');
  const [importUnit, setImportUnit] = React.useState(group.items[0]?.importUnit || '');
  const [conversionRate, setConversionRate] = React.useState(group.items[0]?.conversionRate || 1);
  const [showConversion, setShowConversion] = React.useState(!!group.items[0]?.importUnit);
  
  const [skuError, setSkuError] = React.useState('');

  const existingSkus = React.useMemo(() => {
    const setObj = new Set();
    if (data && data.Products) {
        data.Products.forEach(p => {
            if (p.sku) setObj.add(String(p.sku).trim().toLowerCase());
        });
    }
    return setObj;
  }, [data]);

  React.useEffect(() => {
    const current = String(sku || '').trim().toLowerCase();
    if (current === '') {
      setSkuError('');
      return;
    }
    if (existingSkus.has(current)) {
        setSkuError('Mã SKU này đã tồn tại!');
    } else {
        setSkuError('');
    }
  }, [sku, existingSkus]);

  const baseName = group.baseName;
  const fullName = variantLabel ? `${baseName} - ${variantLabel}` : baseName;
  const isDuplicate = skuError !== '';

  const handleAdd = async () => {
    if (variantLabel.trim() === '') return triggerToast ? triggerToast('Vui lòng nhập tên phân loại!', 'fa-exclamation', 'warning') : alert('Vui lòng nhập tên phân loại!');
    if (sku.trim() === '') return triggerToast ? triggerToast('Mã SKU không được để trống!', 'fa-exclamation', 'warning') : alert('Mã SKU không được để trống!');
    if (skuError !== '') return triggerToast ? triggerToast(skuError, 'fa-exclamation', 'warning') : alert(skuError);

    try {
      const newProd = {
        id: 'PROD_' + Date.now(),
        sku: sku.trim(),
        name: fullName.trim(),
        category: group.items[0]?.category || 'PHỤ KIỆN',
        sub_category: group.items[0]?.sub_category || '',
        costPrice: Number(costPrice) || 0,
        price: Number(price) || 0,
        quantity: Number(quantity) || 0,
        unit,
        importUnit: showConversion ? importUnit : '',
        conversionRate: showConversion ? (Number(conversionRate) || 1) : 1,
        image: group.image || group.items[0]?.image || ''
      };

      await pushData({ Products: [newProd] });
      onClose();
    } catch(e) {
      if (triggerToast) triggerToast('Lỗi tạo phân loại: ' + e.message, 'fa-times', 'danger'); else alert('Lỗi tạo phân loại: ' + e.message);
    }
  };

  const disableSave = isDuplicate || variantLabel.trim() === '' || sku.trim() === '';

  return (
    <div className={"fixed inset-0 bg-black/80 flex items-end sm:items-center justify-center z-[9999] p-4 backdrop-blur-sm"}>
      <div className={"bg-[#141414] border border-[#333] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl flex flex-col"}>
        
        <div className={"flex justify-between items-center mb-3 shrink-0"}>
          <div>
            <div className={"font-black text-lg text-[#2563eb]"}>THÊM PHÂN LOẠI MỚI</div>
            <div className={"text-[#d4af37] font-bold text-sm truncate"}>{baseName}</div>
          </div>
          <button onClick={onClose} className={"text-3xl text-gray-500 hover:text-white leading-none"}>×</button>
        </div>

        <div className={"bg-[#0a0a0a] border border-[#222] rounded-xl p-3 mb-4 text-xs text-gray-400 shrink-0"}>
          Tên đầy đủ: <span className={"font-black text-white"}>{fullName}</span>
        </div>

        <div className={"space-y-3 text-sm flex-1"}>
          <div>
            <label className={"text-[10px] font-black text-gray-400 block mb-1"}>TÊN PHÂN LOẠI</label>
            <input autoFocus value={variantLabel} onChange={(e) => setVariantLabel(e.target.value)} className={"w-full bg-[#0a0a0a] border border-[#444] rounded-xl px-3 py-2.5 text-white font-bold outline-none focus:border-[#2563eb]"} placeholder="VD: Màu Trắng" />
          </div>

          <div>
             <label className={"text-[10px] font-black text-gray-400 block mb-1"}>MÃ SKU <span className={"text-rose-500"}>*</span></label>
             <input value={sku} onChange={(e) => setSku(e.target.value)} className={`w-full bg-[#0a0a0a] border ${isDuplicate ? 'border-rose-500' : 'border-[#444]'} rounded-xl px-3 py-2.5 text-[#d4af37] font-black outline-none focus:border-[#d4af37]`} placeholder="SKU-001" />
             {isDuplicate && <div className={"text-rose-500 text-[10px] font-bold mt-1 flex items-center gap-1"}><i className={"fas fa-exclamation-circle"}></i> {skuError}</div>}
          </div>

          <div className={"mt-3 p-3 bg-zinc-900/50 rounded-xl border border-white/5"}>
              <div className="flex justify-between items-center mb-2">
                  <label className={"text-[10px] font-black text-gray-400 block uppercase tracking-widest"}><i className="fas fa-balance-scale mr-1 text-[#2563eb]"></i> ĐƠN VỊ TÍNH</label>
                  {!showConversion && (
                      <button onClick={() => setShowConversion(true)} className="text-[9px] font-black text-emerald-500 bg-emerald-500/10 px-2.5 py-1.5 rounded-lg border border-emerald-500/30 hover:bg-emerald-500 hover:text-black transition-colors active:scale-95"><i className="fas fa-plus mr-1"></i>ĐV QUY ĐỔI</button>
                  )}
              </div>
              
              <div className="flex gap-3">
                  <div className="flex-1">
                      <label className={"text-[9px] font-bold text-gray-500 block mb-1"}>ĐV CƠ BẢN</label>
                      <input type="text" value={unit} onChange={(e) => setUnit(e.target.value)} className={"w-full bg-[#0a0a0a] border border-[#444] rounded-lg px-3 py-2 text-[#2563eb] font-black outline-none focus:border-[#2563eb] uppercase placeholder-gray-600"} placeholder="VD: CÁI" />
                  </div>
                  {showConversion && (
                      <div className="flex-[2] grid grid-cols-2 gap-2 animate-fade-in pl-3 border-l border-white/10 relative">
                          <button onClick={() => {setShowConversion(false); setImportUnit(''); setConversionRate(1)}} className="absolute -top-6 right-0 text-[9px] text-rose-500 hover:text-rose-400 font-bold"><i className="fas fa-times"></i> Hủy</button>
                          <div>
                              <label className={"text-[9px] font-bold text-emerald-500 block mb-1"}>ĐV NHẬP LÔ</label>
                              <input type="text" value={importUnit} onChange={(e) => setImportUnit(e.target.value)} className={"w-full bg-[#0a0a0a] border border-emerald-500/30 rounded-lg px-3 py-2 text-emerald-400 font-black outline-none focus:border-emerald-500 uppercase placeholder-gray-600"} placeholder="VD: THÙNG" />
                          </div>
                          <div>
                              <label className={"text-[9px] font-bold text-emerald-500 block mb-1 truncate"}>TỶ LỆ QUY ĐỔI</label>
                              <div className="flex items-center gap-1.5">
                                  <input type="number" value={conversionRate} onChange={(e) => setConversionRate(e.target.value)} className={"w-full bg-[#0a0a0a] border border-emerald-500/30 rounded-lg px-3 py-2 text-emerald-400 font-black outline-none focus:border-emerald-500 placeholder-gray-600 text-center"} placeholder="100" />
                                  <span className="text-[9px] text-gray-500 font-bold uppercase w-10 truncate">{unit || 'CÁI'}</span>
                              </div>
                          </div>
                      </div>
                  )}
              </div>
          </div>

          <div className={"grid grid-cols-3 gap-3"}>
            <div>
              <label className={"text-[10px] font-black text-gray-400 block mb-1"}>Giá Vốn</label>
              <input type="number" value={costPrice} onChange={(e) => setCostPrice(e.target.value)} className={"w-full bg-[#0a0a0a] border border-[#444] rounded-xl px-3 py-2.5 text-white font-black outline-none"} />
            </div>
            <div>
              <label className={"text-[10px] font-black text-gray-400 block mb-1"}>Giá Bán</label>
              <input type="number" value={price} onChange={(e) => setPrice(e.target.value)} className={"w-full bg-[#0a0a0a] border border-[#444] rounded-xl px-3 py-2.5 text-[#10b981] font-black outline-none"} />
            </div>
            <div>
              <label className={"text-[10px] font-black text-gray-400 block mb-1"}>Tồn kho</label>
              <input type="number" value={quantity} onChange={(e) => setQuantity(e.target.value)} className={"w-full bg-[#0a0a0a] border border-[#444] rounded-xl px-3 py-2.5 text-[#d4af37] font-black outline-none"} />
            </div>
          </div>
        </div>

        <div className={"flex gap-3 mt-5 shrink-0 pt-4 border-t border-[#333]"}>
          <button onClick={onClose} className={"flex-1 py-3 bg-[#222] text-gray-300 rounded-2xl font-black text-sm active:scale-95 transition-all"}>HỦY</button>
          <button onClick={handleAdd} disabled={disableSave} className={"flex-1 py-3 bg-[#2563eb] text-white font-black rounded-2xl text-sm disabled:opacity-50 active:scale-95 transition-all"}>
              TẠO PHÂN LOẠI
          </button>
        </div>

      </div>
    </div>
  );
}

function BulkEditPriceModal({ data, pushData, onClose }) {
  const [selectedCat, setSelectedCat] = React.useState(typeof CATEGORIES !== 'undefined' ? CATEGORIES[0] : 'PHỤ KIỆN');
  const [selectedSubCat, setSelectedSubCat] = React.useState('');
  const [items, setItems] = React.useState([]);
  const [isSaving, setIsSaving] = React.useState(false);

  React.useEffect(() => {
      if (!selectedSubCat) { setItems([]); return; }
      const prods = (data.Products || []).filter(p => p.category === selectedCat && p.sub_category === selectedSubCat);
      setItems(prods.map(p => ({ ...p, _costPrice: p.costPrice || 0, _price: p.price || 0, _conversionRate: p.conversionRate || 1 })));
  }, [selectedCat, selectedSubCat, data.Products]);

  const handleSave = async () => {
      if (items.length === 0) return alert('Không có sản phẩm nào để lưu!');
      setIsSaving(true);
      try {
          const payloadProducts = items.map(i => ({
              id: i.id,
              costPrice: Number(i._costPrice) || 0,
              price: Number(i._price) || 0,
              conversionRate: Number(i._conversionRate) || 1
          }));
          await pushData({ Products: payloadProducts });
          onClose();
          if (typeof triggerToast !== 'undefined') triggerToast('Cập nhật giá hàng loạt thành công!', 'fa-check', 'success');
      } catch (e) {
          alert('Lỗi: ' + e.message);
      }
      setIsSaving(false);
  };

  const categories = typeof CATEGORIES !== 'undefined' ? CATEGORIES : ['LAYOUT', 'BỂ KÍNH', 'PHỤ KIỆN', 'DANH MỤC SẢN XUẤT'];
  const subCats = (typeof SUB_CATEGORIES !== 'undefined' && SUB_CATEGORIES[selectedCat]) ? SUB_CATEGORIES[selectedCat] : [];

  return (
    <div className={"fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4 backdrop-blur-sm animate-fade-in"}>
      <div className={"bg-[#141414] border border-[#333] w-full max-w-4xl rounded-[24px] p-6 shadow-2xl flex flex-col max-h-[90vh]"}>
        
        <div className={"flex justify-between items-center mb-4 shrink-0 border-b border-[#222] pb-3"}>
          <div className={"font-black text-[16px] text-[#9333ea] uppercase tracking-wider"}><i className={"fas fa-edit mr-2"}></i> CHỈNH GIÁ HÀNG LOẠT</div>

        <div className="flex gap-4 mb-4 shrink-0">

                    <option value="">-- CHỌN --</option>

                </select>
            </div>
        </div>

        <div className="flex-1 overflow-y-auto custom-scrollbar border border-[#222] rounded-xl bg-[#0a0a0a]">

                        <th className="p-3 text-[10px] font-black text-emerald-500 uppercase tracking-wider w-[120px]">Giá Nhập (Cost)</th>
                        <th className="p-3 text-[10px] font-black text-[#d4af37] uppercase tracking-wider w-[120px]">Giá Bán (Price)</th>

                    </tr>
                </thead>
                <tbody>
                    {items.length === 0 ? (
                        <tr><td colSpan="4" className="p-8 text-center text-gray-500 text-[11px] font-bold">Hãy chọn Danh Mục Con để hiển thị sản phẩm</td></tr>
                    ) : (
                        items.map((i, idx) => (
                            <tr key={i.id} className={`border-b border-[#222] hover:bg-[#141414] transition-colors ${idx % 2 === 0 ? 'bg-[#0c0c0c]' : ''}`}>
                                <td className="p-3">
                                    <div className="font-bold text-[12px] text-white truncate max-w-[250px]" title={i.name}>{i.name}</div>
                                    <div className="text-[10px] text-gray-500 font-mono mt-0.5">{i.sku || 'N/A'}</div>
                                </td>
                                <td className="p-3">
                                    <input type="number" value={i._costPrice} onChange={e => { const newArr = [...items]; newArr[idx]._costPrice = e.target.value; setItems(newArr); }} className="w-full bg-[#141414] border border-[#333] rounded px-2 py-1 text-emerald-400 font-bold outline-none focus:border-emerald-500 text-[12px]" />
                                </td>
                                <td className="p-3">
                                    <input type="number" value={i._price} onChange={e => { const newArr = [...items]; newArr[idx]._price = e.target.value; setItems(newArr); }} className="w-full bg-[#141414] border border-[#333] rounded px-2 py-1 text-[#d4af37] font-bold outline-none focus:border-[#d4af37] text-[12px]" />
                                </td>
                                <td className="p-3">
                                    <input type="number" value={i._conversionRate} onChange={e => { const newArr = [...items]; newArr[idx]._conversionRate = e.target.value; setItems(newArr); }} className="w-full bg-[#141414] border border-[#333] rounded px-2 py-1 text-[#3b82f6] font-bold outline-none focus:border-[#3b82f6] text-[12px] text-center" />
                                </td>
                            </tr>
                        ))
                    )}
                </tbody>
            </table>
        </div>

        <div className={"mt-4 shrink-0 flex gap-3"}>
            <button onClick={onClose} disabled={isSaving} className="flex-1 py-3 bg-[#222] hover:bg-[#333] text-gray-300 font-black rounded-xl text-[12px] uppercase active:scale-95 transition-all">HUỶ BỎ</button>
            <button onClick={handleSave} disabled={isSaving || items.length===0} className="flex-[2] py-3 bg-[#9333ea] hover:bg-[#7e22ce] disabled:opacity-50 text-white font-black rounded-xl text-[12px] uppercase active:scale-95 transition-all shadow-[0_0_15px_rgba(147,51,234,0.3)]">
                {isSaving ? <><i className="fas fa-spinner fa-spin mr-2"></i> ĐANG LƯU...</> : <><i className="fas fa-save mr-2"></i> LƯU THAY ĐỔI</>}
            </button>
        </div>
      </div>
    </div>
  );
}

function InventoryListView({ data, pushData, isAdmin, triggerToast }) {
  const [catFilter, setCatFilter] = React.useState(typeof CATEGORIES !== 'undefined' ? CATEGORIES[0] : 'PHỤ KIỆN');
  const [subCatFilter, setSubCatFilter] = React.useState(null); 
  const [search, setSearch] = React.useState(''); 
  const [editProd, setEditProd] = React.useState(null); 
  const [addVarGroup, setAddVarGroup] = React.useState(null);
  const [showStockRules, setShowStockRules] = React.useState(false);
  const [showBulkEditPrice, setShowBulkEditPrice] = React.useState(false);
  const formatMoney = (val) => Number(val || 0).toLocaleString('vi-VN');
  const currentRole = localStorage.getItem('rf_role');
  const canViewCost = currentRole === 'QUẢN LÝ KHO' || currentRole === 'TỐI CAO' || currentRole === 'KẾ TOÁN';

  const uniqueProducts = React.useMemo(() => {
      const map = new Map();
      (data.Products || []).forEach(p => {
          const key = String(p.name || '').toLowerCase().trim();
          if (!key) return;
          if (map.has(key)) {
              const existing = map.get(key);
              existing.quantity = Number(existing.quantity || 0) + Number(p.quantity || 0);
              if (p.sku) existing.sku = p.sku;
              if (Number(p.costPrice) > 0) existing.costPrice = p.costPrice;
              if (Number(p.price) > 0) existing.price = p.price;
              if (p.minStock) existing.minStock = p.minStock;
              if (p.maxStock) existing.maxStock = p.maxStock;
              existing._allIds = existing._allIds || [existing.id];
              if (!existing._allIds.includes(p.id)) existing._allIds.push(p.id);
              map.set(key, existing);
          } else {
              map.set(key, { ...p, _allIds: [p.id] });
          }
      });
      return Array.from(map.values());
  }, [data.Products]);

  const handleExportExcel = () => {
      const columns = [
          { key: 'sku', label: 'Mã SKU' },
          { key: 'name', label: 'Tên Sản Phẩm' },
          { key: 'category', label: 'Danh Mục' },
          { key: 'sub_category', label: 'Phân Loại' },
          { key: 'costPrice', label: 'Giá Vốn' },
          { key: 'price', label: 'Giá Bán' },
          { key: 'quantity', label: 'Số Lượng Tồn' },
          { key: 'unit', label: 'Đơn Vị' },
          { key: 'minStock', label: 'Tồn Tối Thiểu' },
          { key: 'maxStock', label: 'Tồn Tối Đa' }
      ];
      exportToExcel(uniqueProducts, columns, `Danh_Sach_Ton_Kho_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  const totalInventoryValue = uniqueProducts.reduce((sum, p) => sum + (Math.max(0, Number(p.quantity || 0)) * Number(p.costPrice || 0)), 0);
  const catTotals = { 'LAYOUT': 0, 'BỂ KÍNH': 0, 'PHỤ KIỆN': 0, 'DANH MỤC SẢN XUẤT': 0 };
  uniqueProducts.forEach(p => { if (catTotals[p.category] !== undefined) catTotals[p.category] += (Math.max(0, Number(p.quantity)) * Number(p.costPrice)); });

  const alerts = React.useMemo(() => {
      let outOfStock = [];
      let lowStock = [];
      uniqueProducts.forEach(p => {
          const qty = Number(p.quantity || 0);
          const min = Number(p.minStock || 0);
          if (qty <= 0) {
              outOfStock.push(p);
          } else if (min > 0 && qty <= min) {
              lowStock.push(p);
          }
      });
      
      outOfStock.sort((a,b) => String(a.name).localeCompare(String(b.name)));
      lowStock.sort((a,b) => (Number(a.quantity) - Number(a.minStock)) - (Number(b.quantity) - Number(b.minStock)));
      return { outOfStock, lowStock };
  }, [uniqueProducts]);

  const isSearching = search.trim().length > 0;
  const productsInCat = uniqueProducts.filter(p => p.category === catFilter);
  const subCatCounts = {};
  productsInCat.forEach(p => { const sc = (p.sub_category || '').toUpperCase() || 'KHÁC'; subCatCounts[sc] = (subCatCounts[sc] || 0) + 1; });

  const predefinedFolders = typeof SUB_CATEGORIES !== 'undefined' ? (SUB_CATEGORIES[catFilter] || []) : [];
  const activeFolders = Array.from(new Set([...predefinedFolders, ...Object.keys(subCatCounts)])).filter(f => (subCatCounts[f] || 0) > 0 || predefinedFolders.includes(f));

  const outOfStockInSubCat = (catName) => uniqueProducts.filter(p => p.category === catFilter && ((p.sub_category || '').toUpperCase() || 'KHÁC') === catName && Number(p.quantity) <= 0).length;

  let displayProducts = []; 
  if (isSearching) { 
      displayProducts = uniqueProducts.filter(p => (p.name && String(p.name).toLowerCase().includes(search.toLowerCase())) || (p.sku && String(p.sku).toLowerCase().includes(search.toLowerCase())));
  } else if (subCatFilter) { 
      displayProducts = productsInCat.filter(p => ((p.sub_category || '').toUpperCase() || 'KHÁC') === subCatFilter);
  }
  
  const formatImageUrl = (url) => {
      if (!url || typeof url !== 'string') return '';
      const str = url.trim();
      if (str.includes('drive.google.com/file/d/')) {
          const match = str.match(/\/d\/([^/]+)/);
          return match ? `https:\/\/drive.google.com/uc?export=view&id=${match[1]}` : str;
      }
      if (str.includes('drive.google.com/open?id=')) {
          const match = str.match(/id=([^&]+)/);
          return match ? `https:\/\/drive.google.com/uc?export=view&id=${match[1]}` : str;
      }
      return str;
  };

  const groupedProducts = React.useMemo(() => { 
      const groups = {}; 
      displayProducts.forEach(p => { 
          let baseName = p.name || 'Chưa đặt tên'; 
          let variant = 'Mặc định'; 
          if (p.name && p.name.includes(' - ')) { 
              const parts = p.name.split(' - '); 
              baseName = parts[0].trim(); 
              variant = parts.slice(1).join(' - ').trim(); 
          } 
          let imgUrl = formatImageUrl(p.image);
          if (!groups[baseName]) groups[baseName] = { baseName, image: imgUrl, items: [] }; 
          if (imgUrl && !groups[baseName].image) groups[baseName].image = imgUrl; 
          
          let pCopy = { ...p, variantLabel: variant };
          pCopy.image = imgUrl;
          if (pCopy.realImage) pCopy.realImage = formatImageUrl(pCopy.realImage);
          
          groups[baseName].items.push(pCopy); 
      }); 
      return Object.values(groups); 
  }, [displayProducts]);

  return (
      <div className={"space-y-4 pb-12 w-full"}>
          
          {currentRole !== 'CTV' && (
              <>
                  {/* KHUNG ĐÓNG MỞ: QUY CHUẨN KHO HÀNG */}
                  <div className="bg-[#141414] border border-zinc-800/80 rounded-2xl shadow-sm overflow-hidden">
                      <div 
                          onClick={() => setShowStockRules(!showStockRules)} 
                          className="flex justify-between items-center p-4 bg-gradient-to-r from-[#081a30]/50 to-transparent cursor-pointer hover:bg-zinc-800/20 transition-colors"
                      >
                          <div className="flex items-center gap-2">
                              <i className="fas fa-clipboard-check text-[#3b82f6] text-[13px]"></i>
                              <span className="font-black text-[11px] text-[#3b82f6] uppercase tracking-widest">Quy Chuẩn Kho Hàng (Click để xem)</span>
                          </div>
                          <div className={`w-6 h-6 rounded-full bg-[#0a0a0a] border border-[#333] flex items-center justify-center text-[10px] text-gray-400 transition-transform duration-300 ${showStockRules ? 'rotate-180 text-white' : ''}`}>
                              <i className="fas fa-chevron-down"></i>
                          </div>
                      </div>
                      {showStockRules && (
                          <div className="p-4 pt-1 border-t border-[#222]/80 bg-[#0c0c0c] animate-fade-in">
                              <ul className="text-[11px] text-gray-300 font-medium space-y-2.5 pl-1">
                                  <li className="flex items-start gap-2 leading-snug">
                                      <i className="fas fa-check-circle text-[10px] text-[#3b82f6]/70 mt-0.5 shrink-0"></i>
                                      <span>Mã SKU hàng hoá Bể Kính. VD: <b className="text-[#60a5fa] bg-[#3b82f6]/10 px-1.5 py-0.5 rounded ml-1 border border-[#3b82f6]/20">BE202020</b>, <b className="text-[#60a5fa] bg-[#3b82f6]/10 px-1.5 py-0.5 rounded border border-[#3b82f6]/20">BE202020ND</b>, <b className="text-[#60a5fa] bg-[#3b82f6]/10 px-1.5 py-0.5 rounded border border-[#3b82f6]/20">TERA202025</b></span>
                                  </li>
                                  <li className="flex items-start gap-2 leading-snug">
                                      <i className="fas fa-check-circle text-[10px] text-[#3b82f6]/70 mt-0.5 shrink-0"></i>
                                      <span>Mã SKU hàng hoá Layout: VD: <b className="text-[#60a5fa] bg-[#3b82f6]/10 px-1.5 py-0.5 rounded ml-1 border border-[#3b82f6]/20">RUN-003-202020</b>, <b className="text-[#60a5fa] bg-[#3b82f6]/10 px-1.5 py-0.5 rounded border border-[#3b82f6]/20">CV-604040</b></span>
                                  </li>
                                  <li className="flex items-start gap-2 leading-snug">
                                      <i className="fas fa-check-circle text-[10px] text-[#3b82f6]/70 mt-0.5 shrink-0"></i>
                                      <span>Mã SKU của nguyên liệu: VD: <b className="text-[#60a5fa] bg-[#3b82f6]/10 px-1.5 py-0.5 rounded ml-1 border border-[#3b82f6]/20">NLSX-BK-A300</b> <span className="text-gray-500 text-[9px]">(Sillicon A300 bộ phận bể kính)</span></span>
                                  </li>
                                  <li className="flex items-start gap-2 leading-snug">
                                      <i className="fas fa-check-circle text-[10px] text-[#3b82f6]/70 mt-0.5 shrink-0"></i>
                                      <span>Mã SKU vật tư: VD: <b className="text-[#60a5fa] bg-[#3b82f6]/10 px-1.5 py-0.5 rounded ml-1 border border-[#3b82f6]/20">VTSX-GANGTAY</b></span>
                                  </li>
                                  <li className="flex items-start gap-2 leading-snug">
                                      <i className="fas fa-check-circle text-[10px] text-[#3b82f6]/70 mt-0.5 shrink-0"></i>
                                      <span>Kiểm Kho Cuối Kỳ: Mặc định ngày <b className="text-[#60a5fa]">01</b> hàng tháng phải chuẩn <span className="text-[#d4af37] bg-[#d4af37]/10 px-1.5 py-0.5 rounded border border-[#d4af37]/30 text-[9px] ml-1 uppercase">(Quản Lý Kho)</span></span>
                                  </li>
                                  <li className="flex items-start gap-2 leading-snug">
                                      <i className="fas fa-check-circle text-[10px] text-[#3b82f6]/70 mt-0.5 shrink-0"></i>
                                      <span>Kiểm Kho Định Kỳ: Mặc định ngày <b className="text-[#60a5fa]">15</b> hàng tháng <span className="text-[#10b981] bg-[#10b981]/10 px-1.5 py-0.5 rounded border border-[#10b981]/30 text-[9px] ml-1 uppercase">(Kiểm Kho)</span></span>
                                  </li>
                              </ul>
                          </div>
                      )}
                  </div>
              </>
          )}

          {canViewCost && currentRole !== 'CTV' && (
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 animate-fade-in">
                  <div className="bg-gradient-to-br from-[#1a1c29] to-[#0a0a0a] border border-[#3b82f6]/20 p-3 rounded-2xl shadow-sm">
                      <div className="text-[10px] text-gray-500 uppercase font-black mb-1">Giá Trị Bể Kính</div>
                      <div className="text-[14px] font-black text-[#3b82f6]">{formatMoney(catTotals['BỂ KÍNH'])}đ</div>
                  </div>
                  <div className="bg-gradient-to-br from-[#1a1c29] to-[#0a0a0a] border border-amber-500/20 p-3 rounded-2xl shadow-sm">
                      <div className="text-[10px] text-gray-500 uppercase font-black mb-1">Giá Trị Layout</div>
                      <div className="text-[14px] font-black text-amber-500">{formatMoney(catTotals['LAYOUT'])}đ</div>
                  </div>
                  <div className="bg-gradient-to-br from-[#1a1c29] to-[#0a0a0a] border border-emerald-500/20 p-3 rounded-2xl shadow-sm">
                      <div className="text-[10px] text-gray-500 uppercase font-black mb-1">Giá Trị Sản Xuất</div>
                      <div className="text-[14px] font-black text-emerald-500">{formatMoney(catTotals['DANH MỤC SẢN XUẤT'])}đ</div>
                  </div>
                  <div className="bg-gradient-to-br from-[#1a1c29] to-[#0a0a0a] border border-[#d4af37]/30 p-3 rounded-2xl shadow-sm">
                      <div className="text-[10px] text-gray-500 uppercase font-black mb-1">Tổng Tồn Kho</div>
                      <div className="text-[15px] font-black text-[#d4af37] drop-shadow-[0_0_5px_rgba(212,175,55,0.5)]">{formatMoney(totalInventoryValue)}đ</div>
                  </div>
              </div>
          )}


          <div className={"flex justify-between items-center bg-[#09090b]/80 backdrop-blur-xl p-3 rounded-2xl border border-white/5 shadow-[0_8px_32px_rgba(0,0,0,0.3)] relative overflow-hidden"}>
              <div className="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
              
              <div className={"flex-1 bg-zinc-950/50 rounded-xl flex items-center overflow-hidden border border-white/10 focus-within:border-[#d4af37] focus-within:shadow-[0_0_15px_rgba(212,175,55,0.2)] transition-all"}>
                  <i className={"fas fa-search text-[#d4af37]/70 pl-4 text-sm"}></i>
                  <input placeholder="Tìm kiếm tên, mã SKU..." value={search} onChange={(e) => setSearch(e.target.value)} className={"w-full px-4 py-3 text-[13px] font-bold outline-none bg-transparent text-white placeholder-gray-500 tracking-wide"} />
                  {search && <button onClick={() => setSearch('')} className={"pr-4 text-gray-400 hover:text-rose-400 transition-colors"}><i className={"fas fa-times-circle text-lg"}></i></button>}
              </div>
              <div className="flex gap-2.5 ml-4">
                  {isAdmin && currentRole !== 'CTV' && (
                      <button onClick={() => setShowBulkEditPrice(true)} className="bg-gradient-to-br from-purple-600 to-indigo-700 hover:from-purple-500 hover:to-indigo-600 text-white text-[11px] font-black px-4 py-3 rounded-xl shadow-[0_0_20px_rgba(147,51,234,0.3)] hover:shadow-[0_0_25px_rgba(147,51,234,0.5)] active:scale-95 transition-all uppercase tracking-wider flex items-center gap-2 border border-white/10">
                          <i className="fas fa-edit"></i> SỬA GIÁ
                      </button>
                  )}
                  {(localStorage.getItem('rf_boss') === 'true') && currentRole !== 'CTV' && (
                      <button onClick={() => setEditProd({})} className={"bg-gradient-to-br from-[#d4af37] to-[#b8972e] hover:from-[#f5c73c] hover:to-[#d4af37] text-[#0a0a0a] text-[11px] font-black px-5 py-3 rounded-xl shadow-[0_0_20px_rgba(212,175,55,0.3)] hover:shadow-[0_0_25px_rgba(212,175,55,0.5)] active:scale-95 transition-all flex items-center gap-2 border border-white/20 uppercase tracking-wider"}>
                          <i className={"fas fa-plus"}></i> TẠO MỚI
                      </button>

          </div>

          <div className={"flex overflow-x-auto gap-2.5 pb-2 pt-1 custom-scrollbar"}>
              {(typeof CATEGORIES !== 'undefined' ? CATEGORIES : ['LAYOUT', 'BỂ KÍNH', 'PHỤ KIỆN', 'DANH MỤC SẢN XUẤT']).map(c => (

                      className={`flex-shrink-0 px-5 py-3 rounded-xl text-[11px] font-black uppercase transition-all shadow-sm border ${catFilter===c && !isSearching ? 'bg-gradient-to-r from-zinc-800/90 to-zinc-900/90 border-white/20 text-[#d4af37] shadow-[0_4px_15px_rgba(212,175,55,0.15)] drop-shadow-[0_0_2px_rgba(212,175,55,0.8)]' : 'bg-[#09090b]/50 backdrop-blur-md text-gray-500 border-white/5 hover:border-white/10 hover:text-gray-300'}`}>
                      {c === 'DANH MỤC SẢN XUẤT' ? 'SẢN XUẤT' : c}

                  {groupedProducts.length === 0 ? <div className={"text-center py-10 text-gray-600 font-bold text-xs bg-[#141414] rounded-2xl border-2 border-dashed border-[#2a2a2a]"}>Không tìm thấy hàng hoá!</div> : groupedProducts.map((group) => ( <VariantGroupCard key={group.baseName} group={group} setEditProd={setEditProd} setAddVarGroup={setAddVarGroup} pushData={pushData} /> ))}
              </div>
